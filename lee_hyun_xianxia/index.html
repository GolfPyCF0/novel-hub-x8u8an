      "title": "บทที่ 5",
      "content": "เมื่อเห็นว่าเด็กส่วนใหญ่ไม่ใคร่จะสนใจเคล็ดเอกปราณบรรพกาลนัก หวังจิ้นจึงเอ่ยโน้มน้าวต่อด้วยน้ำเสียงจริงจัง\n\n“เคล็ดเอกปราณบรรพกาลมีข้อดีอยู่มากมาย ปราณแท้ของมันไหลเวียนได้ราบรื่น และวิธีการโคจรพลังก็เรียบง่าย เมื่อพวกเจ้าฝึกฝนจนคุ้นชินกับวิชานี้ดีพอแล้ว ก็ไม่จำเป็นต้องนั่งขัดสมาธิเสมอไป ไม่ว่าจะยืน เดิน หรือกระทั่งนอนราบ ก็สามารถดูดซับปราณวิญญาณได้ทั้งสิ้น”\n\n‘นอนราบงั้นเหรอ...? ฟังดูเข้าท่าแฮะ’\n\n“เช่นนั้นพวกเราก็สามารถบำเพ็ญเพียรได้แม้ในยามหลับหรือขอรับ?”\n\nมีเสียงหนึ่งเอ่ยถามขึ้น\n\n“อืม... หากว่ากันตามหลักการแล้ว ก็คงไม่มีเหตุผลใดที่จะทำไม่ได้ เอาเป็นว่าสิ่งสำคัญก็คือ เคล็ดเอกปราณบรรพกาลไม่มีข้อเสียอื่นใดเลยนอกเสียจากความเร็วในการฝึกฝน และตามจริงแล้ว แม้แต่เรื่องนั้นก็หาใช่ปัญหาใหญ่โตอันใดไม่”\n\nหวังจิ้นยกตำราขึ้นแล้วกล่าวเสริม\n\n“หากพวกเจ้าทำงานเป็นผู้เพาะปลูกพืชวิญญาณจนสร้างผลงานได้ดีและได้เลื่อนขั้นเป็นศิษย์สายใน ทางสำนักย่อมประทานเคล็ดวิชาที่เหนือชั้นกว่าให้ เมื่อถึงเวลานั้น พวกเจ้าก็ไม่จำเป็นต้องสลายปราณแท้บรรพกาลทิ้ง ปราณแท้บรรพกาลคือพลังวิญญาณที่มิได้เอนเอียงไปทางธาตุใดโดยเฉพาะ ดังนั้นส่วนใหญ่จึงสามารถแปรเปลี่ยนเป็นพลังวิญญาณของเคล็ดวิชาใหม่ได้ทันที อย่างไรเสีย ทั้งเคล็ดพฤกษาเขียวหล่อเลี้ยงพลังชีวิต เคล็ดเพลิงชาด เคล็ดปฐพีราชัน เคล็ดคมโลหะ และเคล็ดวารีเร้นลับ ต่างก็เป็นเพียงเคล็ดวิชาระดับ 1 เท่านั้น หากพวกเจ้าได้เป็นศิษย์สายใน ย่อมต้องได้ร่ำเรียนเคล็ดวิชาที่ดีกว่านี้อยู่ดี เช่นนั้นการเริ่มต้นฝึกเคล็ดเอกปราณบรรพกาลแล้วไปสร้างชื่อในด้านพืชวิญญาณ ก็นับเป็นทางเลือกที่ดีมิใช่หรือ?”\n\nหวังจิ้นผายมือผ่านกองตำราทั้งหกตั้งบนโต๊ะ\n\n“คำอธิบายจบลงเพียงเท่านี้ พวกเจ้าแต่ละคนจงเดินมาหยิบตำราวิชาที่ตนเองปรารถนาไปคนละหนึ่งเล่ม”\n\nบางทีคำชักชวนอันน่าฟังของผู้ดูแลหวังจิ้นอาจได้ผล เพราะเด็กๆ เกินกว่าครึ่งพากันเลือกเคล็ดเอกปราณบรรพกาล\n\n‘ฝึกเคล็ดเอกปราณบรรพกาล สร้างผลงานในฐานะผู้เพาะปลูกพืชวิญญาณ แล้วได้เป็นศิษย์สายในงั้นเหรอ? ถ้าการเป็นศิษย์สายในมันง่ายดายขนาดนั้น ทำไมถึงมีคนทำสำเร็จแค่หยิบมือเดียวเล่า...? แต่ช่างเถอะ ยังไงเสียข้าก็ไม่เคยคิดอยากเป็นศิษย์สายในตั้งแต่แรกอยู่แล้ว’\n\n‘เคล็ดเอกปราณบรรพกาลนี่แหละคือตัวเลือกที่ดีที่สุดสำหรับข้า หากภายหน้าข้าต้องการทำแปลงสมุนไพรวิญญาณและเพาะปลูกพืชวิญญาณด้วยตัวคนเดียว ข้าย่อมต้องใช้วิชาได้หลายธาตุ’\n\nหลังครุ่นคิดอยู่ครู่หนึ่ง อีฮยอนจึงหยิบเคล็ดเอกปราณบรรพกาลมาเช่นกัน\n\nส่วนเด็กบางคนที่ช่างระแวงหรือคิดทบทวนถี่ถ้วนกว่าหน่อยต่างก็เลือกหยิบหนึ่งในห้าวิชาที่เหลือแทน\n\nเด็กแต่ละคนรับตำรากลับไปนั่งประจำที่และเปิดอ่านเนื้อหาคร่าวๆ ครู่หนึ่ง ก่อนจะมีเด็กคนหนึ่งเอ่ยถามขึ้น\n\n“ท่านผู้ดูแล กายาบรรพกาลที่เขียนไว้ในส่วนท้ายของเคล็ดเอกปราณบรรพกาลนี่คืออะไรหรือขอรับ?”\n\n‘กายาบรรพกาล?’\n\nอีฮยอนพลิกเปิดไปยังส่วนท้ายของเล่มดูบ้าง และพบเข้ากับวิธีการฝึกฝนที่บรรยายเอาไว้ในนั้น\n\n“อย่าได้ไปคาดหวังกับมันนักเลย มันไร้ประโยชน์”\n\n“เหตุใดจึงเป็นเช่นนั้นเล่าขอรับ? ดูจากเนื้อหาแล้วมันช่วยหลอมกลั่นทั่วทั้งร่าง มิใช่เป็นวิชาหลอมกายหรอกหรือ? ข้าเคยได้ยินมาว่ายิ่งผู้บำเพ็ญเพียรพัฒนาแก่นแท้ ลมปราณ และจิตวิญญาณให้สมดุลเท่าไร ก็จะยิ่งแข็งแกร่งขึ้นเท่านั้น”\n\n“กายาบรรพกาลหาใช่วิชาหลอมกายธรรมดาทั่วไป วิชาหลอมกายส่วนใหญ่มักต้องพึ่งพาสิ่งของภายนอกช่วยหนุน ไม่ว่าจะต้องลงไปแช่ในอ่างยาพิเศษที่ปรุงจากโลหิตแก่นแท้ของอสูรเพื่อขัดเกลาผิวหนัง หรือจำเป็นต้องใช้ทรัพยากรวิญญาณและเม็ดยาโอสถในการหลอมกลั่นกระดูก กล้ามเนื้อ รวมถึงอวัยวะภายใน”\n\nเหล่าเด็กๆ พากันตั้งใจฟังอย่างเงียบเชียบ\n\n“บางวิชาถึงขั้นต้องเข้าไปหลอมกายภายในค่ายกลพิเศษ ส่วนบางวิชาก็เรียกร้องให้เจ้าต้องทนทานต่อความร้อนระอุในสถานที่ที่มีเพลิงปฐพีพวยพุ่งขึ้นมา”\n\n“เช่นนั้นกายาบรรพกาลแตกต่างออกไปอย่างไรหรือขอรับ?”\n\n“ประการแรกเลย กายาบรรพกาลมิได้พึ่งพาทรัพยากรพิเศษจากภายนอกใดๆ ในการฝึกฝน”\n\nเสียงฮือฮาเบาๆ ดังขึ้นอีกครั้งหลังได้ยินคำตอบของหวังจิ้น สำหรับเหล่าว่าที่ศิษย์สายนอกที่ขัดสน วิชาที่ไม่จำเป็นต้องใช้ทรัพยากรราคาแพงย่อมฟังดูราวกับเป็นตัวเลือกที่ดีที่สุดในโลก\n\n“ฟังดูดีทีเดียวใช่หรือไม่ แต่หากในโลกนี้มีหนทางที่จะแข็งแกร่งขึ้นได้โดยไม่ต้องเสียสิ่งใดจริงๆ เหตุใดเหล่าผู้ฝึกหลอมกายทั่วหล้าจึงต้องยอมเอาชีวิตเข้าแลกเพื่อแย่งชิงทรัพยากรกันเล่า?”\n\nหวังจิ้นใช้นิ้วเคาะลงบนปกตำราเคล็ดเอกปราณบรรพกาล\n\n“วิธีสร้างกายาบรรพกาลนั้นเรียบง่าย แทนที่จะกักเก็บพลังวิญญาณไว้เพียงบริเวณตันเถียน พวกเจ้าต้องแปรเปลี่ยนร่างกายทั้งหมดให้กลายเป็นตันเถียน”\n\nหวังเส้าเอียงคอสงสัย\n\n“การทำให้ทั่วทั้งร่างเป็นตันเถียนมิใช่เรื่องดีหรอกหรือขอรับ? ฟังดูเหมือนจะสามารถกักเก็บพลังวิญญาณได้มากกว่าเดิมตั้งมากมาย”\n\n“ถูกต้อง หากมองเพียงข้อดี ก็เป็นเช่นนั้นจริง ด้วยเหตุที่พลังวิญญาณจะไหลเวียนหล่อเลี้ยงไปทั่วทุกส่วนของร่างกายตลอดเวลา ทั้งผิวหนัง กล้ามเนื้อ กระดูก และอวัยวะภายในย่อมได้รับการอาบชโลมอย่างต่อเนื่อง หากทำสำเร็จขึ้นมาจริงๆ ร่างเนื้อของเจ้าก็จะแข็งแกร่งขึ้นโดยไม่จำเป็นต้องฝึกวิชาหลอมกายแยกต่างหาก ทั้งยังสามารถบรรจุพลังวิญญาณได้มหาศาลกว่าผู้บำเพ็ญเพียรคนอื่นในระดับเดียวกันอีกด้วย แท้จริงแล้ว การเสริมความแข็งแกร่งของร่างกายเป็นเพียงผลพลอยได้เท่านั้น แก่นแท้ของมันค่อนไปทางวิธีฝึกฝนพลังวิญญาณอันแปลกประหลาดเสียมากกว่า”\n\nเขากวาดตามองเด็กๆ อยู่ครู่หนึ่ง ก่อนจะชี้ไปยังเด็กหนุ่มร่างสูงที่นั่งอยู่แถวหน้า\n\n“เจ้าน่ะ คิดว่าตันเถียนคือสิ่งใด?”\n\nเด็กหนุ่มดูตื่นตระหนกเล็กน้อยเมื่อถูกถามอย่างกะทันหัน\n\n“อวัยวะบริเวณใต้สะดือ... ที่ใช้กักเก็บพลังวิญญาณขอรับ?”\n\n“ผิด”\n\nหวังจิ้นเอ่ยตอบอย่างเด็ดขาด\n\n“ผู้ใดที่เคยสังหารคนและผ่าท้องออกดูย่อมรู้ดี ว่าภายในร่างกายมนุษย์หาได้มีอวัยวะแยกต่างหากที่เรียกว่าตันเถียนอยู่จริงไม่”\n\nเด็กหลายคนพลันหน้าซีดเผือด\n\n“เส้นลมปราณมีอยู่จริงตามกายภาพ ทว่าตันเถียนเป็นเพียงพื้นที่ที่เคล็ดวิชากำหนดขึ้นเพื่อใช้กักเก็บพลังวิญญาณเท่านั้น พวกเจ้าปฏิบัติตามแนวทางของเคล็ดวิชา กำหนดขอบเขตบริเวณใต้สะดือแล้วรวบรวมพลังวิญญาณที่กลั่นกรองได้มาไว้ตรงนั้นซ้ำแล้วซ้ำเล่า จนค่อยๆ ก่อรูปขึ้นเป็นตันเถียนขึ้นมา”\n\nหวังจิ้นชี้ไปยังบริเวณท้องน้อยของตนเอง\n\n“เหตุผลที่พวกเราเลือกใช้จุดกึ่งกลางลำตัวก็แสนเรียบง่าย เพราะมันสะดวกต่อการส่งถ่ายพลังวิญญาณไปยังแขนขา ศีรษะ หรืออวัยวะภายในส่วนใดก็ได้”\n\n“แต่การสะสมพลังวิญญาณไปทั่วทั้งร่างกายก็ใช่ว่าจะเป็นไปไม่ได้เสียทีเดียวมิใช่หรือขอรับ?”\n\nเด็กหนุ่มเอ่ยถามอย่างระมัดระวัง\n\n“ข้าไม่เคยกล่าวว่ามันเป็นไปไม่ได้ ข้ากล่าวว่ามันไร้ประโยชน์ต่างหาก”\n\nหวังจิ้นชูนิ้วขึ้นมาหนึ่งนิ้ว\n\n“สิ่งที่ยากเย็นที่สุดบนเส้นทางบำเพ็ญเพียรหาใช่การดูดซับปราณวิญญาณ หากแต่เป็นการรวบรวมปราณวิญญาณที่ดูดซับเข้ามาไว้ ณ จุดเดียว บีบอัดมัน และแปรเปลี่ยนให้กลายเป็นพลังที่มีคุณภาพสูงยิ่งขึ้น ยามผู้บำเพ็ญเพียรขั้นกลั่นลมปราณเลื่อนสู่ขั้นสร้างรากฐาน พวกเขาจำต้องบีบอัดพลังวิญญาณที่ฟุ้งกระจายดุจกลุ่มไอให้ควบแน่นเป็นแก่นปราณแท้ในสภาพของเหลว ผู้ฝึกตนส่วนใหญ่เพียรพยายามมาตลอดทั้งชีวิตก็ยังคงล้มเหลว ทั้งที่ต้องควบแน่นพลังวิญญาณที่กักเก็บอยู่ในพื้นที่ขนาดเท่าตันเถียนเท่านั้น”\n\nคราวนี้เขากวาดนิ้วชี้ไปยังเหล่าว่าที่ศิษย์ทุกคน\n\n“แล้วพวกเจ้ากลับคิดจะเปลี่ยนทั่วทั้งร่างให้เป็นตันเถียนอย่างนั้นรึ? พวกเจ้าคิดว่าปริมาตรของตันเถียนกับร่างกายทั้งร่างแตกต่างกันกี่เท่าเล่า? แม้จะขึ้นอยู่กับแต่ละเคล็ดวิชา แต่โดยทั่วไปย่อมต่างกันราวหนึ่งร้อยเท่า ต่อให้เทียบกับเคล็ดวิชาที่สร้างตันเถียนขนาดใหญ่เป็นพิเศษ ก็ยังคงต่างกันถึงห้าสิบเท่าอยู่ดี”\n\nทั่วทั้งโถงตกอยู่ในความเงียบงัน\n\n“พวกเจ้าคิดว่าบรรพชนรุ่นก่อนไร้ซึ่งปัญญา ถึงได้เลือกบำเพ็ญเพียรอยู่ภายในขอบเขตอันคับแคบของตันเถียนโดยไร้เหตุผลหรือ? พวกท่านค้นพบวิธีการที่มีประสิทธิภาพสูงสุดในการสร้างการเปลี่ยนแปลงเชิงคุณภาพภายใต้ปราณวิญญาณและทรัพยากรอันจำกัดต่างหาก”\n\nหวังจิ้นพลิกตำราไปยังหน้าที่อธิบายเรื่องกายาบรรพกาล\n\n“วิธีการใช้ทั่วทั้งร่างเป็นตันเถียนเช่นนี้คงถูกคิดค้นขึ้นมานานแสนนานแล้ว บางทีอาจถือกำเนิดในยุคโบราณกาลที่ปราณวิญญาณฟ้าดินยังเข้มข้นกว่าในปัจจุบันลิบลับ หรือบางทีอาจเป็นเคล็ดวิชาที่ใช้ได้เฉพาะในสถานที่อย่างแดนเซียน ซึ่งปราณวิญญาณหลั่งไหลเข้าสู่ร่างเพียงแค่หายใจเท่านั้น”\n\nเด็กหนุ่มตาคมคนหนึ่งที่นั่งอยู่ทางด้านหลังยกมือขึ้น\n\n“หากเป็นตระกูลผู้บำเพ็ญเพียรมั่งคั่งหรือสำนักใหญ่โตก็น่าจะเป็นไปได้มิใช่หรือขอรับ? ถ้าทุ่มเทเม็ดยาโอสถนานาชนิดและศิลาวิญญาณลงไป ก็น่าจะเปลี่ยนทั่วทั้งร่างให้เป็นตันเถียนได้”\n\n“หากว่ากันตามหลักการ ก็อาจจะเป็นเช่นนั้น แต่จะมีขุมกำลังใดยอมทำเรื่องเช่นนั้นเล่า?”\n\nเขาหัวเราะแห้งๆ ออกมาคราหนึ่ง\n\n“สมมติว่าเจ้าเป็นเจ้าสำนัก เจ้าจะเลือกปั้นผู้บำเพ็ญเพียรขั้นสร้างรากฐานขึ้นมาร้อยคน หรือจะปั้นผู้บำเพ็ญเพียรขั้นสร้างรากฐานที่มีทั่วทั้งร่างเป็นตันเถียนเพียงคนเดียว?”\n\nเหล่าเด็กๆ ต่างเงียบกริบไร้เสียงตอบ\n\n“ขั้นสร้างรากฐานยังไม่ใช่จุดสิ้นสุด แล้วขั้นแก่นทองคำเล่า? ขั้นทารกวิญญาณเล่า? ใช้สามัญสำนึกคิดดูก็รู้แล้วว่าผลตอบแทนที่ได้ไม่คุ้มค่ากับทรัพยากรที่ทุ่มลงไปเลยแม้แต่น้อย เมื่อผู้ใดก้าวข้ามขอบเขตใหญ่ได้ พลังต่อสู้ย่อมพุ่งทะยานไปสู่อีกระดับชั้นอย่างสิ้นเชิง ต่อให้ตันเถียนของผู้บำเพ็ญเพียรขั้นสร้างรากฐานช่วงต้นจะเล็กเพียงใด พวกเจ้าคิดจริงๆ หรือว่าผู้บำเพ็ญเพียรขั้นกลั่นลมปราณ ระดับ 10 ที่เปลี่ยนทั่วทั้งร่างเป็นตันเถียนจะสามารถเอาชนะเขาได้...?”\n\nหวังจิ้นชะงักนิ่งครุ่นคิดไปชั่วครู่\n\n“อืม... พอมาลองคิดดูอีกที ก็อาจจะพอมีสิทธิ์ทำได้อยู่เหมือนกัน เอาเถอะ ต่อให้ทำได้ก็คงไม่ใช่เรื่องง่ายแน่ และยังมีปัญหาที่ใหญ่กว่านั้นอีก!”\n\nหวังจิ้นเอ่ยด้วยน้ำเสียงราวกับตอกฝาโลงปิดท้าย\n\n“เขาจะต้องกลืนกินโอสถสร้างรากฐานสักกี่เม็ดกันเล่ากว่าจะทะลวงสู่ขั้นสร้างรากฐานได้? ห้าสิบเม็ด? หนึ่งร้อยเม็ด? ไร้สาระสิ้นดี ผู้บำเพ็ญเพียรขั้นกลั่นลมปราณช่วงปลายทั่วไปต้องเอาชีวิตเข้าเสี่ยงทำภารกิจแทบตายเพื่อแลกกับโอสถสร้างรากฐานเพียงเม็ดเดียวด้วยซ้ำ”\n\nหวังจิ้นเดาะลิ้นเบาๆ\n\n“ต่อให้ผู้บำเพ็ญเพียรขั้นกลั่นลมปราณจะอายุยืนกว่าคนธรรมดา ทว่าอายุขัยก็อยู่ราวร้อยถึงร้อยห้าสิบปีเท่านั้น ในความเป็นจริง เพียงผ่านพ้นวัยแปดสิบปี พลังชีวิตก็เริ่มถดถอย และโอกาสตกตายระหว่างพยายามทะลวงขั้นสร้างรากฐานก็พุ่งสูงขึ้นอย่างฮวบฮาบ ผู้บำเพ็ญเพียรขั้นกลั่นลมปราณส่วนใหญ่ไม่อาจก้าวสู่ขั้นสร้างรากฐานได้ ก็เพราะภายในหนึ่งร้อยปีพวกเขายังไม่อาจควบแน่นพลังวิญญาณที่สั่งสมในตันเถียนเล็กๆ ใต้สะดือให้สมบูรณ์ได้ด้วยซ้ำ แล้วใครหน้าไหนจะไปควบแน่นพลังวิญญาณที่สั่งสมอยู่ทั่วทั้งร่างกายได้สำเร็จเล่า?”\n\nเขาโยนตำราลงบนโต๊ะ\n\n“อ่านประดับความรู้ไว้ก็ไม่ได้เสียหายอะไร มันอาจช่วยให้พวกเจ้าเข้าใจหลักการบำเพ็ญเพียรได้ลึกซึ้งขึ้นด้วยซ้ำ แต่หากคิดจะลองฝึกตามวิธีนี้ด้วยตนเองจริงๆ พวกเจ้าคงได้สัมผัสกับความสิ้นหวังราวกับต้องตักน้ำเติมมหาสมุทรอันไร้ก้นบึ้งเพียงลำพัง”\n\nเมื่อคำบรรยายอันยืดยาวของหวังจิ้นจบลง เหล่าเด็กๆ ต่างก็หมดความสนใจในกายาบรรพกาลไปตามๆ กัน\n\nทว่าอีฮยอนกลับยิ่งรู้สึกสนใจมากขึ้นไปอีก!\n\n‘ข้าก็น่าจะสร้างกายาบรรพกาลได้นี่นา? เรื่องเวลาเป็นสิ่งเดียวที่ข้ามีเหลือเฟือ และข้าก็ไม่มีเหตุผลอันใดที่จะต้องรีบทะลวงสู่ขั้นสร้างรากฐานเสียหน่อย ข้าไม่ได้คิดจะรีบแข็งแกร่งขึ้นให้เร็วที่สุดสักหน่อย’\n\n‘ในนิยายเซียนเสียที่เคยอ่านเมื่อชาติก่อน ต่อให้ระดับพลังสูงส่งเพียงใด ก็มักจะมีพวกยอดฝีมือคอยมาหาเรื่องชวนตีไม่รู้จักจบ... ในโลกบำเพ็ญเพียร ยิ่งระดับพลังที่ปรากฏภายนอกดูต่ำเท่าไร ก็ยิ่งปลอดภัยมากขึ้นเท่านั้น เพราะมันทำให้ศัตรูชะล่าใจ! ถ้าอย่างนั้น บางทีการฝึกกายาบรรพกาลแล้วกลายเป็นผู้ที่แข็งแกร่งที่สุดในระดับเดียวกันอาจจะเป็นทางเลือกที่ดีกว่าก็ได้...’\n\nอีฮยอนคิดว่ากายาบรรพกาลช่างเข้ากับนิสัยของตนเป็นอย่างยิ่ง กระนั้นเขาก็ยังไม่มีความคิดจะรีบฝึกมันในทันที ในช่วงเริ่มต้นของขั้นกลั่นลมปราณเช่นนี้ หากระดับพลังของเขาไม่ก้าวหน้าไปในจังหวะใกล้เคียงกับคนอื่นๆ ทางสำนักอาจนึกสงสัยขึ้นมาได้ ซ้ำยังอาจทำให้การปฏิบัติหน้าที่ดูแลพืชวิญญาณเป็นไปอย่างลำบากอีกด้วย\n\n‘ข้าจะฝึกเคล็ดเอกปราณบรรพกาลไปให้ถึงระดับหนึ่งก่อน เรียนรู้เรื่องพืชวิญญาณให้เรียบร้อย แล้วค่อยหนีออกจากหุบเขาชิงเหอก่อนที่จะมีใครสังเกตเห็นว่าข้าไม่แก่ลง หลังจากนั้นค่อยไปขุดอุโมงค์หลบซ่อนตัว แล้วค่อยเริ่มสร้างกายาบรรพกาลก็ยังไม่สาย’\n\n...\n\nหลังเลิกเรียนและเดินกลับมาถึงห้องพัก หวังเส้าเหลือบเห็นตำราเคล็ดเอกปราณบรรพกาลในมือของอีฮยอนจึงเอ่ยถามขึ้น\n\n“ท่านเลือกวิชานั้นจริงๆ หรือ?”\n\n“อืม”\n\n“พี่ชาย ข้าไม่อยากจะพูดเลยนะ แต่... ไม่มีทางหรอกที่การสร้างผลงานในฐานะผู้เพาะปลูกพืชวิญญาณจะทำให้ท่านได้เป็นศิษย์สายใน โลกบำเพ็ญเพียรนั้นเต็มไปด้วยเล่ห์เหลี่ยมและความโหดร้าย นี่ต้องเป็นกับดักที่หวังจิ้นจงใจล่อลวงพวกเราแน่ๆ!”\n\n“เพิ่งเข้ามาเป็นศิษย์ใหม่แท้ๆ กล้าดียังไงถึงไปนินทาว่าร้ายผู้ดูแลหวังเช่นนั้น? เจ้าเสียสติไปแล้วหรือไร?”\n\nเมื่อได้ยินคำพูดของอีฮยอน สีหน้าของหวังเส้าก็พลันแข็งค้างไปทันที\n\n“ฮ่าๆ ข้าล้อเล่นน่า ปากเจ้าก็บอกว่าโลกบำเพ็ญเพียรเต็มไปด้วยเล่ห์เหลี่ยม แต่ไหงกลับมาไว้เนื้อเชื่อใจข้าที่เพิ่งรู้จักกันได้ไม่นานง่ายดายนักเล่า? ระวังคำพูดคำจาของตัวเองไว้เสมอด้วย”\n\n“ตกใจหมดเลย! ข้าประมาทเกินไปจริงๆ ด้วย แต่ข้าดูคนไม่ผิดหรอกนะ ตั้งแต่แรกเห็น ข้าก็รู้สึกว่าพี่ชายเป็นคนที่ไว้ใจได้อยู่แล้ว”\n\n“แล้วเจ้าเลือกวิชาอะไรล่ะ?”\n\n“ข้าเลือกเคล็ดคมโลหะน่ะสิ ในเมื่อได้เป็นผู้บำเพ็ญเพียรทั้งที ก็ควรจะเป็นผู้ฝึกกระบี่ที่มีพลังต่อสู้แข็งแกร่งที่สุดมิใช่หรือ? และหากอยากเป็นผู้ฝึกกระบี่ โดยธรรมชาติก็ต้องฝึกเคล็ดวิชาธาตุทอง ขืนมัวแต่ทำงานดูแลพืชวิญญาณ เมื่อไรกันเล่าถึงจะก้าวไปถึงระดับสูงได้?”\n\n“แต่วิชาคมโลหะนั่น เขาบอกว่าจะกัดกร่อนเส้นลมปราณไม่ใช่เหรอ?”\n\n“เขาบอกว่าขอเพียงกินวัตถุดิบยาบำรุงอยู่สม่ำเสมอก็ไม่เป็นไรแล้ว”\n\n“แบบนั้นคงเปลืองศิลาวิญญาณน่าดูเลยนะ”\n\n“หากข้าได้เป็นผู้ฝึกกระบี่แล้วสร้างความดีความชอบในการต่อสู้ ทางสำนักก็ย่อมมอบเม็ดยาโอสถและวัตถุดิบยาที่ข้าต้องการให้ทั้งหมดเองนั่นแหละ”\n\n“เจ้าเคยฆ่าคนมาก่อนหรือไง?”\n\n“ไม่เคย...”\n\n“ข้าก็เหมือนกัน เอาเข้าจริง ข้าไม่มั่นใจเลยสักนิดว่าตัวเองจะสู้ใครไหว แค่ฆ่าสัตว์ยังทำใจลำบากแล้ว นับประสาอะไรกับการต้องไปสู้รบกับผู้บำเพ็ญเพียรคนอื่น ข้าขอเลือกเรียนงานเพาะปลูกพืชวิญญาณนี่แหละ”\n\nหลังพูดคุยกันอยู่พักหนึ่ง หวังเส้าก็ปีนขึ้นเตียงของตนแล้วเปิดตำราเคล็ดคมโลหะออก พออ่านทวนบทท่องจำของเคล็ดวิชาอยู่สองสามรอบ เขาก็นั่งลงในท่าขัดสมาธิทันที\n\nอีฮยอนเองก็ขึ้นไปนั่งบนเตียงของตนแล้วกางตำราเคล็ดเอกปราณบรรพกาลออกเช่นกัน\n\nเมื่อเทียบกับเคล็ดชักนำปราณชิงเหอแล้ว เคล็ดเอกปราณบรรพกาลมีเนื้อหามากกว่ากันลิบลับ ภายในเล่มอธิบายทุกขั้นตอนอย่างละเอียดลออ ตั้งแต่วิธีการกำหนดลมหายใจเพื่อดูดซับปราณวิญญาณฟ้าดิน กระบวนการกลั่นกรองปราณวิญญาณ แนวทางการโคจรปราณแท้บรรพกาลไปตามเส้นลมปราณ ไปจนถึงวิธีโคจรปราณแท้บรรพกาลยามปลดปล่อยวิชาต่างๆ\n\n‘ต้องรีบฝึกให้ถึงขั้นเริ่มต้นไวๆ จะได้นอนบำเพ็ญเพียรได้เสียที! ท่านั่งขัดสมาธินี่มันเมื่อยชะมัดเลย...’\n\n...\n\nไม่กี่วันต่อมา\n\nผู้ดูแลหวังจิ้นเรียกตัวศิษย์ใหม่ที่บรรลุขั้นกลั่นลมปราณ ระดับ 1 แล้วเข้าพบเพื่อสอบถามทีละคน และอีฮยอนก็มิใช่ข้อยกเว้น\n\n“อีกไม่นานพวกเจ้าจะได้รับมอบหมายหน้าที่แล้ว มีงานใดที่เจ้าปรารถนาจะทำเป็นพิเศษหรือไม่?”\n\n“ข้าอยากเรียนรู้วิธีการเพาะปลูกพืชวิญญาณหรือสมุนไพรวิญญาณขอรับ”\n\n“เจ้ามีรากวิญญาณสามธาตุ ไม้ ไฟ และดิน นับว่าเข้ากันได้ไม่เลว เหตุใดจึงอยากทำงานนี้เล่า?”\n\n“ดูเหมือนจะปลอดภัยกว่าการไปต่อสู้กับผู้คนขอรับ”\n\nมือของหวังจิ้นที่กำลังเขียนบันทึกบางอย่างลงในสมุดทะเบียนพลันชะงักค้าง\n\n“เจ้าเป็นคนซื่อตรงดีนี่ แต่การทำงานกับพืชวิญญาณหาใช่เรื่องง่ายเลยแม้แต่น้อย เจ้าต้องคอยระแวดระวังทั้งแมลงวิญญาณและโรคพืช เพียงคำนวณปริมาณฝนวิญญาณคลาดเคลื่อนไปเล็กน้อยก็อาจทำให้พืชผลเสียหายหมดสิ้นได้ สมุนไพรวิญญาณบางชนิดที่มีฤทธิ์ยารุนแรงถึงขั้นแผ่ไอพิษออกมาด้วยซ้ำ แล้วเจ้าตั้งใจจะฝึกเคล็ดวิชาใดเล่า?”\n\n“《เคล็ดเอกปราณบรรพกาล》 ขอรับ”\n\n“อย่างนั้นหรือ? เลือกได้ดีมาก อีกไม่นานเจ้าก็จะได้รู้ผลการจัดสรรหน้าที่แล้ว”\n\n...\n\nวันที่หนึ่งร้อยหลังจากก้าวเข้าสู่สำนัก\n\nเหล่าศิษย์ใหม่ต่างมารวมตัวกันภายในโถงตั้งแต่ก่อนตะวันขึ้น\n\nวันนี้คือวันที่ผู้ดูแลหวังจิ้นจะแต่งตั้งเหล่าศิษย์ใหม่ที่บรรลุขั้นกลั่นลมปราณ ระดับ 1 แล้วขึ้นเป็นศิษย์สายนอกอย่างเป็นทางการ พร้อมทั้งจัดสรรหน้าที่การงานและที่พักแห่งใหม่ให้แก่พวกเขา"

      "title": "บทที่ 6",
      "content": "ความตึงเครียดและความคาดหวังฉายชัดปะปนกันอยู่บนใบหน้าของเหล่าเด็กๆ ที่มารวมตัวกันภายในโถงบรรยาย\n\nขณะเดียวกัน เด็กสองคนที่ยังคงไม่อาจบรรลุขั้นกลั่นลมปราณ ระดับ 1 ได้ต่างก็นั่งขัดสมาธิอยู่เบื้องหลังฉากพับด้วยใบหน้าซีดเผือด\n\nชั่วอึดใจต่อมา ผู้ดูแลหวังจิ้นก็ก้าวเข้ามาภายในโถงบรรยาย\n\nมีศิษย์สายนอกคนหนึ่งเดินตามหลังเขามา พร้อมกับประคองหีบไม้ที่บรรจุถุงผ้าใบเล็กๆ ไว้เต็มหีบ\n\nหวังจิ้นกวาดสายตามองเหล่าศิษย์ใหม่อย่างเชื่องช้า\n\n“วันนี้ครบกำหนดหนึ่งร้อยวันแล้ว พวกเจ้าส่วนใหญ่สามารถชักนำปราณเข้าสู่ร่างได้สำเร็จ นับว่าเป็นผลลัพธ์ที่ไม่เลวเลยทีเดียว”\n\nสายตาของหวังจิ้นเบนไปยังฉากพับ\n\n“จูหมิง”\n\nเด็กชายสะดุ้งเฮือกก่อนจะลุกขึ้นยืน\n\n“ขอรับ”\n\n“เจ้าจะถูกส่งตัวลงไปยังเขตงานใช้แรงงาน หากระหว่างที่ทำงานอยู่ที่นั่น เจ้าสามารถชักนำปราณเข้าสู่ร่างได้สำเร็จภายในหกเดือน ข้าจะอนุญาตให้เจ้าก้าวเข้าสู่ฝ่ายนอก”\n\nสีหน้าของเด็กชายพลันสว่างไสวขึ้นมาทันที\n\n“ขอบพระคุณท่านผู้ดูแลขอรับ!”\n\n“ไม่จำเป็นต้องขอบคุณข้า งานในเขตงานใช้แรงงานจะหนักหนาสาหัสกว่าสิ่งที่เจ้าทำอยู่ที่นี่หลายเท่า”\n\n“ข้าจะตั้งใจทำงานอย่างหนักขอรับ”\n\nหวังจิ้นหันศีรษะไปอีกทาง\n\n“เกาเจ๋อ”\n\nคราวนี้เป็นชายหนุ่มคนหนึ่งที่ลุกขึ้นจากที่นั่ง\n\n“ขอรับ”\n\n“จงเดินออกไปทางประตูขุนเขาเสีย”\n\nสีเลือดบนใบหน้าของชายหนุ่มพลันเหือดหายไปจนหมดสิ้น\n\n“ท่านผู้ดูแล ได้โปรดให้โอกาสข้าอีกสักครั้งเถิดขอรับ ข้าขอสาบานว่าข้าจะ...”\n\n“พอได้แล้ว! จูหมิงหมั่นฝึกฝนอย่างขยันขันแข็ง เขาเพียงขาดพรสวรรค์ แต่นั่นไม่ได้หมายความว่าเขาไร้ซึ่งแวว ส่วนเจ้านั้นขาดทั้งพรสวรรค์และความพยายาม จงลงจากเขาไปเสีย”\n\nชายหนุ่มขบกัดริมฝีปากแน่น ทว่าไม่อาจเอ่ยคำใดออกมาได้อีก\n\nศิษย์สายนอกที่เดินเข้ามาพร้อมหวังจิ้นเป็นผู้นำตัวทั้งสองคนเดินออกไปจากโถงบรรยาย\n\nหวังจิ้นเปิดสมุดบัญชีรายชื่อออก\n\n“นับจากนี้ไป ผู้ที่ข้าขานชื่อจะได้รับการยอมรับเข้าเป็นศิษย์สายนอกแห่งหุบเขาชิงเหออย่างเป็นทางการ”\n\nบรรยากาศภายในโถงบรรยายพลันแปรเปลี่ยน เหล่าเด็กๆ ต่างยืดแผ่นหลังขึ้นตรง\n\n“ศิษย์สายนอกจะได้รับศิลาวิญญาณระดับต่ำหนึ่งก้อนและโอสถอิ่มทิพย์สิบเม็ดในทุกๆ เดือน พร้อมด้วยแต้มคุณูปการจำนวนหนึ่ง พวกเจ้าสามารถสะสมแต้มคุณูปการเพิ่มเติมได้จากการปฏิบัติหน้าที่ที่ได้รับมอบหมายได้อย่างโดดเด่น หรือจากการทำภารกิจแยกต่างหาก แต้มคุณูปการสามารถนำไปใช้ยืมหรือแลกซื้อเคล็ดวิชา อาคมวิชา โอสถ อุปกรณ์เวท และสิ่งของอื่นๆ ได้ เสบียงประจำเดือนนี้ถูกบรรจุไว้ภายในถุงเก็บของที่พวกเจ้าจะได้รับในวันนี้เรียบร้อยแล้ว ส่วนแต้มคุณูปการก็ได้บันทึกไว้บนป้ายประจำตัวอันใหม่ของพวกเจ้าเช่นกัน”\n\nหวังจิ้นเริ่มขานรายชื่อออกมาทีละคน\n\nศิษย์ที่ถูกขานชื่อต่างก้าวออกไปด้านหน้า ส่งคืนป้ายไม้เดิม แล้วรับป้ายประจำตัวอันใหม่พร้อมถุงเก็บของกลับมา\n\nไม่นานนักก็ถึงคราวของอีฮยอน\n\n“อีฮยอน”\n\n“ขอรับ”\n\n“หน้าที่ที่เจ้าได้รับมอบหมาย คือผู้ช่วยผู้ดูแลแปลงสมุนไพรวิญญาณหมายเลข 73 บนยอดเขาแปลงสมุนไพร”\n\nสีหน้าของอีฮยอนพลันแจ่มใสขึ้นทันที\n\n“ผู้ดูแลแปลงสมุนไพรวิญญาณหมายเลข 73 คือ ลู่ไป๋ซาน ตาเฒ่านั่นทำงานด้านพืชวิญญาณอยู่ในฝ่ายนอกมาเนิ่นนานหลายปีแล้ว เจ้าน่าจะได้เรียนรู้อะไรจากเขาอีกมาก”\n\n“เข้าใจแล้วขอรับ”\n\nอีฮยอนรับป้ายประจำตัวอันใหม่กับถุงเก็บของที่มีรูปลักษณ์คล้ายถุงผ้าใบเล็กๆ มา แล้วเดินกลับมานั่งยังที่ของตน\n\nป้ายประจำตัวอันใหม่ทำจากเนื้อไม้สีน้ำเงินเข้มเกือบดำ มีขนาดไล่เลี่ยกับอันเก่า ทว่าด้านหน้าแกะสลักตราสัญลักษณ์ของหุบเขาชิงเหอไว้อย่างวิจิตรบรรจง ส่วนด้านหลังสลักชื่อ อีฮยอน พร้อมคำว่า ฝ่ายนอก กำกับไว้\n\nทว่าเขายังไม่รู้วิธีใช้งานถุงเก็บของใบนี้เลยแม้แต่น้อย\n\nไม่นานนัก ศิษย์คนสุดท้ายก็รับสิ่งของและเดินกลับไปนั่งประจำที่\n\nหลังจากสั่งให้คนยกหีบไม้ออกไปแล้ว หวังจิ้นก็ปลดถุงเก็บของสภาพเก่าคร่ำคร่าใบหนึ่งลงมาจากเอว\n\n“พวกเจ้าส่วนใหญ่คงไม่เคยเห็นถุงเก็บของมาก่อน ดังนั้นข้าจะสอนวิธีใช้งานให้ดู”\n\nเขาวางนิ้วลงตรงปากถุง\n\n“จงส่งพลังวิญญาณเข้าสู่ค่ายกลที่สลักไว้รอบปากถุง จากนั้นส่งจิตสำนึกตามกระแสพลังเข้าไปด้านใน ไม่จำเป็นต้องใช้พลังวิญญาณมากมาย เพียงเส้นบางๆ ราวเส้นด้ายก็เพียงพอแล้ว”\n\nอีฮยอนวางถุงเก็บของลงบนฝ่ามือตามอย่างศิษย์คนอื่นๆ\n\nหากมองจากภายนอก มันดูไม่ต่างอะไรจากถุงผ้าสีเทาธรรมดาใบหนึ่ง มีเชือกสีดำผูกไว้รอบปากถุง และมีลวดลายสีเงินจางๆ ปักทออยู่บนเนื้อผ้า\n\nเขาชักนำปราณแท้บรรพกาลจากตันเถียนขึ้นมาเล็กน้อย แล้วส่งถ่ายเข้าไปยังลวดลายเหล่านั้น\n\nช่วงแรก ไม่มีสิ่งใดเกิดขึ้น\n\nครั้นอีฮยอนหลับตาลงและเพ่งจิตสำนึกจดจ่อไปยังถุงผ้า ลวดลายบนเนื้อผ้าก็เริ่มเรืองแสงขึ้นจางๆ ในชั่วขณะนั้นเอง ห้วงมิติว่างเปล่าแห่งหนึ่งก็พลันปรากฏขึ้นในห้วงความคิดของเขา\n\nรอบทิศทางมืดสลัวจนไม่อาจมองเห็นขอบเขตได้ชัดเจน ภายในนั้นมีก้อนหินโปร่งแสงก้อนหนึ่งกับขวดไม้อีกหนึ่งใบวางอยู่\n\n‘โอ้... น่าทึ่งชะมัด’\n\nอีฮยอนนึกคิดที่จะหยิบก้อนหินนั้นออกมา ทันใดนั้นสัมผัสเย็นเฉียบก็พลันปรากฏขึ้นบนฝ่ามือ\n\nมันคือศิลาโปร่งแสงขนาดยาวราวสองข้อนิ้ว ภายในเนื้อหินมีบางสิ่งคล้ายหมอกสีขาวจางหมุนวนอย่างเชื่องช้าราวกับมีชีวิต\n\nเสียงอุทานด้วยความอัศจรรย์ใจดังขึ้นรอบทิศทาง\n\n“นี่คือศิลาวิญญาณหรือขอรับ?”\n\nเด็กหนุ่มที่นั่งอยู่แถวหน้าเอ่ยถามขึ้น\n\n“ถูกต้อง ศิลาวิญญาณระดับต่ำ”\n\nหวังจิ้นหยิบก้อนหินลักษณะเดียวกันออกมาจากถุงเก็บของของตน\n\n“ศิลาวิญญาณก่อตัวขึ้นเมื่อปราณวิญญาณฟ้าดินควบแน่นสะสมต่อเนื่องกันเป็นเวลานานแสนนาน มันสามารถเกิดขึ้นเองตามธรรมชาติในสายแร่ หรืออาจสร้างขึ้นโดยมนุษย์บริเวณโดยรอบชีพจรวิญญาณก็ได้”\n\nเด็กหนุ่มคนหนึ่งกุมศิลาวิญญาณไว้ด้วยสองมือพลางพยายามดูดซับปราณวิญญาณภายในออกมา กลุ่มหมอกภายในศิลากระเพื่อมไหวเล็กน้อย ซึ่งหวังจิ้นก็เอ่ยตำหนิขึ้นทันควัน\n\n“อย่าดูดซับส่งเดช”\n\nเด็กหนุ่มสะดุ้งตกใจจนรีบคลายมือออก\n\n“พวกเจ้าสามารถถือศิลาวิญญาณแล้วดูดซับปราณวิญญาณออกมาโดยตรงได้ก็จริง ทว่าด้วยระดับพลังของพวกเจ้าในตอนนี้ ยังไม่อาจกลั่นกรองปราณวิญญาณที่บรรจุอยู่ภายในได้อย่างสมบูรณ์ กว่าครึ่งหนึ่งจะสูญสลายหายไปในอากาศเสียเปล่า”\n\nหวังจิ้นคลึงศิลาวิญญาณหมุนวนไปมาระหว่างปลายนิ้ว\n\n“ประโยชน์ที่แพร่หลายที่สุดของศิลาวิญญาณคือใช้เป็นแหล่งพลังงานขับเคลื่อนค่ายกล ยามบำเพ็ญเพียรก็เช่นเดียวกัน หากพวกเจ้าหาค่ายกลรวมปราณแบบพกพามาได้ แล้ววางศิลาวิญญาณลงบนจานค่ายกล มันก็จะสามารถดึงดูดปราณวิญญาณรอบด้านให้มารวมตัวกันในพื้นที่จำกัดได้ การฝึกฝนภายในค่ายกลนั้นมีประสิทธิภาพสูงกว่าการดูดซับจากศิลาวิญญาณโดยตรงหลายเท่าตัว”\n\nดวงตาของเด็กหลายคนพลันเป็นประกายวาววับ\n\n“พวกเราจะหาซื้อค่ายกลรวมปราณแบบพกพาได้จากที่ใดหรือขอรับ?”\n\n“พวกเจ้าสามารถซื้อได้ที่หอศาสตราโดยใช้แต้มคุณูปการหรือศิลาวิญญาณ แม้แต่แบบหยาบๆ ก็ยังต้องใช้ศิลาวิญญาณระดับต่ำอย่างน้อยห้าสิบก้อน”\n\nเหล่าเด็กๆ ที่เพิ่งมีท่าทางกระตือรือร้นเมื่อครู่พลันห่อเหี่ยวลงทันที\n\nราวกับคาดเดาปฏิกิริยาเช่นนั้นไว้อยู่แล้ว หวังจิ้นจึงกล่าวต่อ\n\n“หากพลังวิญญาณของพวกเจ้าเหือดแห้งกลางสมรภูมิและชีวิตแขวนอยู่บนเส้นด้าย ย่อมไม่มีทางเลือกอื่นนอกจากต้องดูดซับจากศิลาวิญญาณโดยตรง ทว่าหากไม่ได้ตกอยู่ในสถานการณ์เช่นนั้น จงอย่าใช้มันอย่างสิ้นเปลือง ศิลาวิญญาณคือเงินตราที่ใช้แลกเปลี่ยนแพร่หลายที่สุดในโลกบำเพ็ญเพียร ฉะนั้นจงเก็บรักษาไว้ให้ดี”\n\nอีฮยอนเก็บศิลาวิญญาณกลับเข้าไปในถุงเก็บของ\n\nภายในขวดไม้บรรจุโอสถอิ่มทิพย์ขนาดเท่าเมล็ดถั่วอยู่สิบเม็ด ครั้นลองส่งจิตสำนึกเพ่งมองไปที่ป้ายประจำตัว ตัวอักษรคำว่า 10 แต้มคุณูปการ ก็ปรากฏขึ้นจางๆ ใต้ชื่อของเขา\n\n“อย่าพยายามนำสัตว์มีชีวิตหรือผู้คนใส่เข้าไปในถุงเก็บของเป็นอันขาด ต่อให้ฝืนยัดเข้าไป ค่ายกลก็จะไม่ทำงาน”\n\nเหล่าเด็กๆ ต่างลองเก็บสิ่งของเข้าและหยิบออกจากถุงเก็บของกันซ้ำไปซ้ำมา\n\nอีฮยอนเองก็ลองเก็บป้ายประจำตัว ศิลาวิญญาณ และโอสถอิ่มทิพย์เข้าออกอยู่หลายรอบ เมื่อเริ่มคุ้นชินแล้ว เขาก็สามารถเก็บและเรียกสิ่งของออกมาได้เพียงแค่นึกคิด โดยไม่ต้องใช้มือเปิดปากถุงด้วยซ้ำ\n\n...\n\nเมื่อได้รับมอบหมายหน้าที่และที่พักเรียบร้อยแล้ว เหล่าศิษย์สายนอกหน้าใหม่ต่างก็แยกย้ายกันออกจากโถงบรรยาย\n\nส่วนใหญ่พากันกลับไปยังห้องพักเดิมเพื่อเก็บข้าวของสัมภาระ นับจากนี้เป็นต้นไป พวกเขาจะต้องย้ายไปพักยังเรือนพักใกล้สถานที่ปฏิบัติหน้าที่ หรือไม่ก็ย้ายเข้าสู่เขตที่พักศิษย์สายนอกที่จัดตั้งไว้ตามยอดเขาต่างๆ\n\nอีฮยอนเดินกลับมายังห้องพักของตนเช่นกัน และลงมือเก็บเสื้อผ้า เครื่องนอน รวมถึงตำราที่ได้รับแจกมา\n\nเพียงแค่นำเครื่องนอนกองโตและภาชนะไม้ใส่เข้าไปในถุงเก็บของ ข้าวของที่เคยกองสุมอยู่มุมหนึ่งของห้องก็อันตรธานหายไปในพริบตา\n\nหวังเส้ากำลังนั่งยองๆ อยู่หน้าเตียง เพลิดเพลินอยู่กับการเก็บข้าวของเข้าและหยิบออกจากถุงเก็บของไม่เลิก\n\n“พี่ชาย ดูนี่สิ”\n\nเขาแบมือออก ภาชนะไม้ใบหนึ่งก็พลันปรากฏขึ้น ครั้นพลิกฝ่ามือคว่ำลงอีกครั้ง ภาชนะใบนั้นก็หายวับไป\n\n“ข้ารู้สึกเหมือนเห็นเจ้าเล่นแบบนั้นมาหลายสิบรอบแล้วนะ”\n\n“แต่มันน่าทึ่งจริงๆ นี่นา! ถ้าภายหน้าข้าซื้อถุงเก็บของมาเยอะๆ บางทีข้าอาจจะพกบ้านทั้งหลังติดตัวไปไหนมาไหนด้วยยังได้เลยนะ”\n\n“แล้วถุงเก็บของมันใส่ซ้อนเข้าไปในถุงเก็บของอีกใบได้หรือ?”\n\n“เมื่อกี้ข้าลองทำกับเพื่อนอีกคนดูแล้ว แต่มันไม่ได้ผล ปากถุงมันปิดสนิทเหมือนผลักไสกันเองเลยล่ะ”\n\n“ว่าแต่เจ้าถูกส่งไปประจำที่ไหนหรือ?”\n\n“สวนสัตว์วิญญาณน่ะ”\n\nน้ำเสียงของหวังเส้าแผ่วเบาลงเล็กน้อย อีฮยอนนึกว่าอีกฝ่ายไม่พอใจกับการจัดสรรหน้าที่ จึงเอ่ยปลอบใจขึ้นมา\n\n“ข้าได้ยินมาว่ามีไม่กี่คนหรอกที่จะได้ทำงานที่ตัวเองอยากทำตั้งแต่แรก หากเจ้าตั้งใจทำงานในสวนสัตว์วิญญาณ วันข้างหน้าก็อาจจะได้มีโอกาสฝึกฝนวิชากระบี่ก็ได้นะ”\n\nหวังเส้าส่ายหน้า\n\n“ไม่ใช่แบบนั้นหรอก ข้าลองไปสืบถามมาแล้ว ดูเหมือนว่าคนที่อยากเป็นผู้ฝึกกระบี่มักจะถูกส่งไปที่สวนสัตว์วิญญาณตอนเพิ่งเป็นศิษย์ใหม่กันทั้งนั้น”\n\n“ทำไมล่ะ?”\n\n“ศิษย์ที่เพิ่งจะบรรลุขั้นกลั่นลมปราณ ระดับ 1 ยังพอทำประโยชน์อะไรไม่ค่อยได้นี่นา ขืนพาคนระดับนั้นออกไปทำภารกิจของหอพิทักษ์ธรรมก็มีแต่จะกลายเป็นตัวถ่วงเปล่าๆ ดังนั้นช่วงแรกจึงต้องให้มาแบกหามอาหารสัตว์วิญญาณหรือทำความสะอาดคอกเพื่อเสริมสร้างพละกำลัง พร้อมกับฝึกไม่ให้ตื่นตระหนกยามต้องเผชิญหน้ากับสัตว์วิญญาณยังไงล่ะ”\n\nผิดกับเมื่อครู่ลิบลับ ยามนี้หวังเส้าเอ่ยออกมาด้วยน้ำเสียงตื่นเต้นอย่างเห็นได้ชัด\n\n“ข้าได้รับมอบหมายให้ดูแลเขตของกวางเขาคราม ซึ่งเป็นสัตว์วิญญาณระดับ 1 พวกมันนิสัยเชื่อง คงไม่มีอันตรายอะไรหรอก”\n\nท่าทางของหวังเส้าดูราวกับว่าตนเพิ่งจะไปพบเจอวาสนาลับวิชากระบี่ในสวนสัตว์วิญญาณมาหมาดๆ\n\n“ดีแล้ว แต่ยังไงก็ระวังอย่าให้ได้รับบาดเจ็บล่ะ”\n\n“ข้าบอกแล้วไงว่าพวกมันเชื่องจะตาย ข้าเป็นห่วงพี่ชายมากกว่า เผลอๆ ท่านคงต้องไปนั่งถอนหญ้าในแปลงทั้งวันแน่ๆ”\n\n“มันเป็นสิ่งที่ข้าอยากทำเอง ข้าไม่ติดใจอะไรหรอก”\n\nหวังเส้าผูกถุงเก็บของไว้ข้างเอวอย่างแน่นหนา\n\nทั้งสองร่วมห้องพักเดียวกันมาตลอดหนึ่งร้อยวัน จะว่านานก็นาน จะว่าสั้นก็สั้น ขึ้นอยู่กับมุมมอง แม้หวังเส้าจะพูดมากไปสักหน่อย ทว่าต้องขอบคุณอีกฝ่ายเช่นกันที่ช่วยให้อีฮยอนคลายเหงาไปได้ไม่น้อย\n\n“ไว้สักวันพวกเรามาพบกันใหม่ในฝ่ายในนะ”\n\n“ข้าบอกแล้วไงว่าข้าไม่มีความคิดจะเข้าไปในฝ่ายในหรอก”\n\n“เรื่องอนาคตใครจะไปรู้เล่า บางทีพี่ชายอาจจะสร้างผลงานยิ่งใหญ่ในด้านพืชวิญญาณจนไปเข้าตาผู้อาวุโสท่านใดเข้าก็ได้”\n\n“งั้นเจ้าก็เข้าไปในฝ่ายในให้ได้ก่อน แล้วค่อยจองที่ไว้เผื่อข้าด้วยก็แล้วกัน”\n\n“แน่นอนอยู่แล้ว”\n\nหวังเส้ายื่นกำปั้นออกมา อีฮยอนจึงยื่นกำปั้นออกไปชนเบาๆ\n\n“ดูแลตัวเองด้วยนะ”\n\n“พี่ชายก็เช่นกันขอรับ”\n\n...\n\nอีฮยอนออกเดินทางมุ่งหน้าไปยังยอดเขาแปลงสมุนไพร\n\nภูเขาทั้งลูกถูกขุดแต่งให้มีลักษณะคล้ายขั้นบันไดขนาดมหึมา\n\nแปลงสมุนไพรวิญญาณนับไม่ถ้วนทอดตัวลดหลั่นเป็นขั้นบันไดตั้งแต่เชิงเขาไล่เรียงขึ้นไปจนถึงช่วงกลางเขา กำแพงหินเตี้ยๆ และร่องน้ำทำหน้าที่แบ่งเขตแปลงออกจากกัน โดยแต่ละแปลงต่างเพาะปลูกสมุนไพรวิญญาณต่างชนิดกันไป\n\nหญ้าบางชนิดมีลวดลายสีเงินไหลเวียนอยู่บนใบสีเขียว ส่วนพืชบางต้นก็มีรากสีแดงสดชอนไชโผล่พ้นดินขึ้นมาคล้ายนิ้วมือมนุษย์\n\nหุ่นไล่กาที่สานขึ้นจากฟางข้าวสามารถหันศีรษะไปมาได้เองเพื่อไล่ฝูงนก\n\nกลุ่มเมฆขนาดเล็กหลายกลุ่มล่องลอยอย่างเชื่องช้าอยู่กลางอากาศเหนือแปลงสมุนไพร ยามผู้บำเพ็ญเพียรในชุดคลุมสีเทาร่ายมุทรา ฝนละอองละเอียดก็พลันโปรยปรายลงมาจากก้อนเมฆก้อนหนึ่ง\n\nในแปลงสมุนไพรวิญญาณอีกแห่ง เข็มเงินเรียวยาวหลายเล่มพุ่งแหวกไปมาระหว่างใบไม้อย่างรวดเร็ว คอยทิ่มแทงแมลงตัวจ้อยจนร่วงหล่น\n\n‘ดูท่าข้าจะมาถูกที่แล้วแฮะ’\n\nยิ่งไต่ระดับสูงขึ้นไปเท่าไร กลิ่นหอมอันยากจะบรรยายก็ยิ่งทวีความเข้มข้นขึ้นท่ามกลางกลิ่นดินและกลิ่นหญ้า\n\nแปลงหนึ่งโชยกลิ่นดอกไม้หอมหวานละมุนละไม ทว่าอีกแปลงกลับส่งกลิ่นฉุนกึกบาดจมูกอย่างรุนแรง ลวดลายค่ายกลถูกสลักไว้บนกำแพงหินทุกแนว และทุกครั้งที่อีฮยอนเดินเข้าไปใกล้ ป้ายประจำตัวของเขาก็จะสั่นไหวเบาๆ\n\nบรรดาศิษย์พี่ผู้บำเพ็ญเพียรส่วนใหญ่ต่างไม่ได้หันมาสนใจเขาเลยแม้แต่น้อย\n\nอีฮยอนคอยสังเกตป้ายบอกทางตามริมทางเดินขณะมุ่งหน้าไปยังแปลงสมุนไพรวิญญาณที่ตนได้รับมอบหมาย\n\n...\n\nแปลงสมุนไพรวิญญาณหมายเลข 73 ตั้งอยู่บริเวณใกล้ขอบนอกของยอดเขาแปลงสมุนไพร\n\nพื้นที่ของมันกว้างใหญ่ราวกับนำแปลงนาหลายแปลงในหมู่บ้านไม้ขาว—สถานที่แรกที่อีฮยอนมาอาศัยอยู่หลังทะลุมิติมายังโลกนี้—มารวมเข้าด้วยกัน\n\nหญ้าสีเขียวขจีขึ้นเรียงรายอย่างเป็นระเบียบภายในแนวกำแพงหินเตี้ย บริเวณใจกลางแปลงสมุนไพรมีสระน้ำขนาดเล็กตั้งอยู่คู่กับเรือนชั้นเดียวผนังดินมุงหลังคากระเบื้อง\n\nตัวเรือนไม่ได้โอ่อ่าหรูหรา ทว่าก็ดูโอ่โถงพอจะใช้เป็นทั้งโรงทำงานและที่พักอาศัยสำหรับผู้ดูแลแปลงสมุนไพรได้อย่างเหลือเฟือ\n\nด้านหนึ่งของลานหน้าเรือนมีเสื่อไม้ไผ่ปูลาดไว้สำหรับตากสมุนไพรวิญญาณ ข้างกันมีโถดินเผาที่บรรจุดินและวัตถุดิบทางยาวางเรียงเป็นแถว ส่วนริมขอบสระน้ำมีกระถางต้นยาสมุนไพรที่อีฮยอนไม่รู้จักวางเรียงรายเป็นทิวแถว\n\nชายชราผู้หนึ่งกำลังก้มหลังค่อมถอนวัชพืชอยู่ในแปลง\n\nเส้นผมของเขากลายเป็นสีขาวโพลนเกินกว่าครึ่ง และริ้วรอยลึกปรากฏชัดบนใบหน้ากร้านแดดคล้ำ\n\nอีฮยอนเดินเข้าไปใกล้แล้วเอ่ยทักทายอย่างนอบน้อม\n\n“ท่านคือศิษย์พี่ลู่ใช่หรือไม่ขอรับ?”\n\nชายชราเงยหน้าขึ้น\n\nสายตาของเขาเลื่อนจากใบหน้าของอีฮยอนลงไปยังป้ายประจำตัวที่ห้อยอยู่ข้างเอว\n\n“เจ้าคือศิษย์ใหม่ที่เพิ่งเข้ามาสินะ?”\n\n“ขอรับ ข้ามีนามว่าอีฮยอน ได้รับมอบหมายให้มาเป็นผู้ช่วยผู้ดูแลแปลงสมุนไพรวิญญาณหมายเลข 73”\n\nลู่ไป๋ซานยืดตัวขึ้นตรง\n\n“ตามข้ามา”\n\nเขานำอีฮยอนเดินตรงไปยังตัวเรือนกลางแปลงสมุนไพร เมื่อเดินเข้ามาใกล้จึงเห็นมัดสมุนไพรตากแห้งแขวนเรียงรายอยู่ใต้ชายคา ส่วนริมผนังมีรองเท้าบูทเปื้อนดินและตะกร้าไม้ไผ่ขนาดต่างๆ วางพิงอยู่\n\nลู่ไป๋ซานผลักประตูเปิดออก\n\n“เข้ามาสิ”\n\nภายในเรือนกว้างขวางกว่าที่มองเห็นจากภายนอก ผนังด้านหนึ่งแขวนเครื่องมือทำสวนนานาชนิด ทั้งจอบ เคียว และบัวรดน้ำ ส่วนผนังฝั่งตรงข้ามติดม้วนภาพวาดสมุนไพรวิญญาณชนิดต่างๆ พร้อมคำบรรยายคุณลักษณะเอาไว้จนเต็ม\n\nกลางห้องมีโต๊ะตัวยาวตั้งอยู่ บนโต๊ะวางกระถางใบเล็กที่มีต้นกล้าสมุนไพรวิญญาณหลายกระถางคู่กับตำราสภาพเก่าและกาน้ำชา ถัดลึกเข้าไปด้านในมีห้องครัวและห้องนอนอีกสองห้อง บ่งบอกชัดเจนว่าเรือนหลังนี้ใช้เป็นทั้งที่พักอาศัยและสถานที่ทำงาน\n\nลู่ไป๋ซานปัดมือเบาๆ แสงเรืองจางๆ สายหนึ่งพลันพาดผ่านฝ่ามือ คราบดินโคลนก็มลายหายไปอย่างไร้ร่องรอย เขานั่งลงหลังโต๊ะแล้วจิบชาที่เริ่มเย็นชืดลงไปอึกหนึ่ง\n\n“นั่งสิ”\n\nเมื่ออีฮยอนนั่งลงตรงข้ามแล้ว ลู่ไป๋ซานจึงเอ่ยถามขึ้น\n\n“เจ้าฝึกฝนเคล็ดวิชาใดอยู่?”\n\n“《เคล็ดเอกปราณบรรพกาล》 ขอรับ”\n\nลู่ไป๋ซานจ้องมองอีฮยอนนิ่งอยู่ครู่หนึ่ง ก่อนจะเดาะลิ้นออกมาเบาๆ\n\n“ชิ เจ้าผู้ดูแลหวังแนะนำวิชานี้อีกแล้วสินะ?”\n\n“เคล็ดวิชานี้มีปัญหาอันใดหรือขอรับ?”"

      "title": "บทที่ 7",
      "content": "“ตัวเคล็ดเอกปราณบรรพกาลเองไม่ได้มีข้อบกพร่องใดเลยสักนิด อันที่จริง มันยังลึกซึ้งกว่าวิชาบำเพ็ญเพียรพื้นฐานอื่นๆ ที่มอบให้แก่ศิษย์ใหม่เสียอีก ทว่า... ช่างเถอะ ข้าเองก็ยังไม่รู้ว่าเรื่องนั้นจะใช้กับเจ้าได้หรือไม่...”\n\nลู่ไป๋ซานชี้นิ้วไปยังห้องด้านในห้องหนึ่งจากทั้งหมดสองห้องที่ประตูเปิดแง้มเอาไว้\n\n“เจ้าพักห้องนั้น เอาข้าวของไปเก็บเสียก่อน แล้วค่อยกลับออกมา”\n\nอีฮยอนเดินเข้าไปในห้องที่ลู่ไป๋ซานชี้บอก\n\nภายในห้องมีเตียงเล็กๆ หนึ่งหลังกับหีบเก่าๆ หนึ่งใบ ดูเหมือนห้องนี้จะถูกปล่อยว่างมานานพอสมควร เพราะมีฝุ่นจับบางๆ อยู่บนพื้นและเครื่องเรือน ทว่าผนังและเพดานกลับไม่มีร่องรอยชำรุดเสียหายให้เห็น ครั้นเปิดหน้าต่างออก ก็สามารถมองเห็นสระน้ำและแปลงสมุนไพรวิญญาณอันเขียวขจีได้เต็มตา\n\nอีฮยอนนำเครื่องนอนและเสื้อผ้าออกมาจากถุงเก็บของ จัดวางลงบนเตียง แล้วจึงเดินกลับออกไปด้านนอก\n\nลู่ไป๋ซานเดินออกจากเรือนไปก่อนแล้ว อีฮยอนจึงรีบสาวเท้าเดินตามไปติดๆ\n\n“วันนี้เจ้าต้องถอนหญ้า”\n\n“พวกเราจะไม่ใช้วิชากันหรือขอรับ?”\n\n“แล้วเจ้าใช้วิชาเป็นแล้วหรือไง?”\n\n“ยังขอรับ”\n\n“งั้นก็ใช้มือถอนเสีย”\n\n“ขอรับ”\n\nต้นหญ้าสีเขียวที่ขึ้นปกคลุมพื้นที่ส่วนใหญ่ของแปลงสมุนไพรวิญญาณสูงขึ้นมาถึงระดับหัวเข่า\n\nใบของมันเรียวเล็ก มีหยดน้ำค้างใสแจ๋วเกาะพราวอยู่ตรงปลายใบ\n\n“นี่คือสมุนไพรวิญญาณชนิดใดหรือขอรับ?”\n\n“หญ้าน้ำค้างเขียว ใช้เป็นส่วนผสมในการปรุงผงฟื้นฟูปราณซึ่งช่วยฟื้นคืนปราณวิญญาณที่สูญเสียไปอย่างรวดเร็ว และโอสถคลายร้อนเส้นลมปราณที่ใช้บรรเทาความร้อนสะสมในเส้นลมปราณ แม้ไม่ใช่สมุนไพรวิญญาณล้ำค่าอะไร แต่มันนำไปใช้ประโยชน์ได้หลากหลาย จึงมีความต้องการอยู่เสมอไม่ขาดสาย”\n\n“แล้วข้าจะแยกแยะวัชพืชออกได้อย่างไรขอรับ?”\n\n“อะไรก็ตามที่ไม่ใช่หญ้าน้ำค้างเขียว นั่นแหละวัชพืช อย่าให้เหลือรากติดค้างไว้แม้แต่เส้นเดียว”\n\n“ขอรับ”\n\nคำสั่งฟังดูเรียบง่าย ทว่าเมื่อลงมือทำจริงกลับไม่ง่ายเลย\n\nรากของหญ้าน้ำค้างเขียวมีลักษณะเรียวเล็กและเป็นสีขาว ซึ่งวัชพืชจำนวนมากก็มีรากคล้ายคลึงกัน หากดึงพรวดพราดออกไปเฉยๆ ลำต้นของวัชพืชก็จะขาดสะบั้น เขาจึงต้องค่อยๆ พรวนดินรอบโคนอย่างระมัดระวังเพื่อถอนเอารากขึ้นมาด้วย\n\nกว่าจะถอนวัชพืชได้สักต้นต้องใช้เวลาอยู่ไม่น้อย รู้ตัวอีกที ลู่ไป๋ซานก็ก้าวทิ้งห่างเขาไปไกลลิบแล้ว\n\n‘นึกว่าผู้บำเพ็ญเพียรจะจัดการงานแปลงเกษตรทั้งหมดด้วยอาคมวิชาเสียอีก... ที่แท้ก็ต้องมานั่งถอนหญ้าด้วยมือเหมือนกันแฮะ’\n\nกระนั้น เขาก็ไม่ได้รังเกียจงานนี้\n\nหากต้องมาทำงานเช่นนี้ในชาติก่อน เขาคงบ่นกระปอดกระแปดไม่หยุดปาก ทว่าอาจเป็นเพราะก้าวเข้าสู่ขั้นกลั่นลมปราณ ระดับ 1 แล้ว ทั้งแผ่นหลังและหัวเข่าของเขาจึงไม่รู้สึกปวดเมื่อยเลยแม้แต่น้อย\n\nเมื่อร่างกายสบายดี งานตรงหน้าจึงไม่ได้สร้างความเหนื่อยล้าทางจิตใจแต่อย่างใด\n\nขณะที่ไล่ตามรากวัชพืชและขุดพรวนดินโดยรอบ เขาก็พลันพบเจอแมลงหน้าตาประหลาดและรากไม้แปลกๆ อยู่เป็นระยะ\n\n‘แหวะ... ตัวอะไรน่ะ?’\n\nเมื่ออีฮยอนเจอแมลงกระดองสีเขียวตัวหนึ่งและนำไปให้ลู่ไป๋ซานดูเพื่อถามว่าควรจัดการอย่างไร ลู่ไป๋ซานก็อธิบายว่ามันคือแมลงกระดองเขียวที่คอยดูดกินน้ำเลี้ยงของหญ้าน้ำค้างเขียว ก่อนจะขยับมือวูบหนึ่งยกมันลอยขึ้นกลางอากาศแล้วเผามันจนเป็นเถ้าถ่าน\n\nในทางกลับกัน สิ่งมีชีวิตที่ดูคล้ายไส้เดือนดินธรรมดากลับเป็นไส้เดือนวิญญาณดิน ซึ่งช่วยกระจายปราณวิญญาณให้ซึมซาบไปทั่วผืนดินอย่างสม่ำเสมอ จึงไม่จำเป็นต้องฆ่ามันทิ้ง\n\nแม้แต่อยู่ในผืนดินเดียวกัน ก็ยังมีทั้งสิ่งที่ต้องกำจัดและสิ่งที่ต้องปกป้อง แม้จะเพิ่งเป็นวันแรก ทว่าอีฮยอนกลับรู้สึกว่ากระบวนการเรียนรู้ที่จะแยกแยะสิ่งเหล่านี้ทีละอย่างช่างน่าสนใจไม่น้อย\n\nครั้นดวงอาทิตย์เริ่มคล้อยต่ำลงหลังทิวเขา ลู่ไป๋ซานก็เป็นฝ่ายยืดตัวขึ้นก่อน\n\n“วันนี้พอแค่นี้”\n\n“ตรงฝั่งโน้นยังเหลืออยู่อีกหน่อยนะขอรับ”\n\n“หลังตะวันตกดิน น้ำค้างบนใบหญ้าน้ำค้างเขียวจะไหลย้อนกลับลงสู่ราก หากไปรบกวนผืนดินในเวลานั้น จะทำให้ฤทธิ์ยาของมันเสียหาย”\n\nลู่ไป๋ซานรวบรวมวัชพืชที่ถอนได้มากองรวมกันไว้บนกำแพงหิน จากนั้นจึงร่ายมุทราด้วยปลายนิ้ว วัชพืชกองนั้นก็พลันถูกเปลวเพลิงโหมไหม้จนมอดดับไปในพริบตา\n\n“เจ้ามีอะไรกินเป็นมื้อเย็นหรือไม่?”\n\n“ข้ามีโอสถอิ่มทิพย์ขอรับ”\n\n“เก็บเอาไว้กินตอนเสบียงขาดแคลนเถิด ในห้องเก็บของหลังเรือนมีข้าววิญญาณอยู่ ตักออกมาสักชาม เดี๋ยวพวกเราหุงกินกัน”\n\nภายในห้องเก็บของมีโอ่งขนาดสูงราวเอวคนตั้งเรียงรายเป็นแถว\n\nเมื่อลู่ไป๋ซานเปิดฝาโอ่งใบหนึ่งออก กลิ่นหอมละมุนจางๆ ก็พลันโชยฟุ้งไปในอากาศ ภายในโอ่งเต็มไปด้วยเมล็ดข้าวที่มีประกายมันวาวงามตา\n\n“นี่คือข้าววิญญาณหรือขอรับ?”\n\n“ใช่ เป็นพันธุ์ที่เรียกว่าข้าวชิงเหอ ไม่จำเป็นต้องซาวน้ำ”\n\nลู่ไป๋ซานตักน้ำและข้าววิญญาณใส่ลงในหม้อ ปิดฝาให้สนิท จากนั้นจึงทาบฝ่ามือลงข้างหม้อเบาๆ\n\nแสงสีแดงจางๆ แผ่ซ่านออกมาจากปลายนิ้วของเขา ไม่นานนัก กลิ่นหอมกรุ่นอันเย้ายวนก็ลอยอบอวลขึ้นมาจากในหม้อ\n\nลู่ไป๋ซานตักข้าวชิงเหอที่หุงสุกแล้วแบ่งใส่ชามสองใบ พร้อมกับหยิบผักวิญญาณดองเค็มออกมาจากตู้กับข้าวอีกเล็กน้อย มื้อเย็นของพวกเขามีเพียงเท่านั้น\n\nอีฮยอนใช้ตะเกียบคีบข้าวคำหนึ่งส่งเข้าปาก\n\nเมล็ดข้าวนุ่มนวล ทว่ายิ่งเคี้ยวก็ยิ่งหนึบหนับเด้งสู้ฟันอย่างน่าพึงพอใจ ความหวานละมุนแผ่ซ่านไปทั่วปลายลิ้น และทันทีที่กลืนลงคอ กระแสความอบอุ่นสายหนึ่งก็ค่อยๆ คลายตัวแผ่ขยายอยู่ในกระเพาะอาหาร ความหิวโหยที่สะสมมาจากการเดินทำงานกลางแปลงสมุนไพรตลอดทั้งวันพลันมลายหายไปอย่างรวดเร็ว\n\n‘อร่อยดีแฮะ’\n\nทั้งที่เพิ่งกินข้าวเข้าไปเพียงมื้อเดียว ทว่าเขากลับสัมผัสได้ว่าปราณแท้บรรพกาลในตันเถียนเพิ่มขึ้นมานิดหนึ่งอย่างแผ่วเบา\n\n“หากกินข้าววิญญาณเป็นประจำ ก็น่าจะช่วยส่งเสริมการบำเพ็ญเพียรได้ด้วยตัวมันเองเลยนะขอรับ”\n\n“ข้าวชิงเหอพวกนี้ต่อให้ประเมินอย่างเข้าข้างสุดๆ ก็เป็นเพียงธัญพืชวิญญาณระดับ 1 ขั้นกลางเท่านั้น ดังนั้นคงพอส่งผลช่วยได้เฉพาะในช่วงต้นของขั้นกลั่นลมปราณกระมัง”\n\n“ขอบพระคุณขอรับ ศิษย์พี่ลู่”\n\n“ไม่ได้มาจากข้าเสียหน่อย ทางสำนักเป็นคนจัดหามาให้ ไม่จำเป็นต้องรู้สึกติดค้างบุญคุณอะไร”\n\n...\n\nหลายวันต่อจากนั้น อีฮยอนใช้เวลาไปกับการถอนวัชพืชและขุดลอกร่องน้ำในแปลงสมุนไพรวิญญาณหมายเลข 73\n\nยามค่ำคืนและช่วงก่อนรุ่งสาง เขาบำเพ็ญเพียรเคล็ดเอกปราณบรรพกาล ครั้นตะวันทอแสง เขาก็ก้าวออกมาดูแลแปลงสมุนไพรวิญญาณ\n\nเขาช้อนตักใบไม้ร่วงออกจากร่องน้ำ และขุดดินโคลนที่ขวางทางไหลของน้ำออก ถอนวัชพืชที่ขึ้นแทรกอยู่ระหว่างต้นหญ้าน้ำค้างเขียว รวมถึงคอยสอดส่องร่องรอยที่แมลงวิญญาณทิ้งไว้ในยามค่ำคืนแล้วนำไปรายงานให้ลู่ไป๋ซานทราบ\n\nระหว่างทำงาน ลู่ไป๋ซานแทบไม่เอ่ยปากพูดจาเลย\n\nทว่าเมื่ออีฮยอนเลิกทำผิดพลาดซ้ำซาก และสามารถจัดการงานต่างๆ ได้อย่างคล่องแคล่วโดยไม่ต้องรอให้สั่ง ท่าทีของอีกฝ่ายก็ค่อยๆ เปลี่ยนไปทีละน้อย\n\nในวันที่สิบ ลู่ไป๋ซานเอ่ยห้ามอีฮยอนที่กำลังจะเอื้อมมือไปถอนวัชพืชต้นหนึ่ง\n\n“อย่าถอนต้นนั้น”\n\n“มันดูไม่เหมือนหญ้าน้ำค้างเขียวนี่ขอรับ”\n\n“มันคือดอกชีพจรปฐพี แม้ไม่ใช่สมุนไพรวิญญาณ ทว่ารากของมันจะคอยดึงดูดปราณวิญญาณจากใต้ดินลึกขึ้นมาอย่างช้าๆ การปล่อยทิ้งไว้ตามขอบแปลงสมุนไพรสักสองสามต้นย่อมส่งผลดีต่อหญ้าน้ำค้างเขียวเช่นกัน”\n\nลู่ไป๋ซานชี้ไปยังผืนดินบริเวณรอบรากของมัน\n\n“ผู้เพาะปลูกพืชวิญญาณที่รู้จักเพียงแยกแยะวัชพืชออกจากสมุนไพรวิญญาณ ถือว่ามีคุณสมบัติเพียงครึ่งเดียวเท่านั้น อย่ามองแค่ต้นไม้ จงมองให้เห็นผืนป่าทั้งผืน เจ้าต้องมองภาพรวมให้ออกและเข้าใจว่าสิ่งใดเป็นภัยต่อแปลงสมุนไพรวิญญาณ และสิ่งใดเกื้อหนุนสรรพสิ่งซึ่งเติบโตอยู่ภายในนั้น”\n\n“ข้าจะจดจำไว้ขอรับ”\n\nนับจากวันนั้นเป็นต้นมา ลู่ไป๋ซานก็มักจะแวะเวียนมาอธิบายความรู้เรื่องแปลงสมุนไพรวิญญาณและสมุนไพรวิญญาณให้ฟังอยู่เนืองๆ ระหว่างทำงานด้วยกัน\n\nวันหนึ่ง ขณะอีฮยอนกำลังจัดระเบียบสิ่งของภายในห้องเก็บของ เขาก็พบตำราเก่าๆ เล่มหนึ่ง เมื่อเปิดอ่านดู ภายในไม่ได้มีเนื้อหามากไปกว่าความรู้พื้นฐานของโลกบำเพ็ญเพียร ทว่ามีตัวอักษรสองคำที่สะดุดตาเขาเข้า\n\n“ศิษย์พี่ลู่ สองคำนี้ก็อ่านออกเสียงว่า ‘ยองซิก’ เหมือนกันหรือขอรับ?”\n\n“ยองซิกคำไหนที่เจ้าว่า?”\n\nลู่ไป๋ซานชะโงกหน้ามองหน้าที่อีฮยอนเปิดค้างไว้ จากนั้นจึงใช้กิ่งไม้แห้งเขียนคำสองคำลงบนพื้นดิน\n\nพืชวิญญาณ (靈植)\n\nสัมผัสวิญญาณ (靈識)\n\n“ทั้งสองคำต่างอ่านออกเสียงว่ายองซิกเหมือนกัน ทว่าความหมายแตกต่างกัน คำว่าพืชวิญญาณ (靈植) เป็นคำเรียกเหมารวมของพืชพันธุ์ที่เติบโตโดยมีปราณวิญญาณหล่อเลี้ยงอยู่ภายใน ไม่ว่าจะเป็นธัญพืชวิญญาณ ผลไม้วิญญาณ พฤกษาวิญญาณ และสมุนไพรวิญญาณ ต่างก็จัดอยู่ในจำพวกนี้ทั้งหมด” [หมายเหตุผู้แปล: ในต้นฉบับภาษาเกาหลี คำว่า พืชวิญญาณ (靈植) และ สัมผัสวิญญาณ (靈識) ออกเสียงว่า “ยองซิก” เหมือนกัน]\n\nลู่ไป๋ซานชี้ไปยังคำที่สอง\n\n“ส่วนสัมผัสวิญญาณ (靈識) นั้นเป็นคำโบราณที่ใช้เรียกความสามารถของผู้บำเพ็ญเพียรในการรับรู้สิ่งรอบกายที่เหนือกว่าประสาทสัมผัสทางร่างกาย”\n\n“เดี๋ยวนี้ไม่ใช้คำนี้กันแล้วหรือขอรับ?”\n\n“เจ้าจะพบเจอได้บ่อยในตำราโบราณ แต่ในยุคปัจจุบัน ผู้คนส่วนใหญ่มักเรียกกันว่าสัมผัสเทวะเสียมากกว่า”\n\nลู่ไป๋ซานใช้ปลายกิ่งไม้ขีดเส้นยาวคั่นระหว่างคำทั้งสองที่เขียนไว้\n\n“เล่ากันว่าในยุคบรรพกาล ปราณวิญญาณฟ้าดินนั้นอุดมสมบูรณ์ยิ่งนัก แทนที่จะมานั่งปลูกสมุนไพรวิญญาณลงในแปลงและดูแลฟูมฟักอย่างตั้งใจ ผู้คนสมัยนั้นนิยมออกเสาะหาทรัพยากรวิญญาณที่เกิดขึ้นเองตามธรรมชาติในป่าเขาลำเนาไพรเสียมากกว่า ด้วยเหตุนี้ คำว่าสัมผัสวิญญาณจึงมักหมายถึงการรับรู้ของผู้บำเพ็ญเพียร ทว่าเมื่อปราณวิญญาณฟ้าดินค่อยๆ เสื่อมถอยลงและทรัพยากรวิญญาณตามธรรมชาติเริ่มขาดแคลน คนรุ่นหลังจึงเริ่มหันมาเพาะปลูกสมุนไพรวิญญาณ ธัญพืชวิญญาณ และพืชพันธุ์ทำนองนี้อย่างจริงจัง ครั้นศาสตร์ด้านพืชวิญญาณทวีความสำคัญขึ้น เหล่าผู้บำเพ็ญเพียรจึงเปลี่ยนมาใช้คำว่าสัมผัสเทวะแทนคำว่าสัมผัสวิญญาณแบบเดิมเพื่อความสะดวกในการสื่อสาร”\n\n“ผู้บำเพ็ญเพียรขั้นกลั่นลมปราณก็สามารถใช้สัมผัสเทวะได้ด้วยหรือขอรับ?”\n\n“ตอนที่เจ้าก้าวเข้าสู่ขั้นกลั่นลมปราณ เจ้าไม่รู้สึกหรือว่าเกิดประสาทสัมผัสใหม่ขึ้นมา? นั่นแหละคือสิ่งที่พวกเราเรียกว่าสัมผัสเทวะ แน่นอนว่าหากนำไปเทียบกับสัมผัสเทวะของผู้บำเพ็ญเพียรขั้นสร้างรากฐาน สิ่งที่ผู้ฝึกขั้นกลั่นลมปราณครอบครองก็แทบไม่ต่างอะไรจากเรื่องเล่นขายของของเด็ก...”\n\n“อย่างนี้นี่เองขอรับ”\n\n“ภาษาก็มีชีวิตจิตใจของมันเองไม่ต่างจากสมุนไพรวิญญาณ ย่อมเป็นเรื่องธรรมดาที่จะแปรเปลี่ยนไปตามกาลเวลา มิใช่หรือ?”\n\n...\n\nอีฮยอนตระหนักได้ในไม่ช้าว่าความรู้และประสบการณ์ด้านพืชวิญญาณของลู่ไป๋ซานนั้นเหนือล้ำกว่าบรรดาศิษย์พี่คนอื่นๆ บนยอดเขาแปลงสมุนไพรมากนัก\n\nลู่ไป๋ซานไม่ได้ดูแลแค่แปลงสมุนไพรวิญญาณหมายเลข 73 เพียงแห่งเดียว แต่ยังช่วยสอดส่องดูแลแปลงสมุนไพรขนาดเล็กอีกหลายแห่งในละแวกใกล้เคียง บ่อยครั้งที่มีศิษย์สายนอกซึ่งไม่อาจรับมือกับแมลงวิญญาณหรือโรคพืชได้เดินทางมาขอคำชี้แนะจากลู่ไป๋ซาน และหลังจากได้รับฟังคำอธิบายแล้ว ทุกคนต่างก็เอ่ยขอบคุณอย่างนอบน้อมก่อนจะจากไป\n\nบางครั้งลู่ไป๋ซานก็พาอีฮยอนเดินสำรวจแปลงสมุนไพรใกล้เคียงเพื่อแนะนำให้เขารู้จักกับพืชวิญญาณที่นิยมเพาะปลูกกันทั่วไปในฝ่ายนอก\n\nเขาประคองรวงข้าวสีเหลืองรวงหนึ่งขึ้นมา\n\n“นี่คือข้าวชิงเหอที่พวกเรากินกัน ต้องเก็บเกี่ยวทันทีที่รวงข้าวเปลี่ยนเป็นสีเหลืองเกินกว่าครึ่ง หากทำเช่นนั้น ปราณวิญญาณภายในจะยังคงอยู่ครบถ้วน”\n\nคราวนี้เขาชี้ไปยังกอหญ้าที่มีใบสีแดง\n\n“ส่วนนี่คือหญ้าห้ามเลือด สามารถนำมาพอกแผลได้โดยตรง หรือนำไปบดทำเป็นผงห้ามเลือดก็ได้ ฤทธิ์ยาของมันอ่อนก็จริง แต่เติบโตง่ายและมีความต้องการสูง จึงนิยมปลูกกันทั่วไปตามแปลงสมุนไพรวิญญาณของฝ่ายนอก”\n\nยิ่งลู่ไป๋ซานอธิบายมากเท่าไร อีฮยอนก็ยิ่งตระหนักว่าพืชวิญญาณมีความแตกต่างจากที่ตนเคยจินตนาการไว้หลายประการ\n\nพืชวิญญาณที่เขาเห็นมาจนถึงตอนนี้ไม่มีชนิดใดที่ต้องใช้เวลาเพาะปลูกยาวนานเลย บางชนิดใช้เวลาตั้งแต่หว่านเมล็ดจนถึงเก็บเกี่ยวไม่ถึงยี่สิบวันด้วยซ้ำ\n\n“ศิษย์พี่ลู่ หากพวกเราปล่อยพืชวิญญาณพวกนี้ไว้ไม่เก็บเกี่ยว แล้วเลี้ยงให้มันโตนานขึ้น ฤทธิ์ยาของมันก็น่าจะเข้มข้นขึ้นใช่ไหมขอรับ?”\n\n“ไม่เสมอไป พืชพันธุ์ส่วนใหญ่ที่พวกเราปลูกกันมีอายุขัยสั้น หากปล่อยทิ้งไว้นานเกินไป ฤทธิ์ยาจะเสื่อมสลาย และหลายชนิดก็จะเหี่ยวเฉาตายลงหลังจากออกเมล็ด”\n\nลู่ไป๋ซานเด็ดใบสีแดงของหญ้าห้ามเลือดมาใบหนึ่งแล้วขยี้เบาๆ ระหว่างปลายนิ้ว\n\n“หญ้าห้ามเลือดชนิดนี้จะให้ฤทธิ์ยาสูงสุดเมื่ออายุครบสามเดือน พอเลยหกเดือนไป ลำต้นจะแข็งกระด้างและให้น้ำยาน้อยลง หากขืนเลี้ยงไว้จนครบหนึ่งปี แทนที่จะมีฤทธิ์แรงขึ้น มันกลับจะกลายเป็นของไร้ประโยชน์ไปเสียฉิบ”\n\n“เช่นนั้นก็ไม่มีพืชวิญญาณชนิดใดที่ยิ่งอายุมากยิ่งล้ำค่าขึ้นเลยหรือขอรับ?”\n\n“พืชวิญญาณที่ฤทธิ์ยาเข้มข้นขึ้นตามกาลเวลามีอยู่มากมายถมเถไป ทว่าพันธุ์ล้ำค่าเหล่านั้นส่วนใหญ่ฝ่ายในจะเป็นผู้ดูแล”\n\n“แล้วคนอย่างข้าไม่มีทางหาเมล็ดพันธุ์พวกนั้นมาปลูกได้เลยหรือขอรับ?”\n\n“หากเป็นพันธุ์ล้ำค่าคงยากหน่อย แต่ถ้าเจ้าต้องการเพียงเมล็ดพันธุ์ของพืชวิญญาณระดับต่ำที่ต้องใช้เวลาเพาะปลูกหลายปีกว่าจะใช้งานได้ เจ้าสามารถหาซื้อได้ไม่ยากตามตลาดผู้บำเพ็ญเพียรที่เหล่าผู้บำเพ็ญเพียรอิสระนิยมไปเดินกัน เพียงแต่พวกมันไม่เป็นที่นิยมเท่านั้นเอง”\n\n“ไม่เป็นที่นิยมหรือขอรับ?”\n\n“ใช่ เหล่าผู้บำเพ็ญเพียรอิสระระดับกลั่นลมปราณที่ไม่ได้สังกัดทั้งสำนักหรือตระกูลใดมีอายุขัยสั้น และแทบไม่มีกะจิตกะใจจะมัวมานั่งคิดเผื่อคนรุ่นหลัง ต่อให้พวกเขาอุตส่าห์ฟูมฟักพืชวิญญาณจนผ่านไปหลายปีได้สำเร็จ บ่อยครั้งก็มักไร้กำลังมากพอจะปกป้องแปลงสมุนไพรของตนเอง จนลงเอยด้วยการถูกผู้อื่นแย่งชิงไปอยู่ดี เว้นเสียแต่ว่าพืชชนิดนั้นจะช่วยทำเงินเป็นศิลาวิญญาณให้ได้ในระยะเวลาอันสั้น มิเช่นนั้นย่อมไม่ค่อยมีใครสนใจหรอก”\n\n‘เรื่องมันไม่ง่ายอย่างที่คิดแฮะ แต่ถึงอย่างนั้นก็หมายความว่าในตลาดผู้บำเพ็ญเพียรยังมีเมล็ดพันธุ์ที่คุ้มค่าแก่การปลูกระยะยาววางขายอยู่สินะ สักวันข้าคงต้องลองไปเดินดูสักหน่อยแล้ว...’\n\n...\n\nวันหนึ่ง ลู่ไป๋ซานยื่นตำราสีเหลืองซีดสี่เล่มส่งมาให้อีฮยอน\n\nหน้าปกสลักชื่อไว้ว่า 《คู่มือเบื้องต้นว่าด้วยพืชวิญญาณ》, 《สารานุกรมสมุนไพรวิญญาณระดับ 1》, 《ปฐพีวิญญาณและชีพจรวารี》 และ 《ระเบียบข้อบังคับแปลงสมุนไพรหุบเขาชิงเหอ》\n\n“ตำราเหล่านี้รวบรวมความรู้พื้นฐานที่เจ้าจำเป็นต้องใช้กับพืชวิญญาณเอาไว้ ข้าให้เจ้ายืมอ่าน ดังนั้นระวังอย่าทำหายหรือทำเสียหายเชียว”\n\n“ขอบพระคุณขอรับ”\n\nนับจากวันนั้นเป็นต้นมา อีฮยอนก็จะหยิบตำราเหล่านั้นขึ้นมาอ่านเสมอในยามที่มีเวลาว่างสลับกับการบำเพ็ญเพียรหลังเลิกงาน\n\n...\n\nหลังจากนั้น ฤดูกาลก็หมุนเวียนเปลี่ยนผ่านไปหลายครา\n\nในฤดูใบไม้ผลิ ยอดอ่อนของหญ้าน้ำค้างเขียวแผ่คลุมแปลงสมุนไพรจนเขียวขจีไปทั่วผืน ส่วนฤดูร้อนก็เผชิญกับแมลงวิญญาณที่ระบาดชุกชุม ครั้นเข้าสู่ฤดูใบไม้ร่วง รวงสีเหลืองของข้าวชิงเหอก็โน้มตัวต่ำลง และในฤดูหนาว แผ่นน้ำแข็งบางๆ ก็ก่อตัวขึ้นเหนือร่องน้ำของยอดเขาแปลงสมุนไพร\n\nอีฮยอนทำกิจวัตรเดิมซ้ำไปซ้ำมาในทุกๆ วัน\n\nช่วงแรก แม้แต่หญ้าน้ำค้างเขียวเขาก็ยังมักจำสับสนกับวัชพืชอยู่บ่อยครั้ง ทว่าเมื่อเวลาผ่านไปหนึ่งปี เขาก็สามารถแยกแยะได้ทันทีว่าต้นใดไร้ซึ่งปราณวิญญาณเพียงแค่เหลือบมองสีสันของใบไม้\n\nเขายังเริ่มฝึกฝนวิชาพื้นฐานจากลู่ไป๋ซานอีกด้วย\n\nวิชาแรกที่เขาฝึกคือวิชาฝนวิญญาณ ก้อนเมฆก้อนแรกที่เขาสามารถเสกขึ้นมาได้ดูคล้ายกลุ่มหมอกจางๆ ที่ลอยอ้อยอิ่งอยู่เหนือฝ่ามือมากกว่าจะเรียกว่าก้อนเมฆจริงๆ มันหยดน้ำฝนลงมาได้เพียงสามหยดแล้วก็สลายหายไป\n\nกว่าเขาจะสามารถเรียกฝนให้ตกลงมาชุ่มฉ่ำได้ทั่วร่องปลูกสักหนึ่งร่อง ก็ต้องฝึกฝนซ้ำทุกวันติดต่อกันนานหลายเดือน\n\nถัดมา เขาได้เรียนรู้วิชาพลิกดิน\n\nการพลิกหน้าดินเบาๆ นั้นทำได้ไม่ยากนัก ทว่าการคัดแยกเฉพาะวัชพืชและกรวดหินออกมาโดยไม่กระทบกระเทือนรากของสมุนไพรวิญญาณกลับเป็นเรื่องหินยิ่ง มีอยู่ครั้งหนึ่งที่เขาเผลอควบคุมแรงไม่อยู่จนถอนต้นหญ้าน้ำค้างเขียวหลุดลอยขึ้นมาพร้อมกันสิบต้น ร้อนถึงลู่ไป๋ซานต้องเอ็ดเข้าให้ยกใหญ่\n\nวิชาที่สามและสี่ที่เขาได้เรียนรู้คือวิชาโลหะหยางกับวิชาผลิหน่อ\n\nวิชาโลหะหยางนับเป็นวิชาที่ยากที่สุดเท่าที่เขาเคยเรียนมา ช่วงแรก เข็มเงินพุ่งออกไปได้ไม่ไกลเกินความยาวหนึ่งนิ้วมือก็สลายตัวไปเสียก่อน กระทั่งพอเริ่มจับทางได้แล้ว เขาก็ยังคงเผลอแทงใบหญ้าน้ำค้างเขียวทะลุแทนที่จะโดนตัวแมลงวิญญาณอยู่บ่อยครั้ง\n\nแม้จะถูกจัดให้อยู่ในหมวดวิชาพื้นฐาน ทว่าการสังหารเฉพาะแมลงวิญญาณโดยไม่สร้างความเสียหายแก่สมุนไพรวิญญาณนั้นจำเป็นต้องอาศัยการควบคุมที่แม่นยำอย่างยิ่งยวด\n\nท้ายที่สุด อีฮยอนจึงฝึกฝนวิชาโลหะหยางต่อไปเรื่อยๆ ทว่าเวลาทำงานจริงก็ยังคงใช้วิธีจับแมลงวิญญาณมากำจัดด้วยมือเปล่าอยู่ดี\n\nยังดีที่อย่างน้อยวิชาผลิหน่อก็เรียนรู้ได้ง่ายกว่าวิชาโลหะหยาง\n\nเมื่อเขาแปรเปลี่ยนปราณแท้บรรพกาลให้เป็นธาตุไม้ รวบรวมไว้ที่ปลายนิ้ว แล้วถ่ายเทลงสู่เมล็ดพันธุ์ เขาก็สามารถรับรู้ได้ถึงพลังชีวิตอันแผ่วเบาที่สั่นไหวอยู่ภายในเปลือกแข็ง ทว่าหากเผลอส่งถ่ายพลังชีวิตเข้าไปมากเกินไป หน่ออ่อนก็จะบวมเป่งผิดปกติและเน่าเปื่อยลงอย่างรวดเร็ว\n\nกระทั่งล่วงเข้าสู่ช่วงปลายปีที่สอง อีฮยอนจึงสามารถเรียกได้เต็มปากว่าฝึกฝนวิชาทั้งสี่จนบรรลุขั้นเริ่มต้นได้สำเร็จในที่สุด\n\n“ศิษย์พี่ลู่ หรือว่าข้าจะขาดพรสวรรค์ในการฝึกฝนอาคมวิชาน่ะขอรับ?”\n\n“หืม? เปล่าเลย ในบรรดาศิษย์น้องทั้งหมดที่ข้าเคยพบเจอ ความเข้าใจด้านอาคมวิชาของเจ้าจัดอยู่ในระดับแนวหน้าด้วยซ้ำ เจ้าใช้วิชาได้คล่องแคล่วช่ำชองราวกับคนแก่อายุแปดสิบปี มากกว่าจะเป็นเด็กหนุ่มอายุยี่สิบเอ็ดปีเสียอีก”\n\n‘...’\n\n“แต่ข้าได้ยินมาว่าวิชาทั้งสี่นี้เป็นเพียงพื้นฐานของการเพาะปลูกพืชวิญญาณ ทว่าพวกมันกลับฝึกยากเย็นแสนเข็ญเหลือเกิน”\n\n“หึ ที่เรียกกันว่าวิชาพื้นฐานก็เพียงเพื่อให้สะดวกแก่ผู้สั่งงานเท่านั้นแหละ เจ้าคิดว่าในหุบเขาชิงเหอทั้งสำนัก มีใครบ้างไหมที่ฝึกวิชาโลหะหยางหรือวิชาผลิหน่อจนบรรลุขั้นสำเร็จใหญ่ได้แล้ว? การมีพลังวิญญาณมากกว่าไม่ได้หมายความว่าคนผู้นั้นจะใช้วิชาได้เก่งขึ้นโดยอัตโนมัติ สิ่งสำคัญอยู่ที่การทำความเข้าใจหลักการเบื้องหลังของมันต่างหาก”\n\n...\n\nขณะเดียวกัน อีฮยอนก็ยังคงบำเพ็ญเพียรอย่างสม่ำเสมอไม่เคยขาด\n\nความก้าวหน้าของเคล็ดเอกปราณบรรพกาลนั้นเชื่องช้าก็จริง ทว่าอีฮยอนหาได้ร้อนรนใจไม่ เมื่อฝึกฝนจนคุ้นชินแล้ว เขากระทั่งสามารถดูดซับปราณวิญญาณไปพร้อมๆ กับการเดินตรวจตรากลางแปลงสมุนไพรได้ด้วยซ้ำ\n\nหลังจากพากเพียรฝึกฝนทุกวี่วันไม่เว้นแม้แต่วันเดียว ในที่สุดเขาก็ทะลวงผ่านคอขวดเข้าสู่ขั้นกลั่นลมปราณ ระดับ 2 ได้สำเร็จในฤดูหนาวปีหนึ่ง หลังก้าวเข้าสู่สำนักมาได้สองปีครึ่ง\n\n“ในที่สุดก็ขั้นกลั่นลมปราณ ระดับ 2!”\n\nอีฮยอนรู้สึกพึงพอใจอย่างยิ่งกับความรู้สึกของขุมพลังที่เอ่อล้นไหลเวียนไปทั่วสรรพางค์กาย\n\nปราณแท้บรรพกาลในตันเถียนของเขาอุดมสมบูรณ์กว่าตอนเพิ่งเริ่มต้นอย่างเทียบไม่ติด และสัมผัสเทวะของเขาก็แข็งแกร่งขึ้นกว่าเดิมไม่น้อย แม้จะหลับตาอยู่ เขาก็สามารถรับรู้เค้าโครงของวัตถุในระยะสิบกว่าจั้ง (ราวสามสิบเมตร) ได้อย่างชัดเจน\n\n...\n\nชีวิตในแปลงสมุนไพรวิญญาณหมายเลข 73 นับว่าไม่เลวเลยทีเดียว\n\nลู่ไป๋ซานเป็นคนพูดน้อยแต่พึ่งพาได้ และอีฮยอนเองก็คุ้นชินกับงานที่นี่แล้ว ทุกครั้งที่เก็บเกี่ยวผลผลิตได้ดี เขายังได้รับแต้มคุณูปการเพิ่มเติมเล็กน้อยอีกด้วย\n\nดูเหมือนเขาจะสามารถใช้เวลาอยู่ที่นี่ต่ออีกสักไม่กี่ปี เพื่อเรียนรู้เรื่องพืชวิญญาณและอาคมวิชาต่างๆ ให้ถ่องแท้ จากนั้นค่อยหนีออกจากสำนักก่อนที่จะมีใครล่วงรู้ความจริงว่าเขาไม่แก่เฒ่า\n\n...\n\nหนึ่งเดือนต่อมา\n\nอีฮยอนกำลังใช้สมาธิเรียกกลุ่มเมฆด้วยวิชาฝนวิญญาณลอยอยู่เหนือแปลงสมุนไพร ขณะที่ลู่ไป๋ซานยืนอยู่อีกฝั่ง คอยตรวจดูว่าร่องน้ำที่อีฮยอนขุดไว้นั้นลึกเพียงพอหรือยัง\n\nทันใดนั้น เสียงร้องของนกกระเรียนก็ดังแว่วลงมาจากเบื้องบนเหนือแปลงสมุนไพร\n\n‘หืม?’\n\nนกกระเรียนกระดาษตัวหนึ่งปรากฏกายขึ้นกลางเวหา มันบินโฉบวนเหนือแปลงสมุนไพรหนึ่งรอบ ก่อนจะร่อนลงหยุดนิ่งอยู่ตรงหน้าลู่ไป๋ซาน แสงสว่างสายหนึ่งไหลออกมาจากป้ายประจำตัวของลู่ไป๋ซาน แล้วนกกระเรียนกระดาษก็คลี่กางออกเอง แปรเปลี่ยนกลายเป็นจดหมายฉบับหนึ่ง\n\nขณะไล่สายตาอ่านเนื้อความในจดหมาย สีหน้าของลู่ไป๋ซานก็ค่อยๆ เคร่งขรึมแข็งกร้าวขึ้นทีละน้อย\n\n“ศิษย์พี่ลู่ เกิดเรื่องอันใดขึ้นหรือขอรับ?”"
    }

  "story_memory": "# บันทึกความจำเนื้อเรื่องสะสม (Story Memory)\n\n## 📌 สรุปภาพรวมเนื้อเรื่องและสถานะปัจจุบัน (Arc & Current State Summary — อัปเดตถึงตอนที่ 7)\n- **ตัวตนและพลังลับพระเอก:** **อีฮยอน** (อดีตหนุ่มใหญ่วัย 40+ จากยุคปัจจุบัน) ทะลุมิติมาโลกเซียนเสียในร่างชายหนุ่มวัย ~19 ปีที่ **ไม่แก่ลงเลยตลอดเกือบ 40 ปี** (กระจกสำริดตรวจ **อายุกระดูกคงที่ 19 ปี** เสมอ, **รากวิญญาณสามธาตุ ไม้-ไฟ-ดิน**, ไม่มีระบบหน้าต่างสถานะ)\n- **เส้นทางสู่สำนัก:** อยู่หมู่บ้านไม้ขาว **แคว้นต้าเหยียน** 20 ปีจน **จางซาน** ทักเรื่องหน้าไม่แก่ จึงจัดฉากตายแล้วหนีไปใช้ชื่อปลอม **ลี่โม่** ขุดอุโมงค์หลบภัยอีก 10+ ปี จนกระทั่งหมู่บ้านถูกผู้บำเพ็ญเพียรสู้กันถล่ม จึงตัดสินใจเข้าสำนักสายสงบเพื่อเรียนรู้วิชาป้องกันตัวและปลูกสมุนไพรวิญญาณ\n- **สถานะล่าสุด (ตอนที่ 7):** เข้าเป็นศิษย์สายนอก **หุบเขาชิงเหอ** (เพื่อนร่วมห้อง **หวังเส้า** แยกไปสวนสัตว์วิญญาณ) เลือกฝึก **《เคล็ดเอกปราณบรรพกาล》** (ไร้ธาตุ ช้าแต่ปลอดภัย พร้อมเคล็ดลับ **กายาบรรพกาล** ท้ายเล่ม) ปัจจุบันช่วยศิษย์พี่อาวุโส **ลู่ไป๋ซาน** ดูแล **แปลงสมุนไพรวิญญาณหมายเลข 73**; เวลาผ่านไป **2 ปีครึ่งหลังเข้าสำนัก** อีฮยอนบรรลุ **ขั้นกลั่นลมปราณ ระดับ 2** (สัมผัสเทวะขยายสิบกว่าจั้ง) ล่าสุดมี **นกกระเรียนกระดาษ** ส่งจดหมายมาทำให้สีหน้าลู่ไป๋ซานเคร่งเครียด\n\n## 📖 บันทึกเหตุการณ์รายตอน\n## ตอนที่ 1 (Chapter 1)\n- **โลกเดิม:** อีฮยอน ชายวัย 40 กว่าปี ใช้ชีวิตเรียบง่าย สันโดษ อยู่คนเดียว ไม่สุงสิงกับใคร มีรายได้จากงานพาร์ทไทม์และเงินเก็บ วันหนึ่งขณะต้มน้ำจะกินบะหมี่กึ่งสำเร็จรูป จู่ๆ ก็เจ็บหน้าอกอย่างรุนแรง (หัวใจวาย) และเสียชีวิตลง\n- **ทะลุมิติ:** เขาตื่นขึ้นในกระท่อมไม้ทรุดโทรมในร่างชายหนุ่มวัยไม่เกิน 20 ปี ผอมโซ มือหยาบกร้าน ไม่มีรอยจำของเจ้าของร่างเดิม\n- **การใช้ชีวิตใหม่:** ผู้ใหญ่บ้านเล่าว่าชาวบ้านเก็บสมุนไพรพบเขาสลบอยู่บนทางขึ้นเขา อีฮยอนแสร้งทำเป็นความจำเสื่อม จำได้แค่ชื่อตัวเอง ที่นี่คือ **หมู่บ้านไม้ขาว** ทางตะวันตกของ **แคว้นต้าเหยียน** เขาเลือกอาชีพ **คนตัดฟืน** เพราะไม่ต้องสุงสิงกับคนเยอะ และซ่อมกระท่อมร้างเชิงเขาอยู่คนเดียว ใช้เวลาว่างจินตนาการแต่งเรื่องจากนิยาย/เกมเก่าๆ และแกะสลักตุ๊กตาไม้\n- **รู้ความจริงเรื่องโลก:** ฤดูใบไม้ผลิปีหนึ่ง เรือเหาะของ **สำนักเมฆคราม** ลงมาตรวจหา **รากวิญญาณ** ให้เด็กในหมู่บ้าน อีฮยอนจึงรู้ว่านี่คือ **โลกเซียนเสีย (บำเพ็ญเพียร)** ที่อันตราย เขาจึงปฏิเสธไม่ขอตรวจเพราะแค่อยากใช้ชีวิตสงบๆ\n- **จุดเปลี่ยนท้ายตอน:** เวลาผ่านไป **20 ปี** ชาวบ้านและเด็กๆ ต่างเติบโตและแก่ชราลง แต่อีฮยอนไม่เคยส่องกระจกเลยไม่ทันสังเกต จนกระทั่งวันหนึ่งเขาลงมาขายฟืนและพบ **จางซาน** (เด็กขี้มูกโป่งที่เคยขอตุ๊กตาไม้เมื่อ 20 ปีก่อน) ซึ่งโตเป็นผู้ใหญ่แล้ว จางซานตกใจมากเพราะ **หน้าตาของอีฮยอนยังเหมือนเดิมไม่เปลี่ยนเลยแม้แต่น้อยตลอด 20 ปี**\n\n## ตอนที่ 2 (Chapter 2)\n- **หนีออกจากหมู่บ้านไม้ขาว:** อีฮยอนส่องน้ำดูหน้าตัวเองและลองเรียก \"หน้าต่างสถานะ/ระบบ\" แต่ไม่มีอะไรเกิดขึ้น เขากลัวว่าหากข่าวเรื่องคนธรรมดาไม่แก่เฒ่าหลุดออกไปจะถูกผู้บำเพ็ญเพียรจับไปทดลอง ยึดร่าง หรือหลอมเป็นโอสถ จึงแกล้งจัดฉากว่าโดนสัตว์ป่าขย้ำ (พังรั้ว กรีดรอยเล็บบนประตู สาดเลือดกระต่ายป่า) แล้วหนีข้ามเขาก่อนรุ่งสาง\n- **หมู่บ้านที่สองและการขุดอุโมงค์:** อีฮยอนหนีไปตั้งรกรากห่างออกไปหลายร้อยลี้ เปลี่ยนชื่อเป็น **ลี่โม่** สร้างกระท่อมใกล้หน้าผา แล้วค่อยๆ ขุดห้องใต้ดินเชื่อมเป็นอุโมงค์ยาวทะลุไปอีกฝั่งของป่า ใช้เวลาหลายปีทำทางหนีทีไล่และเตรียมเสบียงไว้เผื่อฉุกเฉิน\n- **เหตุการณ์สู้รบของผู้บำเพ็ญเพียร (~10 ปีต่อมา):** เวลาผ่านไปอีก 10 ปี หน้าตาเขาก็ยังไม่แก่ลง คืนฤดูร้อนหนึ่งเกิดการต่อสู้กลางเวหาระหว่างผู้บำเพ็ญเพียรชุดแดง (ใช้ไฟ) กับชุดน้ำเงิน (ใช้กระบี่บิน) ลูกไฟลูกหนึ่งพุ่งมาถล่มกระท่อมของอีฮยอนและหมู่บ้าน อีฮยอนมุดอุโมงค์หนีเอาชีวิตรอดมาได้ แต่กระท่อมพังเกินครึ่งและป่าไหม้เกรียม ทำให้เขาตระหนักว่า \"ไม่แก่เฒ่า ไม่ได้แปลว่าไม่มีวันตาย\" ต่อให้อยู่เงียบๆ เป็นคนธรรมดาก็อาจโดนลูกหลงตายได้ทุกเมื่อ\n- **ตัดสินใจเข้าสำนัก:** อีฮยอนจึงคิดจะเข้าสำนักเพื่อฝึกวิชาพอป้องกันตัว เรียนรู้การปลูกสมุนไพรวิญญาณและหลอมโอสถ (เพราะเขามีเวลามากพอจะปลูกสมุนไพรวิญญาณพันปีได้เองโดยไม่ต้องเสี่ยงเข้าแดนลับ) จากนั้นค่อยแอบหนีไปซ่อนตัวเงียบๆ\n- **เข้าสู่หุบเขาชิงเหอ (+5 ปีสืบข่าว และ +2 ปีเดินทาง/คัดเลือก):** หลังจากสืบข่าวอยู่ 5 ปี เขาเลือกสำนัก **หุบเขาชิงเหอ** ทางตะวันตกเฉียงใต้ของแคว้นต้าเหยียนซึ่งเน้นปลูกสมุนไพรวิญญาณและสงบสุข อีก 2 ปีต่อมาเขากลับมาใช้ชื่อจริง **อีฮยอน** เข้ารับการทดสอบที่ประตูขุนเขา:\n  - ตรวจพบ **รากวิญญาณสามธาตุ (ไม้ ไฟ ดิน)**\n  - ตรวจ **อายุกระดูก** ด้วยกระจกสำริด ผลปรากฏว่า **อายุกระดูกยังคงอยู่ที่ 19 ปี** ทั้งที่อยู่โลกนี้มาแล้วเกือบ 40 ปี! อีฮยอนจึงผ่านการคัดเลือกเข้าสู่หุบเขาชิงเหอสำเร็จ\n\n## ตอนที่ 3 (Chapter 3)\n- **สถานะว่าที่ศิษย์สายนอก:** จากผู้สมัครนับร้อยมีผู้รอดไม่ถึง 50 คน **หวังจิ้น** ผู้ดูแลฝ่ายนอกคัด 4 คนรากวิญญาณดีเป็นว่าที่ศิษย์สายใน (อีฮยอนโล่งใจที่ไม่ถูกเลือก เพราะกลัวถูกตรวจร่างกายละเอียด) ที่เหลือเป็นว่าที่ศิษย์สายนอก มีเวลา 100 วันในการชักนำปราณเข้าสู่ร่างให้ถึง **ขั้นกลั่นลมปราณ ระดับ 1** และต้องประพฤติดีด้วย มิเช่นนั้นจะถูกส่งลงเขตงานใช้แรงงานหรือไล่ออกจากสำนัก\n- **ที่พักและเพื่อนร่วมห้อง:** อีฮยอนได้ป้ายประจำตัวไม้พิเศษ พักที่เชิง **ยอดเขาแปลงสมุนไพร** คู่กับ **หวังเส้า** (วัย 16 ปี รากวิญญาณสามธาตุ ดิน ทอง น้ำ ที่ฝันอยากเป็นศิษย์สายใน)\n- **การฝึกฝน:** ได้รับตำรา 3 เล่ม โดยเฉพาะ 《เคล็ดชักนำปราณชิงเหอ》 (ไร้ธาตุ) อีฮยอนเริ่มต้นช้ากว่าคนอื่น แต่ขยันฝึกอย่างใจเย็นไม่หักโหม (มีเด็กที่สัมผัสปราณได้ตั้งแต่วันที่ 3 รีบร้อนจนกระอักเลือดเข้าเรือนโอสถรักษา)\n- **ชักนำปราณและบรรลุระดับ 1:** คืนวันที่ 20 อีฮยอนรับรู้ปราณทั้งสามธาตุและเลือกดึงธาตุไม้ (พลังคล้ายยอดอ่อน) เข้าตันเถียนได้สำเร็จ และเมื่อครบ **1 เดือนเต็ม** ในสำนัก ปราณวิญญาณในตันเถียนก็ถึงจุดวิกฤต ทะลวงเส้นลมปราณจนสำเร็จ **ขั้นกลั่นลมปราณ ระดับ 1** ประสาทสัมผัสและพละกำลังพัฒนาขึ้นอย่างก้าวกระโดด\n\n## ตอนที่ 4 (Chapter 4)\n- **ชำระล้างไขกระดูกและทดสอบพลังใหม่:** หลังบรรลุ **ขั้นกลั่นลมปราณ ระดับ 1** ร่างกายของอีฮยอนขับคราบไคลสีดำอมเหลืองกลิ่นเหม็นคลุ้งออกมาทั่วตัว เขาจึงรีบย่องไปอาบน้ำที่ลำธารเชิงเขาก่อนรุ่งสาง (พบว่าก้าวเท้าแรงกว่าเดิมมากและชุดของสำนักซักคราบออกง่าย แห้งไวในพริบตา) พละกำลังเพิ่มขึ้นมากจนยกหินขนาดเท่าศีรษะด้วยมือเดียวได้สบายๆ และกระโดดขึ้นเนินชันได้โดยไม่หอบเหนื่อย ประสาทสัมผัสเฉียบคมและผิวพรรณดูผ่องใสขึ้น\n- **ความก้าวหน้าของรุ่น:** เช้าวันนั้น **หวังจิ้น** ประกาศว่าอีฮยอนชักนำปราณเข้าสู่ร่างสำเร็จเป็น **คนที่ 7** ในรุ่น (เตือนไม่ให้ประมาทจนเจ็บตัว) **หวังเส้า** ตื่นเต้นถามไม่หยุดและทำสำเร็จตามมาในอีกไม่กี่วันถัดมา พอถึงวันที่ 50 เหลือคนไม่ถึงห้าคนที่ยังไม่รับรู้ปราณ และวันที่ 90 เหลือเพียง 3 คนที่ยังไม่ได้เข้าขั้นกลั่นลมปราณ ระดับ 1 (ถูกกั้นฉากพับแยกฝึก)\n- **การเลือกวิชาบำเพ็ญเพียรสายนอก (วันที่ 90):** หวังจิ้นนำตำราวิชาพื้นฐาน 6 เล่มมาให้ผู้ที่เข้าขั้นกลั่นลมปราณ ระดับ 1 เลือกเพื่อฝึกเลื่อนสู่ระดับ 2 ขึ้นไป (เปลี่ยนวิชาได้ก่อนระดับ 3 แต่ต้องสลายพลังเดิมแทบหมด):\n  1. **《เคล็ดพฤกษาเขียวหล่อเลี้ยงพลังชีวิต》 (ธาตุไม้):** ความเร็วปานกลาง อ่อนโยน ฟื้นฟูเส้นลมปราณไว ช่วยรับรู้พลังชีวิตสมุนไพรวิญญาณ\n  2. **《เคล็ดเพลิงชาด》 (ธาตุไฟ):** ฝึกเร็วที่สุด พลังดุดัน เหมาะกับวิชาไฟและหลอมโอสถ แต่กราดเกรี้ยว เส้นลมปราณไหม้ง่าย เกิดพิษไฟสะสม\n  3. **《เคล็ดปฐพีราชัน》 (ธาตุดิน):** ฝึกช้า พลังหนักแน่นมั่นคง เหมาะกับวิชาป้องกัน แปลงสมุนไพรวิญญาณ และค่ายกล\n  4. **《เคล็ดคมโลหะ》 (ธาตุทอง):** โจมตีคมกริบ แต่กัดกร่อนเส้นลมปราณ ต้องใช้ยาบำรุงเยอะและสิ้นเปลือง\n  5. **《เคล็ดวารีเร้นลับ》 (ธาตุน้ำ):** ไหลลื่นพลิกแพลงเข้ากับวิชาหลากหลาย แต่สะสมไอเย็นในร่างกาย\n  6. **《เคล็ดเอกปราณบรรพกาล》 (ไร้ธาตุ):** ฝึกช้าที่สุด แต่ปลอดภัยจากธาตุไฟเข้าแทรกมากที่สุด และกลั่นเป็น **ปราณแท้บรรพกาล** ที่แปลงใช้วิชาต่างธาตุได้แม้พลังจะลดลงบ้าง\n- **สถานการณ์ของหุบเขาชิงเหอ:** หวังจิ้นสาธิตวิชาพื้นฐานของผู้เพาะปลูกพืชวิญญาณ 4 ธาตุ ได้แก่ **วิชาฝนวิญญาณ** (น้ำ), **วิชาพลิกดิน** (ดิน), **วิชาโลหะหยาง** (ทอง) และ **วิชาผลิหน่อ** (ไม้) พร้อมเปิดเผยว่าหุบเขาชิงเหอมีเพียง **บรรพชนขั้นแก่นทองคำ** หนึ่งท่าน ที่เหลืออยู่ขั้นสร้างรากฐานลงมา และที่ดินคุณภาพด้อยจึงต้องขยายแปลงกว้าง คนไม่พอจะแบ่งงานตามธาตุ จึงอยากให้ศิษย์เลือก《เคล็ดเอกปราณบรรพกาล》 แต่คนส่วนใหญ่เมินเพราะฝึกช้า ต่างจากอีฮยอนที่มีอายุยืนยาวไม่แก่เฒ่าและเริ่มสนใจ《เคล็ดเอกปราณบรรพกาล》ขึ้นมา\n\n## ตอนที่ 5 (Chapter 5)\n- **เลือกวิชาบำเพ็ญเพียร:** **หวังจิ้น** โน้มน้าวข้อดีของ **《เคล็ดเอกปราณบรรพกาล》** เพิ่ม (ฝึกจนชำนาญแล้วเดิน ยืน หรือนอนก็ฝึกได้ และเมื่อเป็นศิษย์สายในสามารถแปลงปราณแท้บรรพกาลไปใช้วิชาชั้นสูงได้โดยไม่ต้องสลายพลังเดิม) ทำให้เด็กเกินครึ่งรวมทั้ง **อีฮยอน** เลือกวิชานี้ อีฮยอนไม่ได้หวังเป็นศิษย์สายใน แต่ต้องการใช้วิชาหลายธาตุเพาะปลูกพืชวิญญาณด้วยตนเองได้\n- **ความลับเรื่อง \"กายาบรรพกาล\":** ท้ายตำรา《เคล็ดเอกปราณบรรพกาล》มีบันทึกเรื่อง **กายาบรรพกาล** ซึ่งเปลี่ยนทั่วทั้งร่างให้เป็นตันเถียนแทนที่จะเก็บพลังไว้แค่จุดเดียวใต้สะดือ หวังจิ้นอธิบายว่าแม้จะทำให้ร่างกายแกร่งขึ้นและจุพลังมหาศาล แต่กินปริมาตรมากกว่าตันเถียน 50–100 เท่า ทำให้การควบแน่นพลังเป็นแก่นปราณแท้เพื่อขึ้น **ขั้นสร้างรากฐาน** ยากจนแทบเป็นไปไม่ได้และเปลือง **โอสถสร้างรากฐาน** มหาศาลภายในอายุขัย 100–150 ปี เด็กคนอื่นจึงหมดความสนใจ แต่อีฮยอนที่มีเวลาไม่จำกัดกลับสนใจมาก ตั้งใจจะฝึก《เคล็ดเอกปราณบรรพกาล》และเรียนเรื่องพืชวิญญาณก่อน แล้วค่อยหนีออกจากสำนักไปขุดอุโมงค์ซ่อนตัวฝึกกายาบรรพกาลทีหลัง\n- **บทสนทนากับหวังเส้า:** **หวังเส้า** เลือก **《เคล็ดคมโลหะ》** เพราะอยากเป็น **ผู้ฝึกกระบี่** และคิดว่าการเป็นศิษย์สายในจากงานพืชวิญญาณเป็นกับดัก อีฮยอนแกล้งดุเพื่อเตือนให้ระวังคำพูด และปฏิเสธการต่อสู้เพราะไม่อยากฆ่าใคร จากนั้นอีฮยอนเริ่มอ่านและฝึก《เคล็ดเอกปราณบรรพกาล》 โดยหวังจะรีบถึง **ขั้นเริ่มต้น** เพื่อจะได้นอนบำเพ็ญเพียรได้สบายๆ\n- **สัมภาษณ์จัดสรรหน้าที่ และวันที่ 100:** ไม่กี่วันต่อมา หวังจิ้นเรียกสัมภาษณ์ อีฮยอนแจ้งตรงๆ ว่าอยากเรียนปลูกพืชวิญญาณ/สมุนไพรวิญญาณเพราะปลอดภัยกว่าสู้กับคน และเลือกฝึก《เคล็ดเอกปราณบรรพกาล》 หวังจิ้นชมว่าซื่อตรงและเลือกได้ดี พร้อมเตือนว่างานพืชวิญญาณก็ไม่ง่าย (มีทั้งแมลงวิญญาณ โรคพืช ฝนวิญญาณ และไอพิษจากสมุนไพร) จนกระทั่งเช้าวันที่ **100** ทุกคนมารวมตัวที่โถงเพื่อรับการแต่งตั้งเป็น **ศิษย์สายนอก** อย่างเป็นทางการและรับมอบหมายหน้าที่กับที่พักใหม่\n\n## ตอนที่ 6 (Chapter 6)\n- **บทสรุปวันที่ 100:** ในวันที่ครบกำหนด **จูหมิง** ที่ชักนำปราณไม่สำเร็จแต่ขยันฝึกถูกส่งไป **เขตงานใช้แรงงาน** (ให้โอกาส 6 เดือน) ส่วน **เกาเจ๋อ** ที่ขี้เกียจถูกไล่ออกจากสำนักไป ส่วนผู้ที่ผ่านทุกคนได้รับการแต่งตั้งเป็น **ศิษย์สายนอก** อย่างเป็นทางการ\n- **สวัสดิการและถุงเก็บของ:** ศิษย์สายนอกได้ป้ายประจำตัวไม้สีน้ำเงินเข้มเกือบดำอันใหม่ พร้อม **ถุงเก็บของ** ภายในมี **ศิลาวิญญาณระดับต่ำ** 1 ก้อน และ **โอสถอิ่มทิพย์** 10 เม็ดต่อเดือน รวมถึง **10 แต้มคุณูปการ** บนป้ายประจำตัว หวังจิ้นสอนวิธีส่งพลังวิญญาณเปิดถุงเก็บของ เตือนว่าอย่าดูดซับศิลาวิญญาณตรงๆ เพราะสูญเสียเกินครึ่ง (ไว้ใช้กับค่ายกลรวมปราณแบบพกพาที่หอศาสตรา ราคาอย่างต่ำ 50 ก้อน) และห้ามใส่สิ่งมีชีวิตลงถุง\n- **แยกย้ายจากหวังเส้า:** **หวังเส้า** ถูกส่งไป **สวนสัตว์วิญญาณ** เพื่อดูแล **กวางเขาคราม** (สัตว์วิญญาณระดับ 1) ตามเส้นทางฝึกพื้นฐานของผู้ฝึกกระบี่ ทั้งคู่เก็บข้าวของลงถุงเก็บของ ชนหมัดอำลาและสัญญาว่าจะไปเจอกันอีกทีในฝ่ายใน (โดยที่อีฮยอนไม่ได้คิดจะเข้าฝ่ายในจริงๆ)\n- **รายงานตัวที่แปลงสมุนไพรวิญญาณหมายเลข 73:** อีฮยอนได้รับมอบหมายเป็น **ผู้ช่วยผู้ดูแลแปลงสมุนไพรวิญญาณหมายเลข 73** บน **ยอดเขาแปลงสมุนไพร** เขาเดินผ่านแปลงสมุนไพรขั้นบันไดและพบ **ศิษย์พี่ลู่ไป๋ซาน** ชายชราผมขาวผู้ดูแลแปลงมานาน ลู่ไป๋ซานพาอีฮยอนเข้าเรือนพัก/โรงทำงานกลางแปลง และถามถึงเคล็ดวิชาที่อีฮยอนฝึก เมื่อรู้ว่าเป็น **《เคล็ดเอกปราณบรรพกาล》** ก็เดาะลิ้นทักว่าหวังจิ้นแนะนำวิชานี้อีกแล้ว ทำให้อีฮยอนถามกลับว่าเคล็ดวิชานี้มีปัญหาอะไรหรือไม่\n\n## ตอนที่ 7 (Chapter 7)\n- **เริ่มงานที่แปลงสมุนไพรวิญญาณหมายเลข 73:** **ลู่ไป๋ซาน** ให้ห้องพักในเรือนแก่อีฮยอน และเริ่มงานวันแรกด้วยการถอนวัชพืชออกจากแปลง **หญ้าน้ำค้างเขียว** ด้วยมือเปล่า (สอนให้รู้จัก **แมลงกระดองเขียว** ที่เป็นศัตรูพืช และ **ไส้เดือนวิญญาณดิน** ที่ช่วยกระจายปราณในดิน รวมถึงห้ามรบกวนดินหลังตะวันตกดินเพราะน้ำค้างจะไหลกลับสู่ราก) ตอนเย็นหุง **ข้าวชิงเหอ** (ธัญพืชวิญญาณระดับ 1 ขั้นกลาง) กินด้วยกัน ทำให้อีฮยอนรู้สึกว่าปราณแท้บรรพกาลเพิ่มขึ้นเล็กน้อย\n- **คำสอนของลู่ไป๋ซาน:** วันที่ 10 ลู่ไป๋ซานห้ามอีฮยอนถอน **ดอกชีพจรปฐพี** (ช่วยดึงปราณจากใต้ดินมาหล่อเลี้ยงแปลง) พร้อมสอนให้มองภาพรวมทั้งแปลงและช่วยอธิบายความต่างระหว่าง **พืชวิญญาณ** กับ **สัมผัสวิญญาณ** (ซึ่งยุคนี้เรียกว่า **สัมผัสเทวะ**) รวมถึงอธิบายว่าพืชวิญญาณสายนอกส่วนใหญ่มีอายุสั้น (เช่น **หญ้าห้ามเลือด** เก็บที่ 3 เดือน) ส่วนเมล็ดพันธุ์ระยะยาวหาซื้อได้ตาม **ตลาดผู้บำเพ็ญเพียร** เพราะผู้บำเพ็ญเพียรอิสระไม่นิยมปลูก\n- **ฝึกฝนวิชาทั้งสี่และเลื่อนขั้น (เวลาผ่านไป ~2 ปีครึ่ง):** ลู่ไป๋ซานให้ยืมตำรา 4 เล่มเกี่ยวกับพืชวิญญาณ อีฮยอนฝึก **วิชาฝนวิญญาณ**, **วิชาพลิกดิน**, **วิชาโลหะหยาง** (ยากที่สุดจนต้องจับแมลงด้วยมือไปก่อน) และ **วิชาผลิหน่อ** จนบรรลุ **ขั้นเริ่มต้น** ทั้งสี่วิชาในช่วงปลายปีที่ 2 ลู่ไป๋ซานชมว่าเข้าใจวิชาคล่องแคล่วราวคนแก่อายุ 80 ปี และในฤดูหนาว **2 ปีครึ่งหลังเข้าสำนัก** อีฮยอนก็บรรลุ **ขั้นกลั่นลมปราณ ระดับ 2** สัมผัสเทวะขยายออกไปสิบกว่าจั้ง (ราว 30 เมตร)\n- **จดหมายนกกระเรียน (1 เดือนต่อมา):** ขณะทำงานร่วมกัน มี **นกกระเรียนกระดาษ** บินมาส่งจดหมายให้ลู่ไป๋ซาน พออ่านจบสีหน้าของลู่ไป๋ซานก็เคร่งขรึมแข็งกร้าวขึ้นทันที\n"
};

</script>
  <script>
    const STORAGE_PREFIX = "lee_hyun_xianxia";
    const data = window.NOVEL_DATA || { novel_title: "บันทึกบำเพ็ญเพียรของคนตัดฟืนผู้ไม่แก่เฒ่า (Lee Hyun)", chapters: [], illustrations: [] };
    let currentIdx = parseInt(localStorage.getItem(STORAGE_PREFIX + "_ch_idx") || "0", 10);
    let fontSize = parseInt(localStorage.getItem("novel_reader_font_size") || "20", 10);
    let theme = localStorage.getItem("novel_hub_theme") || "dark";
    let currentVolIdx = 0;
    let illustViewMode = localStorage.getItem("novel_reader_illust_view") || "vertical";
    let currentLightboxIdx = 0;

    function goBookshelf() {
      if (location.protocol === "file:") {
        location.href = "../คลังนิยายทั้งหมด.html";
      } else {
        location.href = "../index.html";
      }
    }

    function formatBody(text) {
      const paras = text.split(/\n\s*\n/);
      return paras.map(p => {
        const trimmed = p.trim();
        if (!trimmed) return "";
        if (trimmed === "***" || trimmed === "...") return "<hr/>";
        const html = trimmed
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/\n/g, "<br/>");
        return `<p>${html}</p>`;
      }).join("");
    }

    function updateIllustButtonLabel() {
      const vols = data.illustrations || [];
      const total = vols.reduce((acc, v) => acc + ((v.images || []).length), 0);
      const btn = document.getElementById("btnIllust");
      if (btn) {
        btn.textContent = total > 0 ? `🖼️ ภาพประกอบ (${total})` : `🖼️ ภาพประกอบ`;
      }
    }

    function render() {
      document.getElementById("novelTitle").textContent = data.novel_title || "คลังนิยาย";
      updateIllustButtonLabel();
      const chapters = data.chapters || [];
      if (currentIdx >= chapters.length) currentIdx = Math.max(0, chapters.length - 1);

      const volSel = document.getElementById("volumeSelect");
      const sel = document.getElementById("chapterSelect");
      volSel.innerHTML = "";
      sel.innerHTML = "";

      const ch = chapters[currentIdx];
      if (!ch) {
        document.getElementById("volumeBadge").textContent = "";
        document.getElementById("chapterTitle").textContent = "ยังไม่มีตอนที่แปล";
        document.getElementById("chapterBody").innerHTML = "";
        return;
      }

      const volumes = [];
      chapters.forEach(item => {
        const v = item.volume || "เล่ม 1";
        if (!volumes.includes(v)) volumes.push(v);
      });
      volumes.forEach(v => {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = `📘 ${v}`;
        volSel.appendChild(opt);
      });

      const currentVol = ch.volume || "เล่ม 1";
      volSel.value = currentVol;
      volSel.style.display = volumes.length > 1 ? "" : "none";

      chapters.forEach((item, idx) => {
        if ((item.volume || "เล่ม 1") !== currentVol) return;
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = `${item.title}`;
        sel.appendChild(opt);
      });
      sel.value = currentIdx;

      document.getElementById("volumeBadge").textContent = `📘 ${currentVol}`;
      document.getElementById("chapterTitle").textContent = ch.title;
      document.getElementById("chapterBody").innerHTML = formatBody(ch.content);
      document.getElementById("pageIndicator").textContent = `${currentVol} • ตอนที่ ${currentIdx + 1} จากทั้งหมด ${chapters.length} ตอนที่แปลแล้ว`;

      const hasPrev = currentIdx > 0;
      const hasNext = currentIdx < chapters.length - 1;
      document.getElementById("btnPrevTop").disabled = !hasPrev;
      document.getElementById("btnPrevBottom").disabled = !hasPrev;
      document.getElementById("btnNextTop").disabled = !hasNext;
      document.getElementById("btnNextBottom").disabled = !hasNext;

      localStorage.setItem(STORAGE_PREFIX + "_ch_idx", String(currentIdx));
      localStorage.setItem(STORAGE_PREFIX + "_ch_title", ch.title || "");
      updateScrollProgress();
    }

    function selectVolume(volName) {
      const chapters = data.chapters || [];
      const firstIdx = chapters.findIndex(item => (item.volume || "เล่ม 1") === volName);
      if (firstIdx !== -1) {
        selectChapter(firstIdx);
      }
    }

    function selectChapter(idx) {
      currentIdx = parseInt(idx, 10);
      localStorage.setItem(STORAGE_PREFIX + "_scroll_y", "0");
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function prevChapter() { if (currentIdx > 0) selectChapter(currentIdx - 1); }
    function nextChapter() { if (currentIdx < (data.chapters || []).length - 1) selectChapter(currentIdx + 1); }

    function changeFont(delta) {
      fontSize = Math.max(14, Math.min(32, fontSize + delta));
      document.documentElement.style.setProperty("--font-size", fontSize + "px");
      localStorage.setItem("novel_reader_font_size", String(fontSize));
    }

    function setTheme(t) {
      theme = t;
      document.body.classList.remove("theme-sepia", "theme-light");
      if (t !== "dark") {
        document.body.classList.add("theme-" + t);
      }
      document.getElementById("tDark").classList.toggle("active", t === "dark");
      document.getElementById("tSepia").classList.toggle("active", t === "sepia");
      document.getElementById("tLight").classList.toggle("active", t === "light");
      localStorage.setItem("novel_hub_theme", t);
    }

    function toggleMenu(hide) {
      const shouldHide = typeof hide === "boolean"
        ? hide
        : !document.body.classList.contains("menu-hidden");
      document.body.classList.toggle("menu-hidden", shouldHide);
      localStorage.setItem("novel_reader_menu_hidden", shouldHide ? "1" : "0");
    }

    function openModal(type) {
      const m = document.getElementById("infoModal");
      const title = document.getElementById("modalTitle");
      const content = document.getElementById("modalContent");
      if (type === "glossary") {
        title.textContent = "📚 คัมภีร์ตัวละคร คำศัพท์ และสรรพนาม";
        content.textContent = data.glossary || "";
      } else {
        title.textContent = "🧠 เรื่องย่อสะสมแต่ละตอน";
        content.textContent = data.story_memory || "";
      }
      m.classList.add("open");
    }
    function closeModal() {
      document.getElementById("infoModal").classList.remove("open");
    }

    function openIllustModal() {
      const vols = data.illustrations || [];
      const firstWithImgs = vols.findIndex(v => (v.images || []).length > 0);
      if (firstWithImgs !== -1 && ((vols[currentVolIdx] || {}).images || []).length === 0) {
        currentVolIdx = firstWithImgs;
      }
      renderIllustModal();
      document.getElementById("illustModal").classList.add("open");
    }
    function closeIllustModal() {
      document.getElementById("illustModal").classList.remove("open");
    }
    function setIllustView(mode) {
      illustViewMode = mode;
      localStorage.setItem("novel_reader_illust_view", mode);
      renderIllustModal();
    }
    function selectIllustVol(idx) {
      currentVolIdx = idx;
      renderIllustModal();
    }
    function renderIllustModal() {
      const vols = data.illustrations || [];
      const tabList = document.getElementById("volTabList");
      const container = document.getElementById("illustContainer");
      document.getElementById("btnViewVertical").classList.toggle("active", illustViewMode === "vertical");
      document.getElementById("btnViewGrid").classList.toggle("active", illustViewMode === "grid");

      tabList.innerHTML = "";
      vols.forEach((v, idx) => {
        const count = (v.images || []).length;
        const btn = document.createElement("button");
        btn.className = idx === currentVolIdx ? "active" : "";
        btn.textContent = `📁 ${v.volume} (${count})`;
        btn.onclick = () => selectIllustVol(idx);
        tabList.appendChild(btn);
      });

      const activeVol = vols[currentVolIdx];
      const imgs = activeVol ? (activeVol.images || []) : [];

      if (!activeVol || imgs.length === 0) {
        const folderName = activeVol ? activeVol.volume : "เล่ม 1";
        container.innerHTML = `
          <div class="empty-illust-guide">
            <strong style="color: var(--accent); font-size: 16px;">💡 ยังไม่มีรูปภาพในโฟลเดอร์ "${folderName}"</strong>
            <p style="margin: 10px 0 6px;">วิธีเพิ่มภาพประกอบไลท์โนเวลแบบแยกตามเล่มง่ายๆ:</p>
            <ol style="margin: 0; padding-left: 22px;">
              <li>นำไฟล์รูปภาพ (<code>.jpg</code>, <code>.png</code>, <code>.webp</code>) ไปวางใส่โฟลเดอร์ <code>illustrations/${folderName}/</code> (หรือสร้างโฟลเดอร์ <code>เล่ม 1</code>, <code>เล่ม 2</code>, <code>เล่ม 3</code> เพิ่มได้ตามต้องการ)</li>
              <li>ตั้งชื่อไฟล์เรียงตามลำดับ เช่น <code>00_cover.jpg</code>, <code>01.jpg</code>, <code>02.jpg</code> ระบบจะเรียงรูปให้ตามตัวเลขและนำรูป cover ขึ้นเป็นหน้าปกให้เอง</li>
              <li>ดับเบิลคลิกไฟล์ <code>เปิดคลังนิยายทั้งหมด.bat</code> หรือ <code>เปิดอ่านนิยาย.bat</code> รูปทั้งหมดจะแสดงในหน้านี้ทันทีครับ!</li>
            </ol>
          </div>
        `;
        return;
      }

      const listClass = illustViewMode === "grid" ? "illust-list-grid" : "illust-list-vertical";
      container.innerHTML = `<div class="${listClass}">` + imgs.map((img, i) => `
        <div class="illust-card" onclick="openLightbox(${i})">
          <img src="${encodeURI(img.src)}" alt="${img.name}" loading="lazy" />
          <div class="illust-caption">${i + 1}. ${img.name}</div>
        </div>
      `).join("") + `</div>`;
    }

    function openLightbox(imgIdx) {
      const vols = data.illustrations || [];
      const imgs = (vols[currentVolIdx] || {}).images || [];
      if (!imgs.length) return;
      currentLightboxIdx = (imgIdx + imgs.length) % imgs.length;
      const item = imgs[currentLightboxIdx];
      document.getElementById("lightboxImg").src = encodeURI(item.src);
      document.getElementById("lightboxCaption").textContent = `[${vols[currentVolIdx].volume}] รูปที่ ${currentLightboxIdx + 1}/${imgs.length} — ${item.name}`;
      document.getElementById("lightbox").classList.add("open");
    }
    function stepLightbox(delta) {
      openLightbox(currentLightboxIdx + delta);
    }
    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("open");
    }

    document.addEventListener("keydown", (e) => {
      const lbOpen = document.getElementById("lightbox").classList.contains("open");
      if (lbOpen) {
        if (e.key === "ArrowLeft") stepLightbox(-1);
        if (e.key === "ArrowRight") stepLightbox(1);
        if (e.key === "Escape") closeLightbox();
        return;
      }
      if (e.key === "ArrowLeft") prevChapter();
      if (e.key === "ArrowRight") nextChapter();
      if (e.key === "m" || e.key === "M") toggleMenu();
      if (e.key === "Escape") {
        closeModal();
        closeIllustModal();
      }
    });

    function updateScrollProgress() {
      const docEl = document.documentElement;
      const maxScroll = Math.max(1, docEl.scrollHeight - docEl.clientHeight);
      const pct = Math.min(100, Math.max(0, (window.scrollY / maxScroll) * 100));
      const bar = document.getElementById("readProgressBar");
      if (bar) bar.style.width = pct.toFixed(1) + "%";
    }

    let scrollSaveTimer = null;
    window.addEventListener("scroll", () => {
      updateScrollProgress();
      if (scrollSaveTimer) clearTimeout(scrollSaveTimer);
      scrollSaveTimer = setTimeout(() => {
        localStorage.setItem(STORAGE_PREFIX + "_scroll_y", String(Math.round(window.scrollY)));
      }, 120);
    }, { passive: true });

    document.documentElement.style.setProperty("--font-size", fontSize + "px");
    setTheme(theme);
    if (localStorage.getItem("novel_reader_menu_hidden") === "1") {
      toggleMenu(true);
    }
    const initialSavedScroll = parseInt(localStorage.getItem(STORAGE_PREFIX + "_scroll_y") || "0", 10);
    render();
    if (initialSavedScroll > 0) {
      requestAnimationFrame(() => {
        window.scrollTo(0, initialSavedScroll);
        updateScrollProgress();
      });
    }
  </script>

  <div id="pinGateOverlay" style="display:none; position:fixed; inset:0; z-index:99999; background:#0f172a; color:#e2e8f0; flex-direction:column; align-items:center; justify-content:center; padding:20px; font-family:'Sarabun','Segoe UI',sans-serif;">
    <div style="background:#1e293b; border:1px solid #334155; border-radius:14px; padding:28px 26px; max-width:340px; width:100%; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.4);">
      <div style="font-size:38px; margin-bottom:8px;">🔒</div>
      <div style="font-size:18px; font-weight:bold; color:#38bdf8; margin-bottom:6px;">คลังนิยายส่วนตัว</div>
      <div style="font-size:13px; color:#94a3b8; margin-bottom:16px;">กรอกรหัส PIN เพื่อเข้าอ่าน (จำรหัสอัตโนมัติในเครื่องนี้)</div>
      <input id="pinGateInput" type="password" inputmode="numeric" placeholder="รหัส PIN..." style="width:100%; padding:10px 12px; font-size:18px; text-align:center; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#f8fafc; margin-bottom:12px;" onkeydown="if(event.key==='Enter') checkPinGate()" />
      <button onclick="checkPinGate()" style="width:100%; padding:10px; font-size:15px; font-weight:bold; border-radius:8px; border:none; background:#38bdf8; color:#020617; cursor:pointer;">เข้าสู่คลังนิยาย</button>
      <div id="pinGateErr" style="color:#f87171; font-size:13px; margin-top:10px; display:none;">❌ รหัส PIN ไม่ถูกต้อง</div>
    </div>
  </div>
  <script>
    (function() {
      const EXPECTED_PIN = "0909";
      if (localStorage.getItem("novel_hub_pin_ok") !== EXPECTED_PIN) {
        const gate = document.getElementById("pinGateOverlay");
        if (gate) gate.style.display = "flex";
      }
      window.checkPinGate = function() {
        const val = (document.getElementById("pinGateInput").value || "").trim();
        if (val === EXPECTED_PIN) {
          localStorage.setItem("novel_hub_pin_ok", EXPECTED_PIN);
          document.getElementById("pinGateOverlay").style.display = "none";
        } else {
          document.getElementById("pinGateErr").style.display = "block";
        }
      };
    })();
  </script>
</body>
</html>
