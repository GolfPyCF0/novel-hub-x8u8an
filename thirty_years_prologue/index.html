      "title": "บทที่ 27",
      "content": "มีคำกล่าวไว้ว่า “เมื่อเกิดเรื่องประหลาดขึ้นในประวัติศาสตร์โลก ให้เล็งเป้าไปที่อังกฤษ แล้วคุณจะทายถูกโดยประมาณ”\n\nคิมซอนอูศึกษาเรื่องมีมทางอินเทอร์เน็ตมากกว่าประวัติศาสตร์โลก ดังนั้นเขาจึงรู้จักมีมนี้ดีแม้จะไม่รู้เหตุผลโดยละเอียดก็ตาม\n\nจากมุมมองของอีวาน เขารู้ดีว่ามีมที่คล้ายคลึงกันนี้ก็แพร่หลายไปทั่วในโลกยุคก่อนสมัยใหม่แห่งนี้เช่นกัน\n\nในประวัติศาสตร์โลกฉบับดั้งเดิม หากเกิดเรื่องประหลาดอะไรขึ้น คุณสามารถเดาคร่าวๆ ได้ด้วยการชี้ไปที่พวกเอลฟ์\n\nเอลฟ์เป็นเผ่าพันธุ์ที่โดยพื้นฐานแล้วเต็มไปด้วยความรู้สึกเหนือกว่า หยิ่งยโส จองหอง และคิดว่าการเหยียดเผ่าพันธุ์เป็นเรื่องสามัญสำนึก\n\nเหตุผลเดียวที่พวกเอลฟ์ยอมเข้าเป็นส่วนหนึ่งของสหราชอาณาจักรก็คือ จากมุมมองของพวกมัน ปีศาจนั้นน่ารังเกียจยิ่งกว่ามนุษย์เสียอีก (น่าเสียดายที่คนแคระเป็นเผ่าพันธุ์ที่ไม่เลือกปฏิบัติ พวกนั้นจึงไปเข้าข้างพวกปีศาจแทน)\n\n“มีทฤษฎีในแวดวงวิชาการว่ามนุษย์อาจจะเป็นลิงที่วิวัฒนาการมา ในกรณีส่วนใหญ่ พวกเจ้าก็ไม่ได้ต่างจากลิงเท่าไหร่นัก แต่อย่างน้อยก็แสดงให้เห็นร่องรอยของสติปัญญาอยู่บ้าง อย่าคิดในแง่ลบเกินไปเลย นี่เป็นคำชมนะ” (เวียลกริน)\n\n“โอ้ คุณพระ มนุษย์กำลังเถียงกลับงั้นหรือ? โลกใบนี้มันหมุนกลับตาลปัตรไปยังไงกันแล้วเนี่ย…?” (เวียลกริน)\n\n“เวทมนตร์…? เจ้าพยายามตั้งชื่อให้ยิ่งใหญ่เกินไปสำหรับการละเล่นกับพลังเวทนะ มนุษย์ เจ้ายังไม่เด็กเกินไปหน่อยหรือที่จะร่ายเวทมนตร์น่ะ?” (เวียลกริน)\n\nคำพูดข้างต้นคือถ้อยคำที่เวียลกริน ซึ่งได้รับการยกย่องว่ามีนิสัยดีที่สุดในหมู่เอลฟ์ เคยกล่าวกับอีวานโดยตรง\n\nอีวานยังคงจำช่วงเวลานั้นได้อย่างชัดเจน\n\nสมาชิกทุกคนในปาร์ตี้ผู้กล้าล้วนบ้าบอคอแตก แต่เวียลกรินคือหนึ่งในคนบ้าระดับคุณภาพสูงสุดเลยทีเดียว\n\nสิ่งที่น่าตกใจยิ่งกว่านั้นก็คือ อันที่จริงเวียลกรินไม่ได้มีเจตนาร้ายใดๆ เลย\n\nกล่าวอีกนัยหนึ่ง ถ้อยคำเหล่านั้นเป็นเพียงคำพูดปกติธรรมดาตามธรรมชาติจากมุมมองของเขานั่นเอง\n\nแม้กระทั่งในตอนนี้ ที่ประชากรซึ่งเดิมทีก็น้อยนิดอยู่แล้วต้องลดฮวบลงไปอีกเนื่องจากสงครามกับเผ่าปีศาจ และถึงเวลาที่ต้องเปิดประตูประเทศเพื่อรักษาโครงสร้างของชาติเอาไว้แล้วก็ตาม\n\nโดยพื้นฐานแล้ว พวกเอลฟ์ก็เป็นพวกสารเลวอยู่ดี\n\n“ชมรมอาสาสมัครเหรอครับ?” (ยูจีน)\n\n“ใช่” (อีวาน)\n\n“ผมเหรอครับ?” (ยูจีน)\n\n“อืม” (อีวาน)\n\n“ทำไมล่ะครับ?” (ยูจีน)\n\nอีวานได้รับการอนุมัติจากท่านนักบุญหญิงและนักฆ่าแห่งปาร์ตี้ผู้กล้า ซึ่งเป็นคณบดีคณะเทววิทยาและอาจารย์คณะอัศวินตามลำดับเรียบร้อยแล้ว รวมถึงคณบดีคณะเวทมนตร์ด้วย แม้จะไม่ได้เป็นข้อบังคับ แต่อย่างน้อยก็พอจะเกลี้ยกล่อมให้พวกเขาเจียดเวลามาได้เพื่อรักษาหน้าตาของตนเอง\n\nทว่า แทนที่จะทำแบบนั้น อีวานกลับกำลังลูบด้ามขวานของตัวเองพลางครุ่นคิด มันคือสัจธรรมทางประวัติศาสตร์ที่แม้แต่จอมมารยังยอมรับว่า การฆ่าเอลฟ์สักตัวนั้นเร็วกว่าการไปเกลี้ยกล่อมมันเสียอีก\n\n“ลูกพี่ เดี๋ยวผมจัดการเรื่องนี้ให้เองครับ!” (ยูจีน)\n\nในตอนนั้นเอง ชายหนุ่มคนหนึ่งที่ยืนอยู่ข้างอีวานก็ผุดลุกขึ้นอย่างเดือดดาลแล้วตะโกนออกมา\n\nนี่คือเรื่องราวว่าทำไมจู่ๆ เขาถึงได้น้องชายมาหนึ่งคน\n\n“ผมเป็นคนเกาหลี และมันคงวิเศษมากเลยถ้าคุณก็เป็นคนเกาหลีเหมือนกันครับลูกพี่ การได้เจอคนจากบ้านเกิดเดียวกันเป็นประสบการณ์ที่น่าอภิรมย์เสมอ เพราะฉะนั้น จะมีเหตุผลอะไรให้พวกเราต้องรู้สึกกระอักกระอ่วนใจต่อกันล่ะครับ? พระคัมภีร์สอนไว้ว่าวาจามีพลังในการคลี่คลายปัญหาทุกอย่างในโลกได้ครับ” (ยูจีน)\n\nผู้ถูกสิงร่างที่เพิ่งถูกลักพาตัวมาจากเขตคณะเทววิทยา เริ่มพูดจ้อแบบนี้ทันทีที่ตั้งสติได้\n\nอีวานถึงกับผงะไปเล็กน้อย ไม่ใช่แค่เพราะหมอนี่ยอมเปิดเผยตัวตนง่ายดายเกินไปเท่านั้น แต่ยังเป็นเพราะหมอนี่พูดจาเก่งอย่างน่าประหลาดอีกด้วย\n\n“คุณชื่ออีวาน เปโตรวิช เหรอครับ? โอ้โห ขนาดชื่อยังเท่เลย ยูจีน ล่ะเป็นไงครับ? ในมุมมองคนเกาหลีมันออกเสียงยาก แถมยังจำน่ารำคาญด้วย อ้อ ทำไมจู่ๆ คุณถึงตกลงมาในโลกใบนี้ได้ล่ะครับ? อ้อ จะว่าไป คุณมาจากยุคหลังสตาลินหรือเปล่า? ความจริงแล้วสหภาพโซเวียตล่มสลายไปแล้วนะครับ” (ยูจีน)\n\nไอ้หมอนี่รัวคำถามออกมาเป็นชุดโดยที่ไม่มีใครถาม\n\nอีวานฟังคำพูดอันยืดยาวของยูจีนพลางลูบคาง แล้วจู่ๆ ก็หยุดชะงัก\n\n“นายรู้ได้ยังไงว่าฉันเป็นคนเกาหลี?” (อีวาน)\n\n“โธ่ ก็คุณรู้อยู่แล้วว่าผมมีหน้าต่างสถานะใช่ไหมล่ะครับ? อันที่จริง แนวคิดเรื่องหน้าต่างสถานะมันแพร่หลายแค่ในเอเชียตะวันออกเฉียงเหนือเท่านั้นแหละ แผ่นข้อมูลตัวละครที่โผล่มาในตัวบทนิยายส่วนใหญ่ก็เห็นได้ในเว็บโนเวลเกาหลีกับไลท์โนเวลญี่ปุ่น! ในประเทศอื่นมันยังเป็นแนวคิดที่ไม่ค่อยคุ้นเคยเท่าไหร่ แม้ว่าหลังๆ จะเริ่มมีโผล่มาบ้างแล้วก็ตาม…” (ยูจีน)\n\n“แล้วยังไงต่อ?” (อีวาน)\n\n“ประเทศเดียวที่ออกเสียงชื่อ ‘ยูจีน’ ได้ตรงตามเสียงอ่านเป๊ะๆ ก็มีแค่เกาหลีกับโลกที่พูดภาษาอังกฤษ! ดังนั้น ในเมื่อจุดร่วมเพียงอย่างเดียวคือเกาหลี ผมก็เลยลองเดาดูไงล่ะครับ! ฮิฮิฮิ” (ยูจีน)\n\nทั้งสามประเทศในเอเชียตะวันออกเฉียงเหนือล้วนอยู่ในเขตวัฒนธรรมตัวอักษรจีน ทว่ากฎการออกเสียงแตกต่างกัน นั่นหมายความว่าตัวอักษรจีนตัวเดียวกันสามารถอ่านออกเสียงต่างกันได้\n\nในญี่ปุ่น ชื่อนี้จะออกเสียงลากยาว ในจีนจะมีการผันวรรณยุกต์ วิธีเดียวที่จะออกเสียงชื่อ “ยูจีน” ออกมาตรงๆ แบบรวบรัดได้ก็คือในภาษาเกาหลี\n\n‘หมายความว่าหมอนี่วิเคราะห์ทั้งหมดนั่นได้ในระหว่างที่กำลังถูกลากตัวมางั้นเหรอ เป็นเพราะสัญชาตญาณเอาตัวรอดของมัน หรือเป็นเพราะความช่วยเหลือจากแถบสถานะกันแน่นะ?’\n\nต่อให้หักลบปัจจัยเหล่านั้นออกไปแล้วก็ตาม\n\n‘ไอ้หมอนี่มันมีความสามารถมากกว่าที่คิดไว้แฮะ…?’\n\nอีวานพยักหน้า\n\n“สรุปคือ นายบอกว่านายมองเห็นแถบสถานะสินะ?” (อีวาน)\n\n“ใช่ครับ แน่นอน! คุณเองก็เห็นเหมือนกันใช่ไหม? โห ตอนที่มันโผล่ขึ้นมาตรงหน้าผมครั้งแรก ผมคิดเลยนะว่า ‘เอาล่ะ ชีวิตฉันกำลังจะเปลี่ยนไปแล้ว!’ แต่ไปๆ มาๆ มันไม่ให้อะไรผมเลย ไม่เอาอะไรไปจากผมด้วย แค่วางเควสต์ให้ดื้อๆ แล้วก็ยกเลิกไปเฉยๆ เจ้าสิ่งนี้ไม่ใช่หน้าต่างสถานะหรอกครับ แต่มันคือหอกเฮงซวยชัดๆ ของคุณเป็นแบบนั้นเหมือนกันไหมครับ?” (ยูจีน)\n\n“ฉันไม่มีของแบบนั้นหรอก” (อีวาน)\n\n“คุณพระช่วย ผมอิจฉาคุณชะมัดเลยลูกพี่! ไม่รู้ว่าคุณจะเชื่อผมไหมนะ แต่ตลอดสี่ปีตั้งแต่ผมมาที่นี่ แถบสถานะไม่เคยช่วยอะไรผมเลยสักอย่าง! ให้ตายสิ เวลาผมพยายามจะทำอะไรสักอย่าง มันก็เอาแต่ขึ้นคำเตือนไม่หยุดเลย!” (ยูจีน)\n\nยูจีนเป็นคนช่างจ้อ ยิ่งกว่าคำว่ามีความสามารถเสียอีก\n\n“อ้อ ว่าแต่ ลูกพี่ใช้ชีวิตอยู่ที่นี่มากี่ปีแล้วเหรอครับ?” (ยูจีน)\n\n“สามสิบปี” (อีวาน)\n\n“โอ้…” (ยูจีน)\n\nยูจีนถอนหายใจเฮือกเมื่อได้ยินคำพูดของอีวาน\n\nสามสิบปีโดยไม่มีแถบสถานะเลยงั้นเหรอ…? แถมช่วงเวลานั้นยังเป็นยุคก่อนสงครามจอมมารเสียด้วย…?\n\n“ขอถามหน่อยนะครับ ตอนที่คุณข้ามมาจากเกาหลี นั่นมันปีอะไรเหรอครับ?” (ยูจีน)\n\n“ปี 2021” (อีวาน)\n\n“โอ้! ผมมาจากปี 2022! พี่ชาย นี่ระยะเวลาห่างกันหนึ่งปีในบ้านเกิดพวกเรา เท่ากับระยะเวลาห่างกันสามสิบปีที่นี่เลยเหรอครับ? งั้นตั้งแต่ผมมาที่นี่ก็ผ่านไปสี่ปีแล้ว… นี่ยังไม่ทันผ่านไปกี่เดือนเลยด้วยซ้ำ!” (ยูจีน)\n\n“มันคิดแบบนั้นยากนะ” (อีวาน)\n\nในบรรดาเรื่องราวที่ท่านนักบุญหญิงเล่าให้เขาฟังเกี่ยวกับ “ผู้ถูกสิงร่างในอดีตอันไกลโพ้น” มีบางสิ่งที่ชวนให้นึกถึงวัตถุโบราณจากยุคสมัยใหม่อยู่ด้วย\n\nจึงเป็นเรื่องยากที่จะคิดว่าเวลาบนโลกกับในโลกใบนี้จะต้องแปรผันตามสัดส่วนกันเสมอไป บางทีคนจากอนาคตอาจจะถูกส่งมาสิงร่างในอดีตที่ห่างไกลยิ่งกว่าตัวเขาก็เป็นได้\n\nมันมีเกณฑ์แบบไหนกันนะ? เงื่อนไขของการถูกสิงร่างคืออะไรกันแน่?\n\n“อ้อ ว่าแต่ ก่อนจะข้ามมาคุณทำอาชีพอะไรเหรอครับ? ผมอยากรู้ว่าพวกเราสองคนมีอะไรเหมือนกันบ้างหรือเปล่าน่ะ” (ยูจีน)\n\n“ฉันเป็นนักศึกษามหาวิทยาลัย” (อีวาน)\n\n“อ้อ ผมเป็นพนักงานออฟฟิศครับ งั้นก็ตามนี้เลย ผมแก่กว่า! ขอผมเรียกคุณว่า ‘พี่ชาย’ ได้ไหมครับ?” (ยูจีน)\n\n“…???” (อีวาน)\n\nอีวานจ้องมองไอ้คนบ้าตรงหน้าด้วยปากที่ปิดสนิท\n\nยูจีนที่เพิ่งจะพูดจ้ออย่างออกรสชาติเกี่ยวกับเรื่องสัพเพเหระต่างๆ ตัวสั่นเทาขึ้นมาเมื่อสัมผัสได้ถึงสายตาของอีวาน เขารีบพูดต่อทันที\n\n“แต่เรื่องอายุมันไม่ได้สำคัญขนาดนั้นใช่ไหมล่ะครับ? ก็หมายถึงว่า ถ้านับรวมประสบการณ์บนโลกกับที่นี่ด้วย คุณก็อยู่มาเกิน 50 ปีแล้วนี่นา ใช่ไหมครับ? บนโลก 20 ปี ที่นี่อีก 30 ปี… แบบนั้นมันก็เหมาะสมที่จะเรียกว่าพี่ชายแล้วไม่ใช่เหรอครับ?” (ยูจีน)\n\n“…” (อีวาน)\n\nอีวานครุ่นคิดอยู่ครู่หนึ่ง\n\nตัวเขาเองก็ไม่เคยคิดลึกซึ้งเรื่องอายุของตัวเองมาก่อน\n\nแต่ยังไงซะ แบบนั้นมันก็ดูไม่ค่อยถูกเท่าไหร่นะ\n\n“เอ่อ… เอาเถอะ! อืม! ผมเรียกคุณว่า ‘พี่ชาย’ ได้ไหมครับ?” (ยูจีน)\n\nบ้าเอ๊ย\n\nอีวานสบถด่าปากตัวเองในใจและถอนหายใจให้กับความเงียบอันแสนกระอักกระอ่วนนี้\n\nทำไมหมอนี่ถึงพูดอะไรแบบนั้นออกมา? มันเสียสติไปแล้วหรือไง?\n\nอีวานมองดูยูจีนพลางครุ่นคิด\n\nไอ้หมอนี่ก็น่าสนใจดีเหมือนกัน\n\nมันมีพรสวรรค์ด้านเพลงดาบ มากพอที่จะใช้ทักษะตรวจจับมุมอับสายตาได้ แถมยังลงเรียนหลักสูตรปกติของคณะเทววิทยา มีแถบสถานะ แล้วก็พูดจาเก่ง…\n\nมันน่าจะมีประโยชน์ อย่างน้อยก็มากกว่าดมิทรี\n\n“ถ้าไม่ได้ งั้นก็ไม่มีทางเลือกอื่นแล้วครับ! แทนที่จะเรียกว่า ‘พี่ชาย’ ให้ผมเรียกว่า ‘ลูกพี่’ เฉยๆ ดีไหมครับ? แบบนั้นคุณน่าจะสบายใจกว่าหรือเปล่า?”\n\n“ก็ตามใจนาย”\n\n“…ครับ ลูกพี่!”\n\nอีวานพยักหน้าขณะมองดูยูจีนที่กำลังหัวเราะราวกับนักต้มตุ๋น\n\n“มาสร้างสายสัมพันธ์ฉันพี่น้องที่แน่นแฟ้นกันเถอะ”\n\nในจุดนั้น ตอนที่เขาวิเคราะห์ประวัติของนักศึกษาทุกคนในสถาบันเซนต์ยัน มีผู้ต้องสงสัยว่าเป็นผู้ถูกสิงร่างอยู่ทั้งหมดสามคน ยูจีน ยูริ และเอลฟ์ที่ชื่อออสวัลด์\n\nมีความเป็นไปได้ที่ว่าจะมีเพียงไอ้หมอนี่คนเดียวที่เป็นผู้ถูกสิงร่าง ส่วนคนอื่นๆ อาจจะเป็นแค่คนธรรมดาของโลกใบนี้ที่โชคร้ายมาติดอยู่ในรายชื่อผู้ต้องสงสัย\n\nทว่า การตรวจสอบให้แน่ชัดย่อมดีที่สุดเสมอ ไม่มีปัญหาอะไรอยู่แล้วตราบใดที่ท่านนักบุญหญิงอนุมัติ\n\nหากพวกเราสามารถรวบรวมผู้ที่น่าจะเป็นผู้ถูกสิงร่างทั้งหมดมาไว้ด้วยกัน จากนั้นก็คัดกรองให้แคบลง และวิเคราะห์จุดร่วมของพวกเขา\n\n‘เรื่องราวของฉันคืออะไร? เรื่องราวที่ยังหลงเหลืออยู่ในโลกใบนี้คืออะไร?’\n\nอย่างน้อยก็น่าจะพออนุมานจุดร่วมบางอย่างออกมาได้บ้าง\n\nตัวอย่างเช่น เงื่อนไขในการถูกสิงร่าง จุดร่วมของการสิงร่าง และการมีอยู่ของ ‘ฉากจบ’\n\nเนื่องจากผลการทดลองจะรับประกันผลลัพธ์ที่มีความหมายได้ก็ต่อเมื่อกลุ่มตัวอย่างควบคุมมีขนาดใหญ่เท่านั้น\n\n“ครับ ลูกพี่! ปล่อยให้เป็นหน้าที่ผมเองได้เลยครับ!!”\n\n***\n\nอิซาเบลล์ ยูริ และเอคไดซิส พากันมานั่งกินข้าวด้วยกันทุกวันนับตั้งแต่เปิดภาคเรียน\n\nนี่คือผลลัพธ์จากผลประโยชน์ที่ขัดแย้งกันหลายประการ\n\nคนแรก อิซาเบลล์ เธอให้ความสนใจกับสายตาของผู้คนรอบข้างโดยสัญชาตญาณ มันเป็นทักษะที่เธอได้รับมาหลังจากใช้ชีวิตในพระราชวังมาอย่างยาวนาน เธอสามารถรับรู้ถึง “ความหน้าไหว้หลังหลอก” ของผู้อื่นได้\n\nเป็นที่รู้กันดีเกินไปว่าเธอคือลูกสาวของผู้กล้า ดังนั้นใครก็ตามที่เข้าหาเธอย่อมต้องตระหนักถึงภูมิหลังของเธอ นั่นเป็นหนึ่งในสิ่งที่อิซาเบลล์เกลียดที่สุด เธอจึงกลายเป็นคนนอกคอกโดยสมัครใจ\n\nในทางกลับกัน กรณีของเอคไดซิสนั้นแตกต่างออกไปเล็กน้อย อย่างที่เธอเคยระลึกได้ เธอกำลังเข้าเรียนมหาวิทยาลัยพร้อมกับท่านลุงของตัวเอง\n\nในฐานะนักศึกษาปีหนึ่ง เธอบอบบางเกินกว่าจะสร้างมิตรภาพกับเอคไดซิสผู้ถูกจับตามองอย่างใกล้ชิดโดยคุณลุงกล้ามโตได้โดยง่าย ดังนั้นเธอจึงกลายเป็นคนนอกคอกโดยไม่ได้ตั้งใจ\n\nสำหรับยูริ ไม่จำเป็นต้องพูดอะไรให้มากความอีก เธอเป็นเด็กกำพร้า และถึงแม้ยุคสมัยจะดีขึ้นแล้ว แต่คนส่วนใหญ่ที่มีกำลังจ่ายค่าเล่าเรียนมหาวิทยาลัยได้โดยธรรมชาติก็ยังคงเป็นพวกขุนนางอยู่ดี\n\nเธอเป็นคนที่ไปขูดขีดศักดิ์ศรีของพวกขุนนางด้วยฝีมือของตัวเอง ซึ่งล้ำหน้าพวกขุนนางไปไกลโข ทั้งที่เป็นเพียงเด็กกำพร้าสงคราม ดังนั้น เธอจึงกลายเป็นคนนอกคอกไปด้วยเช่นกัน\n\nในขณะที่เด็กขี้เหงาทั้งสามคนกำลังปลอบประโลมบาดแผลของกันและกันและเขียนบทละครวัยรุ่นมัธยมปลายร่วมกันอยู่นั้น\n\n“เฮ้! คุณลุง!”\n\nอิซาเบลล์วางแซนด์วิชที่กำลังกินอยู่ลงแล้วโบกมืออย่างร่าเริงให้กับอะไรบางอย่าง\n\nยูริที่กำลังกินแซนด์วิชอยู่ด้วยกันพลันหันศีรษะไปมองและทำแซนด์วิชหลุดมือร่วงลงพื้นดังตุบ\n\nคนสวนที่มีผ้าขนหนูพาดคอเดินตรงดิ่งเข้ามาหาเธอ\n\n‘นี่เพิ่มตัวละคร ‘โกลด์ซัน’ เข้ามาด้วยเรอะ…?!’\n\nพร้อมกับขุนนางหนุ่มคนหนึ่งที่กำลังหัวเราะราวกับตัวร้ายอยู่ข้างกายเขา"
    }

  "glossary": "# 📚 คัมภีร์ตัวละคร คำศัพท์ และสรรพนาม — 30 ปีผ่านไปนับจากบทนำ (30 Years Have Passed Since the Prologue)\n\n## ตัวละครหลัก\n- **อีวาน เปโตรวิช (Ivan Petrovich)** / **คิมซอนอู (Kim Sunwoo)** / **วันก้า (Vanka)** / **ซีริล (Cyril / ชื่อศีลล้างบาป)**: พระเอก อายุ 34 ปี ชาวเกาหลีที่ข้ามมิติมาจากปี 2021 (สมัยเป็นนักศึกษามหาวิทยาลัยที่ชอบเขียนคอมเมนต์วิจารณ์เกม เว็บตูน และเว็บโนเวล) มาเกิดใหม่ในร่างเด็กชายชาวนาตั้งแต่ 30 ปีก่อน เคยรับราชการทหาร 18 ปี (ทหารเกณฑ์ -> ทหารประจำการ -> หน่วยเก็บกวาด) ปัจจุบันเป็นผู้อำนวยการสถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซีย และได้รับมอบหมายให้แฝงตัวไปเป็นคนสวนที่สถาบันเซนต์ยัน ฉายา: *ลูกเขยพระราชา, คนตัดไม้, ผู้สังหารมังกรเจ็ดตัว, ผู้เป็นอมตะ, ทหารกองหนุน* (นักบุญหญิงแพทริเซียเรียกว่า *บราเดอร์ซีริล*)\n  - สรรพนาม: ใช้ *ฉัน / นาย* กับรุ่นน้องในกองทัพ, คิริลลอฟนาเรียกเขาว่า *วันก้า (Vanka)* และใช้ *ข้า / เจ้า*\n\n## ตัวละครรองและกลุ่มตัวละคร\n- **เอลิซาเวตา คิริลลอฟนา คราซิลอฟ (Elizaveta Kirillovna Krasilov)** / **คิริลลอฟนา (Kirillovna)** / **เอลิส (Elise)**: อดีตผู้บังคับบัญชาของอีวานในกองทัพ (อีวานเรียก *พันเอกคิริลลอฟนา*, รุ่นน้องบอกตอนอีวานปลดประจำการเธอเป็น *พันตรี*, เอนริเก้เรียก *เอลิส*) ปัจจุบันดำรงตำแหน่ง **อัครมหาเสนาบดี (Royal Chancellor)** และเป็น **องค์หญิง (Her Highness)** ฉายาในแนวหน้า: **“ริซ่าแห่งเหล็กกล้า” (Riza of Steel)** ตราประจำตัว: ดอกเบญจมาศ\n- **ดมิทรี เชอร์คาตอฟ (Dmitry / Dmitri Cherkatov)**: นายทหารรุ่นน้องจากหน่วยเก่าของอีวาน ปัจจุบันเป็นสายลับ/เจ้าหน้าที่ใต้บังคับบัญชาของเอลิซาเวตา เรียกอีวานว่า *รุ่นพี่* และใช้ *ผม / คุณ / รุ่นพี่*\n- **มกุฎราชกุมารอเล็กซานเดอร์ (Crown Prince Alexander)**: มีแผนจะแบ่งแยกและขายชาติ\n- **มหาราชา (Great King)**: พระราชาองค์ปัจจุบันที่ยังทรงนิ่งเฉย และเป็นผู้ยกเลิกเกณฑ์จำกัดอายุของสถาบันเซนต์ยัน\n- **ปาร์ตี้ผู้กล้า (Hero Party) และลูกหลาน/ศิษย์**:\n  - **ผู้กล้าแม็กซิมิเลียน (Maximilian)** — เคยมีวีรกรรม ‘ฟันผ่าท้องฟ้า’ แต่หายสาบสูญไปนานกว่า 4 ปีหลังปราบจอมมาร (ลือกันว่าปลีกวิเวกเข้าหุบเขาลึก) เอนริเก้เปิดเผยในบทที่ 21 ว่าแท้จริงเขาไม่ใช่ชาวทิลีสแต่เป็น “ผู้ที่ถูกดึงตัวมา” จากต่างโลกเช่นเดียวกับอีวาน ภรรยา: **มารี (Marie)** — ลูกสาว: **อิซาเบลล์ (Isabelle)** (อาชีพคู่: จอมเวทและนักรบ, จากอาณาจักรทิลีส, ขาดความอบอุ่นและมีปมวิตกกังวลจากการรอคอยบิดา)\n  - **ดิอัน ออกัสต์ / ออกัสตัส (Dian August / Augustus)**: อัศวินองครักษ์สามัญชนของอิซาเบลล์ที่ราชวงศ์ทิลีสแต่งตั้ง ยอมเอาตัวเข้าแลกปกป้องอิซาเบลล์ในเหตุรถไฟตกรางจนบาดเจ็บสาหัสเพราะเชื่อว่าทายาทผู้กล้าคือความหวังของการฟื้นฟูยุคสมัยใหม่ ก่อนอีวานจะเข้ามาช่วยด้วยโพชั่นรักษาบาดแผล\n  - **อัศวินจิลแบร์ (Jilber / บทที่ 2 เรียกจิล Jill)** (ผู้พิทักษ์ชายแดน ภรรยาชื่อ **จูเลีย Julia**) — ลูกชาย: **ออสการ์ เดอ ซาติยง (Oscar de Sation)** (อัศวิน, จากอาณาจักรทิลีส, หน้าตาหล่อเหลา มีสาวๆ ห้อมล้อม ได้รับคำสั่งจากพ่อให้คุ้มครองอิซาเบลล์ยิ่งชีพ)\n  - **จอมเวทเวียลกริน (Veolgrin)** — ลูกสาว: **เอลเฟียรา (Elpheira / Elphira)** (จอมเวทหญิง, จากจักรวรรดิคาลีออน)\n  - **กษัตริย์ไอนาร์ อูลริกส์สัน / ไอนาร์มหาราช (Einar Ulriksson / King Einar the Great / บทที่ 2 เรียกพาลาดินไอนาร์)** ฉายา ‘จอมเชือด’ (Butcher) แห่งอาณาจักรโดรเวียน — ธิดาคนโต: **องค์หญิงเอคไดซิส ไอนาร์สดอตตีร์ (Ecdysis Einarsdotir / ชื่อเล่น: เอซี่ Ecy / บทที่ 2 สะกดว่า Esideth)** สมัครเข้าเรียนวิทยาลัยดุริยางคศิลป์ สาขาออร์เคสตรา (ไวโอลินชื่อ **พี่วีโอ / Vio-unnie**) ของสถาบันเซนต์ยัน (อาชีพคู่: กวีและเบอร์เซิร์กเกอร์)\n  - **‘คมดาบเงา’ เอนริเก้ / เอนริเก้ เซอร์เกเยวิช / เซอร์เกเยฟนา (Shadow Blade Enrique / Enrique Sergeyevich / Sergeevna)**: แวมไพร์ระดับตำนานเพศหญิงอายุกว่า 100 ปี ผู้ให้กำเนิดหน่วยเก็บกวาด / ท่านปรมาจารย์ใหญ่ (Grand Master) ขององค์กรนักฆ่า และเป็นอาจารย์ของอีวาน (ไม่ได้เจอกันมา 7 ปี) ปัจจุบันเป็นศาสตราจารย์กิตติมศักดิ์และอาจารย์พิเศษวิชา *[ความเข้าใจในการต่อสู้ระยะประชิด 1]* ของคณะอัศวิน สถาบันเซนต์ยัน มีรอยแผลเป็นรูปกางเขนที่โคนฝ่ามือ ขโมยรูปปั้น “ผู้กล้านิรนาม” จากสวนกลางเฟรเชนกายาไปไว้ในดันเจี้ยนใต้ดินทางตอนใต้ — ศิษย์: **ลูเซีย (Lucia / ชื่อเล่น: ลูซี่ Lucy)** หญิงสาววัยปลายรุ่นผมสีน้ำตาลเข้ม (โจรหรือนักฆ่า, อยู่ในเมืองหลวงคราซิลอฟ, เรียกอีวานว่า *ศิษย์พี่เปโตรวิช*)\n    - สรรพนาม: เอนริเก้ใช้ *ฉัน / นาย* กับอีวาน (อีวานใช้ *ผม / คุณ*)\n  - **นักบุญหญิงแพทริเซีย (Saint Patricia / ชื่อเล่น: แพตตี้ Patty)** — ปีนี้เข้ามาเป็นคณบดีและอาจารย์สอนวิชาเทววิทยา (Theology) ที่สถาบันเซนต์ยัน เป็นผู้ตั้งชื่อและผู้สนับสนุนรายใหญ่ของสถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซีย เรียกอีวานตามชื่อศีลล้างบาปว่า *บราเดอร์ซีริล*\n- **ฮิวโก้ (Hugo)**: หัวหน้ากลุ่มโจรที่รับงานปล้น/ก่อการร้ายรถไฟสาย 12 ถูกอีวานจับเป็นและทรมานด้วยโพชั่นรักษาบาดแผลเพื่อรีดเบาะแส\n- **ฮัน (Han) / มอร์ด เอริกสัน (Mord Erikson / ฮัสคาลผู้แฝงตัว / คุณลุงของเอคไดซิส)**: หนึ่งในพี่น้องร่วมสาบาน (ฮัสคาล) และคนสนิทใกล้ชิดของกษัตริย์ไอนาร์ วัยสี่สิบกว่าปี ที่สอบผ่านข้อเขียนแบบเฉียดฉิวเข้าเป็นนักศึกษาปี 1 วิทยาลัยพลศึกษา (คณะอัศวิน) ของสถาบันเซนต์ยัน และวิ่งเท้าเปล่าตามรถไฟมาตลอด 2 วันเพื่อคุ้มกันเอคไดซิส (พ่ายแพ้ในการประลองกับอีวานและถูกสั่งให้ไปทำงานอาสาสมัครซักผ้าที่สถานเลี้ยงเด็กกำพร้า)\n- **พริสซิลลา (Priscilla)**: ศิษย์เก่าสถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซีย อายุ 17 ปี ไม่มีนามสกุล เด็กกำพร้าสงคราม ถูกลักพาตัวในตรอกมืดของเมืองหลวงโดยกลุ่มของเอนริเก้\n- **อิคารัส (Icarus)**: ปีศาจมีเขา อดีตผู้บัญชาการกององครักษ์จักรวรรดิที่ 6 (6th Imperial Guards) หัวหน้าหน่วยซุ่มโจมตีรถไฟของอิซาเบลล์ มีประสาทตรวจจับทิศทางเสียงปืน พ่ายแพ้ต่ออิซาเบลล์และถูกอีวานสอบปากคำด้วยโพชั่น หลังยอมรับข้อเสนอของอีวานให้ตัดเขาทิ้งเพื่อเริ่มต้นชีวิตใหม่ จึงถูกขึ้นทะเบียนเป็นสมาชิกใหม่ของสถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซีย (อายุ 50 ปี) (ลูกน้องที่ปรากฏชื่อ: **อินอฟ Inoff**)\n- **โอซิป โซเรนอฟ (Osip Sorenov)**: อดีตทหารเกณฑ์รุ่นสุดท้ายจากหน่วยจู่โจมที่ 3 ของหน่วยเก็บกวาดที่รอดชีวิตจากภารกิจสังหารเจ็ดราชามังกร ปัจจุบันเป็นสายลับใต้บังคับบัญชาของดมิทรี เรียกอีวานว่า *ผู้หมวดเปโตรวิช*\n- **ผู้ข้ามมิติปริศนา (เจ้าของหน้าต่างสถานะ / ‘ลูกคนเล็กจอมเสเพล’)**: นักศึกษาหรือบุคคลที่เข้าร่วมพิธีปฐมนิเทศสถาบันเซนต์ยัน รู้เนื้อเรื่องต้นฉบับและมีระบบหน้าต่างสถานะ/เควสต์ เผลอเรียกอีวานว่า “ซานตาคลอส” จนถูกอีวานจับสังเกตได้ว่าเป็นผู้ข้ามมิติและตกเป็นเป้าหมายไล่ล่า\n- **เชอร์โนวิกา (Chernovika)** และ **ซาชา (Sasha)**: อดีตเพื่อนร่วมรบใต้บังคับบัญชาของอีวานที่เสียชีวิตในสงคราม\n- **ยูริ แฟรงก์ (Yuri Frank)**: นักศึกษาปี 1 ทุนเต็มจำนวน (ภาคปฏิบัติ) และอันดับ 1 ของคณะอัศวิน สถาบันเซนต์ยัน เป็นเด็กสาวกำพร้าฝีมือดาบเหนือกว่าอิซาเบลล์และออสการ์ ใช้ชื่อ “ยูริ” ซึ่งเป็นชื่อผู้ชายในวัฒนธรรมคราซิลอฟ จึงติดรายชื่อผู้ต้องสงสัยว่าเป็นผู้ข้ามมิติของอีวาน — อดีตชาติเป็นนักวาดภาพประกอบชาวเกาหลีใต้ที่ข้ามมิติมาหลังอดนอนส่งงานเกมผู้ใหญ่ *[ฮวีจัก 3 (Huijak 3)]* ของค่ายสถาบันนุงยอก จึงเข้าใจผิดหวาดกลัวอีวานในชุดคนสวนอย่างสุดขีด\n- **เยฟเกนี โนคอฟ คารัมจิน (Yevgeni Nokov Karamjin)** / **ยูจีน (Eugene)**: นักศึกษาปี 1 คณะเทววิทยา สถาบันเซนต์ยัน เป็นผู้ข้ามมิติชาวเกาหลีใต้จากปี 2022 (อดีตพนักงานออฟฟิศ มาอยู่โลกนี้ได้ 4 ปีแล้ว) ที่มาสิงร่างตัวเอกจากนิยายเรื่อง *“นักดาบคลั่งแห่งดัชชีเหนือ”* (*[ไอ้สารเลวอัจฉริยะเพลงดาบแห่งดัชชีเหนือ]*) มีสกิล `[ความเชี่ยวชาญดาบ Lv 5]`, `[สัญชาตญาณขยายขอบเขต Lv 3]`, `[สัญชาตญาณเอาตัวรอด Lv 3]` และมีหน้าต่างสถานะที่ตัวเองเรียกว่า *แถบห่วยแตก / หอกเฮงซวย* แต่เลือกเรียนสายนักบวชเพราะไม่อยากฆ่าฟัน หลังถูกอีวานจับตัวได้ก็ยอมร่วมมือจัดตั้ง “ชมรมอาสาสมัคร” และเรียกอีวานว่า *ลูกพี่* (ยูริเข้าใจผิดคิดว่ายูจีนเป็นตัวละครสาย *โกลด์ซัน*)\n- **เอิร์นเบิร์ต (Ernbert)**: คณบดีคณะเวทมนตร์ สถาบันเซนต์ยัน เผ่าเอลฟ์จากหมู่เกาะคาลีออน\n- **ออสวัลด์ อีสต์เบลเฟน (Oswald Eastbelfen)**: นักศึกษาปี 1 คณะเวทมนตร์ ทายาทตระกูลจอมเวทชื่อดังและบุตรชายขององคมนตรีแห่งคาลีออน เป็นผู้ต้องสงสัยว่าเป็นผู้ข้ามมิติรายที่ 3 ของอีวาน (ชาติก่อนเคยอ่านนิยายเรื่อง *[นางร้ายที่คลั่งไคล้จอมเวทอัจฉริยะ]* ถึงตอนที่ 30 แล้วเททิ้งโดยไม่ได้คอมเมนต์) เพิ่งหย่าร้างกับอดีตคู่หมั้น\n- **เอเวอลิน รัสต์ฟิสต์ (Evelyn Rustfist)**: บุตรสาวขององคมนตรีแห่งคาลีออน อดีตคู่หมั้นตั้งแต่กำเนิดที่เพิ่งหย่าร้างกับออสวัลด์ แต่กลับมีความลุ่มหลงยึดติดในตัวออสวัลด์อย่างผิดปกติ\n\n## สถานที่และองค์กร\n- **อาณาจักรคราซิลอฟ (Krasilov Kingdom)** — เมืองหลวง: **เฟรเชนกายา (Frechenkaya)** อาณาจักรที่อีวานอาศัยอยู่และเอลิซาเวตาดำรงตำแหน่งอัครมหาเสนาบดี มี **สวนสาธารณะกลางเฟรเชนกายา (Frechenkaya Central Garden)** ซึ่งเคยตั้งรูปปั้นอนุสรณ์ของ **พระเจ้าอีวานมหาราช (King Ivan the Great)** (“ผู้กล้าผู้เดินทัพ”, “เทพีแห่งชัยชนะ”, และ “ผู้กล้านิรนาม”)\n- **อาณาจักรโดรเวียน (Drovian Kingdom)**: อาณาจักรบ้านเกิดของไอนาร์และองค์หญิงเอคไดซิส เชื่อมต่อกับคราซิลอฟผ่านทางรถไฟสายที่ 12 (อดีตปกครองด้วยผู้นำชนเผ่า ‘ยาร์ล’ และมีกองกำลังองครักษ์ ‘เกชิน / ฮัสคาล’)\n- **อาณาจักรทิลีส (Tyllese Kingdom)**: อาณาจักรเพื่อนบ้านของคราซิลอฟ บ้านเกิดของอิซาเบลล์และออสการ์ เมืองหลวง: **เซนต์มาทิลด์ (St. Mathilde)** มี **กองพลรักษาการณ์ที่ 3 แห่งทิลีส (Tyllese's 3rd Guard Division)** ประจำแนวชายแดนตะวันตกเฉียงเหนือ (ฝั่งคราซิลอฟมี **กองพลป้องกันชายแดนคราซิลอฟ**, **กองบัญชาการป้องกันเฟรเชนกายา**, และเขต **ป่าสนคราเชนรอฟ (Kraschenrov)**)\n- **จักรวรรดิคาลีออน (Kalion Empire)**: จักรวรรดิบนเกาะอีกฟากของ **ทะเลดำ (Black Sea)** อาณาเขตของจอมเวทเวียลกรินและเอลเฟียรา\n- **สถานีอิกอเรวิชี / อิกอรอวิช (Igorevichi / Igorovich Station)**: สถานีรถไฟใกล้ชายแดนโดรเวียน–คราซิลอฟ ก่อนเข้าเขตทหารสามเขต\n- **สถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซีย (St. Basilicia Orphanage)**: สถานเลี้ยงเด็กกำพร้าสำหรับเด็กกำพร้าจากสงครามใกล้นครหลวง ก่อตั้งโดยอีวาน\n- **สถาบันเซนต์ยัน (St. Jan's Academy)**: สถาบันการศึกษานานาชาติชื่อดังแห่งสหราชอาณาจักร ก่อตั้งขึ้นในช่วงสงคราม ไม่จำกัดอายุผู้เข้าเรียน (ประกอบด้วยวิทยาลัยดุริยางคศิลป์ / Music College, วิทยาลัยพลศึกษา / Athletic College, คณะอัศวิน / Knight Department, คณะเทววิทยา / Theology Department ซึ่งดูแลโดยท่านนักบุญหญิง, และคณะเวทมนตร์ / Magic Department ซึ่งดูแลโดยเหล่าเอลฟ์แห่งคาลีออน)\n- **หน่วยควบคุมเขตฟื้นฟูและพิสูจน์ฝ่ายศัตรู (Restoration Zone Control and Enemy Faction Identification Unit)** / **หน่วยเก็บกวาด / หน่วยกวาดล้าง (Cleanup Unit / Eradication Unit)**: หน่วยเฉพาะกิจที่อีวานสังกัดช่วงสงคราม ทำหน้าที่เก็บกวาดพื้นที่หลังปาร์ตี้ผู้กล้าสังหารผู้นำศัตรู\n\n## คำศัพท์เฉพาะ\n- **ดูแคต (Ducat)**: สกุลเงิน (เงินเดือนทหารเกณฑ์ 15 ดูแคตจากเขตตะวันออก)\n- **บทวิจารณ์ 5,700 ตัวอักษร (5,700-character critique)**: เงื่อนไข/มุกการข้ามมิติของชาวเกาหลีใต้ (เขียนวิจารณ์ยาวๆ จนนักเขียนตอบโต้ว่า \"งั้นลองมาทำเองดูสิ\")\n- **วันเปิดภาคเรียนมานลิตา (Manlita opening day)**: วันเปิดภาคเรียนของสถาบันเซนต์ยัน\n- **ทัณฑ์อินทรีโลหิต (Blood Eagle)**: โทษประหาร/ธรรมเนียมโหดของชาวโดรเวียน\n- **การตรวจจับแนววิถีกระสุน (Line of Fire Detection)** และ **จิตสังหาร (‘life’)**: ความสามารถของยอดฝีมือในการสัมผัสจิตสังหารและวิถีกระสุน/ลูกธนู ทำให้ปืนและธนูไร้ผลกับผู้แข็งแกร่ง\n- **ยาร์ล (Yals) / เกชิน (Geshins) / ฮัสคาล (Huscals)**: ผู้นำชนเผ่าและเหล่านักรบองครักษ์ผู้ภักดีของโดรเวียนที่ไม่รับเงินหรือที่ดิน มีสถานะเสมือนพี่น้องร่วมสาบานของกษัตริย์ไอนาร์\n- **ผู้ปีนหอคอยจอมมาร (Climber of Demon King’s Tower)** และ **“ผู้ที่ถูกดึงตัวมา” (“Those who were drawn”)**: นิยามของคนต่างโลกที่ปรากฏตัวขึ้นในช่วงที่โลกปั่นป่วน (เช่น แม็กซิมิเลียนและอีวาน) โดยเอนริเก้เคยเข้าใจผิดคิดว่าอีวานก็เป็นผู้ปีนหอคอยจอมมารเช่นเดียวกับคนอื่นๆ ในกลุ่ม\n",
  "story_memory": "# 🧠 เรื่องย่อสะสมแต่ละตอน — 30 ปีผ่านไปนับจากบทนำ (30 Years Have Passed Since the Prologue)\n\n- **บทที่ 1**: คิมซอนอูข้ามมิติมาเกิดใหม่ในร่างเด็กชายชาวนาชื่อ **อีวาน เปโตรวิช** โดยไม่มีหน้าต่างสถานะหรือความรู้เกี่ยวกับเรื่องราวของโลกใบนี้ เมื่ออายุ 14 ปี พ่อถูกเกณฑ์ไปรบและเสียชีวิต อีวานจึงสมัครเป็นทหารเพื่อส่งเงินให้แม่ เขาไต่เต้าจากทหารเกณฑ์จนได้เป็นทหารประจำการและเข้าสังกัด **หน่วยเก็บกวาด** ร่วมค่ายเดียวกับปาร์ตี้ผู้กล้า จนกระทั่งปราบจอมมารได้เมื่ออายุ 30 ปี แต่ฉากจบก็ไม่มาเสียที จึงปลดประจำการตอนอายุ 32 ปีมาเปิดสถานเลี้ยงเด็กกำพร้า จนอายุ 34 ปี (ครบ 30 ปีที่ข้ามมิติ) มีแขกจากวังหลวงมาหา ทำให้เขาเพิ่งรู้ตัวว่าโลกนี้อาจจะกำลังเข้าสู่แนว **สถาบันการศึกษา**\n- **บทที่ 2 (ทหารแก่ก็ต้องการพักผ่อน)**: นายทหารรุ่นน้องจากหน่วยเก่าลอบมาพบอีวานที่สถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซีย พร้อมอัญเชิญจดหมายประทับตราขี้ผึ้งรูปดอกเบญจมาศจาก **เอลิซาเวตา คิริลลอฟนา คราซิลอฟ** (อดีตผู้บังคับบัญชา ฉายา “ริซ่าแห่งเหล็กกล้า” ปัจจุบันเป็นองค์หญิงและอัครมหาเสนาบดี) ในจดหมายขอร้องให้ \"วันก้า\" กลับมาช่วยดูแล \"สวน\" ที่กำลังเสื่อมโทรมท่ามกลางวิกฤตการเมืองที่มกุฎราชกุมารอเล็กซานเดอร์คิดขายชาติ รุ่นน้องเปิดเผยว่าปีนี้บรรดาลูกหลานและศิษย์ของสมาชิกปาร์ตี้ผู้กล้า รวมถึงตัวนักบุญหญิงแพทริเซียเอง ต่างพากันเข้ามาเรียนและสอนที่ **สถาบันเซนต์ยัน** อีวานจึงถูกส่งเข้าไปเป็น \"คนสวน\" เพื่อคอยคุ้มครองและจับตาดูคนเหล่านั้นไม่ให้เกิดเรื่องลุกลามเป็นสงครามระหว่างประเทศ อีวานจำใจรับพระบัญชา โดยหวังว่าอดทนอีกแค่ 3 ปีคงจะได้เห็นฉากจบเสียที\n- **บทที่ 3**: อีวานขุดคุ้ยความทรงจำของคิมซอนอูเพื่อวิเคราะห์สูตรสำเร็จของนิยายแนวสถาบันการศึกษา (ทั้งปีศาจแอบแฝง คนทรยศในคณาจารย์ ห้องลับ สายลับรัฐบาล และเงื่อนไขฉากจบที่อาจเป็นการคืนชีพของจอมมาร) เขาฟันธงว่า \"รถไฟรับนักเรียนเข้าสถาบัน\" จะต้องโดนก่อการร้ายแน่นอน ฝั่งอาณาจักรโดรเวียน **องค์หญิงเอคไดซิส** ธิดาของกษัตริย์ไอนาร์ (ผู้สอบติดสาขาออร์เคสตรา สถาบันเซนต์ยัน) ขึ้นรถไฟออกเดินทางก่อนใคร สองวันต่อมารถไฟขบวนนั้นก็ตกรางใกล้ชายแดนคราซิลอฟ อีวานจึงคว้าปืนพกและขวานออกปฏิบัติการทันที\n- **บทที่ 4**: อีวานวิเคราะห์เส้นทางรถไฟสาย 12 ร่วมกับรุ่นน้อง (**ดมิทรี เชอร์คาตอฟ**) และฟันธงว่าจุดก่อการร้ายจะอยู่ที่ **สถานีอิกอเรวิชี** ใกล้ชายแดนก่อนเข้าสู่เขตทหารสามเขตของคราซิลอฟ เพื่อป้ายความผิดและสร้างรอยร้าวระหว่างคราซิลอฟกับโดรเวียน อีวานขึ้นรถไฟมุ่งหน้าไปชายแดนเพียงลำพังเพื่อคุ้มกันทั้ง 5 เส้นทาง ขณะเดียวกัน ดมิทรีกลับไปรายงาน **เอลิซาเวตา** (อัครมหาเสนาบดี) ที่พระราชวัง ซึ่งเธอสั่งให้ดมิทรีส่งคนติดตามบันทึกกิจวัตรประจำวันของวันก้าไว้ตลอดเวลา เมื่อสายลับของดมิทรีไปถึงสถานีอิกอเรวิชี พวกเขาก็พบเพียงถุงใส่ศพ 3 ใบที่ห่อไว้อย่างเรียบร้อยและสถานที่เกิดเหตุที่ถูกเช็ดคราบเลือดจนสะอาด ส่วนอีวานกำลังวิ่งลัดเลาะป่าพร้อมขวานในมือ\n- **บทที่ 5**: ที่สถานีอิกอรอวิช อีวานสังเกตเห็นชายต้องสงสัย 3 คน (คนดูนาฬิกา-หนังสือพิมพ์, คนแกล้งหลับ, และพ่อค้าผักเหี่ยว) เมื่อทดสอบด้วยคำถามรหัสความภักดีแล้วพบว่าเป็นแค่ทหารรับจ้างไร้ฝีมือตรวจจับแนววิถีกระสุน อีวานจึงสังหารทั้ง 3 คนและรีดข้อมูลจากพ่อค้าผักก่อนฆ่าทิ้งจนรู้ว่ามีโจรอีก 15 คนดักปล้น \"รถไฟขนทองคำแท่ง\" อยู่ริมราง อีวานลบร่องรอยใน 5 นาทีและสะกดรอยตามสัญญาณเวทมนตร์ไป โดยตั้งใจปล่อยให้เหตุการณ์ก่อการร้ายรถไฟซึ่งเป็น \"ด่านฝึกสอนของตัวเอกทุกคน\" ดำเนินไป แต่ตัวเองจะคอยเก็บกวาดเบื้องหลังและสาวถึงตัวบงการแทน\n- **บทที่ 6**: หัวหน้าโจร **ฮิวโก้** กดจุดระเบิดทำให้รถไฟที่เอคไดซิสโดยสารมาตกรางก่อนถึงสถานีอิกอรอวิช อีวานซุ่มยิงเก็บลูกสมุน 5 คนที่อยู่แนวหลังได้อย่างเฉียบขาดและจับเป็นฮิวโก้เพื่อทรมานรีดเบาะแสเกี่ยวกับผู้จ้างวาน (ไม่ฆ่าเพราะกะเก็บไว้เป็นบอสฝึกสอนให้ตัวเอก) บนรถไฟ **องค์หญิงเอคไดซิส** ฟื้นขึ้นมาและคว้าไวโอลินขึ้นมากำด้ามราวกับขวานเตรียมสู้ ขณะเดียวกันที่ชายป่า นักรบ **ฮัสคาล** วัยสี่สิบกว่าปีซึ่งเป็น \"คุณลุง/พี่น้องร่วมสาบาน\" ของกษัตริย์ไอนาร์ (และแอบสอบเข้าเป็นนักศึกษาปี 1 วิทยาลัยพลศึกษาของสถาบันเซนต์ยันไว้ล่วงหน้า) ที่วิ่งเท้าเปล่าตามรถไฟมาตลอด 2 วัน เห็นรถไฟตกรางจึงพุ่งทะยานฝ่าป่าเข้าไปช่วยหลานสาวทันที\n- **บทที่ 7**: อีวานใช้วิธีสอบปากคำแบบยั่งยืนด้วยการราดโพชั่นรักษาบาดแผลสลับกับซักถามฮิวโก้ แต่ไม่พบเบาะแสเพิ่มเนื่องจากพวกโจรใส่เสื้อโค้ตหนาและใช้เวทมนตร์ปิดบังตัวตน ทันใดนั้น **ฮัน (คุณลุงฮัสคาล)** พุ่งเข้ามาปะทะกับอีวานด้วยขวานเพราะเข้าใจผิดว่าอีวานเป็นพวกเดียวกับโจร ฝั่งเอคไดซิสใช้ไวโอลินคู่ใจ (\"พี่วีโอ\") ฟาดหัวโจรจนไวโอลินพังยับและทำให้พวกโจรที่เหลือวิ่งหนีตายออกมาเจอทั้งสองคน เมื่อเอคไดซิสปรากฏตัวปลอดภัยดี อีวานจึงถอนตัวกลับไปส่งรายงานเข้ารหัสให้ราชสำนัก ส่วนฮันที่จำวิชาขวานของไอนาร์ได้ก็นึกสงสัยว่าอีวาน (‘ตัวสำรองผู้กล้า’ ที่ลือว่าตายไปเมื่อ 2 ปีก่อน) ยังมีชีวิตอยู่และสังกัดหน่วยข่าวกรอง จึงพาเอคไดซิสบังคับพวกโจรแบกแคร่หามเดินทางต่อสู่เมืองหลวง\n- **บทที่ 8**: อีวานตรวจเช็กกำหนดการเดินทางของทายาทปาร์ตี้ผู้กล้าคนอื่นๆ (อิซาเบลล์และออสการ์จากอาณาจักรทิลีส, เอลเฟียราจากจักรวรรดิคาลีออนทางเรือ, และลูเซียที่อยู่ในเมืองหลวงแล้ว) และกลับมานั่งพักผ่อนที่สถานเลี้ยงเด็กกำพร้ากับเด็กๆ ที่ชอบเล่นเกมแอบย่องเข้าหาเขา ทว่า **พริสซิลลา** ศิษย์เก่าอายุ 17 ปีถูกลักพาตัวไปในตรอกมืดของเมืองหลวง **เฟรเชนกายา** เมื่อเธอเอ่ยชื่ออีวานขู่พวกนักเลง **‘คมดาบเงา’ เอนริเก้** (อาจารย์ของลูเซียและผู้ก่อตั้งหน่วยเก็บกวาด) ก็บังเอิญมาได้ยินและเข้าใจผิดคิดว่าอีวานแอบฝึกเด็กกำพร้าเป็นหน่วยนักฆ่าลับหลังตน เอนริเก้จึงฝากเสื้อโค้ตที่มีรอยประทับมือเป็นแผลเป็นรูปกางเขนส่งกลับมาเพื่อเรียกตัวอีวานไปพบ\n- **บทที่ 9**: อีวานแกะรอยไปยังดันเจี้ยนใต้ดินทางตอนใต้ของเฟรเชนกายา ซึ่งเป็นที่ซ่อนรูปปั้น “ผู้กล้านิรนาม” ที่เอนริเก้ขโมยมาจากสวนกลางเมืองหลวง และได้พบหน้า **เอนริเก้** (แวมไพร์หญิงระดับตำนานและอดีตอาจารย์ของเขาที่ไม่เจอกัน 7 ปี) ทั้งสองฝ่ายต่างระแวงและเข้าใจผิดกันไปคนละทาง: เอนริเก้คิดว่าอีวานแอบตั้งองค์กรนักฆ่าแข่งในถิ่นเธอและส่งคนมาประกาศสงคราม ส่วนอีวานก็ระแวงว่าเอนริเก้แปรพักตร์ไปเข้าข้างมกุฎราชกุมารอเล็กซานเดอร์ ทั้งคู่ต่างแลกเปลี่ยนวาทะเชิงหยั่งเชิงท่ามกลางความเข้าใจผิดในช่วงกลางเดือนมกราคม\n- **บทที่ 10**: อีวานยอมอ่อนข้อก่อนและเอ่ยถึง **ลูเซีย** ลูกศิษย์ของเอนริเก้ที่จะเข้าเรียนสถาบันเซนต์ยัน ทำให้เอนริเก้ยิ่งเข้าใจผิดว่าอีวานเอาลูกศิษย์มาข่มขู่ ก่อนจะเรียกลูเซียออกมาแนะนำตัว (ลูเซียเปิดเผยทัศนคติสุดหัวก้าวหน้าเรื่อง ‘มนุษยธรรม’ จนอีวานทึ่ง) เมื่อบรรยากาศตึงเครียดถึงขีดสุด ทั้งคู่จึงได้ปรับความเข้าใจกันจนรู้ว่าต่างฝ่ายต่างไม่ได้เข้าข้างอเล็กซานเดอร์ และพริสซิลลาฝึกซุ่มโจมตีจากการละเล่นในสถานเลี้ยงเด็กกำพร้าเอง ส่วนอีวานได้รับภารกิจจากเอลิซาเวตาให้ช่วยอารักขาเอนริเก้และศิษย์ หลังแยกจากเอนริเก้และพาพริสซิลลากลับมาอย่างปลอดภัย เธอถามด้วยน้ำตาว่าเขาจะจากไปใช่ไหม อีวานจึงเผลอบอกไปว่าเขากำลังจะไป **สถาบันเซนต์ยัน** ส่งผลให้ชาวสถานเลี้ยงเด็กกำพร้าบาซิลิเซียทุกคนพากันคร่ำเคร่งเตรียมตัวสอบเข้าสถาบันเซนต์ยันกันยกใหญ่\n- **บทที่ 11**: ย้อนความทรงจำสมัยสงครามที่ **แม็กซิมิเลียน** เคยตวัดดาบ ‘ฟันผ่าท้องฟ้า’ และ **ไอนาร์** จามภูเขาทั้งลูกจนปาร์ตี้ผู้กล้าต้องวิ่งหนีฝูงไวเวิร์นกันหัวซุกหัวซุน ก่อนตัดกลับมาที่ปัจจุบันในอีก 2 สัปดาห์ต่อมา อีวานต้องเดินทางไปที่เมืองหลวง **เซนต์มาทิลด์** ของ **อาณาจักรทิลีส** พร้อมกับสายลับมือใหม่จากกองบัญชาการข่าวกรอง 5 คนที่ **ดมิทรี** ส่งมาประกบ (ด้วยความสงสัยว่าอีวานมีเครือข่ายลับ) อีวานจึงอบรมสั่งสอนพวกสายลับแบบเข้มงวดตลอด 18 ชั่วโมงก่อนปล่อยให้พวกนั้นไปคุ้มครอง **ออสการ์** ส่วนตัวเองแยกตัวมาขึ้นรถไฟขบวนเดียวกับ **อิซาเบลล์** (ลูกสาวผู้กล้าแม็กซิมิเลียน) ซึ่งกำลังน้อยใจที่พ่อไม่มาส่งและไล่ตะเพิด **ออกัสตัส** อัศวินองครักษ์ที่คอยยิ้มเอาใจอย่างไร้ความจริงใจ\n- **บทที่ 12**: รถไฟจากทิลีสมุ่งหน้าคราซิลอฟแล่นผ่านจุดซุ่มโจมตีที่คาดการณ์ไว้ถึง 3 จุดอย่างสงบจนอีวานเริ่มสติแตกและวิตกกังวลว่าตัวเองอาจเดาแนวเรื่องผิดและโลกนี้ไม่มีฉากจบ ทำให้จิตสังหารแผ่ซ่านออกมาจนคนข้างๆ แทบขาดใจ ทว่าจังหวะที่รถไฟแล่นออกจากอุโมงค์ขึ้นสะพานเหนือหุบเขา สะพานก็ถูกระเบิดถล่มจนรถไฟตกราง อีวานจึงสงบใจลงและรีบไต่ขึ้นซากรถไฟเพื่อเข้าช่วยเหลือ ด้าน **อิซาเบลล์** ฟื้นขึ้นมาในตู้โดยสารที่ถูกดินกลบและพบว่า **ดิอัน ออกัสต์ (ออกัสตัส)** อัศวินองครักษ์ยอมเอาตัวรับแรงกระแทกปกป้องเธอจนบาดเจ็บสาหัส ออกัสต์เปิดเผยว่าแม้จะไม่ชอบนิสัยเธอ แต่การมีอยู่ของเธอในฐานะทายาทผู้กล้าคือความหวังของการฟื้นฟูยุคสมัยใหม่ ทันใดนั้นอีวานก็ขุดดินทะลุเข้ามาช่วยและหยิบโพชั่นรักษาบาดแผลออกมาช่วยชีวิตออกัสต์ไว้\n- **บทที่ 13**: ฤทธิ์เจ็บปวดของโพชั่นทำให้เซอร์ดิอัน ออกัสต์ ช็อกจนสติย้อนวัยกลับเป็นเด็กชั่วคราว อีวานจึงให้อิซาเบลล์แบกออกัสต์ออกไปรวมตัวกับผู้รอดชีวิตที่เหลืออีก 10 คนและก่อกองไฟรอ ส่วนตัวเองแยกออกไปในป่ามืดเพื่อเปิดฉากซุ่มโจมตีหน่วยเก็บกวาดใส่ศัตรูที่โอบล้อมอยู่รอบภูเขาก่อน ทันทีที่ได้ยินเสียงปืนนัดแรกของอีวาน ออกัสต์ที่เพิ่งได้สติคืนมาก็ได้ถ่ายทอดคำสอนวิถีอัศวินโบราณบทสุดท้ายให้กับอิซาเบลล์ว่าให้จับดาบเพื่อความเที่ยงธรรมและยืนหยัดในจุดเดียวกับผู้อ่อนแอ ทำให้อิซาเบลล์ตั้งปณิธานได้สำเร็จ\n- **บทที่ 14**: อีวานใช้กลยุทธ์กองโจรของหน่วยเก็บกวาดซุ่มยิงและฟันสังหารกำลังพลราว 50 คนของฝ่ายศัตรูทีละจุด พร้อมทั้งวางกับดักด้ายผูกไกปืนกับศพเพื่อปั่นประสาทหน่วยบัญชาการศัตรู จน **อิคารัส** (ปีศาจมีเขา อดีตผู้บัญชาการกององครักษ์จักรวรรดิที่ 6) จับไต๋ได้ว่าผู้ลอบโจมตีมีเพียงคนเดียวและกำลังล่อให้พวกตนแตกแถว อิคารัสจึงสั่งลูกน้องไปรุมจัดการอีวานในป่า ส่วนตัวเองมุ่งหน้าไปเผชิญหน้ากับอิซาเบลล์ที่จุดพักแรมโดยตรง\n- **บทที่ 15**: อีวานเริ่มสงสัยว่าด่านฝึกสอนของอิซาเบลล์ยากผิดปกติเมื่อเทียบกับเอคไดซิส และกังวลว่าตัวเองอาจเป็นเพียง NPC ตัวช่วยในเกม จึงแอบขึ้นไปสังเกตการณ์บนต้นไม้โดยไม่ยื่นมือเข้าไปช่วยในทันที ด้านอิซาเบลล์สู้กับอิคารัสจนดาบกระเด็นหลุดมือและเกือบถูกฟันสังหาร ทว่าเมื่อนึกถึงคำสอนวิถีอัศวินของออกัสต์ เธอก็ตื่นรู้พลังในเสี้ยววินาที ย่อตัวหลบคมดาบแล้วแทงทะลุร่างอิคารัสจนเอาชนะได้ อีวานซึ่งจัดการศัตรูในป่าทั้งหมดเรียบร้อยแล้วจึงเดินออกมาชื่นชม (ยืนยันได้ว่าตัวเองคือตัวแปรที่ไม่ใช่ NPC) และเปิดขวดโพชั่นรักษาบาดแผลเพื่อเตรียมสอบปากคำอิคารัสหาเบื้องหลังการแทรกซึมของพวกปีศาจ\n- **บทที่ 16**: อีวานราดโพชั่นรักษาบาดแผลใส่แผลฉกรรจ์ของ **อิคารัส** และช่วยชีวิตตอนที่อิคารัสกัดลิ้นฆ่าตัวตาย จนได้ข้อมูลว่าที่พวกปีศาจต้องส่งอิคารัสมาลงมือเองเพราะหน่วยสาวกในสหราชอาณาจักรถูกแทรกซึมและพ่ายแพ้สงครามข่าวสารไปแล้ว เมื่ออิคารัสสิ้นหนทางกลับและขอตาย อีวานกลับยื่นข้อเสนอให้ละทิ้งตัวตนเดิมแล้วไปเริ่มต้นชีวิตใหม่ที่สถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซีย อิคารัสเลือกจะมีชีวิตอยู่และยอมให้อีวานตัดเขาทิ้ง หลังจบเรื่อง อีวานจึงปลอบใจอิซาเบลล์ที่รู้สึกผิดต่อผู้เสียสละและกระตุ้นให้เธอเงยหน้าขึ้นเป็นความหวังและผู้กล้าของทุกคน\n- **บทที่ 17**: ปลายเดือนกุมภาพันธ์ วันพิธีปฐมนิเทศของ **สถาบันเซนต์ยัน** เรือประจัญบานลอยฟ้าซึ่งเป็นเรือธงของ **จักรวรรดิคาลีออน** บินข้ามเขตแดนมาส่ง **เอลเฟียรา** เพื่อแสดงการประท้วงเรื่องความปลอดภัยในคราซิลอฟ อีวานที่แฝงตัวเป็นเจ้าหน้าที่ได้พบกับ **อิซาเบลล์** และ **ออสการ์ เดอ ซาติยง** (ลูกชายของจิลแบร์) พออีวานแนะนำตัวว่าเป็น “คนสวน” อิซาเบลล์ก็เข้าใจผิดคิดว่าเป็นรหัสลับของสายลับรัฐบาล ตัดฉากไปในหอประชุมใหญ่ จู่ๆ ก็มีใครบางคนมองเห็น **หน้าต่างสถานะ** ปรากฏขึ้นตรงหน้า\n- **บทที่ 18**: อีวานใช้เวลาว่างในตำแหน่งคนสวนที่ไม่มีสวนของสถาบันเซนต์ยันเดินไล่เก็บกู้ระเบิดเวทมนตร์ทำมือ 3 ลูกที่คนร้ายลอบวางไว้ก่อนพิธีปฐมนิเทศ ทันใดนั้นเขาก็ได้ยินเสียงคนพูดพึมพำเรียกตัวเองว่า “ซานตาคลอส” เมื่อปะทะกันชั่วพริบตา อีวานก็วิเคราะห์ได้ทันทีว่าอีกฝ่ายคือ **ผู้ข้ามมิติ** ที่รู้จักต้นฉบับและรู้ฉากจบของโลกนี้ อีวานจึงแสดงตัวกับ **โอซิป โซเรนอฟ** (อดีตทหารหน่วยเก็บกวาดจากหน่วยจู่โจมที่ 3) เพื่อสั่งการผ่านดมิทรีให้รวบรวมรายชื่อผู้เข้าออกสถาบันทั้งหมดและตั้งใจจะกำจัดผู้ข้ามมิติคนนั้นทิ้งเพื่อไม่ให้ถูกขวางทางกลับบ้าน ส่วนทางฝั่งผู้ข้ามมิติปริศนา (ในร่างลูกคนเล็กจอมเสเพล) ที่เพิ่งพลาดเควสต์กู้ระเบิดเพราะอีวานเก็บกู้ไปหมดแล้ว ก็ได้รับเควสต์ระดับ `???` ให้กำจัดหรือเอาชีวิตรอดจาก “คนสวนแห่งสถาบันเซนต์ยัน อีวาน เปโตรวิช” โดยมีบทลงโทษคือความตาย\n\n- **บทที่ 19**: อีวานนำระเบิดเวทมนตร์ 3 ลูกที่ถอดชนวนแล้วไปพบ **ดมิทรี** ที่ร้านกาแฟลับใกล้สถาบันเซนต์ยันเพื่อส่งให้แผนกเวทมนตร์ตรวจสอบ และรับแฟ้มรายชื่อบุคลากร นักศึกษา รวมถึงครอบครัวผู้เข้าร่วมพิธีปฐมนิเทศรวม 2,429 คนมาคัดกรองหาผู้ข้ามมิติ ดมิทรีเป็นห่วงสภาพอิดโรยของอีวานจึงสั่งให้ลูกน้องคอยเฝ้าสังเกตการณ์จากระยะปลอดภัย อีวานนำข้อมูลกลับมานั่งวิเคราะห์จนเกิดฝันร้ายถึงอดีตเพื่อนร่วมรบ (**เชอร์โนวิกา** และ **ซาชา**) และท่องชื่ออาหารกับความทรงจำของ **คิมซอนอู** เพื่อประคองสติไม่ให้ยอมรับว่าชีวิตของสหายเป็นเพียงฉากหลังในเกม ตัดฉากไปหลังเปิดเทอม **องค์หญิงเอคไดซิส** ถูกเพื่อนร่วมสถาบันหวาดกลัวและโดดเดี่ยวเพราะ **คุณลุงฮัน** คอยยืนถือขวานจ้องเขม็งปกป้องจนไม่มีใครกล้าเข้าใกล้\n- **บทที่ 20**: หลังอดหลับอดนอนคัดกรองข้อมูลอยู่ 3 วัน อีวานก็ตัดตัวเลือกจนเหลือผู้ต้องสงสัย 3 คน (เด็กกำพร้าทุนภาคปฏิบัติ 1 คน และทายาทขุนนางสายมกุฎราชกุมารอีก 2 คน) ก่อนจะเริ่มเข้ามาทำงานในสถาบันเซนต์ยันอย่างเต็มตัว ด้าน **เอคไดซิส** ได้ร่วมโต๊ะกินมื้อกลางวันกับ **อิซาเบลล์** และเพื่อนใหม่ **ยูริ แฟรงก์** (เด็กสาวกำพร้าทุนเต็มจำนวนของคณะอัศวินที่มีฝีมือดาบเหนือกว่าอิซาเบลล์และออสการ์) แต่อีวานที่แอบสังเกตการณ์อยู่บนต้นไม้กลับขีดเส้นแดงให้ยูริเพราะใช้ชื่อผู้ชายแบบคราซิลอฟซึ่งนิยมใช้เป็นชื่อผู้หญิงในเอเชียตะวันออก ขณะเดียวกัน **เอนริเก้** ที่ได้รับไหว้วานให้มาคอยดูอีวานก็เริ่มสังเกตว่าเขาสะกดรอยตามนักศึกษา 3 คนอย่างน่าสงสัย หนึ่งในนั้นคือ **เยฟเกนี โนคอฟ คารัมจิน (ยูจีน)** นักศึกษาคณะเทววิทยา ซึ่งเป็นผู้ข้ามมิติชาวเกาหลีใต้ที่เข้ามาสิงร่างตัวเอกนิยาย *“นักดาบคลั่งแห่งดัชชีเหนือ”* ยูจีนรู้ตัวว่าถูก “ซานตาคลอสหน้าหิน” สะกดรอยและมองไม่เห็นเลเวลของอีวาน ส่วนอีวานก็ยืนยันความสงสัยทั้งจากทักษะตรวจจับการพรางตัวและชื่อ “ยูจีน”\n- **บทที่ 21**: **เอนริเก้** ตามสังเกตการณ์อีวานที่ยืนจ้องเป้าหมายไม่หลับไม่นอนอยู่ 3 วันเต็มจนทนไม่ไหว จึงยิงปืนเตือนและพาเขากลับไปที่สถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซีย ที่นั่นเธอประหลาดใจกับวินัยอันเงียบกริบของเด็กๆ รวมถึงการที่อีวานรับ **อิคารัส** ปีศาจมีเขามาอยู่ด้วย และยิ่งตกใจหนักเมื่อเห็นห้องทำงานผู้อำนวยการที่ขึงลวดกับดักเต็มไปหมดพร้อมกระดานวิเคราะห์ข้อมูลและด้ายแดงโยงใยเต็มห้องและเพดาน เมื่อเอนริเก้คาดคั้นอย่างจริงจัง อีวานซึ่งอดนอนมานานหนึ่งสัปดาห์จึงยอมสารภาพความจริงเรื่องที่ตนเป็นผู้กลับชาติมาเกิดจากต่างโลกและเพิ่งพบผู้ข้ามมิติอีกคนซึ่งต้องกำจัดทิ้ง เอนริเก้จึงขอโทษอีวานที่ทุกคนเข้าใจผิดคิดว่าเขาเป็นผู้ปีนหอคอยจอมมารเช่นเดียวกับคนอื่น และเปิดเผยความจริงว่า **ผู้กล้าแม็กซิมิเลียน** ก็ไม่ใช่ชาวทิลีสแต่เป็น “ผู้ที่ถูกดึงตัวมา” จากต่างโลกเหมือนกับอีวานเช่นกัน\n- **บทที่ 22**: **เอนริเก้** ตบหน้าเรียกสติอีวานที่กำลังจมดิ่งในความสิ้นหวังเรื่องจุดจบและชะตากรรมของ **แม็กซิมิเลียน** เธอเตือนสติว่าทุกคนในโลกนี้ต่างก็มีชีวิตจิตใจและเป็นตัวเอกในเรื่องราวของตนเอง ไม่ใช่แค่ตัวประกอบในนิยาย พร้อมยื่นมือปลอบโยนให้อีวานพลิกหน้ากระดาษชีวิตด้วยมือของตัวเองและอาสาเฝ้ายามให้เขานอนหลับ อีวานจึงปลดปล่อยความกดดันและหลับใหลไปโดยฝันย้อนรำลึกถึงวัย 16 ปีสมัยเป็นทหารเกณฑ์ที่ **พระเจ้าอีวานมหาราช** เคยช่วยชีวิตและมอบฉายา “อีวานตัวน้อย” ให้ ทำให้คืนนั้นเขาหลับสนิทไร้ฝันร้าย ขณะเดียวกัน ทางฝั่ง **ยูจีน** หน้าต่างสถานะเควสต์ระดับ `???` ที่ให้สังหารอีวานก็ถูกยกเลิกไปเองอย่างปริศนาด้วยผลของโชคชะตา\n- **บทที่ 23**: อีวานที่ตัดสินใจใช้ชีวิตต่อไปตามคำแนะนำของเอนริเก้ถือกรรไกรตัดแต่งกิ่งไม้ออกมาตัดต้นไม้ทั้งที่สถาบันเซนต์ยันไม่มีสวน **เอนริเก้** จึงชวนเขาไปเป็นผู้ช่วยสอนในวิชาบังคับ *[ความเข้าใจในการต่อสู้ระยะประชิด 1]* ของคณะอัศวินที่เธอรับหน้าที่เป็นอาจารย์พิเศษ และประกาศให้คะแนนพิเศษตามความสาหัสที่นักศึกษาสามารถทำกับ “คนสวน” อีวานได้ อีวานที่กำลังจับตามองกลุ่มคนสำคัญ (ออสการ์, อิซาเบลล์, ยูริ และ **มอร์ด เอริกสัน**) จึงขึ้นสังเวียนประเมินฝีมือ โดยมี **มอร์ด เอริกสัน** (คุณลุงฮัสคาลผู้คุ้มกันเอคไดซิส) อาสาขึ้นสู้เป็นคนแรก\n- **บทที่ 24**: อีวานประลองขวานเอาชนะ **มอร์ด เอริกสัน** ได้อย่างเฉียบขาดและบังคับให้มอร์ดไปทำงานอาสาสมัครซักผ้าที่สถานเลี้ยงเด็กกำพร้าเพื่อผูกมัดไม่ให้เคลื่อนไหวทางการเมือง จากนั้นอีวานก็ไล่โค่นนักศึกษาปี 1 คณะอัศวินทีละคนจนถึงคิวของ **ยูริ แฟรงก์** เมื่ออีวานเอ่ยปากถามแซวเรื่องชื่อเกาหลี (“คิมยูริ พัคยูริ หรือชเวยูริ?”) ยูริก็ตกใจสุดขีดและพ่ายแพ้ให้เชิงขวานของอีวานโดยไร้รอยขีดข่วน ความจริงเปิดเผยว่าเธอคืออดีตนักวาดภาพประกอบชาวเกาหลีใต้ที่ข้ามมิติมาในโลกของเกมผู้ใหญ่ที่ตัวเองเพิ่งวาดส่งงาน (*ฮวีจัก 3*) จึงเข้าใจผิดคิดว่าคนสวนมีผ้าขนหนูพาดคออย่างอีวานเป็นคนสวนโรคจิตที่จะจับเธอไปทำมิดีมิร้าย สุดท้าย **อิซาเบลล์** ต้านได้ 3 กระบวนท่า **ออสการ์** ต้านได้ 2 กระบวนท่า และทั้งอีวานกับเอนริเก้ก็โดน **นักบุญหญิงแพทริเซีย** เทศนายับข้อหาส่งผู้ป่วย 50 คนเข้าไปนอนในคณะเทววิทยา\n- **บทที่ 25**: อีวานและ **เอนริเก้** เข้าไปพบ **นักบุญหญิงแพทริเซีย** ที่ห้องทำงานคณบดีคณะเทววิทยา เอนริเก้เปิดเผยความจริงว่าอีวานเป็น “ผู้ที่ถูกดึงตัวมา” จากต่างโลกเช่นเดียวกับแม็กซิมิเลียน ทำให้แพทริเซียซาบซึ้งใจในความเสียสละของ “บราเดอร์ซีริล” (ชื่อศีลล้างบาปของอีวาน) อย่างยิ่งจนขอตามไปเยี่ยมสถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซียด้วยตนเอง และยิ่งปลาบปลื้มเมื่อเห็นความเป็นอยู่ที่ดีของเด็กๆ กับภาพวาดที่เด็กๆ วาดให้อีวาน\n- **บทที่ 26**: ที่สถานเลี้ยงเด็กกำพร้า **แพทริเซีย** วิเคราะห์ว่าปกติ “ผู้ที่ถูกดึงตัวมา” จะปรากฏตัวเพียงศตวรรษละ 2–3 คน แต่ในยุคนี้กลับมีทั้งจอมมาร แม็กซิมิเลียน และอีวานเมื่อ 20 ปีก่อน แล้วยังมีผู้ต้องสงสัยโผล่มาอีกถึง 3 คน เธอจึงอนุมัติให้อีวานตรวจสอบตัวตนและ “เรื่องราว” ของทั้งสามคน ฝั่ง **ยูจีน (เยฟเกนี)** ที่กำลังนั่งอ่านพระคัมภีร์อยู่ได้รับคำเตือนจาก `[สัญชาตญาณเอาตัวรอด Lv.3]` ให้เดินหนีแต่อีวานก็ตามมาดักตัวไว้ได้และพาตัวไปพร้อมบอกว่าเป็นเรื่องที่แพทริเซียอนุมัติแล้ว ขณะเดียวกันทางฝั่ง **เอิร์นเบิร์ต** คณบดีคณะเวทมนตร์ก็ได้พูดคุยกับแพทริเซียเรื่อง **ออสวัลด์ อีสต์เบลเฟน** นักศึกษาปี 1 ชาวคาลีออนผู้ต้องสงสัยรายที่ 3 ซึ่งเพิ่งหย่าร้างกับอดีตคู่หมั้น **เอเวอลิน รัสต์ฟิสต์** (ตัวออสวัลด์เองก็เป็นผู้ข้ามมิติที่หลุดเข้ามาในนิยาย *[นางร้ายที่คลั่งไคล้จอมเวทอัจฉริยะ]*)\n- **บทที่ 27**: อีวานเจรจากับ **ยูจีน** และพบว่าอีกฝ่ายเป็นคนเกาหลีใต้ที่ข้ามมิติมาจากปี 2022 (หลังอีวาน 1 ปี) และมีหน้าต่างสถานะที่เอาแต่ส่งคำเตือนประหลาดๆ ยูจีนอาสาร่วมมือกับอีวานอย่างกระตือรือร้นและขอเรียกอีวานว่า “ลูกพี่” เพื่อช่วยตั้ง “ชมรมอาสาสมัคร” ใช้เป็นฉากหน้ารวบรวมและตรวจสอบกลุ่มผู้ต้องสงสัยว่าเป็นผู้ข้ามมิติทั้ง 3 คน (ยูจีน, ยูริ และออสวัลด์) จากนั้นทั้งสองคนก็เดินตรงเข้าไปหาวงกินมื้อกลางวันของ **อิซาเบลล์**, **เอคไดซิส** และ **ยูริ** ทำให้ยูริตกใจสุดขีดจนทำแซนด์วิชหล่นเพราะนึกว่า “คนสวนโรคจิต” พาตัวละครสาย “โกลด์ซัน” มาด้วย\n"
};

</script>
  <script>
    const STORAGE_PREFIX = "thirty_years_prologue";
    const data = window.NOVEL_DATA || { novel_title: "30 ปีผ่านไปนับจากบทนำ (30 Years Have Passed Since the Prologue)", chapters: [], illustrations: [] };
    let currentIdx = parseInt(localStorage.getItem(STORAGE_PREFIX + "_ch_idx") || "0", 10);
    let fontSize = parseInt(localStorage.getItem("novel_reader_font_size") || "20", 10);
    let theme = localStorage.getItem("novel_hub_theme") || "dark";
    let currentVolIdx = 0;
    let illustViewMode = localStorage.getItem("novel_reader_illust_view") || "vertical";
    let currentLightboxIdx = 0;

    function goBookshelf() {
      if (location.protocol === "file:") {
        location.href = "../คลังนิยายทั้งหมด.html";
      } else {
        location.href = "../index.html";
      }
    }

    function formatBody(text) {
      const paras = text.split(/\n\s*\n/);
      return paras.map(p => {
        const trimmed = p.trim();
        if (!trimmed) return "";
        if (trimmed === "***" || trimmed === "...") return "<hr/>";
        const html = trimmed
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/\n/g, "<br/>");
        return `<p>${html}</p>`;
      }).join("");
    }

    function updateIllustButtonLabel() {
      const vols = data.illustrations || [];
      const total = vols.reduce((acc, v) => acc + ((v.images || []).length), 0);
      const btn = document.getElementById("btnIllust");
      if (btn) {
        btn.textContent = total > 0 ? `🖼️ ภาพประกอบ (${total})` : `🖼️ ภาพประกอบ`;
      }
    }

    function render() {
      document.getElementById("novelTitle").textContent = data.novel_title || "คลังนิยาย";
      updateIllustButtonLabel();
      const chapters = data.chapters || [];
      if (currentIdx >= chapters.length) currentIdx = Math.max(0, chapters.length - 1);

      const volSel = document.getElementById("volumeSelect");
      const sel = document.getElementById("chapterSelect");
      volSel.innerHTML = "";
      sel.innerHTML = "";

      const ch = chapters[currentIdx];
      if (!ch) {
        document.getElementById("volumeBadge").textContent = "";
        document.getElementById("chapterTitle").textContent = "ยังไม่มีตอนที่แปล";
        document.getElementById("chapterBody").innerHTML = "";
        return;
      }

      const volumes = [];
      chapters.forEach(item => {
        const v = item.volume || "เล่ม 1";
        if (!volumes.includes(v)) volumes.push(v);
      });
      volumes.forEach(v => {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = `📘 ${v}`;
        volSel.appendChild(opt);
      });

      const currentVol = ch.volume || "เล่ม 1";
      volSel.value = currentVol;
      volSel.style.display = volumes.length > 1 ? "" : "none";

      chapters.forEach((item, idx) => {
        if ((item.volume || "เล่ม 1") !== currentVol) return;
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = `${item.title}`;
        sel.appendChild(opt);
      });
      sel.value = currentIdx;

      document.getElementById("volumeBadge").textContent = `📘 ${currentVol}`;
      document.getElementById("chapterTitle").textContent = ch.title;
      document.getElementById("chapterBody").innerHTML = formatBody(ch.content);
      document.getElementById("pageIndicator").textContent = `${currentVol} • ตอนที่ ${currentIdx + 1} จากทั้งหมด ${chapters.length} ตอนที่แปลแล้ว`;

      const hasPrev = currentIdx > 0;
      const hasNext = currentIdx < chapters.length - 1;
      document.getElementById("btnPrevTop").disabled = !hasPrev;
      document.getElementById("btnPrevBottom").disabled = !hasPrev;
      document.getElementById("btnNextTop").disabled = !hasNext;
      document.getElementById("btnNextBottom").disabled = !hasNext;

      localStorage.setItem(STORAGE_PREFIX + "_ch_idx", String(currentIdx));
    }

    function selectVolume(volName) {
      const chapters = data.chapters || [];
      const firstIdx = chapters.findIndex(item => (item.volume || "เล่ม 1") === volName);
      if (firstIdx !== -1) {
        selectChapter(firstIdx);
      }
    }

    function selectChapter(idx) {
      currentIdx = parseInt(idx, 10);
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function prevChapter() { if (currentIdx > 0) selectChapter(currentIdx - 1); }
    function nextChapter() { if (currentIdx < (data.chapters || []).length - 1) selectChapter(currentIdx + 1); }

    function changeFont(delta) {
      fontSize = Math.max(14, Math.min(32, fontSize + delta));
      document.documentElement.style.setProperty("--font-size", fontSize + "px");
      localStorage.setItem("novel_reader_font_size", String(fontSize));
    }

    function setTheme(t) {
      theme = t;
      document.body.classList.remove("theme-sepia", "theme-light");
      if (t !== "dark") {
        document.body.classList.add("theme-" + t);
      }
      document.getElementById("tDark").classList.toggle("active", t === "dark");
      document.getElementById("tSepia").classList.toggle("active", t === "sepia");
      document.getElementById("tLight").classList.toggle("active", t === "light");
      localStorage.setItem("novel_hub_theme", t);
    }

    function toggleMenu(hide) {
      const shouldHide = typeof hide === "boolean"
        ? hide
        : !document.body.classList.contains("menu-hidden");
      document.body.classList.toggle("menu-hidden", shouldHide);
      localStorage.setItem("novel_reader_menu_hidden", shouldHide ? "1" : "0");
    }

    function openModal(type) {
      const m = document.getElementById("infoModal");
      const title = document.getElementById("modalTitle");
      const content = document.getElementById("modalContent");
      if (type === "glossary") {
        title.textContent = "📚 คัมภีร์ตัวละคร คำศัพท์ และสรรพนาม";
        content.textContent = data.glossary || "";
      } else {
        title.textContent = "🧠 เรื่องย่อสะสมแต่ละตอน";
        content.textContent = data.story_memory || "";
      }
      m.classList.add("open");
    }
    function closeModal() {
      document.getElementById("infoModal").classList.remove("open");
    }

    function openIllustModal() {
      const vols = data.illustrations || [];
      const firstWithImgs = vols.findIndex(v => (v.images || []).length > 0);
      if (firstWithImgs !== -1 && ((vols[currentVolIdx] || {}).images || []).length === 0) {
        currentVolIdx = firstWithImgs;
      }
      renderIllustModal();
      document.getElementById("illustModal").classList.add("open");
    }
    function closeIllustModal() {
      document.getElementById("illustModal").classList.remove("open");
    }
    function setIllustView(mode) {
      illustViewMode = mode;
      localStorage.setItem("novel_reader_illust_view", mode);
      renderIllustModal();
    }
    function selectIllustVol(idx) {
      currentVolIdx = idx;
      renderIllustModal();
    }
    function renderIllustModal() {
      const vols = data.illustrations || [];
      const tabList = document.getElementById("volTabList");
      const container = document.getElementById("illustContainer");
      document.getElementById("btnViewVertical").classList.toggle("active", illustViewMode === "vertical");
      document.getElementById("btnViewGrid").classList.toggle("active", illustViewMode === "grid");

      tabList.innerHTML = "";
      vols.forEach((v, idx) => {
        const count = (v.images || []).length;
        const btn = document.createElement("button");
        btn.className = idx === currentVolIdx ? "active" : "";
        btn.textContent = `📁 ${v.volume} (${count})`;
        btn.onclick = () => selectIllustVol(idx);
        tabList.appendChild(btn);
      });

      const activeVol = vols[currentVolIdx];
      const imgs = activeVol ? (activeVol.images || []) : [];

      if (!activeVol || imgs.length === 0) {
        const folderName = activeVol ? activeVol.volume : "เล่ม 1";
        container.innerHTML = `
          <div class="empty-illust-guide">
            <strong style="color: var(--accent); font-size: 16px;">💡 ยังไม่มีรูปภาพในโฟลเดอร์ "${folderName}"</strong>
            <p style="margin: 10px 0 6px;">วิธีเพิ่มภาพประกอบไลท์โนเวลแบบแยกตามเล่มง่ายๆ:</p>
            <ol style="margin: 0; padding-left: 22px;">
              <li>นำไฟล์รูปภาพ (<code>.jpg</code>, <code>.png</code>, <code>.webp</code>) ไปวางใส่โฟลเดอร์ <code>illustrations/${folderName}/</code> (หรือสร้างโฟลเดอร์ <code>เล่ม 1</code>, <code>เล่ม 2</code>, <code>เล่ม 3</code> เพิ่มได้ตามต้องการ)</li>
              <li>ตั้งชื่อไฟล์เรียงตามลำดับ เช่น <code>00_cover.jpg</code>, <code>01.jpg</code>, <code>02.jpg</code> ระบบจะเรียงรูปให้ตามตัวเลขและนำรูป cover ขึ้นเป็นหน้าปกให้เอง</li>
              <li>ดับเบิลคลิกไฟล์ <code>เปิดคลังนิยายทั้งหมด.bat</code> หรือ <code>เปิดอ่านนิยาย.bat</code> รูปทั้งหมดจะแสดงในหน้านี้ทันทีครับ!</li>
            </ol>
          </div>
        `;
        return;
      }

      const listClass = illustViewMode === "grid" ? "illust-list-grid" : "illust-list-vertical";
      container.innerHTML = `<div class="${listClass}">` + imgs.map((img, i) => `
        <div class="illust-card" onclick="openLightbox(${i})">
          <img src="${encodeURI(img.src)}" alt="${img.name}" loading="lazy" />
          <div class="illust-caption">${i + 1}. ${img.name}</div>
        </div>
      `).join("") + `</div>`;
    }

    function openLightbox(imgIdx) {
      const vols = data.illustrations || [];
      const imgs = (vols[currentVolIdx] || {}).images || [];
      if (!imgs.length) return;
      currentLightboxIdx = (imgIdx + imgs.length) % imgs.length;
      const item = imgs[currentLightboxIdx];
      document.getElementById("lightboxImg").src = encodeURI(item.src);
      document.getElementById("lightboxCaption").textContent = `[${vols[currentVolIdx].volume}] รูปที่ ${currentLightboxIdx + 1}/${imgs.length} — ${item.name}`;
      document.getElementById("lightbox").classList.add("open");
    }
    function stepLightbox(delta) {
      openLightbox(currentLightboxIdx + delta);
    }
    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("open");
    }

    document.addEventListener("keydown", (e) => {
      const lbOpen = document.getElementById("lightbox").classList.contains("open");
      if (lbOpen) {
        if (e.key === "ArrowLeft") stepLightbox(-1);
        if (e.key === "ArrowRight") stepLightbox(1);
        if (e.key === "Escape") closeLightbox();
        return;
      }
      if (e.key === "ArrowLeft") prevChapter();
      if (e.key === "ArrowRight") nextChapter();
      if (e.key === "m" || e.key === "M") toggleMenu();
      if (e.key === "Escape") {
        closeModal();
        closeIllustModal();
      }
    });

    document.documentElement.style.setProperty("--font-size", fontSize + "px");
    setTheme(theme);
    if (localStorage.getItem("novel_reader_menu_hidden") === "1") {
      toggleMenu(true);
    }
    render();
  </script>

  <div id="pinGateOverlay" style="display:none; position:fixed; inset:0; z-index:99999; background:#0f172a; color:#e2e8f0; flex-direction:column; align-items:center; justify-content:center; padding:20px; font-family:'Sarabun','Segoe UI',sans-serif;">
    <div style="background:#1e293b; border:1px solid #334155; border-radius:14px; padding:28px 26px; max-width:340px; width:100%; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.4);">
      <div style="font-size:38px; margin-bottom:8px;">🔒</div>
      <div style="font-size:18px; font-weight:bold; color:#38bdf8; margin-bottom:6px;">คลังนิยายส่วนตัว</div>
      <div style="font-size:13px; color:#94a3b8; margin-bottom:16px;">กรอกรหัส PIN เพื่อเข้าอ่าน (จำรหัสอัตโนมัติในเครื่องนี้)</div>
      <input id="pinGateInput" type="password" inputmode="numeric" placeholder="รหัส PIN..." style="width:100%; padding:10px 12px; font-size:18px; text-align:center; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#f8fafc; margin-bottom:12px;" onkeydown="if(event.key==='Enter') checkPinGate()" />
      <button onclick="checkPinGate()" style="width:100%; padding:10px; font-size:15px; font-weight:bold; border-radius:8px; border:none; background:#38bdf8; color:#020617; cursor:pointer;">เข้าสู่คลังนิยาย</button>
      <div id="pinGateErr" style="color:#f87171; font-size:13px; margin-top:10px; display:none;">❌ รหัส PIN ไม่ถูกต้อง</div>
    </div>
  </div>
  <script>
    (function() {
      const EXPECTED_PIN = "0909";
      if (localStorage.getItem("novel_hub_pin_ok") !== EXPECTED_PIN) {
        const gate = document.getElementById("pinGateOverlay");
        if (gate) gate.style.display = "flex";
      }
      window.checkPinGate = function() {
        const val = (document.getElementById("pinGateInput").value || "").trim();
        if (val === EXPECTED_PIN) {
          localStorage.setItem("novel_hub_pin_ok", EXPECTED_PIN);
          document.getElementById("pinGateOverlay").style.display = "none";
        } else {
          document.getElementById("pinGateErr").style.display = "block";
        }
      };
    })();
  </script>
</body>
</html>
