      "title": "บทที่ 7",
      "content": "“อั่ก… แค่ก… เจ็บชะมัด…”\n\n“ไม่เป็นไร นายไม่ตายหรอก”\n\n“ปล่อยให้ฉันตายไปเถอะ…”\n\n“อย่าพูดแบบนั้นสิ”\n\nอีวานกระซิบอย่างอ่อนโยนขณะเทโพชั่นราดลงบนร่างของฮิวโก้\n\nทันทีที่ของเหลวเย็นเยียบระยิบระยับดุจแสงดาวสัมผัสกับผิวหนัง ฮิวโก้ก็ชักกระตุกพลางเปล่งเสียงครวญครางออกมาเบาๆ\n\nอีวานเข้าใจหัวอกของชายคนนี้เป็นอย่างดี ทหารส่วนใหญ่ในแนวหน้าต่างรังเกียจโพชั่นรักษาบาดแผล ทั้งที่มันมีความสำคัญเทียบเท่าเสบียงอาหาร ทั้งรุ่นพี่ ผู้บังคับบัญชา และแม้แต่ศัตรูต่างก็เห็นพ้องต้องกันในข้อนี้ เพราะรู้ซึ้งถึงความทรมานที่มันก่อขึ้น\n\nตัวอีวานเองก็เคยถูกบังคับให้ดื่มโพชั่นรักษาบาดแผลในตอนที่แขนเกือบขาดมาแล้ว\n\n“ยอมเสียแขนไปเลยยังดีกว่า! อ๊ากกกกก!!”\n\n“กรุณาอย่าพูดแบบนั้นสิ เปโตรวิช ร่างกายของนายคือสมบัติของชาตินะ!”\n\n“ใครมันจะไปปฏิบัติกับสมบัติแบบนี้กันวะ!!!”\n\nนั่นเป็นเหตุการณ์สมัยที่เขายังหนุ่มและยังอ่อนต่อโลก หลังจากประสบการณ์สุดสยองครั้งนั้น อีวานก็ระมัดระวังตัวแจเพื่อไม่ให้ได้รับบาดเจ็บสาหัสอีก\n\nโพชั่นรักษาบาดแผลสร้างความเจ็บปวดไม่ต่างจากยาต้องสาปในอดีตสมัยที่เขายังเป็นคิมซอนอู — ยาที่มีชื่ออันน่าสะพรึงว่า ‘อัลโบซิล’\n\nทว่า ในช่วงเวลาที่ประจำการอยู่ในหน่วยเก็บกวาด อีวานกลับค้นพบคุณค่าใหม่ของโพชั่นรักษาบาดแผล\n\nความเจ็บปวดที่เกิดจากโพชั่นรักษาบาดแผลนั้นราวกับเอาเกลือมาทาลงบนแผลสด\n\nแต่มันก็ช่วยสมานแผลได้จริงอย่างปฏิเสธไม่ได้\n\nดังนั้น แม้ในระหว่างขั้นตอนการรักษาบาดแผลที่เกิดขึ้นระหว่างการสอบปากคำ การซักถามก็ยังคงดำเนินต่อไปได้\n\nนับเป็นการสอบปากคำที่ยั่งยืนอย่างแท้จริง เพื่อนร่วมงานของอีวานในหน่วยเก็บกวาดต่างพากันทึ่งกับแนวทางนี้ของเขา (น่าเสียดายที่ในโลกใบนี้ ยังไม่มีการบัญญัติอนุสัญญาเจนีวาขึ้นมาคุ้มครองสิทธิของเชลยศึก)\n\n“ไม่… ฉันไม่รู้… ไม่มี… ไม่มีอะไรจะบอกแกอีกแล้ว! ได้โปรด… พอที…”\n\n“แกมันไร้ประโยชน์ยิ่งกว่าที่ฉันคาดไว้เสียอีก”\n\n“ช่วยฉันด้วย… ไม่สิ ฆ่าฉันให้ตายๆ ไปซะ…”\n\n“ไม่ได้ แกต้องมีชีวิตอยู่”\n\nเพราะหมอนี่คือบอสประจำด่านฝึกสอนยังไงล่ะ\n\nซ่า\n\nอีวานกรอกโพชั่นเข้าไปในปากของชายคนนั้นอีกครั้ง ปิดปากเขาไว้ แล้วลุกขึ้นยืน\n\nเขาพบว่ากลุ่มอาชญากรที่ก่อเหตุร้ายบนรถไฟสวมเสื้อโค้ตหนาเตอะ เป็นชายวัยผู้ใหญ่ทั้งหมด และอำพรางใบหน้าด้วยเวทมนตร์ขัดขวางการจดจำ\n\nเมื่อคำนึงว่านี่คือเดือนมกราคม การที่ผู้ชายวัยผู้ใหญ่จะสวมเสื้อโค้ตหนาก็ไม่ใช่เรื่องแปลกอะไร\n\nไม่สามารถระบุสัญชาติของพวกมันจากคำพูดหรือสำเนียงได้เลย อีวานไม่คาดคิดมาก่อนว่าผู้บงการจะไม่ทิ้งรายละเอียดจำเพาะพวกนี้ไว้ให้สืบสาวเลย\n\nอีวานเดาะลิ้นเบาๆ แล้วกวาดสายตามองไปทางขบวนรถไฟ ตัวรถไฟยังคงเงียบสงบ ซึ่งไม่ใช่สัญญาณที่ไม่ดีเสียทีเดียว\n\n“องค์หญิงเอคไดซิสยังคงสู้ติดพันอยู่”\n\nหากองค์หญิงเอคไดซิสเป็นฝ่ายพ่ายแพ้ พวกโจรก็คงกรูกันออกมาจากรถไฟแล้ว ถึงพวกมันจะไม่พบทองคำแท่ง แต่ก็ได้จับตัวชนชั้นสูงไว้เรียกค่าไถ่แทน\n\nทว่ายังไม่มีใครออกมาจากรถไฟเลย ซึ่งเป็นสัญญาณว่าเอคไดซิสยังคงปลอดภัยดี\n\nคิดได้ดังนั้น ในจังหวะที่อีวานลุกขึ้นเตรียมเดินเข้าไปใกล้ขบวนรถไฟ\n\nในเสี้ยววินาทีนั้นเอง สัญญาณเตือนภัยก็ส่งเสียงร้องเตือนอันรุนแรงเข้าใส่กลางหน้าผากของเขา\n\nหน้าผากเหรอ?\n\nไม่ใช่ มันพุ่งเข้าใส่ทั่วทั้งใบหน้าของเขาต่างหาก\n\n“ฟู่—”\n\nท่ามกลางเสียงแหวกอากาศอันรุนแรง\n\n“คว้ากกก—!!”\n\nไม่ต่างจากกระสุนปืนลูกซอง ก้อนหินขนาดใหญ่พุ่งเฉียดจุดที่อีวานเพิ่งยืนอยู่เมื่อครู่ไปอย่างหวุดหวิด\n\nอีวานหลบหลีกอย่างฉับไว เบี่ยงตัวพ้นจากแนววิถีการโจมตี ตูม ตูม ตูม! เศษหินก้อนหนึ่งพุ่งเข้ากระแทกฮิวโก้เต็มเปา\n\n“ออกมา”\n\nผู้ขว้างแสดงให้เห็นถึงพละกำลังอันเหนือความคาดหมาย\n\nดังนั้น อีกฝ่ายย่อมต้องรู้จัก ‘แนววิถีโจมตี’ ด้วยเช่นกัน\n\nในเมื่อเป็นที่ชัดเจนว่ากำลังจะถูกลากเข้าสู่การต่อสู้เต็มรูปแบบ อีกฝ่ายก็จำเป็นต้องเผยตัวออกมา\n\n“หัวหน้าของพวกเราเป็นสัตว์ประหลาดตัวจริง!”\n\nเมื่อกี้ฉันปัดคำพูดนั้นทิ้งไปเพราะคิดว่ามาจากปากพวกมือสมัครเล่นที่ไม่รู้จักแม้กระทั่ง ‘แนววิถีกระสุน’ นี่จะบอกฉันว่าไอ้ฮิวโก้นี่ไม่ใช่หัวหน้าตัวจริงงั้นเหรอ? ถ้างั้นเมื่อกี้ฉันก็เสียโพชั่นไปฟรีๆ ตั้งหลายขวดน่ะสิ\n\nอีวานครุ่นคิดอย่างเยือกเย็นขณะเฝ้ามองชายที่กำลังเดินตรงเข้ามาจากระยะไกล\n\n“แกอึดใช้ได้นี่หว่า”\n\nชายวัยกลางคนร่างกำยำที่เต็มไปด้วยมัดกล้ามแข็งแกร่งราวกับหินผาเดินตรงเข้ามาพลางคำรามเสียงต่ำ\n\nรัศมีอันคุกคามอย่างรุนแรงแผ่ซ่านเข้าโอบล้อมตัวอีวาน\n\n“แต่การที่แกบังอาจมาทำร้ายหลานของข้า แสดงให้เห็นถึงความโง่เขลาของแกแม้จะมีฝีมืออยู่บ้าง”\n\nหลานเหรอ? หมอนี่เป็นญาติกับมันงั้นเรอะ? น่ารำคาญชะมัด\n\nอีวานกัดฟันกรอด สอดปืนพกเข้าซองแล้วกระชับขวานขึ้นมาถือไว้ในมือทั้งสองข้าง\n\n“แกควรจะมีข้อมูลที่มีค่าติดตัวมาบ้างนะ”\n\n“ไร้สาระ… เข้ามาสิ ข้าจะปิดบัญชีชีวิตแกเอง”\n\nชายคนนั้นแยกเขี้ยวพลางเงื้อขวานขึ้นสูง\n\nในเสี้ยววินาทีถัดมา ชายทั้งสองก็พุ่งเข้าปะทะกันอย่างดุเดือด\n\n***\n\n“วูม! ตึง!!”\n\nเอคไดซิสกัดฟันกรอดเมื่อได้ยินเสียงไม้หน้าไวโอลินบิดงอ\n\n“ช่วยทนอีกหน่อยนะ พี่วีโอ!”\n\nไวโอลินไม่ได้ถูกสร้างมาเพื่อใช้ฟาดฟัน เครื่องดนตรีส่วนใหญ่ อย่างเช่นกีตาร์ไฟฟ้า ก็ไม่ได้ถูกสร้างมาเพื่อจุดประสงค์นั้น พวกมันจะเปล่งประกายบนเวทีผ่านการบรรเลงเท่านั้น\n\nดังนั้น ในทุกครั้งที่เอคไดซิสเหวี่ยงเครื่องสายไม้แสนบอบบางและเปราะบางชิ้นนี้ แผ่นไม้ด้านหน้าก็เริ่มบิดเบี้ยว แผ่นหลังโค้งงอ และค่อยๆ แตกหักลงทีละน้อย\n\nทว่า พี่วีโอ (ไวโอลินอายุ 2 ขวบ) ไม่เคยทอดทิ้งความทรงจำและมิตรภาพที่มีร่วมกันกับเอคไดซิสเลยสักครั้ง\n\nในทุกครั้งที่พี่วีโอถูกกวัดแกว่ง มักจะมีบางสิ่งแตกสลาย — ซึ่งส่วนใหญ่ก็คือหัวกะโหลกของชายวัยฉกรรจ์\n\n“นังนี่มันบ้าไปแล้ว! ผู้หญิงคนนั้นเป็นบ้าอะไรวะเนี่ย!!”\n\n“ทองอยู่ที่ไหน! เฮ้ย! เกิดอะไรขึ้นกับตู้สินค้า!”\n\n“ไม่มีอะไรเลย!! พวกเราโดนหลอกแล้ว!”\n\nพวกโจรอยากจะหนีเต็มแก่ ไม่มีทองคำ รถไฟก็ระเบิดพังยับ แถมกองทัพต้องส่งคนมาไล่ล่าแน่นอน ในขณะเดียวกัน ผู้หญิงถือไวโอลินคนนี้ก็ไล่หวดพวกมันร่วงระนาวทั้งซ้ายขวา\n\nเอคไดซิสเองก็อยากจะหนีเหมือนกัน ชีวิตของพี่วีโอที่ค่อยๆ ร่อยหรอลงสัมผัสได้อย่างชัดเจนในทุกวินาทีที่ผ่านไป การต่อสู้ช่างน่ากลัว แถมเธอยังไม่รู้ด้วยซ้ำว่าตอนนี้ตัวเองอยู่ที่ไหน\n\n“ผัวะ!”\n\n“โครม!”\n\nพี่วีโอซัดฟันของโจรอีกคนจนร่วงกราว และในที่สุดก็สิ้นใจลง\n\nเอคไดซิสประคองเศษไม้หน้าไวโอลินที่หลงเหลืออยู่ไว้ในมือ พลางถอนหายใจออกมาด้วยหัวใจอันหนักอึ้ง\n\n“พี่วีโอ… พี่เป็นเครื่องดนตรีที่ยอดเยี่ยมที่สุดเลยค่ะ…”\n\n“ยัยบ้า ยัยปีศาจชัดๆ!!”\n\n“พวกเราไม่ควรรีบหนีไปหรอกเหรอ? นี่ไม่ใช่เวลามาสู้แล้วนะ!”\n\n“นังนี่มันบีบให้พวกเราต้องสู้ตายชัดๆ!”\n\n“หัวหน้าหายหัวไปไหนแล้ววะ!”\n\nโดยไม่รู้เลยว่ากำลังเกิดการปะทะกันอย่างดุเดือดระหว่างชายร่างกำยำกับเจ้าหน้าที่หน่วยรบพิเศษอยู่ข้างนอก พวกโจรพากันถอยกรูดพลางบ่นพึมพำและลังเลใจ\n\nแต่นั่นกลับกลายเป็นความผิดพลาดมหันต์\n\n***\n\nธิดาของ ‘จอมเชือด’ ไอนาร์ได้รับลักษณะหลายอย่างมาจากแม่ แต่โดยเฉพาะในเรื่อง ‘ความโกรธ’ ‘จิตวิญญาณนักสู้’ และ ‘ทักษะการต่อสู้’ เธอถอดแบบมาจากพ่อมาเต็มๆ\n\nสำหรับเหล่านักรบแห่งโดรเวียน พวกเขาเปรียบเสมือนพี่น้องร่วมสายเลือด เธอไม่อาจปล่อยให้ความตายของสหายร่วมเป็นร่วมตายอย่างพี่วีโอ (เครื่องดนตรีอายุ 2 ขวบ) ต้องสูญเปล่าได้\n\nด้วยท่าทีอันนุ่มนวล เธอประคองลูบเศษซากของพี่วีโออย่างทะนุถนอมก่อนจะค่อยๆ ยันกายลุกขึ้นยืน\n\n“พี่วีโอ หนูจะจดจำความเสียสละของพี่ไว้ตลอดไป ขอบคุณมาตลอด และขอโทษด้วยนะคะ”\n\n“นังผู้หญิงคนนั้นมันบ้าไปแล้ว ข้าจะต้านมันไว้เอง พวกแกหนีไปซะ”\n\n“ลูกพี่!!”\n\n“เร็วเข้า! พวกแกเองก็ต้องรอดชีวิตกลับไปให้ได้นะ!”\n\nเศษเดนโจรที่เหลือหันหลังวิ่งหนีทั้งน้ำตา มุ่งหน้ากลับไปยังจุดที่หัวหน้าของพวกมันอยู่\n\nท่ามกลางการล่าถอยนั้น โจรคนสุดท้ายที่ยังคงอยู่หันกลับมาหาเอคไดซิสด้วยสีหน้าแน่วแน่\n\n“ได้โปรดอย่าเข้าใจผิดนะครับ คุณหนู”\n\n“…คะ?”\n\n“พวกเราไม่รู้เลยจริงๆ ว่าคุณหนูอยู่บนรถไฟขบวนนี้ แต่ถ้าคุณหนูไว้ชีวิตพวกเรา พวกเราจะไปให้การเป็นพยานในศาลให้ คราซิลอฟเป็นประเทศแห่งความยุติธรรมไม่ใช่เหรอครับ? ไว้ชีวิตพวกเราด้วย!”\n\nโจรคนนั้นทิ้งอาวุธลงพื้น คุกเข่า แล้วอ้อนวอนขอชีวิต นับเป็นการตัดสินใจที่ชาญฉลาด\n\nเพราะเหล่าโจรที่วิ่งหนีออกไปในตอนนี้ ต่างก็ตกอยู่ตรงกลางระหว่างฮัสคาลผู้เกรี้ยวกราดกับเจ้าหน้าที่หน่วยเก็บกวาดผู้กำลังเดือดดาลเข้าให้แล้ว\n\n***\n\n“จะขนพวกมือสมัครเล่นมาเพิ่มทำไมนักหนาวะ!”\n\n“…รอดชีวิตออกมาเยอะพอสมควรเลยนี่ แต่ก็ไม่ได้เปลี่ยนแปลงอะไรหรอก”\n\nชายทั้งสองที่กำลังต่อสู้แลกคมขวานกันอยู่ร้องตะโกนออกมาพร้อมกันเมื่อเหลือบเห็นพวกโจรวิ่งกรูกันออกมาจากขบวนรถไฟ\n\n“เอคไดซิส เกิดอะไรขึ้นกับผู้หญิงบนรถไฟขบวนนั้น? มีเด็กสาวผมบลอนด์อยู่ข้างใน เธอปลอดภัยดีใช่ไหม?”\n\n“หลานข้า!! หลานข้าปลอดภัยดีใช่ไหม?!”\n\nอีวานชะงักไปครู่หนึ่งเมื่อได้ยินเสียงร้องตะโกนของชายคนนั้น\n\nหลานที่ว่าไม่ใช่อีตาหมอนี่หรอกเหรอ?\n\nอีวานเหลือบมองฮิวโก้ที่โดนสะเก็ดหินกระแทกจนสลบเหมือดอยู่กลางสมรภูมิพลางทำหน้าเหยเก\n\nการต่อสู้ครั้งนี้มันยากเย็นแสนเข็ญเป็นบ้า\n\nสำหรับด่านฝึกสอนช่วงต้นเกม ชายตรงหน้านี้ถือเป็นบอสที่ออกแบบมาเกินเบอร์ไปมาก\n\nดูเหมือนหมอนี่จะถูกวางตัวไว้เป็นด่านสกัดผู้เล่นคล้ายกับเกมตระกูลโซลส์ แต่รูปแบบการโจมตีของมันหลากหลายเกินกว่าที่ผู้เล่นมือใหม่จะรับมือไหว\n\nถ้างั้น…\n\n“เหตุการณ์โจมตีรถไฟของสถาบันไม่มีทางจบลงที่ความตายของตัวเอก จะต้องมีผู้ช่วยเหลือปรากฏตัวขึ้นมาให้การสนับสนุนเสมอ”\n\nหรือว่าชายคนนี้คือผู้ช่วยเหลือ?\n\nบางทีบอสด่านฝึกสอนนี้อาจตั้งใจให้ผู้เล่นเรียนรู้ระบบการต่อสู้แบบร่วมมือกัน โดยรับมือกับฝูงมือสมัครเล่นที่หนีออกมาจากรถไฟพร้อมกับบอสที่ฝีมือไม่เอาอ่าว\n\nอีวานถอนหายใจพลางเตรียมขวานในมือ มันบิ่นและเยินเกินกว่าจะเก็บไว้ใช้ต่อแล้ว ถึงอาวุธจะเป็นของใช้แล้วทิ้งก็เถอะ แต่เขาก็อดรู้สึกเสียดายไม่ได้\n\n“เดี๋ยวนะ ช้าก่อน เมื่อกี้พวกแกสองคนไม่ได้ร่วมมือกันอยู่หรอกเรอะ…?”\n\n“ไม่เข้าใจเหมือนกันว่านายไปเอาความคิดผิดๆ แบบนั้นมาจากไหน”\n\nชายคนนั้นเก็บอาวุธลงพลางจ้องอีวานเขม็ง\n\n“ก็แกเป็นคนเอาโพชั่นรักษาบาดแผลไปราดให้ไอ้หมอนั่นเองกับมือ”\n\n“อ้อ เข้าใจละ”\n\nจะให้อธิบายว่าเป็นวิธีการสอบปากคำของหน่วยเก็บกวาดก็ดูจะเกินจริงไปหน่อย ไม่มีวิธีอธิบายให้ฟังดูน่าเชื่อถือได้เลย\n\nอีวานยักไหล่\n\n“ฉันกำลังสืบสวนอะไรบางอย่างอยู่น่ะ”\n\n“อ้าว แล้วทำไมไม่บอกให้เร็วกว่านี้เล่า”\n\nทว่าไม่มีเวลาให้อีวานได้อธิบายอะไรต่อ\n\nขณะที่อีวานกำลังมองชายตรงหน้าด้วยสีหน้าลำบากใจ อีกฝ่ายก็ฉีกยิ้มกว้างเมื่อสังเกตเห็นหญิงสาวคนหนึ่งเดินโซเซออกมาจากขบวนรถไฟ\n\n“หลานสาวข้า!! เอคไดซิส!! เจ้าปลอดภัยดีสินะ!!”\n\n“คุณลุง?!”\n\nอีวานเมินเฉยต่อชายที่พุ่งตัวออกไป แล้วหันไปมองพวกโจรที่กำลังขวัญหนีดีฝ่อท่ามกลางซากปรักหักพังที่ดูเละเทะราวกับเพิ่งโดนระเบิดลง\n\nเป้าหมายปลอดภัยดี และผู้ช่วยเหลือก็มีฝีมือมากพอที่จะคุ้มครองเป้าหมายไปจนถึงสถาบันเซนต์ยันได้\n\nการเปิดเผยตัวตนของเขาจะนำมาซึ่งความยุ่งยาก แถมเอคไดซิสก็ดูเหมือนจะจำเขาได้ ถึงเวลาจะล่วงเลยมานานถึงเจ็ดปีแล้ว แต่เธอก็อาจจะยังจำอีวานได้อยู่ดี ทั้งที่ตอนนั้นเธอยังเป็นแค่เด็กหญิงอายุสิบขวบ\n\nข้อมูลทั้งหมดที่พอจะหาได้ถูกเก็บรวบรวมไว้ครบถ้วนแล้ว อีวานหันหลังกลับและถอนตัวออกไป\n\n***\n\nเอคไดซิส ธิดาคนโตของเบอร์เซิร์กเกอร์ไอนาร์\n\nเดินทางถึงคราซิลอฟแล้ว\n\nฝ่ายโดรเวียนส่งฮัสคาล (คาดว่านะ) มาทำหน้าที่คุ้มกัน\n\nรับประกันความปลอดภัยของเป้าหมายเรียบร้อย\n\nอีวานส่งรายงานสั้นๆ ที่เข้ารหัสแล้วไปยังราชสำนักอย่างเร่งด่วน ก่อนจะขึ้นรถไฟมุ่งหน้าสู่เมืองหลวง\n\nวันนี้เหนื่อยสายตัวแทบขาดเมื่อเทียบกับผลลัพธ์ที่ได้\n\n****\n\n“เอคไดซิส เจ้าพอจะจำคนที่ชื่ออีวานได้บ้างไหม?”\n\n“คุณอีวานเหรอคะ?! ค่ะ จำได้แน่นอนอยู่แล้ว!”\n\nเอคไดซิสที่ใบหน้าเปล่งประกายขึ้นมาทันทีเมื่อได้ยินชื่ออันคุ้นเคย พลันแปรเปลี่ยนเป็นสีหน้าหม่นหมองลงในเวลาอันสั้น\n\n“เขาเป็นคนที่ยอดเยี่ยมมากจริงๆ ค่ะ… ทั้งใจดีแล้วก็น่าทึ่งมากด้วย…”\n\n“เรื่องนั้นข้าก็ไม่แน่ใจหรอก แต่ก็ช่างเถอะ”\n\nชายคนนั้นเดินนำหน้าต่อไปพลางขมวดคิ้วมุ่น\n\nใต้แคร่หามชั่วคราวที่ดัดแปลงมาจากบานประตูตู้รถไฟที่ฉีกขาด พวกโจรราวหกคนกำลังตัวสั่นงันงกช่วยกันแบกแคร่หามเดินไปตามทาง\n\nเขาเอ่ยด้วยน้ำเสียงแผ่วเบาเพื่อไม่ให้เอคไดซิสที่นั่งอยู่บนแคร่ได้ยิน พึมพำกับตัวเองว่า “ข้านึกว่าได้ยินข่าวว่าเขาตายไปเมื่อสองปีก่อนแล้วเสียอีก”\n\nรูปแบบการต่อสู้ของหมอนั่นช่างคุ้นตา แถมยังเคยร่วมรบกับหน่วยคอมมานโดของคราซิลอฟอีก\n\nความคุ้นเคยในการใช้ขวานนั้นแปลกประหลาดอย่างยิ่ง คล้ายคลึงกับวิชาของไอนาร์มาก หากเป็นคนจากคราซิลอฟที่ร่ำเรียนวิชาขวานมาจากไอนาร์ ก็มีเพียงคนเดียวเท่านั้นที่ตรงตามคำบอกเล่า\n\n“ตัวสำรอง อีวาน เปโตรวิช”\n\nหรือให้เจาะจงกว่านั้นคือ ‘ตัวสำรองผู้กล้า’ อีวาน เปโตรวิช เขาเคยถูกพิจารณาให้เป็นตัวเลือกที่มีศักยภาพในการเข้าร่วมปาร์ตี้ผู้กล้าหากมีตำแหน่งว่างลง\n\nบุคคลผู้นั้นขึ้นชื่อเรื่องการผูกมิตรกับหนึ่งในเจ็ดราชามังกรระหว่างศึกกวาดล้างหลังการตายของจอมมาร\n\nเนื่องจากหนวดเคราอันหนาทึบ ป่าทึบ และแววตาที่เปี่ยมไปด้วยโทสะ ฮันจึงไม่มีโอกาสได้พิจารณารูปลักษณ์ของอีกฝ่ายอย่างถี่ถ้วนนัก\n\nหมอนั่นดูเหมือนจะสังกัดหน่วยข่าวกรองของราชวงศ์ ดังนั้นฮันจึงมั่นใจว่าพวกเขาจะต้องได้พบกันอย่างน้อยสักครั้งระหว่างทำงานอยู่ในเมืองหลวง\n\nถึงตอนนั้น หมอนั่นก็น่าจะคิดโกนหนวดเสียบ้างนะ ชายคนนั้นยักไหล่แล้วเดินจากไป\n\nการเดินทางสู่เมืองหลวงคงต้องใช้เวลาอีกหนึ่งสัปดาห์เต็ม\n\n‘นักศึกษาใหม่’ ทั้งสองแห่งสถาบันเซนต์ยันจึงได้เริ่มต้นการเดินทางด้วยแคร่หามรถไฟ!"
    },

      "title": "บทที่ 8",
      "content": "สมัยที่ฉันประจำการอยู่ในหน่วยเก็บกวาด พวกเราต้องรับมือกับเรื่องหนักหนาสาหัสเอาการอยู่หลายเรื่อง\n\nมีกลุ่มแม่ทัพระดับหัวกะทิในกองทัพปีศาจที่ถูกขนานนามว่า เจ็ดราชามังกร แต่ละตนต่างเดิมพันด้วยเกียรติยศของเผ่าพันธุ์ตัวเอง และยกย่องตัวเองว่าเป็น ‘ผู้กล้า’ แห่งเผ่าพันธุ์นั้นๆ\n\nก่อนที่ปาร์ตี้ผู้กล้าจะปรากฏตัวขึ้น สหราชอาณาจักรโดนพวกปีศาจพวกนี้ไล่ถลุงจนยับเยินไม่เป็นท่า\n\nมันเป็นไปไม่ได้เลยที่จะต้านทานเหล่าอสูรกายพวกนั้น เพราะพวกมันเหนือกว่ามนุษย์ทั้งในด้านพละกำลังกาย แถมยังหมายมั่นปั้นมือจะยึดครองโลกให้จงได้\n\nสงครามกับกองทัพปีศาจนั้นโดยเนื้อแท้แล้วคือสงครามระหว่างเผ่าพันธุ์มนุษย์กับสิ่งมีชีวิตเผ่าพันธุ์อื่นทั้งหมด\n\nบรรดามันสมองของสหราชอาณาจักรที่กำลังอับจนหนทาง จึงได้คิดค้นแผนการหนึ่งขึ้นมา\n\n“เพื่อทำลายความเป็นเอกภาพของพวกปีศาจ เราจำเป็นต้องใช้แผนลอบเร้น ไม่ใช่การตะลุมบอนซึ่งหน้า”\n\nพวกเขาส่งทหารของเราไปยันแนวหน้า พยายามรักษาป้อมปราการไว้อย่างสุดชีวิต\n\nในขณะเดียวกัน พวกเขาก็วางแผนส่ง ‘มือสังหาร’ เข้าไปเด็ดหัวเจ็ดราชามังกรเพื่อทำลายความสามัคคีของฝ่ายศัตรู\n\nเนื่องจากพวกปีศาจก็เป็นเพียงการรวมตัวของชนเผ่าที่แข็งแกร่งหลายเผ่า เมื่อเจ็ดราชามังกรตายลง ลูกสมุนของพวกมันก็จะเริ่มห้ำหั่นกันเองเพื่อแย่งชิงตำแหน่งสูงสุด จนเกิดความขัดแย้งภายใน\n\nและเชื่อไหมล่ะ? แผนนั้นมันดันได้ผลเสียด้วย\n\nดังนั้น ถ้ามองในภาพรวม ปาร์ตี้ผู้กล้าก็เป็นแค่หน่วยลอบสังหารดีๆ นี่เอง\n\nถูกโยนเข้าไปในสมรภูมิแต่ก็รอดกลับมาแบบครบสามสิบสองได้ทุกครั้ง นั่นคือเหตุผลว่าทำไมแม้แต่กษัตริย์ผู้ยิ่งใหญ่จากอาณาจักรต่างๆ ยังไม่กล้าไปแหยมกับพวกนั้นสุ่มสี่สุ่มห้า\n\nนั่นแหละคือเหตุผลที่อีวานทนขี้หน้าปาร์ตี้ผู้กล้าไม่ค่อยได้\n\nมันชวนให้เขานึกถึงเหตุผลที่ราชวงศ์คราซิลอฟตัดสินใจยุบหน่วยเก็บกวาดทิ้ง\n\nพวกเราใช้ดาบเก่งเกินไปกว่าจะเก็บเอาไว้ในยามบ้านเมืองสงบสุข\n\nอีวานรวบรวมกำหนดการเดินทางของลูกหลานปาร์ตี้ผู้กล้ามาเก็บไว้เป็นข้อมูลข่าวกรอง แล้วใช้เวลาว่างอย่างสบายอารมณ์\n\nแผนการของเขาสมบูรณ์แบบไร้ที่ติ\n\nอย่างแรก เมื่อไม่กี่วันก่อน คือการช่วยเหลือเอคไดซิส\n\nถัดมา อิซาเบลล์ ลูกสาวของผู้กล้าแม็กซิมิเลียน มีกำหนดออกเดินทางในช่วงต้นเดือนกุมภาพันธ์จากอาณาจักรทิลีส\n\nหลังจากนั้นไม่นาน ภายในไม่กี่วัน ออสการ์ ลูกชายของอัศวินจิลแบร์ ก็จะออกเดินทางจากอาณาจักรทิลีสเช่นเดียวกัน\n\nสองคนนี้ไม่มีอะไรให้ต้องเป็นห่วงนัก อาณาจักรทิลีสกับคราซิลอฟมีความสัมพันธ์อันดีต่อกันมาตั้งแต่ก่อนสงครามแล้ว แถมยังมีพรมแดนใกล้กันมากพอที่จะรับมือปัญหาใดๆ ระหว่างการเดินทางด้วยรถไฟได้สบาย\n\nส่วนเอลเฟียรา ลูกสาวของจอมเวทเวียลกริน เธอไม่ได้นั่งรถไฟตั้งแต่แรกอยู่แล้ว อาณาเขตของเวียลกรินเป็นเกาะที่อยู่อีกฟากหนึ่งของทะเลดำ นั่นคือจักรวรรดิคาลีออน เธอจะเดินทางมาด้วยเรือรบ ทำให้ปลอดภัยยิ่งกว่าใครทั้งหมด\n\nคราซิลอฟไม่มีท่าเรือ ดังนั้นเธอจึงน่าจะเดินทางผ่านมาทางทิลีสเนื่องจากไม่มีเส้นทางเดินเรือตรง ทว่าอีวานไม่คิดว่าเธอจะทิ้งคณะผู้ติดตามไว้เบื้องหลังหากเดินทางมาทางเรือตั้งแต่แรก\n\nสุดท้าย ลูเซีย ศิษย์ของเอนริเก้\n\nเธอเป็นคนจากอาณาจักรคราซิลอฟ และดูเหมือนจะเดินทางมาถึงที่ไหนสักแห่งในเมืองหลวงเรียบร้อยแล้ว\n\nดูเหมือนจะไม่ใช่เรื่องใหญ่แม้ว่าจะแวะไปตรวจดูสั้นๆ ในช่วงท้าย และเขาก็ไม่ได้รู้สึกจำเป็นเร่งด่วนที่จะต้องไปพบเธอในเร็วๆ นี้\n\nสรุปง่ายๆ ก็คือ ถ้าปล่อยให้สถานการณ์รถไฟของนักศึกษาใหม่สองคนในเดือนกุมภาพันธ์ผ่านไปอย่างราบรื่น ที่เหลือก็สามารถจัดการได้โดยที่เขาไม่ต้องลงมือเองโดยตรง\n\nการก่อการร้ายบนรถไฟเป็นส่วนหนึ่งของขั้นตอนด่านฝึกสอนอยู่แล้ว\n\nผ่านเหตุการณ์ของเอคไดซิส ตอนนี้เขามั่นใจเต็มร้อยแล้ว ไม่มีเหตุผลอะไรที่เขาต้องเคลื่อนไหวจนกว่าจะถึงวันเปิดภาคเรียน\n\nและแล้ว…\n\n“โธ่เอ๊ย อยากกินแกงกิมจิชะมัด”\n\nเขาฆ่าเวลาด้วยการเขียนรายชื่อ ‘ของที่ต้องซัดให้เรียบเมื่อได้กลับโลก’\n\nการนั่งชิลข้างเตาผิงอันแสนอบอุ่นในห้องทำงานผู้อำนวยการพร้อมกาแฟสักแก้วกลายเป็นช่วงเวลาพักผ่อนอันล้ำค่าของเขา\n\nต๊อกบกกี แต่ไม่ใช่แบบหรูหรานะ ไม่ใช่ต๊อกบกกีแบบสั่งเดลิเวอรีที่น้ำซุปท่วมชาม\n\nเขาโหยหาต๊อกบกกีสไตล์ข้างทางทำมือสุดฮิปจากร้านขายของกินหน้าโรงเรียน เขายังจำร้านที่ชอบโรยผงกะหรี่ร้านนั้นได้ดี ตอนนั้นมันฮิตระเบิดเถิดเทิงเลยล่ะ\n\n“อ่า คิดถึงบ้านจัง…”\n\n“จะทิ้งพวกเราไปอีกแล้วเหรอคะ?”\n\n“…”\n\nแววตาอันผ่อนคลายของอีวานพลันคมกริบขึ้นมาทันที ตัวตนคิมซอนอูภายในหายวับไป เหลือเพียงตัวเขาคนเดียวที่หันขวับกลับไปมอง\n\nเด็กน้อยคนหนึ่งกำลังห้อยโหนอยู่ตรงขอบหน้าต่าง\n\n“มายืนอยู่ตรงนั้นตั้งแต่เมื่อไหร่…?”\n\n“ตั้งแต่ผู้อำนวยการเริ่มพึมพำเรื่องของกินนั่นแหละค่ะ!”\n\n“นี่มันชั้นสามนะ”\n\n“หนูขึ้นชื่อเรื่องขยันหมั่นเพียรในการเข้าเรียนอยู่แล้ว!”\n\n“…หลักสูตรของเรามีวิชาปีนกำแพงเพิ่มเข้ามาตั้งแต่เมื่อไหร่…?”\n\nอีวานเดินไปที่หน้าต่าง เปิดบานหน้าต่างออกจนกว้าง อุ้มเด็กน้อยที่กำลังหัวเราะคิกคักขึ้นมา แล้ววางกลับลงในห้องอย่างระมัดระวัง\n\n“หนูชนะแล้ว! เห็นไหมคะ?”\n\n“อย่าเอามาเล่นเป็นเกมแบบนี้ คราวหน้าให้เดินเข้าทางโถงทางเดิน มันอันตรายนะรู้ไหม”\n\n“ก็มันเป็นวิธีเดียวที่หนูจะเอาชนะได้นี่นา!”\n\nที่สถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซีย มีเกมยอดฮิตอยู่อย่างหนึ่ง นั่นคือการแอบย่องเข้าไปให้ผู้อำนวยการตกใจ\n\nมันเป็นที่นิยมในหมู่เด็กๆ มาก อีวาน ชายผู้ลึกลับที่สามารถรับสิ่งของที่ลอยมาข้างหลังได้โดยไม่ต้องหันไปมอง กลายเป็นเพื่อนเล่นชั้นยอดสำหรับเด็กๆ ที่ตัดสินคนจากการกระทำมากกว่าภายนอก\n\n“เดี๋ยวชงโกโก้ร้อนให้กิน ดื่มเสร็จแล้วก็รีบไสหัวออกไปซะ”\n\n“เย้!”\n\nอีวานไม่ได้คัดค้านอะไร ท้ายที่สุดแล้ว เด็กกำพร้าเหล่านี้ก็ต้องการวิธีเอาตัวรอดเมื่อต้องออกไปจากสถานเลี้ยงเด็กกำพร้า\n\nหากใครสักคนสามารถชิงไหวชิงพริบกับประสาทสัมผัสของเขาได้ ไม่ว่าจะไปตกระกำลำบากที่ไหนก็ไม่มีวันอดตายแน่นอน\n\nหลังจากส่งเด็กน้อยออกไปด้วยรอยยิ้ม อีวานก็กลับมานั่งพักผ่อนอย่างสงบสุขต่อ\n\nเขามีเวลาเหลืออีกราวสองสัปดาห์ก่อนที่อิซาเบลล์จะก้าวขึ้นรถไฟขบวนนั้น\n\nนั่นคือสิ่งที่เขาเคยคิดไว้ จนกระทั่งมีนักเรียนคนหนึ่งถูกลักพาตัวไปอย่างไม่มีปี่มีขลุ่ย\n\n****\n\n“ปล่อยนะ พวกแกคิดจะทำบ้าอะไรกันฮะ?”\n\n“พวกแกไม่รู้เรื่องอะไรเลย ถ้าผู้อำนวยการของเรารู้เข้า พวกแกตายแน่!”\n\n“ว้าว นังเด็กนี่ไม่รู้ตัวเลยสินะว่าตัวเองกำลังตกอยู่ในสภาพไหน!”\n\nเฟรเชนกายา เมืองหลวงของคราซิลอฟ เป็นมหานครใหญ่แห่งทวีป เช่นเดียวกับเมืองใหญ่อื่นๆ ที่นี่ก็มี ‘ตรอกซอกซอยมืด’ และ ‘ย่านอันตราย’ ซึ่งเป็นแหล่งมั่วสุมของคนสารพัดประเภท ทั้งแก๊งอันธพาลและพวกตัวอันตรายทั้งหลาย ในบรรดานั้นมี ‘องค์กรนักฆ่า’ รวมอยู่ด้วย\n\nหากคุณเอามีดไปแทงใครเข้า คุณก็จะถูกจับมาดำเนินคดีตามกฎหมาย ยิ่งเป้าหมายมียศถาบรรดาศักดิ์สูงเท่าไหร่ กฎหมายก็ยิ่งเข้มงวดมากขึ้นเท่านั้น แต่ค่าจ้างก็สูงลิบลิ่วตามไปด้วย\n\nดังนั้น พวกนักฆ่าเหล่านี้จึงคิดว่าคุ้มที่จะเสี่ยง แทงสักฉึก แล้วหอบกระเป๋าเงินสดก้อนโตหายตัวไปหลังจบงาน\n\nส่วนภาพลักษณ์นักฆ่าสุดเท่อย่างเลออง ที่แอบย่องเข้าไป ปาดคอ แล้วเลือนหายไปในความมืดน่ะเหรอ? เออ นั่นมันมีแต่ในหนังเท่านั้นแหละ\n\n“ว่าแต่ใครกันล่ะ ผู้อำนวยการของแกน่ะ!”\n\n“อ-อีวาน เปโตรวิช! เคยได้ยินชื่อนี้ไหมล่ะ?”\n\n“อะไรนะ? ฮ่าฮ่าฮ่า!”\n\nพวกนี้รู้จักชื่ออีวานอย่างแน่นอน\n\nให้ตายสิ แม้แต่นามสกุลเปโตรวิชก็เถอะ\n\nในคราซิลอฟ ชื่ออีวานมันโหลพอๆ กับชื่อสมชาย ส่วนเปโตรวิชก็ไม่ได้ต่างจากนามสกุลทั่วไปเลย\n\nมันก็เหมือนเวลาใครสักคนหลุดหัวเราะเมื่อได้ยินชื่อโหลๆ อย่างนาย ก. นาย ข. พวกอันธพาลในตรอกมืดของเฟรเชนกายาต่างพากันหัวเราะเยาะชื่อนั้น\n\nทว่าทันใดนั้น เสียงทุ้มต่ำแผ่วเบาก็ดังแทรกความมืดในตรอกซอยขึ้นมา\n\n“เดี๋ยวก่อน”\n\nเหล่าสมาชิกแก๊งต่างพากันขนลุกซู่ ลดอาวุธลงและถอยกรูดแหวกทางออกทีละก้าว ทีละก้าว เพื่อเปิดทางให้ใครบางคนที่กำลังก้าวออกมา\n\n“เมื่อกี้ว่าชื่ออะไรนะ?”\n\n“อ-อีวาน เปโตร เปโตรวิช… ท่านผู้อำนวยการค่ะ…!”\n\nบุคคลผู้นั้นกวาดสายตาประเมินตัวเชลยอยู่ครู่หนึ่ง ก่อนจะฉีกยิ้มกว้างออกมา\n\n“ไอ้เจ้าเด็กเวรนั่นปากบอกว่าจะวางมือแล้ว แต่กลับแอบซุ่มสร้างหน่วยนักฆ่าไว้ลับหลังข้างั้นเรอะ?”\n\nธรรมเนียมของสถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซียในการแอบย่องเข้าไปทำให้อีวานตกใจอาจดูเหมือนการละเล่นของเด็กๆ แต่ในสายตาของคนในวงการ มันดูต่างออกไปโดยสิ้นเชิง โดยเฉพาะอย่างยิ่งในสายตาของ ‘คมดาบเงา’ เอนริเก้ มืออาชีพตัวจริงเสียงจริงในหมู่ยอดฝีมือแห่งโลกใบนี้\n\nแกล้งทำเป็นตาย ปล่อยข่าวลือว่าล้างมือในอ่างทองคำเพื่อเริ่มต้นชีวิตใหม่ ราวกับหมาป่าในคราบลูกแกะ หน่วยเก็บกวาดจะแก้ไขพฤติกรรมแบบนั้นได้ยังไงกันล่ะ?\n\nเอนริเก้หัวเราะหึๆ แล้วพยักหน้า\n\nอีวาน เปโตรวิช ถูกตราหน้าว่าเป็นหัวหน้าองค์กรลับสุดอันตรายที่ฝึกฝนเด็กกำพร้าให้เป็นนักฆ่าไปเสียแล้ว!\n\n***\n\n“ศิษย์เก่าถูกลักพาตัวไปงั้นเหรอ?”\n\n“ครับ ผู้อำนวยการ! จำพริสซิลลาได้ไหมครับ?”\n\n“ฉันไม่เคยลืม”\n\nอีวานจดจำรายละเอียดของเด็กทุกคนทั้งศิษย์ปัจจุบันและศิษย์เก่าครบทั้ง 300 คนได้ขึ้นใจ\n\nพริสซิลลา ไม่มีนามสกุล อายุ 17 ปี เด็กกำพร้าจากสงคราม\n\nถูกทอดทิ้งในช่วงสงคราม คอยคุ้ยเขี่ยหาของกินอยู่แถวฐานทัพ\n\nแม้เธอจะแสบซนไปบ้าง แต่เธอก็ใจกล้าและมีพรสวรรค์ ดังนั้นเมื่อใกล้ถึงเวลาจบการศึกษา อีวานจึงไม่ได้เป็นห่วงอะไรมากนัก\n\nดูเหมือนช่วงนี้เธอกำลังตระเวนหางานทำ เตร็ดเตร่ไปทั่ว…\n\n“ใคร ที่ไหน เมื่อไหร่?”\n\n“ไม่แน่ใจครับ แต่เจอแค่เสื้อโค้ตของเธอตกอยู่… หรือว่าจะเป็นคำขู่ครับ?”\n\n“เป็นไปได้สูง”\n\nอีวานตรวจสอบเสื้อโค้ตที่ได้รับมาอย่างละเอียดถี่ถ้วน\n\nร่องรอยบนแขนเสื้อ ปกเสื้อที่ยับยู่ยี่ กระดุมที่หลุดลุ่ยไปหนึ่งเม็ด\n\nขณะที่พลิกสำรวจไปมาอย่างใจลอย มือของเขาก็พลันชะงักค้าง\n\nรอยประทับฝ่ามือจางๆ แทบมองไม่เห็น เป็นเพียงรอยเปื้อนใต้คราบสกปรก\n\nใต้คราบสกปรกนั้น มีรอยแผลเป็นรูปกางเขนจางๆ สลักประทับไว้ตรงโคนฝ่ามือ\n\n“เอนริเก้”\n\nนั่นคือเครื่องหมายประจำตัวของพวกคนเลือดร้อนในองค์กร\n\nคงไม่มีคนโง่ที่ไหนมาลักพาตัวเด็กกำพร้าไปเรียกค่าไถ่หรอก ดังนั้นนี่จึงเป็นการยั่วยุ คำเตือน หรือไม่ก็… บัตรเชิญ\n\nอีวานรู้สึกว่าจำเป็นต้องปรับตารางเวลาที่เขาเคยผัดผ่อนไม่อยากไปเจอเสียใหม่ คนที่เขาไม่อยากเจอหน้าที่สุดในโลก\n\n‘คมดาบเงา’ เอนริเก้ หรือพูดอีกอย่างก็คือ…\n\nนี่คือหมายเรียกจากท่านปรมาจารย์ใหญ่\n\nเมื่อนึกถึงความจริงที่ว่า หน่วยเก็บกวาดนั้นถือกำเนิดขึ้นมาจากมันสมองของเอนริเก้เอง"
    },

      "title": "บทที่ 9",
      "content": "ใจกลางสวนสาธารณะกลางเฟรเชนกายา มีอนุสรณ์สถานแห่งหนึ่งตั้งตระหง่าน ประดับประดาด้วยรูปปั้นที่สร้างขึ้นตามพระราชโองการของพระเจ้าอีวานมหาราชเอง\n\nในบรรดาประติมากรรมเหล่านั้น ประกอบด้วยรูปปั้น “ผู้กล้าผู้เดินทัพ” “เทพีแห่งชัยชนะ” และ “ผู้กล้านิรนาม”\n\nหลังจากจอมมารสิ้นชีพและสงครามปิดฉากลง วันหนึ่งรูปปั้นในสวนสาธารณะกลางเฟรเชนกายาก็พลันหายไปอย่างไร้ร่องรอย\n\nรูปปั้น “ผู้กล้านิรนาม” อันตรธานไป และมีรายงานว่าพบแผ่นป้ายเล็กๆ วางอยู่แทนที่\n\n[สิทธิ์ในการไว้อาลัยแก่พวกเขาเป็นของข้า – เอนริเก้]\n\nเจ้าชายอเล็กซานเดอร์กริ้วจัด โดยทรงถือว่านี่เป็นการหมิ่นพระบรมเดชานุภาพ ทว่าองค์หญิงเอลิซาเวตากลับทรงยอมรับสิทธิ์ของเอนริเก้ และทรงงดเว้นที่จะทวงคืนรูปปั้นนั้น\n\nความจริงย่อมถูกปกคลุมด้วยม่านหมอกแห่งปริศนาอย่างไม่ต้องสงสัย\n\nไม่มีเหตุผลใดที่จะต้องไปยั่วยุแวมไพร์ระดับตำนานและสมาชิกปาร์ตี้ผู้กล้า ผู้ที่สามารถยกเอารูปปั้นออกไปจากสวนใจกลางเมืองหลวงซึ่งอยู่ห่างจากพระราชวังไปไม่ไกลได้ภายในคืนเดียว\n\nเอลิซาเวตาทรงใช้ความสุขุมรอบคอบ พระองค์ไม่ทรงปรารถนาที่จะทำให้เอนริเก้ขุ่นเคือง ขณะเดียวกันก็ยังคงรักษาพระเกียรติของราชวงศ์เอาไว้ได้\n\n“เคยมีคำกล่าวไว้ว่า…”\n\nอีวานยืนอยู่ที่มุมหนึ่งของชั้นใต้ดิน สายตาจับจ้องไปยังรูปปั้น “ผู้กล้านิรนาม” อย่างครุ่นคิด\n\nหลังจากสืบสวนเพียงสามชั่วโมง โดยอาศัยข้อมูลเกี่ยวกับ ‘ดันเจี้ยน’ ของเอนริเก้ที่ตั้งอยู่ใต้ดินทางตอนใต้ของเฟรเชนกายา\n\n“แม้นามของพวกท่านจะถูกลืมเลือน เกียรติยศของพวกท่านจะยังคงอยู่ชั่วนิรันดร์”\n\n“แทนผู้ที่มิอาจอยู่ ณ ที่นี้ เพื่อทุกผู้ทุกนามที่จากไป”\n\n“เอลิซาเวตา คิริลลอฟนา คราซิลอฟ”\n\n“เอนริเก้ เซอร์เกเยวิช”\n\nอีวานถอดหมวกมาวางทาบกลางอกอย่างนอบน้อม เพื่อแสดงความเคารพไว้อาลัยอยู่ครู่หนึ่ง\n\nตอนที่ได้ข่าวเรื่องการตั้งรูปปั้นนี้ครั้งแรก เขายังไม่เคยคิดจะเฉียดเข้าไปใกล้เลยด้วยซ้ำ และกว่าเขาจะบังเอิญแวะไปที่สวนสาธารณะกลาง เอนริเก้ก็ยกเอารูปปั้นนี้ไปเสียแล้ว\n\nทันทีที่เขากล่าวไว้อาลัยจบ เสียงหนึ่งที่เจือแววหัวเราะก็ดังก้องขึ้นในชั้นใต้ดิน\n\n“อย่าได้เศร้าโศกถึงผู้ที่ล่วงหน้าไปก่อนเลย” เสียงของเอนริเก้ดังแว่วมา\n\n“ผมยืนอยู่เคียงข้างพวกเขาต่างหาก” อีวานตอบกลับ\n\n“เจ้ายังจำได้สินะ ดีมาก ยินดีต้อนรับ อีวาน ‘ตัวน้อย’”\n\nทันใดนั้น พื้นดินใต้รูปปั้นก็บิดตัว เสียงโลหะเสียดสีดังก้อง และทางเดินสายหนึ่งก็ปรากฏขึ้นเมื่อศิลาแยกตัวออกจากกัน\n\nชั้นใต้ดินที่เคยอับชื้นและน่าสะอิดสะเอียนพลันแปรเปลี่ยนเป็นโถงทางเดินหน้าห้องรับรองที่ตกแต่งอย่างวิจิตรตระการตา\n\nขณะเดินผ่านโถงทางเดินอันหรูหราที่บุผนังด้วยผ้าไหม อีวานก็รวบรวมความคิดของตนเอง\n\nเช่นเดียวกับสมาชิกปาร์ตี้ผู้กล้าส่วนใหญ่ ท่านปรมาจารย์ใหญ่เอนริเก้เป็นพวกนอกคอกไม่เหมือนใคร\n\nและแน่นอนว่าในชั่วขณะเดียวกันนั้น เอนริเก้เองก็กำลังประเมินอีวานด้วยความรู้สึกที่ไม่ต่างกัน\n\nเช่นเดียวกับสมาชิกหน่วยเก็บกวาดส่วนใหญ่ อีวาน ‘ตัวน้อย’ ก็เป็นคนบ้าดีเดือด\n\n***\n\n“เจ็ดปีแล้วสินะที่เราไม่ได้เห็นหน้ากันตรงๆ เป็นยังไงบ้างล่ะ เจ้าศิษย์ตัวดี?”\n\n“ก็เรื่อยๆ ครับ”\n\nอีวานนั่งลงในห้องรับรอง ค่อยๆ จิบกาแฟอย่างเชื่องช้า กลั้วมันไว้ในปากครู่หนึ่ง — เป็นระเบียบปฏิบัติอย่างหนึ่ง เป็นวิธีป้องกันการลอบวางยาพิษ ไม่ต่างจากพิธีการส่วนใหญ่\n\n“ดูท่าจะไม่ได้ใส่ยาพิษ” อีวานพยักหน้าเบาๆ แล้วละเลียดรสกาแฟต่อไป\n\n“อ้อ เขาว่ากันว่ายาพิษสมัยใหม่น่ะ ตรวจจับด้วยรสชาติไม่ได้หรอกนะ”\n\n“แค่ก…” เขาพ่นกาแฟกลับลงไปในถ้วยแล้ววางมันลงบนโต๊ะ\n\n“ล้อเล่นน่า ล้อเล่น! ให้ฉันไปชงมาให้ใหม่ไหม?”\n\n“ไม่ต้องหรอก ผมไม่ได้มาที่นี่เพื่อดื่มกาแฟ”\n\n“ถึงอย่างนั้น นายก็ยังแข็งทื่อไม่เปลี่ยนเลยนะ ยังเป็นเด็กหนุ่มหัวดื้ออยู่เหมือนเดิม”\n\nเอนริเก้เอนกายพิงโซฟาหรูหรา ดวงตาหยีโค้งเป็นรอยยิ้ม\n\nระหว่างรอยผ่าของชุดเดรสผ้าไหม เผยให้เห็นเรียวขาขาวผ่องแวบหนึ่ง ทว่ามันไม่อาจดึงดูดความสนใจของอีวานได้แม้แต่น้อย อสุรกายตรงหน้าเขามีอายุเกินหนึ่งร้อยปีไปไกลโขแล้ว\n\nไม่รู้ว่านางดื่มยาอายุวัฒนะและเลือดสดๆ เข้าไปมากแค่ไหนแล้ว\n\nอีวานอดไม่ได้ที่จะจินตนาการภาพแวมไพร์ตนนี้จ้องมองเขาพลางแลบลิ้นแผล็บๆ\n\nอย่างไรเสีย ที่นี่ก็คือรังของแวมไพร์\n\nแวมไพร์อาวุโส, คมดาบเงา, เขี้ยวเล็บแห่งความมืด และ ‘คนทรยศ’ เอนริเก้\n\nวีรสตรีผู้ซึ่งเมื่อหนึ่งศตวรรษก่อน ได้ทรยศหักหลังแวมไพร์อาวุโสที่กัดเปลี่ยนเธอเป็นพวก ด้วยการสูบเลือดของมันจนสิ้นชีพ และยุติ “อาละวาดของเหล่าแวมไพร์” ที่เคยแผ่ซ่านไปทั่วเฟรเชนกายา\n\nตลอดหนึ่งศตวรรษต่อมา ผู้หญิงคนนี้คร่าชีวิตผู้คนไปนับไม่ถ้วนภายใต้หน้ากากของ ‘คำสั่งลอบสังหาร’ หากจอมมารไม่ปรากฏตัวขึ้นเสียก่อน พวกผู้กล้าคงจะหันมาจัดการเธอแทนไปแล้วกระมัง\n\nอีวานลูบด้ามขวานใต้โต๊ะอย่างแผ่วเบาพลางครุ่นคิด\n\n“เอาเถอะ นายมาถึงเร็วกว่าที่คิดไว้เสียอีก จริงๆ แล้ว การได้เห็นนายกลับมาเคลื่อนไหวอีกครั้งก็ทำให้ฉันดีใจนะ อ้อ แต่คำว่า ‘เคลื่อนไหว’ สำหรับพวกเรามันไม่ใช่คำชมสินะ?”\n\n“พริสซิลลาอยู่ที่ไหน?”\n\n“แหม เข้าเรื่องตรงๆ เลยนะ! นายนี่เป็นแบบนี้ตลอด!”\n\nเอนริเก้หัวเราะเบาๆ และจัดชุดเดรสของตัวเอง เผยให้เห็นทรวดทรงอันเย้ายวนใจ (แน่นอนว่าอีวานไม่ได้หวั่นไหวกับคนที่แก่กว่าตัวเองถึง 70 ปีหรอก ช่วงอายุที่เขารับไหวน่ะ มากสุดก็บวกลบไม่เกิน 10 ปีเท่านั้น)\n\n“แล้วว่าไงล่ะ นายคิดว่าฉันกัดยัยหนูนั่นไปแล้วหรือเปล่า?”\n\n“ไม่ คุณไม่ได้กัด ถ้าเป็นแบบนั้น คุณคงชิงลงมือโจมตีผมไปแล้ว แทนที่จะเชิญผมมาที่นี่”\n\nอีวานจ้องมองเธอด้วยสายตาเย็นชาขณะเอ่ยคำพูดเหล่านั้น\n\n“หลักการสำคัญที่สุดที่คุณสอนผม ไม่ใช่เรื่องการไม่แก้แค้นหรอกหรือ?”\n\n“หึ นี่เจ้าเด็กมอมแมมขี้มูกโป่งนั่นก็รวมอยู่ในขอบเขตการ ‘แก้แค้น’ ของนายด้วยงั้นเรอะ?”\n\n“ผมเป็นคนช่วยชีวิตเธอไว้”\n\nอีวานหวนนึกถึงวันที่เขารับพริสซิลลาเข้ามาอุปการะ เด็กคนนั้นเป็นเด็กกำพร้าที่ถูกดูแคลนแม้แต่ในหมู่ผู้ลี้ภัยหน้ากองทัพ\n\nการไร้พ่อแม่ตั้งแต่ยังเล็กเป็นเรื่องโหดร้าย มันหมายความว่ามีเพียงตัวเราเองเท่านั้นที่จะปกป้องตัวเองได้ ด้วยความเข้าใจในข้อนี้ เด็กคนนั้นจึงแข็งกร้าวและกล้าแสดงออกอยู่เสมอ\n\nในโลกที่ผู้คนส่วนใหญ่ต่างก็สิ้นหวังเกินกว่าจะยื่นมือไปช่วยเหลือเด็กที่โศกเศร้าและมืดมน คนเราต้องมีกำลังมากพอจะสงสารตัวเองได้เสียก่อน จึงจะเผื่อแผ่ความเห็นใจไปให้ผู้อื่นได้ ซึ่งในเวลานั้น สหราชอาณาจักรยังขาดกำลังใจที่ว่านั้นอยู่\n\nดังนั้น อีวานจึงจดจำพริสซิลลาและเด็กคนอื่นๆ ได้เป็นอย่างดี เขาตัดสินใจรับพวกเขามาเลี้ยงดูและเกษียณตัวเองมาเปิดสถานเลี้ยงเด็กกำพร้า เด็กเหล่านั้นจึงไม่ต่างอะไรจากลูกแท้ๆ ของเขาเอง\n\nย่อมเป็นธรรมดา ที่เมื่อลูกของตัวเองถูกทำร้าย การทวงแค้นย่อมกลายเป็นสิ่งจำเป็น\n\n“อย่าถือสาหาความแค้นให้มากนักเลย มันทำให้นายดูเป็นมือสมัครเล่น”\n\nเอนริเก้แย้มยิ้มพลางวางถ้วยชาลง\n\nน้ำชาที่ยังคงเต็มถ้วยและไม่ได้แตะต้องกระฉอกออกมาบนโต๊ะเล็กน้อย\n\n“ฉันไม่ได้สอนนายไว้หรือไง? ความอาฆาตพยาบาทเป็นเรื่องของคนอ่อนแอ การมัวแต่แก้แค้นและปกป้องตัวเอง ก็เป็นความใจแคบของคนอ่อนแอเหมือนกัน”\n\n“คำตอบของคุณล่ะ?”\n\n“ยัยหนูนั่นยังมีชีวิตอยู่ ปลอดภัยไร้รอยขีดข่วน กินอิ่มนอนหลับ แต่งตัวดีเรียบร้อย ทีนี้ตาของนายตอบบ้างแล้วล่ะ”\n\nเอนริเก้ค่อยๆ วางนิ้วมือขาวผ่องลงบนโต๊ะ\n\n“นายกำลังวางแผนอะไรอยู่?”\n\n“…หืม?”\n\n“ที่ ‘สถานเลี้ยงเด็กกำพร้า’ ของนาย ตอนนี้นายกำลังซุ่มคิดแผนการอะไรอยู่กันแน่?”\n\nเอนริเก้เอ่ยถามอย่างจริงจัง ตอนที่ได้ยินข่าวว่าเขาไปรับเด็กกำพร้ามาเลี้ยง เธอก็เคยมองผ่านๆ เป็นเรื่องขำขัน โดยคิดว่าคงเป็นเพราะตัวเขาเองก็เป็นเด็กกำพร้ามาก่อน มันก็น่าเวทนาอยู่หรอก ถ้าเขามาหาเธอ เธอก็คิดไว้มากพอที่จะรับเขาเข้ามาเป็นคนในครอบครัว เป็นลูกศิษย์ที่น่ารักคนหนึ่ง\n\nสองปีผ่านไปแบบนั้น แล้วจู่ๆ ‘เด็กกำพร้าที่เติบโตในสถานเลี้ยงเด็กกำพร้า’ นี่กลับมีทักษะการซุ่มโจมตีที่ฝึกฝนมาอย่างช่ำชองจนน่าตกใจ\n\nพูดตามตรง มันให้ความรู้สึกเหมือนโดนแทงข้างหลังชัดๆ จะให้บ่นว่าวิชาความรู้รั่วไหลงั้นเหรอ? ก็ไม่ใช่วิชาที่ยิ่งใหญ่อะไรนักหรอก ในเมื่อไม่ใช่การดวลตัวต่อตัว มันก็เป็นสิ่งที่สอนกันได้อยู่แล้ว\n\nทว่า การส่งสายลับออกมาประหนึ่งจะเปิดศึกแย่งชิงตลาดในถิ่นของอาจารย์ตัวเองแบบนี้ มันหมายความว่ายังไงกัน?\n\nเธอรู้สึกน้อยเนื้อต่ำใจ นับตั้งแต่เขาออกจากกองทัพและลบประวัติตัวเองทิ้งไป เขาไม่เคยแวะมาเยี่ยมเธอเลยสักครั้ง ไม่เคยแม้แต่จะชวนเธอออกไปดื่มด้วยกัน ทั้งที่อยู่ห่างกันแค่ปลายจมูกแท้ๆ!\n\nแต่เอาเถอะ แล้วไงล่ะ?\n\n“ฉันกำลังประท้วงอยู่นะ ส่งสายลับมาทำธุรกิจถึงหน้าบ้านกันแบบนี้ มันคือการประกาศสงครามใช่ไหม?”\n\nความจริงก็คือ เธอเชิญเจ้าเด็กจองหองคนนั้นมาอย่างสุภาพ ไม่ได้มีเจตนาจะฆ่าแกงอะไรเลยด้วยซ้ำ ตั้งใจจะสื่อทำนองว่า [อย่าทำแบบนั้นเลยน่า เรามีความทรงจำร่วมกันตั้งมากมาย จำเป็นต้องสู้กันด้วยเหรอ?]\n\nทว่าคำตอบที่ได้จากไอ้หมอหน้าตายคนนี้กลับกลายเป็นประมาณว่า [ถ้าแตะต้องคนของผม ผมฆ่าคุณแน่]\n\nมันทำร้ายจิตใจเธอจริงๆ นะ\n\nแล้วไอ้หนวดเครานั่นมันอะไรกัน? เห็นแล้วจะบ้าตาย ทำไมถึงมาไว้หนวดทรงที่ฮิตกันเมื่อร้อยปีก่อนล่ะยะ? อย่าบอกนะว่านั่นคือการปลอมตัวน่ะ? ฉันไม่ได้สอนแบบนั้นสักหน่อย\n\nท่ามกลางความคิดนับร้อยพันที่แล่นผ่านเข้ามาในหัว เอนริเก้ ผู้ยังคงเป็นแวมไพร์ระดับตำนานที่มีชีวิตอยู่มาหนึ่งศตวรรษและเป็นสมาชิกผู้ยิ่งใหญ่แห่งปาร์ตี้ผู้กล้า ก็จ้องมองอีวานด้วย ‘รอยยิ้มยียวน’\n\n‘ยัยนี่หมายความว่ายังไง? พูดบ้าอะไรอยู่เนี่ย?’\n\nอีวานจับต้นชนปลายสถานการณ์ไม่ถูกเลยสักนิด\n\nเอลิซาเวตาเรียกใช้เขาเพราะเขาแฝงตัวอยู่ในเงามืด ประวัติในอดีตของเขาถูกฟอกจนขาวสะอาด ชื่อของเขาก็โหลเสียจนไม่มีทางถูกเข้าใจผิดเมื่อนำมาใช้ แถมรูปลักษณ์ภายนอกก็เปลี่ยนไปมาก (ตามมาตรฐานของเขาเอง)\n\nยิ่งไปกว่านั้น ‘พันโทอีวาน เปโตรวิช’ ในอดีตก็ถูกประกาศว่าเสียชีวิตอย่างเป็นทางการและถูกฝังไว้ในสุสานแห่งชาติไปแล้ว\n\nดังนั้น ตามคำสั่งของเอลิซาเวตา ตัวตนและภารกิจของเขาจึงถือเป็นความลับสุดยอด\n\nแล้วจะเล่าเรื่องนี้ให้เอนริเก้ฟังได้หรือเปล่า?\n\nแต่เดี๋ยวก่อน ระหว่างเอนริเก้กับเอลิซาเวตามันก็มีความเชื่อมโยงกันอยู่ไม่ใช่หรือ?\n\nเอนริเก้เป็นผู้ก่อตั้งหน่วยเก็บกวาด และเอลิซาเวตาก็เป็นผู้บังคับบัญชาของหน่วยนั้นไม่ใช่หรือไง?\n\nทั้งคู่ต่างกำลังดิ้นรนอยู่บนกองข้อมูลที่ไม่เพียงพอ ทว่ายังคงแย้มยิ้มอย่างสงบนิ่ง ไม่ยอมสูญเสียความอดทนและความระมัดระวังของสายลับที่ผ่านการฝึกฝนมาอย่างโชกโชน\n\n‘ไอ้คนเสียสตินี่กำลังคิดอะไรอยู่กันแน่ พับผ่าสิ’\n\n‘ยัยคนบ้านี่กำลังคิดอะไรอยู่กันแน่?’\n\nต่างฝ่ายต่างคิดเช่นนั้น\n\n‘นี่คือการทรยศงั้นเหรอ เธอทำแบบนี้กับฉันได้ยังไง?’\n\n‘นี่คือการทรยศงั้นเหรอ? ผู้หญิงคนนี้แปรพักตร์จากเอลิซาเวตาไปเข้าข้างอเล็กซานเดอร์แล้วหรือไง?’\n\nคนเสียสติทั้งสองยังคงกระชับสายสัมพันธ์อันแน่นแฟ้นด้วยจิตใจที่เป็นหนึ่งเดียวกันอีกครั้งในวันนี้\n\nมันคือค่ำคืนฤดูหนาวช่วงกลางเดือนมกราคม"

      "title": "บทที่ 10",
      "content": "ในท้ายที่สุด อีวานก็เป็นฝ่ายยกมือขึ้นยอมแพ้ก่อน\n\nท่าทีนี้เป็นสัญญาณบ่งบอกถึงความระมัดระวังในการเปิดเผยข้อมูล เป้าหมายหลักของเขาคือการช่วยเหลือพริสซิลลาที่ถูกจับเป็นตัวประกัน มิใช่เพียงเพราะชีวิตของพริสซิลลาเท่านั้น แต่อีวานเองก็ไม่มีความมั่นใจว่าจะเอาชนะเอนริเก้ได้ด้วย\n\n“…ผมได้ข่าวมาว่าคุณกำลังปลุกปั้นลูกศิษย์อยู่คนหนึ่ง”\n\n“โอ้?”\n\nเอนริเก้กระตุกยิ้มลึกพลางเอียงศีรษะ\n\nอีวานเผลอกำด้ามขวานแน่นขึ้นชั่วขณะ ก่อนจะคลายมือออก\n\nสีหน้าแบบนั้น—คือสีหน้าตอนที่อสุรกายกำลังอารมณ์ไม่ดี\n\n“ว่าต่อสิ”\n\n“และตอนนี้ คุณกำลังวางแผนจะส่งเธอเข้าเรียนที่สถาบันเซนต์ยัน”\n\n“อืม… แล้วไงต่อล่ะ?”\n\n“‘ใครบางคน’ ทรงเป็นกังวล หากเกิดอุบัติเหตุจนบาดเจ็บขึ้นมา อาจเป็นความสูญเสียครั้งใหญ่ของประเทศชาติได้”\n\nอีวานต้องการสื่อความหมายหลายนัยยะ:\n\n– เอลิซาเวตาทรงเป็นห่วงลูกศิษย์ของคุณ และกำชับให้ผมคอยปกป้องเธอ\n\n– นั่นแหละงานที่ผมทำอยู่ช่วงนี้ คุณก็รู้ใช่ไหมล่ะ? นิสัยของเอลิซาเวตาน่ะ\n\n– แต่ถ้าคุณยังไม่เข้าใจความหมายนี้อีก… ผมขอคิดว่าคุณไปอยู่ฝ่ายอเล็กซานเดอร์แล้วได้ไหม?\n\nทว่าสำหรับเอนริเก้ คำพูดของอีวานอาจฟังดูเป็นแบบนี้:\n\n– ฉันสืบรู้ตัวตน ที่อยู่ และข้อมูลส่วนตัวของลูกศิษย์แกหมดแล้ว\n\n– ฉันรับค่าจ้างมาอย่างงามเลยล่ะ\n\n– ถ้าเกิดมีรอยขีดข่วนขึ้นมา… คงน่าเสียดายแย่เลยใช่ไหม? เพราะฉะนั้นทำตัวดีๆ ล่ะ\n\nกล้าดียังไงมาขู่อาจารย์ตัวเอง!!\n\nใครเป็นคนสั่งการ? อเล็กซานเดอร์งั้นเรอะ? ไอ้สารเลวนั่นคิดจะถีบหัวส่งฉันในตอนท้ายหรือไง?\n\nไม่สิ ไอ้เด็กเวรนี่ก็ด้วย!!\n\nถ้าฉันถูกสั่งให้ไปฆ่ามัน ฉันคงปฏิเสธไปแล้ว หรืออย่างน้อยก็คงส่งข่าวเตือนให้รู้ตัวก่อนแน่!\n\nแต่ไอ้เด็กเวรนี่กลับใช้ลูกศิษย์มาข่มขู่ฉันโดยไม่ลังเลเลยสักนิด\n\nนี่ฉันเลี้ยงหมาป่าเนรคุณแบบไหนขึ้นมาเนี่ย?\n\nให้ตายสิ ถ้าลูกศิษย์ที่รอดชีวิตมาจากสงครามครั้งก่อนมีแต่คนแบบหมอนี่ แล้วโลกนี้มันจะไปเหลืออะไร…\n\nเอนริเก้พยักหน้า บนใบหน้ายังคงประดับรอยยิ้ม\n\n“อืมม์ เข้าใจแล้ว”\n\n“ดีใจที่ได้ยินแบบนั้น เห็นไหมล่ะ? ไม่ใช่เรื่องใหญ่โตอย่างที่คุณคิดหรอก”\n\n“หืม… ไม่ใช่เรื่องใหญ่โต งั้นเหรอ?”\n\n“ใช่”\n\nคำตอบสั้นๆ ถูกโต้ตอบกันท่ามกลางบรรยากาศอันเย็นเยียบ\n\nถึงกระนั้น อีวานก็รู้สึกโล่งใจอยู่บ้าง แม้เอนริเก้จะดูเพี้ยนๆ ไปหน่อย แต่เธอก็ดูจะเข้าใจสถานการณ์ในตอนนี้เป็นอย่างดี\n\nเอาล่ะ ถ้าอย่างนั้น… เรื่องนี้ก็คลี่คลายแล้วสินะ?\n\nเตือนกันถึงขนาดนี้แล้ว ต่อให้ ‘ด่านฝึกสอน’ เริ่มขึ้น ลูกศิษย์ของเอนริเก้ก็คงไม่ตกอยู่ในอันตรายร้ายแรง เอนริเก้จะต้องปกป้องเธออย่างแน่นอน\n\n“ลูซี่”\n\nการลักพาตัวพริสซิลลาเป็นเรื่องเหนือความคาดหมายก็จริง แต่อีวานกลับได้กำไรมากกว่าที่ตั้งใจไว้เสียอีก\n\nตอนนี้ เหลือ ‘ตัวเอก’ สำหรับด่านฝึกสอนอีกเพียงสามคนเท่านั้น และคนที่มีเวลาเหลือสั้นที่สุดก็ยังมีเวลาอีกตั้งสองสัปดาห์….\n\n“ลูเซีย!! ลูเซีย! เข้ามาสิ!!”\n\n“ค่ะ อาจารย์!”\n\nพร้อมกับเสียงอันสดใส ใครบางคนก็เปิดประตูเดินเข้ามาในห้องรับรอง\n\nเธอเป็นหญิงสาวช่วงปลายวัยรุ่นที่มีเรือนผมสีน้ำตาลเข้มเป็นประกายเงางาม\n\nเอนริเก้เหลือบมองอีวานราวกับจะหยั่งเชิง ก่อนจะแย้มยิ้มออกมา\n\n“มานี่สิ ทักทายเสียหน่อย นี่คือศิษย์พี่ของเธอนะ”\n\n“หนูได้ยินเรื่องของศิษย์พี่มาเยอะเลยค่ะ ศิษย์พี่เปโตรวิช! อาจารย์พูดอยู่เสมอเลยว่าให้เดินตามรอยเท้าของศิษย์พี่”\n\nไม่นะ อย่าไปชมมัน ไอ้เด็กนี่มันปีนเกลียวจะแย่อยู่แล้ว\n\nเอนริเก้ฝืนยิ้มกว้าง พลางเม้มริมฝีปากเข้าหากันแน่น\n\n“มนุษย์… งั้นเหรอ?”\n\n“คะ? ค่ะ ก็ต้องใช่อยู่แล้วสิคะ…?”\n\n“ก็ต้องใช่อยู่แล้ว…? เธอรู้เผ่าพันธุ์ของอาจารย์ตัวเองหรือเปล่าเนี่ย?”\n\n“อาจารย์ของหนูเป็นมนุษย์ค่ะ!”\n\nลูเซียกล่าวอย่างมั่นใจ พลางยืดอกขึ้น\n\n“ถึงอาจารย์จะมีรสนิยมการกินที่ค่อนข้างแปลกไปสักหน่อย แต่ท่านก็รักใคร่เอ็นดูหนูและคอยปกป้องประเทศนี้ ท่านคือวีรสตรีตัวจริงเสียงจริง! ถ้าจะถามว่าเผ่าพันธุ์อะไร หนูขอเรียกว่า ‘มนุษยธรรม’ ค่ะ ศิษย์พี่เปโตรวิช!”\n\n“โอ้….”\n\nอีวานรู้สึกประทับใจขึ้นมาโดยไม่รู้ตัว\n\nหลังสงครามกับเหล่าปีศาจ สหราชอาณาจักรมีท่าทีเป็นปฏิปักษ์อย่างรุนแรงต่อเผ่าพันธุ์ ‘ต่างเผ่า’ และ ‘กึ่งมนุษย์’\n\nมันเป็นเรื่องธรรมดา พลเมืองส่วนใหญ่ที่เดินอยู่ตามท้องถนนที่นี่ต่างก็เคยสูญเสียญาติสนิทมิตรสหายไปเพราะพวกปีศาจ (ยกเว้นพวกเอลฟ์ แม้จะอยู่ในสหราชอาณาจักรเหมือนกัน แต่ก็ถูกขับไสไล่ส่งเพราะนิสัยอันน่ารังเกียจของพวกมัน)\n\nท่ามกลางสภาพแวดล้อมเช่นนี้ ทัศนคติที่เปิดกว้างโดยไม่ตัดสิน ‘สายพันธุ์’ จากเผ่าพันธุ์ทางชีวภาพ มันคือแนวคิดของโลกยุคศตวรรษที่ 21 ชัดๆ ไม่ใช่ต่างโลกเฮงซวยนี่เลยสักนิด!\n\n(หมายเหตุผู้แปลอังกฤษ: คุณรู้ไหมว่าจริงๆ แล้วพวกเราล้วนเป็นสปีชีส์มนุษย์เหมือนกัน ในทางชีววิทยาไม่มีสิ่งที่เรียกว่า ‘เชื้อชาติ’ หรอก วิทยาศาสตร์สมัยใหม่ถือว่าเชื้อชาติเป็นเพียงสิ่งที่สังคมสร้างขึ้น เป็นอัตลักษณ์ที่ถูกกำหนดตามกฎเกณฑ์ของสังคม)\n\nเมื่อได้ยินคำตอบอันสดใหม่นี้ (ซึ่งนับว่า ‘หัวก้าวหน้า’ สุดขีดตามมาตรฐานของโลกใบนี้) สีหน้าของเอนริเก้ก็ดูผ่อนคลายลงกว่าเดิมมาก\n\n“เอาเถอะ เห็นแล้วใช่ไหม ฉันสอนทุกอย่างให้หมดแล้ว กว่าจะเชี่ยวชาญจนใช้งานได้คล่องอาจต้องใช้เวลาหน่อย แต่ในส่วนของการเรียนรู้น่ะจบหมดแล้ว ถ้าในยุคสมัยหน้ามีปาร์ตี้ผู้กล้าเกิดขึ้น เด็กคนนี้ก็จะเหมาะสมอย่างยิ่ง”\n\nแน่นอน มันต้องเป็นแบบนั้นอยู่แล้ว การที่เธอสามารถเดินเหินภายใต้แสงตะวันได้ ย่อมทำให้เธอเหมาะสมกับปาร์ตี้ผู้กล้ามากกว่าใคร\n\nยิ่งไปกว่านั้น คำพูดที่ว่า ‘ฉันสอนทุกอย่างให้หมดแล้ว แต่กว่าจะเชี่ยวชาญอาจต้องใช้เวลา’ ก็ช่วยยืนยันความมั่นใจให้อีวานได้เปลาะหนึ่ง\n\n‘เธอกำลังพูดถึงแผนผังสกิลอยู่หรือเปล่านะ?’\n\nในเกมทั่วไป ตัวละครจะได้รับสกิลมาโดยอัตโนมัติพร้อมกับการอัปเลเวล\n\nมันดูแปลกๆ อยู่เหมือนกันใช่ไหมล่ะ? อยู่ดีๆ อะไรบางอย่างก็ผุดขึ้นมาในหัวระหว่างออกผจญภัยหรือทำภารกิจ\n\nแต่เกมนี้ดูเหมือนจะเป็นระบบแบบนั้นเสียด้วย\n\n‘แม้จะได้ร่ำเรียนมาแล้ว แต่ยังขาดประสบการณ์และความชำนาญ’ นั่นคือคำจำกัดความที่เหมาะเจาะที่สุดสำหรับเด็กสาวคนนี้\n\nอีวานพยักหน้ารับ\n\n“เป็นลูกศิษย์ที่น่าภาคภูมิใจ เก่งกว่าผม เก่งกว่า ‘พวกเรา’ เสียอีก เธอเป็นคนสำคัญของฉันในบั้นปลายชีวิต ดังนั้น อีวาน… ฉันจะไม่ยอมให้นายมาทำร้ายเธอเด็ดขาด”\n\n“หืม…?”\n\nจู่ๆ ก็พูดขึ้นมาแบบนี้เนี่ยนะ?\n\nอีวานตัวสั่นสะท้านเล็กน้อย ก่อนจะเลื่อนมือกลับไปวางบนด้ามขวานอีกครั้ง\n\nลำพังเอนริเก้คนเดียวก็รับมือยากพอตัวอยู่แล้ว แต่ในสถานการณ์ 2 ต่อ 1 ที่มีลูกศิษย์ของเธอยืนอยู่ด้วย แถมยังมีตัวประกันอยู่ในดันเจี้ยนของเอนริเก้อีก เขาจะมั่นใจได้อย่างไรว่าจะชนะ?\n\nอีวานจ้องมองมือของเธออย่างระแวดระวัง\n\n“ฉันขอร้องโดยเอาความทรงจำของเราเป็นเดิมพัน อยู่ให้ห่างจากโลก (ของนักฆ่า) ใบนี้เสีย ที่นี่คือเขตแดนของฉัน”\n\nเอนริเก้เอ่ยออกมาด้วยความจริงใจอย่างที่สุด\n\nการบริหารองค์กรนักฆ่าในเมืองนี้มีแค่ฉันคนเดียวก็เกินพอแล้ว อย่ามาหาเงินด้วยวิธีสกปรกในตรอกซอกซอยของเมืองนี้อีกเลย นั่นไม่ใช่เหตุผลที่นายเกษียณตัวเองออกไปหรอกเหรอ?\n\nอเล็กซานเดอร์เป็นคนที่ไว้ใจไม่ได้ ถ้าคิดจะยุ่งเกี่ยวกับการเมือง ก็ไปยึดมั่นในอุดมการณ์ของเอลิซาเวตาเสียยังจะดีกว่า\n\nเธอสื่อสารความต้องการนั้นออกมาอย่างเร่งด่วนและจริงจัง\n\n“อ้อ ที่แท้ก็ลงเอยแบบนี้เองสินะ”\n\nอีวานลุกขึ้นยืน มือกุมด้ามขวานไว้มั่น\n\nสุดท้ายแล้ว เอนริเก้ก็เลือกไปเข้าข้างอเล็กซานเดอร์จริงๆ งั้นหรือ?\n\nการต้องรับมือกับสมาชิกปาร์ตี้ผู้กล้าถือเป็นงานล่วงเวลาอย่างไม่ต้องสงสัย แต่มันก็เป็นภารกิจที่ไม่อาจหลีกเลี่ยงได้\n\n“อเล็กซานเดอร์เสนออะไรให้คุณเป็นการตอบแทน? ผู้คน? เลือด? หรือที่ดิน?”\n\n“…อะไรนะ?”\n\n“ถ้าคุณยังยึดมั่นในพันธสัญญากับราชวงศ์คราซิลอฟอยู่ ผมก็ขอใช้ความทรงจำของเราเป็นเดิมพันเหมือนกัน ตกลงความภักดีของคุณอยู่ข้างไหนกันแน่?”\n\n“อะ…?”\n\nหลังจากจ้องลึกเข้าไปในดวงตาของอีวานอยู่ครู่ใหญ่ เอนริเก้ที่มีเหงื่อเย็นซึมออกมาทั่วแผ่นหลังก็อ้าปากเอ่ยถาม\n\n“นะ… นายจับมือร่วมงานกับอเล็กซานเดอร์อยู่ใช่ไหม?”\n\n“คุณพูดเรื่องบ้าอะไร? ผมไม่เคยเจอหน้าไอ้หมอหน้ายิ้มนั่นเลยสักครั้ง”\n\n“ฉันก็ไม่เคยเหมือนกัน”\n\n“หืม…?”\n\nความเงียบงันเข้าปกคลุมชั่วขณะ\n\n“ถ้าอย่างนั้น เอ่อ… นายรวบรวมเด็กกำพร้ามาแล้วสอนวิชานักฆ่าให้พวกนั้นไม่ใช่เหรอ?”\n\n“สถานเลี้ยงเด็กกำพร้าของเราใช้หลักสูตรการศึกษาขั้นพื้นฐานตามปกติ”\n\n“แล้วแม่หนูคนนั้นล่ะ เธอถูกฝึกฝนศิลปะการซุ่มโจมตีมาชัดๆ!”\n\n“นั่นเป็นความพยายามส่วนตัวของเด็กๆ เอง พวกเขาฝึกฝนกันอย่างหนักในหลายๆ ด้านเพื่อจะได้หางานทำหลังเรียนจบ”\n\n“ไม่ใช่นายที่เป็นคนสอนพวกนั้นหรอกเหรอ?”\n\n“ไม่ใช่”\n\nความเงียบโรยตัวลงอีกครั้งครู่หนึ่ง\n\nสรุปแล้ว นั่นก็เป็นแค่เด็กกำพร้าวัยรุ่นธรรมดาๆ ที่เดินเตร็ดเตร่อยู่แถวนั้นเองงั้นเรอะ?\n\nแล้วทางเราก็ไปลักพาตัวเด็กนั่นมาแบบไม่มีปี่มีขลุ่ย ทำให้หมอนี่โกรธเป็นฟืนเป็นไฟ จนผลสุดท้ายมันก็มาข่มขู่ฉันเนี่ยนะ?\n\nเดี๋ยวก่อนนะ\n\n“แล้วทำไมนายถึงพูดถึงลูกศิษย์ของฉันล่ะ? จู่ๆ ชื่อของเด็กคนนั้นหลุดออกมาจากปากนายได้ยังไง?”\n\n“เอลิซาเวตาขอให้ผมช่วยอารักขาคุณจากในเงามืด เพราะปีนี้มีพวกลูกหลาน ‘ปาร์ตี้ผู้กล้า’ เข้าเรียนในชั้นปีหนึ่งเยอะมาก คุณไม่ได้ยินเรื่องนี้เลยหรือไง?”\n\n“ไม่! ยัยเด็กบ้าเอ๊ย! ทำไมเธอต้องไปขอให้นายช่วยด้วยเล่า? ฉันยังอยู่ดีมีสุขนะ! เธอเห็นฉันเป็นเศษขยะหรือไงกัน!”\n\nเอนริเก้ตะโกนลั่น ก่อนจะทิ้งตัวลงบนโซฟาอย่างหมดแรง\n\n“เรื่องนี้มันทำเอาฉันประสาทจะกินจริงๆ เวลาคุยกับนายทีไรต้องเป็นแบบนี้ทุกที ทำไมโชคชะตาถึงได้ยุติธรรมนักนะ ถ้านายรู้จักอ่านบรรยากาศเป็นสักนิดก็คงดี นั่นเป็นสิ่งเดียวที่นายขาดไปเลยล่ะ”\n\n“ไม่จริงสักหน่อย!”\n\nผีโบราณยุคก่อนสมัยใหม่ไปเอาเรื่องไร้สาระแบบนี้มาจากไหนกัน ถึงกล้ามาวิจารณ์คนที่เรียนจบหลักสูตรการเขียนเรียงความแห่งศตวรรษที่ 21 อย่างเขาได้?\n\nขณะที่คิมซอนอูภายในใจระเบิดโทสะออกมา ก่อนจะถูกอีวานกดข่มลงไป แล้วบรรยากาศก็กลับคืนสู่ความเงียบอีกครั้ง\n\n“นี่ เห็นไหม? นี่แหละตัวตนที่แท้จริงของศิษย์พี่เธอ เวลาคนเราพ่นคำพูดออกมาห้วนๆ เหมือนโยนเศษขยะให้แบบนี้ บทสนทนามันถึงได้คุยกันไม่รู้เรื่อง จริงๆ เลย”\n\n“เอ่อ… อืม”\n\nลูเซียซึ่งจู่ๆ ก็ยกยอปอปั้นไปเสียใหญ่โตก่อนจะจืดจางลงในทันทีท่ามกลางบรรยากาศในห้องรับรอง ดูท่าทางงุนงงทำอะไรไม่ถูก\n\n“ทั้งสองคนดูสนิทสนมกันดีจังเลยนะคะ!”\n\n“ไม่เลยสักนิด”\n\n“พูดอะไรแบบนั้นน่ะ!”\n\nลูเซียหัวเราะแห้งๆ ก่อนจะค่อยๆ ปิดประตูอย่างระมัดระวังแล้วรีบปลีกตัวออกไปทันที\n\nหลังจากความเงียบผ่านไปครู่หนึ่ง เอนริเก้ที่ถือถ้วยชาไว้ในมือก็เอ่ยขึ้น\n\n“ให้ฉันเอาน้ำชามาให้อีกถ้วยไหม?”\n\n“ไม่เป็นไร”\n\nแม้มันจะเย็นชืดไปแล้ว แต่รสชาติก็ยังใช้ได้อยู่ อีวานซึ่งเดิมทีมาจากประเทศที่ผู้คนนิยมดื่มเอสเปรสโซเย็นเป็นชีวิตจิตใจ ไม่ได้ใส่ใจเรื่องอุณหภูมิของกาแฟนัก\n\nการนัดพบผู้ปกครองของว่าที่นักศึกษาสถาบันเซนต์ยันเป็นไปได้ด้วยดี\n\n***\n\n“ผู้อำนวยการคะ!!”\n\nพริสซิลลาพุ่งเข้ามาสวมกอดเขาไว้แน่นด้วยท่าทางตื่นตระหนก\n\nอีวานขยับตัวอย่างระมัดระวังและตบไหล่เธอเบาๆ ก่อนจะค่อยๆ ดันตัวออกอย่างนุ่มนวล\n\n“ทีหลังอย่าไปหางานทำในที่เปลี่ยวๆ อีกล่ะ”\n\n“ค่ะ ค่ะ! เมื่อกี้น่ากลัวมากจริงๆ ค่ะ!!”\n\n“ตอนนี้ไม่เป็นไรแล้ว ไม่ต้องห่วงนะ”\n\nเขาหยิบผ้าเช็ดหน้าออกมาจากอกเสื้อแล้วช่วยเช็ดแก้มให้พริสซิลลา ก่อนจะพากันเดินต่อ\n\nจากห้องรับรอง ผ่านดันเจี้ยนของเอนริเก้ ลอดทางเดินใต้ดิน กลับขึ้นสู่พื้นดิน\n\nออกจากตรอกซอกซอยแล้วเดินตรงไปตามถนนสายหลัก\n\nหลังจากเดินกันมาเป็นเวลานานโดยไม่มีบทสนทนาใดๆ จู่ๆ เสียงฝีเท้าก็หยุดชะงักลง\n\n“ผู้อำนวยการคะ”\n\n“ว่าไง”\n\n“เอ่อ แค่สงสัยนะคะ สงสัยจริงๆ”\n\nใต้แสงโคมไฟริมถนนที่ส่องสว่างสลัว พริสซิลลากำชายกระโปรงแน่นพลางเอ่ยถาม\n\n“ท่านจะ… จากไปจริงๆ เหรอคะ?”\n\n“ก็น่าจะเป็นแบบนั้น”\n\nหลังจากเตรียมการเสร็จสิ้นและภาคการศึกษาใหม่ของสถาบันเซนต์ยันเปิดฉากขึ้นอย่างเป็นทางการ เขาคงหลีกเลี่ยงไม่ได้ที่จะต้องออกจากสถานเลี้ยงเด็กกำพร้า\n\nเพื่อไปทำหน้าที่ ‘ผู้พิทักษ์’ คนใหม่ในการปกป้องลูกหลานของปาร์ตี้ผู้กล้า\n\nราวๆ สามปี มันไม่ใช่เวลาที่ยาวนานอะไรเลยสำหรับเขา\n\nแต่ไม่ใช่สำหรับเหล่าเด็กกำพร้า\n\nสำหรับเด็กๆ ที่ใช้ชีวิตมาทั้งชีวิตในฐานะเด็กกำพร้าสงคราม สถานที่หลบภัยที่เพิ่งค้นพบใหม่แห่งนี้ไม่อาจสูญเสียไปได้\n\nมันคือครอบครัวที่เพิ่งสร้างขึ้นมาได้อย่างยากลำบาก เป็นที่ซุกหัวนอนที่ได้มาด้วยความเหนื่อยยาก และเป็น ‘บ้านของเรา’\n\nในมุมมองของเหล่าเด็กกำพร้าที่ถูกทอดทิ้งมาตลอด ช่วงเวลาเพียงสองปีสั้นๆ นั้น สถานเลี้ยงเด็กกำพร้าแห่งนี้คือป้อมปราการด่านสุดท้ายที่พวกเขาไม่อยากถูกผลักไสออกไปอีกแล้ว\n\nพริสซิลลาพูดตะกุกตะกักด้วยน้ำเสียงที่สั่นเครือปนสะอื้น\n\n“อย่าไปเลยนะคะ ผู้อำนวยการ ฮึก ถ้าท่านหายไป พวกเราก็จะ… ฮึก…”\n\n“อืม…”\n\nอีวานถอดเสื้อโค้ตของตัวเองออกแล้วคลุมลงบนไหล่ของพริสซิลลา\n\nเขานิ่งเงียบไปครู่หนึ่ง\n\nเขานึกไม่ออกเลยว่าเคยปลอบโยนเด็กมาก่อนหรือเปล่า ยิ่งเป็น ‘เด็กผู้หญิง’ ตัวเล็กๆ ด้วยแล้ว! ต่อให้ลองขุดคุ้ยความทรงจำของคิมซอนอูคนเก่าดูก็เหมือนกัน คิมซอนอูเป็นอสุรกายที่ใช้เวลาวันๆ หมดไปกับการพิมพ์คอมเมนต์ด่ายาว 5,700 ตัวอักษรระหว่างอ่านเว็บตูนและเว็บโนเวล\n\nส่วนหลังจากนั้นก็ไม่ต้องพูดถึง เมื่ออุทิศชีวิตเกินครึ่งหนึ่งให้กับการรับราชการทหาร อีวานจึงนึกไม่ออกเลยว่าควรจะพูดคุยกับคนอื่นด้วยวิธีอื่นนอกจากขวานหรือกระสุนปืนได้อย่างไร\n\n“ไม่ต้องห่วง เดี๋ยวฉันแวะมาเยี่ยมบ่อยๆ”\n\n“ท่าน… ท่านจะไปที่ไหนเหรอคะ?”\n\nเรื่องแค่นี้คงบอกได้ไม่เป็นไร เธอก็เกือบจะเหมือน ‘ลูกสาว’ ของเขาคนหนึ่ง แถมมันก็ไม่ใช่ข้อมูลความลับสุดยอดอะไรนัก\n\nอีวานเอ่ยตอบท่ามกลางเสียงสะอื้นของพริสซิลลา\n\n“สถาบันเซนต์ยัน”\n\n“ท่านจะกลับมาจริงๆ ใช่ไหมคะ?”\n\n“ไม่ใช่ว่าจะไปเร็วๆ นี้สักหน่อย แล้วก็ไม่ได้ไปตลอดชีวิตเสียหน่อย”\n\nความพยายามและความผูกพันที่ทุ่มเทลงไปในสถานเลี้ยงเด็กกำพร้า สถานที่แห่งนี้ไม่ต่างอะไรกับบ้านของเขา ห้องทำงานผู้อำนวยการคือสถานที่พักใจเพียงแห่งเดียวในหัวใจของเขา\n\nเขาตัดสินใจอย่างแน่วแน่ ตบไหล่พริสซิลลาเบาๆ สองสามครั้ง แล้วหมุนตัวเดินนำออกไป\n\nและ…\n\n“สถาบันเซนต์ยัน ได้ยินมาว่าข้อสอบเข้ายากมากเลย… สอบเดือนพฤศจิกายนปีหน้านี่นา…”\n\n***\n\nสถานเลี้ยงเด็กกำพร้าบาซิลิเซีย\n\nในเวลานี้ ผู้อยู่อาศัยทุกคนต่างกำลังคร่ำเคร่งอยู่กับการเตรียมตัวสอบเข้าสถาบันเซนต์ยันอย่างเอาเป็นเอาตาย!\n\n(หมายเหตุผู้แปลอังกฤษ: ช่างเป็นคนปากสว่างเสียจริง)"
    },

      "title": "บทที่ 11",
      "content": "พอนึกถึงเจ้าหนุ่มผู้กล้าที่ชื่อแม็กซิมิเลียนขึ้นมา สิ่งแรกที่ผุดวาบเข้ามาในหัวของฉันก็คือภาพตอนที่หมอนั่น ‘ฟันผ่าท้องฟ้า’\n\nเรื่องทั้งหมดเริ่มต้นจากแม็กซิมิเลียน ที่มักจะทำหน้าทะเล้นตื่นเต้นเกินเหตุพลางแกว่งดาบไปมา\n\n“ฟุ่บ”\n\n“ฟุ่บบบ…”\n\n“ฉับ—”\n\n“ซวบบบบ—!!”\n\nทันใดนั้น ราวกับเพิ่งนึกไอเดียบรรเจิดอะไรขึ้นมาได้ เจ้าคนบ๊องนั่นก็ตวัดดาบฟันท้องฟ้าเล่นหน้าตาเฉย หมายถึงท้องฟ้าจริงๆ นั่นแหละ\n\nเพียงการตวัดดาบครั้งเดียว หมู่เมฆก็ถูกฟันขาดสะบั้นและปลิวกระจุยกระจาย เกิดลมกระโชกแรงสั่นสะเทือนผืนดินอย่างบ้าคลั่ง\n\nอย่างที่ฉันเคยบอกไปก่อนหน้านี้ ปาร์ตี้ผู้กล้าโดยเนื้อแท้แล้วก็คือ “หน่วยลอบสังหาร”\n\nคุณต้องแอบซ่อนตัวอยู่ลึกเข้าไปในดินแดนศัตรู เล็งเป้าหมายไปที่ตัวเป้งของกองทัพปีศาจ และแลกเวลากับชีวิตของเหล่าทหารที่ยังคงตรึงกำลังรบอยู่แนวหน้า\n\nเพราะฉะนั้น การส่งเสียงอึกทึกครึกโครมแบบนั้นมันไม่เท่เอาเสียเลย\n\n“หมอนี่บ้าไปแล้วหรือไง?”\n\nเอนริเก้ทำหน้าจริงจังแล้วขว้างมีดสั้นเข้าใส่ผู้กล้า (เจ้าผู้กล้าเพียงแค่ยิ้มแล้วใช้ผิวหนังเปล่าๆ ปัดมีดสั้นทิ้งไปอย่างง่ายดาย)\n\n“เอาล่ะ ตอนนี้เราก็มีคนตะโกนโหวกเหวกโลดเต้น ประกาศตัวว่าเป็นผู้กอบกู้สหราชอาณาจักรแล้วสินะ โอ้ ช่างเป็นการแสดงวีรกรรมที่ยิ่งใหญ่อลังการเสียนี่กระไร”\n\nเวียลกรินเอ่ยเสียงเย็นชาก่อนจะร่ายเวทอย่างรวดเร็ว จากนั้นเขาก็หันหลังกลับและเริ่มตรวจจับสัมผัสของพวกปีศาจที่กำลังใกล้เข้ามา\n\nในขณะเดียวกัน จิลแบร์ อัศวินมาดสำอาง ก็กวัดแกว่งดาบอย่างอาจหาญ\n\n“ซวบบบบ—!!”\n\n“ฮ่าฮ่า สุดยอดไปเลย!!”\n\nเมื่อก้อนเมฆที่ผู้กล้าฟันขาดกระจุยกระจายกลายเป็นเศษเสี้ยวและปลิวว่อนไปตามแรงลม จิลแบร์ก็หัวเราะลั่นราวกับคนเสียสติพลางจัดแต่งทรงผมไปด้วย\n\n“ดูท่าวันนี้ข้าจะฟันพวกปีศาจไปได้เยอะกว่าเดิมนะ ได้วอร์มข้อมือแบบนี้ก็ดีเหมือนกัน”\n\n“เอ่อ… ข้อมือของท่านดูอ่อนปวกเปียกจนแทบจะหักอยู่แล้วนะคะ?”\n\n“อุ๊ย โทษทีนะ แพทริเซีย ช่วยร่ายเวทรักษาให้มันกลับมาแข็งปั๋งเหมือนเดิมหน่อยสิ”\n\n“คำพูดของท่านชวนให้รู้สึกไม่สบายใจยังไงชอบกลนะคะ…”\n\nหลังจากยืนดูเหตุการณ์นี้อยู่ครู่หนึ่ง ไอนาร์ก็หัวเราะร่า ลุกขึ้นยืน แล้วแบกขวานขึ้นบ่า\n\n“หยุดนะ”\n\n“อย่านะ”\n\n“ข้าขอร้องล่ะ อย่าทำเลย….”\n\n“ลูกผู้ชายแห่งโดรเวียนย่อมทิ้งร่องรอยไว้บนโลกใบนี้เสมอ”\n\n“จู่ๆ พูดเรื่องไร้สาระอะไรขึ้นมาอีกล่ะเนี่ย? วางขวานลงแล้วฟังข้าก่อน!”\n\nแม้เอนริเก้จะเอ่ยเตือนด้วยความระมัดระวัง ไอนาร์ก็ยังคงก้าวเดินไปข้างหน้าโดยไม่สนใจใยดี\n\n“ต่อให้เจ้าฟันท้องฟ้าสักกี่ครั้ง มันก็ไม่เหลือร่องรอยอะไรไว้หรอก แต่หากทำแบบนี้ พวกเราก็จะสามารถจดจำไอนาร์ผู้ยิ่งใหญ่ บุตรแห่งอุลริก ได้ตรงนี้ตลอดไป!”\n\n“ไม่ เดี๋ยวก่อน ฟังฉัน—”\n\n-โครมมมมม!!\n\nด้วยความฝันอันยิ่งใหญ่และขวานที่เงื้อขึ้นสูง ไอนาร์จามภูเขาทั้งลูกตรงหน้าจนแยกออกเป็นสองซีก\n\nหลังจากนั้น พวกเขาก็ต้องใช้เวลาทั้งสัปดาห์วิ่งหนีหัวซุกหัวซุนจากฝูงไวเวิร์นและกองทัพปีศาจ ข้อหาไปหาเรื่องแหย่รังแตนเข้าให้\n\n***\n\nปาร์ตี้ผู้กล้า\n\nผู้ชายที่ชื่อแม็กซิมิเลียนคนนั้นเคยพูดไว้พร้อมรอยยิ้มกว้างว่า “จะบอกให้นะ อีวาน ฉันฟันผ่าท้องฟ้ามาแล้วล่ะ”\n\n“ข้าฟันปีศาจไปได้เยอะกว่าเยอะ”\n\n“อะแฮ่ม ข้าฟันภูเขานะ! การผ่าสิ่งที่มีรูปร่างจับต้องได้มันเท่กว่าการฟันสิ่งที่ไร้รูปทรงไม่ใช่หรือไง?”\n\n“แค่พ่นคำพูดสวยหรูออกมาไม่ได้ทำให้เจ้าดูฉลาดขึ้นหรอกนะ ไอ้หนู”\n\n“หุบปากไปเลย”\n\n“ขอร้องล่ะ หยุดเถอะ”\n\nทำไมหมอนั่นถึงได้หมกมุ่นอยู่กับท้องฟ้านักก็ไม่รู้ แต่อีวานยังคงจดจำการหลบหนีอันน่าขันในครั้งนั้นได้อย่างแจ่มชัด\n\nในวันนั้น สิ่งเดียวที่เขาคงอยากจะเห็นจากการฟันท้องฟ้ายามราตรี ก็เพื่อพิสูจน์ให้แน่ใจว่าต่อให้ดินแดนของจอมมารจะถูกปกคลุมด้วยเมฆดำมืดมิด แต่ดวงอาทิตย์ยามเย็นก็ยังคงส่องแสงอยู่ที่ไหนสักแห่งโดยที่ไม่มีใครมองเห็น\n\nให้ตายสิ ปาร์ตี้ผู้กล้านั่นมันก็แค่แหล่งรวมตัวของพวกบ้า คนเสียสติ แล้วก็พวกหลงตัวเองทั้งนั้น\n\nในบรรดาคนพวกนั้น เจ้าผู้กล้านี่แหละที่บ้าบิ่นที่สุดและเจิดจรัสที่สุด\n\nจิลแบร์ตั้งเป้าจะเป็นยอดอัศวินผู้โดดเด่น จนได้บรรดาศักดิ์เป็นอัศวินแห่งทิลีส\n\nไอนาร์อยากจะจารึกตำนานของตัวเอง จึงออกพิชิตบ้านเกิดและสถาปนาอาณาจักรรวมชาติแห่งแรกของโดรเวียนขึ้นมา\n\nส่วนเจ้าผู้กล้า แม็กซิมิเลียน หมอนั่นก็คงแค่อยากจะพิสูจน์ว่าความหวังยังไม่ตายเท่านั้นเอง\n\nดังนั้น อีวานจึงไม่ได้ถึงขั้นคลั่งไคล้ผู้กล้าหรอก\n\nเขาก็แค่รู้สึกนับถือหมอนั่นอยู่ลึกๆ\n\nแม้กระทั่งตอนที่หมอนั่นทิ้งโลกใบนี้แล้วหายตัวไปอย่างลึกลับก็ตาม\n\n“หมอนั่นเกษียณตัวเองเพราะได้สิ่งที่ต้องการแล้ว หรือว่า…”\n\nหรือหมอนั่นหยุดพยายามที่จะแหวกเมฆดำออกไป เพราะมองไม่เห็นดวงอาทิตย์อีกต่อไปแล้วกันแน่นะ?\n\nผ่านมาสี่ปีกว่าแล้วนับตั้งแต่เจ้าหนุ่มร่าเริงคนนั้นหายตัวไป ผู้คนยังคงจดจำ ‘ผู้กล้า’ ได้ดี ทว่าตัวตนของผู้ชายที่ชื่อแม็กซิมิเลียนกลับค่อยๆ เลือนหายไปจากความทรงจำ\n\nตอนที่ 11: แสงตะวันยามเช้า (I)\n\nสองสัปดาห์ผ่านไปไวราวกับโกหก มันไม่ให้ความรู้สึกเหมือนได้หยุดพักผ่อนเลยสักนิด ไม่ต่างอะไรจากช่วงวันหยุดครั้งก่อน อีวานคิดพลางเหม่อมองทิวทัศน์ที่ไหลผ่านหน้าต่างรถไป\n\nนี่คือเส้นทางมุ่งหน้าสู่อาณาจักรทิลีส และในครั้งนี้ เขาไม่ได้เดินทางมาเพียงลำพัง\n\nเขามีผู้ชายห้าคนคอยจับตาดูทุกฝีก้าวของเขาอยู่ด้วย\n\n– ว้าว นั่นมันเหตุก่อการร้ายของจริงเลยนี่นา! คุณรู้วัน เวลา และสถานที่ได้แม่นยำขนาดนั้นได้ยังไงกัน? เป๊ะสุดๆ ไปเลย!\n\nคนพวกนี้คือเจ้าหน้าที่จากกองบัญชาการข่าวกรองคราซิลอฟ เจ้าหัวหน้ารุ่นน้องตัวแสบอย่างดมิทรีเป็นคนลากเขามาพัวพันด้วย\n\nตอนที่พวกเขากลับมาหลังจากหยุดยั้งความวุ่นวายของเอคไดซิส ดมิทรีเข้ามาคว้ามือเขาแล้วพล่ามขอโทษขอโพยไม่หยุด ทว่าในดวงตาของหมอนั่นกลับไม่มีแววขบขันอยู่เลยแม้แต่น้อย\n\nผู้ชายที่อาศัยอยู่อย่างเงียบสงบมาตลอดสี่ปี จู่ๆ กลับทำนายเหตุร้ายแรงระดับประเทศได้อย่างแม่นยำงั้นเหรอ?\n\nคนทั่วไปอาจจะอุทานว่า “สุดยอดไปเลย!” แต่หมอนี่มาจากกองบัญชาการข่าวกรองคราซิลอฟ เขาเป็นถึงคนใหญ่คนโตระดับพันโทประจำกองบัญชาการสอบสวน\n\nดังนั้น แววตาของดมิทรีจึงสื่อความหมายออกมาอย่างชัดเจนว่า:\n\n– รุ่นพี่จัดฉากเรื่องนี้ใช่ไหม บอกมาตามตรงเถอะ รุ่นพี่วางเครือข่ายสายลับของเราอย่างลับๆ ได้ยังไง? พอจะถ่ายทอดเคล็ดลับให้ผมบ้างได้ไหมครับ?\n\nหากไม่มีคำอธิบายที่สมเหตุสมผล ย่อมต้องมีการตรวจสอบและความสงสัยตามมาอีกนับไม่ถ้วน การจัดการขั้นตอนอย่างเป็นทางการของสถาบันไม่ได้หมายความว่าเขาผูกขาดข้อมูล แต่มันคือภาระความรับผิดชอบที่ไม่อาจอธิบายได้\n\nทว่า “น่ารำคาญชะมัด”\n\nไม่จำเป็นต้องอธิบาย ความลึกลับย่อมช่วยเพิ่มน้ำหนักให้กับอำนาจบารมี อีวานจึงไม่คิดจะเสียเวลาแก้ต่างข้อสงสัยที่ว่าเขาอาจจะมีองค์กรข่าวกรองลับระดับนานาชาติอยู่ในมือ\n\nและนี่คือผลลัพธ์ เจ้าหน้าที่ทื่อๆ ห้าคนถูกส่งมาประกบในฐานะ ‘กำลังเสริม’\n\nอีวานถอนหายใจเฮือกใหญ่ นี่ฉันต้องมาเล่นบทพี่เลี้ยงเด็กจริงๆ เหรอเนี่ยในเมื่อมาถึงขั้นนี้แล้ว?\n\nเสียงถอนหายใจของเขาทำให้เหล่าเจ้าหน้าที่สะดุ้งโหยงพร้อมกันโดยไม่ได้นัดหมาย\n\n“คุณเปโตรวิช มีเรื่องอะไรรบกวนจิตใจอยู่หรือเปล่าครับ…?”\n\n“พวกนายทุกคนนั่นแหละ”\n\nในวินาทีนั้น อีวานก็ตัดสินใจได้อย่างเด็ดขาด\n\nการฝึกสอนมือใหม่ไม่ใช่ทางของเขาเลย แต่การจะปล่อยให้ตัวเองปลดระวางจากหน้าที่สายลับของประเทศชาติ (ประเทศของเขาคือสาธารณรัฐเกาหลี) ร่วมกับพวกอู้แสนไม่ได้เรื่องพวกนี้ มันยอมรับไม่ได้เด็ดขาดใช่ไหมล่ะ?\n\nทำไมเจ้าหน้าที่ข่าวกรองถึงต้องแต่งตัวเหมือนกันหมดด้วย? จะส่งสัญญาณใบ้ใครกันหรือไง?\n\nแล้วทำไมถึงมารวมตัวกันอย่างโจ่งแจ้งในที่โล่งแจ้งแบบนั้นให้คนอื่นเขาสงสัยกันหมด?\n\nแบบนี้มันเกินจะทนไหว แน่นอนว่าเป้าหมายที่แท้จริงของคนพวกนี้คงเป็นการจับตาดูอีวาน แต่นั่นมันไม่ใช่วิธีทำงานข่าวกรอง\n\nเรื่องนี้ปล่อยผ่านไปไม่ได้\n\n“ฟังให้ดี”\n\nคำอบรมอันเข้มงวดของผู้อำนวยการสถานเลี้ยงเด็กกำพร้า (อดีตสมาชิกหน่วยเก็บกวาด รับราชการทหาร 18 ปี เข้าร่วมปฏิบัติการของปาร์ตี้ผู้กล้า และยังมีประวัติสังหารมังกรมาแล้ว) ได้เริ่มต้นขึ้น ณ บัดนี้!\n\nสิบแปดชั่วโมงอันยาวนานกว่าจะถึงเซนต์มาทิลด์ เมืองหลวงของทิลีส\n\nเหล่าเจ้าหน้าที่ต่างพากันตัวแข็งทื่อราวกับถูกแช่แข็งในกาลเวลา\n\n***\n\n“ยังไม่โผล่มาอีก….”\n\nอิซาเบลล์กวาดสายตามองไปทั่วชานชาลาจนกระทั่งก้าวขึ้นรถไฟที่มุ่งหน้าสู่คราซิลอฟ\n\nยิ่งคาดหวังสูงเท่าไหร่ ความผิดหวังก็ยิ่งลึกล้ำมากขึ้นเท่านั้น\n\nแม้จะผิดหวังซ้ำแล้วซ้ำเล่า เธอก็ยังคงมองหาผู้คนด้วยความหวังอยู่เสมอ\n\nอย่างระมัดระวัง เผื่อว่าคนคนนั้นอาจจะซ่อนตัวอยู่ในหมู่ฝูงชน\n\n– ฉึกฉัก— ปู๊นนน—!\n\nแม้ตอนที่รถไฟพ่นไอน้ำออกมาเป็นสายยาว คนที่เธอรอคอยก็ยังไม่ปรากฏตัวให้เห็นอยู่ดี\n\n“คุณหนูครับ อย่ากังวลไปเลย ท่านคิดถึงคุณหนูอยู่เสมอ…”\n\n“คิดถึงเหรอ? อืม ก็อาจจะมั้ง”\n\nอิซาเบลล์ตอบกลับอย่างเย็นชาแล้วเบือนหน้าหนี ทำเป็นไม่สนใจมือที่แตะลงบนไหล่ของเธอ\n\nอัศวินมาดเนี้ยบของเธอ ซึ่งได้รับแต่งตั้งจากราชวงศ์ทิลีสให้มาเป็นองครักษ์ประจำตัว ถอยกลับไปอย่างเก้ๆ กังๆ พร้อมรอยยิ้ม\n\nไอ้งั่ง เจ้าบ้า ไร้ประโยชน์สิ้นดี!\n\nอัศวินน่าสมเพช ที่รับมือไม่ได้แม้แต่คำดูถูกเพียงคำเดียว ทำได้แค่แสร้งหัวเราะกลบเกลื่อนราวกับไม่มีอะไรเกิดขึ้น\n\nสำหรับเธอ คนส่วนใหญ่ก็เป็นแค่สัตว์เดรัจฉาน ไม่ใช่ในทางชีววิทยา แต่ในความหมายที่ว่าพวกมันก็เป็นแค่สัตว์ร้ายจอมเสแสร้ง\n\n“ท่านพ่อ”\n\nเมื่อความทรงจำเกี่ยวกับผู้กล้าแม็กซิมิเลียนค่อยๆ เลือนราง เธอใช้เวลาส่วนใหญ่อยู่ในวังกับท่านแม่ในช่วงที่เขาออกรบในสมรภูมิ\n\nยิ่งชื่อเสียงของผู้กล้าโด่งดังขึ้นเท่าไหร่ สีหน้าของผู้คนรอบข้างก็ยิ่งดูเรียบง่ายตื้นเขินมากขึ้นเท่านั้น\n\nสิ่งเดียวที่เธอเห็นคือรอยยิ้มอันเป็นมิตรที่พยายามเอาอกเอาใจทายาทของตัวเอกในอนาคต\n\nก็แน่อยู่แล้ว ถ้าพวกนั้นเชื่อว่าผู้กล้าจะสามารถปราบจอมมารได้ในไม่ช้า\n\nเมื่อจอมมารสิ้นชีพ นโยบายทุกอย่างย่อมต้องหมุนรอบตัวผู้กล้า พละกำลังของคนคนเดียวไม่อาจเอาชนะคนทั้งกลุ่มได้ก็จริง แต่ด้วยความแข็งแกร่งและวีรกรรมอันยิ่งใหญ่ระดับนั้น ประเทศชาติย่อมต้องคล้อยตามเจตจำนงของบุคคลผู้นั้นโดยปริยาย\n\nดังนั้น ราชวงศ์ทิลีสจึงพยายามอย่างหนักเพื่อซื้อใจเธอ เมื่อไม่อาจเข้าถึงตัวผู้กล้าได้โดยตรง การสร้างความประทับใจให้เธอจึงกลายเป็นหนทางเดียว\n\nต่อให้โดนคำพูดดูถูกเหยียดหยามและการด่าทอสารพัด เขาก็ยังคงยิ้มรับอยู่ได้\n\nการที่ทุกคนรอบกายต่างสวมหน้ากากยิ้มจอมปลอมแบบเดียวกันหมดราวกับอยู่ในงานเต้นรำ มันคงไม่ส่งผลดีต่อพัฒนาการทางอารมณ์ของเด็กคนหนึ่งสักเท่าไหร่\n\n“ไสหัวไป ฉันไม่อยากเห็นหน้า”\n\n“แต่คุณหนูครับ กระผม…”\n\n“หุบปาก”\n\nอัศวินหนุ่มชะงักไปกับคำพูดของอิซาเบลล์ ก่อนจะพยักหน้าเบาๆ แล้วเดินออกจากห้องโดยสารไป\n\nเมื่อได้อยู่ตามลำพังเสียที อิซาเบลล์ก็แค่นหัวเราะอย่างขมขื่น\n\n“ไอ้งั่งเอ๊ย!”\n\nจังหวะที่เธอกำลังจะปิดประตู เธอเหลือบตาหันกลับไปมอง\n\nเธอทันเห็นสีหน้าบิดเบี้ยวบนใบหน้าของอัศวินคนนั้น ราวกับใบหน้าของปีศาจร้าย\n\nอิซาเบลล์ ลูกสาวของผู้กล้า มีประสาทสัมผัสที่เฉียบคม เฉียบไวกว่าคนทั่วไปมาก เธอสามารถสังเกตเห็นความเปลี่ยนแปลงเพียงเล็กน้อยบนสีหน้าของผู้อื่นได้ในทันที\n\nนั่นจึงเป็นเหตุผลที่เธอเรียนรู้มาตั้งแต่เนิ่นๆ ว่าทุกคนรอบตัวต่างก็รู้สึกอึดอัดและจอมปลอมกันทั้งนั้น\n\nเพราะเหตุนั้น\n\n“งี่เง่าชะมัด….”\n\nเธอหัวเราะเยาะตัวเองแล้วทรุดตัวลงนั่งบนเบาะ\n\nเด็กสาวหัวรั้นที่ไร้ซึ่งสีหน้าอื่นใดนอกจากความโกรธเกรี้ยวและการประชดประชัน\n\nคนที่รู้สึกสบายใจได้ก็ต่อเมื่อเห็นคนอื่นโกรธเกรี้ยว เป็นความพังทลายที่ทำร้ายตัวเอง\n\nการขาดความรักความอบอุ่นอย่างรุนแรง จนเชื่อว่ามีเพียงความเกลียดชังของผู้อื่นเท่านั้นที่เป็นความจริงใจ\n\nเฝ้ารอคอยบิดาที่บัดนี้เหลือเพียงแค่ในความทรงจำอย่างไม่มีที่สิ้นสุด และในขณะเดียวกันก็เคียดแค้นชิงชัง ทนทุกข์ทรมานจากอาการวิตกกังวลเมื่อถูกทอดทิ้ง\n\nนั่นคือบทวินิจฉัยที่เธอประเมินให้กับตัวเอง\n\n****\n\n“ผมว่าได้เวลาออกเดินทางแล้วล่ะครับ คุณเปโตรวิช”\n\n“พวกเรากำลังจะไปแล้วครับ ผู้กองเปโตรวิช”\n\n“ยังติดคำว่า ‘พวกเรา’ อยู่อีกเรอะ? กะจะป่าวประกาศให้คนอื่นรู้หรือไงว่าพวกนายมากันเป็นกลุ่มเป็นก้อน?”\n\n“เอ่อ…”\n\n“ฉันย้ำอยู่เสมอไม่ใช่หรือไงว่า ให้แสดงออกอย่างชัดเจนในบทบาท แน่วแน่ในการกระทำ และซ่อนเร้นเจตนาให้มิดชิด”\n\n“เอ่อ…”\n\nเหล่าเจ้าหน้าที่ต่างกรีดร้องโหยหวนอยู่ในใจอย่างเงียบงัน\n\n‘ผู้หมวดดมิทรี!! หมอนี่มันโหดชะมัดเลยโว้ย!!’\n\n‘คุณมันตัวฝันร้ายชัดๆ เปโตรวิช!!’\n\n‘ฉันจะไม่มีวันให้อภัยนายแน่ อีวาน…’\n\nเมื่อการบรรยายอันไร้ที่สิ้นสุดตลอด 18 ชั่วโมงจบลง พร้อมกับคำขู่ว่าจะมีการฝึกพิเศษเพิ่มเติมรออยู่ข้างหน้า เหล่าเจ้าหน้าที่ผู้เหนื่อยล้าจึงรีบเอ่ยคำอำลาสั้นๆ แล้วปลีกตัวจากไปทันที\n\nภารกิจของพวกเขาคือการคุ้มครองออสการ์ ลูกชายของอัศวินจิลแบร์ จากอันตรายที่อาจเกิดขึ้น\n\nอีวานที่จำใจต้องช่วยนำทางให้คนพวกนี้เพื่อให้ลุล่วงภารกิจ ขณะเดียวกันก็อยากจะสลัดโซ่ตรวนที่ดมิทรีเอามาผูกมัดเขาไว้ เฝ้ามองอิซาเบลล์ก้าวขึ้นรถไฟที่สถานีพลางคิดในใจว่า:\n\n“โชคดีชะมัด”\n\nการสลัดพวกเจ้าหน้าที่ข่าวกรองให้พ้นทางและส่งไปคุ้มครองออสการ์ได้ในคราวเดียวกัน นับเป็นการยิงปืนนัดเดียวได้นกสองตัว\n\nอีวานกระโดดขึ้นรถไฟด้วยความรู้สึกเหมือนได้โยนภาระหนักอึ้งสองก้อนทิ้งไปให้พ้นตัว"
    },

      "title": "บทที่ 12",
      "content": "รถไฟด่วนที่วิ่งจากเซนต์มาทิลด์ในอาณาจักรทิลีสไปยังเฟรเชนกายาในอาณาจักรคราซิลอฟต้องแล่นผ่านเขตทหารถึงสี่เขตด้วยกัน\n\nช่วงแรก รถไฟจะแล่นผ่านกองพลรักษาการณ์ที่ 3 แห่งทิลีส แล้วข้ามแนวชายแดนทางตะวันตกเฉียงเหนือ\n\nจากนั้นก็จะผ่านกองพลป้องกันชายแดนคราซิลอฟ และกองบัญชาการป้องกันเฟรเชนกายา\n\nรถไฟสายนี้อยู่ใกล้กับแนวหน้าติดกับดินแดนปีศาจ จึงมีการวางกำลังคุ้มกันอย่างเข้มงวดสุดขีด\n\nเมื่อใช้วิธีตัดตัวเลือกออก จะมีเพียงสามสถานีตลอดเส้นทางเท่านั้นที่สามารถถูกโจมตีได้ จากสถานีทั้งหมด 30 แห่งที่รถไฟแล่นผ่าน มีเพียงสามแห่งที่อยู่ห่างไกลถึงหนึ่งวันเดินทาง ขาดแคลนกำลังเสริม ไม่ค่อยมีผู้คน และมีภูมิประเทศที่ทุรกันดาร\n\n‘หนึ่ง’\n\nรถไฟที่อีวานและอิซาเบลล์โดยสารมาแล่นผ่านจุดซุ่มโจมตีจุดแรกไปแล้ว\n\nไม่มีผู้บุกรุกบนรางรถไฟ หรือพวกตัวร้ายที่ร่ายเวทหรือยิงปืนใหญ่จากบนหลังม้า\n\n‘สอง’\n\nณ จุดซุ่มโจมตีจุดที่สอง รถไฟก็แล่นฉิวผ่านไปอีกเช่นกัน\n\nอีวานมองออกไปนอกหน้าต่าง ถอนหายใจ แล้วนั่งลง\n\nหลังจากนั้นไม่กี่ชั่วโมง รถไฟก็เดินทางมาถึงจุดซุ่มโจมตีจุดที่สามอย่างเงียบเชียบ\n\n‘อะไรกันวะเนี่ย…?’\n\nรถไฟแล่นข้ามพรมแดนคราซิลอฟมาแล้ว หากวิ่งตรงต่อไปเรื่อยๆ ก็จะถึงเฟรเชนกายาภายในหนึ่งวัน\n\nพ้นจากที่ราบและข้ามภูเขาไปอีกเพียงลูกเดียว ก็จะเข้าสู่เขตเฟรเชนกายาแล้ว แถวนี้มีกองกำลังทหารขนาดใหญ่ประจำการอยู่ใกล้ๆ แต่ก็ยังมีผืนป่าที่ต้องแล่นตัดผ่าน\n\nดังนั้น การจะก่อความวุ่นวายในตอนนี้คงไม่เวิร์กแล้ว อีวานแตะปืนพกของตัวเองอย่างกระวนกระวาย\n\n‘หรือว่าเราจะคาดการณ์ผิด?’\n\nด่านฝึกสอนทั้งหมดไม่ได้เป็นเรื่องความวุ่นวายบนรถไฟหรอกหรือ?\n\nหรือเอคไดซิสแค่ซวยจัดเป็นพิเศษ? หรือใน ‘เกมต้นฉบับ’ ด่านฝึกสอนของตัวละครแต่ละตัวมันแตกต่างกัน?\n\nพวกเขาอาจคิดว่าแต่ละคนจะมีเนื้อเรื่องเป็นของตัวเอง แต่แผนการดั้งเดิมไม่น่าจะยอมให้เป็นแบบนั้น นี่มันแนวสถาบันการศึกษาเชียวนะ นั่นก็เพราะมันคือ ‘นิยายแนวอะคาเดมี’ ยังไงล่ะ\n\nอาจจะไม่ใช่ก็ได้ แต่มันจำเป็นต้องเป็นแบบนั้นสิ\n\nอีวานกัดริมฝีปาก แล้วถ้าฉันเดาผิดอีกล่ะ?\n\nถ้าโลกนี้ไม่ใช่แม้กระทั่ง ‘แนวอะคาเดมี’ ด้วยซ้ำ แล้วโลกใบนี้มันจะมีฉากจบอยู่จริงหรือเปล่า?\n\nฉันควรจะฆ่าตัวตายไปเลยดีไหม? มันมีคำตอบอื่นนอกจากความตายอีกหรือเปล่า? ในเมื่อฉันไม่สามารถคาดเดาแนวเรื่องได้ ฉันก็ไม่อาจรู้ได้แม้กระทั่งเงื่อนไขของฉากจบ\n\nเขาหวาดกลัวสิ่งที่เลวร้ายที่สุด—จะเกิดอะไรขึ้นถ้าฉากจบมีไว้สำหรับตัวเอกเท่านั้น? ยกตัวอย่างเช่น ในสงครามครั้งก่อน โลกใบนี้อาจเป็นเกม RPG แนวผู้กล้ากอบกู้อาณาจักรสุดคลาสสิก ถ้าการหายตัวไปของผู้กล้าหมายความว่าเนื้อเรื่องจบลงไปแล้ว แล้วอะไรจะเกิดขึ้นต่อจากนี้ล่ะ?\n\nสติของอีวานเริ่มปั่นป่วนว้าวุ่น พลางคิดในใจว่า “เกลียดที่นี่ชะมัด อยากจะหนีไปให้พ้นๆ อยากไปนอนกลิ้งในที่อุ่นๆ ซุกตัวใต้ผ้าห่ม แล้วลืมเรื่องบ้าบอพวกนี้ให้หมด”\n\n“อยากพักผ่อน อยากทิ้งทุกอย่างแล้วเผ่นหนีไปเลย อยากนอนอืดสักสัปดาห์ ซุกตัวอยู่ในผ้านวมนุ่มๆ บนเตียงแสนสบาย ในบ้านที่อบอุ่นที่มีฮีตเตอร์เปิดให้ความร้อน”\n\n“ฉันอยากกินทุกอย่างที่อยากกินจนกว่าจะยัดไม่ลง อยากคุยกับคนอื่นด้วยภาษาเกาหลี อยากดำดิ่งไปกับเกม หนังสือ หนัง รายการทีวี และความสนุกสนานทั้งหลาย”\n\nความตาย ความยากจน ความอดอยาก และความหวาดกลัว มีอยู่ทุกหนทุกแห่ง\n\nทว่าในโลกแฟนตาซียุคก่อนสมัยใหม่แสนเฮงซวยใบนี้ ที่แทบไม่รู้จักคำว่า ‘สวัสดิการ’ และ ‘การพักผ่อนหย่อนใจ’ ฉันไม่อยากจะมีชีวิตอยู่ต่อไปอีกแล้ว\n\n“อึก… แค่ก…!”\n\nชายที่นั่งอยู่ข้างๆ เขาสูดลมหายใจเฮือกอย่างแผ่วเบาพร้อมเสียงครางอู้อี้ในลำคอ\n\nจิตสังหารอันเข้มข้นแผ่ซ่านออกมาจากร่างของอีวานราวกับพิษร้ายที่กำลังลุกลาม ทว่าคิมซอนอู หรือจะเรียกว่าอีวานในตอนนี้ กลับไม่รู้ตัวถึงสภาพของตัวเองเลยสักนิด\n\nทั้งคมกริบและรุนแรงยิ่งขึ้น ทรงพลังมากพอที่จะทำร้ายผู้คนทางกายภาพได้\n\nขณะที่ความตื่นตระหนกของคิมซอนอูกำลังทวีความรุนแรงขึ้นเรื่อยๆ\n\nรถไฟที่กำลังแล่นออกจากอุโมงค์ใต้ภูเขาพลันสั่นสะเทือนอย่างรุนแรงบนสะพานเหนือหุบเขา มันคือแรงระเบิด\n\n-บึ้มมมมม!!!\n\n-ครืดดดดด—!!!\n\n-โครมมมมมม—!!\n\nแรงระเบิดไม่เพียงแต่ทำลายรางรถไฟจนขาดสะบั้น แต่ยังถล่มสะพานทั้งสายจนพังครืนลงมา ขบวนรถไฟร่วงหล่นลงไปอย่างไร้เรี่ยวแรง ตู้โดยสารบิดเบี้ยว หมุนคว้างไปตามแรงเหวี่ยงจนไม่อาจควบคุมได้\n\nขณะที่ร่างของเขาลอยเคว้งและทุกสิ่งรอบตัวพลิกคว่ำคะมำหงาย อีวานคว้าจับราววางสัมภาระบนรถไฟเพื่อทรงตัวโดยสัญชาตญาณ ดวงตาของเขากวาดสำรวจสภาพแวดล้อมโดยอัตโนมัติ\n\nท่ามกลางพื้นที่ที่บิดเบี้ยวและทิวทัศน์นอกหน้าต่างที่เลื่อนไถลไปอย่างรวดเร็ว เขารู้ได้ทันทีว่ากำลังเกิดอะไรขึ้น\n\nรถไฟกำลังตกราง\n\nมีการวางระเบิดขบวนรถไฟ\n\nด่านฝึกสอนยังไม่จบ\n\nฉันไม่ได้เข้าใจผิด\n\nฉันเดาถูกแล้ว\n\nโลกนี้ยังคงมีฉากจบอยู่\n\nภายในตู้โดยสารที่กำลังร่วงหล่น รอยยิ้มหนึ่งค่อยๆ คลี่ออกบนใบหน้าอันแห้งผากของอีวาน อย่างเชื่องช้า และลึกล้ำ\n\nเขากดข่มคิมซอนอูผู้ไร้ประโยชน์และยังคงตื่นตระหนกลงไปสู่ก้นบึ้งของจิตสำนึก เพราะบัดนี้ถึงเวลาต้องลงมือจัดการกับสิ่งที่จำเป็นต้องทำแล้ว\n\nความกลัว ความเกลียดชัง และความสับสน ไม่ได้ช่วยอะไรในภารกิจ พวกเขามักพูดกันว่าจงทำหัวให้เย็นและหัวใจให้อบอุ่น แต่นั่นมันผิดถนัด\n\nในหน่วยเก็บกวาด พวกเขาสอนต่างออกไป จงรักษาทั้งสมอง หัวใจ และปลายนิ้วของเจ้าให้เย็นเยียบเข้าไว้\n\nดั่งฤดูหนาวอันโหดร้ายแห่งคราซิลอฟ ดั่งค่ำคืนอันยาวนานในวันวาน เยือกเย็น เงียบงัน และแม่นยำ\n\nเจ้าหน้าที่หน่วยเก็บกวาดอันตรธานหายไปอย่างเงียบเชียบ ท่ามกลางความโกลาหลภายในขบวนรถไฟ\n\nเหยียบลงบนราวกั้น เหยียบลงบนชั้นวางของ ผลักกองซากที่พันกันยุ่งเหยิงออกไป แล้วไต่ขึ้นไป ขึ้นไป ขึ้นไป\n\n***\n\nความทรงจำสุดท้ายของอิซาเบลล์คือภาพและถ้อยคำที่แตกกระจัดกระจายปะปนกัน\n\nร่างที่กระเด็นลอยออกไป ภาพทิวทัศน์ที่สั่นไหวอย่างบ้าคลั่ง ความเจ็บปวดทรมานจนแทบขาดใจ\n\nหน้าต่างที่แตกละเอียดและกองดินที่ถล่มทะลักเข้ามา\n\nและจากนั้น อีกหนึ่งเสียง\n\n“ตูม!”\n\nอิซาเบลล์สะดุ้งตื่นขึ้นมาพร้อมเหงื่อโทรมกาย รอบข้างถูกปกคลุมด้วยความมืดมิด ชั่วพริบตาหนึ่งเธอทันเห็นป่าสนแห่งคราเชนรอฟเคลื่อนผ่านไปท่ามกลางแสงสนธยา\n\nเธอพยุงตัวลุกขึ้นด้วยความเจ็บปวดรวดร้าวไปทั้งร่าง\n\nห้องโดยสารถูกฝังกลบอยู่ใต้กองดิน เมื่อดวงตาเริ่มปรับตัวเข้ากับความมืดที่คืบคลานเข้ามาได้ เธอก็มองเห็นเนินดินที่ไหลทะลักเข้ามาทางหน้าต่างที่แตกพัง\n\nและเสียงหยดน้ำที่ดังติ๋งๆ\n\nเสียงหายใจหอบกระชั้นรุนแรง เสียงอันแผ่วเบา\n\n“คุณ… คุณ… คุณหนูฟื้นแล้วหรือครับ?”\n\n“ออกัสตัส…?”\n\nชายคนหนึ่งยืนอยู่ตรงหน้าเธอ\n\nไม่สิ ร่างของเขาถูกตรึงติดอยู่\n\nแขนข้างหนึ่งจมหายเข้าไปในกองดิน มีเหล็กเส้นยาวทะลุออกมาจากสีข้างของเขา\n\nเสียงหยดน้ำที่ดังขึ้นนั้นมาจากเลือดที่หยดติ๋งๆ ออกจากปาก จมูก และเอวของเขา\n\n“ทำไม…?”\n\nเขากระโจนเข้ามาปกป้องเธอ ใช้ร่างกายของตัวเองบังก้อนหินที่ร่วงหล่นและรับแรงกระแทกจากซากรถไฟเอาไว้ด้วยแผ่นหลัง\n\nเธอจ้องมองอัศวินผู้นั้นด้วยความตกตะลึง ส่วนอัศวินหนุ่มก็ยังคงแย้มยิ้มอย่างอ่อนโยนเช่นเคย\n\n“คุณหนู ต้องรีบ… หนีไปครับ… พวกมันกำลังแห่กันมาเป็นระลอก พวกมันเล็งเป้าที่คุณหนู…”\n\n“หยุดพูดนะ! ตอบฉันมาก่อน! ทำไม…? ทำไมนายถึงทำเรื่องแบบนี้? นายบ้าไปแล้วจริงๆ เหรอ?”\n\nอิซาเบลล์จ้องเขม็งไปยังอัศวินที่ตัวสั่นเทา\n\n“นายคิดว่าถ้าฉันตาย พ่อของฉันจะโกรธเป็นฟืนเป็นไฟงั้นเหรอ? ไม่มีทาง! เขาไม่เคยสนใจใครทั้งนั้นแหละ!”\n\n“กระผมทราบดีครับ”\n\nอัศวินหนุ่มยิ้มอย่างอ่อนแรง ในทิลีสจะมีใครบ้างที่ไม่รู้จักชายผู้ปลีกวิเวกเข้าไปอยู่ในหุบเขาลึก ตัดขาดการติดต่อทั้งหมด และปฏิเสธไม่ให้ผู้ใดเข้าพบ\n\nในช่วงแรก ผู้คนต่างคิดว่าเขาจากไปเพื่อรักษาบาดแผลทางใจหลังจากสังหารจอมมาร\n\nต่อมา พวกเขาก็เริ่มซุบซิบกันว่าหัวใจในฐานะผู้กล้าของเขาคงบิดเบี้ยวไปเพราะจอมมาร\n\nยังไม่ทันจะครบสี่ปีดี ผู้คนก็เริ่มหลงลืมผู้กล้าคนนั้นไปเสียแล้ว\n\nนับตั้งแต่วินาทีที่เขาสังหารจอมมาร หรืออาจจะเป็นตั้งแต่ก่อนหน้านั้นเสียด้วยซ้ำ เพราะคำว่า ‘ผู้กล้า’ ไม่ใช่ตัวตนของปัจเจกบุคคล\n\nแม็กซิมิเลียนพังทลายลงภายใต้ชื่อเสียงของคำว่าผู้กล้า บัดนี้ เหลือเพียงวีรกรรมและตำนานของเขาที่ยังคงดังก้องอย่างว่างเปล่า\n\n“นายเกลียดฉัน”\n\n“ถูกต้องครับ”\n\n“แต่ทำไม…?”\n\n“เพราะคุณหนูคือธิดาของผู้กล้าครับ”\n\nแม้ชีวิตของชายผู้นี้กำลังจะมอดดับลง ทว่าดวงตาของเขากลับทอประกายเจิดจ้าอย่างน่าประหลาด\n\nอิซาเบลล์ยิ้มออกมา ราวกับเห็นสถานการณ์ตรงหน้าเป็นเรื่องน่าขันสิ้นดี\n\n“แล้วมันสำคัญตรงไหนกัน” เธอกล่าว “นายคิดว่าพ่อของฉันจะใส่ใจ ‘ลูกสาว’ คนนี้แม้แต่ปลายเล็บหรือไง?”\n\n“ไม่ครับ คุณหนู กระผมไม่เคยคิดถึงความสนใจของท่านแม็กซิมิเลียนเลย”\n\nทว่า การได้ชื่อว่าเป็นธิดาของผู้กล้า\n\n“เพราะคนคนหนึ่งสามารถจุดประกายความหวังในหัวใจของมวลมนุษยชาติได้ เพราะพวกเราได้ใช้ช่วงเวลาเหล่านั้นร่วมกัน และเพราะว่า… ต่อให้บุรุษผู้ยิ่งใหญ่ขนาดนั้นจะเลือนหายไปตามกาลเวลา ท่านก็ยังคงเป็นมนุษย์ผู้หนึ่งที่ทิ้งทายาทเอาไว้เบื้องหลัง”\n\nแม็กซิมิเลียนเองก็เป็นมนุษย์คนหนึ่งเช่นกัน\n\nข้อเท็จจริงข้อนี้ใครๆ ก็อาจเห็นพ้องต้องกัน แต่กลับไม่มีผู้ใดเข้าใจอย่างแท้จริง\n\nทว่าอิซาเบลล์นั้นต่างออกไป เธอคือลูกสาว ทั้งโกรธแค้น ริษยา และโศกเศร้า เด็กสาวที่ถูกหลอกหลอนด้วยความขาดแคลนความรัก\n\nดังนั้น การมีอยู่ของอิซาเบลล์จึงเป็นเครื่องยืนยันว่า ท้ายที่สุดแล้ว ผู้กล้าก็เป็นเพียงมนุษย์คนหนึ่งเช่นกัน\n\nในทางกลับกัน ในฐานะมนุษย์ ยิ่งไปกว่าการเป็นมนุษย์ มันสื่อถึงศักยภาพในการที่จะก้าวขึ้นมาเป็นผู้กล้าได้\n\nเขาเชื่อมั่นเช่นนั้น ต่อให้อิซาเบลล์จะเกลียดชังแนวคิดเรื่องผู้กล้าเพียงใด เธอก็ไม่อาจปฏิเสธคุณค่าการดำรงอยู่ของตัวเธอเองได้ เธอคือความหวัง\n\nเมล็ดพันธุ์สุดท้ายที่ผู้กล้าทิ้งไว้เบื้องหลัง การผลิบานของมันคือสัญลักษณ์แห่งความหวัง ในยุคสมัยที่ซากเดนจากสงครามในอดีตกำลังก่อร่างสร้างรากฐานที่พังทลายขึ้นมาใหม่\n\nความหวังที่สามารถเบ่งบานได้แม้ในยุคสมัยอันเสื่อมโทรมนี้\n\nไม่ใช่ความหวังของเหล่าทหารเกณฑ์ที่ออกไปรบกับจอมมาร แต่เป็นความหวังสำหรับผู้คนธรรมดาที่ใช้ชีวิตไปวันๆ\n\nหากผู้กล้าได้รับการยกย่องให้เป็นสัญลักษณ์แห่งชัยชนะ เช่นนั้นแล้ว ทายาทของผู้กล้าก็คือสัญลักษณ์แห่งการฟื้นฟูบูรณะ พวกเขาคือตัวแทนของรุ่งอรุณแห่งยุคสมัยใหม่\n\nด้วยเหตุนี้ แม้จะชิงชังอิซาเบลล์ เขาก็ยังคงยอมสละชีวิตตัวเอง\n\nเขาคืออัศวินแห่งทิลีส ชายผู้สามารถละทิ้งตัวตนส่วนบุคคลเพื่อประโยชน์ส่วนรวมที่ยิ่งใหญ่กว่า และเขายังเป็นสามัญชนผู้หนึ่งที่ไม่ได้เฝ้าฝันถึงการฟื้นฟูมนุษยชาติอย่างเลื่อนลอย\n\n“ยอดเยี่ยมมาก”\n\nทันทีที่คำพูดของเขาจบลง เสียงตุ้บก็ดังขึ้น จากกองดินที่ทะลักเข้ามาทางหน้าต่าง มีแขนข้างหนึ่งพุ่งทะลุออกมา\n\nแขนข้างนั้นคลำทางอยู่ในกองดินครู่หนึ่ง ก่อนจะไถลพรวดออกมาอย่างคล่องแคล่ว\n\nอากาศอันหนาวเหน็บของคืนปลายฤดูหนาวแผ่ซ่านเข้ามาทำให้ภายในห้องเย็นยะเยือก\n\nช่องโหว่นั้นเปิดทางให้แสงจันทร์สีครามสาดส่องเข้ามา\n\n“ท่านสุภาพบุรุษ ท่านมีนามว่าอะไร?”\n\n“ดิอัน ออกัสต์ แล้วท่านล่ะ?”\n\n“อีวาน เปโตรวิช”\n\nเมื่อกองดินพังทลายลง ชายคนหนึ่งก็ก้าวเข้ามาภายในห้อง\n\nอาบไล้ด้วยแสงจันทร์ ทอดเงายาวเหยียดลงบนพื้น\n\n“อยากมีชีวิตรอดไหม?”\n\n“ถ้าเป็นไปได้ครับ”\n\n“มันจะเจ็บหน่อยนะ”\n\nอีวานหมุนเปิดฝาขวดโพชั่นรักษาบาดแผลออก\n\n**หมายเหตุผู้เขียน:**\n\nหมายเหตุ: ยิ่งบาดแผลลึกเท่าไหร่ โพชั่นรักษาบาดแผลก็จะยิ่งเจ็บปวดทรมานมากขึ้นเท่านั้น\n\nมาช้า… ขอโทษ… ที่ทำให้รอนะครับ…"
    },

      "title": "บทที่ 13",
      "content": "เซอร์ดิอัน ออกัสต์ ช่างเป็นยอดคนตัวจริงเสียงจริง แม้ต้องทนรับความเจ็บปวดแสนสาหัสจนเผลอหลุดปากสารภาพความลับฉาวโฉ่ทั้งหมดออกมา เขาก็ยังคงแสดงให้เห็นถึงพลังใจที่แข็งแกร่งดุจเหล็กกล้า\n\nอิซาเบลล์ตัดสินใจจดจำภาพนั้นไว้ในหัว สิ่งสำคัญไม่ได้อยู่ที่ว่าท่านออกัสต์ตะโกนเรียกชื่อเธอ หรือคลุ้มคลั่งคว้าตัวผู้ชายที่ชื่ออีวานแล้วพยายามแฉสมุดบัญชีลับของกองอัศวินออกมาจนหมดเปลือก\n\nการต้องทนดูสภาพแบบนั้นมันลำบากใจเกินไปสำหรับอิซาเบลล์ เธอจึงไม่ลังเลที่จะตบหน้าเซอร์ดิอัน ออกัสต์ เข้าฉาดใหญ่ทันที\n\nต้องรอจนอีวานอบรมเธอเสียยกใหญ่เรื่องอันตรายของการตบหัวคนที่กำลังกระอักเลือดอยู่ ท่านออกัสต์ถึงจะเริ่มกลับมาพูดจาเป็นภาษามนุษย์ได้\n\n“หม่าม้า?”\n\n“อืม”\n\nหลังจากตรวจดูบาดแผลที่เย็บไว้อย่างเรียบร้อยดีแล้ว อีวานก็วินิจฉัยออกมาตรงๆ\n\n“อาการช็อกทำให้เขาย้อนวัยกลับไปเป็นเด็ก อิซาเบลล์ เธอพลาดแล้วที่ไปตบเขา ลองคิดดูสิ”\n\n“เซอร์ดิอัน ออกัสต์ คงไม่โทษฉันหรอกใช่ไหม? แล้วเขาจะกลับมาเป็นปกติได้หรือเปล่า?”\n\n“ไม่ต้องเครียด เป็นเรื่องปกติ เดี๋ยวพอเวลาผ่านไปเขาก็ได้สติกลับมาเอง”\n\nอีวานหันไปมองด้านนอกอยู่ครู่หนึ่ง ก่อนจะทิ้งระเบิดลูกใหญ่ลงมา\n\n“แต่การตะโกนโหวกเหวกเสียงดังเกินไปเมื่อกี้น่าจะดึงดูดความสนใจเข้าให้แล้ว ได้เวลาที่พวกที่ซุ่มอยู่บนภูเขาจะลงมาแล้วล่ะ พวกเราต้องเตรียมตัว”\n\n“แล้วเซอร์ดิอัน ออกัสต์ ล่ะ?”\n\n“ต้องแบกเขาไปด้วย”\n\nอีวานเหลือบมองอิซาเบลล์เงียบๆ อิซาเบลล์เองก็จ้องตอบเช่นกัน\n\nหลังจากเงียบไปครู่หนึ่ง อิซาเบลล์ที่มึนงงกับสีหน้าของอีวานก็เอ่ยถามอย่างสับสน\n\n“ฉันเหรอ?”\n\n“เออ”\n\n“แล้วคุณล่ะ?”\n\n“ฉันต้องสู้”\n\n“ฉันก็สู้ได้เหมือนกันนะ!”\n\nอีวานก้มลงมองอิซาเบลล์พลางส่ายหน้า ถึงเธออาจจะโดดเด่นกว่าเพื่อนรุ่นเดียวกันก็จริง แต่ท่าทางในตอนนี้มันดูไม่น่าเชื่อถือเอาเสียเลย\n\nแค่เห็นภาพเมื่อครู่เธอก็หน้าซีดเผือดแล้ว แถมมือที่ถือมีดอยู่ก็ยังสั่นไม่หยุดอีกต่างหาก\n\n“ดูท่าคำพูดกับการกระทำของเธอมันจะไปคนละทางกันนะ ว่าไหม?”\n\n“….”\n\nอีวานยิ้มขมขื่นแล้วหันหลังเดินออกไป อิซาเบลล์ที่ถูกทิ้งให้อยู่ตามลำพังถอนหายใจเฮือกใหญ่ ก่อนจะแบกร่างของดิอันขึ้นหลัง\n\nให้ตายสิ หนักชะมัด\n\nไม่ใช่ว่าเธออ่อนแอจนรับน้ำหนักผู้ชายตัวโตเต็มวัยไม่ไหวเสียหน่อย ลูกตุ้มที่เธอใช้ฝึกซ้อมยังหนักกว่าตัวดิอันเสียอีก\n\nทว่าน้ำหนักตัวของชายที่บาดเจ็บสาหัสและอ่อนแรงเช่นนี้กลับถ่วงเธอลงอย่างน่าใจหาย\n\nขณะที่เธอขยับตัวดิอันให้เข้าที่แล้วเดินออกมา อีวานที่ยืนอยู่ใต้แสงจันทร์ก็หันมามองทางเธออย่างกะทันหัน\n\n“สำหรับเด็กผู้หญิง ถือว่าไม่เลวเลยนี่”\n\n“พูดจาเสียมารยาทนะคะคุณลุง นี่พวกเราเคยเจอกันมาก่อนหรือเปล่า? ทำไมถึงพูดเหมือนรู้จักฉันดีนัก?”\n\n“ดูท่าเธอจะได้นิสัยใจคอมาจากแม่สินะ”\n\n“ว้าว พูดแบบนี้ตั้งใจจะยั่วให้ฉันชักดาบใช่ไหมเนี่ย? แล้วคุณล่ะ เหมือนใครมากกว่ากัน ฝ่ายแม่หรือฝ่ายพ่อ?!”\n\n“ก็นะ ตอนนี้ฉันจำหน้าพวกเขาไม่ได้ด้วยซ้ำ”\n\n“อย่างนั้น…! อย่างนั้นหรอกเหรอ…? เอ่อ…”\n\nแม้ดวงตาและผิวพรรณของเขาจะดูอ่อนเยาว์อย่างน่าประหลาด เธอกลับหรี่ตามองเคราหนาทึบที่ปกคลุมแนวกรามของอีวาน\n\nสงครามเพิ่งจบลงไปได้แค่สี่ปีเท่านั้น\n\nและสงครามครั้งนั้นก็ยืดเยื้อยาวนานเกือบยี่สิบปี\n\nย่อมเป็นเรื่องปกติ สำหรับคนในวัยเดียวกับเขา การสูญเสียพ่อแม่ไประหว่างสงครามเป็นเรื่องที่พบเห็นได้ทั่วไป….\n\nเธอรู้สึกผิดขึ้นมาหน่อยๆ การยกเรื่องพ่อแม่มาพูดมันเสียมารยาทไม่ใช่หรือไง? นี่คือวิธีทักทายของคนคราซิลอฟงั้นเหรอ? (เรื่องการถามไถ่ถึงพ่อแม่นี่เป็นส่วนหนึ่งของคำทักทายอันสุภาพในโดรเวียน ไม่ใช่คราซิลอฟเสียหน่อย)\n\nหลังจากบ่นพึมพำอยู่ครู่หนึ่ง ในที่สุดเธอก็เข้าใจความหมายที่อีวานต้องการจะสื่อและเบิกตากว้างด้วยความตกใจ\n\n“คุณรู้จักพ่อของฉันด้วยเหรอ?”\n\n“ก็ประมาณนั้น”\n\nเมื่อเห็นสีหน้าของเด็กสาวที่เปลี่ยนไปกะทันหัน อีวานก็แอบหัวเราะหึๆ อยู่ในใจ\n\nจะมีใครที่ไม่รู้จักแม็กซิมิเลียนบ้างล่ะ จริงไหม?\n\nเขายักไหล่แล้วพูดว่า “รวบรวมผู้รอดชีวิตเข้าด้วยกัน ก่อกองไฟแล้วฉีกเบาะรถไฟมาทำเป็นผ้าห่มซะ กลางคืนแถวนี้หนาวกว่าที่เธอคิดนะ”\n\n“การก่อไฟมันจะไม่ดึงดูดให้ศัตรูมาโจมตีเอาเหรอ?”\n\n“นั่นไม่ใช่เรื่องที่เธอต้องกังวล”\n\n“คุณจะออกไปคนเดียว ทั้งที่ยังไม่รู้ด้วยซ้ำว่าศัตรูเป็นใครเนี่ยนะ?”\n\n“นั่นก็ไม่ใช่เรื่องที่เธอต้องกังวลเหมือนกัน”\n\nการได้พบหน้าลูกสาวของแม็กซิมิเลียนเป็นครั้งแรก ทำให้อีวานเกิดความรู้สึกที่คาดไม่ถึงอยู่บ้าง\n\nแม้เธอจะสืบทอดหน้าตาและฝีมือมาจากผู้เป็นพ่อ ทว่านิสัยใจคอกลับแตกต่างกันโดยสิ้นเชิง\n\nสมัยก่อน แม็กซิมิเลียนชอบอวดเรื่อง ‘หวานใจที่รออยู่ที่บ้านเกิด’ ในตอนกลางคืนอยู่บ่อยๆ โดยบอกว่าเธอทั้งอ่อนโยนและเอาใจใส่ผู้อื่น ดูท่าเด็กคนนี้คงได้นิสัยมาจากแม่กระมัง\n\nความรักนี่มันช่างซับซ้อนเสียจริง มันทำให้คนตาบอดมองไม่เห็นข้อบกพร่องและจุดอ่อนไปเสียหมด อีวานหัวเราะเบาๆ แล้วเดินจากไป\n\n***\n\nในตำราพิชัยสงครามที่อีวานเคยร่ำเรียนมา มีคำกล่าวบทหนึ่งว่า:\n\n“จงคาดการณ์สิ่งที่เลวร้ายที่สุด และลงมือกระทำในสิ่งที่ดีที่สุด”\n\nตอนนั้นมันฟังดูเป็นประโยคที่งี่เง่าสำหรับอีวาน มันเพิ่งมาสมเหตุสมผลก็ตอนที่เขานำมาทบทวนใหม่ผ่านประสบการณ์จริง\n\nแก่นแท้ของความจริงนั้นคือสิ่งนี้\n\n“คาดการณ์สิ่งที่เลวร้ายที่สุด หมายความว่า ศัตรูจะเลือกใช้หนทางที่โหดหินที่สุดในการเล่นงานเจ้าเสมอ”\n\n“ลงมือกระทำในสิ่งที่ดีที่สุด หากศัตรูคือฝันร้ายที่เลวร้ายที่สุดสำหรับเจ้า จงกลายเป็นฝันร้ายที่เลวร้ายที่สุดสำหรับพวกมันเสีย”\n\nดังนั้น จงลอกเลียนการเคลื่อนไหวของศัตรู การโจมตีที่เลวร้ายที่สุดของเจ้า ย่อมเป็นการรุกฆาตที่ดีที่สุดในการโต้กลับพวกมัน\n\nด้วยเหตุนี้ ภารกิจของอีวานจึงชัดเจน\n\nขั้นแรก จงคิดถึงกรณีที่เลวร้ายที่สุด\n\n“การถูกซุ่มโจมตีระหว่างหลบหนีหลังจากรอดชีวิตมาได้คือเรื่องที่เลวร้ายที่สุด และมันจะยิ่งเลวร้ายกว่าเดิมหากต้องสู้ยืดเยื้อ”\n\nการถูกโจมตีในค่ำคืนอันมืดมิดจะบั่นทอนกำลังจนหมดสิ้น อีวานอาจจะรับมือไหว แต่สำหรับคนเจ็บและเด็กสาวคนหนึ่ง มันคือหายนะถึงตาย\n\nดังนั้น จงคาดการณ์สิ่งที่เลวร้ายที่สุด ศัตรูย่อมคาดว่าเหยื่อจะพยายามหนีและวางแผนรับมือตามนั้น\n\nตามหลักเหตุผลแล้ว ในกรณีที่รถไฟตกรางจากการถูกโจมตี ผู้รอดชีวิตย่อมต้องรีบหนีออกจากจุดเกิดเหตุและไปขอความช่วยเหลือ\n\nทีนี้ ก็ถึงเวลาตอบโต้\n\n“แสร้งทำเป็นถ่วงเวลา ให้ศัตรูมองเห็นเป้าหมายได้อย่างชัดเจน ทำตัวให้อ่อนแอเข้าไว้”\n\nวิธีนี้จะบีบให้ศัตรูที่ไม่ทราบฝ่ายต้องถอนกำลังไล่ล่ากลับมา แล้วเปลี่ยนจากการไล่ตามเป็นการโอบล้อมแทน\n\nโลกใบนี้ไม่ใช่เกมวางแผนการรบ แต่มันคือของจริง\n\nการออกคำสั่งไม่ได้แปลว่าจะเกิดการกระทำขึ้นในทันที\n\nนั่นหมายความว่าย่อมเกิดช่องว่างของเวลาระหว่างการตรวจพบผู้ไล่ล่ากับการชิงความได้เปรียบทางยุทธวิธี\n\nในมุมมองของฝ่ายโจมตี การปิดล้อมย่อมมาพร้อมกับสงครามจิตวิทยา พวกมันจะมองตัวเองเป็นแมวที่กำลังจ้องมองเหยื่อ รอคอยจังหวะเวลาที่สมบูรณ์แบบที่สุดในการตะครุบ\n\nเพื่อรับประกันว่าเป้าหมายจะหนีไม่รอด และวางแผนจะซัดหมัดน็อกอันหนักหน่วงในจังหวะที่เหมาะสม\n\nนั่นแหละคือเงื่อนไข นั่นคือ “การโจมตีที่เลวร้ายที่สุด” ที่ศัตรูของคุณจะคิดออกได้\n\nดังนั้น จงเลียนแบบ เปลี่ยนแผนที่ดีที่สุดของพวกมันให้กลายเป็นฝันร้ายที่เลวร้ายที่สุด เตรียมการจู่โจมสายฟ้าแลบ ขัดเกลาแผนการรุกอย่างรอบคอบ และวางกับดักรอไว้\n\n“เฮ้อ…”\n\nท่ามกลางเงามืดอันลึกล้ำของผืนป่า มือกุมปืนพกที่เย็นเฉียบ\n\nอีวานสูดลมหายใจเข้าอย่างเงียบเชียบ แล้วค่อยๆ ผ่อนลมหายใจออกอย่างช้าๆ\n\nเขาย่อตัวซุ่มอยู่ใต้โคนต้นไม้ กลั้นลมหายใจ ค่อยๆ ยกมือขึ้น จัดแนวหัวไหล่และปลายนิ้วให้ตรงกันอย่างประณีต พยายามควบคุมอาการสั่นไหวของมือที่เกิดจากจังหวะการเต้นของร่างกาย\n\nกริ๊ก\n\nด้วยจังหวะของการหายใจสามครั้ง เขาเหนี่ยวไกปืนด้วยนิ้วชี้ที่สอดอยู่ในโกร่งไก\n\n– ปัง!\n\nมันคือวิชายิงปืนพกแม่นยำ ซึ่งเป็นเทคนิคสำหรับการยิงระยะไกล เหมาะอย่างยิ่งสำหรับหน่วยเก็บกวาดในการลอบสังหารขณะซ่อนปืนไรเฟิลไว้ในดินแดนศัตรู\n\nท่ามกลางแสงจันทร์ ร่างเงาขนาดเล็กฟุบฮวบลงกับพื้น\n\nไม่จำเป็นต้องรีบบรรจุกระสุนใหม่ กระสุนนัดแรกเข้าเป้า และในไม่ช้าผืนป่าก็เริ่มปั่นป่วน ศัตรูตื่นตัวแล้ว\n\nการซุ่มโจมตีได้เปิดฉากขึ้นแล้ว\n\nและอีกไม่นานพวกมันก็จะได้ตระหนัก\n\nการจู่โจมของหน่วยเก็บกวาดได้เริ่มต้นขึ้นแล้ว\n\nในค่ำคืนอันมืดมิดและผืนป่าลึก ภูมิประเทศที่คุ้นเคยพร้อมอาวุธที่ถนัดมือ\n\nในการซุ่มโจมตีของหน่วยเก็บกวาด คนเพียงคนเดียวก็สามารถโอบล้อมคนทั้งกองทัพได้\n\n***\n\n“ปัง!”\n\nเมื่อเสียงปืนดังก้องมาจากระยะไกล อิซาเบลล์ก็ซ่อนมือที่สั่นเทาเอาไว้และเตรียมพร้อมรับมือกับการโจมตีของศัตรู\n\nนั่นคือสัญญาณที่ชัดเจนว่าศึกได้เริ่มขึ้นแล้ว ฝูงนกต่างแตกตื่นบินหนีกันจ้าละหวั่น\n\nผู้คนรอบตัวเธอที่กำลังตัวสั่นงันงกอยู่ข้างกองไฟต่างพากันจ้องมองด้วยความหวาดกลัวที่ฉายชัดบนใบหน้า\n\n“พวกเราจะตายกันหมดแล้วใช่ไหม?”\n\n“น่ากลัวเหลือเกิน… ฉันกลัว… แม่… แม่จ๋า…”\n\nเสียงของผู้รอดชีวิตซึ่งอย่างน้อยทุกคนต่างก็มีบาดแผลเล็กน้อยดังระงมอยู่รอบตัวเธอ\n\nท่ามกลางความสับสน ภาระอันหนักอึ้ง และความรู้สึกผิด อิซาเบลล์ฝืนก้มหน้าลง พวกเขาต้องมาตกเป็นเหยื่อก็เพราะเธอ น้ำหนักของความจริงที่ว่ามีผู้รอดชีวิตเพียงสิบคนจากรถไฟขบวนมหึมากดทับอยู่บนบ่าของเธออย่างหนักหน่วง\n\nทันใดนั้น เสียงอันแผ่วเบาก็ดังขึ้นจากด้านหลังเธอ\n\n“เหตุผลที่เราเรียกใครสักคนว่าผู้กล้า ไม่ใช่เพราะเขาแข็งแกร่งที่สุด แต่เป็นเพราะเขากล้าหาญที่สุดต่างหาก”\n\n“ออกัสตัส? คุณได้สติกลับมาแล้วเหรอ?”\n\nออกัสตัสที่พยุงตัวอยู่ด้านหลังเธอเอ่ยออกมาด้วยน้ำเสียงที่ยังคงพร่าเลือนเล็กน้อย\n\n“ดังนั้น พวกเราต้องไม่กลายเป็นผู้กล้า เราไม่ควรแม้แต่จะพยายามด้วยซ้ำ เราต้องยอมรับในความอ่อนแอของตัวเอง”\n\n“ออกัสตัส?”\n\n“เราจำเป็นต้องยืนอยู่ในจุดเดียวกับผู้อ่อนแอ มองเห็นผู้อื่นเฉกเช่นตัวเราเอง เราไม่ได้กวัดแกว่งดาบเพราะความกล้าหาญ ความแข็งแกร่ง หรือเพราะเหนือกว่าใคร”\n\nเสียงของออกัสตัสยังคงไม่ชัดถ้อยชัดคำนัก\n\nทว่าน่าประหลาด ที่ถ้อยคำแต่ละคำกลับฟังดูแม่นยำและสลักลึกลงไปในหัวใจของเธอ\n\n“เรากวัดแกว่งดาบเพราะมันเป็นสิ่งที่ถูกต้อง เพราะความเที่ยงธรรม เพื่อความยุติธรรมที่เราต้องธำรงรักษาไว้ ดังนั้น มันไม่ใช่เรื่องของการเป็นผู้กล้า แต่มันคือความถูกต้อง”\n\n“ออกัสตัส?”\n\n“เพราะฉะนั้น จงกวัดแกว่งดาบเถิด อย่าพยายามเป็นผู้กล้า อัศวินแห่งทิลีส จงยืนหยัดอยู่ ณ ที่นี้ด้วยความถ่อมตน มิใช่ความอหังการ”\n\nบัดนี้เธอเข้าใจความหมายที่ดิอันต้องการจะสื่อแล้ว\n\nนี่คือคำสอนวิถีอัศวินโบราณตามขนบธรรมเนียม\n\nไม่ใช่ยศถาบรรดาศักดิ์อัศวินในฐานะ ‘ตำแหน่ง’ ที่กษัตริย์พระราชทานให้แก่ข้าราชบริพาร\n\nแต่มันคือคำสอนบทสุดท้ายที่เหล่าอัศวินผู้เปรียบเสมือนนักเดินทางกลุ่มหนึ่งมอบให้แก่ศิษย์ผู้ติดตามของตน\n\nดิอัน ออกัสตัส มาจากภาคีอัศวินดั้งเดิม และแม้กระทั่งในยามนี้ ถ้อยคำเหล่านั้นก็ยังคงแจ่มชัดอยู่ในความทรงจำของเขา\n\n“เพื่อความยุติธรรม จงกวัดแกว่งดาบ การทำความดีนั้นเป็นเรื่องเล็กน้อยและเที่ยงธรรมเสมอ จงกวัดแกว่งดาบเพื่อความยุติธรรมของเจ้า มิใช่เพื่อพละกำลังของเจ้า บัดนี้ เจ้าคืออัศวินแล้ว”\n\nดิอันไม่ได้เอ่ยอะไรต่อจากถ้อยคำเหล่านั้น เหลือเพียงเสียงลมหายใจที่โรยริน\n\nอิซาเบลล์รู้ประวัติของดิอันดี รู้เรื่องการรับใช้ชาติในฐานะอัศวินผู้โชกโชนในสงครามต่อต้านกองทัพปีศาจ\n\nบัดนี้เธอเข้าใจแล้วว่าเหตุใดถ้อยคำอันสั้นกระชับและแม่นยำเหล่านั้นจึงยังคงแจ่มชัดนัก เธอรู้สึกได้ทันทีว่าช่วงเวลานี้จะตราตรึงอยู่ในใจเธอไปตลอดกาล\n\nเธอลุกขึ้นยืนและเงยหน้าขึ้นมองไปรอบๆ เสียที\n\nผู้คนมากมายต่างจ้องมองมาที่เธอ ทนทุกข์ทรมานท่ามกลางความหนาวเหน็บ ความหวาดกลัว ความเจ็บปวด และความหิวโหย\n\nความรู้สึกผิดยังคงอยู่ ทว่าเธอกลับเปี่ยมไปด้วยความมุ่งมั่นอันแรงกล้า\n\n“ฉันจะทำ”\n\nอิซาเบลล์ค่อยๆ วางร่างของดิอันลงอย่างทะนุถนอม ก่อนจะยืนหยัดขึ้นอย่างสง่าผ่าเผยต่อหน้าทุกคน\n\nดาบในมือของเธอให้ความรู้สึกหนักอึ้งขึ้น ทว่ามือที่เคยสั่นเทาเมื่อครู่นี้กลับจับมันไว้อย่างมั่นคง\n\nดวงตาของเธอลุกโชนไปด้วยปณิธานอันแน่วแน่"
    },
