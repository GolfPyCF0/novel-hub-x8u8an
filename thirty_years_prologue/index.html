      "title": "บทที่ 27",
      "content": "มีคำกล่าวไว้ว่า “เมื่อเกิดเรื่องประหลาดขึ้นในประวัติศาสตร์โลก ให้เล็งเป้าไปที่อังกฤษ แล้วคุณจะทายถูกโดยประมาณ”\n\nคิมซอนอูศึกษาเรื่องมีมทางอินเทอร์เน็ตมากกว่าประวัติศาสตร์โลก ดังนั้นเขาจึงรู้จักมีมนี้ดีแม้จะไม่รู้เหตุผลโดยละเอียดก็ตาม\n\nจากมุมมองของอีวาน เขารู้ดีว่ามีมที่คล้ายคลึงกันนี้ก็แพร่หลายไปทั่วในโลกยุคก่อนสมัยใหม่แห่งนี้เช่นกัน\n\nในประวัติศาสตร์โลกฉบับดั้งเดิม หากเกิดเรื่องประหลาดอะไรขึ้น คุณสามารถเดาคร่าวๆ ได้ด้วยการชี้ไปที่พวกเอลฟ์\n\nเอลฟ์เป็นเผ่าพันธุ์ที่โดยพื้นฐานแล้วเต็มไปด้วยความรู้สึกเหนือกว่า หยิ่งยโส จองหอง และคิดว่าการเหยียดเผ่าพันธุ์เป็นเรื่องสามัญสำนึก\n\nเหตุผลเดียวที่พวกเอลฟ์ยอมเข้าเป็นส่วนหนึ่งของสหราชอาณาจักรก็คือ จากมุมมองของพวกมัน ปีศาจนั้นน่ารังเกียจยิ่งกว่ามนุษย์เสียอีก (น่าเสียดายที่คนแคระเป็นเผ่าพันธุ์ที่ไม่เลือกปฏิบัติ พวกนั้นจึงไปเข้าข้างพวกปีศาจแทน)\n\n“มีทฤษฎีในแวดวงวิชาการว่ามนุษย์อาจจะเป็นลิงที่วิวัฒนาการมา ในกรณีส่วนใหญ่ พวกเจ้าก็ไม่ได้ต่างจากลิงเท่าไหร่นัก แต่อย่างน้อยก็แสดงให้เห็นร่องรอยของสติปัญญาอยู่บ้าง อย่าคิดในแง่ลบเกินไปเลย นี่เป็นคำชมนะ”\n“โอ้ คุณพระ มนุษย์กำลังเถียงกลับงั้นหรือ? โลกใบนี้มันหมุนกลับตาลปัตรไปยังไงกันแล้วเนี่ย…?”\n“เวทมนตร์…? เจ้าพยายามตั้งชื่อให้ยิ่งใหญ่เกินไปสำหรับการละเล่นกับพลังเวทนะ มนุษย์ เจ้ายังไม่เด็กเกินไปหน่อยหรือที่จะร่ายเวทมนตร์น่ะ?”\nคำพูดข้างต้นคือถ้อยคำที่เบโอลกริน ซึ่งได้รับการยกย่องว่ามีนิสัยดีที่สุดในหมู่เอลฟ์ เคยกล่าวกับอีวานโดยตรง\n\nอีวานยังคงจำช่วงเวลานั้นได้อย่างชัดเจน\n\nสมาชิกทุกคนในปาร์ตี้ผู้กล้าล้วนบ้าบอคอแตก แต่เบโอลกรินคือหนึ่งในคนบ้าระดับคุณภาพสูงสุดเลยทีเดียว\n\nสิ่งที่น่าตกใจยิ่งกว่านั้นก็คือ อันที่จริงเบโอลกรินไม่ได้มีเจตนาร้ายใดๆ เลย\n\nกล่าวอีกนัยหนึ่ง ถ้อยคำเหล่านั้นเป็นเพียงคำพูดปกติธรรมดาตามธรรมชาติจากมุมมองของเขานั่นเอง\n\nแม้กระทั่งในตอนนี้ ที่ประชากรซึ่งเดิมทีก็น้อยนิดอยู่แล้วต้องลดฮวบลงไปอีกเนื่องจากสงครามกับเผ่าปีศาจ และถึงเวลาที่ต้องเปิดประตูประเทศเพื่อรักษาโครงสร้างของชาติเอาไว้แล้วก็ตาม\n\nโดยพื้นฐานแล้ว พวกเอลฟ์ก็เป็นพวกสารเลวอยู่ดี\n\n“ชมรมอาสาสมัครเหรอครับ?”\n“ใช่”\n“ผมเหรอครับ?”\n“อืม”\n“ทำไมล่ะครับ?”\nอีวานได้รับการอนุมัติจากท่านนักบุญหญิงและนักฆ่าแห่งปาร์ตี้ผู้กล้า ซึ่งเป็นคณบดีคณะเทววิทยาและอาจารย์คณะอัศวินตามลำดับเรียบร้อยแล้ว รวมถึงคณบดีคณะเวทมนตร์ด้วย แม้จะไม่ได้เป็นข้อบังคับ แต่อย่างน้อยก็พอจะเกลี้ยกล่อมให้พวกเขาเจียดเวลามาได้เพื่อรักษาหน้าตาของตนเอง\n\nทว่า แทนที่จะทำแบบนั้น อีวานกลับกำลังลูบด้ามขวานของตัวเองพลางครุ่นคิด มันคือสัจธรรมทางประวัติศาสตร์ที่แม้แต่จอมมารยังยอมรับว่า การฆ่าเอลฟ์สักตัวนั้นเร็วกว่าการไปเกลี้ยกล่อมมันเสียอีก\n\n“ลูกพี่ เดี๋ยวผมจัดการเรื่องนี้ให้เองครับ!”\nในตอนนั้นเอง ชายหนุ่มคนหนึ่งที่ยืนอยู่ข้างอีวานก็ผุดลุกขึ้นอย่างเดือดดาลแล้วตะโกนออกมา\n\nนี่คือเรื่องราวว่าทำไมจู่ๆ เขาถึงได้น้องชายมาหนึ่งคน\n\n“ผมเป็นคนเกาหลี และมันคงวิเศษมากเลยถ้าคุณก็เป็นคนเกาหลีเหมือนกันครับลูกพี่ การได้เจอคนจากบ้านเกิดเดียวกันเป็นประสบการณ์ที่น่าอภิรมย์เสมอ เพราะฉะนั้น จะมีเหตุผลอะไรให้พวกเราต้องรู้สึกกระอักกระอ่วนใจต่อกันล่ะครับ? พระคัมภีร์สอนไว้ว่าวาจามีพลังในการคลี่คลายปัญหาทุกอย่างในโลกได้ครับ”\nผู้ถูกสิงร่างที่เพิ่งถูกลักพาตัวมาจากเขตคณะเทววิทยา เริ่มพูดจ้อแบบนี้ทันทีที่ตั้งสติได้\n\nอีวานถึงกับผงะไปเล็กน้อย ไม่ใช่แค่เพราะหมอนี่ยอมเปิดเผยตัวตนง่ายดายเกินไปเท่านั้น แต่ยังเป็นเพราะหมอนี่พูดจาเก่งอย่างน่าประหลาดอีกด้วย\n\n“คุณชื่ออีวาน เปโตรวิช เหรอครับ? โอ้โห ขนาดชื่อยังเท่เลย ยูจีน ล่ะเป็นไงครับ? ในมุมมองคนเกาหลีมันออกเสียงยาก แถมยังจำน่ารำคาญด้วย อ้อ ทำไมจู่ๆ คุณถึงตกลงมาในโลกใบนี้ได้ล่ะครับ? อ้อ จะว่าไป คุณมาจากยุคหลังสตาลินหรือเปล่า? ความจริงแล้วสหภาพโซเวียตล่มสลายไปแล้วนะครับ”\nไอ้หมอนี่รัวคำถามออกมาเป็นชุดโดยที่ไม่มีใครถาม\n\nอีวานฟังคำพูดอันยืดยาวของยูจีนพลางลูบคาง แล้วจู่ๆ ก็หยุดชะงัก\n\n“นายรู้ได้ยังไงว่าฉันเป็นคนเกาหลี?”\n“โธ่ ก็คุณรู้อยู่แล้วว่าผมมีหน้าต่างสถานะใช่ไหมล่ะครับ? อันที่จริง แนวคิดเรื่องหน้าต่างสถานะมันแพร่หลายแค่ในเอเชียตะวันออกเฉียงเหนือเท่านั้นแหละ แผ่นข้อมูลตัวละครที่โผล่มาในตัวบทนิยายส่วนใหญ่ก็เห็นได้ในเว็บโนเวลเกาหลีกับไลท์โนเวลญี่ปุ่น! ในประเทศอื่นมันยังเป็นแนวคิดที่ไม่ค่อยคุ้นเคยเท่าไหร่ แม้ว่าหลังๆ จะเริ่มมีโผล่มาบ้างแล้วก็ตาม…”\n“แล้วยังไงต่อ?”\n“ประเทศเดียวที่ออกเสียงชื่อ ‘ยูจีน’ ได้ตรงตามเสียงอ่านเป๊ะๆ ก็มีแค่เกาหลีกับโลกที่พูดภาษาอังกฤษ! ดังนั้น ในเมื่อจุดร่วมเพียงอย่างเดียวคือเกาหลี ผมก็เลยลองเดาดูไงล่ะครับ! ฮิฮิฮิ”\nทั้งสามประเทศในเอเชียตะวันออกเฉียงเหนือล้วนอยู่ในเขตวัฒนธรรมตัวอักษรจีน ทว่ากฎการออกเสียงแตกต่างกัน นั่นหมายความว่าตัวอักษรจีนตัวเดียวกันสามารถอ่านออกเสียงต่างกันได้\n\nในญี่ปุ่น ชื่อนี้จะออกเสียงลากยาว ในจีนจะมีการผันวรรณยุกต์ วิธีเดียวที่จะออกเสียงชื่อ “ยูจีน” ออกมาตรงๆ แบบรวบรัดได้ก็คือในภาษาเกาหลี\n\n‘หมายความว่าหมอนี่วิเคราะห์ทั้งหมดนั่นได้ในระหว่างที่กำลังถูกลากตัวมางั้นเหรอ เป็นเพราะสัญชาตญาณเอาตัวรอดของมัน หรือเป็นเพราะความช่วยเหลือจากแถบสถานะกันแน่นะ?’\n\nต่อให้หักลบปัจจัยเหล่านั้นออกไปแล้วก็ตาม\n\n‘ไอ้หมอนี่มันมีความสามารถมากกว่าที่คิดไว้แฮะ…?’\n\nอีวานพยักหน้า\n\n“สรุปคือ นายบอกว่านายมองเห็นแถบสถานะสินะ?”\n“ใช่ครับ แน่นอน! คุณเองก็เห็นเหมือนกันใช่ไหม? โห ตอนที่มันโผล่ขึ้นมาตรงหน้าผมครั้งแรก ผมคิดเลยนะว่า ‘เอาล่ะ ชีวิตฉันกำลังจะเปลี่ยนไปแล้ว!’ แต่ไปๆ มาๆ มันไม่ให้อะไรผมเลย ไม่เอาอะไรไปจากผมด้วย แค่วางเควสต์ให้ดื้อๆ แล้วก็ยกเลิกไปเฉยๆ เจ้าสิ่งนี้ไม่ใช่หน้าต่างสถานะหรอกครับ แต่มันคือหอกเฮงซวยชัดๆ ของคุณเป็นแบบนั้นเหมือนกันไหมครับ?”\n“ฉันไม่มีของแบบนั้นหรอก”\n“คุณพระช่วย ผมอิจฉาคุณชะมัดเลยลูกพี่! ไม่รู้ว่าคุณจะเชื่อผมไหมนะ แต่ตลอดสี่ปีตั้งแต่ผมมาที่นี่ แถบสถานะไม่เคยช่วยอะไรผมเลยสักอย่าง! ให้ตายสิ เวลาผมพยายามจะทำอะไรสักอย่าง มันก็เอาแต่ขึ้นคำเตือนไม่หยุดเลย!”\nยูจีนเป็นคนช่างจ้อ ยิ่งกว่าคำว่ามีความสามารถเสียอีก\n\n“อ้อ ว่าแต่ ลูกพี่ใช้ชีวิตอยู่ที่นี่มากี่ปีแล้วเหรอครับ?”\n“สามสิบปี”\n“โอ้…”\nยูจีนถอนหายใจเฮือกเมื่อได้ยินคำพูดของอีวาน\n\nสามสิบปีโดยไม่มีแถบสถานะเลยงั้นเหรอ…? แถมช่วงเวลานั้นยังเป็นยุคก่อนสงครามจอมมารเสียด้วย…?\n\n“ขอถามหน่อยนะครับ ตอนที่คุณข้ามมาจากเกาหลี นั่นมันปีอะไรเหรอครับ?”\n“ปี 2021”\n“โอ้! ผมมาจากปี 2022! พี่ชาย นี่ระยะเวลาห่างกันหนึ่งปีในบ้านเกิดพวกเรา เท่ากับระยะเวลาห่างกันสามสิบปีที่นี่เลยเหรอครับ? งั้นตั้งแต่ผมมาที่นี่ก็ผ่านไปสี่ปีแล้ว… นี่ยังไม่ทันผ่านไปกี่เดือนเลยด้วยซ้ำ!”\n“มันคิดแบบนั้นยากนะ”\nในบรรดาเรื่องราวที่ท่านนักบุญหญิงเล่าให้เขาฟังเกี่ยวกับ “ผู้ถูกสิงร่างในอดีตอันไกลโพ้น” มีบางสิ่งที่ชวนให้นึกถึงวัตถุโบราณจากยุคสมัยใหม่อยู่ด้วย\n\nจึงเป็นเรื่องยากที่จะคิดว่าเวลาบนโลกกับในโลกใบนี้จะต้องแปรผันตามสัดส่วนกันเสมอไป บางทีคนจากอนาคตอาจจะถูกส่งมาสิงร่างในอดีตที่ห่างไกลยิ่งกว่าตัวเขาก็เป็นได้\n\nมันมีเกณฑ์แบบไหนกันนะ? เงื่อนไขของการถูกสิงร่างคืออะไรกันแน่?\n\n“อ้อ ว่าแต่ ก่อนจะข้ามมาคุณทำอาชีพอะไรเหรอครับ? ผมอยากรู้ว่าพวกเราสองคนมีอะไรเหมือนกันบ้างหรือเปล่าน่ะ”\n“ฉันเป็นนักศึกษามหาวิทยาลัย”\n“อ้อ ผมเป็นพนักงานออฟฟิศครับ งั้นก็ตามนี้เลย ผมแก่กว่า! ขอผมเรียกคุณว่า ‘พี่ชาย’ ได้ไหมครับ?”\n“…???”\nอีวานจ้องมองไอ้คนบ้าตรงหน้าด้วยปากที่ปิดสนิท\n\nยูจีนที่เพิ่งจะพูดจ้ออย่างออกรสชาติเกี่ยวกับเรื่องสัพเพเหระต่างๆ ตัวสั่นเทาขึ้นมาเมื่อสัมผัสได้ถึงสายตาของอีวาน เขารีบพูดต่อทันที\n\n“แต่เรื่องอายุมันไม่ได้สำคัญขนาดนั้นใช่ไหมล่ะครับ? ก็หมายถึงว่า ถ้านับรวมประสบการณ์บนโลกกับที่นี่ด้วย คุณก็อยู่มาเกิน 50 ปีแล้วนี่นา ใช่ไหมครับ? บนโลก 20 ปี ที่นี่อีก 30 ปี… แบบนั้นมันก็เหมาะสมที่จะเรียกว่าพี่ชายแล้วไม่ใช่เหรอครับ?”\n“…”\nอีวานครุ่นคิดอยู่ครู่หนึ่ง\n\nตัวเขาเองก็ไม่เคยคิดลึกซึ้งเรื่องอายุของตัวเองมาก่อน\n\nแต่ยังไงซะ แบบนั้นมันก็ดูไม่ค่อยถูกเท่าไหร่นะ\n\n“เอ่อ… เอาเถอะ! อืม! ผมเรียกคุณว่า ‘พี่ชาย’ ได้ไหมครับ?”\nบ้าเอ๊ย\n\nอีวานสบถด่าปากตัวเองในใจและถอนหายใจให้กับความเงียบอันแสนกระอักกระอ่วนนี้\n\nทำไมหมอนี่ถึงพูดอะไรแบบนั้นออกมา? มันเสียสติไปแล้วหรือไง?\n\nอีวานมองดูยูจีนพลางครุ่นคิด\n\nไอ้หมอนี่ก็น่าสนใจดีเหมือนกัน\n\nมันมีพรสวรรค์ด้านเพลงดาบ มากพอที่จะใช้ทักษะตรวจจับมุมอับสายตาได้ แถมยังลงเรียนหลักสูตรปกติของคณะเทววิทยา มีแถบสถานะ แล้วก็พูดจาเก่ง…\n\nมันน่าจะมีประโยชน์ อย่างน้อยก็มากกว่าดมิทรี\n\n“ถ้าไม่ได้ งั้นก็ไม่มีทางเลือกอื่นแล้วครับ! แทนที่จะเรียกว่า ‘พี่ชาย’ ให้ผมเรียกว่า ‘ลูกพี่’ เฉยๆ ดีไหมครับ? แบบนั้นคุณน่าจะสบายใจกว่าหรือเปล่า?”\n\n“ก็ตามใจนาย”\n\n“…ครับ ลูกพี่!”\n\nอีวานพยักหน้าขณะมองดูยูจีนที่กำลังหัวเราะราวกับนักต้มตุ๋น\n\n“มาสร้างสายสัมพันธ์ฉันพี่น้องที่แน่นแฟ้นกันเถอะ”\n\nในจุดนั้น ตอนที่เขาวิเคราะห์ประวัติของนักศึกษาทุกคนในมหาวิทยาลัยเซนต์ยานสก์ มีผู้ต้องสงสัยว่าเป็นผู้ถูกสิงร่างอยู่ทั้งหมดสามคน ยูจีน ยูริ และเอลฟ์ที่ชื่อออสวัลด์\n\nมีความเป็นไปได้ที่ว่าจะมีเพียงไอ้หมอนี่คนเดียวที่เป็นผู้ถูกสิงร่าง ส่วนคนอื่นๆ อาจจะเป็นแค่คนธรรมดาของโลกใบนี้ที่โชคร้ายมาติดอยู่ในรายชื่อผู้ต้องสงสัย\n\nทว่า การตรวจสอบให้แน่ชัดย่อมดีที่สุดเสมอ ไม่มีปัญหาอะไรอยู่แล้วตราบใดที่ท่านนักบุญหญิงอนุมัติ\n\nหากพวกเราสามารถรวบรวมผู้ที่น่าจะเป็นผู้ถูกสิงร่างทั้งหมดมาไว้ด้วยกัน จากนั้นก็คัดกรองให้แคบลง และวิเคราะห์จุดร่วมของพวกเขา\n\n‘เรื่องราวของฉันคืออะไร? เรื่องราวที่ยังหลงเหลืออยู่ในโลกใบนี้คืออะไร?’\n\nอย่างน้อยก็น่าจะพออนุมานจุดร่วมบางอย่างออกมาได้บ้าง\n\nตัวอย่างเช่น เงื่อนไขในการถูกสิงร่าง จุดร่วมของการสิงร่าง และการมีอยู่ของ ‘ฉากจบ’\n\nเนื่องจากผลการทดลองจะรับประกันผลลัพธ์ที่มีความหมายได้ก็ต่อเมื่อกลุ่มตัวอย่างควบคุมมีขนาดใหญ่เท่านั้น\n\n“ครับ ลูกพี่! ปล่อยให้เป็นหน้าที่ผมเองได้เลยครับ!!”\n\n***\n\nอิซาเบลล์ ยูริ และเอซิดิส พากันมานั่งกินข้าวด้วยกันทุกวันนับตั้งแต่เปิดภาคเรียน\n\nนี่คือผลลัพธ์จากผลประโยชน์ที่ขัดแย้งกันหลายประการ\n\nคนแรก อิซาเบลล์ เธอให้ความสนใจกับสายตาของผู้คนรอบข้างโดยสัญชาตญาณ มันเป็นทักษะที่เธอได้รับมาหลังจากใช้ชีวิตในพระราชวังมาอย่างยาวนาน เธอสามารถรับรู้ถึง “ความหน้าไหว้หลังหลอก” ของผู้อื่นได้\n\nเป็นที่รู้กันดีเกินไปว่าเธอคือลูกสาวของผู้กล้า ดังนั้นใครก็ตามที่เข้าหาเธอย่อมต้องตระหนักถึงภูมิหลังของเธอ นั่นเป็นหนึ่งในสิ่งที่อิซาเบลล์เกลียดที่สุด เธอจึงกลายเป็นคนนอกคอกโดยสมัครใจ\n\nในทางกลับกัน กรณีของเอซิดิสนั้นแตกต่างออกไปเล็กน้อย อย่างที่เธอเคยระลึกได้ เธอกำลังเข้าเรียนมหาวิทยาลัยพร้อมกับท่านลุงของตัวเอง\n\nในฐานะนักศึกษาปีหนึ่ง เธอบอบบางเกินกว่าจะสร้างมิตรภาพกับเอซิดิสผู้ถูกจับตามองอย่างใกล้ชิดโดยคุณลุงกล้ามโตได้โดยง่าย ดังนั้นเธอจึงกลายเป็นคนนอกคอกโดยไม่ได้ตั้งใจ\n\nสำหรับยูริ ไม่จำเป็นต้องพูดอะไรให้มากความอีก เธอเป็นเด็กกำพร้า และถึงแม้ยุคสมัยจะดีขึ้นแล้ว แต่คนส่วนใหญ่ที่มีกำลังจ่ายค่าเล่าเรียนมหาวิทยาลัยได้โดยธรรมชาติก็ยังคงเป็นพวกขุนนางอยู่ดี\n\nเธอเป็นคนที่ไปขูดขีดศักดิ์ศรีของพวกขุนนางด้วยฝีมือของตัวเอง ซึ่งล้ำหน้าพวกขุนนางไปไกลโข ทั้งที่เป็นเพียงเด็กกำพร้าสงคราม ดังนั้น เธอจึงกลายเป็นคนนอกคอกไปด้วยเช่นกัน\n\nในขณะที่เด็กขี้เหงาทั้งสามคนกำลังปลอบประโลมบาดแผลของกันและกันและเขียนบทละครวัยรุ่นมัธยมปลายร่วมกันอยู่นั้น\n\n“เฮ้! คุณลุง!”\n\nอิซาเบลล์วางแซนด์วิชที่กำลังกินอยู่ลงแล้วโบกมืออย่างร่าเริงให้กับอะไรบางอย่าง\n\nยูริที่กำลังกินแซนด์วิชอยู่ด้วยกันพลันหันศีรษะไปมองและทำแซนด์วิชหลุดมือร่วงลงพื้นดังตุบ\n\nคนสวนที่มีผ้าขนหนูพาดคอเดินตรงดิ่งเข้ามาหาเธอ\n\n‘นี่เพิ่มตัวละคร ‘โกลด์ซัน’ เข้ามาด้วยเรอะ…?!’\n\nพร้อมกับขุนนางหนุ่มคนหนึ่งที่กำลังหัวเราะราวกับตัวร้ายอยู่ข้างกายเขา"

      "title": "บทที่ 28",
      "content": "ยูจีนกำลังสิ้นหวัง เขาพูดจ้อไม่หยุดปากเพื่อพิสูจน์คุณค่าของตนเอง\n\n“คนนั้นล่ะ?”\n“ลิลี ดาวเนอร์ ครับ! นักศึกษาปีสอง คณะอัศวิน เลเวล 32 ก็แค่ระดับธรรมดาครับลูกพี่!”\n“งั้นคนนั้นล่ะ?”\n“ใครครับ? อ๋อ คนผมดำนั่นเหรอ? มารี ฟิลลิปสัน ปีสองคณะอัศวินเหมือนกัน! เลเวล 29 ดูท่าทางจะไม่ค่อยเก่งเรื่องเรียนเท่าไหร่ครับ!”\nอีวานมองยูจีนด้วยสายตาที่เปลี่ยนไป\n\nเพื่อตามหาผู้กลับชาติมาเกิด อีวานเคยกวาดสายตาอ่านประวัติของนักศึกษาปริญญาตรีทุกคนในมหาวิทยาลัยเซนต์ยานสก์มาแล้วครั้งหนึ่ง เขาไม่อาจจำได้ทั้งหมด แต่เขาก็เก่งเรื่องการจดจำข้อมูลส่วนบุคคลอันเป็นผลมาจากอาชีพในหน่วยเก็บกวาดอันยาวนาน\n\nตอนนี้ อีวานตระหนักแล้วว่าความแม่นยำของไอ้หมอนี่เกือบจะ 100% เลยทีเดียว\n\n‘หน้าประวัติข้อมูลเดินได้งั้นเหรอ…?’\n\nในขณะนี้อีวานและยูจีนกำลังเดินลัดเลาะไปทั่ววิทยาเขต พื้นที่มหาวิทยาลัยซึ่งกำลังคึกคักเต็มที่เนืองแน่นไปด้วยนักศึกษา\n\nเนื่องจากมีกลุ่มตัวอย่างทดลองมากพอ อีวานจึงสามารถเรียนรู้เพิ่มเติมเกี่ยวกับประสิทธิภาพของหน้าต่างสถานะของยูจีนได้\n\n‘มันช่วยจัดระเบียบสิ่งที่สามารถรับรู้ได้’\n\nไอ้หมอนี่เปรียบเสมือนฐานข้อมูลที่มีข้อจำกัดในการเข้าถึง\n\nมันจะแสดงข้อมูลที่ยูจีนสามารถรู้และเข้าถึงได้ในขณะนั้น อย่างเช่น เลเวล ชื่อ และฉายาของอีกฝ่าย\n\nข้อมูลที่ละเอียดลึกซึ้งยิ่งขึ้นจำเป็นต้องอาศัย “ความเข้าใจ” ในตัวเป้าหมาย ซึ่งหมายความว่ายิ่งสนิทสนมกันมากเท่าไหร่ ก็ยิ่งสามารถล้วงข้อมูลประวัติที่ละเอียดมากขึ้นได้เท่านั้น\n\nกล่าวอีกนัยหนึ่ง ไอ้หมอนี่มัน…\n\n‘หมอนี่เกิดมาเพื่อเป็นสายลับชัดๆ เลยไม่ใช่หรือไง…?’\n\nชาติตระกูลของเขายอดเยี่ยมไร้ที่ติ บุตรชายของท่านดยุก เป็นบุคคลที่สามารถเดินทางไปยังประเทศใดก็ได้ภายในสหราชอาณาจักรโดยไร้ปัญหา\n\nยิ่งไปกว่านั้น หากเงื่อนไขที่จำเป็นในการล่วงรู้ข้อมูลขั้นสูงของอีกฝ่ายเป็นเพียงแค่ “ความสนิทสนม” มันก็ยิ่งง่ายดายเข้าไปใหญ่ นั่นหมายความว่าสามารถหาข้อมูลได้เพียงแค่ก้าวเข้าสู่วงสังคม โดยไม่ต้องพยายามทำปฏิบัติการข่าวกรองเลยด้วยซ้ำ\n\nนอกจากนี้ ยังมีวิธีใช้งานหน้าต่างสถานะที่มี “ข้อจำกัดการเข้าถึงข้อมูล” นี้อีกอย่างหนึ่ง\n\nหน้าต่างสถานะของไอ้หมอนี่จะไม่รับรู้ข้อมูลที่เขาไม่อาจเข้าถึงได้\n\nกล่าวอีกนัยหนึ่ง หากมองกลับด้านกัน\n\nข้อมูลที่ไอ้หมอนี่ไม่สามารถรับรู้ได้ หมายความว่านั่นคือเป้าหมายที่ไม่สามารถหยั่งถึงได้ในระดับนักศึกษา แล้วในมหาวิทยาลัยเซนต์ยานสก์มีสักกี่คนกันเชียวที่บุตรชายของดยุกไม่สามารถรับรู้ข้อมูลได้?\n\nดังนั้น ไอ้หมอนี่ก็คือ….\n\n“หมอนี่เชี่ยวชาญเฉพาะทางด้านการตรวจจับสายลับ โดยจำกัดวงอยู่ในรั้วโรงเรียนสินะ”\n\nหลังจากล่วงรู้เรื่องนี้ อีวานก็พายูจีนเดินตรวจตราไปทั่วทั้งมหาวิทยาลัย ผลลัพธ์ที่ได้คือ เขาพบว่ามีคนราวเจ็ดคนที่มีชื่อไม่ตรงกับเอกสารการรับเข้าเรียน\n\n‘เลเวลไม่สูงเกินไปก็มองไม่เห็น ชื่อแตกต่างออกไป และตำแหน่งก็ไม่ปรากฏให้เห็นเลยสักนิด’\n\n‘ดี’\n\nอีวานคิดขณะก้าวเดิน มันน้อยกว่าที่เขาคาดการณ์ไว้เสียอีก\n\nมีคนอยู่สามกลุ่มหลักๆ ที่สามารถส่งคนเข้ามาแทรกซึมในมหาวิทยาลัยเซนต์ยานสก์ได้\n\nฝ่ายมกุฎราชกุมาร สายลับจากประเทศพันธมิตรในสหราชอาณาจักร หรือไม่ก็พวกปีศาจ\n\nทั้งสามกลุ่มย่อมแทรกซึมเข้ามาด้วยวัตถุประสงค์ของตนเอง ดังนั้นเจ็ดคนที่ถูกเปิดเผยออกมาจึงไม่นับว่าเป็นจำนวนที่มากเลย แค่ประเทศในสหราชอาณาจักรก็มีตั้ง 10 ประเทศแล้วไม่ใช่หรือ?\n\n“พวกมันฝังสายลับไว้แม้กระทั่งในหมู่นักศึกษาธรรมดา”\n\nไม่ว่าพวกนั้นจะถูกเลี้ยงดูให้เป็นสายลับมาตั้งแต่เด็ก หรือถูกส่งตัวเข้ามาโดยที่เจ้าตัวไม่ทันรู้ตัวด้วยซ้ำว่าตนเองเป็นสายลับรัฐบาล\n\nหากตัดบางประเทศเหล่านั้นออกไป….\n\n“พวกที่มีเลเวลสูงเกินไป มีแนวโน้มสูงที่จะเป็นผู้สมรู้ร่วมคิดกับปีศาจ”\n\nบุคคลที่ถูกจัดอยู่ในประเภท “ผู้แข็งแกร่ง” ในหมู่แกนนำของฝ่ายมกุฎราชกุมาร ต่างก็ถูกกองบัญชาการต่อต้านข่าวกรองจับตาดูอยู่แล้ว\n\nด้วยไหวพริบและความสามารถขององค์หญิงเอลิซาเวตา ฝ่ายมกุฎราชกุมารไม่มีทางบ่มเพาะยอดฝีมือขึ้นมาอย่างลับๆ ได้แน่นอน\n\n“เอ่อ… อืม ลูกพี่ครับ แต่ชื่อจริงของเธอคือยูริจริงๆ นะ? ยูริ แฟรงก์ ถูกต้องเลยครับ”\n“นั่นไม่ใช่ปัญหา นายเองก็บอกไม่ใช่เหรอว่าชื่อฉันขึ้นว่าอีวานน่ะ”\n“อ้อ จริงด้วยครับ งั้นพวกเราจะหาคำตอบยังไงดีล่ะครับ?”\n“การเกลี้ยกล่อม”\nอีวานพยักหน้าแล้วเดินไปยังลานกลางของวิทยาเขต\n\nนักศึกษาหญิงสามคนกำลังเคี้ยวแซนด์วิชอยู่บนม้านั่งใต้ร่มไม้\n\n“อ้าว คุณลุง!”\n““อี๊!!””\nปฏิกิริยาที่แตกต่างกันอย่างสิ้นเชิงของนักศึกษาหญิงทั้งสองคน ความสงสัยของอีวานยิ่งทวีความรุนแรงขึ้น\n\nมีความเป็นไปได้สูงเช่นกันว่าเธออาจจะไม่ใช่ผู้ถูกสิงร่าง การสงสัยจากข้อมูลเรื่องชื่อเพียงอย่างเดียวนั้นเป็นเพียงการคาดเดาเท่านั้น\n\nทว่า ปฏิกิริยาของนักศึกษาคนนั้นน่าสงสัยอย่างเห็นได้ชัด\n\nเนื่องจากอีวานเป็นอดีตเจ้าหน้าที่ที่ได้รับการฝึกฝนมาอย่างโชกโชน เขาจึงเก่งกาจในการปลอมตัวให้ดูเป็นคนธรรมดามาก\n\nกล่าวอีกนัยหนึ่ง การมาหวาดกลัวรูปลักษณ์ของคนสวนที่ดูไม่มีพิษมีภัยและธรรมดาสามัญในสายตาทุกคน ย่อมเป็นเรื่องที่น่าสงสัยอย่างยิ่ง\n\n“อิซาเบลล์ ช่วงนี้เป็นยังไงบ้าง?”\n“อะฮ่าๆ พวกเราไม่ได้เจอกันนานขนาดนั้นเลยเหรอคะ? คาบเรียนแรกของเราเพิ่งจะผ่านไปเมื่อวานนี้เองนะ!”\n“อืม”\n“คุณลุงกินข้าวหรือยังคะ? ใครเป็นคนดูแลคุณลุงเนี่ย? อาหารโรงเรียนเรามันแย่สุดๆ ไปเลย แต่สนใจรับเจ้านี่สักหน่อยไหมคะ?”\n“อะ เอ่อ….”\nเอซิดิสครางออกมาเบาๆ ขณะที่อิซาเบลล์หยิบแซนด์วิชออกมาแล้วยื่นส่งให้อีวาน\n\nเมื่อรับแซนด์วิชจากมือของอิซาเบลล์มากัดกินคำหนึ่ง อีวานก็ยืนนิ่งอยู่ตรงหน้าพวกเธอ\n\n“อ้อ หนูลืมแนะนำไปหรือเปล่านะ? ขอแนะนำให้รู้จักกับ ยูริ แฟรงก์ ที่เรียนคณะอัศวิน และ เอซิดิส ที่กำลังเรียนสาขาดุริยางคศิลป์ค่ะ”\n\n“เอ่อ-อึก!!”\n“อะฮ่าๆ ใช่เลยค่ะ คุณลุง เดี๋ยว… อืม”\nอิซาเบลล์หรี่ตาลง จ้องมองยูจีนที่ยืนอยู่ข้างๆ อีวาน\n\nหมอนั่นเป็นหน้าใหม่ เขาเป็นใครกัน? หรือว่าจะเป็นสายลับรัฐบาลอีกคน?\n\n“พวกเราไปคุยกันเป็นการส่วนตัวหน่อยไหมคะ?”\n“ฮิ๊ย?! บ-เบลล่า! เดี๋ยวก่อนสิ!”\nอิซาเบลล์ปัดป้องความพยายามสุดพิลึกของยูริที่จะรั้งเธอไว้ แล้วเดินแยกตัวออกไปพร้อมกับอีวาน\n\nหลังจากเดินห่างออกมาจากกลุ่มแล้ว เธอก็เอ่ยขึ้น\n\n“หนูอยากจะคุยด้วยตั้งแต่หลังเลิกคาบแล้ว แต่คุณลุงก็หายตัวไปเฉยเลย สบายดีใช่ไหมคะ?”\n“หือ?”\n“ไม่สิ คุณลุงเป็นสายลับรัฐบาลใช่ไหมล่ะคะ? เรื่องนั้นมันต้องเป็นความลับระหว่างพวกเราไม่ใช่เหรอ?”\nอิซาเบลล์กวาดสายตามองรอบตัวอย่างจริงจังแล้วกระซิบ “นอกจากออกัสต์จากทิลเลสแล้ว หนูก็ไม่รู้หรอกว่าทางนั้นส่งใครมาอีก แต่พวกเขาน่าจะส่งมาเพิ่มอย่างน้อยอีกหนึ่งคนแน่ๆ แล้วทำไมคุณลุงถึงกล้าเปิดเผยตัวโต้งๆ ในสถานการณ์แบบนี้ล่ะคะ?”\n“เปิดเผย?”\n“ก็ฝีมือของคุณลุงไง! คุณลุง คุณเป็นสายลับใช่ไหมล่ะคะ!”\nอีวานเอียงศีรษะ ก้มลงมองอิซาเบลล์\n\nร่างเล็กกะทัดรัดที่สูงเพียงระดับอกของเขา กวาดตามองรอบข้างด้วยใบหน้าที่ก้มลงเล็กน้อย เอ่ยด้วยน้ำเสียงตึงเครียด\n\n“หนูไม่รู้หรอกนะคะว่ารัฐบาลคราซิลอฟกำลังซ่อนอะไรอยู่ที่นี่ แต่ในเมื่อหนูติดหนี้บุญคุณคุณลุงอยู่… เอาเถอะ ให้หนูช่วยสืบดูสักหน่อยเป็นไงคะ?”\n“ว่าไงนะ?”\n“อ้อ ใช่ สายลับที่ส่งมาจากทิลเลสไงคะ! หนูไม่รู้ว่าพวกนั้นปะปนอยู่ในกลุ่มนักศึกษาปีหนึ่งหรือเปล่า แต่เดี๋ยวหนูช่วยเช็กให้เอง!”\nอิซาเบลล์พยักหน้าอย่างหนักแน่นด้วยแววตาที่เปี่ยมด้วยความไว้วางใจ\n\nอีวานเลิกคิ้วขึ้นขณะมองดูเธอ\n\nทรยศต่อบ้านเกิดของตัวเองได้ง่ายดายขนาดนี้เลยเรอะ เธอขาดความรักชาติหรือไง?\n\nทว่า หลังจากครุ่นคิดอยู่ครู่หนึ่ง เขาก็ตระหนักได้ว่าตัวเขาเองก็ไม่เคยลงมือทำอะไรด้วยความรักชาติเช่นกัน เขาเพียงแค่เทิดทูนองค์กษัตริย์เป็นการส่วนตัวเท่านั้น\n\n“ไม่จำเป็นต้องทำแบบนั้นหรอก”\n“เอ๊ะ? นี่มันโอกาสทองเลยนะคะ ถ้าพลาดไปคุณลุงจะเสียใจเอานะ พอหนูเรียนจบจากที่นี่ หนูอาจจะได้ขึ้นไปดำรงตำแหน่งใหญ่โตในทิลเลสก็ได้ คุณลุงไม่ต้องการทรัพยากรบุคคลเหรอคะ? ทั้งที่คุณลุงเป็นถึงสายลับรัฐบาลแท้ๆ?”\n\nเด็กคนนี้มีความเข้าใจบิดเบี้ยวเกี่ยวกับคำว่า ‘สายลับ’ หรือเปล่าเนี่ย?\n\nเขารู้ดีว่าเธอเติบโตมาในพระราชวัง แต่ความประทับใจแรกกับความแตกต่างในความเป็นจริงมันช่างห่างไกลกันเหลือเกิน\n\nอีวานพยักหน้าด้วยสีหน้าเรียบเฉย\n\n“ถ้าเธออยากทำแบบนั้นก็ตามใจ”\n“…เฮ้อ ท่าทีของคุณลุงนี่แย่ชะมัดเลยค่ะ”\nอิซาเบลล์ส่ายหน้าแล้วจู่ๆ ก็เอ่ยถามขึ้น “จะว่าไปแล้ว พวกเขากำลังซ่อนอะไรอยู่ที่นี่กันแน่ พวกเอลฟ์ถึงได้ยังวนเวียนอยู่ไม่ยอมไปสักทีคะ?”\nเธอชี้มือขึ้นไปบนท้องฟ้า\n\nเวลาล่วงเลยมาเกินหนึ่งสัปดาห์แล้วนับตั้งแต่เปิดภาคเรียนใหม่ และประมาณหนึ่งเดือนนับตั้งแต่พิธีปฐมนิเทศ\n\nเรือรบของคาลีออนยังคงจอดลอยลำอยู่กลางน่านฟ้าเหนือมหาวิทยาลัยเซนต์ยานสก์\n\nในช่วงแรกนักศึกษาส่วนใหญ่ต่างสับสน ทว่าตอนนี้กลับมีปฏิกิริยาทำนองว่า “เอาเถอะ เอลฟ์ก็คงเป็นเอลฟ์อยู่วันยังค่ำ”\n\nแต่สำหรับอีวาน มันค่อนข้างน่าฉงนอยู่ไม่น้อย เรือลำนั้นคือเรือรบทางทหารของต่างชาติ แถมมหาวิทยาลัยเซนต์ยานสก์ยังตั้งอยู่ในเมืองหลวงเสียด้วย\n\nต่อให้มกุฎราชกุมารจะมีเจตนาอื่นแอบแฝง แต่เอลิซาเวตาไม่มีทางอนุญาตให้เกิดเรื่องแบบนี้ขึ้นเด็ดขาด ยิ่งไปกว่านั้น พระราชวังและเขตเมืองหลวงก็ควรจะอยู่ในขอบเขตอิทธิพลของเอลิซาเวตาไม่ใช่หรือ\n\n“เอาเถอะ ใครจะไปเข้าใจความคิดของพวกเอลฟ์กันล่ะ”\n\n***\n\n“เอาล่ะ เซอร์เวลเชสต์ รายงานของวันนี้เป็นอย่างไรบ้าง?”\n\n“ล้มเหลวพ่ะย่ะค่ะ ฝ่าบาท”\n\n“เข้าใจแล้ว วันนี้ก็ล้มเหลวอีกเช่นเคยสินะ”\n\nเออร์เนสต์พยักหน้าพร้อมรอยยิ้มบางๆ ที่แฝงความนัย\n\n“ทางรัฐบาลคราซิลอฟว่าอย่างไรบ้าง?”\n\n“พวกเขาเตือนว่าหากเราไม่ถอนกำลังภายในสามวัน พวกเขาจะยิงเราให้ร่วงพ่ะย่ะค่ะ”\n\n“พวกนั้นก็พูดแบบเดียวกันเมื่อสามวันก่อนนั่นแหละ ไม่ต้องไปใส่ใจ ทำหน้าที่ของเจ้าต่อไปเถอะ”\n\n“พ่ะย่ะค่ะ ฝ่าบาท”\n\nหลังจากส่งนายทหารฝ่ายเทคนิคออกไปแล้ว เออร์เนสต์ที่อยู่เพียงลำพังก็หยิบผ้าเช็ดหน้าออกมาซับเหงื่อเย็นที่ผุดพราย\n\n“ทำไมกันแน่…?”\n\nเรือรบทุกลำย่อมต้องผ่านการตรวจสอบทางเทคนิคอย่างละเอียดถี่ถ้วนก่อนออกเดินทาง “เกียรติภูมิแห่งบอยล์” ที่เขานำทัพมาก็ไม่ใช่ข้อยกเว้น\n\nแม้ว่านี่จะไม่ใช่การเคลื่อนพลเพื่อออกรบจริง เพียงแค่เป็นการแสดงแสนยานุภาพทางทหารเบาๆ โดยไม่ให้ถึงขั้นจุดชนวนความขัดแย้งทางการทูต มันจึงผ่านการตรวจสอบทางเทคนิคแค่ระดับบำรุงรักษาตามวงรอบเท่านั้น\n\nแต่ถึงกระนั้น นี่ก็คือเรือประจัญบานลอยฟ้าแห่งคาลีออน\n\nในระหว่างสงครามครั้งล่าสุด มันครองน่านฟ้าด้วยความน่าสะพรึงกลัว อาจมีปัญหาขัดข้องเล็กๆ น้อยๆ อยู่บ้าง ทว่าไม่เคยมีเหตุการณ์ใดที่ส่งผลกระทบต่อการเดินเรือมาก่อนเลย\n\nทันใดนั้น เสียงเคาะประตูก็ดังขึ้นจากด้านนอกห้องกัปตัน\n\n“ฝ่าบาท มีคนจากพระราชวังคราซิลอฟมาขอเข้าเฝ้าพ่ะย่ะค่ะ”\n\n“ข้าแจ้งไปแล้วว่าบ่ายนี้ข้ามีนัด บอกให้พวกเขากลับมาใหม่ตอนค่ำ”\n\n“ก-กระหม่อมก็อธิบายไปแบบนั้นแล้วพ่ะย่ะค่ะ แต่ว่า…”\n\nเสียงเอะอะโวยวายดังลอดมาจากด้านนอกประตู เสียงอันร้อนรนของนายทหาร “นี่เป็นสถานการณ์ที่ลำบากนะครับ” “นี่มันเป็นการละเมิดทางการทูต!”\n\nโดยธรรมชาติแล้วเอลฟ์มีประสาทรับฟังที่เฉียบไว โดยเฉพาะเมื่ออยู่ในที่ร่ม\n\nเสียงโลหะกระทบกันดังกริ๊ก เสียงฝีเท้าที่ก้องกังวานอย่างคมชัดบนดาดฟ้าเรือ\n\nเมื่อสัมผัสได้ว่าผู้ใดเดินทางมาถึง เออร์เนสต์ก็ถอนหายใจเฮือกใหญ่\n\n“เข้ามาได้”\n\n“เป็นไปตามที่ดิฉันตั้งใจไว้เป๊ะเลยนะคะ”\n\nโดยไร้ซึ่งมารยาท ประตูห้องกัปตันถูกเปิดผลัวะออกอย่างกะทันหัน และสตรีผู้สง่างามเจ้าของเรือนผมสีเงินก็ปรากฏกายขึ้น\n\nเอลิซาเวตา ผู้นำของเหล่าสิ่งมีชีวิตที่คล้ายคลึงกับลิงในประเทศนี้\n\nเออร์เนสต์กระแอมไอ พยายามควบคุมสีหน้าของตนเอง\n\n“ช่างไร้มารยาทเสียจริง เจ้าตระหนักหรือไม่ว่าเรือรบเปรียบเสมือนดินแดนของประเทศเจ้าของเรือ?”\n“แน่นอนค่ะ ดิฉันตระหนักดี นั่นแหละค่ะคือเหตุผลที่ดิฉันอดกลั้นไม่สั่งยิงมันให้ร่วงตอนที่มันรุกล้ำน่านฟ้าประเทศของดิฉันเข้ามา”\nเอลิซาเวตาเดินเข้ามาอย่างมั่นใจและนั่งลงตรงข้ามเออร์เนสต์ เครื่องแบบอันหรูหราของเธอเปล่งประกายระยิบระยับภายใต้แสงไฟภายในห้อง\n\nเมื่อเธอสะบัดมือที่สวมถุงมือ ชายหนุ่มที่ยืนอยู่ด้านหลังก็ก้าวเข้ามา เปิดกล่องสีดำ หยิบบุหรี่ส่งให้เธอ แล้วถอยกลับออกไปอย่างนอบน้อม\n\nก่อนที่ใครจะทันได้ตำหนิเรื่องการสูบบุหรี่ในห้องกัปตัน ดวงตาอันคมกริบของเอลิซาเวตาก็กะพริบวาว\n\n“เอาล่ะ บอกดิฉันมาสิคะ ดิฉันควรจะ… ไม่สิ ดิฉันควรจะปฏิบัติกับพวกคุณทุกคนยังไงดี?”\n“อะไรนะ…?”\n“จุดยืนอย่างเป็นทางการของรัฐบาลเราได้ถูกส่งไปแล้ว ‘สามวัน’ แต่นั่นไม่ใช่จุดยืนของดิฉัน พวกเอลฟ์ พวกคุณต้องเลือกมาอย่างใดอย่างหนึ่ง”\nเอลิซาเวตาสะบัดมือเบาๆ เพียงแค่ดีดนิ้ว บุหรี่ก็จุดติดไฟขึ้นมาพร้อมกับปฏิกิริยาทางเวทมนตร์\n\nฟู่… เฮ้อ\n\nท่ามกลางควันสีขาวที่ลอยอ้อยอิ่งขึ้นชั่วครู่ ดวงตาสีม่วงทอประกายวาวโรจน์ดุจสัตว์ร้าย\n\n“อย่างแรก อธิบายมาว่าพวกคุณกำลังวางแผนอะไรอยู่ แล้วค่อยขอความร่วมมือ”\n\n“แล้วถ้าพวกเราปฏิเสธล่ะ?”\n\n“ดิฉันจะส่งคนตัดไม้มาหาค่ะ”\n\nเมื่อควันบุหรี่จางลง ใบหน้าอันงดงามของเชื้อพระวงศ์ที่มาพร้อมรอยยิ้มอ่อนโยนก็ปรากฏขึ้น\n\nราวกับแรงกดดันเมื่อครู่นี้เป็นเรื่องโกหก เอลิซาเวตาแย้มยิ้มแล้วเอ่ยว่า “โชคดีนะคะ ที่เรือรบของพวกคุณไม่ได้ทำจากไม้”\n\n“ดูหมิ่นกันเกินไปแล้ว…!!”\nส่งคนตัดไม้มาหาเอลฟ์งั้นหรือ…? ไม่อาจมีการดูหมิ่นใดจะรุนแรงไปกว่านี้อีกแล้วภายใต้ขอบเขตของวาทศิลป์ทางการทูต\n\nเมื่อเออร์เนสต์บันดาลโทสะ เอลิซาเวตาก็เพียงยักไหล่แล้วลุกขึ้นยืน\n\n“ดูเหมือนจะเป็นการดูหมิ่นสินะคะ ดิฉันขอถือว่านั่นคือคำตอบก็แล้วกัน”\n“เจ้าคนเดียวไม่อาจเป็นตัวแทนเจตจำนงของราชวงศ์ได้ เจ้าคิดจริงๆ หรือว่าจะรอดตัวไปได้หลังทำเรื่องแบบนี้?”\nความขัดแย้งระหว่างมกุฎราชกุมารและองค์หญิงโด่งดังไปทั่วโลกอยู่แล้ว มันก้าวข้ามขอบเขตของการแย่งชิงอำนาจธรรมดาและใกล้จะปะทุเป็นสงครามกลางเมืองอยู่รอมร่อ\n\nท่ามกลางสถานการณ์เช่นนี้ การมาเปิดศึกเป็นศัตรูอย่างเปิดเผยกับมหาอำนาจแห่งสหราชอาณาจักรมันถูกต้องแล้วหรือ? หากคาลีออนไปเข้าข้างมกุฎราชกุมาร สถานะขององค์หญิงย่อมสั่นคลอนอย่างหนักแน่นอน\n\nเมื่อคำรามข่มขู่ด้วยเจตนาเช่นนั้น องค์หญิงกลับหัวเราะออกมาเบาๆ\n\n“ข่มขู่อัครมหาเสนาบดีถึงใจกลางเมืองหลวงพริตเชนคายา ช่างเป็นเรื่องตลกที่น่าขบขันดีนี่คะ ท่านกัปตัน”\n\n“เอลิซาเวตา…!”\n“และท่านกัปตัน จงจำเรื่องนี้ใส่ใจเอาไว้ให้ดี”\n\nขณะที่เอลิซาเวตาเปิดประตูห้องกัปตัน เธอก็ปรายตามองกลับมาชั่วครู่\n\nดวงตาสีม่วงที่ชวนให้นึกถึงนกล่าเหยื่อส่องประกายระยับ\n\n“ดิฉันนี่แหละค่ะ คือเจตจำนงของราชวงศ์ในอีกไม่ช้านี้”\n\n***\n\n“องค์หญิงพ่ะย่ะค่ะ รัฐมนตรีว่าการกระทรวงการต่างประเทศกำลังสอบถามเข้ามาอย่างเร่งด่วน”\n\n“ก็เห็นจะมีแต่คนเลือดราชวงศ์นั่นแหละที่ใจร้อนขนาดนั้น”\n\nเอลิซาเวตาเดินไปตามดาดฟ้าเรือพลางหัวเราะหึๆ\n\nไม่มีทางหลีกเลี่ยงสิ่งที่คาดการณ์ไว้ได้อยู่แล้ว นักเขียนคนนั้นของเธอ\n\n“ดำเนินการตามแผน เรียกตัววานก้ามา”\n\n“พระองค์จะทรงพบเขาด้วยพระองค์เองหรือพ่ะย่ะค่ะ?”\n\n“เซอร์เชอร์คาตอฟ ฉันไม่ได้บอกนายไปแล้วเหรอ? พวกเราต้องกลับมาพบกันในเวลาและสถานที่ที่เหมาะสมกว่านี้”\n\nไม่ใช่เรื่องโรแมนติกเสียหน่อย\n\nเอลิซาเวตาเดินเฉียดผ่านดมิทรีไปครั้งหนึ่งแล้วเปลี่ยนจังหวะก้าวเดินของตน"
    },

      "title": "บทที่ 29",
      "content": "“เจ้าวัตถุนั้นมันจะยอมเคลื่อนออกไปเมื่อไหร่กัน?”\n\n“เอ่อ ไม่แน่ชัดเหมือนกันว่าสภาองคมนตรีกำลังคิดอะไรอยู่”\n\n“เดี๋ยวก่อน ทำไมสภาองคมนตรีถึงมาเกี่ยวข้องกับเรื่องนี้ได้ล่ะ? มันอยู่ในเขตอำนาจของกองบัญชาการกองทัพเรือไม่ใช่หรือไง!”\n\nเหล่าเอลฟ์ที่เพิ่งเริ่มต้นชีวิตในรั้วสถาบันตามปกติต่างก็ตกอยู่ในภาวะสับสนอลหม่านในเวลานี้\n\nแม้แต่เอลฟ์ผู้มีความภาคภูมิใจในตนเองและรักชาติสูงส่งก็ยังมีขีดจำกัด พวกเขากำลังขบเขี้ยวเคี้ยวฟันอยู่ท่ามกลางความอับอายที่รู้สึกแทนชาติตนและการดูแคลนอย่างแยบยลของพวกมนุษย์\n\nในวันแรกที่เรือรบลอยลำอยู่เหนือศีรษะ เหล่านักศึกษาเอลฟ์ต่างพากันพูดอย่างภาคภูมิใจว่า:\n\n“ดูสิ พวกเราเจ๋งขนาดไหนที่สามารถเอาเรือรบมาลอยลำกลางเมืองหลวงของมนุษย์ได้โดยที่ทุกคนทำได้แค่ยืนมอง”\n\nผู้คนอันน่าทึ่งเหล่านี้ที่ส่งเรือรบมาร่วมพิธีปฐมนิเทศ เริ่มรู้สึกถึงความผิดปกติบางอย่างหลังจากเวลาผ่านไปหนึ่งสัปดาห์\n\n“อย่างไรก็ตาม ในเมื่อเรือรบไม่ได้มีความจำเป็นในตอนนี้ การปล่อยให้เรื่องดำเนินไปแบบนี้มันจะดีจริงๆ เหรอ?”\n\nนี่คือความหวาดกลัวที่ใกล้เคียงกับสัญชาตญาณการเอาตัวรอด\n\nท้ายที่สุดแล้ว การส่งอาวุธสงครามเข้ามาประจำการในเมืองหลวงของอีกประเทศหนึ่งถือเป็นการยั่วยุทางทหารครั้งมหึมา\n\nต่อให้ไม่น่าจะมีเรื่องอะไรเกิดขึ้น แต่พวกเขาก็จะพลันเปลี่ยนสถานะจากนักศึกษาเป็นเชลยศึกในทันทีหากเกิดสงครามขึ้นเพราะการยั่วยุทางทหารครั้งนั้น\n\nไม่มีอนุสัญญาเจนีวาในโลกแฟนตาซียุคก่อนสมัยใหม่ที่ล้าหลังแห่งนี้หรอกนะ\n\nแม้จะไม่มีกฎหมายที่อนุญาตให้ประหารชีวิตเชลยศึกอย่างเปิดเผยในข้อพิพาทชายแดนของสหราชอาณาจักร และคงไม่ถึงขั้นตัดศีรษะบุตรชายบุตรสาวของตระกูลขุนนาง ซึ่งบางคนก็มาศึกษาเล่าเรียนในต่างแดนก็ตาม\n\nแต่เรื่องนั้นเป็นสิ่งที่พูดได้เฉพาะในโลกที่ “สามัญสำนึก” ยังใช้การได้อยู่เท่านั้น\n\nดังนั้น เพียงแค่จินตนาการว่าอาณาจักรของมนุษย์ ซึ่งถูกมองว่าปราศจากสามัญสำนึก (ตามมุมมองของเอลฟ์) จะก่อความบ้าคลั่งแบบไหนขึ้นมาได้บ้าง ก็ทำให้สัญชาตญาณเอาตัวรอดของพวกเขากระตุกวาบแล้ว\n\nและในที่สุด หนึ่งสัปดาห์ต่อมา หลังจากผ่านไปสิบห้าวัน\n\nขณะที่ยังคงแหงนมองเรือประจัญบานลอยฟ้าอันน่าภาคภูมิใจของตนที่ลอยนิ่งอยู่บนท้องฟ้า เหล่าเอลฟ์ก็เผยลักษณะนิสัยประจำเผ่าพันธุ์ออกมาจนได้\n\nพวกเขาคือผู้บุกเบิกอารยธรรม การเมืองระบบรัฐสภา และระบอบประชาธิปไตยอันมีพระมหากษัตริย์ทรงเป็นประมุขภายใต้รัฐธรรมนูญ\n\nดังนั้น ตามลักษณะนิสัยประจำเผ่าพันธุ์ ในที่สุดพวกเขาก็จัดตั้งพรรคการเมืองขึ้นมา นั่นหมายความว่าความขัดแย้งระหว่างกลุ่มก๊วนได้เริ่มต้นขึ้นแล้ว\n\nบัดนี้เหล่านักศึกษาเอลฟ์ได้เปิดฉากสงครามกลางเมืองกันเอง โดยแบ่งออกเป็นฝ่ายสภาองคมนตรีกับฝ่ายกองบัญชาการกองทัพเรือ (สงครามกลางเมืองก็เป็นหนึ่งในลักษณะนิสัยประจำเผ่าพันธุ์ของพวกเขาเช่นกัน)\n\nแน่นอนว่าเรื่องนี้ไม่ได้ช่วยแก้ปัญหาเรื่องที่ว่าใครจะเป็นผู้กุมอำนาจราชบัลลังก์ ต่อให้พวกเขาเลือกตั้งประธานสภานักศึกษาปีหนึ่งขึ้นมาได้ เรือรบที่ยังใช้งานได้ดีลำนั้นก็คงไม่แล่นกลับบ้านพร้อมกล่าวคำว่า “ขอแสดงความยินดีด้วย” หรอกนะ\n\nเอาเถอะ\n\nข้างนอก มีสายตาดูแคลนและภัยคุกคามจากมนุษย์\n\nข้างใน มีกิจกรรมทางการเมืองอันแสนอบอุ่นของเหล่าเอลฟ์\n\nและเบื้องบน มีเรือรบลำนั้นที่ลอยนิ่งอยู่บนฟากฟ้าโดยไร้ซึ่งการติดต่อสื่อสารใดๆ\n\nในยุคสมัยอันโกลาหลที่ความสงบสุขกลายเป็นเรื่องตลกหยาบคายนี้\n\nคนสวนคนหนึ่งและขุนนางหนุ่มชาวมนุษย์คนหนึ่งได้เดินทางมาเยือนหอพักนักศึกษาเอลฟ์\n\nนี่คือเหตุการณ์ในวันถัดจากวันที่ดมิทรีส่งมอบ “คำสั่ง” ให้แก่อีวานอย่างระมัดระวัง\n\nขอย้อนเวลากลับไปเมื่อวันก่อนหน้า ซึ่งก็คือวันที่เอลิซาเวตาตัดสินใจจะบั่นคอกัปตันชาวเอลฟ์\n\nดมิทรีมุ่งหน้าไปยังสถานเลี้ยงเด็กกำพร้าที่เขาคอยคัดเลือกงบประมาณและกวาดเงินจากพระคลังหลวงมาหยอดใส่กระเป๋าหลังของตัวเองเป็นประจำทุกปี\n\nโดยพื้นฐานแล้วเอลิซาเวตาเป็นหญิงสาวขี้อาย (ความคิดเห็นส่วนตัวของเขา) ดังนั้นเรื่องนี้จึงถูกดำเนินการมาโดยตลอดโดยไม่ได้แจ้งให้อีวานทราบ\n\nกล่าวอีกนัยหนึ่ง ดมิทรีคือผู้สนับสนุนรายใหญ่ที่สุดของสถานเลี้ยงเด็กกำพร้าแห่งนี้มาจนถึงปัจจุบัน ภายใต้ชื่อ “สวัสดิการทหารผ่านศึก” และ “เงินช่วยเหลือสำหรับพันโทปลดประจำการที่ไม่อาจรับบำนาญทหารได้” แต่ช่างเถอะ ไม่ว่าอย่างไร มือที่ยื่นเงินให้ก็คือมือของเขานั่นแหละ\n\n“อ้อ เฮ้ สวัสดี เด็กๆ?”\n\n“…”\n\nดมิทรีเดินไปตามโถงทางเดินพร้อมรอยยิ้มเป็นมิตรบนใบหน้า มอบให้แก่นักเรียนสุดหลอนเหล่านี้ที่เดินไปมาอย่างเงียบกริบจนน่าสงสัย\n\nมันให้ความรู้สึกเหมือนกำลังเดินผ่านโถงทางเดินของทัณฑสถานปรับทัศนคติทางการเมืองแห่งกองบัญชาการต่อต้านข่าวกรอง ส่วนใหญ่ก็เพราะเหล่าผู้เฝ้าสังเกตการณ์ต่างจ้องมองมาอย่างเงียบเชียบจากมุมห้องโดยไม่ส่งเสียงเลยสักแอะเดียว\n\n“ผมไม่ได้ตั้งใจจะไปยุ่งกับงานอดิเรกส่วนตัวของรุ่นพี่ที่เคารพหรอกนะครับ แต่นี่มันไม่อยู่ในขอบข่ายที่สามารถตั้งข้อหากบฏต่อแผ่นดินได้เลยหรือไง?”\n\n“พี่ไปคิดวิธีรวบรวมเด็กกำพร้ามาฝึกเป็นสายลับภาคสนามแบบนี้ได้ยังไงกันเนี่ย?”\n\nดมิทรีเดินไปยังห้องผู้อำนวยการพลางลูบหลังคอที่ขนลุกซู่ของตนเอง\n\nซู่ ซ่า ดมิทรีเดินผ่านทหารชาวโดรอันที่กำลังส่งเสียงประหลาดขณะบิดผ้าที่ซัก จากนั้นก็เดินผ่านครูคนใหม่ที่กำลังถูกรุมประชาทัณฑ์โดยพวกเด็กๆ พลางสวมหมวกแปลกๆ แบบกลับหัว\n\n“รุ่นพี่ครับ อยู่ข้างในหรือเปล่า?”\n\n“วันนี้นายเดินเข้ามาทางประตูสินะ”\n\nเมื่อดมิทรีเปิดประตูห้องผู้อำนวยการเข้าไป เขาก็เห็นอีวานยังคงนั่งอยู่ท่ามกลางสภาพห้องที่ดูหดหู่อย่างน่าประหลาด อีวานกำลังไล่สายตาอ่านกองเอกสารด้วยแววตาเย็นชา\n\n“มีอะไร?”\n“เอ่อ คือว่า พวกเรามีแขกมาเหรอครับ?”\n“อ้าว เพื่อนของลูกพี่นี่เอง! ไม่ต้องสนใจผมหรอกครับ เชิญคุยธุระกันตามสบายเลย!”\n“…ลูกพี่…?”\nดูเหมือนว่ารุ่นพี่ของเขาจะได้น้องชายที่อายุห่างกันมากโขมาอย่างไม่คาดฝัน\n\nดมิทรีจ้องมองใบหน้าของชายหนุ่มอยู่นาน จากนั้นก็ดีดนิ้วเป๊าะ ปรากฏว่าเขาจำใบหน้านั้นได้\n\n“ท่านคารัมซินหรือเปล่าครับเนี่ย? ช่างน่าประหลาดใจที่น่ายินดีที่ได้พบท่านที่นี่นะครับ!”\n“ผมเป็นแค่นักศึกษาธรรมดาครับท่าน ถ้าจะกรุณาให้ผมขอทักท้วงสักนิด!”\nการที่ตัวป่วนชื่อกระฉ่อนจู่ๆ ก็ไปสมัครเข้าเรียนในคณะเทววิทยาท้องถิ่นเป็นหัวข้อสนทนาฮือฮาไปทั่วพริตเชนคายามาพักใหญ่แล้ว\n\nเขาคือบุตรชายคนเล็กของตระกูลดยุกคารัมซิน ซึ่งผลิตอดีตรัฐมนตรีว่าการกระทรวงกลาโหมมาแล้วหลายสมัย\n\nคนแบบนั้นมาเรียกรุ่นพี่ของพวกเราที่ไม่เคยสนใจเรื่องการเมืองเลยว่า “ลูกพี่” เนี่ยนะ…?\n\nดวงตาของดมิทรีทอประกายเฉียบคม และอีวานก็ทุบโต๊ะดังปัง\n\n“ยูจีน ออกไปข้างนอก”\n“ครับ ลูกพี่! ทำงานให้สบายนะครับ! ผมจะไปทำงานอาสาสมัครต่อ!”\n“ไปจับตาดูความคืบหน้างานซักผ้าของมอร์ดซะ”\n“ครับ ลูกพี่!”\nยูจีนเดินออกจากห้องผู้อำนวยการไปด้วยรอยยิ้มเจ้าเล่ห์บนใบหน้า ดมิทรีที่มองตามเขาไปด้วยสีหน้าว่างเปล่าเอียงศีรษะเล็กน้อย\n\n“รสนิยมของพี่ดูเปลี่ยนไปเยอะเลยนะครับรุ่นพี่ ปกติพี่ไม่ชอบคนจำพวกนั้นไม่ใช่เหรอครับ…?”\n“เด็กนั่นนิสัยดีเชื่อฟังคำสั่ง”\n“จะว่าไปแล้ว สีหน้าท่าทางของพี่ก็ดูดีขึ้นมานิดหน่อยนะครับรุ่นพี่ ต้องเป็นเพราะเอนริเก้แน่ๆ เลย”\nอีวานทุบโต๊ะทำงานดังตึง ยังไงหมอนี่ก็อารมณ์ร้อนเร็วเหมือนเดิม ดมิทรีหยิบจดหมายฉบับหนึ่งออกมาจากกระเป๋าเสื้อ\n\n“พันเอกคิริลลอฟนา…?”\n“พระองค์ทรงเป็นอัครมหาเสนาบดีแล้วครับ เอาเถอะ สถานการณ์มันซับซ้อนนิดหน่อย และมีแค่รุ่นพี่เท่านั้นที่ทำเรื่องนี้ได้”\nดมิทรียื่นจดหมายส่งให้แล้วเอนกายเหยียดยาวลงบนโซฟา\n\n“ทั้งที่ผมให้เงินพี่ไปตั้งเยอะแยะทุกปี ทำไมพี่ไม่ซื้อโซฟาที่มันแพงกว่านี้มาใช้บ้างล่ะครับ?”\nอีวานซึ่งเมินคำพูดของดมิทรีและก้มลงอ่านจดหมาย ขมวดคิ้วมุ่น\n\nนี่มันเรื่องใหญ่พอสมควรเลยนี่\n\n“นี่พูดจริงเหรอ?”\n“องค์หญิงของพวกเราจะเป็นคนประเภทที่เอาเรื่องแบบนี้มาล้อเล่นได้ยังไงล่ะครับ?”\nแทรกซึมเข้าไปในเรือรบคาลีออนที่ลอยลำอยู่เหนือมหาวิทยาลัยเซนต์ยานสก์ และข่มขู่กัปตันเรือ\n\nทว่า ในขณะเดียวกัน ต้องหลีกเลี่ยงการสูญเสียชีวิตของลูกเรือบนเรือรบลำนั้นโดยเด็ดขาด\n\n“ทำไม?”\n“อา เรื่องนี้มันซับซ้อนนิดหน่อยครับ”\nดมิทรีขมวดคิ้ว ควรจะเริ่มอธิบายเรื่องนี้จากตรงไหนดีนะ?\n\n“ตอนนี้ ดูเหมือนว่าเรือรบลำนั้นกำลังเกิดเหตุขัดข้องอยู่ ต่อให้ไอ้พวกบ้าพวกนั้นจะเสียสติแค่ไหน พวกมันก็ไม่มีเหตุผลที่จะต้องเอาแสนยานุภาพทางทหารมายั่วยุเมืองหลวงติดต่อกันเกินสองสัปดาห์หรอกครับ ไม่มีเหตุผลเลย”\n“แล้วไงต่อ?”\n“พวกเราจะวางแผนล่อลวงให้องค์ชายอเล็กซานเดอร์ติดกับ โดยอาศัยจังหวะเวลานี้ให้เป็นประโยชน์”\nดมิทรีค่อยๆ ยืดตัวตรงขึ้น ใบหน้าที่ปราศจากรอยยิ้ม ใบหน้าของพันโทแห่งแผนกตรวจสอบภายใน กองบัญชาการต่อต้านข่าวกรอง\n\n“ชาวคาลีออนรู้ดีว่าประเทศของเรากำลังวุ่นวาย และในระหว่างนั้น องค์หญิงของพวกเราก็เสด็จไป ‘ข่มขู่’ พวกนั้นด้วยพระองค์เอง”\n“หากเรือรบถูกคุกคามจริงๆ ในช่วงเวลานี้ กัปตันเรือจะต้องพยายามจับมือร่วมกับมกุฎราชกุมารอย่างแน่นอน”\nดมิทรียิ้มขมขื่นแล้วลุกขึ้นยืน\n\n“พวกเราจะยึดเรือรบคาลีออนลำนั้น เราจะประณามพวกเอลฟ์ที่บังอาจหันปากกระบอกปืนใหญ่เข้าใส่พระราชวังอันยิ่งใหญ่แห่งคราซิลอฟ จากนั้น เราจะประกาศว่ามกุฎราชกุมารสมคบคิดกับพวกมันและกำลังวางแผนก่อรัฐประหาร เราได้เตรียมการส่งจดหมายประท้วงอย่างเป็นทางการไปยังสภาองคมนตรีแห่งคาลีออนไว้เรียบร้อยแล้ว”\n“คาลีออนจะต้องพยายามปิดข่าวเหตุการณ์นี้ให้เป็นเพียงการกระทำนอกลู่นอกทางของกัปตันเพียงคนเดียว และเพื่อเป็นการแลกเปลี่ยน พวกมันจะ…”\n“พวกมันจะต้องอนุมัติคำร้องขอของเราในการนำเรือรบที่ ‘ได้รับความเสียหาย’ ไปจอดเทียบท่าบริเวณชานเมืองพริตเชนคายาเพื่อทำการ ‘ซ่อมแซม’”\n“เรือเหาะคือเครื่องจักรสงครามเพียงอย่างเดียวที่คาลีออนมี”\n“ทว่า เช่นเดียวกับเทคโนโลยีทุกแขนง ย่อมมีความเสี่ยงที่จะรั่วไหลอยู่เสมอ”\n“ดังนั้น พวกเราจะยึดเรือรบไว้ หลังจากยึดได้แล้ว เราจะพยายามทำวิศวกรรมย้อนกลับภายใต้ข้ออ้างในการซ่อมแซมเรือรบที่ ‘ได้รับความเสียหาย’”\n“ในมุมมองของคาลีออน นี่ไม่ใช่ความสูญเสียทั้งหมด หากพิจารณาจากต้นทุนและแรงงานที่ต้องใช้ในการสร้างเรือรบขนาดนั้น คราซิลอฟไม่มีวันรักษากองเรือที่เหนือกว่ากองทัพเรือของคาลีออนได้หรอก”\n“ทว่า คราซิลอฟต้องการเรือเหาะไม่กี่ลำนั้นอย่างยิ่งยวด คราซิลอฟซึ่งไม่มีท่าเรือถาวรที่ไม่เป็นน้ำแข็งต้องหยุดการค้าขายทางทะเลโดยสิ้นเชิงในช่วงฤดูหนาว”\n“หากปฏิบัติการนี้สำเร็จ องค์หญิงจะทรงได้รับอำนาจต่อรองมหาศาล”\n“แผนสมคบคิดเพียงครั้งเดียวไม่อาจโค่นล้มอเล็กซานเดอร์ได้ แต่อย่างน้อยมันก็จะบีบคั้นเขาด้วยแรงกดดันทางการเมืองมากพอที่จะทำให้เขาไม่อาจขยับตัวได้ไปอีกพักใหญ่”\n“นอกจากนี้ หากเราได้ ‘แบบแปลนเรือเหาะ’ มาครอง เราก็สามารถดึงกองทัพซึ่งแสดงท่าทีเป็นกลางท่ามกลางความขัดแย้งภายในระหว่างมกุฎราชกุมารกับองค์หญิงให้เข้ามาเคลื่อนไหวได้ โดยธรรมชาติแล้ว เครื่องจักรสงครามอันทรงพลังย่อมต้องตกไปอยู่กับกองทัพ”\n“ผลประโยชน์ อำนาจต่อรอง และการสนับสนุน”\n“พวกเรากำลังเล็งเป้าหมายทั้งสามอย่างพร้อมกันด้วยปฏิบัติการเพียงครั้งเดียว ต่อให้ไม่ได้ผลลัพธ์ที่ดีที่สุด ก็จะไม่มีผลเสียใดๆ เกิดขึ้นกับองค์หญิงทั้งสิ้น เดิมทีมันก็เป็นความผิดของพวกเอลฟ์เองไม่ใช่หรือที่เอาเรือรบมาจอดขวางหน้าพระราชวัง?”\nดมิทรียังคงหว่านล้อมอีวานต่อไป\n\n“ถ้าไม่มีพี่ เรื่องนี้ไม่มีทางเป็นไปได้ครับรุ่นพี่ สายลับทั้งหมดที่พวกเราขยับได้ถูกเปิดเผยตัวหมดแล้ว และมันยากเกินไปที่จะดำเนินปฏิบัติการด้วยพวกสายลับแฝงตัว”\nในขณะนี้ กองกำลังเดียวที่องค์หญิงทรงสามารถสั่งเคลื่อนพลได้ในพริตเชนคายาคือ กองบัญชาการต่อต้านข่าวกรอง\n\nเนื่องจากเอนริเก้ไม่ได้ทำตามคำสั่งของราชสำนัก ไพ่ที่แข็งแกร่งที่สุดขององค์หญิงจึงคืออีวาน\n\nคนตัดไม้, จอมเชือดเจ็ดราชามังกร, เพชฌฆาตแห่งมหาราชา\n\n“หากจัดการเรื่องนี้ได้เรียบร้อย พี่ก็ไม่ต้องมานั่งลำบากกับปฏิบัติการเดิมแล้วครับรุ่นพี่ ถ้ามกุฎราชกุมารกลายเป็นอัมพาตทางการเมืองไป ก็ไม่จำเป็นต้องคอยคุ้มครองแขกของมหาวิทยาลัยเซนต์ยานสก์อีก ถ้าพี่ต้องการค่าตอบแทนอื่นใด… อืม องค์หญิงตรัสให้ผมบอกพี่แบบนี้ครับ”\nดมิทรีลังเลอยู่ครู่หนึ่งก่อนจะเอ่ยขึ้นอย่างระมัดระวัง\n\n“‘ฉันจะจัดเตรียมตำแหน่งในราชสำนักให้…’ หรืออะไรทำนองนั้นน่ะครับ”\n“ฉันจะทำเป็นไม่ได้ยินก็แล้วกัน”\n“เอ่อ… ครับ ผมคิดว่าองค์หญิงคงจะทรงเสียพระทัยนะครับ”\n“ฝากไปกราบทูลพระองค์ด้วย บอกว่าพระองค์กำลังทอดพระเนตรสูงขึ้นไปบนฟ้าเกินไปแล้ว”\nอีวานกล่าวพลางลุกขึ้นยืน\n\n***\n\n“มีอะไรเปลี่ยนแปลงบ้างไหม?”\n“มีครับลูกพี่! ข้อความใน [หน้าต่างเควสต์] เปลี่ยนไปแล้ว!”\nอีวานพยักหน้ารับคำพูดของยูจีน\n\nหลังจากดมิทรีกลับไปแล้ว ยูจีนก็เดินกลับเข้ามาในห้องผู้อำนวยการ รีบจดข้อความหน้าต่างเควสต์ที่เปลี่ยนแปลงไปแล้วยื่นส่งให้\n\n[“เควสต์ต่อเนื่องระดับ B” อุบายวังหลวงคราซิลอฟ]\n\n[องค์หญิงทรงต้องการยึดครองพระราชวังด้วยการกุมจุดอ่อนของมกุฎราชกุมาร บัดนี้ ชะตากรรมของราชวงศ์คราซิลอฟขึ้นอยู่กับการตัดสินใจของคุณแล้ว!]\n\n[เป้าหมาย: พิสูจน์การสมรู้ร่วมคิดระหว่างกัปตันเรือเหาะคาลีออนกับมกุฎราชกุมาร ตามคำสั่งขององค์หญิง]\n\n[เป้าหมายทางเลือก: ลูกเรือของเรือเหาะทุกคนรอดชีวิต]\n\n[เป้าหมายทางเลือก: ยึดเรือเหาะ]\n\n[เป้าหมายทางเลือก: รายงานความจริงของแผนสมคบคิดต่อมกุฎราชกุมารอเล็กซานเดอร์ และดำเนินสู่เควสต์ต่อเนื่องถัดไป]\n\n[รางวัลเป้าหมาย: ????]\n\n[บทลงโทษหากล้มเหลว: ????]\n\nหลังจากอ่านบันทึกช่วยจำจบ อีวานก็พยักหน้า\n\n“นายต้องมากับฉันในปฏิบัติการครั้งนี้”\n“…ผมเหรอครับ? ผมต้องไปด้วยเหรอ?”\n“พวกเราต้องตรวจสอบให้แน่ชัดว่ารางวัลความสำเร็จเป็นยังไง และเควสต์มันดำเนินไปแบบไหน”\n“เควสต์” นี้โดยทั่วไปจะแสดงรายการขึ้นมาก่อนที่ “เหตุการณ์” จะเกิดขึ้น\n\nแน่นอนว่ามันเป็นเรื่องธรรมดาอยู่แล้ว เป็นไปไม่ได้ที่จะโยนเควสต์มาให้สำหรับเหตุการณ์ที่จบลงไปแล้ว\n\nดังนั้น เควสต์จึงทำหน้าที่เสมือนสัญญาณเตือนภัยล่วงหน้าว่ากำลังจะเกิดอะไรขึ้น\n\nอันที่จริง เควสต์ที่ปรากฏขึ้นก่อนที่ดมิทรีจะมาเยือนก็คือ [อุบายในราชสำนัก] มันเป็นเควสต์ประเภทที่ให้คุณสืบหาแผนสมคบคิดที่เกี่ยวข้องกับเรือเหาะ และดำเนินภารกิจต่อไปในฝั่งขององค์หญิงหรือมกุฎราชกุมาร\n\nกล่าวอีกนัยหนึ่ง มันคือเควสต์ “เลือกฝ่าย”\n\nแม้ว่าการเลือกฝ่ายจะยังไม่เสร็จสมบูรณ์ แต่เนื้อหาของเควสต์ก็เปลี่ยนไปทันทีที่ฉันได้ยินแผนการขององค์หญิง ในรูปแบบของแผนสมคบคิดและการแจ้งเบาะแส\n\nสัญญาณเตือนภัยล่วงหน้าแบบเรียลไทม์ มันเป็นทรัพยากรที่มีประโยชน์มากทีเดียว\n\nอีวานมองดูยูจีนที่นับวันยิ่งมีคุณค่ามากขึ้นเรื่อยๆ พลางครุ่นคิด\n\n‘ผู้ถูกสิงร่างที่ฉันรู้จักมีเพียงจอมมาร ผู้กล้า และตัวฉันเอง’\n\nจุดร่วมของทั้งสามคนก็คือการที่ต่างก็เป็นตัวตนที่ก้าวไปถึงจุดสูงสุดในแขนงของตนเอง\n\nและหากพิจารณาว่าไอ้หมอนี่ แม้จะยังอ่อนหัดอยู่บ้าง แต่ก็มีศักยภาพที่จะทำเช่นนั้นได้เหมือนกัน\n\n‘ก็มีความเป็นไปได้ที่ผู้ถูกสิงร่างคนอื่นๆ จะเป็นแบบเดียวกัน’\n\nพวกเขามีความสามารถแบบไหนกัน?\n\nพวกเขาถือครองเรื่องราวแบบไหนเอาไว้?\n\nและพวกเขาจะต้องเผชิญหน้ากับจุดจบแบบไหน?\n\nณ ปลายทางของจุดจบนั้น พวกเขาจะได้เห็นรายชื่อทีมงานท้ายเรื่อง (Ending Credits) ในรูปแบบใด?\n\nจอมมารตายไปแล้ว ผู้กล้าหายตัวไปแล้ว และฉันยังคงอยู่ที่นี่\n\nแล้วผู้ถูกสิงร่างคนอื่นๆ ล่ะ? หากพวกเขาจบเรื่องราวของตนเองลง พวกเขาจะตายไหม? พวกเขาจะหายตัวไปไหม? หรือว่าพวกเขาจะยังคงอยู่ต่อไป?\n\nมีอะไรให้ต้องสืบหาอีกมากมาย มีวิธีการหาคำตอบที่แน่นอน และมีเหตุผลที่ต้องล่วงรู้\n\n“ฉันจะไปเกลี้ยกล่อมออสวัลด์ที่เป็นเอลฟ์กับยูริในตอนเช้าวันพรุ่งนี้ แล้วปฏิบัติการจะเริ่มขึ้นในคืนพรุ่งนี้”\n\n“แล้วตอนนั้นผมต้องทำอะไรครับลูกพี่?”\n\n“คอยสนับสนุนฉัน”\n\nไอ้หมอนี่จำเป็นต้องได้รับการฝึกฝนให้เป็นสายลับ อีวานพยักหน้าพร้อมความคิดนั้น"

      "id": "เล่ม 1/ch030_th",
      "title": "บทที่ 30",
      "content": "ออสวัลด์เป็นนักศึกษาปีหนึ่งของคณะเวทมนตร์ ซึ่งเป็นเรื่องปกติสำหรับเอลฟ์ส่วนใหญ่\n\nตามสัดส่วนการกระจายตัวของเผ่าพันธุ์ในมหาวิทยาลัยเซนต์ยานสก์ เอลฟ์ส่วนใหญ่มักกระจุกตัวอยู่ในคณะเวทมนตร์และวิทยาลัยดุริยางคศิลป์ คงเป็นเพราะนิสัยประจำเผ่าพันธุ์ที่เกียจคร้านและชอบหลีกเลี่ยงการออกแรงทางกายภาพนั่นเอง\n\nเช้าวันหนึ่งในระหว่างคาบเรียน อีวานและยูจีนเดินมุ่งหน้าไปยังคณะเวทมนตร์\n\n“ลูกพี่ครับ ผมลองคิดดูแล้วนะ” ยูจีนเอ่ยขึ้น\n\n“หือ?”\n“มันแปลกนะครับที่โลกใบนี้ไม่มีพาลาดินเลยน่ะ?”\nดูเหมือนไอ้หมอนี่จะเลิกปิดบังความจริงที่ว่าตัวเองเป็นผู้ข้ามมิติไปเสียแล้ว\n\n“ก็นะ ทั้งลูกพี่กับผมต่างก็อยู่ในโลกที่ต่างไปจากต้นฉบับ” เขาว่าต่อ “ถ้าในโลกนี้มีเทพเจ้า เวทมนตร์ศักดิ์สิทธิ์ และอัศวิน งั้นก็น่าจะมีพาลาดินเป็นของคู่กันโดยปริยายใช่ไหมล่ะครับ?”\n“ทำไมนักบวชถึงต้องพกอาวุธด้วยล่ะ?” อีวานถามกลับ\n\nอีวานรู้ดีว่าตำแหน่งของพาลาดินนั้นใกล้เคียงกับเรื่องแต่งแนวแฟนตาซี\n\nบนโลก พาลาดินคือกรณีที่อัศวินต่อสู้เพื่อความเชื่อทางศาสนาในช่วงสงครามครูเสด ดังนั้นในทางเทคนิคพวกเขาจึงไม่ใช่นักบวช (แถมยังเป็นพวกยึดติดทางโลกมากเสียด้วย)\n\nไม่ใช่เรื่องแปลกที่นักบวชที่บวชแล้วจะทำหน้าที่เป็นอัศวินด้วย แต่ในกรณีนั้น ก็ไม่อาจเรียกพวกเขาว่าอัศวินได้ พวกเขาเป็นเพียงนักบวชติดอาวุธเท่านั้น\n\nโลกใบนี้ก็ไม่ได้แตกต่างกัน นักบวชในโลกยุคก่อนสมัยใหม่นี้โดยพื้นฐานแล้วคือชนชั้นหัวกะทิที่น่าทึ่ง พวกเขาต้องมีความรู้กว้างขวางเทียบได้กับทนายความในยุคปัจจุบัน\n\nนอกจากนี้ หากพวกเขายึดมั่นในคำปฏิญาณแห่งความยากจน ความบริสุทธิ์ และความนอบน้อมเชื่อฟัง และได้รับเวทมนตร์ศักดิ์สิทธิ์จากพระเจ้า พวกเขาก็ยิ่งมีความจำเป็นที่จะต้องใช้ร่างกายน้อยลงไปอีก\n\nพวกเขาสามารถโจมตีด้วยพลังมหาศาลได้ในคราวเดียวจากที่นั่งของตนเอง แข็งแกร่งยิ่งกว่าอัศวินส่วนใหญ่เสียอีก แล้วทำไมต้อง…\n\nไม่มีความจำเป็นเลยที่นักบวชที่บวชแล้วจะต้องออกไปแนวหน้า แล้วจะออกไปทำไมล่ะ…\n\nยิ่งไปกว่านั้น ยังมีเหตุผลสำคัญอีกประการหนึ่ง\n\nอำนาจหน้าที่ที่นักบวชครอบครองอยู่ในโลกที่มีพระเจ้าผู้ทรงพระชนม์อยู่จริงนั้นเหนือจินตนาการ นั่นเป็นเพราะพวกเขาไม่สามารถใช้เวทมนตร์ศักดิ์สิทธิ์ได้เลยหากขาดคุณธรรมในจิตใจ\n\nกล่าวอีกนัยหนึ่ง นักบวชทุกคนในโลกใบนี้โดยพื้นฐานแล้วเป็นคนดี น่าประหลาดใจที่มันคือความจริง และเนื่องจากสามัญสำนึกเช่นนั้นแพร่หลายไปทั่ว นักบวชจึงต่างได้รับความเคารพนับถือทางสังคมอย่างล้นหลาม\n\nดังนั้น ช่วงเวลาเดียวที่พวกเขาจะออกไปแนวหน้าและต่อสู้ด้วยดาบโดยตรงก็คือในช่วงสงครามปีศาจ และถึงกระนั้น พวกเขาก็ไม่เคยถูกส่งไปประจำการยังแนวหน้าสุดเลยสักครั้ง\n\nแนวคิดเรื่องอัศวินผู้ใช้เวทมนตร์ศักดิ์สิทธิ์จึงเป็นเพียงภาพลวงตาเท่านั้น\n\nขณะที่รับฟังการอบรมสั่งสอนอย่างใจดีจากอาจารย์ผู้คร่ำหวอดในต่างโลกมานาน 30 ปี ยูจีนก็ตบมือเข้าหากันแล้วเอ่ยขึ้นว่า:\n\n“งั้นผมก็คือคนแรกเลยสิครับ?”\n\n“…อะไรนะ?”\n\n“ผมได้รับช่องสล็อตเวทมนตร์ศักดิ์สิทธิ์มาหลังจากสมัครเข้าเรียนคณะเทววิทยาน่ะครับ!” ยูจีนพูด “ตอนนี้ยังใช้เวทไม่ได้มากเท่าไหร่ แต่มันก็เป็นไปได้ใช่ไหมล่ะครับ?”\n\nยูจีนยังมีสกิลติดตัวเฉพาะทางที่เรียกว่า “ความเชี่ยวชาญดาบ” อีกด้วย นั่นหมายความว่าเขามีฝีมือในเชิงดาบเหนือกว่าคนอื่น\n\n“งั้น นักบวชที่ใช้เวทมนตร์ศักดิ์สิทธิ์ได้แถมยังเก่งวิชาดาบด้วย… นั่นมันก็คือพาลาดินไม่ใช่เหรอครับ? ว้าว ลูกพี่ ผมสงสัยว่าตัวเองคงเป็นผู้บุกเบิกสายอาชีพพาลาดินซะแล้วสิ”\n\nอีวานพยักหน้าเห็นด้วยพลางครุ่นคิดอยู่ครู่หนึ่ง\n\n“ช่องสล็อตเวทมนตร์ศักดิ์สิทธิ์งั้นเหรอ…?”\n\n“จริงๆ ผมเรียนเวทมนตร์สายอื่นได้เหมือนกันนะครับ แต่ค่าประสบการณ์ที่ต้องใช้มันสูงเกินไป ผมเลยยังไม่ได้ลอง สุดท้ายแล้ว ชีวิตคนเรามันก็ขึ้นอยู่กับการเลือกและทุ่มเทใช่ไหมล่ะครับ?”\n\n“เวทศักดิ์สิทธิ์ เวทมนตร์ และวิชาดาบ นายสามารถเรียนรู้ทักษะได้ทั้งสามสายเลยงั้นเหรอ?”\n\nอีวานหรี่ตาลงแล้วจ้องมองยูจีน บทสนทนาในอดีตแวบผ่านเข้ามาในห้วงความคิด\n\n– เรียนรู้อะไรก็ได้ทั้งนั้นแหละค่ะ! ยกเว้นเวทมนตร์ อันนั้นมันยากเกินไปจริงๆ\n\n– มันคงจะไม่สะดวกหน่อยนะถ้าผู้กล้าใช้เวทมนตร์ไม่ได้น่ะ\n\n– อะฮ่าๆ หนูอยู่คณะอัศวินนี่นา!\n\nนี่คือบทสนทนาที่อีวานเคยคุยกับอิซาเบลล์แบบผ่านๆ\n\nใช่ว่าลูกสาวของผู้กล้าจะต้องกลายเป็นผู้กล้าเสมอไป แต่แล้วในกรณีของแม็กซิมิเลียนล่ะ?\n\n“สามารถใช้ได้ทั้งเวทศักดิ์สิทธิ์ เวทมนตร์ และวิชาดาบ แถมยังเป็นผู้ข้ามมิติอีกด้วย”\n\nไอ้หมอนี่คือผู้กล้าหรือเปล่านะ?\n\nอีวานก้มมองยูจีนด้วยสีหน้าซับซ้อน พลางสังเกตรอยยิ้มเจ้าเล่ห์ของยูจีน\n\n“ผมอยากพูดประโยคนี้ใจจะขาดตอนได้เป็นพาลาดิน แบบว่า ‘เดอุส โบลต์! ฮ่าห์!’ (Deus Bolt! Haa!) อะไรทำนองนี้น่ะครับ”\n\nอีวานส่ายศีรษะเบาๆ ขณะหวนรำลึกถึงแม็กซิมิเลียน ดูเหมือนว่าโลกใบนี้คงไม่ต้องการให้ยูจีนมาเป็นผู้กล้าหรอกนะ\n\nไม่นานนัก อีวานและยูจีนก็มาถึงห้องบรรยายของคณะเวทมนตร์\n\nออสวัลด์ที่กำลังนั่งเรียนอยู่กลางคาบ จู่ๆ ก็รู้สึกเย็นวาบไปตามต้นคอจนต้องหดตัวลง\n\nสายตาอันแรงกล้า แทบจะเรียกได้ว่าเต็มไปด้วยจิตสังหารหรือกระทั่งแรงกล้ายิ่งกว่าด้วยความโลภ พุ่งตรงมาจาก เอเวอลิน รัสต์ฟิตซ์ บุตรสาวสุดที่รักของประธานสภาองคมนตรีและสตรีสูงศักดิ์แห่งตระกูลดยุกรัสต์ฟิตซ์\n\nออสวัลด์ขบฟันแน่น\n\n“ฉันควรจะทำยังไงดีวะเนี่ย…!”\n\nในฐานะชายหนุ่มวัยยี่สิบกว่าปีตามปกติ เขาไม่เคยสัมผัสกับนิยายแนว “โรแมนติกแฟนตาซีฮาเร็มชาย” หรือที่รู้จักกันในนาม “นิยายนางร้าย” มาก่อนเลย\n\nเขาไม่มีข้อมูลเกี่ยวกับนิยายเรื่องนี้เลยสักนิด ไม่เข้าใจด้วยซ้ำว่าทำไมจู่ๆ ตัวเองถึงมาสิงร่างตัวละครในนิยายที่เคยอ่านไปแค่ 30 ตอน\n\nการเอาชีวิตรอดในโลกที่ตัวเองไม่รู้อะไรเลย โดยปราศจากสิทธิพิเศษใดๆ จากการเป็นผู้กลับชาติมาเกิด ช่างเป็นเรื่องที่ท้าทายเหลือเกิน\n\n“รู้งี้น่าจะอ่านนิยายแนวฮาเร็มชายไว้บ้างก็ดีหรอก!”\n\nเขารู้สึกอยากจะร้องไห้และเอาหัวโขกพื้นเสียให้รู้แล้วรู้รอด เขาเคยอ่านนิยายแนวฮาเร็มชายผ่านตามาบ้าง แต่พวกนั้นก็เป็นแค่สูตรสำเร็จที่เอาไว้เสพเพื่อความบันเทิงในนิยายเท่านั้น\n\nในความเป็นจริงอันโหดร้ายของเกาหลีใต้ยุคศตวรรษที่ 21 สถานการณ์ที่นางเอกสำนึกผิด แปรเปลี่ยนเป็นความขมขื่น และคลั่งไคล้ยึดติดในตัวพระเอก เขาเรียกกันว่า…\n\n[สตอล์กเกอร์] มันคือความรุนแรงในคู่รักขั้นร้ายแรงที่แม้แต่ตำรวจยังต้องเข้ามาจัดการ!\n\nแล้วทำไมเอเวอลินถึงจ้องเขม็งมาที่เขาล่ะ?\n\nนั่นก็เป็นเพราะออสวัลด์บังเอิญเดินชนนักศึกษาหญิงคนหนึ่งในโถงทางเดินแล้วยิ้มตอบไปว่า “ไม่เป็นไรครับ” เท่านั้นเอง\n\n“บ้าเอ๊ย แล้วจะให้ฉันทำยังไงอีกล่ะ?”\n\nถ้าไม่ใช่พวกโรคจิต ก็คงไม่มีใครทำอะไรแบบนั้นหรอก แม้ว่าเอลฟ์จะเป็นเผ่าพันธุ์ที่เต็มไปด้วยความหยิ่งทะนง แต่พวกเขาก็ไม่ได้มีวัฒนธรรมพรรค์นั้น\n\nพวกเขาเชื่อว่าความหยิ่งทะนงเป็นเพียงอีกแง่มุมหนึ่งของการเป็นผู้สูงศักดิ์ ดังนั้นพวกเขาจึงไม่ทำเรื่องต่ำทรามแบบนั้น กล่าวอีกนัยหนึ่ง การตอบสนองของออสวัลด์ถือว่าสมเหตุสมผลแล้วแม้กระทั่งในสังคมของเอลฟ์\n\nทว่า ดูเหมือนเอเวอลิน ผู้ก้าวข้ามขีดจำกัดของความเป็นมนุษย์ (และเอลฟ์) ไปแล้ว จะไม่ได้คิดเช่นนั้น\n\n“เอาล่ะ คาบเรียนค่อนข้างน่าเบื่อไปหน่อย ครูรู้ดี พวกเราพักเบรกกัน 10 นาทีแล้วค่อยมาเรียนต่อกันนะ”\n\nเมื่อศาสตราจารย์บนโพเดียมเอ่ยด้วยรอยยิ้มอบอุ่น นักศึกษาต่างก็เริ่มบิดขี้เกียจและลุกขึ้นจากที่นั่ง\n\nออสวัลด์เองก็ลุกขึ้นยืนอย่างเป็นธรรมชาติและมุ่งหน้าออกไปทางโถงทางเดิน หลีกเลี่ยงเอเวอลินที่ยังคงจ้องมองเขาราวกับอยากจะฆ่าให้ตาย\n\nคราวนี้ เขาระมัดระวังตัวเป็นพิเศษที่จะไม่เดินชนนักศึกษาหญิงคนไหนเข้าอีก\n\n“จับตัวมันไว้”\n\n“รับทราบครับลูกพี่!”\n\nขณะที่ออสวัลด์เดินไปตามโถงทางเดิน เขากลับเดินชนเข้ากับกลุ่มคนพเนจรแทนที่จะเป็นนักศึกษาหญิง\n\n***\n\nความประทับใจของออสวัลด์ที่มีต่อคนพวกนั้นเรียบง่ายมาก ไอ้บ้าคนหนึ่งกับคู่หูคนเพี้ยน\n\nในความเป็นจริง ไอ้บ้ารุ่นเยาว์คนหนึ่งที่มีหน้าตาเหมือนคนทรยศ เอาแต่เช็ดฝ่ามือตัวเองไปมากับผมสีดำตลอดเวลา เอ่ยทักขึ้นมาทันทีที่เห็นหน้าเขา\n\n“อ้าว ยินดีที่ได้รู้จักครับ คุณอีสต์เบลเฟน! ผมชื่อยูจีน ตอนอยู่เกาหลีผมชื่อคิมยูจิน ส่วนนี่คืออีวาน ผมไม่รู้ชื่อเกาหลีของเขาหรอก แต่เขาเป็นคนเกาหลีเหมือนกัน”\n\n“…?”\n\n“พวกเรามาเพราะรู้ว่าคุณเป็นผู้ถูกสิงร่างครับ ต้องการความช่วยเหลือไหม?”\n\n“…???”\n\nนี่มันเป็นอีเวนต์จากไม่กี่ตอนก่อนหน้านี้หรือเปล่านะ? อย่างน้อยในตอนที่เขาเคยอ่านมา ยังไม่เคยมีผู้ถูกสิงร่างคนอื่นปรากฏตัวขึ้นมาก่อนเลย…\n\nเรื่อง [นางร้ายที่คลั่งไคล้อัจฉริยะเวทมนตร์] ที่ออสวัลด์เคยอ่านไม่มีเส้นเรื่องแบบนี้เลยสักนิด แน่นอนว่ามันไม่ใช่ฉากหลังแบบรัสเซียประหลาดๆ นี้ด้วย\n\nขณะที่ออสวัลด์กำลังถูกความสับสนเข้าครอบงำอยู่ชั่วขณะ ชายสูงวัยที่ถูกแนะนำตัวว่าชื่ออีวานก็เอ่ยแทรกขึ้นมา\n\n“ฉันเข้าใจว่านายตกใจ แต่ทั้งนายและพวกเราต่างก็ต้องการความช่วยเหลือจากกันและกัน พอจะสละเวลาให้สักหน่อยได้ไหม?”\n\n“เอ่อ ก็ได้ครับ… แต่ว่าพวกคุณหาตัวผมเจอได้ยังไงเหรอครับ…?”\n\nลักษณะเด่นที่สุดของผู้ถูกสิงร่างคืออะไร? โดยธรรมชาติแล้ว มันคือการปิดบังความจริงเรื่องการสิงร่าง\n\nการสิงร่าง พูดกันตรงๆ ก็คือการเข้าไปยึดครองร่างกายของคนที่มีชีวิตอยู่ก่อนหน้า จะเกิดอะไรขึ้นหากเข้าไปอยู่ในร่างที่มีครอบครัวและญาติพี่น้องใช้ชีวิตอยู่ร่วมกันอย่างสงบสุข?\n\nต่อให้เรื่องราวดำเนินไปได้ดีแค่ไหน ก็เสี่ยงต่อการถูกจับไปทดลองทางร่างกาย และหากผิดพลาดขึ้นมา ก็มีอันตรายที่จะถูกมองว่าเป็นศัตรูผู้ล้างแค้นลูกชาย (หรือลูกสาว) จนโดนเชือดคอทิ้งเอาได้\n\nนี่คือข้อเท็จจริงที่ได้รับการพิสูจน์แล้วจากนิยายแนวสิงร่างมากมายในเกาหลี จากมุมมองของครอบครัวและญาติพี่น้อง ผู้เข้าสิงร่างไม่ต่างอะไรจากศัตรู\n\nดังนั้น หลังจากที่ออสวัลด์ล่วงรู้ถึงข้อเท็จจริงของการสิงร่าง เขาก็ใช้เวลาจมอยู่กับความสิ้นหวังมากพอตัวและปิดบังตัวตนของตนเองอย่างมิดชิด\n\nเพราะฉะนั้น มันก็น่าจะสมบูรณ์แบบแล้วไม่ใช่หรือ…?\n\n“ไม่สมกับเป็นเอลฟ์เลย”\n\n“ครับ…?”\n\n“เอลฟ์แทบจะไม่ใช้คำสุภาพยกย่องกันหรอก”\n\nยกเว้นตัวตนอย่างนักบุญหญิงหรือกษัตริย์ของประเทศ เอลฟ์จะไม่ใช้คำสุภาพแม้กระทั่งในจดหมายทางการ ตั้งแต่แรกแล้ว สิ่งมีชีวิตอายุยืนยาวพวกนั้นแทบจะไม่ทำแบบนั้นกันเลย\n\nทว่าไอ้หมอนี่กลับยื่นเอกสารสมัครเรียนที่เขียนด้วยคำสุภาพส่งให้กองรับสมัคร ทันทีที่อีวานได้ยินเรื่องนี้ เขาก็อดไม่ได้ที่จะนึกถึงคำว่า “ผู้ถูกสิงร่าง” ก่อนที่จะนึกถึงคำว่า “เอลฟ์ผู้สุภาพและใจดี”\n\nเพราะในโลกนี้ไม่มีทางมีสมมติฐานที่ว่าเอลฟ์ผู้สุภาพและใจดีอยู่จริงได้หรอก\n\nดังนั้นโดยธรรมชาติ อีวานผู้คัดแยกตัวผู้ถูกสิงร่างออกมาได้จึงเฝ้าจับตาดูออสวัลด์พร้อมขีดเส้นใต้ชื่อของเขาเอาไว้\n\nเอลฟ์ที่ระหว่างคุยเล่นกับเพื่อนตรงมุมโถงทางเดิน บังเอิญเดินชนเพื่อนร่วมชั้นที่เป็นมนุษย์แล้วยิ้มพลางบอกว่าไม่เป็นไรเนี่ยนะ…?\n\nไม่มีทางเป็นเรื่องจริงไปได้\n\n“ขนาดลิงยังมีสายตาที่มองตรงไปข้างหน้าเลย แกเป็นแพะหรือไง? กินหญ้าเป็นอาหารเรอะ? มองทางข้างหน้าไม่เห็นหรือไง? อย่าเข้าใจผิดไปล่ะ แม้แต่พวกกินมังสวิรัติก็สมควรได้รับความเคารพนะ”\n\n“นั่นมันคำพูดแบบฉบับที่เอลฟ์ทั่วไปจะพูดใส่มนุษย์ผู้ไร้มารยาทไม่ใช่หรือไง…?”\n\nขณะที่อีวานอธิบาย สีหน้าของออสวัลด์ก็ค่อยๆ แข็งค้างลง\n\nตาแก่นี่กำลังพล่ามเรื่องบ้าอะไรอยู่เนี่ย…?\n\nนี่มันคือการเหยียดเชื้อชาติใช่ไหม? อารมณ์ความรู้สึกที่เขาไม่เคยได้สัมผัสบนโลกมาก่อน บัดนี้กลับทำให้วิจารณญาณของเขาซับซ้อนขึ้นในโลกต่างมิติแห่งนี้ โดยเฉพาะอย่างยิ่งเมื่อได้รับความรู้สึกนั้นจากมุมมองของเอลฟ์…\n\n“ว่าแต่ เรื่องราวที่นายอ่านมามันคือเรื่องอะไร?”\n\n“อ้อ จะว่าไปแล้ว ของผมคือ [ไอ้สารเลวอัจฉริยะเพลงดาบแห่งดัชชีเหนือ] นะครับ!”\n\n“…ของผมคือ [อัจฉริยะเวทมนตร์ผู้ถูกนางร้ายคลั่งไคล้เวทมนตร์ตามหลอกหลอน] ครับ….”\n\n“อู้ว น่าสนใจดีแฮะ ดูเหมือนคุณจะมาสิงร่างหลังปี 2021 สินะ อย่างน้อยๆ ก็ใช่ไหม?”\n\n“เดือนพฤษภาคม ปี 2023 ครับ”\n\n“โอ้…!”\n\nออสวัลด์เมินเฉยต่อยูจีนที่เอาแต่พล่ามเรื่องตัวเองไม่หยุด แล้วหันหน้าไปหาอีวาน\n\n“ยังมีผู้ถูกสิงร่างคนอื่นอีกเหรอครับ?”\n\n“น่าจะมีนะ”\n\nยูจีนพยักหน้าอย่างหนักแน่น\n\n“ไปที่คณะอัศวินกัน”\n\n***\n\nยูริหน้าซีดเผือดขณะที่มองดูผู้ชายสามคนที่ยืนขวางทางเธออยู่\n\nคนสวนท่าทางน่าสงสัยที่มีผ้าขนหนูพาดคอ กับไอ้หนุ่มผมดำยิ้มแย้มที่เอาแต่เช็ดฝ่ามืออยู่ข้างๆ เขา…\n\n“สวัสดีครับ? ผมชื่อออสวัลด์ จากคณะเวทมนตร์ เป็นนักศึกษาปีหนึ่งเหมือนกัน วิชาเอกของผมคือเวทมนตร์จิตใจ เอ่อ มันเป็นศาสตร์สายจิตน่ะครับ”\n\nแล้วยังมีไอ้หนุ่มตาคมที่ยอมรับออกมาหน้าตาเฉยว่าตัวเองใช้เวทมนตร์สะกดจิตอยู่ด้วย\n\n“เธอเองก็เป็นผู้ถูกสิงร่างใช่ไหม? ได้ยินว่ามาจากเกาหลีเหมือนกัน ฮ่าๆ รู้สึกเหมือนพวกเราน่าจะตั้งชมรมคนโซลหรืออะไรทำนองนั้นขึ้นมาเลยนะ จริงไหม?”\n\nคิมแทยังยื่นมือออกมาพร้อมเสียงหัวเราะ\n\n“ฮิฮิฮิ!”\n\nภาพตรงหน้าของยูริมืดดับวูบลงไปทันที!\n\n***\n\nยูริ แฟรงก์ อันดับหนึ่งของคณะอัศวิน\n\nยูจีน โนวิคอฟ คารัมซิน ผู้เชี่ยวชาญทั้งเพลงดาบและเทววิทยาในคณะเทววิทยา\n\nออสวัลด์ อีสต์เบลเฟน ผู้เชี่ยวชาญศาสตร์เวทมนตร์จิตใจในคณะเวทมนตร์\n\nและยังมีอีวาน เปโตรวิช อดีตสมาชิกหน่วยลาดตระเวน\n\nอีวานกวาดตามองเหล่าผู้ถูกสิงร่างที่มารวมตัวกันอยู่ในห้องชมรมขนาดเล็กพลางครุ่นคิด\n\nนี่มันการจัดปาร์ตี้ผู้กล้าชัดๆ เลยไม่ใช่หรือไง…?"
    },

      "title": "บทที่ 31",
      "content": "“เรามาแนะนำตัวกันทีละคนเถอะครับ ผมชื่อยูจีน ยูจีน โนวิคอฟ คารัมซิน ผมคือคิมยูจิน ที่มาสิงอยู่ในร่างลูกชายของดยุกคารัมซินครับ”\n\nยูจีนกล่าวพลางเขียนชื่อของตัวเองเป็นภาษาเกาหลีลงบนกระดานไวท์บอร์ดในห้องชมรม\n\nต่อหน้าเด็กสาวจากคณะอัศวินที่กำลังตัวสั่นงันงก เอลฟ์ที่มีสีหน้าเนือยๆ ราวกับกำลังครุ่นคิดอะไรบางอย่าง และพี่ชายซานตาคลอสจอมอำมหิตที่แค่เห็นหน้าก็ทำเอาขาสั่นพั่บๆ แล้ว\n\n“นิยายเรื่องล่าสุดที่ผมอ่านคือ [ไอ้สารเลวอัจฉริยะเพลงดาบแห่งดัชชีเหนือ] และตอนนี้ผมกำลังเรียนอยู่ในคณะเทววิทยา เดินบนเส้นทางของนักบวชครับ! อ้อ แล้วผมก็มองเห็นหน้าต่างสถานะด้วย มีใครแถวนี้มองเห็นหน้าต่างสถานะบ้างไหมครับ?”\nเขายกมือขึ้นแล้วโยนคำพูดเบาๆ เพื่อสร้างความรู้สึกร่วม ทว่าทุกคนกลับเอาแต่มองหน้ากันไปมา\n\nไม่มีเลยงั้นเหรอ?\n\nหน้าต่างสถานะมันพิเศษขนาดนั้นเชียว? ยูจีนลดมือลงอย่างเก้อเขินแล้วพูดต่อ\n\n“อืม เอ่อ… มีเรื่องอะไรที่อยากรู้อีกไหมครับ?”\n“ตอนจบ”\n“…อะไรนะ?”\n“อธิบายตอนจบ เซ็ตติ้ง และเนื้อเรื่องของนิยายที่นายอ่านมาซิ”\nยูจีนนิ่งเงียบไปครู่หนึ่ง เขาควรจะเริ่มเล่าเรื่องนี้จากตรงไหนดีนะ?\n\nโดยปกติแล้ว นิยายเรื่องยาวมักจะมีตอนจบอยู่สามแบบ\n\nหนึ่ง จบตามปกติ\n\nสอง หยุดเขียนกลางคัน\n\nและสุดท้าย เขียนลากยาวไม่ยอมจบ\n\nนิยายที่ยูจีนอ่านเป็นนิยายที่ลากยาวจนถึงกระดูกดำ มันเป็นนิยายยาวพิเศษที่มีจำนวนตอนมากกว่าหนึ่งพันตอน\n\nมันเป็นนิยายประเภทที่เหมาะเอาไว้อ่านฆ่าเวลาเบาๆ ให้สมองโล่งระหว่างเดินทางไปทำงาน โดยไม่มีฉากหรือข้อความซับซ้อนชวนให้ต้องหยุดคิด และแทบไม่มีแก่นสารอะไรเลย\n\nดังนั้น มันจึงไม่มีตอนจบ พระเอกก็แค่เข้าไปเรียนในสถาบัน แล้วก็เริ่มตามเก็บไอเทมลับ จากนั้นก็เริ่มสู้กับตระกูลจอมเวทชั่วร้าย แล้วจู่ๆ สงครามโลกก็ปะทุขึ้นมา…\n\nมันเป็นนิยายที่ต่ออายุขัยของตัวเองด้วยการย้ำประโยคเดิมๆ ว่า “ผู้บงการเบื้องหลังที่แท้จริงคือ ~~” ในทุกๆ 100 ตอน\n\nบางทีแม้แต่ตัวคนเขียนเองก็คงนึกตอนจบไม่ออกแล้วเหมือนกัน\n\n“อืม…”\nอีวานฟังคำพูดของยูจีนแล้วครุ่นคิด เขาไม่รู้จักเนื้อหาเรื่องนั้นอย่างแน่นอน และไม่รู้จักนิยายเรื่องนั้นด้วย\n\nตั้งแต่แรก อีวาน หรือคิมซอนอู เป็นคน “จริงจัง” กับนิยายมาก\n\nนั่นหมายความว่าเขามีเกณฑ์การเลือกอ่านนิยายที่เข้มงวด อีกทั้งเขายังมีความภาคภูมิใจที่ไม่ยอมอ่านนิยายแนวไร้รักโรแมนซ์กลิ่นอายวาย (BL) ประเภทลากยาวกินบำนาญรายตอน ที่ชอบเอามาประดับไว้อย่างสวยงามบนหน้าแรกของเว็บพอร์ทัลหลัก\n\n“คนต่อไป”\nเมื่ออีวานหันศีรษะไป ออสวัลด์ก็ลังเลอยู่ครู่หนึ่งก่อนจะลุกขึ้นยืน\n\n“ออสวัลด์ อีสต์เบลเฟน ผมเป็นบุตรชายคนรองของไวส์เคานต์อีสต์เบลเฟน พ่อของผมเป็นองคมนตรีคนปัจจุบัน และผมเป็นเอลฟ์สังกัดคาลีออน อย่างที่พวกคุณเห็น ส่วนชื่อเกาหลีของผมคือ พัคแจยอง นิยายที่ผมกำลังอ่านอยู่คือ เอ่อ… อืม”\nออสวัลด์หลับตาลงแล้วเอ่ยออกมาอย่างยากลำบาก\n\n“[อัจฉริยะเวทมนตร์ผู้ถูกนางร้ายคลั่งไคล้เวทมนตร์ตามหลอกหลอน]… เรื่องนั้นแหละครับ”\n“โอ้ แนวโรแมนซ์!”\n“หุบ… ปาก”\nเมื่อได้ยินเสียงเชียร์ของยูจีน ออสวัลด์ก็กัดฟันกรอด\n\n“ผมอ่านยังไม่ถึง 30 ตอนด้วยซ้ำ! เนื้อหาก็ไม่ได้ดีเด่อะไร ความทุกข์ทรมานเพิ่งจะจบลงตรงช่วงนั้น แล้วหลังจากนั้นเขาก็เอาแต่ยัดเยียดมันหวานชวนอึดอัดให้กินลูกเดียว!”\n“โอ้ นักวิเคราะห์ตัวยงเลยนี่”\n“หุบ… ปาก! หุบปากของนายไปเลย!”\n“นายอายุเท่าไหร่ล่ะเนี่ย! ตอนอยู่เกาหลีฉันอายุสามสิบเอ็ด แล้วมาสิงร่างอยู่โลกนี้ได้สี่ปีแล้ว!”\n“…ตอนอยู่เกาหลีผมอายุยี่สิบเจ็ด และถูกสิงมาสี่ปีแล้วครับ”\n“ทางนี้เป็นน้องชายชัดๆ! เรียกฉันว่าพี่ชายแบบกันเองได้เลยนะ?”\n“ว้าว นี่ครับ คุณอีวาน? ผมทำงานร่วมกับไอ้เด็กนี่ไม่ไหวหรอกนะ”\nไอ้หมอนี่เองก็ไม่รู้ทั้งตอนจบและเนื้อหาเหมือนกัน\n\nอีวานพยักหน้าโดยไม่สนใจคนสองคนที่กำลังเถียงกันเจี๊ยวจ๊าว\n\n“คนต่อไป”\n“ฮิ๊ยย!!”\nยูริที่หดตัวลีบอยู่มุมห้องลุกขึ้นยืนอย่างทุลักทุเล\n\n“ฉันชื่อยูริ… แฟรงก์ ตอนอยู่เกาหลีฉันชื่ออียูริ… เคยเป็นนักวาดภาพประกอบค่ะ”\n“ว้าว! คนวัยทำงาน!”\n“คือ คือว่า… ฉันอายุยี่สิบเก้า… แล้วก็… มาอยู่ที่นี่ได้สี่ปีแล้ว… ฉันไม่มีพ่อแม่ค่ะ”\n“เฮือก! มีภูมิคุ้มกันปัญหาครอบครัวทำร้ายลูก…!”\n“นายบ้าไปแล้วเรอะ?”\nยูจีนอยู่ในภาวะตื่นเต้นสุดขีดจากการที่มีผู้ถูกสิงร่าง ‘วัยเดียวกัน’ โผล่ออกมาหลายคน ดูเหมือนเขาจะดีใจที่มีคนคอยแลกเปลี่ยนข้อมูลบ้านเกิดเพิ่มขึ้นในโลกคู่ขนานเฮงซวยใบนี้\n\nในขณะเดียวกัน ยูริยังคงตัวสั่นงันงก\n\n“มะ ไม่ใช่ว่าพ่อแม่ไม่อยู่บ้านนะคะ แต่หมายถึงฉันไม่มีพ่อแม่… ฉันถูกเรียกว่ายูริ แฟรงก์ค่ะ”\n“ผลงานต้นฉบับล่ะ?”\n“อึ๋ย!”\nยูริสะดุ้งโหยงเมื่อได้ยินคำพูดของอีวาน พลางหลบสายตาไม่กล้าสบตา\n\nความเงียบเข้าปกคลุมอยู่ชั่วครู่ขณะที่ทุกคนจดจ่ออยู่กับคำพูดของเธอ\n\n“อะไรกันเนี่ย ปริศนาเรอะ? ให้ฉันทายนะ! ไหนดูซิ แนวสถาบันการศึกษา สีหน้าหม่นหมองของเธอ งั้นนี่มันต้องเป็นแนวสลับเพศ (TS)…! จังหวะมันได้! บางทีในเกาหลีหมอนี่อาจจะเป็นผู้ชายที่จู่ๆ ก็หลุดเข้ามาในเกมฮาเร็มชาย…!”\n“ไม่ใช่ค่ะ!!”\n“หรือไม่ก็อาจจะเป็นแนวแฟนตาซีดั้งเดิมแบบคาดไม่ถึง…!”\n“ค-คือว่า มันเป็นอย่างนี้นะคะ…”\n“หุบปาก ยูจีน เอาล่ะ ยูริ แฟรงก์ ผมจะร่ายเวทมนตร์ที่เหมาะกับคุณจริงๆ ให้เอง”\nออสวัลด์ยกมือขึ้นพร้อมรอยยิ้มอบอุ่น เขาเป็นผู้เชี่ยวชาญด้านเวทมนตร์จิตใจ สามารถใช้สกิลเสริมพลังอย่าง [ประทานความกล้า] หรือ [ชี้นำปัญญา] ได้\n\nทันทีที่มานาสีม่วงอันลึกลับเริ่มกระเพื่อมไหว ยูริก็กระโดดถอยหลังด้วยความตื่นตระหนก\n\n“ส-สะกดจิต!! ไม่เอานะ!!”\n“…อะไรนะ?!”\n“นายคิดจะทำอะไรด้วยเวทมนตร์นั่น! พวกนายรู้อยู่แล้วใช่ไหมล่ะ! ไอ้พวกวิปริตชอบข่มขืน!!”\n“ผมตามบทสนทนาไม่ทันแล้วครับ อีวาน นี่มันเรื่องอะไรกัน?”\nอีวานลังเลอยู่ครู่หนึ่ง\n\nแม้จะไม่แน่ใจเรื่องการเปิดเผยผลงานต้นฉบับ แต่เธอคนนี้ก็ดูหวาดกลัวอย่างเห็นได้ชัดทั้งที่รูปลักษณ์ภายนอกก็ดูธรรมดาทั่วไป ซึ่งเรื่องนั้นก็เหมือนกับออสวัลด์ที่ดูสุภาพและยิ้มแย้มอยู่เสมอ\n\nอีวานตกใจกับความคิดที่แวบเข้ามาอย่างกะทันหันจนเบิกตากว้างด้วยความตื่นตะลึง\n\n“เฟมินิสต์…งั้นเรอะ?!”\nอีวานตกอยู่ในอาการช็อกขณะที่พยายามนึกถึงคำศัพท์จากโลกเมื่อ 30 ปีก่อน ในระหว่างที่เขากำลังขบคิดเรื่องนี้อยู่ ยูริก็หลับตาปี๋แล้วพูดตะกุกตะกักออกมา\n\n“งะ งานวาดภาพประกอบ… ฉันถูกดึงตัวเข้ามาในระหว่างที่กำลังทำงานส่ง! ต้น ต้นฉบับ… ต้นฉบับคือ…”\n“อ๋อ! รู้แล้ว! เกมโป๊!”\n“อ๊าาาา!”\nยูริยกมือปิดหน้าแล้วอ้ำอึ้ง เธออยากกลับบ้าน ทุกคนที่นี่ดูไม่น่าไว้ใจ และมันน่ากลัวเหลือเกิน…\n\nคิมแทยัง ตัวละครแนวโกลด์ซันสุดหล่อเหลา ไม่เคยคิดเลยว่าจะได้มาเข้าเรียนในสถาบันร่วมกับคนสวนที่แข็งแกร่งจนน่าสงสัยขนาดนี้…\n\nขณะที่ยูริกำลังสูดน้ำมูกสะอึกสะอื้น อีวานก็พึมพำขึ้นมาอย่างกะทันหัน\n\n“ทุกคนอยู่ในปีที่สี่กันหมดเลย”\n“โอ้ ถ้าจะให้พูดถึงท่านผู้นี้ ท่านอยู่มานานถึง 30 ปีเต็มเลยนะครับ”\n“คนคนนี้ ปีนี้เขาอายุเท่าไหร่แล้วเนี่ย…?”\n“อายุร่างกายก็ 34 แล้วครับ!”\n“โอ้… เข้าใจแล้ว”\n\nออสวัลด์มองดูเคราของอีวานแล้วถอนหายใจเฮือกใหญ่ คงจะลำบากมามากเลยสินะ… ออสวัลด์คิดว่าตัวเองควรจะเข้าใจเขาให้มากหน่อย ต่อให้บางครั้งอีวานจะทำตัวเหมือนคนบ้าก็ตาม\n\n“จะว่าไปแล้ว พวกเราทั้งหมดตกลงมาในช่วงเวลาเดียวกันเลยนี่นา! เมื่อสี่ปีก่อนเกิดอะไรขึ้นกันนะ อืม…”\n“จอมมารตายแล้ว”\nอีวานกวาดสายตามองพวกเขาด้วยแววตาจริงจัง\n\n“ผู้กล้าสังหารจอมมารไปเมื่อสี่ปีก่อน และทั้งสองคนนั้นต่างก็เป็นผู้ถูกสิงร่าง”\n“โอ้…”\n\n“ในโลกนี้ ไม่มี ‘เรื่องราว’ อยู่หรอกนะ”\nเพราะนี่คือความเป็นจริง\n\nอีวานยืนยันถ้อยคำนี้อย่างไม่เต็มใจนักแล้วกล่าวต่อ\n\n“ทว่ามันมี ‘เรื่องราว’ ของแต่ละบุคคลอยู่ แต่ละคนต่างก็มีเรื่องราวเป็นของตัวเอง… เหมือนกับ ‘ต้นฉบับ’ ที่พวกนายทุกคนได้เห็นมานั่นแหละ แม็กซิมิเลียนผู้ก้าวข้ามขอบเขตของนิทานผู้กล้าทั่วไป จึงได้กลายเป็น ‘ผู้กล้า’ ฉันคิดว่าจอมมารเองก็คงไม่ต่างกัน”\n“เอ่อ ถ้างั้น…”\n\n“ยอดนักดาบพเนจรแห่งตำหนักใหญ่ทางเหนือ”\n\nอีวานผายมือไปทางยูจีน จากนั้นก็เบนปลายนิ้วไปทางออสวัลด์\n\n“จอมเวทอัจฉริยะที่ถูกคุณหนูนางร้ายตามไล่ล่า”\n\n“อืม…”\n\nออสวัลด์ก้มหน้าลงด้วยสีหน้าเคร่งขรึม\n\n“…และ เกมโป๊ไร้ชื่อ…”\n\n“ฮืออออออ…!!”\nยูริเริ่มปล่อยโฮออกมา\n\n“พวกนายทุกคนต่างเริ่มต้นเรื่องราวในภูมิหลังที่คล้ายคลึงกับต้นฉบับ ขุนนางจอมเสเพล จอมเวทผู้เป็นที่รักของสตรีสูงศักดิ์ และเกมโป๊ไร้ชื่อ…”\n“เลิกเน้นย้ำคำนั้นสักทีเถอะค่ะ!”\n“ตกลง แต่เรื่องราวที่เหลือต่อจากนั้นต่างออกไป”\nสายตาของอีวานทอประกายลุ่มลึกขึ้น\n\n“มีสตรีผู้หนึ่งที่รู้จักเรื่องราวของผู้ถูกสิงร่างในยุคก่อน เธอได้บอกบางอย่างกับฉันไว้”\n“จงใช้ชีวิตในเรื่องราวของเจ้าและปิดฉากมันเสีย จุดจบของเรื่องราวและทิศทางที่จะก้าวเดินต่อไปหลังจากนั้น ไม่ใช่สิ่งที่โชคชะตาหรือโลกใบนี้เป็นผู้กำหนด แต่มันคือสิ่งที่พวกเจ้าต้องเป็นคนตัดสินใจเอง”\n“ณ ปลายทางของเรื่องราวแต่ละบุคคลย่อมมีจุดจบ และทิศทางที่นำไปสู่หลังจุดจบนั้นก็ไม่จำเป็นต้องถูกกำหนดไว้ด้วยโชคชะตาเสมอไป”\n“โชคชะตาไม่มีอยู่จริง ไม่ว่าจะบนโลกหรือที่นี่ ชีวิตไม่ได้ถูกกักขังอยู่ภายใต้เส้นเรื่องที่ถูกกำหนดไว้ล่วงหน้า”\n“จงอย่ารอให้โชคชะตามาปิดฉากเรื่องราวของเจ้า ศิษย์ข้า จงพลิกหน้ากระดาษหนังสือของเจ้าด้วยมือของตัวเอง จนกว่าจะถึงตอนจบ”\nอีวานพยักหน้าพลางหวนนึกถึงคำพูดของเอนริเก้\n\n“หลังจากใช้เวลา 30 ปีในโลกใบนี้ ได้พบกับปาร์ตี้ผู้กล้า และได้มาเจอพวกนายอีกครั้ง ฉันก็มีสมมติฐานอยู่อย่างหนึ่ง”\nอีวานเดินตรงไปยังกระดานไวท์บอร์ด\n\n“แม้โชคชะตาอาจจะไม่ได้กำหนดอนาคตของคนคนหนึ่ง แต่อย่างน้อยโชคชะตาก็เข้ามามีส่วนแทรกแซงในอดีตของคนผู้นั้น ใน ‘จุดเริ่มต้น’ ของพวกเขา”\nลองสมมติว่าโลกใบนี้ปรารถนาเรื่องราวของบทบาทจอมมารและบทบาทผู้กล้า จึงได้ดึงตัวพวกเขาเข้ามาสิงร่าง\n\nและที่นี่ หลังจากการตายของจอมมาร ก็มีผู้ถูกสิงร่างอีกสามคนปรากฏตัวขึ้น\n\nพวกเขาต่างถูกดึงมาผ่านเรื่องราวที่แตกต่างกันโดยสิ้นเชิง แต่กลับน่าประหลาดที่มี ‘จุดเริ่มต้น’ คล้ายคลึงกับต้นฉบับ\n\nและทุกคนต่างก็มารวมตัวกันอยู่ที่มหาวิทยาลัยเซนต์ยานสก์ นี่มันเป็นเรื่องบังเอิญอันยิ่งใหญ่งั้นหรือ? ไม่ มันคือ ‘การออกแบบ’ บางอย่าง มันต้องเป็นแบบนั้นแน่ๆ\n\nกล่าวอีกนัยหนึ่ง อาจมีแนวโน้มบางอย่างสำหรับเรื่องราวที่โลกใบนี้ปรารถนาให้ดำรงอยู่\n\nถึงจุดนี้ สิ่งที่พอจะอนุมานได้ก็คือ…\n\n“มันคือฉากหลังแนวสถาบันการศึกษา”\n“ว่าแล้วเชียว! ไชโย!”\n“และพวกเรามีความสามารถในการเฝ้าสังเกตการณ์กระแสไหลเวียน ‘อย่างเป็นทางการ’ ได้แบบเรียลไทม์”\nอีวานชี้มือไปทางยูจีน\n\n“หมอนี่มี ‘หน้าต่างสถานะ’ มันจะแสดงทิศทางของเรื่องราวออกมาในรูปแบบของเควสต์ เป็นรูปแบบที่เปลี่ยนแปลงไปตามพลวัตเพื่อสะท้อนสถานการณ์ปัจจุบัน”\n“โอ้…”\n\n“เอาล่ะ นับจากจุดนี้เป็นต้นไป พวกเรา…”\nอีวานเริ่มเขียนตัวอักษรขนาดใหญ่ลงบนกระดานไวท์บอร์ด\n\n– พวกเราทุกคนต้องการเรื่องราวแบบไหน?\n\n– จุดจบแบบไหนที่พวกเราทุกคนอยากไปให้ถึง?\n\n– พวกเราควรทำอะไรในโลกใบนี้?\n\n“พวกเรามารวมตัวกันเพื่อทำความเข้าใจสิ่งนี้ ทำความเข้าใจเรื่องราวของแต่ละคน วิเคราะห์กระแสของโลก และก้าวเดินไปข้างหน้าเพื่อ ‘ตอนจบ’ ของพวกเรา”\n\n“โอ้ววว…!”\n\n“อ๊ะ เดี๋ยวครับ”\nขณะที่ยูจีนกำลังร้องอุทานอย่างตื่นเต้น ออสวัลด์ก็ยกมือขึ้น\n\n“ผมยังไม่ได้ยินเลยว่าเรื่องราวของคุณอีวานคือเรื่องอะไร”\n“อ๊ะ จริงด้วย! ฉันเองก็ยังไม่รู้เหมือนกันค่ะ เรื่องราวของคุณคือเรื่องอะไรเหรอคะ?”\n“…ฉันไม่รู้”\n“หา?”\n\nอีวานเอ่ยตอบอย่างสงบนิ่ง พลางกวาดสายตามองพวกเขาทุกคนด้วยแววตาจริงจัง\n\n“ฉันไปคอมเมนต์ด่าทอไว้ในนิยายมากกว่า 300 เรื่องด้วยความตั้งใจที่จะมาเกิดใหม่น่ะ”\n“โอ้… โอ้โห”\n\n“นั่นมัน… บ้าไปแล้ว”\n\nคนบ้าชัดๆ\n\nใต้ชื่อของอีวานในความคิดของทั้งสามคน มีเส้นสีแดงขีดเน้นเอาไว้ถึงสามเส้น\n\nค่ำคืนนั้น พวกเขาทุกคนต่างยืนอยู่บนหอคอยที่สูงที่สุดของมหาวิทยาลัยเซนต์ยานสก์ พลางแหงนหน้ามองดูท้องฟ้า\n\n“เอาล่ะ กลุ่มผู้รักชาติเกาหลี ลุยกันเลย!”\n“มันเป็นปาร์ตี้ของพวกคนกลับชาติมาเกิดต่างหากเล่า”\n“ฉันหวังว่าคุณคงไม่ได้ตั้งชื่อชมรมแบบนั้นจริงๆ นะคะ”\nส่วนอีวานนั้นแอบคิดในใจเงียบๆ ว่าจะตั้งชื่อว่า ‘ชมรมอาสาสมัคร’"

      "title": "บทที่ 32",
      "content": "บนเรือประจัญบานไม่มีสิ่งที่เรียกว่าบันไดล่องหนที่ลอยอยู่กลางอากาศ และมนุษย์ก็ไม่ได้มีปีกเสียด้วย\n\nดังนั้น การลอบแทรกซึมเข้าไปในเรือรบลอยฟ้าจึงเป็นเรื่องที่ยากเย็นแสนเข็ญ ต่อให้มันจะลอยนิ่งอยู่กลางท้องฟ้าและไร้การป้องกันโดยสิ้นเชิงแม้ในยามกลางดึกก็ตาม\n\nและตอนนี้ พวกเขาต้องลอบเข้าไปข้างใน ข่มขู่กัปตันเรือ และจัดการลูกเรือทั้งหมดโดยห้ามฆ่าใครแม้แต่คนเดียว\n\n“ในท้องทะเล เรือประจัญบานมักถูกเปรียบเปรยว่าเป็นป้อมปราการ ส่วนเรือประจัญบานลอยฟ้าก็เรียกได้ว่าเป็นป้อมปราการแห่งสวรรค์”\n\nออสวัลด์เอ่ยด้วยรอยยิ้มอ่อนโยน คำพูดของเขาไม่ได้ผิด แต่แฝงความประชดประชันอยู่เต็มเปี่ยม\n\n“ไอ้บ้านั่นคิดว่าตัวเองเป็นเอลฟ์จริงๆ หรือไงวะ”\n\n“ผมก็เป็นเอลฟ์จริงๆ นี่นา แค่คุณมองไม่เห็นหูผมเท่านั้นเอง”\n\n“ว้าว หมอนี่มันเละเทะเข้ากระดูกดำแล้ว ลูกพี่ ผมมีทางออกครับ!”\n\nยูจีนทำปากยื่นแล้วยกมือทั้งสองข้างขึ้นฟ้า เขายักไหล่อย่างภาคภูมิใจเมื่ออีวานหันขวับมามอง\n\n“ผมก็แค่ใช้ [ย่างก้าวขนนก] ของผมเท่านั้นเอง!”\n\n“ต้องให้บอกอีกกี่ครั้งว่ามันเป็นเวทมนตร์สายจิตใจถึงจะเข้าใจเนี่ย? การเป็นมนุษย์มันทำให้เรียนรู้ช้าขนาดนั้นเลยเหรอ?”\n\n“โห เจ้างั่งตัวจริงเสียงจริง ทำไมถึงไว้ใจจอมเวทที่ใช้กระทั่ง [ย่างก้าวขนนก] ยังไม่ได้มาจัดปาร์ตี้ล่ะครับเนี่ย? ลูกพี่ เดี๋ยวผมไปลากใครก็ได้จากคณะเวทมนตร์มาเดี๋ยวนี้เลย เอาสายทำลายล้างยิ่งดี”\n\n“[จิตเภท]”\n\nมานาสีม่วงหมุนวนอยู่รอบปลายนิ้วของออสวัลด์ แล้วม่านตาของยูจีนก็เบิกขยายกว้าง\n\nยูจีนคอพับลง น้ำลายยืดไหลย้อย\n\nความเงียบงันเข้าปกคลุมห้องชมรม\n\nอีวานพยักหน้า\n\n“พวกเรารอจนถึงตอนเย็นได้”\n\n“คุณคิดว่าเรือรบจะจู่ๆ ร่อนลงจอดตอนเย็นหรือไงครับ?”\n\n“ไม่หรอก มีคนที่จำเป็นต้องขึ้นไปบนเรือต่างหาก”\n\nทางคราซิลอฟยื่นคำขาดให้เรือรบถอนตัวออกไปภายในสามวัน นั่นคือเรื่องเมื่อวาน\n\nและเมื่อเย็นวาน เอลิซาเวตาก็ยื่นเส้นตายให้เวลาหนึ่งวันว่าจะถอนกำลังออกไปหรือจะให้ยิงสอยให้ร่วง\n\nกัปตันเรือลำนั้นต้องกำลังร้อนใจอยู่แน่ๆ กองทัพทั้งราชอาณาจักรอาจจะเคลื่อนพลเข้าปฏิบัติการทางทหารในวันพรุ่งนี้ หรือต่อให้ไม่เป็นเช่นนั้น วันนี้เอลิซาเวตาก็อาจจะพยายามเล่นลูกไม้อะไรบางอย่างอยู่\n\nถ้าเป็นเช่นนั้น กัปตันเรือจะต้องติดต่อกับมกุฎราชกุมารให้ได้ภายในวันนี้ นั่นเป็นหนทางเดียวที่จะพลิกสถานการณ์กลับมาได้\n\nพวกมันไม่อาจเคลื่อนไหวในเวลากลางวันแสกๆ ได้ ทั่วทั้งพริตเชนคายาล้วนอยู่ในสายตาของเอลิซาเวตา ตราบใดที่กองบัญชาการต่อต้านข่าวกรองยังคงอยู่\n\nดังนั้น เวลานั้นจึงต้องเป็นช่วงเย็น หรืออย่างน้อยก็ช่วงกลางคืนหลังพระอาทิตย์ตกดิน\n\n“ต่อให้… ฝ่ายมกุฎราชกุมารจะติดต่อกับเรือรบจริงๆ แล้วพวกเราจะแทรกเข้าไปตรงกลางระหว่างนั้นได้ยังไงล่ะครับ?”\n\n“พวกมันจะใช้รถม้าที่ลงอาคมลอยตัว”\n\n“งั้น… พวกเราจะไปขอให้พวกมันแบ่งที่นั่งบนรถม้าให้หรือไงครับ?”\n\n“ไม่”\n\nหลังจากกวาดสายตามองออสวัลด์ที่จ้องมาอย่างเคลือบแคลง ยูริที่ยังคงตัวสั่นด้วยความหวาดกลัว และยูจีนที่กำลังมึนงง อีวานก็หันไปทางยูริแล้วเอ่ยด้วยน้ำเสียงจริงจัง\n\n“ถ้าเธอต้องแบกหนึ่งในสองคนนี้ เธอจะเลือกใคร?”\n\n“คะ…?”\n\n“ยกเว้นฉัน เธอจะแบกใครในสองคนนี้?”\n\nยูริมองชายหนุ่มทั้งสองด้วยแววตาสั่นระริก คนหนึ่งคือโกลด์ซัน ส่วนอีกคนคือเนตรสะกดจิต\n\nไอ้เนตรสะกดจิตเพิ่งจะพิสูจน์ความสามารถของตัวเองด้วยการร่ายเวทมนตร์สะกดจิตใส่เธอเมื่อครู่นี้เอง\n\nยูริกัดริมฝีปากแน่นและเค้นเสียงตอบออกมาอย่างยากลำบาก\n\n“งั้น ยูจีน… ฉันขอเลือกหมอนี่ดีกว่าค่ะ….”\n\n“จะยอมเลือกหมอนี่ดีกว่างั้นเรอะ…?”\n\nอีวานเมินเฉยต่อออสวัลด์ที่ทำหน้าเหยเกด้วยความเจ็บช้ำน้ำใจ แล้วพยักหน้า\n\n“งั้นฉันจะแบกนายเอง ออสวัลด์”\n\n“แล้วจู่ๆ คุณจะมาแบกผมทำไมเนี่ย?”\n\n“ใช่ พวกเราจะห้อยตัวกันไป”\n\nความสูงราว 800 เมตรกลางอากาศ เป็นระดับความสูงที่ต่ำอย่างน่าขันสำหรับเครื่องบินทั่วไปบนโลกมนุษย์ แต่กลับเป็นระยะทางที่มนุษย์ไม่อาจเอื้อมถึงได้ในโลกยุคก่อนสมัยใหม่ใบนี้\n\nต่อให้เป็นบนโลกที่มีวิทยาการวิศวกรรมโยธาพัฒนาไปไกลแล้ว ความสูง 800 เมตรก็เทียบเท่ากับความสูงของตึกเบิร์จคาลิฟา กล่าวอีกนัยหนึ่ง มันคือสิ่งปลูกสร้างที่สูงที่สุดเท่าที่มนุษย์เคยสร้างหรือปีนป่ายขึ้นไปถึง\n\nความพยายามใดๆ ที่จะลอยขึ้นไปถึงความสูงระดับนั้นด้วยเวทมนตร์ลอยตัวหรือพาหนะอื่นย่อมถูกตรวจพบได้อย่างแน่นอน\n\nดังนั้น วิธีเดียวที่จะลอบแทรกซึมเข้าไปโดยไม่ให้ถูกจับได้ก็คือการซ่อนตัวอยู่ใต้ท้องรถม้าที่ฝ่ายมกุฎราชกุมารจะส่งออกไปติดต่อเจรจา\n\nปัญหาคือ พวกเขามีเรี่ยวแรงมากพอที่จะเกาะอยู่ใต้ท้องรถม้าหรือไม่?\n\nออสวัลด์ไม่คิดว่ามันจะเป็นไปได้ และยูจีนเองก็ไม่แน่ใจนัก ท้ายที่สุดเขาก็เป็นนักบวช ไม่ใช่นักดาบ\n\nในทางกลับกัน ยูริคืออันดับหนึ่งของคณะอัศวิน นอกเหนือจากมอร์ดแล้ว เธอคือหนึ่งในนักศึกษาปีหนึ่งที่แข็งแกร่งที่สุด เธอสามารถหิ้วคนคนหนึ่งแล้วห้อยตัวค้างอยู่กลางอากาศนาน 10 นาทีได้สบายๆ\n\n“คุณพูดเหมือนกับว่าตัวเองเคยลอบขึ้นเรือรบทั้งที่ห้อยตัวอยู่กลางอากาศมาแล้วอย่างนั้นแหละ?”\n\n“โชคดีที่ฉันเคยทำอะไรทำนองนั้นมาก่อนน่ะ”\n\n“ชีวิตที่ผ่านมาของคุณนี่มันยังไงกันแน่เนี่ย อ้อ ผมคงพูดไม่ได้เต็มปากหรอกนะว่าอยากรู้อยากเห็นเป็นพิเศษ”\n\nอีวานเมินคำพูดของออสวัลด์แล้วลุกขึ้นยืน ยังมีอีกหลายอย่างที่ต้องเตรียมการ\n\n“เตรียมเสื้อผ้าอุ่นๆ มาให้พร้อม สวมอาวุธยุทโธปกรณ์ให้ครบครัน แล้วไปเจอกันที่หอดูดาวของคณะเวทมนตร์”\n\nในคราซิลอฟ ทุกฤดูกาลยกเว้นฤดูร้อนแทบไม่ต่างอะไรจากฤดูหนาว มีฤดูหนาวเล็ก ฤดูร้อน กลางฤดูร้อน แล้วก็ฤดูหนาวหฤโหด\n\nนั่นหมายความว่าการห้อยตัวเกาะติดไปกับรถม้ากลางดึกและบินขึ้นไปที่ความสูง 800 เมตรย่อมหนาวจับใจอย่างแน่นอน เหล่าผู้ถูกสิงร่างต่างพากันตัวสั่นสะท้านเมื่อนึกถึงคำพูดของอีวาน\n\n***\n\nอีวานและเหล่าผู้ถูกสิงร่างหมอบซุ่มรออยู่บนหลังคาหอดูดาวตั้งแต่ช่วงเย็น และจนกระทั่งฟ้ามืดสนิทแล้วพวกเขาจึงลุกขึ้นยืนด้วยร่างกายที่แข็งทื่อจากความเหนื่อยล้า\n\nมือของพวกเขาชาดิกจากความหนาวเย็น ต่อเมื่อเหล่าผู้ถูกสิงร่างถอนหายใจและคลายมือคลายเท้าออก อีวานจึงเงยหน้าขึ้นมอง\n\nความมืดมิดเข้าปกคลุมทั่วอาณาบริเวณ จากนั้นแสงไฟดวงเล็กๆ ก็กะพริบขึ้นในระยะไกล ท่ามกลางท้องฟ้าที่ยิ่งมืดมิดลงไปอีกจากเงาทะมึนของเรือรบขนาดมหึมา\n\n“เตรียมตัว”\n\nอีวานคลายหัวไหล่หนึ่งครั้ง จากนั้นก็ชักขวานออกมา เขาควงขวานที่ผูกเชือกไปรอบๆ ก่อนจะดึงให้ตึงเพื่อกะระยะทาง\n\nปลายเชือกจากขวานทั้งสองเล่มถูกมัดไว้ที่เอวของยูริและเอวของอีวานตามลำดับ\n\nเมื่อตรวจสอบจนแน่ใจแล้วว่ายูริกำลังแบกยูจีนอยู่ อีวานก็ค่อยๆ ดึงแขนไปด้านหลัง\n\n“มาแล้ว”\n\nเหล่าผู้ถูกสิงร่างพากันกลืนน้ำลายอย่างประหม่า อีวานกำลังจ้องมองตรงไปข้างหน้า ยังจุดหนึ่งในความมืดมิดของท้องฟ้ายามราตรีที่มองไม่เห็นอะไรเลย\n\nพลังเวทไหลเวียน พลังงานอันประณีตบรรจงแล่นพล่านไปทั่วเส้นใยกล้ามเนื้อของอีวาน\n\nออสวัลด์ที่เกาะอยู่บนหลังของเขาลอบทึ่งอยู่ในใจกับการจัดเรียงพลังอันละเอียดอ่อนนั้น\n\n“เธอไปก่อน”\n\n“คะ? อะไร… เฮ้ยยย!!! – อ๊ากกกก!!! – อ๊ากกกก!!!”\n\n– ฟิ้ววววว!!!\n\nโดยไม่รอให้ยูริตอบ อีวานก็ขว้างขวานออกไป ขวานมือพุ่งทะยานสู่ท้องฟ้ายามราตรีเป็นเส้นตรงอย่างสวยงาม\n\nเชือกที่ห้อยจากด้ามขวานกระตุกตึงหนึ่งครั้ง และยูริที่ถูกมัดติดอยู่กับมันก็ปลิวละลิ่วออกไปราวกับถูกสาวรอกดึง\n\nชั่วพริบตา เงาร่างของยูริก็เลือนหายเข้าไปในความมืดมิด\n\n“จับไว้ให้แน่น”\n\n“ผม เอ่อ เดี๋ยวสิครับ ผมยังไม่แน่ใจว่าตัวเองพร้อมหรือยัง…. เดี๋ยว เดี๋ยว เดี๋ยว คุณลองคิดดูใหม่อีกทีดีกว่าไหม…!!”\n\n– ฟิ้ววววว!!!\n\n“หวาาาา หวาาาา หวาาาา!!!”\n\nออสวัลด์กรีดร้องลั่น กัดฟันจนฟองน้ำลายแตกฟอดขณะที่พื้นเบื้องล่างหดเล็กลงอย่างรวดเร็ว ลมกรรโชกแรงฟาดใส่แก้มทั้งสองข้างจนชา\n\nเสียงหูอื้อ ความหวาดกลัวต่อความตาย เสียงลั่นป๊อปและเสียงวิ้งในหู ความรู้สึกลอยเคว้งคว้างราวกับถูกโยนลงมาจากฟากฟ้า…. กูบ้าไปแล้วที่มาร่วมแผนบ้าบอคอแตกนี่…! ออสวัลด์ร้องตะโกนออกมา พลางคว้าไหล่ของอีวานไว้แน่นโดยสัญชาตญาณ\n\n“อั่ก…! อั่ก…! อ๊อก…! เอ๊ะ…?”\n\nเสียงอึกทึกกึกก้องที่กระหน่ำใส่แก้วหูพลันเงียบสงบลงพร้อมเสียงกระแทกทึบ\n\nออสวัลด์มองไปรอบตัวอย่างมึนงง และเห็นยูริกับยูจีนที่หน้าซีดเผือดอยู่ข้างๆ ตัวเอง\n\nพวกเขาต่างกำลังเกาะติดอยู่กับล้อของรถม้า\n\n“อือออ…? อือออ…?”\n\n“โห….”\n\nในระยะไกล พวกเขามองเห็นยอดหอคอยที่เพิ่งกระโดดออกมา ระยะทางขนาดนี้เนี่ยนะ…? เขาขว้างขวานมือมาถึงเนี่ยนะ…? ทั้งคู่หันมามองอีวานอย่างไม่อยากเชื่อสายตา\n\n“แล้วพวกเราจะไม่ถูกจับได้เหรอครับ?”\n\n“ก็ต้องโดนจับได้อยู่แล้วสิ”\n\nทันทีที่สิ้นเสียง หูของอีวานก็จับเสียงเอะอะโวยวายภายในรถม้าได้\n\nคนข้างในนี้ไม่ได้หูหนวก และไม่มีทางเลยที่พวกเขาจะไม่สังเกตเห็นหากรถม้าจู่ๆ ก็เซวูบลงเพราะต้องรับน้ำหนักคนเพิ่มขึ้นมาอีกสี่คนกับแรงกระแทกของขวานอีกหนึ่งดอก\n\nถึงมันจะเปิดประตูรถม้าออกมาดูหรือชะโงกหน้าต่างลงมามองใต้ล้อรถไม่ได้ ก็ไม่ได้หมายความว่าไม่มีปัญหา เพียงแต่มันแค่ประวิงเวลาได้ชั่วครู่เท่านั้น\n\nวินาทีที่รถม้าลงจอดบนดาดฟ้าเรือ พวกเขาจะถูกล้อมกรอบทันที ตัวมกุฎราชกุมารอเล็กซานเดอร์เองคงไม่ได้ขึ้นมานั่งบนรถม้าด้วย แต่ในเมื่อรถม้าที่คนส่งสารโดยสารมาถูกลอบขึ้นได้แบบนี้ ย่อมต้องถูกโจมตีอย่างไม่ต้องสงสัย\n\nกล่าวอีกนัยหนึ่ง แผนการนี้ไม่ได้ตั้งใจจะลอบเร้นตั้งแต่แรกอยู่แล้ว\n\nเมื่อตระหนักถึงความจริงข้อนี้ เหล่าลูกน้องต่างพากันมองอีวานอย่างไม่เชื่อสายตา\n\n“งั้นตอนนี้พวกเราต้องทำยังไงต่อครับ?”\n\n“เกาะไว้”\n\n“หา?”\n\nอีวานจ้องมองออกไปในท้องฟ้ายามค่ำคืนและค่อยๆ ดึงขวานที่ปักคาอยู่บนตัวรถม้าออกมา\n\nเบื้องล่างหมู่เมฆ เรือประจัญบานลอยฟ้ากำลังค่อยๆ เคลื่อนตัวเข้ามาใกล้\n\nหลังจากตรวจดูจนแน่ใจว่าไฟสัญญาณนำทางสำหรับรถม้าลงจอดกำลังส่องสว่างอยู่บนดาดฟ้าเรือ อีวานก็เกี่ยวร่างของออสวัลด์เข้ากับล้อรถม้าแล้วห้อยตัวไว้ด้วยมือข้างเดียว\n\nเขาเล็งขวานที่ชักออกมาตรงไปข้างหน้าอีกครั้งและเอียงศีรษะเล็กน้อย\n\n“โอ้ ไม่นะ ลูกพี่จะทิ้งพวกเราเหรอครับ ลูกพี่จะทิ้งกลุ่มผู้รักชาติเกาหลี ไม่มีความเป็นเพื่อนพ้องเลยเรอะ?”\n\nอีวานเมินเสียงบ่นตะกุกตะกักอันไร้สาระของยูจีน เขายืดแขนไปด้านหลังและหมุนเวียนพลังเวท\n\nสภาพการณ์เช่นนี้ทำให้การแทรกซึมแบบลับๆ เป็นไปไม่ได้ตั้งแต่แรกอยู่แล้ว\n\nถ้าอย่างนั้น การใช้กลยุทธ์ส่งเสียงบูรพาฝ่าตีประจิมย่อมถูกต้องที่สุดไม่ใช่หรือ? หลักนิยมของหน่วยเก็บกวาดคือการสร้างความสับสนให้ศัตรูทันทีก่อนทำการแทรกซึมอยู่เสมอ\n\nตัวล่อ… ไม่เชิงเป็นตัวล่อเสียทีเดียว แต่เป็นการเบี่ยงเบนความสนใจ\n\nยิ่งไปกว่านั้น ในหมู่ผู้ถูกสิงร่างยังมีขุนนางอยู่สองคน คนหนึ่งเป็นทายาทสายทหารระดับสูง ส่วนอีกคนเป็นเอลฟ์\n\nนั่นหมายความว่าต่อให้พวกเขาถูกโจมตี พวกเขาก็จะไม่ตกเป็นเป้าหมายของการประหารชีวิตอย่างรวบรัด และหากมีเพียงนักศึกษาปรากฏตัวขึ้น ก็มีโอกาสสูงที่จะถูกมองว่าเป็นเพียงเรื่องเล่นพิเรนทร์เท่านั้น\n\nนั่นคือเหตุผลที่เขากำชับไว้ว่า “ห้ามสังหารลูกเรือ” เพื่อป้องกันไม่ให้สถานการณ์บานปลายกลายเป็นการต่อสู้เอาเป็นเอาตาย\n\n“เดี๋ยวฉันตามไป”\n\n“ไม่นะ เดี๋ยว คุณ…? คุณ!!!”\n\n– ฟู่วววววววว!!!\n\nอีวานยกขวานขึ้นแล้วขว้างออกไปในจุดหนึ่งในท้องฟ้ายามค่ำคืน แรงถีบอันทรงพลังสั่นสะเทือนรถม้าไปหนึ่งครั้ง และเมื่อเหล่าผู้ถูกสิงร่างลืมตาขึ้นมาอีกครั้ง\n\nอีวานก็ไม่อยู่ตรงนั้นแล้ว เขากำลังพุ่งทะยานฝ่าความมืดมิดของรัตติกาลไปไกลแล้ว\n\n“คุณนี่มันซานตาคลอสบินได้สติเฟื่องชัดๆ ไม่เห็นต้องง้อกวางรูดอล์ฟเลย”\n\n“อะฮ่าฮ่าฮ่า…. แล้วพวกเราจะทำยังไงกันต่อดีล่ะเนี่ย?”\n\n“ไม่รู้สิครับ”\n\nยูจีนขบฟันแน่นขณะจ้องมองดาดฟ้าเรือที่กำลังเคลื่อนเข้ามาใกล้\n\n“ลุยเควสต์ให้มันจบๆ ไปเลย”\n\nถ้ารางวัลเควสต์นี้มันไม่ดีพอละก็ กูจะฆ่าไอ้แถบสถานะเฮงซวยนี่ทิ้งให้จงได้\n\n***\n\nอีวานห้อยตัวอยู่ใต้แนวน้ำของเรือรบ โดยที่ขวานของเขาปักตรึงอยู่กับกราบเรือ\n\nลมหนาวกรรโชกหวีดหวิวอยู่ข้างหู เขาสัมผัสได้ถึงความรู้สึกเคว้งคว้างใต้ฝ่าเท้า และมองเห็นท้องถนนเบื้องล่างที่แต้มไปด้วยแสงไฟเล็กๆ ราวเม็ดทราย\n\nการร่วงหล่นลงไปย่อมหมายถึงความตาย ไม่สิ การตกจากที่สูงระดับนี้แม้แต่เศษชิ้นส่วนแขนขาก็คงไม่เหลือไว้เป็นร่องรอย\n\n“ฮึบ”\n\n– แคร็ก!\n\nขณะห้อยตัวด้วยมือข้างเดียวจากความสูงระดับนั้น เขาบิดเอวอาศัยแรงเหวี่ยงกระแทกเข้าใส่กราบเรือไม้อย่างแรง\n\n– โครม! แกร๊ก! แกร๊ก!\n\n– ฟู่!\n\nมั่นคงและไร้สีหน้า โอนเอนอย่างน่าหวาดเสียวราวกับจะร่วงหล่นลงไปได้ทุกเมื่อ\n\nเงียบเชียบ ราวกับกำลังผ่าฟืนอยู่บนพื้นดินอันมั่นคง\n\nในไม่ช้า กราบเรือไม้ก็พังทลายลง เหลือเป็นช่องโหว่ขนาดใหญ่พอให้คนคนหนึ่งลอดเข้าไปได้\n\n– วี้ดดดด! – วี้ดดดด! – วี้ดดดด! – วี้ดดดด!!!\n\nไฟเตือนภัยในห้องโดยสารกะพริบวาบอย่างบ้าคลั่ง และเขาได้ยินเสียงลูกเรือกำลังวิ่งวุ่นกันไปมา\n\nการเบี่ยงเบนความสนใจประสบความสำเร็จ\n\nอีวานพยักหน้าอย่างเย็นชาแล้วเหวี่ยงตัวพุ่งผ่านช่องว่างอันมืดมิดของกราบเรือเข้าไป\n\nเอาล่ะ ตอนนี้มาถึงที่นี่แล้ว\n\nคนตัดไม้มาถึงแล้ว\n\n***\n\n*เชิงอรรถ: รูดอล์ฟ (Rudolph) คือกวางเรนเดียร์จมูกแดงของซานตาคลอส*"
