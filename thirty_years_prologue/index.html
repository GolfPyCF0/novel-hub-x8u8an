  "glossary": "# 📚 คัมภีร์ตัวละคร คำศัพท์ และสรรพนาม — 30 ปีผ่านไปนับจากบทนำ (30 Years Have Passed Since the Prologue)\n\n## ตัวละครหลัก\n- **อีวาน เปโตรวิช (Ivan Petrovich)** / **คิมซอนอู (Kim Sunwoo)** / **วันก้า (Vanka)**: พระเอก อายุ 34 ปี ชาวเกาหลีที่ข้ามมิติมาเกิดใหม่ในร่างเด็กชายชาวนาตั้งแต่ 30 ปีก่อน เคยรับราชการทหาร 18 ปี (ทหารเกณฑ์ -> ทหารประจำการ -> หน่วยเก็บกวาด) ปัจจุบันเป็นผู้อำนวยการสถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซีย และได้รับมอบหมายให้แฝงตัวไปเป็นคนสวนที่สถาบันเซนต์ยัน ฉายา: *ลูกเขยพระราชา, คนตัดไม้, ผู้สังหารมังกรเจ็ดตัว, ผู้เป็นอมตะ, ทหารกองหนุน*\n  - สรรพนาม: ใช้ *ฉัน / นาย* กับรุ่นน้องในกองทัพ, คิริลลอฟนาเรียกเขาว่า *วันก้า (Vanka)* และใช้ *ข้า / เจ้า*\n\n## ตัวละครรองและกลุ่มตัวละคร\n- **เอลิซาเวตา คิริลลอฟนา คราซิลอฟ (Elizaveta Kirillovna Krasilov)** / **คิริลลอฟนา (Kirillovna)**: อดีตผู้บังคับบัญชาของอีวานในกองทัพ (อีวานเรียก *พันเอกคิริลลอฟนา*, รุ่นน้องบอกตอนอีวานปลดประจำการเธอเป็น *พันตรี*) ปัจจุบันดำรงตำแหน่ง **อัครมหาเสนาบดี (Royal Chancellor)** และเป็น **องค์หญิง (Her Highness)** ฉายาในแนวหน้า: **“ริซ่าแห่งเหล็กกล้า” (Riza of Steel)** ตราประจำตัว: ดอกเบญจมาศ\n- **ดมิทรี เชอร์คาตอฟ (Dmitry / Dmitri Cherkatov)**: นายทหารรุ่นน้องจากหน่วยเก่าของอีวาน ปัจจุบันเป็นสายลับ/เจ้าหน้าที่ใต้บังคับบัญชาของเอลิซาเวตา เรียกอีวานว่า *รุ่นพี่* และใช้ *ผม / คุณ / รุ่นพี่*\n- **มกุฎราชกุมารอเล็กซานเดอร์ (Crown Prince Alexander)**: มีแผนจะแบ่งแยกและขายชาติ\n- **มหาราชา (Great King)**: พระราชาองค์ปัจจุบันที่ยังทรงนิ่งเฉย และเป็นผู้ยกเลิกเกณฑ์จำกัดอายุของสถาบันเซนต์ยัน\n- **ปาร์ตี้ผู้กล้า (Hero Party) และลูกหลาน/ศิษย์**:\n  - **ผู้กล้าแม็กซิมิเลียน (Maximilian)** — ลูกสาว: **อิซาเบลล์ (Isabelle)** (อาชีพคู่: จอมเวทและนักรบ)\n  - **อัศวินจิล (Jill)** — ลูกชาย: **ออสการ์ (Oscar)** (อัศวิน)\n  - **จอมเวทเวียลกริน (Veolgrin)** — ลูกสาว: **เอลเฟียรา (Elpheira / Elphira)** (จอมเวทหญิง)\n  - **กษัตริย์ไอนาร์ อูลริกส์สัน / ไอนาร์มหาราช (Einar Ulriksson / King Einar the Great / บทที่ 2 เรียกพาลาดินไอนาร์)** ฉายา ‘จอมเชือด’ (Butcher) แห่งอาณาจักรโดรเวียน — ธิดาคนโต: **องค์หญิงเอคไดซิส ไอนาร์สดอตตีร์ (Ecdysis Einarsdotir / ชื่อเล่น: เอซี่ Ecy / บทที่ 2 สะกดว่า Esideth)** สมัครเข้าเรียนวิทยาลัยดุริยางคศิลป์ สาขาออร์เคสตรา (ไวโอลิน) ของสถาบันเซนต์ยัน (อาชีพคู่: กวีและเบอร์เซิร์กเกอร์)\n  - **จอมโจรเอนริเก้ (Enrique)** — ศิษย์: **ลูเซีย (Lucia)** (โจรหรือนักฆ่า)\n  - **นักบุญหญิงแพทริเซีย (Saint Patricia)** — ปีนี้เข้ามาเป็นอาจารย์สอนวิชาเทววิทยา (Theology) ที่สถาบันเซนต์ยัน\n- **ฮิวโก้ (Hugo)**: หัวหน้ากลุ่มโจรที่รับงานปล้น/ก่อการร้ายรถไฟสาย 12 ถูกอีวานจับเป็นเพื่อรีดเบาะแส\n- **ฮัสคาลผู้แฝงตัว (คุณลุงของเอคไดซิส)**: หนึ่งในพี่น้องร่วมสาบาน (ฮัสคาล) วัยสี่สิบกว่าปีของกษัตริย์ไอนาร์ ที่สอบผ่านข้อเขียนแบบเฉียดฉิวเข้าเป็นนักศึกษาปี 1 วิทยาลัยพลศึกษาของสถาบันเซนต์ยัน และวิ่งเท้าเปล่าตามรถไฟมาตลอด 2 วันเพื่อคุ้มกันเอคไดซิส\n\n## สถานที่และองค์กร\n- **อาณาจักรคราซิลอฟ (Krasilov Kingdom)**: อาณาจักรที่อีวานอาศัยอยู่และเอลิซาเวตาดำรงตำแหน่งอัครมหาเสนาบดี\n- **อาณาจักรโดรเวียน (Drovian Kingdom)**: อาณาจักรบ้านเกิดของไอนาร์และองค์หญิงเอคไดซิส เชื่อมต่อกับคราซิลอฟผ่านทางรถไฟสายที่ 12 (อดีตปกครองด้วยผู้นำชนเผ่า ‘ยาร์ล’ และมีกองกำลังองครักษ์ ‘เกชิน / ฮัสคาล’)\n- **สถานีอิกอเรวิชี / อิกอรอวิช (Igorevichi / Igorovich Station)**: สถานีรถไฟใกล้ชายแดนโดรเวียน–คราซิลอฟ ก่อนเข้าเขตทหารสามเขต\n- **สถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซีย (St. Basilicia Orphanage)**: สถานเลี้ยงเด็กกำพร้าสำหรับเด็กกำพร้าจากสงครามใกล้นครหลวง ก่อตั้งโดยอีวาน\n- **สถาบันเซนต์ยัน (St. Jan's Academy)**: สถาบันการศึกษานานาชาติชื่อดังแห่งสหราชอาณาจักร ก่อตั้งขึ้นในช่วงสงคราม ไม่จำกัดอายุผู้เข้าเรียน (ประกอบด้วยวิทยาลัยดุริยางคศิลป์ / Music College / Conservatory และวิทยาลัยพลศึกษา / Athletic College)\n- **หน่วยควบคุมเขตฟื้นฟูและพิสูจน์ฝ่ายศัตรู (Restoration Zone Control and Enemy Faction Identification Unit)** / **หน่วยเก็บกวาด / หน่วยกวาดล้าง (Cleanup Unit / Eradication Unit)**: หน่วยเฉพาะกิจที่อีวานสังกัดช่วงสงคราม ทำหน้าที่เก็บกวาดพื้นที่หลังปาร์ตี้ผู้กล้าสังหารผู้นำศัตรู\n\n## คำศัพท์เฉพาะ\n- **ดูแคต (Ducat)**: สกุลเงิน (เงินเดือนทหารเกณฑ์ 15 ดูแคตจากเขตตะวันออก)\n- **บทวิจารณ์ 5,700 ตัวอักษร (5,700-character critique)**: เงื่อนไข/มุกการข้ามมิติของชาวเกาหลีใต้ (เขียนวิจารณ์ยาวๆ จนนักเขียนตอบโต้ว่า \"งั้นลองมาทำเองดูสิ\")\n- **วันเปิดภาคเรียนมานลิตา (Manlita opening day)**: วันเปิดภาคเรียนของสถาบันเซนต์ยัน\n- **ทัณฑ์อินทรีโลหิต (Blood Eagle)**: โทษประหาร/ธรรมเนียมโหดของชาวโดรเวียน\n- **การตรวจจับแนววิถีกระสุน (Line of Fire Detection)** และ **จิตสังหาร (‘life’)**: ความสามารถของยอดฝีมือในการสัมผัสจิตสังหารและวิถีกระสุน/ลูกธนู ทำให้ปืนและธนูไร้ผลกับผู้แข็งแกร่ง\n- **ยาร์ล (Yals) / เกชิน (Geshins) / ฮัสคาล (Huscals)**: ผู้นำชนเผ่าและเหล่านักรบองครักษ์ผู้ภักดีของโดรเวียนที่ไม่รับเงินหรือที่ดิน มีสถานะเสมือนพี่น้องร่วมสาบานของกษัตริย์ไอนาร์\n",
  "story_memory": "# 🧠 เรื่องย่อสะสมแต่ละตอน — 30 ปีผ่านไปนับจากบทนำ (30 Years Have Passed Since the Prologue)\n\n- **บทที่ 1**: คิมซอนอูข้ามมิติมาเกิดใหม่ในร่างเด็กชายชาวนาชื่อ **อีวาน เปโตรวิช** โดยไม่มีหน้าต่างสถานะหรือความรู้เกี่ยวกับเรื่องราวของโลกใบนี้ เมื่ออายุ 14 ปี พ่อถูกเกณฑ์ไปรบและเสียชีวิต อีวานจึงสมัครเป็นทหารเพื่อส่งเงินให้แม่ เขาไต่เต้าจากทหารเกณฑ์จนได้เป็นทหารประจำการและเข้าสังกัด **หน่วยเก็บกวาด** ร่วมค่ายเดียวกับปาร์ตี้ผู้กล้า จนกระทั่งปราบจอมมารได้เมื่ออายุ 30 ปี แต่ฉากจบก็ไม่มาเสียที จึงปลดประจำการตอนอายุ 32 ปีมาเปิดสถานเลี้ยงเด็กกำพร้า จนอายุ 34 ปี (ครบ 30 ปีที่ข้ามมิติ) มีแขกจากวังหลวงมาหา ทำให้เขาเพิ่งรู้ตัวว่าโลกนี้อาจจะกำลังเข้าสู่แนว **สถาบันการศึกษา**\n- **บทที่ 2 (ทหารแก่ก็ต้องการพักผ่อน)**: นายทหารรุ่นน้องจากหน่วยเก่าลอบมาพบอีวานที่สถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซีย พร้อมอัญเชิญจดหมายประทับตราขี้ผึ้งรูปดอกเบญจมาศจาก **เอลิซาเวตา คิริลลอฟนา คราซิลอฟ** (อดีตผู้บังคับบัญชา ฉายา “ริซ่าแห่งเหล็กกล้า” ปัจจุบันเป็นองค์หญิงและอัครมหาเสนาบดี) ในจดหมายขอร้องให้ \"วันก้า\" กลับมาช่วยดูแล \"สวน\" ที่กำลังเสื่อมโทรมท่ามกลางวิกฤตการเมืองที่มกุฎราชกุมารอเล็กซานเดอร์คิดขายชาติ รุ่นน้องเปิดเผยว่าปีนี้บรรดาลูกหลานและศิษย์ของสมาชิกปาร์ตี้ผู้กล้า รวมถึงตัวนักบุญหญิงแพทริเซียเอง ต่างพากันเข้ามาเรียนและสอนที่ **สถาบันเซนต์ยัน** อีวานจึงถูกส่งเข้าไปเป็น \"คนสวน\" เพื่อคอยคุ้มครองและจับตาดูคนเหล่านั้นไม่ให้เกิดเรื่องลุกลามเป็นสงครามระหว่างประเทศ อีวานจำใจรับพระบัญชา โดยหวังว่าอดทนอีกแค่ 3 ปีคงจะได้เห็นฉากจบเสียที\n- **บทที่ 3**: อีวานขุดคุ้ยความทรงจำของคิมซอนอูเพื่อวิเคราะห์สูตรสำเร็จของนิยายแนวสถาบันการศึกษา (ทั้งปีศาจแอบแฝง คนทรยศในคณาจารย์ ห้องลับ สายลับรัฐบาล และเงื่อนไขฉากจบที่อาจเป็นการคืนชีพของจอมมาร) เขาฟันธงว่า \"รถไฟรับนักเรียนเข้าสถาบัน\" จะต้องโดนก่อการร้ายแน่นอน ฝั่งอาณาจักรโดรเวียน **องค์หญิงเอคไดซิส** ธิดาของกษัตริย์ไอนาร์ (ผู้สอบติดสาขาออร์เคสตรา สถาบันเซนต์ยัน) ขึ้นรถไฟออกเดินทางก่อนใคร สองวันต่อมารถไฟขบวนนั้นก็ตกรางใกล้ชายแดนคราซิลอฟ อีวานจึงคว้าปืนพกและขวานออกปฏิบัติการทันที\n- **บทที่ 4**: อีวานวิเคราะห์เส้นทางรถไฟสาย 12 ร่วมกับรุ่นน้อง (**ดมิทรี เชอร์คาตอฟ**) และฟันธงว่าจุดก่อการร้ายจะอยู่ที่ **สถานีอิกอเรวิชี** ใกล้ชายแดนก่อนเข้าสู่เขตทหารสามเขตของคราซิลอฟ เพื่อป้ายความผิดและสร้างรอยร้าวระหว่างคราซิลอฟกับโดรเวียน อีวานขึ้นรถไฟมุ่งหน้าไปชายแดนเพียงลำพังเพื่อคุ้มกันทั้ง 5 เส้นทาง ขณะเดียวกัน ดมิทรีกลับไปรายงาน **เอลิซาเวตา** (อัครมหาเสนาบดี) ที่พระราชวัง ซึ่งเธอสั่งให้ดมิทรีส่งคนติดตามบันทึกกิจวัตรประจำวันของวันก้าไว้ตลอดเวลา เมื่อสายลับของดมิทรีไปถึงสถานีอิกอเรวิชี พวกเขาก็พบเพียงถุงใส่ศพ 3 ใบที่ห่อไว้อย่างเรียบร้อยและสถานที่เกิดเหตุที่ถูกเช็ดคราบเลือดจนสะอาด ส่วนอีวานกำลังวิ่งลัดเลาะป่าพร้อมขวานในมือ\n- **บทที่ 5**: ที่สถานีอิกอรอวิช อีวานสังเกตเห็นชายต้องสงสัย 3 คน (คนดูนาฬิกา-หนังสือพิมพ์, คนแกล้งหลับ, และพ่อค้าผักเหี่ยว) เมื่อทดสอบด้วยคำถามรหัสความภักดีแล้วพบว่าเป็นแค่ทหารรับจ้างไร้ฝีมือตรวจจับแนววิถีกระสุน อีวานจึงสังหารทั้ง 3 คนและรีดข้อมูลจากพ่อค้าผักก่อนฆ่าทิ้งจนรู้ว่ามีโจรอีก 15 คนดักปล้น \"รถไฟขนทองคำแท่ง\" อยู่ริมราง อีวานลบร่องรอยใน 5 นาทีและสะกดรอยตามสัญญาณเวทมนตร์ไป โดยตั้งใจปล่อยให้เหตุการณ์ก่อการร้ายรถไฟซึ่งเป็น \"ด่านฝึกสอนของตัวเอกทุกคน\" ดำเนินไป แต่ตัวเองจะคอยเก็บกวาดเบื้องหลังและสาวถึงตัวบงการแทน\n- **บทที่ 6**: หัวหน้าโจร **ฮิวโก้** กดจุดระเบิดทำให้รถไฟที่เอคไดซิสโดยสารมาตกรางก่อนถึงสถานีอิกอรอวิช อีวานซุ่มยิงเก็บลูกสมุน 5 คนที่อยู่แนวหลังได้อย่างเฉียบขาดและจับเป็นฮิวโก้เพื่อทรมานรีดเบาะแสเกี่ยวกับผู้จ้างวาน (ไม่ฆ่าเพราะกะเก็บไว้เป็นบอสฝึกสอนให้ตัวเอก) บนรถไฟ **องค์หญิงเอคไดซิส** ฟื้นขึ้นมาและคว้าไวโอลินขึ้นมากำด้ามราวกับขวานเตรียมสู้ ขณะเดียวกันที่ชายป่า นักรบ **ฮัสคาล** วัยสี่สิบกว่าปีซึ่งเป็น \"คุณลุง/พี่น้องร่วมสาบาน\" ของกษัตริย์ไอนาร์ (และแอบสอบเข้าเป็นนักศึกษาปี 1 วิทยาลัยพลศึกษาของสถาบันเซนต์ยันไว้ล่วงหน้า) ที่วิ่งเท้าเปล่าตามรถไฟมาตลอด 2 วัน เห็นรถไฟตกรางจึงพุ่งทะยานฝ่าป่าเข้าไปช่วยหลานสาวทันที\n"
};

</script>
  <script>
    const STORAGE_PREFIX = "thirty_years_prologue";
    const data = window.NOVEL_DATA || { novel_title: "30 ปีผ่านไปนับจากบทนำ (30 Years Have Passed Since the Prologue)", chapters: [], illustrations: [] };
    let currentIdx = parseInt(localStorage.getItem(STORAGE_PREFIX + "_ch_idx") || "0", 10);
    let fontSize = parseInt(localStorage.getItem("novel_reader_font_size") || "20", 10);
    let theme = localStorage.getItem("novel_hub_theme") || "dark";
    let currentVolIdx = 0;
    let illustViewMode = localStorage.getItem("novel_reader_illust_view") || "vertical";
    let currentLightboxIdx = 0;

    function goBookshelf() {
      if (location.protocol === "file:") {
        location.href = "../คลังนิยายทั้งหมด.html";
      } else {
        location.href = "../index.html";
      }
    }

    function formatBody(text) {
      const paras = text.split(/\n\s*\n/);
      return paras.map(p => {
        const trimmed = p.trim();
        if (!trimmed) return "";
        if (trimmed === "***" || trimmed === "...") return "<hr/>";
        const html = trimmed
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/\n/g, "<br/>");
        return `<p>${html}</p>`;
      }).join("");
    }

    function updateIllustButtonLabel() {
      const vols = data.illustrations || [];
      const total = vols.reduce((acc, v) => acc + ((v.images || []).length), 0);
      const btn = document.getElementById("btnIllust");
      if (btn) {
        btn.textContent = total > 0 ? `🖼️ ภาพประกอบ (${total})` : `🖼️ ภาพประกอบ`;
      }
    }

    function render() {
      document.getElementById("novelTitle").textContent = data.novel_title || "คลังนิยาย";
      updateIllustButtonLabel();
      const chapters = data.chapters || [];
      if (currentIdx >= chapters.length) currentIdx = Math.max(0, chapters.length - 1);

      const volSel = document.getElementById("volumeSelect");
      const sel = document.getElementById("chapterSelect");
      volSel.innerHTML = "";
      sel.innerHTML = "";

      const ch = chapters[currentIdx];
      if (!ch) {
        document.getElementById("volumeBadge").textContent = "";
        document.getElementById("chapterTitle").textContent = "ยังไม่มีตอนที่แปล";
        document.getElementById("chapterBody").innerHTML = "";
        return;
      }

      const volumes = [];
      chapters.forEach(item => {
        const v = item.volume || "เล่ม 1";
        if (!volumes.includes(v)) volumes.push(v);
      });
      volumes.forEach(v => {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = `📘 ${v}`;
        volSel.appendChild(opt);
      });

      const currentVol = ch.volume || "เล่ม 1";
      volSel.value = currentVol;
      volSel.style.display = volumes.length > 1 ? "" : "none";

      chapters.forEach((item, idx) => {
        if ((item.volume || "เล่ม 1") !== currentVol) return;
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = `${item.title}`;
        sel.appendChild(opt);
      });
      sel.value = currentIdx;

      document.getElementById("volumeBadge").textContent = `📘 ${currentVol}`;
      document.getElementById("chapterTitle").textContent = ch.title;
      document.getElementById("chapterBody").innerHTML = formatBody(ch.content);
      document.getElementById("pageIndicator").textContent = `${currentVol} • ตอนที่ ${currentIdx + 1} จากทั้งหมด ${chapters.length} ตอนที่แปลแล้ว`;

      const hasPrev = currentIdx > 0;
      const hasNext = currentIdx < chapters.length - 1;
      document.getElementById("btnPrevTop").disabled = !hasPrev;
      document.getElementById("btnPrevBottom").disabled = !hasPrev;
      document.getElementById("btnNextTop").disabled = !hasNext;
      document.getElementById("btnNextBottom").disabled = !hasNext;

      localStorage.setItem(STORAGE_PREFIX + "_ch_idx", String(currentIdx));
    }

    function selectVolume(volName) {
      const chapters = data.chapters || [];
      const firstIdx = chapters.findIndex(item => (item.volume || "เล่ม 1") === volName);
      if (firstIdx !== -1) {
        selectChapter(firstIdx);
      }
    }

    function selectChapter(idx) {
      currentIdx = parseInt(idx, 10);
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function prevChapter() { if (currentIdx > 0) selectChapter(currentIdx - 1); }
    function nextChapter() { if (currentIdx < (data.chapters || []).length - 1) selectChapter(currentIdx + 1); }

    function changeFont(delta) {
      fontSize = Math.max(14, Math.min(32, fontSize + delta));
      document.documentElement.style.setProperty("--font-size", fontSize + "px");
      localStorage.setItem("novel_reader_font_size", String(fontSize));
    }

    function setTheme(t) {
      theme = t;
      document.body.classList.remove("theme-sepia", "theme-light");
      if (t !== "dark") {
        document.body.classList.add("theme-" + t);
      }
      document.getElementById("tDark").classList.toggle("active", t === "dark");
      document.getElementById("tSepia").classList.toggle("active", t === "sepia");
      document.getElementById("tLight").classList.toggle("active", t === "light");
      localStorage.setItem("novel_hub_theme", t);
    }

    function toggleMenu(hide) {
      const shouldHide = typeof hide === "boolean"
        ? hide
        : !document.body.classList.contains("menu-hidden");
      document.body.classList.toggle("menu-hidden", shouldHide);
      localStorage.setItem("novel_reader_menu_hidden", shouldHide ? "1" : "0");
    }

    function openModal(type) {
      const m = document.getElementById("infoModal");
      const title = document.getElementById("modalTitle");
      const content = document.getElementById("modalContent");
      if (type === "glossary") {
        title.textContent = "📚 คัมภีร์ตัวละคร คำศัพท์ และสรรพนาม";
        content.textContent = data.glossary || "";
      } else {
        title.textContent = "🧠 เรื่องย่อสะสมแต่ละตอน";
        content.textContent = data.story_memory || "";
      }
      m.classList.add("open");
    }
    function closeModal() {
      document.getElementById("infoModal").classList.remove("open");
    }

    function openIllustModal() {
      const vols = data.illustrations || [];
      const firstWithImgs = vols.findIndex(v => (v.images || []).length > 0);
      if (firstWithImgs !== -1 && ((vols[currentVolIdx] || {}).images || []).length === 0) {
        currentVolIdx = firstWithImgs;
      }
      renderIllustModal();
      document.getElementById("illustModal").classList.add("open");
    }
    function closeIllustModal() {
      document.getElementById("illustModal").classList.remove("open");
    }
    function setIllustView(mode) {
      illustViewMode = mode;
      localStorage.setItem("novel_reader_illust_view", mode);
      renderIllustModal();
    }
    function selectIllustVol(idx) {
      currentVolIdx = idx;
      renderIllustModal();
    }
    function renderIllustModal() {
      const vols = data.illustrations || [];
      const tabList = document.getElementById("volTabList");
      const container = document.getElementById("illustContainer");
      document.getElementById("btnViewVertical").classList.toggle("active", illustViewMode === "vertical");
      document.getElementById("btnViewGrid").classList.toggle("active", illustViewMode === "grid");

      tabList.innerHTML = "";
      vols.forEach((v, idx) => {
        const count = (v.images || []).length;
        const btn = document.createElement("button");
        btn.className = idx === currentVolIdx ? "active" : "";
        btn.textContent = `📁 ${v.volume} (${count})`;
        btn.onclick = () => selectIllustVol(idx);
        tabList.appendChild(btn);
      });

      const activeVol = vols[currentVolIdx];
      const imgs = activeVol ? (activeVol.images || []) : [];

      if (!activeVol || imgs.length === 0) {
        const folderName = activeVol ? activeVol.volume : "เล่ม 1";
        container.innerHTML = `
          <div class="empty-illust-guide">
            <strong style="color: var(--accent); font-size: 16px;">💡 ยังไม่มีรูปภาพในโฟลเดอร์ "${folderName}"</strong>
            <p style="margin: 10px 0 6px;">วิธีเพิ่มภาพประกอบไลท์โนเวลแบบแยกตามเล่มง่ายๆ:</p>
            <ol style="margin: 0; padding-left: 22px;">
              <li>นำไฟล์รูปภาพ (<code>.jpg</code>, <code>.png</code>, <code>.webp</code>) ไปวางใส่โฟลเดอร์ <code>illustrations/${folderName}/</code> (หรือสร้างโฟลเดอร์ <code>เล่ม 1</code>, <code>เล่ม 2</code>, <code>เล่ม 3</code> เพิ่มได้ตามต้องการ)</li>
              <li>ตั้งชื่อไฟล์เรียงตามลำดับ เช่น <code>00_cover.jpg</code>, <code>01.jpg</code>, <code>02.jpg</code> ระบบจะเรียงรูปให้ตามตัวเลขและนำรูป cover ขึ้นเป็นหน้าปกให้เอง</li>
              <li>ดับเบิลคลิกไฟล์ <code>เปิดคลังนิยายทั้งหมด.bat</code> หรือ <code>เปิดอ่านนิยาย.bat</code> รูปทั้งหมดจะแสดงในหน้านี้ทันทีครับ!</li>
            </ol>
          </div>
        `;
        return;
      }

      const listClass = illustViewMode === "grid" ? "illust-list-grid" : "illust-list-vertical";
      container.innerHTML = `<div class="${listClass}">` + imgs.map((img, i) => `
        <div class="illust-card" onclick="openLightbox(${i})">
          <img src="${encodeURI(img.src)}" alt="${img.name}" loading="lazy" />
          <div class="illust-caption">${i + 1}. ${img.name}</div>
        </div>
      `).join("") + `</div>`;
    }

    function openLightbox(imgIdx) {
      const vols = data.illustrations || [];
      const imgs = (vols[currentVolIdx] || {}).images || [];
      if (!imgs.length) return;
      currentLightboxIdx = (imgIdx + imgs.length) % imgs.length;
      const item = imgs[currentLightboxIdx];
      document.getElementById("lightboxImg").src = encodeURI(item.src);
      document.getElementById("lightboxCaption").textContent = `[${vols[currentVolIdx].volume}] รูปที่ ${currentLightboxIdx + 1}/${imgs.length} — ${item.name}`;
      document.getElementById("lightbox").classList.add("open");
    }
    function stepLightbox(delta) {
      openLightbox(currentLightboxIdx + delta);
    }
    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("open");
    }

    document.addEventListener("keydown", (e) => {
      const lbOpen = document.getElementById("lightbox").classList.contains("open");
      if (lbOpen) {
        if (e.key === "ArrowLeft") stepLightbox(-1);
        if (e.key === "ArrowRight") stepLightbox(1);
        if (e.key === "Escape") closeLightbox();
        return;
      }
      if (e.key === "ArrowLeft") prevChapter();
      if (e.key === "ArrowRight") nextChapter();
      if (e.key === "m" || e.key === "M") toggleMenu();
      if (e.key === "Escape") {
        closeModal();
        closeIllustModal();
      }
    });

    document.documentElement.style.setProperty("--font-size", fontSize + "px");
    setTheme(theme);
    if (localStorage.getItem("novel_reader_menu_hidden") === "1") {
      toggleMenu(true);
    }
    render();
  </script>

  <div id="pinGateOverlay" style="display:none; position:fixed; inset:0; z-index:99999; background:#0f172a; color:#e2e8f0; flex-direction:column; align-items:center; justify-content:center; padding:20px; font-family:'Sarabun','Segoe UI',sans-serif;">
    <div style="background:#1e293b; border:1px solid #334155; border-radius:14px; padding:28px 26px; max-width:340px; width:100%; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.4);">
      <div style="font-size:38px; margin-bottom:8px;">🔒</div>
      <div style="font-size:18px; font-weight:bold; color:#38bdf8; margin-bottom:6px;">คลังนิยายส่วนตัว</div>
      <div style="font-size:13px; color:#94a3b8; margin-bottom:16px;">กรอกรหัส PIN เพื่อเข้าอ่าน (จำรหัสอัตโนมัติในเครื่องนี้)</div>
      <input id="pinGateInput" type="password" inputmode="numeric" placeholder="รหัส PIN..." style="width:100%; padding:10px 12px; font-size:18px; text-align:center; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#f8fafc; margin-bottom:12px;" onkeydown="if(event.key==='Enter') checkPinGate()" />
      <button onclick="checkPinGate()" style="width:100%; padding:10px; font-size:15px; font-weight:bold; border-radius:8px; border:none; background:#38bdf8; color:#020617; cursor:pointer;">เข้าสู่คลังนิยาย</button>
      <div id="pinGateErr" style="color:#f87171; font-size:13px; margin-top:10px; display:none;">❌ รหัส PIN ไม่ถูกต้อง</div>
    </div>
  </div>
  <script>
    (function() {
      const EXPECTED_PIN = "0909";
      if (localStorage.getItem("novel_hub_pin_ok") !== EXPECTED_PIN) {
        const gate = document.getElementById("pinGateOverlay");
        if (gate) gate.style.display = "flex";
      }
      window.checkPinGate = function() {
        const val = (document.getElementById("pinGateInput").value || "").trim();
        if (val === EXPECTED_PIN) {
          localStorage.setItem("novel_hub_pin_ok", EXPECTED_PIN);
          document.getElementById("pinGateOverlay").style.display = "none";
        } else {
          document.getElementById("pinGateErr").style.display = "block";
        }
      };
    })();
  </script>
</body>
</html>
