      "title": "บทที่ 14",
      "content": "– บึ้ม!\n\n– เคร้ง!!\n\nพอได้ยินเสียงปะทะดังขึ้นเป็นระยะๆ แบบนั้น ก็สัมผัสได้ทันทีเลยว่าพวกศัตรูกำลังแตกกระเจิง\n\nมันไม่ใช่แค่เพราะพวกมันฝึกฝนมาไม่ดีหรอก แต่มันเป็นเรื่องที่เกิดขึ้นแน่นอนต่างหาก โดยเฉพาะในหมู่กองกำลังระดับหัวกะทิ\n\nเวลาถูกซุ่มโจมตี นายทหารที่เก่งกาจจะประเมินจำนวนศัตรูจากความถี่ในการโจมตี\n\nเมื่อเช็กดูระยะห่างระหว่างเสียงปืนแต่ละนัด ก็เห็นได้ชัดเลยว่าฝ่ายศัตรูมีกันอยู่แค่หยิบมือเดียว\n\nมาถึงจุดนี้ทุกอย่างยังดูสมเหตุสมผลดีอยู่ ทว่าปัญหาคือ เสียงปืนพวกนั้นไม่ได้ดังมาจากทิศทางเดียวในผืนป่านี้น่ะสิ\n\nปัง จากทางทิศตะวันออก พอเคลื่อนกำลังพลไปทางนั้น จู่ๆ ก็เจอเพียงศพไม่กี่ร่างนอนกระจัดกระจายอยู่ตรงจุดนั้น\n\nพอทหารแตกแถวกันไปเพราะความสับสน ปัง ดังขึ้นอีกครั้งจากทางทิศตะวันตก\n\nถึงตอนนี้ก็พอเดาได้แล้วว่าผู้บัญชาการฝั่งศัตรูกำลังคิดทำอะไรอยู่ “พวกมันส่งหน่วยย่อยออกมาเพื่อต้อนพวกเราเข้าไปในกับดัก”\n\nเป็นการประเมินที่ฉลาดหลักแหลม ยกเว้นเสียแต่ว่าคู่ต่อสู้จะเป็นแค่ผู้บัญชาการหน่วยขนาดเล็กจริงๆ น่ะนะ\n\nกริ๊ก\n\nสัมผัสได้ถึงความตึงเครียดและความเดือดดาลในอากาศของผืนป่า อีวานค่อยๆ ยกปืนพกขึ้นมา ด้านหน้ามีทหารสามคนถือคบเพลิงกำลังกวาดสายตาตรวจตราไปรอบๆ\n\nเป็นท่าทีที่ดูไม่ออกว่าเกิดจากความกลัวหรือความโกรธ เพราะอยู่ไกลเกินกว่าจะแยกแยะได้\n\nอีวานผ่อนลมหายใจออกช้าๆ กลั้นหายใจไว้ครึ่งหนึ่ง เหนี่ยวไกอย่างมั่นคง เล็งไปที่ศัตรู คำนวณระยะทาง แล้วยกปากกระบอกปืนขึ้นอีกเล็กน้อย\n\nลื่นไหลดุจสายน้ำ ราวกับเป็นสัญชาตญาณที่เคลื่อนไหวไปเอง\n\nทั้งหมดนั้นใช้เวลาเพียงแค่ 0.3 วินาที\n\nดวงตาสีฟ้าสดใสที่เบิกกว้างกวาดมองสภาพแวดล้อมรอบข้างอย่างรวดเร็ว ระยะห่างระหว่างทหารแต่ละคน ส่วนสูง และระยะทางจากตัวเขาล้วนถูกคำนวณเสร็จสรรพ\n\nหลังจากคำนวณแล้ว เขาจึงโฟกัสไปที่คนซึ่งอยู่ไกลที่สุด\n\nปัง!\n\nสิ้นเสียงปืน ปืนพกก็ถูกลดลง และเขาก็คว้าขวานขึ้นมาแทน ไม่จำเป็นต้องเช็กผลงานเลย พวกมันกำลังตะโกนบอกให้รู้เองอยู่แล้ว\n\n“บ้าเอ๊ย! อินอฟโดนยิงแล้ว!”\n\n“พวกมันอยู่ไหน? โผล่หัวออกมาสิวะ โธ่เว้ย!!”\n\nเขากระโจนข้ามแมกไม้ไปอย่างคล่องแคล่ว คบเพลิงที่พวกมันถืออยู่นั่นแหละที่เป็นตัวชี้เป้าชั้นดี\n\nการจุดไฟในป่ามันเปิดเผยตำแหน่งมากเกินไป ถึงไม่มีคบเพลิงป่านี่ก็จะมืดจนมองไม่เห็นอะไรเลยก็เถอะ แต่ใครใช้ให้พวกมันเลือกวันนี้กันล่ะ?\n\nพวกมันไม่ควรเลือกวันนี้เป็นวันลงมือตั้งแต่แรก\n\nการซุ่มโจมตีในเวลากลางคืนเป็นเรื่องที่ยากแสนเข็ญ มันต้องอาศัยผู้บัญชาการระดับยอดฝีมือและกำลังพลที่ฝึกฝนมาอย่างสมบูรณ์แบบ\n\nต่อให้เป็นคนระดับนั้น ก็ยังต้องลังเลเมื่อเจอการซุ่มโจมตีแบบไม่ทันตั้งตัวในป่าต่างถิ่นยามวิกาล เผลอๆ ราวหนึ่งในสามคงคิดถอดใจหนีตั้งแต่ปฏิบัติการเริ่มขึ้นด้วยซ้ำ\n\n“ดูท่าศัตรูจะมีทั้งหมดราวๆ 50 คนสินะ”\n\nประเมินจากการกระจายกำลังของศัตรูและขนาดของหน่วยย่อย อีวานคาดคะเนพลางกุมด้ามขวานที่ยังคงสับค้างอยู่บนร่างทหารที่เขาเพิ่งฟันไป\n\n– อ๊ากกกก—!!\n\n“อ๊า! อ๊ากกก!!”\n\nหมอนี่ขี้ขลาดชะมัด แต่ไอ้คนที่โดนขวานจามก่อนหน้านี้ไม่มีโอกาสแม้แต่จะกรีดร้องออกมา\n\nดูเหมือนหมอนั่นจะผ่านการฝึกมาเป็นอย่างดี การยกปืนขึ้นเล็งทันทีที่อีวานปรากฏตัวคือหลักฐานยืนยันข้อนั้น\n\nอีวานก้มตัวลง ปลายนิ้วที่สั่นเทาของอีกฝ่ายกำลังเหนี่ยวรั้งไกปืน\n\nในระยะประชิดขนาดนี้ไม่จำเป็นต้องเล็ง และหมอนั่นก็ลนลานเกินกว่าจะเล็งได้แล้ว มันกำลังจะสาดกระสุนด้วยความตื่นตระหนก\n\nแต่มันไม่มีวันได้ทำแบบนั้นหรอก\n\n“โธ่เว้ย! ตายซะ!!”\n\nหมอนั่นเกร็งต้นขา เส้นเลือดปูดโปนขึ้นบนหลังมือ\n\nทว่าในเสี้ยววินาทีนั้น อีวานที่ประชิดตัวอยู่แล้วก็ตวัดขวานออกไป\n\nไหล่ขวาและลำคอแหลกสลายในการฟันเพียงครั้งเดียว ‘แหลกสลาย’ ไปจริงๆ ตามตัวอักษร\n\nการฟาดฟันอันทรงพลัง ก่อนจะหมุนตัวฟันซ้ำอีกรอบ และอีกรอบอย่างรวดเร็ว\n\nขวานฟาดฟันสามครั้งในชั่วพริบตา ไม่มีใครในที่นี้สามารถเอื้อนเอ่ยอะไรได้อีกต่อไป\n\n“ฟู่”\n\nอีวานผ่อนคลายหัวไหล่ แล้วเก็บขวานเข้าที่\n\nเขาจัดท่าให้ปืนในมือของทหารนิรนามเล็งชี้ขึ้นฟ้า ผูกเส้นด้ายบางๆ เข้ากับไกปืน แล้วนำไปเกี่ยวไว้กับต้นไม้ใกล้ๆ\n\nตราบใดที่ปืนถูกยึดแน่นอยู่ในอ้อมแขนของศพ งานตรงนี้ก็เป็นอันเสร็จสมบูรณ์\n\nเดี๋ยวต้องมีคนเดินมาตรวจสอบเมื่อได้ยินเสียงปืน\n\nพอพวกมันแตะต้องศพ ปืนที่ขึ้นลำไว้ก็จะลั่นขึ้น และฝ่ายบัญชาการก็น่าจะคำนวณตำแหน่งของอีวานผิดพลาดท่ามกลางความโกลาหล\n\nความล่าช้าในการส่งข้อมูลไปยังหน่วยบัญชาการ ทัศนวิสัยที่จำกัดในป่ามืด ความหวาดกลัวต่อสถานที่แปลกหน้า ข้อมูลที่ปั่นป่วน และการที่กำลังพลค่อยๆ ร่อยหรอลงเรื่อยๆ\n\nต่อให้เป็นศัตรูที่ฉลาดหลักแหลมก็ถูกปั่นหัวได้ง่ายๆ\n\nอีวานครุ่นคิดพลางเคลื่อนตัวผ่านแมกไม้ไปอย่างรวดเร็ว\n\nแต่ว่านะ มันมีบางอย่างผิดปกติ\n\nศัตรูชุดนี้เก่งเกินไปกว่าจะเป็นแค่ด่านฝึกสอนธรรมดาๆ\n\n“ดิอัน ออกัสต์ เป็น NPC ที่คอยช่วยด่านฝึกสอนของอิซาเบลล์แล้วก็ตายหายไปสินะ”\n\nอีวานหรี่ตาลง\n\nในสถานการณ์เละเทะแบบนี้ ถ้าไม่มีเขา อิซาเบลล์ตัวคนเดียวจะรอดชีวิตและหนีออกจากป่านี่ไปได้งั้นเหรอ?\n\nเมื่อพิจารณาจากอาวุธหนัก กองกำลังที่ฝึกมาอย่างดี และการบัญชาการที่ยอดเยี่ยมของฝั่งศัตรู\n\nนั่นมันระดับความเสี่ยงที่เด็กสาววัยเพิ่งย่างเข้ายี่สิบไม่มีทางรับมือไหวแน่\n\n“ทำไมล่ะ…? เงื่อนไขของด่านฝึกสอนไม่ใช่การกวาดล้างศัตรูหรอกเหรอ?”\n\nบางครั้งมันก็ใช่ เกมที่คุณต้องเรียนรู้วิธีบังคับตัวละครไปพร้อมกับหลบหนีศัตรูสุดแกร่ง\n\nแต่ยังไงล่ะ? แล้วไปที่ไหน?\n\nเมื่อนึกถึงระยะทางที่เหลือกว่าจะถึงเฟรเชนกายา โอกาสที่เด็กสาวไร้ประสบการณ์ซึ่งไม่รู้ด้วยซ้ำว่าต้องเดินไปทางไหน จะหนีออกจากป่านี้ได้อย่างปลอดภัยแทบจะเป็น 0%\n\nแม้จะอยู่ท่ามกลางความโกลาหลทั้งหมดนี้ อีวานก็ยังคงเคลื่อนไหวไม่หยุด\n\nเอาไว้ค่อยมาคิดทบทวนสถานการณ์หลังจากความวุ่นวายจบลงก็ยังไม่สาย\n\n—\n\n“หัวหน้า เกิดเรื่องอีกแล้วครับ คราวนี้โดนขวานจามตายเรียบทั้งสามคนเลย”\n\n“อืม อะไรกันเนี่ย….”\n\nชายคนนั้นเกาปลายคางพลางครางในลำคอ\n\nความรู้สึกเหมือนกำลังรับมือกับเสือร้ายอยู่เลย\n\nการไล่เก็บอย่างเป็นระบบ เริ่มจากพวกที่อ่อนแอกว่า แล้วค่อยๆ บีบคอของทั้งกลุ่มคือกยุทธศาสตร์การล่าเหยื่อ\n\nวิธีรับมือนั้นแสนง่าย: แค่รวมกลุ่มกำลังพลเข้าด้วยกัน\n\nทว่าเขาทำแบบนั้นไม่ได้ เป้าหมายของเขาคือ ‘ลูกสาวของผู้กล้า’\n\n“พวกเราไม่ควรเรียกคนมารวมตัวกันตอนนี้เหรอครับ…?”\n\n“ไม่ นั่นแหละคือสิ่งที่ศัตรูต้องการ”\n\nศัตรูมีกันแค่หยิบมือเดียว เห็นได้ชัดอยู่แล้ว\n\nพวกมันคงไม่มาลำบากวางแผนซับซ้อนขนาดนี้หรอกถ้ามีกำลังพลมากกว่าพวกเรา\n\nสมมติว่ามีหน่วยจู่โจมขนาดเล็กที่เป็นยอดฝีมือระดับพระกาฬกระจายตัวกันอยู่ทั่วผืนป่า\n\n– ปัง!\n\nเสียงปืนดังขึ้นอีกแล้ว คราวนี้มาจากทางทิศตะวันตก\n\nและจากนั้น\n\n– ปัง!\n\nคราวนี้มาจากทางทิศเหนือ\n\nเสียงปืนเริ่มขยับเข้ามาใกล้จุดที่พวกเขาอยู่มากขึ้นเรื่อยๆ\n\n“พวกมันรู้ตำแหน่งของพวกเราแล้ว”\n\n“รู้แล้วเหรอครับ?”\n\n“พวกมันรู้ว่าที่นี่คือฐานบัญชาการของพวกเรา! ไอ้โง่! มองไม่ออกหรือไง?”\n\n“อ้อ จริงด้วย เออ ใช่ ผมเข้าใจแล้ว เข้าใจแล้ว แต่ว่า… ทำไมพวกมันไม่บุกโจมตีพวกเราตรงๆ หลังจากเจอฐานแล้วล่ะครับ? ไล่เก็บทหารที่กำลังสับสนทีละคนมันจะไม่ง่ายกว่าเหรอ?”\n\nทำไมศัตรูพวกนี้ถึงได้ทำเรื่องให้มันยุ่งยากซับซ้อนนัก?\n\nนั่นก็เป็นเพราะว่า…\n\n– ปัง!\n\n– ปัง!\n\nหลังจากเสียงปืนสองนัดดังขึ้นมาจากคนละทิศทาง ความจริงบางอย่างก็แล่นปราดเข้ามาในหัวของชายคนนั้น\n\n“ส่งปืนของแกมาให้ฉัน”\n\n“หา? อ้อ ได้ครับ!”\n\nเขากระชากปืนของลูกน้องมาแล้วยิงขึ้นฟ้า ปัง!\n\nชายคนนั้นนิ่งอึ้งไปชั่วครู่ ก่อนจะเอ่ยออกมา\n\n“มันมีแค่คนเดียว”\n\n“แต่หัวหน้า ทิศทางของเสียงปืนเมื่อกี้นี้…!”\n\n“บ้าเอ๊ย มันเป็นกลลวง!!”\n\n– เพล้ง!\n\nชายคนนั้นฟาดปืนในมือลงกับพื้นอย่างแรง\n\n“นั่นมันเสียงปืนของพวกเราเอง! ไอ้หมอนั่นฆ่าคนของเราแล้วเอาปืนมาเล่นกับจังหวะเวลา! กับดักตื้นๆ ที่แม้แต่เด็กก็ทำได้ แต่พวกเรากลับหลงกลมันเต็มเปา!”\n\nเขาโยนซากปืนทิ้งแล้วชักมีดออกมา\n\n“หลังจากยิงนัดแรก ไอ้หมอนั่นคงเฝ้าดูปฏิกิริยาตอบโต้ของพวกเรา มันมีวิธีมองเห็นด้วยหรือไงว่าพวกเราจะส่งคนมาจากทางไหน?! พวกเราตอบสนองเร็วเกินไป โธ่เว้ย!”\n\nตามปกติ ทหารทั่วไปมักจะหาที่กำบังเมื่อได้ยินเสียงปืน\n\nทว่าที่นี่ไม่ใช่สถานการณ์ปกติ หัวหน้าของพวกเขามีความสามารถในการตรวจจับทิศทางของเสียงปืนได้\n\nทันทีที่ได้ยินเสียงปืน พวกเขาก็ประเมินทิศทางและส่งทีมออกไปตรวจสอบทันที นั่นแหละคือความผิดพลาด\n\n“ทำไมถึงไม่บุกเข้ามาซัดกันซึ่งๆ หน้าเลยล่ะ?! พวกมันไม่มั่นใจ หรือกำลังถ่วงเวลาในสถานการณ์ที่เสียเปรียบอยู่กันแน่? ทำไมคนที่ผ่านการฝึกฝนระดับนั้นถึงต้องมาคิดอะไรแบบนั้นด้วยฮะ?”\n\n“เอ่อ หรือว่า… มันมาคนเดียวจริงๆ…?”\n\n“เออสิวะ! บ้าฉิบ เสียงปืนพวกนั้นเป็นเหยื่อล่อมาตั้งแต่แรกแล้ว! เรียกทุกคนมารวมตัวกัน! โธ่เว้ย ฉันไม่อยากจะเผชิญหน้ากับลูกสาวของผู้กล้าตรงๆ เลยแท้ๆ…”\n\nรอยแผลเป็นบนใบหน้าของชายคนนั้นบิดเบี้ยวไปมา\n\n“ลูกสาวของผู้กล้า: ต่อให้เป็นนักรบที่ยังฝึกฝนไม่สมบูรณ์ แต่ลูกเสือก็ยังคงเป็นเสืออยู่วันยังค่ำ”\n\nเขายังจดจำภาพของผู้กล้าได้ติดตา ร่างอันทรงพลังอย่างเหลือเชื่อนั้น\n\nไม่ว่าจะยังเด็กแค่ไหน ก็ห้ามประมาทเด็ดขาด ในตอนนั้น ผู้กล้าเองก็เป็นแค่ชายหนุ่มวัยสามสิบต้นๆ เท่านั้น\n\nชายคนนั้นถอนหายใจเฮือกใหญ่แล้วก้าวเท้าออกไปข้างหน้า\n\n“ฉันจะไปจัดการนังผู้หญิงคนนั้นด้วยตัวเอง แกพาลูกน้องไปจัดการตัวป่วนในป่าซะ”\n\n“ครับ หัวหน้า!”\n\n***\n\n“เจ้าคือลูกสาวของผู้กล้างั้นรึ?”\n\nอิซาเบลล์ยืนหยัดอยู่ใต้แสงจันทร์ เผชิญหน้ากับชายที่ก้าวออกมาจากชายป่า\n\nด้านหลังของเธอ ผู้คนต่างรวมตัวกันด้วยความหวาดกลัว\n\nรอบกองไฟ ผู้คนตัวสั่นสะท้านท่ามกลางความหนาวเหน็บ ต่างจ้องมองมาที่เธอ\n\nอิซาเบลล์ส่ายหน้า หลับตาลง สูดลมหายใจเข้าลึก พลิกฝักดาบอันหนักอึ้งในมือ แล้วกำมันไว้มั่น\n\n“ไม่ใช่”\n\nเธอลืมตาขึ้น แสงจันทร์ช่วยให้มองเห็นโครงร่างของชายตรงหน้าได้ชัดเจนยิ่งขึ้น\n\nการต่อสู้เพื่อเอาชีวิตรอด ไม่ต้องพูดถึงการแบกรับชีวิตของผู้อื่นเข้าสู่สมรภูมิ นี่เป็นครั้งแรกในชีวิตของเธอ\n\nทว่าไม่เป็นไร เพราะมันคือสิ่งที่ ‘ถูกต้อง’ ที่สมควรทำ\n\n“ฉันคือลูกสาวของแม็กซิมิเลียนและมารี”\n\nไม่ใช่ลูกสาวของผู้กล้า แต่เป็นลูกสาวของใครบางคน\n\nด้วยความหมายนั้นเอง\n\nชายตรงหน้าเธอหัวเราะออกมาอย่างเต็มเสียง\n\nเขาคู่หนึ่งบนศีรษะของเขาทะยานชี้ขึ้นสู่ท้องฟ้า\n\nปีศาจ อิซาเบลล์กลืนน้ำลายลงคออย่างยากลำบาก นี่เป็นครั้งแรกของเธอที่ได้เผชิญหน้ากับปีศาจเช่นกัน\n\n“เยี่ยมมาก”\n\nชายคนนั้นพยักหน้าพลางกระชับดาบในมือ\n\n“ข้าคืออิคารัส อดีตผู้บัญชาการกององครักษ์จักรวรรดิที่ 6 หัวหน้าของปฏิบัติการครั้งนี้”\n\n“ฉันชื่ออิซาเบลล์ สังกัดอาณาจักรทิลีส เป็นอัศวิน”\n\nสายลมยามราตรีกรีดร้อง ผืนป่าสั่นไหว ปัง เสียงปืนดังก้องมาจากที่ไกลแสนไกล\n\nทั้งสองพุ่งทะยานเข้าใส่กัน"
    },

      "content": "ด่านฝึกสอนนี่มันยากเกินไปแล้ว\n\nทันทีที่ความคิดนั้นผุดขึ้นมาในหัว ความเสียวสันหลังวาบก็แล่นปราดไปทั่วแผ่นหลัง ทว่าอีวานเมินเฉยต่อปฏิกิริยาของคิมซอนอูแล้วครุ่นคิดต่อไป\n\nนี่มันยากเกินไป ต่อให้ลองจินตนาการถึงยุคสมัยของคิมซอนอูอย่างเป็นกลางและพยายามนึกภาพความคืบหน้าของเกมดู มันก็ยังยากเกินไปอยู่ดี\n\nอีวานเอนหลังพิงต้นไม้ สูดลมหายใจเข้าลึก แล้วถอนหายใจออกมา\n\nถ้ามีคนที่พึ่งพาได้สักคนก็คงดีสินะ ถ้ามีคนอย่างดมิทรีอยู่ในหน่วยด้วย พวกเราก็คงไม่ต้องมาลำบากลำบนขนาดนี้หรอก\n\nจัดการทหารสองคนตรงปลายด้านหนึ่ง วางกับดัก แล้ววิ่งสุดฝีเท้าไปยังอีกฟากหนึ่งเพื่อยิงปืนล่อหลอกอย่างจงใจ\n\nทำแบบนี้วนไปมานานกว่า 30 นาทีงั้นเหรอ? ต่อให้เป็นคนอึดถึกอย่างอีวาน ก็ยังเหนื่อยสายตัวแทบขาดเลยทีเดียว\n\nการอนุญาตให้ตัวเองยิงปืนได้เพียงนัดเดียวต่อการปะทะแต่ละครั้งทำให้สถานการณ์ยากขึ้นกว่าเดิมหลายเท่า แถมยังฝากบาดแผลเอาไว้บนแขนของอีวานอีกต่างหาก\n\nอีวานหยิบโพชั่นเพิ่มพลังชีวิตขวดสุดท้ายออกมา แต่ก็ลังเลอยู่ครู่หนึ่ง\n\nอืม… แค่นี้ยังรับมือไหว เก็บเอาไว้ใช้ทีหลังดีกว่า\n\nอีวานนั่งพักหายใจอยู่ใต้ต้นไม้ พยายามเรียบเรียงปะติดปะต่อเรื่องราวทั้งหมด ลองสมมติว่านี่คือด่านฝึกสอนทันทีหลังจากเลือกตัวละคร ‘อิซาเบลล์’ ดูสิ\n\nฉันผ่านหน้าจอเลือกตัวละครมาแล้ว หน้าจอโหลดกำลังยัดเยียดข้อมูลปูมหลังโลกสุดเฮงซวยเข้ามาให้ดู และแถบโหลดก็ใกล้จะเต็มเต็มที\n\nถ้าเป็นเกมฟอร์มยักษ์งบสูง ตรงนี้เราก็น่าจะได้ดูคัตซีนสักฉาก โชคดีที่ยังมีฉากที่เข้าเค้าอยู่บ้าง\n\nฉากก่อการร้ายบนรถไฟ สูตรสำเร็จแนวสถาบันการศึกษาขนานแท้\n\nพอเหตุก่อการร้ายบนรถไฟเกิดขึ้น เธอก็ฟื้นขึ้นมาท่ามกลางกองดิน โดยมี NPC บาดเจ็บแทนตัวเธอ\n\nแต่จุดที่ติดขัดมันอยู่ตรงนี้นี่แหละ\n\n‘เธอหนีออกมาได้ยังไง?’\n\nปัญหาแรกเริ่มตั้งแต่การหนีออกมาจากตู้โดยสารที่ถูกดินฝังกลบ สมมติว่าข้างในมีปริศนาให้แก้เพื่อพังทางออกมาก็แล้วกัน\n\nแล้วจู่ๆ ก็มีทหารฝีมือฉกาจโผล่ออกมาจากไหนก็ไม่รู้งั้นเหรอ?\n\nโดยที่ยังไม่ทันสอนวิธีต่อสู้ด้วยซ้ำเนี่ยนะ? แถมบอสด่านฝึกสอน… ยังมีความสามารถตรวจจับแนววิถีกระสุนอีกต่างหาก…\n\nพอลองเอาไปเทียบกับบทของเอคไดซิส ยิ่งดูแปลกประหลาดเข้าไปใหญ่ ด่านฝึกสอนของยัยนั่นง่ายขนาดเล่นมือเดียวยังผ่านได้เลย\n\nหรือว่านี่ไม่ใช่เหตุการณ์บังคับสู้ แต่เป็นเหตุการณ์บังคับหนี?\n\nหรือไม่ก็เป็นเหตุการณ์ ‘แพ้ตามบท’ เกมตั้งเยอะตั้งแยะที่มีฉากแบบนี้: โดนจับตัวไปก่อนแล้วค่อยหาทางหนีทีหลัง\n\n‘ไม่สิ พวกนี้ตั้งใจจะฆ่าอิซาเบลล์ทิ้งชัดๆ’\n\nกองกำลังติดอาวุธพวกนี้ไม่ได้คิดจะจับเป็นเธอเลย พวกมันมุ่งหมายจะเอาชีวิตกันอย่างแน่นอน\n\nเพราะฉะนั้น เรื่องโดนจับเป็นตัวเลือกที่ตัดทิ้งไปได้เลย ตามปกติแล้ว หลังจากพ่ายแพ้ ก็จะมีพันธมิตรโผล่มาช่วย\n\nมาช่วยงั้นเหรอ…?\n\nตัวช่วยงั้นเหรอ…?\n\n‘ฉัน… งั้นเหรอ?’\n\nสีหน้าของอีวานพลันเย็นเยียบ หัวใจเต้นระรัว เดี๋ยวก่อน หรือว่าฉันคือตัวช่วยที่ว่านั่น?\n\nสรุปว่าฉันเป็นแค่ NPC งั้นเรอะ?\n\nอีวานข่มเสียงหัวใจที่เต้นรัวในอกให้สงบลง การควบคุมอารมณ์ให้อยู่หมัดคือสิ่งที่เขาเชี่ยวชาญเป็นอย่างดี เขาเริ่มนับนิ้วคำนวณอย่างใจเย็น\n\nในเกมต้นฉบับจะมีตัวละครที่ชื่อ ‘อีวาน เปโตรวิช’ อยู่จริงด้วยเหรอ?\n\nการรับราชการทหาร ทำภารกิจต่างๆ มานานถึง 18 ปี ต่อสู้กับสมาคมลับ และถึงขั้นมาเปิดสถานเลี้ยงเด็กกำพร้าหลังเกษียณ เรื่องทั้งหมดนี้ถูก ‘กำหนดไว้แล้ว’ โดยไม่สนว่าเขาต้องการหรือไม่เลยงั้นหรือ? ทุกอย่างถูกเขียนเอาไว้ในบทอยู่แล้วใช่ไหม?\n\nถ้าเป็นแบบนั้นจริงๆ ชะตากรรมของ ‘อีวาน เปโตรวิช’ ในต้นฉบับจะเป็นยังไง? เขาจะมีชีวิตรอดไปจนจบเรื่องหรือเปล่า? หรือจะมีใครจำหน้าเขาได้ในฉากจบไหม?\n\nอีวานปัดไล่ความคิดแง่ลบทั้งหมดออกไป แล้วเก็บโพชั่นรักษาบาดแผลกลับเข้าไปในกระเป๋า\n\nมีวิธีเดียวเท่านั้นที่จะไขปริศนานี้ได้\n\nทำไมเรื่องทั้งหมดถึงได้ยากนรกแตกขึ้นมาอย่างกะทันหันแบบนี้? หรือนี่มันคือฉากบังคับตายหากไม่มีกำลังเสริมมาช่วย?\n\nเขารีบปีนขึ้นไปบนต้นไม้อย่างรวดเร็วและมุ่งหน้ากลับไปยังขบวนรถไฟ\n\n***\n\n– เคร้ง! แกร๊ง!\n\nประกายไฟแลบแปลบปลาบยามคมดาบปะทะกัน เธอไม่อาจเอาชนะด้วยพละกำลัง และกำลังดิ้นรนอย่างหนักเพื่อชิงความได้เปรียบด้วยทักษะฝีมือ\n\nอิซาเบลล์กำด้ามดาบแน่น ก่อนจะบิดข้อมือพลิกคมดาบ\n\nมันราวกับกระบวนท่าดาบที่ถอดแบบมาจากตำราอย่างสมบูรณ์แบบ การตวัดดาบของเธอปัดป้องคมดาบของศัตรูออกไปได้อย่างหมดจดไร้ที่ติ\n\nนั่นคือช่วงเวลาที่งดงามที่สุดของอิซาเบลล์ เธอไม่อาจจินตนาการถึงการโจมตีใดที่จะงดงามไปกว่านี้อีกแล้ว\n\n“บางครั้งก็มีพวกแบบนี้อยู่เหมือนกันนะ”\n\nอิคารัสปัดดาบของอิซาเบลล์ออกแล้วหัวเราะหึๆ\n\n“โอ้ แน่นอนเลย จะมีอะไรได้ผลไปกว่าพวกเด็กเนิร์ดที่มัวแต่ควงท่อนไม้ แล้วนึกเอาเองว่าทำแบบนั้นจะเสกให้ตัวเองกลายเป็นยอดนักรบขึ้นมาได้ล่ะ? ดีมาก!”\n\n“หุบ… ปากนะ!”\n\n“เธอคิดผิดแล้ว อัศวินแห่งทิลีส”\n\n– เคร้ง! แคร้ง!\n\nทั้งคู่ยังคงปัดป้องการโจมตีกันไปมา ทว่าทุกครั้งที่เธอตั้งรับ ความเสียหายกลับยิ่งสะสมมากขึ้นเรื่อยๆ\n\nเธอยังไม่มีบาดแผลให้เห็นภายนอกก็จริง แต่เธอก็สัมผัสได้ เธอกำลังถูกต้อนเข้ามุมอย่างช้าๆ\n\nสมดุลระหว่างการรุกและการรับพังทลายไม่เป็นท่า เธอขยับไปไหนไม่ได้ ทำได้เพียงถอยร่นลงไปเรื่อยๆ\n\nและด้านหลังของเธอก็คือเหล่าพลเรือนที่เธอต้องปกป้อง\n\nเธอไม่อาจถอยหลังไปได้อีกแม้แต่ก้าวเดียว มันคือทางตัน เป็นปัญหาใหญ่หลวง อิซาเบลล์กัดฟันกรอดแล้วเหวี่ยงดาบออกไป\n\n– เคร้ง!\n\n“การฟันจะนับว่าได้ผล คมดาบมันต้องฟันโดนตัวไม่ใช่หรือไง? วิชาดาบก็แค่การหาทางเสียบพุงอีกฝ่ายให้ทะลุเท่านั้นแหละ!”\n\n– เคร้ง!\n\n“นึกไม่ถึงเลยว่าลูกสาวผู้กล้าจะยังไม่เคยผ่านการต่อสู้จริงจนป่านนี้! ข้าเอือมระอากับความขี้เกียจสันหลังยาวของสหราชอาณาจักรเต็มทนแล้ว”\n\n“หุบปาก!”\n\n– เคร้ง! แคร้ง! เคร้ง!\n\nความเดือดดาลในการเหวี่ยงดาบของเธอเริ่มทำให้ความประณีตในกระบวนท่าเลือนหายไป\n\nอิซาเบลล์กำลังกวัดแกว่งดาบออกไปอย่างสะเปะสะปะด้วยแรงโทสะ\n\nทว่าสำหรับอิคารัส ประสบการณ์ของเขามีมากเกินกว่าจะพ่ายแพ้ให้กับการโจมตีที่ไร้ระเบียบแบบนั้น\n\n– เคร้ง แคร้ง!\n\nเขาพันคมดาบของเธอไว้แล้วสะบัดข้อมือ ทำให้ดาบของอิซาเบลล์กระเด็นหลุดมือไปกระแทกพื้น\n\nพูดตามตรง เขาสามารถปิดฉากการต่อสู้นี้ให้เร็วกว่านี้ได้สบาย แต่คำว่า ‘ลูกสาวของผู้กล้า’ ทำให้เขายังคงระแวดระวังอยู่\n\nพวกผู้กล้าอย่างแม็กซิมิเลียนมักจะสร้างปาฏิหาริย์ขึ้นมาในวินาทีสุดท้ายเสมอ\n\n“แต่มันจบลงแล้วล่ะ” อิคารัสแสยะยิ้มเยาะ เขาต้องสูญเสียลูกน้องไปตั้งมากมายโดยเปล่าประโยชน์\n\n“เจ้าปกป้องใครไม่ได้เลย อิซาเบลล์ ลูกสาวของแม็กซิมิเลียน มีคำสั่งเสียสุดท้ายอะไรไหม?”\n\nอิซาเบลล์กัดริมฝีปาก สายตาจับจ้องไปยังดาบที่ร่วงหล่นอยู่บนพื้น การเผชิญหน้ากับความตายอย่างอาจหาญก็น่านับถืออยู่หรอก แต่เธอจำเป็นต้องเพ่งสมาธิไปที่คู่ต่อสู้ ไม่ใช่มาเล่นบทผู้พลีชีพ อิคารัสเยาะเย้ยเธอก่อนจะเงื้อดาบขึ้นสูง\n\n***\n\nอีวานเฝ้ามองเหตุการณ์ทั้งหมดจากบนต้นไม้\n\nเขาไม่ได้วางแผนจะพุ่งลงไปช่วยเธอในทันที เขาจำเป็นต้องแน่ใจเสียก่อน\n\nถ้าอิซาเบลล์มาตายเอาตรงนี้ นั่นหมายความว่าการคาดเดาของเขาผิดพลาด\n\nจริงอยู่ที่ในบางเกม คุณอาจจะเจอหน้าจอเกมโอเวอร์เพราะโดนบอสด่านฝึกสอนตบตาย แต่นี่ไม่ใช่แบบนั้น คู่ต่อสู้แข็งแกร่งเกินกว่าที่เธอจะเอาชนะได้ด้วยทักษะที่มีอยู่ในตอนนี้\n\nถ้าเขาพุ่งตัวออกไปช่วยอิซาเบลล์ตอนนี้ล่ะก็…\n\nเขาก็ไม่อาจเมินเฉยได้อีกต่อไป มันจะกลายเป็นเครื่องยืนยันว่า: ‘อีวาน เปโตรวิช’ เป็นแค่ NPC ในเกมนี้จริงๆ\n\nดังนั้น ต่อให้อิซาเบลล์ต้องมาจบชีวิตลงตรงนี้ เขาก็จะไม่ยื่นมือเข้าไปสอด\n\nอย่างไรเสีย ก็ยังมีตัวละครหลักเหลืออยู่อีกตั้งห้าคน การเสียไปหนึ่งคนเพื่อแลกกับข้อมูลข่าวสารก็นับเป็นการแลกเปลี่ยนที่คุ้มค่าดีอยู่\n\nอีวานจมดิ่งอยู่ในห้วงความคิดพลางเพ่งมองลงไปยังอิซาเบลล์จากระยะไกล\n\n***\n\n“เจ้าปกป้องใครไม่ได้เลย อิซาเบลล์ ลูกสาวของแม็กซิมิเลียน มีคำสั่งเสียสุดท้ายอะไรไหม?”\n\nกาลเวลาราวกับเดินเชื่องช้าลงสำหรับอิซาเบลล์ ดุจเปลวเทียนที่กำลังริบหรี่ใกล้จะดับมอด\n\nคมดาบอันน่าสะพรึงกลัว ใบหน้าของปีศาจที่เปี่ยมด้วยโทสะและการเยาะหยัน แสงจันทร์อันเยือกเย็น และลมหายใจที่หอบกระชั้นของเธอ\n\nดาบของเธอนอนนิ่งอยู่บนพื้น เป็นสัญลักษณ์แห่งความพยายามและเวลาที่สูญเปล่า\n\n“จงหยิบดาบขึ้นมา”\n\nเสียงหนึ่งดังก้องขึ้น พิธีกรรมของอัศวินเฒ่า ดิอัน ออกัสต์ ที่พึมพำออกมาขณะที่สติกำลังเลือนราง\n\nสติสัมปชัญญะของเธอพร่าเลือนลงอีกนิด ภาพจินตนาการอันเลือนรางผุดพรายขึ้นมา\n\n[ท่ามกลางผู้คนที่มารวมตัวกัน คนผู้หนึ่งคุกเข่าลง\n\nจงยืนหยัดในฐานะผู้อ่อนแอ และมองดูพวกเราด้วยสายตาของพวกเขา\n\nเราชูดาบขึ้นมิใช่เพราะความกล้าหาญ พละกำลัง หรือความเหนือกว่า\n\nเราทำเช่นนั้นเพียงเพราะมันถูกต้อง เพื่อความเที่ยงธรรมที่เราต้องธำรงรักษาไว้\n\nคำปฏิญาณอันขรึมขลังดังกึกก้อง เหล่าอัศวินในโถงพิธีต่างชูดาบขึ้นพร้อมเพรียงกัน\n\nชายชราด้านหน้าสุดวางใบดาบลง และค่อยๆ ลดระดับลงอย่างช้าๆ\n\nอย่างประณีต ราวกับประกอบพิธีกรรม วางคมดาบลงเหนือศีรษะของผู้ที่คุกเข่าอยู่\n\nจงชูดาบขึ้นเพราะมันเป็นสิ่งที่ถูกต้อง\n\nเพื่อความเที่ยงธรรมของเจ้า มิใช่เพื่อพละกำลังของเจ้า\n\nแตะลงบนไหล่ทั้งสองข้างเบาๆ สองครั้ง\n\nบัดนี้ เจ้าคืออัศวินแล้ว\n\nจงมองดูพวกเราด้วยสายตาของผู้อ่อนแอ]\n\nอิซาเบลล์ดึงสติกลับมาสู่โลกแห่งความเป็นจริงท่ามกลางความเงียบงัน แม้แต่ลมหายใจก็ยังหยุดชะงัก\n\nคมดาบของปีศาจกำลังฟาดฟันลงมาทางศีรษะของเธออย่างเชื่องช้า ทว่าร่างกายของเธอกลับรู้สึกหนักอึ้งและเชื่องช้ายิ่งกว่านั้น\n\nและด้านหลังของเธอ เธอได้ยินเสียงครวญคราง เสียงกรีดร้อง และเสียงแห่งความตื่นตระหนกตกใจ\n\n[จงยืนอยู่ในจุดเดียวกับผู้อ่อนแอ และมองดูพวกเราด้วยสายตาของผู้อ่อนแอ\n\nจงชูดาบขึ้นมิใช่เพื่อพละกำลังของเจ้า แต่เพื่อความเที่ยงธรรมของเจ้า]\n\nเสียงนั้นยังคงดังก้องกังวานไม่หยุด\n\n“ใช่ ฉันจะทำ” อิซาเบลล์เอื้อมมือไปคว้าดาบที่ตกอยู่ราวกับมีบางสิ่งดลใจ เธอกำด้ามดาบแน่น\n\nร่างกายของเธอพลันเบาสบายอย่างที่ไม่เคยเป็นมาก่อน\n\nกล้ามเนื้อของเธอกระตุกเกร็งแล้วขึงตึงขึ้นมา\n\nในจังหวะที่คมดาบของอิคารัสตกลงมาเหนือศีรษะของเธอพอดี อิซาเบลล์ก็พร้อมแล้ว\n\nฉับ—!\n\nทุกสิ่งทุกอย่างพลันเงียบสงัด เงียบกริบจนแม้แต่สายลมยังไม่กล้ารบกวนเธอในห้วงเวลานั้น\n\nหมู่เมฆแหวกออก และแสงจันทร์ก็สาดส่องลงมาอย่างเจิดจ้าอีกครั้ง\n\nเหล่าผู้รอดชีวิตด้านหลังเธอต่างจ้องมองตาค้าง จนลืมแม้กระทั่งวิธีหายใจ\n\nเหนือศีรษะของอิซาเบลล์ที่ย่อตัวต่ำลง คมดาบของศัตรูหยุดนิ่งค้างอยู่กลางอากาศ\n\nและสิ่งที่ปักตรึงอยู่กลางแผ่นหลังอันกำยำของปีศาจร้ายอย่างไร้ความปรานี คือปลายดาบที่ทะลุออกมาดุจกิ่งไม้เล็กๆ\n\n“ดะ-ได้ยังไงกัน…?”\n\nอิคารัสตกตะลึงจนทำอะไรไม่ถูก เขาจ้องมองอิซาเบลล์ด้วยดวงตาที่ว่างเปล่า\n\nเธอไม่ได้แสดงสีหน้าใดๆ ออกมา ศีรษะยังคงก้มต่ำ ทว่าในชั่วขณะนั้น เธอก็ตระหนักรู้ได้อย่างเต็มเปี่ยม เด็กสาวตัวน้อยคนนี้ ไม่สิ\n\nอัศวินผู้นี้เพิ่งจะก้าวเดินก้าวแรกของเธอออกไปแล้ว\n\nอิคารัสถอนหายใจอย่างไม่อยากจะเชื่อสายตา ตอนแรกก็ตัวผู้กล้า มาตอนนี้ลูกสาวของมันก็มาเจาะรูบนตัวเขาอีกคน\n\nเขากระอักเลือดออกมาคำโตแล้วโซเซถอยหลัง\n\nเสียงเหล็กกระทบพื้นดังเคร้ง ดาบร่วงหลุดจากมือของเขา ร่างใหญ่โตซวนเซก่อนจะทรุดฮวบลงคุกเข่ากับพื้น\n\n“ฟู่…”\n\nอิซาเบลล์เองก็พ่นลมหายใจออกมายาวเหยียด ทรุดตัวลงคุกเข่าโดยปักดาบค้ำยันไว้กับพื้น เหนื่อยล้า หมดแรงโดยสมบูรณ์\n\nทว่าเธอปกป้องพวกเขาเอาไว้ได้ ทุกคนที่อยู่ด้านหลังเธอ\n\nในท้ายที่สุด เธอก็ช่วยชีวิตผู้รอดชีวิตทุกคนเอาไว้ได้\n\n“ทำได้ดีมาก”\n\nด้วยน้ำเสียงอันแผ่วเบา เธอเงยหน้าขึ้นมอง ที่ระยะไกลออกไป ชายคนหนึ่งกำลังเดินกะเผลกตรงเข้ามาหา\n\nใบหน้าของเขาอ่านไม่ออกภายใต้เคราอันรกรุงรัง ทว่าดวงตาสีฟ้าสดใสกลับทอประกายเจิดจ้าแม้ในความมืดมิด เขากำลังแย้มยิ้มอยู่\n\nเมื่อเห็นแขนของเขาที่มีเลือดไหลซึม และเสื้อโค้ตที่ขาดวิ่นราวกับกิ่งไม้ฉีกหัก ก็พอจะเดาออกได้ทันทีว่าเขาเพิ่งผ่านการต่อสู้แบบไหนมา\n\nเธอคงทำคนเดียวไม่ไหวแน่ นั่นคือเหตุผลที่เธอช่วยอะไรไม่ได้งั้นเหรอ? อิซาเบลล์หัวเราะเบาๆ แล้วพยักหน้ารับ\n\n“คนอื่นๆ ล่ะ…?”\n\n“ไอ้นี่เป็นตัวสุดท้ายแล้ว สุดยอดจริงๆ ให้ตายสิ…”\n\n“ก็นะ…”\n\nราวกับกำลังก้มมองหลานสาวที่ได้รับการเลี้ยงดูมาอย่างดี ชายคนนั้นแย้มยิ้มอย่างอ่อนโยน\n\nอิซาเบลล์รู้สึกว่าคำพูดของเขามันตรงจุดจนอดขำไม่ได้ ตาลุงนี่มองเธอเหมือนเป็นหลานสาวจริงๆ ด้วยแฮะ\n\n“เอ๊ะ? คุณกำลังจะทำอะไรน่ะ?”\n\n“รักษาหมอนี่ไง”\n\nเขาเดินตรงเข้าไปหาปีศาจที่ล้มฟุบอยู่ พลางเปิดจุกขวดน้ำยาหน้าตาประหลาดที่ไม่รู้ว่าเป็นอะไรขึ้นมา\n\n***\n\nเฮ้อ ค่อยยังชั่ว คิมซอนอูถอนหายใจออกมาอย่างโล่งอก\n\nค่อยยังชั่วจริงๆ อีวานกระตุกยิ้มมุมปากชั่วครู่\n\nมันก็แค่เหตุการณ์ปลุกพลังล่วงหน้าตามมาตรฐาน ซึ่งเป็นส่วนหนึ่งของด่านฝึกสอนเท่านั้นเอง\n\nเผลอๆ อิซาเบลล์อาจจะกวาดล้างศัตรูทั้งหมดในป่านี่ด้วยตัวเองเลยก็ได้ แน่นอน เธออาจจะเผลอฆ่าทุกคนไม่เว้นแม้แต่ผู้รอดชีวิตแล้วกลายเป็นผู้รอดชีวิตเพียงคนเดียวไปเลยก็ได้เหมือนกัน\n\nการเข้ามาแทรกแซงของเขาช่วยชีวิตทุกคนเอาไว้ได้ ดีมาก ดูท่าในโลกใบนี้ อีวานจะเป็นตัวแปรเพียงหนึ่งเดียว\n\nอีวานยิ้มออกมาด้วยความโล่งใจ เยี่ยมไปเลย แค่ยืนยันได้ว่าตัวเองไม่ใช่ NPC ก็คุ้มค่าเกินพอแล้ว\n\nตอนนี้ เหลือเรื่องเดียวเท่านั้นที่ต้องทำ\n\n“คุณกำลังจะทำอะไรน่ะ…?”\n\n“รักษาหมอนี่ไง”\n\n“ทำไมล่ะ…?”\n\n“เพราะฉันอยากรู้น่ะสิ”\n\nหากความแตกต่างของระดับความยากในด่านฝึกสอนระหว่างเอคไดซิสกับอิซาเบลล์เป็นเรื่องปกติ แล้วคนอื่นๆ ในกลุ่มทายาทปาร์ตี้ผู้กล้าจะต้องเจอกับบททดสอบแบบไหนกันล่ะ?\n\nเขาควรจะเข้าไปแทรกแซง หรือวางตัวเป็นกลางดี?\n\nนี่คือจังหวะเวลาที่สมบูรณ์แบบที่สุด ต่างจากตอนของเอคไดซิส ในครั้งนี้ ตัวการเบื้องหลังความวุ่นวายปรากฏตัวออกมาให้เห็นแบบจะจะแล้ว\n\nพวกปีศาจมาเดินเพ่นพ่านอยู่แถวเฟรเชนกายาอย่างมั่นอกมั่นใจขนาดนี้ได้ยังไง? พวกมันแทรกซึมเข้าไปในสถาบันมากี่ตัวแล้ว? แผนการของพวกมันคืออะไร? ใครเป็นคนบงการอยู่เบื้องหลัง?\n\nมีเรื่องให้ต้องขุดคุ้ยอีกตั้งมากมาย\n\nและหน่วยเก็บกวาดก็มีนิสัยขี้สงสัย แถมยังมีวิธีตอบสนองความอยากรู้อยากเห็นนั้นอยู่มากมายเสียด้วยสิ"
    },

      "title": "บทที่ 16",
      "content": "“แกคิดว่าฉันจะยอมหักหลังประเทศตัวเองเพียงเพราะแกไว้ชีวิตให้ฉันหรือไง?!”\n\nอีวานได้ยินถ้อยคำเหล่านั้นขณะใช้หัวเข่ากดทับลงบนไหล่ของอิคารัส ทำให้บาดแผลฉีกขาดหนักกว่าเดิม\n\n“ฮ่า! คิดจะทรมานฉันงั้นเรอะ? เข้ามาเลยสิ! ฉันคืออิคารัส อดีตผู้บัญชาการกององครักษ์จักรวรรดิที่ 6 นะโว้ย!”\n\nเสียงแควกดังขึ้นเมื่ออีวานฉีกทึ้งบริเวณรอบปากแผล เผยให้เห็นทรวงอกที่ฉีกขาด\n\nพอเขาเริ่มเทขวดโพชั่นรักษาบาดแผลลงไป น้ำเสียงอันห้าวหาญเปี่ยมความมั่นใจของอิคารัสก็พลันสั่นเครือ\n\n“กรดเกลือ…! นี่มันนรกชัดๆ… อ๊ากกก…!! ไอ้มนุษย์… สารเลว…!”\n\nเปล่าหรอก มันคือโพชั่นต่างหาก แต่อีวานไม่ได้แก้ความเข้าใจผิดนั้นให้ แถมลึกๆ แล้วเขายังแอบนับถือหมอนี่อยู่ไม่น้อย นั่นมันบาดแผลที่ฉีกปอดข้างหนึ่งจนขาดสะบั้นเลยนะ แค่คิดว่าต้องราดโพชั่นรักษาบาดแผลลงไปตรงนั้น อีวานก็รู้สึกใจคอหดหู่ขึ้นมาแล้ว\n\nโชคดีที่อีวานจำไม่ได้ว่าตัวเองเคยโดนราดโพชั่นรักษาบาดแผลกับแผลฉกรรจ์ขนาดนั้นมาก่อน\n\nตอนที่เขาเคยบาดเจ็บปางตายคราวก่อน เขาสลบเหมือดไปก่อนแล้ว และจากที่ได้ยินมา เขาเกือบจะถูกจับแช่ลงไปในถังโพชั่นเลยด้วยซ้ำ แต่ต่อให้ตอนนั้นเขายังไม่สลบ เจอแบบนั้นเข้าไปก็คงหมดสติไปตรงนั้นอยู่ดี\n\n“อึก… อ่อก… ไม่… มีประโยชน์…”\n\nมาถึงจุดนี้ อีวานถึงกับทึ่งไปเลย เหลือเชื่อจริงๆ ที่หมอนี่ยังทนทรมานอยู่ได้ในสภาพที่ปอดที่ฉีกขาดกำลังสมานตัว โดยมีคราบโพชั่นรักษาบาดแผลขังรวมตัวอยู่ข้างใน\n\nทว่าในไม่ช้า เขาก็ชะงักคิ้วขมวด\n\n“ฉันจะไม่มีวันลืมเรื่องนี้… ฉันจะจองล้างจองผลาญแก แม้แต่ในปรโลก!”\n\n-กร๊อบบบ!\n\nด้วยสายตาอาฆาตแค้น อิคารัสกัดลิ้นตัวเองเข้าเต็มแรง เสียงบดขยี้อันน่าสยดสยองดังตามมา อีวานคว้าขวดโพชั่นขึ้นมาถือแล้วถอนหายใจเฮือก\n\n“สำหรับคนที่เคยผ่านสมรภูมิรบมาแล้ว น่าแปลกนะที่นายยังเชื่อเรื่องงมงายพรรค์นี้อยู่อีก”\n\n“เอ๋…?”\n\n“แค่กัดลิ้นตัวเองไม่ทำให้ตายหรอก มนุษย์ไม่ได้เปราะบางขนาดนั้น วิธีเดียวที่คนซึ่งขยับร่างกายไม่ได้จะปลิดชีพตัวเองได้ ก็มีแค่ทำให้หัวใจหยุดเต้นเท่านั้นแหละ”\n\nไม่รู้ทำไม ความเชื่อผิดๆ ที่ว่ากัดลิ้นตัวเองแล้วจะตายคาที่ได้ทันทีถึงได้แพร่หลายไปทั่วโลกนัก\n\nน่าอัศจรรย์ใจจริงๆ ไม่อย่างนั้นคนเราคงเผลอฆ่าตัวตายตอนกินข้าวไปแล้วมั้ง?\n\nเจ้าหน้าที่ปฏิบัติการอย่างอีวานมักตั้งข้อสงสัยแบบนี้อยู่เสมอ\n\nพวกนักรบ อัศวิน และแม่ทัพผู้ ‘กล้าหาญ’ ที่อาละวาดอยู่ในสนามรบดูเหมือนจะหลงเชื่อเรื่องงมงายแบบนั้นง่ายเสียเหลือเกิน บางทีอาจเป็นเพราะพวกเขาถือว่าการคุมสติและวีรกรรมแบบนั้นเป็นเรื่อง ‘โรแมนติก’ ล่ะมั้ง\n\nอีวานก้มมองอิคารัสด้วยสายตาเวทนาอยู่ครู่หนึ่ง ก่อนจะสูดลมหายใจเข้าลึกและตรวจดูปริมาณโพชั่นรักษาบาดแผลที่เหลืออยู่\n\nนี่คือขวดสุดท้ายแล้ว และตอนนี้เหลืออยู่เพียง 1 ใน 3 เท่านั้น\n\n“ทำแบบนี้มีแต่จะยืดเวลาทรมานออกไปเปล่าๆ ฉันไม่ได้อยากทรมานนายนะ ท่านผู้บัญชาการ นี่คือการรักษา และน้ำยานี่ก็คือโพชั่นรักษาบาดแผล”\n\n“เอ๋… อึก…!”\n\n“หุบปากได้แล้ว เดี๋ยวแผลก็ฉีกหนักกว่าเดิมหรอก”\n\nเขาเทโพชั่นรักษาบาดแผลที่เหลืออยู่กรอกเข้าไปในปากของอิคารัสแล้วปิดปากอีกฝ่ายไว้แน่น ดูเหมือนเจ้าตัวจะพยายามบ้วนทิ้งให้ได้ แต่ไม่นานนัก แววตาของเขาก็อ่อนลง\n\nลิ้นที่ขาดวิ่นไปบางส่วนอาบชุ่มไปด้วยโพชั่นรักษาบาดแผล ไหลครอกลงลำคอและแผ่ซ่านไปทั่วร่างกาย\n\nโพชั่นรักษาบาดแผลใช้รักษาได้เพียงบาดแผลทางกายภาพเท่านั้น การดื่มเข้าไปไม่ได้ให้ประโยชน์อะไรเป็นพิเศษ เว้นแต่ว่าจะมีแผลทะลุในกระเพาะอาหารหรือหลอดอาหาร\n\nแน่นอนว่า ถ้าใครเป็นโรคหลอดอาหารอักเสบ มันก็อาจจะรักษาให้หายได้อยู่หรอก ถึงจะต้องแลกกับความรู้สึกเหมือนหลอดอาหารทั้งเส้นกำลังลุกไหม้เป็นไฟก็ตาม แต่ช่างเรื่องนั้นไปก่อนเถอะ\n\n“อึก…”\n\n“พูดได้หรือยัง?”\n\n“อีวาน เปโตรวิช…”\n\n“หืม…?”\n\nอิคารัสที่ยังคงมึนงงเริ่มพึมพำออกมา\n\nเขาจ้องมองเคราหนาทึบที่ปกคลุมริมฝีปากบนของอีวาน จากนั้นจึงไล่สายตาสำรวจคิ้วและหน้าผากของอีกฝ่าย\n\n“ฉันได้ยินมาว่า… แกตายไปแล้ว… วิธีแบบนี้… แค่ก… แค่ก… หน่วย… เก็บกวาด… ที่แท้… ก็เป็นแบบนี้นี่เอง….”\n\nดูท่าหมอนี่คงเคยมีบทบาทสำคัญในสมรภูมิช่วงสงครามมาก่อน\n\nอีวานหรี่ตาลง\n\n“ทำไมนายถึงต้องออกหน้าลงมือด้วยตัวเอง? สถานการณ์ในเขตแดนปีศาจไม่น่าจะย่ำแย่ถึงขนาดต้องโยนคนระดับนายออกมาใช้แล้วทิ้งหรอกมั้ง”\n\nการถูกเรียกว่าผู้บัญชาการในหมู่กองทัพปีศาจยุคก่อน อาจเป็นแค่ตำแหน่งนายทหารชั้นผู้น้อยที่สุด\n\nพูดอีกอย่างก็คือ เป็นแค่ทรัพยากรดาดๆ ทั่วไป ย่อมไม่ใช่บุคคลสำคัญอะไรอยู่แล้ว\n\nแต่นั่นมันสมัยสงครามที่อำนาจของพวกปีศาจยังรุ่งเรืองถึงขีดสุด ต่างจากสถานการณ์ในตอนนี้ลิบลับ\n\nบัดนี้ จอมมารและเจ็ดราชามังกรล้วนถูกปราบลงแล้ว และพวกเศษเดนที่เหลือก็กระจัดกระจาย ถูกขับไล่ออกไปจากโลก\n\nเวลาผ่านไปหลายปีแล้วนับจากนั้น พวกมันต่างก็ซุ่มเพาะบ่มความทะเยอทะยาน และเปิดศึกแย่งชิงอำนาจกันตามตรรกะของผู้แข็งแกร่ง\n\nในห้วงเวลานั้น การได้ชื่อว่าเป็นผู้บัญชาการถือเป็นตำแหน่งอันล้ำค่า เป็นนายทหารประจำการที่ได้รับการรับรองว่ามีทั้งฝีมือการรบและความสามารถในการบัญชาการ\n\n“ตอนนี้… *แค่ก*! ไม่ใช่แบบนั้นอีกแล้ว”\n\n“ว่าไงนะ?”\n\n“แกคิดว่าพวกเราจะยึดติดอยู่กับแผนการที่ล้มเหลวหรือไง? พวกสหราชอาณาจักร… ความประมาทเลินเล่อของพวกมัน… *อึก*… มันน่าสะอิดสะเอียนสิ้นดี….”\n\nตอนที่พวกมันลอบโจมตีเอคไดซิส เหล่าปีศาจได้ว่าจ้างทหารรับจ้างโดยปกปิดตัวตนเอาไว้ บางทีอาจได้รับความช่วยเหลือจากสาวกที่หลงเหลืออยู่ภายในสหราชอาณาจักร ทว่าปฏิบัติการทั้งหมดกลับจบลงด้วยความล้มเหลวอย่างย่อยยับ\n\nหลังจากนั้น พวกมันจึงเพิ่งรู้ตัวว่าภารกิจพังทลายลงตั้งแต่ยังไม่ทันเริ่ม พวกมันถูกเจาะข้อมูลรั่วไหลตั้งแต่ก่อนลงมือเสียอีก\n\n– พวกเราไว้ใจสาวกไม่ได้ มีหนอนบ่อนไส้แฝงตัวอยู่ในหมู่พวกมัน\n\n(หมายเหตุผู้แปลอังกฤษ: ผมคิดว่า Union หมายถึงสหราชอาณาจักร ดังนั้นจึงมีคนทรยศหรือสาวกปีศาจอยู่ภายในสหราชอาณาจักร และในหมู่สาวกปีศาจเหล่านั้น ก็มีสายลับจากฝั่งอาณาจักรแฝงตัวอยู่เช่นกัน)\n\nบัดนี้ เมื่อพ่ายแพ้ในสงครามข่าวสาร พวกมันจึงจำต้องส่งคนที่ไว้ใจได้ลงมาเพื่อให้ภารกิจสำเร็จลุล่วง\n\nไม่ใช่ใครก็ได้ แต่ต้องเป็นบุคคลคนนี้ ลูกสาวของผู้กล้าจะต้องถูกกำจัด\n\nทว่า พวกมันก็ต้องเผื่อใจไว้สำหรับความล้มเหลวด้วยเช่นกัน หากส่งคนระดับแกนนำสำคัญลงมาแล้วพลาดพลั้ง ความเสียหายที่เกิดขึ้นย่อมไม่อาจกอบกู้คืนได้\n\nดังนั้น อิคารัสจึงเป็นเพียงเบี้ยตัวหนึ่ง\n\n‘บางภารกิจควรจะทำให้สำเร็จ และหากล้มเหลว ความเสียหายก็ต้องไม่หนักหนานัก ผู้บัญชาการระดับพอดีตัวสินะ’\n\nอีวานก้มมองอิคารัสด้วยสายตาขมขื่น หมอนี่รู้ตัวดีว่าตัวเองถูกประเมินค่าไว้แค่ไหน แต่ก็ยังคงโหยหาการยอมรับอยู่ดี\n\nต่อให้ปฏิบัติการครั้งนี้สำเร็จลุล่วง เขาก็ไม่ควรมีชีวิตรอดกลับไป เพื่อเป็นการกลบเกลื่อนร่องรอยในยุคสมัยแห่งความสงบสุขหลังสงครามจบลงมาเนิ่นนาน\n\nการก่อการร้ายใกล้เฟรเชนกายาโดยไม่ทิ้งร่องรอยไว้เลยเป็นเรื่องที่เป็นไปไม่ได้\n\nอีวานรู้สึกเห็นใจชายผู้ก้าวเข้าสู่ภารกิจทั้งที่รู้ดีว่ามันหมายถึงความตายสถานเดียวมาตั้งแต่ต้น\n\nเขาถอนหายใจยาวออกมาเฮือกหนึ่ง\n\n“จากนี้ไป คงไม่มีการก่อการร้ายเกิดขึ้นอีกแล้วล่ะ นายล้มเหลวแล้ว”\n\n“…”\n\n“ฉันก็แค่บ่นพึมพำคนเดียว ไม่จำเป็นต้องตอบอะไรหรอก”\n\nอีวานนั่งลงข้างๆ เขา เหม่อมองขึ้นไปบนท้องฟ้า เสียงลมหายใจอันรวยรินและหนักหน่วงของอิคารัสยังคงดังแผ่วเบา\n\n“พอนายล้มเหลวและถูกทอดทิ้ง พวกมันก็จะป่าวประกาศว่าเป็นแค่ฝีมือของ ‘พวกหัวรุนแรงกลุ่มเล็กๆ’ ที่ก่อเหตุ แม้แต่เบื้องบนของนายก็จะอธิบายให้สหราชอาณาจักรฟังแบบนั้นเหมือนกัน”\n\n“…”\n\n“แค่การมีตัวตนอยู่ของนายก็ช่วยปลุกความตื่นตัวของสหราชอาณาจักรให้พุ่งสูงขึ้นแล้ว เห็นได้ชัดว่าพวกมันคงไม่วางแผนโง่ๆ เพื่อก่อการร้ายครั้งต่อไปอีกแน่”\n\n“…”\n\n“มีอะไรที่นายปรารถนาเป็นครั้งสุดท้ายไหม?”\n\n“แก… จะทำยังไงกับฉัน…?”\n\n“นายเหลือทางเลือกอยู่สามทาง”\n\n“ทางแรก คือถูกควบคุมตัวและนำกลับไปที่เฟรเชนกายา”\n\n“จากนั้น นายก็จะได้รับการต้อนรับอย่างอบอุ่นที่กองบัญชาการคราซิลอฟ นายจะต้องรับผิดชอบต่อข้อหาพยายามลอบสังหารบุคคลสำคัญระดับชาติ ต่อมากองบัญชาการจะปั้นแต่งให้เจ้านายของนายกลายเป็น ‘มกุฎราชกุมาร’ แล้วเปิดฉากโจมตีทางการเมือง”\n\n(หมายเหตุผู้แปลอังกฤษ: ผมไม่แน่ใจว่าหมายถึงมกุฎราชกุมารฝั่งไหน ฝั่งปีศาจหรือฝั่งมนุษย์ เพราะแม้แต่มกุฎราชกุมารของสหราชอาณาจักรก็ดูเหมือนจะระแวดระวังพวกลูกหลานผู้กล้าอยู่เช่นกัน)\n\n“แน่นอนว่า ต้องมีการทรมานอย่างแสนสาหัสและลงโทษด้วยเวทมนตร์ควบคู่กันไปด้วย”\n\n“หรือทางเลือกที่สอง คือปล่อยนายเป็นอิสระแล้วเดินกลับบ้านไปเอง”\n\n“กองบัญชาการคราซิลอฟจะสะกดรอยตามนายไป ต่อให้นายหนีรอดไปได้อย่างรวดเร็ว ก็ไม่มีทางกลับไปยังฐานที่มั่นใกล้เฟรเชนกายาได้อย่างปลอดภัยอยู่ดี”\n\n“ดังนั้น ต่อให้นายรอดชีวิตกลับไปได้ ข้อกังขาเรื่องนี้ก็จะตามหลอกหลอนนายภายในฝั่งปีศาจ”\n\n[คนทรยศที่แปรพักตร์ไปเข้าข้างศัตรูเพื่อเอาชีวิตรอด]\n\n“เห็นได้ชัดว่าไม่นายจะถูกมองเป็นคนทรยศในหมู่ปีศาจ ก็ต้องเผชิญกับการสอบสวนและถูกพวกเดียวกันประหารทิ้ง”\n\n“ดังนั้น…”\n\n“นายเข้าใจสถานการณ์ของตัวเองแล้วใช่ไหม?”\n\n“ฆ่าฉันซะ”\n\n“นายถูกพวกพ้องของตัวเองทอดทิ้งแล้ว ไม่มีทางให้ถอยกลับ ไม่มีทางให้ก้าวไปข้างหน้า จุดหมายปลายทางเดียวที่เหลืออยู่คือปรโลก”\n\nอีวานกุมด้ามขวาน ค่อยๆ ยกมันขึ้นและจับเขาของอีกฝ่ายไว้มั่น\n\nอิคารัสหลับตาลงแน่นแล้วกระซิบแผ่วเบา\n\n“แม้เจ้าจะรอนแรมอยู่ในหุบเขาแห่งความมรณา อย่าได้เกรงกลัวเลย เพราะข้าจะคุ้มครองเจ้าเอง”\n\nมันคือบทสวดของจอมมาร ที่เขาเคยได้ยินมานับครั้งไม่ถ้วน\n\nในยุคสมัยของจอมมาร คำพูดสุดท้ายของเหล่าปีศาจส่วนใหญ่ล้วนเป็นถ้อยคำเดียวกันนี้\n\nพวกมันตายอย่างภักดีต่อจอมมาร อย่างคลั่งไคล้\n\nด้วยเหตุนี้ อีวานจึงรู้จักบทสวดท่อนถัดไปเป็นอย่างดี\n\n“ข้าคือไม้กางเขนในราตรีอันมืดมิด\n\nข้าคือประภาคารกลางทะเลคลั่ง\n\nข้าคือเปลและป้อมปราการของเจ้า”\n\n“อย่าได้เกรงกลัวเลย เพราะข้าจะคุ้มครองเจ้าเอง”\n\nอีวานพึมพำพลางจับเขาของอิคารัสไว้\n\n“พ่อแม่ของนายยังมีชีวิตอยู่หรือเปล่า?”\n\n“…อะไรนะ?”\n\n“ถ้าไม่มีแล้ว ฉันเปิดสถานเลี้ยงเด็กกำพร้าอยู่นะ”\n\n“แกกำลังพูดเรื่องบ้าอะไรอยู่ตอนนี้?”\n\n“ฉันรับดูแลเด็กกำพร้าสงครามที่ไร้ที่พึ่งพิง โดยไม่เกี่ยงสัญชาติหรือเผ่าพันธุ์”\n\nเมื่อสี่ปีก่อน ตอนที่จอมมารสิ้นชีพและอีวานตัดสินใจปลดประจำการ คำสั่งที่เบื้องบนมอบลงมาก็คือ:\n\n– จงสังหารเจ็ดราชามังกรให้สิ้นซาก\n\nมันหมายความว่าจงไปตายซะ เป็นคำสั่งที่มอบให้แก่หน่วยเก็บกวาดทั้งหน่วย\n\nหน่วยเก็บกวาดซึ่งประกอบด้วยหน่วยจู่โจมทั้งหมดแปดหน่วย มีเพียงหน่วยจู่โจมเดียวเท่านั้นที่รอดชีวิตกลับมาได้หลังคำสั่งนั้น\n\nหลังจากเขารอดกลับมาได้อย่างสำเร็จ เอลิซาเวตาก็ประทับตราอนุมัติใบลาออกจากราชการให้ทั้งน้ำตา จงใช้ชีวิตอย่างเงียบเชียบ ประหนึ่งว่าตายไปแล้ว ขอโทษที่ไม่อาจยับยั้งคำสั่งนั้นได้ และขอบคุณที่เขายังมีชีวิตรอดกลับมา\n\nแม้นามของเหล่าผู้ที่จากไปจะถูกลืมเลือน เกียรติยศของทุกผู้ทุกนามที่ล่วงลับจะยังคงอยู่ชั่วนิรันดร์\n\nดังนั้น\n\n“ถ้านายอยากมีชีวิตรอดจริงๆ นายสามารถละทิ้งตัวตนของตัวเอง แล้วใช้ชีวิตอยู่ราวกับถูกลืมเลือน ราวกับว่านายได้ตายไปแล้ว”\n\nอีวานยืนนิ่ง ครุ่นคิดถึงความพลิกผันของเหตุการณ์และทางเลือกที่อยู่ตรงหน้า\n\n“ฉันไม่คู่ควรกับเรื่องแบบนั้นหรอก”\n\n“ทุกคนล้วนคู่ควรทั้งนั้น ความภักดีและศรัทธาไม่ได้เป็นตัวกำหนดชีวิตของนาย”\n\n“ถ้านายต้องการ ฉันสามารถฟันเขานายทิ้งได้ มันจะเป็นโซ่ตรวนเส้นสุดท้ายที่ผูกมัดร่างกายของนายเอาไว้”\n\n“แต่ถ้านายต้องการอีกอย่าง ฉันก็จะเหวี่ยงขวานให้ต่ำลงมาอีกนิด”\n\n“นั่นคือทางเลือกสุดท้าย ว่าจะใช้ชีวิตเยี่ยงมนุษย์ หรือจะจากไปเยี่ยงมนุษย์”\n\nอิคารัสหลับตาลงเมื่อได้ยินคำพูดของอีวาน\n\nเขาสูดลมหายใจเข้าลึก ตามด้วยลมหายใจสั้นๆ อีกหนึ่งเฮือก\n\n“ฉัน… อยากมีชีวิตอยู่”\n\n“เป็นการตัดสินใจที่ดี”\n\n-ฉัวะ!\n\nรายชื่อใหม่ถูกเพิ่มลงในทะเบียนของสถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซีย\n\nเด็กกำพร้า อายุ 50 ปี เผ่าพันธุ์ปีศาจ\n\nหลังจากการลอบสังหารเอคไดซิสล้มเหลว ภัยคุกคามจากพวกปีศาจก็ทวีความรุนแรงขึ้นอย่างมีนัยสำคัญ\n\nเหตุผลที่ด่านฝึกสอนของอิซาเบลล์ถูกออกแบบมาให้ยากขนาดนี้ พูดอีกอย่างก็คือ เป็นผลพวงมาจากการกระทำของอีวานเอง\n\nและนั่นหมายความว่าในอีกไม่ช้า:\n\n‘ด่านฝึกสอนไม่ได้เกิดขึ้นพร้อมๆ กัน’\n\nมันหมายความว่านี่ไม่ใช่เกมที่ตัวละครแต่ละตัวจะเผชิญเหตุการณ์พร้อมกันตั้งแต่สร้างตัวละคร ทว่าเหตุการณ์ของตัวละครแต่ละตัวจะมีระยะเวลาเหลื่อมล้ำกันอยู่\n\nอีวานครุ่นคิดพลางลูบปลายคาง\n\nพวกปีศาจไม่ได้เคลื่อนไหวเหมือน AI ที่ถูกตั้งโปรแกรมเอาไว้\n\nเช่นเดียวกับทุกคนบนโลกใบนี้ ไม่มีใครที่เป็นแค่ NPC\n\nแม้แต่เหตุการณ์ที่สร้างขึ้นตามสูตรสำเร็จซ้ำซาก สุดท้ายก็สามารถนำไปสู่ผลลัพธ์ที่ยืดหยุ่นได้ตามตัวแปรที่เปลี่ยนไป\n\nถ้าอย่างนั้น จะคาดหวังอะไรได้บ้าง? และควรทำอะไรต่อ?\n\nอีวานเบนสายตาไปมองอิซาเบลล์\n\nเธอกำลังมองดูเหล่าผู้รอดชีวิตด้วยแววตาเศร้าสร้อย\n\n‘ช่วยเด็กพวกนี้ให้เรียนจบให้ได้’\n\nในเมื่อโลกใบนี้มีฉากหลังเป็นแนวสถาบันการศึกษา มันก็ควรจะเป็นแบบนั้น ต่อให้ไม่มีผู้เล่น ไม่มีตัวละครหลัก หรือไม่มี NPC ก็ตาม อย่างน้อยเรื่องนั้นเรื่องเดียวก็ไม่ควรเปลี่ยนแปลง\n\nยังมีเวลาให้คิดฟุ้งซ่านเรื่องนั้นอีกเหลือเฟือในภายหลัง\n\n“คุณลุงคะ”\n\n“หืม”\n\n“ถ้าวันนี้ฉันไม่ได้ขึ้นรถไฟขบวนนี้ ครอบครัวของคนพวกนั้น… แล้วก็ผู้คนบนรถไฟขบวนนี้… พวกเขาก็คงยังมีชีวิตอยู่ใช่ไหมคะ?”\n\nในเมื่อผู้เสียชีวิตไม่ได้เป็นแค่ NPC ตัวประกอบที่ถูกสังเวยในคัตซีน\n\nบางที มันก็คงจะเป็นแบบนั้นจริงๆ\n\nอีวานตอบพลางแหงนหน้ามองท้องฟ้ายามราตรีที่กำลังเริ่มสาง\n\n“เธอรู้ไหมว่าในหนึ่งปี ผู้กล้าฆ่าคนไปกี่คน?”\n\n“…อะไรนะคะ?”\n\n“ประเมินกันว่าอย่างน้อยราวๆ สามหมื่นคน รวมความสูญเสียทางอ้อมด้วย นั่นคือจำนวนผู้คนที่ต้องตายจากการถูกผลักดันเข้าสู่สมรภูมิที่แทบจะแพ้แน่นอน เพื่อสนับสนุนปฏิบัติการของผู้กล้าและดึงความสนใจของจอมมารเอาไว้”\n\nโดยพื้นฐานแล้ว ปาร์ตี้ผู้กล้าก็คือกลุ่มนักลอบสังหาร เพื่อเข้าไปสังหารเจ็ดราชามังกรและจอมมาร\n\nดังนั้น เพื่อหลอกล่อให้พวกมันตายใจ จึงจำเป็นอย่างยิ่งที่จะต้องยอมมอบชัยชนะบางส่วนในสมรภูมิอื่นให้พวกมัน\n\nตามหลักยุทธศาสตร์พื้นฐานของพิชัยสงคราม ย่อมมีบางครั้งที่ต้องยอมรับความพ่ายแพ้ในแนวรบอื่นเพื่อเกื้อหนุนการแทรกซึมของปาร์ตี้ผู้กล้า\n\n“ทุกคนที่อยู่ในยุคนั้นต่างก็รู้ความจริงข้อนี้ดี ทั้งตัวผู้กล้า แม้กระทั่งทหารในแนวหน้าอย่างฉันเองก็ตาม”\n\n“…”\n\n“แต่ถึงอย่างนั้น ในช่วงเวลาแบบนั้น ผู้กล้าก็ยังคงยิ้มอยู่เสมอ”\n\nเพราะถ้าไม่ทำแบบนั้น หากมัวแต่จินตนาการถึงความล้มเหลว คร่ำครวญถึงความไร้ความสามารถของตัวเอง หรือยอมจำนนต่อน้ำหนักของความรับผิดชอบ\n\nชีวิตมากมายที่ต้องสูญเสียไปเพื่อเขาก็จะกลายเป็นเรื่องสูญเปล่า\n\nด้วยเหตุนี้ ผู้กล้าจึงเลือกที่จะยิ้ม แม้กระทั่งในช่วงเวลาที่ความหวังริบหรี่เสียจนต้องคอยเงยหน้ามองหาดวงดาวดวงใหม่บนท้องฟ้า\n\nเพราะตัวพวกเขาเองจำเป็นต้องเป็นแสงแห่งความหวังให้กับคนอื่นทุกคน\n\nทันทีที่เขาล้มลง นั่นหมายถึงจุดจบของสหราชอาณาจักร\n\n“ดูนั่นสิ”\n\nอีวานยกมือขึ้นชี้ไปยังฟากฟ้า\n\nทางทิศตะวันออก ดวงอาทิตย์กำลังโผล่พ้นขอบฟ้า ย้อมผืนนภาให้กลายเป็นสีครามเข้ม\n\nทางทิศตะวันตก ดวงจันทร์ลับขอบฟ้าไปแล้ว ทว่าตรงสุดปลายขอบฟ้า แม้จะอยู่ห่างไกลแสนไกล\n\nดวงดาวที่ส่องแสงเจิดจ้าที่สุดก็ยังคงทอประกายอยู่\n\n“นั่นคือดวงดาวที่พ่อของเธอเคยแบกรับไว้ในวันวาน และตอนนี้มันคือดวงดาวที่เธอรับช่วงต่อมาแล้ว คำว่าผู้กล้าไม่ได้หมายถึงคนที่แข็งแกร่งที่สุด”\n\n“แต่คือคนที่… กล้าหาญที่สุด…”\n\n“ใช่ คนที่ไม่เคยก้มหัวให้ภาระหนักอึ้งใดๆ และไม่เคยสูญเสียรอยยิ้มในทุกช่วงเวลา พวกเราเรียกคนเหล่านั้นว่าผู้กล้า บัดนี้ เธอต้องกลายเป็นผู้กล้าของพวกเขาแล้ว”\n\nอีวานมองดูเหล่าผู้รอดชีวิตที่รวมตัวกันด้วยความโศกเศร้า ก่อนจะวางมือลงบนศีรษะของเธอเบาๆ\n\n“ลูกสาวของแม็กซิมิเลียน อิซาเบลล์ จงเงยหน้าขึ้นและยืนหยัดอย่างสง่าผ่าเผย ผู้ที่โศกเศร้าจะได้รับเพียงความเห็นใจ แต่ผู้ที่ยิ้มอยู่เสมอจะได้รับการเทิดทูน จงลุกขึ้นพร้อมความหวัง และจงจดจำความกตัญญูก่อนความรู้สึกผิดต่อการเสียสละของผู้อื่น จงมีชีวิตอยู่เพื่อพิสูจน์ว่าการเสียสละของพวกเขาไม่ได้สูญเปล่าเพื่อทุกคน”\n\nดั่งดวงดาวดวงใหม่ แม้จะอยู่เคียงข้างดวงจันทร์ที่ใหญ่โตและสว่างไสวที่สุด ก็ไม่สูญเสียประกายแสงของตนไป\n\nท่ามกลางแสงอาทิตย์ที่กำลังสาดส่อง ส่องประกายเจิดจ้าและชัดเจน\n\nในฐานะสัญลักษณ์แห่งความหวัง ด้วยวิธีนั้นเอง\n\nอิซาเบลล์จ้องมองอีวานอย่างเหม่อลอยอยู่ครู่หนึ่ง ก่อนจะดึงสติกลับมาได้อย่างกะทันหัน\n\n“ถามจริงเถอะ นี่คุณไม่คิดจะโกนหนวดเครานั่นออกบ้างเลยเหรอคะ?”\n\n“ไม่”\n\nอีวานตอบกลับด้วยสีหน้าเอือมระอาสุดขีด"
    },

      "title": "บทที่ 17",
      "content": "ช่วงปลายเดือนกุมภาพันธ์ ถนนหนทางบริเวณโดยรอบสถาบันเซนต์ยันเนืองแน่นไปด้วยผู้คน\n\nสาเหตุก็เพราะในที่สุด พิธีปฐมนิเทศเปิดภาคเรียนของสถาบันการศึกษาชั้นนำที่องค์มหาราชาก่อตั้งขึ้นก็ได้ฤกษ์เริ่มต้นเสียที ผู้คนมากมายที่เข้าสอบคัดเลือกไปเมื่อเดือนพฤศจิกายนปีก่อนต่างก็เฝ้ารอคอยช่วงเวลานี้กันอย่างใจจดใจจ่อ\n\nในจังหวะนี้ บรรดาพ่อค้าหัวใสแห่งเฟรเชนกายาต่างก็พากันเร่ขายของเพื่อล้วงกระเป๋านักศึกษาใหม่และครอบครัวที่เดินทางมาจากแดนไกล ขณะเดียวกัน “การละเล่นพื้นบ้าน” สารพัดรูปแบบ รวมถึงแก๊งล้วงกระเป๋า ก็ระบาดไปทั่วอย่างคึกคัก\n\nแม้ลมหนาวช่วงเช้าต้นฤดูใบไม้ผลิจะบาดผิวเพียงใด เหล่านักศึกษาใหม่ที่เปี่ยมไปด้วยความตื่นเต้นและรอยยิ้ม ตลอดจนผู้คนที่มามุงดูและร่วมยินดีไปกับพวกเขา ต่างก็พากันทยอยเดินผ่านประตูทางเข้าของสถาบันเซนต์ยันเข้าไป\n\n“นั่นตัวอะไรน่ะ?”\n\nกระทั่งมีใครคนหนึ่งชี้นิ้วขึ้นไปบนท้องฟ้าพร้อมส่งเสียงงุนงง\n\nผู้คนเริ่มพากันชี้ไม้ชี้มือขึ้นไปบนท้องฟ้าด้วยท่าทีประหลาดทีละคน สองคน\n\nไม่ช้า แสงอาทิตย์ยามเช้าก็ถูกบดบัง ทอดเงามืดทะมึนเป็นทางยาวทาบทับลงบนพื้นที่ของสถาบัน\n\n“เรือรบ… งั้นเหรอ?”\n\n“เรือประจัญบานลอยฟ้า…?”\n\n“บ้าไปแล้ว!! นั่นมัน… นั่นมันเรือธงของคาลีออนไม่ใช่หรือไง?!”\n\nผู้คนจำนวนมากที่รวมตัวกันอยู่หน้าสถาบันต่างพากันแตกตื่นโกลาหล\n\n“ทะ-ท่านครับ! เรือรบของคาลีออนล่วงล้ำเข้าสู่น่านฟ้าเฟรเชนกายาแล้วครับ…!”\n\n“ฉันก็มีตาเหมือนกัน”\n\nขุนนางราชสำนักผมสีเงินคว้าผมตัวเองอย่างสติแตก\n\n“ไหน… สายลับของเราบอกว่าเอลเฟียราจะเดินทางมาทางบกผ่านทางทิลีสไม่ใช่เรอะ?”\n\n“คือว่า… อะฮ่าฮ่า! ผมนึกออกแล้วครับ! ก้อนเมฆ เรือมันบินอยู่เหนือก้อนเมฆ… ใช่แล้ว… ช่วงนี้อากาศมันแปรปรวนน่ะครับ พวกเขาก็เลยแยกไม่ออกว่าคณะทูตของคาลีออนเดินทางมาทางบกจริงๆ หรือข้ามฟากน่านฟ้ามาด้วยเรือรบติดอาวุธกันแน่ ฟังดูมีเหตุผลดีนะครับ”\n\n“ไม่โว้ย ตามสามัญสำนึกแล้ว พวกเราไม่มีวันส่งสายลับเข้าไปฝังตัวในคาลีออนได้ตั้งแต่แรกต่างหาก! ถึงยังไงที่นั่นมันก็…”\n\nดินแดนของพวกเอลฟ์… พวกเราจะไป… ส่งคนเข้าไปฝังตัว… โดยไม่ถูกจับได้คาหนังคาเขาได้ยังไงกัน….\n\nเมื่อเจ้าหน้าที่ข่าวกรองถึงกับเหงื่อกาฬแตกพลั่กแล้วพึมพำว่า “พวกเราซวยแน่ถ้ารายงานเรื่องนี้กลับไปที่กองบัญชาการ”\n\nในยุคสมัยที่ความสงบสุขกลายเป็นเรื่องตลกฝืด เรือรบยักษ์กลับร่อนลงมาจากฟากฟ้า\n\nช่างเป็นเช้าต้นฤดูใบไม้ผลิที่สดใสเสียจริง\n\nเอลิซาเวตาคงไม่สั่งฆ่าล้างบางพวกเอลฟ์หรอกนะ\n\nอีวานยังคงเดินเมินเฉยต่อผู้คนที่กำลังตกอยู่ในความสับสนวุ่นวายต่อไป พลางนึกในใจว่าเจตนาของพวกเอลฟ์คงดูออกได้ไม่ยากนัก\n\n– พวกเจ้าปล่อยให้เกิดเหตุก่อการร้ายซ้ำแล้วซ้ำเล่า โดยเล็งเป้ามาที่ลูกหลานของปาร์ตี้ผู้กล้าในดินแดนของตัวเองไม่ใช่หรือไง?\n\n– ระบบควบคุมชายแดนของพวกเจ้ามันห่วยแตกขนาดไหนกัน พวกข้าถึงต้องมาเจอเรื่องแบบนี้?\n\n– เอลเฟียราก็เป็นความภาคภูมิใจของประเทศพวกข้าเหมือนกัน จะให้พวกข้าฝากฝังนางไว้กับพวกเจ้าได้ยังไง? จากนี้ไปพวกข้าจะปกป้องคนของตัวเอง ขอบคุณสำหรับความเหน็ดเหนื่อยและความร่วมมือนะ!\n\nมันเป็นข้ออ้างที่เถียงกลับได้ยากจริงๆ ทั้งอิซาเบลล์และเอคไดซิสต่างก็เพิ่งประสบเหตุบนรถไฟมาหมาดๆ และการที่ทุกคนรอดออกมาได้โดยไร้รอยขีดข่วนก็นับว่าปาฏิหาริย์มากแล้ว\n\nแม้แต่เอลิซาเวตาเองก็ได้รับคำเตือนจากอีวานล่วงหน้าแล้วแท้ๆ แต่ใครกันล่ะที่กล้ามาก่อวิกฤตในคราซิลอฟเอาป่านนี้?\n\nคราซิลอฟที่กำลังปั่นป่วนจากการชิงอำนาจอันดุเดือดระหว่างองค์หญิงกับเจ้าชาย และยังคงมีแสนยานุภาพทางทหารหลังสงครามหลงเหลืออยู่อย่างเต็มเปี่ยม กองกำลังภายนอกหน้าไหนจะกล้ามาแหยม?\n\nเว้นเสียแต่ว่าพวกมันอยากจะรนหาที่ตาย\n\nเอลิซาเวตาคงจะรู้สึกว่าโดนกล่าวหาอย่างไม่เป็นธรรม เธอเองก็คงคาดไม่ถึงว่าจะมีพวกบ้าดีเดือดแบบนี้อยู่จริง แต่ช่างเถอะ เหตุการณ์นี้ก็คงปัดตกไปเป็นแค่เรื่องกระทบกระทั่งเล็กๆ น้อยๆ ได้ แม้แต่พวกเอลฟ์แห่งคาลีออนก็คงไม่กล้าก่อคดีทางการทูตที่รุนแรงไปกว่าการ “ประท้วงด้วยกำลัง” หรอก\n\n“เธอคงสาปส่งฉันแน่ ถ้าฉันดันไปบอกเธอว่าในอนาคตจะมีเหตุก่อการร้ายเกิดขึ้นที่สถาบันแห่งนี้อีกนับไม่ถ้วน”\n\nภาพที่จะได้เห็น ‘ริซ่าแห่งเหล็กกล้า’ ร้องไห้ขี้มูกโป่งอีกครั้งก็น่าดูชมอยู่หรอก แต่อีวานตัดสินใจไม่ทำดีกว่า เพราะไม่อยากจะไปสบประมาทอดีตผู้บังคับบัญชาของตัวเองต่อ\n\nนอกจากนี้ โดยพื้นฐานแล้วเขาก็ไม่ได้อยากจะเผชิญหน้ากับเอลิซาเวตาตรงๆ เสียเท่าไหร่ เพราะมันคงจะดูอึดอัดพิลึก\n\n“อืม”\n\nเอลิซาเวตามักจะเขียนจดหมายมาหาอยู่บ่อยๆ และอีวานก็ตอบกลับอย่างเรียบร้อยทุกฉบับ เหตุผลหลักคือไม่อยากพูดคุยเรื่องส่วนตัวให้มากความ รองลงมาก็คือไม่อยากไปยุ่งเกี่ยวกับราชวงศ์\n\nเขาควรจะระมัดระวังตัวให้มากกว่านี้ เมื่อนึกถึงว่าตัวเองอาจถูกแต่งตั้งเป็นนายทหารสัญญาบัตรภายในเวลาไม่กี่ปี เรื่องนี้ควรเก็บไว้เตือนใจตัวเอง\n\nตอนที่เธอเขียนจดหมายฉบับแรกให้เขา เธอเพิ่งอายุแค่สิบสี่ปีเท่านั้น นึกไม่ถึงเลยว่าภายในเวลาเพียงห้าปี เขาจะได้รับการเลื่อนขั้นเป็นนายทหารของหน่วยเก็บกวาด ยิ่งไปกว่านั้น เขายังเคยได้รับข้อเสนอให้เข้าไปเป็นราชองครักษ์ในตอนนั้นด้วย แต่อีวานก็ปฏิเสธไป\n\nภาพขององค์หญิงกับสามัญชนที่สนทนากันอย่างสนิทสนมอาจถูกใครบางคนที่สังเกตเห็นหยิบยกไปโจมตีทางการเมืองได้ จำเป็นต้องหลีกเลี่ยงความเข้าใจผิดที่ว่าองค์มหาราชาแอบส่งคนมาหนุนหลังเอลิซาเวตาอย่างลับๆ\n\n“เอ๊ะ? คุณลุง?”\n\n“…หืม?”\n\nขณะที่กำลังเดินจมอยู่กับความคิด จู่ๆ เขาก็ได้ยินเสียงที่คุ้นเคยดังขึ้น\n\nทันใดนั้น ใครบางคนก็พุ่งเข้ามาทำท่าจะตบไหล่เขา อีวานบิดตัวหลบอย่างแผ่วเบาพร้อมเอื้อมมือไปแตะที่เอว ทว่ากลับคว้าได้เพียงความว่างเปล่า\n\nตอนนั้นเองเขาถึงเพิ่งนึกขึ้นได้ว่าตัวเองทิ้งขวานเอาไว้ในห้องทำงาน\n\n“ทำ… ทำอะไรน่ะคะ! แค่ทักทายเองนะ ทำเอาตกใจแทบตาย! ดูท่ามารยาทในทิลีสจะเปลี่ยนไปเยอะเลยสินะคะเนี่ย”\n\n“ฉันแค่สังเกตเห็นคุณเอื้อมมือไปจับเอว นี่คือวิธีทักทายของคนคราซิลอฟงั้นเหรอ? หา? นี่คือวิธีที่ทำกับสหายร่วมเป็นร่วมตายงั้นเหรอคะ?”\n\nเป็นอิซาเบลล์นั่นเอง เธอเดินตรงเข้ามาหาเขาด้วยรอยยิ้มร่าเริงสดใส โดยไม่มีผู้ติดตามมาด้วยเลยแม้แต่คนเดียว\n\n“ไม่นึกเลยว่าคุณลุงจะมาที่โรงเรียนด้วย เป็นอาจารย์เหรอคะ? ศาสตราจารย์? อยู่ภาควิชาอัศวินใช่ไหม? อ๊ะ ไม่น่าใช่แฮะ หยุดเลยนะ!! ให้ฉันทายก่อน!”\n\n“ฉันไม่ยักรู้นะว่าเธอมีนิสัยร่าเริงแบบนี้ด้วย”\n\n“ก็คุณลุงเป็นคนบอกเองนี่นาว่าให้ฉันยิ้มเข้าไว้”\n\nอิซาเบลล์ยิ้มกว้างอย่างสดใส\n\nด้วยใบหน้าที่ละม้ายคล้ายคลึงกับพ่อของเธออย่างกับแกะ อีวานจึงเผลอยิ้มตอบกลับไปโดยไม่รู้ตัว\n\n“ก็นะ ฉันก็ยังไม่ชอบขี้หน้าออกัสต์อยู่ดี แล้วไอ้พวกที่เอาแต่ยิ้มเสแสร้งพวกนั้นก็น่ารำคาญชะมัด เออใช่ ฉันเองก็ทำหน้าเสแสร้งเป็นเหมือนกัน ใช่ไหมล่ะ?”\n\n“ยอดเยี่ยมมาก”\n\nอีวานคิดเช่นนั้นจากใจจริง ตอนแรกเด็กสาวคนนี้ก็เหมือนลูกหมาที่ไม่ได้รับการฝึกเข้าสังคม\n\nเห่ากรรโชกใส่ทุกคน เป็นประเภทที่แสดงความหวาดกลัวออกมาให้เห็นง่ายๆ\n\nการที่สามารถเปลี่ยนนิสัยของเธอได้ภายในคืนเดียว ทำให้อีวานประเมินตัวเองว่ามีคุณสมบัติความเป็นครูบาอาจารย์มากกว่าที่คิดไว้เสียอีก (ซึ่งนั่นเป็นการประเมินที่ค่อนข้างน่ามึนงงสำหรับอิซาเบลล์ ผู้ซึ่งภายในคืนเดียวนั้นต้องสู้กับปีศาจเพื่อช่วยชีวิตพลเรือนราว 80 คนกับผู้รอดชีวิตอีก 10 คน)\n\n“ช่างเถอะ! คุณลุง ไม่สิ เอ่อ ถ้าฝีมือระดับคุณลุง ก็ต้องเป็นศาสตราจารย์ใช่ไหมคะ? อยู่ภาควิชาไหนเหรอ? พลศึกษา ต้องเป็นพลศึกษาแน่ๆ ไม่ใช่ภาควิชาอัศวิน อืม… หรือว่าในสถาบันเซนต์ยันมีหลักสูตรวิชาลอบสังหารเปิดสอนด้วยคะ?”\n\n“เธอคิดว่าสถาบันการศึกษาที่สอนอะไรพรรค์นั้นมันจะมีประโยชน์บนโลกใบนี้หรือไง?”\n\n“การได้เรียนรู้อะไรก็ดีทั้งนั้นแหละค่ะ! ยกเว้นเวทมนตร์ อันนั้นยากเกินไปจริงๆ”\n\n“เป็นอัศวินแต่ใช้เวทมนตร์ไม่ได้ มันก็ลำบากหน่อยนะรู้ไหม?”\n\n“อะฮ่าฮ่า ที่แท้คุณลุงก็อยู่ภาควิชาอัศวินจริงๆ ด้วย!”\n\nอีวานยืนดูอิซาเบลล์จ้อไม่หยุดอย่างกระตือรือร้นอยู่ครู่หนึ่ง ขณะที่อิซาเบลล์ยังคงพูดเจื้อยแจ้วไม่ขาดสาย คนอีกกลุ่มหนึ่งก็เดินตรงเข้ามาจากระยะไกล\n\n“คุณหนูครับ!”\n\n“อึ๋ย”\n\nอิซาเบลล์ตัวแข็งทื่อไปวูบหนึ่ง แต่ก็รีบควบคุมสีหน้ากลับมาได้อย่างรวดเร็ว\n\nฮึ่ม เธอเหลือบมองอีวาน พยายามตั้งสติให้มั่นคง ก่อนจะเอ่ยทักทายด้วยน้ำเสียงร่าเริง\n\n“โอ๊ะ ตายจริง คุณชาย! มาถึงแล้วเหรอคะ!”\n\n“พูดจาตามสบายเถอะครับคุณหนู เรียกผมว่าออสการ์ก็ได้”\n\n“ได้เลยค่ะ ไว้คราวหน้านะคะ!”\n\nออสการ์\n\nดวงตาของอีวานเบิกกว้างขึ้นเล็กน้อยอย่างเฉียบคม\n\nชายหนุ่มผมบลอนด์หน้าตาหล่อเหลาเหลือร้าย โดยมีกลุ่มนักศึกษาหญิงห้อมล้อมอยู่รอบกาย เดินเข้ามาหาเขาพร้อมรอยยิ้มอันเจิดจ้า\n\nช่างเหมือนพ่อของเขาไม่มีผิด อีวานนึกทึ่งอยู่ในใจ ไม่ใช่แค่หน้าตาเท่านั้น แต่รวมถึงกลิ่นอายความหยิ่งผยองบางอย่างนั่นด้วย สิ่งเดียวที่ต่างออกไปเห็นจะเป็นฝูงชนที่ห้อมล้อมอยู่รอบตัว\n\nผู้หญิงรอบตัวจิลแบร์ในตอนนั้นล้วนแต่เป็นคนเจ้าระเบียบเรียบร้อยกันทั้งนั้น\n\nในความเป็นจริง สมัยนั้นมันไม่ได้หาเจอผู้หญิงได้ง่ายๆ หรอก\n\nผู้หญิงที่มีอยู่ในปาร์ตี้ก็มีแค่นักบุญหญิงกับหัวขโมย แถมแพทริเซียตอนนั้นก็ยังเป็นแค่เด็กสาววัยรุ่น ส่วนเอนริเก้ก็เป็นแวมไพร์อายุเกินร้อยปีไปแล้ว\n\n“เอ่อ ยินดีที่ได้รู้จักครับ ผมชื่อออสการ์ เดอ ซาติยง แห่งทิลีส แล้วท่านล่ะครับ?”\n\n“อีวาน เปโตรวิช”\n\n“ต้องขออภัยด้วยนะครับ แต่ท่านมีความเกี่ยวข้องอะไรกับคุณหนู…? อ้อ ขอโทษที ไม่ทราบว่าท่านรู้หรือเปล่า แต่คุณหนูท่านเป็นแขกบ้านแขกเมืองระดับชาติ เพราะฉะนั้นท่านอาจจะเผลอแสดงกิริยาไม่เหมาะสมโดยไม่ตั้งใจได้”\n\nใครก็ตามที่เห็นชายไว้เคราหน้าตาน่าสงสัยมายืนคุยอยู่กับลูกสาวของผู้กล้าก็คงคิดแบบนี้กันทั้งนั้น\n\nอีวานไม่ได้เห็นด้วยกับคำประเมินนั้นนัก แต่ในมุมมองของออสการ์ มันก็เป็นแบบนั้นจริงๆ หมอนี่ดูน่าสงสัย โดยเฉพาะเมื่อนึกถึงเหตุการณ์ก่อการร้ายบนรถไฟที่อิซาเบลล์เพิ่งประสบมา ยิ่งน่าสงสัยเข้าไปใหญ่\n\nออสการ์ออกเดินทางช้ากว่าอิซาเบลล์สามวัน นั่นก็เพราะอิซาเบลล์ไม่อยากร่วมเดินทางมากับเขาต่อให้ต้องตายก็ตาม\n\nและตอนที่ข่าวอุบัติเหตุของอิซาเบลล์ไปถึงทิลีส\n\n– บุกไปเลย! มุ่งหน้าสู่เฟรเชนกายา!\n\n– ฉีกกระชากอุ้งเท้าของหมีแห่งคราซิลอฟซะ!\n\n– ประเทศที่หลงลืมประวัติศาสตร์ย่อมไร้อนาคต! อย่าลืมวีรกรรมของผู้กล้าเด็ดขาดนะ ชาวทิลีส!\n\nถนนหนทางในเซนต์มาทิลด์เนืองแน่นไปด้วยประชาชนที่ชูป้ายประท้วงข้อความทำนองนั้น ลูกสาวของผู้กล้าไม่ได้แค่อุบัติเหตุในต่างแดน แต่หายสาบสูญไปเพราะการก่อการร้าย เรื่องใหญ่ขนาดนั้นจะไม่ให้เดือดดาลได้ยังไง\n\nโชคดีที่ข่าวแพร่สะพัดออกมาอย่างรวดเร็วว่าอิซาเบลล์รอดชีวิตมาได้โดยไม่ได้รับบาดเจ็บ การประท้วงจึงสลายตัวไป ทว่าความระแวดระวังและความไม่ไว้วางใจในทิลีสกลับพุ่งสูงขึ้นอย่างเฉียบพลัน\n\nท่ามกลางสถานการณ์เช่นนั้น เขายังได้รับคำสั่งอันเด็ดขาดจากพ่อของเขา จิลแบร์ ผู้พิทักษ์ชายแดนอีกด้วย\n\n“พอแกเข้าเรียนแล้ว ไม่ว่าจะเกิดอะไรขึ้น ต้องรับประกันว่าอิซาเบลล์จะไม่เป็นรอยขีดข่วนแม้แต่ปลายเส้นผม”\n\n“ต่อให้ผมต้องตายเลยเหรอครับ?”\n\n“ชีวิตแกมันมีค่าน้อยกว่าชีวิตของยัยหนูนั่น ไม่ว่าจะลองคิดทบทวนดูสักกี่รอบก็ตาม”\n\n“พ่อนี่มันสุดยอดจริงๆ ถ้าห่วงเธอนัก ทำไมตอนนั้นไม่สลับตัวเธอกับผมไปเลยล่ะครับ? ผมได้ยินมาว่าพ่อสนิทกับผู้กล้านี่นา”\n\n“ถ้าทำได้ พ่อคงทำไปตั้งแต่ยี่สิบปีก่อนแล้วโว้ย ไอ้ลูกชาย ฉันกับจูเลียอยากได้ลูกสาวมาตลอดอยู่แล้ว”\n\n“ว้าว พ่อแม่คู่นี้แย่ชะมัดเลยแฮะ”\n\nเมื่อนึกถึงคำสั่งสอนอันเข้มงวดของจอมอัศวินแห่งทิลีส ผู้พิทักษ์ชายแดนผู้ยิ่งใหญ่อย่างจิลแบร์ ออสการ์ก็ควบคุมสีหน้าของตัวเอง ก่อนจะปรับท่าทีให้สุภาพสำรวม\n\n“ฉันเป็นเจ้าหน้าที่ของสถาบันเซนต์ยัน”\n\n“ต้องขออภัยในกิริยาของผมด้วยครับ เนื่องจากเหตุการณ์อันน่าเศร้าที่เพิ่งเกิดขึ้น โปรดอภัยให้แก่ความเสียมารยาทของผมด้วย”\n\n“ไม่เป็นไร”\n\n“ขออนุญาตถามได้ไหมครับว่าท่านสังกัดแผนกไหน? ผมไม่เคยเห็นชื่อของท่านในรายชื่อคณาจารย์เลย”\n\nพอถึงตรงนี้ อิซาเบลล์ก็หูผึ่งขึ้นมาทันที เขาไม่ได้เป็นศาสตราจารย์งั้นเหรอ?\n\n“ฉันเป็นคนสวน”\n\n“เอ๋…”\n\n“…หืม…?”\n\nฝีมือระดับนั้นเนี่ยนะ? เป็นคนสวน?\n\nอิซาเบลล์จ้องมองเขาด้วยความตกตะลึง ไม่รู้จะคิดยังไงดีกับดวงตาลึกล้ำที่ไร้ซึ่งอารมณ์ความรู้สึกคู่นั้น แม้จะถูกบดบังด้วยหนวดเคราที่รกรุงรังก็ตาม\n\n“เอ๊ะ อะไรนะ?”\n\nจากนั้นเธอก็หัวเราะคิกคักพลางกระทุ้งสีข้างอีวานเบาๆ อีวานขยับมือไปแตะที่เอวโดยอัตโนมัติ ก่อนจะนึกขึ้นได้ว่าไม่มีขวานอยู่ตรงนั้นจึงลดมือลงอย่างเป็นธรรมชาติ\n\n“สายลับรัฐบาลใช่ไหมคะ? สายลับหรืออะไรทำนองนั้น? ว้าว ชีวิตมหา’ลัยนี่มันน่าตื่นเต้นชะมัดเลย ต้องซ่อนความลับอะไรไว้แน่ๆ ถึงได้ส่งสายลับรัฐบาลมาแฝงตัวอยู่ที่นี่?”\n\nอิซาเบลล์กระซิบเสียงเบา ก่อนจะรีบเก๊กหน้าขรึม\n\n“นี่เป็นความลับระหว่างเราสองคนนะ โอเคไหม? เข้าใจนะ? อย่าไปพูดที่อื่นล่ะ ตกลงไหม?”\n\n“ถ้าเป็นความลับระหว่างเรา ฉันว่าเธอควรจะระวังปากตัวเองให้มากกว่านี้นะ”\n\n“โธ่ ฉันคือลูกสาวของผู้กล้านะ ความสุขุม ความลับ ความยุติธรรม”\n\n“ผู้กล้าเคยพูดอะไรแบบนั้นด้วยเรอะ?”\n\nขณะที่ทั้งสองคนกำลังกระซิบกระซาบคุยกันไปมา สีหน้าของออสการ์ก็เปลี่ยนไปอย่างประหลาด\n\n“คุณหนูครับ?”\n\n“อ้อ ค่ะ คุณเปโตรวิช ขอบคุณที่ช่วยนำทางนะคะ ว้าว แคมปัสนี่กว้างชะมัด เกือบหลงทางแล้วเชียว! ลาก่อนนะคะ!”\n\nในคณะศิลปศาสตร์ของสถาบันเซนต์ยันมีสาขาวิชาการแสดงอยู่ด้วยหรือเปล่านะ? อีวานถึงกับคิดอย่างจริงจังว่าจะแนะนำให้อิซาเบลล์ลงเรียนวิชาการแสดงเป็นส่วนหนึ่งของการศึกษาดีไหม\n\nในชั่วขณะเดียวกันนั้น ณ หอประชุมใหญ่ที่การเตรียมงานพิธีปฐมนิเทศของสถาบันเซนต์ยันกำลังดำเนินไปอย่างคึกคัก ใครบางคนกำลังจ้องมองความว่างเปล่าตรงหน้าอย่างเหม่อลอย\n\n“นี่มันอะไรกัน? หน้าต่าง… สถานะงั้นเหรอ?”\n\n[ขอแสดงความยินดี!]"

      "title": "บทที่ 18",
      "content": "นักศึกษาส่วนใหญ่ไม่เคยแม้แต่จะฉุกคิดถึงเรื่องนี้ แต่ความจริงแล้ว หมวดหมู่ของบุคลากรในสถาบันการศึกษายังรวมถึงเจ้าหน้าที่อีกหลายตำแหน่งนอกเหนือจากศาสตราจารย์และผู้ช่วยสอน\n\nยกตัวอย่างเช่น เจ้าหน้าที่รักษาความปลอดภัยที่ดูแลความสงบเรียบร้อยและความปลอดภัยภายในวิทยาเขต หรือเจ้าหน้าที่ธุรการที่จัดการงานเอกสารต่างๆ\n\nเช่นเดียวกับที่คุณอาจไม่ได้สังเกตเห็นพนักงานทำความสะอาดโรงอาหารในขณะที่กำลังนั่งกินข้าว ยังมีผู้คนอีกมากมายที่เดินเข้าเดินออกผ่านหางตาของคุณโดยที่คุณไม่ทันรู้ตัว\n\nคนสวนก็เช่นเดียวกัน นั่นคือเหตุผลที่เอลิซาเวตามอบหมายงานคนสวนให้อีวาน ไม่ใช่ตำแหน่งที่โดดเด่นสะดุดตาอย่างศาสตราจารย์หรือผู้ช่วยสอน แต่เป็นตำแหน่งที่สามารถส่งคนเข้ามาประจำการได้โดยไม่ก่อให้เกิดความสงสัย และในขณะเดียวกันก็เป็นตำแหน่งที่ไม่มีภาระหน้าที่ชัดเจน\n\nเนื่องจากในสถาบันไม่มีสวนอยู่เลย จึงไม่จำเป็นต้องมีคนสวนประจำอยู่ที่สถาบันเซนต์ยันตั้งแต่แรก\n\n“จริงด้วยแฮะ”\n\nมันก็เป็นเรื่องธรรมดาอยู่แล้ว สถาบันการศึกษาที่สร้างขึ้นใจกลางเมืองหลวงคงไม่เอาที่ดินมาเสียเปล่ากับการทำสวนหย่อมหรือแปลงดอกไม้หรอก\n\nมันควรจะเป็นแบบนั้น\n\nอย่างไรก็ตาม ต่อให้องค์หญิงจะสร้างตำแหน่งงานขึ้นมาลอยๆ ก็ไม่มีใครกล้าสงสัยอะไรอยู่ดี\n\nท้ายที่สุดแล้ว หากเป็นบุคคลสำคัญจริงๆ หรือถ้าเอลิซาเวตากำลังวางแผนการอะไรบางอย่างอยู่ในสถาบัน พวกเขาก็คงส่งสายลับไปประจำในตำแหน่งที่สำคัญมากกว่านี้ไปแล้ว\n\nฝ่ายวังหลวงคงคิดว่าลูกน้องคนหนึ่งของเอลิซาเวตาแอบยัดเส้นสายหาตำแหน่งงานว่างๆ ให้คนรู้จักเงียบๆ เท่านั้นเอง\n\nการกระทำทำนองนี้เป็นเพียงความผิดพลาดเล็กน้อยตามปกติในอาณาจักร — การที่ผู้มีอำนาจหาตำแหน่งงานให้ตัวเองหรือคนรู้จัก ซึ่งไม่ได้ผิดกฎหมายอะไร ในแวดวงชนชั้นสูง การทุจริตเล็กๆ น้อยๆ แบบนี้มักถูกมองว่าเป็นเรื่องธรรมดาที่ซื่อตรงด้วยซ้ำ\n\n(หมายเหตุผู้แปลอังกฤษ: แม้ตอนแรกผมจะสงสัยว่าทำไมมหาวิทยาลัยถึงจ้างคนสวนทั้งที่ไม่มีสวน แต่ปรากฏว่ามันเป็นเพราะวัฒนธรรมระบบอุปถัมภ์ที่นั่น พวกขุนนางจงใจเปิดตำแหน่งงานให้ญาติหรือคนรู้จักของตัวเองกินเงินเดือนเปล่าๆ เรื่องแบบนี้เลยถูกมองว่าเป็นเรื่องปกติ)\n\n“อยู่นี่จริงๆ ด้วย”\n\nด้วยเหตุนี้ คนสวนแห่งสถาบันเซนต์ยันจึงมีเวลาว่างเหลือเฟือ มากพอที่จะหางานอดิเรกทำแก้เบื่อได้สบาย\n\nและในตอนนี้ กิจกรรมยามว่างของคนสวนแห่งสถาบันเซนต์ยันก็คือการกู้ระเบิด\n\n“เส้นทางการเคลื่อนไหว การสัญจรของผู้คนภายในวิทยาเขต และมุมมองสายตาจากอาคารแต่ละหลัง ล้วนถูกคำนวณมาอย่างดี”\n\nคนพวกนี้คือ “มืออาชีพ”\n\nอีวานหรี่ตาลงขณะปลดชนวนระเบิดลูกที่สาม มันเป็นระเบิดเวทมนตร์แบบทำมืออย่างหยาบๆ ทำให้ยากต่อการแกะรอยหาตัวคนร้าย\n\nเหตุผลที่อีวานสามารถระบุตำแหน่งและไล่เก็บกู้วัตถุระเบิดได้มีดังนี้:\n\nประการแรก การโจมตีระหว่างพิธีปฐมนิเทศของสถาบันถือเป็น “สามัญสำนึก”\n\nประการที่สอง ท่ามกลางเรือประจัญบานที่ลอยลำอยู่บนท้องฟ้าและการเฝ้าระวังจากกองบัญชาการข่าวกรองที่ยกระดับขึ้นถึงขีดสุดในเวลานี้ มีเพียง “มืออาชีพ” เท่านั้นที่จะสามารถแทรกซึมเข้ามาโจมตีสถาบันได้\n\nเมื่อคิดย้อนกลับด้วยตรรกะนี้และจำลองเส้นทางการเคลื่อนไหวของศัตรูย้อนหลัง ตำแหน่งที่ใช้วางระเบิดย่อมถูกเปิดเผยออกมาเอง\n\nสถานที่ซึ่งไม่สะดุดตาพวกรปภ.\n\nขณะเดียวกัน ก็เป็นพื้นที่ที่พลเรือนทั่วไปมองไม่เห็น\n\nยิ่งไปกว่านั้น ต้องเป็นจุดบอดที่ไม่มีใครสามารถมองเห็นได้จากหน้าต่างของอาคารเรียน\n\nเมื่อนำเงื่อนไขทั้งหมดเหล่านี้มาหาจุดตัดกัน ก็จะเจอระเบิดทันที มันแทบไม่ต่างอะไรกับการขุดมันฝรั่งเลย\n\nพอระบุตำแหน่งคร่าวๆ ได้แล้ว เขาก็แค่เดินทอดน่องเข้าไปแล้วเด็ดมันออกมาอย่างใจเย็น\n\n“ทีนี้ก็เหลือแค่ว่า นี่มันฝีมือของใครกันแน่”\n\nปัญหามันอยู่ตรงนี้นี่แหละ\n\nมีผู้ต้องสงสัยมากเกินไป\n\nพวกปีศาจ แม้จะมีความเป็นไปได้น้อยที่สุด แต่ก็น่าสงสัยด้วยเหตุผลเดียวกันนั้นเอง คนพวกนี้มีแรงจูงใจมากพอที่จะก่อการร้ายในสถาบันเซนต์ยัน ทว่าในขณะเดียวกัน ถ้าคนพวกนี้ไม่ใช่พวกกุ๊ยข้างถนน พวกมันก็คงไม่ทำเรื่องเดิมซ้ำซากทันทีหลังจากเพิ่งล้มเหลวไปหมาดๆ\n\nในทางกลับกัน พวกเอลฟ์ก็น่าสงสัย แต่แรงจูงใจของพวกมันค่อนข้างเบาบาง\n\nการที่พวกมันยังคงมีเรือรบลอยลำอยู่เหนือสถาบันเซนต์ยันทำให้ลงมือก่อเหตุได้ง่ายที่สุดก็จริง ทว่าต่อให้พวกเอลฟ์ลงมือทำเรื่องนี้เพื่อทำลายชื่อเสียงของคราซิลอฟ ผลประโยชน์ที่ได้กลับน้อยนิด ฝ่ายวังหลวง สันนิษฐานว่ากลุ่มนี้ใกล้เคียงกับตัวการมากที่สุด\n\nคนพวกนี้มีทั้งวิธีการและแรงจูงใจในการโจมตีสถาบันเซนต์ยัน แต่วันนี้คงจะลงมือยากหน่อย กองบัญชาการข่าวกรองที่โดนความเกรี้ยวกราดของเอลิซาเวตาเล่นงานไปตรงๆ ได้สาดไฟส่องสว่างและวางกำลังคุ้มกันพื้นที่นี้อย่างเข้มข้นสุดขีด\n\nสรุปก็คือ มีผู้ต้องสงสัยเยอะแยะเต็มไปหมด\n\nองค์กรลึกลับที่ซ่องสุมเจ้าหน้าที่ระดับหัวกะทิได้แอบแทรกซึมเข้ามาในสถาบันอย่างลับๆ\n\n“ก็แค่ฉากหลังแนวสถาบันการศึกษาธรรมดาๆ นี่นา”\n\nมาถึงจุดนี้ อีวานรู้สึกโล่งอกขึ้นมาบ้าง\n\nใช่แล้ว การลอบโจมตีระหว่างพิธีปฐมนิเทศของสถาบันและการมีสายลับลึกลับแฝงตัวอยู่ในโรงเรียน — นั่นแหละคือองค์ประกอบของฉากสถาบันการศึกษาธรรมดาๆ\n\nโดยเฉพาะอย่างยิ่งเมื่อไม่มีนักศึกษาใหม่มาโชว์ศิลปะการต่อสู้หรือแนะนำตัวว่าเป็นสิ่งมีชีวิตเวทมนตร์ หรือคาวบอยที่คาบใบไม้แล้วยิงปืนลูกซองปั๊มแอ็กชัน หรือเด็กสาวที่พูดจาหยาบคายแต่เป็นตัวแทงค์ระดับสุดยอด\n\nอีวานส่ายหน้าพลางยิ้มขมขื่น ก่อนจะมุ่งหน้าไปยังจุดคาดการณ์วางระเบิดจุดถัดไป\n\nและในเสี้ยววินาทีนั้นเอง เขาก็ได้ยินเสียงแปลกๆ ดังแว่วมา\n\nแผ่วเบาเหลือเกิน\n\n“นั่นตัวอะไรน่ะ? ซานตาคลอสเหรอ?”\n\nดวงตาของอีวานเบิกกว้างขึ้นอย่างเฉียบคม โดยไม่แสดงพิรุธใดๆ เขาแสร้งก้มตัวลงราวกับจะผูกเชือกรองเท้าอย่างเป็นธรรมชาติ พร้อมกับหยิบก้อนกรวดขึ้นมาถือไว้ในมือ เขาขว้างมันออกไปในทิศทางที่เสียงนั้นดังมาทันที\n\n-ควับ!\n\nเสียงของบางอย่างถูกปัดป้องออกไป และในฉับพลันนั้น ราวกับสายฟ้าฟาด อีวานก็ดีดตัวพุ่งทะยานไปในทิศทางนั้น\n\nตึก ตึก! เสียงฝีเท้าอันรวดเร็วดังก้องขึ้น ก่อนที่ในที่สุด อีวานจะหยุดชะงักฝีเท้าลง\n\nไร้ซึ่งร่องรอย ท่ามกลางฝูงชนมากมายที่กำลังรอคอยพิธีปฐมนิเทศสิ้นสุดลงบริเวณด้านนอกสถาบันเซนต์ยัน\n\n“ซานตาคลอส งั้นเหรอ”\n\nอีวานแค่นหัวเราะอย่างขมขื่นแล้วหมุนตัวเดินกลับ เมื่อเดินย้อนกลับมาทางเดิม ไม่นานนักเขาก็เห็นก้อนกรวดที่ถูกฟันผ่าครึ่งอย่างหมดจดตกอยู่บนพื้น\n\nเขาแยกแยะและประกอบข้อมูลทั้งหมดเข้าด้วยกันอย่างเป็นระบบ\n\n-มีทักษะการต่อสู้\n\n-เป็นเด็กหนุ่มหรือเด็กสาวอายุน้อย หากเป็นผู้ชาย อย่างน้อยก็ยังไม่พ้นวัยแรกรุ่น\n\n-น้ำเสียงยังคลุมเครือเกินกว่าจะระบุเพศได้ อาจต้องฟังอีกสักสองสามครั้งเพื่อประเมิน\n\n-ส่วนสูง ยังไม่แน่ชัด\n\n-ปฏิกิริยาตอบสนองฉับไว ทักษะการเคลื่อนไหวรวดเร็ว น่าจะรับรู้การโจมตีจากมุมอับเฉียงได้\n\n-เป็นความสามารถที่ยากจะมีได้ในระดับนักศึกษา ทว่ามีความเป็นไปได้สูงมากที่จะเป็นนักศึกษา\n\nเขาหันหลังกลับและเปลี่ยนทิศทาง คราวนี้มุ่งหน้ากลับเข้าไปในเขตวิทยาเขต\n\nมุ่งหน้าสู่สถานที่ที่อันตรายที่สุดในสถาบันเซนต์ยัน มุ่งหน้าสู่หอประชุมใหญ่ที่เอลิซาเวตากำลังเข้าร่วมพิธีปฐมนิเทศอยู่\n\nและแน่นอนว่าต้องมุ่งหน้าไปยังห้องควบคุมภาคสนามของกองบัญชาการข่าวกรองที่น่าจะตั้งอยู่ใกล้ๆ กันด้วย\n\n“ซานตา… คลอส”\n\nในโลกใบนี้ไม่มีตำนานพื้นบ้านเรื่องซานตาคลอส\n\nแน่นอนว่าวันคริสต์มาสก็ไม่มีอยู่จริง ไม่มีตาแก่ชุดแดงจอมยุติธรรมที่จะมายัดลูกอมกับของเล่นใส่ถุงเท้าหรอก นั่นคือเหตุผลว่าทำไมแค่การหลุดปากเอ่ยคำพูดไร้สาระพรรค์นั้น ถึงได้กระตุ้นปฏิกิริยาตอบสนองที่ไวต่อความรู้สึกขนาดนี้\n\nดังนั้น\n\nดังนั้น\n\n“ผู้ข้ามมิติ”\n\nไอ้หมอนี่มันก็เขียนบทวิจารณ์ 5,700 ตัวอักษรเหมือนกันหรือเปล่านะ? หรือเป็นแค่ผลผลิตจากความบังเอิญ? โดนรถบรรทุกชน? การกระโดดแม่น้ำฮันมันเชยเกินไปแล้ว งั้นตัดทิ้งไปเลย แน่นอนว่าอาจจะเป็นตัวนักเขียนต้นฉบับเองก็ได้ นั่นก็เป็นความเป็นไปได้ที่เจอบ่อยเหมือนกัน\n\nไม่ว่าจะด้วยเหตุผลใดและด้วยวิธีการใดที่พวกมันข้ามมายังโลกใบนี้\n\nแต่สิ่งหนึ่งที่แน่นอนก็คือ\n\nตัวตนนี้รู้ดีว่าเกมนี้คือ “เนื้อเรื่องแนวอะคาเดมี” เหตุผลเดียวที่ผู้ข้ามมิติจะสอบเข้ามาเรียนหรือมาสมัครทำงานที่นี่ก็เพื่อการนั้น\n\nเพราะฉะนั้น ไอ้หมอนี่\n\nรู้จัก “ต้นฉบับ”\n\nรู้ว่าจะเกิดอะไรขึ้นต่อไป\n\nและรู้ “ฉากจบ”\n\n“เฮ้ เดี๋ยว หยุดอยู่ตรงนั้น! นี่เป็นเขตหวงห้าม!”\n\n“เรียกดมิทรีมาที่นี่”\n\n“อะไรนะ? แกเป็นใคร… รู้ชื่อนั้นได้ยังไง…”\n\n-กึก!\n\nอีวานหักแขนของทหารในเครื่องแบบที่เข้ามาขวางทางไว้ทันที ทหารคนนั้นตอบสนองโดยพลัน ชักปืนออกมาจากแขนเสื้อ ทว่าปืนกลับถูกถอดชิ้นส่วนออกอย่างลื่นไหลดุจสายน้ำเมื่ออีวานบิดตัวล็อก\n\nทหารคนนั้นที่ถูกจับล็อกแขนไว้และเหลือเพียงด้ามปืนเปล่าๆ อยู่ในมือถึงกับจ้องมองอย่างตะลึงงัน\n\nเสี้ยววินาทีต่อมา กริ๊ก กริ๊ก ลำกล้องปืนหลายกระบอกก็โผล่ออกมาในพริบตา\n\nห้าคน ฝึกมาได้ดี ปลอมตัวได้แนบเนียนด้วย\n\nทหารทั้งห้าคนที่ล้อมเขาไว้ต่างสวมบทบาทที่แตกต่างกันไป ดูเหมือนพลเมืองธรรมดาที่พบเห็นได้ทั่วไป\n\nหลังจากกวาดสายตามองเหล่าทหารที่ล้อมอยู่รอบตัวครู่หนึ่ง อีวานก็สูดลมหายใจเข้าลึก จากนั้นจึงผ่อนลมหายใจออกสั้นๆ\n\nโทสะพลุ่งพล่านขึ้นมา ความกระวนกระวายเริ่มกัดกินความอดทนของเขา\n\n“ไปตามดมิทรีมา”\n\n“รู้จักท่านพันโทด้วยเหรอครับ? กรุณาอย่าก่อเรื่องวุ่นวายตรงนี้เลย ไปคุยกันในที่เงียบๆ…”\n\n“อีวาน”\n\n“เอ่อ… ครับ?”\n\n“ฉันชื่ออีวาน เปโตรวิช พวกนายมาจากหน่วยเก็บกวาดใช่ไหม?”\n\n“กระผมเป็นทหารเกณฑ์รุ่นสุดท้ายครับ ท่าน ขออภัยด้วย แต่ถ้าขออนุญาตยืนยันใบหน้าของท่าน…”\n\nทหารที่คุกเข่าอยู่ต่อหน้าอีวานค่อยๆ เงยหน้าขึ้นอย่างระมัดระวัง เขาปล่อยด้ามปืนที่กำอยู่ช้าๆ แล้วยกมือทั้งสองข้างขึ้นแบออกกว้าง\n\nเขาเพ่งพินิจใบหน้าของอีวานอยู่ครู่หนึ่งด้วยสีหน้าฉงนสนเท่ห์ ก่อนจะค่อยๆ เอื้อมมือมาปิดช่วงคางของอีวานเบาๆ\n\n“คุณพระช่วย จริงๆ ด้วย… อีวาน ‘ตัวน้อย’ งั้นหรือครับ…?”\n\nเหงื่อเย็นไหลซึมออกมาบนใบหน้าของทหารคนนั้นขณะที่ไล่สายตามองเค้าโครงใบหน้าของอีวาน ทั้งดวงตา จมูก หน้าผาก และส่วนอื่นๆ\n\nเขารีบส่งสัญญาณทางสายตาให้เหล่าทหารที่รายล้อมอยู่รอบข้าง จากนั้นจึงค้อมศีรษะลงอย่างนอบน้อม\n\n“ผู้หมวดเปโตรวิช เป็นเกียรติอย่างยิ่งที่ได้พบท่านครับ”\n\n“ชื่อล่ะ?”\n\n“กระผมชื่อ โอซิป โซเรนอฟ ท่านคงไม่รู้จักกระผมหรอกครับ กระผมสังกัดหน่วยจู่โจมที่ 3 พวกเราเคยเจอกันเพียงครั้งเดียวจากที่ไกลแสนไกล”\n\n“ฉันจำได้แล้ว โอซิป”\n\nอีวานปล่อยแขนของทหารคนนั้นแล้วก้าวถอยหลัง โอซิปปัดฝุ่นที่หัวเข่าแล้วลุกขึ้นยืน ก่อนจะยื่นมือออกมาอย่างสุภาพ อีวานยื่นมือไปจับตอบ\n\n“อย่าได้เศร้าโศกถึงผู้ที่ล่วงหน้าไปก่อนเลย”\n\n“ผมยืนอยู่เคียงข้างพวกเขา”\n\n“กระผมได้ยินมาว่าท่านพลีชีพในสนามรบไปแล้วครับผู้หมวด กระผมเห็นป้ายชื่อของท่านที่สุสานแห่งชาติชัดเจนเลย…”\n\n“ฉันเองก็ไม่คาดคิดเหมือนกันว่าจะยังมีผู้รอดชีวิตจากหน่วยจู่โจมที่ 3 เหลืออยู่”\n\n“พวกเรารอดชีวิตมาได้แทนที่บุรุษผู้ยอดเยี่ยมที่สุดแห่งยุคสมัยของพวกเราครับ”\n\n“พวกเราทุกคนก็เช่นกัน”\n\nภารกิจสุดท้ายที่หน่วยจู่โจมทั้งหมดของหน่วยเก็บกวาดได้รับมอบหมายให้ปฏิบัติก็คือ ‘การลอบสังหารเจ็ดราชามังกร’\n\nดังนั้น รวมถึงหน่วยของอีวานซึ่งเป็นหน่วยเดียวที่รอดชีวิตกลับมา หากจะมีผู้รอดชีวิตคนอื่นหลงเหลืออยู่อีก\n\nพวกเขาก็เป็นเพียงผู้รอดชีวิตที่เป็นหนี้บุญคุณของเหล่าบุรุษผู้ประเสริฐที่สุดเหล่านั้น\n\nอีวานตบไหล่โอซิปเบาๆ แล้วเอ่ยสั่งการอีกครั้ง\n\n“ไปตามดมิทรีมา แล้วแจ้งเชอร์คาตอฟไปว่า ‘เราต้องการรายชื่อนักศึกษาทั้งหมด ไม่ใช่แค่ปีหนึ่ง แต่เป็นนักศึกษาปริญญาตรีทุกชั้นปี รวมถึงรายชื่อคณาจารย์ทั้งหมด ผู้เข้าร่วมพิธีปฐมนิเทศ แขกวีไอพี ครอบครัว คนรู้จัก และญาติพี่น้อง เราต้องการรายชื่อของทุกคนที่สามารถเข้าออกสถาบันเซนต์ยันได้ในตอนนี้’”\n\n“รับทราบครับผู้หมวด เฮ้ย รีบไปรายงานผู้พันเชอร์คาตอฟ! สถานการณ์ฉุกเฉิน!”\n\nเหล่าเจ้าหน้าที่ต่างตื่นตกใจและตามสถานการณ์ไม่ทัน รีบวิ่งผละออกจากตำแหน่งไปอย่างเร่งรีบ\n\nอีวานจ้องมองไปยังหอประชุมอันพลุกพล่านที่พิธีปฐมนิเทศกำลังดำเนินอยู่ พลางสูดลมหายใจเข้าช้าๆ จนเต็มปอด\n\nผู้ข้ามมิติ\n\nบางทีอาจจะเป็นคนเกาหลี ไม่สิ ไม่สำคัญหรอก เพราะยังไงก็เป็นชาวโลกเหมือนกัน\n\nเพื่อนร่วมชาติ น่าเศร้าที่มันเป็นแบบนั้นจริงๆ\n\nเท่านั้นเอง ความรู้สึกขมขื่นผุดขึ้นมาในใจ ทั้งสำหรับคิมซอนอูและสำหรับอีวาน\n\nพวกมันต้องถูกกำจัด\n\nข้อมูลเกี่ยวกับฉากจบเป็นสิ่งจำเป็น\n\nตัวแปรที่มุ่งหน้าไปสู่ฉากจบต้องถูกขจัดทิ้ง\n\nและที่สำคัญที่สุด\n\n“ฉันไม่ใช่ NPC”\n\nอีวานหลับตาลง\n\nฉันไม่ใช่ NPC ความทรงจำ ประสบการณ์ และเส้นทางชีวิตของฉันไม่ได้เป็นแค่ส่วนหนึ่งของบทนำ ฉันไม่ใช่ NPC\n\nชีวิตของฉันไม่ใช่แค่เรื่องราวปูมหลังที่ผ่านเลยไป ฉันจะต้อง… ฉันจะต้อง…\n\nมีชีวิตรอดและกลับบ้านให้ได้\n\nเพราะฉะนั้น ขอบอกไว้ตรงนี้เลยว่าฉันมีเหตุผลที่จะฆ่าแกมากกว่าปล่อยให้แกมีชีวิตอยู่\n\nก่อนที่ฉันจะได้ยินชื่อ ‘อีวาน เปโตรวิช’ ใน ‘ต้นฉบับ’ เฮงซวยนั่น\n\nก่อนที่มันจะสายเกินไป อย่างแน่นอนที่สุด\n\n—\n\n“แฮ่ก แค่ก… นั่นมันตัวบ้าอะไรกันวะ…! อสุรกายดักทางล่วงหน้างั้นเรอะ? ไม่สิ บ้าเอ๊ย ไม่เคยได้ยินมาก่อนเลยว่ามีตัวอะไรแบบนี้อยู่ด้วย! อะไรกันวะเนี่ย ความชิบหายนี่มันเริ่มมาจากตรงไหนกัน!”\n\nขณะที่กำลังเหงื่อท่วมตัวและหอบหายใจอย่างหนัก จู่ๆ เสียงที่คุ้นเคยก็ดังขึ้น\n\n‘ท่านพ่อ’\n\n“กลับมาแล้วเรอะ? มัวไปทำอะไรอยู่…? ช่างเถอะ น่าสมเพชชะมัด”\n\n“ท่านพ่อ…”\n\n“นั่งลงได้แล้ว แค่ไปเข้าห้องน้ำยังทำเรื่องวุ่นวายได้ขนาดนี้ แกนี่ไม่เคยเปลี่ยนเลยจริงๆ”\n\nไอ้คำสาป ‘ลูกคนเล็กจอมเสเพล’ นี่\n\nถ้าคำว่า ‘จอมเสเพล’ เป็นสูตรสำเร็จของนิยายแฟนตาซีทั่วไปทันทีที่ข้ามมิติมา\n\nเราควรจะปัดเป่าเหตุการณ์ ‘การบุกโจมตีสถาบัน’ ได้อย่างองอาจผ่าเผย และเริ่มต้นพลิกสถานการณ์สร้างชื่อเสียงจากตรงนี้แท้ๆ แต่จู่ๆ เควสต์กลับถูกยกเลิกไปเสียดื้อๆ!\n\n[“เควสต์ระดับ D” ป้องกันการบุกโจมตีสถาบัน -ถูกยกเลิก-]\n\n[สถาบันกำลังถูกโจมตีโดยกลุ่มคนนิรนาม! จงขับไล่การจู่โจมที่มุ่งเป้ามายังหอประชุมใหญ่และอาคารเรียนปริญญาตรีระหว่างพิธีปฐมนิเทศ!]\n\n[เป้าหมาย: เก็บกู้วัตถุระเบิดภายในวิทยาเขต 3/3 (ถูกเก็บกู้แล้ว)]\n\n[เป้าหมายเสริม: กำจัดผู้บุกรุก -ถูกยกเลิก-]\n\n[เป้าหมายเสริม: ปกป้องนักศึกษาใหม่ 0/322 -ถูกยกเลิก-]\n\n[รางวัล: -ถูกยกเลิก-]\n\n“บัดซบเอ๊ย”\n\nพลาดเควสต์สำคัญช่วงต้นเกมไปเสียแล้ว เหตุการณ์บุกโจมตีสถาบันไม่ได้มีไว้เป็นเวทีเปิดตัวของตัวเอกหรอกหรือไง?\n\nเป็นโอกาสทองในการสร้างความประทับใจอันชัดเจนต่อหน้าเหล่านางเอกและสหายในอนาคต เพื่อเรียกเสียงชื่นชมจากเหล่าอาจารย์แท้ๆ…!\n\nจู่ๆ พอเควสต์ถูกยกเลิกไปเฉยๆ ฉันก็ตกใจแทบแย่ รีบวิ่งหน้าตั้งมาดู กลับต้องมาเจอกับสัตว์ประหลาดหน้าตาเหมือนซานตาคลอส!\n\nแล้วทีนี้ นี่มันบ้าอะไรอีกล่ะเนี่ย?\n\n[“เควสต์ระดับ ???” คนสวนแห่งสถาบันเซนต์ยัน]\n\n[คุณตกเป็นเป้าสายตาของเขาเสียแล้ว ขอให้โชคดี]\n\n[เป้าหมาย: กำจัดคนสวนแห่งสถาบันเซนต์ยัน อีวาน เปโตรวิช]\n\n[เป้าหมายเสริม: เกลี้ยกล่อม อีวาน เปโตรวิช]\n\n[เป้าหมายเสริม: ปกปิดข้อมูล]\n\n[เป้าหมายเพิ่มเติม: เอาชีวิตรอด]\n\n[บทลงโทษเมื่อล้มเหลว: ความตาย]"
    },

      "title": "บทที่ 19",
      "content": "“รุ่นพี่ครับ ไม่คิดเหรอว่ามาเจอกันที่นี่มันดูประดักประเดิดไปหน่อย? สถานเลี้ยงเด็กกำพร้าสิครับ สถานเลี้ยงเด็กกำพร้า นั่นต่างหากที่ที่เราควรนัดเจอกัน พี่คิดว่าผมบริจาคเงินอุปถัมภ์สถานเลี้ยงเด็กกำพร้าของพี่เป็นประจำไปเพื่ออะไรกันครับเนี่ย?”\n\n“มันเป็นเรื่องด่วน”\n\n“เฮ้อ… พี่เล่นบุกมาแบบรีบร้อนขนาดนี้ แล้วทำไมต้องไปซ้อมเด็กๆ พวกนั้นอีกล่ะครับ? ให้ตายสิ แค่ฝากข้อความมาก็พอแล้วแท้ๆ”\n\nดมิทรีบ่นพึมพำพลางนำทางอีวานไปยังร้านกาแฟใกล้เคียง\n\nชั้นสองของร้านกาแฟใกล้มหาวิทยาลัยแห่งนี้เนืองแน่นไปด้วยผู้คนที่มารอให้พิธีปฐมนิเทศจบลง\n\nหรืออย่างน้อยก็ดูเหมือนจะเป็นเช่นนั้น\n\nทันทีที่ดมิทรีนำอีวานเดินขึ้นบันไดมายังชั้นสอง ร้านกาแฟที่เคยจอแจก็พลันเงียบสงัดลงในบัดดล\n\n“เอ้า ทำตัวตามสบายเหมือนคนอื่นเขานั่นแหละ ทำตัวให้เป็นปกติเข้าไว้”\n\nเมื่อดมิทรีโบกมือ เหล่าสายลับที่นั่งอยู่เต็มร้านกาแฟก็กลับไปทำตัวเป็นพลเมืองธรรมดาดังเดิม ตรงกลางร้านมีโต๊ะตัวหนึ่งที่จัดวางตำแหน่งไว้อย่างชาญฉลาดให้พ้นจากสายตาทั้งจากทางหน้าต่างและทางบันไดตั้งว่างอยู่\n\n“นั่งสิครับ เอ้อ จุดนัดพบเดิมตรงนั้นเคยเป็นจุดปลอดภัยก็จริง แต่ตอนนี้คงใช้ไม่ได้อีกแล้ว พี่รู้ไหมว่าการสร้างจุดซ่อนตัวใจกลางเฟรเชนกายามันยากเย็นแค่ไหน?”\n\n“ขอโทษที”\n\n“ช่างเถอะครับ ว่าแต่พี่เอาอะไรติดมือมาด้วยล่ะ?”\n\nดมิทรียิ้มและยื่นมือออกไป อีวานจึงล้วงอุปกรณ์ระเบิดขนาดเล็กสามลูกออกมาจากด้านในเสื้อโค้ต\n\nสีหน้าของดมิทรีจางหายไปชั่วขณะ เมื่อเห็นมือของอีกฝ่ายขยับเข้าไปใกล้ระเบิดอย่างนุ่มนวล อีวานจึงเอ่ยขึ้น\n\n“ถอดชนวนออกหมดแล้ว”\n\n“ทำไมไม่บอกให้เร็วกว่านี้เล่าครับ!! โธ่ ตกใจแทบสิ้นใจ!”\n\n“ถ้านายหวาดระแวงฉันขนาดนั้น ก็ไม่ควรจ้างฉันมาตั้งแต่แรกแล้ว”\n\n“ทำไมต้องพูดจาประชดประชันกันขนาดนั้นด้วยครับ? ในสายงานของพวกเรา ต่อให้เป็นพ่อแม่แท้ๆ ก็ยังอดระแวงพวกเราไม่ได้เลย”\n\nดมิทรียักไหล่แล้วหยิบระเบิดขึ้นมาตรวจสอบ หลังจากพลิกหมุนเล่นอยู่ครู่หนึ่ง รอยยิ้มกว้างก็ค่อยๆ ปรากฏขึ้นบนใบหน้าของเขา\n\n“น่าสนใจแฮะ นี่มันอยู่ในสถาบันเซนต์ยันเลยเหรอครับ?”\n\n“ใช่ พวกมันเป็นมืออาชีพ”\n\n“ดูออกเลยครับ สามลูก ประเมินจากอานุภาพแล้ว ดูไม่น่าจะเป็นการถล่มอาคารหรือลอบสังหาร นี่มันเอาไว้เบี่ยงเบนความสนใจใช่ไหมครับ?”\n\n“ใช่ เป็นไปได้ว่าคงมีทีมแทรกซึมอีกชุดแยกต่างหาก”\n\n“ฝั่งเราไม่ได้พลาดใครไปแน่นอนครับ ไม่ใช่พวกกษัตริย์นิยมแน่ๆ พวกเราจับตาดูคนกลุ่มนั้นอย่างใกล้ชิดอยู่ตลอด”\n\nดมิทรีหัวเราะหึๆ พลางตบมือเข้าหากัน ไม่นานนัก สายลับคนหนึ่งที่ปลอมตัวเป็นหญิงวัยกลางคนธรรมดาก็เดินเข้ามาหา\n\n“ส่งของพวกนี้ไปให้แผนกเวทมนตร์ของกองบัญชาการใหญ่”\n\n“รับทราบค่ะ ผู้หมวด”\n\n“แล้วเอกสารล่ะ? เตรียมพร้อมหรือยัง?”\n\n“เรียบร้อยค่ะ”\n\nเธอหยิบปึกเอกสารหนาเตอะออกมาจากตะกร้า ดมิทรีกวาดสายตาอ่านผ่านๆ ครู่หนึ่งก่อนจะดันมันไปทางอีวาน\n\n“นี่คือข้อมูลที่พี่ขอไว้ ผมนี่ลำบากแทบแย่กว่าจะจัดเตรียมให้ได้ในเวลาเร่งด่วนขนาดนี้ ถึงแม้ว่าองค์หญิงจะทรงสนับสนุนพี่อย่างจริงใจก็ตาม แต่ เอ่อ ก็เอาเถอะครับ”\n\n“ขอบใจมาก”\n\n“ไม่เป็นไรครับ อ้อ องค์หญิงทรงอยากพบพี่ด้วยนะครับ พี่จะว่างเมื่อไหร่?”\n\n“ช่วงนี้คงจะลำบากหน่อย”\n\nอีวานหยิบปึกเอกสารขึ้นมาแล้วลุกขึ้นยืน ขณะที่เขาหันหลังเตรียมจะเดินจากไป เสียงหนึ่งก็ดังขึ้นมาจากด้านหลัง\n\n“รุ่นพี่ครับ”\n\n“หือ”\n\n“ใต้ตาพี่คล้ำมากเลยนะครับ พี่รู้ตัวใช่ไหม?”\n\n“…”\n\nเมื่อดมิทรีหันกลับมา เขาก็มองอีวานด้วยสีหน้าจริงจัง\n\nเงามืดพาดผ่านใต้ปีกหมวกของเขา และดวงตาคู่นั้นก็ทอประกายจ้องมองอย่างเฉียบคมและแม่นยำ\n\n“ผ่อนคลายบ้างเถอะครับ ที่นี่ไม่ใช่สนามรบสักหน่อย”\n\n“…อืม”\n\n“เอาเถอะ มันก็ออกจะเกินเลยไปหน่อยสำหรับคนที่เกษียณแล้วแต่ยังถูกขอร้องให้มาทำงาน แต่สิ่งสำคัญคือพี่ควรมองให้กว้างขึ้นและอย่าไปกดดันตัวเองว่าจะต้องทำทุกอย่างให้ไร้ที่ติ ทั้งองค์หญิงและผมต่างก็ไม่ได้คาดหวังความสมบูรณ์แบบจากพี่หรอกนะครับ”\n\nโดยไม่เอ่ยตอบสิ่งใด อีวานเพียงพยักหน้ารับเบาๆ แล้วหันหลังเดินจากไป\n\nดมิทรีหัวเราะเบาๆ พลางเอียงศีรษะ “เพราะงี้ไงคนเราถึงควรมีความรัก เอาแต่อุดอู้อยู่แต่ในรู ไม่ยอมออกมาตากแดดตากลมบ้าง มันจะหดหู่ขนาดไหนกันนะ จริงไหม?”\n\n“ผู้หมวดเปโตรวิช… สมกับฉายาอีวาน ‘ตัวน้อย’ จริงๆ ครับ กิตติศัพท์ไม่ได้เกินจริงเลย น่าประทับใจมาก”\n\n“ตอนเจอพี่แกครั้งแรก ฉันแทบฉี่ราดแน่ะ คิดดูสิว่าคนที่เอาแต่นั่งว่างงานมาตั้งสี่ปีจะยังมีความสามารถระดับนี้อยู่ เอาเถอะ”\n\nดมิทรีเคาะโต๊ะเป็นจังหวะพลางเอ่ยกำชับ “หาใครสักคนไปประกบพี่แกไว้ อย่าปล่อยให้พี่แกอยู่คนเดียว”\n\n“จะให้ผมเข้าแทรกแซงถ้าท่านทำเกินเลยไปไหมครับ?”\n\n“ห๊ะ? นายอยากรนหาที่ตายหรือไง? แค่เฝ้าสังเกตการณ์พอ แต่ต้องเว้นระยะห่างที่ปลอดภัยมากๆ เลยนะ”\n\nต่อให้ล้ำเส้นไปบ้าง แล้วรุ่นพี่จะผลักดันไปได้ไกลสักแค่ไหนกันเชียว? บางทีพี่แกอาจจะแค่กระตือรือร้นอยากเข้าไปสืบหาตัวคนร้ายที่อยู่เบื้องหลังระเบิดพวกนี้ อย่างมากก็คงแค่ทำให้นักศึกษาบางคนขวัญผวา — แล้วจะมีประโยชน์อะไรที่จะไปยั่วโมโหอีวานในตอนที่กำลังหงุดหงิดอยู่?\n\nในขณะที่ดมิทรีกำลังครุ่นคิดเรื่องนี้อยู่นั้น\n\nอีวานก็กลับมายังห้องทำงาน หยิบขวานและโพชั่นรักษาบาดแผลออกมาแล้ว\n\n—\n\n***\n\nเรื่องนี้ไม่อาจบอกใครได้\n\nเรื่องที่ว่าแท้จริงแล้วโลกใบนี้เป็นเพียงเกมชนิดหนึ่ง และถูกขับเคลื่อนด้วยระบบอันซับซ้อน\n\nดังนั้น ฉันจึงต้องลงมือทำด้วยตัวเอง\n\nอีวานเชื่อเช่นนั้นอย่างสุดใจขณะที่กางรายงานที่ได้รับมาจากดมิทรีลงบนโต๊ะ\n\n– รายชื่อคณาจารย์\n\n– รายชื่อนักศึกษาใหม่\n\n– ข้อมูลส่วนตัวของนักศึกษาระดับปริญญาตรี\n\nปีนี้มีนักศึกษาใหม่เข้าเรียนกว่า 300 คน สถาบันเซนต์ยันมีหลักสูตรสามปี ดังนั้นจำนวนนักศึกษาปริญญาตรีทั้งหมดจึงเกือบแตะหนึ่งพันคน\n\nเมื่อนับรวมบุคลากรทั้งหมด ทั้งคณาจารย์ ผู้ช่วยสอน ฝ่ายรักษาความปลอดภัย เจ้าหน้าที่ธุรการ กองรับสมัคร รวมถึงนักศึกษาที่เข้าเรียนต่อระดับบัณฑิตศึกษาหรือผู้ที่เลื่อนการสำเร็จการศึกษาด้วยเหตุผลต่างๆ เช่น การพักการเรียน\n\nรวมทั้งสิ้น: 1,733 คน\n\n“ยังขาดอีกอย่างหนึ่ง”\n\nเขาต้องตรวจสอบ ‘ครอบครัว’ ของนักศึกษาที่มีสิทธิ์เข้าร่วมพิธีปฐมนิเทศด้วย\n\nหากมีความเป็นไปได้มากพอที่ทุกคนจะได้ก้าวเท้าเข้ามาในบริเวณสถาบันในวันพิธีเปิดภาคเรียน เช่นนั้นทุกคนก็ล้วนถือเป็นผู้ต้องสงสัยได้ทั้งสิ้น\n\nนั่นหมายความว่า หากนับรวมบุคคลสำคัญจากนานาประเทศและครอบครัวของนักศึกษาเข้าไปด้วย รวมทั้งสิ้น: 2,429 คน\n\n“ฉันรู้ว่าแกอยู่ในนั้น”\n\nอีวานจัดเรียงกองเอกสารที่คัดแยกตามหมวดหมู่แล้วเคาะลงไปบนนั้นอย่างหนักแน่น\n\n“อย่าคิดว่าจะหากันเจอได้ง่ายๆ เชียว”\n\nความหยิ่งผยองคือคมมีดที่คมกริบที่สุดซึ่งสังหารสายลับมานักต่อนักแล้ว\n\n“แต่มันคงใช้เวลาไม่นานนักหรอก สัญญาเลย”\n\nคนที่มีความสามารถพิเศษในนิยายแนวสถาบันไม่มีทางใช้ชีวิตในรั้วโรงเรียนอย่างสงบสุขได้หรอก\n\nนั่นคือสามัญสำนึก\n\nพวกนั้นจะต้องคอยปัดป้องการโจมตี ผูกขาดสกิล และไปบังเอิญได้รับพลังนิมิตหรือลางสังหรณ์จากที่ไหนสักแห่ง\n\nโดยแก่นแท้แล้ว เรื่องราวแนวสถาบันการศึกษามักจะดำเนินตามแพลตฟอร์ม ‘สำเร็จรูป’ มาตรฐาน ก็ช่วยไม่ได้นี่นะ ใครกันจะอยากอ่านเรื่องราวของคนที่แค่ไปโรงเรียนตามปกติแล้วก็เรียนจบไปเฉยๆ?\n\nเพราะฉะนั้น ถ้าไอ้หมอนั่นรู้จัก ‘ต้นฉบับ’ ล่ะก็\n\nมันชัดเจนอยู่แล้วว่าหมอนั่นจะต้องเลียนแบบการเคลื่อนไหวของตัวเอกในเรื่องต้นฉบับอย่างไม่ต้องสงสัย พวกที่มีความสามารถพิเศษทุกคนก็ใช้ชีวิตแบบนั้นกันหมด\n\nแม้แต่ความคิดแรกเริ่มของคิมซอนอูตอนที่ข้ามมิติมาใหม่ๆ ก็ยังเป็น ‘การผูกขาดสกิล’ และ ‘การเผยแพร่วัฒนธรรมยุคใหม่’ เลย\n\nดังนั้น พวกผู้ครอบครองพลังทุกคนล้วนเห็นแก่ตัวสุดขีด เต็มไปด้วยตัวแปร และไม่ว่าการกระทำกะทันหันแบบไหนจะโผล่ออกมาจากพวกนั้น ก็ไม่ใช่เรื่องน่าแปลกใจเลยสักนิด\n\nหลังจากสงครามอันดุเดือดที่พวก NPC ต่อสู้กันจบสิ้นลงแล้ว บางทีพวกมันคงอยากจะเข้ามาสมัครเรียนใน ‘สถาบัน’ อย่างสงบสุข และดื่มด่ำกับเรื่องราวที่อิงตามเกมอย่างแสนเพลิดเพลิน\n\nพวกมันคงไม่สนใจหรือเข้าใจชีวิตของผู้คนนับไม่ถ้วนที่เดินผ่านไปมาในฉากหลังหรอก\n\nพวกมันก็แค่เสพสุขกับมัน คงรู้สึกราวกับตัวเองได้มาเที่ยวสวนสนุกที่สร้างขึ้นมาอย่างประณีต\n\nความจริงที่ว่าความคิดเหล่านี้เป็นเพียงการระบายอารมณ์ ความเกลียดชังที่ไร้ทิศทาง หรือกระทั่งความริษยาที่ไร้เหตุผล ตัวเขาเองก็ตระหนักดีอยู่แล้ว\n\n“นั่นตัวอะไรน่ะ? ซานตาคลอสเหรอ?”\n\nมันเป็นเพียงคำพูดเปรยๆ ไม่ได้ตั้งใจ แต่คำคำนั้นเพียงคำเดียวก็เผยให้เห็นอย่างชัดเจนแล้วว่าหมอนั่นปฏิบัติต่อคนอื่นอย่างไร\n\nมันไม่คิดจะปิดบังด้วยซ้ำว่าตัวเองข้ามมิติมา แค่สนุกไปกับมันเท่านั้น คำพูดเพียงคำเดียวนั้นบิดกระชากหัวใจของอีวาน\n\nคำพูดเพียงคำเดียวที่มองผู้อื่นเป็นเพียง ‘สิ่งของ’\n\n“ผู้หมวดครับ! เห็นเมื่อกี้ไหม? ผมสุดยอดไปเลยใช่ไหมล่ะ? ผมปัดการโจมตีทั้งเจ็ดครั้งได้หมดเลย!”\n\n“อย่าเพิ่งพูด”\n\n“ฮ่าๆ ถ้าท่านสั่ง ผมอาจจะทำได้อีกรอบก็ได้นะครับ น่าเสียดายชะมัด ผมน่าจะเอียงโล่ไปทางขวาอีกสักหน่อย”\n\n“เชอร์โนวิกา อย่าพูด”\n\n“ถ้าผมทำแบบนั้น บางทีเจ้าโง่ซาชาอาจจะรอดไปแล้วก็ได้ น่าเสียดายจริงๆ ครับผู้หมวด น่าเสียดายจริงๆ”\n\n“เราใกล้จะถึงแล้ว อดทนอีกนิดนะ ขอร้องล่ะ”\n\n“ผมจะไปอยู่เป็นเพื่อนซาชานะ…. ถึงตอนนั้น พวกเราก็จะไม่โดดเดี่ยวอีกต่อไป พวกเราจัดการความสัมพันธ์กันได้ดีเสมอนี่นา….. ไม่ว่าจะเป็นสวรรค์หรือนรกก็ตาม”\n\n“ขอร้องล่ะ เงียบเถอะ เลือดมันจะเย็นตัวเร็วกว่าเดิมนะ เชอร์โนวิกา ได้โปรด”\n\n“อยู่ให้นานๆ นะครับ…. ผู้หมวด…. ตามมาให้ช้าที่สุดเท่าที่จะทำได้นะ…. ถ้าท่านรีบมา…. พวกเราคงลำบากใจแย่”\n\nเรื่องราวของพวกเขาไม่ใช่แค่ฉากหลัง\n\nท่ามกลางกองเอกสารที่กระจัดกระจาย อีวานกำลังตกอยู่ในฝันร้าย\n\nมันคือความทรงจำจากเมื่อนานมาแล้ว\n\n“อย่าได้เศร้าโศกถึงผู้ที่ล่วงหน้าไปก่อนเลย”\n\n“ผมยืนอยู่เคียงข้างพวกเขา”\n\nเรื่องราวของพวกเขาไม่ใช่แค่ฉากหลัง\n\n– พวกเขาคือบุรุษผู้ยอดเยี่ยมที่สุดในยุคสมัยของตน\n\n– พวกเราทุกคนก็เช่นกัน\n\nประวัติศาสตร์ของพวกเขาไม่ใช่บทละครสำเร็จรูปอะไรนั่น\n\nไม่ ไม่มีทางเป็นแบบนั้นได้เด็ดขาด\n\nในห้วงฝันร้าย อีวานพึมพำออกมาอย่างเชื่องช้า\n\nพลางสดับฟังเสียงของคิมซอนอูที่กำลังตบหลังปลอบประโลมเขาอยู่\n\n“แกงกิมจิ ต็อกโบกี นาโช่ราดชีสละลาย หมูผัดซอส ข้าวยำปลาดิบ ปลาดิบเย็นสไตล์ซกโช รามยอนร้อนๆ\n\nบ้านเกิด บ้าน เกาหลี โซล ห้องเช่าบนดาดฟ้า พ่อแม่\n\nสถานีรถไฟใต้ดิน ร้านสะดวกซื้อ แสงสียามค่ำคืน บ้านเกิด ต้องกลับไปให้ได้ ตั้งใจให้แน่วแน่ อย่าหวั่นไหว เผชิญหน้ากับมันตรงๆ\n\nไม่เป็นไร พวกเราไม่ได้อยู่ตัวคนเดียว”\n\nหยิบจับสิ่งของที่ช่วยปลอบประโลมจิตใจขึ้นมาอย่างเลื่อนลอย\n\nจนกระทั่งค่ำคืนนี้สิ้นสุดลง\n\n—\n\nหลังจากเปิดภาคเรียน เอคไดซิสก็พบว่าตัวเองตกอยู่ในสถานการณ์ที่กลืนไม่เข้าคายไม่ออก\n\nไม่มีใครอยากนั่งกินข้าวกับเธอเลย แม้จะมีตำแหน่ง “เชื้อพระวงศ์” ในสถาบันแห่งนี้ซึ่งเป็นแหล่งรวมตัวของเหล่าขุนนางจากทั่วทุกมุมโลก แต่นั่นก็ไม่ได้ช่วยให้เธอรอดพ้นจากความโดดเดี่ยว\n\nอย่างไรก็ตาม การที่มีองครักษ์ราชวงศ์ (ชายวัยกลางคน กล้ามเป็นมัด และถือขวานติดตัวตลอดเวลา) คอยจ้องเขม็งอยู่แทบทุกฝีก้าว ย่อมเป็นภาระทางใจอย่างหนักหน่วงสำหรับเหล่านักศึกษาวัยหนุ่มสาวที่เพิ่งจะย่างเข้าวัยยี่สิบต้นๆ\n\n“อ๊า มันพังหมดก็เพราะท่านลุงนั่นแหละค่ะ!”\n\n“จะเป็นความผิดของลุงได้ยังไง? ปัญหามันอยู่ที่ไอ้พวกที่มาเกี้ยวพาราสีหลานสาวลุงตั้งแต่แรกไม่ใช่เรอะ?”\n\n“แล้วทำไมท่านลุงต้องไปขวางพวกผู้หญิงด้วยเล่าคะ!”\n\n“ก็ลุงได้ยินยัยพวกนั้นแอบนินทาหลานสาวลุงลับหลังแล้วนี่นา”\n\n“แง้… ชีวิตมหาลัยของหนู… ชีวิตของหนู… ท่านพ่อ… หนูเกลียดที่สุดเลย…!”\n\nนักศึกษาสาขาดุริยางคศิลป์ผู้แข็งแกร่งที่สุด ซึ่งกลายเป็นเป้าสายตาตั้งแต่วันแรกของการเปิดเทอม วิ่งร้องไห้โฮออกไป"
    },
