      "title": "บทที่ 39",
      "content": "มีคำกล่าวเชิงสุภาษิตอยู่ว่า ‘หากคิดจะซ่อนใบไม้ จงซ่อนไว้ในผืนป่า’ มันเป็นการพาดพิงถึงเทคนิคการพรางตัวอย่างขบขัน แม้จะไม่ได้มีที่มาเก่าแก่โบราณจริงจังก็ตาม\n\nดังนั้น หน่วยรบพิเศษที่แทรกซึมเข้าไปในป่าจึงกลายเป็นปรมาจารย์ในการวางกับดักโดยใช้ใบไม้ แม้ว่าวิธีการติดตั้งจะแตกต่างกันไปตามฤดูกาล แต่มันก็ค่อนข้างง่ายดายเนื่องจากในป่าแห่งนี้มีแค่ฤดูร้อนกับฤดูหนาวเท่านั้น\n\n– ติ๊ง –\n\n“อ๊ะ!!” (อิซาเบลล์)\n\nเมื่ออิซาเบลล์ได้ยินเสียงเส้นลวดขาด เธอก็รีบก้มตัวแล้วกลิ้งหลบ ตูม! เธอกลับพุ่งเข้าไปโดนแรงระเบิดของกับดักอีกตัวในทิศทางที่เพิ่งกลิ้งหนีไปพอดี\n\n“ไม่ตลกแล้วนะคะ! นี่มันอันตรายจริงๆ นะ!” (อิซาเบลล์)\n\n“ก็เธออยากฝึกแบบการรบจริงไม่ใช่หรือไง?” (อีวาน)\n\n“แต่นี่มันคนละระดับกันเลยนะคุณลุง!” (อิซาเบลล์)\n\nอิซาเบลล์ลุกขึ้นยืนแล้วเหวี่ยงดาบฟันตรงไปยังทิศทางของเสียง\n\n– เคร้ง!\n\n“สะกดอารมณ์ของเธอซะ” (อีวาน)\n\n“หนูอยากจะฆ่าคุณลุงใจจะขาดแล้วค่ะ!” (อิซาเบลล์)\n\nสถิติรวม 17 ครั้ง ชนะ 0 ครั้ง แพ้ 17 ครั้ง อิซาเบลล์กัดริมฝีปากแน่นขณะตวัดดาบไปด้วยความคับข้องใจ\n\nเคร้ง ปัง ประกายไฟแตกกระจายขณะที่คมขวานวูบวาบขึ้นท่ามกลางเงามืด มาถึงตอนนี้ มันได้กลายเป็นกิจวัตรประจำวันไปเสียแล้ว\n\nทันทีหลังเสียงปืนดังขึ้น ให้หลบไปทางเส้นทางหลบหนี พร้อมหลีกเลี่ยงกับดัก หากหลบกับดักได้ ให้พุ่งเข้าใส่ทิศทางที่หลบหลีกนั้น\n\nรูปแบบของอีวานนั้นเจ้าเล่ห์แสนกลราวกับปีศาจ ถึงขั้นชักนำแม้กระทั่งทิศทางการหลบหนีให้มุ่งหน้าเข้าสู่กับดักต่อเนื่อง เป็นกับดักระดับที่วางแผนให้ถึงตายหรือบาดเจ็บสาหัสได้ทันทีในวินาทีที่เหยื่อร้องอุทานว่า ‘อ๋อ รู้ทันแล้ว!’\n\nหลังจากผ่านไปหลายวัน ตอนนี้อิซาเบลล์สามารถหลับตาลงแล้วก็ยังกะจังหวะโจมตีสวนกลับได้แล้ว\n\n“ยอดเยี่ยม” (อีวาน)\n\nอีวานยิ้มขื่นเล็กน้อย ก่อนจะเก็บขวานเข้าที่แล้วก้าวถอยหลังไป สายลมเย็นสบายในผืนป่าพัดหยอกล้อปอยผมหน้าม้าของอิซาเบลล์\n\n“ว่าแล้วเชียว คนเรายิ่งได้รับการฝึกฝนก็ยิ่งแข็งแกร่งขึ้น” (อีวาน)\n\n“หนูว่าคำนิยามของคำว่า ‘คน’ ที่หนูรู้จักกับที่คุณลุงรู้จักมันน่าจะต่างกันอยู่นิดหน่อยนะคะ” (อิซาเบลล์)\n\n“อย่างน้อยเธอก็ตามมาได้ทัน” (อีวาน)\n\nอีวานไม่เคยตระหนี่คำชม เขาคือคนที่เคยประมือกับปาร์ตี้ผู้กล้ามาโดยตรง โดยธรรมชาติแล้วมาตรฐานของเขาย่อมสูงลิบเสียดฟ้า ทว่าเรื่องน่าขำก็คือ ด้วยเหตุนั้น มาตรฐานสำหรับการรับมือกับ ‘ผู้รับการฝึก’ จึงต่ำเตี้ยเรี่ยดินอย่างที่สุด\n\nตราบใดที่ทหารนายหนึ่งสามารถปฏิบัติหน้าที่ได้ในระดับค่าเฉลี่ย แค่นั้นก็เพียงพอแล้วสำหรับกองทัพ ตราบใดที่มันไม่เป็นอุปสรรคต่อการปฏิบัติภารกิจ ก็นับว่าเพียงพอแล้ว\n\nแต่ต่อจากนี้ไม่ใช่อีกต่อไป อีวานที่ถือขวานอยู่ปรับท่ายืนของตนเอง\n\nเขาได้ถ่ายทอดเทคนิคพื้นฐานทั้งหมดที่จำเป็นสำหรับการรับมือการซุ่มโจมตีไปแล้ว ต่อจากนี้คือเรื่องของสัญชาตญาณและความชำนาญ\n\nดังนั้น เวลาที่เหลืออยู่ก็คือ\n\n“จับดาบไว้” (อีวาน)\n\nการสั่งสอนขอบเขตของผู้ก้าวข้ามขีดจำกัด\n\nแววตาของอีวานลุ่มลึกลง พลังเวทพลุ่งพล่าน และหนวดเคราของเขาก็พลิ้วไหวกลางอากาศ\n\nยอดฝีมือที่แท้จริง เหล่าผู้ที่ก้าวเท้าเข้าสู่สนามรบของผู้ก้าวข้ามขีดจำกัด ต่างก็มี ‘ระดับชั้น’ ที่แตกต่างออกไป\n\nอิซาเบลล์จำเป็นต้องก้าวไปให้ถึงจุดนั้น ต่อให้ต้องยัดเยียดอัดมันเข้าไปในหัวของเธอก็ตาม\n\n‘สถาบันการศึกษามันอันตราย’\n\nมหาวิทยาลัยแห่งหนึ่งจะอันตรายได้สักแค่ไหนเชียว? เอาเถอะ หากมันจัดอยู่ในประเภท ‘สถาบันการศึกษาในนิยาย’ โดยแก่นแท้แล้ว ‘สถาบันการศึกษา’ ก็ไม่ต่างอะไรกับแนวหน้าของสมรภูมิรบหรอก\n\nนั่นคือ ‘สามัญสำนึก’\n\n“ยืดดาบออกไป” (อีวาน)\n\n“คะ? อ๊ะ ค่ะ” (อิซาเบลล์)\n\nอิซาเบลล์ยืดดาบออกไปข้างหน้า ตั้งท่าทางได้อย่างไร้ที่ติ ตั้งแต่การจับด้ามดาบไปจนถึงการจัดวางเท้า ความสมดุลตั้งแต่ช่วงเอวจนถึงข้อมือ — แทบจะสมบูรณ์แบบไร้ข้อตำหนิ\n\nสมกับที่เป็นลูกสาวของผู้กล้าจริงๆ พรสวรรค์ติดตัวด้านสมรรถภาพทางกายของเธอนั้นยอดเยี่ยมไร้ข้อกังขา\n\nดังนั้น สิ่งเดียวที่ยังขาดอยู่ก็คือการเรียนรู้และประสบการณ์\n\n“ทนรับไว้ให้ได้” (อีวาน)\n\n“…ว่าไงนะคะ?” (อิซาเบลล์)\n\nช่างเป็นคำพูดที่ฟังดูอุ่นใจเสียจริง เธอกำลังจะเอ่ยปากล้อเล่นและหัวเราะออกมาอยู่แล้วเชียว ทว่า—\n\n– วิ้งงง—\n\nแขนของอีวานพร่าเลือนไป และในชั่วพริบตา ใบดาบของเธอก็ดูราวกับแยกออกเป็นสองซีก\n\nทั้งที่เขาฟันดาบจนหักด้วยขวาน ทว่าแรงกระแทกกลับไม่ส่งมาถึงตัวเธอเลยแม้แต่น้อย ราวกับหั่นเต้าหู้ คมขวานกวาดใบดาบให้ขาดสะบั้นไปในพริบตา\n\n“นี่มันอะไรกันอีกล่ะเนี่ย…?” (อิซาเบลล์)\n\nอิซาเบลล์หัวเราะออกมาอย่างไม่อยากจะเชื่อ เธอจ้องมองดาบที่หักสะบั้นด้วยสายตาว่างเปล่า\n\n“อันนี้มันแพงมากเลยนะ… ไม่สิ เอาจริงดิ….” (อิซาเบลล์)\n\n“เห็นไหม?” (อีวาน)\n\n“เห็นอะไรคะ? การแปลงร่างดาบของหนูให้กลายเป็นเศษเหล็กน่ะเหรอ…?” (อิซาเบลล์)\n\n“การแยกส่วนห้วงเวลา (Temporal dissociation)” (อีวาน)\n\nอีวานควงขวานในมือแล้วปรับท่ายืน\n\n“ประสาทสัมผัสทางการได้ยินของมนุษย์ใช้เวลา 0.1 วินาที ประสาทสัมผัสทางกายใช้เวลา 0.25 วินาที นี่คือขีดจำกัดอันชัดเจนของการฝึกฝน” (อีวาน)\n\nมันคือข้อจำกัดทางกายวิภาคของมนุษย์ ความเร็วในการตอบสนองของเส้นประสาทถูกจำกัดด้วยความเร็วทางกายภาพของสิ่งเร้าที่ส่งผ่านจากอวัยวะรับสัมผัสไปยังสมอง\n\nในโลกแฟนตาซียุคก่อนสมัยใหม่ใบนี้ วิชากายวิภาคศาสตร์ยังไม่พัฒนาไปถึงขั้นนั้น ทว่าน่าประหลาดที่โลกใบนี้มีพลังเวทมนตร์ดำรงอยู่\n\nทรัพยากรสารพัดประโยชน์นี้ ซึ่งจะกลายเป็นต่างหูเมื่อแขวนไว้ที่หู และกลายเป็นห่วงจมูกเมื่อแขวนไว้ที่จมูก สามารถเข้าไปแทรกแซงระบบประสาทของมนุษย์ได้โดยตรง เพื่อผลักดันความเร็วในการส่งสัญญาณให้ไปถึงขีดจำกัด\n\nพูดง่ายๆ ก็คือ การแยกส่วนห้วงเวลา\n\n“เสริมพลังให้เส้นประสาทด้วยเวทมนตร์ แล้วโลกอีกใบจะเปิดออก อิซาเบลล์ ยังมีขอบเขตที่ก้าวข้ามขีดจำกัดของการมองเห็น การรับรู้ และการเคลื่อนไหวอยู่อีก” (อีวาน)\n\nสถานที่แห่งนั้นคือสนามรบของผู้ก้าวข้ามขีดจำกัด\n\nผู้ที่สามารถก้าวไปถึงจุดนั้นได้มีจำนวนจำกัดมาก ทว่าหากมีพรสวรรค์และประสบการณ์มากพอ ท้ายที่สุดพวกเขาก็จะไปถึงจุดหมาย\n\nมันคือจุดเริ่มต้นของการห้ำหั่นสำหรับผู้ที่มี ‘ระดับชั้น’ หากไม่อาจไปถึงจุดนี้ได้ ก็ไม่มีวันหลุดพ้นจากการเป็นเพียงทหารธรรมดาไปได้\n\nแต่อิซาเบลล์ไม่ใช่ตัวประกอบ เธอคือหนึ่งในตัวเอกของโลกใบนี้อย่างชัดเจน ดังนั้นมาตรการป้องกันจึงเป็นสิ่งจำเป็น ยิ่งเธอก้าวไปถึงจุดนี้ได้เร็วเท่าไหร่ ก็ยิ่งได้เปรียบมากเท่านั้น\n\nหากไม่อาจคอยปกป้องเธออยู่ข้างกายได้ตลอดเวลา สิ่งที่ดีที่สุดที่อีวานทำได้ก็คือสิ่งนี้ — การผลักดันเธอให้ก้าวไปข้างหน้า\n\n“ต่อให้คุณลุงจะมาบอกให้หนูทำแบบนั้นกะทันหัน…” (อิซาเบลล์)\n\n“เธอทำได้แน่” (อีวาน)\n\n“ค่ะ แน่นอนค่ะ ถ้าคุณลุงสอน หนูก็จะพยายามทำให้เต็มที่” (อิซาเบลล์)\n\n“จงสัมผัสมันไปเรื่อยๆ จนกว่าจะทำได้” (อีวาน)\n\n“เอ๊ะ?” (อิซาเบลล์)\n\nอีวานพลิกจับขวานกลับด้าน หันคมขวานเข้าหาแผ่นหลังของตัวเอง ดูไร้พิษสงโดยสิ้นเชิง เขายิ้มออกมาด้วยสีหน้าใสซื่อไร้เดียงสา\n\n“สัญชาตญาณการเอาตัวรอดคือรากฐานของการเติบโต” (อีวาน)\n\n“พูดเรื่องบ้าๆ ออกมาได้หน้าตาเฉยเลยนะคะ…” (อิซาเบลล์)\n\nอิซาเบลล์หยิบดาบที่หักขึ้นมา พลางก่นด่าตัวเองในอดีตที่ดันไปขอร้องให้ไอ้คนบ้าคนนี้มาช่วยฝึกให้\n\nนั่นคือภาพสุดท้ายที่อิซาเบลล์มองเห็น\n\n– โครมมม! –\n\n***\n\n“เบลล่า เบลล่า? เบลล่า!!” (เอคไดซิส)\n\n“เอ๊ะ? อ๊ะ?” (อิซาเบลล์)\n\nอิซาเบลล์สะดุ้งตื่นแล้วเงยหน้าขึ้นมอง เบื้องหน้าของเธอ เอคไดซิสกำลังจ้องมองมาด้วยสีหน้าเป็นกังวล\n\nในวันฤดูใบไม้ผลิอันอบอุ่น เอคไดซิสและอิซาเบลล์กำลังนั่งรับประทานอาหารกลางวันด้วยกัน\n\nโอ้ โชคดีจังที่เป็นแค่ความฝัน (แต่จริงๆ แล้วไม่ใช่เลย)\n\nเมื่อรู้สึกเสียวแปลบแล่นลงมาตามแขน อิซาเบลล์ก็เงยหน้าขึ้น\n\n“ช่วงนี้เธอทำตัวแปลกๆ นะ เกิดอะไรขึ้นหรือเปล่า?” (เอคไดซิส)\n\n“ก็… ฮ่าๆๆ แค่วุ่นๆ กับการเตรียมสอบน่ะจ้ะ” (อิซาเบลล์)\n\n“ทำไมต้องตั้งใจเรียนขนาดนั้นด้วยล่ะ… อืม… เป็นเพราะอยู่คณะอัศวินหรือเปล่านะ? ช่วงนี้เธอดูใจลอยกว่าเดิมเยอะเลย” (เอคไดซิส)\n\nในฐานะบุตรสาวของผู้กล้า อิซาเบลล์ได้รับสิทธิพิเศษมากมาย ยกตัวอย่างเช่น การได้รับนักบวชประจำตัวที่ราชวงศ์ทิลีสจัดหามาให้เป็นการเฉพาะ\n\nต่อให้ทุกค่ำคืนเธอจะกลับมาในสภาพแทบแหลกสลายเป็นชิ้นๆ วันรุ่งขึ้นเธอก็ยังสามารถไปเรียนที่สถาบันได้ในสภาพร่างกายที่สมบูรณ์พร้อมเต็มร้อย\n\nทว่าร่างกายมนุษย์ไม่ได้ถูกออกแบบมาให้เป็นเช่นนั้น น่าเสียดายที่อาการบาดเจ็บและความเหนื่อยล้ายังคงสะสมอยู่ภายใน รอยคล้ำใต้ตาของอิซาเบลล์คือหลักฐานของเรื่องนั้น\n\n“แถมช่วงนี้เธอก็ดูแปลกๆ ไปด้วยนะ ไปเจอกับใครมาหรือเปล่าเนี่ย?” (เอคไดซิส)\n\n“เจอใครเหรอ? ฉันไม่ได้ไปเจอใครสักหน่อย!” (อิซาเบลล์)\n\nอาจเป็นเพราะได้รับการเลี้ยงดูอย่างสูงศักดิ์ในพระราชวังทิลีส เสื้อผ้าและเครื่องประดับของอิซาเบลล์จึงล้วนเป็นของชั้นเลิศทั้งสิ้น ถึงกระนั้น ช่วงนี้ก็ดูเหมือนเธอจะใส่ใจแต่งตัวมากกว่าปกติเป็นพิเศษ\n\nเอคไดซิสครุ่นคิดดูว่าในคณะอัศวินมีผู้ชายดีๆ อยู่บ้างไหม ก่อนจะขมวดคิ้วมุ่นเมื่อนึกถึงหน้าคุณลุงของตัวเองขึ้นมา\n\nคณะอัศวินนี่มันสถานที่อันน่าสะพรึงกลัวชัดๆ\n\n“คุณยูริไม่รู้อะไรบ้างเลยเหรอ? อย่างเช่นเด็กผู้ชายที่เบลล่าสนิทด้วยเป็นพิเศษน่ะ?” (เอคไดซิส)\n\n“อิซาเบลล์ก็สนิทกับทุกคนนั่นแหละ เอาเถอะ ช่วงนี้ฉันเองก็ไม่รู้เหมือนกัน ทุกคนต่างก็ยุ่งอยู่กับการเตรียมตัวสอบ ถ้าให้ลองเดาดูสักคน ก็อาจจะเป็นออสการ์มั้ง?” (ยูริ)\n\n“จริงเหรอ! ออสการ์เนี่ยนะ!?” (เอคไดซิส)\n\nเอคไดซิสหัวเราะคิกคักพลางเอานิ้วจิ้มเอวอิซาเบลล์\n\n“เฮ้ เธอกับออสการ์มีอะไรในกอไผ่กันหรือเปล่าเนี่ย?” (เอคไดซิส)\n\n“เอซี่ เรื่องบางเรื่องมันก็เอามาล้อเล่นได้ แต่บางเรื่องก็ไม่ควรนะ พูดตามตรง ออสการ์ออกจะ… จะพูดยังไงดีล่ะ? บอบบางเกินไปหน่อยน่ะ รู้ใช่ไหม?” (อิซาเบลล์)\n\n“ทำไมล่ะ? หมอนั่นออกจะเนื้อหอมนะ” (เอคไดซิส)\n\n“ฉันชอบคนที่ดูบึกบึน เงียบขรึม… อืม เหมือนหมีตัวใหญ่ๆ หน่อยมั้ง? ใช่ ประมาณนั้นแหละ? ดูพึ่งพาได้ หมอนั่นมันดูบอบบางอ้อนแอ้นเกินไปน่ะ” (อิซาเบลล์)\n\nอ่อนโยนบอบบาง… ออสการ์เป็นแบบนั้นเรอะ? เอคไดซิสยิ้มมุมปาก เธอไม่เคยใส่ใจมองดูหรอกนะ แต่หมอนั่นก็ฝึกฝนวิชาอัศวินมาตั้งแต่เด็กไม่ใช่หรือไง?\n\nอิซาเบลล์ลุกขึ้นจากเอคไดซิสที่กำลังทำหน้างุนงง พลางประกาศว่า “ฉันขอตัวไปฝึกซ้อมเพิ่มเติมก่อนนะ!”\n\nยูริเอ่ยถามขึ้น “คิดจะมาแย่งทุนการศึกษาของฉันหรือไง?”\n\nอิซาเบลล์สวนกลับไป “งั้นเธอก็ระวังอย่าให้เสียตำแหน่งนักศึกษาอันดับหนึ่งก็แล้วกันนะ” (อิซาเบลล์)\n\nพร้อมเสียงหัวเราะเบาๆ อิซาเบลล์ก็เดินทอดน่องจากไป\n\n***\n\n“คุณลุงคะ!” (อิซาเบลล์)\n\n“อืม”\n\n“อะฮ่าๆ… เมื่อไหร่คุณลุงจะยอมพูดคำว่า ‘สวัสดี’ กับหนูสักทีคะเนี่ย?” (อิซาเบลล์)\n\nอีวานที่ถือกรรไกรตัดแต่งกิ่งไม้อยู่หันศีรษะไปยังอิซาเบลล์ที่กำลังวิ่งร่าเข้ามาอย่างมั่นใจ\n\n“วันนี้เรามาฝึกกันต่ออีกเถอะค่ะ! ถึงพรุ่งนี้จะสอบแล้วก็เถอะ!” (อิซาเบลล์)\n\n“ไม่”\n\n“เอ๊ะ?” (อิซาเบลล์)\n\nอีวานกวาดสายตามองสำรวจอิซาเบลล์ตั้งแต่หัวจรดเท้า ความเหนื่อยล้าจากการฝึกซ้อมตลอดหนึ่งสัปดาห์ที่ผ่านมาปรากฏให้เห็นอย่างชัดเจน ดูเหมือนเธอจะพยายามรักษาร่างกายแล้ว แต่มันยังห่างไกลจากคำว่าสมบูรณ์นัก\n\n“วันนี้พักผ่อนซะ เตรียมตัวสำหรับวันพรุ่งนี้” (อีวาน)\n\n“อืม… ถ้างั้น… เอ่อ….”\n\nอิซาเบลล์อ้ำอึ้ง เอานิ้วม้วนปลายผมตัวเองเล่นเบาๆ เธอกลอกตาไปมาเล็กน้อยแล้วกัดริมฝีปาก\n\n“เอ่อ ทานข้าวหรือยังคะ…? อืม ถ้าวันนี้คุณลุงพอจะว่าง…” (อิซาเบลล์)\n\n“ฉันยุ่ง” (อีวาน)\n\n“อึก”\n\nอีวานเป็นคนยึดหลักประสิทธิภาพ จึงไม่คิดจะพูดเรื่องเดิมซ้ำสองครั้ง\n\nเขาเดินจากไป ทิ้งให้อิซาเบลล์ยืนงุนงงอยู่ตรงนั้น\n\nวันพรุ่งนี้คือการสอบภาคปฏิบัตินอกสถาบัน แน่นอนว่าเมื่อคำนึงถึงเรื่องปกติที่มักจะมีการลอบซุ่มโจมตีจากศัตรูนิรนาม ย่อมมีสิ่งต่างๆ ให้ต้องตระเตรียมล่วงหน้าอีกมากมาย\n\nในการฝึกภาคสนามของสถาบันการศึกษา การเกิดเหตุซุ่มโจมตีถือเป็นสามัญสำนึก\n\nอีวานเป็นคนมีสามัญสำนึก หากคาดการณ์ได้ว่าจะมีการซุ่มโจมตี สามัญสำนึกของหน่วยรบพิเศษก็คือการกำจัดเป้าหมายทิ้งเสียก่อนที่มันจะทันได้ลงมือโจมตี\n\n“รู้สึกเหมือนตัวเองกำลังจะบ้าจริงๆ แล้วแฮะ….”\n\nอิซาเบลล์พึมพำพลางมองตามแผ่นหลังของอีวานที่เดินห่างออกไปก่อนจะก้มหน้าลง\n\n***\n\n“ว้าว….” (เอคไดซิส)\n\nยูริและเอคไดซิสที่เฝ้าดูเหตุการณ์อยู่ห่างๆ ถึงกับทำกาแฟหกด้วยความตกตะลึง\n\n“ผู้ชายคนนั้น… คนสวนคนนั้นน่ะเหรอ…?” (เอคไดซิส)\n\n“ผู้ชาย… ที่มีเคราถือขวานสติเฟื่องอย่างกับจอห์น วิค…” (ยูริ)\n\n“นั่นใครน่ะ?” (เอคไดซิส)\n\n“ก็… มีคนแบบนั้นอยู่น่ะสิ….” (ยูริ)"
    },

      "title": "บทที่ 40",
      "content": "ตรงกันข้ามกับความเข้าใจผิดของใครหลายคน อีวานไม่ได้ยึดติดกับขวานมากนักหรอก (ดมิทรี ผู้สืบทอดตำแหน่งต่อจากเขาโดยตรงไม่เห็นด้วยกับคำกล่าวนี้สักเท่าไหร่)\n\nทว่าในความเห็นของอีวาน ขวานเป็นเครื่องมือที่มีข้อดีอยู่มากมาย\n\nเวลาฟันหรือสับ มันมีจุดศูนย์ถ่วงที่หนักแน่นมั่นคงกว่าดาบ\n\nสามารถใช้เป็นค้อนทุบได้เมื่อพลิกเอาสันขวานเข้ากระแทก และด้วยส่วนโค้งเว้าของใบขวาน ยังสามารถใช้เกี่ยวพันอาวุธของคู่ต่อสู้ได้ราวกับตะขอ\n\nนอกจากข้อได้เปรียบในฐานะอาวุธยุทโธปกรณ์ทางทหารแล้ว มันยังมีประโยชน์ใช้สอยอีกสารพัด ครั้งหนึ่งอีวานถึงขั้นเคยรวบรวมรายชื่อการใช้งานอันหลากหลายของขวานเอาไว้ด้วยซ้ำ\n\nมันใช้เปิดขวด เปิดกระป๋อง พังประตู กะเทาะเปลือกถั่ว และจัดการกับอะไรก็ตามที่ขวางหน้าได้\n\n– ซืด...\n\nเหตุผลที่อีวานนึกถึงเรื่องพวกนี้ขึ้นมาในหัวก็แสนจะเรียบง่าย\n\nเวลานี้เขากำลังชักดาบออกมา ส่วนตัวแล้วเขาไม่ได้ชอบดาบเป็นพิเศษนักหรอก แต่มันจำเป็นต้องใช้\n\nเขาตั้งใจจะรับมือกับการจู่โจมในการฝึกภาคสนามด้วยความทุ่มเทอย่างสุดกำลัง แค่เห็นว่าเขายอมติดอาวุธเป็นขวานมาด้วย ก็น่าจะสัมผัสได้ถึงความจริงใจของเขาแล้ว\n\n“เวียลกริน”\n\nทุกครั้งที่นึกถึงเจ้าเอลฟ์หยิ่งยโสตนนั้น เขาก็โกรธจนแทบขบเขี้ยวเคี้ยวฟัน เตรียมคาถาโจมตีมาสารพัดชนิด เพื่ออะไรกัน? แค่การทดสอบงั้นหรือ?\n\nในทางกลับกัน ตัวเขากลับไม่ได้พกอาวุธส่วนใหญ่ติดตัวมาด้วยซ้ำ ทำตัวราวกับออกมาเดินเล่นตากอากาศเสียอย่างนั้น อย่างมากที่สุดก็มีแค่ปืนพกกับขวานติดตัว!\n\nจะว่าเป็นการแก้ตัวก็คงใช่ อีวานรู้ตัวดีว่ากำลังหาข้ออ้างให้ตัวเอง แต่ถึงอย่างไร เขาก็ได้เรียนรู้บทเรียนสำคัญเข้าให้แล้ว\n\n– จงเตรียมพร้อมในสภาพติดอาวุธเสมอ เผื่อมีขุมกำลังระดับปาร์ตี้ผู้กล้าโผล่พรวดออกมาและกลายเป็นศัตรูได้ทุกเมื่อ\n\nโดยพื้นฐานแล้ว เขาไม่เกี่ยงประเภทของอาวุธ ตราบใดที่เขายังหยิบฉวยมันมาใช้งานได้ แม้จะมีอาวุธที่คุ้นมือกว่าอยู่บ้าง แต่ก็ไม่มีอาวุธทางทหารชนิดใดที่เขาไม่คุ้นเคยเลยสักอย่าง\n\nท้ายที่สุดแล้ว เขาก็ใช้ชีวิตอยู่บนแนวหน้ามานานถึง 20 ปี อาวุธยุทโธปกรณ์ที่เบิกจ่ายมามักจะพังเสียหายอยู่บ่อยครั้ง ดังนั้นทุกสิ่งทุกอย่างที่พอจะคว้ามาใช้ได้ในแนวหน้าจึงต้องนำมาใช้ให้เกิดประโยชน์สูงสุด\n\nอีวานคาดกริชไว้ที่เอว สะพายดาบไว้บนบ่า ผูกขวานไว้ที่บั้นเอวด้านหลัง แล้วยัดปืนพก ซองกระสุน พร้อมกับระเบิดมืออีกไม่กี่ลูกใส่กระเป๋าคาดเอว\n\n***\n\n“ผู้เข้าสอบในปีนี้ยอดเยี่ยมมากเลยนะครับ ท่านเอนริเก้?” (โรเบิร์ต)\n\n“อ้อ จริงด้วยสิ” (เอนริเก้)\n\n“ผมตั้งความหวังไว้สูงมากเลยครับ ก็เป็นการทดสอบที่ท่านเอนริเก้ลงมาคุมสอบด้วยตนเองทั้งทีนี่นา! เหล่าขุนนางแห่งเฟรเชนกายาต่างก็อยากจะมาร่วมรับชมกันทั้งนั้นเลยครับ”\n\n“จะเอาเด็กนักเรียนมาแสดงเป็นมหรสพหรือไง?” (เอนริเก้)\n\n“โอ้ ไม่ใช่นะครับ! ผมไม่ได้หมายความแบบนั้นเลย!” (โรเบิร์ต)\n\nเอนริเก้ส่ายศีรษะด้วยใบหน้าเรียบเฉย ชายที่เอาแต่พล่ามไม่หยุดอยู่ข้างกายเธอเป็นอาจารย์ประจำชั้นปีที่ 2 สาขาวิชาอัศวิน ชื่อของเขาน่ะเหรอ… เธอจำไม่ได้หรอก\n\nเธอมีชีวิตอยู่มานานแสนนานแล้ว (แม้เธอจะไม่ยอมรับก็เถอะ) นั่นหมายความว่าเธอได้พบเจอและส่งผู้คนมากมายจากไปตามจำนวนปีที่ล่วงเลย\n\nมุมมองต่อโลกของอันเดดเป็นเช่นนี้เอง ผู้ใดที่ไม่มีสิ่งใดให้ควรค่าแก่การจดจำ ก็จงพยายามอย่าไปจดจำมันเสีย หากไม่อยากใช้ชีวิตที่เหลือจมอยู่กับความโศกเศร้าไว้อาลัยให้คนรู้จักทุกคนที่ต้องเอ่ยคำอำลา เธอก็จำต้องทำเช่นนั้น\n\nสำหรับผู้ชายคนนี้ มันไม่คุ้มค่าพอจะให้จำ เอนริเก้จึงไม่คิดจะเสียเวลาจำชื่อของ ‘ศาสตราจารย์’ ผู้นี้เลยด้วยซ้ำ\n\n“ได้ยินว่าฝีมือของเซอร์ออสการ์พัฒนาขึ้นมากทีเดียว ผมคาดหวังไว้สูงเลยครับ” (โรเบิร์ต)\n\n“อ้อ คุณมาจากทิลีสสินะ” (เอนริเก้)\n\n“ใช่ครับ ท่านจำผมได้ด้วย!” (โรเบิร์ต)\n\nฉันก็จำได้แค่เลือนลางเท่านั้นแหละ รู้สึกว่าหมอนี่น่าจะเคยสังกัดหน่วยราชองครักษ์สักหน่วยในทิลีส…\n\nเอนริเก้ก้มศีรษะลงเล็กน้อย\n\n“อิซาเบลล์เองก็เป็นคนมีพรสวรรค์ ยูริ แฟรงก์ เด็กคนนั้นก็ยอดเยี่ยมเหมือนกัน” (เอนริเก้)\n\n“อิซาเบลล์ก็พอว่าอยู่หรอกครับ แต่ยูริ แฟรงก์นี่สิ… ผมเคยเปิดดูแฟ้มประวัติของนักศึกษาคนนั้นมาบ้างแล้ว ก็นะ… สำหรับสามัญชนแล้ว เธอก็ถือว่าใช้ได้ทีเดียวครับ” (โรเบิร์ต)\n\n“สามัญชน… อย่างนั้นหรือ?” (เอนริเก้)\n\nเอนริเก้หัวเราะเบาๆ ในลำคอ เอาเถอะ เกิดเป็นเด็กกำพร้าสงคราม จะเรียกว่าเป็นสามัญชนก็คงไม่ผิดนัก\n\nไอ้ผู้ชายท่าทางเจ้าสำอางคนนี้จะรู้บ้างไหมนะ? ครึ่งหนึ่งของปาร์ตี้ผู้กล้าก็ล้วนเป็นสามัญชนทั้งนั้น\n\nแม็กซิมิเลียน ไอนาร์ และตัวเธอ เอนริเก้\n\nแต่จะทำอย่างไรได้เล่า? เหล่าขุนนางย่อมอยากจะคิดแบบนั้นอยู่แล้ว บัดนี้ความหุนหันพลันแล่นในวัยเยาว์ได้กลายเป็นเพียงอดีตไปแล้ว เอนริเก้จึงได้แต่ยักไหล่\n\n“เอนริเก้” (อีวาน)\n\nในจังหวะนั้นเอง อีวานก็กำลังเดินตรงเข้ามาจากระยะไกล เอนริเก้เมินเฉยต่อศาสตราจารย์จอมพล่ามแล้วโบกมือทักทาย\n\n“อ้าว อีวาน! มีเรื่องอะไรล่ะ?” (เอนริเก้)\n\n“ผมขอร่วมดูด้วยได้ไหมครับ?” (อีวาน)\n\n“การสอบวันนี้น่ะเหรอ? ก็ไม่มีปัญหาหรอก แต่จะลำบากมาดูทำไมกันล่ะ?” (เอนริเก้)\n\n“ผมมีเรื่องที่อยากจะยืนยันให้แน่ใจน่ะครับ” (อีวาน)\n\n“ยืนยัน… อย่างนั้นเหรอ?” (เอนริเก้)\n\nเอนริเก้มายืนเคียงข้างอีวานด้วยรอยยิ้มเจ้าเล่ห์ สีหน้าของศาสตราจารย์ที่ยืนอยู่ข้างกายเธอพลันแปรเปลี่ยนเป็นเย็นชาลงทันที\n\nการแบ่งแยกชนชั้นบ้าบออะไรกันนี่? ในสายตาของเขา ผู้มาใหม่ที่เพิ่งเดินเข้ามาก็ดูเป็นเพียงแค่คนสวนต้อยต่ำคนหนึ่งเท่านั้น\n\n“ยินดีที่ได้รู้จัก ฉันคือศาสตราจารย์โรเบิร์ต เซนนาร์ เดอ มอนดรังกี แห่งคณะอัศวิน แกชื่ออะไร?” (โรเบิร์ต)\n\n“อีวาน เปโตรวิช” (อีวาน)\n\nแค่ได้ยินชื่อก็ดูออกแล้ว เมื่อดูจาก ‘ชื่อรอง’ แบบฉบับชาวคราซิลอฟ หมอนี่เป็นสามัญชนที่ไม่มีนามสกุลอย่างแน่นอน\n\nแววตาของโรเบิร์ตยิ่งทวีความเย็นเยียบ เขาขมวดคิ้วมุ่น\n\n“สามัญชน จงสำเนียกฐานะของตัวเองแล้วไสหัวไปหาที่ทางของตัวเองเสีย ในมหาวิทยาลัยมีต้นไม้ให้ต้องดูแลตั้งมากมายก่ายกอง จะถ่อมาถึงที่นี่ทำไมกัน?” (โรเบิร์ต)\n\n“…?” (อีวาน)\n\nหมอนี่พูดเรื่องอะไรของมัน? อีวานเอียงศีรษะ\n\nมันเป็นความรู้สึกที่แปลกประหลาด นานมากแล้วที่เขาไม่ได้เผชิญหน้ากับคนที่กล้าท้าทายเขาซึ่งๆ หน้าแบบนี้ จึงนึกไม่ออกว่าจะต้องตอบสนองอย่างไรถึงจะเหมาะสม\n\nโดยปกติแล้ว ในกรณีเช่นนี้ นิสัยของอีวานคือการจามขวานลงไปกลางกบาลของอีกฝ่ายทันที สมัยอยู่ในกองทัพ เวลาที่มีคนเริ่มทำท่าดูแคลนเขา มักจะบานปลายกลายเป็นสถานการณ์ชวนปวดหัวอยู่เสมอ\n\nแต่ที่นี่คือมหาวิทยาลัย ในสังคมพลเรือนควรจะจัดการเรื่องแบบนี้ยังไงดี? อีวานใช้เวลาครู่หนึ่งเพื่อเรียบเรียงความคิด\n\nโชคดีที่อีวานไม่จำเป็นต้องลงมือจัดการด้วยตัวเอง\n\n“นี่ ศาสตราจารย์” (เอนริเก้)\n\n“ครับ ท่านเอนริเก้!” (โรเบิร์ต)\n\n“อยากตายหรือไง?” (เอนริเก้)\n\n“…อะไรนะครับ?” (โรเบิร์ต)\n\nเอนริเก้จ้องเขม็งไปยังโรเบิร์ตด้วยดวงตาที่ลุกโชน\n\n“อีวานเป็นแขกของฉัน หากมองในแง่เล็กเขาคือสหาย หากมองในแง่ใหญ่เขาคือเพื่อนร่วมรบ แกกล้าดียังไงมาดูหมิ่นแขกของฉันต่อหน้าต่อตา นี่หรือมารยาทของชาวทิลีส?” (เอนริเก้)\n\n“คือว่า…” (โรเบิร์ต)\n\n“หุบปากซะ ฉันอุตส่าห์อดทนดมกลิ่นเหม็นสาบของแกมาได้ทั้งที่ตัวเองจมูกดีขนาดนี้ ถ้าเป็นเมื่อสี่ปีก่อน แค่นั้นก็มากพอที่จะฆ่าแกทิ้งไปแล้ว โลกสมัยนี้มันน่าอยู่ขึ้นเยอะเลยนะ” (เอนริเก้)\n\nจิตสังหารของเอนริเก้แผ่ซ่านไปด้วยความเป็นปรปักษ์ อีวานยื่นมือออกไปหมายจะช่วยปลอบให้คนแก่จอมหงุดหงิดที่ไม่รู้เรื่องรู้ราวคนนี้ใจเย็นลง\n\n“เอนริเก้ ไม่เป็นไรหรอกครับ” (อีวาน)\n\n“ไม่สิ ไอ้หมอนี่มันทำตัวน่าทุเรศลูกตาชะมัด!” (เอนริเก้)\n\n“เริ่มการสอบกันเถอะครับ พวกนักศึกษารออยู่” (อีวาน)\n\n“ชิ ให้ตายสิ” (เอนริเก้)\n\nเอนริเก้กระแอมในลำคอแล้วเบือนหน้าหนี โรเบิร์ตที่ถูกแรงกดดันจากจิตสังหารของเธอเข้าจังๆ ยังคงยืนตัวสั่นงันงกไม่หาย\n\nอีวานเมินเฉยต่อชายผู้นั้นและเดินเคียงข้างไปกับเอนริเก้ เหล่านักศึกษาได้มารวมตัวกันที่ลานโล่งกลางผืนป่าแล้ว\n\nนี่คือการสอบใหญ่ครั้งแรกสำหรับนักศึกษาชั้นปีที่ 1 ของคณะอัศวิน การทดสอบ [การรับมือการซุ่มโจมตี] ได้เริ่มต้นขึ้นแล้ว\n\n***\n\nนักศึกษาชั้นปีที่ 1 ในคณะอัศวินมีทั้งหมด 52 คน พวกเขายืนเรียงรายอยู่บนแท่นพิธี แต่ละคนติดอาวุธและอุปกรณ์พื้นฐานที่ทางมหาวิทยาลัยจัดเตรียมไว้ให้ พลางจ้องมองมายังเอนริเก้\n\nเอนริเก้ยกมือขึ้นแล้วแบฝ่ามือออกกว้าง ภายในมือของเธอกำลูกแก้วเม็ดเล็กๆ เอาไว้เม็ดหนึ่ง\n\n“การสอบครั้งนี้คือการรับมือการซุ่มโจมตี คนของฉันที่ผ่านการฝึกฝนมาเป็นพิเศษได้กระจายกำลังซ่อนตัวอยู่ทั่วป่าแห่งนี้ พวกเขาวางแผนที่จะเข้าโจมตีพวกเธอโดยตรง” (เอนริเก้)\n\nเหล่านักศึกษาไม่มีทีท่าหวั่นไหวกับคำพูดของเอนริเก้ เรื่องแค่นี้ยังอยู่ในขอบเขตที่พวกเขาคาดการณ์เอาไว้แล้ว\n\n“แต่แค่นั้นมันจะขาดความยุติธรรมในการคัดกรองไปหน่อย เพราะอาจมีนักศึกษาบางคนที่โชคดีจนไม่ตกเป็นเป้าหมายการโจมตีเลยก็ได้ เอาล่ะ หากพวกเธอสามารถเอาชนะผู้ซุ่มโจมตีที่หมายหัวพวกเธอได้ ก็จะได้รับคะแนนพิเศษ และยังมีอีกเรื่องหนึ่ง” (เอนริเก้)\n\nเธอเขย่าลูกแก้วในมือขณะเอ่ยต่อ\n\n“ฉันจะแจกลูกแก้วนี้ให้พวกเธอคนละหนึ่งเม็ด มันคืออุปกรณ์เวทมนตร์ที่ลงอาคมตรวจจับตำแหน่งอย่างง่ายเอาไว้ หากพวกเธอเดินทางไปถึงอีกฟากหนึ่งของป่าโดยที่ยังรักษาลูกแก้วนี้ไว้ได้ ก็จะถือว่าสอบผ่าน นอกจากนี้ หากใครครอบครองลูกแก้วมากกว่าหนึ่งเม็ด ก็จะได้รับคะแนนบวกเพิ่มเข้าไปอีกด้วย” (เอนริเก้)\n\nเกิดเสียงฮือฮาดังขึ้นในหมู่นักศึกษาทันทีที่ได้ยินคำพูดของเธอ\n\nวิธีที่ดีที่สุดในการรับมือกับการซุ่มโจมตีคือการรวมกลุ่มกัน โดยพื้นฐานแล้ว หากรวมตัวกันหลายคนได้ ก็จะช่วยกำจัดจุดบอดรอบตัวออกไป\n\nแต่หากตั้งเงื่อนไขแบบนั้นขึ้นมาล่ะ? ในกรณีนั้น จะเกิดอะไรขึ้นหากพวกเขาจับกลุ่มเล็กๆ ช่วยกันต้านผู้ซุ่มโจมตีเอาไว้ แล้วฉวยโอกาสชิงลูกแก้วหลบหนีไปในระหว่างที่ผู้ซุ่มโจมตีกับนักศึกษาคนอื่นกำลังชุลมุนวุ่นวาย?\n\n“ไม่ใช่ทุกคนที่จะสอบผ่านได้ ห้าคนแรกที่หนีออกจากป่าได้สำเร็จจะได้รับคะแนนสูงสุด และจะมีการหักคะแนนลดหลั่นกันไปตามเวลาที่ใช้ในการหลบหนี มีเวลาทั้งหมดสี่ชั่วโมง จงปกป้องลูกแก้วและฝ่าป่าแห่งนี้ไปให้ได้ภายในเวลาที่กำหนด เข้าใจไหม?” (เอนริเก้)\n\nอีวานพยักหน้าพลางรับฟังคำอธิบายของเอนริเก้ นี่มันเป็นหลักสูตรที่แทบจะถอดแบบมาจากวิธีการฝึกทหารใหม่ในหน่วยเก็บกวาดเป๊ะๆ เลยทีเดียว\n\nลำพังแค่นั้นก็นับว่าประหลาดพอแล้วสำหรับการสอบของนักศึกษา ทว่าในอีกแง่มุมหนึ่ง วิธีการแบบนี้ก็ให้ความรู้สึก ‘คุ้นเคย’ อย่างประหลาด\n\n‘ช่างเป็นสภาพแวดล้อมที่เอื้ออำนวยให้กองกำลังศัตรูจากภายนอกเข้ามาแทรกแซงได้ง่ายดายเสียจริง’\n\nผืนป่าแห่งนี้ตั้งอยู่ภายในอาณาเขตของเฟรเชนกายา ยิ่งไปกว่านั้น หากเดินเลยแนวชายป่าออกไปอีกเพียงเล็กน้อย ก็มีฐานทัพทหารประจำการอยู่\n\nกล่าวอีกนัยหนึ่ง มันคือพื้นที่ปลอดภัยอย่างสมบูรณ์แบบ ดังนั้น การวางแผนการสอบที่เข้มข้นถึงเพียงนี้และได้รับอนุมัติจากทางมหาวิทยาลัยจึงเป็นเรื่องที่พอเข้าใจได้\n\nทว่า นี่คือการฝึกภาคสนามของสถาบันการศึกษา ฉะนั้น ย่อมต้องมีการโจมตีจากภายนอกเกิดขึ้นอย่างแน่นอน\n\nเช่นนั้นแล้ว ลองมาคิดถึง ‘วิธีการ’ โดยตัดเรื่อง ‘เหตุผล’ ออกไปก่อน\n\n‘คงซุ่มซ่อนตัวอยู่ในป่าล่วงหน้าไม่ได้หรอก ลูกน้องของเอนริเก้น่าจะลาดตระเวนตรวจค้นทั่วป่าไปแล้ว’\n\nแล้วการโจมตีจะเริ่มต้นขึ้นจากจุดไหนกันล่ะ?\n\nไม่มีทางมาจากฟากฟ้าแน่ หลังจากเหตุการณ์เรือประจัญบานลอยฟ้าของพวกเอลฟ์ คราซิลอฟก็ทุ่มเทให้กับการป้องกันภัยทางอากาศอย่างจริงจัง\n\nส่วนการโจมตีภาคพื้นดินก็แทบจะเป็นไปไม่ได้ ต่อให้มีเส้นทางลักลอบเข้ามาได้ กองบัญชาการสถานการณ์ในตอนนี้ก็ตื่นตัวต่อภัยคุกคามอย่างถึงที่สุด อันเนื่องมาจากเหตุการณ์ก่อการร้ายบนรถไฟในพื้นที่แถบนี้เมื่อไม่นานมานี้\n\nถ้าอย่างนั้น….\n\n‘ใต้ดิน’\n\nเมื่อใช้วิธีตัดตัวเลือกที่ไม่ใช่ออกไป สถานที่เพียงแห่งเดียวที่ผู้โจมตีจะสามารถปรากฏตัวขึ้นมาได้ก็คือใต้ดิน\n\nคนเรามักจะต้องมั่นใจเสียก่อนว่ามีการโจมตีเกิดขึ้นแน่นอนถึงจะคิดวิเคราะห์แบบนี้ได้ ทว่าอีวานเป็นคนมีเหตุมีผล ดังนั้นเขาจึงไม่เคยกังขาในข้อสันนิษฐานนี้เลย\n\n‘เจ้าพวกตัวเดิมๆ นั่นเอง’\n\nหากตั้งสมมติฐานว่าผู้โจมตีจะบุกเข้ามาผ่านทางอุโมงค์ใต้ดิน เผ่าพันธุ์เดียวที่ผุดขึ้นมาในห้วงความคิดก็คือเผ่าคนแคระ\n\nเจ้าพวกคนแคระคอมมิวนิสต์ตัวเตี้ยพวกนั้น หากพวกมันวางแผนการโจมตีจากใต้ดิน การเตรียมรับมือล่วงหน้าก็แทบจะเป็นไปไม่ได้เลย นั่นเป็นเพราะไม่อาจคาดเดาได้เลยว่าพวกมันจะโผล่พรวดขึ้นมาจากจุดไหน\n\nเมื่อพิจารณาถึงเป้าหมายทางยุทธวิธี ก็พอจะอนุมานได้ หากสมมติว่าคนแคระเป็นฝ่ายลงมือ และหากกองทัพจอมมารจงใจเล็งเป้าหมายมาที่การสอบของสถาบันการศึกษา เป้าหมายย่อมถูกกำหนดไว้ล่วงหน้าแล้ว\n\n‘อิซาเบลล์ หรือไม่ก็ออสการ์’\n\nสมาชิกของปาร์ตี้ผู้กล้าต่างก็เป็นเป้าหมายแห่งความเคียดแค้นของกองทัพจอมมาร ปาร์ตี้ที่สังหารหมู่เจ็ดราชามังกรไปเกือบหมดและถึงขั้นโค่นล้มจอมมารลงได้ แม้ว่าตัวพวกเขาเองในตอนนี้จะแทรกซึมเข้าไปอยู่ในชนชั้นทางสังคมระดับต่างๆ จนยากที่จะเข้าถึงตัวได้โดยตรง ทว่านั่นไม่ใช่กรณีเดียวกันสำหรับลูกหลานของพวกเขา\n\nการต้องทนเห็นคนที่ผลักดันเผ่าพันธุ์ปีศาจทั้งหมดลงสู่ขุมนรกกำลังเลี้ยงดูลูกหลานอย่างมีความสุข ย่อมเป็นภาพที่น่าบิดเบี้ยวชวนแค้นใจในสายตาของพวกปีศาจ\n\nเมื่อมองจากมุมนั้น ในสายตาของอีวาน เหตุการณ์ครั้งนี้จึงโปร่งใสราวกับกระจก\n\nหากแรงจูงใจ วิธีการ และเป้าหมายของการก่อการร้ายถูกระบุได้ชัดเจนขนาดนี้ มันก็ไม่ใช่การก่อการร้ายอีกต่อไปแล้ว มันเป็นแค่การก่อจลาจลธรรมดาๆ เท่านั้น\n\nอีวานมองไปยังอิซาเบลล์ที่กำลังถือลูกแก้วอยู่จากระยะไกล เธอกำลังหัวเราะคิกคักเบาๆ ราวกับกำลังจมอยู่ในห้วงความคิด\n\n– แกร๊ง\n\nอีวานเบี่ยงสะโพกเล็กน้อยแล้ววางมือลงบนดาบ\n\nเขาชักดาบออกมาเพื่อรับมือกับพวกคนแคระ เผ่าคนแคระเป็นเผ่าพันธุ์ที่รับมือได้ยากหากใช้ขวาน\n\nเช่นนั้นแล้ว ก็หมายความว่าการเตรียมการเสร็จสมบูรณ์\n\n***\n\n“อะไรกันเนี่ย… จริงๆ เลยนะ คุณลุง”\n\nอิซาเบลล์มองไปยังอีวานที่ยืนอยู่มุมหนึ่งของแท่นพิธี พลางเบี่ยงตัววางท่าจับดาบที่ไม่ค่อยเข้ากับตัวเองนักราวกับอัศวิน ถึงกระนั้นมันก็ดูบึกบึนและเปี่ยมไปด้วยความมั่นใจอย่างน่าประหลาด\n\nอีวานเป็นคนสวน พูดให้ถูกตามจริงก็คือเขาเป็นสายลับของรัฐบาล แต่เอาเถอะ อย่างน้อยฉากหน้าของเขาก็คือคนสวน\n\nดังนั้น หากอีวานผู้เป็นคนสวนมาปรากฏตัวที่นี่เพื่อเฝ้าดูการสอบครั้งนี้ ย่อมต้องมีเหตุผลอย่างแน่นอน\n\n“เป็นห่วงมากเกินไปแล้ว จริงๆ เลย”\n\nอิซาเบลล์เบือนสายตาหนีพลางเก็บสีหน้าอย่างระมัดระวัง ลึกๆ แล้ว ตาแก่คนนั้นกำลังเป็นห่วงเธออยู่ และบางทีเขาอาจจะอยากมายืนยันผลลัพธ์จากการฝึกสอนที่เขามอบให้ด้วยตัวเอง\n\nเอาล่ะ แสดงให้เขาเห็นกันเถอะ\n\nอิซาเบลล์ยักไหล่แล้วกำด้ามดาบแน่น\n\nจงแสดงผลลัพธ์จากการฝึกซ้อมสุดโหดตลอดหลายวันที่ผ่านมาให้ประจักษ์อย่างภาคภูมิใจ แล้วคว้าอันดับหนึ่งมาครองให้ได้\n\nจากนั้นก็เข้าไปขอบคุณที่เขาช่วยฝึกให้ แล้วค่อยชวนไปกินมื้อเย็นอย่างเป็นธรรมชาติ อืม… หรือไม่ก็ไปดื่มกาแฟ อืม… หรือบางทีอาจจะไปดูละครเวทีด้วยกันก็ได้\n\nอย่างไรเสีย คราซิลอฟก็เป็นประเทศที่ขึ้นชื่อลือชาด้านศิลปะและวัฒนธรรมอยู่แล้ว\n\nอิซาเบลล์เผลอจินตนาการภาพอีวานกำลังนั่งชมละครโอเปร่าอยู่ครู่หนึ่ง ก่อนจะหลุดหัวเราะออกมาเมื่อนึกได้ว่ามันช่างไม่เข้ากับเขาเลยสักนิดเดียว\n\n“….”\n\nในชั่วขณะเดียวกันนั้น\n\nอีวาน ผู้เป็นบุคคลที่ยึดมั่นในประสิทธิภาพอย่างที่สุด กำลังเตรียมตัวที่จะไปโกนหนวดให้พวกคนแคระอยู่พอดี"
    },

      "title": "บทที่ 41",
      "content": "“อิซาเบลล์ เธอจะไปคนเดียวจริงๆ เหรอ?” (ยูริ)\n\n“ใช่! ไม่ต้องห่วงหรอกน่า ฉันมีเรื่องที่ต้องพิสูจน์น่ะ ฮิฮิ” (อิซาเบลล์)\n\n“พิสูจน์อะไร…?” (ยูริ)\n\n“เตรียมใจไว้ให้ดีเถอะค่ะ คุณยูริ ไม่อย่างนั้นเดี๋ยวจะได้คะแนนตกเอานะ…!”\n\nอิซาเบลล์วิ่งทะยานเข้าไปในป่าพร้อมเสียงหัวเราะอันเยียบเย็น ในความเป็นจริง เธอแทบจะชิงออกนำหน้าไปก่อนใครแล้ว\n\nในขณะที่นักศึกษาส่วนใหญ่ยังคงยืนคุมเชิงมองตากันอย่างระแวดระวังอยู่ที่ลานกว้าง การกระทำของอิซาเบลล์ก็ดึงดูดสายตาของทุกคนไปจนหมดสิ้น\n\nเธอวิ่งเข้าไปในป่าเพียงลำพังทันทีที่การสอบเริ่มต้นขึ้นงั้นเหรอ?\n\nนั่นเป็นสิ่งที่ไม่มีทางทำได้หากไม่มีความมั่นใจในอะไรบางอย่าง ไม่ว่าจะเป็นผู้ซุ่มโจมตีนิรนามที่ดักรออยู่ในป่า หรือเพื่อนร่วมชั้นที่ต้องคอยระแวดระวังระหว่างเดินเพียงลำพังก็ตาม\n\nเหล่านักศึกษาที่สบตากันไปมาต่างก็รีบจับกลุ่มรวมตัวกัน แล้วค่อยๆ เคลื่อนพลมุ่งหน้าเข้าไปยังส่วนลึกของผืนป่าอย่างช้าๆ\n\nและแม้กระทั่งอีวานที่เฝ้าดูเหตุการณ์อยู่ ก็เริ่มขยับตัวด้วยฝีเท้าที่ไม่เร่งรีบนัก\n\n“อีวาน นายจะไปไหนน่ะ?” (เอนริเก้)\n\n“ผมมีเรื่องต้องไปตรวจสอบด้วยตัวเองนิดหน่อยครับ” (อีวาน)\n\n“หืม… น่าสงสัยจริงๆ นะ ใครกัน? ตัวป่วนคนไหนที่ไปสะดุดตาอีวาน ‘ตัวน้อย’ ของพวกเราเข้าล่ะ?” (เอนริเก้)\n\nเอนริเก้หัวเราะเบาๆ พลางยักไหล่ เมื่อเห็นอีวานทำท่าจะผละออกไปโดยไม่ตอบคำถาม เอนริเก้จึงเอ่ยสำทับขึ้น\n\n“อย่าไปก้าวก่ายการสอบของเด็กๆ ล่ะ พวกเขาจัดการกันเองได้สบายอยู่แล้ว แล้วก็เพลาๆ การเตรียมตัวเกินเหตุลงบ้างเถอะ นั่นมันโรคหวาดระแวงแล้วนะ ศิษย์ของฉัน อาการ PTSD กำเริบหรือไง” (เอนริเก้)\n\n“ก็…” (อีวาน)\n\nอีวานไม่มีเจตนาจะไปโน้มน้าวหญิงชราหัวดื้อคร่ำครึคนนี้แต่อย่างใด\n\nหากให้เรียงลำดับสามเหตุการณ์ในสถาบันการศึกษาที่มักตกเป็นเป้าโจมตีมากที่สุด ได้แก่ พิธีปฐมนิเทศ การฝึกภาคสนาม และงานเทศกาล\n\nและเหตุผลที่คนพวกนี้สามารถวางแผนหลักสูตรการสอบที่แทบจะเรียกร้องให้ผู้ก่อการร้ายบุกเข้ามาได้อย่างหน้าตาเฉย ก็เป็นเพราะความบกพร่องทางสามัญสำนึกของพวกเขานั่นเอง\n\nอีวานผู้เป็นคนยึดหลักปฏิบัติจริงจัง จะลงมือทำเฉพาะสิ่งที่ทำได้เท่านั้น การสั่งสอนสามัญสำนึกให้คนแก่อายุเกินหนึ่งศตวรรษไม่ได้อยู่ในขอบเขตความสามารถของเขา\n\nอีวานกระโดดขึ้นไปบนต้นไม้อย่างเงียบเชียบและหายลับเข้าไปพ้นแนวป่า\n\n“พักนี้ มีอะไรบางอย่าง… ที่น่ารำคาญใจเกี่ยวกับหมอนั่นแฮะ…”\n\nเอนริเก้ครุ่นคิดพลางนึกทบทวนสีหน้าของอีวานเมื่อครู่นี้\n\n***\n\n“ถ้าเป็นเขา จะรับมือกับสถานการณ์แบบนี้ยังไงกันนะ?” อิซาเบลล์พึมพำขณะวิ่งฝ่าผืนป่าไปข้างหน้า\n\nทุกสิ่งทุกอย่างที่เธอได้ร่ำเรียนมาในชั้นเรียนของอีวานยังคงแจ่มชัดอยู่ในความทรงจำ\n\n– ในธรรมชาติไม่มีเส้นตรง อะไรก็ตามที่สะท้อนแสงแดดเป็นมุมเหลี่ยมล้วนเป็นกับดักทั้งสิ้น\n\nเป็นจริงดังว่า อิซาเบลล์ปลดกับดักดักจับไปแล้วถึงหกจุด โดยที่ยังคงวิ่งต่อไปได้อย่างไม่ลังเล\n\nและอีกข้อหนึ่ง\n\n– หากสายลับที่ผ่านการฝึกฝนมาอย่างดีมีเวลามากพอ จะไม่มีกับดักใดถูกวางไว้อย่างโดดเดี่ยว ดังนั้นจงคาดการณ์ไว้ล่วงหน้า ว่าหากเธอหลบเลี่ยงกับดักแรกได้ เธอจะไปโผล่ที่จุดไหน\n\nเหยื่อล่อของกับดัก บนเส้นทางที่ดูสะอาดสะอ้านที่สุดสำหรับหลบหลีกกับดักซุ่มโจมตี ย่อมต้องมีกับดักชิ้นที่สองรออยู่เสมอ\n\nบทเรียนนั้นช่างแม่นยำอย่างยิ่ง เหล่าสายลับซึ่งเป็นลูกศิษย์ของเอนริเก้ดูเหมือนจะได้รับการฝึกฝนมาอย่างดีตามมาตรฐานของอีวาน\n\nหลังจากปลดกับดักและคำนวณเส้นทางหลบหนีในหัว เธอก็มักจะพบกับดักชิ้นที่สองดักรออยู่ในตำแหน่งนั้นเสมอ\n\nไม่รู้ว่าวิ่งมานานเท่าใดแล้ว อิซาเบลล์ก็ได้ยินเสียงสวบสาบแว่วเข้าหู\n\n“ใครน่ะ?” (อาแลง)\n\nเป็นนักศึกษาคนหนึ่ง อิซาเบลล์หมอบลงในพุ่มไม้และกุมด้ามดาบไว้แน่นอย่างเงียบเชียบ\n\nไม่นานนัก เสียงฝีเท้าแหวกพุ่มไม้ก็ดังใกล้เข้ามา ก่อนที่นักศึกษาคนหนึ่งจะปรากฏตัวขึ้น ชื่ออะไรนะ อาแลงอย่างนั้นหรือ? ดูเหมือนจะเป็นนักศึกษาปีหนึ่งจากทิลีสเหมือนกับอิซาเบลล์\n\nแถมคนคนนั้นยังอยู่ในสภาพที่สมบูรณ์พร้อมดีเสียด้วย\n\nแต่จะมาปรากฏตัวเพียงลำพังงั้นเหรอ? ไม่มีทางเป็นไปได้หรอก\n\nอิซาเบลล์ยิ้มเย็นแล้วกวาดสายตาสำรวจรอบข้าง เป็นจริงดังคาด เงาร่างหนึ่งกำลังโอนเอนอยู่ไกลออกไปด้านหลังของอาแลง แม้จะดูเหมือนซ่อนตัวอยู่หลังต้นไม้ ทว่าการพรางตัวนั้นช่างดูอ่อนหัดเสียเหลือเกิน\n\nทำเอาเธอต้องระแวดระวังตัวเสียเปล่า\n\nอิซาเบลล์หลุดหัวเราะเบาๆ การได้เห็นสถานการณ์แบบนี้ยิ่งทำให้เธอตระหนักว่าตาแก่คนนั้นเก่งกาจเพียงใด เพราะแบบนี้ไง เธอถึงคบหากับพวกเด็กหนุ่มรุ่นราวคราวเดียวกันไม่ไหว\n\nจู่ๆ เธอก็คิดเรื่องนั้นขึ้นมาจนต้องสะดุ้งตกใจตัวเอง ฉันคิดเรื่อง “ออกเดต” ขึ้นมาได้ยังไงกันเนี่ย?\n\n“แค่คำชมจากเขาก็เกินพอแล้ว!” (อิซาเบลล์)\n\nอย่างน้อยที่สุด คำสารภาพรักมีไว้สำหรับเป็นฝ่ายรับ ไม่ใช่ฝ่ายรุก ถึงแม้ว่าโลกจะเปลี่ยนแปลงไปในทางที่ดีขึ้นมากดังที่ประวัติศาสตร์อันยาวนานได้พิสูจน์ไว้แล้วก็ตาม\n\nตามธรรมเนียมปฏิบัติในราชสำนักแห่งทิลีส มีเพียงกรณีเดียวเท่านั้นที่สตรีจะเป็นฝ่ายเอ่ยปากสารภาพรักก่อน นั่นคือเมื่อบิดาของฝ่ายหญิงเข้ามาเจรจาเพื่อผลักดันการแต่งงานทางการเมือง\n\nน่าเสียดายที่อิซาเบลล์ไม่มีบิดาอยู่ข้างกาย แม็กซิมิเลียนหายสาบสูญไปนานถึงสี่ปีแล้วในตอนนี้\n\nดังนั้น อิซาเบลล์จึงไม่มีทางเลือกอื่นนอกจากต้องปฏิบัติตามประวัติศาสตร์และขนบธรรมเนียมของทิลีส หากอีวานเป็นฝ่ายเอ่ยปากสารภาพรักก่อน เธอก็จะเก็บไปพิจารณา และเธอก็มีความตั้งใจมากพอที่จะพิจารณาเรื่องนั้นในแง่บวกเสียด้วย\n\n‘ให้ฉันเป็นฝ่ายสารภาพรักก่อนเนี่ยนะ? นั่นมันเกินไปหน่อยแล้ว ต่อให้เขาจะเป็นบุรุษที่น่าทึ่งเพียงใด แต่ฉันก็มีคุณค่าสูงส่งกว่าตั้งเยอะ ทั้งเป็นลูกสาวของผู้กล้า เป็นขุนนาง ทั้งงดงาม และยังสาว’\n\nโดยปกติแล้ว เวลาที่อิซาเบลล์พล่ามอะไรทำนองนี้ เอคไดซิสหรือไม่ก็ยูริมักจะเข้ามาพูดขัดจังหวะได้ตรงจังหวะเสมอ แต่น่าเสียดายที่ตอนนี้ไม่มีใครอยู่ข้างกายเธอเลย…\n\n“เฮ้ ไม่มีใครอยู่แถวนี้เลยเหรอ?” (อาแลง)\n\n“แปลกชะมัด ฉันมั่นใจว่าได้ยินเสียงอะไรบางอย่างแน่ๆ” (อาแลง)\n\nเมื่ออาแลงบ่นพึมพำ นักศึกษาอีกกลุ่มหนึ่งที่ซ่อนตัวอยู่หลังต้นไม้ก็พากันเดินออกมา ใบหน้าที่คุ้นเคย กลุ่มของอาแลง\n\nห้าคน เป็นจำนวนที่รับมือได้ยากหากไม่ยอมเจ็บตัวเข้าปะทะซึ่งๆ หน้า\n\nทว่า อิซาเบลล์กลับปีนขึ้นไปบนต้นไม้อย่างเงียบเชียบพร้อมกับดาบในมือ\n\nการฝึกต่อต้านการซุ่มโจมตี หากมองในอีกมุมหนึ่ง ก็สามารถมองว่าเป็นการฝึกการซุ่มโจมตีได้เช่นกัน เพื่อที่จะรับมือกับการซุ่มโจมตีได้ คนคนนั้นย่อมต้องช่ำชองในวิธีการดักซุ่มโจมตีเสียก่อน\n\nดังนั้น อิซาเบลล์ที่ได้รับการฝึกฝนภาคปฏิบัติโดยตรงจากสายลับภาคสนามที่เก่งกาจที่สุดในคราซิลอฟ จึงก้าวข้ามระดับที่นักศึกษาปีหนึ่งของมหาวิทยาลัยจะสามารถรับมือได้ไปแล้วในตอนนี้\n\n‘จัดการทีละเรื่องก่อนแล้วกัน’\n\nอิซาเบลล์เอามือปิดปากชายที่ยืนอยู่หลังสุดแล้วจ่อคมดาบเข้าที่ลำคอของเขาตรงๆ\n\n“อื้อ… อื้อ?!”\n\n“ชู่ว์ อยู่เฉยๆ นะ”\n\n“คุณอิซาเบลล์…?!”\n\n“โอ๊ย เงียบๆ สิ ถ้าไม่ยอมเงียบ เดี๋ยวก็ได้เจ็บตัวตรงไหนเข้าหรอก”\n\nเธอหยิบลูกแก้วออกมาจากกระเป๋าของนักศึกษาคนนั้นที่ไม่รู้จักชื่อ ยกมือขึ้นแล้วฟาดเข้าที่ท้ายทอยของอีกฝ่าย\n\n“อั่ก!!”\n\n“อ้อ ตาแก่ชอบทำให้คนสลบแบบนี้สินะ”\n\n“ซุ่มโจมตี…! ถูกซุ่มโจมตี!! ยัยนี่ชิงลูกแก้วของฉันไปแล้ว!!”\n\n“แหม นี่มันขี้โกงชัดๆ ถ้าตกรอบไปแล้วก็ควรจะเงียบปากสิ”\n\nอิซาเบลล์บ่นพึมพำพลางยกดาบขึ้น นักศึกษาคนนั้นที่โดนฟาดท้ายทอยร้องครวญครางด้วยความเจ็บปวด แต่ก็เพราะเสียงนั้นนั่นแหละที่ทำให้อีกสี่คนที่เหลือพุ่งตรงเข้ามาหาเธอ\n\n“อิซาเบลล์…! กล้าบุกเดี่ยวเข้ามาสู้กับพวกเราเนี่ยนะ! เธอมันกล้าหาญหรือโง่เขลากันแน่?”\n\n“แหม อาแลง พวกเราตกลงกันไว้ว่าให้เลิกพูดมากแล้วไม่ใช่หรือไง?”\n\nอิซาเบลล์แสยะยิ้มพลางยกดาบขึ้น เอาเถอะ สี่คนก็ยังดีกว่าห้าคน เธอตัดสินใจที่จะคิดในแง่บวกเข้าไว้\n\nท่าทางที่ไอ้หมอนั่นกับไอ้หมอนี่หัวเราะอย่างเก้ๆ กังๆ ขณะวิ่งกรูเข้ามาหาเธอนั้นไม่น่าพิสมัยเลยสักนิด\n\nและยิ่งไปกว่านั้น\n\n‘ท่ายืนบ้าอะไรกันน่ะ’\n\nทั้งวิธีการโจมตี แรงส่งที่พุ่งเข้ามา และทิศทางการเคลื่อนไหวอันงุ่มง่ามที่ไม่สอดประสานกันเลยสักนิด\n\nทุกแง่มุมช่างน่าขบขันเสียจริง\n\nเมื่อเทียบกับเหตุการณ์บนรถไฟวันปฐมนิเทศที่เธอต้องเผชิญหน้ากับผู้ก่อการร้ายโดยเอาชีวิตเป็นเดิมพัน และตลอดสัปดาห์ที่ผ่านมาซึ่งอีวานบุกโจมตีเธอราวกับสมรภูมิจริงแล้ว เรื่องแค่นี้มันน่าเบื่อสิ้นดี\n\nเธอหัวเราะเบาๆ ในลำคอ เอาจริงๆ พอมาคิดดูแล้ว ทั้งหมดนี้ก็เป็นเพราะตาแก่คนนั้นนั่นแหละ เขาเอาจริงเอาจังเกินไปแล้วจริงๆ\n\n“ถ้าฉันมีลูกแก้วครบทั้งห้าเม็ด ฉันจะได้เป็นนักศึกษาอันดับหนึ่งไหมนะ? คราวนี้ ฉันอยากเป็นที่หนึ่งให้ได้จริงๆ นะ”\n\nอิซาเบลล์หัวเราะแผ่วเบาขณะหันไปเผชิญหน้ากับพวกเขา\n\n***\n\nเวลาล่วงเลยไปราวสองชั่วโมงนับตั้งแต่การสอบเริ่มต้นขึ้น\n\nมาถึงตอนนี้ นักศึกษาประมาณครึ่งหนึ่งต่างก็ทยอยออกจากป่าพร้อมเจ้าหน้าที่คุ้มกันหลังจากได้คะแนนไม่ผ่านเกณฑ์กันไปหมดแล้ว\n\nดังนั้น เมื่อจำนวนนักศึกษาที่ลูกศิษย์ของเอนริเก้ต้องรับมือลดน้อยลง การโจมตีจึงยิ่งทวีความรุนแรงมากยิ่งขึ้น\n\n– ครืนนนนน…\n\nแรงสั่นสะเทือนเริ่มก่อตัวขึ้นจากใต้พิภพอันลึกล้ำ\n\n“อะไรน่ะ?!”\n\nยูริที่กำลังวิ่งอยู่เสียหลักล้มลง เธอรีบยันกายลุกขึ้นอย่างรวดเร็ว กุมดาบไว้แน่นพลางกวาดสายตามองสำรวจรอบข้าง\n\nทว่าไม่มีใครอยู่เลย ไม่มีแม้แต่ร่องรอยของการโจมตี\n\n“นี่มันอะไรกัน?”\n\n– ครืนนนนน…!!\n\nแรงสั่นสะเทือนของผืนดินยิ่งทวีความรุนแรงขึ้น หนักหน่วงขึ้นเรื่อยๆ ต้นไม้ในป่าพากันโยกไหว ใบไม้เสียดสีกันดังเกรียวกราว\n\nเอนริเก้ขมวดคิ้วมุ่นแล้วกระโดดขึ้นไปบนยอดไม้ทันที\n\n“…นี่มันเรื่องบ้าอะไรกัน?”\n\n***\n\n– ครืนนนนน…!!\n\nในขณะที่ผืนดินสั่นสะเทือน อีวานก็ถีบต้นไม้แล้วพุ่งตัวทะยานขึ้นไป เขากระโดดขึ้นไปบนยอดไม้ที่สูงที่สุดและกวาดสายตามองสำรวจรอบบริเวณ\n\nผืนป่าทั้งผืนกำลังสั่นไหว\n\n“จุดไหนกัน?”\n\nแม้จะเกิดแผ่นดินไหวขึ้นอย่างกะทันหัน แต่อีวานกลับไม่ได้รู้สึกประหลาดใจเลยสักนิด ในเมื่อการโจมตีเป็นสิ่งที่เลี่ยงไม่ได้ เขาก็ไม่ใช่คนที่จะมานั่งตกอกตกใจกับเรื่องที่ดำเนินไปตามที่คาดการณ์ไว้อยู่แล้ว\n\nเป้าหมายของมันอยู่ที่ไหนกันแน่?\n\nอีวานกวาดสายตามองรอบตัวอย่างเยือกเย็น ขอบเขตของมันกว้างขวางเกินไป แม้เขาจะทราบตำแหน่งของอิซาเบลล์และออสการ์อยู่ก่อนแล้ว ทว่าทิศทางของแผ่นดินไหวกลับไม่ได้จำกัดอยู่แค่บริเวณที่ทั้งสองคนอยู่เท่านั้น\n\nผืนป่าทั้งหมดกำลังสั่นสะเทือน\n\n“แหม แหม ดูนี่สิ”\n\nไม่นานนักอีวานก็หัวเราะออกมาเบาๆ นั่นเป็นเพราะรูปแบบที่คุ้นเคยได้ปรากฏขึ้นต่อสายตาของเขา\n\nเป็นฝีมือพวกคนแคระจริงๆ ด้วย เหมือนที่คาดไว้ไม่มีผิด\n\nอีวานรีบกวาดสายตาสำรวจผืนป่าอย่างรวดเร็ว หากไม่ตื่นตระหนกไปกับเหตุแผ่นดินไหวกะทันหันและสังเกตการณ์สมรภูมิทั้งหมดด้วยมุมมองที่กว้างไกล เขาก็จะสามารถมองเห็นสิ่งต่างๆ ได้ชัดเจนขึ้น\n\nท้ายที่สุดแล้ว แผ่นดินไหวก็เป็นเพียงคลื่นชนิดหนึ่ง แรงสั่นสะเทือนที่รุนแรงที่สุดย่อมเกิดขึ้นบริเวณใกล้จุดเหนือศูนย์เกิดแผ่นดินไหว หรือที่เรียกว่าศูนย์กลางแผ่นดินไหว\n\nฉะนั้น ลองมาอนุมานกันดู\n\nต้นไม้ที่สั่นไหวสามารถใช้เป็นตัวชี้วัดชั้นยอดได้ หากเขาสามารถแยกแยะระดับความรุนแรงของการสั่นไหวได้ เขาก็จะสามารถวิเคราะห์หาตำแหน่งศูนย์กลางของมันได้ไม่ยาก\n\nดังที่เคยกล่าวไว้ก่อนหน้านี้ โดยเนื้อแท้แล้วผืนป่าก็ใกล้เคียงกับเขาวงกต มันคือโครงสร้างอันซับซ้อนที่เกิดจากต้นไม้ซึ่งเติบโตขึ้นอย่างสะเปะสะปะและต้นไม้ใหญ่ที่แผ่กิ่งก้านพันเกี่ยวกันไปมา\n\nด้วยการไม่ถูกหลอกไปกับรูปลักษณ์ภายนอกเช่นนั้น และวิเคราะห์วัตถุต้นไม้ที่สั่นไหวแต่ละต้นแยกจากกันอย่างเป็นอิสระ\n\n“ใยแมงมุมนี่นา”\n\nจุดศูนย์กลางแผ่นดินไหวแนวยาวแผ่ขยายออกเป็นรูปวงกลม คล้ายคลึงกับรูปร่างของใยแมงมุม\n\nรูปแบบการโจมตีอันเป็นเอกลักษณ์ของ ‘นักถักทอใย (Webmaker)’ แห่งกองทัพมังกรที่ 5\n\nไม่เจอกันนานเลยนะ อีวานแทบจะรู้สึกโหยหาอดีตขึ้นมาครามครัน มันเป็นการโจมตีที่ตรงตามตำรามาก และทำให้เขานึกถึง ‘สงครามกังโด’ ในอดีตขึ้นมา\n\nแม้ว่าขนาดของมันจะเล็กกว่าตอนนั้นมากก็ตามเถอะ\n\n– ครืนโครมมมม—!!\n\nพร้อมกับเสียงคำรามกึกก้องประหนึ่งหิมะถล่ม ผืนป่าทั้งหมดก็พังทลายยุบตัวลง\n\nต้นไม้พันเกี่ยวล้มระเนระนาด และหน้าดินก็พลิกคว่ำถล่มทลาย เผยให้เห็นโพรงอุโมงค์อันลึกล้ำ\n\nทุกสิ่งทุกอย่างที่อยู่เบื้องบนถูกกลืนกินกวาดต้อนลงไปในกองดินและโคลนตม\n\nฝุ่นควันและเศษไม้หักโค่นพวยพุ่งตลบอบอวล ก่อให้เกิดเสียงกัมปนาทสั่นสะเทือนเลื่อนลั่น\n\nท่ามกลางสมรภูมิอันอัดแน่นไปด้วยความโกลาหล โสตประสาทของอีวานจับเสียงกรีดร้องของนักศึกษาจำนวนมากได้ชัดเจน\n\n‘การช่วยเหลือพวกนักศึกษาเป็นหน้าที่ของเอนริเก้’\n\nเอนริเก้ย่อมสามารถประเมินสถานการณ์ได้ในพริบตาเดียว การโจมตีของเผ่าคนแคระเป็นสิ่งที่เธอคุ้นเคยดีอยู่แล้วเช่นกัน ยิ่งไปกว่านั้น นักศึกษาส่วนใหญ่ต่างก็มี ‘อุปกรณ์เวทมนตร์ติดตามตำแหน่ง’ อยู่กับตัว ฉะนั้น แนวโน้มที่จะช่วยเหลือเหล่านักศึกษาได้ทันเวลาทองคำจึงมีสูงมาก\n\nนี่คือการฝึกภาคสนามนอกสถานที่ และยิ่งเป็นการสอบภาคปฏิบัติ ‘การรับมือการซุ่มโจมตี’ ด้วยแล้ว เหล่านักบวชย่อมต้องเตรียมพร้อมสแตนด์บายรออยู่ก่อนแล้ว ต่อให้มีผู้ได้รับบาดเจ็บ พวกเขาก็สามารถฟื้นฟูรักษาได้\n\nอีวานกระโดดลงจากต้นไม้ทันที\n\n‘ออสการ์อยู่ใกล้กว่าสินะ?’\n\nหากพิจารณาว่าเป้าหมายของเจ้าพวกนี้คืออิซาเบลล์หรือไม่ก็ออสการ์ เขาก็ควรให้ความสำคัญกับคนที่อยู่ใกล้กว่าเป็นอันดับแรก\n\nอีวานไล่เรียงเส้นทางในหัว ก่อนจะทิ้งตัวพุ่งลงไปในช่องแยกของโพรงอุโมงค์ลึกซึ่งมืดมิดจนมองไม่เห็นพื้นเบื้องล่าง\n\nสมรภูมิอยู่ใกล้แค่เอื้อม เป้าหมายชัดเจน และอาวุธก็เตรียมพร้อมครบมือ\n\nสำหรับผู้บัญชาการหน่วยเก็บกวาดแล้ว ไม่จำเป็นต้องมีเหตุผลอื่นใดอีก"
    },

      "content": "ออสการ์ยืนพิงผนังอยู่ โดยปักดาบเอาไว้กับพื้นดิน\n\n“ไม่อยากจะเชื่อเลยจริงๆ”\n\nเขากวาดสายตามองไปรอบๆ พลางยกมือเช็ดเลือดที่ไหลซึมลงมาจากหน้าผากอย่างลวกๆ มองไม่เห็นอะไรเลยแม้แต่น้อย\n\nเดิมทีผืนป่าก็มืดทึบอยู่แล้ว โดยเฉพาะอย่างยิ่งป่าแห่งเฟรเชนกายา ที่มืดสลัวจนชวนหดหู่แม้ในยามกลางวันแสกๆ\n\nดังนั้น การจะหาแหล่งกำเนิดแสงหลังจากที่ถูกฝังอยู่ใต้ผืนดินในป่าแห่งนี้จึงเป็นเรื่องยากลำบากอย่างยิ่ง ทว่า…\n\n“ทำไมใต้ดินในป่าถึงมีถ้ำอยู่ได้ล่ะเนี่ย? ประเทศบ้าบอคอแตกเอ๊ย”\n\nออสการ์หัวเราะเยาะหยันพลางดึงดาบขึ้นมา ขาข้างหนึ่งของเขาหักสะบั้น ทำให้การพยุงกายเดินเกาะผนังไปนั้นเป็นไปอย่างยากลำบาก\n\n‘ควรจะรอจนกว่าความช่วยเหลือจะมาถึงดีไหมนะ?’\n\nเขาเป็นนักศึกษา ฉะนั้นทีมกู้ภัยย่อมต้องติดตามมาช่วยเหลือสำหรับอุบัติเหตุครั้งใหญ่ระหว่างคาบเรียนเช่นนี้\n\nยิ่งไปกว่านั้น เขายังมีลูกแก้วอยู่กับตัวถึงสามเม็ด ซึ่งแต่ละเม็ดก็มีฟังก์ชันเวทมนตร์ติดตามตำแหน่งอยู่\n\nดังนั้น ตราบใดที่ไม่มีเหตุแทรกซ้อนร้ายแรง การอยู่เฉยๆ รอที่นี่จึงดูจะเป็นทางเลือกที่ปลอดภัยที่สุด ทว่า…\n\n‘พวกนั้นหนีออกไปได้หรือเปล่า?’\n\nนั่นแหละคือปัญหา การที่เขามีลูกแก้วสามเม็ดอยู่ในมือ หมายความว่าอย่างน้อยที่สุด เขาได้ชิงลูกแก้วมาจากเพื่อนนักศึกษาสองคน\n\nเขาเอาชนะเพื่อนร่วมรุ่นสองคนแล้วชิงลูกแก้วมาในระหว่างการสอบ มันเป็นเรื่องที่เลี่ยงไม่ได้ก็จริง แต่ตอนนี้กลับกลายเป็นปัญหาใหญ่ บางทีเขาอาจจะชิงเครื่องติดตามตำแหน่งของพวกนั้นมาด้วย\n\nหากเจ้าพวกนั้นถูกฝังอยู่ใต้กองดินพวกนี้ พวกเขาก็จะไม่ได้รับการช่วยเหลือ\n\nออสการ์ถอนหายใจ ความเจ็บปวดจากขาที่หักนั้นแสนสาหัสก็จริง แต่…\n\n“ฉันต้องไปช่วยพวกเขา”\n\nเขาเช็ดคราบเลือดออกแล้วลืมตาขึ้น ดวงตาสีเขียวเป็นประกายวาววับท่ามกลางความมืดมิด\n\nฉันต้องไปช่วยพวกเขา\n\nเพราะเป็นเพื่อนร่วมรุ่นอย่างนั้นหรือ? เพราะเขาเป็นขุนนางอย่างนั้นหรือ? หรือเพราะเขาเป็นลูกชายของจิลแบร์ วีรบุรุษแห่งคณะอัศวินอย่างนั้นหรือ?\n\nไม่ใช่\n\nเพราะเขาเป็นอัศวินต่างหาก\n\nอัศวินแห่งทิลีสจะไม่มีวันทอดทิ้งผู้อ่อนแอต่อหน้าความทุกข์ยากเด็ดขาด\n\nเขานึกย้อนถึงสิ่งที่ได้รับการพร่ำสอนจากบิดาผู้รักชาติมาตั้งแต่ยังเยาว์วัย\n\n***\n\n“อ๊าก!! ช่วยด้วย!! ไม่มีใครอยู่แถวนี้เลยเหรอ!!”\n\n“ช่วยด้วย!! พวกเราติดอยู่ที่นี่!!”\n\nหนวกหูชะมัด อีวานเดาะลิ้นเบาๆ ขณะก้าวเดินไปตามอุโมงค์\n\nภายในพื้นที่อันคับแคบของอุโมงค์ที่ทัศนวิสัยถูกจำกัดอย่างถึงที่สุด เมื่อประสาทสัมผัสหนึ่งถูกปิดกั้น ประสาทการได้ยินย่อมขยายตัวเฉียบคมขึ้นโดยธรรมชาติ\n\nดังนั้น การตะโกนโหวกเหวกในอุโมงค์จึงเป็นข้อห้ามเด็ดขาด โดยเฉพาะอย่างยิ่งหากพื้นที่นั้นคือแนวหน้าของสมรภูมิ\n\nมันจะกลายเป็นเครื่องนำทางชั้นดีให้กับศัตรูที่อยู่ลึกเข้าไปในอุโมงค์ และเสียงกรีดร้องที่ก้องสะท้อนไปตามผนังอุโมงค์ยังทำให้การรับรู้ทิศทางบิดเบี้ยวไปอีกด้วย\n\nหากหลงทางเช่นนั้น ความหวาดกลัวก็จะยิ่งทวีคูณ มนุษย์ไม่ได้ถูกออกแบบมาให้ใช้ชีวิตอยู่ในความมืดมิด\n\nมนุษย์ที่ไม่ได้รับการฝึกฝนย่อมตื่นตระหนกในสถานการณ์เช่นนี้ ตะโกนร้องขอความช่วยเหลือซ้ำแล้วซ้ำเล่า และสูญเสียการรับรู้ทิศทางไปเรื่อยๆ วงจรอุบาทว์เช่นนี้จึงดำเนินต่อไปไม่รู้จบ\n\n– กริ๊ก\n\nอีวานเงี่ยหูฟังเสียงกรีดร้อง ชักปืนพกออกมา แล้วก้าวเดินต่อไปทั้งที่หลับตาอยู่\n\nหนึ่งก้าว อีกหนึ่งก้าว\n\nไม่เคยเร่งรีบ ทว่าก็ไม่ได้เชื่องช้าจนเกินไป\n\nด้วยจังหวะก้าวที่ราวกับวัดระยะมาอย่างแม่นยำ ตรงไปข้างหน้า\n\nเขานับจำนวนก้าวที่เดินมาทุกก้าว ระยะก้าวของเขาอยู่ที่ 86 เซนติเมตรพอดิบพอดี ดังนั้น ด้วยการนับจำนวนก้าวที่เดิน เขาจึงสามารถวาดเส้นทางลงบนแผนที่ในหัวได้นับตั้งแต่จุดที่กระโดดเข้ามา\n\nผู้บัญชาการหน่วยเก็บกวาดต้องเชี่ยวชาญการหาพิกัดสามเหลี่ยมภาคสนามควบคู่ไปกับการเดินแผนที่ทางบก\n\nตำแหน่งล่าสุดที่ยืนยันได้ของออสการ์ ตำแหน่งของอิซาเบลล์ และจุดที่เขากระโดดลงมา\n\nด้วยการกำหนดจุดทั้งสามนี้ในหัวอย่างแม่นยำโดยไร้ความคลาดเคลื่อน เขาจึงสามารถเคลื่อนที่ผ่านอุโมงค์ที่สลับซับซ้อนราวกับเขาวงกตได้อย่างมั่นใจและมุ่งหน้าไปได้อย่างไร้ความลังเล\n\n“ช่วยด้วย!!”\n\nเสียงกรีดร้องอยู่ใกล้เข้ามาแล้ว เขาถือปืนพกพลางเล็งไปที่ระดับเอวแล้วเคลื่อนตัวไปข้างหน้า\n\nเมื่อคำนึงถึงส่วนสูงโดยเฉลี่ยของคนแคระ ตำแหน่งที่เขาเล็งไว้นั้นก็อยู่ระดับศีรษะพอดี แน่นอนว่าการยิงปืนใส่ศีรษะของคนแคระเพียงนัดเดียวยังไม่อาจสังหารพวกมันได้\n\nเจ้าพวกนี้มันหนังเหนียวตายยาก\n\n“มีใครอยู่แถวนั้นไหม?” (คนแคระ)\n\n“ทางนี้!! ฉันอยู่นี่!!” (นักศึกษา)\n\n“บอกชื่อมา!” (คนแคระ)\n\n“ฉันชื่อแพทริก!! ไม่สิ ตอนนี้เรื่องที่ว่าฉันเป็นใครมันสำคัญด้วยหรือไง?”\n\nแน่นอนว่ามันไม่สำคัญหรอก ในสถานการณ์ภัยพิบัติเช่นนี้ โดยปกติแล้วย่อมต้องช่วยเหลือทุกคนอย่างเท่าเทียมโดยไม่เลือกปฏิบัติ ไม่ว่าอีกฝ่ายจะเป็นใครก็ตาม\n\nอีวานหัวเราะเบาๆ ในลำคอเมื่อได้ยินเสียงที่ดังมาจากปลายอุโมงค์\n\nวิธีการพูดจาอันติดขัดแปร่งหูแบบนั้น พวกคนแคระสินะ พวกมันคงกำลังเดินตระเวนไปตามอุโมงค์เพื่อตามหาตัวออสการ์กับอิซาเบลล์อยู่\n\nเขาสัมผัสได้ว่าพวกมันกำลังถอยห่างออกไปเรื่อยๆ ขณะฟังเสียงของคนที่ติดอยู่ด้านใน เอาเถอะ ดูเหมือนว่าไม่ใช่นักศึกษาทุกคนที่จะตกเป็นเป้าหมายของพวกมัน\n\n“โชคดีไปนะ”\n\nแพทริกรอดชีวิตมาได้ก็เพราะเขาบอกชื่อตัวเองออกไปก่อน พวกคนแคระในอุโมงค์คงกำลังตามหาตัวออสการ์และอิซาเบลล์อยู่\n\nเอนริเก้อยู่ในพื้นที่นี้ด้วย ดังนั้นพวกมันจึงไม่อาจใช้เวลามากนัก การปะทะกับเอนริเก้ในอุโมงค์คือวิธีฆ่าตัวตายที่เลวร้ายที่สุด เพราะแวมไพร์มีสายตาที่มองเห็นในความมืด และการต่อสู้กับเธอในอุโมงค์ก็คงเป็นหายนะดีๆ นี่เอง\n\nฉะนั้น นักศึกษาสองคนนั้นอย่างน้อยก็จะไม่ตายด้วยน้ำมือของพวกคนแคระแน่\n\n“จะไปไหนน่ะ! คุณอยู่ไหน? ช่วยด้วย!!”\n\n“ชู่ว์ เงียบซะ”\n\nอีวานเดินเข้าไปหานักศึกษาที่กำลังตะโกนโหวกเหวก แล้วเอามือปิดปากหมอนั่นเอาไว้ เสียงลมหายใจหอบกระชั้นและความชื้นแฉะจากเหงื่อไคลสัมผัสได้ชัดเจนใต้ฝ่ามือของเขา\n\nอีวานตบไหล่เด็กหนุ่มเบาๆ ก่อนจะกระซิบ\n\n“พวกที่เพิ่งถามชื่อนายไปเมื่อกี้นี้ คือพวกที่ควบคุมโพรงอุโมงค์แห่งนี้”\n\n“…อึก?!”\n\n“ใช่ นายเกือบจะตายแล้ว เพราะฉะนั้นเงียบปากซะ”\n\n“อึก…! เอ่อ คุณเป็นใครครับ?”\n\n“เจ้าหน้าที่ทีมกู้ภัย เอาล่ะ เงียบไว้ นายมีลูกแก้วอยู่กับตัวไหม?”\n\n“ออสการ์เอาของผมไปแล้วครับ!”\n\nเฮ้อ เรื่องคงไม่ง่ายเสียแล้ว\n\nอีวานเดาะลิ้นพลางเอ่ยถามต่อ\n\n“ออสการ์อยู่แถวนี้หรือเปล่า?”\n\n“ครับ หลังจากพวกเราแพ้ออสการ์ไปได้ไม่นาน พื้นดินก็ถล่มลงมาแทบจะทันทีเลย…”\n\n“เดินไหวไหม?”\n\n“ไหว ไหวครับ!”\n\n“รับนี่ไป”\n\nอีวานหยิบลูกแก้วเม็ดหนึ่งออกมาจากเข็มขัดแล้วยื่นให้นักศึกษาคนนั้น\n\n“เดินไปทางนั้นสัก 10 เมตร… อย่างน้อยถ้านายเดินไปไกลเท่านั้นก็น่าจะมองเห็นท้องฟ้าแล้ว ปีนขึ้นไปบนนั้นแล้วรอรับการช่วยเหลือ เดี๋ยวเอนริเก้ก็หาตัวนายเจอเอง”\n\n“ขะ-ขอบคุณครับ!”\n\n“เงียบๆ ด้วย ศัตรูยังอยู่แถวนี้”\n\nอีวานตบไหล่หมอนั่นเบาๆ สองสามทีแล้วเคลื่อนตัวมุ่งหน้าต่อไป\n\n***\n\n(มุมมองของออสการ์)\n\n“บอกชื่อมา!”\n\n“ฉันชื่อแพทริก!! ไม่สิ ตอนนี้เรื่องที่ว่าฉันเป็นใครมันสำคัญด้วยหรือไง?”\n\nโอเค เจ้าหน้าที่ทีมกู้ภัยสินะ\n\nดีเลย ถ้าหนีออกไปพร้อมกับพวกเขาได้ก็คงไม่มีปัญหาอะไร\n\nโชคดีที่ดูเหมือนทั้งสองคนจะยังมีชีวิตอยู่ ค่อยโล่งอกไปที\n\nออสการ์ถอนหายใจแล้วเดินกะเผลกขยับฝีเท้าไปข้างหน้า เขาอ้าปากเตรียมจะตะโกนขอความช่วยเหลือ ทว่าจู่ๆ ก็หุบปากลงฉับพลัน\n\nมีบางอย่างแปลกๆ…?\n\n‘ถามชื่อ… แล้วก็เงียบไปอย่างนั้นเหรอ’\n\nไม่มีเหตุผลอะไรเลยที่จะต้องกระซิบกระซาบกัน หากมีนักศึกษาคนอื่นติดอยู่แถวนี้ ยิ่งควรส่งเสียงดังเพื่อแจ้งให้ทีมกู้ภัยรู้ตัวไม่ใช่หรือไง\n\nดังนั้น ความเงียบงันอย่างกะทันหันนี้จึงน่าสงสัยยิ่งนัก สัญชาตญาณของออสการ์ส่งเสียงเตือนภัยดังลั่น\n\n“เอาอีกรอบ! มีใครอยู่อีกไหม! มีผู้รอดชีวิตคนอื่นอีกหรือเปล่า?!”\n\n“…”\n\nออสการ์กลืนน้ำลายอึกใหญ่ เงี่ยหูฟังอย่างตั้งอกตั้งใจ\n\nหลังจากเสียงตะโกนของคนคนนั้น เสียงของนักศึกษาสองคนก่อนหน้านี้ก็ขาดหายไปดื้อๆ\n\nข้อสันนิษฐานหนึ่งผุดขึ้นมาในหัวของออสการ์\n\n– หากการมีถ้ำอยู่ใต้ดินในป่าเฟรเชนกายาไม่ใช่เรื่องปกติ\n\nพอมานึกดูดีๆ แล้ว ผนังถ้ำพวกนี้ก็ถูกขุดสกัดอย่างประณีตเรียบร้อยเกินกว่าจะเป็นถ้ำธรรมชาติ หากนี่ไม่ใช่เรื่องปกติ แล้วถ้าหากมีใครบางคนลอบขุดอุโมงค์และวางกับดักเอาไว้ล่วงหน้าล่ะ?\n\nถ้าอย่างนั้น ไอ้คนที่ตะโกนโหวกเหวกราวกับกำลังมาช่วยเหลือพวกนักศึกษาอยู่ตอนนี้…\n\n‘ศัตรู’\n\nออสการ์กัดฟันกรอด การต่อสู้กับศัตรูที่ไม่รู้จักในความมืดมิดอันลึกล้ำที่มองไม่เห็นสิ่งใดเลยนั้นเป็นเรื่องโง่เขลาสิ้นดี\n\nโดยเฉพาะอย่างยิ่งในสภาพที่ขาหักไปข้างหนึ่งแบบนี้\n\n‘บางทีแค่รออยู่เฉยๆ อาจจะดีกว่า’\n\nอย่างไรเสีย เขาก็มีอุปกรณ์เวทมนตร์ติดตามตำแหน่งอยู่กับตัว ตราบใดที่ท่านเอนริเก้อยู่แถวนี้ ทีมกู้ภัยย่อมต้องมาถึงในไม่ช้า ดังนั้นเขาแค่ต้องอดทนรอจนกว่าจะถึงตอนนั้น\n\nออสการ์ขบกรามแน่นแล้วกระชับดาบในมือให้มั่น\n\n“เฮ้!! ช่วยด้วย!!”\n\n“นักศึกษาทางนั้น ชื่ออะไรน่ะ!?”\n\nจากส่วนลึกไกลออกไปในถ้ำ เสียงกรีดร้องอีกระลอกดังสะท้อนก้องเข้ามา\n\nมีผู้รอดชีวิตรายอื่นกำลังกรีดร้องขอความช่วยเหลืออยู่\n\nบัดซบเอ๊ย\n\nออสการ์หยัดกายลุกขึ้นยืน สูดลมหายใจเข้าลึก หลับตาลง และหลังจากลังเลอยู่ชั่วครู่\n\nเขาก็ลืมตาขึ้นแล้วตะโกนก้อง “ออสการ์ ผู้รักชาติแห่งทิลีส บุตรชายของจิลแบร์ อยู่ที่นี่แล้ว!”\n\nคาดเดาได้ไม่ยาก หากเจ้าพวกนี้เจ้าเล่ห์พอที่จะวางกับดักระดับนี้ได้ พวกมันย่อมต้องเล็งเป้าหมายที่มีมูลค่าสูงเป็นธรรมดา และในป่าแห่งเฟรเชนกายา เป้าหมายที่มีค่ามากที่สุดก็ไม่ใช่ใครอื่นนอกจากตัวเขาเอง\n\nแน่นอนว่ายังมีอิซาเบลล์อยู่ด้วย แต่ก็ยากจะกล่าวว่าเธอมีมูลค่าสูงกว่า เพราะบิดาของเธอยังหายสาบสูญ ส่วนบิดาของเขาในตอนนี้เป็นถึงดยุกแห่งทิลีส\n\nโดยธรรมชาติแล้ว หากพวกมันคิดจะลักพาตัวใครสักคน ย่อมต้องเลือกบุตรชายของท่านดยุกอยู่แล้ว ต่อให้เป้าหมายของอีกฝ่ายจะไม่ใช่การลักพาตัว แต่ความแค้นที่พุ่งเป้ามาที่เขาก็ย่อมรุนแรงยิ่งกว่ากรณีของแม็กซิมิเลียน ผู้กล้าเสียอีก\n\nดังนั้น โอกาสที่ตัวเขาจะเป็นเป้าหมายหลักจึงมีสูงมาก การที่พวกมันเอาแต่ไล่ถามชื่อของพวกนักศึกษามาตลอดทางก็น่าสงสัยตั้งแต่แรกแล้ว\n\n“เจอตัวแล้ว”\n\nเสียงทุ้มต่ำก้องสะท้อนดังมา ออสการ์กัดฟันแน่นแล้วยกดาบขึ้นตั้งท่า\n\nนี่คือสิ่งที่ถูกต้องแล้วใช่ไหม?\n\nเอาเถอะ ใครจะรู้กันว่าจะมีสักคนรับรู้ถึงการเสียสละที่เอาชีวิตเข้าแลกครั้งนี้หรือไม่ ใครกันที่จะเป็นฝ่ายชื่นชมมัน?\n\n“ฉันจะเป็นคนชื่นชมมันเอง”\n\nความดีงามย่อมเป็นดั่งคบเพลิงที่ส่องสว่างด้วยตัวมันเอง\n\nคุณธรรมอันสูงสุดของการทำความดีคือการเสียสละตนเองโดยไม่หวังให้ใครมารับรู้\n\nอัศวินแห่งทิลีสจะไม่มีวันทอดทิ้งผู้อ่อนแอต่อหน้าความทุกข์ยากเด็ดขาด\n\nออสการ์ยึดมั่นในความคิดนี้ไว้แน่น พลางชูดาบตั้งตรงเตรียมพร้อมรับมือ\n\n***\n\n“จิลแบร์เลี้ยงลูกชายได้ดีจริงๆ”\n\nอีวานหัวเราะเบาๆ กับสิ่งที่ได้ยิน\n\nเขาค่อยๆ ก้าวเดินไปข้างหน้าอย่างช้าๆ พลางยกปืนขึ้น\n\nก้าวเดินทีละก้าว ไม่เร่งรีบแต่ก็ไม่เชื่องช้าจนเกินไป นับจำนวนก้าวเดินทุกก้าวด้วยจังหวะที่แม่นยำ\n\nประคองปืนไว้ในมือ ปรับศูนย์เล็งให้อยู่ในระดับเอว\n\nเงี่ยหูฟังเสียงฝีเท้าหนักๆ คำนวณระยะก้าวเพื่อประเมินส่วนสูง แล้วปรับศูนย์เล็งใหม่อีกครั้ง\n\nรอคอยให้เสียงฝีเท้าที่ได้ยินก้าวเข้ามาอยู่ในระยะหวังผลของการยิง\n\nระบุตำแหน่งของออสการ์ให้แน่ชัดแล้วจัดแนววิถีกระสุนให้พ้นทาง ตรงไปข้างหน้า\n\nเล็งเป้า กลั้นลมหายใจ และ…\n\nลั่นไก\n\n– ปัง!"

      "title": "บทที่ 43",
      "content": "แผ่ขยายการเสริมพลังเวท ให้ไหลเวียนแทรกซึมไปตามทุกซอกมุมของเส้นประสาทอย่างไร้รอยต่อ\n\nกลั้นลมหายใจ ปรับจูนสัมผัสแห่งพลังเวทที่แล่นพล่านอยู่ในเส้นเลือด\n\n– กริ๊ก\n\nประสาทสัมผัสที่ไม่เคยสังเกตเห็นมาก่อนพลันตื่นตัวขึ้น จังหวะการไหลผ่านของกาลเวลา ปลายนิ้วที่วางอยู่บนไกปืนและกำลังเหนี่ยวรั้ง กระทั่งแรงเสียดทานอันแผ่วเบาขณะที่สปริงภายในกระบอกปืนบิดตัว ทุกสิ่งทุกอย่างล้วนถูกรับรู้ได้ทั้งหมด\n\nณ ที่แห่งนี้คือสมรภูมิของเหล่ายอดมนุษย์\n\n– ปัง!\n\nลั่นไก และในเสี้ยววินาทีเดียวกันนั้น ดวงตาของเขาก็เบิกเปิดขึ้น\n\nเปลวไฟที่ปะทุพวยพุ่งออกจากปากกระบอกปืนส่องสว่างตรอกอันมืดมิดขึ้นชั่วพริบตา\n\nเหตุผลที่ต้องเร่งเร้าประสาทสัมผัสให้เฉียบคมถึงขีดสุดก็เพื่อการนี้ เพื่อป้องกันไม่ให้แสงสว่างกะทันหันทำให้ประสาทตาที่ปรับตัวเข้ากับความมืดแล้วพร่ามัว\n\nแม้เส้นประสาทที่ถูกกระตุ้นจะทำให้ดวงตารู้สึกแสบร้อนอยู่บ้าง แต่นั่นไม่เป็นไร เขาคุ้นชินกับมันดี\n\nไอพลังของคนสามคนประทับตรึงลงบนจอประสาทตาของอีวานราวกับรอยแผลเป็นตกค้าง\n\n“ปืน! มีคนอื่นอยู่ที่นี่ด้วย!”\n\n“บ้าเอ๊ย พวกมันซ่อนตัวอยู่ที่ไหนกัน?!”\n\nร่างที่ยืนพิงผนังอยู่คือออสการ์ ส่วนผู้ที่กำลังเดินย่างกรายเข้ามาอย่างเชื่องช้าจากปลายทางเดินคือสิ่งมีชีวิตร่างเล็กสองตน—คนแคระ\n\nยืนยันประกายไฟใกล้ศีรษะของคนแคระในจังหวะที่กระสุนถูกยิงออกไป\n\nสวมใส่ชุดเกราะมาตรฐานของทหารราบคนแคระ\n\nอีวานปรับศูนย์เล็งในทันทีแล้วพุ่งทะยานไปข้างหน้า\n\n“มันมาแล้ว! เตรียมรับมือ!”\n\nคนแคระที่เดินนำหน้าตะโกนลั่นอย่างเฉียบขาด เมื่อประเมินจากภาพติดตาที่ยังคงค้างอยู่บนจอประสาทตา มันติดอาวุธเป็นขวานสองมือ\n\nชุดเกราะมาตรฐานของทหารราบคนแคระจะห่อหุ้มร่างกายทั้งหมดเอาไว้ราวกับโกเล็ม มอบเกราะป้องกันอันหนาเตอะและน่าเกรงขามที่แทบจะต้านทานการโจมตีจากภายนอกได้อย่างสมบูรณ์แบบ\n\n“นี่แหละเหตุผลที่ต้องใช้ดาบ”\n\nสาเหตุที่เขาไม่เลือกใช้ขวานก็เพราะมันไม่อาจเจาะทะลวงเกราะแบบนี้ได้ เจ้าพวกนี้ยังเอาชีวิตรอดมาได้แม้จะถูกฝังอยู่ใต้ภูเขาในช่วงสงครามที่ผ่านมา\n\nมีวิชาการต่อสู้ที่ถูกพัฒนาขึ้นมาเพื่อรับมือกับเจ้าพวกนี้โดยเฉพาะอยู่\n\n– ควับ!\n\n“ฮ่า! มนุษย์! แกไม่มีทางชนะหรอก!”\n\nใบดาบขูดขีดลงบนพื้นผิวของเกราะแผ่นจนเกิดประกายไฟแตกกระจาย เสียงปะทะดังก้องกังวานพร้อมกับคมดาบที่สะท้อนเด้งกลับออกมา\n\n– หวืด!\n\nอีวานตรวจจับทิศทางและความเร็วได้ทันท่วงที จึงย่อเอวหลบลง ใบขวานขนาดมหึมาพุ่งเฉียดผ่านเหนือศีรษะของเขาไป ตัดผ่าอากาศจนดังสนั่น\n\nเขาลดจุดศูนย์ถ่วงลง ยกมือซ้ายขึ้น แล้วลั่นไกอีกครั้ง\n\n– ปัง!\n\nคราวนี้เล็งไปยังคนแคระอีกตนที่อยู่ด้านหลังตัวแรก ประกายไฟจากปากกระบอกปืนส่องสว่าง เผยให้เห็นรูปร่างของอีกฝ่ายขึ้นมาอีกครั้ง\n\nท่ายืน สมดุลร่างกาย จุดอ่อนของชุดเกราะ สีหน้าแสยะยิ้มอย่างท้าทาย และเคราสีเถ้ายาวเฟื้อยที่ห้อยย้อยลงมาใต้คาง\n\nอีวานตั้งดาบตรงแล้วฟาดฟันออกไปอย่างรวดเร็ว\n\n– เคร้ง!\n\n“ไอ้หมอนี่!”\n\nเสียงอุทานของคนแคระดังสะท้อนก้อง การโจมตีอันแม่นยำที่เล็งเป้าไปยังข้อต่อของเกราะ ถูกลงมือด้วยความเที่ยงตรงระดับเหลือเชื่อท่ามกลางความมืดมิด\n\nทว่าแค่นั้นยังไม่เพียงพอ คนแคระคิดเช่นนั้นแล้วเหวี่ยงขวานเข้าใส่อีกครั้ง\n\n– หวืด!\n\nหลบหลีกได้อีกครั้ง\n\n– เคร้ง\n\nฟาดฟันลงไปยังจุดเดิมซ้ำอีกรอบ มันคือการทำซ้ำกระบวนการเดิมอย่างแม่นยำราวกับเครื่องจักร\n\nจุดอ่อนของชุดเกราะคือบริเวณข้อต่อที่หุ้มด้วยเกราะโซ่ถักและเสื้อนวมรองเกราะ แม้มันจะมอบการป้องกันที่เพียงพอต่ออาวุธทั่วไป ทว่าไม่อาจต้านทานเพลงดาบระดับยอดมนุษย์ได้\n\nดังนั้น\n\n– เคร้ง! อีกครั้ง!\n\n“วิชานี้… แกเคยอยู่ในสมรภูมิเมื่อสิบปีก่อนงั้นเรอะ?”\n\n“มีดีแค่นี้เองหรือไง?” (อีวาน)\n\nอีวานแสยะยิ้ม นั่นเป็นเพราะตัวตนของคิมซอนอูที่อยู่ลึกๆ ภายในใจเขากำลังกรีดร้องมาตลอดยี่สิบปี\n\nละทิ้งอารมณ์ความรู้สึกไว้เบื้องหลัง มือทั้งสองข้างต่างก็มีหน้าที่ที่ต้องทำ\n\n– ปัง!\n\nลั่นไกอีกครั้ง ฉวยคว้าทัศนวิสัยชั่วพริบตาแล้วก้าวถอยหลังเพื่อหลบคนแคระอีกตนที่พุ่งเข้ามาจากด้านหลัง พร้อมกับตวัดดาบ\n\n– เคร้ง ตัดสายโซ่ถักจนขาดสะบั้น\n\nผู้ที่คิดค้นยุทธวิธีนี้ขึ้นมาเป็นคนแรกคือร้อยโทอีวาน เปโตรวิช ในเวลานั้นเขามียศเป็นร้อยเอก\n\nชื่อของวิชานี้คือ ‘ผ่าเกราะคนแคระ’\n\n“นี่มัน…!!”\n\n– เคร้ง เคร้ง!\n\nในที่สุด เกราะไหล่ของเจ้าหมอนั่นก็หลุดกระเด็นออกมา เมื่อใบดาบสะท้อนเด้งกลับจากแรงปะทะ เขาก็ปล่อยมือจากด้ามดาบอย่างเป็นธรรมชาติ แล้วเอื้อมมือไปคว้ากริชที่เอว\n\nชักกริชสั้นออกจากซองข้างสะโพก ใช้เวลาเพียงชั่วลมหายใจเดียวก่อนที่จะปักมันลงไปบนหัวไหล่ที่เปิดเปลือยของอีกฝ่าย\n\n– ฉึก!\n\n“อ๊ากกกกกก!!”\n\nอาการบาดเจ็บบริเวณหัวไหล่ถือเป็นบาดแผลฉกรรจ์สำหรับนักรบ ไม่ต่างอะไรกับการสูญเสียแขนไปข้างหนึ่ง การเคลื่อนไหวของคนแคระที่กวัดแกว่งขวานสองมือช้าลงอย่างเห็นได้ชัด\n\nทว่าศัตรูมีเพียงสองตนเท่านั้น ในที่สุด นักรบคนแคระที่พุ่งเข้ามาประชิดก็เหวี่ยงอาวุธของมันเข้าใส่\n\n“หยุดนะ!!”\n\n– หวืด!\n\nหลบหลีกอาวุธนั้นได้อีกครั้ง เขายกปืนพกในมือซ้ายขึ้น นัดนี้ถูกเล็งอย่างประณีตแม่นยำ ภายใต้การควบคุมลมหายใจอย่างสมบูรณ์แบบ\n\n– ปัง!\n\n“อ๊ากกกกก!!”\n\nกริชที่ปักคาอยู่บนหัวไหล่ถูกยิงอัดเข้าที่ด้ามจับอย่างแม่นยำ กริชกระเด็นหลุดหายเข้าไปในความมืดของทางเดิน คนแคระที่หัวไหล่ถูกกระชากฉีกขาดอย่างรุนแรงกรีดร้องลั่นแล้วทรุดตัวลงนั่งด้วยความเจ็บปวดทรมาน\n\nบัดนี้ เขาหมุนตัวเพื่อปรับตำแหน่งใหม่ เก็บปืนพกลงแล้วชักกริชสั้นอีกเล่มออกจากซองข้างสะโพกอีกครั้ง\n\n– ชิ้ง\n\nดาบยาวที่ถูกโยนขึ้นไปกลางอากาศก่อนหน้านี้ บัดนี้เริ่มร่วงหล่นลงมาแล้ว อีวานคว้าจับด้ามดาบกลางอากาศได้อย่างแม่นยำ ก่อนจะตวัดฟาดฟันออกไปอีกครั้ง\n\n– เคร้ง!\n\nเขาใช้วิชา ‘ผ่าเกราะ’ เข้าใส่คนแคระอีกตนที่เพิ่งเข้ามาถึงอีกครั้ง ในชั่วพริบตาที่ควบคุมทั้งลมหายใจและกาลเวลา\n\nสอดปลายดาบเข้าไปอย่างรวดเร็วแล้วบิดข้อมือ ลอกชั้นเกราะออกทีละชิ้น\n\nด้วยความประณีตแม่นยำราวกับศัลยแพทย์ผู้ชำนาญการกำลังผ่าตัด ไม่ผิดเพี้ยน ทีละจุด ทีละส่วน\n\nท่ามกลางความมืดมิดอันลึกล้ำที่ไม่อาจมองเห็นสิ่งใด เผชิญหน้ากับคนแคระสองตนท่ามกลางสายตาที่มืดสนิท บังคับมือทั้งสองข้างเคลื่อนไหวไปพร้อมกัน\n\nชำแหละแยกชิ้นส่วนเกราะของพวกมัน ปักกริชลงบนเนื้อหนังที่เปิดเปลือย โยนดาบขึ้นกลางอากาศ ลั่นไกปืนพก และคว้าดาบที่ร่วงหล่นลงมาฟาดฟันต่ออีกครา\n\n***\n\n“นี่มันอะไรกัน…?” (ออสการ์)\n\nออสการ์เบิกตากว้าง พลางกลืนเสียงครางลงคอไป\n\nเมื่อไม่กี่อึดใจก่อน เขาเพิ่งจะสาบานว่าจะต่อสู้สุดชีวิตเพื่อรักษาเกียรติยศแห่งนามอัศวิน\n\nแต่บัดนี้ เบื้องหน้าของเขากลับมียักษ์ใหญ่กำลังเข่นฆ่าศัตรูนิรนามอยู่ฝ่ายเดียว\n\n“เสียงมันแทบจะซ้อนทับกันเลย…” (ออสการ์)\n\nนี่มันเหนือสามัญสำนึกไปแล้ว เสียงตวัดดาบแทบจะซ้อนทับเป็นเสียงเดียวกัน พูดอีกอย่างก็คือ ช่องว่างระหว่างการฟาดฟันแต่ละครั้งนั้นถี่ยิบอย่างถึงที่สุด\n\nการเคลื่อนไหวระดับนั้นเป็นไปได้ยังไงกัน? ออสการ์แค่นหัวเราะอย่างไม่อยากจะเชื่อสายตา\n\nหากผู้โจมตีเป็นคนแบบหมอนั่น คงไม่มีทางหนีรอดไปได้แน่\n\nการต่อสู้จบลงในชั่วพริบตา ร่างลึกลับที่พุ่งทะยานออกไปในวินาทีที่ได้ยินเสียงปืนนัดแรก เดินย้อนกลับมาพร้อมกลิ่นคาวเลือดคละคลุ้งก่อนจะสิ้นสุดช่วงเวลาเพียงสองลมหายใจเสียด้วยซ้ำ\n\n“บังเอิญว่าคุณมองเห็นอะไรบ้างหรือเปล่าครับ?” (ออสการ์)\n\nมนุษย์ไม่มีความสามารถในการมองเห็นในความมืด เผ่าพันธุ์ที่มีความสามารถเช่นนั้นมีจำกัดอยู่แค่คนแคระหรือไม่ก็อาจจะเป็นพวกปีศาจ ดังนั้น คำถามนี้จึงแฝงนัยถามด้วยว่าอีกฝ่ายใช่มนุษย์หรือไม่\n\n“ไม่จำเป็นต้องมองเห็น ก็สู้ได้” (อีวาน)\n\n“อา…” (ออสการ์)\n\n“ขานายบาดเจ็บเหรอ?” (อีวาน)\n\n“ครับ น่าอายจริงๆ ที่มันหักตอนโดนเศษซากดินถล่มทับน่ะครับ” (ออสการ์)\n\n“มีลูกแก้วอยู่กับตัวใช่ไหม?” (อีวาน)\n\n“ครับ” (ออสการ์)\n\n“งั้นก็นั่งรออยู่ที่นี่เงียบๆ ห้ามส่งเสียง” (อีวาน)\n\nชายคนนั้นหันหลังแล้วเดินจากไป ออสการ์รีบเงยหน้าขึ้น\n\n“เดี๋ยวก่อนครับ! อย่างน้อยผมขอทราบชื่อของท่านได้ไหมครับ?” (ออสการ์)\n\n“อีวาน เปโตรวิช” (อีวาน)\n\n“ท่านจะไปไหนเหรอครับ? ถ้าผมพอจะช่วยอะไรได้ ผมยินดีช่วยครับ!” (ออสการ์)\n\n“นักศึกษาก็ควรจะตั้งใจเรียนหนังสือไปสิ” (อีวาน)\n\nเสียงหัวเราะของชายคนนั้นดังก้องกังวานในความมืด\n\nขณะที่กำลังเดินจากไป เสียงฝีเท้าของเขาก็เดินย้อนกลับมา ก่อนจะวางมือลงบนศีรษะของออสการ์\n\n“ฉันไม่เคยชอบขี้หน้าพ่อของนายหรอกนะ แต่ดูเหมือนหมอนั่นจะสอนลูกชายได้ดีทีเดียว ออสการ์ บุตรแห่งจิลแบร์ การกระทำของนายยอดเยี่ยมมาก” (อีวาน)\n\n“ท่านรู้จักพ่อของผมด้วยเหรอครับ?”\n\n“ถ้าไอ้หมอนั่นยังไม่ลืมฉันไปเสียก่อน พวกเราก็ถือว่าเป็นเพื่อนกันนั่นแหละ”\n\nชายคนนั้นหันหลังเดินจากไปอีกครั้ง คราวนี้เขาเดินจากไปอย่างเงียบเชียบโดยไม่หันกลับมามอง\n\nมุ่งหน้าไปยังที่ใดสักแห่งพ้นปลายอุโมงค์ อย่างมั่นคง ทีละก้าว ทีละก้าว เสียงฝีเท้าอันเป็นจังหวะสม่ำเสมอค่อยๆ จางหายไปในความมืด\n\n***\n\nอิซาเบลล์นั่งนิ่งเงียบอยู่ในความมืดมิด\n\nโชคดีที่เธอร่วงลงมาโดยไม่ได้รับบาดเจ็บสาหัส แต่เธอก็ไม่ได้โง่เขลาถึงขั้นจะเดินสุ่มสี่สุ่มห้าไปในสถานที่ที่มองไม่เห็นอะไรเลย\n\n“การสอบคงจะถูกยกเลิกใช่ไหมนะ? ฉันคงไม่สอบตกไปทั้งแบบนี้หรอกนะ?”\n\nนั่นคือเรื่องเดียวที่เธอกังวล ดูเหมือนเวลาจะผ่านไปสี่ชั่วโมงแล้วกระมัง ทว่าไม่อาจกะเกณฑ์ได้เลยว่าเวลาล่วงเลยไปนานเท่าไรกันแน่\n\nตึก ตึก\n\nอิซาเบลล์เงยหน้าขึ้นขวับ เธอได้ยินเสียงฝีเท้า\n\nในที่สุดทีมกู้ภัยก็มาถึงแล้วงั้นเหรอ? อิซาเบลล์ผุดลุกขึ้นยืนทันทีแล้วตะโกนออกไป พลางคาดหวังคำตอบรับ\n\n“ทางนี้ค่ะ! มีคนอยู่ตรงนี้!” (อิซาเบลล์)\n\n“ชื่ออะไร?”\n\n“อิซาเบลล์ค่ะ! ไม่สิ ตอนนี้เรื่องนั้นยังไม่สำคัญ รีบมาช่วยฉันทีเถอะค่ะ!”\n\n“เจอตัวแล้ว! ควบคุมตัวเป้าหมาย! เรียกหัวหน้ามา!”\n\n“เอ๊ะ?”\n\nเป้าหมาย? หัวหน้า?\n\nศีรษะของอิซาเบลล์หมุนคว้างไปชั่วขณะ ทั้งมึนงงกับพื้นดินที่จู่ๆ ก็พังทลาย ดินที่ถล่มทะลักลงมา และถ้ำที่มองไม่เห็นสิ่งใดเลย\n\nและในที่แห่งนั้น มีคำว่า ‘เป้าหมาย’ กับ ‘หัวหน้า’ หรือว่า…?\n\n“เอาจริงดิ! น่าหงุดหงิดชะมัดเลย!”\n\nอีกแล้ว! เกิดเหตุก่อการร้ายในป่าแห่งนี้อีกแล้ว แถมคราวนี้ยังเป็นการก่อการร้ายที่พุ่งเป้ามาที่เธออีกด้วย\n\nมีคนต้องตกเป็นเหยื่อของการก่อการร้ายครั้งนี้ไปมากเท่าไรกันแล้ว? มีคนต้องเสียสละไปอีกกี่คนท่ามกลางเรื่องทั้งหมดนี้?\n\nอิซาเบลล์ขบเขี้ยวเคี้ยวฟันด้วยความคับแค้นใจ\n\nดูจากวิธีที่พวกมันบอกว่าควบคุมตัวเป้าหมายได้แล้ว และพิจารณาว่าพวกมันเพิ่งมาปรากฏตัวหลังจากที่เธอตกลงมาในกับดัก นี่ไม่ใช่เหตุการณ์ที่มีผู้เกี่ยวข้องเพียงหนึ่งหรือสองคนอย่างแน่นอน\n\nไม่นานนัก เสียงฝีเท้าหนักๆ ก็ดังก้องสะท้อนไปทั่วทั้งถ้ำ\n\nตึก ตึก ตึก\n\nคนกลุ่มหนึ่งกำลังก้าวเดินเข้ามาหาเธอ อย่างเงียบเชียบ ปราศจากเสียงรบกวนใดๆ แม้แต่น้อย\n\nทหารที่ผ่านการฝึกฝนมาอย่างดี แถมพวกมันยังมี ‘สายตาในความมืด’ หรือเวทมนตร์ที่คล้ายคลึงกัน ซึ่งเป็นสิ่งจำเป็นอย่างยิ่งในการเคลื่อนพลเป็นกลุ่มในถ้ำอันมืดมิดแห่งนี้\n\nอิซาเบลล์ยกดาบขึ้นตั้งตรง ดวงตาของเธอลุกโชนไปด้วยเพลิงโทสะ\n\nจะต้องไม่มีใครต้องมาเสียสละแทนคนอื่นอีกแล้ว การต้องใช้ชีวิตอยู่กับความรู้สึกผิดต่อผู้ที่เสียสละไปมันน่าเบื่อหน่ายเต็มทน\n\nฉะนั้น เพื่อปลดปล่อยความโกรธเกรี้ยวอันไร้ขอบเขตนี้ เธอจึงสูดลมหายใจเข้าลึก\n\n“ฉันคืออิซาเบลล์ บุตรีแห่งแม็กซิมิเลียนและมารี อัศวินแห่งทิลีส จงบอกนามของพวกแกมา!”\n\n“สำแดงจิตวิญญาณได้น่าประทับใจดีนี่”\n\nเสียงทุ้มลึกดังแว่วมาจากระยะไกล\n\n“กองร้อยที่ 5 กองพันที่ 3 ภายใต้สังกัดหน่วยรบ ‘นักถักทอใย’ ข้าคือร้อยโทอาวุโสอัสเตอร์ก หากเทียบตามยศของพวกเจ้า ข้าก็คงราวๆ ผู้บัญชาการกองพันหนึ่งพันนายกระมัง”\n\nเมื่อได้ยินดังนั้น อิซาเบลล์ก็นึกถึงอิคารัส ผู้บัญชาการกองร้อย การต่อสู้กับเขาในวันนั้นแทบจะเป็นเรื่องความเป็นความตาย หากยศของคนตรงหน้าเทียบเท่ากับผู้บัญชาการกองพันตามตรรกะของขุมกำลังแล้วละก็…\n\n‘หมอนี่แข็งแกร่งกว่าไอ้หมอนั่นตอนนั้นอีก’\n\nอิซาเบลล์เม้มริมฝีปากแน่น แม้ว่าการเป็นผู้บัญชาการกองพันหนึ่งพันนายอาจไม่ได้หมายความว่าเขาจะแข็งแกร่งกว่าผู้บัญชาการกองร้อยหนึ่งร้อยนายถึงสิบเท่าตรงๆ ก็ตาม แต่ความต่างชั้นของพละกำลังนั้นชัดเจน\n\nและมันไม่ได้มาเพียงลำพัง กลุ่มกำลังพลหลายระลอกกำลังเคลื่อนเข้ามาพร้อมกับมัน\n\nยิ่งไปกว่านั้น ทัศนวิสัยยังถูกจำกัดอย่างถึงที่สุด ไม่ใช่แค่จำกัด แต่ถึงขั้นมองไม่เห็นอะไรเลยแม้แต่นิดเดียว\n\n‘ฉันจะต้องมาตายแบบนี้จริงๆ เหรอ…?’\n\nไม่หวาดกลัว นับตั้งแต่วินาทีที่เธอจับดาบ ความตายก็คือสิ่งที่เธอเตรียมใจไว้เสมอมา\n\nเธอนึกถึงบิดาของตนเอง แม็กซิมิเลียนคงไม่มีวันแสดงความหวาดกลัวออกมาแม้จะต้องตกอยู่ในสถานการณ์เช่นนี้\n\nดังนั้น อย่างน้อยที่สุดต่อหน้าพวกปีศาจ เธอก็ไม่ควรแสดงความกลัวต่อความตายออกมาให้เห็น\n\nเธอคืออัศวินแห่งทิลีส และคือบุตรสาวของวีรชน ท่ามกลางสิทธิพิเศษมากมายที่เธอเคยได้รับมาตลอดชีวิต เธอไม่มีสิทธิ์ที่จะรู้สึกหวาดกลัว\n\nมีเพียงหน้าที่ หน้าที่ที่จะต้องยืนหยัดอย่างไม่ย่อท้อแม้ต่อหน้าความตาย\n\n“เข้ามาสิ ฉัน อิซาเบลล์แห่งทิลีส จะขอยืนหยัดสู้จนตัวตายในวันนี้แหละ!”\n\n“สหาย เป้าหมายที่พวกเรากำลังรับมืออยู่อายุกี่ปีแล้ว?”\n\n“ครับ หัวหน้า! เจ้าตัวเล็กนี่อายุครบยี่สิบปีในปีนี้ครับ!”\n\n“ปรับเปลี่ยนแผน ลงมือสังหารให้เด็ดขาด ห้ามจับเป็นตัวประกันโดยเด็ดขาด”\n\nปีศาจตนใดก็ตามที่มีระดับใกล้เคียงผู้บัญชาการกองพันย่อมต้องจดจำปาร์ตี้ผู้กล้าได้ขึ้นใจ ต่อให้ไม่เคยเผชิญหน้ากันโดยตรง ผู้กล้าก็เป็นดั่งมโนทัศน์ที่เป็นตัวแทนของ ‘ความตาย’ สำหรับเหล่าปีศาจ\n\nพบเจอเมื่อไรเป็นต้องตาย เข้าใกล้เมื่อไรเป็นต้องตาย ทันทีที่ข่าวลือแพร่สะพัดออกไป หากไม่รีบหนีเอาชีวิตรอด ก็มีแต่ความตายเท่านั้นที่รออยู่\n\nมันคือภัยพิบัติทางธรรมชาติอย่างแท้จริง ซ้ำยังจัดอยู่ในหมวดหมู่ของภัยพิบัติที่ไม่อาจคาดการณ์ได้ เส้นทางการเคลื่อนทัพของปาร์ตี้ผู้กล้าเป็นความลับสุดยอดของสหราชอาณาจักร ดังนั้นปาร์ตี้ผู้กล้าจึงมักเป็นฝ่าย ‘ซุ่มโจมตี’ ดินแดนศัตรูอยู่เสมอ\n\nไม่ว่าจะส่งหน่วยสะกดรอยตามออกไปมากเท่าไร ก็ไม่เคยมีใครได้กลับคืนมา พวกเขาปกปิดตำแหน่งของตนเองได้อย่างมิดชิดสมบูรณ์แบบ\n\nปาร์ตี้ผู้กล้าผู้ปกครองเหล่าปีศาจด้วยความหวาดกลัว ในที่สุดก็ลอบสังหารจอมมารลงได้ และสงครามก็ปิดฉากลง น่าเสียดายสำหรับพวกปีศาจ ที่พวกมันไม่มีโอกาสได้ก้าวข้าม ‘แผลใจจากผู้กล้า’ นั้นเลย\n\nนางต้องถูกฆ่า\n\nจำเป็นต้องแจ้งให้สหายในมาตุภูมิได้รับรู้ ว่าแม้แต่ ‘สัญลักษณ์แห่งความหวาดกลัว’ ก็ไม่อาจหนีพ้นความตายไปได้…\n\n“เอาเลย ลองเข้ามาฆ่าฉันดูสิ อัศวินแห่งทิลีสไม่มีวันถอยหนีเด็ดขาด”\n\nอิซาเบลล์อยากจะวิ่งหนี อยากจะลังเล เธอก็เป็นเพียงเด็กสาวที่เพิ่งพ้นวัยยี่สิบมาหมาดๆ เท่านั้น\n\nแต่เธอทำแบบนั้นไม่ได้\n\nเมื่อนึกถึงผู้คนมากมายที่ต้องสังเวยชีวิตในเหตุก่อการร้ายบนรถไฟวันนั้น และแรงจูงใจของคนที่ต้องมาติดร่างแหในเหตุก่อการร้ายครั้งนี้\n\nเธอไม่มีสิทธิ์ที่จะมาสิ้นหวังต่อหน้าความตายที่กำลังคืบคลานเข้ามา\n\n‘น่าเสียดายนิดหน่อยแฮะ’\n\nความรู้สึกเสียดายที่ยังไม่ได้ไปออกเดตกับคุณลุงคนนั้นยังคงหลงเหลืออยู่จริงๆ พอมาลองคิดดูตอนนี้แล้ว ความรู้สึกที่เธอมีให้ยามนึกถึงตาแก่คนนั้นมันย่อมเป็นอะไรที่มากยิ่งกว่าแค่ความปรารถนาดีอย่างแน่นอน\n\nเพราะงั้น มันน่าเสียดายจัง อย่างน้อยน่าจะได้แสดงความรู้สึกออกไปมากกว่านี้สักหน่อย\n\n– จึ๊ก จึ๊ก จึ๊ก\n\n“…?”\n\nเสียงกระทบกันเป็นจังหวะดังก้องสะท้อนมาจากส่วนลึกของถ้ำ\n\nจึ๊ก จึ๊ก เสียงสั้นๆ ของการเดาะลิ้นกระทบกับฟันหน้า\n\nเสียงอะไรกัน? อัสเตอร์กหรี่ตาลง ครุ่นคิดท่ามกลางความตึงเครียดและความเงียบงันก่อนการปะทะ เสียงนั้นช่างฟังดูคุ้นหูอย่างประหลาด\n\n‘เสียงเดาะลิ้นเป็นจังหวะ…? มนุษย์ การหาตำแหน่งด้วยเสียงสะท้อน!’\n\nขณะที่ความทรงจำผุดพรายขึ้นมา ข้อสันนิษฐานหลายประการก็ตามติดกันมาเป็นพรวน\n\n‘มีมนุษย์เพียงกลุ่มเดียวเท่านั้นที่เชี่ยวชาญพอจะใช้การระบุตำแหน่งด้วยเสียงสะท้อนในการต่อสู้ได้’\n\n‘กลุ่มคนเหล่านั้นถูกบ่มเพาะขึ้นอย่างลับๆ ในสมัยราชวงศ์คราซิลอฟ’\n\n‘และที่นี่ก็คือคราซิลอฟ…’\n\nอัสเตอร์กตกตะลึงจนต้องยกอาวุธขึ้นตั้งท่าอย่างเฉียบพลัน\n\nหากปาร์ตี้ผู้กล้าคือตัวตนที่เป็นสัญลักษณ์แห่งความกลัวตาย\n\n‘คนกลุ่มนั้น’ ก็คือตัวตนที่เป็นสัญลักษณ์แห่ง ‘ความสยองขวัญยามราตรี’ ที่ทำให้แม้แต่พวกปีศาจที่มีสายตามองเห็นในความมืดยังต้องหวาดผวากับความมืดมิด เหล่านักฆ่าที่เอนริเก้ทุ่มเทฝึกฝนมาอย่างสุดกำลัง\n\nคำถามประเภท ‘เมื่อไร’ ‘ที่ไหน’ และ ‘อย่างไร’ ล้วนไร้ความหมายสำหรับคนพวกนั้น\n\nตามความหมายตรงตัวเลยก็คือ ไม่ว่า ‘เวลาใด’ ‘สถานที่ใด’ และ ‘ด้วยวิธีการใด’ พวกมันก็สามารถบรรลุเป้าหมายและอันตรธานหายไปราวกับเงาแห่งรัตติกาล\n\n“หน่วยเก็บกวาด!! ไอ้พวกตัวกาลกิณียังหลงเหลืออยู่อีกงั้นเรอะ?! สหายทั้งหลาย ยกอาวุธขึ้น! เตรียมพร้อมรับมือ!”\n\n– จึ๊ก จึ๊ก จึ๊ก…\n\nเสียงกระทบเป็นจังหวะดังก้องสะท้อนไปทั่วถ้ำ ก่อนจะหยุดลงกะทันหัน\n\nความเงียบงันอันหนักอึ้งโรยตัวลงปกคลุม พวกคนแคระที่เมื่อครู่ทำท่าจะดาหน้าเข้าใส่ได้ทุกเมื่อ บัดนี้ต่างพากันตั้งแนวป้องกันในตำแหน่งของตนเอง ย่อตัวลงปักหลักอย่างมั่นคง\n\nอิซาเบลล์กลืนน้ำลายอึกใหญ่ พลางกวาดสายตามองสำรวจรอบข้าง แม้จะมองไม่เห็นสิ่งใดเลย แต่เธอก็สัมผัสได้ถึงความผิดปกติในท่าทีของพวกศัตรู\n\n‘หน่วยเก็บกวาด…? มันคืออะไรกันนะ…?’\n\nนั่นคือชื่อที่เธอไม่เคยได้ยินมาก่อนเลยในชีวิต ทว่าดูเหมือนมันจะโด่งดังมากในหมู่พวกปีศาจ ท่าทีอันสุขุมเยือกเย็นที่พวกมันเพิ่งแสดงออกมาราวกับกำลังเดินเล่นชมเมืองอยู่เมื่อครู่นี้ พลันแข็งค้างเป็นน้ำแข็งในชั่วพริบตา\n\nและในตอนนั้นเอง\n\n– แกร๊ง\n\nพร้อมกับเสียงเสียดสีอันหนักแน่นของโลหะ\n\n– ปัง!\n\nแสงสว่างก็บังเกิดขึ้น"
    },

      "title": "บทที่ 44",
      "content": "เผ่าคนแคระมีสายตาที่มองเห็นในความมืด เนื่องจากเดิมทีพวกมันอาศัยอยู่ใต้ดิน จึงไม่ใช่เรื่องแปลกประหลาดแต่อย่างใด\n\nแม้จะไม่ได้หมายความว่าพวกมันสามารถมองทะลุความมืดได้แจ่มชัดราวกับกลางวันแสกๆ แต่พวกมันก็สามารถรับรู้รูปทรงของวัตถุในที่มืดได้อย่างค่อนข้างชัดเจน\n\nฉะนั้น อัสเตอร์กจึงสามารถมองเห็นชายที่กำลังก้าวเดินเข้ามาได้\n\n‘คนแคระร่างยักษ์งั้นเหรอ?’\n\nอัสเตอร์กถึงกับสับสนงุนงง!\n\n***\n\n“อิซาเบลล์”\n\n“อ๊ะ คุณลุง?!! มาอยู่ที่นี่ได้ยังไงคะ…?!”\n\n“บาดเจ็บตรงไหนไหม?”\n\nอีวานเดินตรงไปหาอิซาเบลล์แล้วมายืนอยู่ข้างๆ เธอ เขาส่งเสียง ‘อืม’ ในลำคอสั้นๆ พลางวางมือลงบนไหล่ของอิซาเบลล์\n\n“ไม่ค่ะ! ค่ะ หนูไม่เป็นไร!”\n\n“ดีแล้ว อยู่เฉยๆ ตรงนี้แหละ”\n\nหน้าที่อารักขาเป็นส่วนหนึ่งของการฝึกฝนระดับหัวกะทิ ทว่าการรับประกันความปลอดภัยอย่างสมบูรณ์แบบในความมืดมิดเป็นเรื่องท้าทาย อีวานผู้ยึดหลักประสิทธิภาพจึงไม่เสียเวลาคิดคำนึงว่าคำพูดของตนจะฟังดูเป็นเช่นไร\n\n‘เคยเห็นฉากแบบนี้มาก่อน… เหมือนในนิยายรักโรแมนติกเลย!’ ดวงตาของอิซาเบลล์กลอกกลิ้งไปมา\n\nความตึงเครียดคลายลงจนเธอถอนหายใจออกมา ขาทั้งสองข้างสั่นระริก ความหวาดหวั่นจากการได้เผชิญหน้ากับบุรุษผู้หนึ่งอย่างไม่คาดฝันในสถานการณ์ความเป็นความตายไม่อาจมองข้ามได้ ยิ่งไปกว่านั้น คำพูดที่ว่า ‘อยู่เฉยๆ ตรงนี้แหละ’ ยังฟังดูราวกับอัศวินในนิทานที่ขอให้รอจนกว่าเขาจะปราบมังกรบรรพกาลลงได้เสียอย่างนั้น\n\n‘นี่มันคำสารภาพรักชัดๆ ฮื่อ เขินจัง… เอาเถอะ ช่วยไม่ได้นี่นา ถ้าตอบตกลงทันทีเลยคงดูง่ายไปหน่อย งั้นเอาเป็นว่า… ฉันจะลองชวนเขาดูว่าสุดสัปดาห์นี้ว่างไหม เพื่อเป็นการตอบแทนแล้วกัน’\n\n***\n\nปืนพกในมือซ้าย ดาบยาวในมือขวา กริชห้าเล่มที่เอว และขวานที่สะพายพาดอยู่บนแผ่นหลัง\n\nอีวานตรวจนับคลังแสงของตนเองอย่างรวดเร็วแล้วก้าวเดินไปข้างหน้าอย่างช้าๆ\n\nอีวานสูดลมหายใจเข้าอย่างแผ่วเบา\n\nมีสัญญาณบางอย่างที่เป็นสากลในสิ่งมีชีวิตทุกชนิด นั่นคือกลไกของฮอร์โมน\n\nการเสริมพลังร่างกายด้วยเวทมนตร์ การปรับปรุงระบบสารสื่อประสาทให้มีประสิทธิภาพสูงสุด นำมาซึ่งผลกระทบต่อเนื่องหลายประการ หนึ่งในนั้นคือการขยายขีดความสามารถของอวัยวะรับสัมผัสแต่ละส่วน\n\nยกตัวอย่างเช่น ประสาทรับกลิ่น มันสามารถตรวจจับได้แม้กระทั่งกลิ่นอายที่เบาบางที่สุดในอากาศ\n\nดังนั้น การตรวจจับกลิ่นระเหยที่เกิดจากเหงื่อที่กำลังระเหยจึงเป็นสิ่งที่ทำได้จริง ในขอบเขตของเหล่ายอดมนุษย์ นี่คือตัวชี้วัดที่มีความสำคัญอย่างยิ่งยวด\n\nเพราะคุณสามารถอ่านอารมณ์ความรู้สึกของอีกฝ่ายได้\n\nแม้ในสังคมยุคก่อนสมัยใหม่อันล้าหลังแห่งนี้ที่ยังไม่มีคำว่า ‘ฮอร์โมน’ บัญญัติไว้ ทว่าโครงสร้างร่างกายมนุษย์ก็ยังคงดำเนินไปตามกฎเกณฑ์เดียวกัน กลิ่นกายจึงแปรเปลี่ยนไปอย่างละเอียดอ่อนตามอารมณ์ความรู้สึก สิ่งนี้กลายเป็นตัวบ่งชี้ทางกายภาพของอารมณ์ต่างๆ อย่างเช่น ‘การเอาตัวรอด’ ‘ความหวาดกลัว’ และ ‘ความรักใคร่’\n\nเมื่อสิ่งมีชีวิตรู้สึกหวาดกลัว คอร์ติซอลจะถูกหลั่งออกมา กลิ่นอายอันเป็นเอกลักษณ์นี้กำลังค่อยๆ แผ่ซ่านอบอวลไปในหมู่พวกคนแคระ\n\n“กลัวอยู่หรือไง?” (อีวาน)\n\n“เหลวไหล!” (อัสเตอร์ก)\n\nอัสเตอร์กตะคอกสวนกลับมาเพียงลำพัง เนื่องจากสงครามในท้ายที่สุดก็คือการต่อสู้ทางจิตวิทยา การรบย่อมไม่อาจดำเนินต่อไปได้หากฝ่ายใดฝ่ายหนึ่งขวัญกำลังใจตกต่ำ ด้วยสัญชาตญาณ เขาจึงจัดประเภทการต่อสู้กับอีวานครั้งนี้ให้เป็น ‘สงคราม’ จงใจเมินเฉยต่อความจริงตรงหน้าแล้วยกอาวุธขึ้น\n\n“หน่วยเก็บกวาด ไอ้พวกสารเลว… ข้าจะฆ่าพวกแกเพื่อเซ่นไหว้ดวงวิญญาณของสหายที่ล่วงหน้าไปก่อน!” (อัสเตอร์ก)\n\n“ก็นะ พวกแกทุกคนพูดแบบนั้นกันหมดนั่นแหละ” (อีวาน)\n\nต้องใช้เวลาอยู่ครู่หนึ่งกว่าอัสเตอร์กจะตระหนักถึงความหมาย\n\nพวกแกทุกคนพูดแบบนั้นกันหมด?\n\nจู่ๆ ความหนาวเย็นยะเยือกก็แล่นพล่านไปตามแนวกระดูกสันหลังของมัน ตอนนี้มันกำลังพูดอยู่กับใครกันแน่?\n\nนั่นคือคำสารภาพที่เอ่ยออกมาอย่างเรียบเฉยราวกับเรื่องธรรมดาสามัญ ว่าอีวานเคยได้ยินถ้อยคำเช่นนี้มานับครั้งไม่ถ้วน และเขาก็สังหารพวกมันทั้งหมดลงไปแล้ว\n\nอัสเตอร์กเงื้อขวานขึ้นด้วยแววตาอันเด็ดเดี่ยว สอดประสานไปกับการเคลื่อนไหวของมัน ทหารทุกนายในขบวนทัพที่จัดเตรียมไว้ต่างก็พากันยกอาวุธขึ้นพร้อมเพรียงกัน\n\n– แกร๊ง แกร๊ง\n\nเสียงเสียดสีอันหนักอึ้งของโลหะดังก้องสะท้อนไปทั่วโถงทางเดิน\n\nอา ชวนให้คิดถึงวันเก่าๆ จังแฮะ\n\nความทรงจำจากสมรภูมิในอดีตที่เขาเคยเผชิญหน้ากับทหารองครักษ์คนแคระบนทางเดินแคบๆ ผุดขึ้นมา\n\nมันเกิดขึ้นในช่วงสงครามเหมืองแร่\n\nอีวานครุ่นคิดขณะกุมด้ามดาบไว้แน่น พื้นที่ปิดอันคับแคบที่มีทัศนวิสัยจำกัด คนแคระยืนเรียงรายอัดแน่นเต็มทั้งทางเดิน ทหารองครักษ์ที่น่าเกรงขามซึ่งไม่อาจเจาะทะลุได้ด้วยขวานหรือกระสุนปืน\n\nในตอนนั้น เขายังไม่ได้อยู่ตัวคนเดียว ข้างกายของเขายังมีสหายคนอื่นๆ ที่คอยหนุนหลังให้เสมอ\n\nบัดนี้ พวกเขาจากไปหมดแล้ว ท่ามกลางความรู้สึกสูญเสียอันลึกล้ำ อีวานกระชับดาบในมือแน่น\n\nทว่า เจ้าพวกนี้ไม่ได้มีแสนยานุภาพเทียบเท่าในวันวานอีกต่อไป อย่างมากที่สุดก็มีอยู่ราวๆ สามสิบคน ต่อให้ประเมินแบบเผื่อเหลือเผื่อขาด ก็ไม่เกินห้าสิบคน เป็นเพียงหน่วยทหารราบขนาดเล็กเท่านั้น\n\nและตัวเขาเองก็ไม่ใช่ร้อยโทอีวาน เปโตรวิช คนเดิมในวันนั้นอีกแล้ว\n\nสิบปีผ่านพ้นไปนับตั้งแต่สงครามเหมืองแร่\n\nอีวานได้สั่งสมประสบการณ์ตลอดระยะเวลาสิบปีเอาไว้เต็มเปี่ยม\n\n***\n\n– ปัง—!!\n\nเปิดฉากด้วยเสียงปืน เป้าหมายคือการช่วงชิงทัศนวิสัยไปพร้อมๆ กับการข่มขวัญคุกคาม\n\nท่ามกลางห้วงเวลาอันเชื่องช้าที่มิติราวกับถูกแบ่งซอยออกเป็นชิ้นส่วน อีวานพุ่งทะยานออกไป\n\nทหารองครักษ์คนแคระที่ยืนตั้งรับนิ่งอยู่กับที่ไม่ต่างอะไรกับเต่า แข็งแกร่ง ดื้อรั้น และเชื่องช้า ฉะนั้น ลำดับชั้นของยุทธวิธีจึงต้องวางเดิมพันไว้ที่ความเร็ว\n\n“มันมาแล้ว!!”\n\nเสียงร้องอย่างตื่นตระหนกดังก้องไปตามทางเดิน มันคือสถานการณ์ที่แสนคุ้นเคย\n\nตามปกติแล้วพวกคนแคระมักสังกัดหน่วยแทรกซึมแนวหลังในกองทัพปีศาจ และปฏิบัติการลักษณะนั้นก็คือสภาพแวดล้อมที่เหมาะสมที่สุดสำหรับหน่วยเก็บกวาด\n\nดังนั้น ในช่วงเวลาสงคราม หน่วยเก็บกวาดจึงได้รับการยอมรับว่าเป็นหน่วยรบที่สังหารคนแคระต่อคนได้มากที่สุดเสมอมา\n\n– เคร้ง!\n\nการทักทายต้อนรับเริ่มต้นด้วยคมดาบ การเหวี่ยงฟันลงล่างเป็นเพียงท่าหลอก ก่อนที่คนแคระแถวหน้าสุดจะทันได้ตอบสนอง คมดาบอันแผ่วเบาก็ตวัดเฉือนเข้าที่หัวไหล่ของมันเสียแล้ว\n\nอาวุธของอีกฝ่ายพุ่งสวนออกมาทันที อีวานหมุนตัวหลบการแทงทะลวงนั้นได้อย่างเฉียดฉิว\n\nเขาหลับตาลง นับวินาทีในใจ อีวานกำลังนับจำนวนก้าวของตนเองอย่างแม่นยำ\n\nหนึ่งก้าวเท่ากับ 86 เซนติเมตร อิซาเบลล์อยู่ด้านหลังห่างออกไปห้าก้าว\n\nต้องเดินเจ็ดก้าวกว่าจะถึงตัวหัวหน้าหน่วยองครักษ์ ความกว้างของขบวนทัพอยู่ที่สิบสองก้าว\n\nขอบเขตระยะที่เขาสามารถปฏิบัติการได้คือสิบเจ็ดก้าว\n\n– เคร้ง!!\n\nในชั่วพริบตา เขาพุ่งตัวมุดเข้าไป หลบหลีกอาวุธทหารราบนานาชนิดที่ประเคนเข้าใส่\n\n– เคร้ง แครก! เสียงแทงดาบสอดเข้าไปใต้ข้อศอกของคู่ต่อสู้แถวหน้าสุดดังขึ้น\n\n– แกร๊ง แกร๊ง เสียงชุดเกราะหนักของศัตรูที่ขยับเคลื่อนไหวดังประสานกัน\n\nภายใต้เปลือกตาที่ปิดสนิท รูปร่างอันบิดเบี้ยวของพวกที่เขาสังหารไประหว่างแสงระเบิดเมื่อครู่ฉายซ้ำขึ้นมาใหม่\n\nวิเคราะห์เสียงรอบข้างแต่ละเสียง เขาปรับเปลี่ยนตำแหน่งและท่วงท่าของเหล่าทหารองครักษ์ในหัวแบบเรียลไทม์\n\n“ไอ้สัตว์ประหลาด!!”\n\nขณะที่เขาปัดป้องศัตรูตนหนึ่งและฟันแขนของอีกตนจนขาดสะบั้น เสียงตะโกนนั้นก็ดังขึ้น\n\nสัตว์ประหลาดงั้นเหรอ น่าขำชะมัด อีวานรู้จักความหมายที่แท้จริงของคำว่า ‘สัตว์ประหลาด’ ในการต่อสู้เป็นอย่างดี\n\n– ฉัวะ!\n\nเมินเฉยต่อเสียงกรีดร้องอันน่าสยดสยองของศัตรูที่ถูกตัดแขนจนไร้อาวุธ เขาหมุนตัวเบี่ยงออกด้านข้างไปสองก้าว\n\nปักกริชลงไปใต้ลำคอของศัตรูที่เพิ่งจะเงื้อแขนเตรียมจามขวาน แล้วก้าวขยับไปทางขวาอีกครึ่งก้าว\n\n– แครก!\n\nศัตรูตนถัดไปกำลังเหวี่ยงค้อนสงคราม อีวานย่อตัวต่ำลงและเบี่ยงหลบการฟาดอันหนักหน่วง ก่อนจะแทงดาบสวนเข้าไป\n\n– แกร๊บ ดาบที่คมแหว่งจนใกล้จะพังเต็มทีหักสะบั้นลง\n\nเป็นเรื่องที่คาดการณ์ไว้อยู่แล้ว ตั้งแต่วินาทีแรกที่ปะทะกัน เขาก็สัมผัสได้ถึงความสึกหรอของใบดาบผ่านความรู้สึกที่ปลายนิ้วมือ\n\nฉะนั้น เขาจึงไม่ตื่นตระหนก อีวานคุ้นเคยกับความทนทานระดับนี้ดี\n\n“อาวุธมันหักแล้ว!!”\n\nเปล่าเลย เขาปล่อยมือจากมันเองต่างหาก\n\nอีวานก้มศีรษะลงแล้วขยับตัวออกด้านข้างไปสองก้าว ตรงใต้ฝ่าเท้าของเขามีขวานเล่มหนึ่งตกลงมาอยู่พอดิบพอดี มันคืออาวุธที่เจ้าคนที่โดนตัดแขนทำหลุดมือไปเมื่อครู่นี้\n\nเขาคว้ามันขึ้นมา หลบหลีกการโจมตีระลอกถัดไป แล้วชูมือซ้ายขึ้น\n\nเล็ง ปรับจังหวะลมหายใจ และลั่นไก\n\n– ปังงง—!!\n\n“อ๊ากกกก!!”\n\nดาบที่หักเล่มนั้นปักคาอยู่ระหว่างฟัน—หรือพูดให้ชัดก็คือตรงช่องว่างของชุดเกราะหมอนั่น กระสุนพุ่งเจาะเข้าจุดนั้นอย่างแม่นยำ ราวกับตอกตะปู หน้าอกของเจ้าคนแคระตนนั้นระเบิดทะลุ\n\nอีวานโยนปืนพกขึ้นไปกลางอากาศแล้ววิ่งทะยานไปข้างหน้า ใช้มือซ้ายคว้าจับค้อนสงครามที่ศัตรูทำหล่นไว้ พร้อมกับบิดหมุนลำตัว\n\nมือหนึ่งชูขึ้นด้านบน อีกมือหนึ่งวาดออกด้านข้าง\n\nแล้วฟาดสับลงมาเป็นแนวไขว้อย่างหมดจด\n\n– โครมมม!!\n\nขณะที่ขวานที่คว้ามาได้ปักจมลงไปบนหมวกเหล็กของศัตรู ค้อนสงครามก็เหวี่ยงเข้าใส่โดยไม่ลังเล บดขยี้ศีรษะของมันจนแหลกเหลว\n\nทันทีที่ร่างของมันสิ้นแรงและบิดงอ อีวานก็เขวี้ยงค้อนทิ้งไปแล้วรับปืนพกที่ร่วงหล่นลงมาจากกลางอากาศ\n\nโดยไม่จำเป็นต้องเล็ง หันปากกระบอกปืนตรงไปยังผู้บัญชาการที่ยืนอยู่ข้างหน้าห่างออกไปห้าก้าว\n\nลั่นไก\n\n– ปังงง—!!\n\nคราวนี้ เขาเปิดเปลือกตาขึ้น สถานการณ์ทั้งหมดชัดเจนขึ้นในพริบตาเดียว เมื่อเปลวไฟจากปากกระบอกปืนจางหายไป เขาก็หลับตาลงอีกครั้งแล้ววาดภาพขบวนทัพของเหล่าทหารองครักษ์ที่แปรเปลี่ยนไปในหัว\n\nเสียงอึกทึกในสมรภูมิ กลิ่นอายของเหล่าองครักษ์ ตำแหน่งของศัตรูที่ประทับตรึงอยู่ใต้จอประสาทตา สัมผัสของสายลมที่พัดผ่านแก้ม\n\nสมรภูมิระหว่างเหล่ายอดมนุษย์ ช่วงเวลาระหว่างลมหายใจ\n\nอา คิดถึงจังเลยแฮะ\n\nอีวานย้ำเตือนกับตนเองแล้วพุ่งทะยานไปข้างหน้า\n\nเพราะร่างกายมนุษย์นั้นแสนเปราะบาง ต่อให้เป็นแค่กริชเล่มเล็กๆ ก็สามารถพรากเรี่ยวแรงและชีวิตของใครคนหนึ่งไปได้\n\nการต่อสู้ระยะประชิดคือทางแพร่งระหว่างความเป็นและความตายเสมอ ที่ซึ่งผู้คนต้องเอาชีวิตเข้าแลก\n\nท่ามกลางสถานการณ์ที่เสียเปรียบอย่างเห็นได้ชัด ท่ามกลางวงล้อมของทัพศัตรู\n\nเขาหลงลืมความรู้สึกนี้ไปแล้ว ความรู้สึกยามพุ่งทะยานเข้าสู่ใจกลางหัวใจของข้าศึก ตลอดสี่ปีหลังสมรภูมิครั้งสุดท้าย ไม่เคยมีสถานการณ์ใดที่คู่ควรแก่การเรียกว่าการต่อสู้เลยสักครั้ง\n\nฉะนั้น ในสมรภูมิอันแสนคุ้นเคยแห่งนี้ อีวานจึงกำลังสัมผัสได้ถึงความรู้สึกโหยหาอดีตอย่างประหลาด\n\nด้วยความที่เป็นคนมองโลกตามความเป็นจริงอย่างยิ่ง เขาจึงมองว่าตัวเองเป็นคนที่มีข้อบกพร่อง\n\nความรู้สึกเช่นนี้ยิ่งเด่นชัดขึ้นในชีวิตประจำวัน ท่ามกลางผู้คนที่หัวเราะและพูดคุยกันอย่างสบายอารมณ์ เขากลับรู้สึกถึงความแปลกแยกโดดเดี่ยว\n\nดังนั้น ณ ที่แห่งนี้ ในห้วงเวลาแห่งความเป็นและความตาย เขาจึงสามารถเป็นใครสักคนที่จำเป็นขึ้นมาได้\n\nเขายังคงใช้ชีวิตอยู่ในสงคราม ทั้งที่เกลียดชังสมรภูมิ ทั้งที่ใช้ชีวิตอันแสนธรรมดา และทั้งที่โหยหาบ้านเกิดเมืองนอน\n\nขณะสัมผัสได้ถึงกลิ่นอายของเหล่าสหายที่แสนคิดถึง อีวานก็นับจำนวนก้าวของตนเอง\n\nบัดนี้ เหลืออีกเพียงก้าวเดียว\n\nณ จุดนั้น เบื้องหน้าออกไป 86 เซนติเมตร คือ ‘ศีรษะ’ ของเจ้าพวกนั้น\n\n***\n\nคนเราควรจะรู้สึกเช่นไรกันแน่ เมื่อได้เห็นเจ้าอสูรกินคนที่กำลังยิ้มจางๆ ขณะ ‘สังหารหมู่’ เหล่าสหายร่วมรบ?\n\nในทุกลมหายใจ สหายก็ล้มตายลงไปทีละคน\n\nต้านไว้ ฆ่ามัน อย่า! หยุดนะ! แขนข้า! อั่ก!\n\nท่ามกลางความโกลาหลนั้น เสียงกรีดร้องไม่อาจดังพ้นไปได้เกินหนึ่งพยางค์ บนสมรภูมิที่มีเพียงเสียงครวญครางเฮือกสุดท้ายก้องสะท้อน\n\nเจ้าอสูรสังหารแห่งหน่วยเก็บกวาดยังคงเดินหน้า ‘ทำงาน’ ต่อไปอย่างเงียบเชียบ โดยไม่เอื้อนเอ่ยถ้อยคำใดแม้แต่คำเดียว\n\nเกราะที่แตกกระจุยปลิวว่อนเหนือศีรษะ แขนขาที่ขาดกระเด็นและหยาดโลหิตสาดกระเซ็นไปทั่วอากาศ\n\nมันคือพายุ คือรูปแบบของภัยพิบัติที่ปัจเจกบุคคลไม่อาจต้านทานได้\n\nกวาดล้างอย่างแท้จริง ถืออาวุธ พุ่งทะยานเข้าใส่\n\nจนกระทั่งในที่สุด แม้ในยามที่มันพุ่งประชิดเข้ามาตรงหน้าในชั่วพริบตา\n\nลมหายใจของชายคนนั้นยังคงสม่ำเสมอไม่เปลี่ยนแปลง ไม่ต่างอะไรกับตอนเริ่มต้นเลยแม้แต่น้อย\n\n“ข้าคือ… ข้าคือร้อยโทอาวุโสอัสเตอร์ก ผู้บังคับกองพันที่ 3 ภายใต้กองพลน้อยมังกรที่ 5 หน่วยทหารช่าง ‘นักถักทอใย’ นามของเจ้าคืออะไร?”\n\n“อีวาน เปโตรวิช”\n\n“ฮะ…”\n\nอัสเตอร์กพยักหน้า\n\nมันเคยได้ยินข่าวลือว่าอีวานตายไปแล้ว\n\nที่แท้ก็เป็นเช่นนี้นี่เอง เขายังมีชีวิตอยู่ หากเหตุผลที่เขาสามารถแทรกซึมเข้ามาในป่าแห่งนี้ได้ในจังหวะเวลาที่แม่นยำที่สุดคือเรื่องนั้น ก็พอจะเข้าใจได้แล้ว\n\n“หนวดเครานั่น แกคิดจะเลียนแบบพวกข้ารึไง?”\n\n“…?”\n\nสีหน้าของอีวานบิดเบี้ยวลงเป็นครั้งแรก\n\nต่อให้อีวานจะเป็นคนยึดถือหลักปฏิบัติจริงจังมากเพียงใด แต่เขาก็ไม่เคยมองข้ามการดูหมิ่นองค์สุริยราชาไปได้\n\nแทนคำตอบ เขาเหวี่ยงขวานที่ทหารนิรนามผู้หนึ่งถืออยู่ออกไป\n\n***\n\n“ตอนนี้เดินไหวแล้วล่ะ” (อีวาน)\n\n“ขาหนูมันอ่อนแรงไปหมดแล้วค่ะ” (อิซาเบลล์)\n\nอิซาเบลล์หัวเราะเบาๆ เมื่อได้ยินเสียงฝีเท้าของอีวานที่เดินเข้ามาใกล้\n\nมันคือการต่อสู้ที่สัมผัสได้ชัดเจนแม้จะได้ยินเพียงแค่เสียง ต่อให้ยืนนิ่งอยู่ด้านหลัง เธอก็ยังรู้สึกได้ถึงไอร้อนแห่งสมรภูมิที่แผ่ซ่านมาถึงตัว\n\nตามตรงแล้ว มันน่าทึ่งจนแทบหยุดหายใจ\n\nเธอยื่นแขนทั้งสองข้างออกไปข้างหน้าแล้วเอ่ยขึ้น “อุ้มหนูหน่อยสิคะ”\n\nให้เขาอุ้มออกไปย่อมดีกว่ามานั่งรอให้ขาหายสั่นเองอยู่แล้ว\n\nเนื่องจากอีวานเป็นคนที่ยึดหลักประสิทธิภาพ เขาจึงอุ้มเธอขึ้นมาโดยไม่พูดพร่ำทำเพลง\n\nไม่นานนัก มืออันอบอุ่นทั้งสองข้างก็โอบคล้องรอบลำคอของเขาเอาไว้\n\n“บาดเจ็บตรงไหนไหม?”\n\n“ไม่ค่ะ”\n\n“เหนื่อยหน่อยนะคะ”\n\n“อืม”\n\n“วันนี้คงจะหนักเกินไปหน่อย แต่พรุ่งนี้เย็นหนูขอเลี้ยงข้าวตอบแทนคุณลุงได้ไหมคะ?”\n\nเวลานี้อีวานเป็นสายลับนอกเครื่องแบบสังกัดกองบัญชาการข่าวกรอง\n\nด้วยความที่เป็นคนเถรตรง เขาย่อมไม่เบียดบังเงินทองของบุคคลที่อยู่ภายใต้การอารักขาเด็ดขาด\n\n“ไม่”\n\n“อึก”"
    },
