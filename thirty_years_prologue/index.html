      "title": "บทที่ 46",
      "content": "ดังที่ได้กล่าวไปก่อนหน้านี้ สหราชอาณาจักรกำลังเร่งพัฒนาหน่วยงานข่าวกรองของตนเองอย่างขยันขันแข็ง\n\nในบรรดาสิบสองชาติภายในสหราชอาณาจักร มีสี่ชาติที่มีอิทธิพลโดดเด่นเป็นพิเศษ ได้แก่ โดรอัน คาลีออน ทิลเลส และคราซิลอฟ ชาติเหล่านี้แสดงให้เห็นถึงความเชี่ยวชาญเฉพาะทางในระดับที่สูงกว่าชาติอื่นๆ\n\nยกตัวอย่างเช่น องค์กรข่าวกรองของโดรอัน ประกอบด้วยเหล่าผู้ศรัทธาในธาตุปฐมภูมิทั้งสี่\n\nถือครองคำตอบอันหลั่งไหลไม่ขาดสายประดุจสายน้ำ\n\nเปลวเพลิงอันน่าหลงใหลที่เมื่อจุดติดขึ้นมา จะทำให้คายความจริงออกมาจนหมดเปลือก\n\nสายลมลึกลับที่เมื่อแขวนขึ้นบนเสา จะช่วยเปิดเผยเรื่องราวในอดีต\n\nผืนดินอันเงียบงันที่เมื่อฝังกลบลงไป จะช่วยปกปิดความจริงทั้งปวง\n\nการรวบรวมความรักที่มีต่อธาตุของตนเช่นนี้ถือเป็นการเสร็จสิ้นองค์กรข่าวกรองฉบับโดรอัน ทว่าในความเป็นจริง มันก็หมายถึงแค่การจับตัวคนมาแล้วนำไปถวายสังเวยเท่านั้นเอง\n\nในทางกลับกัน เหล่าเอลฟ์ในกองทัพคาลีออนกลับนิยมวิธีการอันประณีตลึกซึ้ง ในฐานะผู้นำด้านเวทมนตร์จิตใจ ข่าวกรองของพวกเขาจึงละเมียดละไมและเป็นมิตร โดยเชี่ยวชาญการล้วงข้อมูลอย่างแนบเนียนผ่านการผูกสัมพันธ์ การบิดเบือนความทรงจำ และการใช้เวทมนตร์ทางจิตอย่างคล่องแคล่ว\n\nส่วนทิลเลส อาณาจักรแห่งอัศวิน หากสงสัยเรื่องใดก็จะเอ่ยปากถามออกไปตรงๆ เว้นเสียแต่ว่าหากอีกฝ่ายไม่ยอมตอบ ก็จะถือว่าเป็นการดูหมิ่นเกียรติและเปิดฉากท้าดวลเสียตรงนั้น\n\nในทางตรงกันข้าม หน่วยเก็บกวาดซึ่งครั้งหนึ่งเคยเป็นส่วนหนึ่งของระบบดังกล่าว รวมถึงองค์กรรุ่นก่อนอย่าง ‘เหล่าบุตรแห่งเอนริเก้’ และกองบัญชาการต่อต้านข่าวกรองแห่งคราซิลอฟในยุคต่อมา กลับนิยมปฏิบัติการจารกรรมสมัยใหม่อย่างน่าทึ่ง อาทิ การเฝ้าสังเกตการณ์ การรวบรวมหลักฐาน ข่าวกรองทางสัญญาณ การเสาะหาข้อมูลทางเทคโนโลยี การลาดตระเวนภูมิประเทศ และการวางเครือข่ายสายลับภาคพื้นดิน\n\nกล่าวโดยสรุป พวกเขาดำเนินกิจกรรมจารกรรมตามแบบแผนดั้งเดิมที่มหาอำนาจชาติอื่นมองว่า “ล้าสมัย” นั่นเอง\n\n– วันนี้ มื้อกลางวันกินแซนด์วิชอกไก่ราดซอสมัสตาร์ด กังวลเรื่องความไม่สมดุลทางโภชนาการ ขาดผักยกเว้นมะเขือเทศ แนะนำให้ปรับมากินอาหารที่เน้นผักเป็นหลักให้มากขึ้น\n\nอีวาน ผู้รับผิดชอบด้านความปลอดภัยและสุขภาพของบรรดาสมาชิกปาร์ตี้ผู้กล้า ละสายตาจากกล้องส่องทางไกลชั่วครู่ เพื่อจดบันทึกข้อมูลสำคัญลงในสมุดพกของตน\n\n**ตอนที่ 46: สตอล์กเกอร์ ปะทะ สตอล์กเกอร์**\n\nสถานการณ์ที่ไม่เคยเกิดขึ้นมาก่อนอย่างการที่นักศึกษาชั้นปีที่หนึ่งของคณะอัศวินทั้งหมดต้องนอนซมอยู่บนเตียงโรงพยาบาล ได้นำมาซึ่งผลลัพธ์อันเกินคาด\n\n“เรื่องแบบนี้มันเป็นไปไม่ได้!!”\n\nช่วงเวลาสอบถูกเลื่อนออกไปอีกหนึ่งสัปดาห์\n\nหากมีผู้เข้าสอบขาดสอบเพียงไม่กี่คน พวกเขาก็คงต้องสอบตกหรือไม่ก็ต้องมาสอบซ่อมในภายหลัง\n\nทว่า เมื่อนักศึกษาระดับปริญญาตรีเกือบทั้งหมดกลายเป็นผู้ป่วยบาดเจ็บสาหัส ทางมหาวิทยาลัยจึงประกาศเลื่อนการสอบออกไปหนึ่งสัปดาห์\n\nสำหรับการสอบภาคปฏิบัตินั้นไม่ใช่ปัญหา แต่สำหรับการสอบข้อเขียน มันกลับกลายเป็นคนละเรื่องกันเลยทีเดียว นักศึกษาสายพลศึกษาที่เพิ่งเคยสัมผัสประสบการณ์การอ่านหนังสือเตรียมสอบเป็นครั้งแรก ต่างพากันระบายความอัดอั้นตันใจออกมา\n\nเป้าหมายหลักของการระบายอารมณ์ส่วนใหญ่คือคณะเทววิทยา คณะเวทมนตร์ คณะวิจิตรศิลป์ และคณะดุริยางคศิลป์…\n\nโดยเฉพาะอย่างยิ่งเหล่านักศึกษาดุริยางคศิลป์\n\n“ทำไมพวกนายถึงได้โชคดีขนาดนี้วะ!!”\n“พวกเราก็อยู่สำนักวิชาศิลปะเดียวกันไม่ใช่เรอะ!! ทำไมมีแค่พวกแกที่ยิ้มระรื่นกันอยู่ได้!!”\n“ไม่อยากจะเชื่อเลย! นี่มันเรื่องบ้าอะไรกัน! ทำไมอัศวินถึงต้องมานั่งอ่านหนังสือสอบข้อเขียนด้วยวะ?”\nอนึ่ง นักศึกษาสาขาดุริยางคศิลป์เองก็ต้องสอบข้อเขียนเช่นกัน ทั้งประวัติศาสตร์ดนตรี การวิเคราะห์รูปแบบดนตรี วิชาประสานทำนองสอดประสาน และวิชาทฤษฎีการประสานเสียง เผลอๆ จะมีรายวิชาที่เน้นการสอบข้อเขียนมากกว่าสาขาวิชาอัศวินเสียด้วยซ้ำ\n\nแน่นอนว่าข้อเท็จจริงเหล่านั้นหาได้สลักสำคัญในสายตาของพวกคณะดาบและโล่ไม่\n\nไอ้พวกเด็กดนตรีพวกนั้น\n\nในขณะที่ผู้คนผู้ขยันขันแข็งต้องอาบเหงื่อต่างน้ำเพื่อหาเลี้ยงชีพไปวันๆ ไอ้พวกนี้กลับเอาแต่นั่งอยู่บนพื้นตลาด ร้องรำทำเพลงแล้วก็ได้เงินไปฟรีๆ! (การเปิดหมวกเล่นดนตรีเป็นงานที่หนักหนาสาหัสมากนะ)\n\n“เฮ้อ เหม็นกลิ่นเหงื่อชะมัด เวลาจะเข้าร้านอาหารของคุณลุง หัดไปอาบน้ำเสียก่อนสิยะ หมายถึงเอาน้ำราดตัว ฟอกสบู่ให้เกิดฟองเยอะๆ ถูทำความสะอาดให้ทั่วทุกซอกทุกมุม แล้วค่อยล้างออกด้วยน้ำสะอาดอีกรอบน่ะ”\n“ยัยพวกบ้าเอ๊ย…!!”\nในช่วงเวลานี้ ภาพเหตุการณ์ทำนองเดียวกันสามารถพบเห็นได้ทั่วไปทั่วทั้งบริเวณมหาวิทยาลัย\n\nเหล่านักศึกษาคณะอัศวินผู้เดือดดาล กับสายตาเย้ยหยันของเหล่านักศึกษาคณะดุริยางคศิลป์\n\nไม่รู้ว่าใครกันแน่ที่เป็นคนต้นคิดจับเอาคณะอัศวินกับคณะดุริยางคศิลป์มามัดรวมไว้ในวิทยาลัยศิลปะเดียวกัน แต่เบื้องหลังความคิดนั้นจะต้องมีคำสาปแฝงอยู่เป็นแน่\n\nเอซิดิสกำลังขับขานบทเพลงอันแสนเศร้าท่ามกลางยุคสมัยอันโกลาหลเช่นนี้เอง\n\n***\n\n“คนต่อไปใครดี?”\n“ยัยบ้า… ยัยปีศาจบ้าเอ๊ย…!”\n\nโรงยิมกลางแจ้งของวิทยาลัยศิลปะ\n\nเอซิดิสจ้องมองไวโอลินที่บิดเบี้ยวซึ่งเธอถือกลับหัวอยู่ในมือด้วยสายตาน่าขนลุก\n\nด้านหลังของเธอคือเพื่อนนักศึกษาร่วมคณะ\n\nตรงหน้าเธอคือเหล่านักศึกษาคณะอัศวินในสภาพสะบักสะบอมยับเยิน\n\nแทบเท้าของเธอ มีศพที่หัวระเบิดกระจุยอยู่ห้าร่าง (เปล่าหรอก ไม่ใช่เรื่องจริงเสียหน่อย)\n\nทั้งหมดนี้ล้วนเป็นผลลัพธ์จากการที่นักศึกษาดุริยางคศิลป์ผู้แข็งแกร่งที่สุดลุกขึ้นมายืนหยัดเพื่อความยุติธรรม\n\nพี่วีโอรุ่นที่หนึ่งสละชีพเพื่อปกป้องเพื่อนของเธอไปแล้ว\n\nพี่วีโอรุ่นที่สองก็ถูกพรากไปอย่างสูญเปล่า\n\nและบัดนี้ ณ ที่แห่งนี้ พี่วีโอรุ่นที่สามกำลังต่อสู้เพื่อปกป้องเกียรติยศของเธออยู่\n\nดังที่เคยตระหนักได้ในคราวหนึ่ง เครื่องดนตรีคือชีวิตจิตใจของนักดนตรี\n\nด้วยปณิธานอันแน่วแน่ในหัวใจ เอซิดิสกำลังสั่งสอนพวกที่บังอาจย่างกรายเข้ามาในประตูหลักของคณะดุริยางคศิลป์โดยไม่เข้าใจความหมายของดนตรี\n\n“นักศึกษาปีหนึ่งคณะอัศวินโดนปีหนึ่งคณะดุริยางคศิลป์สอยร่วงไปแล้วตั้งห้าคนแน่ะ!”\n\n“ฮ่าๆๆๆ!”\n\n“เห็นหรือยัง พวกคนเขลาเอ๋ย ‘ดนตรี’ ที่พัฒนาไปจนถึงขีดสุด ย่อมไม่อาจแยกออกจาก ‘พละกำลัง’ ได้หรอก”\n\n“ไสหัวกลับไปซะ แล้วไปบอกทุกคนด้วยว่า… จากนี้ไปคณะดุริยางคศิลป์จะเป็นผู้ ‘ปกครอง’ วิทยาลัยศิลปะทั้งหมดเอง….”\n\nเหล่ารุ่นพี่ไม่ได้เข้ามาร่วมวงในเรื่องเล่นสนุกของพวกเด็กปีหนึ่งด้วย\n\nรุ่นพี่คณะอัศวินพากันนั่งเคี้ยวป๊อปคอร์นพลางดูมหรสพรุ่นน้องปีหนึ่งโดนซ้อมอย่างเพลิดเพลิน ส่วนรุ่นพี่คณะดุริยางคศิลป์ก็ไม่คิดจะเสียเวลาไปท้าดวลกับเด็กปีหนึ่งคณะอัศวินตั้งแต่แรกอยู่แล้ว\n\nดังนั้น ‘การประลอง’ ที่ก่อตัวขึ้นเองตามธรรมชาตินี้ จึงค่อยๆ กลายเป็นเทศกาลงานรื่นเริงสำหรับนักศึกษาชั้นปีที่หนึ่งของวิทยาลัยศิลปะไปโดยปริยาย (หมายเหตุ: คณะอัศวินยังคงอยู่ในช่วงสอบ)\n\nพวกคนทรยศอย่างยูริ อิซาเบลล์ ออสการ์ และคนอื่นๆ ในกลุ่มหัวแถวของแต่ละคณะ กลับสร้างความประหลาดใจให้ทุกคนด้วยการขยันอ่านหนังสือเตรียมสอบโดยไม่แยแสเรื่องวุ่นวายนี้แม้แต่น้อย ดังนั้น จึงเหลือทางเลือกให้เหล่านักศึกษาอยู่เพียงทางเดียว\n\nปีศาจผู้ที่ไม่ต้องอ่านหนังสือเลยสักนิด แต่กลับทำให้คนทั้งคณะต้องสยบแทบเท้าด้วยคะแนนสอบภาคปฏิบัติเพียงครั้งเดียว…!\n\n“ไปสั่งสอนพวกมันให้รู้สำนึกกันเถอะครับลูกพี่!”\n\n“ใช่แล้วครับลูกพี่ ถ้าลูกพี่ลงมือเมื่อไหร่ พวกมันจบเห่กันหมดแน่!”\n\nนักศึกษาปีหนึ่งคนหนึ่งวิ่งแจ้นออกไปพลางตะโกนบทพูดแบบตัวร้ายเกรดสาม\n\nไม่นานนัก ชายวัยกลางคนในสภาพซอมซ่อก็ปรากฏตัวขึ้นจากที่ไหนสักแห่ง มอร์ด นักศึกษาปีหนึ่งที่แข็งแกร่งที่สุดแห่งคณะอัศวินมาถึงแล้ว\n\n“ไม่ล่ะ ข้าต้องเตรียมตัวสอบวิชาต่อไป…”\n“อย่ามาโกหกเลยครับลูกพี่!! แล้วไอ้การสอบกระจอกๆ นั่นมันสำคัญกว่าเกียรติยศของคณะที่ตอนนี้กำลังกลิ้งเกลือกอยู่บนพื้นงั้นเหรอครับ?”\n\nไอ้พวกงี่เง่าพวกนี้มันพล่ามอะไรกันอยู่?\n\nแน่ล่ะว่าพวกมันเป็นกลุ่มเดียวที่เดือดร้อนเรื่องการสอบ แล้วถ้าตอนนี้การสอบมันกลายเป็นเรื่องขี้ปะติ๋วไปแล้ว ก่อนหน้านี้พวกมันจะโวยวายกันขึ้นมาเพื่อจุดประสงค์อะไรกันเล่า?\n\nฮัสคาลผู้ชาญฉลาดแห่งโดรอันตระหนักได้ในทันที อ้อ ที่แท้พวกมันก็แค่อยากจะหนีการอ่านหนังสือสอบมาหาเรื่องสนุกทำกันเท่านั้นเอง\n\nเมื่อตั้งสติกลับมาได้และมองตรงไปข้างหน้า เขาก็เห็นเอซิดิสกำลังกำไวโอลินที่เสียหายไปบางส่วนเอาไว้แน่น\n\n“คราวนี้ใช้มาได้กี่เดือนแล้วล่ะ (ไวโอลินน่ะ) เอซี่?”\n\n“แค่เดือนเดียวค่ะ คุณลุง…”\n\n“ยอดเยี่ยม ถึงอย่างนั้นก็ผ่านมาเกินสามสัปดาห์แล้วนี่นะ”\n\nมอร์ดพยักหน้าอย่างพึงพอใจแล้วหันหลังเดินจากไป\n\n“ขอยอมแพ้ ข้าแพ้แล้ว อา คณะดุริยางคศิลป์แข็งแกร่งเกินไปจริงๆ ก็เธอเป็นลูกสาวของไอนาร์นี่นะ”\n\n“ไม่อยากจะเชื่อเลย… สายเลือดมันสำคัญกว่าตำแหน่งทางวิชาการอีกเหรอครับลูกพี่…? แล้วเกียรติยศของคณะอัศวินล่ะครับ!?”\n\n“อ้อ จะว่าไป เอซี่กับข้าไม่ได้เกี่ยวพันกันทางสายเลือดหรอกนะ มันเป็นความสัมพันธ์แบบรับอุปถัมภ์น่ะ”\n“โดรอัน… ข้าจะไม่มีวันลืมเรื่องนี้เลย…!!”\n“เลิกพูดจาไร้สาระแล้วไปอ่านหนังสือสอบกันได้แล้วพวกเจ้า”\n“นับตั้งแต่วันนี้เป็นต้นไป เจ้าไม่ใช่พี่น้องของข้าอีกต่อไปแล้ว!!”\nพร้อมกับภาพขุนนางหนุ่มจากทิลเลสที่วิ่งร้องไห้โฮมุ่งหน้าไปยังอาคารหลักของคณะระดับปริญญาตรี ความวุ่นวายประจำวันก็ปิดฉากลง\n\nอีวานสังเกตการณ์เหตุการณ์ทั้งหมดอย่างเงียบเชียบจากหลังต้นไม้ พลางใช้ปากกาแก้ไขบันทึกของตน\n\n– เอซิดิส เครื่องดนตรีประเภทเครื่องตีเหมาะกับเธอมากกว่าเครื่องสายนะ\n\n***\n\n“บ้าเอ๊ย นี่มันไม่ใช่เวลามามัวทำเรื่องแบบนี้นะ!”\n\nเอซิดิสโกรธจัดที่ตนเองมัวแต่หลงระเริงไปกับความวุ่นวายจนลืมเลือนสิ่งที่สมควรต้องทำไปเสียสนิท\n\nแน่นอนว่าหน้าที่ของเธอคือการเป็นนักศึกษา\n\nทว่า เอซิดิส ไอนาร์สดอตตีร์ นักศึกษาปีหนึ่งคณะดุริยางคศิลป์ กับเอซิดิสผู้เป็น ‘เพื่อนของอิซาเบลล์’ ควรจะต้องแยกออกจากกันโดยสิ้นเชิง\n\nเวลานี้ไม่ใช่วาระของนักศึกษาดนตรีธรรมดาๆ แต่ต้องการนักรบผู้สวมเกราะแห่งความยุติธรรมและความร่วมแรงร่วมใจต่างหาก\n\nบังเอิญเสียเหลือเกินที่พี่วีโอเพิ่งจะชโลมเลือดมาหมาดๆ\n\nเอซิดิสตั้งมั่นในปณิธานและก้าวเดินไปข้างหน้า เพื่อตามหาศัตรูเจ้าเล่ห์ที่ซ่อนตัวอยู่ ณ แห่งหนใดในรั้วมหาวิทยาลัยแห่งนี้\n\nเพื่อล่วงรู้เจตนาของศัตรู และเพื่อผดุงความยุติธรรม\n\nท่านพ่อของเธอจะต้องสนับสนุนพลังอันชอบธรรมของเธออย่างแน่นอน\n\n***\n\nขอย้ำอีกครั้งว่า อีวานเป็นบุคลากรที่มีรูปลักษณ์แสนธรรมดาและไร้พิษสงโดยสิ้นเชิง\n\nโดยพื้นฐานแล้ว เขาคือปรมาจารย์ด้านการอำพรางตัว การแทรกซึม และปฏิบัติการลับ หากเขาต้องการจะทำตัวให้ดูธรรมดา เขาก็สามารถกลมกลืนได้ยิ่งกว่าใครๆ\n\nทว่าเขาไม่จำเป็นต้องใช้ทักษะการแทรกซึมขั้นสูงถึงเพียงนั้นเลย เพราะโดยเนื้อแท้แล้ว เขามีรูปลักษณ์ที่จืดจางไร้จุดเด่น ชนิดที่ว่าต่อให้เดินสวนกันก็ลืมเลือนไปได้ง่ายๆ\n\n“อึ๋ย…!”\n\nนักศึกษาจากคณะเวทมนตร์คนหนึ่งวิ่งหนีเตลิดเปิดเปิงจนเกิดความโกลาหล\n\nในขณะที่อีวานกำลังห้อยตัวอยู่บนยอดไม้ ซ่อนกายอยู่หลังเงามืด นักศึกษาคนที่สังเกตเห็นเขานั้นสมควรได้รับคำชมเชยในเรื่องสายตาอันเฉียบคมเสียจริงๆ\n\nแน่นอนว่าอีวานจดจำประวัติของนักศึกษาทุกคนในมหาวิทยาลัยแห่งนี้ได้ขึ้นใจ เขาจึงจำเด็กหนุ่มที่เพิ่งวิ่งหนีไปได้ทันที ไอ้หนุ่มที่เคยแอบทิ้งก้นบุหรี่โดยไม่ได้รับอนุญาตจนโดนจับเข้า ‘คลินิกเลิกบุหรี่’ ไปนั่นเอง ช่างเป็นนักศึกษาที่หน้าบางเสียจริง\n\nพฤติกรรมตามแบบฉบับเด็กมหาวิทยาลัย อีวานพยักหน้าด้วยสีหน้าเรียบเฉยก่อนจะเบนสายตาออกไป\n\nเอลเฟียรา\n\nธิดาแห่งเบโอลกริน\n\nนักศึกษาปีหนึ่งอันดับหนึ่งของคณะเวทมนตร์ อัจฉริยะผู้ทำคะแนนสอบภาคปฏิบัติเข้าศึกษาต่อได้สูงที่สุดในประวัติศาสตร์ของคณะ\n\nเขามองดูเอลเฟียราที่กำลังหรี่ตาจ้องมองมา พลางถือสมุดบันทึกของตนไว้ในมือ\n\n– ยกเว้นผู้ติดตามไม่กี่คนแล้ว มนุษยสัมพันธ์ไม่ราบรื่นนัก นิสัยเหมือนพ่อ\n\nเขาบรรจงเขียนประวัติลงไปอย่างจริงใจ เต็มเปี่ยมไปด้วยความซื่อสัตย์สุจริตและปราศจากเจตนาร้ายใดๆ ทั้งสิ้น\n\n“อืม”\n\nอีวานสัมผัสได้ถึงสายตาของใครบางคนจึงหันศีรษะไปมอง\n\n***\n\n“…ไม่ได้มีแค่เบลล่าคนเดียวสินะ….”\n\nอิซาเบลล์ และบางทีอาจรวมถึงเอนริเก้ด้วย คงไม่ใช่ ‘เหยื่อ’ เพียงรายเดียวของชายคนนั้น เธอคิดเช่นนั้น\n\nความน่าสะพรึงกลัวของนักล่าที่คอยเฝ้ามองเหยื่อจากระยะไกล เพื่อเสาะหา ‘จุดอ่อน’ ถาโถมเข้ากดทับจิตใจของเธอ\n\nเจ้าของข่าวลือผู้ส่งนักศึกษาปีหนึ่งคณะอัศวินทั้งห้าสิบคนเข้าไปนอนในห้องไอซียูของคณะเทววิทยา นักสะสมก้นบุหรี่วิปลาส ฝันร้ายหลังต้นไม้ ยักษ์ใหญ่ไว้หนวดเครา…. บุรุษผู้มีรูปโฉมหล่อเหลา (ตามมุมมองของอิซาเบลล์)….\n\nในขณะที่เอซิดิสค่อยๆ เข้าใกล้ความจริงอันน่าสยดสยองมากขึ้นทุกทีที่รวบรวมข่าวลือเกี่ยวกับ ‘คนสวน’ เธอก็ลอบสังเกตอีวานจากในพุ่มไม้\n\nภาพของสิ่งมีชีวิตที่ห้อยตัวอยู่บนต้นไม้ กำลังจดบันทึกพลางจ้องมองใครบางคนจากคณะเวทมนตร์\n\n“สตอล์กเกอร์….”\n\nเธอได้กลายเป็นสตอล์กเกอร์ที่กำลังสะกดรอยตามสตอล์กเกอร์ประจำสถาบันเข้าเสียแล้ว\n\n***\n\n**หมายเหตุผู้เขียน:**\n\nหมายเหตุ: ผู้เขียนเป็นศิษย์เก่าของวิทยาลัยศิลปะ และในความเป็นจริง นักศึกษาดุริยางคศิลป์ก็มักจะสร้างเสียงดังรบกวนจากการซ้อมวงและซ้อมขับร้องในห้องชมรมจริงๆ นั่นแหละครับ"
    },

      "title": "บทที่ 47",
      "content": "อีวานไม่ได้ใส่ใจกับป้ายสัญญาณผ่านเข้า-ออกมากนัก เขารู้ดีว่าท่าทีเช่นนี้ต่างหากที่จะนำไปสู่ผลลัพธ์ที่ดียิ่งกว่า\n\nโดยเนื้อแท้แล้ว มหาวิทยาลัยเป็นพื้นที่เปิดโล่ง ตราบใดที่ไม่ได้บุกรุกเข้าไปในห้องเรียน ใครๆ ก็สามารถเดินเข้าออกได้โดยไม่มีข้อจำกัด\n\nยิ่งไปกว่านั้น เหล่านักศึกษาต่างก็เฉยเมยต่อผู้อื่น เช่นเดียวกับคนส่วนใหญ่ พวกเขาไม่เคยให้ความสนใจกับการเคลื่อนไหวของ ‘เจ้าหน้าที่’ หรอก\n\nสำหรับนักศึกษา เจ้าหน้าที่ก็เป็นเพียงตัวตนที่เลือนหายไปตรงขอบสายตาเท่านั้น\n\nดังนั้น อีวานจึงเข้าใจดีว่าการเดินทอดน่องอย่างเป็นธรรมชาติในชุดธรรมดา ช่วยเรื่องการรักษาความปลอดภัยได้ดีกว่าการพยายามหลบซ่อนตัวเสียอีก\n\nทว่า มันมีปัญหาอยู่อย่างหนึ่ง หากมีใครสักคนเริ่มหันมาให้ความสนใจเขาขึ้นมา กลยุทธ์การรักษาความปลอดภัยทั้งหมดที่เขาเพียรสร้างมาจนถึงบัดนี้ย่อมต้องพังทลายลง\n\nและในเวลานี้ ก็มีนักศึกษาคนหนึ่งกำลังจับจ้องทุกย่างก้าวของอีวานอย่างไม่วางตา\n\n“เขาทำอะไรอยู่น่ะ?”\nอีวานขมวดคิ้วให้กับสายตาอันดื้อด้านที่คอยจับจ้องตามติดตนไม่ลดละ\n\nทำไมยัยนั่นถึงทำตัวแบบนั้นกันนะ?\n\nเขาแกล้งทำทีเป็นก้มลงผูกเชือกรองเท้า ก่อนจะเบนสายตากลับไปมองด้านหลังอย่างแนบเนียน\n\nเอซิดิสกำลังจ้องเขม็งมาที่เขาด้วยดวงตาที่ลุกโชน\n\n“นั่นมัน… การพรางตัวเรอะ?”\nเธอถือกิ่งไม้ที่มีใบไม้ดกหนาไว้บังใบหน้า พลางย่องเดินไปตามแนวพุ่มไม้อย่างลับๆ ล่อๆ\n\nผู้คนจากโดรอันล้วนมีรูปร่างสูงใหญ่ ในกรณีของบุรุษย่อมกำยำล่ำสัน ส่วนในกรณีของสตรีก็ใหญ่โตในความหมายที่แตกต่างออกไปเล็กน้อย\n\nเอซิดิสผู้สืบสายเลือดอันเลิศล้ำที่สุดแห่งโดรอัน มีสัดส่วนร่างกายที่ใหญ่โตทรงพลังทำลายล้าง แม้จะมีรูปลักษณ์ภายนอกน่ารักน่าเอ็นดูราวกับสัตว์ตัวเล็กๆ ก็ตาม\n\nด้วยเหตุนี้ กิ่งไม้แค่นั้นจึงไร้ประโยชน์โดยสิ้นเชิงในการปกปิดส่วนสูงอันตระหง่านกับสิ่งอื่นที่ใหญ่โตยิ่งกว่านั้นเสียอีก\n\nอีวานมองดูเธอครู่หนึ่งราวกับรู้สึกเวทนา จากนั้นจึงหยิบสมุดบันทึกออกมา\n\n– เอซิดิส ต้องสงสัยว่าประพฤติมิชอบทางการศึกษา ความสามารถในการรับรู้บกพร่องอย่างร้ายแรง\n\nอีวานเป็นคนซื่อตรง เขาจึงไม่ลังเลเลยที่จะจดบันทึกความจริงลงไป เขาปิดสมุดบันทึกแล้วออกเดินต่อไป\n\nเขามุ่งหน้าไปยังคณะอัศวิน มนตราอันคุ้นเคยช่วยกระตุ้นประสาทสัมผัสของเขา\n\nกองบัญชาการต่อต้านข่าวกรองกำลังเรียกตัวเขาอยู่\n\n***\n\nเอซิดิสเคลื่อนไหวอย่างระมัดระวังท่ามกลางความตึงเครียดจนริมฝีปากแห้งผาก\n\nการพรางตัวของเธอช่างสมบูรณ์แบบ ไม่มีคุณลุงคนไหนเลยสักคนที่สังเกตเห็นเธอเวลาที่เธอย่องเดิน (เหล่าฮัสคาลมักจะใจอ่อนให้กับการเล่นซนของหลานสาวเสมอ)\n\nฉะนั้น ด้วยความมั่นใจเต็มเปี่ยม เธอจึงคอยแอบลอบมองอีวานอยู่ห่างๆ\n\nเขาเป็นคนประหลาดพิกล\n\nบางครั้ง เขาก็พลันหายวับไปจากสายตา ทำเอาคนที่เฝ้าดูอยู่ตกใจแทบแย่ ก่อนจะไปพบว่าเขาปีนขึ้นไปอยู่บนต้นไม้เพื่อกวาดสายตาสอดส่องไปรอบๆ\n\nตั้งแต่คณะเวทมนตร์ไปจนถึงคณะอัศวิน และที่น่าตกตะลึงยิ่งกว่านั้นคือกระทั่งคณะปรัชญา อีวานเคลื่อนไหวอยู่ตลอดเวลาเพื่อจับตาดูใครบางคน\n\nจู่ๆ เขาก็ขมวดคิ้ว วิ่งทะยานไปราวกับภูตผี หรือไม่ก็พุ่งตัวเข้าไปในพุ่มไม้ที่ควันบุหรี่ลอยกรุ่นขึ้นมา\n\nพอเดินเข้าไปในอาคารคณะ เขาก็ก้าวเดินฉับๆ ราวกับจะมุ่งหน้าไปที่ไหนสักแห่ง แต่แล้วก็หายตัวไปราวกับวิญญาณ!\n\n– “คนสวน?”\n\n– ไม่เคยเห็นทำสวนเลยสักครั้ง\n\n– ในมหาวิทยาลัยมีสถานที่ที่พอจะเรียกว่าสวนอยู่ด้วยเหรอ?\n\n– ไม่รู้สิ… หมอนั่นกำลังทำอะไรอยู่กันแน่? คอยสะกดรอยตามใครบางคนอยู่ตลอดเวลาเลย\n\n– ไม่รู้จักหยุดพัก ทำไมกัน? รับงานจากใครมางั้นเหรอ? หรือว่าเป็นงานอดิเรก?\n\nเธอขีดเขียนข้อความลงในสมุดบันทึกอย่างขะมักเขม้นท่ามกลางความสับสนงุนงง\n\nไอ้สตอล์กเกอร์ผู้ขยันขันแข็งคนนั้นตระเวนไปทั่วรั้วมหาวิทยาลัยอย่างไม่รู้จักเหน็ดเหนื่อย ไม่ยอมพักผ่อนหรือกินข้าว คอยเดินเตร็ดเตร่ไปตามระเบียงทางเดินอยู่ตลอดเวลา…!\n\nอะไรกันแน่ที่ทำให้ผู้ชายคนนั้นกลายเป็นแบบนี้ไปได้?\n\nมาถึงจุดนี้ ความอยากรู้อยากเห็นได้เอาชนะความหวาดกลัวไปเสียแล้ว เอซิดิสกำลังตามหาตัวอีวานพลางเคี้ยวแซนด์วิชในมือไปด้วย\n\nเขาหายลับไปจากสายตาอีกแล้ว ทั้งที่เมื่อครู่ดูเหมือนกำลังเดินมุ่งหน้าไปยังคณะอัศวินแท้ๆ แต่พอเลี้ยวหัวมุมไปเขาก็พลันอันตรธานหายไปราวกับกลุ่มควัน\n\n“อืม หายไปไหนของเขากันนะ?”\n\nเธอเช็ดซอสมัสตาร์ดที่เลอะริมฝีปากออก แล้วก้าวเดินฉับๆ ต่อไป\n\n***\n\n“ไม่รู้ทำไม เอซิดิสถึงพยายามสะกดรอยตามฉันอยู่ได้”\n\nแต่เรื่องนั้นมันเป็นไปไม่ได้หรอก ถึงจะน่ารำคาญอยู่บ้าง แต่ฉันก็ยังไม่ได้ทื่อลงถึงขนาดปล่อยให้มือใหม่หัดขับแบบนั้นจับได้ไล่ทันหรอกนะ\n\nอีวานเดินไปตามระเบียงทางเดินโดยมีเวทมนตร์ ‘รบกวนการรับรู้’ กางกั้นเอาไว้\n\n“ดมิทรี”\n\n“สบายดีไหมครับ รุ่นพี่?”\n\nไม่มีนักศึกษาคนใดเดินเพ่นพ่านอยู่บนระเบียงทางเดินของคณะเลยแม้แต่คนเดียว ทั้งหมดเป็นผลมาจากเวทมนตร์ ‘รบกวนการรับรู้’ ของกองบัญชาการต่อต้านข่าวกรอง\n\nกลางระเบียงทางเดิน ดมิทรีซึ่งถือซองเอกสารสีเหลืองอยู่ในมือ กำลังยืนทอดสายตามองออกไปนอกหน้าต่าง\n\n“รุ่นพี่ปรากฏตัวขึ้นทันทีหลังจากร่ายเวทเสร็จเลยนะครับ สมกับเป็นรุ่นพี่จริงๆ น่าทึ่งเสมอไม่เคยเปลี่ยนเลย”\n\n“ที่มหาวิทยาลัยมีเรื่องอะไรเกิดขึ้น ดมิทรี?”\n\n“เอ่อ มีเรื่องที่ต้องขอปรึกษาและเรื่องที่ต้องรายงานครับ ในสถานการณ์แบบนี้… อืม ครับ”\n\nดมิทรีหยิบแฟ้มเอกสารออกมาแล้วยื่นส่งให้\n\n“พวกเราจับตัวคนร้ายคดีขู่วางระเบิดวันปฐมนิเทศนักศึกษาใหม่ได้แล้วครับ”\n\n“ถ้าอย่างนั้นก็แค่จัดการปิดคดีไปเลยไม่ใช่เหรอ?”\n\n“มันมีปัญหาอยู่นิดหน่อยครับ”\n\nกองบัญชาการต่อต้านข่าวกรองคราซิลอฟนั้นเปี่ยมด้วยประสิทธิภาพ อันที่จริง ในบรรดาหน่วยงานบริหารทั้งหมดของคราซิลอฟ กองบัญชาการต่อต้านข่าวกรองคือหน่วยงานที่มีประสิทธิภาพสูงที่สุด\n\nโดยพื้นฐานแล้ว คราซิลอฟ… ไม่สิ ในสังคมยุคก่อนสมัยใหม่ที่แสนล้าหลังแห่งนี้ การทุจริตคอร์รัปชันแพร่ระบาดไปทั่วทุกหย่อมหญ้า ข้าราชการที่ไม่รับสินบนนั้นเป็นเรื่องที่เป็นไปไม่ได้พอๆ กับยูนิคอร์นหรือมังกร (ซึ่งเอาเข้าจริง พวกมันก็มีตัวตนอยู่จริงนั่นแหละ)\n\nกระนั้น แม้จะตกอยู่ในบริบทเช่นนั้น กองบัญชาการต่อต้านข่าวกรองกลับสะอาดสะอ้านอย่างน่าอัศจรรย์ ซึ่งเป็นเรื่องที่ช่วยไม่ได้เมื่อมีองค์หญิงเอลิซาเวตาเป็นผู้บัญชาการสูงสุด\n\nดังนั้น หากกองบัญชาการต่อต้านข่าวกรองแกะรอยตามตัวพวกผู้ก่อการร้ายได้แล้ว ก็นับว่าแปลกประหลาดยิ่งนักที่เรื่องนี้จะตกมาถึงมืออีวาน\n\nอีวานขมวดคิ้วพลางเปิดซองเอกสารออกดู\n\n“โดรอัน…?”\n\n“ครับ โดรอัน”\n\nโดรอัน ดินแดนแห่งนักรบ บ้านเกิดของไอนาร์\n\nโดรอัน ดินแดนที่เลื่องชื่อเรื่องเหล่านักรบ เป็นผู้บงการเหตุขู่วางระเบิดในคราซิลอฟงั้นหรือ?\n\nอีวานพลิกอ่านเอกสารอย่างครุ่นคิด\n\n“ตอนที่พวกเราตรวจสอบระเบิดเวทมนตร์ที่ใช้ในครั้งนั้น ชิ้นส่วนส่วนใหญ่ล้วนสืบย้อนกลับไปถึงโดรอันครับ”\n\n“โดรอันบงการเหตุก่อการร้ายด้วยระเบิดเวทมนตร์เนี่ยนะ? มันฟังดูสมเหตุสมผลตรงไหน?”\n\n“ตามหลักตรรกะแล้ว ย่อมเป็นไปไม่ได้แน่นอนครับ”\n\n“ก็ใช่น่ะสิ….”\n\nเหล่านักรบแห่งโดรอันขึ้นชื่อเรื่องการใช้ขวานสะบั้นกะโหลกศัตรูแทนที่จะมาใช้ระเบิด\n\nฉะนั้น หากคิดย้อนกลับ พวกเขาก็อาจจะเป็นฝ่ายที่ถูกสงสัยน้อยที่สุดเมื่อเกิดเหตุขู่วางระเบิดขึ้นมา\n\nทว่า ‘สามัญสำนึก’ ของกองบัญชาการต่อต้านข่าวกรอง ย่อมต้องตรงกันข้ามกับสามัญสำนึกของพลเรือนทั่วไป\n\nหากมีกลุ่มคนที่ไม่มีใครสงสัยเลย ในทางกลับกัน คนกลุ่มนั้นนั่นแหละที่ควรจะต้องตกเป็นผู้ต้องสงสัยมากที่สุด\n\n“ดังนั้น พวกเราจึงสืบสาวลึกลงไปอีก กรุณาอ่านตั้งแต่หน้า 11 เป็นต้นไปครับ”\n\n“…ดูเหมือนไอนาร์จะทำงานไม่เรียบร้อยเท่าไหร่นะ”\n\n“ครับ ไม่ค่อยสมกับเป็นกษัตริย์เท่าไหร่เลยใช่ไหมล่ะครับ? ที่ดันไปแสดงความปรานีต่อศัตรูแบบนั้น”\n\nจวบจนกระทั่งไอนาร์เดินทางกลับคืนสู่มาตุภูมิหลังการสิ้นชีพของจอมมาร โดรอันยังไม่เคยเป็นปึกแผ่นรวมเป็นหนึ่งเดียวมาก่อน\n\nยุคนั้นคือยุคสมัยแห่งความโกลาหลที่มีขุนศึกจำนวนมากซึ่งถูกเรียกว่า ‘ยาร์ล’ กระจัดกระจายอยู่ทั่วแผ่นดิน บัดนี้เมื่อภัยคุกคามจากจอมมารมลายหายไปแล้ว พวกมันจึงพากันอาละวาดคลุ้มคลั่งราวกับม้าพยศที่หลุดจากบังเหียน\n\nในกาลเช่นนั้น ไอนาร์ได้สถาปนาอาณาจักรขึ้นมาด้วยขวานคู่ในมือ นั่นคือเหตุผลที่เขาได้รับการขนานนามว่า ‘มหาราช’\n\nไอนาร์นำความสงบสุขกลับคืนสู่บ้านเกิดและหลอมรวมผู้คนให้เป็นหนึ่งเดียวในฐานะชนชาติเดียวกัน\n\nเรื่องราวมันเป็นที่รับรู้กันเช่นนั้น\n\n“หนึ่งในยาร์ลที่ยอมสวามิภักดิ์ต่อไอนาร์คือหนึ่งในตัวการเบื้องหลัง ข้อมูลนี้ส่งไปถึงหูไอนาร์แล้วหรือยัง?”\n\n“ท่านอัครมหาเสนาบดีกำลังพิจารณาเรื่องนี้อยู่ครับ หากไอนาร์ล่วงรู้เรื่องนี้เข้า…”\n\n“กลองศึกก็จะดังกึกก้องขึ้นสินะ”\n\n“ครับ และเมื่อพิจารณาจากสถานการณ์บริเวณแนวชายแดน พวกเราย่อมได้รับผลกระทบอย่างหลีกเลี่ยงไม่ได้ และอย่างที่รุ่นพี่ทราบ… ขณะนี้ยังไม่แน่ชัดว่ามกุฎราชกุมารอเล็กซานเดอร์ทรงประทับอยู่ที่ใด ความเคลื่อนไหวของกองทัพเองก็น่าสงสัยเช่นกันครับ”\n\nหลังจากพลิกดูแฟ้มเอกสารจนครบถ้วน อีวานก็ถ่ายเทพลังเวทลงในอักขระรูนที่ทิ้งไว้บนหน้าสุดท้ายแล้วปัดมือเบาๆ\n\nเอกสารลับสุดยอดพลันลุกไหม้เป็นเปลวเพลิงในพริบตาและมอดไหม้กลายเป็นเถ้าถ่านปลิวว่อนไป\n\n“รู้ตัวคนร้ายเบื้องหลังเหตุก่อการร้ายแล้ว แต่พวกที่กำลังเตรียมการลงมือกลับยังไร้ร่องรอย ทว่า เป้าหมายของพวกมันชัดเจนมาก…”\n\n“เอซิดิส”\n\n“ครับ พระธิดาที่ไอนาร์มหาราชทรงหวงแหนที่สุด หากเกิดเรื่องร้ายแรงขึ้นกับเธอ กษัตริย์ไอนาร์จะต้องเปิดฉากทำสงครามทันที และความรับผิดชอบทั้งหมดจะพุ่งตรงมาที่องค์หญิง ในฐานะที่พระองค์ทรงเป็นผู้นำสูงสุดของกองบัญชาการต่อต้านข่าวกรอง”\n\n“ถึงตอนนั้น กองทัพก็จะพากันไปสนับสนุนมกุฎราชกุมาร”\n\nเพื่อให้กองทัพอยู่รอดได้ สงครามย่อมเป็นสิ่งจำเป็น ในทางกลับกัน ในประเทศที่ปราศจากภัยคุกคามจากสงคราม การลดขนาดกองทัพย่อมกลายเป็นสิ่งที่หลีกเลี่ยงไม่ได้\n\nเพิ่งจะผ่านพ้นสงครามจอมมารมาได้เพียงสี่ปีเท่านั้น บ้านเมืองกำลังอยู่ในช่วงฟื้นฟูบูรณะ ทว่าราชสำนักกลับต้องจัดสรรงบประมาณไปหล่อเลี้ยงกองทหารแทนที่จะนำไปใช้ในการฟื้นฟูประเทศ\n\nดังนั้น ผู้ที่กระหายสงครามมากที่สุดในเวลานี้ก็คือฝ่ายกองทัพ\n\nรวมถึงมกุฎราชกุมารผู้ปรารถนาจะบ่อนทำลายราชสำนักและทำลายความน่าเชื่อถือขององค์หญิงเอลิซาเวตา\n\n“พวกผู้ก่อการร้ายจะต้องเล็งเป้าหมายมาที่เอซิดิสอีกครั้งอย่างแน่นอนครับ รุ่นพี่”\n\n“ไปกราบทูลองค์หญิงด้วย”\n\nอีวานเหลือบมองระเบียงทางเดินอันว่างเปล่าก่อนจะหมุนตัวเดินจากไป\n\n“ฉันจะทำในสิ่งที่จำเป็นต้องทำเอง”\n\n“ขอบคุณสำหรับความทุ่มเทนะครับ ‘อีวานตัวน้อย’”\n\n“เรื่องแค่นี้เอง”\n\nอีวานส่ายศีรษะสั้นๆ แล้วเดินจากไป หลังจากมองตามแผ่นหลังของอีกฝ่าย ดมิทรีก็ปัดมือเบาๆ\n\nอักขระรูน ‘รบกวนการรับรู้’ ที่ปลายสุดของระเบียงทางเดินมอดดับลง และเหล่านักศึกษาก็เริ่มทยอยเดินกลับเข้ามาในทางเดินอีกครั้ง\n\nทว่าบนระเบียงทางเดินที่เหล่านักศึกษากลับคืนมา กลับไม่หลงเหลือร่องรอยของดมิทรีอยู่อีกต่อไป\n\n***\n\nอีวานซึ่งเป็นคนที่มีตรรกะความคิดสูงมาก ได้วางแผนการขึ้นด้วยตรรกะอันเรียบง่าย\n\n1. มีใครบางคนกำลังหมายหัวเอซิดิสอยู่\n\n2. ด้วยเหตุผลบางประการ เอซิดิสกำลังพยายามสะกดรอยตามอีวาน\n\nการนำข้อมูลที่ว่าเป้าหมายอารักขากำลังตกอยู่ในอันตราย มาประกอบเข้ากับข้อเท็จจริงที่ว่าเป้าหมายอารักขากำลังตามติดตนเองอยู่ นำไปสู่ทางออกที่แสนตรงไปตรงมา\n\nเขาจำเป็นต้องอยู่ในระยะสายตาเพื่อให้เอซิดิสสะกดรอยตามเขาได้ง่ายขึ้น\n\nในสถานการณ์อันน่ายินดีที่เป้าหมายเฝ้าระวังและเป้าหมายอารักขากำลังเดินตามหลังมาด้วยความสมัครใจเช่นนี้ จึงไม่มีเหตุผลอะไรที่เขาจะต้องซ่อนตัว เพียงแค่เปิดเผยตัวให้อยู่ในสายตา ก็ช่วยให้อีวานสามารถคุมตัวเอซิดิสให้อยู่ในสายตาของตนได้เช่นกัน\n\nขณะเดียวกัน การคอยวนเวียนอยู่ใกล้ๆ เอซิดิส ย่อมนำพาเขาไปพบกับ ‘ผู้ก่อการร้ายปริศนา’ อย่างหลีกเลี่ยงไม่ได้\n\nดังที่เขาเคยตระหนักได้ก่อนหน้านี้ เจ้าหน้าที่ที่ผ่านการฝึกฝนมาอย่างดีจะไม่มีวันเคลื่อนไหวโดยมีเป้าหมายเพียงอย่างเดียวในหัว\n\nการวางเหยื่อล่อไว้มากกว่าหนึ่งตัวสำหรับการลงมือเพียงครั้งเดียว\n\nนั่นแหละคือรูปแบบการปฏิบัติงานของหน่วยเก็บกวาด\n\n***\n\n“มะ ไม่จริงน่า…?!”\n\nเอซิดิสที่กำลังจิบกาแฟอยู่ทำกาแฟหกเลอะเทอะพลางจ้องมองไปด้านหลังแนวต้นไม้อย่างเหม่อลอย\n\n“เอซี่ เป็นอะไรไปน่ะ?”\n\n“อะ เอ่อ อะ อะ เอ่อ… เอ่อ… บะ เบลล่า เบลล่าอยู่แถวนี้หรือเปล่า?”\n\n“ไม่อยู่นี่? อิซาเบลล์บอกว่าวันนี้ต้องแยกไปกินมื้อกลางวันเพราะติดเรียน… ทำไมเหรอ?”\n\n“ถ้าอย่างนั้น… ถ้าอย่างนั้น… ก็ฉัน…?”\n\nเมื่อมองดูคนสวนที่ยืนอยู่หลังแนวต้นไม้ เอซิดิสก็ทำหน้าเบ้ราวกับกำลังจะปล่อยโฮออกมา\n\n“ฉันคือเป้าหมายงั้นเหรอ…?”\n\n“อะไรนะ? เธอพูดเรื่องอะไรของเธอน่ะ?”\n\n“มะ ไม่มีอะไร ไม่มีอะไรทั้งนั้นแหละ… ยูริ ฉันขอตัวลุกไปก่อนนะ ขอโทษด้วย”\n\n“ไม่เป็นไร ฉันเองก็ต้องไปเรียนคาบต่อไปเหมือนกัน ไว้เจอกันพรุ่งนี้นะ!”\n\n“อื้ม อื้ม”\n\nเอซิดิสเดินโซซัดโซเซออกไป เมื่อมายืนอยู่ที่หน้าทางเข้าสาขาออร์เคสตรา เธอก็หันกลับมามองด้วยสายตาสั่นระริก\n\n“…!”\n\nณ ระยะห่างเท่าเดิมเป๊ะกับเมื่อครู่ ที่ฟากโน้นของแนวต้นไม้\n\n‘เขา’ กำลังจ้องมองมาที่เธออยู่\n\nจู่ๆ เอซิดิสก็รู้สึกอยากจะร้องไห้ออกมาเสียดื้อๆ"
    },

      "id": "เล่ม 1/ch048_th",
      "title": "บทที่ 48",
      "content": "“อ้าว คุณหนูไอนาร์สดอตตีร์ ได้ไวโอลินคันใหม่มาเหรอคะ?”\n\n“อะ ค่ะ…”\n\n“ว้าว! นี่มันตระกูลสตราดิวาเรียสเลยไม่ใช่เหรอ?! แพงขนาดนี้… ไม่สิ ไวโอลินคันที่แล้วของเธอก็รุ่นนี้เหมือนกันไม่ใช่หรือไง?”\n\n“ค่ะ… คุณลุงให้มาน่ะค่ะ”\n\n“น่าอิจฉาจังเลย!”\n\nทว่ายิ่งกว่าความอิจฉา คือสายตาที่เต็มไปด้วยความขุ่นเคืองและการดูแคลน\n\nมันเป็นสายตาที่คุ้นเคยและเสียดแทงใจสำหรับเอซิดิส\n\nวันเวลาที่เธออุทิศตนเข้าขวางทางบุกของเหล่านักศึกษาปีหนึ่งคณะอัศวิน ดูเหมือนจะถูกลืมเลือนไปจนหมดสิ้น ท่าทีของคนพวกนั้นราวกับเรื่องเหล่านั้นไม่เคยเกิดขึ้นมาก่อน\n\nในคณะดุริยางคศิลป์ เอซิดิสมักจะได้รับการปฏิบัติเช่นนี้อยู่เสมอ\n\nบางทีมันอาจจะเป็นเรื่องธรรมดา โดรอันเป็นอาณาจักรอันทรงอำนาจในสหราชอาณาจักร ทว่าไม่ใช่ประเทศที่สถาปนาสถานะของตนขึ้นมาด้วยวัฒนธรรมและศิลปะ\n\nคนเถื่อนผู้ดุดันและแข็งแกร่ง นั่นคือคำประเมินที่ประเทศของเธอได้รับ\n\nถึงกระนั้น เอซิดิสก็ยังสอบเข้ามาเรียนในคณะดุริยางคศิลป์ทั้งที่ไม่มีพรสวรรค์อันโดดเด่น\n\nเครื่องดนตรีที่เธอพกพาล้วนเป็นของชั้นเลิศอยู่เสมอ ทว่าแม้แต่ของล้ำค่าเหล่านั้นก็กลับพังเสียหายได้อย่างง่ายดาย\n\nสภาพแวดล้อมรอบข้างก็ไม่เป็นมิตรเอาเสียเลย แถมสัตว์ประหลาด ‘คุณลุง’ ที่เข้ามาเรียนเป็นนักศึกษาปีหนึ่งก็ยังคอยตามหาตัวเธออยู่ตลอดเวลา\n\nเอซิดิสเป็นเด็กสาวที่ได้รับความรักใคร่มาโดยตลอด ในฐานะธิดาแห่งกษัตริย์และขุมกำลังอันน่าเกรงขามที่เลื่องลือไปทั่วทั้งทวีป เธอจึงเป็นที่เชิดชูของใครหลายคน\n\nทว่า สภาพแวดล้อมเช่นนี้กลับโหดร้ายเกินไปสำหรับเธอ\n\n“อึก… ฮึก… ฮือ….”\n\nในคาบเรียนถัดไป เธอนั่งสะอื้นไห้อยู่ในห้องซ้อมเพียงลำพัง\n\nเนื่องจากไม่มีใครแจ้งให้เธอทราบเลยว่าตารางเรียนมีการเปลี่ยนแปลง เธอจึงนั่งตัวสั่นและร้องไห้อยู่คนเดียว\n\nมือที่เพิ่งจะลากคันชักบนสายไวโอลินไปได้ไม่กี่ครั้งร่วงผล็อยลงอย่างอ่อนแรง\n\n“ท่านพ่อ… คุณลุง….”\n\nเธอกอดไวโอลินไว้แน่นพลางสูดน้ำมูก จากนั้นจึงค่อยๆ วางมันลงในกล่องด้วยมืออันสั่นเทา\n\nมันเป็นช่วงเวลาที่เธออยากจะยอมแพ้เหลือเกิน\n\nอันที่จริง ทุกช่วงเวลาที่ผ่านมาล้วนเป็นเช่นนั้น ทุกวินาทีที่ได้เล่นไวโอลิน\n\nสำหรับชาวโดรอัน ไวโอลินเป็นเครื่องดนตรีต่างแดนอันแสนประหลาด ยิ่งไปกว่านั้น หากจะเสาะหาของที่ได้มาตรฐานสักคันก็มีราคาแพงหูฉี่ แต่ทั้งที่แพงขนาดนั้น เครื่องดนตรีอันบอบบางนี้กลับพังทลายลงได้อย่างง่ายดาย\n\nโดรอันเป็นดินแดนที่แห้งแล้ง เพียงแค่ปล่อยให้โดนลมข้างนอกชั่วครู่ แผ่นไม้และลำตัวของไวโอลินก็จะบิดงอ เป็นอันจบสิ้นอายุขัยของเครื่องดนตรีทันที\n\nต่อให้ตั้งสายทุกวันก็ไม่มีความหมายใดๆ เครื่องสายย่อมต้องการการดูแลเอาใจใส่อย่างประณีตจากผู้เชี่ยวชาญที่มีประสบการณ์เป็นทุนเดิมอยู่แล้ว\n\nเหล่าฮัสคาลต่างมองว่าองค์หญิงกำลังลุ่มหลงในความฟุ่มเฟือย ส่วนครูผู้สอนที่หามาได้ก็เป็นเพียงพวกโง่เขลาไร้ประสบการณ์ ไม่ได้ใกล้เคียงกับนักดนตรีหรือกวีผู้ช่ำชองเลยแม้แต่น้อย\n\nด้วยเหตุนั้น เธอจึงต้องดิ้นรนหาโน้ตเพลงอย่างยากลำบากและฝึกฝนด้วยตนเองมาเป็นเวลานาน\n\nครั้นต่อมา เมื่อเธอสามารถสอบเข้าวิทยาลัยดุริยางคศิลป์แห่งมหาวิทยาลัยเซนต์ยานสก์ ซึ่งเป็นโรงเรียนดนตรีอันทรงเกียรติระดับโลกได้สำเร็จ โอ้ เธอช่างปีติยินดีมากเพียงใด\n\n“…ไชโย”\n\nเอซิดิสตบกระเป๋าที่สะพายอยู่บนไหล่เบาๆ\n\nตลอดชีวิตที่ผ่านมา เธอมักจะอยากยอมแพ้อยู่ร่ำไป การปล่อยวางทุกสิ่งแล้วใช้ชีวิตอย่างสงบในฐานะองค์หญิงดูเหมือนจะไม่ใช่เรื่องเลวร้ายอะไร\n\nทว่า การมีชีวิตอยู่ในฐานะธิดาของกษัตริย์ ย่อมหมายถึงการถูกจัดแสดงประดุจสิ่งของราคาแพงที่ถูกเก็บรักษาเอาไว้\n\nทอผ้าเพื่อเพิ่มมูลค่าในตลาด ขับร้องเพลงเพื่อน้ำเสียงอันไพเราะ ฝึกฝนศิลปะการต่อสู้เป็นครั้งคราว\n\nผลลัพธ์สุดท้ายก็คือการแต่งงานกับนักรบที่เหมาะสมที่สุดเพื่อสืบสานสายเลือดราชวงศ์ นั่นคงจะเป็นชะตากรรมของเธอ\n\nเธอไม่อยากใช้ชีวิตแบบนั้น\n\nเธออยากจะเรียนรู้เครื่องดนตรี เธออยากจะเรียนดนตรี โดยเฉพาะอย่างยิ่ง ไวโอลิน\n\nความปรารถนานั้นเริ่มต้นขึ้นเมื่อสิบปีก่อน จากบทสนทนาข้างกองไฟ\n\nมันเริ่มต้นจากเรื่องเล่าที่เธอได้ยินจากชายผู้หนึ่งซึ่งบัดนี้ใบหน้าของเขาเริ่มเลือนรางไปแล้ว\n\nไอนาร์เป็นบุรุษผู้มีเหตุผล แม้จะเป็นตรรกะแบบฉบับโดรอัน แต่เขาก็เป็นบิดาที่ยอดเยี่ยมซึ่งใช้ความคิดอย่างมีเหตุมีผลเสมอ\n\nด้วยเหตุนี้ เขาจึงพาลูกๆ ทุกคนออกสู่สนามรบด้วย มีเหตุผลหลายประการสำหรับเรื่องนี้\n\nประการแรก หากเป็นลูกของเขา พวกเขาก็จำเป็นต้องสัมผัสบรรยากาศของสมรภูมิรบด้วยตนเอง\n\nประการที่สอง ข่าวลือเกี่ยวกับเหล่านักรบแห่งโดรอันนั้นไม่อาจไว้วางใจได้\n\nเหตุผลประการหลังมีความสำคัญยิ่งกว่า ไอนาร์เป็นยอดนักรบ และแม้แต่ในเวลานั้น เขาก็เป็นชายที่ไร้ผู้ทัดเทียมภายในโดรอันอยู่แล้ว\n\nหากเขายุติสงครามได้อย่างปลอดภัยและเดินทางกลับบ้าน ก็มีความเป็นไปได้สูงที่จะมีนักรบคนใดคนหนึ่งหมายปองธิดาของเขาไว้เป็นรางวัลเชลย\n\nดังนั้น เอซิดิสจึงเข้าใจเรื่องสงครามเป็นอย่างดี\n\nและเธอก็รู้จักเรื่องราวของปาร์ตี้ผู้กล้าในยุคสมัยนั้น\n\nเธอจดจำภาพของเหล่าผู้กล้าที่เดินโซซัดโซเซกลับมาในสภาพบาดเจ็บได้เสมอ แขนขาหัก บางครั้งถึงกับสูญเสียอวัยวะบางส่วน กลับมาในสภาพสะบักสะบอมยับเยิน\n\nเช็ดคราบเลือด พันผ้าพันแผลทับรอยแผล นั่งหมดแรงอยู่ข้างกองไฟ แบ่งปันสุรากันดื่ม\n\nในช่วงเวลาเหล่านั้น เธอมักจะเอ่ยถามคำถามเช่นนี้กับชายผู้ที่มักจะบาดเจ็บสาหัสที่สุดนอกเหนือจากคนในปาร์ตี้อยู่เสมอ\n\n“ทำไมคุณลุงไม่หนีไปล่ะคะ?”\n\n“หือ?”\n\nเขาเป็นชายที่อายุน้อยกว่าพ่อของเธออย่างน้อยสิบปี ทว่าก็ยังแก่กว่าเธออยู่มาก ยกเว้นนักบุญหญิงแล้ว เขาคือคนที่อายุน้อยที่สุดในบรรดาสมาชิกของปาร์ตี้นี้ เอซิดิสจึงมักจะชวนชายท่าทางหยาบกระด้างคนนี้พูดคุยอยู่บ่อยๆ\n\nชายคนนั้นทอดสายตามองกองไฟอยู่ครู่หนึ่ง ก่อนจะแย้มรอยยิ้มจางๆ แล้วเอ่ยว่า\n\n“ไม่มีที่ให้หนีหรอก โลกกำลังจะกลายเป็นนรกแล้ว”\n\n“ถึงอย่างนั้น ก็ยังดีกว่าออกไปสู้รบไม่ใช่เหรอคะ? ที่ๆ ไม่รู้เลยว่าจะตายเมื่อไหร่ทุกครั้งไปน่ะ”\n\n“เรื่องนี้เธอไม่จำเป็นต้องรีบเรียนรู้ตั้งแต่เด็กหรอกนะ”\n\nชายคนนี้มักจะใช้ถ้อยคำที่เข้าใจยากอยู่เป็นบางครั้ง เพราะมันดูภูมิฐานมีระดับ เอซิดิสจึงแอบชื่นชมเขาอยู่ในใจเงียบๆ\n\nเด็กๆ มักจะคิดว่าคำศัพท์ยากๆ นั้นดูเท่เสมอ\n\n“เอซิดิส เหตุผลที่พ่อของเธอกับฉันกวัดแกว่งขวาน แม็กซิมิเลียนกับจิลแบร์แบกดาบ ท่านนักบุญคอยประคองชีวิตพวกเราไว้ และเอนริเก้ยอมเสี่ยงชีวิตแทรกซึมแนวหลังศัตรู ทั้งหมดนี้ก็เพื่อเหตุผลเดียวเท่านั้นแหละ”\n\n“อะไรเหรอคะ?”\n\n“พวกเราหวังว่าพวกเราจะเป็นรุ่นสุดท้าย”\n\nชายคนนั้นกุมขวานไว้ข้างกองไฟ พลางแยกเขี้ยวกัดฟันแน่นจนแทบจะแตกหัก\n\n“ชีวิตที่ต้องเข่นฆ่าศัตรูทุกเมื่อเชื่อวันเพื่อเอาชีวิตรอด พวกเราหวังว่าชีวิตแบบนั้นมันจะจบลงที่พวกเรา เพื่อเธอ เพื่อพี่น้องของเธอ และเพื่อเด็กๆ อีกมากมายที่อยู่เบื้องหลังพวกเรา และพวกเราก็หวังว่าลูกหลานของเด็กๆ เหล่านั้น จะได้ถือคันไถ ไม่ใช่ถืออาวุธ”\n\nสงครามจะต้องไม่ยืดเยื้ออีกต่อไป โครงสร้างของสหราชอาณาจักรไม่อาจทานทนต่อสงครามครั้งใหม่ได้อีกแล้ว\n\nไม่ควรมีสงครามใดที่ยาวนานเกินหนึ่งชั่วอายุคน ต่อให้ได้รับชัยชนะหลังจากนั้น มันก็ไม่อาจนับเป็นชัยชนะที่แท้จริงได้\n\nคนรุ่นพวกเขาคือขีดจำกัดสุดท้ายที่ชีวิตจะยังดำรงอยู่เพื่อผู้คน และประเทศชาติจะยังคงทำหน้าที่เป็นรัฐชาติต่อไปได้\n\nด้วยความหมายเช่นนั้น ชายคนนั้นจึงวางขวานลงอย่างเงียบเชียบ\n\n“เพราะฉะนั้น อย่าโตมาเป็นเหมือนพ่อของเธอเลยนะ”\n\n“เอ่อ… อืม แล้วหนูควรทำอะไรดีล่ะคะ? หนูน่ะ เอ่อ… ใช้ขวานเก่งนะ!”\n\n“งั้นเหรอ โตขึ้นอีกหน่อยคงทำให้พวกเราตกใจน่าดูเลยสิ แต่ถึงอย่างนั้น ถ้าเป็นไปได้ ก็ลองจับถืออย่างอื่นที่ไม่ใช่ขวานดูบ้างเถอะ”\n\n“หนูเย็บปักถักร้อยไม่ค่อยเก่งเท่าไหร่…”\n\n“ก็ไม่จำเป็นต้องเย็บผ้าหรอก อืม”\n\nชายคนนั้นมองเอซิดิสด้วยสีหน้าครุ่นคิด เนื่องจากเขาไม่ใช่คนพูดจาคล่องแคล่ว จึงไม่มั่นใจนักว่าจะให้คำแนะนำที่เหมาะสมแก่เด็กน้อยคนนี้ได้อย่างไร\n\nเขาลูบคางอยู่ครู่หนึ่งก่อนจะเอ่ยขึ้นว่า\n\n“ถ้าต้องถืออะไรสักอย่าง เลือกเครื่องดนตรีจะดีกว่านะ”\n\n“เครื่องดนตรีเหรอคะ?”\n\n“อาวุธใช้เข่นฆ่าผู้คน แต่ดนตรีช่วยชีวิตผู้คนได้”\n\nก้าวข้ามผ่านพรมแดน วัฒนธรรม และภาษา ดนตรีอันยอดเยี่ยมโดยตัวมันเองจะกลายเป็นสะพานเชื่อมโยงผู้คนเข้าไว้ด้วยกัน\n\nหากยุคสมัยแห่งสันติภาพมาเยือน หนึ่งในสิ่งที่จำเป็นมากที่สุดย่อมต้องเป็นเครื่องดนตรีอย่างแน่นอน\n\nเอซิดิสจ้องมองชายคนนั้นอย่างเหม่อลอย เส้นผมสีถ่าน ดวงตาสีฟ้าเข้มล้ำลึก และสีหน้าอันสุขุมเยือกเย็นยามจ้องมองกองไฟ\n\nบุรุษผู้เปี่ยมด้วยปณิธานคนนั้นคือบุคคลที่เด็กหญิงเฝ้าเทิดทูนชื่นชม\n\n“คุณลุงคะ เครื่องดนตรีที่คุณลุงชอบที่สุดคืออะไรเหรอคะ?”\n\n“อืม ฉันเองก็ไม่ค่อยรู้จักเครื่องดนตรีของโลกนี้เท่าไหร่หรอกนะ”\n\nเขาลูบคางอย่างเก้อเขิน มันเป็นนิสัยติดตัวเวลาจมอยู่ในห้วงความคิด\n\nอา แต่ดูเหมือนจะมีเครื่องดนตรีอย่างหนึ่งที่มีเหมือนกัน ชายคนนั้นหัวเราะเบาๆ ขณะนึกย้อนไป เนื่องจากการถูกเกณฑ์ทหารทำให้เขาต้องใช้เวลาถึงสิบปีอยู่ในสมรภูมิ จึงไม่ค่อยได้สัมผัสกับเครื่องดนตรีบ่อยนัก\n\nบางทีอาจจะเป็นเครื่องดนตรีที่เขาเคยเห็นตอนที่มหาราชของพวกเราจัดงานเฉลิมฉลอง มันเป็นเครื่องดนตรีที่คล้ายคลึงกันและมีชื่อเรียกเดียวกันในโลกนี้\n\n“น่าจะเป็นไวโอลินล่ะมั้ง…?”\n\n“ไวโอลินเหรอคะ?”\n\n“อืม”\n\nเอซิดิสทวนชื่อนั้นซ้ำไปซ้ำมาหลายครั้ง เพื่อสลักมันลงในความทรงจำ\n\nสิบปีล่วงเลยผ่านไปนับจากวันนั้น ตลอดช่วงเวลาดังกล่าว เธอแปรเปลี่ยนจากบุตรสาวของยอดนักรบ มาเป็นธิดาขององค์มหาราช\n\nโลกได้ก้าวเข้าสู่ยุคสมัยที่มหาราชของพวกเราไม่จำเป็นต้องปกครองอาณาจักรด้วยขวานอีกต่อไป มันกลายเป็นยุคสมัยที่วาทศิลป์จำเป็นยิ่งกว่าอาวุธ และการทูตกับทองคำจำเป็นยิ่งกว่าวาทศิลป์\n\nดังที่คุณลุงเคยกล่าวไว้ โลกที่ไม่ต้องการอาวุธอีกต่อไปได้มาถึงแล้ว\n\nเอซิดิสหยิบไวโอลินขึ้นมา อดทนบากบั่นฝึกฝนแม้พ่อแม่จะคัดค้านด้วยความห่วงใยและเหล่าคุณลุงคนอื่นจะคอยวิพากษ์วิจารณ์ กำนิ้วลงบนฟิงเกอร์บอร์ดจนมือฟกช้ำ ดึงคันชักจนข้อมือเคล็ด\n\nเพื่อรำลึกถึงคุณลุงผู้ล่วงลับไปในสงครามในท้ายที่สุด เธอตั้งใจว่าสักวันหนึ่งจะต้องไปเยือนและทิ้งบทเพลงไว้อาลัยที่สมบูรณ์แบบที่สุดเอาไว้ให้ได้\n\nเธอได้ยินมาว่าอัฐิของคุณลุงถูกฝังไว้ที่สุสานแห่งชาติคราซิลอฟแห่งพริตเชนคายา\n\nและในคราซิลอฟ ก็มีมหาวิทยาลัยดนตรีอันทรงเกียรติอันดับหนึ่งของทวีปตั้งอยู่\n\nการที่เธอได้เข้าเรียนที่มหาวิทยาลัยเซนต์ยานสก์จึงไม่ต่างอะไรกับโชคชะตาเลยแม้แต่น้อย\n\nดังนั้น เธอจะไม่มีวันยอมแพ้ ไม่มีวันเป็นอันขาด\n\n***\n\nเอซิดิสเช็ดน้ำตาจนแห้งสนิท ลุกขึ้นยืน และเดินออกจากอาคารภาควิชาออร์เคสตรา\n\nคาบเรียนในวันนี้ถูกนับว่าเป็นการขาดเรียนโดยพลการ ทว่าเธอก็มีพื้นที่เพียงพอสำหรับการฝึกซ้อมที่บ้านอยู่แล้ว\n\nเธอจะไม่มีวันยอมแพ้\n\n“เครื่องดนตรีคือสะพานเชื่อมโยงผู้คน…”\n\nไม่มีวัน\n\n***\n\n“มอร์ด”\n“อะไร?”\n“นายกลับไปได้แล้วล่ะ”\n“…ว่าไงนะ?”\nอีวานเหลือบมองเสื้อผ้าฉีกขาดจำนวนมากที่มอร์ดทำพังอย่างเงียบเชียบ\n\n“ระหว่างที่นายมาทำงานอาสาสมัครที่สถานเลี้ยงเด็กกำพร้าของฉัน ความเสียหายทางการเงินของสถานเลี้ยงเด็กกำพร้ากลับเพิ่มขึ้นอย่างมีนัยสำคัญ”\n\n“…อึก…!”\n\n“นายรู้ไหมว่าการซักผ้าจนผ้าฉีกขาดมันไม่ได้เรียกว่าการซักผ้า แต่เรียกว่าการทำลายข้าวของน่ะ?”\n\n“อึก…”\n\nมอร์ดเม้มริมฝีปากและหลบสายตาของอีวาน\n\nทว่าเขาก็มีข้อแก้ตัวที่จะโต้กลับอยู่เหมือนกัน\n\n“ขะ… ข้าไม่เคยซักผ้ามาก่อนในชีวิตเลยนี่หว่า!”\n\n“ต่อให้เป็นคนที่ไม่เคยซักผ้ามาก่อนในชีวิตเลย ก็น่าจะพอซักกางเกงในเด็กให้รอดได้ภายในสองเดือนมั้ง”\n\n“อึก…!!”\n\nอีวานไม่แยแสต่อมอร์ดที่กำลังเจ็บปวดทางใจและเดินหน้าต่อไป\n\nแผนการกักตัวมอร์ดเอาไว้เพื่อจับตาดูความเคลื่อนไหวของสายลับที่โดรอันส่งมาหวังจะล่วงรู้เจตนาของพวกมันถูกยกเลิกไปแล้ว\n\nตราบใดที่มีข้อมูลว่ามีใครบางคนในหมู่ “สายลับที่โดรอันส่งมา” กำลังหมายเอาชีวิตเอซิดิส ก็ไม่มีเหตุผลอะไรที่จะต้องกักตัวมอร์ดเอาไว้อีกต่อไป\n\nมอร์ดเป็นคนซื่อบื้ออยู่บ้าง แต่อย่างน้อยเขาก็ห่วงใยเอซิดิสอย่างจริงใจ เขาคือหนึ่งในข้ารับใช้ผู้จงรักภักดีของกษัตริย์ไอนาร์\n\nเพื่อความปลอดภัยของเอซิดิส มอร์ดจำเป็นต้องกลับมาทำหน้าที่ของตนเองอีกครั้ง เขาไม่ได้เข้ามาสมัครเรียนในมหาวิทยาลัยเพื่อมานั่งเข้าเรียนในคณะอัศวินเสียหน่อย\n\nหน้าที่ของเขาคือการคุ้มครองเอซิดิส\n\n“และถ้ามอร์ดอยู่ข้างกายเอซิดิส จะต้องมีใครบางคนติดต่อเข้ามาหาเขาอย่างแน่นอน”\n\nตราบใดที่มีมอร์ดคอยอารักขาอยู่ ความปลอดภัยของเอซิดิสย่อมมั่นคง หากมีใครสักคนจากโดรอันพยายามติดต่อมอร์ดเพื่อแยกตัวเขาออกไปจากเอซิดิส อีวานก็จะแกะรอยการติดต่อนั้นแล้วกำจัดต้นตอให้สิ้นซาก\n\nอีวานจ้องมองชายวัยกลางคนที่เดินออกจากสถานเลี้ยงเด็กกำพร้าไปด้วยสีหน้าเศร้าสร้อยอยู่ครู่หนึ่งก่อนจะหันหน้ากลับไป"
    },

      "title": "บทที่ 49",
      "content": "**คมดาบ**\n\nคมดาบฟาดฟันลงมาราวกับโปรยปรายแสงจันทร์ก่อนปักตรึงแน่นบนพื้นดิน พละกำลังหนักหน่วง ท่วงท่าไร้ที่ติ\n\n“ยอดเยี่ยม” อีวานพยักหน้า ใช้ขวานปัดป้องแล้วคว้าใบดาบเอาไว้\n\n– เคร้ง!\n\nใบดาบที่เกี่ยวเข้ากับคมขวานสั่นสะท้าน เสียวิถีไปก่อนจะร่วงหลุดลง อีวานยกดาบที่ปักคาพื้นขึ้นมาพลางตรวจดูสภาพของมัน\n\n“เป็นยังไงบ้างคะ?”\n\n“ใช้ได้เลยทีเดียว”\n\n“ฮิฮิ เห็นไหมคะ หนูบอกแล้วว่าหนูหัวไวจะตาย จริงไหมคะ?”\n\n“แน่นอน”\n\nอีวานพยักหน้ารับแล้วโยนดาบคืนกลับไป\n\nอิซาเบลล์รับดาบที่หมุนคว้างกลางอากาศได้อย่างแม่นยำพลางยิ้มกว้าง\n\n“ถ้าให้ประเมินคิดว่าเป็นยังไงบ้างคะ? เทียบกับท่านพ่อตอนอายุเท่าหนูแล้วเป็นไงบ้างคะ?”\n\n“ถ้าเอาไปเทียบกับแม็กซิมิเลียน ไม่ว่าใครในทวีปนี้ก็เทียบไม่ติดหรอก”\n\nอีวานอดยิ้มไม่ได้กับคำถามอันห้าวหาญของอิซาเบลล์\n\nเขาเดินเข้าไปหาอิซาเบลล์ที่ทำแก้มป่องบ่นพึมพำ พาดผ้าขนหนูลงบนลำคอที่ชุ่มเหงื่อของเธอ แล้ววางมือกดลงบนศีรษะเบาๆ\n\n“อย่ามัวแต่จมอยู่ใต้เงาของคนที่เดินนำหน้าไปก่อน”\n\n“โห คำพูดคมจังเลย! คุณลุงคิดเองเลยเหรอคะ?”\n\n“เปล่า เอนริเก้เป็นคนพูดน่ะ”\n\nมันคือถ้อยคำที่เธอเคยเอ่ยแก่ ‘อีวานตัวน้อย’ ผู้เคยจมอยู่ใต้เงาของกษัตริย์องค์ก่อน\n\nการชื่นชมใครสักคนย่อมเป็นเรื่องธรรมดา โลกใบนี้กว้างใหญ่ไพศาล และมีผู้คนผู้ยอดเยี่ยมอยู่มากมาย\n\nทว่าการพยายามเลียนแบบพวกเขาไปทีละคนๆ ย่อมลงเอยเป็นเพียงการลอกเลียนอันเก้ๆ กังๆ เท่านั้น\n\nเอนริเก้เคยบอกอีวานเอาไว้ และบัดนี้อีวานก็กำลังบอกต่อแก่อิซาเบลล์:\n\nอย่ามัวแต่จมอยู่ใต้เงาของคนที่เดินนำหน้าไปก่อน จงก้าวเดินไปบนเส้นทางของตนเอง\n\n“อืม เป็นคำแนะนำที่ดีนะคะ แต่ไม่รู้ทำไมมันถึงดูไม่เข้ากับภาพลักษณ์ของศาสตราจารย์เอนริเก้เลยสักนิด!”\n\n“สมัยนั้น เอนริเก้เป็นคนที่จริงจังมากนะ”\n\n“แล้วคุณลุงล่ะคะ? สมัยนั้นก็พูดแต่คำว่า ‘อืม’ ‘จริงด้วย’ ‘ไม่’ ‘ยุ่งอยู่’ แค่นี้เหมือนกันเหรอคะ?”\n\n“อืม…”\n\nวันวานเหล่านั้นสินะ\n\nอีวานลูบคางครุ่นคิดอยู่ครู่หนึ่ง\n\n“ก็ไม่ต่างกันเท่าไหร่หรอก”\n\n“น่าเบื่อชะมัด! เฮ้อ จริงๆ เลยค่ะ อารมณ์ความรู้สึกของคุณลุงตายตามไปในสงครามหรือไงคะ? ในหัวใจของคุณลุงมีอะไรอยู่กันแน่คะ? ให้หนูเดานะ ขวาน? โพชั่นรักษาบาดแผล?”\n\n“ไร้สาระ”\n\nอีวานหัวเราะเบาๆ ยีผมของอิซาเบลล์อีกทีก่อนจะลุกขึ้นยืน\n\nนับตั้งแต่เหตุก่อการร้ายในการฝึกภาคสนาม อีวานก็มาฝึกซ้อมให้อิซาเบลล์ทุกค่ำคืน\n\nลำดับความเป็นมาของเรื่องนี้คงต้องชี้แจงกันเสียหน่อย หากว่ากันตามจริงแล้ว อิซาเบลล์ต่างหากที่เป็นฝ่ายต้อนอีวานให้จนมุมแล้วขอให้ช่วยฝึกให้\n\nมันคือการฝึกพิเศษเพื่อก้าวไปให้ถึงสิ่งที่เรียกว่า ‘ขอบเขตของผู้เหนือมนุษย์’\n\n“มาค่ะ ไปขั้นตอนต่อไปกันเลย เร็วเข้า เร็วเข้า”\n\n“เอาสิ”\n\nอิซาเบลล์นั่งขัดสมาธิลงบนพื้นหญ้า เธอผ่อนลมหายใจออกอย่างสงบและค่อยๆ หลับตาลง\n\n“รีบๆ เอามือมาแตะตัวหนูสิคะ!”\n\n“มาถึงขั้นนี้แล้ว ก็แทบไม่จำเป็นต้องทำแบบนั้นหรอก”\n\n“โธ่ น่านะคะ หนูยังไม่ชินเลยนี่นา!”\n\nขอบเขตของผู้เหนือมนุษย์เริ่มต้นจากการหมุนเวียนพลังเวทเพื่อเสริมความแข็งแกร่งให้ระบบประสาท\n\nเพื่อบ่มเพาะความรู้สึกในการส่งผ่านพลังเวทเข้าสู่โครงข่ายประสาททั่วร่างกาย ในช่วงแรก อีวานคอยวางมือบนแผ่นหลังของเธอเพื่อช่วยสำรวจการไหลเวียนของพลังเวท\n\nเขาจะถ่ายเทพลังเวทของตนเข้าไปเปิดเส้นทางและชี้นำพลังเวทของเธอ เพื่อช่วยให้เธอจับความรู้สึกได้\n\nแน่นอนว่านี่เป็นเพียงขั้นตอนพื้นฐานที่สุดเท่านั้น ต่อให้จับความรู้สึกได้แล้ว การควบคุมใช้งานด้วยตนเองก็เป็นอีกเรื่องหนึ่ง และต่อให้เสริมความแข็งแกร่งสำเร็จแล้ว การขยับร่างกายด้วยความเร็วที่เพิ่มสูงขึ้นนั้นก็เป็นอีกเรื่องหนึ่งเช่นกัน\n\n“อืมมมม…”\n\n“หุบปากแล้วตั้งสมาธิจดจ่อกับความรู้สึกซะ”\n\n“แต่อืมมม… มันอุ่นดีนี่คะ…”\n\nพออีวานถ่ายเทพลังเวทเข้าไป อิซาเบลล์ก็ทิ้งตัวอ่อนระทวยพลางถอนหายใจออกมา\n\n“ช่วงนี้ทั้งยูริทั้งเอซี่ต่างก็ยุ่งกันหมด… แม้แต่เวลาอยากจะพัก หนูยังไม่มีเพื่อนมานั่งเล่นด้วยเลยค่ะ…”\n\n“นี่ไม่ใช่เวลาพักผ่อนนะ”\n\n“ใช่สิคะ ใช่แน่ๆ เลยล่ะ”\n\nอิซาเบลล์หรี่ตาช้อนมองขึ้นไปทางอีวาน\n\nเธอเหลือบมองเขาด้วยแววตาซุกซนพลางแย้มยิ้มเจ้าเล่ห์\n\n“ตอนนี้คุณลุงกำลังทำงานอยู่กับหนูเหรอคะ?”\n\n“ฉันกำลังสอนเธออยู่”\n\n“งั้นหนูขอเรียกว่าพักผ่อนก็แล้วกันนะคะ นี่มันก็แค่เวลาเล่นกับคุณลุงต่างหาก”\n\n“เห็นทีฉันคงต้องพิจารณาระดับความเข้มข้นในการฝึกเสียใหม่แล้วล่ะ”\n\nอีวานถึงกับสะเทือนใจอยู่ไม่น้อย ในฐานะคนที่มีความเที่ยงธรรมในการประเมินตนเองเป็นอย่างยิ่ง เขามั่นใจว่าตนเองรักษาระดับการอบรมสั่งสอนที่เข้มงวด เยือกเย็น และจู้จี้กวดขันมาโดยตลอด\n\nนี่นับเป็นการเล่นสนุกงั้นเรอะ? สมกับเป็นลูกสาวของแม็กซิมิเลียนจริงๆ\n\nอีวานพยักหน้าสั้นๆ\n\nเมื่อเห็นท่าทีนั้น อิซาเบลล์ก็ทำสีหน้าราวกับกำลังมองดูสิ่งมีชีวิตที่น่าสมเพชเวทนาเสียเต็มประดา ก่อนจะถอนหายใจออกมา เธอเหยียดแขนบิดขี้เกียจแล้วลุกขึ้นยืน\n\n“ก็ได้ค่ะ เฮ้อ วันนี้หนูก็ได้เรียนรู้อะไรเยอะแยะอีกตามเคย”\n\n“อืม”\n\n“อ้อ จริงสิ คุณลุงยังคงทำงานเป็นสายลับอยู่ใช่ไหมคะ? ช่วงนี้หนูได้ยินเรื่องแปลกๆ มาน่ะค่ะ”\n\n“เรื่องแปลกๆ เหรอ?”\n\n“ค่ะ! หนูจะเล่าเรื่องนี้ให้ฟังนะคะ คือว่าเมื่อไม่กี่วันก่อน ท่านดิอันเห็นผู้ชายแปลกหน้ามาด้อมๆ มองๆ หน้าบ้านพวกเราด้วยล่ะค่ะ”\n\n“ผู้ชายแปลกหน้า?”\n\n“ค่ะ! เขามายืนเหม่อจ้องบ้านพวกเราจากตรงมุมกำแพงอยู่ตั้งนาน ท่านดิอันเลยสะกดรอยตามไปดูว่าเป็นใคร แต่ดันคลาดสายตาไปซะก่อน”\n\nอีวานขมวดคิ้วทันทีที่ได้ยินเช่นนั้น\n\nดิอัน นายทหารองครักษ์ที่ราชวงศ์ทิลเลสส่งมาอารักขาเธอ\n\nคนระดับนั้นยังปล่อยให้เป้าหมายคลาดสายตาไปได้… นั่นย่อมหมายความว่าอีกฝ่ายไม่ใช่นักศึกษาหรือพลเรือนธรรมดาอย่างแน่นอน\n\n“เขาไม่ใช่พวกเดียวกับคุณลุงใช่ไหมคะ?”\n\n“ไม่ใช่”\n\nกองบัญชาการต่อต้านข่าวกรองไม่ได้ทำงานกันแบบนั้น\n\n“เดี๋ยวฉันจัดการสืบดูเอง เธอไม่ต้องกังวลไปหรอก”\n\n“แต่ว่า… จะไม่ให้กังวลได้ยังไงคะในเมื่อมีคนมาคอยเฝ้าดูบ้านที่หนูอาศัยอยู่แบบนี้”\n\n“นั่นเป็นหน้าที่ที่ฉันต้องเป็นกังวล นักศึกษาก็ควรตั้งใจเรียนหนังสือไป”\n\n“อ๊ะ…”\n\nบางทีคุณลุงก็ชอบรุกต้อนตรงๆ แรงแบบนี้ทุกทีสิน่า\n\nอิซาเบลล์จ้องเขม็งใส่แผ่นหลังของอีวานที่เดินห่างออกไปอยู่ครู่หนึ่ง ก่อนจะพ่นลมหายใจพรูออกมาว่า “ฟู่”\n\nไม่ง่ายเลย จริงๆ นะ\n\nเธอยิ้มบางๆ พลางกอดผ้าขนหนูรอบคอเอาไว้แน่น\n\n***\n\nอิซาเบลล์กำลังถูกใครบางคนจับตาดูอยู่\n\nแน่นอนว่าย่อมไม่ใช่ฝีมือของกองบัญชาการต่อต้านข่าวกรอง ไม่เพียงแต่กองบัญชาการจะไม่ได้ปฏิบัติการในลักษณะนั้น ทว่าอิซาเบลล์และเหล่าทายาทของปาร์ตี้ผู้กล้าต่างก็อยู่ในเขตรับผิดชอบของอีวาน\n\nดมิทรีไม่มีทางทำอะไรที่มารบกวนความรู้สึกของเขาเป็นอันขาด\n\nอีวานเดินไปตามท้องถนนยามราตรีพลางจมดิ่งสู่ห้วงความคิด\n\n– มีใครบางคน หรือกลุ่มคนบางกลุ่ม กำลังเฝ้าจับตาดูเหล่าทายาทของปาร์ตี้ผู้กล้าอยู่\n\n– หนึ่งในห้ายาร์ลแห่งโดรอันพยายามก่อเหตุลอบวางระเบิดในสถาบัน\n\nเหตุการณ์ทั้งสองนี้อาจมีความเชื่อมโยงกันหรือไม่? เหตุการณ์หลังเห็นได้ชัดว่าเป็นการมุ่งเอาชีวิตเอซิดิส\n\nหากเอซิดิสเสียชีวิตหรือได้รับบาดเจ็บ กษัตริย์ไอนาร์ย่อมต้องเคลื่อนไหว\n\nและไอนาร์กับเหล่าพี่น้องร่วมสาบานก็คือขุมกำลังทางทหารที่แข็งแกร่งที่สุดบนผืนแผ่นดินโดรอันในเวลานี้ หากพวกเขาเคลื่อนพล โดรอันก็แทบไม่ต่างอะไรกับบ้านร้างไร้ยาม\n\nนั่นคือสิ่งที่ยาร์ลคนหนึ่งกำลังหมายตาอยู่ แผนการโค่นล้มราชอาณาจักรในช่วงที่ไอนาร์ไม่อยู่\n\n‘แล้วอิซาเบลล์ก็มาพัวพันกับเรื่องนี้ด้วยงั้นเหรอ?’\n\nมันอาจเป็นแค่การคิดมากเกินไป หรืออาจเป็นเหตุการณ์ที่แยกจากกันโดยสิ้นเชิงและไม่เกี่ยวข้องกันเลยก็ได้\n\nทว่าอีวานกลับรู้สึกสังหรณ์ใจไม่ดีอย่างประหลาด และสัญชาตญาณของเขาก็ผ่านการลับคมกลางสมรภูมิมานานกว่า 20 ปี\n\n‘ตราบใดที่ยังมีมอร์ดอยู่ กลางคืนเอซิดิสก็ปลอดภัยหายห่วง’\n\nมอร์ดจบหลักสูตรงานอาสาสมัครจากสถานเลี้ยงเด็กกำพร้าและกลับไปประจำตำแหน่งนายทหารองครักษ์ส่วนตัวของเอซิดิสเรียบร้อยแล้ว\n\nมีหมอนั่นอยู่ด้วย ต่อให้เกิดเหตุไม่คาดฝันขึ้นจริงๆ ก็สามารถถ่วงเวลาจนกว่าอีวานจะไปถึงได้สบายๆ\n\nดังนั้น ช่วงหลังพระอาทิตย์ตกดินเขาจึงคอยสังเกตการณ์สถานการณ์อย่างค่อนข้างสงบนิ่งมาตลอด\n\n‘กลางวันคอยดูเอซิดิส ส่วนกลางคืนคอยเฝ้าอิซาเบลล์’\n\nอีวานจัดสรรตารางเวลาในหัวพลางมุ่งหน้าไปยังห้องทำงานผู้อำนวยการ\n\nเขาไม่เคยคิดมาก่อนว่ามันจะเป็นงานง่ายตั้งแต่แรก ต้องมาตามล่าตัวคนร้ายที่แม้แต่กองบัญชาการต่อต้านข่าวกรองยังจับตัวไม่ได้มานานถึงสองเดือน\n\nแน่นอนว่ากองบัญชาการคงไม่อาจทุ่มความสนใจทั้งหมดมาที่เรื่องนี้เพียงเรื่องเดียวได้ แต่ถึงอย่างนั้น มันก็ไม่ใช่เรื่องง่ายที่คนคนเดียวจะมารับมือกับสิ่งที่แม้แต่กำลังสืบสวนขององค์กรระดับชาติยังทำไม่สำเร็จ\n\nทว่าก็เหมือนเช่นเคย\n\nทำได้ หรือทำไม่ได้? คำถามนั้นหาได้สลักสำคัญไม่\n\nสำหรับหน่วยเก็บกวาดแล้ว มีเพียงสัจธรรมข้อเดียวเท่านั้น\n\nสมควรต้องทำ หรือไม่ควรทำ?\n\nหากสมควรต้องทำ ก็จงอย่าลังเล ลงมือทำไปเลย\n\nอีวานปลดกับดักซ่อนเร้นที่ติดตั้งไว้ในห้องทำงานผู้อำนวยการออกทีละชิ้น กลับมานั่งประจำที่ แล้วเปิดตะเกียงมานาขึ้น\n\nจวบจนดึกดื่นค่อนคืน เสียงจัดเรียงรายงานและสะสางบัญชีรายรับรายจ่ายยังคงดังต่อเนื่องไม่ขาดสายออกมาจากห้องทำงานผู้อำนวยการ\n\n***\n\nเอซิดิสเดินลากเท้าอย่างเหนื่อยล้าข้ามลานสถาบันมุ่งหน้าไปยังม้านั่ง\n\nม้านั่งข้างลานฝึกกลางแจ้งของคณะอัศวินคือแหล่งกบดานประจำที่เธอมักมานั่งกินมื้อกลางวันร่วมกับอิซาเบลล์และยูริอยู่เสมอ\n\nวันนี้เองก็เหน็ดเหนื่อยไม่แพ้กัน ทั้งวิชาเรียนก็แสนยาก เพื่อนร่วมชั้นก็เย็นชา โลกใบนี้ช่างโหดร้าย…\n\nเอซิดิสกอดถุงกล่องข้าวแน่นขณะเดินเข้ามาใกล้ม้านั่ง แล้วจู่ๆ เธอก็ชะงักค้างไป\n\n“อ้าว เอซี่! วันนี้มาเร็วจังเลยนะ!”\n\n“อ่ะ อะไร…? เกิดอะไร…? นี่มันเรื่องอะไรกัน… ตรงนี้…?”\n\n“แหม ทักทายสิ! ตั้งแต่วันนี้เป็นต้นไป เขาจะมานั่งกินมื้อกลางวันกับพวกเราสักพักหนึ่งนะ เพิ่งเคยเจอกันครั้งแรกใช่ไหม? นี่คุณลุงของฉันเอง!”\n\nอิซาเบลล์หัวเราะอย่างร่าเริงพลางตบหลัง ‘เขา’ เบาๆ\n\n“กว่าจะได้กินข้าวด้วยกันสักทีนี่ยากเย็นแสนเข็ญจริงๆ แต่พอวันนี้ฉันเจอตัวเข้าแล้วลองชวนดูว่าอยากมานั่งด้วยกันไหม เขาก็ตกลงทันทีเลยล่ะ ไม่รู้ไปกินอะไรผิดสำแดงมารึเปล่า ถึงได้อุตส่าห์ยอมเสด็จมาให้เห็นเป็นบุญตาขนาดนี้…”\n\nอิซาเบลล์พูดเจื้อยแจ้วอย่างอารมณ์ดีผิดปกติ ทว่าเอซิดิสกลับไม่ได้ยินคำพูดของเธอเข้าหูเลยสักคำ\n\nเธอจ้องมองอีวานตาค้าง ก่อนจะหันไปมองยูริที่นั่งอยู่ข้างๆ เขา\n\n– นี่มันเรื่องอะไรกันเนี่ย?\n\n– ฉันเองก็อยากรู้เหมือนกัน\n\nพวกสตอล์กเกอร์น่ะ โดยปกติต้องเป็นประเภทแอบซุ่มมองจากระยะไกล คอยสนองความปรารถนาอันน่าขยะแขยงของตัวเองแบบลับๆ ล่อๆ แต่เปี่ยมไปด้วยเจตนาร้ายไม่ใช่หรือไง?\n\nแล้วทำไมถึงได้มาอย่างเปิดเผยโจ่งแจ้งขนาดนี้ล่ะ…?\n\nเธอนั่งลงบนม้านั่งอย่างระมัดระวังแล้วหยิบกล่องข้าวออกมา จากนั้นก็จ้องเขม็งใส่อีวานที่กำลังหยิบกล่องข้าวของตนเองออกมาอย่างเงียบเชียบข้างๆ อิซาเบลล์\n\nเบลล่าออกจะชอบหมอนี่ขนาดนั้น แต่ยังคิดจะมาจีบผู้หญิงคนอื่นอีกเหรอ?\n\nแถมวิธีจีบยังเป็นการแอบสะกดรอยตามอีกต่างหาก…? นั่นมันเลวร้ายที่สุดเลยจริงๆ\n\nหลังจากทนรับสายตาของเอซิดิสอยู่ครู่หนึ่ง จู่ๆ อีวานก็เงยหน้าขึ้น\n\nสายตาของทั้งคู่ประสานกันชั่วครู่ และในจังหวะที่เอซิดิสกำลังจะหลุบตาลงด้วยความหวาดหวั่นนั่นเอง…\n\n“…?”\n\nมีบางอย่างร่วงตุ้บลงบนกล่องข้าวของเธอ กล่องข้าวแซนด์วิชไก่อันแสนล้ำค่าของเธอ\n\n“อะ… อะไรเนี่ย?”\n\n“ผัก”\n\nอีวานเอ่ยพลางหยิบกล่องข้าวออกมาแจกจ่ายชุดอาหารที่จัดเตรียมไว้ต่างกันให้แก่อิซาเบลล์และยูริ\n\n“พวกเธอมักจะกินแต่คาร์โบไฮเดรตกับโปรตีน… มีแค่ขนมปังกับเนื้อสัตว์ นิสัยการกินแบบนี้สมดุลทางโภชนาการพังทลายได้ง่าย อย่าลืมกินผัก ผลไม้ แล้วก็ถั่วด้วยล่ะ”\n\nอีวานซึ่งเป็นคนช่างใส่ใจและรอบคอบอธิบายออกมาในแบบที่แม้แต่เด็กๆ ในสังคมยุคก่อนสมัยใหม่ก็เข้าใจได้ไม่ยาก\n\nเขาบริหารสถานเลี้ยงเด็กกำพร้า และสถานเลี้ยงเด็กกำพร้าก็คือสถานที่ที่รับเด็กกำพร้าพ่อแม่มาเลี้ยงดู ป้อนข้าวป้อนน้ำ อบรมสั่งสอน และฟูมฟักให้เติบโตอย่างแท้จริง\n\nการวางแผนโภชนาการ จัดตารางเวลาพักผ่อนและเล่าเรียน ตลอดจนดึงเอาพรสวรรค์ งานอดิเรก และคุณสมบัติเด่นของเด็กๆ ออกมาให้ถึงขีดสุด ล้วนเป็น ‘งานหลัก’ ของอีวาน\n\nอีวานแจกกล่องข้าวให้ยูริกับอิซาเบลล์ด้วยเช่นกันพลางรู้สึกภาคภูมิใจอยู่ลึกๆ\n\n“ว้าว สุดยอดเลยค่ะ! ขอบคุณนะคะคุณลุง! ถ้ารู้ก่อนหน้านี้หนูคงเตรียมอะไรมาด้วยเหมือนกัน จริงสิ หนูทำอาหารเก่งมากเลยนะคะ คุณลุงคิดยังไงกับผู้หญิงที่ทำอาหารเก่งเหรอคะ?”\n\n“ก็คิดว่าเป็นคนที่ทำอาหารเก่ง”\n\n“ฉันอยากจะฆ่าหมอนี่ชะมัด…”\n\nต่างจากอิซาเบลล์ที่ยังร่าเริงกระปรี้กระเปร่า เอซิดิสกลับจ้องมองอีวานด้วยดวงตาที่เปี่ยมไปด้วยความสยดสยอง\n\n‘นี่หมอนี่แอบสอดแนมกระทั่งเมนูที่ฉันกินอยู่ทุกวี่ทุกวันเลยงั้นเรอะ…?’"
    },

      "title": "บทที่ 50",
      "content": "ตรงกันข้ามกับความเข้าใจผิดของใครหลายคน อีวานเป็นคนที่มีเหตุมีผลอย่างยิ่งยวด\n\nเช่นเดียวกับเรื่องที่เป็นสามัญสำนึกอันแจ่มชัดอย่างการที่เหตุก่อการร้ายย่อมเกิดขึ้นในพิธีเปิดภาคเรียนของสถาบันการศึกษา โลกใบนี้เต็มไปด้วยสามัญสำนึกอันแสนจะตายตัว กับเหล่าพลเมืองยุคก่อนสมัยใหม่ผู้คร่ำครึที่ไม่อาจเชื่อถือสามัญสำนึกเหล่านั้นได้\n\nทว่าอีวานไม่ได้ถือโทษโกรธเคืองพวกเขาแต่อย่างใด เพราะตัวเขาคือคนสมัยใหม่ผู้มีอารยธรรมและใจกว้างดุจมหาสมุทร\n\nเขาเพียงแค่พกขวานกับปืนพกติดตัวไปด้วยเท่านั้น\n\nเพราะในสถานการณ์ส่วนใหญ่ การลงมือทำย่อมช่วยคลี่คลายปัญหาได้ดีกว่าการเกลี้ยกล่อมด้วยวาจาเสมอ\n\nและนี่คือจุดเริ่มต้นที่ทำให้อีวานเข้าไปพัวพันกับเหตุการณ์ลอบวางระเบิดกรุงพริตเชนคายา\n\n***\n\nเรื่องราวเริ่มต้นขึ้นด้วยการสะกดรอยตามเอซิดิสเฉกเช่นทุกวัน\n\nอีวานยังคงเดินตามหลังเอซิดิสอยู่ห่างๆ เหมือนเคย การพรางตัวของเขาสมบูรณ์แบบ เป้าหมายปลอดภัยไร้กังวล และไม่มีภัยคุกคามแฝงเร้นอื่นใดอยู่โดยรอบ วันนั้นจึงดูราวกับจะเป็นอีกหนึ่งวันที่แสนธรรมดา\n\n‘อืม…’\n\nเธอกินคุกกี้บ่อยเกินไปแล้ว อีวานหมายมาดไว้ในใจว่าสักวันจะต้องหาเวลาอธิบายให้เธอเข้าใจถึงผลเสียทั่วไปของไขมัน คาร์โบไฮเดรต และน้ำตาลที่แฝงอยู่ในคุกกี้ช็อกโกแลต\n\nเดิมทีเอซิดิสก็มีไขมันส่วนเกินสะสมอยู่ตามบางจุดมากพอตัวอยู่แล้ว สำหรับกวีอาจไม่นับเป็นปัญหาอะไร ทว่าหากวันหน้าเธอจำเป็นต้องคว้าอาวุธขึ้นมาต่อสู้ นั่นย่อมกลายเป็นจุดเสียเปรียบอย่างใหญ่หลวง\n\n‘คงต้องเตรียมแครอตกรอบอบแห้งไว้เป็นของว่างทดแทนสินะ’ อีวานพยักหน้ากับตัวเองเงียบๆ พลางก้าวตามเอซิดิสต่อไป\n\nผ่านไปครู่หนึ่ง อีวานก็สัมผัสได้ถึงสายตาคู่หนึ่งที่จ้องเขม็งมาจึงหันศีรษะกลับไปมอง\n\n“คุณลุงกำลังทำอะไรอยู่คะ?”\n\n“ทำงาน”\n\nอิซาเบลล์ปรากฏตัวขึ้นตรงหน้า ดวงตาของเธอจ้องเขม็งมาทางเขาด้วยแววตาเอาเรื่องอย่างยิ่ง\n\nเธอค่อยๆ เหลือบสายตาเลยไปด้านหน้า และทันทีที่เห็นเอซิดิสอยู่ลิบๆ ตรงแนวสายตาของอีวาน คิ้วเรียวก็ขมวดมุ่นเข้าหากัน\n\nไม่รู้ว่าไปขุ่นเคืองเรื่องใดมา แต่ดูท่าจะมีบางอย่างทำให้เธออารมณ์เสียเสียแล้ว ทว่าเรื่องแค่นี้ไม่จำเป็นต้องกังวลแต่อย่างใด\n\nอีวานบริหารสถานเลี้ยงเด็กกำพร้า ย่อมช่ำชองในการปลอบประโลมเด็กที่อยู่ดีๆ ก็อารมณ์บูดบึ้งขึ้นมาอย่างไม่มีปี่มีขลุ่ยเป็นทุนเดิมอยู่แล้ว อีกอย่าง เขาเองก็ไม่เคยทำอะไรให้อิซาเบลล์ขุ่นเคืองใจเลยสักนิด\n\n“ทำไมคุณลุงถึงมาแอบดูเอซี่ล่ะคะ?”\n\n“…ว่าไงนะ?”\n\n“เอซี่ค่ะ ตอนนี้คุณลุงกำลังถ้ำมองเอซี่อยู่ไม่ใช่เหรอคะ”\n\n“เธอเข้าใจผิดแล้ว”\n\nเขาไม่ได้แอบดูเลยแม้แต่น้อย เขากำลังปฏิบัติหน้าที่อารักขาอย่างเปิดเผยและภาคภูมิต่างหาก\n\nเรื่องเดียวที่อยู่นอกเหนือการคาดการณ์ของเขาก็คือ เหตุใดอิซาเบลล์ซึ่งควรจะนั่งเรียนอยู่ในห้องเรียนเวลานี้ถึงมาโผล่อยู่กลางลานสถาบันได้\n\n“แล้วคาบเรียนของเธอล่ะ?”\n\n“หนูเห็นคุณลุงจากนอกหน้าต่าง… ไม่สิ ตอนนี้เรื่องคาบเรียนของหนูมันสำคัญตรงไหนกันคะ?!”\n\n“…? สำคัญสิ นักเรียนไม่ควรโดดเรียน”\n\nถ้าหล่อนเป็นเด็กในสถานเลี้ยงเด็กกำพร้าของเขาล่ะก็ ป่านนี้เขาคงลากตัวกลับเข้าห้องเรียนไปแล้ว แต่อิซาเบลล์ลืมไปแล้วหรือไรว่าบ้านเกิดของเธอเป็นฝ่ายออกค่าเล่าเรียนให้ทั้งหมด\n\nอีวานเดาะลิ้นเบาๆ ก่อนเอ่ยเตือน\n\n“ถ้าไม่ใช่นักเรียนทุนเต็มจำนวน เธอก็ควรตั้งใจเรียนให้ดีนะ มหาวิทยาลัยเซนต์ยานสก์ค่าเทอมแพงเอาเรื่องอยู่”\n\n“อึก… กะ ก็จริงค่ะ แต่มันใช่เวลามาเปลี่ยนเรื่องไหมคะ?! หนูถามว่าคุณลุงมาถ้ำมองเอซี่ทำไม!”\n\n“นั่นไม่ใช่เรื่องที่เธอต้องมาใส่ใจ”\n\n“อะไรนะคะ…?!”\n\nอิซาเบลล์ทำสีหน้าราวกับถูกทำร้ายจิตใจอย่างแสนสาหัส ช่างเป็นปฏิกิริยาที่ไม่อาจเข้าใจได้โดยแท้ แค่บอกให้ใส่ใจการเรียนมากกว่างานรักษาความปลอดภัยของเขา เหตุใดจึงต้องทำหน้าเจ็บปวดปานนั้น\n\nทว่าอีวานเป็นคนใจดี จึงรู้วิธีปลอบประโลมความรู้สึกของเด็กสาววัยว้าวุ่น (ไม่ใช่วัยนั้นสักหน่อย) เป็นอย่างดี\n\nสิ่งที่เด็กวัยรุ่นผู้กำลังสับสนต้องการมากที่สุดยามเผชิญกับปัญหาที่อธิบายไม่ได้ ก็คือเวลาส่วนตัวในการอยู่ลำพัง (ไม่ใช่เลยสักนิด)\n\nในฐานะผู้ใหญ่ผู้เปี่ยมด้วยความเข้าใจและไม่อยากจู้จี้ไล่ให้เธอรีบกลับเข้าห้องเรียน อีวานจึงพยักหน้าอย่างนุ่มนวลแล้วก้าวถอยหลังออกมา\n\n“เดี๋ยวสิคะ จะไปไหนน่ะ! อย่างน้อยก็อธิบายมาหน่อยสิคะ! แก้ตัวอะไรสักอย่างก็ได้! โธ่เว้ย!!”\n\nอีวานปลีกตัวหายวับไปในพริบตา ทิ้งให้อิซาเบลล์ยืนตระหนกจนทำอะไรไม่ถูก เธอไม่มีแก่ใจแม้แต่จะวิ่งไล่ตาม ได้แต่จ้องมองแผ่นหลังที่ห่างออกไปอย่างเหม่อลอย ก่อนจะหัวเราะออกมาอย่างหดหู่\n\n“ฉันต้องจับหมอนั่นมัดไว้ที่ไหนสักแห่งจริงๆ แล้วใช่ไหมเนี่ย? สงสัยต้องจับมัดแล้วสอนวิธีคุยกับคนอื่นให้รู้เรื่องทีละคำเสียหน่อยแล้วมั้ง…”\n\nระหว่างนั่งเรียนอยู่ เธอบังเอิญเหลือบไปเห็นเขาผ่านทางหน้าต่างจึงแอบย่องออกมาดู\n\nและภาพที่เห็นก็คือเขากำลังเดินตามหลังเอซิดิสไปพลาง จดอะไรบางอย่างลงในสมุดบันทึกไปพลาง\n\nเมื่อนึกถึงนิสัยของเขา เธอก็พอเดาได้ว่าเขาคงกำลังทำงานอะไรสักอย่างอยู่ แต่ถึงอย่างนั้นก็เถอะ\n\nแต่ถึงอย่างนั้น…!\n\n“นี่ฉันอุตส่าห์รุกเข้าหาขนาดนี้ แต่เขากลับมาแอบตามเพื่อนของฉันเนี่ยนะ…?”\n\nอิซาเบลล์หัวเราะ “หึหึ” ในลำคอ ก่อนจะยกมือแห้งๆ ขึ้นลูบหน้าลูบตาอยู่หลายครั้ง\n\nเอาล่ะ\n\nตอนนี้เธอมีเป้าหมายที่ชัดเจนแล้ว\n\n‘ขอบเขตของผู้เหนือมนุษย์’ งั้นเหรอ? ใช่สิ นั่นหมายความว่าฉันต้องก้าวเข้าสู่ขอบเขตนั้นให้ได้ ถึงจะพอประมือกับคนบ้าคนนั้นได้สินะ?\n\nเธอจะต้องก้าวข้ามเข้าสู่ขอบเขตนั้นให้เร็วที่สุดเท่าที่จะทำได้ ฝึกฝนจนถึงระดับที่สามารถเอาชนะผู้ชายคนนั้นให้จงได้\n\nจับกุมและสยบเขาให้สิ้นฤทธิ์ มัดตัวเอาไว้ ค่อยๆ ทำ อย่างละเอียดถี่ถ้วน แล้วสั่งสอนสามัญสำนึกให้ทีละข้อๆ\n\nถือเสียว่าเป็นการบำเพ็ญประโยชน์ต่อสังคม ใช่แล้ว ต้องตั้งจิตด้วยความรู้สึกของการบำเพ็ญประโยชน์\n\nถ้าไม่ใช่ฉัน แล้วใครหน้าไหนจะยอมรับภาระดูแลคนแก่น่าสงสารผู้โดดเดี่ยวคนนี้ (ไม่แก่เลยสักนิด) กันล่ะ?\n\n***\n\nวันนี้เอซิดิสยังคงเดินเตร็ดเตร่ไปมาอย่างไร้จุดหมายเพราะหาห้องซ้อมรวมวงไม่เจออีกเช่นเคย\n\nวิชาซ้อมวงออร์เคสตราซึ่งมีการประเมินผลการบรรเลงแบบกลุ่ม คือคาบเรียนที่ชวนสยดสยองที่สุดสำหรับเธอ เพราะไม่มีใครเต็มใจรับเธอเข้ากลุ่มเลยสักคน\n\nด้วยเหตุนี้ เธอจึงได้แต่เดินคอตกไปตามทางอย่างหงอยเหงา\n\n“ห้องซ้อม 154 ขาดสมาชิกอยู่หนึ่งคนนะ”\n\n“…?!”\n\nจู่ๆ อีวานก็โผล่มายืนข้างกายและขยับเข้ามาใกล้\n\n“เฮือก?!”\n\n“วิชาของเธอคือ [ฝึกซ้อมรวมวง 1] ถ้าขาดเรียนไปมากกว่านี้ สถานการณ์จะไม่ย่ำแย่เอาเหรอ?”\n\n“ระ รู้ได้ยังไงคะเนี่ย…?”\n\n“ตอนนี้ไม่ใช่เวลามามัวกังวลเรื่องนั้นหรอก”\n\nอีวานล้วงสมุดบันทึกเล่มน่าสงสัยออกมาจากกระเป๋าเสื้อแล้วเอ่ยด้วยน้ำเสียงเรียบขรึม\n\n“ผลสอบกลางภาค: ฝึกซ้อมรวมวง D, การประสานเสียง C, การอ่านร้องโน้ตและฝึกโสตทักษะ B+, ดนตรีแชมเบอร์ C, การรวมวงเครื่องสาย D, การสอดประสานทำนอง B+ โดยรวมแล้วคะแนนภาคทฤษฎีดีกว่าภาคปฏิบัติพอสมควร แต่เกรดเฉลี่ยอยู่แค่ระดับสองกลางๆ แบบนี้ถือว่ามีปัญหานะ”\n\n“อะ… เอ่อ…”\n\n“ทำไมถึงเลือกสมัครเข้าคณะดุริยางคศิลป์ล่ะ?”\n\nอีวานจ้องมองเอซิดิสด้วยดวงตาลุ่มลึก\n\nเพราะไม่เคยคาดคิดมาก่อนว่าจะได้ยินคำถามเช่นนี้จากปากของผู้ชายที่เธอปักใจคิดว่าเป็นแค่โรคจิตสะกดรอยตาม เอซิดิสจึงกลืนน้ำลายลงคออย่างฝืดเฝื่อนแล้วก้มหน้าลง\n\nทำไมน่ะเหรอ? ก็… ก็เพราะเธออยากเข้ามาเรียน\n\nเพราะเธออยากจับเครื่องดนตรี ไม่ใช่จับอาวุธ\n\nเอซิดิสขยับปลายนิ้วไปมาอย่างประหม่าขณะเรียบเรียงถ้อยคำ\n\n“คะ เครื่องดนตรี… เครื่องดนตรีเป็นสะพานที่เชื่อม… เชื่อมต่อผู้คนเข้าด้วยกันค่ะ…”\n\n“ยอดเยี่ยม”\n\nอีวานคลี่ยิ้มออกมาอย่างอ่อนโยน\n\nเอซิดิสเบิกตากว้างด้วยความตกตะลึงเมื่อได้เห็นรอยยิ้มที่ไม่คาดฝันนั้น\n\nเธอจ้องมองใบหน้าของอีวานอย่างเหม่อลอย ก่อนจะสะดุ้งเฮือกแล้วพึมพำออกมาอย่างเก้ๆ กังๆ\n\nน้ำเสียงทุ้มต่ำแหบพร่านั้น และดวงตาเรียบร้อยที่โค้งลงอย่างนุ่มนวลคู่นั้น\n\nดูคุ้นเคยเหลือเกิน\n\nเธอเผลอยกมือข้างหนึ่งขึ้นโดยไม่รู้ตัว กางฝ่ามือออกช้าๆ\n\nเอื้อมไปบังหนวดเคราหนารุงรังอันแสนสะดุดตาของเขาเอาไว้ เหลือช่องว่างให้มองเห็นเพียงสันจมูกและดวงตาทั้งสองข้างเท่านั้น\n\nผ่านช่องว่างนั้นเอง ดวงตาที่สั่นระริกของเอซิดิสก็สบเข้ากับสายตาอันลุ่มลึกของอีวานพอดี\n\n“หรือว่า…? ไม่สิ แต่คุณลุงตายไปแล้วนี่นา…”\n\n“ดูแลสุขภาพด้วยนะ”\n\nด้วยความเป็นคนยึดหลักประสิทธิภาพ อีวานจึงไม่เสียเวลามาคล้อยตามอารมณ์อ่อนไหวของเอซิดิส\n\nเด็กคนนี้กำลังคิดอะไรอยู่นั้นเป็นเรื่องรองลงมา มีสิ่งที่สำคัญกว่าตั้งอยู่ตรงหน้าไม่ใช่หรือไร\n\nอย่างไรเสีย เธอก็ต้องรีบเข้าเรียนเพื่อไม่ให้มีชั่วโมงขาดเรียนเพิ่มจนฉุดเกรดอันย่ำแย่ให้ตกต่ำลงไปกว่านี้\n\nอีวานนำทางเอซิดิสไปยังห้องซ้อมรวมวงของอาคารหลักคณะดุริยางคศิลป์ ก่อนจะยื่นกล่องอาหารกลางวันให้แก่เอซิดิสที่ยังคงยืนเหม่อลอยพึมพำไม่หยุด\n\nมันคือกล่องขนมที่บรรจุแครอตกรอบอบแห้งไว้เต็มกล่อง\n\n“ดูแลสุขภาพด้วยล่ะ ไอนาร์คงเป็นห่วงสุขภาพของเธอมากกว่าผลการเรียนแน่ แต่ก็ไม่ได้หมายความว่านักเรียนจะละเลยการเข้าเรียนได้นะ สายแล้ว รีบเข้าไปข้างในเถอะ”\n\nอีวานดันหลังเอซิดิสที่ยังพูดตะกุกตะกักให้เข้าไปในห้องซ้อมรวมวงเครื่องสายแล้วก้มลงดูนาฬิกาข้อมือ\n\nกว่าวิชาซ้อมรวมวงจะเลิก คาบเรียนของมอร์ดก็น่าจะจบลงพอดี ดังนั้นหลังจากนี้จึงไม่จำเป็นต้องคอยคุ้มกันเอซิดิสอีกต่อไป\n\nท่าทางจะยุ่งขึ้นเสียแล้ว\n\nอีวานแย้มยิ้มจางๆ พลางก้าวเดินจากมา ตอนนี้เขาแค่ต้องอยู่ดูแลความปลอดภัยให้อิซาเบลล์ในช่วงกลางคืนก่อนกลับบ้านเท่านั้น\n\nมันเป็นวันธรรมดาวันหนึ่งเหมือนอย่างที่เคยเป็น\n\nณ วันที่สามของวันอันแสนธรรมดาเช่นนั้น\n\nคืนวันอันแสนสงบสุขของเจ้าหน้าที่รักษาความปลอดภัยผู้คอยคุ้มกันเอซิดิสในยามกลางวัน และออกลาดตระเวนรอบบ้านพักของอิซาเบลล์ในยามกลางคืน\n\nได้สิ้นสุดลงด้วยเหตุวินาศกรรมระเบิดครั้งใหญ่พร้อมกัน ณ ธนาคารกลางพริตเชนคายา โรงละครทรงกลมซาเทรา มหาวิทยาลัยเซนต์ยานสก์ มหาวิหารเซนต์เชเรห์ตา และสถานีตำรวจกลางพราเชนโกเหนือ\n\nค่ำคืนนั้น พริตเชนคายาลุกไหม้สว่างจ้าเป็นสีขาวโพลน\n\n***\n\nอีวานก้าวเดินอย่างเชื่องช้า พลางรับรู้ถึงน้ำหนักของปืนพกที่เหน็บอยู่ในกระเป๋าเสื้อ\n\nคืนนี้เป็นคืนที่สามแล้วที่เขาออกเดินลาดตระเวนบริเวณหน้าบ้านของอิซาเบลล์\n\n“อืม”\n\nหลังจากเดินวนรอบตัวบ้านครบสามรอบ เขาก็ตระหนักได้ว่าตนเองเดินสวนกับคนเดินถนนคนเดิมเป็นครั้งที่สามแล้ว\n\nในระยะห่างจากบ้านของอิซาเบลล์พอๆ กัน ทว่าเปลี่ยนจุดยืนไปเรื่อยๆ\n\n‘จุดศูนย์ถ่วงเอนเอียงไปทางขวา ถนัดขวา อาวุธที่เอวซ้ายคือปืนพก และดูจากช่วงอกที่นูนผิดปกติ แสดงว่าสวมเสื้อเกราะกันกระสุนเอาไว้ข้างใน’\n\nอีวานเดินผ่านชายคนนั้นไปอย่างเป็นธรรมชาติก่อนเบนสายตาหลบ\n\n‘การที่ต้องสวมเสื้อเกราะกันกระสุน หมายความว่าไม่มีการตรวจจับแนววิถีกระสุน หมอนี่เป็นแค่พวกปฏิบัติการระดับล่าง’\n\nชายต้องสงสัยกวาดตามองไปรอบๆ ก่อนจะกลืนหายกลับเข้าไปในความมืดมิดของท้องถนน\n\nอีวานค่อยๆ นับหนึ่งถึงสิบในใจอย่างเชื่องช้าแล้วหลับตาลงอย่างเงียบเชียบ\n\nการสะกดรอยตามเป้าหมายที่กำลังตื่นตัวสูงจากทางด้านหลังตรงๆ เป็นการทำงานของพวกมือสมัครเล่น สายลับที่ผ่านการฝึกฝนมาอย่างดีจะไม่มีวันสะกดรอยตามใครด้วยวิธีนั้นเด็ดขาด\n\nพลังเวทหมุนเวียนปั่นป่วนอยู่ภายในร่างของอีวานอย่างช้าๆ พร้อมความรู้สึกคล้ายกำลังออกแรงดึงมัดเส้นประสาทดุจสายโซ่\n\nครั้นเขาลืมตาขึ้นมาอีกครั้ง เขาก็ได้ก้าวเข้าสู่ห้วงการรับรู้เวลาที่ใบไม้ร่วงหล่นลอยคว้างอย่างเชื่องช้าเสียแล้ว\n\n—สูด…\n\nเขาสูดลมหายใจเข้าอย่างเนิบนาบและล้ำลึก ประสาทสัมผัสที่ถูกกระตุ้นจนตื่นตัวเริ่มแยกแยะกลิ่นต่างๆ ที่ล่องลอยอยู่ในอากาศออกมาทีละชั้น\n\nว่ากันว่าหนูสามารถจำแนกสัตว์ทุกชนิดบนลาดเขาได้จากกระแสลมที่พัดโชยผ่าน นั่นคือกลไกการรับกลิ่นตามธรรมชาติของสัตว์เดรัจฉาน ประสาทสัมผัสที่ล้ำหน้ากว่าความหนาแน่นของเซลล์เยื่อบุรับกลิ่นในมนุษย์อย่างเทียบไม่ติด\n\nทว่าผู้ก้าวข้ามขีดจำกัดสามารถเข้าใกล้ขอบเขตนั้นได้อย่างไร้ที่สิ้นสุด มันคือความสามารถในการบังคับปลุกเร้าอวัยวะรับสัมผัสโดยตรง และวิเคราะห์อวัยวะประสาทแต่ละส่วนที่ตื่นตัวขึ้นอย่างละเอียดลออที่สุด\n\nมิใช่ผู้ก้าวข้ามขีดจำกัดทุกคนจะใช้ประสาทสัมผัสนี้ได้ มันไม่ใช่อาณาเขตของพรสวรรค์ หากแต่เป็นเรื่องของการฝึกฝน ผู้ที่ปลุกพลังระดับผู้ก้าวข้ามขีดจำกัดส่วนใหญ่ล้วนทุ่มเทแรงกายแรงใจทั้งหมดไปกับการเสริมสมรรถนะด้านการต่อสู้\n\nแต่อีวานไม่เป็นเช่นนั้น เขาเชี่ยวชาญเฉพาะทางในด้านนี้ยิ่งกว่าสมรรถนะด้านการต่อสู้เสียอีก\n\nหรือหากจะกล่าวให้แม่นยำยิ่งกว่านั้น\n\nเขาได้ขัดเกลาขีดความสามารถในแขนงนี้จนเหนือล้ำกว่าผู้ก้าวข้ามขีดจำกัดคนอื่นใดทั้งปวง\n\nการแกะรอยและลอบสังหารเป้าหมาย การรบในพื้นที่ขนาดเล็ก การเข้ายึดจุดยุทธศาสตร์ และการก่อกวนขัดขวางการลาดตระเวนของข้าศึก\n\nเขาคือชายผู้ภาคภูมิใจว่าตนเองไร้เทียมทาน แม้กระทั่งในหมู่ยอดฝีมือคัดสรรของหน่วยลาดตระเวนที่ได้ชื่อว่าแข็งแกร่งที่สุดแห่งสหราชอาณาจักรก็ตาม\n\n—ผ่อน…\n\nอีวานค่อยๆ ผ่อนลมหายใจออกแล้วก้าวเท้าไปข้างหน้า\n\nกลิ่นอายนับไม่ถ้วนที่ล่องลอยมากับสายลมในเมืองซึ่งพัดผ่านซอกตึกอาคาร\n\nประสาทสัมผัสที่พัฒนาจนถึงขีดสุดชักนำให้เกิดภาวะรับรู้เชื่อมโยงข้ามประสาทสัมผัส บัดนี้อีวานกำลังก้าวเดินไปพร้อมกับมองดู ‘เส้นสายแห่งรอยกลิ่น’ ที่ส่องสว่างเรืองรองท่ามกลางความมืดมิด\n\nอย่างเชื่องช้า ไม่เร่งร้อน\n\nตรงดิ่งไปยังเหยื่อของตน\n\nภายในกรุงพริตเชนคายาแห่งนี้ ไม่เคยมีผู้ใดที่เขาเผชิญหน้าแม้เพียงครั้งเดียวแล้วจะสามารถหลุดรอดจากประสาทสัมผัสของเขาไปได้\n\nอีวานก้าวเดินด้วยฝีเท้าอันมั่นคง\n\nเฉกเช่นอสรพิษที่ซุ่มซ่อนกายอยู่ในเงามืด รอคอยอย่างใจเย็นจนกว่าเหยื่อจะคืบคลานเข้ามาติดกับในเงื้อมมือของตน"
    },

      "title": "บทที่ 51",
      "content": "อาวุธที่ถูกจัดหมวดหมู่เป็น “อาวุธดินปืน” — ทั้งปืนและระเบิด — ล้วนเป็นสิ่งที่ถูกดูแคลนอย่างยิ่งในโลกแฟนตาซียุคก่อนสมัยใหม่แห่งนี้\n\nพวกมันถูกขนานนามว่าเป็น “อาวุธของคนจน” ซึ่งเป็นความจริงแท้ ในโลกที่มีมานาและสามารถตรวจจับแนววิถีกระสุนได้ อาวุธยิงระยะไกลย่อมไม่มีวันถูกสร้างขึ้นจากวัสดุชั้นดีหรือผ่านฝีมือช่างชั้นครู\n\nท้ายที่สุดแล้ว พวกมันก็เป็นเพียงอาวุธพื้นๆ ที่คนฝีมือดาดๆ ใช้ยิงใส่คนฝีมือดาดๆ ด้วยกันเอง กระสุนส่วนใหญ่ยิงพลาดเป้า ไร้ซึ่งความโรแมนติก ไร้เกียรติยศอัศวิน และไร้ซึ่งความยุติธรรม — มีเพียงเลือดที่สาดกระเซ็นไปทั่วทุกหนแห่ง\n\nดังนั้น เพียงแค่พกปืนก็เป็นการประกาศระดับฝีมือของตัวเองออกมาแล้ว และหากถึงขั้นต้องใช้ระเบิด ก็แปลว่าพ่ายแพ้ไปเรียบร้อยแล้ว\n\nวัตถุดิบที่จำเป็นต่อการผลิตระเบิดเวทมนตร์คุณภาพดีในปริมาณที่มากพอ ล้วนถูกควบคุมเป็นทรัพยากรยุทธศาสตร์ในระดับประเทศ จึงแทบเป็นไปไม่ได้เลยที่จะจัดเตรียมให้มากพอจะเผาผลาญอาคารสักหลังจนราบเป็นหน้ากลองได้\n\nอย่างเก่งก็สร้างได้เพียงความเสียหายแก่ชีวิตผู้คนเพียงเล็กน้อย แล้วจะมีอันใดให้ต้องหวาดกลัวเล่า?\n\nอาจมีคนบาดเจ็บล้มตายหลักสิบคน ทว่าในทางกลับกัน นั่นก็หมายความว่ากำลังคนและทรัพยากรที่อุตส่าห์วางหมากฝังตัวไว้อย่างประณีตทั้งหมด ต้องถูกใช้สอยไปอย่างสูญเปล่าเพื่อแลกกับผลลัพธ์อันแสนต่ำเตี้ยเรี่ยดินเช่นนั้น\n\nอย่างไรก็ตาม เช่นเดียวกับที่แม้แต่มีดทำครัวธรรมดาๆ ก็ยังทำร้ายคนได้หากแทงลงไปบนร่างกาย อาวุธปืนซึ่งไร้ค่าต่อหน้าเหล่าผู้เหนือมนุษย์ ก็ยังคงเป็นมัจจุราชคร่าชีวิตสำหรับพลเรือนทั่วไปอยู่ดี\n\nเครื่องมือสังหารอันแสนเรียบง่ายที่หว่านโปรยความตายได้เพียงแค่เหนี่ยวไกนี้ มักมอบความกล้าหาญและความรู้สึกฮึกเหิมอันไม่อาจอธิบายได้ให้แก่ผู้ถือครองอยู่เสมอ\n\n“แฮ่ก… แฮ่ก…”\n\n“รีบกลับมาทำไม? แกควรจะเฝ้าอยู่ที่จุดสังเกตการณ์สิ!”\n\n“ไม่เอาด้วยหรอก… จะให้รับมือกับไอ้อัศวินที่เดินตรวจตราไปมาไม่หยุดหย่อนนั่นได้ยังไงกัน? ขืนเถลไถลอยู่แถวนั้นนานกว่านี้ ป่านนี้คงโดนแทงเหมือนคราวก่อนไปแล้ว!”\n\n“ไอ้ขี้ขลาดเอ๊ย… อัศวินที่บ้านหลังนั้นตามแกมาไกลไม่ได้หรอก เพราะมันต้องคอยคุ้มกันเด็กนั่น มีอะไรก็แค่เผ่นหนีสิวะ!”\n\n“งั้นแกก็ลองไปทำเองดูสิ แกยังไม่เคยเห็นกับตานี่ว่าไอ้เวรนั่นมันเหวี่ยงดาบระยะประชิดได้น่ากลัวแค่ไหน”\n\nชายคนนั้นบ่นอุบพลางตัวสั่นเทา หน้าที่ของเขาคือการเฝ้าจับตาดูบ้านพักที่อิซาเบลล์ บุตรสาวของผู้กล้า อาศัยอยู่\n\nต่อให้เจ้าหล่อนจะมีพรสวรรค์ล้นฟ้าเพียงใด สุดท้ายก็เป็นแค่เด็กผู้หญิงตัวเล็กๆ คนหนึ่ง การสะกดรอยหรือสอดแนมย่อมไม่ใช่เรื่องยาก\n\nทว่าพอมีผู้คุ้มกัน เรื่องราวก็เปลี่ยนไปเป็นคนละเรื่อง และถ้ายิ่งองครักษ์คนนั้นเป็นถึงอัศวินที่ผ่านการฝึกฝนมาอย่างช่ำชอง ปัญหาก็ยิ่งใหญ่หลวงขึ้นเป็นทวีคูณ\n\nลูกกระสุนไร้ความหมายต่อหน้าอัศวิน นี่คือสามัญสำนึกพื้นฐานที่รู้กันทั่ว\n\nการบุกเข้าไปเผชิญหน้ากับคนพรรค์นั้นโดยมีแค่ปืนพก เท่ากับเดินดุ่มๆ เข้าไปในระยะสังหาร ไม่ต่างอะไรกับการยื่นหัวเข้าไปในปากสิงโต\n\n“ว่าแต่ทำไมเบื้องบนถึงยังไม่ส่งข่าวอะไรมาอีก ทั้งที่ใกล้วันลงมือขนาดนี้แล้ว? ฉันทนไม่ไหวแล้วนะเว้ย นี่มันล่อไปทั้งสัปดาห์แล้วนะ”\n\n“ท่านดิโอนาร์จะเดินทางมาถึงพริตเชนคายาวันนี้หรือไม่ก็พรุ่งนี้ เห็นว่าคงจะเริ่มลงมือกันมะรืนนี้แหละ”\n\n“ได้ยินชื่อนี้มาตั้งหลายรอบแล้ว หมอนั่นจะมาจริงๆ เหรอ?”\n\n“ใกล้ถึงแล้วล่ะ เห็นว่าช่วงนี้ด่านตรวจชายแดนเข้มงวดมาก เลยต้องเดินเท้ามาตลอดทาง”\n\n“ให้ตายเถอะ จากโดรอันมาถึงนี่เนี่ยนะ?”\n\nชายทั้งสองก้าวเดินลัดเลาะไปตามซอกตรอกซอยพลางกระซิบกระซาบ การยืนยันตำแหน่งของอิซาเบลล์ในเวลานี้ไม่ใช่เรื่องสำคัญอะไร ขอเพียงวันนี้นางไม่ได้ย้ายหนีไปที่อื่นกะทันหันก็พอแล้ว\n\nขอแค่เจ้าหล่อนยังอยู่ที่นั่นในวันลงมือก็เพียงพอ\n\n“เข้าใจล่ะ ดิโอนาร์ เอริกสันสินะ”\n\nชายสองคนที่กำลังเดินผ่านตรอกเปลี่ยวร้างถึงกับแข็งทื่อค้างอยู่กับที่\n\nสายตาของทั้งคู่สบประสานกัน\n\n—พวกเราโดนสะกดรอยตามงั้นเรอะ?!\n\n—ไม่นะ ฉันระวังตัวสุดขีดแล้ว\n\n—แล้วไอ้เวรนี่มันเรื่องบ้าอะไรกันวะ ไอ้โง่เอ๊ย!\n\nชายทั้งสองสื่อสารกันทางสายตา ก่อนจะออกตัววิ่งหนีทันที\n\nชายแปลกหน้าคนนี้จะเป็นใครไม่สำคัญ มีเพียงสองสิ่งที่สลักสำคัญยิ่งยวด:\n\nข้อเท็จจริงที่ว่าชายแปลกหน้ารู้จักชื่อ “ดิโอนาร์ เอริกสัน” และความจริงที่ว่าพวกเขาไม่ทันรู้ตัวเลยสักนิดว่ามีคนย่องเข้ามาประชิดในระยะที่ได้ยินบทสนทนาชัดเจนขนาดนี้\n\nเช่นนั้น ชายลึกลับผู้นี้จะต้องเป็นยอดฝีมือเป็นแน่ ในสถานการณ์เช่นนี้ กลยุทธ์ของผู้อ่อนแอย่อมมีเพียงหนึ่งเดียวเสมอ\n\n“บัดซบ!”\n\n—เปรี้ยง!!\n\nชายที่วิ่งนำอยู่ข้างหน้าล้วงลูกแก้วขนาดเล็กออกจากกระเป๋าเสื้อแล้วเขวี้ยงลงพื้น ก่อนจะพุ่งทะยานไปทางปากตรอก\n\nลูกแก้วระเบิดออก ส่งควันหนาทึบฟุ้งตลบไปทั่วทั้งตรอก มันคือระเบิดควันราคาถูกที่ไร้สารพิษ\n\nอีวานคลี่ยิ้มบางๆ แล้วเดินตามชายทั้งสองที่กำลังหลบหนีไป\n\nเขาไม่เร่งรีบ เพราะรู้ดีว่าเมื่อเทียบระหว่างผู้แข็งแกร่งที่วิ่งไล่กวดเพื่อจับกุม กับผู้แข็งแกร่งที่ค่อยๆ เดินตามมาทันทั้งที่ความเร็วต่างกันลิบลับ อย่างหลังย่อมปลูกฝังความหวาดกลัวได้ลึกซึ้งกว่ามาก\n\nการสอบปากคำเป็นศิลปะอันละเอียดอ่อน การข่มขู่ ทรมาน และขู่เข็ญอย่างสุ่มสี่สุ่มห้าล้วนเป็นหมากที่เลวร้ายซึ่งบั่นทอนคุณภาพของข้อมูล\n\nการรวบรวมข่าวสารที่แม่นยำเริ่มต้นจากการทลายรากฐานทางจิตใจของเป้าหมายให้พังครืนลงเสียก่อน\n\nอีวานยังคงก้าวเดินฝ่ากลุ่มควันมุ่งหน้าไปในทิศทางที่ชายทั้งสองหลบหนี\n\n—สูด…\n\n—ผ่อน\n\nเขาสูดลมหายใจเข้าลึกๆ พลางหวนรำลึกถึงวันวาน\n\n***\n\nเอซิดิสนั่งเหม่อมองท้องฟ้ายามราตรีจากระเบียงห้องนอน\n\n“คุณลุงตายไปแล้วนี่นา”\n\nแม้แต่ท่านพ่อของเธอยังร่วมไว้อาลัยต่อการจากไปของคุณลุง ถึงแม้สถานการณ์ทางการเมืองอันน่าเคลือบแคลงในตอนนั้นจะทำให้ท่านพ่อไม่อาจไปร่วมพิธีศพด้วยตัวเองได้ แต่พอกลับมาท่านพ่อก็เอาแต่นั่งร่ำสุราด้วยสีหน้าหม่นหมองอยู่นานทีเดียว\n\nเธอยกมือขึ้นอย่างเหม่อลอย\n\nค้างไว้แถวระดับที่จะบังริมฝีปากได้พอดิบพอดีอย่างลังเล\n\n“แต่ถึงอย่างนั้น”\n\nนอกจากหนวดเคราแล้วก็ดูคล้ายกันอยู่หรอก ทว่าเพราะมัวแต่หวาดกลัวจนไม่กล้าจ้องมองตรงๆ บางทีเขาอาจจะเป็นคนละคนกันโดยสิ้นเชิงก็ได้\n\nดวงตาสีฟ้าสดใสอันเจิดจ้าคู่นั้น แววตาอันเรียบนิ่ง คิ้วและสันจมูกคมสัน\n\nใช่ พวกเขาก็ดูคล้ายกันจริงๆ\n\nหรือว่าบางที…\n\n“ไม่หรอก”\n\nเอซิดิสส่ายศีรษะ นี่มันเป็นความคิดที่ชั่วร้ายเกินไปแล้ว\n\nคุณลุงอีวานสิ้นชีพในฐานะนักรบผู้ยิ่งใหญ่ เขาสละชีพหลังจากสังหารเจ็ดขุนพลมังกร และการเสียสละของเขาก็ช่วยให้ลูกน้องจำนวนหนึ่งรอดชีวิตกลับมาได้\n\nนั่นคือวีรกรรมอันน่าเหลือเชื่อ เหล่าเจ็ดขุนพลมังกรล้วนเป็นศัตรูตัวฉกาจที่แม้แต่ปาร์ตี้ผู้กล้ายังต้องรับมือด้วยความระมัดระวัง\n\nการเอาบุรุษผู้สูงส่งเช่นนั้นมาสับสนกับใครอีกคนเพียงเพราะ “หน้าตาคล้ายกัน” ย่อมเป็นการดูหมิ่นเกียรติของท่านอย่างร้ายกาจ\n\nยังไงซะ คุณลุงอีวานไม่มีวันไปเกี้ยวพาราสีอิซาเบลล์ นอนกับอาจารย์เอนริเก้ แล้วยังแอบสะกดรอยตามนักศึกษาเพื่อสนองรสนิยมทางเพศของตัวเองไปพร้อมๆ กันได้หรอก (เรื่องนั้นมันแน่นอนอยู่แล้ว)\n\nเอซิดิสรู้สึกผิดต่อการนำคนต่ำทรามพรรค์นั้นมาเทียบเคียงกับคุณลุงอีวาน จึงก้มศีรษะลงอย่างสำรวม\n\nศาสนาของโดรอันนับถือ “เทพแห่งแสง” ซึ่งเป็นศาสนาหลักของสหราชอาณาจักร ทว่ามีคติความเชื่อเรื่องโลกหลังความตายที่แปรเปลี่ยนไปตามขนบธรรมเนียมท้องถิ่นอย่างประหลาด\n\nชาวโดรอันเชื่อว่านักรบผู้ยิ่งใหญ่จะได้ร่วมต่อสู้ชั่วนิรันดร์เคียงข้าง “เทพแห่งแสง” หลังจากความตาย\n\nเนื่องจากศัตรูของแสงสว่างคือความมืดมิดเสมอ เหล่านักรบจึงกวัดแกว่งดาบเข้าห้ำหั่นกับความมืดในยามค่ำคืนแทนองค์เทพเจ้า\n\nร่องรอยแห่งการต่อสู้เหล่านั้นคือดวงดาว ดวงดารานับไม่ถ้วนบนฟากฟ้าล้วนคือเหล่านักรบผู้ล่วงลับไปอยู่เคียงข้างพระเจ้า\n\nเช่นนั้น ดวงดาวของคุณลุงอีวานเองก็คงทอแสงอยู่ ณ แห่งหนใดบนฟากฟ้าเบื้องบนเช่นกัน เอซิดิสจึงก้มศีรษะลงพลางกระซิบอย่างนอบน้อม\n\n“คุณลุงคะ หนูคิดถึงคุณลุงจังเลยค่ะ ช่วงนี้ยิ่งคิดถึงมากกว่าเดิมอีก หนูหยิบเครื่องดนตรีขึ้นมาเล่นตามที่คุณลุงบอกแล้วนะคะ ถึงจะไม่ง่ายเลย แต่หนูก็พยายามอย่างเต็มที่ค่ะ มีเพื่อนตั้งหลายคนด้วย หนูสบายดีค่ะ”\n\nเพราะดวงดาวไม่ได้ปรากฏขึ้นในตอนกลางวัน คุณลุงก็เลยคงไม่รู้สินะคะว่าเกิดอะไรขึ้นบ้างในยามกลางวัน\n\n“เพราะฉะนั้น ช่วยเฝ้ามองหนูด้วยนะคะ พอหนูเรียนจบ พอหนูเก่งมากพอเมื่อไร หนูจะไปบรรเลงมหากาพย์ให้คุณลุงฟังที่หน้าหลุมศพเองค่ะ จะเล่าให้ฟังว่าการเสียสละของคุณลุงไม่สูญเปล่าเลยสักนิด และโลกใบนี้ยังคงงดงามอยู่ได้เพราะเหตุนั้นค่ะ”\n\nเธอสูดน้ำมูก กอดเครื่องดนตรีไว้แนบอกด้วยดวงตาที่เอ่อคลอไปด้วยหยาดน้ำตา\n\nเธอไม่กล้าแม้แต่จะบรรเลงเพลงในยามค่ำคืน ไม่อาจปล่อยให้คุณลุงได้ยินฝีมืออันหยาบกระด้างและยังไม่เอาไหนของตนเองได้\n\nดังนั้น เอซิดิสจึงเช็ดน้ำตาออกอย่างเด็ดเดี่ยวแล้วลุกขึ้นยืน\n\nเรื่องราวชวนสับสนเมื่อตอนกลางวันทำให้เธอข่มตาหลับลงแต่หัวค่ำไม่ลง ไหนๆ พรุ่งนี้ก็เป็นวันหยุดไม่มีเรียนอยู่แล้ว เธอจึงคิดว่าจะออกไปเดินเล่นรับลมยามค่ำคืนสักหน่อย\n\n“คุณลุงมอร์ดคะ! ออกไปข้างนอกกันหน่อยเถอะค่ะ!”\n\n“ไปไหนล่ะ?”\n\n“แค่ออกไปเดินเล่นข้างนอกเฉยๆ ค่ะ!”\n\n“เออ เอาสิ”\n\nมอร์ดซึ่งกำลังเช็ดบำรุงรักษาอาวุธอยู่ที่ชั้นล่างยักไหล่แล้วลุกขึ้นยืน\n\nทั้งสองสวมใส่เสื้อผ้าลำลองเดินออกไปสู่ท้องถนนยามค่ำคืนอันอบอุ่นของฤดูร้อนในกรุงพริตเชนคายา\n\n***\n\nกษัตริย์ไอนาร์มีพี่น้องร่วมสาบานอยู่มากมาย เหล่าฮัสคาล ข้ารับใช้ผู้จงรักภักดีของพระราชา พวกเขาคือเครื่องจักรสังหารที่ยอมเชื่อฟังคำสั่งของกษัตริย์อย่างเต็มใจด้วยความภักดี มิตรภาพ ความรัก (ไม่ใช่ในความหมายพิลึก) ความหวัง และอารมณ์อันสดใสเปี่ยมสุขทั้งมวล\n\nนักฆ่าผู้ร่าเริงมีชีวิตชีวาเหล่านี้มักประจำการอยู่ในพระราชวังหลวง พวกเขาอุทิศชีวิตให้กับการจัดงานเลี้ยงทุกค่ำคืน กินเนื้อ ดื่มสุรา และประลองฟาดฟันกันเอง\n\nในมุมมองของอีวาน พวกนี้ก็คือนักเลงอันธพาล มีการจัดตั้งเป็นระบบและนิยมความรุนแรง จะเรียกว่าแบบนั้นก็ไม่ผิดนัก\n\nทว่าในหมู่พวกนักเลงก็ย่อมมีกฎเกณฑ์ของตนเอง กฎเหล็กของพวกมันมีเพียงข้อเดียวเท่านั้น คือ “ลูกพี่”\n\nตราบใดที่ยังส่งเนื้อและเหล้าให้ไม่ขาดสาย และยังรักษาพละกำลังให้มากพอจะครองความนับถือจากพวกมันได้ ย่อมไม่มีกองกำลังติดอาวุธใดบนทวีปนี้ที่จะซื่อสัตย์ภักดีและแข็งแกร่งไปกว่าแก๊งนักเลงกลุ่มนี้อีกแล้ว\n\nด้วยเหตุนี้ การทรยศของฮัสคาลจึงเป็นเรื่องที่หาได้ยากยิ่ง ทว่าจุดสำคัญอยู่ตรงคำว่า “หาได้ยากยิ่ง” นี่แหละ\n\nคำว่า “หายาก” ย่อมหมายความว่ามันเคยเกิดขึ้นมาแล้วในหน้าประวัติศาสตร์\n\nและดังที่ประวัติศาสตร์พิสูจน์ให้เห็นมาตลอด สิ่งใดที่เคยเกิดขึ้นมาแล้วครั้งหนึ่ง ย่อมสามารถเกิดขึ้นซ้ำได้อีก\n\nการหักหลังของผู้ที่เคยศรัทธา ย่อมเป็นสิ่งที่เจ็บปวดรวดร้าวที่สุดไม่ใช่หรือ?\n\n***\n\n“‘ฤดูใบไม้ผลิของปวงชน’ งั้นเหรอ?”\n\n“ครับ!! ทะ… ทั้งหมดมีแค่นั้นจริงๆ! ผมไม่รู้อะไรอย่างอื่นอีกแล้ว…! บัดซบ… พอ… พอเถอะครับ…”\n\n“หมายถึงโพชั่นรักษาบาดแผลน่ะเหรอ?”\n\n“อย่ามาล้อเล่นนะ! นั่นมันโพชั่นรักษาบาดแผลบ้าบออะไรกันเล่า?!”\n\nอีวานยืดตัวตรงขึ้นหลังจากก้มมองชายผู้น่าสงสารที่กำลังเพ้อคลั่งเพราะความเจ็บปวดแสนสาหัส\n\nเพียงแค่ขยับตัวเล็กน้อย ชายคนนั้นก็สะดุ้งเฮือกร้อง “ฮึก!” แล้วตัวสั่นเทาอย่างรุนแรงจนขดตัวกลม\n\n“ฤดูใบไม้ผลิของปวงชน ชื่อกลุ่มกบฏฟังดูราวกับบทกวีดีนี่”\n\nอีวานยิ้มขื่น กลุ่มที่ชายคนนี้สังกัดอยู่มีลักษณะเหมือนองค์กรสิทธิมนุษยชนข้ามชาติ ซึ่งช่างดูไม่เข้ากับสังคมยุคก่อนสมัยใหม่ที่ยังล้าหลังนี้เอาเสียเลย\n\nแน่นอนว่านั่นเป็นเพียงภาพลักษณ์ภายนอกเท่านั้น\n\n‘ขุนพลเพียงหนึ่งนายกับดาบเพียงหนึ่งเล่ม มิอาจควบคุมปวงชนส่วนใหญ่อันมหาศาลได้… งั้นเรอะ’\n\nนั่นมันคำขวัญของการปฏิวัติประชาธิปไตยชัดๆ ไม่ใช่หรือ?\n\nทว่าอีวานรู้ดีว่าถ้อยคำเหล่านี้เป็นเพียงโฆษณาชวนเชื่ออันแสนหวานหอมเท่านั้น\n\nต่างจากโลกเก่า โลกใบนี้มีมานา ทรัพยากรสารพัดประโยชน์ที่เรียกว่าพลังเวทนี้คือสสารพิเศษที่พลิกแพลงเป็นอะไรก็ได้ตามต้องการอย่างแท้จริง\n\nมันเสริมพละกำลังของปัจเจกบุคคลจนผ่าภูเขาและฟาดฟันท้องฟ้าได้ ทั้งยังขยายขีดความสามารถในการได้ยิน ดมกลิ่น และมองเห็นของมนุษย์ให้เทียบชั้นสัตว์ป่า\n\nเมื่อถักทอเป็นเวทมนตร์ ก็สามารถทลายป้อมปราการและสังหารหมู่กองทัพทั้งกองได้ — เป็นสสารพิเศษระดับนั้นเลยทีเดียว\n\nพลังอันท่วมท้นที่บุคคลหนึ่งสามารถไขว่คว้ามาได้ด้วยพรสวรรค์และความพยายามเพียงลำพัง ทำให้ระบอบประชาธิปไตยไร้ความหมายไปโดยสิ้นเชิง\n\nนี่คือสิ่งที่เขามั่นใจได้อย่างยิ่งยวด เพราะตัวเขาเองเคยใช้ชีวิตอยู่ในสังคมประชาธิปไตยมาก่อน\n\nตรงกันข้ามกับความเข้าใจผิดของใครหลายคน สิทธิมิได้งอกเงยขึ้นมาจากหน้าที่โดยลำพัง หากแต่ถูกสร้างขึ้นบนรากฐานของระบบสังคมที่สามารถรับรองและธำรงรักษาสิทธิเหล่านั้นเอาไว้ได้\n\nและแน่นอนว่าระบบสังคมนั้นย่อมถูกค้ำจุนไว้ด้วยกำลัง กำลังอำนาจอันท่วมท้น แรงขับเคลื่อนที่ทำให้รัฐสามารถบังคับใช้หน้าที่แก่ปัจเจกบุคคลได้\n\nตราบใดที่พลังเวทยังคงมีอยู่ ผู้คนย่อมไม่อาจเท่าเทียมกันได้ น่าเศร้าแต่มันคือความจริง ยิ่งในโลกที่มีทั้งเผ่าปีศาจ เอลฟ์ และคนแคระด้วยแล้ว ยิ่งเป็นเช่นนั้น\n\nดังนั้น นี่จึงเป็นโฆษณาชวนเชื่ออันแฝงเจตนาร้ายที่ออกแบบมาเพื่อหลอกลวงผู้คนด้วยถ้อยคำอันไพเราะเสนาะหู\n\nและยังมีอีกเรื่องหนึ่ง\n\n‘องค์กรระหว่างประเทศ ในโลกที่ไม่มีช่องทางสื่อสารอื่นใดนอกจากโทรเลขและจดหมาย’\n\nแม้แต่ในโลกที่โทรศัพท์และการสนทนาทางวิดีโอเป็นเรื่องธรรมดา การจัดตั้งองค์กรระหว่างประเทศก็ยังยากลำบากอย่างยิ่ง แล้วในยุคก่อนสมัยใหม่ องค์กรระหว่างประเทศเนี่ยนะ?\n\nเห็นได้ชัดว่านั่นหมายความว่ามีผู้ทรงอิทธิพลคอยชักใยอยู่เบื้องหลังเพื่อค้ำจุนองค์กรขนาดมหึมาเช่นนี้เอาไว้\n\nช่างย้อนแย้งเสียจริงไม่ใช่หรือ? องค์กรที่ถูกสร้างขึ้นโดยผู้ทรงอิทธิพล กลับชูอุดมการณ์เรียกร้องประชาธิปไตย แวบแรกอาจดูคล้าย “การปฏิวัติจากเบื้องบน” อันแสนงดงาม ทว่าโลกใบนี้หาใช่ดินแดนในเทพนิยายแสนฝันไม่\n\nผู้มีอำนาจทุกคนล้วนเคลื่อนไหวอย่างมีเหตุมีผลเพื่อความทะเยอทะยานของตนเองทั้งสิ้น\n\n“อเล็กซานเดอร์ ไม่รู้หรอกนะว่านายมุดหัวอยู่ที่ไหนหรือกำลังทำอะไรอยู่ แต่ก็รู้จักใช้สมองดีเหมือนกันนี่”\n\nอีวานส่ายศีรษะพลางแย้มยิ้มบางๆ\n\n‘การหมายหัวลูกหลานของปาร์ตี้ผู้กล้า ก็เป็นส่วนหนึ่งของโฆษณาชวนเชื่อด้วยตัวเองอยู่แล้ว’\n\nคำขวัญของพวกมันคือ “การไถ่บาปปลดปล่อยปวงชนส่วนใหญ่ที่ถูกปกครองโดยผู้มีอำนาจเพียงหยิบมือ”\n\nหากจะเอ่ยถึงสัญลักษณ์แห่งอำนาจเก่าซึ่งเป็นตัวแทนของผู้มีอำนาจเพียงหยิบมือ ย่อมหนีไม่พ้นปาร์ตี้ผู้กล้าอย่างแน่นอน เพราะพลังของพวกเขาแต่ละคนทัดเทียมได้กับทั้งประเทศ\n\nฉะนั้น หากเหตุผลของการหมายหัวลูกหลานปาร์ตี้ผู้กล้าคือการก่อการร้ายต่อต้านอำนาจส่วนบุคคลที่สืบทอดกันมา ย่อมฟังดูสมเหตุสมผลยิ่งนัก นี่คือผลงานที่พวกมันสามารถนำไปโอ้อวดต่อหน้าประชาชนที่กำลังถูกปั่นหัวได้โดยตรง\n\nอีวานพยักหน้าเมื่อในที่สุดก็ปะติดปะต่อเรื่องราวตลอดหลายวันที่ผ่านมาได้กระจ่างแจ้ง\n\n‘เหตุก่อการร้ายในการฝึกภาคสนามไม่ใช่เรื่องบังเอิญ’\n\nเมื่อนึกถึงเศษซากกองทัพปีศาจที่ล่วงรู้สถานที่และรายละเอียดของการฝึกภาคสนามได้อย่างแม่นยำจนน่าประหลาดใจเพื่อหวังลอบสังหารทายาทปาร์ตี้ผู้กล้า อีวานก็หรี่ตาลง\n\nมีใครบางคนในราชสำนัก กองทัพ หรือฝ่ายบริหารของคราซิลอฟเป็นคนขายข่าวออกไป\n\nและเหตุการณ์ทั้งหมดนี้คงเป็นเพียงบทโหมโรงของการก่อการร้ายอีกนับไม่ถ้วนที่จะตามมา องค์กรขนาดมหึมาระดับนี้ไม่มีวันย่อท้อเพียงเพราะความล้มเหลวแค่ครั้งสองครั้งหรอก\n\n‘อเล็กซานเดอร์’\n\nอีวานยิ้มขื่น เชื้อพระวงศ์หนุ่มผู้คอยแย้มสรวลผู้นั้นกำลังคิดอะไรอยู่กันแน่ และวางแผนจะทำสิ่งใดต่อไป?\n\nเขาต้องการอะไร? การล้มล้างระบอบกษัตริย์ การทำลายสหราชอาณาจักรให้พังทลาย และการบ่อนทำลายอำนาจของขุนนางรวมถึงศรัทธาของประชาชน จะก่อให้เกิดผลประโยชน์อันใดแก่ตัวเขา?\n\nแล้วเหตุใดเบโอลกรินถึงได้ไล่ล่าอเล็กซานเดอร์?\n\nแม็กซิมิเลียนหายสาบสูญไปไหน?\n\nความคิดมากมายทับถมซ้อนกันขึ้นมาเป็นชั้นๆ อีวานถอนหายใจยาว\n\nวิธีที่เรียบง่ายที่สุดในการแก้ปมอันยุ่งเหยิง ก็คือการฟันผ่าปมนั้นให้ขาดสะบั้นลงไปเสีย\n\nอีวานยกขวานขึ้นพาดบ่า\n\n“ถ้าอยากจะติดต่อกับดิโอนาร์ เอริกสัน ฉันต้องไปที่ไหนล่ะ?”"
    },
