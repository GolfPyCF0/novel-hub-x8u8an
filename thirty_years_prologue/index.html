      "title": "บทที่ 51",
      "content": "ปืนและระเบิดซึ่งเรียกรวมกันว่า “อาวุธปืน” เป็นอาวุธประเภทที่ถูกดูแคลนอย่างยิ่งในโลกแฟนตาซียุคก่อนสมัยใหม่แห่งนี้\n\nพวกมันมักถูกขนานนามว่าเป็น ‘อาวุธของคนจน’ ในโลกที่มีทั้งมานาและเวทมนตร์ตรวจจับ อาวุธยิงระยะไกลย่อมไม่มีวันถูกมองว่าเป็นวัสดุชั้นเลิศ และแทบไม่มีโอกาสได้รังสรรค์ขึ้นจากฝีมือช่างชั้นครู\n\nต่อให้ถูกสร้างขึ้นมาบ้าง ก็มักจะทำขึ้นโดยช่างฝีมือระดับธรรมดา นำไปใช้โดยคนที่มีความชำนาญพอๆ กัน แถมกระสุนส่วนใหญ่ก็ยิงพลาดเป้า ก่อให้เกิดเพียงการนองเลือดที่ไร้ซึ่งความโรแมนติก จิตวิญญาณอัศวิน หรือความยุติธรรมใดๆ\n\nฉะนั้น แค่การปรากฏของปืนก็เป็นตัวบ่งชี้ระดับฝีมือของคู่ต่อสู้ได้เป็นอย่างดีแล้ว ส่วนการใช้วัตถุระเบิดนั้นยิ่งไม่ต้องพูดถึง\n\nวัตถุดิบสำหรับผลิตระเบิดอานุภาพสูงในปริมาณมากพอถูกควบคุมในฐานะทรัพยากรยุทธศาสตร์ระดับชาติ ดังนั้นจึงแทบเป็นไปไม่ได้เลยที่จะเตรียมระเบิดที่สามารถเผาทำลายอาคารทั้งหลังได้\n\nอย่างเก่งก็แค่สร้างความเสียหายเล็กน้อย แล้วจะไปหวาดกลัวอะไรกัน?\n\nอาจจะมีผู้บาดเจ็บล้มตายหลักสิบคน ทว่าในทางกลับกัน ต้นทุนที่เสียไปย่อมไม่คุ้มค่ากับความพยายามและกำลังคนที่ทุ่มเทลงไปอย่างมหาศาล\n\nกระนั้น เฉกเช่นเดียวกับมีดทำครัวที่ยังคงทำอันตรายได้หากถูกแทงเข้าสู่ร่างกาย อาวุธปืนเองต่อให้ไม่ใช่อาวุธระดับเหนือมนุษย์ แต่สำหรับพลเรือนแล้ว มันก็คือยมทูตดีๆ นี่เอง\n\nเครื่องมือสังหารอันเรียบง่ายเหล่านี้ ด้วยศักยภาพในการปลิดชีพได้เพียงแค่ลั่นไก ย่อมมอบความกล้าหาญและความฮึกเหิมให้แก่ผู้ถือครองได้อย่างน่าประหลาด\n\n“แฮ่ก… แฮ่ก….”\n\n“รีบวิ่งกลับมาทำไมวะ? แกควรจะกบดานเงียบๆ ไว้สิ!”\n\n“คุณอานี… ไม่อยากเชื่อเลยว่าไอ้อัศวินนั่นมันยังเดินเพ่นพ่านอยู่แถวนั้น! ขืนอยู่ต่อ คราวนี้ผมคงโดนแทงเข้าให้จริงๆ เหมือนคราวก่อนแน่!”\n\n“ไอ้เด็กบ้าเอ๊ย… อัศวินในบ้านหลังนั้นมันไม่ตามแกมาไกลนักหรอก มันติดหน้าที่เป็นพี่เลี้ยงเด็กอยู่ แค่โกยอ้าวหนีออกมาก็พอแล้ว!”\n\n“ถ้าคิดแบบนั้นก็ไปจัดการเองเลยสิวะ แต่อย่ามาร้องไห้ทีหลังก็แล้วกันถ้าโดนไอ้หมอนั่นควักลูกตาออกมาน่ะ!”\n\nชายคนนั้นบ่นอุบพลางตัวสั่นสะท้าน หน้าที่ของเขาคือการเฝ้าจับตาดูบ้านที่อิซาเบลล์ ลูกสาวของผู้กล้าพักอาศัยอยู่\n\nต่อให้เธอจะมีพรสวรรค์มากเพียงใด เธอก็เป็นแค่เด็กคนหนึ่งเท่านั้น นั่นหมายความว่าการสะกดรอยตามและการสอดแนมย่อมเป็นเรื่องง่ายดาย\n\nทว่า มันจะกลายเป็นคนละเรื่องกันเลยเมื่อมีผู้คุ้มครองอยู่ด้วย และหากองครักษ์คนนั้นบังเอิญเป็นอัศวินที่ผ่านการฝึกฝนมาอย่างช่ำชอง เรื่องมันก็จะยิ่งบานปลายใหญ่โตขึ้นไปอีก\n\nกระสุนปืนไร้ผลเมื่ออยู่ต่อหน้าอัศวิน นี่คือสามัญสำนึกที่รู้กันโดยทั่วไป\n\nการย่างกรายเข้าใกล้คนพวกนั้นพร้อมกับปืน ก็ไม่ต่างอะไรกับการเอาหัวไปแหย่ปากสิงโต\n\n“กำหนดเส้นตายก็จ่อคอหอยอยู่แล้ว แต่พวกเบื้องบนยังไม่ส่งข่าวอะไรมาอีกเรอะ? เรื่องเฮงซวยนี่ชักจะน่าเบื่อแล้วนะ ลากยาวมาตั้งสัปดาห์เต็มๆ แล้ว”\n\n“ท่านดิโอนาร์น่าจะเดินทางมาถึงเฟรเชนกายาวันนี้หรือไม่ก็พรุ่งนี้นี่แหละ แล้ววันมะรืนพวกเราก็จะเริ่มลงมือกัน”\n\n“ข้าได้ยินชื่อหมอนั่นจนนับครั้งไม่ถ้วนแล้ว ว่าแต่หมอนั่นมันของจริงแน่เรอะ?”\n\n“ใกล้จะถึงแล้วล่ะ ด่านตรวจชายแดนเข้มงวดมาก หมอนั่นเลยต้องเดินเท้ามา”\n\n“บ้าเอ๊ย เดินมาจากโดรเวียนจนถึงที่นี่เลยเนี่ยนะ?”\n\nชายทั้งสองเดินลากเท้าผ่านตรอกซอกซอยพลางคุยสัพเพเหระกันไปเรื่อย พวกเขาก็แค่คอยจับตาดูอิซาเบลล์เท่านั้น ยังไงเสียมันก็ไม่ใช่เรื่องสลักสำคัญ เว้นแต่ว่าวันนี้เธอจะนึกครึ้มออกไปเดินเตร็ดเตร่ข้างนอก\n\nตราบใดที่วันงานใหญ่เธอยังอยู่ที่นั่น แค่นั้นก็เพียงพอแล้ว\n\n“เข้าใจละ ดิโอนาร์ เอริกสัน”\n\nชายทั้งสองที่กำลังเดินอยู่ในตรอกเปลี่ยวร้างผู้คนพลันหยุดชะงักฝีเท้าลง\n\nสายตาของทั้งคู่สบประสานกัน\n\n“หมอนั่นสะกดรอยตามแกมาเรอะ?!”\n\n“เปล่านี่ ข้าก็ระวังตัวแจแล้วนะโว้ย”\n\n“เออ แล้วนั่นมันตัวอะไรวะ ไอ้บ้าเอ๊ย?”\n\nพวกมันสบตากันครู่หนึ่งก่อนจะใส่เกียร์หมาโกยอ้าวทันที\n\nไม่สำคัญเลยว่าไอ้หมอนั่นกำลังคุยอยู่กับใคร มีเพียงสองเรื่องเท่านั้นที่สำคัญ\n\nหนึ่งคือหมอนั่นล่วงรู้ชื่อดิโอนาร์ เอริกสัน และสองคือพวกมันไม่รู้ตัวเลยสักนิดว่าอีกฝ่ายเข้ามาอยู่ในระยะที่ได้ยินเสียงพูดคุยกันตั้งแต่เมื่อไหร่\n\nพูดกันตรงๆ ก็คือ ชายลึกลับคนนี้คือตัวอันตรายระดับพระกาฬ และทางเลือกของมวยรองก็ย่อมมีอยู่ทางเดียวเสมอ\n\n“แม่งเอ๊ย!”\n\n– ปัง!\n\nชายที่วิ่งนำหน้าอยู่ล้วงลูกกลมๆ ขนาดเล็กออกมาจากกระเป๋า ขว้างกระจายลงพื้นแล้ววิ่งทะยานหนีออกจากตรอกไป\n\nลูกกลมนั้นระเบิดออก ปล่อยควันหนาทึบฟุ้งกระจายไปทั่วทั้งตรอก มันเป็นระเบิดควันราคาถูกที่ไร้พิษสง\n\nอีวานหัวเราะหึๆ แล้วเดินตามชายทั้งสองที่กำลังวิ่งหนีไป\n\nเขาไม่เร่งรีบ เขารู้ดีว่าแทนที่จะต้องเหนื่อยวิ่งไล่ตามยอดฝีมือ แต่การที่มีใครบางคนค่อยๆ ตามมาทันทั้งที่ความเร็วต่างกันต่างหาก ที่นำมาซึ่งความหวาดกลัวยิ่งกว่า\n\nการสอบปากคำเป็นศิลปะอันประณีต การตะคอก ทรมาน และข่มขู่อย่างไร้สติรังแต่จะทำให้ความชัดเจนของข้อมูลพร่ามัว ซึ่งเป็นมือมารที่ทำลายคุณภาพของข่าวกรอง\n\nการได้มาซึ่งข้อมูลที่แม่นยำย่อมต้องเริ่มต้นจากการทำลายรากฐานทางจิตใจของฝ่ายตรงข้ามให้พังทลายลงเสียก่อน\n\nอีวานเดินแหวกผ่านม่านควันและก้าวเดินต่อไปในทิศทางที่ชายทั้งสองวิ่งหนีไป\n\nเฮ้อ…\n\nผ่อนลมหายใจออก\n\nสูดลมหายใจเข้าลึก พลางหวนรำลึกถึงวันวาน\n\n***\n\nเอคไดซิสเหม่อมองท้องฟ้ายามราตรีจากระเบียงห้องนอน\n\n“คุณลุงตายไปแล้วนี่นา”\n\nความตายของเขาถึงขั้นทำให้ท่านพ่อของเธอต้องร่วมไว้อาลัย แม้สถานการณ์จะละเอียดอ่อนจนไม่อาจเดินทางไปร่วมพิธีศพได้ ทว่าหลังจากกลับมา ท่านพ่อก็ใช้เวลาไม่น้อยไปกับการจมความเศร้าลงในสุรา\n\nเธอยกมือขึ้นอย่างเหม่อลอย\n\nวางนิ่งค้างอยู่แถวมุมปากอย่างลังเล\n\n“แต่ถึงอย่างนั้นก็เถอะ”\n\nนอกเหนือจากหนวดเคราแล้ว พอตั้งใจมองดูดีๆ ก็ดูมีส่วนคล้ายคลึงกันอยู่ไม่น้อย ทั้งน่ากลัวและแตกต่างกันไปคนละขั้วโดยสิ้นเชิง\n\nดวงตาสีฟ้ากระจ่างใส เครื่องหน้าคมคาย คิ้วและสันจมูกอันสง่างาม\n\nอืม มันดูคล้ายกันอยู่บ้างจริงๆ ด้วย\n\nหรือว่าบางที…\n\n“อ๊า…”\n\nเอคไดซิสส่ายศีรษะรัวๆ นี่มันความคิดที่แย่ชะมัด\n\nคุณลุงอีวานสิ้นชีพในฐานะนักรบผู้ยิ่งใหญ่ หลังจากสังหารเจ็ดมังกรลงได้ เขาก็สละชีวิตตนเองเพื่อให้สมาชิกคนอื่นๆ ในปาร์ตี้รอดชีวิตมาได้\n\nนั่นคือวีรกรรมอันแสนวิเศษ เจ็ดมังกรเป็นคู่ต่อสู้ที่น่าสะพรึงกลัว แม้กระทั่งในมาตรฐานของปาร์ตี้ผู้กล้าในยุคนั้นก็ตาม\n\nการนำบุรุษผู้สูงส่งเช่นนั้นมาสับสนปะปนกันเพียงเพราะมีใครบางคน “หน้าตาคล้าย” ย่อมไม่ต่างอะไรกับการดูหมิ่นเกียรติของท่านเลยแม้แต่น้อย\n\nเดิมที แค่ความคิดที่ว่าคุณลุงอีวานจะมาหว่านเสน่ห์ใส่อิซาเบลล์ นอนค้างอ้างแรมกับศาสตราจารย์เอนริเก้ และในเวลาเดียวกันก็ยังสนองรสนิยมทางเพศของตัวเองด้วยการสะกดรอยตามนักศึกษามหาวิทยาลัย ก็ฟังดูเหลวไหลสิ้นดีแล้ว (แน่นอนว่ามันเหลวไหลอยู่แล้ว)\n\nเอคไดซิสรู้สึกผิดที่เผลอเอาคนต่ำช้าแบบนั้นไปเปรียบเทียบกับคุณลุงอีวาน เธอจึงก้มศีรษะลงด้วยสีหน้าเจ็บปวด\n\nศาสนาของโดรเวียนนับถือความเชื่อร่วมกันของสหราชอาณาจักร คือการศรัทธาใน ‘เทพแห่งแสง’ ทว่ากลับมีความเชื่อเรื่องโลกหลังความตายที่บิดเบี้ยวผิดแผกไปอันผสมผสานเข้ากับขนบธรรมเนียมดั้งเดิม\n\nเหล่านักรบผู้ยิ่งใหญ่เชื่อว่าตนเองจะต้องต่อสู้ชั่วนิรันดร์เคียงข้าง ‘เทพแห่งแสง’ ในโลกหลังความตาย\n\nเนื่องจากความมืดคือศัตรูของแสงสว่างอยู่เสมอ เหล่านักรบจึงต้องกวัดแกว่งดาบเข้าห้ำหั่นกับความมืดในนามของพระเจ้าท่ามกลางรัตติกาลอันลึกซึ้ง\n\nร่องรอยเหล่านั้นก็คือดวงดาว ดวงดาวนับไม่ถ้วนบนฟากฟ้าคือเหล่านักรบผู้ล่วงลับไปอยู่เคียงข้างพระเจ้านั่นเอง\n\nฉะนั้น เมื่อคิดว่าดวงดาวของคุณลุงอีวานอาจจะส่องสว่างอยู่ ณ ที่ใดสักแห่งบนนั้น เอคไดซิสจึงก้มศีรษะลงพลางกระซิบอย่างนอบน้อม\n\n“คุณลุงคะ หนูคิดถึงคุณลุงจัง ช่วงหลังมานี้คิดถึงมากกว่าเดิมอีกค่ะ หนูเริ่มหัดเล่นเครื่องดนตรีตามที่คุณลุงแนะนำแล้วนะคะ มันไม่ง่ายเลย แต่หนูก็พยายามอย่างหนัก หนูมีเพื่อนเยอะแยะเลยด้วย หนูสบายดีค่ะ”\n\nเพราะตอนกลางวันดวงดาวไม่ปรากฏขึ้นบนท้องฟ้า คุณลุงก็เลยอาจจะไม่รู้ว่าเกิดเรื่องอะไรขึ้นในตอนกลางวันบ้างสินะคะ\n\n“เพราะฉะนั้น ช่วยเฝ้ามองดูหนูด้วยนะคะ พอหนูเรียนจบ และเล่นเก่งมากพอเมื่อไหร่ หนูจะไปบรรเลงเพลงไว้อาลัยให้คุณลุงฟังต่อหน้าหลุมศพเองค่ะ เพื่อที่การเสียสละของคุณลุงจะได้ไม่สูญเปล่า และโลกใบนี้จะได้ยังคงงดงามเช่นนี้ตลอดไป”\n\nด้วยน้ำตาคลอเบ้า เธอกำผ้าเช็ดหน้าแน่นพลางสะอื้นไห้\n\nเธอไม่เคยกล้าคิดจะบรรเลงเพลงในตอนกลางคืนเลย เธอไม่อาจปล่อยให้คุณลุงอีวานได้ยินฝีมือการเล่นที่ยังไม่เอาไหนของตนได้เด็ดขาด\n\nดังนั้น เอคไดซิสจึงเช็ดน้ำตาอย่างเด็ดเดี่ยวและลุกขึ้นยืนจากที่นั่ง\n\nสืบเนื่องจากเหตุการณ์อันน่าสับสนในตอนกลางวัน การจะข่มตานอนแต่หัวค่ำจึงเป็นเรื่องที่เป็นไปไม่ได้ และในเมื่อพรุ่งนี้เป็นวันหยุดอยู่แล้ว เธอจึงตัดสินใจออกไปเดินเล่นรับลมยามค่ำคืน\n\n“คุณลุงมอร์ดคะ! ออกไปเดินเล่นข้างนอกกันหน่อยเถอะค่ะ!”\n\n“ไปไหนล่ะ?”\n\n“ที่ไหนก็ได้ค่ะ!”\n\n“เอ้า เอาสิ”\n\nมอร์ดซึ่งกำลังเช็ดทำความสะอาดอาวุธอยู่ชั้นล่างยักไหล่แล้วลุกขึ้นยืน\n\nทั้งสองคนเดินออกไปสัมผัสสายลมบนท้องถนนยามค่ำคืนแห่งฤดูร้อนของเฟรเชนกายาในชุดลำลอง\n\n***\n\nกษัตริย์ไอนาร์มีพี่น้องร่วมสาบานอยู่มากมาย เหล่าฮัสคาล สหายผู้ภักดีของราชา พวกเขาคือเครื่องจักรสังหารที่ยอมเชื่อฟังคำสั่งของกษัตริย์อย่างเต็มใจด้วยอารมณ์อันสดใสเปี่ยมสุขอย่างความจงรักภักดี มิตรภาพ ความรัก (ไม่ใช่ในความหมายแปลกๆ) และความหวัง\n\nเหล่าเพชฌฆาตผู้ร่าเริงเหล่านี้มักจะพำนักอยู่ในพระราชวังของกษัตริย์ พวกเขาจัดงานรื่นเริงทุกค่ำคืน ดื่มด่ำกับเนื้อและสุรา และอุทิศชีวิตให้กับการต่อสู้ประลองฝีมือกันเอง\n\nในมุมมองของอีวาน คนพวกนี้ก็ไม่ต่างอะไรจากแก๊งนักเลงที่จัดตั้งเป็นระบบ จะกล่าวว่าพวกเขามีระเบียบวินัยและนิยมความรุนแรงก็คงไม่ผิดนัก\n\nทว่าในหมู่พวกนักเลงก็ย่อมมีกฎเกณฑ์ กฎข้อเดียวของพวกมันก็คือ ‘ลูกพี่’\n\nตราบใดที่ยังส่งเนื้อและสุราให้กินอย่างสม่ำเสมอ และรักษาขุมกำลังที่คู่ควรแก่ความเคารพยำเกรงของพวกมันเอาไว้ได้ ย่อมไม่มีกลุ่มกองกำลังใดบนทวีปที่จะภักดีและแข็งแกร่งไปกว่าแก๊งนักเลงกลุ่มนี้อีกแล้ว\n\nฉะนั้น กรณีที่ฮัสคาลจะก่อกบฏทรยศจึงเป็นเรื่องที่หาได้ยากยิ่ง จุดสำคัญตรงนี้คือคำว่า “หาได้ยากยิ่ง”\n\nคำว่า “หายาก” ย่อมหมายความว่ามันเคยเกิดขึ้นจริงในประวัติศาสตร์สักช่วงหนึ่ง\n\nและประวัติศาสตร์ก็พิสูจน์ให้เห็นแล้วว่า เมื่อสิ่งใดเคยเกิดขึ้นได้ มันย่อมเกิดขึ้นซ้ำได้อีก\n\nการทรยศของผู้ที่เคยภักดีย่อมเจ็บปวดยิ่งกว่าสิ่งใดทั้งหมด\n\n***\n\n“ฤดูใบไม้ผลิของปวงชนงั้นเรอะ?” (อีวาน)\n\n“ชะ ใช่! ทะ เท่านั้นแหละ! ข้าไม่รู้อะไรไปมากกว่านี้แล้ว… จริงๆ นะ… กะ ก็ตามนั้นแหละ หยุดถามเรื่องนั้นสักทีเถอะ…”\n\n“อยากได้โพชั่นรักษาบาดแผลเพิ่มอีกสักหน่อยไหม?”\n\n“อย่ามาพูดจาไร้สาระนะโว้ย! ไอ้ของพรรค์นั้นมันจะเป็นโพชั่นรักษาบาดแผลไปได้ยังไงกันเล่า!!”\n\nหลังจากสร้างความปั่นป่วนให้แก่ชายผู้น่าสงสารที่กำลังดิ้นรนด้วยความทรมาน อีวานก็ยืดหลังตรงแล้วลุกขึ้นยืน\n\nแม้จะเป็นเพียงการขยับตัวเล็กน้อย ชายคนนั้นก็สะดุ้งเฮือกจนตัวหดลีบพลางสั่นเทาอย่างไม่อาจควบคุมได้\n\n“ฤดูใบไม้ผลิของปวงชน ช่างเป็นชื่อที่สละสลวยดีนี่สำหรับพวกกบฏ”\n\nอีวานหัวเราะขมขื่น ในสังคมยุคก่อนสมัยใหม่ที่แสนล้าหลังแห่งนี้ น่าประหลาดที่กลุ่มซึ่งไอ้หมอนี่สังกัดอยู่กลับมีลักษณะคล้ายองค์กรสิทธิมนุษยชนข้ามชาติเสียอย่างนั้น\n\nแน่นอนว่าก็แค่เปลือกนอกเท่านั้น\n\n‘ขุนพลเพียงหนึ่งคนและดาบเพียงหนึ่งเล่ม มิอาจครอบครองอำนาจเหนือคนหมู่มากได้อย่างเด็ดขาด…’\n\nนั่นไม่ใช่คำขวัญของการปฏิวัติประชาธิปไตยหรอกหรือ?\n\nทว่า อีวานรู้ดีว่าถ้อยคำเหล่านี้เป็นเพียงโฆษณาชวนเชื่ออันหอมหวานเท่านั้น\n\nต่างจากโลกใบเก่า โลกใบนี้มีมานา ทรัพยากรเวทมนตร์ชนิดนี้เรียกได้ตรงตัวเลยว่าเป็นสสารพิเศษที่จับใส่จมูกก็เป็นห่วงจมูก จับใส่หูก็เป็นต่างหูได้ตามแต่ใจชอบ\n\nการเสริมสร้างพละกำลังของปัจเจกบุคคลให้สามารถผ่าขุนเขาและทะยานสู่ฟากฟ้า การขยายขีดความสามารถในการได้ยิน การรับกลิ่น และการมองเห็นของมนุษย์ให้เทียบเท่าสัตว์ป่า – นั่นคือสิ่งที่การถักทอเวทมนตร์สามารถบรรลุผลได้\n\nมันคือสสารพิเศษที่เมื่อนำมาหลอมรวมเป็นเวทมนตร์แล้ว ย่อมสามารถทลายป้อมปราการและสังหารหมู่กองทัพทั้งกองทัพได้\n\nขุมพลังอันล้นพ้นที่บุคคลหนึ่งสามารถไขว่คว้ามาได้ด้วยพรสวรรค์และความพยายามเพียงอย่างเดียว ทำให้ระบอบประชาธิปไตยไร้ความหมายไปโดยตัวของมันเอง\n\nตัวเขาซึ่งเคยใช้ชีวิตอยู่ในสังคมประชาธิปไตยมาก่อน ย่อมตระหนักในข้อเท็จจริงนี้ได้ลึกซึ้งยิ่งกว่าใคร\n\nตรงกันข้ามกับความเข้าใจผิดของผู้คนมากมาย สิทธิไม่ได้งอกเงยขึ้นมาจากหน้าที่โดยลำพัง ทว่ามันถูกสถาปนาขึ้นบนพื้นฐานของระบบสังคมที่ผู้คนสามารถเรียกร้องและธำรงรักษาสิทธินั้นเอาไว้ได้\n\nและระบบสังคมนั้นย่อมถูกค้ำจุนไว้ด้วยกำลัง กำลังอันเหนือกว่าอย่างท่วมท้น แรงขับเคลื่อนที่ช่วยให้รัฐสามารถบังคับใช้พันธกรณีเหนือปัจเจกบุคคลได้\n\nในโลกที่มานาดำรงอยู่ ความเท่าเทียมกันในหมู่มวลมนุษย์ย่อมเป็นเรื่องที่เป็นไปไม่ได้ มันคือความจริงอันแสนเศร้า โดยเฉพาะอย่างยิ่งในโลกที่มีทั้งปีศาจ เอลฟ์ และคนแคระ\n\nฉะนั้น นี่จึงเป็นโฆษณาชวนเชื่ออันชั่วร้ายที่เคลือบด้วยถ้อยคำอันไพเราะ เพื่อหวังจะฉาบน้ำตาลกลบเกลื่อนความจริงอันโหดร้ายนั่นเอง\n\nและยังมีอีกเรื่องหนึ่ง\n\n“องค์กรระดับนานาชาติในโลกที่ไม่มีช่องทางสื่อสารใดๆ นอกเหนือจากจดหมายและการส่งสารเนี่ยนะ”\n\nแม้แต่ในโลกที่การโทรศัพท์และวิดีโอคอลเป็นเรื่องปกติธรรมดา การก่อตั้งองค์กรระหว่างประเทศยังเป็นเรื่องยากเย็นแสนเข็ญ ยิ่งไม่ต้องพูดถึงในยุคก่อนสมัยใหม่เลย โดยธรรมชาติแล้ว มันย่อมบ่งชี้ว่ามีขุมอำนาจหนุนหลังคอยค้ำจุนองค์กรขนาดมหึมานี้ไว้อยู่\n\nช่างน่าขันเสียจริงมิใช่หรือ? เนื้อแท้ขององค์กรที่ถูกสร้างขึ้นโดยผู้กุมอำนาจกลับชูธงประชาธิปไตย แวบแรกมันอาจจะดูเหมือน ‘การปฏิวัติจากเบื้องบนสู่เบื้องล่าง’ อันงดงาม ทว่าโลกใบนี้หาใช่แดนสุขาวดีในเทพนิยายไม่\n\nผู้กุมอำนาจทุกคนล้วนกระทำการอย่างมีเหตุมีผลเพื่อความทะเยอทะยานของตนเองทั้งสิ้น\n\n“อเล็กซานเดอร์ ไม่รู้หรอกนะว่าเจ้าคิดจะทำอะไรอยู่ แต่ก็รู้จักใช้สมองดีนี่”\n\nอีวานหัวเราะเบาๆ พลางส่ายศีรษะ\n\n‘การเล็งเป้าหมายไปที่ทายาทของปาร์ตี้ผู้กล้าเป็นส่วนหนึ่งของการโฆษณาชวนเชื่อ’\n\nคำขวัญของพวกมันคือ ‘การปลดปล่อยคนหมู่มากออกจากการครอบงำของคนกลุ่มน้อย’\n\nหากเรามองว่าปาร์ตี้ผู้กล้าเป็นสัญลักษณ์แห่งอำนาจของยุคเก่าซึ่งเป็นตัวแทนของปัจเจกบุคคลผู้ทรงพลังไม่กี่คน เรื่องนี้ก็ฟังดูมีเหตุผลขึ้นมา พวกเขามีพละกำลังส่วนตัวเหนือล้ำไปกว่าระดับของรัฐชาติเสียอีก\n\nฉะนั้น หากเหตุผลในการหมายหัวทายาทของปาร์ตี้ผู้กล้าคือการก่อการร้ายที่มุ่งเป้าไปที่อำนาจสืบสายโลหิตของปัจเจกบุคคลจริงๆ ก็ถือว่าฟังขึ้น นี่คือผลงานที่พวกมันสามารถนำไปโอ้อวดต่อหน้าประชาชนผู้ใสซื่อได้อย่างโดยตรง\n\nอีวานพยักหน้าเห็นพ้องกับเรื่องราวที่ค่อยๆ คลี่คลายออกมาในช่วงหลายวันที่ผ่านมา\n\n‘เหตุก่อการร้ายในการฝึกภาคสนามไม่ใช่เรื่องบังเอิญ’\n\nเมื่อนึกย้อนถึงพวกกบฏฝ่ายปีศาจที่สามารถระบุตำแหน่งและลักษณะของการฝึกภาคสนามได้อย่างแม่นยำอย่างน่าอัศจรรย์เพื่อลอบสังหารทายาทของปาร์ตี้ผู้กล้า อีวานก็หรี่ตาลง\n\nมีใครบางคนในราชวงศ์คราซิลอฟ ฝ่ายบริหารกองทัพ หรือระบบราชการ ขายข่าวและปล่อยข้อมูลรั่วไหลออกไป\n\nและเหตุการณ์นี้จะไม่ได้เป็นอะไรมากไปกว่าบทโหมโรงของการก่อการร้ายอีกนับไม่ถ้วนในอนาคต องค์กรขนาดมหึมาถึงเพียงนี้ย่อมไม่ยอมถอดใจเพราะความล้มเหลวแค่ครั้งหรือสองครั้งแน่\n\n“อเล็กซานเดอร์”\n\nอีวานหัวเราะขมขื่น เจ้าชายหนุ่มผู้ครั้งหนึ่งเคยฉายแววอนาคตไกลคนนั้น เวลานี้กำลังคิดอะไรอยู่ และกำลังวางแผนการอันใดกันแน่?\n\nพระองค์ปรารถนาสิ่งใด? การล้มล้างระบอบกษัตริย์ การล่มสลายของสหราชอาณาจักร และการบ่อนทำลายอำนาจกับความนิยมของเหล่าขุนนาง—การกระทำเช่นนั้นจะนำผลประโยชน์อันใดมาสู่พระองค์กัน?\n\nและทำไมเวียลกรินถึงต้องไล่ล่าตามหาตัวอเล็กซานเดอร์?\n\nแล้วแม็กซิมิเลียนหายตัวไปไหนกันแน่?\n\nความคิดต่างๆ เรียงร้อยเข้าด้วยกันอย่างชัดเจน อีวานถอนหายใจออกมา\n\nวิธีที่เรียบง่ายที่สุดในการแก้ปมเชือกอันซับซ้อน ก็คือการตัดปมนั้นทิ้งไปเสียเลย\n\nอีวานเหวี่ยงขวานขึ้นพาดบ่า\n\n“ถ้าจะติดต่อกับดิโอนาร์ เอริกสัน ฉันต้องไปที่ไหน?”"
    },

      "title": "บทที่ 52",
      "content": "จากมุมมองของอีวาน โลกใบนี้อาจถูกถ่ายทอดออกมาว่าเป็นสังคมยุคก่อนสมัยใหม่ที่ป่าเถื่อนล้าหลังอย่างน่าสยดสยอง ทว่านั่นเป็นคำกล่าวเกินจริงอันไร้สาระ โดยธรรมชาติแล้ว ผู้คนในโลกนี้ล้วนมีความสามารถ (เพราะพวกไร้ความสามารถย่อมไม่อาจเอาชีวิตรอดมาได้)\n\nทว่าเนื่องจากความสามารถนั้นไม่อาจถูกนำไปใช้ในทิศทางที่ดีงามได้เสมอไป เหล่าหัวกะทิผู้เปี่ยมความสามารถและชนชั้นสูงในสังคมส่วนใหญ่จึงพากันสั่งสมความฉ้อฉลไว้อย่างสลับซับซ้อน (ด้วยเหตุนี้ กองบัญชาการข่าวกรองจึงปักใจเชื่อในทฤษฎีสมคบคิด)\n\nดังที่ทุกคนรู้ดี ความฉ้อฉลของคนไร้ความสามารถนั้นร้ายแรงน้อยกว่าความฉ้อฉลของคนเก่งมากนัก และเรื่องนี้ยิ่งทวีความวิกฤตมากขึ้นเมื่อมันวิวัฒนาการจากการท้าทายระดับปัจเจกบุคคลไปสู่การกัดกร่อนระบบสังคม\n\nฉะนั้น เหล่าผู้ทะเยอทะยานที่ตัดสินใจหันไปเข้าข้างพวกปีศาจจึงกำลังเดินหมากอยู่ในห้วงน้ำลึกอย่างแท้จริง\n\n“แล้วพวกนี้จะเอายังไงต่อดีครับ?”\n\n“จะถามทำไมกัน? อย่าทำตัวเป็นมือสมัครเล่น จัดการแบบมืออาชีพสิ ตอบโต้ให้สมกับเป็นมือโปรหน่อย”\n\nดมิทรียักไหล่พลางหมุนตัวกลับ เสื้อโค้ตตัวยาวสะบัดพลิ้วตามจังหวะที่หันกาย ขณะเดียวกัน เสียงปืนอันแห้งผากก็ดังก้องขึ้นสองนัดซ้อน\n\nดมิทรีจุดบุหรี่ขึ้นสูบโดยมีเสียงปืนเป็นดั่งเครื่องบรรเลงประกอบ ซู๊ด... แล้วพ่นควัน ปลายบุหรี่ที่ลุกวาบสาดแสงสีแดงเรื่อท่ามกลางห้องมืดสลัว\n\n“ไอ้พวกน่ารำคาญเอ๊ย”\n\nยิ่งระบบสังคมซับซ้อนมากขึ้นเพียงใด ความทะเยอทะยานของเหล่าผู้มักใหญ่ใฝ่สูงก็ยิ่งฝังตัวลึกลงไปในเงามืดมากขึ้นเท่านั้น\n\nในโลกใบนี้ ‘ผู้ทะเยอทะยานที่รอดชีวิตมาได้’ ล้วนมีฝีมือฉกาจฉกรรจ์อย่างยิ่งยวด ดังที่กล่าวไปข้างต้น ผู้ที่เผยความไร้ความสามารถออกมาท่ามกลางไฟสงครามล้วนสิ้นชีพไปหมดแล้ว\n\nเรื่องนี้ดูคู่ควรแก่การทดลองทางภาษาศาสตร์ระดับโลกทีเดียว\n\nตามหลักตรรกบทแบบดั้งเดิม ย่อมเรียงร้อยได้ดังนี้\n\n1. เหล่ากบฏ ผู้ก่อการร้าย หรือผู้ต่อต้านระบบในปัจจุบันล้วนมีฝีมือติดตัวอยู่พอตัว\n\n2. ทว่า ระบบสังคมของสหราชอาณาจักรยังคงแข็งแกร่งมั่นคง\n\n3. ดังนั้น ปัจจัยทั้งปวงที่คอยไล่ล่าจับกุม ‘กบฏผู้เปี่ยมฝีมือ’ เหล่านี้ ย่อมต้องมีฝีมือเหนือกว่าพวกมัน\n\nเพิ่งจะผ่านพ้นสงครามมาได้เพียง 4 ปีเท่านั้น โครงสร้างของทุกอาณาจักรต่างบอบช้ำเสียหายจนถึงขีดที่ไม่สามารถแบกรับความขัดแย้งเพิ่มเติมได้อีกแล้ว\n\nยิ่งไปกว่านั้น ประชากรวัยแรงงานส่วนใหญ่ยังสูญเสียไปแทบหมดสิ้น โดยหลักแล้วต่างหายสาบสูญไปในเงื้อมมือของเหล่าปีศาจ\n\nกระแสความเปลี่ยนแปลงที่คล้ายคลึงกับยุคที่สิทธิของสามัญชนพุ่งทะยานขึ้นในช่วงการระบาดของกาฬโรคกำลังก่อตัวขึ้น ข้อแตกต่างมีเพียงว่าเหล่าขุนนางที่คอยรีดไถปล้นชิงราษฎรนั้นทรงพลังอย่างท่วมท้น ชนิดที่สามารถร่ายเวทมนตร์ได้จริงๆ\n\nโดยธรรมชาติแล้ว ย่อมเกิดการก่อกบฏที่ใกล้จะปะทุขึ้นระหว่างราษฎรกับผู้ปล้นสะดม หากมีใครสักคนจุดประกายไฟขึ้นมา มันจะโหมกระหน่ำลุกลามไปถึงระดับมหันตภัยอย่างแน่นอน\n\nในปรากฏการณ์ทางสังคม เมื่อเกิดเหตุการณ์ใหญ่ขึ้น ผู้ที่ได้รับผลประโยชน์สูงสุดมักจะเป็นตัวการอยู่เบื้องหลังเสมอ\n\nเมื่อมองหาผู้ที่ได้กอบโกยผลประโยชน์มากที่สุดยามประเทศชาติลุกเป็นไฟ โดยทั่วไปมักจะหนีไม่พ้นกลุ่มเหล่านี้\n\n– เผ่าปีศาจที่ตกอยู่ภายใต้การปกครองแบบอาณานิคม\n\n– ประเทศเพื่อนบ้าน\n\n– กลุ่มกบฏภายในประเทศ\n\n– ราชวงศ์ที่ถูกเนรเทศจากการผลัดเปลี่ยนอำนาจ\n\n– นักอุดมการณ์ที่หมกมุ่นอยู่ในความเชื่อของสามัญชน\n\n“เฮ้อ….”\n\nดมิทรีพ่นลมหายใจปนควันบุหรี่ออกมา มีปมปัญหามากมายที่พัวพันทั้งในแง่มุมภายในประเทศและระหว่างประเทศ เวลานี้ คราซิลอฟกำลังยืนอยู่บนปากเหวของสงครามกลางเมือง\n\nกองบัญชาการข่าวกรองคราซิลอฟคงต้องถ่างตาโต้รุ่งกันอีกคืนเสียแล้ว\n\nมันเป็นค่ำคืนฤดูร้อนอันแสนเหนื่อยหน่าย ไม่ต่างอะไรจากปกติธรรมดา จนกระทั่งเปลวเพลิงจะโหมกระหน่ำกลืนกินเฟรเชนกายา\n\n***\n\nอีวานซึ่งเป็นคนรักสันติ มักนิยมคลี่คลายปัญหาส่วนใหญ่ด้วยการเจรจา\n\nทว่าความท้าทายสำคัญประการหนึ่งในยุคสมัยอันป่าเถื่อนนี้ก็คือ เมื่อต้องเผชิญหน้ากับปัญหาเล็กๆ น้อยๆ ผู้คนส่วนใหญ่มักปิดล็อกประตูใจของตนเองแล้วปฏิเสธการสนทนา\n\nกระนั้น อีวานผู้มีไหวพริบสมกับเป็นคนยุคใหม่ ย่อมรับมือกับปัญหานี้ได้อย่างง่ายดาย\n\nท้ายที่สุด ประตูย่อมทำจากไม้ และไม้ทุกชนิดย่อมแตกสะบั้นลงใต้คมขวาน\n\nด้วยเหตุนี้ ท่ามกลางตัวอย่างนับไม่ถ้วน (ที่เปิดขวด ที่เปิดกระป๋อง ที่เปิดกะโหลก ฯลฯ) ขวานของอีวานจึงทำหน้าที่เสมือนที่เปิดประตู คอยงัดแงะให้ประตูดวงใจของอีกฝ่ายเปิดอ้าและชุ่มฉ่ำ\n\n“ยะ… หยุดเถอะ! ข้าจะบอกให้หมด! จะบอกให้หมดทุกอย่างเลย! ได้โปรด หยุดที!!”\n\n“เฮ้อ นี่ยังไม่ทันได้เริ่มกันเลยนะ”\n\n“ขะ ข้าไม่ได้บอกสักหน่อยว่าจะไม่ให้ความร่วมมือ!”\n\nอีวานก้มศีรษะลงมองสายลับมือสมัครเล่นผู้นี้\n\nเนื่องจากถ้อยคำที่เอ่ยออกมาในขณะที่ประตูใจยังเปิดไม่สุดย่อมมีแนวโน้มสูงที่จะเจือปนไปด้วยคำลวง การเปิดหัวใจให้กว้างขึ้นอีกจึงเป็นเรื่องจำเป็นเพื่อยกระดับความน่าเชื่อถือของข้อมูล การเปิดตำแหน่งของหัวใจทางกายภาพมักจะนำไปสู่การเปิดใจทางจิตวิทยาได้ในกรณีส่วนใหญ่เสมอ\n\n“อั่ก…!”\n\n“ทีนี้ให้ฉันรักษาให้นะ”\n\n“ฆ่า… ฆ่าข้าให้ตายไปเลยเถอะ…!”\n\n“อย่าพูดอะไรน่าเศร้าแบบนั้นสิ”\n\nอีวานกระซิบอย่างอ่อนโยนพลางหยิบโพชั่นรักษาบาดแผลออกมาเพื่อสมานหัวใจที่ถูกเปิดอ้า\n\nการทรมานซ้ำซากเพียงอย่างเดียวนับเป็นหมากที่ผิดพลาดซึ่งบั่นทอนคุณภาพของข้อมูล ข้อมูลจะถูกบิดเบือนได้ง่าย นำไปสู่สถานการณ์ที่เจ้าตัวปักใจเชื่อและพูดความทรงจำที่ผิดเพี้ยนไปคนละเรื่องราวกับว่าเป็นความจริง\n\nดังนั้น เพื่อทลายกำแพงทางจิตใจลงให้สิ้นซาก อีวานเองก็จำเป็นต้องวางสติปัญญาแบบคนยุคใหม่ลงชั่วคราว แล้วสวมใส่ความป่าเถื่อนของยุคสมัยนี้เข้าไว้แทน\n\nหลังจากการให้คำปรึกษาทางจิตวิทยาระยะสั้นที่เปี่ยมด้วยความใส่ใจอันอบอุ่น (หลีกเลี่ยงอวัยวะสำคัญถึงตาย) และการรักษาอันประณีต (ไม่หวงโพชั่นรักษาบาดแผล) การพบปะครั้งที่ห้ากับสายลับรายนี้ก็จบลงด้วยการที่อีกฝ่ายพึมพำความจริงออกมาด้วยแววตาเหม่อลอยว่างเปล่า\n\n“ดิโอนาร์… อึก… อยู่ในเฟรเชนกายาแล้ว… เขามาถึงแล้ว… พลุสัญญาณนั่น… ไม่ใช่ของพวกเรา แต่เป็นตัวดิโอนาร์เอง…”\n\n“มันเริ่มเคลื่อนไหวแล้วงั้นเหรอ?”\n\n“ชะ ใช่… แผนลอบเข้ามาเป็นแค่ตัวลวง… พวกเราก็รอสัญญาณจากดิโอนาร์อยู่เหมือนกัน…”\n\n“ดิโอนาร์เล็งเป้าไปที่อะไร? แค่การลักพาตัวเอคไดซิสอย่างเดียวหรือ?”\n\n“ไม่…”\n\nสายลับซึ่งทำหน้าที่รับผิดชอบการนัดพบกับดิโอนาร์ จู่ๆ ก็เหลือบมองขึ้นไปบนท้องฟ้าด้วยแววตาว่างเปล่า ก่อนจะเคาะพื้นกะทันหัน ราวกับว่าเพียงเท่านั้นก็สามารถมอบคำตอบได้แล้ว\n\nเมื่ออีวานเลิกคิ้วขึ้น ชายผู้นั้นก็ไอออกมาเป็นเลือดก่อนจะฝืนเค้นเสียงพูดออกมา\n\n“ที่นี่”\n\n“…ที่นี่?”\n\n“เฟรเชนกายา… ปะ ปฏิวัติจงเจริญ… ดาบแห่งปวงชนเพื่อปวงชน… เหนือมนุษย์… มีเพียงพระผู้เป็นเจ้า… ใต้ราชอาณาจักรแห่งฟากฟ้า… แค่ก! อ๊า อ๊าก…”\n\nสติของหมอนี่พังทลายไปแล้ว\n\nอีวานถอนหายใจแล้วลุกขึ้นยืน\n\nหากดิโอนาร์ซึ่งควรจะเดินทางมาถึงในอีกหนึ่งหรือสองวันข้างหน้าแทรกซึมเข้ามาในเมืองนี้แล้ว การยื้อเวลาต่อไปทั้งที่หน่วยปฏิบัติการถูกเปิดโปงหมดแล้วจะนับเป็นการตัดสินใจที่ฉลาดงั้นหรือ?\n\nไม่เลย ไม่มีทาง เมื่อถูกเปิดโปงแล้ว ไอ้หมอนั่นก็ไม่มีทางหวนกลับหลังได้อีก ต่อให้มันคิดจะหนีกลับไปโดรเวียน ก็คงไม่พ้นต้องไปเจอคมขวานอันเกรี้ยวกราดของไอนาร์\n\nเฟรเชนกายาเป็นมหานครอันกว้างใหญ่ไพศาล ฉะนั้นการตามหาสายลับต่างชาติที่ไม่เคยพบหน้ามาก่อนซึ่งแทรกซึมเข้ามาในเมือง ย่อมยากเย็นยิ่งกว่าการตามหาคุณคิมช่างซ่อมในกรุงโซลเสียอีก\n\nทว่าหากต้องการจับงู ก็จำต้องแหวกพงหญ้าค้นหา\n\nหากดิโอนาร์ระแคะระคายว่าฐานบัญชาการถูกเปิดโปง โดยมีลูกสมุนและสายลับบางส่วนที่ยังมีชีวิตรอดแต่เห็นได้ชัดว่าถูกทรมานมา มันย่อมต้องร้อนรนกระวนกระวายอย่างหนัก\n\n“ป่านนี้เอคไดซิสน่าจะอยู่ที่บ้านแล้ว”\n\nอีวานครุ่นคิดถึงนัยสำคัญของการเล็งเป้าหมายมาที่ตัวเมืองเฟรเชนกายาเอง ก่อนจะเริ่มออกเคลื่อนไหว\n\nสิ่งแรกคือต้องรับประกันความปลอดภัยของเอคไดซิสก่อน และหากเป็นไปได้ ก็สกัดกั้นความพยายามลอบโจมตีของดิโอนาร์ อีวานตั้งใจจะซักถามมันเพิ่มเติมให้จงได้\n\nเขาอยากรู้จากใจจริงว่าพื้นฐานทางจิตวิทยาแบบไหนกันที่ชักนำให้ใครบางคนเพ้อเจ้อเชื่อไปได้ว่า การบุกโจมตีปาร์ตี้ผู้กล้าจะสามารถใช้เป็นยุทธศาสตร์ในการพิชิตเฟรเชนกายาได้\n\n***\n\nเอคไดซิสและมอร์ดเดินทอดน่องอย่างเงียบเชียบไปท่ามกลางรัตติกาล\n\n“โห แต่เอาจริงนะ หนูไม่ชินกับอะไรแบบนี้เลยค่ะ คุณลุงก็เหมือนกันใช่ไหมคะ? ทำไมถนนหนทางถึงได้มีคนน้อยขนาดนี้กัน?”\n\n“มันก็เกิดขึ้นได้เวลาที่บ้านเมืองไร้สมรรถภาพนั่นแหละ เอซี่ เจ้าตระหนักหรือยังว่าพ่อของเจ้าน่ะเป็นกษัตริย์ที่ยิ่งใหญ่เพียงใด?”\n\n“เอ่อ ก็นะ คงงั้นมั้งคะ”\n\nคราซิลอฟผ่านพ้นสงครามครั้งที่ผ่านมาภายใต้การปกครองแบบราชาธิปไตยรวมศูนย์เพียงหนึ่งเดียว โดยธรรมชาติแล้ว ย่อมมีการประกาศภาวะฉุกเฉินทั่วประเทศ และบ้านเมืองก็ดำเนินไปภายใต้กฎอัยการศึกนานกว่าทศวรรษ\n\nแม้สันติภาพจะหวนคืนมาแล้ว รัฐทหารเช่นนั้นก็ย่อมไม่อาจเปลี่ยนแปลงได้ภายในเวลาเพียงสี่ปี ทว่าโดรเวียนนั้นแตกต่างออกไป\n\nระหว่างสงครามครั้งล่าสุด โดรเวียนดำรงอยู่ด้วยพันธมิตรอันหลวมๆ ที่ชนเผ่าราวสิบกว่าเผ่าต่างปกครองเขตแดนของตนเอง\n\nในประเทศชนเผ่าเหล่านี้ ไม่มีอำนาจรวมศูนย์แต่อย่างใด โดยธรรมชาติแล้ว สิทธิของพลเมืองแต่ละคนจึงพัฒนาไปไกลอย่างมากเมื่อเทียบกับประเทศอื่น\n\nแม้แต่นักรบธรรมดาสามัญที่สุดบนท้องถนน หากไล่เรียงสายเลือดย้อนกลับไปเจ็ดชั่วอายุคน ก็ยังคงเป็นพี่เขยของลูกพี่ลูกน้องของหลานเหลนโหลนของหัวหน้าเผ่า นั่นแหละคือความหมายของสังคมเครือญาติ\n\nจุดที่ควรพึงระวังตรงนี้ก็คือ บนท้องถนนเต็มไปด้วยเหล่านักรบเดินกันให้ควั่ก ยังไงก็ตาม ต้องขอบคุณสิ่งนั้นที่ทำให้ระเบียบสังคมสามารถวิวัฒนาการไปในทางที่ทันสมัยกว่าได้\n\nต่างจากสังคมศิวิไลซ์ ในสังคมชนเผ่า ขวานจะถูกเงื้อฟันใส่พวกที่ไร้มารยาท ทุกคนจึงล้วนมีมารยาทดี ทำให้ท้องถนนน่ากลัวน้อยลง\n\nในสังคมเช่นนั้น เมื่อมองสภาพความเป็นอยู่และท้องถนนของเฟรเชนกายา ก็อาจดูแห้งแล้งและแข็งกระด้างอยู่ไม่น้อย\n\nสำหรับเอคไดซิสที่มาใช้ชีวิตอยู่ในเมืองนี้ได้เกือบสามเดือนแล้ว มันยังคงเป็นสภาพแวดล้อมที่ปรับตัวเข้าหาได้ยากอยู่ดี\n\n“อ๊ะ คุณลุงคะ เคยลองร้านนั้นหรือยัง? วาฟเฟิลร้านนั้นอร่อยมากๆ เลยนะ”\n\nโดยปกติแล้ว ร้านวาฟเฟิลใกล้มหาวิทยาลัยไม่ใช่สถานที่ที่จะเดินเข้าไปคนเดียวได้ มันคือพื้นที่ของพวกกลุ่มคนดังเข้าสังคมจอมซ่า\n\nด้วยเหตุนี้ เอคไดซิสจึงไม่เคยได้ลิ้มลองวาฟเฟิลจากร้านนั้นเลย เธอมักจะพบว่าตัวเองได้แต่มองผู้คนกินกันอย่างเอร็ดอร่อยแล้วจึงเดินกลับบ้าน\n\nด้วยน้ำเสียงเจือความเสียดาย เอคไดซิสจึงแนะนำร้านอาหารยอดนิยมแถวนั้นให้คุณลุงฟังไม่หยุดระหว่างเดินผ่านร้านวาฟเฟิลที่ปิดทำการไปแล้ว\n\n“อ้อ จริงสิ วาฟเฟิลใส่สตรอว์เบอร์รีร้านนั้นอร่อยดีนะ”\n\n“…?!”\n\nสิ่งที่เอคไดซิสมองข้ามไปก็คือความจริงที่ว่า มอร์ดนั้นได้รับความนิยมอย่างล้นหลาม\n\nคณะอัศวินโดยพื้นฐานแล้วคือฐานที่มั่นของผู้แข็งแกร่ง ที่ซึ่งลูกผู้ชายดำเนินชีวิตตามกฎของผู้แข็งแกร่ง\n\nย่อมเป็นเรื่องยากที่จะไม่ชอบชายชาวโดรเวียนผู้ภาคภูมิใจในความเป็นชายชาตรีเหนือชายใด ยิ่งไปกว่านั้น มอร์ดยังเป็นกันเอง มั่งคั่ง (ต้องขอบคุณความเคลื่อนไหวของกษัตริย์ไอนาร์) และโดยทั่วไปก็ใจดีมีเมตตา\n\nเอคไดซิสซึ่งถูกรังเกียจด้วยเหตุผลที่ตรงกันข้ามอย่างสิ้นเชิง บัดนี้จ้องมองมอร์ดด้วยสีหน้ารวดร้าวใจอย่างแสนสาหัส\n\nคนทรยศ\n\nโลกใบนี้มีแต่คนทรยศเต็มไปหมด\n\nนักศึกษามหาวิทยาลัยวัย 20 ปีผู้เพิ่งตระหนักถึงความจริงอันโหดร้ายนี้ พึมพำเสียงแผ่วพลางก้มหน้าลง\n\n“กลับบ้านกันเถอะค่ะ ไม่สนุกแล้ว”\n\n“แวะหาอะไรกินระหว่างทางหน่อยไหมล่ะ?”\n\n“พอเลยค่ะ!”\n\nและแล้ว ทั้งสองก็เริ่มมุ่งหน้าเดินกลับบ้านไปครู่หนึ่ง\n\nเบื้องหน้าสายตาของพวกเขา ร่างอันคุ้นเคยแต่ไม่คาดคิดพลันปรากฏกายขึ้น\n\n“ไม่ได้เจอกันนานเลยนะ พี่ชาย”\n\n“…เจ้าหาที่นี่เจอได้ยังไง?” (มอร์ด)\n\n“จะมีเหตุผลอะไรที่ข้าต้องมาถึงที่นี่ได้อีกนอกเสียจากพระบัญชาของฝ่าบาทเล่า?”\n\n“คุณลุง!”\n\n“โอ้ เอซี่ สบายดีไหม? รู้สึกเหมือนเวลาผ่านไปตั้งสิบปีทั้งที่เจ้าเพิ่งจากมาแค่สามเดือนเองนะ ความแตกต่างมันเห็นได้ชัดเชียวล่ะเวลาที่มีองค์หญิงของพวกเราอยู่กับตอนที่ไม่อยู่”\n\n“ฮิๆ คุณลุงสบายดีไหมคะ?”\n\nบุคคลผู้ปรากฏกายขึ้นภายใต้แสงไฟอันชวนหลงใหลยามค่ำคืน พร้อมเรือนผมยุ่งเหยิงที่ชี้ฟูขึ้นราวกับมีชีวิตจิตใจเป็นของตัวเอง คือบุรุษผู้เปี่ยมด้วยความห้าวหาญ\n\nฮัสคาลของไอนาร์ เขาก็คือ ดิโอนาร์ เอริกสัน"
    },

      "title": "บทที่ 53",
      "content": "– ซ่า ซ่า\n\nสายฝนแห่งฤดูร้อนเริ่มโปรยปรายลงมา เป็นสายฝนอันเย็นฉ่ำที่เพิ่มความหนาแน่นให้กับความมืดมิดยามราตรีและช่วยคลายความร้อนอบอ้าวในอากาศ\n\nอีวานจ้องมองบ้านที่มืดสนิทท่ามกลางหยาดฝนที่ตกกระทบลงมา\n\nแม้เสียงสายฝนจะผสมปนเปไปกับทัศนวิสัยที่พร่ามัวลง ทว่าสิ่งหนึ่งที่แน่ชัดก็คือ ภายในบ้านหลังนี้ไม่มีวี่แววของสิ่งมีชีวิตหลงเหลืออยู่เลย\n\n“ชิ”\n\nเขาจำดิโอนาร์ได้ อันที่จริง เขาจดจำคนสนิทใกล้ชิดของผู้นำประเทศต่างๆ ได้แทบทั้งหมด รวมถึงเหล่าฮัสคาลรุ่นเก่าของไอนาร์อีกหลายคนที่เขาไม่เคยพบหน้ามาก่อนด้วยซ้ำ\n\nฮัสคาลบางส่วน รวมถึงมอร์ด ต่างก็ถูกสหราชอาณาจักรจับตามองอย่างใกล้ชิดในฐานะ ‘ตัวสำรอง’ เหล่าบุคคลผู้มีแววรุ่งโรจน์ซึ่งถูกคาดหมายว่าจะเข้ามาเติมเต็มช่องว่างในปาร์ตี้ผู้กล้า\n\nอีวานเองก็เช่นกัน รวมถึงตัวเขาด้วย แต่ละตำแหน่งล้วนมีการเตรียมตัวสำรองเอาไว้ และในบรรดาคนเหล่านั้น ดิโอนาร์ถูกมองว่าเป็นผู้สืบทอดตัวเต็งของไอนาร์\n\nหมอนั่นลงมือไปแล้วงั้นหรือ? อีวานลังเลอยู่ครู่หนึ่งก่อนจะส่ายศีรษะ\n\nไม่น่าใช่\n\nบรรดา ‘แขก’ ในเฟรเชนกายา รวมถึงเอคไดซิส ต่างก็อยู่ภายใต้การดูแลของกองบัญชาการต่อต้านข่าวกรอง แม้ว่าระดับการเฝ้าระวังจะไม่ได้เข้มงวดนัก แต่นั่นก็หมายความว่าพวกเขาเป็นเป้าหมายที่ได้รับการคุ้มครอง\n\nยิ่งไปกว่านั้น เวลานี้กองบัญชาการต่อต้านข่าวกรองกำลังระบุตัว ‘กบฏชาวโดรเวียน’ ว่าเป็นผู้ต้องสงสัยก่อการร้ายที่มีแนวโน้มสูงสุด ต่อให้ดิโอนาร์จากโดรเวียนแทรกซึมเข้ามาได้อย่างสมบูรณ์แบบเพียงใด มันก็จะติดร่างแหการเฝ้าระวังทันทีที่ปรากฏตัวขึ้นข้างกายเอคไดซิส\n\nฉะนั้น เหตุผลที่บ้านว่างเปล่าอยู่ในตอนนี้… ย่อมบ่งชี้ว่ามอร์ดกับเอคไดซิสจงใจพากันออกไปข้างนอกด้วยตัวเอง\n\nแม้จะไม่น่าเป็นไปได้นัก แต่ก็ใช่ว่าจะเป็นไปไม่ได้ เอาเป็นว่าทั้งคู่ออกไปเดินเล่นยามค่ำคืนก็แล้วกัน\n\n“แย่แล้ว”\n\nอีวานหันหลังกลับแล้วออกวิ่งทันที\n\nเม็ดฝนกระหน่ำลงมาหนักหน่วงขึ้นทุกขณะ\n\n***\n\nเอนริเก้เช็ดมีดเปื้อนเลือดกับแขนเสื้อพลางขมวดคิ้วมุ่น\n\n“อยู่ข้างหลังไว้”\n\n“แต่ว่า อาจารย์คะ! หนูเองก็ควรจะทำอะไรบ้างไม่ใช่เหรอคะ?”\n\n“สังเกตการณ์และเรียนรู้ให้ดี นั่นคือหน้าที่ของเธอ”\n\nท่ามกลางความมืดมิด ดวงตาสีแดงสดวาวโรจน์ขึ้น ดวงตาอันคลุ้มคลั่งที่อบอวลด้วยกลิ่นคาวเลือดของแวมไพร์\n\nคลองส่งน้ำใต้ดินของเฟรเชนกายา เมืองแห่งนี้มีคูคลองซึ่งเก่าแก่ยิ่งกว่าประวัติศาสตร์ของประเทศ และได้ขยายตัวจนกลายเป็นเขาวงกตอันสลับซับซ้อนตลอดหลายปีที่ผ่านมา\n\nตามซอกหลืบมืดมิด เงาร่างขนาดเล็กค่อยๆ ทยอยคืบคลานออกมาทีละตัว\n\n– กรึ๊กๆๆ!!\n\nภายใต้แสงสลัวของคลองใต้ดิน ผิวหนังสีเทาซีดจางๆ พลันเผยโฉม\n\nก็อบลินถ้ำ เหล่านักขุดเหมือง\n\nเอนริเก้พึมพำพลางขมวดคิ้ว\n\n“ฉันน่าจะคาดคิดไว้ตั้งแต่ตอนที่พวกคนแคระโผล่มาแถบชานเมืองแล้ว”\n\nพวกคนแคระขุดเจาะผ่านเส้นทางใต้ดิน เชี่ยวชาญการแทรกซึมแนวหลังและการก่อกวนแนวรบของศัตรู\n\nตราบใดที่มีผืนดิน ไม่มีสถานที่ใดที่พวกคนแคระไม่อาจแทรกซึมเข้าไปได้ นั่นคือสามัญสำนึกทั่วไป แน่นอนว่าหากคำนึงถึงเส้นทางเสบียงและค่าบำรุงรักษา มันก็อาจไม่ใช่ความจริงสัมบูรณ์เสียทีเดียว แต่ช่างเถอะ\n\nย่อมสมเหตุสมผลที่จะสันนิษฐานว่าในพื้นที่ที่ถูกคนแคระแทรกซึม พวกมันได้วางเครือข่ายทางลับของตนเองไว้แล้ว นั่นหมายความว่ามีทหารกองโจรคนแคระจำนวนไม่น้อยกำลังก่อการร้ายอยู่ในเขตนี้\n\nประเทศนี้เพิ่งจะได้ลิ้มรสชาติของสันติภาพหลังจากผ่านพ้นไปเพียงสี่ปีเท่านั้น\n\nไม่สิ ไม่ใช่หรอก ตัวเธอเองก็เหมือนกัน เรื่องนี้เพียงแค่หมายความว่ามนุษย์กำลังเริ่มหลงลืมสงครามไปแล้วต่างหาก\n\nโดยสัญชาตญาณ ผู้คนมักหลีกเลี่ยงความทรงจำด้านลบ สงครามเป็นเหตุการณ์ที่เปรียบเสมือนบาดแผลทางประวัติศาสตร์ และมนุษย์ก็กำลังรีบเร่งกลบทับประวัติศาสตร์เหล่านั้นด้วยความทรงจำด้านบวกอย่างรวดเร็ว\n\nด้วยเหตุนี้ อารยธรรมจึงได้รับการฟื้นฟูขึ้นใหม่ด้วยความเร็วอันน่าทึ่ง ซึ่งไม่อาจมองว่าเป็นเรื่องเลวร้ายไปเสียทั้งหมด ทว่าเธอคือข้อยกเว้น\n\nอย่างน้อยก็เธอคนหนึ่งล่ะ ผู้ที่ได้ชื่อว่าเป็นผู้ปกครองแห่งคลองใต้ดินเฟรเชนกายา มือสังหารแห่งปาร์ตี้ผู้กล้า และก่อนหน้านั้น… เธอคือผู้ที่สังหารผู้อาวุโสและก้าวขึ้นเป็นราชินีแวมไพร์แห่งเฟรเชนกายา\n\n“ลูเซีย จับตาดูให้ดี”\n\nเอนริเก้กระซิบพลางกระชับมีดสั้นสองเล่มในท่าจับกลับคม\n\nกรึ๊กๆๆ กรึ๊ก เสียงกรีดร้องอันบิดเบี้ยวดังก้องสะท้อนไปทั่วคลองใต้ดิน\n\nก็อบลินนักขุดเหมืองคือเผ่าทาสของพวกคนแคระ และการที่หน่วยรบพิเศษคนแคระซ่อนตัวอยู่ที่ไหนสักแห่งในความมืด ก็หมายความว่าพวกมันส่งก็อบลินออกมาเป็นแนวหน้าแล้ว\n\nเรื่องนี้จะจบลงตรงนี้ จะไม่มีปีศาจหน้าไหนบังอาจบุกรุกขึ้นไปบนตัวเมืองได้แม้แต่ตัวเดียว\n\nเอนริเก้สูดลมหายใจเฮือกหนึ่งแล้วพุ่งทะยานออกไปราวกับภูตพราย ท่ามกลางดวงตาสีแดงนับไม่ถ้วนที่กะพริบวาบในความมืด ฝ่าเข้าไปในขบวนทัพหนาทึบราวกับพงไพรและฝูงปีศาจที่ส่งเสียงอื้ออึง\n\n– กรึ๊ก….\n\n– ก๊าก\n\nฝูงก็อบลินที่กรูเข้ามาพลันแข็งค้างในชั่วพริบตา\n\nสิ่งที่ดังก้องตามมาคือเสียงคมมีดเฉือนผ่านที่ชวนให้ขนลุกชัน\n\n– ฉัวะ—โพล๊ะ!!\n\nศีรษะของฝูงก็อบลินที่อัดแน่นอยู่เบื้องหน้าระเบิดกระจุยพร้อมกันในคราวเดียว\n\nในห้วงเวลาที่หยุดนิ่ง สายฟ้าฟาดแลบแปลบปลาบขึ้นเพียงลำพัง ก่อนจะหวนคืนสู่กระแสธารแห่งกาลเวลาในที่สุด\n\nท่วงท่าอันประณีตดุจปลายพู่กันของยอดนักดาบ ความตายที่ถักทอด้วยแสงสว่างดำเนินต่อไปอย่างลื่นไหล ก่อนจะซึมหายกลับเข้าไปในฝักมีด\n\nท่ามกลางสายเลือดที่โปรยปรายลงมาดุจห่าฝน เอนริเก้ก้าวเดินออกมาพลางคลายหัวไหล่\n\n“นี่แหละคือวิธีต่อสู้ของปาร์ตี้ผู้กล้า” (เอนริเก้)\n\n“สายตาของหนูยังตามไม่ทันเลยค่ะ…” (ลูเซีย)\n\n“ถ้ามองไม่ทัน ก็จงสัมผัสเอา สักวันเธอจะไปถึงจุดนั้นเอง” (เอนริเก้)\n\nเอนริเก้ตบไหล่ลูกศิษย์เบาๆ เพื่อให้กำลังใจแล้วเดินหน้าต่อไป\n\n***\n\n– ครืนนนนน….\n\nท้องถนนสั่นสะเทือนเลื่อนลั่น ในฤดูกาลนี้ ถนนที่ปูไว้สำหรับการสัญจรของรถม้าล้วนสร้างขึ้นจากก้อนอิฐขัดมัน\n\nก้อนอิฐสั่นไหวกระทบกันจนเกิดเสียงดังกึกก้อง รอยแตกร้าวปรากฏขึ้น เผยให้เห็นแนวถนนและผิวอาคารด้านนอกที่บิดเบี้ยว\n\nแผ่นดินไหว? ไม่ ไม่ใช่เลยสักนิด\n\nนี่คือเสียงของการขุดเจาะ อีวานขมวดคิ้ว ถีบพื้นอย่างรวดเร็วแล้วกระโจนทะยานขึ้นไป\n\nตึก ถีบกำแพง ดีดตัวกลับหลัง กระทบกำแพงถัดไป แล้วก็ผนังถัดไป ดีดกลับอีกครั้ง\n\nราวกับสายฟ้าฟาด เขาไต่ระดับขึ้นไปอย่างรวดเร็วจนกระทั่งพบว่าตนเองกำลังเกาะอยู่กับราวระเบียงบนดาดฟ้าของอาคารที่สูงที่สุด\n\n– ครืนนนนน…\n\nฝุ่นควันตลบอบอวลไปทั่วอากาศ ปรากฏชัดแม้ท่ามกลางสายฝนที่โปรยปราย อาคารสั่นคลอนและพื้นดินบิดเบี้ยว ถนนสายยาวเลื้อยคดเคี้ยวราวกับอสรพิษ\n\nเสียงขุดเจาะ การโจมตีนครหลวง กองทัพหลัก\n\nพวกคนแคระ\n\n“เป็นไปได้ยังไง…?”\n\nระหว่างสงครามจอมมารครั้งก่อน ‘กองทัพหลักฝ่ายขุดเจาะ’ ของพวกคนแคระถูกเหยียบย่ำจนย่อยยับไปหมดสิ้นแล้ว มันคือหนึ่งในกองทัพปีศาจที่น่าสะพรึงกลัวที่สุด กองพันจู่โจมไวเวิร์นบนฟากฟ้ากับกองระวังหลังคนแคระใต้ผืนดิน — เหล่าผู้บีบบังคับให้ยุทธวิธีต้องก้าวข้ามไปสู่อีกมิติหนึ่ง\n\nฉะนั้น จึงไม่น่าจะมีมรดกตกทอดใดหลงเหลืออยู่จาก ‘เครื่องขุดเจาะทลายปฐพี’ ของพวกคนแคระเลย อีวานยังคงจำภารกิจทำลายเครื่องขุดเจาะเครื่องสุดท้ายได้อย่างแจ่มชัด\n\nทว่า สำหรับปฏิบัติการขนาดมหึมาเช่นนี้ การโจมตีที่สามารถครอบคลุมได้ทั่วทั้งเมือง จำเป็นต้องใช้เครื่องขุดเจาะทลายปฐพีอย่างแน่นอน\n\nนั่นเป็นไปไม่ได้ ประการแรก เทคโนโลยีการขุดเจาะของคนแคระได้สูญหายไปแล้วในปัจจุบัน และประการที่สอง กว่ากองกำลังจู่โจมขนาดนั้นจะขุดเจาะทะลุผืนดินเข้ามาได้ ย่อมไม่อาจเล็ดลอดสายตาไปได้เด็ดขาด\n\nกองบัญชาการลาดตระเวนไม่ได้ไร้ความสามารถ ยิ่งไปกว่านั้น แม้แต่คราซิลอฟ ไม่ต้องพูดถึงแนวหน้า ก็ไม่ได้ตกเป็นเป้าหมายด้วยซ้ำ\n\nต้องขุดผ่านกี่ประเทศและกี่เมืองกว่าจะมาถึงคราซิลอฟได้? เดิมทีก็ไม่มีเหตุผลใดที่จะมาโจมตีเมืองแห่งนี้ตั้งแต่แรกแล้ว\n\n“ไม่สิ”\n\nยกเว้นปาร์ตี้ผู้กล้า อีวานพยักหน้า มีเหตุผลอยู่\n\nทว่า ถึงกระนั้น ปริศนาเรื่อง ‘ทำได้อย่างไร’ ก็ยังคงไร้คำตอบ\n\nประเทศอื่นๆ—เอาเถอะ นี่มันยุคก่อนสมัยใหม่ ลองสมมติว่าพวกมันหลีกเลี่ยงฐานทัพหลักและเขตเมืองใหญ่ จนสามารถแทรกซึมเข้ามาได้อย่างแนบเนียนโดยไม่มีใครสังเกตเห็น\n\nต่อให้หน่วยข่าวกรองจะบินว่อนไปทั่วโลกเก่งกาจแค่ไหน แต่จะไปจับตัวตุ่นที่มุดขุดดินอยู่ใต้พิภพได้อย่างไรกัน?\n\nทว่าประเทศนี้แตกต่างออกไป คราซิลอฟจะต้องไม่มืดบอดโดยเด็ดขาด\n\nเมื่อไม่กี่วันก่อน เพิ่งจะเกิดเหตุก่อการร้ายของคนแคระขึ้นที่ชานเมืองหลวงนี่เอง เมื่อพิจารณาจากสัญญาณบอกเหตุเช่นนั้น ย่อมไม่มีทางที่กองทัพ โดยเฉพาะกองพลรักษาการณ์นครหลวง จะไม่พยายามสืบสาวไปให้ถึงรากเหง้า\n\nกองทัพต้องล่วงรู้สถานการณ์นี้อย่างแน่นอน รู้ดีร้อยเปอร์เซ็นต์เสียด้วย\n\n“ธนาคารกลาง โรงละครทรงกลม สถาบันเซนต์ยัน มหาวิหารเซนต์เชเรห์ตา สถานีตำรวจกลางพราเชนโกเหนือ…”\n\nอีวานกวาดสายตาสำรวจจุดศูนย์กลางแรงสั่นสะเทือนในเขตเมืองอย่างรวดเร็ว โดยตั้งสมมติฐานว่ามีอุโมงค์อยู่ใต้ดินและวัตถุเวทมนตร์ขุดเจาะกำลังทำงานอยู่เบื้องล่าง\n\nด้วยการตรวจจับย้อนกลับจากจุดศูนย์กลางแรงสั่นสะเทือนและร่องรอยที่ปรากฏบนพื้นดิน รวมถึงวิเคราะห์ความรุนแรงของแรงสั่นสะเทือนที่แผ่ขยายออกไปดุจใยแมงมุม ก็จะสามารถระบุตำแหน่งจุดศูนย์กลางได้\n\nฉะนั้น สถานที่ทั้งห้าแห่งนี้คือศูนย์กลางของการโจมตีครั้งนี้\n\nและมีความเป็นไปได้สูงว่า ทั้งหมดนี้เป็นเพียงกลลวง\n\nหัวใจสำคัญคือเหล่าทายาทของปาร์ตี้ผู้กล้า\n\n“ลูเซียอยู่กับเอนริเก้ ตัดออกไปได้”\n\n“อิซาเบลล์กับออสการ์พักไว้ก่อน เพราะทั้งคู่อยู่ในเขตเดียวกัน”\n\n“แล้วก็เอลเฟียรา”\n\nทายาทปาร์ตี้ผู้กล้าคนอื่นๆ สามารถยื้อเวลาได้ระดับหนึ่ง ไม่ว่าจะกับพวกคนแคระหรือพวกกบฏ ด้วยทำเลที่พักอาศัยและคุณสมบัติเฉพาะตัวของแต่ละคน\n\nการหน่วงเวลาชั่วครู่นั้นน่าจะเพียงพอให้กองบัญชาการลาดตระเวนตอบสนองทัน\n\nดังนั้น เอคไดซิส ยัยหนูคนนี้อันตรายที่สุดในเวลานี้\n\n– ตูม!\n\nอีวานถีบกำแพงแล้วพุ่งตัวลงสู่เบื้องล่าง\n\nเขาไม่รู้กลิ่นของเอคไดซิส ทว่าหากสันนิษฐานว่ามอร์ดอยู่กับเธอด้วย เขาย่อมจำกลิ่นตัวของมอร์ดได้ขึ้นใจ\n\nเขามีความทรงจำในการต่อสู้กับไอ้หมอนั่นมาแล้วมากกว่าสองครั้ง ทั้งเลือดและเหงื่อที่หลั่งริน ประการแรก ผู้ชายโดรเวียนไม่ค่อยอาบน้ำกันอยู่แล้ว สายฝนทำได้เพียงถ่วงเวลา ไม่อาจชะล้างประสาทสัมผัสของเขาให้กระเจิดกระเจิงได้หรอก\n\n***\n\n“ทำไม… ทำไมกัน น้องชาย… ทำไม…?” (มอร์ด)\n\n“พี่ไม่เคยรู้สึกว่ามันแปลกบ้างเลยหรือ?” (ดิโอนาร์)\n\nดิโอนาร์หัวเราะร่าพลางแบกเอคไดซิสที่หมดสติพาดบ่าเอาไว้\n\nมอร์ดที่มีดาบปักคาอยู่กลางท้องทรุดตัวลงกับพื้น เอื้อมมือออกไปอย่างหอบกระเสือกกระสน ขวานที่หลุดมือตกอยู่ไกลเกินเอื้อม กระนั้นเขาก็ไม่ยอมหยุด\n\nเพราะเขาต้องปกป้องหลานสาว\n\nเพราะเธอคือลูกสาวของพี่น้องร่วมสาบาน\n\nและเพราะข้าคือพี่น้องของพี่ชายข้า\n\nนั่นคือเหตุผลเพียงหนึ่งเดียว มันคือหน้าที่ของฮัสคาล เขาโซซัดโซเซคลานเข้าหาขวานที่อยู่ห่างออกไป พึมพำด้วยมือที่สั่นเทา\n\n“หากเทวสิทธิ์ในการปกครองอันฟ้าประทาน คือสิทธิ์ของกษัตริย์และผู้ปกครองที่จะกดขี่ใครสักคน แล้วเหตุใดการปกครองของเหล่าผู้ถือครองเทวสิทธิ์จึงแตกต่างจากแดนสุขาวดีในพระคัมภีร์นักเล่า?” (ดิโอนาร์)\n\n“นั่นมันคืออะไรกันล่ะ…?” (ดิโอนาร์)\n\n“ไร้สาระสิ้นดี” (มอร์ด)\n\nดิโอนาร์หัวเราะหึๆ พลางก้มมองใบหน้าอันไร้เรี่ยวแรงของมอร์ด\n\nพวกที่ไม่เข้าใจ พวกที่ไม่อาจแม้แต่จะหยั่งถึง ย่อมไม่ต่างอะไรไปจากวัวและแกะ หากพวกมันทำได้เพียงกินหญ้าอยู่ใต้แส้ของคนเลี้ยงแกะ ก็เป็นได้แค่ซากเนื้อในโรงเชือดเท่านั้น\n\n“ยังมีเหตุผลอื่นอีกหรือไง? พ่อของข้าเป็นทาสติดที่ดิน แต่ก็ไม่มีกฎหมายข้อไหนเขียนห้ามไว้สักหน่อยว่าข้าจะขึ้นเป็นเจ้าขุนมูลนายไม่ได้”\n\n“พี่ชายข้าไม่มีวันให้อภัยเจ้าสำหรับเรื่องนี้แน่…”\n\n“ท่านไม่ให้อภัยข้าหรอก อ้อ แต่ข้าเองก็ไม่ได้คิดจะขออภัยเหมือนกัน”\n\nดิโอนาร์ยักไหล่แล้วเดินจากไป อุ้มเอคไดซิสหายลับไปตามตรอกซอกซอย\n\nครืนนนน… แรงสั่นสะเทือนยังคงดำเนินต่อไป มอร์ดถอนหายใจ รู้สึกได้ถึงเลือดในกายที่เย็นเยียบลงท่ามกลางสายฝน\n\nเขาไม่อาจปกป้องเอคไดซิสได้ เขากำลังจะตายโดยไม่ได้สู้รบอย่างสมศักดิ์ศรี ปล่อยให้ตัวเองถูกลอบโจมตีอย่างน่าสมเพช\n\nเขาคงไม่มีคุณสมบัติที่จะไปเข้าร่วมการต่อสู้อันเป็นนิรันดร์บนสรวงสวรรค์ เขาจะต้องร่วงหล่นลงสู่ก้นบึ้งของขุมนรก และนี่… ใช่ มันคงเป็นบทลงโทษที่สาสมแล้ว\n\n“ทำใจให้สบายซะ” (อีวาน)\n\n“…?” (มอร์ด)\n\nเสียงทุ้มต่ำดังก้องขึ้นเหนือศีรษะ\n\nเมื่อเงยสายตาอันพร่าเลือนขึ้น ภายใต้ท้องฟ้ายามราตรีอันมืดมิด เขาแลเห็นใบหน้าของชายผู้เปียกโชกไปด้วยสายฝน\n\n“ข้ามีคำสั่งเสีย…” (มอร์ด)\n\n“นั่นมันเอาไว้พูดตอนกำลังจะตายต่างหาก” (อีวาน)\n\nชายคนนั้นเอื้อมมือออกมา จับด้ามดาบที่ปักคาอยู่ในท้องของมอร์ดไว้แน่น พร้อมกับเสียงอันน่าสยดสยอง คมดาบถูกกระชากถอนออกมา\n\nโลหิตพุ่งกระฉูด ท่ามกลางแอ่งน้ำขัง สีแดงฉานผสมปนเปและไหลนอง\n\nชายคนนั้นก้มมองบาดแผลของมอร์ด พลางแตะสัมผัสลงไปเบาๆ\n\n“จะเจ็บหน่อยนะ”\n\n“อีวาน…”\n\n“อืม”\n\n“หลานสาวข้า หลานสาวของข้า…”\n\n“ฉันจะปกป้องเธอเอง”\n\nอีวานเปิดฝาขวดโพชั่นรักษาบาดแผลออก\n\nแม้กระทั่งในระหว่างขั้นตอนที่เทโพชั่นลงไปในแผลทะลุช่องท้องอย่างทั่วถึง มอร์ดก็กัดฟันอดทนโดยไม่ส่งเสียงร้องสักแอะ ดวงตาของเขาบวมเป่งและแดงก่ำไปด้วยเส้นเลือด\n\nเมื่อการปฐมพยาบาลฉุกเฉินสิ้นสุดลงในที่สุด มอร์ดที่หมดเรี่ยวแรงก็พึมพำเสียงแผ่วด้วยน้ำเสียงแหบพร่า\n\n“ข้า… เชื่อใจ…”\n\nอีวานแบกร่างมอร์ดที่หมดสติไป วางให้นั่งพิงอยู่ใต้ชายคาที่กันฝนได้ และคลุมร่างให้ด้วยเสื้อโค้ต\n\nตราบใดที่พลังเวทภายในกายยังคงแข็งแกร่ง ยอดมนุษย์ที่ได้รับโพชั่นรักษาบาดแผลมากพอจนปิดปากแผลได้แล้วย่อมไม่ตายเพราะภาวะตัวเย็นเกิน\n\nเขาดึงเศษแขนเสื้อที่ฉีกขาดซึ่งกำแน่นอยู่ในกำปั้นของมอร์ดออกมา น่าจะคว้าไว้ได้ทันท่วงทีระหว่างการโจมตีของดิโอนาร์ ช่างโชคดีนัก\n\n– ซู๊ดดด….\n\nกลิ่นนั้น เขาจดจำมันได้\n\nอีวานหลับตาลง สูดลมหายใจเข้าลึก จากนั้นจึงพุ่งทะยานหายเข้าไปในความมืดมิดของนครหลวง\n\n– ครืนนนนน…!!\n\nแรงสั่นสะเทือนยังคงดำเนินต่อไป\n\n***\n\n“วันนี้ พวกเราจะทำให้บัลลังก์ของคราซิลอฟว่างลง เตรียมกำลังพลให้พร้อม”\n\n“พ่ะย่ะค่ะ องค์หญิง ไม่สิ…”\n\nดมิทรีค้อมศีรษะคำนับลงอย่างนอบน้อมไปทางระเบียงที่เปียกชุ่มไปด้วยสายฝน\n\nสามครั้งที่เขาก้มศีรษะลงจรดพื้น ก่อนจะเงยหน้าขึ้นอีกครั้งเพื่อแก้ไขคำพูดที่พลั้งปากไปของตนเอง\n\n“ฝ่าบาท กระหม่อมน้อมรับพระบัญชาพ่ะย่ะค่ะ”\n\nเรือนผมสีเงินของพระองค์ที่เปียกชุ่มไปด้วยสายฝน ทอประกายเจิดจรัสอยู่ภายใต้แสงไฟบนระเบียง"
    },

      "title": "บทที่ 54",
      "content": "ความเข้าใจผิดที่แพร่หลายอย่างหนึ่งก็คือ ระหว่างฝนตก กลิ่นจะจางลงจนแยกแยะได้ยาก ความเข้าใจคลาดเคลื่อนเล็กน้อยนี้สามารถแก้ไขได้ทันทีเพียงแค่ลองเลี้ยงสุนัขดูสักตัว\n\nแม้สายฝนจะช่วยลดทอนประสาทรับกลิ่นลงบ้าง ทว่ามันไม่อาจลดความเข้มข้นของกลิ่นกายลงได้ ยิ่งไปกว่านั้น ประสาทสัมผัสของยอดมนุษย์ย่อมไม่ได้รับผลกระทบจากสายฝนฤดูร้อนธรรมดาๆ อยู่แล้ว\n\nโดยธรรมชาติแล้ว เมื่อร่างกายเปียกฝน กลิ่นจะยิ่งทวีความรุนแรงขึ้น ต่อให้คุณหยดน้ำกลั่นลงบนหนูทดลองที่ผ่านการฆ่าเชื้อแล้ว มันก็คงให้ผลลัพธ์ไม่ต่างกันนัก และเมื่อคำนึงถึงสภาพสาธารณสุขและสุขอนามัยในยุคก่อนสมัยใหม่นี้ ยิ่งแทบไม่ต้องพูดถึงเลย\n\nยิ่งไปกว่านั้น ชายที่กำลังถูกสะกดรอยตามยังวิ่งฝ่าทางไกลมาหลายวันจนกระทั่งมาถึงนครหลวง — บุรุษผู้มีพื้นเพจาก ‘โดรเวียน’\n\nหากวางอุดมการณ์ด้านสาธารณสุขอันแสนพิสดารของชาวโดรเวียนไว้ข้างหนึ่ง การแยกแยะกลิ่นของคนต่างชาติโดยทั่วไปย่อมทำได้ง่ายดายยิ่งกว่า\n\n“ทำเนียบกระทรวงการต่างประเทศงั้นเหรอ…?”\n\nอีวานพึมพำเสียงแผ่วพลางครุ่นคิดถึงเส้นทางที่ร่องรอยกลิ่นทอดยาวไป\n\nบนโลกใบนี้ มีสถานที่สามแห่งที่ผู้ลักลอบเข้าเมืองผิดกฎหมายไม่ควรย่างกรายเข้าไปเด็ดขาด\n\nประการแรก ศูนย์จัดหางานในชนบทที่เสนอค่าแรงสูงผิดปกติ\n\nประการที่สอง โรงงานท้องถิ่น (หรือฟาร์ม หรือสถานที่ทำงานประเภทไร่นาใดๆ) ที่มีพวกแห่ตามกระแสทำงานอยู่เยอะผิดปกติ\n\nสุดท้าย กระทรวงการต่างประเทศ\n\nเฉกเช่นเดียวกับในทุกบริบท หัวข้อสุดท้ายย่อมสำคัญที่สุดเสมอ ขณะที่สองกรณีแรกจบลงด้วยการถูกเอารัดเอาเปรียบอย่างแสนสาหัส กรณีสุดท้ายกลับลงเอยด้วยการประหารชีวิตจริงซึ่งดำเนินการในฐานะภารกิจทางราชการ\n\nในเกาหลีใต้ ผู้ลักลอบเข้าเมืองผิดกฎหมายจะถูกส่งตัวกลับประเทศต้นทางโดยทันที ทว่าคราซิลอฟผู้เปี่ยมความเมตตาอาจยื่นข้อเสนอสองทางเลือกให้ในกรณีนี้\n\n1. กลับไปยังบ้านเกิดของเจ้า แล้วรับความตายจากกษัตริย์ของเจ้าเสีย\n\n2. ปฏิบัติตามกฎหมายของพวกเรา แล้วรับความตายจากพวกเราเสีย\n\nหากจะตีความให้ฟังดู ‘สูงส่ง’ ขึ้นอีกสักนิด ก็อาจเรียกได้ว่าเป็นการมอบทางเลือกอันน่าอัศจรรย์ระหว่างการเนรเทศกับการออกสัญชาติให้ใหม่ (ในโลกนี้ แม้แต่พลเมืองที่ตายไปแล้วก็ยังนับเป็นพลเมือง เพราะยังคงต้องเสียภาษี)\n\nกระทรวงการต่างประเทศแห่งคราซิลอฟเป็นการผนวกรวมระหว่างกระทรวงการต่างประเทศของสาธารณรัฐเกาหลี กองทัพ (รัฐบาลทหารสายตรงที่ไม่ขึ้นต่อราชสำนัก ฝ่ายบริหารการทหาร) และสำนักงานตำรวจที่มุ่งเป้าจัดการเหล่าขุนนางต่างชาติ (ในโลกนี้ไม่มีกฎหมายเอาผิดฐานล่อลวงหรอกนะ)\n\nยิ่งไปกว่านั้น ประมุขแห่งกระทรวงการต่างประเทศ หรือรัฐมนตรีว่าการกระทรวงการต่างประเทศ ก็คือพระราชโอรสองค์โตในกษัตริย์องค์ปัจจุบัน คิริลล์ที่ 2 มกุฎราชกุมารอเล็กซานเดอร์นั่นเอง\n\n“มือสมัครเล่น… เกินไปแล้ว”\n\nอีวานขมวดคิ้วมุ่น\n\nตามสามัญสำนึกย่อมบ่งชี้ว่า ต้นเหตุของความโกลาหลในเมืองหลวงเวลานี้ก็คือเจ้าชายอเล็กซานเดอร์\n\nเชื้อพระวงศ์ลึกลับผู้หายสาบสูญอย่างไร้ร่องรอยผู้นี้ ต้องสมคบคิดกับรัฐบาลทหารกองพลรักษาการณ์นครหลวงเพื่อลักลอบนำพวกคนแคระเข้ามาในประเทศอย่างแน่นอน\n\nเป้าหมายน่าจะเป็นเหล่าทายาทของปาร์ตี้ผู้กล้า ฉะนั้นจุดประสงค์จึงหนีไม่พ้นการสร้างความแตกแยกภายในหรือความโกลาหลไปทั่วทั้งสหราชอาณาจักร\n\nสามารถจุดชนวนกลอุบายนับไม่ถ้วนได้ด้วยการเดินหมากเพียงตาเดียว เขาคือนักเล่นหมากรุกที่ยอดเยี่ยมอย่างไม่ต้องสงสัย ทว่าสถานการณ์ในปัจจุบันก็นับว่าประหลาดอยู่ดี\n\nหากกระทรวงการต่างประเทศให้ที่พักพิงแก่ผู้ลักลอบเข้าเมืองต่างชาติ ชีวิตของรัฐมนตรีว่าการกระทรวงการต่างประเทศย่อมไม่อาจรับประกันได้แม้แต่ในเกาหลีใต้ (ส่วนในคราซิลอฟ สามารถรับประกันได้แน่นอน นั่นคือตายสถานเดียว)\n\nอีวานยักไหล่หนหนึ่งแล้วคล้องเชือกเข้ากับขวานของตน\n\n‘การลอบเข้าไปในหน่วยงานส่วนกลางระดับชาตินับเป็นเรื่องที่หาได้ยาก’\n\nแต่เขาก็ไม่ได้บอกว่าไม่เคยทำสักหน่อย\n\nระหว่างรับราชการประจำการ เขามีประสบการณ์ในปฏิบัติการพิเศษแทบทุกภารกิจที่มีคำว่า ‘แทรกซึม’ อยู่ในรหัสปฏิบัติการ (ยกเว้นปราสาทจอมมาร)\n\n***\n\nในเวลานี้ที่เฟรเชนกายา กำลังเกิดเหตุก่อการร้ายวางระเบิดโดยกลุ่มนักเคลื่อนไหวภาคพลเมืองผู้ทรงธรรม การลักพาตัวบุคคลสำคัญโดยกลุ่มแบ่งแยกดินแดน และสงครามกองโจรโดยเหล่าคอมมิวนิสต์ติดอาวุธ (คอมมิวนิสต์จริงๆ นั่นแหละ เพราะพวกมันคือคนแคระ) เกิดขึ้นพร้อมเพรียงกันในคราวเดียว\n\nท่ามกลางสถานการณ์อันสับสนอลหม่านเช่นนี้ หากจะมีผู้ที่สมควรเข้าปราบปรามเป็นกลุ่มแรกและชิงลงมือก่อน หนึ่งย่อมเป็นกองพลรักษาการณ์นครหลวง และอีกหนึ่งย่อมเป็นกองบัญชาการต่อต้านข่าวกรอง\n\nเมื่อพิจารณาจากที่กองพลรักษาการณ์นครหลวงดูเหมือนจะปล่อยให้กองกำลังคนแคระติดอาวุธบุกเข้ามาได้ ก็เห็นได้ชัดว่าได้รับอิทธิพลมาจากอเล็กซานเดอร์\n\nในสถานการณ์เช่นนี้ อีวานจึงอดครุ่นคิดไม่ได้\n\n‘กองบัญชาการต่อต้านข่าวกรองมัวทำอะไรอยู่กันแน่?’\n\nเหตุผลที่คำถามอันสมเหตุสมผลนี้ไม่อาจได้รับคำตอบในทันทีก็คือ เจ้าหน้าที่แทบทั้งหมดของกองบัญชาการต่อต้านข่าวกรองในเวลานี้ต่างแยกย้ายแบ่งกำลังออกเป็นสองส่วน โดยแต่ละส่วนกำลังปฏิบัติราชการแผ่นดินอยู่ในสถานที่ที่แตกต่างกัน\n\n“นี่มัน นี่มัน… กบฏชัดๆ!”\n\n“ไม่ใช่กบฏ” (ดมิทรี)\n\nดมิทรีและเหล่าเจ้าหน้าที่กองบัญชาการต่อต้านข่าวกรองกำลังเข้ายึดห้องทำงานผู้บัญชาการกองพลรักษาการณ์อยู่ในขณะนี้\n\nเขานั่งไขว่ห้างบนเก้าอี้แสนสบายในห้องผู้บัญชาการ หยิบซิการ์ชั้นเลิศราคาแพงที่เก็บไว้ในลิ้นชักออกมาแล้วเอ่ยถาม\n\n– ฉับ\n\nลูกน้องผู้คล่องแคล่วรีบตัดปลายซิการ์อย่างรวดเร็วและจุดไฟให้ด้วยเวทมนตร์ที่ปลายนิ้ว เสียงเผาไหม้ดังซ่าเบาๆ ควันยาสูบที่อบอวลด้วยกลิ่นอัลมอนด์และวานิลลาลอยกรุ่นขึ้นมาจางๆ\n\n“เจ้ารู้ความหมายของคำว่ากบฏหรือเปล่า?” (ดมิทรี)\n\n“การกระทำของแก สิ่งที่พวกแก… สิ่งที่พวกแกกำลังทำอยู่นี่…”\n\n“นี่ไม่ใช่กบฏ กบฏคือคำประณามที่ตกใส่หัวผู้พ่ายแพ้ หากลงมือกระทำการเรียกว่าการปฏิวัติ ถ้าล้มเหลวก็แปรเปลี่ยนเป็นกบฏ แต่หากมีชัยชนะขึ้นมา…”\n\nเขาสูดควันซิการ์เข้าไปลึกๆ ก่อนจะค่อยๆ พ่นออกมา\n\nท่ามกลางกลุ่มควันหนาทึบ ดวงตาสีครามของพันโทหนุ่มทอประกายวาวโรจน์\n\n“ช่างโอหัง”\n\n“บังอาจนัก… ไอ้พวกกบฏ!!”\n\n“กล้าเอ่ยคำว่ากบฏต่อหน้าพวกเรา นับว่าใจกล้าไม่เบาเลยนี่ ท่านพันตรี”\n\nดมิทรีหัวเราะหึๆ แล้วดีดนิ้ว รองผู้บังคับบัญชาจึงส่งปืนพกขนาดเหมาะมือให้เขา\n\nด้วยปืนพกในมือ เขาเคาะลงบนโต๊ะเบาๆ รายงานสองฉบับและสำเนาเขียนด้วยลายมือถูกวางแผ่อยู่บนนั้น\n\n“นี่คือรายงานการสอบสวนที่เจ้ารวบรวมขึ้นหลังเหตุก่อการร้ายของคนแคระที่ชานเมืองเฟรเชนกายา ส่วนนี่คือบันทึกการลาดตระเวนชายแดนที่เจ้าเขียนมาตลอดหนึ่งเดือนที่ผ่านมา และนี่… คือสิ่งที่พวกเราได้มา ‘โดยบังเอิญ’ ‘สำเนาบันทึกข้อความสั่งการลับ’”\n\n“แกไปเอามาได้ยังไง…?”\n\n“ความอยากรู้อยากเห็นว่า ‘ความลับ’ มันมีอะไรซ่อนอยู่บ้างน่ะ มันเป็นงานของพวกเราอยู่แล้ว”\n\nดมิทรีหัวเราะเบาๆ พลางกวาดสายตาอ่านสำเนาบันทึก\n\n“ผู้เรียกตัวคือเจ้าชายอเล็กซานเดอร์ ส่วนเนื้อหารายงานหลัก โอ้ วางแผนงานวิศวกรรมโยธาและการฝึกภาคสนามเพื่อกลบเกลื่อนเสียงขุดเจาะของกองพันทหารช่างคนแคระที่มุ่งหน้าสู่ใต้ดินในเมืองหลวงงั้นเรอะ? ช่างรอบคอบเสียจริง”\n\n“มะ มันเป็นการใส่ร้าย! นั่นมันแผนสมคบคิด!”\n\n“ข้าพูดผิดไปหรือไง? ไม่ใช่แผนสมคบคิด แต่เป็นการผจญภัยสุดมหัศจรรย์ต่างหาก ลักลอบนำพวกปีศาจเข้ามาในเฟรเชนกายา… ช่างมีจิตวิญญาณนักผจญภัยเกินคาดสำหรับข้าราชการ ไม่น่ามาเป็นทหารเลยนะ”\n\nดมิทรีสังเกตดูท่านพันตรีที่กำลังสะอื้นไห้คุกเข่าจมกองเลือดอย่างสงบเยือกเย็น\n\nขณะที่ประตูห้องแง้มเปิดอยู่ ดมิทรีก็เอ่ยถามอย่างใคร่รู้โดยมีซิการ์คีบอยู่ในมือ\n\n“ตอนนี้เจ้าชายอเล็กซานเดอร์ตัวจริงอยู่ที่ไหนกันแน่?”\n\n“มะ หมายความว่ายังไงกัน? องค์ชายก็ย่อมประทับอยู่ในพระราชวังหลวง…”\n\n“พวกเราคงต้องเรียนรู้ลูกไม้ตัดหางหนีเอาตัวรอดสักอย่างสองอย่างเสียแล้ว ทำยังไงถึงจะดำเนินแผนการซับซ้อนขนาดนี้ได้โดยไม่เผยตำแหน่งที่อยู่แม้แต่แห่งเดียวกันนะ?”\n\nดมิทรีลุกขึ้นยืนพร้อมรอยยิ้มฝืดเฝื่อน เขายกปืนพกขึ้นอย่างเชื่องช้าแล้วหันปากกระบอกปืนเข้าหาพันตรีผู้นั้น\n\n“ขอถามอะไรสักอย่างก่อนประหารก็แล้วกัน”\n\n“ไว้ชีวิตข้าด้วย ขะ ข้าไม่รู้อะไรเลย มันเป็นการใส่ร้าย แผนใส่ร้าย องค์หญิง… ไม่ ไม่สิ! ได้โปรดให้ข้าเข้าเฝ้าฝ่าบาทที!”\n\n“ความจงรักภักดีของข้าราชการควรมุ่งตรงไปที่ใด?”\n\n“พะ พูดเรื่องอะไรของแก! ก็ย่อมต้อง… ย่อมต้องมุ่งตรงต่อความยิ่งใหญ่แห่งราชวงศ์คราซิลอฟ…”\n\n– กริ๊ก\n\n– ปัง!\n\nกลุ่มควันหนาแน่นซึ่งแตกต่างจากควันบุหรี่โดยสิ้นเชิงพวยพุ่งกระจายออกจากปากกระบอกปืนพร้อมกับที่ริมฝีปากของท่านพันตรีปิดสนิทลง\n\nดมิทรีส่งปืนคืนให้ผู้ช่วย สวมถุงมือ แล้วหันหลังเดินจากไป\n\n“บันทึกไว้ด้วย โทษทัณฑ์สำหรับกบฏทรยศที่สมคบคิดต่อต้านดอกแมกโนเลียแห่งแผ่นดินคือการประหารชีวิตตามพระราชกฤษฎีกา”\n\n“ครับ ท่านพันโท”\n\n“แล้วมกุฎราชกุมารตัวปลอมล่ะ?”\n\n“หน่วยที่ 2 และหน่วยที่ 5 รายงานว่าเข้าควบคุมพระราชวังหลวงได้สำเร็จแล้วครับ”\n\n“หน่วยที่ 3 ล่ะ?”\n\n“เมื่อสิบห้านาทีก่อน พวกเขาประสบความสำเร็จในการ ‘อารักขา’ ‘พระราชาองค์ก่อน’ จากเหตุก่อการร้าย ‘กบฏทรยศ’ แล้วครับ”\n\n“ดี แล้ววัตถุระเบิดในเมืองล่ะ?”\n\n“หน่วยที่ 4 ระบุตำแหน่งที่ฝังและจำนวนวัตถุระเบิดเสร็จสิ้นแล้วครับ ท่านพันโท คำสั่งสำหรับปฏิบัติการรื้อถอนล่ะครับ…?”\n\n“ไม่ ไม่ต้องทำแบบนั้น”\n\nดมิทรีเปิดประตูห้องทำงานผู้บัญชาการออกแล้วกล่าวด้วยน้ำเสียงสุขุมจริงจัง\n\n“หากไม่มีเสียงปืนใหญ่เฉลิมฉลอง ก็ไม่สมกับเป็นพิธีสืบราชสมบัติที่แท้จริง ถ้าไอ้สารเลวพวกนั้นอยากจะระเบิดเฟรเชนกายานัก ก็ปล่อยให้พวกมันทำไปเลย”\n\n“…แล้วพลเรือนในเขตรัศมีระเบิดล่ะครับ?”\n\n“อพยพพลเรือนออกไปให้หมด มีความจำเป็นอะไรที่ต้องมานั่งดูการนองเลือดอย่างไร้จุดหมายด้วยเล่า? สิ่งสำคัญคือเสียงระเบิดต่างหาก ไม่ใช่ยอดผู้เสียชีวิต”\n\nผู้ที่วางระเบิดคืออาชญากรต่างชาติ\n\nผู้ที่ว่าจ้างอาชญากรผู้นั้นให้มาระเบิดเฟรเชนกายาคือมกุฎราชกุมารอเล็กซานเดอร์\n\nเป้าหมายของเจ้าชายคือความโกลาหลในเฟรเชนกายา ช่องโหว่เพื่อการสืบราชสมบัติอย่างราบรื่น ทว่าแผนการนั้นถูกขัดขวางลงได้ จากนั้นมกุฎราชกุมารก็หายสาบสูญไปอย่างไร้ร่องรอย และพระราชาซึ่งทรงตกพระทัยต่อการก่อกบฏของพระโอรสจึงทรงสละราชสมบัติ\n\nเนื่องจากทุกสิ่งล้วนตั้งอยู่บนพื้นฐานของความจริง หน้าที่ของกองบัญชาการต่อต้านข่าวกรองจึงมีเพียงการประกาศเรื่องนี้ให้พลเมืองและประชาคมโลกได้รับทราบเท่านั้น\n\n“แล้วพวกทายาทของปาร์ตี้ผู้กล้าล่ะครับ?”\n\n“นั่นเป็นงานของรุ่นพี่อยู่แล้ว อย่าไปสอดมือยุ่ง หมวดเปโตรวิชไม่ชอบให้ใครมาก้าวก่ายในเขตรับผิดชอบของตัวเองหรอก”\n\nชิ้นส่วนเดียวที่ขาดหายไปในสถานการณ์นี้ก็คือคนตัดไม้คนหนึ่ง\n\nระหว่างสงคราม สุดยอดเจ้าหน้าที่ภาคสนามที่ถูกปั้นขึ้นจากหน่วยกวาดล้างอย่างอีวาน เปโตรวิช ย่อมจะเป็นผู้เติมเต็มช่องว่างนั้นเอง\n\nเพียงเท่านี้ ทุกสิ่งทุกอย่างก็เสร็จสมบูรณ์ ดมิทรีหัวเราะเบาๆ ด้วยหัวใจที่ปลอดโปร่งโล่งสบาย\n\n***\n\nเอคไดซิสตื่นขึ้นมาพร้อมกับอาการปวดศีรษะจี๊ดจนสั่นสะท้านเล็กน้อย เธอฝืนลืมตาขึ้นอย่างยากลำบาก\n\nห้องมืดสลัวด้านในดูอึมครึมอย่างที่สุด… แทบจะเหมือนห้องขัง… ไม่สิ มันคือคุกจริงๆ ด้วยซ้ำ\n\nนี่มันเรื่องอะไรกัน? ทำไมฉันถึงถูกจับตัวมาได้ล่ะ? คุก…? ฉันไปทำความผิดอะไรไว้กันแน่…?\n\nเอคไดซิสเงยหน้ามองขึ้นด้านบน แม้จะต้องเผชิญความเจ็บปวด แต่เธอก็ไม่ได้รู้สึกอับอาย มีเพียงความรู้สึกว่าตนเองไม่ได้รับความเป็นธรรมอย่างที่สุด\n\n“ฟื้นแล้วเหรอ เอซี่?”\n\n“บะ เบลล่า! แล้วออสการ์ก็อยู่ด้วยเหรอ?!”\n\nเธอหันไปพบคนทั้งสองที่มุมหนึ่งของห้องขังเข้าจึงยิ้มออกมาอย่างสดใส เออ ก็สมเหตุสมผลดีนี่นา!\n\n“พวกเธอมาช่วยฉันใช่ไหม!”\n\n“เปล่า พวกเราเองก็โดนจับมาเหมือนกัน”\n\nอิซาเบลล์และออสการ์ตอบกลับด้วยรอยยิ้มอันแสนห่อเหี่ยว\n\n***\n\n“พวกทิลีสก็ถูกจับตัวมาด้วยเหมือนกันแฮะ”\n\nอีวานซึ่งกำลังก้มมองดิอันที่นอนหมดสติพร้อมบาดแผลอยู่เอ่ยพลางเดาะลิ้นเบาๆ\n\nสถานที่ที่พบตัวเขาคือห้องสอบสวนบนชั้นสองของทำเนียบกระทรวงการต่างประเทศ\n\nต่างจากมอร์ดและคนอื่นๆ เจ้าหมอนี่ไม่ได้มีบาดแผลฉกรรจ์ถึงชีวิต นับว่าโชคดี นั่นหมายความว่าไม่มีคนทรยศอยู่ในทิลีส\n\nหากทิลีสมีส่วนพัวพันกับสถานการณ์นี้ด้วย ย่อมไม่มีโอกาสที่ดิอันจะถูกลักพาตัวมาแบบยังมีชีวิตอยู่หรอก พวกมันคงต้องฆ่าเขาทิ้งเพื่อปิดปากไปแล้ว\n\nอีวานเดาะลิ้นอีกครั้งแล้วเปิดประตูห้องสอบสวนออกไป\n\n“กองบัญชาการต่อต้านข่าวกรอง… ต้องจับมาฝึกใหม่เสียแล้ว”\n\nมีช่องโหว่มากมายขนาดนี้ในการอารักขาบุคคลสำคัญระดับชาติ จะเรียกตัวเองว่าเป็นหน่วยจารกรรมภายในได้ยังไงกัน?\n\nอีวานรู้สึกเอือมระอา เหตุการณ์แบบนี้ไม่เคยเกิดขึ้นเลยสมัยที่เขายังประจำการอยู่\n\nเขานึกถึงแผนการฝึกฝนอีกนับไม่ถ้วนที่สามารถนำมาใช้กับกองบัญชาการต่อต้านข่าวกรองได้ ก่อนจะก้าวเดินต่อไป\n\n– ตึก ตึก\n\nดวงไฟเวทมนตร์ที่แตกหักกะพริบวูบวาบอยู่ตามโถงทางเดินของทำเนียบกระทรวงการต่างประเทศ\n\nโลหิตและน้ำฝนเจิ่งนองอยู่บนพื้น ก่อเกิดเสียงเฉอะแฉะดังขึ้นในทุกย่างก้าว\n\nบนเส้นทางที่สั้นที่สุดมุ่งสู่ชั้นบนสุด เศษซากของกองกำลังติดอาวุธทั้งหมดที่เคยขวางทางอีวานกำลังกะพริบเป็นสีแดงฉานอยู่ใต้แสงไฟ\n\nอีวานเดินไปตามโถงทางเดินอย่างเงียบเชียบ โดยไม่มีแม้แต่เสียงหอบหายใจเลยสักนิด"
    }
