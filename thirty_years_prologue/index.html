      "title": "บทที่ 58",
      "content": "อีวานตื่นขึ้นมาพลางยกมือขึ้นกุมศีรษะแล้วลืมตาขึ้น สติสัมปชัญญะค่อยๆ คืนกลับมาอย่างเลือนรางพร้อมกับอาการปวดศีรษะตุบๆ\n\nความรู้สึกไม่ต่างอะไรกับอาการเมาค้างหลังจากดื่มสุราตลอดคืน ทว่าน่าประหลาดสำหรับยุคสมัยนี้ อีวานเป็นคนที่แทบไม่แตะต้องเครื่องดื่มแอลกอฮอล์เลย ฉะนั้น เขาจึงไม่ควรจะเกิดอาการเมาค้างได้\n\nเขาผลักผ้าห่มกำมะหยี่เนื้อนุ่มออกแล้วลุกขึ้นนั่งบนเตียง\n\n“อะไรกัน…?”\n\nผ้าห่มกำมะหยี่? เตียงนอนงั้นเหรอ?\n\nความคิดของอีวานดิ่งวูบลงอย่างรวดเร็ว เขาไม่มีทางตื่นขึ้นมาบนเตียงหรูแบบนี้แน่ ปกติเขานอนเพียงบนโซฟาในห้องทำงานผู้อำนวยการเท่านั้น (ตอนที่เอนริเก้มาเห็นเข้า เธอโกรธเป็นฟืนเป็นไฟเลยทีเดียว)\n\nยิ่งสับสนมากเท่าใด ก็ยิ่งจำเป็นต้องเคลื่อนไหวให้ช้าลงเท่านั้น เขายันกายลุกขึ้นอย่างระมัดระวังแล้วกวาดสายตาสำรวจสภาพแวดล้อมรอบตัว ความระแวดระวังเช่นนี้ฝังรากลึกอยู่ในสัญชาตญาณผ่านการฝึกฝนนานนับปี\n\nผู้คนที่ถูกความสับสนครอบงำในสภาพแวดล้อมที่ไม่คุ้นเคยมักจะทำผิดพลาดหรือตัดสินใจคลาดเคลื่อนได้ง่าย อีวานจึงแสร้งทำสีหน้าสงบนิ่งพลางพยายามนึกทบทวนอย่างหนักว่าตนเองมาโผล่ที่นี่ได้อย่างไร\n\n“…”\n\nวอลเปเปอร์ผ้าทอลายนูนเดินดิ้นทองสุดหรูหรา พรมแขวนผนังอันวิจิตรงดงาม โต๊ะไม้ขนาดมหึมา และเสื้อผ้าที่ตกกระจายเกลื่อนอยู่บนพื้น\n\nพรมขนหนาสีแดงปูลาดบนพื้น กับผ้าห่มกำมะหยี่ที่ปลิวไหวน้อยๆ อยู่บนเตียง\n\nและตรงปลายสุดของเตียงนั้น มีเงาร่างหนึ่งนอนหันหลังให้อยู่\n\nผู้หญิงคนหนึ่ง นอนขดตัวอยู่ ส่วนสูงราว 160 เซนติเมตร รูปร่างบอบบาง เนื่องจากมีผ้าห่มคลุมพันไว้จึงยากจะเก็บข้อมูลเพิ่มเติมได้\n\n“อืม”\n\nเขาตรวจดูสภาพของตนเอง กึ่งเปลือยกาย สวมเพียงกางเกงผ้าฝ้ายเนื้อบางตัวเดียว ส่วนท่อนบนเปลือยเปล่า\n\nหลังจากตรวจสอบดูแล้ว ดูเหมือนเขาจะไม่ได้ทำเรื่อง ‘ไม่สมควร’ อะไรลงไป เรื่องนี้นับว่าทั้งชวนให้โล่งใจและน่าสงสัยในเวลาเดียวกัน\n\nทว่าสถานการณ์เช่นนี้ เมื่อประเมินจากองค์ประกอบโดยรวมแล้ว…\n\nซัคคิวบัส\n\nใช่แล้ว เจ้าพวกสิ่งมีชีวิตเหมือนยุงที่ชอบแทรกซึมเข้ามาในความฝัน ปลุกปั่นความปรารถนาอันไม่พึงประสงค์ขึ้นมาอย่างฝืนใจ แล้วสูบกินพลังเวทและเรี่ยวแรงกายของเหยื่อ\n\nต้องเป็นพวกมันอย่างแน่นอน ย่อมเป็นเช่นนั้น อีวานเคยเผชิญหน้ากับเจ้ายุงพวกนี้มาแล้วหลายครั้งระหว่างปฏิบัติการคุ้มกันปาร์ตี้ผู้กล้าใกล้ปราสาทจอมมาร\n\nแต่เขาไปเจอพวกมันเข้าที่ไหนกันนะ? ความทรงจำเมื่อคืนนี้ช่างเลือนรางเหลือเกิน หรือว่า…\n\n“อึก…”\n\nอาการปวดศีรษะแล่นปราดเข้ามาอีกครา เห็นได้ชัดว่าเป็นอาการปวดที่รบกวนความทรงจำ อีวานสะบัดศีรษะแล้วลุกขึ้นยืนอย่างระมัดระวัง เดินตรงไปยังเสื้อโค้ตของตน\n\nทันทีที่เอื้อมมือล้วงเข้าไปในแขนเสื้อโค้ตที่ตกอยู่บนพื้น ก็มีเสียงกระทบกันดังกริ๊ก เขากำด้ามมีดสั้นและขวดน้ำเอาไว้ได้\n\nความฝันคือภาพมายาที่ตั้งอยู่บนพื้นฐานของความเป็นจริง โดยธรรมชาติแล้ว สิ่งของที่พกพาเป็นประจำหรือกิจวัตรที่ทำจนเคยชินย่อมสะท้อนเข้ามาในความฝันด้วยเช่นกัน\n\nและหากพูดถึงความสม่ำเสมอและการพกอาวุธติดตัว ย่อมไม่มีใครรอบคอบรัดกุมไปกว่าอีวานอีกแล้ว\n\nเขาดึงมีดออกจากแขนเสื้ออย่างเงียบเชียบแล้วจรดคมมีดลงบนท่อนแขนของตนเอง\n\nเขาไม่ควรแตะต้องตัวผู้หญิงที่นอนอยู่บนเตียง หากนี่เป็นความฝันที่ซัคคิวบัสสร้างขึ้น ย่อมไม่อาจรู้ได้เลยว่ามีกับดักอะไรซ่อนอยู่บ้าง\n\nทว่า หนึ่งในสองวิธีอันแน่นอนในการปลุกตนเองให้ตื่นจากความฝันของซัคคิวบัสสามารถลงมือทำได้ในตอนนี้เลย\n\nหนึ่งคือสร้างความตื่นตะลึงด้วยการกระทำที่ขัดแย้งโดยตรงกับเจตนาของความฝัน หรือสองคือให้บาทหลวงร่ายเวทชำระล้าง\n\nในเมื่อไม่มีบาทหลวงอยู่ข้างร่างที่กำลังหลับใหลของเขา เขาจึงตัดสินใจทำตามวิธีแรก\n\n– ฉัวะ\n\nพร้อมกับความเจ็บปวดอันเย็นเยียบ ท่อนแขนของเขาถูกกรีดจนเป็นแผลลึก เขารีบกวาดสายตามองไปรอบๆ ทว่ากลับไม่มีวี่แววว่าความฝันจะพังทลายลงเลยสักนิด\n\nไม่เป็นไร ในฐานะเจ้าหน้าที่ซึ่งผ่านการฝึกฝนลดความไวต่อความเจ็บปวดมาแล้ว แผลกรีดที่ท่อนแขนเพียงเท่านี้คงยังไม่รุนแรงพอจะกระตุ้นให้ตื่นจากความฝันของซัคคิวบัสได้\n\nเช่นนั้น เขาก็แค่ใช้อีกวิธีหนึ่งก็สิ้นเรื่อง\n\n“เฮ้อ…”\n\nเขาเคยสาบานไว้ว่าจะไม่มีวันใช้ของสิ่งนี้กับตัวเองอีกเป็นอันขาด\n\nเมื่อ 15 ปีก่อนได้ไหมนะ? เขายังจำภาพตอนที่ตนเองถูกมัดตรึงและบังคับ ‘รักษา’ ในห้องพยาบาลของหน่วย หลังจากโดนหอกแทงทะลุช่องท้องได้ดี\n\nอีวานจ้องมองขวดน้ำด้วยสายตารังเกียจขยะแขยง จากนั้นจึงค่อยๆ… เอียงขวดลงอย่างระมัดระวังที่สุด\n\nของเหลวสีแดงข้นหนืดอันน่าสะพรึงกลัวไหลเอ่อออกมาช้าๆ หยดลงบนท่อนแขนที่มีเลือดไหลนอง\n\nทันทีที่สัมผัสกับบาดแผล ก็เกิดเสียงดังซ่าพร้อมกับปากแผลที่เริ่มสมานปิดสนิทในชั่วพริบตา ไม่มีทั้งเสียงครวญครางหรือเสียงถอนหายใจ จังหวะหายใจของเขายังคงสม่ำเสมอไม่แปรเปลี่ยน\n\nทว่าความเจ็บปวดราวกับสายฟ้าฟาดกลับฉีกกระชากผ่านศีรษะ ความเจ็บปวดอันแสนคุ้นเคยที่ฝังลึกอยู่ในซอกหลืบของความทรงจำพลันพลุ่งพล่านขึ้นมา\n\nสัมผัสแห่งการรักษาของโพชั่นรักษาบาดแผล (เขาตัดสินใจที่จะคิดถึงมันด้วยถ้อยคำนี้ก็แล้วกัน)\n\nด้วยการพ่นลมหายใจสั้นๆ เขาตั้งขวดโพชั่นขึ้นตรงและปิดฝาขวดกลับตามเดิม\n\nด้วยท่วงท่าอันประณีตบรรจงและระมัดระวัง ราวกับกำลังผนึกอสูรต้องสาปโบราณกลับลงไปในไห\n\nโพชั่นรักษาบาดแผลที่ปิดผนึกแน่นหนาแล้วแปรสภาพจากของเหลวข้นหนืดเชิงนามธรรมอันเป็นตัวแทนแห่งความชั่วร้ายจากขุมนรก กลับมาเป็นยุทโธปกรณ์จำเป็นอันน่าเชื่อถืออีกครั้ง เขาเก็บขวดโพชั่นเข้าแขนเสื้อและสวมเสื้อผ้าจนเรียบร้อย\n\n“…?”\n\nความฝันยังไม่แตกสลายลงแม้จะได้เผชิญกับเรื่องทั้งหมดนี้แล้วก็ตาม\n\nขณะที่ก้มมองมีดสั้นอีกครั้งและครุ่นคิดว่าจะลองกรีดท่อนแขนดูอีกสักทีดีหรือไม่ สมมติฐานเล็กๆ ข้อหนึ่งก็ผุดขึ้นมาในหัวของเขา\n\nหากว่านี่ไม่ใช่ความฝันล่ะ…?\n\nอีวานเอนกายพิงโซฟาขนาดมหึมาข้างโต๊ะ ชี้ปลายมีดสั้นตรงไปยังสตรีที่นอนอยู่บนเตียงกำมะหยี่ พลางจมดิ่งสู่ห้วงความคิด\n\nผู้หญิงคนนั้นคือใคร ที่นี่คือที่ไหน และทำไมฉันถึงมาอยู่ที่นี่ได้?\n\nเมื่อวานนี้มันเกิดเรื่องบ้าอะไรขึ้นกันแน่?\n\nฉันจำได้ว่ากำลังเดินสำรวจโรงเรียนเพื่อตามหาห้องลับของสถาบันอยู่นี่นา…\n\n***\n\n**เอพพิโซด 11: มหาวิทยาลัยเซนต์ยานสก์กับห้องลับ**\n\nลองย้อนเวลากลับไปดูสถานการณ์ในพริตเชนคายาช่วงหลังจากที่ช่วยเหลือบรรดาบุตรหลานของปาร์ตี้ผู้กล้ากลับมาได้หมาดๆ กันสักหน่อย\n\nในท้ายที่สุด เอลิซาเวตาก็ทรงปฏิเสธการขึ้นครองราชย์\n\n“ไม่อาจสถาปนาพระราชอำนาจได้ ก่อนที่วิกฤตการณ์ของแผ่นดินจะได้รับการสะสางให้เรียบร้อย”\n\n“ข้าจะกล้าเอื้อมอาจอ้างพระนามแห่งราชันได้อย่างไร ในเมื่อเสด็จพ่อองค์กษัตริย์ยังคงมีพระพลานามัยแข็งแรงสมบูรณ์ดีถึงเพียงนี้”\n\nหลังจากทรงประกาศเจตนารมณ์ที่จะถอนรากถอนโคน ‘ศัตรูภายนอกปริศนา’ ผู้สร้าง ‘มกุฎราชกุมารตัวปลอม’ และแทรกซึมลึกลงไปในราชวงศ์ให้สิ้นซาก พระองค์ก็ทรงเปิดท้องพระคลังแผ่นดินพระราชทานความช่วยเหลือแก่ราษฎรที่ได้รับผลกระทบจากเหตุก่อการร้ายอย่างใจกว้าง\n\nจุดสำคัญในที่นี้คือพระองค์ทรงเปิดใช้ ‘เงินคลังแผ่นดิน’ มิใช่ทรัพย์สินส่วนพระองค์ขององค์หญิง\n\nกล่าวอีกนัยหนึ่ง คือการประกาศให้เหล่าขุนนางทุกคนเข้าใจได้อย่างแจ่มแจ้งว่า พระราชทรัพย์แห่งแผ่นดินได้ตกอยู่ภายใต้การควบคุมของพระองค์แล้ว\n\n“รัฐมนตรีว่าการกระทรวงการต่างประเทศถูกพวกคนชั่วลักพาตัวไป”\n\nเหล่าคนชั่วพวกนี้อาจหาญถึงขั้นลักพาตัวองค์มกุฎราชกุมารไป และปลอมแปลงพระองค์ขึ้นมาเพื่อแทรกแซงบงการราชวงศ์อย่างน่าตกตะลึง โดยธรรมชาติแล้ว กองบัญชาการต่อต้านข่าวกรองซึ่งมีหน้าที่ป้องกันเหตุการณ์เช่นนี้ล่วงหน้าย่อมต้องตกที่นั่งลำบากอย่างหนัก ทว่า…\n\n“ในฐานะผู้สืบสายพระโลหิต ข้าขอแสดงความเสียใจอย่างสุดซึ้งต่อความรับผิดชอบในสถานการณ์ครั้งนี้ และขอสละอำนาจทั้งหมดภายในราชสำนัก”\n\nเรื่องราวคลี่คลายลงเมื่อองค์หญิงซึ่งทรงดำรงตำแหน่งหัวหน้ากองบัญชาการต่อต้านข่าวกรองด้วย ทรงสละตำแหน่งของพระองค์ด้วยความสมัครใจ พร้อมทรงรำพันว่าพระองค์ล้มเหลวในการปกป้องพระเชษฐาแท้ๆ ของตนเอง\n\n“ขอองค์พระผู้เป็นเจ้าทรงคุ้มครองคราซิลอฟ นับแต่นี้ราชวงศ์จะไม่ถือครองฉลองพระองค์สีแดงแห่งอำนาจทางโลกอีกต่อไป สายพระโลหิตแห่งราชวงศ์จะดำรงอยู่เพียงในฐานะสัญลักษณ์แห่งเกียรติภูมิของชาติ เป็นประภาคารเพื่อก้าวข้ามวิกฤตการณ์ของแผ่นดิน”\n\nผู้สืบสายพระโลหิตแห่งราชวงศ์ทั้งหมดต่างก้าวลงจากการปกครองโดยตรงเพื่อแปรเปลี่ยนเป็นสัญลักษณ์ทางวัฒนธรรม กล่าวอีกนัยหนึ่ง ก็คือจุดเริ่มต้นของระบอบราชาธิปไตยภายใต้รัฐธรรมนูญนั่นเอง\n\nหลัก ‘เทวสิทธิ์แห่งราชัน’ ที่มกุฎราชกุมารทรงเผยแพร่พลันไร้ความหมายไปโดยสิ้นเชิง อย่างน้อยก็ภายในคราซิลอฟ โลกนี้มันชั่วร้ายงั้นหรือ? แล้วพวกเจ้าจะไปโทษใครได้เล่า? ในเมื่อประเทศนี้ไม่ได้ถูกปกครองโดยกษัตริย์โดยตรง ก็จงขว้างปาก้อนหินใส่เหล่าขุนนางของพวกเจ้าเสียสิ\n\nอำนาจที่ประชาชนเฝ้าจับตามอง บัดนี้ตกอยู่ภายใต้สภาขุนนางและคณะบริหารระดับสูงแล้ว\n\nทว่า อำนาจทั้งมวลล้วนถือกำเนิดจากอำนาจทางทหาร อำนาจทางการเงิน และการควบคุมข่าวสารข้อมูล\n\nและในพริตเชนคายาเวลานี้ ทั้งสามสิ่งล้วนรวมศูนย์อยู่ที่บุคคลเพียงผู้เดียว\n\n“ฝ่าบาท ได้โปรดมีพระบัญชาด้วยพ่ะย่ะค่ะ”\n\n“ท่านล้อเล่นเกินไปแล้ว เสด็จพ่อยังคงทรงสุขสบายดี และข้าก็ไม่ได้ยุ่งเกี่ยวกับราชการแผ่นดินอีกต่อไปแล้ว ไยท่านจึงเอ่ยถึงพระบัญชาเล่า?”\n\n“ฮ่าๆๆๆ! กระหม่อมขอพระราชทานอภัย องค์หญิง!”\n\nดมิทรีและเอลิซาเวตาหัวเราะร่าพลางจิบชา สวนหลังพระราชวังตะวันออกในยามบ่ายฤดูร้อนหลังฝนซาอบอวลไปด้วยกลิ่นหอมอันอบอุ่นของมวลดอกไม้ที่กำลังผลิบาน\n\n“พวกตาแก่ในสภาขุนนางเป็นอย่างไรบ้าง?”\n\n“ต่างคนต่างกลอกตาไปมากันน่าขำทีเดียวพ่ะย่ะค่ะ คงจะอึดอัดคับข้องใจน่าดูเพราะพอคิดจะยื่นมือเข้าไปยุ่งเกี่ยวกับกิจการทหารทีไรก็ไร้เสียงตอบรับทุกที”\n\n“ปล่อยให้พวกมันทรมานอีกสักหน่อยเถอะ บางทีในหมู่พวกมันอาจจะมีผู้กล้าสักคนชักดาบออกมาก็ได้”\n\n“จะได้ช่วยให้งานตัดแต่งกิ่งง่ายขึ้นด้วยพ่ะย่ะค่ะ”\n\nกองพลรักษาการณ์ทั้งหมดรอบพริตเชนคายาล้วนถวายสัตย์ปฏิญาณความจงรักภักดีต่อองค์หญิงไปหมดแล้ว และช่องทางข่าวสารทั้งหมดที่มุ่งสู่ฝ่ายบริหารการทหารก็อยู่ภายใต้การควบคุมของกองบัญชาการต่อต้านข่าวกรอง\n\nเพียงแค่เรื่องที่มกุฎราชกุมารจู่ๆ ก็หายตัวไปอย่างลึกลับก็นับว่าน่าสงสัยมากพอแล้ว แต่เรื่องเล่าที่ว่ามีมกุฎราชกุมาร ‘ตัวปลอม’ บังอาจก่อรัฐประหารแล้วล้มเหลวพินาศลงในชั่วข้ามคืนยิ่งชวนให้ฉงนสนเท่ห์พอๆ กัน\n\nจากมุมมองของเหล่าขุนนาง พวกเขาคงกำลังร้อนรนด้วยความหวาดหวั่นแทบบ้า โดยเฉพาะบรรดาผู้ที่เคยเลือกยืนอยู่ฝั่งมกุฎราชกุมาร\n\nแน่นอนว่าเหล่าขุนนางไม่ได้โง่เขลา ใครๆ ต่างก็มองออกว่านี่เป็นเพียงจุดเริ่มต้นของการกวาดล้างครั้งมโหฬารเท่านั้น\n\nองค์หญิงทรงลาออกจากตำแหน่งอัครมหาเสนาบดีราชสำนักงั้นหรือ? สวนที่พระองค์ทรงลงแรงฟูมฟักดูแลมาด้วยพระองค์เองนานกว่าสิบปีจะยอมทรยศนายเหนือหัวของตนงั้นหรือ?\n\nองค์หญิงทรงสละกองบัญชาการต่อต้านข่าวกรองไปแล้วงั้นหรือ? นับตั้งแต่สมัยหน่วยเก็บกวาด องค์หญิงก็ทรงเป็นนายใหญ่ของพวกเขามาโดยตลอด ขุนนางที่มีสามัญสำนึกย่อมไม่มีวันหลงเชื่อคำกล่าวอ้างพรรค์นี้\n\nกระทั่งความจริงที่ว่าทั้งเงินคลังแผ่นดินและพระคลังหลวงส่วนพระองค์ต่างตกอยู่ใต้การกำกับดูแลของพระราชวังตะวันออก ก็ไม่นับเป็นความลับในหมู่ขุนนางด้วยซ้ำ เพราะองค์หญิงทรงจงใจให้เป็นเช่นนั้นเอง\n\nมาถึงขั้นนี้แล้ว ในขณะที่กษัตริย์องค์ปัจจุบันยังประทับครองบัลลังก์อย่างมั่นคง องค์หญิงกลับทรงประกาศใช้ ‘ระบอบราชาธิปไตยภายใต้รัฐธรรมนูญ’ ขึ้นแต่เพียงฝ่ายเดียว? มันไม่ชัดเจนหรอกหรือว่าพระองค์ทรงริบเอาอำนาจและพระราชอำนาจทั้งหมดของกษัตริย์มาสยบไว้แทบพระบาทเรียบร้อยแล้ว?\n\nในสถานการณ์เช่นนี้ มีเพียงสิ่งเดียวเท่านั้นที่เหล่าขุนนางสมควรจะกระทำ\n\n“องค์หญิงพ่ะย่ะค่ะ ท่านเคานต์ยูซุฟขอเข้าเฝ้าพ่ะย่ะค่ะ”\n\nองค์หญิงทรงแย้มยิ้มหยันเมื่อได้ยินคำรายงานของข้าราชบริพาร\n\n“ช่างเป็นทัพหน้าที่กล้าหาญเสียจริง ผู้บัญชาการกองทหารม้าดั้นด้นมาด้วยตนเองเชียวหรือ”\n\n“พวกนั้นคงกำลังร้อนรุ่มกันเต็มทีแล้ว เช่นนั้นกระหม่อมขอทูลลาพ่ะย่ะค่ะ”\n\n“แหม การออกว่าราชการโดยตรงขององค์ประมุขจะดูเหมาะสมได้อย่างไรหากไร้ผู้ติดตาม? อยู่ตรงนั้นแหละ”\n\nเอลิซาเวตาทรงพยักพระพักตร์พร้อมรอยยิ้มส่งให้ท่านเคานต์ที่ก้าวเข้ามาทางประตู\n\nหากสภาขุนนางได้เห็นพันโทผู้รับผิดชอบงานปฏิบัติการของกองบัญชาการต่อต้านข่าวกรองประจำการอยู่ในห้องทำงานของเอลิซาเวตาด้วยตาตนเอง พวกเขาก็อาจแสดงท่าทีก้าวหน้าขึ้นมาได้ง่ายกว่าเดิม\n\nฉะนั้น ทันทีที่เคานต์ยูซุฟ ผู้บัญชาการกองทหารม้าแห่งพริตเชนคายาเปิดประตูและก้าวเท้าลงบนพรมในห้องทำงาน เขาก็ทรุดตัวคุกเข่าลงคำนับอย่างนอบน้อมที่สุด\n\n“ลุกขึ้นเถิด ทำพิธีรีตองเช่นนี้ข้าก็เขินแย่น่ะสิ”\n\nเอลิซาเวตาโบกพระหัตถ์ด้วยพระพักตร์อันเปี่ยมรอยยิ้ม\n\nบัดนี้คราซิลอฟได้แปรเปลี่ยนเป็นระบอบราชาธิปไตยภายใต้รัฐธรรมนูญแล้ว ต้องขอบคุณแผนการของอเล็กซานเดอร์แท้ๆ\n\nสายพระโลหิตแห่งราชวงศ์บัดนี้อยู่ภายใต้บทบัญญัติแห่งรัฐธรรมนูญของชาติ\n\nทว่ารัฐธรรมนูญ และเหล่าผู้ที่ถือครองกลไกเหล่านั้น ล้วนศิโรราบอยู่แทบเท้าของบุคคลเพียงผู้เดียว\n\nพระราชอำนาจแห่งคราซิลอฟจึงมั่นคงแข็งแกร่งยิ่งกว่ายุคสมัยใดๆ นับตั้งแต่รัชกาลของกษัตริย์องค์ก่อน เสียงก่นด่าขุ่นเคืองทั้งหมดของปวงชนจะพุ่งตรงไปยังเหล่าขุนนาง ส่วนผลผลิตอันหอมหวานของอำนาจจะหวนคืนสู่ราชวงศ์เพียงผู้เดียว ไม่สิ สู่พระหัตถ์ขององค์หญิงต่างหาก\n\nเวลานี้ พริตเชนคายาได้ตกอยู่ในกำมือของเอลิซาเวตาอย่างเบ็ดเสร็จแล้ว\n\nพระองค์ย่อมต้องประทานบำเหน็จรางวัลแก่ทุกคนที่มีส่วนร่วมในภารกิจครั้งนี้ ทว่าในห้วงคำนึง พระองค์กลับทรงครุ่นคิดถึงบุรุษเพียงผู้เดียว\n\nพระองค์ควรจะทรงทำสิ่งใดเพื่อตอบแทนคนตัดไม้ของพระองค์ ผู้ซึ่งสร้างคุณูปการอันยิ่งใหญ่ที่สุดกันดีนะ?\n\n***\n\nส่วนอีวาน เปโตรวิช ผู้สร้างคุณูปการอันดับหนึ่งที่ผลักดันให้องค์หญิงขึ้นเป็นผู้กุมอำนาจเบื้องหลังบัลลังก์ (ซึ่งเป็นการประเมินที่ออกจะเข้าข้างตัวเองไปสักหน่อย) และประสบความสำเร็จในการปกป้องบรรดาบุตรหลานของปาร์ตี้ผู้กล้า จนสามารถขจัดชนวนความขัดแย้งระหว่างประเทศออกไปได้ล่วงหน้า ในเวลานั้นเขากำลัง…\n\n“คุณลุงคะ เรื่องนี้ไม่ได้เด็ดขาดเลยนะคะ! เรื่องแอบสะกดรอยตามหนูพอเข้าใจได้ และวิธีพูดจาของคุณลุงหนูก็ยอมรับได้ค่ะ แต่เรื่องนี้ยอมไม่ได้จริงๆ นะคะ! หยุดอยู่ตรงนั้นเลยค่ะ!”\n\nเขากำลังลักลอบเคลื่อนตัวผ่านเงามืดอย่างเงียบเชียบ หลบหลีกสายตาของเอซิดิสที่วิ่งไล่กวดเขาพร้อมมีดสั้นและโฟมโกนหนวดในมือ\n\nด้วยทักษะการอำพรางตัวอันสมบูรณ์แบบสมกับเป็นอดีตสมาชิกหน่วยเก็บกวาด เขาลอบเร้นหายไปจากสายตาของเอซิดิสอย่างใจเย็น\n\n***\n\n**💬 ความคิดเห็นนักอ่าน:**\n- **@ปลุกตัวเองด้วยมีด** (3 วันที่แล้ว • 👍 267): เปิดเอพพิโซด 11 มาได้ปั่นที่สุดในประวัติศาสตร์! ลุงตื่นมาเจอผู้หญิงตัวเล็กนอนอยู่ข้างๆ บนเตียงหรู อย่างแรกที่ทำไม่ใช่ตกใจหรือเขิน แต่คว้ามีดกรีดแขนราดโพชั่นเช็กฝันซัคคิวบัส!! 55555\n- ↳ **@หมอสนามกุมขมับ** (3 วันที่แล้ว • 👍 95): แล้วพอเจ็บจริงเลยรู้ว่าไม่ฝันด้วยนะ คนปกติที่ไหนปลุกตัวเองด้วยมีดกับโพชั่นวะเนี่ย 555\n- **@หน่วยเดาตัวละคร** (3 วันที่แล้ว • 👍 158): เดี๋ยวนะ ห้องหรูเดินดิ้นทอง เสื้อผ้าเกลื่อนพื้น แถมมีผู้หญิงตัวเล็กสูงราว 160 ซม. นอนขดอยู่บนเตียงด้วย!? อย่าเพิ่งตัดภาพหนีไปฉากการเมืองสิ รีบเฉลยก่อนน!\n- ↳ **@ทีมองค์หญิง_No1** (3 วันที่แล้ว • 👍 61): มีสิทธิ์ลุ้นได้หลายคนเลยนะ แต่ดูจากทรงแล้วลุ้นตอนหน้าสุดๆ\n- **@KrasilovPolitik** (3 วันที่แล้ว • 👍 112): ฉากเอลิซาเวตาปฏิเสธบัลลังก์แต่รวบอำนาจตั้งระบอบกษัตริย์ภายใต้รัฐธรรมนูญ จนเคานต์ยูซุฟต้องคุกเข่าศิโรราบคือคมกริบมาก แอบเป็นห่วงว่าพระองค์กำลังคิด \"ตอบแทนคนตัดไม้\" แบบไหนอยู่\n- **@มีดสั้นกับโฟมโกนหนวด** (2 วันที่แล้ว • 👍 143): ปิดท้ายด้วยเอซิดิสถือมีดสั้นกับโฟมโกนหนวดวิ่งไล่โกนเคราคุณลุง... บอกตรงๆ หนีเรื่องสะกดรอยยังพอไหว แต่โกนเครานี่ยอมไม่ได้สินะลุง 555"

      "title": "บทที่ 59",
      "content": "หลังจากวันนั้น อีวานก็สามารถกลับไปใช้ชีวิตเป็นคนสวนผู้สงบสุขได้นานถึงหนึ่งสัปดาห์\n\nนั่นคือถ้ายกเว้นเอซิดิสที่นานๆ ทีจะพุ่งตัวถือคมมีดเข้ามาหาทุกครั้งที่สบตากัน เธอกำลังจะวิวัฒนาการกลายเป็นมอนสเตอร์สายโจมตีไปแล้ว\n\nนับเป็นการเปลี่ยนแปลงที่ไม่ค่อยน่ายินดีสักเท่าไรนักสำหรับอารยชนผู้รักความสงบ\n\nเอาเถอะ ไม่ว่าจะอย่างไร ความโกลาหลที่ปะทุขึ้นในพริตเชนคายาก็ได้รับการคลี่คลายลงจนเรียบร้อยภายในหนึ่งสัปดาห์\n\nเมื่อพิจารณาจากขนาดของเหตุการณ์และผลพวงที่ตามมา การปิดคดีทั้งหมดให้จบสิ้นภายในสัปดาห์เดียวนับเป็นเรื่องที่เป็นไปไม่ได้เลย ทว่าโชคดีที่พริตเชนคายามีหน่วยงานข่าวกรองอันเปี่ยมประสิทธิภาพ (หน่วยงานที่ให้ความสำคัญกับงานข่าวกรองภายในประเทศเป็นอันดับหนึ่ง)\n\nดมิทรีอยากจะอวดโอ่ถึงบทสรุปอันงดงามที่ตนและเหล่าลูกน้องร่วมกันสร้างสรรค์ขึ้นมาใจจะขาด เขาคงอยากป่าวประกาศคุณงามความดีของตนให้ใครต่อใครได้รับรู้ ทว่าในเวลานี้ เขายังไม่อยู่ในสถานะที่จะทำเช่นนั้นได้\n\n– ปึก!\n\n“อั่ก…?!”\n\n“ท่ายืนไม่สวยเลย ทำใหม่”\n\n“ไอ้บ้าเอ๊ย… ให้ตายสิ…”\n\n“ทำใหม่”\n\nเวลานี้เขากำลังทำท่าหัวปักพื้นในลักษณะหกสูงโดยเอาศีรษะยันพื้นค้างเอาไว้อยู่\n\nพอกวาดสายตามองไปรอบๆ ก็พบว่าตนเองอยู่ท่ามกลางเหล่าเจ้าหน้าที่รุ่นน้องประหลาดๆ ที่พากันทำท่าหัวปักพื้นอย่างขยันขันแข็งพลางจ้องมองอีวานด้วยแววตาเป็นประกายระยิบระยับ\n\nไม่มีทั้งอุดมการณ์และศักดิ์ศรีเอาเสียเลย… ดมิทรีทอดถอนใจให้กับจิตใจอันอ่อนแอของเจ้าหน้าที่ข่าวกรองยุคนี้พลางจัดท่าทางของตนให้เข้าที่\n\nบุรุษที่ยืนอยู่ตรงหน้าพวกเขา นอกจากปาร์ตี้ผู้กล้าแล้ว นับเป็นมนุษย์เพียงคนเดียวที่มีประวัติลงมือสังหารหนึ่งในเจ็ดขุนพลมังกรด้วยตนเอง\n\nฉะนั้น นี่ไม่ใช่ความหวาดกลัว หากแต่เป็น…\n\nความเคารพนับถืองั้นหรือ?\n\nความเคารพ ใช่แล้ว ในช่วงเวลาที่สมรภูมิดุเดือดที่สุด เขาคือทหารผ่านศึกผู้เคยสังกัดหน่วยเก็บกวาด อันเป็นต้นกำเนิดของกองบัญชาการต่อต้านข่าวกรอง\n\nใช่ ความเคารพ ไม่ใช่ความหวาดกลัวอย่างแน่นอน ทำไมน่ะหรือ? ก็ไม่มีเหตุผลอะไรให้ต้องกลัวสักหน่อย ทั้งเขาและรุ่นพี่คนนั้นต่างก็มียศเท่ากัน (พันโท) แถมเขาก็ยังอายุน้อยอยู่เลย ฉะนั้น ถ้าวันหนึ่งได้เลื่อนยศขึ้นมา ก็น่าจับตามองทีเดียวเชียว\n\n“อ้าว พันโทเปโตรวิช มาแล้วเหรอ?”\n\n“ว่าไงนะ? อ้อ โทษที พอดีถ้าขีดบนอินทรธนูยศมันมีไม่พอ เสียงมันก็เลยค่อยๆ เบาลง ฉันไม่ค่อยได้ยินเลย ช่วยพูดจาด้วยน้ำเสียงที่ฉะฉานกว่านี้หน่อยได้ไหม? อะแฮ่ม ไปเอาน้ำมาให้ ‘ท่านพันเอก’ สักแก้วสิ ‘พันโท’ ฮ่าๆๆ แหม เป็นทหารแล้วยังไงก็เป็นทหารวันยันค่ำ ต่อให้ปลดประจำการไปแล้วก็เถอะ…”\n\n“อ๊ะ เดี๋ยวรอก่อนครับ พูดจากันดีๆ สิครับรุ่นพี่ คุยกันด้วยคำพูดเถอะครับ อ๊ะ”\n\n“ขอโทษครับ ไม่สิ ผมขอโทษจริงๆ ครับ ผมขอโทษครับ เปล่า ผมไม่ได้พูดจาตีเสมอนะครับ ผมไปพูดตอนไหนกัน?”\n\n“อ๊ะ โพชั่นนั่น อย่านะครับ ได้โปรดวางลงเถอะครับ”\n\n“…อึ้ก”\n\nดมิทรีผู้กำลังถูกซ้อมจนน่วมอยู่ในจินตนาการของตนเองค่อยๆ หลับตาลงอย่างสงบ\n\nใช่แล้ว มันคือความเคารพ\n\n***\n\nหลังจากจับกองบัญชาการต่อต้านข่าวกรองมาเคี่ยวกรำเข้าที่เข้าทางแล้วเท่านั้น อีวานจึงเพิ่งจะทำความเข้าใจคำอธิบายอันยืดยาวของพวกนั้นได้\n\nเรื่องลอบฝังวัตถุระเบิด เอาเถอะ อันนั้นพอเข้าใจได้\n\nแผนเตรียมการก่อกบฏของกองพลรักษาการณ์หลวงงั้นหรือ…? คงจะหยุดยั้งได้ยากน่าดู น่าทึ่งทีเดียวที่ตรวจจับได้ล่วงหน้า\n\nพวกคนแคระจากใต้ดิน…? นั่นมันเรื่องอะไรกันล่ะเนี่ย…?\n\nการทำลายเครือข่ายสื่อสารของฝ่ายมกุฎราชกุมารในสภาขุนนาง การกักบริเวณกษัตริย์องค์ปัจจุบัน การฉกชิงเงินจากคลังแผ่นดินและคลังสมบัติหลวง โอ้ น่าประทับใจไม่เบา\n\nหลังจากทำความเข้าใจเหตุการณ์ทั้งหมดที่พริตเชนคายาต้องเผชิญภายในวันเดียวกันได้คร่าวๆ และนั่งฟังคำแก้ตัวอันเอาเป็นเอาตายของอีกฝ่าย (“รุ่นพี่ครับ พวกเราพยายามไม่เข้าไปยุ่งเกี่ยวในเขตรับผิดชอบของรุ่นพี่เลยจริงๆ นะครับ ฮ่าๆ สงสัยพวกเราจะยังสร้างสายสัมพันธ์กับเจ้าหน้าที่ภาคสนามได้ไม่ดีพอ อะฮ่าๆๆ”) เขาก็พยักหน้ารับ\n\nเขาเข้าใจดีว่ากองบัญชาการต่อต้านข่าวกรองกำลังยุ่งวุ่นวาย\n\nทว่า เดิมทีแล้ว กองบัญชาการต่อต้านข่าวกรองไม่ได้มีหน้าที่ต้องยุ่งอยู่ตลอดเวลาอยู่แล้วหรือไง?\n\nบางครั้ง ดูเหมือนคนป่าเถื่อนยุคก่อนสมัยใหม่พวกนี้จะมีนิสัยชอบมองข้ามเรื่องธรรมดาสามัญโดยไม่คิดว่าเป็นเรื่องธรรมดาเสียเลย\n\nหากจะเปรียบเทียบให้สุดโต่ง ก็ไม่ต่างอะไรกับการเยินยอมีดว่าคมกริบ หรือชมเชยปากกาว่าเขียนติดมีน้ำหมึก\n\nนี่เขาต้องทำความเข้าใจด้วยงั้นหรือว่า กองบัญชาการต่อต้านข่าวกรองมัวแต่ยุ่งอยู่กับงานข่าวกรองจนละเลยการคุ้มครองเป้าหมายหลักของตน?\n\nสมัยฉันไม่เห็นเป็นแบบนี้เลย ตอนที่ฉันทำงานเป็นหน่วยลาดตระเวนให้ปาร์ตี้ผู้กล้า ฉันทั้งแทรกซึมเข้าแดนศัตรู ขโมยข้อมูลข่าวสาร และลอบวางระเบิดทำลายยุทโธปกรณ์สำคัญไปพร้อมๆ กันหมดนั่นแหละ (เรื่องจริงนะ)\n\nเหตุใดคนหนุ่มสาวสมัยนี้ถึงจัดการงานแค่เรื่องเดียวยังทำไม่ได้? ช่างน่าเวทนายิ่งนัก\n\nฉะนั้น อีวานจึงอุทิศเวลาตลอดช่วงสุดสัปดาห์ทั้งหมดไปกับการฝึกอบรมจิตใจให้แก่กองบัญชาการต่อต้านข่าวกรอง\n\nเหล่าเจ้าหน้าที่ของกองบัญชาการต่อต้านข่าวกรองต่างปลื้มปีติที่ได้รับการถ่ายทอดวิชาโดยตรงจากผู้ก่อตั้งสถานที่ทำงานปัจจุบันของพวกตน\n\nอีวานเองก็พึงพอใจที่เหล่าเจ้าหน้าที่ข่าวกรองของพริตเชนคายาเก่งกาจเฉียบคมขึ้น\n\nส่วนดมิทรีนั้นโศกเศร้าเสียใจที่ต้องมาทำงานในวันหยุดสุดสัปดาห์โดยไม่ได้รับค่าล่วงเวลา แถมยังถูกบังคับให้เข้าร่วมการฝึกซ้อมที่ไม่มีอยู่ในแผนการฝึกประจำครึ่งปีอีกต่างหาก\n\n***\n\nหลังจากการอบรมสั่งสอนอันยืดยาว ดมิทรีที่นั่งอยู่บนโซฟาด้วยเรียวขาสั่นเทาก็ฝืนเปิดปากพูดออกมาได้อย่างยากลำบาก\n\n“เอ่อ รุ่นพี่ครับ พรุ่งนี้จะไปโรงเรียนไหมครับ?”\n\n“ก็ต้องไปสิ”\n\n“คือว่า เอ่อ… อ่า… ฝ่าบาทรับสั่งไม่ให้ผมเอ่ยเรื่องนี้ตอนนี้ เพราะฉะนั้นผมคงบอกไม่ได้จริงๆ ครับ อืม อีกไม่นาน… พระกรุณาธิคุณ? ใช่ครับ พระกรุณาธิคุณ กำลังจะมีพระกรุณาธิคุณลงมาครับ”\n\n“พระกรุณาธิคุณงั้นเหรอ?”\n\n“ครับ อีกไม่นานที่ว่าเนี่ย—เมื่อพิจารณาจากพระอุปนิสัยของประมุขของเราแล้ว—ก็น่าจะเป็นพรุ่งนี้นี่แหละครับ… พรุ่งนี้ตอนมาทำงานช่วยแต่งกายให้เรียบร้อยหน่อยนะครับ ถ้าเป็นไปได้ก็ช่วยเล็มหนวดเคราสักนิดด้วย”\n\n“ฉันไม่คิดว่าตัวเองอยู่ในฐานะที่จะรับการปูนบำเหน็จอย่างเปิดเผยได้หรอกนะ”\n\n“ครับ ก็นะ พวกเราทุกคนก็เป็นแบบนั้นกันหมดแหละครับ แต่ผมสังหรณ์ใจว่าคราวนี้อาจจะเป็นการปูนบำเหน็จแบบส่วนตัวสุดๆ มากกว่าแบบเปิดเผยนะครับ เข้าใจใช่ไหมครับ? เรื่องลึกซึ้งระหว่างชายหญิงแบบนั้นน่ะ”\n\nอีวานลุกขึ้นยืนพร้อมรอยยิ้มขบขันกับเรื่องไร้สาระที่ไม่ควรค่าแก่การเก็บมาใส่ใจนี้\n\nในฐานะผู้ใหญ่ที่มีเหตุมีผล ไม่ใช่เด็กหนุ่มวัยรุ่น เขาย่อมคาดเดาจุดยืนขององค์หญิงได้อย่างสมเหตุสมผล\n\nแม้พระองค์จะเพิ่งทรงวางรากฐานทางการเมืองจนมั่นคงสมบูรณ์แบบ ทว่าในท้ายที่สุดองค์หญิงก็ทรงจำต้องปฏิเสธการสืบราชสมบัติ ไม่มีเหตุผลอันชอบธรรมเพียงพอที่จะปลดกษัตริย์ซึ่งยังคงปฏิบัติพระราชกรณียกิจได้ตามปกติลงจากบัลลังก์\n\nการที่มกุฎราชกุมารถูกลักพาตัวและการก่อการร้ายในเมืองหลวงไม่ใช่ความผิดของพระราชา (นั่นคือถ้อยแถลงอย่างเป็นทางการ) วินาทีที่มีใครบังอาจวิพากษ์วิจารณ์ความไร้ความสามารถของพระราชา ระบบกองทัพทั้งหมดของนครหลวงรวมถึงกองบัญชาการต่อต้านข่าวกรองจะต้องถูกกวาดล้างทันที\n\nต่อให้สภาขุนนางจะขยายอิทธิพลมากขึ้นเพียงใด ภาพเหตุการณ์เช่นนั้นก็ย่อมไม่อาจเกิดขึ้นได้ ระบบกองทัพซึ่งรวมถึงกองพลรักษาการณ์นครหลวงนั้น ย่อมเป็นสวนหน้าบ้านของเหล่าขุนนางชั้นสูงมาแต่เดิมอยู่แล้ว\n\nฉะนั้น พระราชาไม่ได้ทรงไร้ความสามารถ เพียงแค่มีขุนนางกังฉินไร้ฝีมือไม่กี่คนคอยบังตาพระองค์เท่านั้น เมื่อสรุปเช่นนี้ การขึ้นครองราชย์สืบต่อบัลลังก์ย่อมกลับกลายเป็นเป้าของการถูกวิพากษ์วิจารณ์เสียเปล่าๆ\n\nด้วยเหตุนี้ องค์หญิงจึงไม่อาจทรงพระราชทาน ‘พระกรุณาธิคุณ’ ใดๆ อย่างเป็นทางการให้แก่กองบัญชาการต่อต้านข่าวกรองหรือตัวอีวานเองได้ เดิมทีก็ไม่มีประเทศไหนออกมาตกรางวัลให้สายลับของตนอย่างเอิกเกริกหรอก\n\nทว่าต่อให้ดมิทรีจะดูพึ่งพาไม่ค่อยได้เพียงใด เขาก็ไม่ใช่คนประเภทที่จะหยิบเรื่องที่เกี่ยวข้องกับองค์หญิงมาล้อเล่นแน่\n\nอีวานเดินกลับไปยังสถานเลี้ยงเด็กกำพร้าอย่างครุ่นคิด\n\nทันใดนั้น เขาก็สังเกตเห็นสีที่ลอกร่อนบนกำแพงสถานเลี้ยงเด็กกำพร้า ทั้งที่ทุ่มงบประมาณก้อนโตปรับปรุงความสวยงามของอาคารทุกๆ หกเดือนแท้ๆ แต่มันก็ยังออกมาสภาพนี้ (สาเหตุเป็นเพราะพวกเด็กกำพร้าชอบปีนป่ายกำแพงนั่นแหละ)\n\nถ้าคิดจะให้อะไรตอบแทนจริง เป็นเงินสดได้ก็คงจะดี\n\nอีวานพยักหน้าแล้วมุ่งหน้าไปยังห้องทำงานผู้อำนวยการ\n\n***\n\nดังที่เคยรำลึกถึงมาก่อนหน้านี้ หากมีกฎเหล็กอยู่สักข้อหนึ่งในนิยายแนวสถาบันการศึกษาทุกเรื่อง มันย่อมเป็นข้อนี้\n\nผู้อำนวยการโรงเรียน (หรืออธิการบดี) คือบุคคลที่แข็งแกร่งที่สุดในโลก\n\nใช่แล้ว ด้วยเหตุผลบางประการ แทนที่จะเป็นข้าราชการสายบริหารผู้ช่ำชอง เรามักจะได้เห็นจอมเวทอัจฉริยะ (ที่มีรูปลักษณ์เหมือนเด็กน้อย) หรือยอดฝีมือผู้กึ่งอมตะจากยุคก่อน (ที่มีรูปลักษณ์เหมือนเด็กน้อยเช่นกัน) มาครองตำแหน่งเหล่านี้อยู่เสมอ\n\nพอลองคิดดูแล้ว ดัมเบิลดอร์เองก็เป็นผู้ที่แข็งแกร่งที่สุดในยุโรป นั่นจึงเป็นเหตุผลที่เขาสามารถยับยั้งจอมมารแห่งเกาะอังกฤษ (ผู้มีเป้าหมายชีวิตคือการบุกโจมตีสถานศึกษารวมระดับประถม มัธยมต้น และมัธยมปลาย) เอาไว้ได้สำเร็จ เมื่อดูจากสภาพของฮอกวอตส์หลังการตายของดัมเบิลดอร์ เรื่องนี้ก็นับว่ามีความน่าเชื่อถือสูงทีเดียว\n\nหากจะให้เอ่ยนามผู้ที่แข็งแกร่งที่สุดในโลกใบนี้ ณ เวลานี้ ก็คงพอหยิบยกยอดฝีมือจากคนรุ่นก่อนขึ้นมาถกเถียงได้หลายคน ทว่าคนพวกนั้นล้วนเป็นคนมีเหตุมีผล จึงไม่มีทั้งเหตุจำเป็นหรือเวลาว่างพอจะมานั่งรับตำแหน่งอธิการบดีมหาวิทยาลัยหรอก\n\nในขณะเดียวกัน หากถามหาผู้ที่ ‘แข็งแกร่งที่สุดในพริตเชนคายา’ บังเอิญว่ามีบุคคลหนึ่งซึ่ง ‘มีภูมิหลังเป็นข้าราชการสายบริหาร’ ‘กุมความจงรักภักดีของกองทัพ การคลัง ตุลาการ และนิติบัญญัติไว้ในมือพร้อมกัน’ ‘ทว่าในเวลานี้กลับไร้ตำแหน่งทางการและพร้อมจะเข้ารับตำแหน่งกิตติมศักดิ์’ และ ‘บังเอิญอยู่ในวัยอันเหมาะสมแก่การออกเรือนพอดิบพอดี’\n\nมันจะไปสำคัญอะไรเล่าว่าพละกำลังทางกายภาพจะยอดเยี่ยมที่สุดหรือไม่? ต่อให้ยุคก่อนสมัยใหม่จะป่าเถื่อนล้าหลังเพียงใด กระทั่งบนโลกเดิม ผู้ที่กุมอำนาจด้วยกำลังกายเพียงอย่างเดียวก็สูญพันธุ์ไปพร้อมกับการสิ้นสุดของยุคโบราณแล้ว\n\nโดยธรรมชาติ คำว่า ‘ผู้แข็งแกร่งที่สุด’ ย่อมหมายถึงบุคคลผู้ถือครอง ‘อำนาจที่แข็งแกร่งที่สุด’ ต่างหาก\n\nย่อมเป็นเช่นนั้น\n\nผู้แข็งแกร่งที่สุดแห่งพริตเชนคายา\n\nในเช้าวันจันทร์ เอลิซาเวตา คิริลลอฟนา คราซิลอฟ ทรงส่งตัว (อดีต) อธิการบดีผู้เดินเข้ามาทำงานโดยไม่ทันตั้งตัวกลับบ้านอย่างสวัสดิภาพ (ตระกูลคราซิลอฟไม่มีสวัสดิการเงินเกษียณให้หรอกนะ) แล้วจึงทรงเดินหน้าปรับปรุงห้องทำงานอธิการบดีใหม่ทั้งหมด\n\n“อ้อ ตรงนั้นใช้ไม้มะเกลือนะ”\n\n“พ่ะย่ะค่ะ ฝ่าบา— เอ๊ย ขออภัยพ่ะย่ะค่ะ! องค์หญิง!!”\n\n“ไม่ต้องมากพิธีรีตองขนาดนั้นหรอก ข้ามาที่นี่ในฐานะอธิการบดีนะ เข้าใจไหม?”\n\n“ครับ ท่านอธิการบดี!!”\n\nงานเปลี่ยนโฉมห้องทำงานอธิการบดีให้กลายเป็นห้องทรงงานพระราชวังหลวงเสร็จสิ้นลงภายในช่วงเช้าอย่างน่าอัศจรรย์ ในพริตเชนคายา พวกเขาใช้ทรัพยากรมนุษย์ทุ่มบดขยี้แทนเวลา อนึ่ง ต่างจากเวลา มนุษย์เป็นทรัพยากรที่สามารถผลิตซ้ำขึ้นมาใหม่ได้\n\nเมื่อประทับนั่งในห้องทำงานอธิการบดีที่เริ่มดูน่าอยู่ขึ้นมาบ้างแล้ว (หมายถึงหรูหราประมาณ 50 เปอร์เซ็นต์ของห้องทรงงานในพระราชวังหลวงเท่านั้น) ในที่สุดเอลิซาเวตาก็พยักพระพักตร์ส่งสัญญาณให้นายทหารองครักษ์\n\n“ทีนี้ก็ไปพา ‘เขา’ มาที่นี่ซะ”\n\n“น้อมรับพระบัญชาพ่ะย่ะค่ะ ฝ่าบาท”\n\n“อะแฮ่ม”\n\n“ครับ ท่านอธิการบดี”\n\nโดยไม่กล้าเอ่ยทัดทานเลยว่า หากพระองค์ทรงปรารถนาจะได้รับการปฏิบัติในฐานะอธิการบดี ก็น่าจะทรงทิ้งเหล่าราชองครักษ์เอาไว้ที่พระราชวังเสีย นายทหารองครักษ์โค้งคำนับด้วยสีหน้าอันซับซ้อนแล้วเดินออกจากห้องทำงานอธิการบดีไป\n\nเอลิซาเวตาบิดขี้เกียจเล็กน้อยแล้วทอดพระเนตรออกไปนอกหน้าต่าง\n\nวิทยาเขตในวันฤดูร้อนอันสดใสนี้คราคร่ำไปด้วยเหล่านักศึกษาผู้เปี่ยมชีวิตชีวา ราวกับไม่เกี่ยวข้องใดๆ กับความโกลาหลที่เพิ่งผ่านพ้นไป\n\nน่าอิจฉาเสียจริง\n\nเอลิซาเวตาไม่เคยเข้าเรียนในโรงเรียนเลย ในโลกที่ปราศจากระบบการศึกษาขั้นพื้นฐานเช่นนี้ การศึกษาระดับสูงส่วนใหญ่มักจัดการผ่านการเรียนการสอนภายในบ้าน\n\nวัยเยาว์ครึ่งหนึ่งของพระองค์หมดไปภายในพระราชวัง ส่วนอีกครึ่งหนึ่งอยู่กลางสมรภูมิรบ การศึกษาที่พระองค์ทรงได้รับมุ่งเน้นไปที่มารยาทชนชั้นสูง มารยาทราชสำนัก พิชัยสงคราม รัฐศาสตร์ และทฤษฎีแห่งองค์ราชัน\n\nนั่นหมายความว่าพระองค์ไม่เคยมีประสบการณ์ในการยิ้มหัวเราะอย่างสดใสและเดินจับกลุ่มคลุกคลีกับเพื่อนรุ่นเดียวกันเลย ทั้งที่ความจริงแล้ว ช่วงวัยระหว่างพระองค์กับนักศึกษาเหล่านั้นก็ไม่ได้ห่างกันมากนัก (พระองค์ทรงนับทุกคนที่อายุต่างกันไม่เกิน 10 ปีว่าเป็นคนรุ่นราวคราวเดียวกันทั้งสิ้น ดังนั้น อีวานจึงนับเป็นเพื่อนรุ่นเดียวกันของพระองค์ด้วย)\n\n“อืม…”\n\nประกาศแต่งตั้งอย่างเป็นทางการให้พระองค์ทรงดำรงตำแหน่งอธิการบดีแห่งมหาวิทยาลัยเซนต์ยานสก์คงส่งไปถึงสภาขุนนางแล้วในป่านนี้ พวกตาแก่พวกนั้นคงกำลังเดือดดาลกันน่าดู\n\nมหาวิทยาลัยเซนต์ยานสก์เป็นสถานศึกษาที่มีชื่อเสียงระดับนานาชาติ ฉะนั้น เหล่าขุนนางจึงพยายามอย่างยิ่งยวดที่จะส่งบุตรหลานเข้ามาศึกษาต่อที่นี่ มิใช่เพียงเพราะความใฝ่รู้ทางการศึกษาเท่านั้น หากแต่เป็นส่วนหนึ่งของกิจกรรมเข้าสังคมระดับนานาชาติด้วย\n\nหากลองคิดย้อนกลับในมุมตรงกันข้าม\n\nหากพระองค์ทรงยึดครองสถาบันแห่งนี้ไว้ได้โดยสมบูรณ์ เหล่าขุนนางส่วนใหญ่ในพริตเชนคายาก็แทบจะตกอยู่ในสภาพที่ส่งตัวประกันมาไว้ในกำมือของพระองค์โดยปริยาย\n\nเอลิซาเวตาแย้มยิ้มเย็นเยียบ มันคือรอยยิ้มอันคู่ควรแก่ผู้ปกครองระบอบโชกุน องค์ราชันผู้บงการความมืดมิดแห่งราชอาณาจักร\n\nกษัตริย์ผู้ปรีชาสามารถย่อมรู้วิธีตักตวงผลประโยชน์นับสิบประการจากนโยบายเพียงข้อเดียว ตำแหน่งอธิการบดีของสถาบันมิใช่เป็นเพียงเครื่องมือข่มขู่สภาขุนนางเท่านั้น\n\nไม่สิ นั่นเป็นเพียงเป้าหมายรองเท่านั้น หากเป็นเพียงการสยบสภาขุนนาง ก็ย่อมมีหนทางอื่นอีกมากมาย\n\nเช่นนั้น เป้าหมายทางยุทธวิธีที่แท้จริงของพระองค์ก็คือ…\n\n“ท่านอธิการบดี กระหม่อม… เอ๊ย ผมพาตัวเขามาแล้วครับ”\n\n“ให้เข้ามา”\n\nด้วยสีหน้าอันซับซ้อนที่ไม่คิดจะตั้งคำถามเลยว่าเหตุใดพระองค์จึงตรัสด้วยน้ำเสียงแบบนั้นหากตั้งพระทัยจะให้เรียกขานว่าอธิการบดี นายทหารองครักษ์เปิดประตูห้องทำงานอธิการบดีออก\n\nเบื้องหลังเขานั้น บุรุษผู้สวมชุดทำงานที่ซักสะอาดเอี่ยมพร้อมผ้าขนหนูเนื้อนุ่มพาดอยู่รอบลำคอเดินก้าวเข้ามา\n\n“มาแล้วรึ”\n\n“…ครับ”\n\n“นั่งลงสิ ข้ามีเรื่องต้องคุยด้วยมากมายเลย”\n\nชายผู้นั้นมองเอลิซาเวตาซึ่งกำลังประทับครองห้องทำงานอธิการบดีอยู่ครู่หนึ่ง กวาดสายตาสำรวจห้องทำงานอธิการบดีที่แปรสภาพไปโดยสิ้นเชิง แล้วเงยหน้ามองเพดานชั่วครู่ก่อนพึมพำเสียงแผ่ว\n\nสงสัยคงอดได้เงินแล้วล่ะมั้งงานนี้\n\nกระนั้น เนื่องจากนั่นไม่ใช่มารยาทอันพึงแสดงต่อหน้าสายพระโลหิตแห่งราชวงศ์ บุรุษผู้มีเหตุผลและเปี่ยมมารยาทจึงทรุดตัวลงนั่งบนโซฟาแต่โดยดี\n\n***\n\n**💬 ความคิดเห็นนักอ่าน:**\n- **@กองพันข่าวกรองร่ำไห้** (3 วันที่แล้ว • 👍 154): ลุงอีวานใช้เวลาสุดสัปดาห์ซ้อมเจ้าหน้าที่ต่อต้านข่าวกรองจนสะบักสะบอม ก่อนหิ้วตัวคนทรยศทั้งชุดนอนมาโยนให้ดมิทรี... แต่ตลกสุดคือพวกเจ้าหน้าที่โดนซ้อมปางตายดันยิ้มปลื้มปริ่มที่ได้ฝึกกับผู้ก่อตั้งหน่วยนี่แหละ 555\n- ↳ **@ดมิทรีผู้แบกรับทุกสิ่ง** (3 วันที่แล้ว • 👍 49): ดมิทรีน่าจะเหนื่อยใจที่สุดในอาณาจักรแล้ว ทั้งงานวัง ทั้งคนทรยศ ทั้งอาจารย์ในชุดนอน 555\n- **@ทีมเรือองค์หญิง** (3 วันที่แล้ว • 👍 188): กรี๊ดดดด! องค์หญิงเอลิซาเวตาผู้กุมอำนาจทั้งราชอาณาจักร ลงทุนมานั่งเก้าอี้อธิการบดีชั่วคราวของมหาวิทยาลัยเซนต์ยานสก์ด้วยตัวเอง เพื่อจะเรียก \"วานก้า\" เข้าพบส่วนตัวในชุดทำงานซักใหม่ๆ นี่มันชัดเจนมาก!!\n- **@ลุงคิดเรื่องเงินก่อนเสมอ** (2 วันที่แล้ว • 👍 109): สายตาเอลิซาเวตาเป็นประกายขนาดนั้น แต่คำแรกที่ลุงคิดในใจคือ \"สงสัยคงอดได้เงินแล้วล่ะมั้งงานนี้\" ... โอ๊ย ลุงอีวานนน 5555"

      "title": "บทที่ 60",
      "content": "เอลิซาเวตาเอาแต่พ่นเรื่องไร้สาระออกมาไม่หยุด อย่างเรื่องที่ว่ากำลังพิจารณาร่างกฎหมายเก็บภาษีค่าดูแลขนตามร่างกายผู้ชายเพื่อสุขอนามัยสาธารณะบ้างล่ะ หรือข่าวซุบซิบต่างประเทศอันไร้แก่นสารทำนองว่าเจ้าหญิงผู้เกือบจะคว้าตำแหน่งกษัตริย์องค์ต่อไปมาครองได้อยู่รอมร่อ จู่ๆ กลับเปิดกว้างเรื่องการแต่งงานสู่ตลาดคู่ครองโดยไม่เกี่ยงฐานันดรศักดิ์บ้างล่ะ\n\n“อืม เข้าใจแล้วครับ”\n\n“โอ้ นั่นเป็นเรื่องที่ผมอยากฟังมากเลยครับ”\n\n“อ่า จริงด้วยครับ แบบนั้นเลย”\n\n“ครับ ฝ่าบาท ตรัสถูกแล้วครับ”\n\nในฐานะคนเข้าสังคมเก่ง อีวานกำลังงัดทักษะการเข้าสังคมยุคใหม่ซึ่งมีตัวแทนคือ [รับฟัง เห็นพ้อง เห็นใจ และตอบรับ] ออกมาใช้ เพื่อสำแดงความสามารถด้าน ‘ความเห็นอกเห็นใจ’ อย่างเต็มที่\n\nเอลิซาเวตาจ้องมองเขาด้วยสายตารังเกียจเหยียดหยามอย่างถึงที่สุด ก่อนจะถอนหายใจเฮือกใหญ่แล้วกลับคืนสู่สีหน้าจริงจังในที่สุด\n\nอีวานซึ่งนั่งฟังคำพูดของเธอด้วยสีหน้าขึงขังสม่ำเสมอทั้งที่ปล่อยผ่านหูไปครึ่งหนึ่ง (อันที่จริงแทบจะทั้งหมด) เพิ่งตระหนักได้ว่ากำลังจะเข้าสู่ประเด็นหลักเสียที จึงหันมาจดจ่อกับเธอ\n\n“วานก้า เจ้ารู้ใช่ไหมว่าไอ้พวกคนแคระสารเลวนั่นเปิดฉากโจมตีพริตเชนคายาครั้งใหญ่?”\n\n“พ่ะย่ะค่ะ ฝ่าบาท”\n\n“แล้วก็รู้ด้วยใช่ไหมว่าในระหว่างนั้น พวกมันนำโบราณวัตถุขุดเจาะติดตัวมาด้วย?”\n\n“พ่ะย่ะค่ะ”\n\nแม้จะไม่ได้เห็นกับตาตนเอง แต่เขาก็จับต้นชนปลายสถานการณ์ในคืนฝนตกกลางถนนเมืองพริตเชนคายาได้ทั้งหมดแล้ว\n\nการพังทลายของผืนดินเป็นบริเวณกว้าง อาวุธทำลายล้างของพวกคนแคระที่สามารถฝังกลบเมืองทั้งเมืองได้หากเปิดใช้งานอย่างสมบูรณ์\n\nกลไกขุดเจาะ โบราณวัตถุขุดเจาะ ไม่ว่าพวกนั้นจะเรียกมันว่าอะไรก็ตาม ในแนวหน้ามักเรียกขานโครงสร้างมหึมาเหล่านั้นอย่างคร่าวๆ ในทำนองนี้\n\nทว่าจากการกวาดล้างอย่างละเอียดถี่ถ้วนไร้ปรานีในสงครามครั้งก่อน เขาเคยเชื่อว่าโบราณวัตถุเช่นนั้นไม่หลงเหลืออยู่บนโลกใบนี้แล้ว…\n\n“ใช่ แม้เอนริเก้จะสังหารไอ้พวกคนแคระบัดซบนั่นจนหมดสิ้น… แต่สุดท้าย นางกลับพบเพียงร่องรอยของโบราณวัตถุชิ้นนั้นเท่านั้น”\n\n“ร่องรอย ที่ว่าหมายถึง…?”\n\n“ร่องรอยการเริ่มทำงานเพื่อทำลายชั้นดิน พบเพียงร่องรอยการเดินเครื่องขนาดมหึมาพอจะถล่มฝั่งตะวันออกของพริตเชนคายาให้พังราบทั้งแถบ ลองดูบันทึกนี่สิ”\n\nเอลิซาเวตายื่นแฟ้มเอกสารที่ประทับตราลับเฉพาะส่งให้เขา\n\n– ตรวจพบโพรงซึ่งโครงสร้างขนาดมหึมาเคลื่อนผ่านใต้ดินฝั่งตะวันออกของพริตเชนคายา ทางน้ำใต้ดินในฝั่งตะวันออกถูกทำลายเสียหาย 75% และระบบระบายน้ำทั่วทั้งเขตตะวันออกหยุดทำงาน\n\n– จากการแกะรอยร่องรอยการทำลายล้าง คาดว่าโบราณวัตถุดังกล่าวหยุดทำงานลงเกือบจะในทันทีหลังจากพยายามเปิดใช้งานระบบถล่มชั้นดิน\n\n– ดำเนินการแกะรอยตามเส้นทางการเคลื่อนที่ของโครงสร้าง\n\n– ร่องรอยขาดหายไปบริเวณใกล้มหาวิทยาลัยเซนต์ยานสก์\n\n– จากการตรวจวัดด้วยเวทมนตร์ พบโพรงใต้ดินที่ไม่ทราบที่มาอยู่เบื้องล่างมหาวิทยาลัยเซนต์ยานสก์\n\n– ความพยายามในการบุกเข้าไปยังพื้นที่ดังกล่าวทั้งหมดประสบความล้มเหลว\n\n– ยื่นแผนอพยพนักศึกษาชั้นปริญญาตรีทั้งหมดและแผนงานก่อสร้างขนาดใหญ่ โปรดดูเอกสารแนบหน้า 12\n\n“อืม…”\n\nอีวานปิดแฟ้มเอกสารลงแล้วจมดิ่งสู่ห้วงความคิด\n\nโพรงที่ไม่ทราบที่มาอยู่ใต้ดินของสถาบันแห่งนี้เนี่ยนะ?\n\n“มีเหตุผลอะไรที่ทำให้ไม่สามารถขุดเจาะเข้าไปในโพรงใต้ดินนั้นได้หรือพ่ะย่ะค่ะ?”\n\n“ตามความเห็นของผู้เชี่ยวชาญฝั่งเรา การขุดเจาะขนาดใหญ่ที่เริ่มจากชั้นใต้ดินมีความเสี่ยงสูงที่จะทำให้ชั้นดินพังทลาย มันอาจก่อให้เกิดการทรุดตัวครั้งใหญ่โดยมีอาคารเรียนของสถาบันเป็นจุดศูนย์กลาง ซึ่งเป็นอันตรายต่อคนงานในพื้นที่”\n\n“ถ้าเช่นนั้น เหตุผลที่ฝ่าบาทไม่ทรงสั่งอพยพตามที่ระบุในรายงานฉบับนี้ก็คือ…”\n\n“นี่คือความเห็นจากแผนกวิศวกรรมเวทมนตร์ของเรา ลองดูนี่สิ”\n\nสิ่งถัดมาที่เธอส่งให้คือแฟ้มเอกสารที่ต้องใช้สิทธิ์เข้าถึงความลับระดับสูงยิ่งกว่าเดิม แม้สภาพตัวอักษรจะดูเหมือนถูกจดขยุกขยิกอย่างเร่งรีบก็ตาม\n\n– ผลการตรวจวัดยืนยันว่ามีการติดตั้งอาคมขนาดใหญ่บางชนิดไว้ภายในโพรงใต้ดินเบื้องล่างมหาวิทยาลัยเซนต์ยานสก์\n\n– อาคมดังกล่าวได้สร้างระบบป้องกันของตนเองขึ้นมา รูปแบบการทำงานโดยรวมของระบบสามารถอนุมานได้จากการสูญหายไปของโบราณวัตถุขุดเจาะของพวกคนแคระ\n\n– คาดการณ์ช่วงเวลาที่ติดตั้งอาคมไว้อย่างน้อยที่สุด 1,500 ปีก่อน และสูงสุด 2,500 ปีก่อน…\n\n“…เรื่องแบบนี้มันเป็นไปได้ด้วยหรือพ่ะย่ะค่ะ?”\n\n“นั่นแหละที่ข้าจะบอก เอาเข้าจริงข้าเองก็แทบไม่เชื่อเหมือนกัน แต่ก็นะ งานครึ่งหนึ่งของแผนกวิศวกรรมเวทมนตร์เราก็เป็นทำนองนี้แหละ แล้วจะทำยังไงได้เล่า มีแต่ต้องเลือกว่าจะเชื่อ หรือจะทำเป็นมองข้ามไป อย่างใดอย่างหนึ่งเท่านั้น”\n\nเอลิซาเวตาส่ายหน้า\n\n“สิ่งที่แน่นอนก็คือ หากชั้นดินพังทลายลง วงเวทโบราณขนาดใหญ่ที่ฝังอยู่ในโพรงใต้ดินรวมถึงโบราณวัตถุขุดเจาะของพวกคนแคระจะสูญหายไปตลอดกาล”\n\n“พอจะทำวิศวกรรมย้อนกลับได้ไหมพ่ะย่ะค่ะ?”\n\nถึงตรงนี้ อีวานก็เข้าใจเจตนาของเอลิซาเวตาอย่างถ่องแท้แล้ว\n\nผู้บัญชาการสงครามผู้เปี่ยมทะเยอทะยานผู้นี้ ต้องการครอบครองทั้งโบราณสถานใต้ดินของสถาบันและโบราณวัตถุขุดเจาะของคนแคระเอาไว้ในกำมือทั้งสองอย่าง\n\nทว่าโบราณวัตถุของคนแคระไม่อาจซ่อมแซมฟื้นฟูได้ด้วยเทคโนโลยีของมนุษย์ อันที่จริง แม้แต่เทคโนโลยีของคนแคระเองก็ทำไม่ได้ เทคนิคการออกแบบสูญหายไปหมดสิ้นแล้ว และมันเป็นเครื่องจักรกลที่ซับซ้อนเกินกว่าจะทำวิศวกรรมย้อนกลับได้\n\nถึงกระนั้น หากยังมีตัวอย่างที่สมบูรณ์หลงเหลืออยู่ อย่างน้อยก็น่าจะพอคว้าอะไรติดไม้ติดมือกลับมาได้บ้าง มันอาจเป็นความเป็นไปได้อันริบหรี่ แต่ก็ยังดีกว่าไม่ได้อะไรเลย\n\nหากมันฝังอยู่ใต้ใจกลางเมืองหลวง การไม่ขุดขึ้นมาดูย่อมเป็นเรื่องโง่เขลา\n\nและในขณะเดียวกัน การพยายามขุดค้นอย่างเอิกเกริกกลางเมืองก็เป็นเรื่องโง่เขลาไม่แพ้กัน\n\nท้ายที่สุดแล้ว พวกเขาย่อมไม่ต้องการป่าวประกาศว่ากำลังวิจัยโบราณวัตถุของคนแคระ ทั้งยังไม่ต้องการเปิดเผยว่ากำลังจัดตั้งศูนย์วิจัยระดับชาติเพื่อศึกษาอาคมโบราณลึกลับไว้ใต้มหาวิทยาลัยเซนต์ยานสก์ สถานที่ซึ่งบุตรหลานของบุคคลสำคัญจากนานาประเทศพากันมาเล่าเรียนอยู่\n\n“วานก้า ข้าไม่ได้กำลังเรียกร้องความรักชาติจากเจ้านะ”\n\n“…”\n\n“ข้ากำลังเสนอข้อตกลง เป็นงานที่อันตราย สำคัญ และไม่อาจล้มเหลวได้”\n\n“โปรดมีรับสั่งมาได้เลยพ่ะย่ะค่ะ กระหม่อมพร้อมรับฟัง”\n\nอีวานพยักหน้าอย่างเคร่งขรึม\n\n“เอนริเก้บุกไล่ล่าเข้าไปตามอุโมงค์ใต้ดินที่พวกคนแคระขุดเอาไว้แล้ว ส่วนกองบัญชาการต่อต้านข่าวกรองกำลังทุ่มสรรพกำลังทั้งหมดเพื่อจับตาดูเหล่าขุนนางในเมืองนี้ และใต้ดินของสถาบันแห่งนี้ก็มีโบราณวัตถุที่ไม่รู้ทั้งผู้สร้าง จุดประสงค์ หรือยุคสมัยหลับใหลอยู่”\n\nเอลิซาเวตาจ้องมองเขาด้วยดวงตาที่ลุกโชน\n\n“หากมันอันตราย จงทำลายทิ้งซะ หากมันมีประโยชน์ จงนำมาให้ข้า โดยอย่าให้ผู้ใดล่วงรู้ เพื่อข้า… ไม่สิ เพื่อประเทศนี้ ขอแรงเจ้าอีกครั้งเถอะ”\n\n“พ่ะย่ะค่ะ ฝ่าบาท”\n\nเป็นคำตอบที่เอ่ยออกมาแทบจะในทันที\n\nเอลิซาเวตามองอีวานด้วยสีหน้าตื่นตะลึง\n\nเดี๋ยวก่อน ปกติข้าราชการทั่วไปอย่างน้อยก็ควรแสดงท่าทีลังเลสักนิดเมื่อถูกโยนงานนอกเหนือหน้าที่ให้ไม่ใช่หรือ? ถึงแม้เขาจะไม่ได้กินเงินเดือนจากราชสำนักโดยตรงก็ตามที…\n\nการตอบรับโครงการที่ทั้งคลุมเครือและอันตรายเช่นนี้ในทันทีโดยไม่มีข้อมูลที่ชัดเจนหรือการสนับสนุนใดๆ เลยเนี่ยนะ?\n\n“…เมื่อครู่เจ้าได้ยินตรงส่วนที่ข้าพูดว่ามันคือข้อตกลงจริงหรือเปล่า?”\n\n“พ่ะย่ะค่ะ ฝ่าบาท”\n\nเอลิซาเวตาเผยสีหน้างุนงงระคนสับสนออกมาเล็กน้อย\n\nตามปกติแล้ว มูลค่าของข้อตกลงย่อมสูงขึ้นตามระดับความจำเป็น ในเมื่อเธอแสดงออกว่าต้องการมากถึงเพียงนี้ เธอควรจะต้องวางสิ่งที่มีน้ำหนักมากกว่าเดิมลงบนตาชั่งอีกฝั่งไม่ใช่หรือ?\n\nทว่าบุรุษเบื้องหน้ากลับเพียงพยักหน้ารับโดยไม่เอ่ยปากเรียกร้องสิ่งใดเลย\n\nเช่นเดียวกับที่เขาทำมาโดยตลอด\n\n“เอ่อ… คือว่า ไม่มีอะไรที่เจ้าอยากได้บ้างเลยหรือ? ตำแหน่ง ทรัพย์สมบัติ เกียรติยศ สิทธิพิเศษ… อะไรทำนองนั้นน่ะ?”\n\n“ฝ่าบาททรงจำคำถามที่เคยส่งถึงกระหม่อมได้ไหมพ่ะย่ะค่ะ?”\n\n“หืม?”\n\n“จดหมายฉบับนั้นอย่างไรพ่ะย่ะค่ะ ฉบับที่ทรงฝากผ่านดมิทรีมา”\n\n“อ้อ จดหมายนั่นน่ะรึ แต่ทำไมถึง…?”\n\nเอลิซาเวตาเป็นคนฉลาดหลักแหลมอย่างยิ่ง เธอจดจำเอกสารทางการทุกฉบับที่ตนเองเป็นผู้ออกได้ทั้งหมด\n\nเนื่องจากการเมืองเป็นเรื่องละเอียดอ่อนอย่างที่สุด แม้เพียงถ้อยคำเรียบง่ายประโยคเดียวก็อาจแฝงนัยยะซับซ้อนเอาไว้ได้\n\nดังนั้น แม้จะเป็นจดหมายส่วนตัว ทว่าด้วยฐานะสาส์นส่วนพระองค์ของเจ้าหญิง เธอจึงจำเป็นต้องคำนึงถึงโอกาสที่จะถูกนำไปใช้ประโยชน์ทางการเมืองในทางมิชอบ ด้วยเหตุนี้ จดหมายที่เธอส่งให้อีวานจึงเต็มไปด้วยถ้อยคำเปรียบเปรยอันละเอียดอ่อนและระมัดระวัง\n\nเนื้อความคร่าวๆ ก็คือ… อืม\n\n– หากเจ้ามีความปรารถนา ข้าจะตอบแทนให้อย่างแน่นอนเป็นสามเท่า\n\nนี่คือคำกล่าวเก่าแก่ของชาวคราซิลอฟ ทั้งบุญคุณและความแค้นจงตอบแทนเป็นสามเท่าเสมอ\n\nเอาล่ะ ข้ามตรงนั้นไปก่อน\n\n– หากค่านั้นยังไม่เพียงพอ เราจะชดใช้ด้วยมิตรภาพของเรา\n\n– หากนั่นก็ยังไม่พออีก เราจะชดใช้ด้วยความทรงจำของเรา\n\n“อ่า…”\n\nเมื่อเห็นเอลิซาเวตาทำหน้าเลิ่กลั่ก อีวานจึงพยักหน้าอย่างหนักแน่นด้วยท่วงท่าสุขุมเป็นผู้ใหญ่\n\n“พระมหากรุณาธิคุณของอดีตกษัตริย์และพระกรุณาของฝ่าบาทก็มากเกินพอที่จะเป็นเหตุผลให้กระหม่อมปฏิบัติตามรับสั่งแล้วพ่ะย่ะค่ะ เงินทุนอุปถัมภ์ที่ฝ่าบาททรงจัดส่งให้ทุกไตรมาสเองก็เพียงพอเกินกว่าที่ต้องการมากแล้ว”\n\nอีวานเป็นคนโลภ เขาเปิดสถานเลี้ยงเด็กกำพร้าเพื่อสนองความหน้าซื่อใจคดของตนเอง\n\nการเลี้ยงดูเด็กกำพร้าสงครามต้องใช้เงินมหาศาล และอีวานก็มีเงินเก็บมากพอจากอายุราชการทหารอันยาวนาน รวมถึงเงินอุดหนุนอย่างเป็นทางการจากเจ้าหน้าที่ระดับสูงหลายคน ซึ่งรวมถึงเจ้าหญิงด้วย\n\nเขาเป็นคนยุคใหม่ที่คุ้นเคยกับระบบทุนนิยม ยิ่งไปกว่านั้น เขายังเป็นนายทหารสายการเมืองที่เคยสังกัดราชองครักษ์และมีสายสัมพันธ์กับนายทหารระดับสูง (หมายความว่าเขาเคยทำงานข่าวกรองภายในประเทศมาก่อน)\n\nดังนั้น เขาจึงรู้ดีว่า “ข้อตกลง” ของเอลิซาเวตาในทางตัวอักษรนั้นไม่ต่างอะไรกับลมปาก มันแทบจะเหมือนเช็คเปล่าไม่มีผิด\n\nแต่ในขณะเดียวกัน อีวานก็เป็นคน “มีไหวพริบ”\n\n‘ถ้ามีดันเจี้ยนอยู่ใต้สถาบัน ตามสามัญสำนึกแล้วมันก็ต้องมี “ฮิดเดนพีซ” ซ่อนอยู่สิ’\n\nดันเจี้ยนย่อมต้องมีรางวัลตอบแทน นี่คือหลักการที่มีปรากฏอยู่แม้แต่ในวรรณกรรมคลาสสิกอย่าง “ดันเจี้ยนส์ แอนด์ ดรากอนส์” (Dungeons & Dragons) ซึ่งขึ้นชื่อเรื่องการฟ้องร้องด้านลิขสิทธิ์อย่างจริงจังจนน่าประหลาดใจ\n\nยิ่งไม่ต้องพูดถึงเควสต์ที่เจ้าหญิงทรงมอบหมายให้โดยตรง ซึ่งเกี่ยวข้องกับห้องลับที่มีเวทมนตร์โบราณอันลึกลับเลย ไอเทมที่หลับใหลอยู่ข้างในนั้นจะสุดยอดขนาดไหนกันเชียว?\n\nสมมติว่าเขาเกิดไปขอรับการสนับสนุนสำหรับภารกิจลุยเดี่ยวเคลียร์ดันเจี้ยนเช่นนั้นขึ้นมา\n\nในมุมมองของเจ้าหญิง พระองค์อาจทรงคิดว่า\n\n‘อืม ค่าใช้จ่ายสูงกว่าที่คาดแฮะ บางทีข้าควรส่งเจ้าหน้าที่ภาคสนามไปสมทบเพื่อกระจายความเสี่ยงดีไหมนะ?’\n\nผู้คนในยุคสมัยนี้ไม่ได้โง่เขลาเลยแม้แต่น้อย และเจ้าหญิงก็ทรงเป็นผู้มีปรีชาสามารถโดดเด่นเหนือคนเหล่านั้นอย่างยิ่ง\n\nโอกาสที่เจ้าหญิงระดับนั้นจะทรงคิดอย่างซื่อบื้อว่า ‘อา เพราะข้าเชื่อใจอีวาน ข้าจะทุ่มเงินให้เขาไปเรื่อยๆ แล้วคอยดูเขาดำเนินปฏิบัติการพิเศษนี้ตามลำพังก็พอ!’ มันจะมีสักเท่าไรกันเชียว?\n\nคำตอบคือเข้าใกล้ศูนย์ การเมืองไม่ได้ทำงานแบบนั้น มีเหตุผลรองรับอยู่เสมอว่าเหตุใดนักลงทุนจึงต้องตรวจสอบงบการเงินรายไตรมาสและตรวจบัญชีเป้าหมายที่ตนลงทุน\n\nในฐานะคนยุคใหม่ผู้มีเหตุมีผล ขี้ระแวง และรู้เท่าทันโลก อีวานจึงตอบรับภารกิจนี้โดยไม่เอ่ยคำใดเพิ่มเติมอีก\n\nด้วยเหตุนี้ บัดนี้เจ้าหญิงจึงทรงเป็นฝ่ายติด “หนี้ทางการเมืองหรือหนี้ทางใจ” ต่อเขาแล้ว ซึ่งต่างจากหนี้สินที่เป็นรูปธรรมตรงที่หนี้ที่จับต้องไม่ได้เช่นนี้รับประกันขอบเขตการใช้งานที่กว้างขวางยิ่งกว่ามาก\n\nปัจจุบันเอลิซาเวตาคือผู้กุมอำนาจสูงสุดในเมืองนี้ อาจกล่าวได้ว่างานบริหารราชการแผ่นดินทั้งหมดของอาณาจักรคราซิลอฟขับเคลื่อนด้วยน้ำมือของพระองค์\n\nเพียงอาศัย “หนี้บุญคุณ” ของผู้ทรงอำนาจระดับนี้ เขาก็สามารถมอบการศึกษาขั้นสูงและโภชนาการที่ดีขึ้นให้เด็กๆ ในสถานเลี้ยงเด็กกำพร้าทุกคนได้โดยไม่ต้องกังวลเรื่องเงินทองอีกต่อไป\n\nหากเขารับรางวัลเป็นข้าวของเงินทองตรงๆ มันก็คงจบลงแค่ครั้งเดียวแล้วแล้วกัน แต่ในกรณีนี้ เขาจะสามารถคว้าเงินสนับสนุนทางเศรษฐกิจมาได้อีกมากเพียงใดภายใต้คำว่า “เงินอุปถัมภ์”?\n\nอีวานพยักหน้าอย่างพึงพอใจ รู้สึกราวกับตนเองกำลังกระทำการทุจริตคอร์รัปชันอันชั่วร้ายและแยบยลเสียเต็มประดา\n\nเขารวบรวมแฟ้มรายงานที่จัดเรียงไว้แล้วอย่างระมัดระวัง โค้งคำนับด้วยมารยาทราชสำนักอันไร้ที่ติ ก่อนจะเดินออกจากห้องทำงานอธิการบดีไป\n\nเอลิซาเวตาเหม่อมองแผ่นหลังของเขาอยู่นาน จากนั้นจึงยกมือขึ้นลูบหน้าตัวเองอย่างแห้งแล้ง แล้วทิ้งตัวซุกลงบนโซฟา\n\n“…เจ้าทึ่ม…”\n\nนายทหารราชองครักษ์ผู้บังเอิญได้ยินถ้อยคำอันไม่บังควรซึ่งไม่สมควรมีผู้ใดได้ยินนั้น หันศีรษะกลับไปทางหน้าต่างอย่างไร้สีหน้า\n\nยามนั้นคือฤดูร้อน\n\n***\n\n“ข้าจะยกอาณาจักรให้เจ้าครึ่งหนึ่ง”\n\nไม่สิ แบบนั้นไม่ได้ เกร่อเกินไป\n\n“เจ้าอยากได้ครอบครองบุคคลผู้สูงศักดิ์ที่สุดในราชอาณาจักรนี้ไหม?”\n\nบ้าเอ๊ย แบบนั้นฟังดูเหมือนซัคคิวบัสเกินไปแล้ว ขอลองเกลาใหม่หน่อย… อืม เอาแบบโรแมนติกๆ\n\n“ข้าจะมอบครึ่งหนึ่งของข้าให้เจ้า แล้วเจ้าจะมอบครึ่งหนึ่งของเจ้าให้ข้าไหม?”\n\nแบบนี้ฟังดูเข้าท่าไม่เบาเลย\n\nเอลิซาเวตาพึมพำกับตัวเองพลางจ้องมองกระจกในห้องทำงานอธิการบดี\n\nด้วยสีหน้าของเจ้าหญิงผู้เปี่ยมด้วยความทุ่มเท ผู้มอบหมายภารกิจสุดหินให้พลางเสนอ “ตัวข้าเอง” เป็นค่าตอบแทน\n\nนี่คือฉากเหตุการณ์ที่เกิดขึ้น 30 นาทีก่อนหน้า ก่อนที่อีวานจะตอบรับภารกิจโดยไม่เรียกร้องสิ่งตอบแทนใดๆ แล้วเดินจากไปพร้อมหัวใจอันเปี่ยมล้นด้วยความรักชาติ\n\n***\n\n**💬 ความคิดเห็นนักอ่าน:**\n- **@ผู้ประสบภัยฉากซ้อมบท** (3 วันที่แล้ว • 👍 289): โอ๊ยยยย ขำจนปอดโยก!! เอลิซาเวตานั่งซ้อมบทพูดสารภาพรักหน้ากระจกอยู่ 30 นาทีเต็ม: \"ข้าจะมอบครึ่งหนึ่งของข้าให้เจ้า แล้วเจ้าจะมอบครึ่งหนึ่งของเจ้าให้ข้าไหม?\" ... สุดท้ายเจอลุงตอบรับภารกิจแบบไม่เอาอะไรแล้วเดินชิ่งกลับไปเฉย ช็อตฟีลองค์หญิงสุดๆ 55555\n- ↳ **@โซฟาอธิการบดี** (3 วันที่แล้ว • 👍 112): ภาพริซ่าแห่งเหล็กกล้าซุกหน้าลงโซฟาด่าว่า \"เจ้าทึ่ม\" นี่มันน่ารักเกินต้านจริงๆ เอ็นดูฝ่าบาทไม่ไหวแล้ว\n- ↳ **@อีวานหัวใจเด็กกำพร้า** (2 วันที่แล้ว • 👍 76): ลุงแกเล็งแค่ฮิดเดนพีซใต้มหาวิทยาลัยกับเงินอุปถัมภ์สถานเลี้ยงเด็กกำพร้าอย่างเดียวเลย เรื่องความรักนี่สมองตัดสัญญาณ 100% 555\n- **@LoreHunter_TH** (2 วันที่แล้ว • 👍 98): ปมโบราณวัตถุขุดเจาะคนแคระที่ร่วงลงไปในโพรงอาคมโบราณอายุ 1,500–2,500 ปีใต้มหาวิทยาลัยเซนต์ยานสก์นี่น่าสนใจแฮะ น่าจะเป็นอารยธรรมยุคก่อนแน่นอน\n- **@เรือหลวงคราซิลอฟ** (2 วันที่แล้ว • 👍 64): ตอนนี้ได้เห็นมุมน่ารักขององค์หญิงเต็มๆ จากที่ดูเข้มมาตลอด อ่านแล้วยิ้มตามเลย"

      "title": "บทที่ 61",
      "content": "เอซิดิสเหม่อมองท้องฟ้าอย่างว่างเปล่า มันเป็นวันที่ท้องฟ้าฤดูร้อนสีครามสดใส นักศึกษาในลานมหาวิทยาลัยต่างหัวเราะคิกคักเรื่องอะไรสักอย่าง เหล่านกกำลังส่งเสียงร้อง ดอกไม้กำลังเบ่งบาน และเด็กไม่ดีอย่างพวกเธอก็...\n\n“ไม่ๆ ไม่ใช่แบบนั้น”\n\nเธอพยายามเรียบเรียงความคิดที่ยุ่งเหยิงขึ้นเรื่อยๆ ของตัวเอง เรื่องสำคัญตอนนี้ไม่ใช่วันนี้อากาศดีแค่ไหน\n\nแต่เป็นคุณลุงอีวานต่างหาก!\n\nตลอดสุดสัปดาห์ที่ผ่านมา เธอครุ่นคิดมาตลอด ส่วนใหญ่ก็เรื่องว่าจะจัดการกับคุณลุงยังไงดี\n\nหลังจากปล่อยข่าวลือไปทั่วว่าเขาตายแล้ว แถมยังจัดพิธีฝังศพอย่างยิ่งใหญ่ในสุสานแห่งชาติอีก แล้วเป็นยังไงล่ะ?\n\nทาดา! ที่แท้เขายังมีชีวิตอยู่! (แถมยังไว้หนวดเคราด้วย)\n\nมันเป็นเหตุการณ์สุดเหลือเชื่อที่ทำให้ทั้งช็อกเป็นสองเท่าและโกรธเป็นสามเท่า เอซิดิสรู้สึกวิงเวียนทุกครั้งที่นึกถึงคุณลุง\n\nน้ำเสียงการพูดจาของเขากลายเป็นห้วนๆ เย็นชา สีหน้าก็มืดครึ้มหม่นหมอง\n\nและงานอดิเรกใหม่ที่เพิ่งได้มา: การสะกดรอยตามนักศึกษาหญิง\n\n“ฉันต้อง... ฉันต้องดัดนิสัยคุณลุงซะแล้ว”\n\nใครสักคนต้องโอบกอดชายชราผู้โดดเดี่ยวและน่าสงสารคนนั้นไว้ (เขาอายุ 34 ปีแล้ว)\n\nโกนหนวดเคราให้เขา ทำอาหารอุ่นๆ ให้กิน และเป็นเสาหลักที่มั่นคงคอยดูแลไม่ให้เขาไปไล่ตามผู้หญิงคนอื่น...\n\nและนั่นก็เห็นได้ชัดว่าเป็นบทบาทของผู้หญิงที่รู้จักเขามานานที่สุดในโลกนี้ ไม่สิ ตามหลักเหตุผลแล้ว จะมีผู้หญิงคนไหนที่เข้าใจและโอบกอดผู้ชายแบบนั้นได้อีกล่ะ?\n\nฉันต้องเป็นคนทำ ไม่มีใครอื่นนอกจากฉันแล้ว\n\nเอซิดิสตัดสินใจอย่างแน่วแน่ ก่อนจะเริ่มลงมือเขียนจดหมาย\n\n– ท่านพ่อ\n\n– สบายดีไหมคะ? โชคดีที่ทางนี้หนูสบายดีค่ะ พริตเชนคายาเป็นที่ที่ดีมาก ตึกสูงใหญ่ ผู้คนเยอะแยะ และตามท้องถนนก็เต็มไปด้วยร้านค้า\n\n– มีคนที่รักการร้องเพลงเยอะเลยค่ะ อ้อ ไม่ใช่แบบที่ร้องตอนเมาหรอกนะคะ ไม่ใช่เสียงกลอง แต่เป็นเครื่องสายต่างหาก เป็นบทเพลงที่ให้เสียงอบอุ่นไพเราะและบรรเลงร่วมกันหลายคน\n\n– พวกพี่น้องเป็นยังไงบ้างคะ? สบายดีกันใช่ไหม? คงจะสบายดีนั่นแหละ เพราะต่างจากหนู พวกนั้นชอบการต่อสู้กันนี่นา\n\nเอซิดิสชะงักไปครู่หนึ่ง ก่อนจะหลับตาปี๋แล้วตวัดปลายปากกาต่ออย่างไม่ลังเล\n\n– ว่าแต่ ไม่ใช่เรื่องใหญ่โตอะไรหรอกนะคะ แต่หนูกำลังคิดเรื่องแต่งงานอยู่ค่ะ\n\n– หนูได้เจอ... กำลังจะได้เจอผู้ชาย... ผู้ชายที่ดีคนหนึ่งค่ะ\n\n– ไม่ต้องเป็นห่วงนะคะ ถ้าท่านกำลังดูตัวคู่หมั้นคนอื่นให้หนูอยู่ ช่วยยกเลิกด้วยนะคะ\n\n– แค่นี้ก่อนนะคะ\n\n– เอซิดิส\n\nดีล่ะ แบบนี้ก็ได้คำอนุญาตจากพ่อแม่เรียบร้อยแล้ว (ความจริงคือยัง)\n\nเอซิดิสพยักหน้าอย่างพึงพอใจพลางลุกขึ้นยืน ตอนนี้มีดสั้นกลับมาอยู่ในมือของเธออีกครั้งแล้ว\n\n“ตอนนี้คุณลุงไปอยู่ไหนกันนะ?”\n\nไม่กี่วันที่ผ่านมา อีวานไม่ค่อยปรากฏตัวให้เห็นอย่างน่าสงสัย ทั้งที่ก่อนหน้านี้ยังสะกดรอยตามเธออย่างขยันขันแข็งแท้ๆ แต่ดูเหมือนเขาจะหาเป้าหมายใหม่ได้แล้ว\n\n“อะฮ่าๆ”\n\nแน่นอนว่านิสัยเสียแบบนั้นต้องรีบแก้ไขให้เร็วที่สุดเท่าที่จะทำได้ เธอเป็นห่วงอนาคตของเขาอยู่แล้วว่าต่อไปเขาจะใช้ชีวิตยังไง\n\nอุปสรรคใหญ่ที่สุดต่อความเจ้าชู้ของอีวาน (เธอกับอีวานไม่ได้อยู่ในความสัมพันธ์ที่จะใช้คำว่า “นอกใจ” ได้หรอกนะ) น่าเศร้าที่เป็นคนที่ครั้งหนึ่งเคยเป็นเพื่อนสนิทที่สุดของเธอ... อิซาเบลล์ เดอ เอตัวล์\n\nอีวานเองก็ดูจะใส่ใจอิซาเบลล์มากเป็นพิเศษ ถึงขั้นสอนการใช้อาวุธให้เป็นการส่วนตัว ส่วนอิซาเบลล์ก็ดูจะคอยตามติดเขาแจ\n\nไม่สิ คำว่า “ตามติด” ยังไม่ตรงเสียทีเดียว\n\nในฐานะคนที่เติบโตในราชสำนักมาหลายปีและช่ำชองเรื่องเล่ห์เหลี่ยมการเมืองในวัง เธอดูออก สายตาอันเฉียบคมของเธอมองความรู้สึกของอิซาเบลล์ออกทะลุปรุโปร่งแล้ว\n\nทำเป็นวางท่าไม่รู้ไม่ชี้ ทำตัวเหมือนปกติ แต่กลับแอบ “ส่งสายตาให้ท่า” คุณลุงอีวานอย่างแยบยล นี่มันเกินจะให้อภัยจริงๆ กล้าดียังไงมาหมายปองผู้ชายที่มีครอบครัวเป็นตัวเป็นตนแล้ว (ความจริงคือยังไม่มี)\n\nหากเป็นที่อาณาจักรโดรอัน ความผิดชั่วช้าแบบนี้สมควรต้องจับมาแสดงการละเล่นพื้นบ้านของชาติให้ดูเป็นขวัญตา ซึ่งขอบอกไว้ก่อนว่าการละเล่นพื้นบ้านของโดรอัน ได้แก่ แขวนเสา, เผาทั้งเป็น, ถ่วงน้ำ, และอินทรีโลหิต\n\nเมื่อเห็นแก่มิตรภาพในอดีต เธอคงไม่ทำอะไรรุนแรงขนาดนั้นหรอก แต่ก็ยังจำเป็นต้องสั่งสอนให้หลาบจำเสียบ้าง\n\nด้วยร่างกายผอมแห้งเป็นไม้เสียบผีอย่างกับเด็กแบบนั้น กล้าดียังไง\n\nยิ่งไปกว่านั้น แม้แต่อาณาจักรทิลเลสอันป่าเถื่อนไร้ความเจริญจะโอ้อวดวัฒนธรรมอันเสื่อมทรามและลามกที่เชิดชูเรื่อง “รักๆ ใคร่ๆ” ในที่สาธารณะภายใต้ชื่อของวิถีอัศวิน แต่โดรอันหาได้เป็นเช่นนั้นไม่\n\nโดรอัน ประเทศที่เจริญรุ่งเรืองด้านศีลธรรม ยึดถือความบริสุทธิ์ผุดผ่อง ความสำรวม และรักแท้ระหว่างชายหญิงเป็นคุณธรรม (ซึ่งหมายถึงการตอนผู้ชายที่นอกใจ และประหารชีวิตชู้รัก)\n\n“คงยุ่งน่าดูเลย...”\n\nเธอต้องสอนเรื่องความสำรวมและสามัญสำนึกให้อีวาน แถมยังต้องสอนวัฒนธรรมครอบครัวของโดรอันให้บรรดาผู้หญิงที่มารุมล้อมเขา รวมทั้งอิซาเบลล์ด้วย เธอช่างเป็นคนงานยุ่งเสียจริง\n\n***\n\n— กรอด...\n\nอิซาเบลล์จ้องเขม็งไปยังมุมหนึ่งของมหาวิทยาลัย โดยมีดาบไม้สำหรับฝึกพาดอยู่บนบ่า\n\nหลังจากแอบตามอีวานมา เธอก็ยืนยันได้แล้วว่าเขาเดินเข้าไปในห้องทำงานอธิการบดี และพอเบนสายตาไปอีกนิด ตรงใต้ร่มไม้ริมถนนหน้าอาคารหลักที่มุ่งหน้าไปยังห้องทำงานอธิการบดี ก็มองเห็นเงาร่างหนึ่งยืนอยู่ตรงนั้น\n\nผู้หญิงน่ารังเกียจที่เคยเป็นเพื่อนของเธอ กำลังยืนสงบเสงี่ยมประสานมืออย่างเรียบร้อย คลี่ยิ้มอบอุ่นพลางมองไปยังทางเข้าอาคารหลัก\n\n“คนทรยศ”\n\nอิซาเบลล์พึมพำเสียงเรียบไร้ความรู้สึก เธอกัดปลายเล็บหัวแม่มือแน่นพลางจ้องเขม็งไปยังยัยคนเถื่อนเหลือขอคนนั้น\n\nดีแต่เอาเรือนร่างอุ้ยอ้ายทื่อมะลื่อนั่นมาเรียกร้องความสนใจ\n\n‘คุณลุงเป็นทหารที่ผ่านการฝึกฝนมาอย่างเข้มงวด’\n\nแค่แลกเปลี่ยนคำพูดกับเขาสักสามคำก็รู้แล้ว เขาเป็นคนที่รักความมีประสิทธิภาพ\n\nและแน่นอนว่าเรือนร่างของเอซิดิสก็คือตัวแทนของความไร้ประสิทธิภาพอย่างถึงที่สุด คนเดียวที่ดูไร้ประสิทธิภาพยิ่งกว่าหล่อนก็คือนักบุญหญิงที่เธอเคยเห็นอยู่ไกลๆ นั่นแหละ\n\nไขมันส่วนเกินเหล่านั้นคือสัญลักษณ์ของความเกียจคร้าน และอิซาเบลล์ก็มั่นใจว่าตัวเองไม่มีทางแพ้ผู้หญิงขี้เกียจและทื่อมะลื่อแบบนั้นแน่นอน\n\nถึงหล่อนจะเลียนแบบวิธีการของเธออย่างขี้ขลาดเพื่อจ้องจับคุณลุงก็เถอะ เหอะ ฝันไปเถอะ\n\nของลอกเลียนแบบไม่มีวันชนะของแท้ได้หรอก\n\nอีกอย่าง ความสัมพันธ์ระหว่างชายหญิงย่อมพิสูจน์กันด้วยเวลาที่ใช้ร่วมกันและความทรงจำที่สร้างมาด้วยกัน คุณลุงจะจำชื่อเอซิดิสได้หรือเปล่าเหอะ (จำได้นะ)\n\n“หึ... หึๆ”\n\nอิซาเบลล์ยืดหลังตรงพร้อมรอยยิ้มเปี่ยมความมั่นใจ\n\nใช่แล้ว นี่คือศึกที่ไม่มีวันแพ้ ตั้งแต่แรกมันก็ไม่ใช่การต่อสู้ด้วยซ้ำ ผู้ใหญ่สั่งสอนเด็กเรียกว่าการประลองหรือไง? เปล่าเลย นี่มันแค่การอบรมสั่งสอนต่างหาก\n\n“ในราชสำนักทิลเลส เรื่องแค่นี้เป็นแค่พื้นฐานของการเมืองเท่านั้นแหละ”\n\nขณะที่ราชสำนักอันป่าเถื่อนและล้าหลังของโดรอันพึ่งพาแต่เพียงอำนาจและบารมีของมหาราชาในการตัดสินใจ ทิลเลสนั้นแตกต่างออกไป\n\nอาณาจักรทิลเลสคือมหาอำนาจทางวัฒนธรรมที่สร้างอารยธรรมขึ้นด้วยระบบกฎหมายอันเข้มงวดและจิตสำนึกทางจริยธรรม มีระบอบการปกครองที่ซับซ้อนและงดงาม แตกต่างโดยสิ้นเชิงกับระบบการเมืองเรียบง่ายที่ผู้ปกครองเผด็จการเพียงคนเดียวถืออำนาจเบ็ดเสร็จ\n\nดังนั้น อิซาเบลล์จึงตัดสินใจว่าจะสอน “วัฒนธรรม” ให้ลูกสาวของคนเถื่อนคนนั้นในฐานะตัวแทนของชาติมหาอำนาจทางวัฒนธรรม\n\n“อ๊ะ!”\n\nอีวานเดินก้าวฉับๆ ออกจากอาคารหลัก รอยยิ้มหลุดออกมาจากริมฝีปากของเธอโดยไม่รู้ตัวเมื่อเห็นใบหน้าไร้อารมณ์นั้น ใบหน้าที่ทำให้เดาไม่ออกเลยว่าเขากำลังคิดอะไรอยู่ ทั้งที่เห็นได้ชัดว่าเขาไม่ได้คิดอะไรเลยก็ตาม\n\nเธอวิ่งเข้าไปหาเขาพร้อมโบกมือรัวๆ\n\n“คุณลุงคะ—!!”\n\n***\n\nต้องพาจอมเวทไปด้วยสักคน\n\nอีวานเป็นคนมีเหตุผล ดังนั้นเขาจึงไม่มีความคิดจะลุยเดี่ยวเข้าไปพิชิต “ดันเจียนใต้ดินของสถาบันที่เต็มไปด้วยเวทมนตร์โบราณ” เพียงลำพัง\n\nเขามีความสามารถติดตัวอยู่หลายอย่าง แต่น่าเสียดายที่เขาไม่เคยเรียนเวทมนตร์ หมายความว่าเขาไม่เคยเรียนคาถาที่จัดอยู่ในหมวด “เวทมนตร์” จริงๆ เลย นอกเหนือจากเวทง่ายๆ อย่างการจุดไฟหรือดับไฟ\n\nเขาเป็นสายลับที่ได้รับการฝึกฝนในสนามรบช่วงสงคราม แต่เวทมนตร์เป็นศาสตร์ในแวดวงวิชาการ มันต้องอาศัยความรู้ที่ซับซ้อน ทั้งสูตรคำนวณอันแม่นยำ ร่ายคาถา พิธีกรรม วัตถุดิบปรุงยา และอีกสารพัด\n\n‘จะไปหาจอมเวทได้จากที่ไหน’\n\nอีวานเดินครุ่นคิดไปพลาง แม้จะยังไม่รู้แก่นแท้ของเวทมนตร์โบราณนั้น แต่สิ่งที่แน่ชัดก็คือมันจัดอยู่ในหมวดเวทอันทรงพลังที่สามารถทำลายโบราณวัตถุของคนแคระได้ในพริบตา\n\nเวทมนตร์ระดับนั้นไม่อาจปลดออกด้วยมือเปล่าได้ จำเป็นต้องใช้จอมเวท โดยเฉพาะจอมเวทที่เชี่ยวชาญด้านการ “ตีความ”\n\nคนที่น่าเชื่อถือที่สุดในหมู่จอมเวทเหล่านั้นย่อมต้องเป็นเบโอลกริน แต่เขาไม่มีทั้งช่องทางและไม่คิดจะเรียกตัวอีกฝ่ายมา\n\nถ้าจะให้คิดถึงคนอื่น อย่างคณบดีคณะเวทมนตร์... แต่แบบนั้นก็ขัดกับลักษณะของภารกิจลับ ทันทีที่ขอความช่วยเหลือจากเอลฟ์ ข้อมูลก็จะรั่วไหลไปยังหมู่เกาะคาลีออนทันที\n\n“คุณลุงคะ—!!”\n\n“หืม?”\n\nอีวานเงยหน้าขึ้นตามเสียงเรียก อิซาเบลล์กำลังวิ่งเข้ามาหาเขาพร้อมดาบไม้และรอยยิ้มสดใส\n\nมีสิ่งผิดปกติสะดุดตาเข้า อีวานขมวดคิ้วแล้วคว้าข้อมือของอิซาเบลล์เอาไว้ทันทีที่เธอวิ่งเข้ามาใกล้\n\n“อ๊ะ?!”\n\n“อย่าขยับ”\n\nอีวานจับข้อมือขวาเธอไว้ด้วยมือเดียว แล้วล้วงกระเป๋าหยิบพลาสเตอร์ปิดแผลออกมา เขาไม่ได้ใช้น้ำยาฟื้นฟูเพราะไม่จำเป็นต้องทรมานกันโดยใช่เหตุ\n\nด้วยท่วงท่าที่คล่องแคล่ว เขาแปะพลาสเตอร์ปิดแผลลงรอบเล็บหัวแม่มือของอิซาเบลล์ พลาสเตอร์แบบดั้งเดิมในยุคก่อนสมัยใหม่นี้เป็นเพียงผ้าชิ้นเล็กๆ ที่ทายาขี้ผึ้งไว้ แต่การใช้งานก็คล้ายคลึงกับของยุคปัจจุบัน\n\nอีกอย่าง เขาก็เป็นผู้อำนวยการสถานเลี้ยงเด็กกำพร้า เด็กๆ มักมีความผูกพันกับที่สูงอย่างน่าประหลาด เขาจึงมีประสบการณ์โชกโชนในการแปะพลาสเตอร์ให้แผลเล็กๆ น้อยๆ ของเด็ก\n\n“ติดนิสัยเสียมาอีกแล้วนะ”\n\n“อะ... เอ่อ... ค่ะ...”\n\nอิซาเบลล์หลบสายตา ดวงตากลอกกลิ้งไปมา ใบหน้าทั้งใบแดงก่ำราวกับจะระเบิด\n\nประสาทการได้ยินระดับเหนือมนุษย์ในระยะนี้สามารถจับเสียงหัวใจเต้นของอีกฝ่ายได้ อีวานขมวดคิ้วพลางสังเกตสีหน้าและจังหวะหัวใจของอิซาเบลล์\n\n“เป็นโรคหัวใจเต้นผิดจังหวะหรือเปล่า? โรคหลอดเลือดหัวใจถ้าปล่อยทิ้งไว้อาจกลายเป็นเรื่องใหญ่ได้นะ ไปให้ท่านนักบุญหญิงตรวจดูสักหน่อยเถอะ”\n\n“คะ? อะไรนะคะ? นี่... นี่มันอะไรกัน...”\n\nจู่ๆ อิซาเบลล์ก็ปั้นหน้าเย็นชาแล้วชักมือกลับ แต่ถึงอย่างนั้น เธอก็ยังลูบนิ้วหัวแม่มือที่แปะพลาสเตอร์ไว้ไม่หยุด ก่อนจะเริ่มยิ้มกรุ้มกริ่มอยู่คนเดียว\n\nนี่เธอ... เพิ่งเคยเห็นพลาสเตอร์ปิดแผลเป็นครั้งแรกหรือไง?\n\nอีวานทอดถอนใจ ดูเหมือนราชสำนักทิลเลสจะมีแนวโน้มเลี้ยงดูเด็กแบบตามใจจนเสียคนเกินไปแล้ว\n\nก็แหงล่ะ สำหรับคนที่มีนักบวชประจำตัว คงไม่มีโอกาสได้ใช้พลาสเตอร์ปิดแผลมารักษาแผลถลอกเล็กๆ หรอกมั้ง เวทรักษาของนักบวชแค่ครั้งเดียวก็สมานแผลที่ลึกกว่านั้นได้ในพริบตาแล้ว\n\n“อ้อ จริงสิคะ คุณลุง หนูมีเรื่องจะบอกค่ะ”\n\n“หืม?”\n\nอิซาเบลล์เหลือบมองไปยังจุดหนึ่งที่อยู่ห่างออกไปด้านหลังอีวานอย่างมีเลศนัย ดวงตาทอประกายเจ้าเล่ห์แฝงความอาฆาตจางๆ เธอปรายตาไปทางนั้นหนึ่งครั้งก่อนจะหันกลับมาหาอีวาน\n\n“หนูชอบหนวดเคราของคุณลุงค่ะ”\n\n“...?”\n\nได้ยินไหม เอซี่?\n\nนี่แหละคือ “การเมือง” ของทิลเลส ไม่เหมือนพวกคนเถื่อนอย่างเธอหรอก\n\nเวลาต้องช่วงชิงหัวใจใครสักคน การพูดในสิ่งที่อีกฝ่ายอยากฟังถือเป็น “สามัญสำนึก”\n\nแต่ในขณะเดียวกัน การเลือกจุดยืนที่แตกต่างจากคู่แข่งก็คือ “ความได้เปรียบ”\n\nเธอก็ยืนทำหน้าเหรอหราดูอยู่ตรงนั้นต่อไปเถอะ\n\nอิซาเบลล์หัวเราะคิกคักพลางก้าวเข้าหาอีวานอีกหนึ่งก้าว\n\n“ฉันก็คิดแบบนั้นเหมือนกัน”\n\n“คะ...?”\n\n“มีเรื่องจะพูดแค่นี้ใช่ไหม?”\n\n“คะ? อ๊ะ เปล่าค่ะ เดี๋ยวก่อนสิคะ เอ่อ อืม... ทานมื้อเที่ยงหรือยังคะ? พอดีหนูรู้จักร้านที่อร่อยมากๆ อยู่ร้านหนึ่ง...”\n\n“กินแล้ว”\n\nอีวานเป็นคนรักประสิทธิภาพ ดังนั้นเขาจึงจัดการอาหารแทบทุกมื้อด้วยแท่งโภชนาการ\n\nแท่งโภชนาการคือผลงานชิ้นเอกตลอดชีวิตของอีวาน โลกแฟนตาซียุคก่อนสมัยใหม่อันล้าหลังนี้ยังไม่มีศาสตร์ที่เรียกว่า “โภชนศาสตร์”\n\nเพราะไม่มีแนวคิดเรื่องสารอาหารที่จำเป็น ผู้คนจึงไปหานักบวชเมื่อเกิดความผิดปกติทางร่างกายจากการขาดสมดุลสารอาหาร และน่าประหลาดใจที่ “การรักษา” ของนักบวชมักก่อปาฏิหาริย์ทำให้อาการขาดสมดุลเหล่านั้นทุเลาลงชั่วคราวได้\n\nทว่าสำหรับอีวานที่เกิดมาในครอบครัวชาวนายากจน ความฟุ่มเฟือยแบบนั้นเป็นไปไม่ได้ ดังนั้นเขาจึงทุ่มเทคิดค้น “แท่งโภชนาการ” นี้ขึ้นมาอย่างเอาเป็นเอาตาย\n\nมันมีบทบาทสำคัญอย่างยิ่งในการช่วยรักษาระดับสมรรถภาพการรบของเขาให้คงที่ แม้แต่ในสมรภูมิอดีตที่เสบียงส่งมาไม่สม่ำเสมอ\n\n‘ไม่มีคนในปาร์ตี้ผู้กล้าคนไหนยอมกินเจ้าสิ่งนี้กับฉันสักคน...’\n\nจะว่าไป พวกชาวบ้านยุคก่อนสมัยใหม่อันล้าหลังพวกนี้ก็นะ\n\nเจ้าพวกนั้นดูถูกแท่งโภชนาการของเขาว่า “ห่วยยิ่งกว่าอาหารหมู” ปฏิเสธอาหารแห่งอนาคตอันยอดเยี่ยมที่ทำจากคาร์โบไฮเดรตจากธัญพืช อัดแน่นไปด้วยผลไม้กึ่งแห้ง (ส่วนใหญ่เป็นราสป์เบอร์รี) แล้วอัดแท่งด้วยมันหมู! ทั้งที่มันมีสมดุลสารอาหารสมบูรณ์แบบและต้นทุนการผลิตต่ำแท้ๆ\n\nทั้งที่มันเป็นเทคโนโลยีล้ำสมัยที่ก้าวข้ามอารยธรรม และได้รับการยกย่องแม้กระทั่งจากองค์อดีตกษัตริย์... ทุกครั้งที่นึกถึงเรื่องนี้ เขาก็มักระลึกได้เสมอว่าอดีตกษัตริย์ทรงพระปรีชาสามารถเพียงใด\n\n“เอ่อ... อืม... ทานข้าวแล้วเหรอคะ? นี่เพิ่งจะสิบโมงเช้าเองนะคะ? มื้อเที่ยงแล้วเหรอคะ?”\n\n“อืม”\n\nเวลาออกปฏิบัติภารกิจ การได้กินข้าวตามมื้อเป็นเวลาถือเป็นความฟุ่มเฟือย ดังนั้นอีวานจึงมักหักแบ่งเสบียงสนามและแท่งโภชนาการออกกินเติมสารอาหารหลายๆ รอบแทน\n\nนั่นเป็นนิสัยที่ฝังรากลึกมานานหลายปี จนตอนนี้แทบกลายเป็นกิจวัตรประจำวันไปแล้ว\n\n“ถ้าอย่างนั้น มื้อเย็นล่ะคะ? ปกติคุณลุงทานมื้อเย็นกี่โมงเหรอคะ...?”\n\n“คืนนี้ฉันไม่ว่าง”\n\nเขาต้องรีบหาตัวจอมเวทให้ได้โดยด่วน และออกสำรวจทางเข้าโบราณสถานใต้ดิน\n\n“งั้นพรุ่งนี้... มื้อเที่ยงพรุ่งนี้ล่ะคะ...”\n\n“น่าจะไม่ว่างเหมือนกัน”\n\nถ้าคาดว่าคืนนี้จะเจอทางเข้าแล้วลงพื้นที่ทันที เขาก็คงยุ่งไปอย่างน้อยหนึ่งถึงสองวัน\n\n“แล้ววันหยุดสุดสัปดาห์ล่ะคะ วันหยุดสุดสัปดาห์ล่ะ?!”\n\n“ไม่ว่าง”\n\nวันหยุดสุดสัปดาห์ เขาต้องไปสะสางงานที่สถานเลี้ยงเด็กกำพร้าซึ่งคั่งค้างไว้ระหว่างที่ต้องคอยคุ้มกันเด็กๆ ในปาร์ตี้ผู้กล้าแบบเต็มเวลาในวันธรรมดา\n\nสถานเลี้ยงเด็กกำพร้าไม่ใช่ธุรกิจอัตโนมัติที่ปล่อยทิ้งไว้แล้วจะบริหารตัวเองได้ เขาต้องจัดหาวัตถุดิบอาหารสำหรับเด็กๆ ไปตลอดทั้งสัปดาห์ ซ่อมแซมเสื้อผ้าที่ขาดเสียหายระหว่างสัปดาห์ ตรวจสอบความคืบหน้าทางการศึกษาของเด็กๆ และคอยรับฟังเรื่องทุกข์ร้อนของพวกแก\n\nนั่นแทบจะเป็นงานอดิเรกเพียงอย่างเดียวของอีวาน มันเป็นช่วงเวลาที่ช่วยเยียวยาจิตใจ นั่นคือเหตุผลที่เขาเปิดสถานเลี้ยงเด็กกำพร้าขึ้นมา\n\nไม่ใช่เพราะเขาห่วงใยและดูแลเด็กกำพร้าสงครามจากใจจริงหรอก มันเป็นเพียงสิ่งที่เขาทำเพื่อความพึงพอใจส่วนตัวเท่านั้น\n\nเพราะแบบนั้นมันถึงได้จอมปลอม อีวานรู้ดีว่าตัวเองเป็นคนหน้าซื่อใจคด มันเป็นแค่การปลอบประโลมตัวเองเพื่อลดทอนน้ำหนักของเลือดที่เปื้อนอยู่บนมือทั้งสองข้างเท่านั้น\n\n“ฮึก... ฮือ...”\n\nจู่ๆ อิซาเบลล์ก็ปล่อยโฮออกมาแล้ววิ่งหนีไปทางไหนสักแห่ง\n\nอืม\n\nวัยรุ่นของต่างโลกนี่เข้าใจยากชะมัด\n\nอีวานส่ายหน้าช้าๆ แล้วก้าวเดินต่อไป\n\nจะไปหาจอมเวทได้ที่ไหนกันนะ...\n\n***\n\n**💬 ความคิดเห็นนักอ่าน:**\n- **@ทนายความเอซิดิส** (2 วันที่แล้ว • 👍 173): เอซิดิสมันสุดจริงๆ เขียนจดหมายขออนุญาตพ่อแต่งงานกับคุณลุงเองเสร็จสรรพ แล้วหันไปจ้องอิซาเบลล์แบบพร้อมบวกเต็มที่ ศึกชิงคุณลุงดุเดือดมาก 555\n- **@แท่งโภชนาการพิฆาต** (2 วันที่แล้ว • 👍 231): อีวาน: แปะพลาสเตอร์ที่นิ้วโป้งให้ด้วยสายตาอบอุ่น (คะแนนโรแมนติก +100) ... อิซาเบลล์ชวนกินข้าวเช้า-เที่ยง-เย็น-วันหยุด อีวานหยิบแท่งโภชนาการมากัดโชว์แล้วปฏิเสธครบทุกมื้อ (คะแนนติดลบล้านคะแนน) 55555\n- ↳ **@ชมรมสงสารอิซาเบลล์** (2 วันที่แล้ว • 👍 84): แถมยังโดนเข้าใจว่าปลอบใจตัวเองเรื่องเลือดเปื้อนมือจนน้องปล่อยโฮวิ่งหนีไปเลย ปิดท้ายด้วยวลีเด็ด \"วัยรุ่นของต่างโลกนี่เข้าใจยากชะมัด\" ลุงเอ๊ยยย!\n- ↳ **@นายทหารหน้าตาย** (2 วันที่แล้ว • 👍 41): ฝั่งองค์หญิงก็ซุกโซฟา ฝั่งอิซาเบลล์ก็วิ่งร้องไห้ เหลือเอซิดิสคนเดียวที่เดินเกมรุกไม่สนโลกแล้วตอนนี้ 555\n- **@ผู้เฝ้าดูอยู่ห่างๆ** (1 วันที่แล้ว • 👍 59): แม้จะฮาความทึ่ม แต่ช่วงที่อีวานคิดเรื่องตัวเองเป็นคนหน้าซื่อใจคดทำดีกับเด็กกำพร้าเพื่อลดน้ำหนักบาปบนมือ ก็สะท้อนปมในใจลุงได้ลึกดีนะ"
    },

      "title": "บทที่ 62",
      "content": "**อีวาน เปโตรวิช**\n\nแม้อีวานจะไม่เลือกคบหาใครจากอาชีพ เพศ อายุ หรือเผ่าพันธุ์ แต่เขาก็ไม่สนิทกับพวกจอมเวทนัก เรื่องนี้มีเหตุผลรองรับที่สมเหตุสมผลและฟังขึ้นอยู่มากทีเดียว\n\nจอมเวทส่วนใหญ่มักมีความบกพร่องทางนิสัยติดตัวมาตั้งแต่เกิด\n\n“คุณ... คุณพูดเรื่องอะไรออกมาเนี่ยครับ?”\n\n“เรื่องจริงทั้งนั้น”\n\nอีวานอธิบายข้อเท็จจริงอย่างใจเย็นพลางเหลือบมองออสวัลด์ที่กำลังจ้องเขากลับมาด้วยสีหน้าอึดอัด\n\n“โดยพื้นฐานแล้ว พวกจอมเวทมักขังตัวเองอยู่แต่ในห้อง เอาแต่ควบคุมพลังเวทหรือไม่ก็อ่านตำรา”\n\n“ก็... จริงนะครับ?”\n\n“ทีนี้ลองนึกถึงอาชีพอื่นดูสิ”\n\nสำหรับนักรบ การจะแข็งแกร่งขึ้นได้ต้องอาศัยทั้งการต่อสู้จริงและการฝึกซ้อมควบคู่กัน\n\nนักรบที่เอาแต่ฟันหุ่นฟางอยู่ในลานฝึกไม่มีทางเก่งขึ้นได้หรอก โดยธรรมชาติแล้วย่อมต้องมีคู่ต่อสู้\n\nการเสาะหาคู่ซ้อมที่มีฝีมือและร่วมหลั่งเหงื่อเคียงบ่าเคียงไหล่กันย่อมช่วยพัฒนาทักษะการเข้าสังคมโดยอัตโนมัติ นักรบที่ทำแบบนี้ไม่ได้สุดท้ายก็มักลงเอยด้วยการหัวแบะ\n\nส่วนจอมโจรจำเป็นต้องสืบหาฐานที่มั่น แหล่งกบดาน โกดัง หรือห้องนิรภัยของเป้าหมาย เนื่องจากเรื่องพวกนี้ต้องอาศัยข้อมูลวงใน จอมโจรจึงต้องสร้างสายสัมพันธ์กับเป้าหมายหรือไม่ก็คอย “เกลี้ยกล่อม” คนรู้จักของเป้าหมายตามธรรมชาติ\n\nอาชีพโจรจึงเป็นงานที่มีแต่คนเข้าสังคมเก่งเท่านั้นถึงจะทำได้ ความจริงแล้ว แม้เอนริเก้จะเป็นแวมไพร์ เธอก็ยังมีเพื่อนฝูงมากมาย\n\nพวกกวีคงไม่ต้องพูดถึง ศิลปะแห่งดนตรีเป็นศาสตร์ที่คนไม่ชอบเข้าสังคมไม่มีทางริอ่านทำได้ ข้อนี้พิสูจน์ได้จากยอดนักเข้าสังคมอย่างโมซาร์ท และซาลิเอรีที่เกลียดพวกชอบเข้าสังคมเหล่านั้น (ซาลิเอรีเองก็เป็นตัวพ่อสายเข้าสังคมเหมือนกันนั่นแหละ)\n\nและยังมีหลักฐานชี้ขาดอีกข้อหนึ่ง\n\n“เอลฟ์เกือบทั้งหมดเป็นจอมเวท”\n\n“ครับ”\n\n“และเอลฟ์เกือบทั้งหมดก็ป่วยเป็นโรคบกพร่องทางบุคลิกภาพตั้งแต่กำเนิด”\n\n“...ว่าไงนะครับ?”\n\nเมื่อหว่านล้อมออสวัลด์ด้วยตรรกะนิรนัยอันสมบูรณ์แบบได้สำเร็จ (เอลฟ์ทุกคนเป็นคนบ้า เอลฟ์ทุกคนเป็นจอมเวท ดังนั้น จอมเวททุกคนจึงเป็นคนบ้า) อีวานก็มองอีกฝ่ายด้วยสายตาอบอุ่นแล้วพยักหน้า\n\nขอย้ำอีกครั้งว่า อีวานไม่เคยแบ่งแยกผู้คนด้วยเผ่าพันธุ์หรือเพศ เขาเป็นคนยุคใหม่จากศตวรรษที่ 21\n\nดังนั้น นี่จึงไม่ใช่การเหยียดเชื้อชาติ แต่เป็นการกล่าวข้อเท็จจริงอย่างสงบเสงี่ยมเท่านั้น\n\nน่าเศร้าที่เผ่าพันธุ์อมนุษย์ทั้งหมดในโลกอันป่าเถื่อนใบนี้ต่างมีปัญหาบกพร่องทางบุคลิกภาพติดตัวมาแต่กำเนิดกันถ้วนหน้า\n\nทั้งพวกคนแคระที่คิดค้นลัทธิค่าเฉลี่ยนิยมขึ้นมาและเกลียดชังทุกคนที่ตัวสูงกว่าตัวเอง พวกปีศาจที่มองมนุษย์เป็นเพียงวัตถุดิบอาหารที่ค่อนข้างสร้างสรรค์ ...และพวกเอลฟ์\n\nเวลาเกิดเรื่องประหลาดอะไรขึ้นในหน้าประวัติศาสตร์ แค่ชี้หน้าว่าพวกเอลฟ์เป็นต้นเหตุ ส่วนใหญ่มักจะเดาถูกเสมอ\n\nจบเพียงเท่านี้แหละ\n\nอธิบายมากไปกว่านี้มันจะไม่เท่เอา อีวานจ้องมองออสวัลด์\n\nออสวัลด์ที่จ้องตอบอีวานด้วยดวงตาว่างเปล่ามาตลอดเผยรอยยิ้มเศร้าสร้อย\n\nดูเหมือนเจ้าตัวจะเพิ่งตระหนักได้เหมือนกันว่าตัวเองเป็นทั้งจอมเวทและเอลฟ์\n\n“ทำไมคุณถึงมาพูดเรื่องนี้กับผมล่ะครับ...?”\n\nออสวัลด์กวาดตามองรอบตัวอย่างกระอักกระอ่วน\n\nมีนักศึกษาหลายคนเดินผ่านไปมาและเหลือบมองมาทางพวกเขา ที่นี่คือคณะเวทมนตร์\n\nนักศึกษาประมาณครึ่งหนึ่งของคณะเวทมนตร์เป็นเอลฟ์ พูดอีกอย่างก็คือ ที่นี่เป็นจุดที่มีความหนาแน่นของเอลฟ์สายจอมเวทสูงที่สุดในพริตเชนคายา\n\nแต่ดันมาพูดเรื่องแบบนี้กลางสถานที่แบบนี้เนี่ยนะ\n\nชีวิตในรั้วมหาวิทยาลัยของฉันพังป่นปี้หมดแล้ว ออสวัลด์ยิ้มเจื่อนๆ\n\nถ้าเป็นที่โลกเดิม เขาอาจจะหนีไปสมัครเข้ากรมทหารเพื่อล้างไพ่เริ่มต้นใหม่ไปแล้ว แต่ในโลกอันน่าเศร้าใบนี้ การเกณฑ์ทหารจะเข้าเมื่อไรก็ได้ตามใจชอบ ทว่าการปลดประจำการกลับไม่ได้ขึ้นอยู่กับความสมัครใจ... ออสวัลด์จึงไม่มีทางเลือกอื่น\n\n“ฉันต้องการจอมเวทสักคน”\n\n“อ้อ ที่แท้เหตุผลที่คุณมาเปิดประเด็นเรื่องความบกพร่องทางนิสัยของจอมเวทและเอลฟ์อยู่หน้าห้องบรรยายนักศึกษาปีหนึ่งของคณะเวทมนตร์ ก็เพราะต้องการจ้างจอมเวทนั่นเองสินะครับ!”\n\nอีวานมองออสวัลด์ด้วยสายตาชื่นชมขึ้นมาใหม่\n\nสรุปความได้ยอดเยี่ยม รู้อย่างนี้ฉันไม่จำเป็นต้องอ้อมค้อมอธิบายตั้งแต่แรกเลยด้วยซ้ำ\n\n“...โล่งอกจริงๆ ที่คุณอีวานไม่ได้มาเกิดเป็นกษัตริย์หรือขุนนางชั้นสูง”\n\nประเทศไหนก็ตามที่ชายคนนี้ปกครอง คงได้กลายเป็นจักรวรรดิแห่งความชั่วร้ายที่ติดอาวุธด้วยประสิทธิภาพและเหตุผลนิยมแน่ๆ ไม่แน่อาจเป็นลัคกี้นาซีหรือไม่ก็ลัคกี้โซเวียตเลยก็ได้\n\nออสวัลด์ถอนหายใจเฮือกใหญ่แล้วเอ่ยขึ้น\n\n“อีกอย่าง ถ้าต้องการจอมเวท ก็น่าจะบอกผมเป็นการส่วนตัวก็ได้นี่ครับ ผมเองก็ใช้เวทมนตร์เป็นเหมือนกันนะ”\n\n“การตีความเวทมนตร์ C, การวิเคราะห์อาคมคลาสสิก C-”\n\n“อ๊าก ไม่จริงน่า! คุณรู้เกรดผมได้ยังไงครับเนี่ย...?”\n\n“นายมันไร้ประโยชน์”\n\n“โห...”\n\nเวทมนตร์จิตใจคือเวทแห่งสงคราม แม้จะมีประโยชน์มหาศาลในงานจารกรรม แต่การใช้งานส่วนใหญ่ถูกออกแบบมาเพื่อการทำสงครามโดยเฉพาะ\n\nเวทมนตร์สายทำลายล้างให้ผลลัพธ์น้อยนิดเมื่อเทียบกับรูปลักษณ์อันอลังการ การปาลูกไฟออกไปกลางแนวหน้าอย่างมากก็จัดการคนได้แค่สามสี่คน\n\nอำนาจการยิงระดับนั้นใช้ปืนแทนก็สิ้นเรื่อง หากกำลังพลชั้นสูงที่ปลุกปั้นขึ้นมาด้วยศาสตร์ควบคุมมานามีประสิทธิภาพแค่นั้น ก็ถือเป็นความสูญเปล่าทางทรัพยากรชัดๆ\n\nในทางกลับกัน เวทมนตร์จิตใจสามารถปลุกขวัญกำลังใจของกองพันฝ่ายเดียวกันได้ทั้งหน่วยด้วยปริมาณมานาที่เท่ากัน มันช่วยขจัดความหวาดกลัว เพิ่มพูนความกล้าหาญ และปลูกฝังความเกลียดชังอันน่าสะพรึงกลัวต่อศัตรู\n\nโดยทั่วไปแล้ว จุดเปลี่ยนของสงครามขึ้นอยู่กับขวัญกำลังใจของเหล่าทหาร แนวหน้าที่มีจอมเวทสายจิตใจคอยหนุนหลังสามารถยืนหยัดทำการรบได้ยาวนานกว่าแนวหน้าที่ไม่มีอย่างเทียบไม่ติด\n\nในยุคสมัยนั้น เป้าหมายของแนวหน้าคือการ “ต้านทาน” ซึ่งนั่นนับเป็นผลลัพธ์ที่ทรงพลังอย่างยิ่ง เพราะเป้าหมายเดียวสู่ชัยชนะในสงครามคือการตรึงกำลังไว้จนกว่าปาร์ตี้ผู้กล้าจะบุกไปเด็ดหัวผู้นำทัพศัตรูได้สำเร็จ\n\nช่างเถอะ\n\nเวทมนตร์จิตใจคือเวทสงคราม และสิ่งที่อีวานต้องการคือจอมเวทสายดั้งเดิมที่เชี่ยวชาญด้าน “การตีความเวทมนตร์โบราณ” และ “เวทป้องกัน”\n\n“สรุปคือ คุณกำลังตามหาจอมเวทที่ไม่ใช่เอลฟ์ เรียนเวทป้องกันมา เชี่ยวชาญการตีความเวทมนตร์โบราณ และรักษาความลับได้ด้วยใช่ไหมครับ?”\n\n“ใช่”\n\n“ผมว่าคุณไปหาตัวมังกรหรือยูนิคอร์นยังจะง่ายกว่าอีกนะครับ”\n\n“มันหายากขนาดนั้นเลยเหรอ?”\n\n“ไม่ใช่แค่หายากครับ แต่มันเป็นไปไม่ได้เลยต่างหาก! ถ้าพอจะยอมหยวนๆ เรื่องเอลฟ์กับเรื่องรักษาความลับได้บ้าง ก็อาจจะพอมีทาง...”\n\nออสวัลด์กวาดตามองรอบข้างด้วยสีหน้าซับซ้อน ก่อนจะลดเสียงลงกระซิบ\n\n“คุณบอกว่าสนิทกับพวกปาร์ตี้ผู้กล้าใช่ไหมครับ?”\n\n“อืม”\n\n“ถ้าอย่างนั้นก็มีอยู่คนหนึ่งครับ จอมเวทที่กวาดคะแนนอันดับหนึ่งทุกวิชาทฤษฎี รวมถึงการตีความเวทมนตร์โบราณ แถมยังได้เกรด A+ ในวิชาเวทมนตร์นอกสาขาอย่างเวทป้องกันด้วย เธอเป็นเอลฟ์ก็จริง แต่ในเมื่อเป็นลูกสาวเพื่อนของคุณ เรื่องการเก็บความลับก็น่าจะพอคุยกันได้”\n\nในบรรดาลูกหลานของปาร์ตี้ผู้กล้า มีจอมเวทอยู่เพียงคนเดียวเท่านั้น\n\n“...เอลเฟียรา”\n\n“ใช่ครับ เอลเฟียรา กริเคนคอส เธอเป็นคนใจดีและอ่อนน้อมถ่อมตนด้วยนะครับ”\n\nอัจฉริยะผู้สืบทอดพรสวรรค์ทางเวทมนตร์มาจากบิดา ผู้ทำคะแนนสอบเข้ามหาวิทยาลัยเซนต์ยานสก์ได้สูงสุดเป็นประวัติการณ์...\n\n“อืม...”\n\nเขาก็รู้จักเธอเหมือนกัน\n\nสิบสองปีก่อน ไม่นานนักก่อนที่ปาร์ตี้ผู้กล้าจะออกเดินทาง\n\nเขาเคยเจอเธออยู่สี่วันเต็มๆ\n\nเด็กหญิงตัวน้อยคนนั้นช่างสมกับเป็นเอลฟ์เสียจริง\n\n***\n\n“แหวะ กลิ่นอะไรกันเนี่ย? เจ้ามนุษย์ นี่แกลืมวิธีอาบน้ำไปแล้วหรือไง? เจ้านายของแกอยู่ที่ไหน? ข้าจะไปสั่งสอนหมอนั่นด้วยตัวเองว่าวิธีอาบน้ำให้สัตว์เลี้ยงต้องทำยังไง”\n\n“...???”\n\nอีวานหันขวับไปมองเมื่อได้ยินเสียงเด็กน้อยตัวจิ๋วราวกับตุ๊กตากำลังพูดจาเจื้อยแจ้ว\n\nเขาเห็นเด็กตัวเล็กที่สูงแทบไม่ถึงระดับอกของตน ใบหูเรียวยาวแหลมเปี๊ยบโผล่พ้นกลุ่มผมสีทองส่องประกายเจิดจ้า\n\nอ้อ เอลฟ์สินะ เคยได้ยินว่ามีเอลฟ์อยู่ในปาร์ตี้ผู้กล้าด้วยคนหนึ่ง จริงด้วยแฮะ\n\nแต่ว่า... ได้ยินมาว่าเบโอลกริน กริเคนคอส เป็นเอลฟ์อายุกว่า 400 ปีไม่ใช่เหรอ จะดูเด็กขนาดนี้ได้ด้วยเหรอเนี่ย?\n\nเผ่าพันธุ์อายุยืนนี่สุดยอดจริงๆ\n\nอีวานรีบเรียบเรียงความคิดอย่างรวดเร็วแล้วพยักหน้า\n\n“ท่านคือท่านกริเคนคอสใช่ไหมครับ?”\n\n“หือ? ใช่แล้ว ถูกต้อง! ข้าคือกริเคนคอส! รู้จักข้าด้วย ช่างเป็นมนุษย์ที่ฉลาดเฉลียวเกินรูปร่างหน้าตาเสียจริง!”\n\nเด็กน้อยประกาศก้องพลางเชิดอกอย่างภาคภูมิ พลังเวทที่แผ่ออกมาจากตัวเธอไม่ได้โดดเด่นอะไร หรือนี่คือสภาพของยอดฝีมือผู้สำเร็จวิชาคงความเยาว์วัย?\n\nอีวานรู้สึกทึ่ง\n\nคนที่อายุมากที่สุดเท่าที่เขารู้จักคือเอนริเก้ แต่แม้แต่เธอเองก็ยังไม่สามารถคงรูปลักษณ์ที่อ่อนเยาว์ขนาดนี้เอาไว้ได้เลย\n\nแม้ในโลกใบนี้จะไม่มีแนวคิดเรื่องแบบนั้นอยู่ก็ตาม แต่อีวานที่เคยทุ่มเทเขียนจดหมายร้องเรียนนิยายกำลังภายในยาวห้าพันเจ็ดร้อยตัวอักษรอย่างเอาเป็นเอาตายไม่แพ้กัน ย่อมรู้จักคำอย่าง “วิชาคงความเยาว์วัย” “การผลัดกระดูกเปลี่ยนร่าง” และ “การคืนสู่วัยเยาว์” เป็นอย่างดี\n\nเมื่อได้มาเผชิญหน้ากับตัวละครที่หลุดออกมาจากนิยายแบบนั้นตัวเป็นๆ อีวานก็อดรู้สึกอัศจรรย์ใจไม่ได้\n\n“ว่าแต่เจ้ามนุษย์ เจ้านายแกอยู่ไหน? ข้าหิวจะแย่แล้ว ดูเหมือนพวกมนุษย์จะไม่รู้จักวิธีต้อนรับแขกผู้มีเกียรติเอาซะเลย เห็นทีข้าต้องไปตามหาเจ้านายเอลฟ์ของแกซะหน่อย”\n\n“อะไรนะ... ที่โรงอาหารของค่ายทหารไม่ได้จัดเตรียมไว้ให้เหรอครับ? เดี๋ยวผมไปคุยกับนายทหารพลาธิการให้...”\n\n“เปล่า ไม่ใช่อาหารสัตว์พรรค์นั้น ข้าต้องการ ‘อาหาร’ ไม่ใช่รำหมู”\n\n“...อ้อ”\n\nภาพลักษณ์ของพวกเอลฟ์ในหัวของอีวานเริ่มบิดเบี้ยวไปเล็กน้อย\n\n“ท่านกริเคนคอส ขออภัยด้วยครับ แต่ที่นี่คือแนวหน้า ส่วนแบ่งอาหารที่จัดสรรให้ปาร์ตี้ของพวกท่านล้วนเป็นของหรูหราที่ทหารทั่วไปไม่มีวันแม้แต่จะฝันถึงเลยนะครับ”\n\n“ภาษามนุษย์นี่พิลึกดีแท้ คำว่า ‘ของหรูหรา’ มันต้องแปลว่า ‘ปรุงโดยเอลฟ์’ สิ แล้วรางข้าวหมูอันไหนที่ข้าได้รับวันนี้ที่มีอาหารฝีมือเอลฟ์อยู่ด้วยล่ะ?”\n\nภาพของเอลฟ์ในใจเขาตอนนี้ไม่ใช่ภูตพรายอายุยืนผู้ลึกลับอีกต่อไปแล้ว\n\nเขานึกในใจว่า ถ้าอีกฝ่ายเป็นมหาจอมเวทที่อยู่มาแล้ว 400 ปี นิสัยจะเพี้ยนไปบ้างก็พอเข้าใจได้ และพยายามฝืนควบคุมสีหน้าของตัวเองไว้อย่างสุดความสามารถ\n\nคงไม่ใช่เอลฟ์ทุกคนที่สติฟั่นเฟือนแบบนี้หรอกมั้ง\n\nความคิดอันไร้เดียงสาของอีวานพังทลายลงทันทีด้วยน้ำมือของชายคนถัดมาที่ปรากฏตัวขึ้น\n\n“เอลเฟียรา นั่นพูดจาอะไรแบบนั้นน่ะลูก?”\n\n“ท่านพ่อ!!”\n\nเมื่อชายหนุ่มร่างสูงรูปงามที่เดินมาจากทางโน้นคลี่ยิ้มและอ้าแขนออก เด็กหญิงตัวน้อยที่เมื่อครู่ยังพูดจาจีบปากจีบคออยู่ก็วิ่งปรู๊ดเข้าไปซบในอ้อมกอดของเขาทันที\n\nชายหนุ่มยิ้มอย่างอบอุ่นพลางลูบศีรษะเด็กน้อยเบาๆ\n\n“อาหารสัตว์อะไรกัน? นั่นเป็นงานเลี้ยงเลิศหรูที่สุดเท่าที่มนุษย์จะหามาให้ได้แล้วนะ พวกมนุษย์น่าสงสารเรียกของแบบนั้นว่า ‘งานเลี้ยง’ และกินกันอย่างเอร็ดอร่อย เพราะฉะนั้นการไปเรียกว่าอาหารสัตว์ถือเป็นการเสียมารยาทอย่างร้ายแรงนะลูก”\n\n“ท่านพ่อ แต่มันกินไม่ได้จริงๆ นี่คะ!”\n\n“เอลเฟียรา พวกมนุษย์จะเสียใจมากนะเวลาเครื่องบรรณาการของพวกมันถูกปฏิเสธ พ่อบอกลูกตั้งกี่ครั้งแล้วว่าการเอาใจใส่เผ่าพันธุ์ชั้นต่ำมันสำคัญแค่ไหน?”\n\n“ค่ะ ท่านพ่อ...”\n\nไม่ต้องสงสัยเลยว่านี่คือภาพการอบรมเลี้ยงดูบุตรที่น่าตื่นตะลึงที่สุดเท่าที่อีวานเคยพบเห็นมา\n\nอีวานทำได้เพียงอ้าปากค้างจ้องมองเอลฟ์สองพ่อลูกคู่นั้น\n\n“อ้อ มนุษย์ ลูกสาวข้าเสียมารยาทไปหน่อย ข้าต้องขออภัยด้วยนะ”\n\nเขายื่นมือออกมาพร้อมรอยยิ้มเป็นมิตร นี่เขากำลังขอจับมือหรือเปล่า? แต่ท่าทางของมือนั้นดูแปลกไปหน่อยแฮะ เขายื่นมือโดยคว่ำฝ่ามือลง แทบจะเหมือนกับการ...\n\n“ข้าคือเบโอลกริน กริเคนคอส รักษาการประธานสภาองคมนตรีแห่งหมู่เกาะคาลีออน ตามธรรมเนียมมนุษย์ เวลาพบปะขุนนางต้องจุมพิตหลังมือใช่ไหมล่ะ? โฮะๆ ประเพณีล้าหลังแต่น่ารักดีนี่ ข้าอนุญาตด้วยความเต็มใจเลย”\n\nพวกนี้สมควรสูญพันธุ์ไปซะเพื่อความสงบสุขของมนุษยชาติ... ไม่สิ เพื่อสันติภาพและอนาคตของโลกใบนี้\n\nอีวานจ้องเบโอลกรินด้วยสายตาเย็นเยียบ พลางครุ่นคิดอย่างจริงจังว่าจะยื่นข้อเสนอนี้ทูลเกล้าฯ ถวายมหาราชาดีไหม\n\nนั่นคือเรื่องเมื่อสิบสองปีก่อน\n\nมันเกิดขึ้นในปีที่ 18 แห่งการข้ามมิติของอีวาน หรือปีที่ 8 ในการรับราชการทหาร ตอนที่เขาเพิ่งถูกย้ายมาสังกัดหน่วยองครักษ์หลวงหมาดๆ\n\nความประทับใจแรกต่อเผ่าเอลฟ์ช่างเลวร้ายถึงขีดสุด และเมื่อพิจารณาจากความจริงที่ว่ามันไม่เคยดีขึ้นเลยนับแต่นั้น เอลฟ์ก็คงเป็นเผ่าพันธุ์แบบนี้อยู่แล้วนั่นแหละ\n\n***\n\nอีวานตื่นจากภวังค์ความคิดแล้วมองไปยังเอลฟ์ที่ยืนอยู่ตรงหน้า\n\nเอลฟ์สาวที่ยกมือทาบอกอย่างสงบเสงี่ยมและค้อมศีรษะลงอย่างนุ่มนวล ช่างงดงามราวกับภาพวาดไม่มีผิด\n\nหลังจากฟังคำอธิบายของออสวัลด์จบ เธอก็ยิ้มอย่างขวยเขินแล้วเอ่ยขึ้น\n\n“ยินดีที่ได้รู้จักค่ะ ดิฉันเอลเฟียรา กริเคนคอสค่ะ”\n\n“...?”\n\nอีวานถึงกับงุนงง\n\n***\n\n**💬 ความคิดเห็นนักอ่าน:**\n- **@ศิษย์เอกตรรกศาสตร์** (2 วันที่แล้ว • 👍 192): ขำตรรกะนิรนัยของลุงที่เอาไปกล่อมออสวัลด์มาก: \"เอลฟ์ทุกคนบ้า -> เอลฟ์ทุกคนเป็นจอมเวท -> ดังนั้นจอมเวททุกคนบ้า!\" ออสวัลด์ถึงกับอึ้งไปเลย 555\n- **@บันทึกความแค้น12ปี** (2 วันที่แล้ว • 👍 164): ย้อนอดีตไป 12 ปีก่อนตอนเจอสองพ่อลูกตระกูลกริเคนคอสคือบันเทิงมาก เอลเฟียราวัยเด็กปากแจ๋วเรียกอาหารมนุษย์ว่ารำหมู ส่วนพ่อเบโอลกรินก็สปอยล์ลูกสุดๆ จนลุงเกือบเสนอพระราชาเปิดสงครามล้างบางเผ่าเอลฟ์เลย 5555\n- ↳ **@แฟนคลับเบโอลกริน** (2 วันที่แล้ว • 👍 57): สงสารคนในปาร์ตี้ผู้กล้าสมัยก่อนเลย ต้องปวดหัวกับสมาชิกแบบนี้ทุกวันแน่ๆ 555\n- **@สายจับผิดมารยาท** (1 วันที่แล้ว • 👍 128): เดี๋ยวนะ พอตัดกลับมาปัจจุบัน ทำไมเอลเฟียราถึงดูสงบเสงี่ยม นอบน้อม ยิ้มขวยเขินได้ขนาดนั้นล่ะ?! ต้องมีอะไรเปลี่ยนเธอไปแน่ๆ ถึงขนาดอีวานยังสตั๊นเลย!"
