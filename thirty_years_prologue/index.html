      "title": "บทที่ 68",
      "content": "[ถูกต้องแล้ว]\n\nจริงอย่างที่คิด\n\nขณะที่สุ้มเสียงนั้นไล้ผ่านห้วงความคิดราวกับถูกเลีย เอลเฟียราก็ได้เผชิญหน้ากับความจริงในที่สุด\n\nสิ่งที่เธอเคยเชื่อว่าเป็นขุมทรัพย์คือซากกระดูกมนุษย์ที่แห้งกรัง และสิ่งที่เธอเคยคิดว่าเป็นยาอายุวัฒนะล้ำค่า แท้จริงแล้วคือดาบที่ปักทะลุกลางอกของรูปปั้นหิน\n\n“อุ๊บ... อึก...!”\n\nเธอก้าวถอยหลังพลางยกมือปิดปาก แรงกระแทกทางอารมณ์จากการได้เห็นรูปปั้นบิดม้วนอยู่ภายในช่องท้อง\n\nหัวใจเต้นระรัว มือและเท้าสั่นเทา และเธอพบว่าตนเองกำลังก้าวเดินไปข้างหน้าโดยไม่รู้ตัว ฉันอยากคว้ามันไว้ ฉันอยากจับมัน ฉันอยากดึงมันออกมาครอบครอง\n\nความเย้ายวนใจที่ไม่เคยสัมผัสมาก่อน ความปรารถนาอันน่าสะพรึงกลัวที่ซุกซ่อนอยู่เบื้องหลังม่านแห่งการลวงตา กำลังบีบรัดหน้าอกของเธอจนแทบแหลก\n\nทว่าเธอไม่ควรทำ\n\nเธอคือเอลฟ์ เผ่าพันธุ์อันสูงส่งที่สุดใต้ผืนฟ้า การยอมจำนนต่อความเย้ายวนอันชั่วร้ายที่ฝังตัวอยู่ในซากศพมนุษย์ช่าง... ช่างน่าอัปยศอดสูเกินไปแล้ว\n\nเธอคือจอมเวท ในบรรดาอาชีพทั้งหมดในโลก อาชีพของเธอเรียกร้องความมีเหตุผลมากที่สุด การถูกอารมณ์ครอบงำและกระทำการอย่างหุนหันพลันแล่นคือความเสื่อมเสียเกียรติของจอมเวท\n\nดังนั้น ดังนั้น...\n\n[ข้ามีนามมากมาย แต่เจ้าอาจเรียกข้าว่า ‘ความรอด’ ข้ารู้ถึงความปรารถนาที่เจ้าเก็บงำไว้ จงปรารถนาอย่างเที่ยงธรรม แล้วมันจักสัมฤทธิ์ผล]\n\nไม่ เจ้าไม่ใช่เทพเจ้าของฉัน\n\nเอลเฟียราเผลอก้าวเท้าไปข้างหน้าโดยไม่รู้ตัว ก่อนจะสะดุ้งหยุดชะงักเมื่อรู้สึกถึงกระดูกที่แตกป่นอยู่ใต้ฝ่าเท้า\n\n[จงดึงมันออกมา แล้วเจ้าจักได้รับ ข้าขอบอกแก่เจ้าว่าเจ้าจักได้รับสิ่งที่เจ้าเฝ้าภาวนามาตลอดชีวิต จงยกมือขึ้นแล้วดึงมันออกมาเสีย]\n\nสุ้มเสียงของรูปปั้นแฝงไว้ด้วยพลังเทวานุภาพ เป็นพลังชนิดที่จิตวิญญาณของปุถุชนไม่อาจต้านทานได้\n\nบางทีมันอาจจะหลีกเลี่ยงไม่ได้ บางทีการขัดขืนสิ่งเช่นนี้คงไร้ความหมายในตัวมันเอง\n\nเอลเฟียราไม่อาจแยกแยะได้อีกต่อไปว่านี่คือการยอมจำนนต่อแรงล่อลวง หรือตัวแรงล่อลวงเองที่กำลังกระซิบผ่านน้ำเสียงของเธอเองกันแน่\n\nขณะที่เธอก้าวไปข้างหน้าอีกก้าว เสียงอันเย็นยะเยือกก็แทงทะลุเข้าสู่โสตประสาทของเธอ\n\nใช่แล้ว เข้าสู่หูของเธอโดยตรง\n\n“คำพูดของแกมันโกหก”\n\nเยือกเย็น ดับความเร่าร้อนในหัวของเธอจนสงบลง\n\nทุ้มต่ำและเย็นเฉียบ คำรามก้องดุจสัตว์ร้ายที่มีคมเขี้ยวอันแหลมคม\n\nแตกต่างโดยสิ้นเชิงกับเสียงอันนุ่มนวลหอมหวานของรูปปั้น ต่างจากเสียงที่ก้องสะท้อนอยู่ในหัว เสียงนี้ส่งผ่านเข้ามาถึงหูของเธออย่างชัดเจน\n\nทว่าเพราะเหตุนั้น มันจึงเปี่ยมไปด้วยสัมผัสแห่งความเป็นจริง... น้ำเสียงของ ‘คน’\n\nเสียงของปุถุชนที่ฟาดฟันทะลุผ่านพรมแดนระหว่างเทพนิยายกับความเพ้อฝัน จึงสลักลึกชัดเจนยิ่งกว่า และชวนให้อุ่นใจยิ่งกว่า...\n\n“แกถูกผนึกด้วยน้ำมือของมนุษย์”\n\nด้วยน้ำเสียงแห้งผาก กล่าวอย่างสงบนิ่งว่ามนุษย์ได้เคยพิชิตมันมาแล้วตั้งแต่อดีตกาล\n\n[จงฟังข้า!!]\n\n“ไม่”\n\nแม้ในยามที่พลังศักดิ์สิทธิ์อันมืดมนจนมองเห็นได้ด้วยตาเปล่าจะแผ่ซ่านย้อมพื้นที่โดยรอบให้ดำทมิฬ\n\nและดาบที่ฝังอยู่กลางอกของรูปปั้นสั่นคลอนกุกกักราวกับพยายามจะดีดตัวเองออกมา\n\nมือที่กำด้ามดาบนั้นยังคงหนักแน่น เคลื่อนไหวอย่างเชื่องช้าท่ามกลางพลังศักดิ์สิทธิ์ที่พันธนาการราวกับโซ่ตรวน ทว่าเปี่ยมด้วยความเชื่อมั่นอันแน่วแน่\n\nค่อยๆ แกะนิ้วมือออกทีละนิ้ว ทีละนิ้ว\n\n[หยุดนะ หยุด!! เจ้าฆ่าข้าไม่ได้! ข้าคือพระเจ้าของเจ้า!!]\n\nไม่แยแสต่อเสียงกรีดร้องของรูปปั้น ไม่หวั่นไหวแม้แต่น้อยต่อแรงล่อลวงอันน่าสะพรึงกลัวที่สัมผัสได้เพียงแค่ปรายตามอง\n\nเขาทำแบบนั้นได้อย่างไรกัน? หากเป็นเธอที่ต้องไปยืนอยู่ตรงจุดนั้น เธอคงยอมแพ้ไปนานแล้ว\n\nเผชิญหน้ากับความมุ่งร้ายส่วนใหญ่ตรงๆ ทั้งที่มีเพียงสายธารพลังศักดิ์สิทธิ์สายเดียวไหลผ่านแผ่นหลังอันกว้างใหญ่ของเขามา เธอยังเจ็บปวดทรมานถึงเพียงนี้\n\nในขณะที่เอลเฟียรากำลังตัวสั่นเทา เสียงทุ้มต่ำก็ลอยมาเข้าหู และอาการสั่นสะท้านของเธอก็ค่อยๆ สงบลง\n\n“ฉันเคยเจอพวกที่เชื่อว่าตัวเองเป็นเทพเจ้ามาก่อนแล้ว”\n\nแกร๊ก เปรี๊ยะ เสียงหินแตกหักดังสะท้อนก้องพร้อมกับพลังศักดิ์สิทธิ์ที่สาดกระจายอย่างบ้าคลั่งไปทุกทิศทุกทาง\n\nแม้จะมองไม่เห็นผ่านแผ่นหลังของชายผู้นี้ไป ทว่ามีบางสิ่งที่คนเราสามารถรับรู้ได้โดยไม่ต้องมองเห็น\n\nบัดนี้ ชายผู้นี้กำลังสังหารเทพเจ้าอยู่\n\n“พวกมันตายหมดแล้ว”\n\nน้ำเสียงแห้งผากที่ปราศจากความตื่นเต้น ความเร่าร้อน เกียรติยศสำหรับวีรกรรมที่กำลังกระทำ หรือความภาคภูมิใจในความสำเร็จใดๆ ทั้งสิ้น\n\nเพียงกระซิบอย่างสงบและแห้งแล้งราวกับกำลังเล่าประสบการณ์ในอดีต จากนั้น\n\n– เปรี้ยง!!\n\nด้วยแรงบีบอันหนักแน่น เขาก็บดขยี้ศีรษะของรูปปั้นจนแหลกละเอียด\n\n“อ๊ะ...”\n\nพลังศักดิ์สิทธิ์ระเบิดทะลักออกมาจากภายในผนึก แรงกดดันอันมหาศาลจนราวกับทำให้โลกบิดเบี้ยวถาโถมลงมาบนเนินซากกระดูกแห่งนี้\n\nมันคือเสียงร้องก่อนสิ้นใจของเทพเจ้าโบราณ\n\nเสียงกรีดร้องของอมตชนที่คละเคล้าไปด้วยความทุกข์ทรมานและความเจ็บปวด\n\nเสียงคร่ำครวญของผู้ดูหมิ่นเบื้องสูงที่จะทำให้แก้วหูแตกดับและจิตวิญญาณแปดเปื้อนเพียงแค่ได้ยิน\n\nเอลเฟียราฝืนอ้าปากอย่างยากลำบากแล้วตะโกนออกมาด้วยเสียงที่แหบพร่าแตกซ่าน\n\n“ถอยออกมา!! หนีเร็ว!! เจ้านั่น... เจ้านั่น...!”\n\nเธอควรจะอธิบายอย่างไรดี? เพื่อโน้มน้าวให้ชายคนนั้นยอมถอยกลับมา...\n\nถ้าเขายังอยู่ตรงนั้น ไม่สิ ถ้าเขายังอยู่ในห้องนี้ เขาจะต้องถูกเจ้านั่นสาปเอาแน่\n\nเอลเฟียราฝืนเบิกตาโพลงท่ามกลางสายลมที่หมุนวนเชี่ยวกราก ก่อนจะเลือกถ้อยคำที่เหมาะสมที่สุดออกมาในที่สุด\n\nเพื่อที่แม้แต่สติปัญญาของมนุษย์ก็จะสามารถเข้าใจได้...!\n\n“เจ้านั่นกำลังจะระเบิดแล้ว!!”\n\n“อืม”\n\nสายตาของอีวานตวัดมามองเอลเฟียรา เขาพยักหน้ารับสั้นๆ แล้วอันตรธานหายไปจากสายตาของเธอในชั่วพริบตา\n\n“เอ๊ะ?!”\n\n“ดีแล้วที่พาเธอมาด้วย”\n\nอีวานที่จู่ๆ ก็ปรากฏตัวขึ้นตรงหน้าเอลเฟียรา ตวัดแขนโอบรอบเอวของเธอแล้วหมุนตัวหันหลังกลับ\n\nทว่าในจังหวะที่กำลังจะก้าวออกจากห้อง เธอก็ได้ยินเสียงดังคล้าย “แกร๊กครืด”\n\n“อืม”\n\nร่างของอีวานหยุดชะงักลงกะทันหัน เธอเห็นโซ่ตรวนพันรัดอยู่รอบข้อเท้าของเขา เมื่อหันกลับไปมอง พลังศักดิ์สิทธิ์สีดำทมิฬที่ซึมออกมาจากรูปปั้นที่แตกสลายได้ยึดจับตัวเขาเอาไว้\n\n“รัศมีแรงระเบิดเท่าไร?”\n\n“ระ... ระเบิดมันก็แค่คำเปรียบเปรย... ถ้าจะให้ถูกต้องคือการกลับตาลปัตรเชิงมโนทัศน์...”\n\n“สรุปมา”\n\n“ไม่รู้ค่ะ! แต่ดูจากโครงสร้างผนึกแล้ว... เมื่อพิจารณาขอบเขตพลังของมัน... ยังไงก็อยู่ภายในห้องนี้แน่นอน...!”\n\n“ปิดประตูแล้วรอ”\n\nเอ๊ะ?!\n\nเอลเฟียราสัมผัสได้ถึงสภาวะลอยตัวอันรุนแรงท่ามกลางทัศนวิสัยที่บิดเบี้ยวหมุนคว้าง\n\nสิ้นเสียงดังตุ้บพร้อมความเจ็บชาที่บั้นท้ายซึ่งดึงสติของเธอกลับคืนมา เธอก็พบว่าตัวเองถูกเหวี่ยงออกมานอกห้องเสียแล้ว\n\n“แล้วคุณล่ะคะ?! ฉันบอกว่ามันอันตรายไงคะ!”\n\n“ฉันไม่เป็นไร”\n\nร่างกายของเธอสั่นสะท้านเมื่อได้ยินเสียงทุ้มต่ำนั้น\n\nด้วยความรู้สึกเดจาวูอันรุนแรง เธอเงยหน้ามองใบหน้าของอีวานด้วยดวงตาที่สั่นระริก\n\nใบหน้าอันเรียบเฉยที่ดูไม่สะทกสะท้าน หลงเหลือเพียงรูปทรงดวงตาจากรูปลักษณ์เมื่อ 12 ปีก่อน...\n\n“ฉันคาดการณ์เฟส 2 เอาไว้แล้ว”\n\nอีวานผู้เป็นคนมีเหตุผลย่อมรู้ดีเกี่ยวกับโครงสร้างของการต่อสู้กับบอสอยู่แล้ว\n\nอย่างมากที่สุด 5 เฟส อย่างน้อยที่สุด 2 เฟส\n\nเฟส 1 เป็นกิมมิก ดังนั้นเฟส 2 ก็ต้องเป็นการปะทะทางกายภาพ โชคดีที่เขาค่อนข้างมั่นใจในด้านนั้นเสียด้วย\n\n“ไม่สิ นั่นมันหมายความว่ายังไงคะ...”\n\nอีวานไม่ได้ตอบคำถามเธอและหมุนตัวหันหลังกลับ\n\nดังปัง ประตูบานใหญ่ปิดสนิทลงตรงหน้าเธอ\n\nเช่นเดียวกับตอนที่เธอเผชิญหน้ากับประตูบานนี้เป็นครั้งแรก ไม่มีร่องรอยของพลังเวทมนตร์หรือพลังศักดิ์สิทธิ์หลงเหลือให้สัมผัสได้แม้แต่น้อย\n\nเธอคลานไปที่ธรณีประตูด้วยเรียวขาที่อ่อนแรง แล้วใช้ปลายนิ้วแตะลงบนร่องประตูที่ปิดสนิทแน่น จากนั้น\n\nเธอกอดเข่า สะอื้นฮัก แล้วก้มหน้าลงต่ำ\n\nอายุขัยของมนุษย์ช่างแสนสั้นนัก\n\nมนุษย์ผู้นั้นเองก็คงจะมลายหายไปดุจชั่วพริบตา ทว่า\n\nจิตวิญญาณของมนุษย์ผู้นั้น เฉกเช่นเดียวกับเอลฟ์ แม้จะมีชีวิตอันแสนสั้น แต่ยังคงตั้งตระหง่านอย่างซื่อตรงมั่นคง...\n\n“กลับมาให้ได้นะคะ...”\n\nเอลเฟียราหลับตาลงพลางสูดจมูกสะอื้นเบาๆ\n\n***\n\nอีวานหันหลังกลับและเดินขึ้นไปยังเนินซากกระดูกอีกครั้ง\n\n[เจ้าเพียงลำพัง—]\n\n“ฉันทำอะไรได้บ้าง เดี๋ยวจะแสดงให้ดูเอง”\n\n[เจ้าเป็นเพียงแค่—]\n\n“แค่ปุถุชนคนธรรมดา แกพูดถูก”\n\nไม่มีการล่อลวงอีกต่อไปแล้ว เหลือเพียงความเกรี้ยวกราดอันไร้ที่ระบาย\n\nในความมุ่งร้ายที่เอ่อล้นออกมาจากศีรษะของรูปปั้นที่ถูกทำลาย มีเพียงอารมณ์เดียวเท่านั้นที่กำลังลุกโชน\n\nอย่างเชื่องช้า ความมืดมิดสีดำสนิทที่ซึมออกมาจากรูปปั้นพลันก่อตัวเป็นรูปร่าง กลายเป็นร่างของยักษ์ใหญ่ที่มีศีรษะห้าหัว\n\nอีวานก้าวเดินตรงเข้าไปหารูปปั้นนั้น\n\nตัวตนนี้ถูกผนึกเอาไว้ตลอด 2,000 ปีที่ผ่านมา\n\nเมื่อ 2,000 ปีก่อน มันถูกมนุษย์ปราบปรามจนพ่ายแพ้\n\nและตลอดช่วงเวลานั้น มันต้องดิ้นรนอย่างหนักเพื่อขุดกับดักและถ่างรอยแยกในผนึกให้กว้างขึ้น\n\nโดยธรรมชาติแล้ว พลังของมันย่อมไม่อาจอยู่ในจุดสูงสุดได้ และ\n\nโชคดีที่พลังของเขายังคงอยู่ในจุดสูงสุด\n\nแถมให้อีกข้อหนึ่งด้วย\n\n“สำหรับตัวตนที่ล่อลวงผู้คนด้วยความสุข สุดท้ายแกกลับมีสภาพน่าเกลียดน่ากลัวไม่เบาเลยนะ ตอนนี้ไม่รู้สึกมีความสุขแล้วหรือไง?”\n\n[เจ้า...!!]\n\n“รีบจบเรื่องนี้กันเถอะ ฉันยังมีธุระต้องทำอีกเยอะ”\n\nอีวานจับดาบที่เคยปักอยู่กลางอกของรูปปั้นขึ้นมาอีกครั้ง\n\nไม่อาจสัมผัสถึงการล่อลวงใดๆ ได้อีกแล้ว\n\nนั่นหมายความว่าดาบเล่มนี้ไม่ได้ทำหน้าที่เป็นผนึกให้เจ้านั่นอีกต่อไป และ\n\nอีกอย่างหนึ่ง\n\nหากมันเคยถูกใช้เป็นสื่อกลางในการผนึกตัวตนนี้มาก่อน มันย่อมเป็นอาวุธที่สามารถสร้างความเสียหายแก่ร่างที่แท้จริงของตัวตนนี้ได้\n\nข้อเท็จจริงที่ว่าการสู้กับบอสทุกตัวล้วนมีกิมมิกซ่อนอยู่ คือ “สามัญสำนึก” ที่ไม่มีชาวโลกในศตวรรษที่ 21 คนไหนไม่รู้\n\n– ซู่วว\n\nดาบเหล็กเรียบง่ายไร้การตกแต่งประดับประดาเลื่อนหลุดออกมาจากอกของรูปปั้นหินอ่อนอย่างลื่นไหลพร้อมเสียงดุจคมมีดฟันเนื้อ โดยไร้แรงเสียดทานใดๆ\n\nอีวานสะบัดข้อมือเบาๆ เพื่อกะจุดศูนย์ถ่วงแล้วตั้งดาบชูขึ้นตรง\n\nเป็นอาวุธที่ตีขึ้นอย่างประณีตทีเดียว หากนี่คือสื่อกลางที่ใช้ผนึกเทพอสูรชั่วร้าย มันจะเป็นไอเทมสายจอมเวทหรือสายนักรบกันนะ?\n\nพอพวกเรากลับขึ้นไปบนพื้นดินแล้ว เอาไปให้ใครสวมใส่ถึงจะคุ้มค่าและมีประสิทธิภาพมากที่สุดดี?\n\nพลางครุ่นคิดถึงเรื่องเช่นนั้นไปเรื่อยๆ\n\n***\n\nเอลเฟียราที่นั่งพิงหลังอยู่กับบานประตูเสียหลักล้มหงายหลังทันทีที่ประตูเปิดออกอย่างเงียบเชียบและราบรื่น\n\n“อิ๊ย?!”\n\n“หลับอยู่หรือไง?”\n\nไออุ่นจากร่างกายอันอบอุ่นแผ่ซ่านอุ่นวาบอยู่เบื้องหลังแผ่นหลังของเธอ เมื่อเธอเงยหน้าขึ้นมองด้วยดวงตาที่สั่นระริก ตรงหน้าคือบุรุษที่มีสีหน้าแบบเดียวกับตอนที่พวกเขาเพิ่งก้าวเข้าไปในห้องนั้นครั้งแรกไม่ผิดเพี้ยน\n\n“ฉ... ฉันไม่เป็น...”\n\n“ไม่เป็นไรก็ดี”\n\nอีวานช้อนตัวอุ้มเอลเฟียราขึ้นมาและประคองเธอไว้ขณะก้าวเดินไปข้างหน้า\n\nในอ้อมแขนที่โอบประคองไว้อย่างหลวมๆ เอลเฟียราก็เอ่ยปากขึ้น\n\n“ข้างในนั้นเกิดอะไรขึ้นคะ...”\n\n“ไม่มีอะไรเกิดขึ้น”\n\n“เอ๊ะ... เป็นไปไม่ได้หรอกค่ะ”\n\n“ก็เป็นแบบนั้นแหละ”\n\n“ถ้าไม่อยากพูด ก็ไม่ต้องพูดค่ะ”\n\n“ตกลง”\n\n“โธ่... จริงๆ เลย พวกมนุษย์นี่...!! อุตส่าห์เป็นห่วงแทบตายแต่ไม่ได้อะไรกลับมาเลย!”\n\nอีวานที่เมินเฉยต่อเสียงโวยวายของเอลเฟียรา เงยหน้าขึ้นเมื่อเดินมาหยุดอยู่ที่ปลายสุดของโบราณสถาน\n\nในห้วงลึกใต้ดินที่ม่านเวทมนตร์สลายหายไปแล้ว กลุ่มแสงสว่างเล็กๆ ปรากฏให้เห็นอยู่เบื้องบนอันไกลโพ้น\n\n“ร่ายเวทลอยตัวได้ใช่ไหม?”\n\n“แน่นอนว่าได้ค่ะ”\n\n“คิดถูกจริงๆ ที่พาเธอมาด้วย”\n\n“...”\n\nเธอก้มหน้าลงในอ้อมแขนของอีวาน พึมพำเบาๆ ก่อนจะเอียงคอสงสัย\n\nจู่ๆ ความคิดหนึ่งก็ผุดขึ้นมาในหัว\n\nทำไมตัวเขาถึงได้... ‘อุ่น’ แบบนี้นะ...? ไม่สิ นี่มัน...?\n\nเธอวางมือลงบนอกของเขาอย่างลังเลแล้วต้องสะดุ้งสุดตัว\n\n“ทำไมตัวคุณถึงได้ร้อนเหมือนลูกไฟแบบนี้ล่ะคะ! ข้างในนั้นคุณไปทำอะไรมา?!”\n\n“อืม”\n\n“อย่ามา ‘อืม’ ใส่ฉันนะคะ! นี่มันชวนคลั่งชัดๆ! ฉันเข้าใจดีค่ะว่ามนุษย์มีทักษะการสนทนาที่จำกัด แต่ว่า...!”\n\n“ไม่เป็นไร”\n\n“อ๊าาาา!! หยุดพูดคำนั้นสักทีเถอะค่ะ!! มันไม่เป็นไรตรงไหนกันคะ?! นี่พวกเรากำลังพนันกันอยู่หรือไงคะว่าข้างในตัวฉันกับข้างในตัวคุณใครจะระเบิดตายก่อนกัน?!”\n\nเอลเฟียราตะโกนลั่นพลางร่ายเวทมนตร์จนเสร็จสมบูรณ์\n\nร่างกายของทั้งสองค่อยๆ ลอยตัวขึ้นอย่างช้าๆ\n\nอีวานปรายตามองโบราณสถานแห่งนั้นเป็นครั้งสุดท้าย ก่อนจะเงยหน้าขึ้นมองด้านบนอีกครั้ง\n\nทางระบายน้ำใต้ดินอยู่ใกล้แค่เอื้อม ตรงปากทางเข้าทางระบายน้ำน่าจะมีกำลังพลของเอลิซาเวตารออยู่ และต่อให้ไม่มี ทางระบายน้ำนี้ก็เป็นเส้นทางตรงไปยังมหาวิทยาลัยอยู่แล้ว\n\nนั่นหมายความว่าพวกเขากลับเข้าสู่เขตปลอดภัยเรียบร้อยแล้ว\n\n“ทำได้ดีมาก”\n\n“...คุณต่างหากที่ทำมากกว่า ฉันแทบไม่ได้ทำอะไรเป็นชิ้นเป็นอันเลยค่ะ”\n\n“ไม่หรอก เธอทำหน้าที่ของตัวเองได้สมบูรณ์แล้ว”\n\nการค้นหาผนึกและตีความภาษาโบราณ เพียงเท่านั้นเอง เขาไม่เคยคาดหวังอะไรมากไปกว่านั้น\n\nดังนั้น เธอจึงทำสิ่งที่จำเป็นต้องทำได้ครบถ้วนแล้ว\n\nเรื่องอื่นทั้งหมด—ความปลอดภัยของเด็กคนนี้ การกำจัดตัวตนที่ถูกผนึก การทำความเข้าใจและจัดการสถานการณ์ การลาดตระเวน—ล้วนเป็นหน้าที่ของเขาทั้งหมด\n\nอีวานค่อยๆ หลับตาลงขณะที่ทัศนวิสัยของตนพร่ามัวลง\n\nเมื่อได้ยินคำพูดของอีวาน เอลเฟียราก็ก้มหน้าลงอีกครั้ง เม้มริมฝีปากพึมพำอยู่ครู่หนึ่งก่อนจะเอ่ยขึ้น\n\n“เอ่อ บังเอิญว่า เมื่อ 12 ปีก่อน เรื่องนั้น เอ่อ ก็รู้ใช่ไหมคะ”\n\n“...”\n\n“คุณจำได้ใช่ไหมคะ? ตอนที่ฉัน...”\n\n“...”\n\n“คุณคะ?”\n\nเมื่อเอลเฟียราเงยหน้าขึ้นมอง เธอก็เห็นอีวานหลับตาสนิทไปแล้ว\n\nเมื่อฟังเสียงลมหายใจอันสม่ำเสมอของเขา เธอก็ยกมือขึ้นลูบแก้มของเขาเบาๆ\n\n“ขอโทษนะคะที่คราวก่อนไม่ได้ขอบคุณ สำหรับวันนี้ด้วย ขอบคุณนะคะ”\n\nขณะลอยตัวอยู่ในทางระบายน้ำใต้ดิน เธอไม่ได้ปลดเวทลอยตัวที่ร่ายใส่ตัวอีวานออก แต่ค่อยๆ ลอยล่องข้ามผ่านทางระบายน้ำไปอย่างช้าๆ โดยที่ยังคงอยู่ในอ้อมแขนของเขา\n\n“เหนื่อยหน่อยนะคะ หลับให้สบายเถอะค่ะ”\n\n***\n\nอีวานยกมือขึ้นกุมศีรษะแล้วลืมตาตื่นขึ้น\n\nสติสัมปชัญญะค่อยๆ ฟื้นคืนมาอย่างพร่าเลือนพร้อมอาการปวดศีรษะจี๊ด\n\nความรู้สึกคล้ายอาการเมาค้างหลังดื่มเหล้ามาทั้งคืน ทว่าน่าประหลาดสำหรับยุคสมัยนี้ อีวานเป็นคนแทบไม่แตะแอลกอฮอล์เลย ดังนั้นเขาจึงไม่มีทางเมาค้าง\n\nเขาลุกขึ้นจากเตียง พลางปัดผ้าห่มกำมะหยี่เนื้อนุ่มออกไปด้านข้าง\n\n“อะไรกัน...?”\n\nผ้าห่มกำมะหยี่? เตียงนอน?\n\nความคิดของอีวานจมดิ่งลงอย่างรวดเร็ว\n\nพื้นห้องที่ปูด้วยพรมสีแดง และเตียงนอนที่มีผ้าห่มกำมะหยี่พลิ้วไหวเบาๆ\n\nและตรงปลายเตียง มีเงาร่างหนึ่งนอนหันหลังให้อยู่\n\nผู้หญิงคนหนึ่ง\n\n“อืม”\n\n***\n\n**💬 ความคิดเห็นนักอ่าน:**\n- **@คนรอฉากแฟลชแบ็ก** (16 ชั่วโมงที่แล้ว • 👍 251): อ๊ากกกก เชื่อมกลับมาฉากเปิดบทที่ 58 แล้วววว!! แทบกรี๊ดตอนเห็นคำว่า \"ผ้าห่มกำมะหยี่? พรมสีแดง? เงาร่างหญิงสาวตรงปลายเตียง\" ในที่สุดเวลาในเนื้อเรื่องก็ตามทันสักที!\n- ↳ **@หน่วยเดาตัวละคร** (15 ชั่วโมงที่แล้ว • 👍 92): เฉลยแน่นอนแล้ว 99.99%!! คนที่ลุงแบกขึ้นมาจากทางระบายน้ำทั้งที่พิษไข้ขึ้นสูงคือเอลเฟียรานี่หว่า!! (แต่ต้องรอลุ้นอีกทีตอนหน้าว่าห้องใคร)\n- **@สายบู๊ไม่พัก** (15 ชั่วโมงที่แล้ว • 👍 138): ฉากรับมือ \"เฟส 2\" เงามืดห้าหัวคนเดียวแล้วชักดาบเหล็กที่ใช้ผนึกเทพอสูรออกมาฟันคือโคตรเท่ โยนเอลเฟียราออกนอกประตูก่อนด้วยนะ กันน้องโดนลูกหลงสุดๆ\n- **@หมอสนามกุมขมับ** (13 ชั่วโมงที่แล้ว • 👍 61): ชักอยากเห็นสีหน้าลุงตอนกรีดแขนราดโพชั่นอีกรอบแล้วสิ 555"
    },

      "title": "บทที่ 69: มหาวิทยาลัยเซนต์ยานสก์กับห้องลับ",
      "content": "ขณะนั่งอยู่บนโซฟา อีวานจ้องเขม็งไปยังเตียงนอนอยู่ครู่หนึ่ง\n\nเตียงนอนขยับไหวเล็กน้อย และผ้าห่มก็ค่อยๆ เลื่อนไถลลง\n\nเรือนผมสีทองแผ่สยายราวกับทุ่งข้าวสาลี โดยมีใบหูเรียวยาวโผล่พ้นออกมา นั่นคือเอลเฟียรา\n\n“อ๊ะ? ตื่นแล้วหรือคะ? หลับสบายไหมคะ?”\n\nอีวานกวาดสายตาสำรวจเรือนร่างของเอลเฟียราอย่างรวดเร็ว เธอสวมชุดนอนผ้าไหมเรียบร้อยดี เขาจึงลดมีดสั้นลงอย่างโล่งอกอยู่ในใจ\n\n“ทำไมฉันถึงมาอยู่ที่นี่?”\n\n“จำไม่ได้หรือคะ?”\n\n“อืม”\n\n“อืม... ฮิๆ จริงหรือคะ? งั้นเหรอคะ?”\n\nเอลเฟียราคลานลงจากเตียงพร้อมเสียงหัวเราะคิกคัก\n\nเธอเหลือบมองเสื้อผ้าที่ร่วงหล่นอยู่บนพื้นอย่างขี้เล่นแล้วเอ่ยขึ้น\n\n“คุณคิดว่าพวกเราทำอะไรกันล่ะคะ?”\n\n“ไม่ได้ทำอะไรทั้งนั้น”\n\nอีวานเป็นเจ้าหน้าที่ข่าวกรองที่ผ่านการฝึกฝนมาอย่างโชกโชน นั่นไม่ได้หมายความว่าเขาเชื่อมั่นในการควบคุมตนเอง แต่หมายความว่าเขาสามารถรวบรวมข้อมูลได้มากเพียงพอจากการสังเกตเสื้อผ้าหรือสภาพร่างกายของอีกฝ่ายเท่านั้น\n\nหากเขาได้ทำ “อะไรบางอย่าง” ลงไประหว่างที่หลับอยู่ เอลเฟียราคงไม่อยู่ในสภาพที่เรียบร้อยเช่นนี้หรอก\n\nเมื่อรับรู้ถึงสายตาของเขา เอลเฟียราก็ทำแก้มป่องแล้วบ่นอุบอิบ\n\n“ไม่ได้ทำอะไรก็จริง แต่ก็ไม่ใช่ว่าไม่มีอะไรเกิดขึ้นเลยเสียหน่อยนะคะ”\n\n“...หมายความว่ายังไง?”\n\n“ท่านนักบุญหญิงแวะมาที่นี่ค่ะ”\n\nเธอปรบมือหนึ่งครั้งพลางบ่นพึมพำ\n\nไม่ช้าประตูก็เปิดออก และคนรับใช้ก็เดินเข้ามาจัดวางของว่างลงบนโต๊ะ\n\nหลังจากโบกมือไล่คนรับใช้ออกไปด้วยท่าทางเป็นธรรมชาติ เธอก็หยิบถ้วยชาที่รินชาดำไว้เต็มถ้วยขึ้นมา\n\n“เชิญทานอะไรหน่อยสิคะ คุณคงหิวน่าดูเลย”\n\n“นิวทริชันบาร์ของฉันอยู่ไหน?”\n\n“คะ? นั่นมันอะไรคะ?”\n\n“แท่งอาหารในเสื้อกั๊กของฉัน ฉันเสียบไว้ในช่องเก็บ”\n\n“อ๋อ... หมายถึงขนมหมานั่นหรือคะ? ฉันเอาไปให้ท่านมงบล็องกิน แต่เขาไม่ยอมกิน ฉันเลยนึกว่ามันบูดเสียแล้วก็เลยทิ้งไป... นั่นเป็นอาหารคนจริงๆ เหรอคะ?”\n\n“ท่านมงบล็อง...?”\n\n“สุนัขของฉันเองค่ะ น่ารักมากเลย อยากดูไหมคะ?”\n\nอีวานมองดูขนมชิ้นเล็กชิ้นน้อยสุดประณีตที่จัดเรียงไว้บนโต๊ะแล้วกลืนเสียงถอนหายใจลงคอ\n\nอาหารพวกนี้ที่ทำขึ้นจากน้ำตาลและคาร์โบไฮเดรตล้วนๆ ช่างน่าเวทนานัก ให้พลังงานส่วนเกินแต่สารอาหารไม่เพียงพอเอาเสียเลย\n\nเขากำลังจะบ่นเรื่องที่เธอโยนนิวทริชันบาร์ครบถ้วนสารอาหารของเขาให้สุนัข แต่ก็หยิบถ้วยชาขึ้นมาและรวบรวมความคิดเสียก่อน\n\nยังมีเรื่องสำคัญกว่านั้น แม้เขาจะหานิวทริชันบาร์เพิ่มจากห้องทำงานผู้อำนวยการได้อีกมากเท่าไรก็ตาม แต่สิ่งที่สำคัญในตอนนี้คือสถานการณ์ปัจจุบันต่างหาก\n\nเขาเป็นคนมีเหตุผลและใจกว้างถึงเพียงนี้เชียว\n\n“เธอบอกว่านักบุญหญิงแวะมา”\n\n“อ้อ ค่ะ ท่านมาตรวจดูอาการของคุณ อ้อ จริงสิ! คุณพระช่วย ทำไมตอนนั้นคุณถึงบอกว่าไม่มีอะไรเกิดขึ้นล่ะคะ?!”\n\nเอลเฟียราวางถ้วยชาลงดังปึงแล้วเริ่มโกรธขึ้นมา\n\nเนื่องจากการตามอารมณ์ของเด็กสาววัยรุ่น (ซึ่งอันที่จริงเธอไม่ใช่เสียหน่อย) คงเป็นเรื่องยุ่งยากและโง่เขลา อีวานจึงเพียงตั้งใจรับฟังเงียบๆ\n\n“คำสาปค่ะ! ท่านนักบุญหญิงอดหลับอดนอนตลอดทั้งคืนเพื่อช่วยลบล้างมัน ให้ตายเถอะ ทั้งหมดนั่นมันเรื่องอะไรกันคะ?”\n\n“ความทุกข์น่ะ”\n\nอีวานยักไหล่อย่างไม่ใส่ใจ\n\n“นักบุญหญิงได้พูดอะไรไว้ไหม?”\n\n“ไม่ได้พูดละเอียดหรอกค่ะ... ท่านแค่มาถึง ร้องไห้อยู่พักหนึ่ง สวดภาวนาตลอดทั้งคืน แล้วก็กลับไป ท่านฝากบอกแค่ว่าให้คุณไปที่ห้องสารภาพบาปสัปดาห์ละสามวันค่ะ”\n\n“อยู่ในขอบเขตที่คาดการณ์ไว้แล้ว”\n\nอีวานจิบชาหนึ่งอึกแล้วลุกขึ้นยืน\n\n“ในเมื่อเจ้านั่นเล่นงานด้วยแนวคิดเรื่องความสุข ผลข้างเคียงจากเสียงคร่ำครวญก่อนตายของมันจึงคาดเดาได้ไม่ยาก การขาดหายไปของความสุขก็คือความทุกข์”\n\n“เอ่อ... งั้น... มันก็เหมือนกับ ‘กับดักนั่น’ น่ะสิคะ...?”\n\nเอลเฟียรากลืนน้ำลายดังเอื๊อกเมื่อหวนนึกถึงสภาพของอีวานตอนที่เพิ่งหนีออกมาจากห้องนั้น\n\nคำสาปที่ยัดเยียด “ความทุกข์” ซึ่งมีปริมาตรทัดเทียมกับ “ความสุข” อันท่วมท้นจนสะกดจิตวิญญาณได้ในแรกเห็นนั้นเชียวหรือ?\n\n“ฉันวางแผนรับมือไว้แบบนั้นอยู่แล้ว มหาวิทยาลัยแห่งนี้มีนักบุญหญิงอยู่ และเธอก็เป็นผู้ที่เชี่ยวชาญการถอนคำสาปมากที่สุดในทวีปนี้”\n\n“...คุณคาดการณ์ทั้งหมดนี้เอาไว้แล้วหรือคะ?”\n\n“ใช่”\n\n“คุณนี่มัน... บ้าไปแล้วจริงๆ!! งั้นก็น่าจะบอกกันสักคำสิคะ! ถ้าเกิดไม่ได้ตรงไปหาท่านนักบุญหญิงทันทีแล้วมัวแต่รอจนคุณฟื้นขึ้นมาล่ะจะทำยังไงคะ!”\n\n“จะเกิดอะไรขึ้นเล่า? หากเป็นคำสาปประเภทเร่งด่วนฉันคงบอกไปตั้งแต่แรกแล้ว แต่คำสาปที่เพียงแค่ฝังความทุกข์ใจให้ไม่ได้เป็นอันตรายถึงชีวิต ดังนั้นจึงไม่จำเป็นต้องรีบร้อน”\n\n“คุณนี่มัน...!!”\n\nเอลเฟียราตะโกนออกมาด้วยดวงตาที่เอ่อคลอไปด้วยน้ำตา\n\n“คุณแปลกไป คุณแปลกไปมากจริงๆ ฉันเคยนึกว่าบางทีอาจเป็นเพราะคุณเป็นมนุษย์ แต่ทำไมคุณถึงเปลี่ยนไปได้มากขนาดนี้คะ? เดิมทีคุณไม่ใช่คนแบบนี้นี่นา!”\n\n“ไม่ใช่คนแบบนั้นงั้นหรือ”\n\n“ใช่ค่ะ! เดิมทีคุณน่ะ...!”\n\n“นั่นล้ำเส้นเกินไปแล้วนะ”\n\nอีวานรวบเก็บเสื้อผ้าและจัดแจงข้าวของของตนเอง เขาตรวจเช็กสิ่งของใช้แล้วหมดไปอย่างเสื้อกั๊กอเนกประสงค์และกระเป๋าสะพายข้าง (ทำขึ้นเอง) อย่างรวดเร็วก่อนจะหันศีรษะกลับมา\n\n“เอลเฟียรา หน้าที่ของเธอไม่ใช่การมาเป็นห่วงฉัน”\n\n“คุณ... พูดว่าอะไรนะคะ?”\n\n“เธอเป็นนักศึกษาไม่ใช่หรือ? บทบาทของเธอคือการตั้งใจเรียนให้ดี และนานๆ ครั้งก็ออกมาหาประสบการณ์ภาคสนามแบบนี้บ้าง”\n\nสำหรับเหล่าทายาทของปาร์ตี้ผู้กล้า ปาร์ตี้ผู้กล้าในอนาคต และตัวเอกแห่งเรื่องราวในอนาคต ไม่มีสิ่งใดจำเป็นนอกเหนือจากประสบการณ์และการเรียนรู้\n\nดังนั้น ทุกสิ่งทุกอย่างที่เหลือนอกเหนือจากนั้นล้วนเป็นความรับผิดชอบของอีวาน\n\nการพาเด็กเหล่านี้ไปให้ถึงฉากจบ การผลักดันเรื่องราวให้ดำเนินไปอย่างปลอดภัยและสมบูรณ์แบบจนกระทั่งได้เผชิญหน้ากับเครดิตท้ายเรื่องในที่สุด\n\nนั่นคือ “เรื่องราว” ของเขา หน้าสุดท้ายที่เขาจะได้พลิกเปิดย่อมอยู่ที่นั่นอย่างแน่นอน\n\nดังนั้น ทั้งความปลอดภัยของเธอเอง ความปลอดภัยของลูกหลานปาร์ตี้ผู้กล้า ภัยคุกคามนอกบทเรื่อง—ไม่มีสิ่งใดเลยที่เป็นเรื่องให้เธอต้องมากังวล\n\nนั่นคืองานของเขา และเนื่องจากเขาเป็นคนเห็นแก่ตัว เขาจึงไม่ชอบให้ใครมาแทรกแซงขอบเขตงานของตนเอง\n\nอีวานพยักหน้าให้เอลเฟียราที่กำลังยืนอึ้งอย่างเหม่อลอยสั้นๆ แล้วเดินออกจากห้องไป\n\nเขตที่พักของพวกเอลฟ์งั้นหรือ\n\nอีวานเดินขมวดคิ้วไปตามทางท่ามกลางแสงแดดจ้าในยามเช้า\n\nติดกับมหาวิทยาลัยคือถนนสายหนึ่งที่หรูหราฟู่ฟ่าอย่างถึงที่สุด พื้นที่แห่งนี้ซึ่งเรียกกันติดปากว่า “เขตหอพักเอลฟ์” คือย่านที่อยู่อาศัยที่เหล่าขุนนางจากหมู่เกาะคาลีออนพำนักอาศัยอยู่\n\nเขาเมินเฉยต่อเหล่าเอลฟ์ที่เหลือบมองมา แล้วเดินตรงดิ่งมุ่งหน้าไปยังมหาวิทยาลัย\n\nแม้ในยามพักผ่อน การรายงานผลย่อมต้องมาก่อนเสมอ\n\nขณะที่เขาหันกลับไปมองคฤหาสน์ของเอลเฟียราเป็นครั้งสุดท้าย เขาก็รู้สึกเสียใจต่อการกระทำของตนเองอยู่ชั่วครู่\n\nเขาไม่น่าตวาดใส่เธอแบบนั้นเลย นั่นอาจจะเป็นถ้อยคำที่รุนแรงก้าวร้าวเกินไปสำหรับใช้พูดกับเด็กสาวอายุน้อย\n\nแต่มันไม่ใช่เรื่องง่ายเลย แม้คำสาปจะถูกขจัดออกไปแล้ว ทว่า “ความทรงจำ” ย่อมไม่เลือนหายไปแม้จะได้รับพรจากนักบุญหญิงก็ตาม\n\nความทรงจำแห่งความทุกข์ในอดีตที่คำสาปปลุกเร้าขึ้นมา ได้รื้อฟื้นแม้กระทั่งรายละเอียดปลีกย่อยที่เขาลืมเลือนไปตามกาลเวลาขึ้นมาอย่างพิถีพิถัน บีบบังคับให้ความรู้สึกดิบเถื่อนถาโถมเข้าใส่เขา\n\nลมเหนือกับดวงอาทิตย์สินะ\n\nอีวานยิ้มขื่น\n\nดูเหมือนเขาจะเป็นนักเดินทางที่พ่ายแพ้ต่อลมเหนือยิ่งกว่าแสงอาทิตย์เสียอีก\n\nดังที่เขาเคยใคร่ครวญไว้ ความสุขทั้งหมดในโลกใบนี้ได้หมดอายุขัยลงไปตามกาลเวลาแล้ว และสิ่งที่หลงเหลืออยู่บนผืนแผ่นดินนี้ก็มีเพียงหน้าที่เท่านั้น\n\nหากจะอธิบายเรื่องนี้ให้ชัดเจนอีกครั้ง การไร้ซึ่ง “ความสุข” ก็คือ “ความทุกข์”\n\nพูดอีกอย่างก็คือ อดีตส่วนใหญ่ที่เขาพอจะหวนระลึกได้โดยทั่วไปแล้วล้วนเต็มไปด้วยความทุกข์ระทม\n\nเขาต้องอดทนอยู่เพียงลำพังในห้องนั้น เคี้ยวเอื้องทบทวนความทุกข์ตลอด 30 ปีก่อนที่จะหนีออกมาได้\n\nความทรงจำที่ถูกลืมเลือนไปชั่วคราวเพราะอาการหมดสติกลับมาผุดพรายขึ้นอีกครั้งผ่านบทสนทนา คอยกัดกร่อนอารมณ์ความรู้สึกของอีวาน\n\nช่างไม่โตเอาเสียเลย\n\nอีวานตัดสินใจว่าสักวันหนึ่งเขาจะไปขอโทษเอลเฟียรา แล้วจึงหันหลังเดินจากไป\n\n***\n\n– ปัง\n\nเอลเฟียราสูดจมูกสะอื้นขณะจ้องมองบานประตูที่ปิดสนิทอยู่เป็นเวลานาน\n\nมนุษย์ผู้นั้นที่แปรเปลี่ยนไปจนไม่คุ้นตา\n\nชีวิตอันรวดเร็วและแสนสั้นของมนุษย์\n\nการล่อลวงแห่งความสุขและคำสาปแห่งความทุกข์\n\nพระคุณและบาดแผล\n\nถ้อยคำที่หมุนวนอยู่ในหัวของเธอค่อยๆ กลายเป็นชิ้นส่วนอันแจ่มชัดที่เริ่มประกอบเข้าด้วยกัน\n\nเธอคือจอมเวท จอมเวทคืออาชีพที่ควรมองสถานการณ์ด้วยเหตุผลมากกว่าอารมณ์\n\nดังนั้น เธอจึงเรียกความสงบเยือกเย็นกลับคืนมาได้ ส่วนหนึ่งเป็นเพราะหน้าที่ตามวิชาชีพ และอีกส่วนหนึ่งเป็นเพราะความเคยชินที่ฝังรากลึกมานานหลายปี\n\n– กริ๊ก\n\nเธอหรี่ตาลงขณะยกชาที่เย็นชืดขึ้นดื่ม\n\n‘กับดักที่ล่อลวงด้วยสิ่งที่เป้าหมายปรารถนามากที่สุด’\n\nกับดักที่เธอพบในโบราณสถานบรรจุไปด้วยสมบัติล้ำค่า ตำราเวทหายาก และวัตถุดิบปรุงยาที่ยากจะหามาครอบครองได้แม้จะมีทรัพย์สินมหาศาล\n\nและสิ่งที่ชายผู้นั้นเผชิญหน้ากลับเป็น\n\n‘หวี’\n\nเธอครุ่นคิดว่าเรื่องแบบนั้นจะเป็นไปได้อย่างไร ข้อสรุปนั้นเรียบง่าย นั่นหมายความว่าในตอนนั้น นั่นคือทั้งหมดที่เขาต้องการ\n\nแทนที่จะหมายความว่าเขาหลงใหลหวีเป็นพิเศษ (ซึ่งก็เป็นความจริงอยู่บ้าง) มันกลับหมายความว่าเขาเพียงไม่ต้องการสิ่งอื่นใดมากไปกว่านั้น\n\n‘เขาไม่มีความปรารถนาใดๆ เลย’\n\nดวงตาของเอลเฟียราส่องประกายคมกริบ\n\nทั้งที่มีสตรีที่งดงามที่สุดแห่งคาลีออนยืนอยู่ข้างกายแท้ๆ—เอลฟ์ผู้เป็น “ความงามระดับตำนาน” ในสายตาของมนุษย์—เขากลับนึกถึงหวีแทนที่จะฉวยโอกาสจากสถานการณ์ นั่นย่อมพิสูจน์ข้อเท็จจริงนี้ได้เป็นอย่างดี\n\nเอลเฟียราพยักหน้าเห็นพ้องกับข้อสรุปอันสมเหตุสมผลนี้\n\n‘เขาพังทลายไปแล้ว’\n\nนี่คือข้อพิสูจน์ว่าต่อให้การให้เหตุผลจะผิดพลาด ทว่าหากข้อสรุปถูกต้องก็ย่อมไม่เป็นปัญหาแต่อย่างใด\n\nท่านนักบุญหญิงรู้เรื่องนี้ไหมนะ? ท่านพ่อของเธอล่ะ? หากคนที่เคยเป็นสหายร่วมรบกับชายผู้นั้นไม่ทันสังเกตเห็น และหากมีเพียงเธอคนเดียวในโลกนี้ที่ล่วงรู้ความจริงข้อนี้...\n\n‘ฉันต้องเป็นคนลงมือเอง’\n\nโดยพื้นฐานแล้ว เอลฟ์เป็นเผ่าพันธุ์ที่ซื่อสัตย์ต่อความปรารถนา นั่นไม่ได้หมายความว่าพวกเขามัวเมาในกามคุณอันต่ำทราม แต่เป็นไปตามตรรกะอันเป็นธรรมชาติอย่างยิ่งที่ว่าของล้ำค่าควรจะได้อยู่ในความครอบครองของเอลฟ์อย่างสมควร\n\nอย่างไรเสีย คนเราก็ไม่อาจฝากฝังของล้ำค่าไว้กับเผ่าพันธุ์อายุขัยสั้นเพื่อปล่อยให้มันพังเสียหายไปต่อหน้าต่อตาได้หรอก\n\nดังนั้น เอลเฟียราในฐานะเอลฟ์ผู้ยอดเยี่ยมจึงได้ข้อสรุปว่า\n\n‘ไม่มีใครอื่นนอกจากฉันอีกแล้ว’\n\nการสอนให้รู้จักความสุขแก่บุรุษผู้ไม่รู้จักความสุข คงจะเป็นภารกิจที่น่าตื่นเต้นไม่น้อยทีเดียว\n\nเช่นเดียวกับสุนัขที่มีอายุขัยแตกต่างกันไปตามสายพันธุ์ ดูเหมือนชายผู้นั้นจะเกิดมาพร้อมอายุขัยที่สั้นจนน่าตกใจแม้กระทั่งในหมู่คนด้วยกันเอง\n\nอันดับแรก ฟื้นฟูอายุขัยของเขาเพื่อให้ดูอ่อนเยาว์ลง ปรับปรุงสภาพร่างกายอย่างสม่ำเสมอ ให้เขากินอาหารที่ดีกว่าไอ้ขนมหมาพวกนั้น และใช่แล้ว ด้วยการดูแลเอาใจใส่เขาเช่นนั้น เขาก็ย่อมจะรู้สึกถึง “ความสุข” ขึ้นมาเองโดยธรรมชาติ\n\nเธอยิ้มพลางอุ้มเจ้าพูเดิลตัวน้อยที่กำลังหอบแฮ่กอยู่แทบเท้าขึ้นมาลูบขนเบาๆ\n\n***\n\n“เจ้าไปเจอกับตัวอะไรในโบราณสถานนะ?”\n\n“กระหม่อมพบกับบางสิ่งที่อ้างตัวว่าเป็นเทพเจ้าพ่ะย่ะค่ะ ไม่อาจระบุตัวตนที่แท้จริงของมันได้ในสถานการณ์นั้น แต่กระหม่อมจะปรึกษากับท่านนักบุญหญิงในเรื่องนี้และแนบข้อมูลเพิ่มเติมไปในรายงานพ่ะย่ะค่ะ”\n\n“เดี๋ยวๆๆ ข้าไม่เข้าใจ... กับดัก? เวทมนตร์? ผนึกอายุ 2,000 ปี?”\n\n“พ่ะย่ะค่ะ”\n\nเอลิซาเวตา คิริลลอฟนา คราซิลอฟ ยกมือกุมพระนลาฏแล้วพึมพำ\n\n“ทำไมของแบบนั้นถึงไปอยู่ใต้มหาวิทยาลัยได้กัน... ทำไมในหอจดหมายเหตุราชวงศ์ถึงไม่เคยมีการเอ่ยถึงแม้แต่คำเดียว? หากมีสิ่งเช่นนั้นหลับใหลอยู่ใต้เมืองหลวง ข้า... ประเทศนี้ควรจะรู้เรื่องนี้สิ...”\n\n“...”\n\nอีวานไม่รู้สึกว่าจำเป็นต้องอธิบายเรื่อง “สามัญสำนึก” ให้คนในโลกยุคกลางเหล่านี้ฟัง\n\nอย่างไรเสีย การที่ความชั่วร้ายบรรพกาลถูกผนึกไว้ใต้เมืองหลวงก็ถือเป็นเรื่องปกติธรรมดาในขอบเขตของสามัญสำนึกอยู่แล้ว\n\n“เอาล่ะ แล้วเจ้าทำลายมันยังไง?”\n\n“ทั้งหมดที่มันทำได้มีเพียงการเล่นตลกกับความปรารถนาของมนุษย์เท่านั้นพ่ะย่ะค่ะ”\n\n“โอ้ นั่นฟังดู... ยิ่งใหญ่ราวกับมหากาพย์เลยนะ ที่ได้ยินเรื่องแบบนี้ในยุคที่จอมมารสิ้นชีพไปแล้ว เจ้าปลอดภัยดีใช่ไหม? คงไม่ได้บาดเจ็บตรงไหนนะ?”\n\n“พ่ะย่ะค่ะ ฝ่าบาท”\n\nอีวานทูลต่อขณะคุกเข่าลงข้างหนึ่ง\n\n“มันไม่มีความสามารถในการใช้กำลังทางกายภาพเลยพ่ะย่ะค่ะ”\n\n“เข้าใจแล้ว ถ้างั้นบอกข้ามาสิว่าเจ้าทำลายมันด้วยวิธีไหน”\n\n“กระหม่อมบีบกะโหลกมันจนแหลกพ่ะย่ะค่ะ”\n\n“...???”\n\n***\n\nอิซาเบลล์ เดอ เอตัวล์ และเอซิดิส ไอนาร์สดอตตีร์ นั่งเหม่อลอยอยู่ด้วยกันบนม้านั่ง\n\n“ทำไมกันนะ...?”\n\n“ทำไมคุณลุงถึง...?”\n\nเดินออกมาจากบ้านของเอลฟ์ แถมยังออกมาจากบ้านของ “ยัยนั่น” เสียด้วย?\n\nตั้งแต่เช้าตรู่ ในสภาพผมเผ้าชี้ฟูและเสื้อผ้ามอซอ ดูเหมือนเพิ่งค้างคืนข้างนอกมาหมาดๆ...?\n\nราวกับสหายเก่าแก่ ทั้งคู่ต่างบรรลุข้อสรุปเดียวกันได้ในชั่วพริบตาพร้อมๆ กัน\n\n“นอกใจ... งั้นเหรอ?”\n\nข้อเท็จจริงที่ว่าเงื่อนไขของการนอกใจไม่อาจนำมาใช้กับความสัมพันธ์ของพวกเธอได้นั้น ไม่มีความหมายใดๆ สำหรับทั้งสองคนนี้เลย\n\nสิ่งที่สำคัญมีเพียงอย่างเดียวคือ อีวานเพิ่งเดินออกมาจากบ้านของ “ยัยนั่น”\n\nราวกับสหายเก่าแก่อีกครั้ง หลังจากได้ข้อสรุปเดียวกันแล้ว ทั้งสองก็เห็นพ้องต้องกันถึงแผนการในอนาคตโดยไม่จำเป็นต้องเอ่ยคำพูดใดๆ\n\nคราวนี้ คือ “พันธมิตร”\n\nอ้อ แน่นอนอยู่แล้ว\n\nจัดตั้งปาร์ตี้ผู้กล้าเพื่อต่อกรกับแม่มดเอลฟ์ผู้ชั่วร้าย!\n\n***\n\n**เอพพิโซด 11: มหาวิทยาลัยเซนต์ยานสก์กับห้องลับ**\n\n***\n\n**💬 ความคิดเห็นนักอ่าน:**\n- **@ทีมเรือเอลฟ์มาแรง** (12 ชั่วโมงที่แล้ว • 👍 243): เฉลยครบทุกเม็ด!! หอพักเอลฟ์ของเอลเฟียรา แถมนักบุญหญิงแพทริเซียมานั่งสวดถอนคำสาปความทุกข์ให้ทั้งคืนเลย (มิน่าลุงนึกว่าซัคคิวบัส 555)\n- ↳ **@ปราณหวีสางเครา** (11 ชั่วโมงที่แล้ว • 👍 118): ซึ้งมากที่เอลเฟียราตีความภาพภูเขาหวีในกับดักออกว่าหัวใจลุงมันว่างเปล่าและทนทุกข์แค่ไหน จนตั้งปณิธานว่าจะฟื้นฟูอายุขัยแล้วสอนให้ลุงรู้จัก \"ความสุข\"... เรือนี้จู่ๆ พุ่งแซงทางโค้งเฉย!!\n- **@แก๊งผู้กล้ากุมขมับ** (10 ชั่วโมงที่แล้ว • 👍 286): แต่ความซึ้งทั้งหมดพังทลายในวินาทีที่อิซาเบลล์กับเอซิดิสเห็นลุงเดินออกจากหอพักเอลฟ์ตอนเช้า... จากคู่แข่งความรัก กลับจับมือตั้ง \"พันธมิตรปาร์ตี้ผู้กล้าต่อกรกับแม่มดเอลฟ์ผู้ชั่วร้าย\" ซะงั้น 55555\n- ↳ **@คนอ่านที่นั่งขำตีสาม** (9 ชั่วโมงที่แล้ว • 👍 87): องค์หญิงก็จ้องเล่นเรื่องไม่ส่งรายงาน อิซาเบลล์กับเอซิดิสก็จ้องจะปราบแม่มดเอลฟ์ ส่วนลุงอีวานไม่รู้เรื่องรู้ราวอะไรเลย ปิดเอพพิโซด 11 ได้ฮาและครบรสสุดๆ!"
    }
