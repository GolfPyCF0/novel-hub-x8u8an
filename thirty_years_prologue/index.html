  "glossary": "# 📚 คัมภีร์ตัวละคร คำศัพท์ และสรรพนาม — 30 ปีผ่านไปนับจากบทนำ (30 Years Have Passed Since the Prologue)\n\n## ตัวละครหลัก\n- **อีวาน เปโตรวิช (Ivan Petrovich)** / **คิมซอนอู (Kim Sunwoo)** / **วันก้า (Vanka)** / **ซีริล (Cyril / ชื่อศีลล้างบาป)**: พระเอก อายุ 34 ปี ชาวเกาหลีที่ข้ามมิติมาจากปี 2021 (สมัยเป็นนักศึกษามหาวิทยาลัยที่ชอบเขียนคอมเมนต์วิจารณ์เกม เว็บตูน และเว็บโนเวล) มาเกิดใหม่ในร่างเด็กชายชาวนาตั้งแต่ 30 ปีก่อน เคยรับราชการทหาร 18 ปี (ทหารเกณฑ์ -> ทหารประจำการ -> หน่วยเก็บกวาด) ปัจจุบันเป็นผู้อำนวยการสถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซีย และได้รับมอบหมายให้แฝงตัวไปเป็นคนสวนที่สถาบันเซนต์ยัน ฉายา: *ลูกเขยพระราชา, คนตัดไม้, ผู้สังหารมังกรเจ็ดตัว, ผู้เป็นอมตะ, ทหารกองหนุน* (นักบุญหญิงแพทริเซียเรียกว่า *บราเดอร์ซีริล*)\n  - สรรพนาม: ใช้ *ฉัน / นาย* กับรุ่นน้องในกองทัพ, คิริลลอฟนาเรียกเขาว่า *วันก้า (Vanka)* และใช้ *ข้า / เจ้า*\n\n## ตัวละครรองและกลุ่มตัวละคร\n- **เอลิซาเวตา คิริลลอฟนา คราซิลอฟ (Elizaveta Kirillovna Krasilov)** / **คิริลลอฟนา (Kirillovna)** / **เอลิส (Elise)**: อดีตผู้บังคับบัญชาของอีวานในกองทัพ (อีวานเรียก *พันเอกคิริลลอฟนา*, รุ่นน้องบอกตอนอีวานปลดประจำการเธอเป็น *พันตรี*, เอนริเก้เรียก *เอลิส*) ปัจจุบันดำรงตำแหน่ง **อัครมหาเสนาบดี (Royal Chancellor)** และเป็น **องค์หญิง (Her Highness)** ก่อนจะก้าวขึ้นครองราชย์ในบทที่ 53–54 (**ฝ่าบาท / Your Majesty**) หลังกษัตริย์คิริลล์ที่ 2 สละราชสมบัติ ฉายาในแนวหน้า: **“ริซ่าแห่งเหล็กกล้า” (Riza of Steel)** ตราประจำตัว: ดอกเบญจมาศ\n- **กษัตริย์คิริลล์ที่ 2 (Kirill II)**: พระราชบิดาของเอลิซาเวตาและมกุฎราชกุมารอเล็กซานเดอร์ ทรงสละราชสมบัติในบทที่ 54 หลังเกิดเหตุกบฏของพระโอรส\n- **ดมิทรี เชอร์คาตอฟ (Dmitry / Dmitri Cherkatov)**: นายทหารรุ่นน้องจากหน่วยเก่าของอีวาน ปัจจุบันเป็นสายลับ/เจ้าหน้าที่ใต้บังคับบัญชาของเอลิซาเวตา เรียกอีวานว่า *รุ่นพี่* และใช้ *ผม / คุณ / รุ่นพี่*\n- **มกุฎราชกุมารอเล็กซานเดอร์ (Crown Prince Alexander)**: มีแผนจะแบ่งแยกและขายชาติ และในบทที่ 35–36 ถูกเปิดเผยว่าตัวจริงไม่ได้อยู่ในเฟรเชนกายาแต่เป็นตัวปลอม และตัวจริงอาจจับมือเป็นพันธมิตรกับเวียลกริน\n- **มหาราชา (Great King)**: พระราชาองค์ปัจจุบันที่ยังทรงนิ่งเฉย และเป็นผู้ยกเลิกเกณฑ์จำกัดอายุของสถาบันเซนต์ยัน (เอลิซาเวตาเอ่ยถึงแนวทางของพระราชาในอดีตว่าเป็น *สุริยราชา / Sun King*)\n- **ปาร์ตี้ผู้กล้า (Hero Party) และลูกหลาน/ศิษย์**:\n  - **ผู้กล้าแม็กซิมิเลียน (Maximilian)** — ฉายา **“จักรพรรดิทองคำ” (The Golden Emperor)** / **‘ผู้สังหารจอมมาร’ (‘Demon King Slayer’)** เคยมีวีรกรรม ‘ฟันผ่าท้องฟ้า’ แต่หายสาบสูญไปนานกว่า 4 ปีหลังปราบจอมมาร (ลือกันว่าปลีกวิเวกเข้าหุบเขาลึก) เอนริเก้เปิดเผยในบทที่ 21 ว่าแท้จริงเขาไม่ใช่ชาวทิลีสแต่เป็น “ผู้ที่ถูกดึงตัวมา” จากต่างโลกเช่นเดียวกับอีวาน และในบทที่ 35 เวียลกรินกระซิบบอกอีวานว่า *“แม็กซิมิเลียนยังไม่หายไปไหน”* ภรรยา: **มารี (Marie)** — ลูกสาว: **อิซาเบลล์ (Isabelle / เอคไดซิสเรียกว่า เบลล่า Bella)** (อาชีพคู่: จอมเวทและนักรบ, จากอาณาจักรทิลีส, ขาดความอบอุ่นและมีปมวิตกกังวลจากการรอคอยบิดา, ชอบผู้ชายรูปร่างกำยำ เงียบขรึม ดูพึ่งพาได้เหมือนหมี และเริ่มหวั่นไหวต่ออีวาน)\n  - **ดิอัน ออกัสต์ / ออกัสตัส (Dian August / Augustus)**: อัศวินองครักษ์สามัญชนของอิซาเบลล์ที่ราชวงศ์ทิลีสแต่งตั้ง ยอมเอาตัวเข้าแลกปกป้องอิซาเบลล์ในเหตุรถไฟตกรางจนบาดเจ็บสาหัสเพราะเชื่อว่าทายาทผู้กล้าคือความหวังของการฟื้นฟูยุคสมัยใหม่ ก่อนอีวานจะเข้ามาช่วยด้วยโพชั่นรักษาบาดแผล\n  - **อัศวินจิลแบร์ (Jilber / บทที่ 2 เรียกจิล Jill)** (ผู้พิทักษ์ชายแดน ดำรงตำแหน่งดยุกแห่งทิลีส และวีรบุรุษแห่งคณะอัศวิน ภรรยาชื่อ **จูเลีย Julia**) — ลูกชาย: **ออสการ์ เดอ ซาติยง (Oscar de Sation)** (อัศวิน, จากอาณาจักรทิลีส, หน้าตาหล่อเหลา มีสาวๆ ห้อมล้อม ได้รับคำสั่งจากพ่อให้คุ้มครองอิซาเบลล์ยิ่งชีพ)\n  - **จอมเวทเวียลกริน (Veolgrin)** — ฉายา **‘ผู้ทำลายป้อมปราการ’ (Fortress Destroyer)** ใช้เปลวไฟ/พลังเวทสีเขียวมรกต ย้ายจิตเข้าสิงร่างกัปตันเออร์เนสต์ด้วย ‘เวทย้ายวิญญาณ’ เพื่อตามหามกุฎราชกุมารอเล็กซานเดอร์ตัวจริงและทดสอบอีวาน (เรียกอีวานว่า *กองระวังหลังของพวกเรา*) พร้อมฝากฝังลูกสาวไว้กับอีวาน ลูกสาว: **เอลเฟียรา (Elpheira / Elphira)** (จอมเวทหญิง, จากจักรวรรดิคาลีออน)\n  - **กษัตริย์ไอนาร์ อูลริกส์สัน / ไอนาร์มหาราช (Einar Ulriksson / King Einar the Great / บทที่ 2 เรียกพาลาดินไอนาร์)** ฉายา ‘จอมเชือด’ (Butcher) แห่งอาณาจักรโดรเวียน — ธิดาคนโต: **องค์หญิงเอคไดซิส ไอนาร์สดอตตีร์ (Ecdysis Einarsdotir / ชื่อเล่น: เอซี่ Ecy / บทที่ 2 สะกดว่า Esideth)** สมัครเข้าเรียนวิทยาลัยดุริยางคศิลป์ สาขาออร์เคสตรา (ไวโอลินตระกูล **สตราดิวาเรียส / Stradivarius** ชื่อ **พี่วีโอ / Vio-unnie** ปัจจุบันเป็นรุ่นที่ 3) ของสถาบันเซนต์ยัน (อาชีพคู่: กวีและเบอร์เซิร์กเกอร์) แรงบันดาลใจในการเลือกเล่นไวโอลินมาจากคำแนะนำของ “คุณลุง” ในปาร์ตี้ผู้กล้าเมื่อ 10 ปีก่อน (แท้จริงคือ **อีวาน**) ซึ่งเธอเข้าใจผิดว่าเสียชีวิตในสงครามไปแล้ว\n  - **‘คมดาบเงา’ เอนริเก้ / เอนริเก้ เซอร์เกเยวิช / เซอร์เกเยฟนา (Shadow Blade Enrique / Enrique Sergeyevich / Sergeevna)**: แวมไพร์ระดับตำนานเพศหญิงอายุกว่า 100 ปี ผู้ให้กำเนิดหน่วยเก็บกวาด / ท่านปรมาจารย์ใหญ่ (Grand Master) ขององค์กรนักฆ่า และเป็นอาจารย์ของอีวาน (ไม่ได้เจอกันมา 7 ปี) ปัจจุบันเป็นศาสตราจารย์กิตติมศักดิ์และอาจารย์พิเศษวิชา *[ความเข้าใจในการต่อสู้ระยะประชิด 1]* ของคณะอัศวิน สถาบันเซนต์ยัน มีรอยแผลเป็นรูปกางเขนที่โคนฝ่ามือ ขโมยรูปปั้น “ผู้กล้านิรนาม” จากสวนกลางเฟรเชนกายาไปไว้ในดันเจี้ยนใต้ดินทางตอนใต้ — ศิษย์: **ลูเซีย (Lucia / ชื่อเล่น: ลูซี่ Lucy)** หญิงสาววัยปลายรุ่นผมสีน้ำตาลเข้ม (โจรหรือนักฆ่า, อยู่ในเมืองหลวงคราซิลอฟ, เรียกอีวานว่า *ศิษย์พี่เปโตรวิช*)\n    - สรรพนาม: เอนริเก้ใช้ *ฉัน / นาย* กับอีวาน (อีวานใช้ *ผม / คุณ*)\n  - **นักบุญหญิงแพทริเซีย (Saint Patricia / ชื่อเล่น: แพตตี้ Patty)** — ปีนี้เข้ามาเป็นคณบดีและอาจารย์สอนวิชาเทววิทยา (Theology) ที่สถาบันเซนต์ยัน เป็นผู้ตั้งชื่อและผู้สนับสนุนรายใหญ่ของสถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซีย เรียกอีวานตามชื่อศีลล้างบาปว่า *บราเดอร์ซีริล*\n- **ฮิวโก้ (Hugo)**: หัวหน้ากลุ่มโจรที่รับงานปล้น/ก่อการร้ายรถไฟสาย 12 ถูกอีวานจับเป็นและทรมานด้วยโพชั่นรักษาบาดแผลเพื่อรีดเบาะแส\n- **ฮัน (Han) / มอร์ด เอริกสัน (Mord Erikson / ฮัสคาลผู้แฝงตัว / คุณลุงของเอคไดซิส)**: หนึ่งในพี่น้องร่วมสาบาน (ฮัสคาล) และคนสนิทใกล้ชิดของกษัตริย์ไอนาร์ วัยสี่สิบกว่าปี ที่สอบผ่านข้อเขียนแบบเฉียดฉิวเข้าเป็นนักศึกษาปี 1 วิทยาลัยพลศึกษา (คณะอัศวิน) ของสถาบันเซนต์ยัน และวิ่งเท้าเปล่าตามรถไฟมาตลอด 2 วันเพื่อคุ้มกันเอคไดซิส (พ่ายแพ้ในการประลองกับอีวานและถูกสั่งให้ไปทำงานอาสาสมัครซักผ้าที่สถานเลี้ยงเด็กกำพร้า)\n- **พริสซิลลา (Priscilla)**: ศิษย์เก่าสถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซีย อายุ 17 ปี ไม่มีนามสกุล เด็กกำพร้าสงคราม ถูกลักพาตัวในตรอกมืดของเมืองหลวงโดยกลุ่มของเอนริเก้\n- **อิคารัส (Icarus)**: ปีศาจมีเขา อดีตผู้บัญชาการกององครักษ์จักรวรรดิที่ 6 (6th Imperial Guards) หัวหน้าหน่วยซุ่มโจมตีรถไฟของอิซาเบลล์ มีประสาทตรวจจับทิศทางเสียงปืน พ่ายแพ้ต่ออิซาเบลล์และถูกอีวานสอบปากคำด้วยโพชั่น หลังยอมรับข้อเสนอของอีวานให้ตัดเขาทิ้งเพื่อเริ่มต้นชีวิตใหม่ จึงถูกขึ้นทะเบียนเป็นสมาชิกใหม่ของสถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซีย (อายุ 50 ปี) (ลูกน้องที่ปรากฏชื่อ: **อินอฟ Inoff**)\n- **โอซิป โซเรนอฟ (Osip Sorenov)**: อดีตทหารเกณฑ์รุ่นสุดท้ายจากหน่วยจู่โจมที่ 3 ของหน่วยเก็บกวาดที่รอดชีวิตจากภารกิจสังหารเจ็ดราชามังกร ปัจจุบันเป็นสายลับใต้บังคับบัญชาของดมิทรี เรียกอีวานว่า *ผู้หมวดเปโตรวิช*\n- **ผู้ข้ามมิติปริศนา (เจ้าของหน้าต่างสถานะ / ‘ลูกคนเล็กจอมเสเพล’)**: นักศึกษาหรือบุคคลที่เข้าร่วมพิธีปฐมนิเทศสถาบันเซนต์ยัน รู้เนื้อเรื่องต้นฉบับและมีระบบหน้าต่างสถานะ/เควสต์ เผลอเรียกอีวานว่า “ซานตาคลอส” จนถูกอีวานจับสังเกตได้ว่าเป็นผู้ข้ามมิติและตกเป็นเป้าหมายไล่ล่า\n- **เชอร์โนวิกา (Chernovika)** และ **ซาชา (Sasha)**: อดีตเพื่อนร่วมรบใต้บังคับบัญชาของอีวานที่เสียชีวิตในสงคราม\n- **ยูริ แฟรงก์ (Yuri Frank)** / **อียูริ (Lee Yuri)**: นักศึกษาปี 1 ทุนเต็มจำนวน (ภาคปฏิบัติ) และอันดับ 1 ของคณะอัศวิน สถาบันเซนต์ยัน เป็นเด็กสาวกำพร้าไม่มีพ่อแม่ ฝีมือดาบเหนือกว่าอิซาเบลล์และออสการ์ ใช้ชื่อ “ยูริ” ซึ่งเป็นชื่อผู้ชายในวัฒนธรรมคราซิลอฟ จึงติดรายชื่อผู้ต้องสงสัยว่าเป็นผู้ข้ามมิติของอีวาน — อดีตชาติเป็นนักวาดภาพประกอบชาวเกาหลีใต้ (อายุ 29 ปีตอนข้ามมิติ มาอยู่โลกนี้ได้ 4 ปีแล้ว) ที่ข้ามมิติมาหลังอดนอนส่งงานเกมผู้ใหญ่ *[ฮวีจัก 3 (Huijak 3)]* ของค่ายสถาบันนุงยอก จึงเข้าใจผิดหวาดกลัวอีวานในชุดคนสวน ยูจีน (โกลด์ซัน) และออสวัลด์ (จอมเวทสายสะกดจิต) อย่างสุดขีด\n- **เยฟเกนี โนคอฟ/โนบิคอฟ คารัมจิน (Yevgeni Nokov/Nobikov Karamjin/Karamzin)** / **ยูจีน (Eugene)** / **คิมยูจิน (Kim Yujin)**: นักศึกษาปี 1 คณะเทววิทยา สถาบันเซนต์ยัน บุตรชายคนเล็กของตระกูลดยุกคารัมจิน (ตระกูลขุนนางสายกลาโหม) เป็นผู้ข้ามมิติชาวเกาหลีใต้จากปี 2022 (อายุ 31 ปีตอนอยู่เกาหลี มาอยู่โลกนี้ได้ 4 ปีแล้ว) ที่มาสิงร่างตัวเอกจากนิยายเรื่อง *“นักดาบคลั่งแห่งดัชชีเหนือ”* (*[ไอ้สารเลวอัจฉริยะเพลงดาบแห่งดัชชีเหนือ]*) มีสกิล `[ความเชี่ยวชาญดาบ Lv 5]`, `[สัญชาตญาณขยายขอบเขต Lv 3]`, `[สัญชาตญาณเอาตัวรอด Lv 3]`, `[ฟาดฟันศักดิ์สิทธิ์]` (`[Sacred Strike]`), ช่องสล็อตเวทมนตร์ศักดิ์สิทธิ์ (คิดจะบุกเบิกสายอาชีพ “พาลาดิน” และเคยอวดว่าจะใช้ `[ย่างก้าวขนนก]` ทั้งที่ไม่ใช่สกิลตัวเอง) และหน้าต่างสถานะที่สแกนข้อมูลพื้นฐานนักศึกษาได้ (เจ้าตัวเรียกว่า *แถบห่วยแตก / หอกเฮงซวย*) หลังถูกอีวานจับตัวได้ก็ยอมร่วมมือจัดตั้ง “ชมรมอาสาสมัคร” และเรียกอีวานว่า *ลูกพี่* (ยูริเข้าใจผิดคิดว่ายูจีนเป็นตัวละครสาย *โกลด์ซัน / คิมแทยัง*)\n- **เอิร์นเบิร์ต (Ernbert)**: คณบดีคณะเวทมนตร์ สถาบันเซนต์ยัน เผ่าเอลฟ์จากหมู่เกาะคาลีออน\n- **ออสวัลด์ อีสต์เบลเฟน (Oswald Eastbelfen)** / **พัคแจยอง (Park Jaeyoung)**: นักศึกษาปี 1 วิชาเอกเวทมนตร์จิตใจ (Mind Sorcery) คณะเวทมนตร์ บุตรชายคนรองของตระกูลไวส์เคานต์อีสต์เบลเฟน (บิดาเป็นองคมนตรีคนปัจจุบันแห่งคาลีออน) เป็นผู้ข้ามมิติชาวเกาหลีใต้ (อายุ 27 ปีตอนอยู่เกาหลี มาอยู่โลกนี้ได้ 4 ปีแล้ว ข้ามมิติมาในเดือนพฤษภาคม ปี 2023 เคยอ่านนิยายเรื่อง *[อัจฉริยะเวทมนตร์ผู้ถูกนางร้ายคลั่งไคล้เวทมนตร์ตามหลอกหลอน]* ไม่ถึง 30 ตอนแล้วเททิ้ง) ถูกอีวานจับพิรุธได้เพราะใช้คำสุภาพเกินวิสัยเอลฟ์ เพิ่งหย่าร้างกับอดีตคู่หมั้น มีเวทมนตร์จิตใจอย่าง `[ประทานความกล้า]` (`[Grant Courage]`), `[ชี้นำปัญญา]` (`[Wisdom Guidance]`) และ `[จิตเภท]` (`[Schizophrenia]`)\n- **เอเวอลิน รัสต์ฟิสต์ (Evelyn Rustfist)**: บุตรสาวของประธานสภาองคมนตรีและตระกูลดยุกรัสต์ฟิสต์แห่งคาลีออน อดีตคู่หมั้นตั้งแต่กำเนิดที่เพิ่งหย่าร้างกับออสวัลด์ แต่กลับมีความลุ่มหลงยึดติดในตัวออสวัลด์อย่างผิดปกติ\n- **เออร์เนสต์ (Ernest / บทที่ 33 สะกด Onerst)** และ **เซอร์เวลเชสต์ (Sir Veilchest)**: เชื้อพระวงศ์/กัปตันเรือ และนายทหารฝ่ายเทคนิคประจำเรือเหาะ/เรือประจัญบานลอยฟ้าชั้น **“วูล์ฟสทาล” (“Wolfstal”-class)** นาม **“เกียรติภูมิแห่งบอยล์” (“Glory of Boil”)** ของคาลีออนที่ขัดข้องจนลอยค้างเหนือสถาบันเซนต์ยัน\n- **ลิลี ดาวเนอร์ (Lily Downer)** และ **มารี ฟิลลิปสัน (Marie Phillipson)**: นักศึกษาปี 2 คณะอัศวิน (เลเวล 32 และ 29 ตามลำดับ) ที่ยูจีนใช้หน้าต่างสถานะสแกนทดสอบให้อีวานดู\n\n- **นิโคไล สโลโบดาโนวิช รยูริก (Nikolai Slobodanovich Ryurik)**: ทูตผู้มีอำนาจเต็มจากกระทรวงการต่างประเทศของคราซิลอฟที่เดินทางมาเจรจาลับกับเรือเหาะคาลีออน ถูกเวียลกรินเค้นถามที่อยู่ของอเล็กซานเดอร์แล้วสังหารทิ้ง\n- **ศาสตราจารย์โรเบิร์ต เซนนาร์ เดอ มอนดรังกี (Robert Sennar de Mondrangi)**: อาจารย์ประจำชั้นปีที่ 2 คณะอัศวิน สถาบันเซนต์ยัน มาจากราชอาณาจักรทิลีส (เคยสังกัดหน่วยราชองครักษ์) มีนิสัยเย่อหยิ่งและดูถูกสามัญชน เคยไล่ตะเพิดอีวานจนโดนเอนริเก้แผ่จิตสังหารขู่\n- **อาแลง (Alain)**: นักศึกษาปี 1 คณะอัศวิน จากทิลีส จับกลุ่ม 5 คนในการสอบ [การรับมือการซุ่มโจมตี] ก่อนถูกอิซาเบลล์ดักเล่นงาน\n- **แพทริก (Patrick)**: นักศึกษาปี 1 คณะอัศวิน ที่ถูกออสการ์ชิงลูกแก้วไปแล้วติดอยู่ใต้โพรงอุโมงค์หลังพื้นป่าถล่ม ได้รับลูกแก้วสำรองและความช่วยเหลือจากอีวาน\n- **‘นักถักทอใย’ แห่งกองทัพมังกรที่ 5 (The 5th Dragon Corps, ‘Webmaker’)**: แม่ทัพมังกรฝ่ายจอมมารที่มีรูปแบบการขุดอุโมงค์และสร้างแรงสั่นสะเทือนรูปใยแมงมุมซึ่งอีวานเคยพบใน **สงครามกังโด (Gangdo War)**\n- **ร้อยโทอาวุโสอัสเตอร์ก (Senior Lieutenant Asturk)**: ผู้บังคับกองพันที่ 3 ภายใต้หน่วยทหารช่าง ‘นักถักทอใย’ แห่งกองพลน้อยมังกรที่ 5 (ระดับเทียบเท่าผู้บัญชาการกองพันหนึ่งพันนาย) นำกองกำลังคนแคระเข้าล้อมอิซาเบลล์ในโพรงอุโมงค์ใต้ดิน\n- **วิชา ‘ผ่าเกราะคนแคระ’ (‘Dwarf Armor Splitting’)**: ยุทธวิธีที่อีวานคิดค้นขึ้นสมัยมียศร้อยเอกในกองทัพ ใช้ดาบเจาะข้อต่อเกราะคนแคระควบคู่กับกริชและปืนพกท่ามกลางความมืด\n- **สงครามเหมืองแร่ (Mine War)**: สมรภูมิในอดีตเมื่อ 10 ปีก่อนที่อีวานและสหายเคยสู้กับทหารองครักษ์คนแคระในโถงทางเดินแคบใต้ดิน\n- **ดิโอนาร์ เอริกสัน (Dionar Eriksson)**: หนึ่งใน **ฮัสคาล (Huscal)** และตัวเต็งผู้สืบทอดของกษัตริย์ไอนาร์ (เรียกมอร์ดว่าพี่ชาย) ที่หักหลังเดินทางมายังเฟรเชนกายาเพื่อลักพาตัวเอคไดซิสและเป็นหัวหน้าหน่วยปฏิบัติการฝ่ายปฏิวัติ/ก่อการร้าย (ภูมิหลัง: บิดาเคยเป็นทาสติดที่ดิน)\n- **อานี (Mr. Ani)**: สมาชิกกลุ่มกบฏที่คอยรับรายงานการเฝ้าจับตาบ้านพักของอิซาเบลล์ ก่อนถูกอีวานสะกดรอยและจับตัวสอบปากคำ\n- **ฤดูใบไม้ผลิของปวงชน (A spring for the citizens)**: องค์กรกบฏข้ามชาติที่ชูคำขวัญปฏิวัติประชาธิปไตย (*“ขุนพลเพียงหนึ่งคนและดาบเพียงหนึ่งเล่ม มิอาจครอบครองอำนาจเหนือคนหมู่มากได้”*) เพื่อลอบสังหารทายาทปาร์ตี้ผู้กล้า โดยมีมกุฎราชกุมารอเล็กซานเดอร์อยู่เบื้องหลัง\n\n## สถานที่และองค์กร\n- **อาณาจักรคราซิลอฟ (Krasilov Kingdom)** — เมืองหลวง: **เฟรเชนกายา (Frechenkaya)** อาณาจักรที่อีวานอาศัยอยู่และเอลิซาเวตาดำรงตำแหน่งอัครมหาเสนาบดี มี **สวนสาธารณะกลางเฟรเชนกายา (Frechenkaya Central Garden)** ซึ่งเคยตั้งรูปปั้นอนุสรณ์ของ **พระเจ้าอีวานมหาราช (King Ivan the Great)** (“ผู้กล้าผู้เดินทัพ”, “เทพีแห่งชัยชนะ”, และ “ผู้กล้านิรนาม”) และมี **พระราชวังตะวันออก (East Palace)** ที่ประทับของเอลิซาเวตาซึ่งสร้างสวนอนุสรณ์สถานปลูกดอกไม้ที่เหล่าทหารผู้ล่วงลับชื่นชอบไว้ด้วย\n- **อาณาจักรโดรเวียน (Drovian Kingdom)**: อาณาจักรบ้านเกิดของไอนาร์และองค์หญิงเอคไดซิส เชื่อมต่อกับคราซิลอฟผ่านทางรถไฟสายที่ 12 (อดีตปกครองด้วยผู้นำชนเผ่า ‘ยาร์ล’ และมีกองกำลังองครักษ์ ‘เกชิน / ฮัสคาล’)\n- **อาณาจักรทิลีส (Tyllese Kingdom)**: อาณาจักรเพื่อนบ้านของคราซิลอฟ บ้านเกิดของอิซาเบลล์และออสการ์ เมืองหลวง: **เซนต์มาทิลด์ (St. Mathilde)** มี **กองพลรักษาการณ์ที่ 3 แห่งทิลีส (Tyllese's 3rd Guard Division)** ประจำแนวชายแดนตะวันตกเฉียงเหนือ (ฝั่งคราซิลอฟมี **กองพลป้องกันชายแดนคราซิลอฟ**, **กองบัญชาการป้องกันเฟรเชนกายา**, และเขต **ป่าสนคราเชนรอฟ (Kraschenrov)**)\n- **จักรวรรดิคาลีออน (Kalion Empire)**: จักรวรรดิบนเกาะอีกฟากของ **ทะเลดำ (Black Sea)** อาณาเขตของจอมเวทเวียลกรินและเอลเฟียรา\n- **สถานีอิกอเรวิชี / อิกอรอวิช (Igorevichi / Igorovich Station)**: สถานีรถไฟใกล้ชายแดนโดรเวียน–คราซิลอฟ ก่อนเข้าเขตทหารสามเขต\n- **สถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซีย (St. Basilicia Orphanage)**: สถานเลี้ยงเด็กกำพร้าสำหรับเด็กกำพร้าจากสงครามใกล้นครหลวง ก่อตั้งโดยอีวาน\n- **สถาบันเซนต์ยัน (St. Jan's Academy)**: สถาบันการศึกษานานาชาติชื่อดังแห่งสหราชอาณาจักร ก่อตั้งขึ้นในช่วงสงคราม ไม่จำกัดอายุผู้เข้าเรียน (ประกอบด้วยวิทยาลัยดุริยางคศิลป์ / Music College, วิทยาลัยพลศึกษา / Athletic College, คณะอัศวิน / Knight Department, คณะเทววิทยา / Theology Department ซึ่งดูแลโดยท่านนักบุญหญิง, และคณะเวทมนตร์ / Magic Department ซึ่งดูแลโดยเหล่าเอลฟ์แห่งคาลีออน)\n- **หน่วยควบคุมเขตฟื้นฟูและพิสูจน์ฝ่ายศัตรู (Restoration Zone Control and Enemy Faction Identification Unit)** / **หน่วยเก็บกวาด / หน่วยกวาดล้าง (Cleanup Unit / Eradication Unit)**: หน่วยเฉพาะกิจที่อีวานสังกัดช่วงสงคราม ทำหน้าที่เก็บกวาดพื้นที่หลังปาร์ตี้ผู้กล้าสังหารผู้นำศัตรู\n- **หมวดทหารช่างที่ 7 กองพันที่ 3 กองร้อยที่ 12 (ภายใต้การบังคับบัญชาของแม่ทัพมังกรที่ 5)**: หน่วยคนแคระฝ่ายจอมมารที่ลอบขุดอุโมงค์ซุ่มโจมตีในป่าทางตะวันออกของเฟรเชนกายาเพื่อเตรียมเล่นงานนักศึกษาในวันสอบวิชาของเอนริเก้\n- **สหราชอาณาจักร (United Kingdoms — 12 ชาติ)** และระบบข่าวกรองของ 4 มหาอำนาจ: **โดรเวียน** (ใช้การทรมานสังเวยธาตุทั้ง 4), **คาลีออน** (เอลฟ์ใช้เวทมนตร์จิตใจและการผูกมิตร), **ทิลีส** (ถามตรงๆ หากไม่ตอบก็ท้าดวล), และ **คราซิลอฟ** (จากรุ่นก่อนอย่าง **‘เหล่าบุตรแห่งเอนริเก้’ / Enrique’s Children** สู่ **หน่วยเก็บกวาด** และ **กองบัญชาการข่าวกรองคราซิลอฟ** ที่ใช้จารกรรมสมัยใหม่)\n- **สุสานแห่งชาติคราซิลอฟแห่งเฟรเชนกายา (Krasilov National Cemetery of Frechenkaya)**: สถานที่ที่เอคไดซิสเข้าใจว่าอัฐิของ “คุณลุง” (อีวาน) ถูกนำไปฝังไว้หลังสงครามจอมมาร\n- **สถานที่เป้าหมายเหตุระเบิดนครหลวงเฟรเชนกายา (บทที่ 50)**: **ธนาคารกลางเฟรเชนกายา (Frechenkaya Central Bank)**, **โรงละครทรงกลมซาเทรา (Satera Circular Theater)**, **สถาบันเซนต์ยัน**, **มหาวิหารเซนต์เชเรห์ตา (Cathedral of Saint Cherehta)**, และ **สถานีตำรวจกลางพราเชนโกเหนือ (North-Prachenko Central Police Station)**\n- **กองพลรักษาการณ์นครหลวง (Capital Guard Division)** และ **กองบัญชาการต่อต้านข่าวกรอง (Counterintelligence Headquarters)**: สองขุมกำลังหลักในเมืองหลวง โดยกองพลรักษาการณ์นครหลวงตกอยู่ใต้อิทธิพลของมกุฎราชกุมารอเล็กซานเดอร์และลอบปล่อยคนแคระเข้าเมือง ส่วนกองบัญชาการต่อต้านข่าวกรองขึ้นตรงต่อเอลิซาเวตา (ดมิทรีดำรงตำแหน่งพันโท)\n- **ทำเนียบกระทรวงการต่างประเทศ (Ministry of Foreign Affairs Residence)**: อาคารที่พำนักและปฏิบัติงานของกระทรวงการต่างประเทศคราซิลอฟซึ่งมกุฎราชกุมารอเล็กซานเดอร์เป็นเจ้ากระทรวง ถูกใช้เป็นสถานที่กักขังทายาทปาร์ตี้ผู้กล้าและหลบซ่อนของดิโอนาร์ (บทที่ 54)\n\n## คำศัพท์เฉพาะ\n- **ดูแคต (Ducat)**: สกุลเงิน (เงินเดือนทหารเกณฑ์ 15 ดูแคตจากเขตตะวันออก)\n- **บทวิจารณ์ 5,700 ตัวอักษร (5,700-character critique)**: เงื่อนไข/มุกการข้ามมิติของชาวเกาหลีใต้ (เขียนวิจารณ์ยาวๆ จนนักเขียนตอบโต้ว่า \"งั้นลองมาทำเองดูสิ\")\n- **วันเปิดภาคเรียนมานลิตา (Manlita opening day)**: วันเปิดภาคเรียนของสถาบันเซนต์ยัน\n- **ทัณฑ์อินทรีโลหิต (Blood Eagle)**: โทษประหาร/ธรรมเนียมโหดของชาวโดรเวียน\n- **การตรวจจับแนววิถีกระสุน (Line of Fire Detection)** และ **จิตสังหาร (‘life’)**: ความสามารถของยอดฝีมือในการสัมผัสจิตสังหารและวิถีกระสุน/ลูกธนู ทำให้ปืนและธนูไร้ผลกับผู้แข็งแกร่ง\n- **ยาร์ล (Yals) / เกชิน (Geshins) / ฮัสคาล (Huscals)**: ผู้นำชนเผ่าและเหล่านักรบองครักษ์ผู้ภักดีของโดรเวียนที่ไม่รับเงินหรือที่ดิน มีสถานะเสมือนพี่น้องร่วมสาบานของกษัตริย์ไอนาร์\n- **ผู้ปีนหอคอยจอมมาร (Climber of Demon King’s Tower)** และ **“ผู้ที่ถูกดึงตัวมา” (“Those who were drawn”)**: นิยามของคนต่างโลกที่ปรากฏตัวขึ้นในช่วงที่โลกปั่นป่วน (เช่น แม็กซิมิเลียนและอีวาน) โดยเอนริเก้เคยเข้าใจผิดคิดว่าอีวานก็เป็นผู้ปีนหอคอยจอมมารเช่นเดียวกับคนอื่นๆ ในกลุ่ม\n- **การกำหนดตำแหน่งด้วยเสียงสะท้อน (Resonance Positioning)**: เทคนิคการรับฟังคลื่นเสียงความถี่สูงที่สะท้อนภายในพื้นที่ปิดเพื่อประเมินระยะทางและตำแหน่งของวัตถุหรือศัตรูคล้ายค้างคาว ซึ่งอีวานนำมาใช้ร่วมกับการตรวจจับแนววิถีกระสุนขณะปฏิบัติการในที่มืด\n- **ชมรมอาสาสมัคร (Volunteer Club)**: ชื่อชมรมอย่างเป็นทางการที่อีวานแอบตั้งให้กลุ่มผู้ข้ามมิติทั้ง 4 คน (ขณะที่ยูจีนอยากตั้งชื่อว่า *กลุ่มผู้รักชาติเกาหลี / Korean Patriots*)\n- **‘เวทย้ายวิญญาณ’ (‘Soul Transfer Spell’)** และ **‘ผู้ก้าวข้ามขีดจำกัด’ (‘Transcendent’)**: เวทมนตร์ที่เวียลกรินผนึกไว้ในลูกแก้วให้เออร์เนสต์กดเพื่อย้ายจิตมาสิงร่างชั่วคราว และระดับฝีมือของยอดฝีมือที่รับรู้ห้วงเวลาเป็นหน่วยไมโครวินาทีได้\n- **การแยกส่วนห้วงเวลา (Temporal Dissociation)**: เทคนิคการใช้พลังเวทแทรกแซงระบบประสาทเพื่อเร่งความเร็วในการส่งสัญญาณให้ก้าวข้ามขีดจำกัดร่างกายมนุษย์ (ประสาทหู 0.1 วินาที, ประสาทสัมผัส 0.25 วินาที) ซึ่งเป็นประตูสู่ระดับ ‘ผู้ก้าวข้ามขีดจำกัด’\n- **ขอบเขตของผู้เหนือมนุษย์ (Realm of the Superhuman)**: การฝึกฝนถ่ายเทพลังเวทเสริมความแข็งแกร่งให้ระบบประสาทและบังคับปลุกประสาทสัมผัสถึงขีดสุด จนเกิดผัสสะเชื่อมโยงสามารถมองเห็น ‘รอยกลิ่น’ ในอากาศเป็นแสงเรืองรองได้\n- **เครื่องขุดเจาะทลายปฐพี (Earthbreaker Excavator)**: ยุทโธปกรณ์ขุดเจาะอุโมงค์ขนาดใหญ่ของกองทัพหลักฝ่ายขุดเจาะเผ่าคนแคระซึ่งเคยถูกปาร์ตี้ผู้กล้าทำลายไปในสงครามจอมมารครั้งก่อน ทว่ากลับถูกนำมาใช้อีกครั้งในการบุกจู่โจมใต้ดินนครหลวงเฟรเชนกายา (บทที่ 53)\n",
  "story_memory": "# 🧠 เรื่องย่อสะสมแต่ละตอน — 30 ปีผ่านไปนับจากบทนำ (30 Years Have Passed Since the Prologue)\n\n- **บทที่ 1**: คิมซอนอูข้ามมิติมาเกิดใหม่ในร่างเด็กชายชาวนาชื่อ **อีวาน เปโตรวิช** โดยไม่มีหน้าต่างสถานะหรือความรู้เกี่ยวกับเรื่องราวของโลกใบนี้ เมื่ออายุ 14 ปี พ่อถูกเกณฑ์ไปรบและเสียชีวิต อีวานจึงสมัครเป็นทหารเพื่อส่งเงินให้แม่ เขาไต่เต้าจากทหารเกณฑ์จนได้เป็นทหารประจำการและเข้าสังกัด **หน่วยเก็บกวาด** ร่วมค่ายเดียวกับปาร์ตี้ผู้กล้า จนกระทั่งปราบจอมมารได้เมื่ออายุ 30 ปี แต่ฉากจบก็ไม่มาเสียที จึงปลดประจำการตอนอายุ 32 ปีมาเปิดสถานเลี้ยงเด็กกำพร้า จนอายุ 34 ปี (ครบ 30 ปีที่ข้ามมิติ) มีแขกจากวังหลวงมาหา ทำให้เขาเพิ่งรู้ตัวว่าโลกนี้อาจจะกำลังเข้าสู่แนว **สถาบันการศึกษา**\n- **บทที่ 2 (ทหารแก่ก็ต้องการพักผ่อน)**: นายทหารรุ่นน้องจากหน่วยเก่าลอบมาพบอีวานที่สถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซีย พร้อมอัญเชิญจดหมายประทับตราขี้ผึ้งรูปดอกเบญจมาศจาก **เอลิซาเวตา คิริลลอฟนา คราซิลอฟ** (อดีตผู้บังคับบัญชา ฉายา “ริซ่าแห่งเหล็กกล้า” ปัจจุบันเป็นองค์หญิงและอัครมหาเสนาบดี) ในจดหมายขอร้องให้ \"วันก้า\" กลับมาช่วยดูแล \"สวน\" ที่กำลังเสื่อมโทรมท่ามกลางวิกฤตการเมืองที่มกุฎราชกุมารอเล็กซานเดอร์คิดขายชาติ รุ่นน้องเปิดเผยว่าปีนี้บรรดาลูกหลานและศิษย์ของสมาชิกปาร์ตี้ผู้กล้า รวมถึงตัวนักบุญหญิงแพทริเซียเอง ต่างพากันเข้ามาเรียนและสอนที่ **สถาบันเซนต์ยัน** อีวานจึงถูกส่งเข้าไปเป็น \"คนสวน\" เพื่อคอยคุ้มครองและจับตาดูคนเหล่านั้นไม่ให้เกิดเรื่องลุกลามเป็นสงครามระหว่างประเทศ อีวานจำใจรับพระบัญชา โดยหวังว่าอดทนอีกแค่ 3 ปีคงจะได้เห็นฉากจบเสียที\n- **บทที่ 3**: อีวานขุดคุ้ยความทรงจำของคิมซอนอูเพื่อวิเคราะห์สูตรสำเร็จของนิยายแนวสถาบันการศึกษา (ทั้งปีศาจแอบแฝง คนทรยศในคณาจารย์ ห้องลับ สายลับรัฐบาล และเงื่อนไขฉากจบที่อาจเป็นการคืนชีพของจอมมาร) เขาฟันธงว่า \"รถไฟรับนักเรียนเข้าสถาบัน\" จะต้องโดนก่อการร้ายแน่นอน ฝั่งอาณาจักรโดรเวียน **องค์หญิงเอคไดซิส** ธิดาของกษัตริย์ไอนาร์ (ผู้สอบติดสาขาออร์เคสตรา สถาบันเซนต์ยัน) ขึ้นรถไฟออกเดินทางก่อนใคร สองวันต่อมารถไฟขบวนนั้นก็ตกรางใกล้ชายแดนคราซิลอฟ อีวานจึงคว้าปืนพกและขวานออกปฏิบัติการทันที\n- **บทที่ 4**: อีวานวิเคราะห์เส้นทางรถไฟสาย 12 ร่วมกับรุ่นน้อง (**ดมิทรี เชอร์คาตอฟ**) และฟันธงว่าจุดก่อการร้ายจะอยู่ที่ **สถานีอิกอเรวิชี** ใกล้ชายแดนก่อนเข้าสู่เขตทหารสามเขตของคราซิลอฟ เพื่อป้ายความผิดและสร้างรอยร้าวระหว่างคราซิลอฟกับโดรเวียน อีวานขึ้นรถไฟมุ่งหน้าไปชายแดนเพียงลำพังเพื่อคุ้มกันทั้ง 5 เส้นทาง ขณะเดียวกัน ดมิทรีกลับไปรายงาน **เอลิซาเวตา** (อัครมหาเสนาบดี) ที่พระราชวัง ซึ่งเธอสั่งให้ดมิทรีส่งคนติดตามบันทึกกิจวัตรประจำวันของวันก้าไว้ตลอดเวลา เมื่อสายลับของดมิทรีไปถึงสถานีอิกอเรวิชี พวกเขาก็พบเพียงถุงใส่ศพ 3 ใบที่ห่อไว้อย่างเรียบร้อยและสถานที่เกิดเหตุที่ถูกเช็ดคราบเลือดจนสะอาด ส่วนอีวานกำลังวิ่งลัดเลาะป่าพร้อมขวานในมือ\n- **บทที่ 5**: ที่สถานีอิกอรอวิช อีวานสังเกตเห็นชายต้องสงสัย 3 คน (คนดูนาฬิกา-หนังสือพิมพ์, คนแกล้งหลับ, และพ่อค้าผักเหี่ยว) เมื่อทดสอบด้วยคำถามรหัสความภักดีแล้วพบว่าเป็นแค่ทหารรับจ้างไร้ฝีมือตรวจจับแนววิถีกระสุน อีวานจึงสังหารทั้ง 3 คนและรีดข้อมูลจากพ่อค้าผักก่อนฆ่าทิ้งจนรู้ว่ามีโจรอีก 15 คนดักปล้น \"รถไฟขนทองคำแท่ง\" อยู่ริมราง อีวานลบร่องรอยใน 5 นาทีและสะกดรอยตามสัญญาณเวทมนตร์ไป โดยตั้งใจปล่อยให้เหตุการณ์ก่อการร้ายรถไฟซึ่งเป็น \"ด่านฝึกสอนของตัวเอกทุกคน\" ดำเนินไป แต่ตัวเองจะคอยเก็บกวาดเบื้องหลังและสาวถึงตัวบงการแทน\n- **บทที่ 6**: หัวหน้าโจร **ฮิวโก้** กดจุดระเบิดทำให้รถไฟที่เอคไดซิสโดยสารมาตกรางก่อนถึงสถานีอิกอรอวิช อีวานซุ่มยิงเก็บลูกสมุน 5 คนที่อยู่แนวหลังได้อย่างเฉียบขาดและจับเป็นฮิวโก้เพื่อทรมานรีดเบาะแสเกี่ยวกับผู้จ้างวาน (ไม่ฆ่าเพราะกะเก็บไว้เป็นบอสฝึกสอนให้ตัวเอก) บนรถไฟ **องค์หญิงเอคไดซิส** ฟื้นขึ้นมาและคว้าไวโอลินขึ้นมากำด้ามราวกับขวานเตรียมสู้ ขณะเดียวกันที่ชายป่า นักรบ **ฮัสคาล** วัยสี่สิบกว่าปีซึ่งเป็น \"คุณลุง/พี่น้องร่วมสาบาน\" ของกษัตริย์ไอนาร์ (และแอบสอบเข้าเป็นนักศึกษาปี 1 วิทยาลัยพลศึกษาของสถาบันเซนต์ยันไว้ล่วงหน้า) ที่วิ่งเท้าเปล่าตามรถไฟมาตลอด 2 วัน เห็นรถไฟตกรางจึงพุ่งทะยานฝ่าป่าเข้าไปช่วยหลานสาวทันที\n- **บทที่ 7**: อีวานใช้วิธีสอบปากคำแบบยั่งยืนด้วยการราดโพชั่นรักษาบาดแผลสลับกับซักถามฮิวโก้ แต่ไม่พบเบาะแสเพิ่มเนื่องจากพวกโจรใส่เสื้อโค้ตหนาและใช้เวทมนตร์ปิดบังตัวตน ทันใดนั้น **ฮัน (คุณลุงฮัสคาล)** พุ่งเข้ามาปะทะกับอีวานด้วยขวานเพราะเข้าใจผิดว่าอีวานเป็นพวกเดียวกับโจร ฝั่งเอคไดซิสใช้ไวโอลินคู่ใจ (\"พี่วีโอ\") ฟาดหัวโจรจนไวโอลินพังยับและทำให้พวกโจรที่เหลือวิ่งหนีตายออกมาเจอทั้งสองคน เมื่อเอคไดซิสปรากฏตัวปลอดภัยดี อีวานจึงถอนตัวกลับไปส่งรายงานเข้ารหัสให้ราชสำนัก ส่วนฮันที่จำวิชาขวานของไอนาร์ได้ก็นึกสงสัยว่าอีวาน (‘ตัวสำรองผู้กล้า’ ที่ลือว่าตายไปเมื่อ 2 ปีก่อน) ยังมีชีวิตอยู่และสังกัดหน่วยข่าวกรอง จึงพาเอคไดซิสบังคับพวกโจรแบกแคร่หามเดินทางต่อสู่เมืองหลวง\n- **บทที่ 8**: อีวานตรวจเช็กกำหนดการเดินทางของทายาทปาร์ตี้ผู้กล้าคนอื่นๆ (อิซาเบลล์และออสการ์จากอาณาจักรทิลีส, เอลเฟียราจากจักรวรรดิคาลีออนทางเรือ, และลูเซียที่อยู่ในเมืองหลวงแล้ว) และกลับมานั่งพักผ่อนที่สถานเลี้ยงเด็กกำพร้ากับเด็กๆ ที่ชอบเล่นเกมแอบย่องเข้าหาเขา ทว่า **พริสซิลลา** ศิษย์เก่าอายุ 17 ปีถูกลักพาตัวไปในตรอกมืดของเมืองหลวง **เฟรเชนกายา** เมื่อเธอเอ่ยชื่ออีวานขู่พวกนักเลง **‘คมดาบเงา’ เอนริเก้** (อาจารย์ของลูเซียและผู้ก่อตั้งหน่วยเก็บกวาด) ก็บังเอิญมาได้ยินและเข้าใจผิดคิดว่าอีวานแอบฝึกเด็กกำพร้าเป็นหน่วยนักฆ่าลับหลังตน เอนริเก้จึงฝากเสื้อโค้ตที่มีรอยประทับมือเป็นแผลเป็นรูปกางเขนส่งกลับมาเพื่อเรียกตัวอีวานไปพบ\n- **บทที่ 9**: อีวานแกะรอยไปยังดันเจี้ยนใต้ดินทางตอนใต้ของเฟรเชนกายา ซึ่งเป็นที่ซ่อนรูปปั้น “ผู้กล้านิรนาม” ที่เอนริเก้ขโมยมาจากสวนกลางเมืองหลวง และได้พบหน้า **เอนริเก้** (แวมไพร์หญิงระดับตำนานและอดีตอาจารย์ของเขาที่ไม่เจอกัน 7 ปี) ทั้งสองฝ่ายต่างระแวงและเข้าใจผิดกันไปคนละทาง: เอนริเก้คิดว่าอีวานแอบตั้งองค์กรนักฆ่าแข่งในถิ่นเธอและส่งคนมาประกาศสงคราม ส่วนอีวานก็ระแวงว่าเอนริเก้แปรพักตร์ไปเข้าข้างมกุฎราชกุมารอเล็กซานเดอร์ ทั้งคู่ต่างแลกเปลี่ยนวาทะเชิงหยั่งเชิงท่ามกลางความเข้าใจผิดในช่วงกลางเดือนมกราคม\n- **บทที่ 10**: อีวานยอมอ่อนข้อก่อนและเอ่ยถึง **ลูเซีย** ลูกศิษย์ของเอนริเก้ที่จะเข้าเรียนสถาบันเซนต์ยัน ทำให้เอนริเก้ยิ่งเข้าใจผิดว่าอีวานเอาลูกศิษย์มาข่มขู่ ก่อนจะเรียกลูเซียออกมาแนะนำตัว (ลูเซียเปิดเผยทัศนคติสุดหัวก้าวหน้าเรื่อง ‘มนุษยธรรม’ จนอีวานทึ่ง) เมื่อบรรยากาศตึงเครียดถึงขีดสุด ทั้งคู่จึงได้ปรับความเข้าใจกันจนรู้ว่าต่างฝ่ายต่างไม่ได้เข้าข้างอเล็กซานเดอร์ และพริสซิลลาฝึกซุ่มโจมตีจากการละเล่นในสถานเลี้ยงเด็กกำพร้าเอง ส่วนอีวานได้รับภารกิจจากเอลิซาเวตาให้ช่วยอารักขาเอนริเก้และศิษย์ หลังแยกจากเอนริเก้และพาพริสซิลลากลับมาอย่างปลอดภัย เธอถามด้วยน้ำตาว่าเขาจะจากไปใช่ไหม อีวานจึงเผลอบอกไปว่าเขากำลังจะไป **สถาบันเซนต์ยัน** ส่งผลให้ชาวสถานเลี้ยงเด็กกำพร้าบาซิลิเซียทุกคนพากันคร่ำเคร่งเตรียมตัวสอบเข้าสถาบันเซนต์ยันกันยกใหญ่\n- **บทที่ 11**: ย้อนความทรงจำสมัยสงครามที่ **แม็กซิมิเลียน** เคยตวัดดาบ ‘ฟันผ่าท้องฟ้า’ และ **ไอนาร์** จามภูเขาทั้งลูกจนปาร์ตี้ผู้กล้าต้องวิ่งหนีฝูงไวเวิร์นกันหัวซุกหัวซุน ก่อนตัดกลับมาที่ปัจจุบันในอีก 2 สัปดาห์ต่อมา อีวานต้องเดินทางไปที่เมืองหลวง **เซนต์มาทิลด์** ของ **อาณาจักรทิลีส** พร้อมกับสายลับมือใหม่จากกองบัญชาการข่าวกรอง 5 คนที่ **ดมิทรี** ส่งมาประกบ (ด้วยความสงสัยว่าอีวานมีเครือข่ายลับ) อีวานจึงอบรมสั่งสอนพวกสายลับแบบเข้มงวดตลอด 18 ชั่วโมงก่อนปล่อยให้พวกนั้นไปคุ้มครอง **ออสการ์** ส่วนตัวเองแยกตัวมาขึ้นรถไฟขบวนเดียวกับ **อิซาเบลล์** (ลูกสาวผู้กล้าแม็กซิมิเลียน) ซึ่งกำลังน้อยใจที่พ่อไม่มาส่งและไล่ตะเพิด **ออกัสตัส** อัศวินองครักษ์ที่คอยยิ้มเอาใจอย่างไร้ความจริงใจ\n- **บทที่ 12**: รถไฟจากทิลีสมุ่งหน้าคราซิลอฟแล่นผ่านจุดซุ่มโจมตีที่คาดการณ์ไว้ถึง 3 จุดอย่างสงบจนอีวานเริ่มสติแตกและวิตกกังวลว่าตัวเองอาจเดาแนวเรื่องผิดและโลกนี้ไม่มีฉากจบ ทำให้จิตสังหารแผ่ซ่านออกมาจนคนข้างๆ แทบขาดใจ ทว่าจังหวะที่รถไฟแล่นออกจากอุโมงค์ขึ้นสะพานเหนือหุบเขา สะพานก็ถูกระเบิดถล่มจนรถไฟตกราง อีวานจึงสงบใจลงและรีบไต่ขึ้นซากรถไฟเพื่อเข้าช่วยเหลือ ด้าน **อิซาเบลล์** ฟื้นขึ้นมาในตู้โดยสารที่ถูกดินกลบและพบว่า **ดิอัน ออกัสต์ (ออกัสตัส)** อัศวินองครักษ์ยอมเอาตัวรับแรงกระแทกปกป้องเธอจนบาดเจ็บสาหัส ออกัสต์เปิดเผยว่าแม้จะไม่ชอบนิสัยเธอ แต่การมีอยู่ของเธอในฐานะทายาทผู้กล้าคือความหวังของการฟื้นฟูยุคสมัยใหม่ ทันใดนั้นอีวานก็ขุดดินทะลุเข้ามาช่วยและหยิบโพชั่นรักษาบาดแผลออกมาช่วยชีวิตออกัสต์ไว้\n- **บทที่ 13**: ฤทธิ์เจ็บปวดของโพชั่นทำให้เซอร์ดิอัน ออกัสต์ ช็อกจนสติย้อนวัยกลับเป็นเด็กชั่วคราว อีวานจึงให้อิซาเบลล์แบกออกัสต์ออกไปรวมตัวกับผู้รอดชีวิตที่เหลืออีก 10 คนและก่อกองไฟรอ ส่วนตัวเองแยกออกไปในป่ามืดเพื่อเปิดฉากซุ่มโจมตีหน่วยเก็บกวาดใส่ศัตรูที่โอบล้อมอยู่รอบภูเขาก่อน ทันทีที่ได้ยินเสียงปืนนัดแรกของอีวาน ออกัสต์ที่เพิ่งได้สติคืนมาก็ได้ถ่ายทอดคำสอนวิถีอัศวินโบราณบทสุดท้ายให้กับอิซาเบลล์ว่าให้จับดาบเพื่อความเที่ยงธรรมและยืนหยัดในจุดเดียวกับผู้อ่อนแอ ทำให้อิซาเบลล์ตั้งปณิธานได้สำเร็จ\n- **บทที่ 14**: อีวานใช้กลยุทธ์กองโจรของหน่วยเก็บกวาดซุ่มยิงและฟันสังหารกำลังพลราว 50 คนของฝ่ายศัตรูทีละจุด พร้อมทั้งวางกับดักด้ายผูกไกปืนกับศพเพื่อปั่นประสาทหน่วยบัญชาการศัตรู จน **อิคารัส** (ปีศาจมีเขา อดีตผู้บัญชาการกององครักษ์จักรวรรดิที่ 6) จับไต๋ได้ว่าผู้ลอบโจมตีมีเพียงคนเดียวและกำลังล่อให้พวกตนแตกแถว อิคารัสจึงสั่งลูกน้องไปรุมจัดการอีวานในป่า ส่วนตัวเองมุ่งหน้าไปเผชิญหน้ากับอิซาเบลล์ที่จุดพักแรมโดยตรง\n- **บทที่ 15**: อีวานเริ่มสงสัยว่าด่านฝึกสอนของอิซาเบลล์ยากผิดปกติเมื่อเทียบกับเอคไดซิส และกังวลว่าตัวเองอาจเป็นเพียง NPC ตัวช่วยในเกม จึงแอบขึ้นไปสังเกตการณ์บนต้นไม้โดยไม่ยื่นมือเข้าไปช่วยในทันที ด้านอิซาเบลล์สู้กับอิคารัสจนดาบกระเด็นหลุดมือและเกือบถูกฟันสังหาร ทว่าเมื่อนึกถึงคำสอนวิถีอัศวินของออกัสต์ เธอก็ตื่นรู้พลังในเสี้ยววินาที ย่อตัวหลบคมดาบแล้วแทงทะลุร่างอิคารัสจนเอาชนะได้ อีวานซึ่งจัดการศัตรูในป่าทั้งหมดเรียบร้อยแล้วจึงเดินออกมาชื่นชม (ยืนยันได้ว่าตัวเองคือตัวแปรที่ไม่ใช่ NPC) และเปิดขวดโพชั่นรักษาบาดแผลเพื่อเตรียมสอบปากคำอิคารัสหาเบื้องหลังการแทรกซึมของพวกปีศาจ\n- **บทที่ 16**: อีวานราดโพชั่นรักษาบาดแผลใส่แผลฉกรรจ์ของ **อิคารัส** และช่วยชีวิตตอนที่อิคารัสกัดลิ้นฆ่าตัวตาย จนได้ข้อมูลว่าที่พวกปีศาจต้องส่งอิคารัสมาลงมือเองเพราะหน่วยสาวกในสหราชอาณาจักรถูกแทรกซึมและพ่ายแพ้สงครามข่าวสารไปแล้ว เมื่ออิคารัสสิ้นหนทางกลับและขอตาย อีวานกลับยื่นข้อเสนอให้ละทิ้งตัวตนเดิมแล้วไปเริ่มต้นชีวิตใหม่ที่สถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซีย อิคารัสเลือกจะมีชีวิตอยู่และยอมให้อีวานตัดเขาทิ้ง หลังจบเรื่อง อีวานจึงปลอบใจอิซาเบลล์ที่รู้สึกผิดต่อผู้เสียสละและกระตุ้นให้เธอเงยหน้าขึ้นเป็นความหวังและผู้กล้าของทุกคน\n- **บทที่ 17**: ปลายเดือนกุมภาพันธ์ วันพิธีปฐมนิเทศของ **สถาบันเซนต์ยัน** เรือประจัญบานลอยฟ้าซึ่งเป็นเรือธงของ **จักรวรรดิคาลีออน** บินข้ามเขตแดนมาส่ง **เอลเฟียรา** เพื่อแสดงการประท้วงเรื่องความปลอดภัยในคราซิลอฟ อีวานที่แฝงตัวเป็นเจ้าหน้าที่ได้พบกับ **อิซาเบลล์** และ **ออสการ์ เดอ ซาติยง** (ลูกชายของจิลแบร์) พออีวานแนะนำตัวว่าเป็น “คนสวน” อิซาเบลล์ก็เข้าใจผิดคิดว่าเป็นรหัสลับของสายลับรัฐบาล ตัดฉากไปในหอประชุมใหญ่ จู่ๆ ก็มีใครบางคนมองเห็น **หน้าต่างสถานะ** ปรากฏขึ้นตรงหน้า\n- **บทที่ 18**: อีวานใช้เวลาว่างในตำแหน่งคนสวนที่ไม่มีสวนของสถาบันเซนต์ยันเดินไล่เก็บกู้ระเบิดเวทมนตร์ทำมือ 3 ลูกที่คนร้ายลอบวางไว้ก่อนพิธีปฐมนิเทศ ทันใดนั้นเขาก็ได้ยินเสียงคนพูดพึมพำเรียกตัวเองว่า “ซานตาคลอส” เมื่อปะทะกันชั่วพริบตา อีวานก็วิเคราะห์ได้ทันทีว่าอีกฝ่ายคือ **ผู้ข้ามมิติ** ที่รู้จักต้นฉบับและรู้ฉากจบของโลกนี้ อีวานจึงแสดงตัวกับ **โอซิป โซเรนอฟ** (อดีตทหารหน่วยเก็บกวาดจากหน่วยจู่โจมที่ 3) เพื่อสั่งการผ่านดมิทรีให้รวบรวมรายชื่อผู้เข้าออกสถาบันทั้งหมดและตั้งใจจะกำจัดผู้ข้ามมิติคนนั้นทิ้งเพื่อไม่ให้ถูกขวางทางกลับบ้าน ส่วนทางฝั่งผู้ข้ามมิติปริศนา (ในร่างลูกคนเล็กจอมเสเพล) ที่เพิ่งพลาดเควสต์กู้ระเบิดเพราะอีวานเก็บกู้ไปหมดแล้ว ก็ได้รับเควสต์ระดับ `???` ให้กำจัดหรือเอาชีวิตรอดจาก “คนสวนแห่งสถาบันเซนต์ยัน อีวาน เปโตรวิช” โดยมีบทลงโทษคือความตาย\n\n- **บทที่ 19**: อีวานนำระเบิดเวทมนตร์ 3 ลูกที่ถอดชนวนแล้วไปพบ **ดมิทรี** ที่ร้านกาแฟลับใกล้สถาบันเซนต์ยันเพื่อส่งให้แผนกเวทมนตร์ตรวจสอบ และรับแฟ้มรายชื่อบุคลากร นักศึกษา รวมถึงครอบครัวผู้เข้าร่วมพิธีปฐมนิเทศรวม 2,429 คนมาคัดกรองหาผู้ข้ามมิติ ดมิทรีเป็นห่วงสภาพอิดโรยของอีวานจึงสั่งให้ลูกน้องคอยเฝ้าสังเกตการณ์จากระยะปลอดภัย อีวานนำข้อมูลกลับมานั่งวิเคราะห์จนเกิดฝันร้ายถึงอดีตเพื่อนร่วมรบ (**เชอร์โนวิกา** และ **ซาชา**) และท่องชื่ออาหารกับความทรงจำของ **คิมซอนอู** เพื่อประคองสติไม่ให้ยอมรับว่าชีวิตของสหายเป็นเพียงฉากหลังในเกม ตัดฉากไปหลังเปิดเทอม **องค์หญิงเอคไดซิส** ถูกเพื่อนร่วมสถาบันหวาดกลัวและโดดเดี่ยวเพราะ **คุณลุงฮัน** คอยยืนถือขวานจ้องเขม็งปกป้องจนไม่มีใครกล้าเข้าใกล้\n- **บทที่ 20**: หลังอดหลับอดนอนคัดกรองข้อมูลอยู่ 3 วัน อีวานก็ตัดตัวเลือกจนเหลือผู้ต้องสงสัย 3 คน (เด็กกำพร้าทุนภาคปฏิบัติ 1 คน และทายาทขุนนางสายมกุฎราชกุมารอีก 2 คน) ก่อนจะเริ่มเข้ามาทำงานในสถาบันเซนต์ยันอย่างเต็มตัว ด้าน **เอคไดซิส** ได้ร่วมโต๊ะกินมื้อกลางวันกับ **อิซาเบลล์** และเพื่อนใหม่ **ยูริ แฟรงก์** (เด็กสาวกำพร้าทุนเต็มจำนวนของคณะอัศวินที่มีฝีมือดาบเหนือกว่าอิซาเบลล์และออสการ์) แต่อีวานที่แอบสังเกตการณ์อยู่บนต้นไม้กลับขีดเส้นแดงให้ยูริเพราะใช้ชื่อผู้ชายแบบคราซิลอฟซึ่งนิยมใช้เป็นชื่อผู้หญิงในเอเชียตะวันออก ขณะเดียวกัน **เอนริเก้** ที่ได้รับไหว้วานให้มาคอยดูอีวานก็เริ่มสังเกตว่าเขาสะกดรอยตามนักศึกษา 3 คนอย่างน่าสงสัย หนึ่งในนั้นคือ **เยฟเกนี โนคอฟ คารัมจิน (ยูจีน)** นักศึกษาคณะเทววิทยา ซึ่งเป็นผู้ข้ามมิติชาวเกาหลีใต้ที่เข้ามาสิงร่างตัวเอกนิยาย *“นักดาบคลั่งแห่งดัชชีเหนือ”* ยูจีนรู้ตัวว่าถูก “ซานตาคลอสหน้าหิน” สะกดรอยและมองไม่เห็นเลเวลของอีวาน ส่วนอีวานก็ยืนยันความสงสัยทั้งจากทักษะตรวจจับการพรางตัวและชื่อ “ยูจีน”\n- **บทที่ 21**: **เอนริเก้** ตามสังเกตการณ์อีวานที่ยืนจ้องเป้าหมายไม่หลับไม่นอนอยู่ 3 วันเต็มจนทนไม่ไหว จึงยิงปืนเตือนและพาเขากลับไปที่สถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซีย ที่นั่นเธอประหลาดใจกับวินัยอันเงียบกริบของเด็กๆ รวมถึงการที่อีวานรับ **อิคารัส** ปีศาจมีเขามาอยู่ด้วย และยิ่งตกใจหนักเมื่อเห็นห้องทำงานผู้อำนวยการที่ขึงลวดกับดักเต็มไปหมดพร้อมกระดานวิเคราะห์ข้อมูลและด้ายแดงโยงใยเต็มห้องและเพดาน เมื่อเอนริเก้คาดคั้นอย่างจริงจัง อีวานซึ่งอดนอนมานานหนึ่งสัปดาห์จึงยอมสารภาพความจริงเรื่องที่ตนเป็นผู้กลับชาติมาเกิดจากต่างโลกและเพิ่งพบผู้ข้ามมิติอีกคนซึ่งต้องกำจัดทิ้ง เอนริเก้จึงขอโทษอีวานที่ทุกคนเข้าใจผิดคิดว่าเขาเป็นผู้ปีนหอคอยจอมมารเช่นเดียวกับคนอื่น และเปิดเผยความจริงว่า **ผู้กล้าแม็กซิมิเลียน** ก็ไม่ใช่ชาวทิลีสแต่เป็น “ผู้ที่ถูกดึงตัวมา” จากต่างโลกเหมือนกับอีวานเช่นกัน\n- **บทที่ 22**: **เอนริเก้** ตบหน้าเรียกสติอีวานที่กำลังจมดิ่งในความสิ้นหวังเรื่องจุดจบและชะตากรรมของ **แม็กซิมิเลียน** เธอเตือนสติว่าทุกคนในโลกนี้ต่างก็มีชีวิตจิตใจและเป็นตัวเอกในเรื่องราวของตนเอง ไม่ใช่แค่ตัวประกอบในนิยาย พร้อมยื่นมือปลอบโยนให้อีวานพลิกหน้ากระดาษชีวิตด้วยมือของตัวเองและอาสาเฝ้ายามให้เขานอนหลับ อีวานจึงปลดปล่อยความกดดันและหลับใหลไปโดยฝันย้อนรำลึกถึงวัย 16 ปีสมัยเป็นทหารเกณฑ์ที่ **พระเจ้าอีวานมหาราช** เคยช่วยชีวิตและมอบฉายา “อีวานตัวน้อย” ให้ ทำให้คืนนั้นเขาหลับสนิทไร้ฝันร้าย ขณะเดียวกัน ทางฝั่ง **ยูจีน** หน้าต่างสถานะเควสต์ระดับ `???` ที่ให้สังหารอีวานก็ถูกยกเลิกไปเองอย่างปริศนาด้วยผลของโชคชะตา\n- **บทที่ 23**: อีวานที่ตัดสินใจใช้ชีวิตต่อไปตามคำแนะนำของเอนริเก้ถือกรรไกรตัดแต่งกิ่งไม้ออกมาตัดต้นไม้ทั้งที่สถาบันเซนต์ยันไม่มีสวน **เอนริเก้** จึงชวนเขาไปเป็นผู้ช่วยสอนในวิชาบังคับ *[ความเข้าใจในการต่อสู้ระยะประชิด 1]* ของคณะอัศวินที่เธอรับหน้าที่เป็นอาจารย์พิเศษ และประกาศให้คะแนนพิเศษตามความสาหัสที่นักศึกษาสามารถทำกับ “คนสวน” อีวานได้ อีวานที่กำลังจับตามองกลุ่มคนสำคัญ (ออสการ์, อิซาเบลล์, ยูริ และ **มอร์ด เอริกสัน**) จึงขึ้นสังเวียนประเมินฝีมือ โดยมี **มอร์ด เอริกสัน** (คุณลุงฮัสคาลผู้คุ้มกันเอคไดซิส) อาสาขึ้นสู้เป็นคนแรก\n- **บทที่ 24**: อีวานประลองขวานเอาชนะ **มอร์ด เอริกสัน** ได้อย่างเฉียบขาดและบังคับให้มอร์ดไปทำงานอาสาสมัครซักผ้าที่สถานเลี้ยงเด็กกำพร้าเพื่อผูกมัดไม่ให้เคลื่อนไหวทางการเมือง จากนั้นอีวานก็ไล่โค่นนักศึกษาปี 1 คณะอัศวินทีละคนจนถึงคิวของ **ยูริ แฟรงก์** เมื่ออีวานเอ่ยปากถามแซวเรื่องชื่อเกาหลี (“คิมยูริ พัคยูริ หรือชเวยูริ?”) ยูริก็ตกใจสุดขีดและพ่ายแพ้ให้เชิงขวานของอีวานโดยไร้รอยขีดข่วน ความจริงเปิดเผยว่าเธอคืออดีตนักวาดภาพประกอบชาวเกาหลีใต้ที่ข้ามมิติมาในโลกของเกมผู้ใหญ่ที่ตัวเองเพิ่งวาดส่งงาน (*ฮวีจัก 3*) จึงเข้าใจผิดคิดว่าคนสวนมีผ้าขนหนูพาดคออย่างอีวานเป็นคนสวนโรคจิตที่จะจับเธอไปทำมิดีมิร้าย สุดท้าย **อิซาเบลล์** ต้านได้ 3 กระบวนท่า **ออสการ์** ต้านได้ 2 กระบวนท่า และทั้งอีวานกับเอนริเก้ก็โดน **นักบุญหญิงแพทริเซีย** เทศนายับข้อหาส่งผู้ป่วย 50 คนเข้าไปนอนในคณะเทววิทยา\n- **บทที่ 25**: อีวานและ **เอนริเก้** เข้าไปพบ **นักบุญหญิงแพทริเซีย** ที่ห้องทำงานคณบดีคณะเทววิทยา เอนริเก้เปิดเผยความจริงว่าอีวานเป็น “ผู้ที่ถูกดึงตัวมา” จากต่างโลกเช่นเดียวกับแม็กซิมิเลียน ทำให้แพทริเซียซาบซึ้งใจในความเสียสละของ “บราเดอร์ซีริล” (ชื่อศีลล้างบาปของอีวาน) อย่างยิ่งจนขอตามไปเยี่ยมสถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซียด้วยตนเอง และยิ่งปลาบปลื้มเมื่อเห็นความเป็นอยู่ที่ดีของเด็กๆ กับภาพวาดที่เด็กๆ วาดให้อีวาน\n- **บทที่ 26**: ที่สถานเลี้ยงเด็กกำพร้า **แพทริเซีย** วิเคราะห์ว่าปกติ “ผู้ที่ถูกดึงตัวมา” จะปรากฏตัวเพียงศตวรรษละ 2–3 คน แต่ในยุคนี้กลับมีทั้งจอมมาร แม็กซิมิเลียน และอีวานเมื่อ 20 ปีก่อน แล้วยังมีผู้ต้องสงสัยโผล่มาอีกถึง 3 คน เธอจึงอนุมัติให้อีวานตรวจสอบตัวตนและ “เรื่องราว” ของทั้งสามคน ฝั่ง **ยูจีน (เยฟเกนี)** ที่กำลังนั่งอ่านพระคัมภีร์อยู่ได้รับคำเตือนจาก `[สัญชาตญาณเอาตัวรอด Lv.3]` ให้เดินหนีแต่อีวานก็ตามมาดักตัวไว้ได้และพาตัวไปพร้อมบอกว่าเป็นเรื่องที่แพทริเซียอนุมัติแล้ว ขณะเดียวกันทางฝั่ง **เอิร์นเบิร์ต** คณบดีคณะเวทมนตร์ก็ได้พูดคุยกับแพทริเซียเรื่อง **ออสวัลด์ อีสต์เบลเฟน** นักศึกษาปี 1 ชาวคาลีออนผู้ต้องสงสัยรายที่ 3 ซึ่งเพิ่งหย่าร้างกับอดีตคู่หมั้น **เอเวอลิน รัสต์ฟิสต์** (ตัวออสวัลด์เองก็เป็นผู้ข้ามมิติที่หลุดเข้ามาในนิยาย *[นางร้ายที่คลั่งไคล้จอมเวทอัจฉริยะ]*)\n- **บทที่ 27**: อีวานเจรจากับ **ยูจีน** และพบว่าอีกฝ่ายเป็นคนเกาหลีใต้ที่ข้ามมิติมาจากปี 2022 (หลังอีวาน 1 ปี) และมีหน้าต่างสถานะที่เอาแต่ส่งคำเตือนประหลาดๆ ยูจีนอาสาร่วมมือกับอีวานอย่างกระตือรือร้นและขอเรียกอีวานว่า “ลูกพี่” เพื่อช่วยตั้ง “ชมรมอาสาสมัคร” ใช้เป็นฉากหน้ารวบรวมและตรวจสอบกลุ่มผู้ต้องสงสัยว่าเป็นผู้ข้ามมิติทั้ง 3 คน (ยูจีน, ยูริ และออสวัลด์) จากนั้นทั้งสองคนก็เดินตรงเข้าไปหาวงกินมื้อกลางวันของ **อิซาเบลล์**, **เอคไดซิส** และ **ยูริ** ทำให้ยูริตกใจสุดขีดจนทำแซนด์วิชหล่นเพราะนึกว่า “คนสวนโรคจิต” พาตัวละครสาย “โกลด์ซัน” มาด้วย\n- **บทที่ 28**: อีวานทดลองใช้ความสามารถหน้าต่างสถานะของ **ยูจีน** เดินสแกนทั่วมหาวิทยาลัยจนพบนักศึกษาที่ชื่อไม่ตรงกับทะเบียนและมองไม่เห็นเลเวลราว 7 คน (ที่น่าจะเป็นสายลับต่างแดนหรือผู้ร่วมมือกับปีศาจ) จากนั้นอีวานแวะไปพูดคุยกับ **อิซาเบลล์** ที่เข้าใจผิดคิดว่าเขาเป็นสายลับรัฐบาลและอาสาช่วยสืบหาสายลับจากทิลีสให้ ด้านบนเรือประจัญบานลอยฟ้า **“เกียรติภูมิแห่งบอยล์”** ของคาลีออนซึ่งขัดข้องจนขยับไม่ได้ **เอลิซาเวตา** บุกขึ้นไปข่มขู่กัปตัน **เออร์เนสต์** ด้วยตนเองว่าจะส่ง “คนตัดไม้” มาหา ก่อนจะสั่งการให้ **ดมิทรี** เรียกตัว “วันก้า” มาปฏิบัติภารกิจตามแผน\n- **บทที่ 29**: หลังเรือรบคาลีออนลอยค้างเหนือสถาบันนานกว่า 15 วัน นักศึกษาเอลฟ์ก็แตกคอกันเองระหว่างฝ่ายสภาองคมนตรีกับฝ่ายกองบัญชาการกองทัพเรือ ขณะเดียวกัน **ดมิทรี** เดินทางมาที่สถานเลี้ยงเด็กกำพร้า (ซึ่งเขาแอบยักย้ายงบมาช่วยอุปถัมภ์ทุกปี) และพบว่า **ยูจีน** บุตรชายตระกูลดยุกคารัมจินมาเรียกอีวานว่าลูกพี่ ดมิทรีจึงมอบคำสั่งจากเอลิซาเวตาให้อีวานลอบขึ้นไปข่มขู่กัปตันเรือรบคาลีออนโดยห้ามมีผู้เสียชีวิต เพื่อบีบให้กัปตันไปจับมือกับมกุฎราชกุมารอเล็กซานเดอร์และใช้เป็นข้ออ้างยึดเรือเหาะมาถอดแบบวิศวกรรมย้อนกลับ พอจบการสนทนา ยูจีนก็พบว่าหน้าต่างเควสต์เปลี่ยนเป็น `[“เควสต์ต่อเนื่องระดับ B” อุบายวังหลวงคราซิลอฟ]` อีวานจึงสั่งให้ยูจีนร่วมปฏิบัติการในคืนวันพรุ่งนี้เพื่อสังเกตการณ์ระบบเควสต์และรางวัล\n- **บทที่ 30**: อีวานพายูจีนเดินไปที่คณะเวทมนตร์ ระหว่างทางยูจีนเล่าเรื่องช่องสล็อตเวทมนตร์ศักดิ์สิทธิ์และความฝันอยากเป็น “พาลาดิน” คนแรกของโลก ทำให้ีวานอดสงสัยไม่ได้ว่ายูจีนอาจจะมีคุณสมบัติคล้ายผู้กล้า จากนั้นทั้งคู่ก็ไปดักจับตัว **ออสวัลด์** (ที่กำลังหนีสายตาคลั่งรักของ **เอเวอลิน รัสต์ฟิสต์**) ได้สำเร็จ อีวานเฉลยว่าจับพิรุธออสวัลด์ได้จากการใช้คำสุภาพในเอกสารสมัครเรียนซึ่งผิดวิสัยเอลฟ์ เมื่อแลกเปลี่ยนข้อมูลกันจนรู้ว่าออสวัลด์ข้ามมิติมาในเดือนพฤษภาคม ปี 2023 ทั้งสามคนก็ไปดักพบ **ยูริ แฟรงก์** ที่คณะอัศวิน (ทำเอายูริขวัญผวาจนภาพตัดเพราะคิดว่าเป็นคนสวนโรคจิตกับตัวละครสายโกลด์ซันและจอมเวทจิตใจ) อีวานมองดูผู้ข้ามมิติทั้ง 4 คนในห้องชมรมแล้วนึกในใจว่าการจัดทีมแบบนี้มันเหมือนปาร์ตี้ผู้กล้าไม่มีผิด\n- **บทที่ 31**: ผู้ข้ามมิติทั้ง 4 คนแนะนำตัวและแลกเปลี่ยนข้อมูลในห้องชมรม **ยูจีน** (คิมยูจิน อายุ 31) มาจากนิยายลากยาวไร้ตอนจบ *“ไอ้สารเลวอัจฉริยะเพลงดาบแห่งดัชชีเหนือ”*, **ออสวัลด์** (พัคแจยอง อายุ 27) อ่าน *“อัจฉริยะเวทมนตร์ผู้ถูกนางร้ายคลั่งไคล้เวทมนตร์ตามหลอกหลอน”* ไม่ถึง 30 ตอน, และ **ยูริ** (อียูริ อายุ 29) เป็นนักวาดภาพประกอบที่ถูกดึงมาขณะส่งงานเกมผู้ใหญ่ (จนเข้าใจผิดคิดว่าพวกอีวานเป็นตัวละครสายมืดและสายสะกดจิต) ทั้งสามต่างถูกสิงมาได้ 4 ปีพอดีหลังจอมมารตาย อีวานนำคำสอนของ **เอนริเก้** มาวิเคราะห์ว่าโชคชะตาอาจกำหนดแค่จุดเริ่มต้นในฉากหลังแนวสถาบันการศึกษา แต่ตอนจบขึ้นอยู่กับพวกเขาเอง พร้อมตั้งชมรม (อีวานแอบตั้งชื่อว่า *ชมรมอาสาสมัคร*) โดยใช้หน้าต่างเควสต์ของยูจีนเป็นตัวจับกระแสเรื่องราว\n- **บทที่ 32**: ทีมทั้ง 4 คนวางแผนลอบขึ้นเรือรบลอยฟ้า **“เกียรติภูมิแห่งบอยล์”** ที่ลอยสูง 800 เมตรเหนือสถาบันเซนต์ยันเพื่อข่มขู่กัปตันเรือโดยห้ามฆ่าใคร หลังออสวัลด์ใช้เวท `[จิตเภท]` ปิดปากยูจีนที่โวยวายเรื่องสกิล `[ย่างก้าวขนนก]` อีวานวิเคราะห์ว่ากัปตันจะต้องติดต่อมกุฎราชกุมารอเล็กซานเดอร์ในคืนนี้ด้วยรถม้าลงอาคมลอยตัว จึงให้ยูริแบกยูจีนและตัวเองแบกออสวัลด์ไปดักรอที่หอดูดาวคณะเวทมนตร์ ก่อนใช้วิธีขว้างขวานผูกเชือกเหวี่ยงทุกคนไปเกาะล้อใต้ท้องรถม้ากลางอากาศ พอรถม้าเข้าใกล้ดาดฟ้าเรือ อีวานก็ทิ้งทั้งสามคนไว้เป็นตัวล่อเบี่ยงเบนความสนใจ ส่วนตัวเองขว้างขวานพุ่งไปเจาะกราบเรือไม้และลอบเข้าไปในเรือเพียงลำพัง\n- **บทที่ 33**: บนดาดฟ้าเรือ ยูริ ยูจีน และออสวัลด์ถูกเหล่าทหารเอลฟ์ล้อมกรอบ ออสวัลด์จึงร่าย `[ประทานความกล้า]` ใส่ยูจีนจนทำให้ยูจีนเข้าสู่โหมดสวมบทบาทอัศวินศักดิ์สิทธิ์เต็มขั้นและพุ่งเข้าฟาดฟันด้วย `[ฟาดฟันศักดิ์สิทธิ์]` ดึงความสนใจบนดาดฟ้าไว้ได้ทั้งหมด ฝั่งอีวานใช้เทคนิคการกำหนดตำแหน่งด้วยเสียงสะท้อนจากเสียงไซเรนและไฟเตือนภัยลอบเดินผ่านโถงทางเดินอันมืดมิด จัดการทหารเอลฟ์ด้วยสันขวานและปืนพกโดยไม่ให้ถึงตาย จนมาถึงหน้าห้องกัปตัน **เออร์เนสต์** ซึ่งกำลังระแวงว่าเป็นการโจมตีจากฝ่ายเอลิซาเวตา อีวานขว้างขวานผูกเชือกทะลุประตูเข้าไปปักโต๊ะก่อนกระชากเชือกฟาดข้อเท้าเออร์เนสต์หักและจ่อปืนใส่ ปฏิเสธการเจรจาแล้วลั่นไกปืนท่ามกลางความมืด\n- **บทที่ 34**: กัปตัน **เออร์เนสต์** (นักรบสายเวทที่เชี่ยวชาญวิชาดาบ) หลบกระสุนของอีวานได้และแสร้งยอมจำนน ก่อนเขวี้ยงดาบหลอกล่อแล้วกดใช้งานลูกแก้วเวทมนตร์ระเบิดตัวเอง แต่แทนที่จะเป็นระเบิดสังหาร กลับเป็น **‘เวทย้ายวิญญาณ’** ที่ส่งจิตของจอมเวท **เวียลกริน** แห่งปาร์ตี้ผู้กล้าเข้ามาสิงร่างเออร์เนสต์แทน เวียลกรินยอมรับว่าจงใจทำให้เรือขัดข้องเพื่อล่อให้ **เอลิซาเวตา** โกรธจนมกุฎราชกุมาร **อเล็กซานเดอร์** ต้องติดต่อมาหา ก่อนจะเปิดฉากประมือกับอีวานเพื่อทดสอบฝีมือ แม้เวียลกรินจะมีพลังเวทจำกัดตามร่างกัปตัน แต่อีวานในโหมด ‘ผู้ก้าวข้ามขีดจำกัด’ ที่พุ่งทะลวงเข้าไปได้หนึ่งชั้นก็ยังต้องเผชิญกับวงเวทกว่าสี่สิบบทกลางอากาศของเวียลกริน\n- **บทที่ 35**: ขณะที่ **ยูจีน** **ยูริ** และ **ออสวัลด์** กำลังถูกลูกเรือเอลฟ์ระดับทหารผ่านศึกกดดันบนดาดฟ้าเรือ **อีวาน** ก็ถูก **เวียลกริน** ซัดทะลุดาดฟ้าเรือขึ้นมา (เวียลกรินเสียแขนไปหนึ่งข้างแต่ยังคงเหนือกว่า) เวียลกรินไม่ฆ่าใครแต่จับทูตจากกระทรวงการต่างประเทศ (**นิโคไล สโลโบดาโนวิช รยูริก**) ที่ซ่อนอยู่ในรถม้ามาเค้นความจริงทางจิตก่อนสังหารทิ้ง และพบว่าอเล็กซานเดอร์ไม่ได้อยู่ในเมืองเฟรเชนกายา เวียลกรินทิ้งปริศนาให้อีวานเตรียมรับมือกระดานเกมที่เชื่อมโยงกับสถาบันเซนต์ยัน ฝากฝังลูกสาวของตน (**เอลเฟียรา**) และอ่านปากบอกอีวานว่า *“แม็กซิมิเลียนยังไม่หายไปไหน”* ก่อนสลายร่างไป กัปตันเรือที่ขวัญเสียจึงรีบส่งอีวานและกลุ่มผู้ข้ามมิติกลับลงพื้น อีวานปล่อยให้ทั้งสามแยกย้ายกลับไปพักผ่อนส่วนตัวเองมุ่งหน้าไปรายงาน **เอลิซาเวตา**\n- **บทที่ 36**: **อีวาน** ไปถึงกองบัญชาการข่าวกรองท่ามกลางความยำเกรงของเหล่ารุ่นน้อง ก่อนจะถูกพาไปยัง **พระราชวังตะวันออก** เพื่อพบ **ดมิทรี** และเข้าเฝ้า **เอลิซาเวตา** ในสวนอนุสรณ์สถานที่ปลูกดอกไม้ซึ่งเหล่าสหายผู้ล่วงลับชื่นชอบ (ย้อนความทรงจำเมื่อ 4 ปีก่อนในวันฝนตกที่เอลิซาเวตาขอให้อีวานไว้หนวดเคราแบบคุณปู่และใช้ชีวิตเงียบๆ จนเธอกลับมาตกใจกับเคราจริงของเขาในวันนี้) เมื่ออีวานรายงานเรื่องเวียลกริน เอลิซาเวตาก็วิเคราะห์ว่ามกุฎราชกุมารอเล็กซานเดอร์ตัวจริงอาจร่วมมือกับเวียลกรินเพื่อหาทางกำจัดผู้กล้า **แม็กซิมิเลียน** (‘จักรพรรดิทองคำ’) เช่นเดียวกับที่ราชสำนักเคยกลัวอำนาจของหน่วยเก็บกวาด หลังคุยเรื่องงาน เอลิซาเวตาชวนอีวานนั่งจิบชาชมสวน แต่อีวานเตือนให้เธอยึดมั่นในคำสอนของหน่วย (“อย่าเศร้าโศกถึงผู้ที่ล่วงหน้าไปก่อน”) และมองดวงดาวบนท้องฟ้าแทนดอกไม้ ทั้งคู่หยอกล้อกันเรื่องหนวดเคราอย่างเป็นกันเองอีกครั้ง\n- **บทที่ 37**: ช่วงสอบกลางภาคเดือนพฤษภาคม **ยูจีน** **ยูริ** และ **ออสวัลด์** ต่างคร่ำครวญกับข้อสอบและกองการบ้านในห้องชมรม ขณะที่ **อีวาน** กำลังสั่งสอนนักศึกษา 12 คนที่ทิ้งก้นบุหรี่ใต้ต้นไม้ด้วยโพชั่นรักษาบาดแผล ก่อนที่ **อิซาเบลล์** จะเข้ามาขอให้อีวานช่วยติวสอบภาคปฏิบัติวิชา *ยุทธวิธีรับมือการซุ่มโจมตี* ของ **เอนริเก้** อีวานเดาออกว่าเอนริเก้ต้องจัดสอบในป่าทางตะวันออกของเฟรเชนกายาจึงพาอิซาเบลล์ไปที่นั่น แล้วเปิดฉากโยนระเบิดควันและยิงกระสุนจริงไล่ต้อนเธอทันทีเพื่อฝึกแบบสมจริง ทำเอาอิซาเบลล์ที่อุตส่าห์เตรียมตะกร้าปิกนิกแซนด์วิชมาแสดงความขอบคุณถึงกับเดือดจัดและคิดจะสั่งสอนอีวานให้รู้จักคำว่าสามัญสำนึก\n- **บทที่ 38**: อีวานฝึกสอนอิซาเบลล์ด้วยกลยุทธ์ซุ่มยิงจริงและกับดักระเบิดในป่า พร้อมอธิบายหลักการโอบล้อมด้วยการจำกัดข้อมูลข่าวสารและการชักนำเป้าหมายในเขาวงกตธรรมชาติ ทำให้อิซาเบลล์ระลึกถึงคำสอนของ **ออกัสต์** จนปลุกพลังเวทสีฟ้าและยกระดับการตรวจจับแนววิถีกระสุนเข้าใกล้ระดับผู้เหนือมนุษย์ได้สำเร็จ บนรถไฟขากลับ อิซาเบลล์หลับซบไหล่อีวานและแอบได้ยินเขาชมกับตัวเองว่าแม็กซิมิเลียนมีลูกสาวที่ยอดเยี่ยม จนเธอเริ่มหวั่นไหวและคิดอยากดูแล “คนสวนซื่อบื้อ” คนนี้ ขณะเดียวกัน ใต้ดินในป่านั้น **หมวดทหารช่างที่ 7 ของคนแคระฝ่ายจอมมาร** ที่เตรียมขุดอุโมงค์ซุ่มโจมตีงานสอบของเอนริเก้กลับถูกแรงระเบิดจากการฝึกของอีวานกับอิซาเบลล์ถล่มพังไป 3 จุดจนต้องเร่งซ่อมกันจ้าละหวั่นก่อนวันสอบในอีก 1 สัปดาห์\n- **บทที่ 39**: ตลอดสัปดาห์ อีวานฝึกอิซาเบลล์จนแพ้ 17 ครั้งรวด ก่อนจะถ่ายทอดเคล็ดวิชาขั้นสูง **การแยกส่วนห้วงเวลา (Temporal Dissociation)** เพื่อก้าวเข้าสู่สนามรบของผู้ก้าวข้ามขีดจำกัดด้วยการฟันดาบเธอหักและหวดเธอให้เอาตัวรอดในเสี้ยววินาที แม้จะถูกนักบวชจากทิลีสช่วยรักษาทุกคืนแต่อิซาเบลล์ก็ยังอ่อนล้าจน **เอคไดซิส** และ **ยูริ** สังเกตเห็น (และอิซาเบลล์ปฏิเสธเรื่อง **ออสการ์** พร้อมเปรยว่าชอบคนกำยำเงียบขรึมเหมือนหมี) ก่อนวันสอบ 1 วัน อิซาเบลล์แวะมาชวนอีวานฝึกต่อและอ่อยชวนกินข้าว แต่ถูกอีวานปฏิเสธเพราะต้องไป “เก็บกวาด” เหล่าศัตรูที่จะมาซุ่มโจมตีในวันสอบล่วงหน้า ทำเอาเอคไดซิสกับยูริที่แอบดูอยู่ถึงกับทำกาแฟหกและเปรียบอีวานว่าเหมือน *จอห์น วิค* เวอร์ชันถือขวานไว้เครา\n\n- **บทที่ 40**: วันสอบภาคปฏิบัติวิชา **[การรับมือการซุ่มโจมตี]** ของนักศึกษาปี 1 คณะอัศวิน 52 คน อีวานเตรียมอาวุธครบมือทั้งดาบ ขวาน กริช ปืนพก และระเบิดมือมาสังเกตการณ์โดยร่วมมือกับ **เอนริเก้** (ซึ่งช่วยตวาดขู่ **ศาสตราจารย์โรเบิร์ต เซนนาร์ เดอ มอนดรังกี** ขุนนางจากทิลีสที่เข้ามาดูถูกอีวานว่าเป็นแค่คนสวนสามัญชน) กติกาคือการถือลูกแก้วติดตามตำแหน่งฝ่าป่าไปอีกฟากภายใน 4 ชั่วโมงพร้อมหลบหนีลูกศิษย์ของเอนริเก้ อีวานวิเคราะห์ออกทันทีว่าจะต้องมี **เผ่าคนแคระ** บุกโจมตีจากใต้ดินเพื่อหมายหัว **อิซาเบลล์** หรือ **ออสการ์** จึงชักดาบเตรียมตัวลงมือ\n- **บทที่ 41**: ทันทีที่เริ่มสอบ **อิซาเบลล์** แยกตัววิ่งเข้าป่าเพียงลำพังเพื่อคว้าอันดับหนึ่งและพิสูจน์ฝีมือให้อีวานเห็น เธอปลดกับดักและอ่านทางกับดักลวงของลูกศิษย์เอนริเก้ได้ทั้งหมดก่อนจะเข้าปะทะกับกลุ่มของ **อาแลง** 5 คนอย่างสบายๆ ขณะเดียวกัน อีวานที่ขึ้นไปสังเกตการณ์บนยอดไม้สัมผัสได้ถึงแรงสั่นสะเทือนใต้ดินรูปแบบใยแมงมุมอันเป็นเอกลักษณ์ของ **‘นักถักทอใย’ แห่งกองทัพมังกรที่ 5** ก่อนที่ผืนป่าจะถล่มยุบตัวลงเป็นโพรงอุโมงค์ลึก อีวานมอบหมายหน้าที่กู้ภัยนักศึกษาทั่วไปให้เอนริเก้ แล้วกระโดดลงไปในอุโมงค์เพื่อมุ่งหน้าไปช่วย **ออสการ์** ที่อยู่ใกล้ที่สุดก่อน\n- **บทที่ 42**: ใต้โพรงอุโมงค์ที่มืดสนิท **ออสการ์** ที่ขาหักและครอบครองลูกแก้วไว้ 3 เม็ด (ซึ่งรวมถึงลูกแก้วของเพื่อนอีก 2 คนที่เขาชิงมา) ตัดสินใจออกเดินหาเพื่อนร่วมชั้นเพื่อช่วยเหลือตามวิถีอัศวินแห่งทิลีส ด้านอีวานเดินฝ่าความมืดด้วยจังหวะก้าวคงที่ 86 เซนติเมตรและคำนวณพิกัดในหัวจนพบ **แพทริก** (นักศึกษาที่ถูกออสการ์ชิงลูกแก้วไป) และมอบลูกแก้วสำรองช่วยชี้ทางหนีให้ จากนั้นเมื่อออสการ์รู้ตัวว่าเสียงตะโกนเรียกชื่อในความมืดเป็นกับดักของศัตรู และได้ยินเสียงนักศึกษาอีกคนกำลังตกอยู่ในอันตราย ออสการ์จึงยอมตะโกนเปิดเผยตัวตนว่าเป็นบุตรชายของดยุกจิลแบร์เพื่อล่อคนแคระมาหาตนเอง อีวานที่มาถึงทันเวลาจึงเล็งปืนพกคำนวณระยะในความมืดผ่านตำแหน่งของออสการ์และลั่นไกสังหารคนแคระทันที\n\n- **บทที่ 43**: อีวานใช้เทคนิคการแยกส่วนห้วงเวลาควบคู่กับแสงวาบจากปากกระบอกปืนพกและวิชา **‘ผ่าเกราะคนแคระ’** สังหารคนแคระ 2 ตนที่กำลังไล่ล่าออสการ์ได้อย่างรวดเร็ว ก่อนจะฝากฝังให้ออสการ์รอทีมกู้ภัยอยู่ที่เดิมและเอ่ยชมเชยลูกชายของจิลแบร์ จากนั้นอีวานมุ่งหน้าไปช่วย **อิซาเบลล์** ที่ถูกล้อมด้วยกองกำลังคนแคระจำนวนมากภายใต้การนำของ **ร้อยโทอาวุโสอัสเตอร์ก** (ระดับผู้บัญชาการกองพันหนึ่งพันนาย) ซึ่งหมายจะสังหารทายาทผู้กล้า อีวานส่งสัญญาณเสียงเดาะลิ้นระบุตำแหน่งด้วยเสียงสะท้อนจนคนแคระจำได้ว่าเป็น **หน่วยเก็บกวาด** และเปิดฉากยิงส่องสว่างเข้าปะทะ\n- **บทที่ 44**: อีวานเดินมาหาอิซาเบลล์ (ซึ่งเข้าใจผิดคิดไปไกลว่าคำสั่งให้อยู่เฉยๆ เป็นเหมือนคำสารภาพรัก) ก่อนเปิดฉากสังหารหมู่กองกำลังองครักษ์คนแคระ 30–50 ตนในโถงทางเดินมืดด้วยตัวคนเดียวอย่างเหนือชั้นทั้งดาบ กริช ปืนพก ขวาน และค้อนที่ชิงมา พร้อมรำลึกถึง **สงครามเหมืองแร่** เมื่อ 10 ปีก่อน จนกระทั่งเข้าประชิดตัว **อัสเตอร์ก** และสังหารทิ้งหลังอีกฝ่ายเอ่ยปากดูหมิ่นหนวดเคราของ **องค์สุริยราชา** หลังจบศึกอีวานอุ้มอิซาเบลล์ที่ขาอ่อนแรงออกมาแต่ปฏิเสธคำชวนเลี้ยงข้าวตามหลักปฏิบัติของสายลับ\n- **บทที่ 45**: **ดมิทรี** สั่งตัดเงินเดือนตนเองด้วยความอับอายที่ข่าวกรองพลาดท่าให้คนแคระลอบขุดอุโมงค์ในเมืองหลวงและรีบออกตามหาอีวาน ด้าน **อิซาเบลล์** ระบายความสับสนเรื่องความสัมพันธ์กับอีวานให้ **เอคไดซิส** ฟังเป็นรอบที่ 4 (เอคไดซิสรับปากจะช่วยสืบผ่านคุณลุง **ฮัน/มอร์ด**) ส่วน **เอนริเก้** ก็หนีความรับผิดชอบมานอนอู้ในห้องทำงานของอีวานที่สถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซียหลายวันจนถูกอีวานไล่กลับไป (พร้อมเอ่ยเปรยไอเดียจัดทริปทัศนศึกษาทางทะเลให้สถาบันเซนต์ยัน) ส่งผลให้ **มอร์ด** นำไปเล่าให้หลานสาวฟังจน **เอคไดซิส** เข้าใจผิดใหญ่โตว่าอีวานเป็นเสือผู้หญิงที่คบซ้อนอยู่กับเอนริเก้ถึงขั้นนอนค้างด้วยกัน 3 วัน และสาบานต่อหน้าไวโอลินว่าจะกำจัดอีวานเพื่อปกป้องเพื่อนรักให้ได้\n- **บทที่ 46 (สตอล์กเกอร์ ปะทะ สตอล์กเกอร์)**: เกริ่นระบบข่าวกรองของ 4 มหาอำนาจในสหราชอาณาจักร (โดรเวียน คาลีออน ทิลีส และคราซิลอฟจากยุค *เหล่าบุตรแห่งเอนริเก้* -> *หน่วยเก็บกวาด* -> *กองบัญชาการข่าวกรอง*) ขณะที่ **อีวาน** นั่งส่องกล้องจดบันทึกเมนูอาหารกลางวันของเด็กๆ ในสายปาร์ตี้ผู้กล้า หลังเหตุการณ์คนแคระซุ่มโจมตีจนเด็กปี 1 คณะอัศวินเข้าโรงพยาบาลกันหมด สถาบันจึงเลื่อนสอบ 1 สัปดาห์ ทำให้นักศึกษาคณะอัศวินเดือดดาลกับข้อสอบข้อเขียนจนพาลไปหาเรื่องคณะดุริยางคศิลป์ ทว่า **เอคไดซิส** (กับพี่วีโอรุ่นที่ 3) กลับฟาดนักศึกษาปี 1 คณะอัศวินร่วงไป 5 คนรวด พวกนักศึกษาจึงไปตาม **มอร์ด** ออกมาสู้แต่พอเห็นหลานสาว มอร์ดก็ยอมแพ้ทันทีและไล่พวกนักศึกษาขุนนางทิลีสกลับไปอ่านหนังสือ ด้านเอคไดซิสตั้งสติกลับมาสืบหา “คนสวน” อีวานจนเห็นเขากำลังแอบจดประวัติ **เอลเฟียรา** อยู่บนต้นไม้ จึงเริ่มสะกดรอยตามอีวานในฐานะสตอล์กเกอร์\n- **บทที่ 47**: **อีวาน** รู้ตัวตั้งแต่ต้นว่า **เอคไดซิส** กำลังสะกดรอยตามตนด้วยกิ่งไม้พรางตัวอย่างไม่เนียนเลยแม้แต่น้อย ก่อนจะใช้เวท ‘รบกวนการรับรู้’ ไปพบ **ดมิทรี** ที่ระเบียงทางเดินคณะอัศวิน ดมิทรีรายงานว่าสืบพบเบาะแสชิ้นส่วนระเบิดในวันปฐมนิเทศว่ามาจากกลุ่มขุนศึก **‘ยาร์ล’** ใน **โดรเวียน** ที่ยอมจำนนต่อไอนาร์แต่ยังแอบก่อเหตุลับๆ เพื่อหมายหัว **เอคไดซิส** หวังจุดชนวนสงครามระหว่างไอนาร์กับคราซิลอฟและบีบให้ **เอลิซาเวตา** เสียความน่าเชื่อถือเพื่อปูทางให้กองทัพหนุน **มกุฎราชกุมารอเล็กซานเดอร์** อีวานจึงวางแผนปล่อยให้เอคไดซิสสะกดรอยตามตนต่อไปเพื่อให้อยู่ในสายตาตลอดเวลาและใช้เป็นเหยื่อล่อพวกผู้ก่อการร้าย จนทำให้เอคไดซิสเข้าใจผิดคิดว่าตนเองกลายเป็นเป้าหมายรายต่อไปของอีวานจนแทบร้องไห้\n- **บทที่ 48**: **เอคไดซิส** ถูกเพื่อนร่วมคณะดุริยางคศิลป์อิจฉาดูแคลนเรื่องไวโอลินสตราดิวาเรียสราคาแพงและไม่ยอมบอกตารางเรียนที่เปลี่ยนไป จนเธอนั่งร้องไห้ในห้องซ้อมคนเดียว ก่อนจะนึกย้อนถึงเหตุการณ์เมื่อ 10 ปีก่อนข้างกองไฟในสนามรบที่ “คุณลุง” คนหนึ่ง (ซึ่งแท้จริงคือ **อีวาน** สมัยสงคราม) เคยบอกให้เธอวางขวานแล้วเลือกจับเครื่องดนตรีอย่าง **ไวโอลิน** เพื่อเป็นสะพานเชื่อมผู้คนในยุคสันติภาพ เธอจึงฮึดสู้และไม่ยอมแพ้เพื่อรำลึกถึงคุณลุงที่เธอเข้าใจว่าเสียชีวิตไปแล้วและถูกฝังที่สุสานแห่งชาติคราซิลอฟ ตัดกลับมาที่สถานเลี้ยงเด็กกำพร้า **อีวาน** ไล่ **มอร์ด** ออกจากงานอาสาสมัครซักผ้าหลังจากซักผ้าเด็กขาดยับเยินมา 2 เดือน เพื่อปล่อยให้มอร์ดกลับไปทำหน้าที่คุ้มกันข้างกายเอคไดซิสและใช้เป็นตัวล่อสายลับจากโดรเวียนที่อาจติดต่อเข้ามาหาเขา\n- **บทที่ 49**: **อีวาน** ฝึกฝน ‘ขอบเขตของผู้เหนือมนุษย์’ ให้ **อิซาเบลล์** ทุกค่ำคืนโดยถ่ายทอดคำสอนของ **เอนริเก้** ว่าอย่าหลงอยู่ในเงาของผู้เดินนำหน้า อิซาเบลล์เล่าว่า **เซอร์ดิอัน ออกัสต์** เจอชายต้องสงสัยมาด้อมๆ มองๆ หน้าบ้านของเธอแล้วหนีรอดไปได้ อีวานจึงวางตารางเฝ้าระวังแบบเต็มวัน (กลางวันเฝ้า **เอคไดซิส** กลางคืนเฝ้า **อิซาเบลล์**) วันต่อมา อิซาเบลล์ชวนอีวานมาร่วมโต๊ะมื้อกลางวันกับ **ยูริ** และ **เอคไดซิส** ได้สำเร็จ ทำเอาเอคไดซิสช็อกหนักเมื่ออีวานวางผักลงบนแซนด์วิชของเธอพร้อมเทศนาเรื่องโภชนาการจนเธอเข้าใจว่าอีวานสอดแนมกระทั่งเมนูอาหารทุกวันของตน\n- **บทที่ 50**: ขณะที่ **อีวาน** ตามดู **เอคไดซิส** และเตรียมเปลี่ยนขนมคุกกี้เป็นแครอตกรอบอบแห้งให้ **อิซาเบลล์** ก็แอบหนีเรียนมาจับผิดอีวานจนถูกไล่กลับไปตั้งใจเรียนและตั้งปณิธานว่าจะเข้าสู่ขอบเขตผู้เหนือมนุษย์เพื่อจับอีวานมัดสั่งสอนสามัญสำนึกให้ได้ ด้านเอคไดซิสซึ่งหาห้องซ้อมรวมวงไม่เจอก็ได้รับความช่วยเหลือจากอีวานพร้อมกล่องแครอตกรอบอบแห้งและคำให้กำลังใจเรื่องดนตรีเชื่อมโยงผู้คน จังหวะที่อีวานยิ้ม เอคไดซิสลองเอามือบังหนวดเคราของเขาและตกตะลึงที่ใบหน้าของอีวานละม้ายคล้าย “คุณลุง” ผู้ล่วงลับอย่างน่าประหลาด คืนนั้นเกิดเหตุระเบิดพร้อมกัน 5 จุดทั่วเฟรเชนกายา (ธนาคารกลาง โรงละครทรงกลมซาเทรา สถาบันเซนต์ยัน มหาวิหารเซนต์เชเรห์ตา และสถานีตำรวจกลางพราเชนโกเหนือ) ก่อนตัดเข้าสู่เหตุการณ์ที่อีวานเดินลาดตระเวนหน้าบ้านอิซาเบลล์เป็นคืนที่ 3 และใช้ประสาทรับกลิ่นระดับเหนือมนุษย์ตาม ‘รอยกลิ่น’ ของชายสอดแนมไปในความมืด\n- **บทที่ 51**: สายลับที่คอยสอดแนมบ้าน **อิซาเบลล์** วิ่งกลับมารายงาน **อานี** และพูดหลุดปากถึงกำหนดการมาถึงของ **ดิโอนาร์ เอริกสัน** จากโดรเวียน ก่อนถูก **อีวาน** ที่สะกดรอยตามมาจับตัวสอบปากคำด้วยโพชั่นรักษาบาดแผล ฝั่ง **เอคไดซิส** สวดอธิษฐานต่อดวงดาวขอโทษคุณลุงอีวานที่เผลอเอาคนสวนจอมเจ้าชู้ไปเปรียบเทียบ ก่อนชวน **มอร์ด** ออกไปเดินเล่นยามค่ำคืนฤดูร้อนในเฟรเชนกายา ส่วนอีวานเค้นความจริงจากลูกสมุนจนรู้ชื่อองค์กรกบฏข้ามชาติ **‘ฤดูใบไม้ผลิของปวงชน’** ที่ชูอุดมการณ์ประชาธิปไตยบังหน้าเพื่อลอบสังหารทายาทปาร์ตี้ผู้กล้า โดยมี **มกุฎราชกุมารอเล็กซานเดอร์** และสายข่าวที่รั่วไหลจากในวังคราซิลอฟหนุนหลังอยู่ อีวานจึงแบกขวานขึ้นบ่าเตรียมตามล่าตัว **ดิโอนาร์ เอริกสัน** ต่อไป\n\n- **บทที่ 52**: **ดมิทรี** เตรียมรับมือสงครามกลางเมืองที่ใกล้ปะทุในคราซิลอฟ ด้าน **อีวาน** สอบปากคำสายลับด้วยขวานสลับโพชั่นรักษาบาดแผลจนรู้ว่า **ดิโอนาร์** ลอบเข้ามาในเฟรเชนกายาแล้วและไม่ได้เล็งแค่ตัวเอคไดซิสแต่หมายจะก่อปฏิวัติทั่วเมืองหลวง อีวานจึงรีบมุ่งหน้าไปคุ้มกัน **เอคไดซิส** ทว่าเธอและ **มอร์ด** ที่เพิ่งออกมาเดินเล่นยามค่ำคืนกลับเผชิญหน้ากับ **ดิโอนาร์ เอริกสัน** (ฮัสคาลของกษัตริย์ไอนาร์และน้องร่วมสาบานของมอร์ด) เข้าเสียก่อน\n- **บทที่ 53**: ท่ามกลางสายฝนฤดูร้อน **อีวาน** มาถึงบ้านพักที่ว่างเปล่าของเอคไดซิส ขณะที่ **เอนริเก้** และ **ลูเซีย** ลงไปสกัดฝูงก็อบลินนักขุดเหมืองของคนแคระในคลองใต้ดินเฟรเชนกายา จู่ๆ แรงสั่นสะเทือนจากการขุดเจาะใต้ดินด้วย **เครื่องขุดเจาะทลายปฐพี** ก็ปะทุขึ้น 5 จุดทั่วเมือง อีวานวิเคราะห์ว่าเป็นตัวลวงและรีบแกะรอยตามกลิ่นของมอร์ดจนพบร่าง **มอร์ด** นอนจมกองเลือดหลังถูก **ดิโอนาร์** (ที่ทรยศเพราะต้องการลบล้างชาติกำเนิดลูกทาสติดที่ดิน) แทงชิงตัว **เอคไดซิส** ไป อีวานช่วยชีวิตมอร์ดด้วยโพชั่นและตามรอยกลิ่นจากเศษแขนเสื้อของดิโอนาร์ต่อ ส่วนที่พระราชวัง **เอลิซาเวตา** มีรับสั่งให้ **ดมิทรี** เตรียมกำลังพลเพื่อโค่นบัลลังก์คราซิลอฟ\n- **บทที่ 54**: **อีวาน** แกะรอยกลิ่นดิโอนาร์ไปจนถึง **ทำเนียบกระทรวงการต่างประเทศ** ที่ **มกุฎราชกุมารอเล็กซานเดอร์** เป็นเจ้ากระทรวงและลอบบุกเข้าไปเพียงลำพัง ฝั่ง **ดมิทรี** และกองบัญชาการต่อต้านข่าวกรองบุกยึดกองพลรักษาการณ์นครหลวง ประหารนายทหารสมคบคิด ยึดพระราชวังหลวง ควบคุมตัวกษัตริย์ **คิริลล์ที่ 2** จนทรงสละราชสมบัติ และสั่งอพยพพลเรือนเพื่อให้ระเบิดของพวกกบฏกลายเป็นปืนใหญ่เฉลิมฉลองการครองราชย์ของเอลิซาเวตา ด้าน **เอคไดซิส** ฟื้นขึ้นมาในคุกและพบว่า **อิซาเบลล์** กับ **ออสการ์** ก็ถูกจับมาด้วยเช่นกัน ส่วนอีวานพบ **ดิอัน** ที่บาดเจ็บในห้องสอบสวนชั้นสอง จึงรู้ว่าทิลีสไม่มีไส้ศึก ก่อนจะเดินฝ่าซากศพทหารยามมุ่งหน้าขึ้นสู่ชั้นบนสุดของทำเนียบกระทรวงการต่างประเทศ\n"
};

</script>
  <script>
    const STORAGE_PREFIX = "thirty_years_prologue";
    const data = window.NOVEL_DATA || { novel_title: "30 ปีผ่านไปนับจากบทนำ (30 Years Have Passed Since the Prologue)", chapters: [], illustrations: [] };
    let currentIdx = parseInt(localStorage.getItem(STORAGE_PREFIX + "_ch_idx") || "0", 10);
    let fontSize = parseInt(localStorage.getItem("novel_reader_font_size") || "20", 10);
    let theme = localStorage.getItem("novel_hub_theme") || "dark";
    let currentVolIdx = 0;
    let illustViewMode = localStorage.getItem("novel_reader_illust_view") || "vertical";
    let currentLightboxIdx = 0;

    function goBookshelf() {
      if (location.protocol === "file:") {
        location.href = "../คลังนิยายทั้งหมด.html";
      } else {
        location.href = "../index.html";
      }
    }

    function formatBody(text) {
      const paras = text.split(/\n\s*\n/);
      return paras.map(p => {
        const trimmed = p.trim();
        if (!trimmed) return "";
        if (trimmed === "***" || trimmed === "...") return "<hr/>";
        const html = trimmed
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/\n/g, "<br/>");
        return `<p>${html}</p>`;
      }).join("");
    }

    function updateIllustButtonLabel() {
      const vols = data.illustrations || [];
      const total = vols.reduce((acc, v) => acc + ((v.images || []).length), 0);
      const btn = document.getElementById("btnIllust");
      if (btn) {
        btn.textContent = total > 0 ? `🖼️ ภาพประกอบ (${total})` : `🖼️ ภาพประกอบ`;
      }
    }

    function render() {
      document.getElementById("novelTitle").textContent = data.novel_title || "คลังนิยาย";
      updateIllustButtonLabel();
      const chapters = data.chapters || [];
      if (currentIdx >= chapters.length) currentIdx = Math.max(0, chapters.length - 1);

      const volSel = document.getElementById("volumeSelect");
      const sel = document.getElementById("chapterSelect");
      volSel.innerHTML = "";
      sel.innerHTML = "";

      const ch = chapters[currentIdx];
      if (!ch) {
        document.getElementById("volumeBadge").textContent = "";
        document.getElementById("chapterTitle").textContent = "ยังไม่มีตอนที่แปล";
        document.getElementById("chapterBody").innerHTML = "";
        return;
      }

      const volumes = [];
      chapters.forEach(item => {
        const v = item.volume || "เล่ม 1";
        if (!volumes.includes(v)) volumes.push(v);
      });
      volumes.forEach(v => {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = `📘 ${v}`;
        volSel.appendChild(opt);
      });

      const currentVol = ch.volume || "เล่ม 1";
      volSel.value = currentVol;
      volSel.style.display = volumes.length > 1 ? "" : "none";

      chapters.forEach((item, idx) => {
        if ((item.volume || "เล่ม 1") !== currentVol) return;
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = `${item.title}`;
        sel.appendChild(opt);
      });
      sel.value = currentIdx;

      document.getElementById("volumeBadge").textContent = `📘 ${currentVol}`;
      document.getElementById("chapterTitle").textContent = ch.title;
      document.getElementById("chapterBody").innerHTML = formatBody(ch.content);
      document.getElementById("pageIndicator").textContent = `${currentVol} • ตอนที่ ${currentIdx + 1} จากทั้งหมด ${chapters.length} ตอนที่แปลแล้ว`;

      const hasPrev = currentIdx > 0;
      const hasNext = currentIdx < chapters.length - 1;
      document.getElementById("btnPrevTop").disabled = !hasPrev;
      document.getElementById("btnPrevBottom").disabled = !hasPrev;
      document.getElementById("btnNextTop").disabled = !hasNext;
      document.getElementById("btnNextBottom").disabled = !hasNext;

      localStorage.setItem(STORAGE_PREFIX + "_ch_idx", String(currentIdx));
      localStorage.setItem(STORAGE_PREFIX + "_ch_title", ch.title || "");
      updateScrollProgress();
    }

    function selectVolume(volName) {
      const chapters = data.chapters || [];
      const firstIdx = chapters.findIndex(item => (item.volume || "เล่ม 1") === volName);
      if (firstIdx !== -1) {
        selectChapter(firstIdx);
      }
    }

    function selectChapter(idx) {
      currentIdx = parseInt(idx, 10);
      localStorage.setItem(STORAGE_PREFIX + "_scroll_y", "0");
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function prevChapter() { if (currentIdx > 0) selectChapter(currentIdx - 1); }
    function nextChapter() { if (currentIdx < (data.chapters || []).length - 1) selectChapter(currentIdx + 1); }

    function changeFont(delta) {
      fontSize = Math.max(14, Math.min(32, fontSize + delta));
      document.documentElement.style.setProperty("--font-size", fontSize + "px");
      localStorage.setItem("novel_reader_font_size", String(fontSize));
    }

    function setTheme(t) {
      theme = t;
      document.body.classList.remove("theme-sepia", "theme-light");
      if (t !== "dark") {
        document.body.classList.add("theme-" + t);
      }
      document.getElementById("tDark").classList.toggle("active", t === "dark");
      document.getElementById("tSepia").classList.toggle("active", t === "sepia");
      document.getElementById("tLight").classList.toggle("active", t === "light");
      localStorage.setItem("novel_hub_theme", t);
    }

    function toggleMenu(hide) {
      const shouldHide = typeof hide === "boolean"
        ? hide
        : !document.body.classList.contains("menu-hidden");
      document.body.classList.toggle("menu-hidden", shouldHide);
      localStorage.setItem("novel_reader_menu_hidden", shouldHide ? "1" : "0");
    }

    function openModal(type) {
      const m = document.getElementById("infoModal");
      const title = document.getElementById("modalTitle");
      const content = document.getElementById("modalContent");
      if (type === "glossary") {
        title.textContent = "📚 คัมภีร์ตัวละคร คำศัพท์ และสรรพนาม";
        content.textContent = data.glossary || "";
      } else {
        title.textContent = "🧠 เรื่องย่อสะสมแต่ละตอน";
        content.textContent = data.story_memory || "";
      }
      m.classList.add("open");
    }
    function closeModal() {
      document.getElementById("infoModal").classList.remove("open");
    }

    function openIllustModal() {
      const vols = data.illustrations || [];
      const firstWithImgs = vols.findIndex(v => (v.images || []).length > 0);
      if (firstWithImgs !== -1 && ((vols[currentVolIdx] || {}).images || []).length === 0) {
        currentVolIdx = firstWithImgs;
      }
      renderIllustModal();
      document.getElementById("illustModal").classList.add("open");
    }
    function closeIllustModal() {
      document.getElementById("illustModal").classList.remove("open");
    }
    function setIllustView(mode) {
      illustViewMode = mode;
      localStorage.setItem("novel_reader_illust_view", mode);
      renderIllustModal();
    }
    function selectIllustVol(idx) {
      currentVolIdx = idx;
      renderIllustModal();
    }
    function renderIllustModal() {
      const vols = data.illustrations || [];
      const tabList = document.getElementById("volTabList");
      const container = document.getElementById("illustContainer");
      document.getElementById("btnViewVertical").classList.toggle("active", illustViewMode === "vertical");
      document.getElementById("btnViewGrid").classList.toggle("active", illustViewMode === "grid");

      tabList.innerHTML = "";
      vols.forEach((v, idx) => {
        const count = (v.images || []).length;
        const btn = document.createElement("button");
        btn.className = idx === currentVolIdx ? "active" : "";
        btn.textContent = `📁 ${v.volume} (${count})`;
        btn.onclick = () => selectIllustVol(idx);
        tabList.appendChild(btn);
      });

      const activeVol = vols[currentVolIdx];
      const imgs = activeVol ? (activeVol.images || []) : [];

      if (!activeVol || imgs.length === 0) {
        const folderName = activeVol ? activeVol.volume : "เล่ม 1";
        container.innerHTML = `
          <div class="empty-illust-guide">
            <strong style="color: var(--accent); font-size: 16px;">💡 ยังไม่มีรูปภาพในโฟลเดอร์ "${folderName}"</strong>
            <p style="margin: 10px 0 6px;">วิธีเพิ่มภาพประกอบไลท์โนเวลแบบแยกตามเล่มง่ายๆ:</p>
            <ol style="margin: 0; padding-left: 22px;">
              <li>นำไฟล์รูปภาพ (<code>.jpg</code>, <code>.png</code>, <code>.webp</code>) ไปวางใส่โฟลเดอร์ <code>illustrations/${folderName}/</code> (หรือสร้างโฟลเดอร์ <code>เล่ม 1</code>, <code>เล่ม 2</code>, <code>เล่ม 3</code> เพิ่มได้ตามต้องการ)</li>
              <li>ตั้งชื่อไฟล์เรียงตามลำดับ เช่น <code>00_cover.jpg</code>, <code>01.jpg</code>, <code>02.jpg</code> ระบบจะเรียงรูปให้ตามตัวเลขและนำรูป cover ขึ้นเป็นหน้าปกให้เอง</li>
              <li>ดับเบิลคลิกไฟล์ <code>เปิดคลังนิยายทั้งหมด.bat</code> หรือ <code>เปิดอ่านนิยาย.bat</code> รูปทั้งหมดจะแสดงในหน้านี้ทันทีครับ!</li>
            </ol>
          </div>
        `;
        return;
      }

      const listClass = illustViewMode === "grid" ? "illust-list-grid" : "illust-list-vertical";
      container.innerHTML = `<div class="${listClass}">` + imgs.map((img, i) => `
        <div class="illust-card" onclick="openLightbox(${i})">
          <img src="${encodeURI(img.src)}" alt="${img.name}" loading="lazy" />
          <div class="illust-caption">${i + 1}. ${img.name}</div>
        </div>
      `).join("") + `</div>`;
    }

    function openLightbox(imgIdx) {
      const vols = data.illustrations || [];
      const imgs = (vols[currentVolIdx] || {}).images || [];
      if (!imgs.length) return;
      currentLightboxIdx = (imgIdx + imgs.length) % imgs.length;
      const item = imgs[currentLightboxIdx];
      document.getElementById("lightboxImg").src = encodeURI(item.src);
      document.getElementById("lightboxCaption").textContent = `[${vols[currentVolIdx].volume}] รูปที่ ${currentLightboxIdx + 1}/${imgs.length} — ${item.name}`;
      document.getElementById("lightbox").classList.add("open");
    }
    function stepLightbox(delta) {
      openLightbox(currentLightboxIdx + delta);
    }
    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("open");
    }

    document.addEventListener("keydown", (e) => {
      const lbOpen = document.getElementById("lightbox").classList.contains("open");
      if (lbOpen) {
        if (e.key === "ArrowLeft") stepLightbox(-1);
        if (e.key === "ArrowRight") stepLightbox(1);
        if (e.key === "Escape") closeLightbox();
        return;
      }
      if (e.key === "ArrowLeft") prevChapter();
      if (e.key === "ArrowRight") nextChapter();
      if (e.key === "m" || e.key === "M") toggleMenu();
      if (e.key === "Escape") {
        closeModal();
        closeIllustModal();
      }
    });

    function updateScrollProgress() {
      const docEl = document.documentElement;
      const maxScroll = Math.max(1, docEl.scrollHeight - docEl.clientHeight);
      const pct = Math.min(100, Math.max(0, (window.scrollY / maxScroll) * 100));
      const bar = document.getElementById("readProgressBar");
      if (bar) bar.style.width = pct.toFixed(1) + "%";
    }

    let scrollSaveTimer = null;
    window.addEventListener("scroll", () => {
      updateScrollProgress();
      if (scrollSaveTimer) clearTimeout(scrollSaveTimer);
      scrollSaveTimer = setTimeout(() => {
        localStorage.setItem(STORAGE_PREFIX + "_scroll_y", String(Math.round(window.scrollY)));
      }, 120);
    }, { passive: true });

    document.documentElement.style.setProperty("--font-size", fontSize + "px");
    setTheme(theme);
    if (localStorage.getItem("novel_reader_menu_hidden") === "1") {
      toggleMenu(true);
    }
    const initialSavedScroll = parseInt(localStorage.getItem(STORAGE_PREFIX + "_scroll_y") || "0", 10);
    render();
    if (initialSavedScroll > 0) {
      requestAnimationFrame(() => {
        window.scrollTo(0, initialSavedScroll);
        updateScrollProgress();
      });
    }
  </script>

  <div id="pinGateOverlay" style="display:none; position:fixed; inset:0; z-index:99999; background:#0f172a; color:#e2e8f0; flex-direction:column; align-items:center; justify-content:center; padding:20px; font-family:'Sarabun','Segoe UI',sans-serif;">
    <div style="background:#1e293b; border:1px solid #334155; border-radius:14px; padding:28px 26px; max-width:340px; width:100%; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.4);">
      <div style="font-size:38px; margin-bottom:8px;">🔒</div>
      <div style="font-size:18px; font-weight:bold; color:#38bdf8; margin-bottom:6px;">คลังนิยายส่วนตัว</div>
      <div style="font-size:13px; color:#94a3b8; margin-bottom:16px;">กรอกรหัส PIN เพื่อเข้าอ่าน (จำรหัสอัตโนมัติในเครื่องนี้)</div>
      <input id="pinGateInput" type="password" inputmode="numeric" placeholder="รหัส PIN..." style="width:100%; padding:10px 12px; font-size:18px; text-align:center; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#f8fafc; margin-bottom:12px;" onkeydown="if(event.key==='Enter') checkPinGate()" />
      <button onclick="checkPinGate()" style="width:100%; padding:10px; font-size:15px; font-weight:bold; border-radius:8px; border:none; background:#38bdf8; color:#020617; cursor:pointer;">เข้าสู่คลังนิยาย</button>
      <div id="pinGateErr" style="color:#f87171; font-size:13px; margin-top:10px; display:none;">❌ รหัส PIN ไม่ถูกต้อง</div>
    </div>
  </div>
  <script>
    (function() {
      const EXPECTED_PIN = "0909";
      if (localStorage.getItem("novel_hub_pin_ok") !== EXPECTED_PIN) {
        const gate = document.getElementById("pinGateOverlay");
        if (gate) gate.style.display = "flex";
      }
      window.checkPinGate = function() {
        const val = (document.getElementById("pinGateInput").value || "").trim();
        if (val === EXPECTED_PIN) {
          localStorage.setItem("novel_hub_pin_ok", EXPECTED_PIN);
          document.getElementById("pinGateOverlay").style.display = "none";
        } else {
          document.getElementById("pinGateErr").style.display = "block";
        }
      };
    })();
  </script>
</body>
</html>
