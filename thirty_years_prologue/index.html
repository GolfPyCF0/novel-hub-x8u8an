      "title": "บทที่ 20",
      "content": "“คัดแยกและกรองออก เหลือสามคน และตรงนี้…”\n\nใช้เวลาถึงสามวันกว่าจะมาถึงจุดนี้ อีวานลุกขึ้นยืน พลางนวดหัวตาที่ตึงเครียดจากการเพ่งสายตาอย่างหนัก\n\nเกณฑ์การคัดกรองมีดังต่อไปนี้:\n\nการปรากฏตัวขึ้นอย่างกะทันหันของบุคคลที่มีบุคลิกภาพหรือพฤติกรรมเปลี่ยนไปอย่างมีนัยสำคัญ และผู้ที่แสดงท่าทีแปลกประหลาดผิดวิสัย\n\nการสืบค้นข้อมูลเชิงลึกคงเป็นไปไม่ได้หากไม่ได้รับความช่วยเหลือจากหน่วยข่าวกรอง เพราะมันต้องเจาะลึกเข้าไปถึงแวดวงชนชั้นสูงโดยตรง\n\n“ปัญหาอยู่ที่คนพวกนี้”\n\nคนหนึ่งเป็นเด็กกำพร้าที่สอบเข้าเรียนผ่านโครงการทุนความสามารถภาคปฏิบัติ ส่วนอีกสองคนมีความเชื่อมโยงกับมกุฎราชกุมาร โดยมีพื้นเพมาจากตระกูลขุนนาง\n\nการเข้าไปแทรกแซงถือเป็นเรื่องท้าทาย ต่อให้อีวานปกปิดร่องรอยการมีส่วนร่วมของตนเอง แต่หากสาวลึกลงไปก็คงเชื่อมโยงกลับไปถึงหน่วยข่าวกรอง ซึ่งอยู่ภายใต้การบังคับบัญชาของเอลิซาเวตาอยู่ดี การยั่วยุชนชั้นสูงโดยไม่มีหลักฐานแน่นหนาอาจส่งผลเสียต่ออิทธิพลทางการเมืองของเอลิซาเวตาได้\n\n“มันจะยากเกินไปไหมนะถ้าจะลักพาตัวทั้งสามคนเลย…?”\n\nอีวานเคาะโต๊ะเป็นจังหวะ พลาางนึกภาพเสียงบ่นที่ดมิทรีคงจะทำหากมีเรื่องให้ร้องเรียน (เสียงทำนองเดียวกับที่หมอนั่นมักจะใช้แสดงออกต่อหน้าเอลิซาเวตา)\n\nคนหนึ่งเป็นนักศึกษาปีหนึ่งทุนเต็มจำนวน ซึ่งถูกจับตามองอย่างกว้างขวางอยู่แล้วแม้จะเป็นเด็กกำพร้า การไปกระตุ้นหรือยุ่งกับหมอนั่นอย่างบุ่มบ่ามอาจนำไปสู่สถานการณ์ที่ยุ่งยากซับซ้อน\n\nส่วนอีกสองคนเป็นทายาทของตระกูลขุนนางผู้ทรงอิทธิพล การจะลักพาตัวไปดื้อๆ ย่อมเป็นไปไม่ได้โดยปริยาย\n\nหากคนใดคนหนึ่งเป็น ‘ผู้ถูกสิงร่าง’ จริงๆ เขาอาจจะลงมือได้ห้าวหาญกว่านี้ แต่ในตอนนี้ มันเป็นเพียงข้อสงสัยที่ยังไร้หลักฐานยืนยัน\n\nดังนั้น\n\n“ทำเครื่องหมายไว้ที่สามคนนี้ แล้วเฝ้าสังเกตการณ์พวกมันไปสักพัก”\n\nการฆ่าเป็นทางเลือกที่ทำได้ทุกเมื่อ\n\nแม้แต่การลักพาตัวก็ไม่ใช่เรื่องยากเย็นเกินไปนัก\n\nทว่า เพื่อให้การลงมือสะอาดหมดจดและไร้ที่ติ การเตรียมการย่อมสำคัญที่สุด\n\nด้วยเหตุนี้ หลังจากผ่านไปสามวัน อีวานจึงตัดสินใจเริ่มทำงานที่สถาบันเสียที\n\nนับแต่วันนั้นเป็นต้นมา ก็เริ่มมีข่าวลือแพร่สะพัดเรื่องสัตว์ประหลาดปรากฏตัวขึ้นภายในสถาบันเซนต์ยัน\n\n***\n\nเมื่อต้องติดอยู่ในใยแมงมุมแห่งความมุ่งร้ายและโชคชะตา เอคไดซิสผู้ถูกชะตาลิขิตทอดทิ้งจึงมีทางเลือกอยู่ไม่มากนัก\n\nโชคดีที่ภาคเรียนเพิ่งจะเริ่มต้นขึ้น ไม่ว่าความประทับใจแรกจะเป็นอย่างไร ก็ย่อมมีโอกาสเปลี่ยนแปลงสถานการณ์ได้เสมอ\n\nยกตัวอย่างเช่น การมองหาใครสักคน ‘ที่แม้แต่ท่านลุงยังไม่กล้าเข้าใกล้’ ก็เป็นหนึ่งในทางเลือกนั้น\n\n“ลูกสาวของเพื่อนท่านพ่อ…!”\n\nไม่ว่าจะเป็นการจัดแจงของผู้ปกครองหรือความบังเอิญ แต่มันก็น่าทึ่งไม่น้อยที่ทายาทของปาร์ตี้ผู้กล้ามาเรียนอยู่ชั้นปีเดียวกัน\n\nไม่ว่าท่านลุงของเธอจะไม่ระมัดระวังตัวแค่ไหน เขาก็คงไม่กล้าเข้าใกล้ลูกหลานของผู้กล้าอย่างบุ่มบ่ามแน่\n\nนั่นจึงนำไปสู่นัดกินมื้อกลางวันในครั้งนี้\n\n“ยินดีที่ได้รู้จักนะคะ เอ่อ คุณไอนาร์สดอตตีร์… เรียกแบบนี้ได้ไหมคะ?” [1]\n\n“อ๋อ นั่นมันแปลว่า ‘ลูกสาวของไอนาร์’ เฉยๆ น่ะค่ะ เรียกฉันว่าเอคไดซิสตามสบายเลยนะคะ”\n\n“อืม… แต่คุณเป็นถึง… องค์หญิงเลยไม่ใช่เหรอคะ?”\n\n“ฮ่าๆๆ องค์หญิงเหรอคะ ไม่เคยถูกปฏิบัติแบบนั้นมาก่อนเลย พูดแล้วน้ำตาแทบจะไหลแน่ะค่ะ”\n\n(หมายเหตุผู้แปลอังกฤษ: ชื่อของเอคไดซิสคือ Ecdysis Einarsdottir (เอคไดซิส ธิดาแห่งไอนาร์) คนพูดเลยเข้าใจผิดคิดว่าเป็นนามสกุลของเธอ)\n\nเอคไดซิสที่น้ำตาคลอเบ้าจับมือทักทายเด็กสาวผู้มีเสน่ห์ตรงหน้าอย่างกระตือรือร้น\n\n“เอ๊ะ ฉันเสียมารยาทไปหน่อยหรือเปล่าคะ…? ขอโทษด้วยนะคะ พอดีฉันรู้จักกับอิซาเบลล์น่ะค่ะ… คุณเป็นนักศึกษาปีหนึ่งของคณะอัศวินใช่ไหมคะ? แล้วคุณชื่อว่า…?”\n\n“ฉันชื่อ ยูริ แฟรงก์ ค่ะ คุณเอคไดซิส เรียกฉันว่ายูริเถอะนะคะ”\n\n“เอซี่ หยุดจับมือได้แล้ว ปล่อยมือแล้วถอยออกมา เธอเป็นเชื้อพระวงศ์นะ จำได้ไหม?”\n\n“ขอโทษค่ะ!” เธอกลับมานั่งที่ของตัวเองแล้วเอ่ยขึ้น “อ๊ะ แต่ฉันไม่รู้เรื่องตระกูลขุนนางในราชสำนักคราซิลอฟเลยค่ะ!”\n\n“ไม่รู้เหรอ? เดี๋ยวก็ได้เดือดร้อนหรอกนะรู้ไหม?”\n\nอิซาเบลล์หัวเราะเบาๆ พลางสะกิดเอคไดซิส แกล้งทำเป็นว่าชาติตระกูลของตัวเองไม่ได้ยิ่งใหญ่ไปกว่าเชื้อพระวงศ์\n\nขณะที่เอคไดซิสซึ่งยังคงงุนงงอ้ำอึ้งและหน้าแดงก่ำ ยูริก็เอ่ยแทรกขึ้นมา\n\n“ฉันก็แค่เด็กกำพร้าน่ะค่ะ จริงๆ แล้วแฟรงก์ก็ไม่ใช่นามสกุลแท้ๆ ของฉันด้วยซ้ำ”\n\n“ยิ่งไปกว่านั้น ปกติชื่อยูริเป็นชื่อของผู้ชาย ใช้ชีวิตเอาตัวรอดข้างถนนมันลำบากถ้าใช้ชื่อผู้หญิงน่ะค่ะ”\n\nยูริตอบพร้อมเสียงหัวเราะอย่างไม่ยี่หระ อิซาเบลล์ยิ้มมุมปากแล้วหันไปทางเอคไดซิส\n\n“คนนี้เป็นนักศึกษาทุนเต็มจำนวนของคณะเราเลยนะ ใช้ดาบเก่งสุดๆ ไปเลยล่ะ”\n\n“ว้าว เก่งกว่าอิซาเบลล์อีกเหรอคะ?”\n\n“แน่นอน เก่งกว่าออสการ์ด้วยซ้ำ เอาตรงๆ นะ ฉันยังตกใจเลย เด็กคนนี้โผล่มาจากไหนกันนะ?”\n\n“ชมเกินไปแล้วค่ะ ฉันแค่โชคดีเฉยๆ”\n\n“โชคก็เป็นส่วนหนึ่งของพลังเหมือนกันนะ”\n\nเอคไดซิสสัมผัสได้ถึงความรู้สึกอบอุ่นและสบายใจ\n\nใช่เลย แบบนี้แหละ แบบนี้สิถึงจะถูก\n\nฤดูใบไม้ผลิอันสดใส แสงแดดอันอบอุ่น การเอ่ยชมฝีมือของกันและกันระหว่างมื้ออาหาร และการแข่งขันกันอย่างเป็นมิตร… อุดมคติแบบนี้แหละ\n\nเธอเช็ดน้ำตาโดยไม่รู้ตัว ป่านนี้ท่านลุงของเธออาจจะกำลังไปคุยอยู่กับพวกนักศึกษาคณะอัศวินก็ได้ เธอรีบสลัดภาพนั้นออกไปจากหัวทันที\n\n***\n\nอิซาเบลล์ เอคไดซิส และนักศึกษาปีหนึ่งคนนั้น\n\nอีวานเกาะอยู่บนต้นไม้ เฝ้าสังเกตการณ์และจดบันทึกอย่างละเอียด\n\nเขาไม่ได้ยินบทสนทนาของพวกเธอ แต่เขาเชี่ยวชาญในการแอบฟังและจับใจความ\n\nการสนทนาเป็นไปอย่างเป็นกันเอง ชื่อที่ได้ยินคือ ยูริ (Yuri) หรือไม่ก็ ยูลิ (Yuli)\n\nทั้งสองชื่อล้วนมีอยู่ในทะเบียนนักศึกษาปีหนึ่ง แต่ถ้าอยู่ใน “รายชื่อผู้ต้องสงสัย” ของเขา โอกาสที่จะเป็น ยูริ ย่อมมีมากกว่า\n\nนี่นับเป็นปัญหาใหญ่ เพราะในบรรดาผู้คนทั้งหมด ‘ผู้ต้องสงสัย’ ดันมาคลุกคลีอยู่กับกลุ่มปาร์ตี้ผู้กล้า และใช้ชื่อว่า ‘ยูริ’ เสียด้วย\n\nโดยปกติแล้ว ในเขตวัฒนธรรมคราซิลอฟ ชื่อนี้เป็นชื่อของผู้ชาย ทว่าในเกาหลีและขยายวงไปถึง ‘เอเชียตะวันออกเฉียงเหนือ’ ชื่อนี้กลับนิยมใช้เป็นชื่อของผู้หญิง\n\nหากมีผู้หญิงที่ใช้ชื่อว่ายูริ ความเป็นไปได้ที่จะเป็น ‘ผู้ถูกสิงร่าง’ ย่อมสูงลิ่ว\n\nเขาขีดเส้นใต้สีแดงหนึ่งเส้นลงไปตามแนวบรรทัดแห่งความสงสัย\n\n***\n\n“หมอนั่นกำลังทำอะไรอยู่น่ะ?”\n\nเอนริเก้ผู้สวมหมวกปีกกว้างจ้องมองไปยังอีวาน ลูกศิษย์ของตน\n\nปกติหมอนี่จะประสาทสัมผัสไวมาก จนยากจะเข้าใกล้ในระยะนี้ได้ แต่ดูเหมือนตอนนี้จะไม่ทันรู้ตัวถึงการมีอยู่ของเธอเลย บ่งบอกว่ากำลังจดจ่ออยู่อย่างรุนแรง\n\nเธอมองตามสายตาของอีวานออกไป ไกลออกไปตรงนั้น มีนักศึกษาใหม่กลุ่มหนึ่งกำลังส่งเสียงเจี๊ยวจ๊าวกันอยู่บนม้านั่ง\n\n“นั่นอิซาเบลล์นี่นา…? คนนั้นดูเหมือนเอคไดซิส… พวกเธอรู้จักกันมาสักพักแล้ว… แต่เด็กอีกคนนั่นฉันไม่รู้จักแฮะ”\n\nตอนแรกเธอตั้งใจแค่จะมาดูลาดเลาคร่าวๆ ตามที่หน่วยข่าวกรองไหว้วานมา แต่กลับพบว่าเขากำลังสะกดรอยตามนักศึกษาใหม่ คอยจับตาดูเหตุการณ์ราวกับเป็นสายลับภาคสนามเสียอย่างนั้น\n\n“สไตล์การทำงานไม่เปลี่ยนไปเลยจริงๆ นี่หมอนี่จริงจังกับหน้าที่เกินไปหน่อยหรือเปล่านะ?”\n\nอีวานยังคงรักษาสีหน้าเรียบเฉยไร้อารมณ์ตามแบบฉบับ พรางตัวกลมกลืนไปกับฉากหลังอย่างแนบเนียนราวกับไม่ได้ใส่ใจอะไร มันคือตัวตนที่พิถีพิถันตามปกติของเขา แทบจะเรียกได้ว่าหมกมุ่นอยู่กับเป้าหมายอย่างบ้าคลั่ง\n\nเอนริเก้เพียงแค่ยักไหล่แล้วถอยกลับเข้าไปในเงามืด\n\n***\n\n“ยูจีน! ไปด้วยกันสิ! ตอนบ่ายนายมีเรียนวิชาอะไรเหรอ? ฉันกำลังจะไปเรียนวิชาการตีความพระคัมภีร์น่ะ!”\n\n“ฉันมีเรียนวิชาอรรถาธิบายพระวรสารน่ะ ขอโทษทีนะ”\n\n“อ้าว แย่จัง! งั้นไว้เจอกันทีหลังนะ… ตั้งใจเรียนล่ะ!”\n\nหลังจากยิ้มแย้มและโบกมือลาเพื่อนนักศึกษาที่เขาจำชื่อไม่ได้ ชายหนุ่มที่ถูกเรียกว่ายูจีนก็ปรับสีหน้าให้เคร่งขรึมแล้วก้าวเดินไปตามโถงทางเดินของอาคารเรียน\n\nมันน่าเหน็ดเหนื่อย ยิ่งไปกว่านั้น มันยังน่าสับสนอีกด้วย\n\nถ้ารู้มาก่อนว่าต้องเรียนหนักขนาดนี้ เขาคงไม่เลือกคณะเทววิทยาหรอก แต่ในตอนนั้น มันดูจะเป็นตัวเลือกที่เหมาะสมที่สุดแล้ว\n\n“ฉันใช้ร่างกายตัวเองไปทำเรื่องแบบนั้นไม่ได้หรอก”\n\nนี่คือข้อสรุปที่ชัดเจน สำหรับคนที่ไม่เคยแม้แต่จะจับมีดทำครัวแกว่งไกวมาก่อนในชีวิต จะให้จู่ๆ มาเข้าปะทะกับสัตว์ประหลาดหรือปีศาจในตอนนี้ย่อมเป็นไปไม่ได้\n\nทว่า การเลือกสายอาชีพที่ตัดการต่อสู้ออกไปโดยสิ้นเชิงก็สร้างปัญหาไม่แพ้กัน เขาจำเป็นต้องเลือกอาชีพที่มีส่วนร่วมในสนามรบโดยตรง\n\nดังนั้น จึงต้องเป็นเทววิทยา ผ่านหลักสูตรนักบวช เขาสามารถเรียนรู้สกิลบัฟต่างๆ สกิลรักษา และกระทั่งเวทมนตร์โจมตีศักดิ์สิทธิ์ได้อีกด้วย\n\n“แล้วร่างกายนี้ก็มีความเชี่ยวชาญด้านวิชาดาบอยู่ด้วย”\n\nตัวเอกของเรื่อง “นักดาบคลั่งแห่งดัชชีเหนือ” อย่างยูจีน คืออัจฉริยะด้านเพลงดาบ เรื่องนี้เห็นได้ชัดในหน้าต่างระบบ\n\nขณะที่นักศึกษาปีหนึ่งรอบข้างแสดงพัฒนาการอันเล็กน้อยอยู่ระหว่างเลเวล 8 ถึง 10 และมีทักษะการต่อสู้ที่แทบไม่มีความหมาย ร่างกายนี้กลับสร้างวีรกรรมอันน่าทึ่งด้วยการบรรลุ “[ความเชี่ยวชาญดาบ Lv 5]” ได้ตั้งแต่วันแรกที่เข้ามาสิงร่าง\n\nเขาก้าวข้ามระดับของครูฝึกปีหนึ่งประจำคณะอัศวินของสถาบันเซนต์ยันไปเรียบร้อยแล้ว หรือพูดอีกอย่างก็คือ เขาก้าวข้ามระดับของนักศึกษาปีหนึ่งไปแล้ว\n\nอย่างไรก็ตาม อุปสรรคอยู่ที่ความแตกต่างระหว่างแง่มุมทางเทคนิคของการเรียนรู้วิชาดาบ กับการใช้มันเพื่อเข่นฆ่า — สองสิ่งนี้ต่างกันราวฟ้ากับเหว\n\nสำหรับคนเกาหลีสมัยใหม่ที่ไม่เคยแม้แต่จะบิดคอไก่มาก่อน นี่คืองานที่ยากลำบากและฝืนใจอย่างที่สุด…\n\n“เพราะงั้น นักบวชจึงเป็นตัวเลือกที่ดีที่สุด…”\n\nแนวหลังที่ไม่จำเป็นต้องออกไปลุยในแนวหน้า แค่คอยรักษาหรือร่ายเวทมนตร์ไม่กี่บทก็เพียงพอแล้ว แถมยังกวัดแกว่งดาบได้เก่งกว่าค่าเฉลี่ยอีกต่างหาก\n\nเขามักพูดกันว่าควรเอาความสามารถที่แท้จริงไปทำเป็นงานอดิเรกไม่ใช่หรือ? มันก็เป็นเรื่องธรรมดาอยู่แล้วที่ไอดอลซึ่งแสดงละครเก่งกาจจะได้รับความนิยมมากกว่านักแสดงสายจริงจังเพียงอย่างเดียว\n\nปัญหาประหลาดที่เกิดขึ้นตรงนี้ก็คือ:\n\nประการแรก หลักสูตรในคณะเทววิทยาของสถาบันเซนต์ยันนั้นเข้มข้นเทียบเท่า หรืออาจจะเข้มข้นยิ่งกว่าในเกาหลีสมัยใหม่เสียอีก\n\nประการที่สอง มีซานตาคลอสหน้าหินท่าทางน่าสงสัยกำลังสะกดรอยตามเขาอยู่\n\n“หมอนั่นมันเป็นใครกันแน่วะ…!”\n\nในนิยายต้นฉบับไม่มีเหตุการณ์แบบนี้เลยสักนิด อันที่จริง โลกใบนี้มันต่างออกไปจากเนื้อเรื่องต้นฉบับโดยสิ้นเชิง ไม่มีจักรวรรดิแดงที่แฝงความหัวรุนแรง ไม่มีจอมมารปรากฏตัว หรือปาร์ตี้ผู้กล้าอะไรนั่นในนิยายต้นฉบับเลย โดยพื้นฐานแล้วต้นฉบับเป็นเพียง ‘มหากาพย์ตระกูล’ ทั่วๆ ไป ที่หมุนรอบการต่อสู้ระหว่างตระกูลจอมเวทชั่วร้ายและมีความยาวราว 1,000 ตอนเท่านั้น!\n\nจุดร่วมเพียงอย่างเดียวระหว่างโลกใบนี้กับนิยายเรื่องนั้นก็คือ แผนผังสกิลที่คุ้นเคย หน้าต่างสถานะ และสถานการณ์ภายในตระกูลที่คุ้นตา\n\n“แกรนด์ดยุกแห่งแดนเหนือ…? จะมีแกรนด์ดยุกแห่งแดนเหนือได้ยังไง ในเมื่อประเทศคราซิลอฟเองก็ตั้งอยู่ทางเหนืออยู่แล้ว!”\n\n“แล้วทำไมฉันถึงมองไม่เห็นเลเวลของหมอนั่นเลยล่ะ…!”\n\nเป็นที่รู้กันดีว่าสัญลักษณ์จะเปลี่ยนเป็น ‘???’ เมื่อช่องว่างของเลเวลห่างเกินระดับปกติ\n\nทว่า แม้แต่เรื่องนั้นก็ย่อมมีขีดจำกัด แล้วทำไมเลเวลของคนสวนประจำสถาบันถึงแสดงผลแบบนั้นล่ะ? เขายังเคยนึกทอดถอนใจกับความจริงที่ว่าขนาดหัวหน้าตระกูลของตัวเองยังเลเวลแค่ 59 เองด้วยซ้ำ\n\nตรงหางตาของเขา สัตว์ประหลาดมีเคราตาโตกำลังจ้องเขม็งลงมาจากบนต้นไม้\n\nดูเหมือนไม่มีใครรอบตัวสังเกตเห็นเลย เขาจึงพยายามทำเป็นไม่สนใจ ทว่าเขากลับสัมผัสถึงตัวตนนั้นได้อย่างเลือนรางด้วยสกิล [สัญชาตญาณขยายขอบเขต Lv 3]\n\n***\n\n“หมอนั่นกำลังตามคนอยู่ทั้งหมดสามคน”\n\nเอนริเก้มั่นใจ ตอนแรกเธอนึกจะปล่อยผ่านไป โดยคิดว่าอีวานคงได้รับมอบหมายให้มาคุ้มครองสมาชิกปาร์ตี้ผู้กล้า แต่แล้วเธอก็ตระหนักได้ว่าอีวานกำลังสะกดรอยตามนักศึกษาบางคนโดยเฉพาะด้วยเหตุผลบางอย่าง\n\nปัญหาคือ… สามคนนั้นไม่มีอะไรที่เหมือนกันเลยสักอย่าง คนหนึ่งมาจากคณะเทววิทยา อีกคนมาจากคณะอัศวิน และคนที่สามมาจากคณะเวทมนตร์\n\nภูมิหลังของพวกเขาไม่เข้ากันเลยสักนิด — ลูกชายขุนนาง เด็กกำพร้า และลูกสาวคนเล็กของนักเขียน มันไม่สมเหตุสมผลเอาเสียเลย\n\n“ไหนจะท่าทางพวกนั้นอีก วิธีที่หมอนั่นจ้องเขม็ง หมอบซุ่มอยู่ในพุ่มไม้ มันเหมือนกับแววตาของสัตว์นักล่า… แทบจะเหมือนกำลังจ้องมองศัตรูอยู่เลย”\n\n“พวกเราไม่ควรจะไปแตะต้องนักศึกษาพวกนั้นไม่ใช่หรือไง?”\n\nเด็กกำพร้าที่เกือบจะพังประตูเข้ามาเพื่อสอบชิงทุนดูเหมือนจะดึงดูดความสนใจจากหลายฝ่าย ส่วนลูกหลานขุนนางอีกสองคนก็มาจากตระกูลชนชั้นสูง\n\nเห็นได้ชัดว่าพวกเขาเป็นบุคคลที่เกี่ยวข้องกับราชวงศ์ การเข้าไปยุ่งย่ามไม่ใช่เรื่องฉลาดเลย โดยเฉพาะเมื่อทั้งคู่สังกัดคณะเวทมนตร์และคณะอัศวิน หากจะมีจุดร่วมสักอย่าง ก็คือหัวหน้าของคณะเหล่านั้นไม่ได้มาจากคราซิลอฟ\n\nโดยธรรมชาติแล้ว คณะเทววิทยาอยู่ภายใต้การดูแลของท่านนักบุญหญิง ส่วนคณะเวทมนตร์บริหารจัดการโดยเหล่าเอลฟ์แห่งคาลีออน กล่าวอีกนัยหนึ่ง การสร้างความเสียหายแก่นักศึกษาเหล่านั้นย่อมก่อให้เกิดปัญหาใหญ่หลวงตามมาแน่\n\n“คงไม่หรอกมั้ง หมอนั่นคงไม่ทำถึงขนาดนั้นหรอก…”\n\nเอนริเก้แสยะยิ้ม ทว่าในใจลึกๆ เธอกลับกำลังคิดว่าไอ้คนบ้าคนนี้อาจจะทำลงไปจริงๆ ด้วยเหตุผลบางอย่างก็ได้\n\nจอมโจรแห่งปาร์ตี้ผู้กล้า แวมไพร์ผู้ครองตรอกซอกซอยมืดของเฟรเชนกายามานานนับศตวรรษ เตรียมพร้อมเข้าแทรกแซงในกรณีฉุกเฉินอยู่เสมอ และกำลังสะกดรอยตามเจ้าสตอล์กเกอร์นักศึกษาคนนั้นอยู่ไม่ห่าง\n\n***\n\n“มันสบตากับฉัน”\n\nแม้จะสะกดรอยตามอยู่ห่างจากอาคารหลักของคณะเทววิทยามากแล้ว แต่ไอ้เด็กนั่นกลับรับรู้ถึงตัวตนของฉันได้\n\nอีวานผู้มีดวงตาลึกโหลจ้องเขม็งไปยังชายหนุ่มใน ‘รายชื่อผู้ต้องสงสัย’\n\nเยฟเกนี โนคอฟ คารัมจิน\n\nเยฟเกนีเป็นชื่อธรรมดา ไม่มีอะไรพิเศษ ทว่าชื่อเยฟเกนีสามารถตีความออกมาเป็น ยูจีน (Eugene) ในเขตวัฒนธรรมเอเชียได้ แน่นอนว่ามันมีความหมายแตกต่างจากนักบุญยูจีนีออสในศาสนาคาทอลิก\n\nดังนั้น บุคคลที่มีชื่ออยู่ใน ‘รายชื่อผู้ต้องสงสัย’ คนนี้จึงมีความเป็นไปได้สูงที่จะเป็น ‘ผู้ข้ามมิติ’\n\nอีวานขีดเส้นใต้สีแดงสองเส้น ทั้งการตรวจจับการพรางตัว ความเคลื่อนไหวที่น่าสงสัย และชื่อที่น่าสงสัย\n\n---\n\n1. คำว่า “dottir” (ดอตตีร์) ที่ท้ายประโยคเป็นภาษาไอซ์แลนด์ แปลว่า “ลูกสาว” เป็นคำต่อท้ายแสดงนามสกุลตามชื่อบิดา โดยจะนำชื่อต้นของพ่อมาเติมคำต่อท้าย “-dóttir” สำหรับลูกสาว หรือ “-son” สำหรับลูกชาย"

      "title": "บทที่ 21",
      "content": "อคติยืนยัน (Confirmation bias) ซึ่งเป็นคำที่หมายถึงแนวโน้มในการเลือกสรรเฉพาะข้อมูลที่สอดคล้องกับความเชื่อของตนเอง มักจะกลายเป็นสิ่งที่ไม่อาจต้านทานได้ทันทีที่ความสงสัยก่อตัวขึ้น สถานการณ์ของเอนริเก้ในตอนนี้ก็สะท้อนรูปแบบดังกล่าวเช่นกัน\n\n“หมอนี่มีอะไรบางอย่างผิดปกติ”\n\nเป็นเวลาสามวันแล้วที่เธอแฝงตัวซุ่มดูและย่อยข้อมูลทั้งหมด\n\nตอนที่พวกเขาเข้าร่วมกลุ่มนักฆ่าใหม่ๆ เอนริเก้ได้ปลูกฝังคุณธรรมแห่ง ‘ความอดทน’ ให้แก่เหล่าลูกศิษย์ — ให้ยืนหยัดนิ่งสนิทไม่ว่าสภาพอากาศ แมลง หรือสิ่งใดจะรบกวน เพื่อเฝ้าสังเกตเป้าหมาย ทว่า ขอบเขตที่อีวานทำลงไปนั้นมันเกินกว่าที่เอนริเก้เคยตั้งใจไว้มากนัก\n\nต่างจากตัวเธอที่เป็นแวมไพร์ซึ่งไม่เป็นอันตรายใดๆ ตราบเท่าที่หลีกเลี่ยงแสงแดดหรือพรศักดิ์สิทธิ์ อีวานที่เป็นมนุษย์ย่อมมีความต้องการพื้นฐานอย่างการนอนหลับ อาหาร และการพักผ่อน เอนริเก้หรี่ตามองอีวานพลางถอนหายใจเฮือกใหญ่\n\nการต้องมาคอยดูแลคนวัยขนาดนี้ โดยเฉพาะในอายุปูนนี้แล้ว มันให้ความรู้สึกเหมือนเรื่องตลกร้ายชะมัด\n\n“เฮ้ เจ้าลูกศิษย์”\n\nอีวานยืนนิ่งราวกับรูปปั้น จดจ่ออย่างสมบูรณ์แบบและไม่ตอบสนองต่อเสียงเรียกจากระยะไกลเลยแม้แต่น้อย\n\nการเคลื่อนไหวของดวงตาเขาเผยให้เห็นว่ากำลังครุ่นคิดพูดคุยกับตัวเองอยู่ในหัวอย่างต่อเนื่อง เอนริเก้ยักไหล่ แล้วซุกมือเข้าไปในแขนเสื้อ\n\n– กริ๊ก ปัง!\n\nเธอลั่นไกปืน เป็นการยิงที่สมบูรณ์แบบไร้การเคลื่อนไหวส่วนเกิน กระสุนพุ่งตรงไปยังท้ายทอยอย่างแม่นยำไม่มีสั่นไหว\n\nอีวานเอียงศีรษะหลบ แล้วกระโจนลงมาจากต้นไม้พร้อมขวานในมือ\n\n“เอนริเก้…?”\n\n“เออ ไอ้หนู ออกไปจากตรงนี้กันก่อน เสียงปืนเดี๋ยวจะดึงดูดความสนใจที่ไม่จำเป็น พวกเราจะไปที่บ้านของนาย”\n\n“ตอนนี้ผมกำลังติดพันเรื่องยุ่งๆ อยู่”\n\n“ฉันนี่สิกำลังเดือดร้อนหนัก เดี๋ยวเอลิสก็ร้องไห้อีกรอบหรอกถ้ารู้เรื่องนี้เข้า ไหนๆ ก็ไหนๆ แวะไปเยี่ยมสถานเลี้ยงเด็กกำพร้าของนายเลยละกัน”\n\nเอนริเก้คว้าคอเสื้อของอีวานไว้แน่นแล้วลากตัวออกไป อีวานเหลือบมองใบหน้าของเธอแล้วจึงเก็บขวานกลับเข้าที่\n\nท่านปรมาจารย์ใหญ่เป็นหญิงสาวที่นิสัยแปลกประหลาด ออกจะเพี้ยนๆ อยู่สักหน่อย แต่ไม่ใช่คนที่จะพูดจาไร้สาระ ดังนั้น พวกเขาจึงมุ่งหน้าไปเพื่อเปิดเผยเรื่องเร่งด่วนที่ว่า อีวานปลดตัวเองออกจากอ้อมแขนของเอนริเก้อย่างนุ่มนวลแล้วเดินนำหน้าไป\n\n“ที่นั่นอาจจะรกไปหน่อยนะครับ”\n\n“เออๆ ไปกันก่อนเถอะน่า”\n\n—\n\nครู่ต่อมา เอนริเก้ก็ก้าวเท้าเข้ามาในสถานเลี้ยงเด็กกำพร้าของอีวาน\n\nความประทับใจแรกของเธอคือความงุนงงสับสน\n\n“นี่นายไม่ได้กำลังเพาะเลี้ยงหน่วยนักฆ่าอยู่จริงๆ เหรอ?”\n\n“เป็นความเข้าใจผิดครับ”\n\n“จริงเหรอ…?”\n\nเอนริเก้มองไปรอบๆ อย่างเหม่อลอย ตั้งแต่เด็กเล็กๆ ไปจนถึงเด็กโตที่ใกล้จะเรียนจบ เด็กน้อยพากันเดินไปมาทั่วบริเวณ ทว่ากลับไม่มีเสียงฝีเท้าดังขึ้นเลยสักแอะ แม้แต่ในองค์กรของเธอเอง ก็ยังหาวินัยระดับนี้ได้ยาก เอนริเก้แค่นหัวเราะอย่างผิดหวังออกมาเบาๆ\n\n“ถ้านายมีหลักสูตรพิเศษอะไรก็แบ่งปันให้ฉันบ้างสิ ฉันก็อยากได้เด็กๆ แบบนี้เหมือนกัน”\n\n“ก็แค่จัดตารางชีวิตให้เป็นเวลา แล้วก็ให้กินอาหารที่ครบถ้วนตามหลักโภชนาการครับ”\n\n“พูดจาเพ้อเจ้อใหญ่แล้วไอ้สารเลว”\n\nเอนริเก้หัวเราะคิกคักแล้วเดินต่อ ก่อนจะชะงักฝีเท้าลงอีกครั้ง\n\n“นั่นตัวอะไร? ปีศาจเรอะ?”\n\n“ใช่ครับ”\n\n“พอเลย…! นายรู้ตัวจริงๆ ใช่ไหมว่าถ้าเรื่องนี้ถูกเปิดโปงขึ้นมา ทั้งนาย หมอนั่น แล้วก็ที่นี่ จะต้องตายกันหมด?”\n\n“ผมรู้ครับ”\n\nอีวานยักไหล่ ไกลออกไป อิคารัสกำลังสอนอะไรบางอย่างให้กับพวกเด็กๆ อยู่\n\nเด็กคนหนึ่งวิ่งปรี่เข้าไปหาเขาแล้วซัดหมัดเข้าที่สีข้าง นับเป็นเรื่องน่าทึ่ง การลอบจู่โจมประชิดตัวจากด้านหลังใส่นายกองร้อยที่คลุกคลีอยู่บนสนามรบมานานถึงสามสิบปี\n\nเด็กคนนั้นโห่ร้องอย่างดีใจแล้ววิ่งหนีไปอีกครั้ง หายลับไปจากสายตาในพริบตา\n\n“ทุกคนสมควรได้รับโอกาสในการใช้ชีวิตเยี่ยงมนุษย์ครับ”\n\nเมื่อได้ฟังคำพูดของอีวาน เอนริเก้ก็หรี่ตาลง ช่างย้อนแย้งเสียจริง เพราะสำหรับหัวข้อเรื่องการโอบรับเผ่าพันธุ์ปีศาจ พวกเด็กๆ กลับกำลังพยายามเปิดฉากซุ่มโจมตีอิคารัสอีกระลอกอยู่พอดิบพอดี\n\n“ถึงแล้วครับ”\n\nอีวานเปิดประตูห้องผู้อำนวยการอย่างเงียบเชียบ ห้องที่แสงสลัวด้านหลังผ้าม่านนั้นมืดสนิท\n\nเอนริเก้กำลังจะก้าวเท้าเข้าไปข้างใน แต่แล้วก็หยุดชะงัก เส้นลวดสะดุดบางเฉียบขึงพาดอยู่ตรงหน้าเธอพอดี\n\nมีอยู่หลายสิบเส้น ราวกับใยแมงมุม พวกมันสะท้อนให้เห็นผ่านลำแสงอาทิตย์เพียงสายเดียวที่ลอดผ่านผ้าม่านเข้ามา\n\n“นี่มันอะไรกันหมดเนี่ย…?”\n\nแม้จะไม่มีแสงสว่าง แวมไพร์ก็ยังมีความสามารถในการรับรู้ผ่านเงา นั่นหมายความว่าพื้นที่ภายในอาคารไม่อาจซ่อนเร้นไว้ใต้ผ้าม่านทึบแสงได้\n\nเส้นลวดสะดุด เอาเถอะ ยังพอมองข้ามได้ว่าเป็นมาตรการรักษาความปลอดภัยที่หมกมุ่นเกินเหตุ\n\nแต่สิ่งนี้\n\n“เอาจริงนะ นี่นายใช้ชีวิตอยู่ยังไงของนายเนี่ย?”\n\nอีวานปลดเส้นลวดสะดุดออกโดยไม่พูดอะไรสักคำ เขาไล่ปลดกับดักที่แขวนอยู่บนเส้นลวดแต่ละเส้น ก่อนจะเอื้อมมือไปแตะโคมไฟตรงมุมห้องผู้อำนวยการ\n\nคลิก แล้วโคมไฟเวทมนตร์ก็เปล่งแสงสีฟ้าออกมา ส่องสว่างไปทั่วห้อง\n\nสภาพภายในห้องเละเทะไม่เป็นท่า\n\nกองเอกสารสูงท่วมหัวหลายสิบกอง ประวัติส่วนตัวของใครบางคนถูกเขียนไว้อย่างหนาแน่นด้วยลายมืออันเป็นระเบียบ กระดาษโน้ตที่มีชื่อต่างๆ และด้ายสีแดงที่โยงใยเชื่อมถึงกัน\n\nในใยแมงมุมอันยุ่งเหยิงนี้ แผ่นบันทึกที่ถูกเสียบแทรกไว้อย่างเลี่ยงไม่ได้เผยให้เห็นบทสนทนาธรรมดาๆ — ธรรมดา ทว่ากลับไม่ใช่สิ่งที่ควรปรากฏอยู่ตรงนี้ ทั้งการวิเคราะห์บทสนทนา การคาดเดาน้ำเสียง การอนุมานความหมายและความเปลี่ยนแปลงของน้ำเสียง และการสืบย้อนหาถิ่นกำเนิดของผู้พูดจากสำเนียง แม้แต่ตอนไล่ล่าอาชญากรข้ามชาติภายใต้การแจ้งเตือนระดับสีแดงของกองบัญชาการข่าวกรอง ก็ยังไม่ทุ่มเทแรงกายแรงใจขนาดนี้ และทั้งหมดนี้ถูกทำขึ้นโดยเขา — เพียงลำพัง โดยไม่ได้หลับไม่ได้นอนติดต่อกันหลายวัน\n\nสีหน้าของเอนริเก้ค่อยๆ แข็งกร้าวขึ้น สถานการณ์นี้ รูปลักษณ์นี้ พฤติกรรมนี้ — ทั้งหมดล้วนเป็นสิ่งที่เธอคุ้นเคยเป็นอย่างดี นี่คือร่องรอยของอาการป่วยทางจิตบางอย่าง ชนิดที่ใกล้เคียงกับอาการตื่นตระหนกเฉียบพลัน หรือบางทีอาจจะเรื้อรังมานานกว่านั้น ในหมู่ผู้ที่ตรากตรำอยู่ในสนามรบมาอย่างยาวนาน อาการแบบนี้พบเห็นได้บ้างเป็นครั้งคราว แม้จะไม่ใช่ชนิดที่พบบ่อยนักแต่ก็เปราะบางราวกับระเบิดเวลา แม้แต่ในเฟรเชนกายาตอนนี้ ก็ยังมีถนนหนทางที่เต็มไปด้วยพวกติดยา ซึ่งในหมู่ทหารผ่านศึก มักจะเดินเตร็ดเตร่อยู่ในสภาพเช่นนี้\n\nเอนริเก้สูดลมหายใจเข้าลึกๆ\n\n“อีวาน”\n\n“ครับ”\n\n“นั่งลง”\n\nใบหน้าของอีวานยังคงเรียบเฉยไร้อารมณ์ ดูเหมือนจะชัดเจนอยู่แล้วว่าเขากำลังทำสีหน้าแบบไหนอยู่ภายใต้เคราหนาดกนั้น แน่นอนว่าตัวเขาเองดูเหมือนจะไม่ทันรู้ตัวเลยสักนิดว่ามีอะไรผิดปกติ\n\n“นายได้นอนครั้งสุดท้ายเมื่อไหร่?”\n\n“…น่าจะประมาณสัปดาห์ก่อนครับ”\n\nครั้งสุดท้ายที่เขาหลับตาลง เขากำลังตกอยู่ในฝันร้ายท่ามกลางกองเอกสารเหล่านั้น มันเป็นความรู้สึกที่น่าสยดสยองอย่างแท้จริง และนับแต่นั้นมา เขาก็จงใจอดนอนมาตลอด — อาจจะเรียกว่าเป็นพลังใจเหนือมนุษย์เลยก็ได้ ทว่าเอนริเก้กลับมองเขาด้วยสายตาอันขมขื่น\n\n“บอกฉันมา ทั้งหมดนี่มันคืออะไร? จนกระทั่งดมิทรีขอให้ฉันมาช่วยดูนาย ฉันก็ยังคิดอยู่เลยว่านายแค่พยายามจะปกป้องพวกเด็กๆ”\n\nมันดูชัดเจนแบบนั้นเพราะดูเหมือนเขาจะคอยตามติดแต่สมาชิกปาร์ตี้ผู้กล้า ซึ่งนั่นก็น่าซาบซึ้งใจดี หมายความว่าแม้จะเกษียณอายุราชการไปแล้ว เขาก็ยังคงเป็นห่วงเป็นใยพวกเด็กๆ อย่างจริงใจ ถึงขั้นยอมลงมือด้วยตัวเอง ทว่า ร่องรอยที่เห็นอยู่ตรงนี้กลับบ่งชี้ไปในทางตรงกันข้าม\n\n“นายกำลังพยายามจะจับใครอยู่? ผู้ก่อการร้ายจากสถาบันเซนต์ยันงั้นเหรอ?”\n\n“เปล่าครับ”\n\n“บอกฉันมา แค่พูดความจริง ป่านนี้ฉันดูออกแล้วนะว่านายกำลังปิดบังอะไรบางอย่างอยู่ เล่ามาให้หมดเลย เจ้าลูกศิษย์ของฉัน”\n\nเอนริเก้กุมมือของอีวานไว้แน่นแล้วจ้องลึกเข้าไปในดวงตาของเขาด้วยสีหน้าเคร่งขรึม สำหรับผู้ที่มีชีวิตอยู่มานานกว่าหนึ่งศตวรรษ ย่อมมีความหนักแน่นน่าเชื่อถือแฝงอยู่ในน้ำหนักของกาลเวลา อีวานสบตากับแววตาที่เปี่ยมไปด้วยความปรารถนาจะรู้ความจริงของเธอ ถอนหายใจออกมา และหลังจากนิ่งเงียบไปครู่หนึ่ง ริมฝีปากของเขาก็เปิดออก\n\nมันคือคำสารภาพอันยิ่งใหญ่\n\nหากสมมติว่าบังเอิญมีคนแบบนั้นอยู่ — คนที่จากสถานที่ที่ตนเคยอาศัย ทิ้งใบหน้าที่คุ้นเคยทั้งหมดไว้เบื้องหลัง และตกลงมายังโลกใบใหม่อย่างสิ้นเชิง แบบนั้นเลย ยกตัวอย่างเช่น — ราวกับตกลงไปในโลกจากนิยายเรื่องโปรดที่อ่านโต้รุ่งจนเผลอผล็อยหลับไป เพียงเพื่อจะพบว่าตัวเองหล่นตุ้บลงไปอยู่ในโลกของนิยายเรื่องนั้นในความฝัน\n\nไม่ว่าจะพยายามมากแค่ไหน ก็ไม่อาจตื่นจากความฝันนั้นได้ และโลกใบนั้นก็ยังคงให้ความรู้สึกเหมือนเรื่องราวจากในนิยาย ด้วยความไม่อยากตายหรืออยากจะกลับบ้าน พวกเขาจึงพยายามทำทุกวิถีทางที่ทำได้ โชคดีที่ดูเหมือนตัวเองจะมีพรสวรรค์ที่ช่วยให้ปรับตัวได้ดี หลังจากผ่านประสบการณ์ทุกอย่างมาจนถึงหน้าสุดท้ายของนิยาย คนคนนั้นก็อาจเกิดความคิดขึ้นมาว่า: ทำไมมันถึงยังไม่จบเสียที?\n\nบางทีอาจมีเงื่อนไขที่แตกต่างออกไป หากความตายด้วยน้ำมือตนเองเป็นทางออกที่น่าจะเป็นไปได้มากที่สุด การไตร่ตรองเรื่องนั้นอยู่หลายปีพลางเฝ้าสังเกตสถานการณ์ไปเรื่อยๆ ในระหว่างนั้น จู่ๆ ก็มีคนผู้หนึ่งปรากฏตัวขึ้น บางทีอาจเป็นคนนอกที่มาจากบ้านเกิดเดียวกัน\n\nตอนนี้พวกเขากำลังคิดอะไรทำนองนี้อยู่หรือเปล่า: โลกใบนี้แท้จริงแล้วไม่มีค่าอะไรมากไปกว่าโลกในนิยายงั้นหรือ? ทุกสิ่งที่ฉันได้เผชิญมาเป็นเพียงบทนำของนิยายเรื่องหนึ่งงั้นหรือ? ในนิยายของคนคนนั้น มีชื่อของฉันสลักอยู่แม้เพียงสักหน้าหนึ่งบ้างไหม? ถ้าเป็นเช่นนั้น แล้วถ้าหากว่า วันหนึ่งฉันต้องพบกับจุดจบ มันจะมาในรูปแบบใด? โศกนาฏกรรม? ตลกขบขัน? ไม่ ก่อนหน้านั้นเสียอีก ตัวฉันและชีวิตของฉันเป็นเพียงอารัมภบทของประวัติศาสตร์เพียงหนึ่งบรรทัดงั้นหรือ? เป็นเพียงตัวละครที่รอคอยเวลาจะถูกชุบชีวิตขึ้นมาในเรื่องราวบทใหม่ที่กำลังจะเปิดฉากขึ้นเท่านั้นหรือ\n\nความคิดทำนองนั้น แม้จะยิ่งทวีความสับสนอลหม่านมากขึ้นเรื่อยๆ ทว่าด้วยแววตาที่เปี่ยมไปด้วยความแน่วแน่ เขายังคงเผชิญหน้ากับอาจารย์ของตนต่อไป กระทั่งพยายามอธิบายออกมาในแบบที่คนหัวโบราณจากยุคก่อนสมัยใหม่จะสามารถเข้าใจได้ ด้วยความอ่อนโยนมากที่สุดเท่าที่จะทำได้\n\n“งั้น… สรุปก็คือ… แท้จริงแล้วนายเป็นผู้กลับชาติมาเกิด”\n\n“ครับ”\n\n“แล้วล่าสุดนายก็ยืนยันได้แล้วว่ามีเพิ่มมาอีกคนหนึ่ง”\n\n“ครับ”\n\n“และนายจำเป็นต้องฆ่าหมอนั่นทิ้ง”\n\n“…ครับ”\n\n“เอาเถอะ เจ้าลูกศิษย์ ตรรกะของนายมันก็ฟังดูมีเหตุผลอย่างน่าประหลาดดีนะ”\n\nเอนริเก้ถอนหายใจเฮือกใหญ่ วักน้ำเย็นลูบหน้า แล้วเอนหลังพิงโซฟาชั่วครู่ พลางแหงนมองเพดาน ให้ตายสิ ขนาดบนเพดานยังมีกระดาษโน้ตแปะอยู่เต็มไปหมด น่าอัศจรรย์ใจจริงๆ ว่าติดขึ้นไปได้ยังไงกัน\n\n“ฉันมีเรื่องอยากพูดเยอะแยะเลย แต่คงต้องเริ่มต้นด้วยคำขอโทษเสียก่อน ฉันนึกว่าพวกนายทั้งคู่เป็นผู้ปีนหอคอยจอมมารเหมือนกันเสียอีก” เธอใช้เวลาร่วมกับเด็กหนุ่มคนนี้มานานมากเสียจนเผลอคิดไปเองโดยปริยายว่าเขาก็เคยปีนหอคอยมาก่อนเช่นกัน\n\n“หอคอยจอมมารเหรอครับ?”\n\n“ใช่ น่าแปลกนะ พวกเราทุกคนต่างก็คิดว่าพวกนายทั้งคู่เป็นคนกลุ่มเดียวกัน แต่พอมานึกดูดีๆ มันไม่ใช่แบบนั้นเลย พวกเราไม่เคยแม้แต่จะเอ่ยถึงเรื่องนี้ เพราะต่างก็ทึกทักเอาเองว่ามันเป็นเรื่องที่นายรู้อยู่แล้ว” นั่นเป็นความผิดพลาดของเอนริเก้ อันที่จริง มันเป็นความผิดพลาดของทุกคน การแก้ตัวว่าไม่รู้ถึงสภาพการณ์ของเขาเป็นเรื่องไร้ความหมาย มันไม่ต่างอะไรกับการทอดทิ้งละเลยเขา ทั้งที่ปากก็เรียกว่าลูกศิษย์\n\n“แม็กซ์ไม่ใช่ชาวทิลีส”\n\n“หมายความว่าเขามาจากประเทศอื่นเหรอครับ? แต่…”\n\n“ไม่ใช่ ฟังฉันพูดให้จบก่อน แม็กซ์… แม็กซิมิเลียน หมอนั่นไม่ได้มาจากโลกใบนี้” เอนริเก้มองตรงเข้าไปในดวงตาของอีวาน เน้นย้ำคำพูดแต่ละคำราวกับต้องการสลักมันลงไปในจิตใจของเขา\n\n“นายไม่ใช่คนแรก และนายก็จะไม่ใช่คนสุดท้ายด้วย”\n\nแม้จะเรียกเขาแบบง่ายๆ ว่า “ผู้กลับชาติมาเกิด” ตามคำพูดของเจ้าตัวเพื่อให้เข้าใจสะดวกขึ้น แต่หากจะพูดให้ถูกต้องแม่นยำกว่านั้น คนเหล่านี้ไม่ใช่ผู้กลับชาติมาเกิด หากแต่เป็น “ผู้ที่ถูกดึงตัวมา”\n\nกล่าวอีกนัยหนึ่ง คือเหล่าบุคคลที่ผุดขึ้นมาตามที่ต่างๆ ทีละคนสองคน ยามใดก็ตามที่โลกใบนี้เอียงกะเท่เร่ไปเล็กน้อย ราวกับเครื่องปรุงรสที่ถูกเหยาะเติมลงไปในโลกอันโกลาหล พวกเขาไม่ใช่สิ่งที่พบเห็นได้บ่อยนัก แต่ในช่วงเวลาหนึ่งศตวรรษ ย่อมต้องปรากฏตัวขึ้นสักคนสองคนอย่างหลีกเลี่ยงไม่ได้\n\nบุคคลเหล่านี้ปรากฏตัวขึ้นแล้วก็หายสาบสูญไป ลงมือทำ “อะไรบางอย่าง” ในโลกที่ปั่นป่วนวุ่นวาย พยายามเติมสีสันให้เรื่องราวน่าตื่นเต้น แล้วก็อันตรธานหายไป เอนริเก้รู้จักคนแบบนี้อยู่ เธอถึงขั้นเคยเห็นมาแล้วด้วยซ้ำ แม็กซิมิเลียน หมอนั่นเองก็เป็นหนึ่งในนั้น คนธรรมดาคนหนึ่งที่โหยหาบ้านเกิดของตนเอง ทว่าอย่างน่าทึ่ง เขากลับมุ่งหน้าสู่สนามรบ\n\nดังนั้น เอนริเก้ แม้จะเป็นแวมไพร์ด้วยตนเอง ก็ยังยอมเดินตามการนำของเขา เขาเป็นคนแบบนั้นแหละ ยืนหยัดอยู่เบื้องหน้าทุกคนพร้อมรอยยิ้ม ทำให้ทุกคนยอมติดตาม วีรบุรุษ นักรบ ผู้สังหารจอมมาร และเป็นเพียงชายธรรมดาคนหนึ่ง คนต่างถิ่นผู้ยังคงโดดเดี่ยวตราบจนวาระสุดท้าย บัดนี้ เขาได้หายตัวไปแล้ว ชายคนนั้นยังคงอยู่ในความทรงจำของเอนริเก้ในฐานะเช่นนั้น คนต่างถิ่นผู้กล้าหาญที่ชักดาบออกมาเพื่อปกป้องเด็กสาวสามัญชนที่เขารับมาดูแลจากทิลีส คนแปลกหน้าผู้หาญกล้า\n\n“นั่นแหละคือเหตุผลที่พวกเราไม่พูดกันว่าวีรบุรุษ ‘ถือกำเนิด’ ขึ้นมา ยังไงล่ะ? พวกเราจะพูดกันว่าพวกเขา ‘ปรากฏตัว’ ขึ้นมาต่างหาก”"

      "title": "บทที่ 22",
      "content": "แม็กซิมิเลียนเป็นผู้กลับชาติมาเกิด อันที่จริง ยังมีคนอื่นๆ อีกด้วย\n\nแต่นั่นไม่ใช่ประเด็น แล้วเกิดอะไรขึ้นกับคนพวกนั้นกันล่ะ?\n\nผู้กล้าหายสาบสูญไป เขาหลบหนีไปซ่อนตัวอยู่ที่ไหนสักแห่งในหุบเขาลึกของอาณาจักรทิลีส ทอดทิ้งทั้งภรรยาและลูกสาวไว้เบื้องหลัง\n\nไม่มีใครเข้าใจเหตุผลนั้นได้ ทว่าอีวานคิดว่าตัวเองเข้าใจ นั่นก็เพราะ…\n\n“เขากลับไปแล้วเหรอครับ…?”\n\nอีวานก้มหน้าลงด้วยสีหน้าซีดเผือด\n\nเขากลับไปได้งั้นหรือ? เงื่อนไขคือการสังหารจอมมารหรือเปล่า? แล้วตัวฉันล่ะ… เงื่อนไขของฉันคืออะไรกันแน่…?\n\n– เพียะ—!\n\nภาพตรงหน้าของเขาสว่างวาบ และศีรษะก็สะบัดหันไปตามแรง ความเจ็บปวดแล่นริ้วตามมาทีหลัง อีวานสัมผัสแก้มที่ชาหนึบของตัวเองแล้วตวัดสายตากลับมามอง\n\nเอนริเก้กำลังจ้องมองเขาด้วยแววตาที่เต็มไปด้วยความเศร้าสร้อย\n\n“ตั้งสติหน่อยสิ ไอ้หนู พวกเรายังคุยกันไม่จบนะ”\n\n“…เอนริเก้”\n\n“เออ จำฉันได้แล้วก็ดี”\n\nเอนริเก้ถอนหายใจเฮือกใหญ่พลางทิ้งตัวจมลึกลงไปในโซฟา\n\nไอ้หมอนี่ไม่ได้นอนพักผ่อนให้เพียงพอเลย ไม่สิ มันไม่เคยได้พักผ่อนจริงๆ เลยต่างหาก ฉันเพิ่งเข้าใจเหตุผลเดี๋ยวนี้เอง\n\nนี่ไม่ใช่เรื่องอาการป่วยทางจิตที่เกิดจากสงคราม แต่หมอนี่กำลังถูกตัดขาดจากโลกภายนอก เขายอมรับว่าสถานที่แห่งนี้คือความจริง ทว่าในขณะเดียวกันก็ปรารถนาให้มันไม่ใช่ความจริง\n\nดังนั้น เขาจึงไม่อาจพักผ่อนได้เลย เขาคงจะโดดเดี่ยวมานานแสนนานแล้ว คงต้องขบเคี้ยวความอ้างว้างในทุกค่ำคืน และถูกทรมานด้วยอุดมคติที่ไม่อาจเอื้อมในทุกๆ วัน\n\nผู้กลับชาติมาเกิด เหล่าคนพเนจรผู้ ‘ถูกนำพามา’ จากต่างโลก เอนริเก้รู้สึกเห็นใจคนเหล่านี้อย่างสุดซึ้ง โดยเฉพาะอย่างยิ่งในกรณีของเจ้าคนบ้าที่ทั้งพูดน้อยและบิดเบี้ยวคนนี้\n\nเธอมองตรงเข้าไปในดวงตาของลูกศิษย์ แล้วเอ่ยออกมาอย่างเชื่องช้า\n\n“ทุกคนต่างก็พูดเหมือนกันว่าตัวเองนำพาเรื่องราวของตัวเองติดตัวมาด้วย บันทึกที่หลงเหลืออยู่มีน้อยมาก แต่ในกรณีส่วนใหญ่ก็เป็นแบบนั้น บางคนมีนิทาน บางคนมีตำนานหรือปกรณัม บางคนมีนิยาย บางครั้งก็เป็นบทละคร และยังมีกรณีที่พวกเขาบรรยายถึงสิ่งอื่นอีกเช่นกัน”\n\n“…ทุกคนต่างกันหมดเลยเหรอครับ…?”\n\n“ใช่ อย่างที่ฉันบอกไป พวกเขามีเรื่องราวเป็นของตัวเอง”\n\nไม่มีจุดร่วมใดๆ ว่าเรื่องราวแบบไหนที่นำพาพวกเขามา\n\nทว่าทุกคนต่างก็รู้สึกว่าตนเองได้ตกลงมาสู่เรื่องราวที่ตนเองโหยหา\n\nไม่อาจหยั่งรู้ได้เลยว่าเรื่องแบบนี้เกิดขึ้นได้อย่างไร หรือด้วยวิธีการใด\n\n“พวกเขา… เหล่าผู้กลับชาติมาเกิดพบเจอกับจุดจบแบบไหนกันครับ…?”\n\nนี่คือคำถามที่สำคัญที่สุดซึ่งอีวานเก็บงำไว้ในใจ ชะตากรรมแบบไหนกันที่กำลังรอคอยเขาอยู่?\n\n“บางคนก็หายตัวไปอีกครั้ง บางคนก็ตาย และบางคนก็ยังคงอยู่ต่อไป”\n\n“แล้วผู้กล้าแม็กซิมิเลียนล่ะครับ?”\n\n“อย่างที่นายรู้นั่นแหละ เขาหายตัวไป เอาเถอะ ฉันก็ไม่รู้หรอกนะว่าเขากลับไปแล้ว หรือมีเหตุผลอื่นกันแน่ ฉันเดินไปถามเขาตรงๆ ไม่ได้ และฉันก็ไม่มีหนทางที่จะไปพบเขาด้วย”\n\nอีวานก้มหน้าลงด้วยความรู้สึกวิงเวียนราวกับโลกหมุน\n\nทุกคนต่างก็มีเรื่องราวที่แตกต่างกัน ทุกคนต่างก็มีจุดจบที่แตกต่างกัน… แล้วจุดจบของเขาคืออะไร? คือการถูกกักขังอยู่ในโลกใบนี้ไปชั่วนิรันดร์อย่างนั้นหรือ? ไม่มีหนทางกลับบ้านเลยหรือ? เขาอยากจะเชื่อเหลือเกินว่าความตายไม่ใช่จุดจบเพียงหนึ่งเดียว…\n\nปัง!\n\nเอนริเก้ทุบโต๊ะเสียงดัง เมื่ออีวานเงยหน้าขึ้น เธอก็จ้องมองเขาด้วยแววตาอันเศร้าสร้อย\n\n“แล้วนายมองพวกเรายังไงล่ะ?”\n\n“…อะไรนะครับ?”\n\n“ในโลกของพวกนาย พวกเราก็เป็นแค่ตัวละครประกอบฉากในนิยายงั้นเหรอ? ในโลกของพวกนาย พวกเราก็เป็นได้แค่ ‘ตัวละคร’ ที่ถูกใช้แล้วทิ้งผ่านตัวอักษรไม่กี่บรรทัดแค่นั้นเหรอ?”\n\n“เรื่องนั้น….”\n\n“ไม่ มันไม่มีทางเป็นแบบนั้นหรอก ไม่ต้องพูดก็รู้ใช่ไหมล่ะ?”\n\nในโลกที่เรื่องราวนับล้านสายถักทอเกี่ยวพันกัน หากมีตัวเอกอยู่ถึงหนึ่งล้านคน\n\nตัวเอกคนหนึ่งจำเป็นต้องมองตัวเอกอีกคนเป็นแค่ตัวประกอบอย่างนั้นหรือ?\n\nไม่ ไม่เลย ทุกคนต่างก็เป็นตัวเอกในเรื่องราวของตนเองทั้งนั้น เพราะฉะนั้น…\n\n“แล้วโลกของนายกับโลกใบนี้มันเป็นคนละโลกกันโดยสิ้นเชิงหรือไง? ที่นั่นคือความจริง ส่วนที่นี่เป็นแค่เศษเสี้ยวของนิทานงั้นเหรอ? ไม่ใช่เลย ฉันมีชีวิตอยู่ หายใจอยู่ ฉันเกลียดแสงแดด ฉันเกลียดพรศักดิ์สิทธิ์ ฉันดื่มเลือด และฉันก็ชอบดื่มชา เหมือนกับนายนั่นแหละ”\n\n“เอนริเก้…”\n\n“หรือบางทีนายอาจคิดว่าตัวเองเป็นแค่ตัวประกอบงั้นเหรอ? อย่ามาพูดจาเหลวไหลน่า! นายคือตัวเอกในชีวิตของนาย และฉันก็คือทั้งหมดในชีวิตของฉัน!”\n\nดวงตาของเธอลุกโชนราวกับพร้อมจะกลืนกินอีวานเข้าไปทั้งตัว\n\nอีวานจ้องมองใบหน้าของเธออย่างเงียบงัน\n\n“นายเองก็ไม่อยากเป็นตัวประกอบใช่ไหมล่ะ? ถ้าอย่างนั้นนายคิดยังไงกับพวกเรา? นายคิดยังไงกับฉัน? อีวาน อีวานตัวน้อย นายใช้ชีวิตอยู่โดยคิดว่ากษัตริย์ที่นายเคารพรักเป็นแค่ตัวประกอบในนิทานงั้นเหรอ? นายแอบหัวเราะเยาะอยู่ในใจตอนที่พูดว่า ‘อย่าได้เศร้าโศกถึงผู้ที่ล่วงหน้าไปก่อนเลย’ งั้นเหรอ?”\n\n“ไม่ครับ ผมไม่มีวันทำแบบนั้นเด็ดขาด….”\n\n“งั้นก็จงมีชีวิตอยู่ต่อไป ใช้ชีวิตในเรื่องราวของนายและปิดฉากเรื่องราวของนายเสีย จุดจบที่เรื่องราวจะได้พบไม่ใช่สิ่งที่โชคชะตาหรือโลกใบนี้เป็นผู้กำหนด แต่มันคือสิ่งที่นายต้องเป็นคนตัดสินใจเอง”\n\nณ ปลายทางของแต่ละเรื่องราว ย่อมมีจุดจบที่แตกต่างกัน\n\nทิศทางที่นำไปสู่จุดจบนั้น ไม่จำเป็นต้องเกิดจากชะตากรรมที่ถูกกำหนดไว้ล่วงหน้าเสมอไป\n\nต่อให้การเดินทางของปาร์ตี้ผู้กล้าจะกลายเป็นตำนานไปแล้ว แต่ปัจเจกบุคคลแต่ละคนหาใช่ตัวละครในตำนานไม่ พวกเขาเป็นเพียงคนธรรมดาที่ยังคงมีชีวิตและลมหายใจอยู่จริง\n\nเอนริเก้กุมมือของอีวานไว้แน่นและจ้องมองเขาด้วยสายตาอันแน่วแน่\n\n“นายอยากกลับไปไหม? กลับไปที่บ้านเกิดของนายน่ะ?”\n\n“…ครับ”\n\n“งั้นก็อย่ารอให้โชคชะตามาปิดฉากเรื่องราวของนาย เจ้าลูกศิษย์ จงพลิกหน้ากระดาษด้วยมือของนายเอง พลิกไปให้สุดทาง จนถึงหน้าสุดท้าย”\n\n“ณ จุดสิ้นสุดนั้น จะมีอะไรที่ผมสามารถตัดสินใจเองได้จริงๆ เหรอครับ?”\n\n“ทางเลือกที่จะพลิกหน้ากระดาษขึ้นอยู่กับนายแต่เพียงผู้เดียว เหมือนกับคนอื่นๆ เหมือนกับผู้คนทั้งหมดในโลกใบนี้และโลกของนาย”\n\nผู้กล้าแม็กซิมิเลียนมักจะยิ้มอยู่เสมอ เขายิ้มแย้มอยู่ตลอดเวลาและก้าวไปข้างหน้าทีละก้าว\n\nเมื่อหวนนึกถึงช่วงเวลาที่ความหวังช่างเลือนรางเหลือเกิน เอนริเก้ก็ครุ่นคิดอย่างเงียบงัน\n\nเขาคิดถึงบ้านเกิด เขาคิดถึงคนรักและพ่อแม่ที่รอคอยอยู่ที่บ้านเกิด ทุกครั้งที่ได้ฟังเรื่องราวเกี่ยวกับชีวิตอันแสนสะดวกสบายและอารยธรรมอันน่าอัศจรรย์ของเขา เอนริเก้ก็อดรู้สึกสงสารเขาไม่ได้\n\nนักพเนจรผู้น่าสงสาร นักเดินทางข้ามมิติ คนแปลกหน้า\n\nทว่าผู้กล้ากลับหัวเราะ เขาบอกว่าความธรรมดาสามัญมีความหมายเหมือนกันทั้งในโลกนั้นและโลกใบนี้\n\nดังนั้น เขาจึงไม่ใช่คนพเนจรหรือคนแปลกหน้า แต่เป็นเพียงคนธรรมดาคนหนึ่ง\n\nด้วยภาระหนักอึ้งนับไม่ถ้วนบนบ่า เขาก้าวไปข้างหน้าหนึ่งก้าว แล้วก้าวไปข้างหน้าอีกหนึ่งก้าวเพื่อไขว่คว้าสิ่งที่เขาเชื่อว่าคือ ‘ความธรรมดา’\n\nก้าวทีละก้าว มุ่งหน้าสู่ขุมนรกที่มืดมิดที่สุดของทวีปซึ่งความหวังได้มอดดับไปแล้ว\n\nก้าวไปข้างหน้าหนึ่งก้าว ยินดีที่จะเป็นดั่งประภาคารให้แก่ผู้ที่ไม่มีความกล้าพอจะเดินนำหน้า\n\nความกล้าหาญของเขาตั้งอยู่บนความเชื่อมั่นในความปกติและความธรรมดาสามัญ นั่นคือเหตุผลที่เขากลายเป็นผู้กล้า โดยไม่เกี่ยงถึงอภิสิทธิ์ พรสวรรค์ หรือคุณสมบัติใดๆ เขาเพียงสานต่อสิ่งที่ตนเชื่อว่าคือความธรรมดาอย่างไม่รู้จักจบสิ้น\n\nต่อผู้ที่เอ่ยว่ามันช่างเหนือธรรมดา เขากลับหัวเราะ เขาเป็นเพียงคนคนหนึ่งที่ทำงานซึ่งใครๆ ก็สามารถทำได้เท่านั้นเอง\n\n“ถ้าฉันได้เจอนายเร็วกว่านี้สักหน่อย… ถ้าฉันรับฟังเรื่องราวของนายอย่างจริงจังกว่านี้สักนิด เรื่องมันคงไม่ลงเอยแบบนี้หรอก… ขอโทษนะ เจ้าลูกศิษย์”\n\n“เอนริเก้…”\n\n“ฉันจะเฝ้ายามให้เอง นอนพักเสียเถอะ”\n\n“นอนเหรอครับ?”\n\n“ฉันดูออกนะว่านายไม่ได้นอนหลับให้เต็มอิ่มเลยเพราะนายไม่เคยรู้สึกวางใจที่ไหนได้สักแห่ง อย่างน้อยก็ตลอดสี่ปีมานี้ หรือถ้านานกว่านั้น ก็คงเป็นมาตลอดทั้งชีวิตของนายเลยสินะ”\n\nในห้องนี้ไม่มีห้องนอนอยู่เลยด้วยซ้ำ\n\nหมอนี่คงจะเอาแต่งีบหลับบนโต๊ะทำงานตัวนั้นหรือไม่ก็โซฟาตัวนี้ทุกครั้งแน่ๆ\n\nพลางกังวลว่าหากวันหนึ่งตัวเอกในโลกใบนี้เกิดกำจัดตัวประกอบทิ้งขึ้นมาจะทำอย่างไร หากเรื่องราวจบลงในสถานการณ์ที่เขาไม่อาจทำอะไรได้เลยจะทำอย่างไร\n\nพลางหยิ่งผยองว่าตัวเองจะต้องไม่เป็นแค่ตัวประกอบ ทั้งที่ตัวเองกลับมองคนอื่นเป็นตัวประกอบ และถึงกระนั้นก็ยังปักใจเชื่อว่าตัวเองไม่มีวันได้เป็นตัวเอก\n\n“ถ้าจำเป็น ฉันจะอยู่เฝ้ายามให้ทุกคืนเลยก็ได้”\n\nอีวานไม่ได้ปฏิเสธ เขาเหนื่อยล้าเกินกว่าจะฝืนแล้ว\n\nคิมซอนอูหลับตาลงอย่างเงียบเชียบ\n\nเขาคิดผิดไป โลกใบนี้ไม่ใช่เกมจำลองกลยุทธ์หรือเกม RPG ราชวงศ์ มันอาจจะเป็นเรื่องราวของใครคนอื่น แต่มันไม่ใช่เรื่องราวของตัวเขาเอง\n\nไม่ใช่ทหารในเกมวางแผนกลยุทธ์ ไม่ใช่หน่วยลาดตระเวนของปาร์ตี้ผู้กล้า เรื่องราวของอีวาน เปโตรวิช หรือคิมซอนอู ยังไม่ได้แม้แต่จะเปิดฉากบทที่หนึ่งเลยด้วยซ้ำ\n\n30 ปีผ่านไปนับจากบทนำ\n\nบัดนี้ บทนำของเรื่องราวได้สิ้นสุดลงแล้ว ชื่อของเรื่องราวนี้หาใช่ “แนวเรื่อง” ไม่ แต่คือ “ชีวิต”\n\nบางทีมันอาจจะเป็นเรื่องราวแนวสถาบันการศึกษาก็ได้ อีวานหัวเราะออกมาเบาๆ ขณะทบทวนสถานการณ์ของตนเอง\n\nเขาไม่ได้รู้สึกโกรธแค้นต่อประโยคนั้นอีกต่อไปแล้ว\n\nเขาเหน็ดเหนื่อยและอ่อนล้าเกินกว่าจะโกรธได้ลง\n\nฝ่ามือที่ตบไหล่เขาเบาๆ นั้นช่างอบอุ่น\n\nเขารู้สึกโล่งใจอย่างบอกไม่ถูก\n\n***\n\nวันนั้นคือวันที่คิมซอนอูอายุ 16 ปี และเขากลิ้งเกลือกคลุกฝุ่นอยู่บนสนามรบมาได้สองปีเต็มแล้ว\n\nคิมซอนอูกลิ้งตัวไปบนพื้นพลางกัดฟันกรอด เพราะดาบที่ได้รับแจกจ่ายมาหักสะบั้นลง กระสุนปืนก็หมดเกลี้ยง และพวกปีศาจก็บุกทะลวงแนวป้องกันเข้ามาได้ในที่สุด\n\nเมื่อดาบหัก เขาก็ควานหาหอกบนพื้นขึ้นมาถือ เมื่อด้ามหอกหัก เขาก็ใช้โล่กระแทกซัดมันลงไป เขาคว้าขวานและเหวี่ยงดาบใหญ่เพื่อยื้อชีวิตเอาไว้\n\nตัวเขาเองก็ไม่เคยคิดมาก่อนว่าจะสามารถต่อสู้ได้ถึงขนาดนี้ เขาใช้ร่างกายได้อย่างคล่องแคล่วอย่างน่าประหลาด และไม่รู้สึกเหน็ดเหนื่อยง่ายๆ\n\nแน่นอนว่าดูเหมือนเขาจะลืมความเหนื่อยล้าไปได้ก็เพราะอะดรีนาลีนที่พุ่งพล่านออกมาอย่างรุนแรงในชั่วขณะนั้น\n\nเมื่อพิจารณาจากสมรรถภาพทางกายของเขา ป่านนี้เขาน่าจะหมดแรงและล้มพับไปแล้ว ทว่าอีวานยังคงกลิ้งตัวไปบนพื้นแล้วหยิบดาบขึ้นมา เขาหยิบหอกขึ้นมา เขาเหวี่ยงขวานและใช้โล่ดันศัตรูออกไป\n\nเวลาผ่านไปนานเท่าไหร่แล้วนะในสภาพนั้น?\n\nร่างกายของฉันยังคงขยับอยู่ สายตาของฉันยังคงคมชัด เสียงเดียวที่ได้ยินมีเพียงเสียงลมหายใจของตัวเองและเสียงหัวใจที่เต้นรัวราวกับจะระเบิดออกมา ส่วนจมูกของฉันก็หลงลืมกลิ่นอื่นใดไปนานแล้วนอกจากกลิ่นคาวเลือด\n\nเขามีชีวิตอยู่รอดได้ก็เพียงเพราะการปัดป้อง ผลักไส และเหวี่ยงอาวุธเข้าใส่ทุกสิ่งที่พุ่งเข้ามาหาเท่านั้น\n\nเมื่อความเงียบงันมาเยือนในชั่วขณะหนึ่ง คิมซอนอูจึงสังเกตเห็นเงาร่างมหึมาที่ทาบทับลงมาเหนือตัวเขาอยู่ก่อนแล้ว\n\n“เจ้าสู้ได้ดีมาก”\n\nเสียงทุ้มหนักดังก้องมาจากเหนือศีรษะ เมื่อเขาหันหน้าไปมอง ก็เห็นธงประจำกองทัพ ธงรบแห่งคราซิลอฟ\n\nฝ่ายเดียวกัน คิมซอนอูลดไหล่ลงและค้อมศีรษะทำความเคารพ\n\nชายผู้นั้นขี่ม้าอยู่ ดังนั้นต้องเป็นบุคคลสำคัญเป็นแน่ เมื่ออยู่ใต้ธงรบเช่นนี้ ย่อมต้องเป็นผู้บัญชาการอย่างไม่ต้องสงสัย\n\n“เจ้าชื่ออะไร?”\n\n“กระผมชื่อ อีวาน เปโตรวิช ครับท่าน”\n\n“อายุเท่าไหร่?”\n\n“สิบหกปีครับ”\n\n“ตำแหน่งล่ะ?”\n\n“ทหารเกณฑ์ครับ”\n\nชายผู้นั้นยืนหันหลังให้ดวงอาทิตย์ ทำให้ใบหน้าถูกเงาบดบังไว้ ท่าทางของเขาที่มีแสงตะวันสาดส่องอยู่เบื้องหลังราวกับรัศมีนั้นช่างเจิดจ้าจนแสบตา\n\n“หันหลังกลับไป”\n\nเขาทำตามคำสั่งของผู้บัญชาการและหันหลังกลับไป อีวานนึกว่าอีกฝ่ายกำลังสั่งให้เขาเดินกลับไปยังค่ายหลัก\n\nสายตาของเขาเต็มไปด้วยซากศพมากมายเสียจนมองไม่เห็นพื้นดิน ร่างไร้วิญญาณนับไม่ถ้วน ทั้งปีศาจและมนุษย์\n\nจังหวะที่คิมซอนอูกำลังจะขมวดคิ้ว เขาก็ได้ยินเสียงที่ราวกับจะปลอบประโลมจิตใจดังขึ้น\n\n“เงยหน้าขึ้น มองดูผู้ที่ยังคงยืนหยัดอยู่สิ”\n\nเมื่อนั้นเองที่เขาได้มองเห็นคนอื่นๆ ไม่ใช่ซากศพ แต่เป็นผู้คน\n\nผู้รอดชีวิต เหล่าคนเจ็บ คนที่แทบจะยืนไม่อยู่ต้องใช้หอกหักพยุงร่าง และคนที่กำลังตัวสั่นเทาแต่ก็ยังรอดชีวิตมาได้\n\n“เดิมที ศึกรณรงค์ครั้งนี้ถูกกำหนดให้ต้องพ่ายแพ้ไปแล้ว สถานการณ์บีบบังคับให้ต้องโยกย้ายกำลังพลไปยังแนวรบอื่น”\n\n“….ทรงพระเจริญ!!”\n\nคำพูดของผู้บัญชาการทำให้นายทหารคนสนิทที่อยู่ด้านหลังตะโกนลั่นขึ้นมา ทว่าชายร่างกำยำยังคงเอ่ยต่อโดยไม่ใส่ใจ\n\n“แต่พวกเขารอดชีวิต อีวาน เปโตรวิช จงมองดูผู้ที่เจ้าช่วยชีวิตไว้เสีย ยืดอกขึ้น เจ้าได้ช่วยชีวิตพวกเขา และช่วยหมู่บ้านที่อยู่เบื้องหลังพวกเขา รวมถึงครอบครัวและชาวบ้านของหมู่บ้านเหล่านั้นที่อยู่ที่ไหนสักแห่งด้วย”\n\nผู้บัญชาการลงจากหลังม้าแล้ววางมือลูบศีรษะของเขา เป็นฝ่ามือที่ใหญ่มาก\n\n“ดังนั้นจงยืดอกเข้าไว้ ‘อีวานตัวน้อย’”\n\n“…กระผมไม่ได้ตัวเล็กนะครับ”\n\nเขาตัวสูงกว่าค่าเฉลี่ยของคนในยุคนี้อีกด้วยซ้ำ เขาโตจนถึงขั้นที่ผู้ตรวจการเกณฑ์ทหารนึกว่าเขาเป็นผู้ใหญ่แล้ว\n\n“ตอนข้าอายุเท่าเจ้า ข้าก็สู้เยี่ยงเจ้าจนได้สมญานามว่า ‘อีวานมหาราช’ ข้าไม่บังอาจให้ใครมาเรียกขานด้วยนามเดียวกับข้าหรอก”\n\n“ทรงพระเจริญ…!!”\n\nนายทหารคนสนิทตะโกนขึ้นมาอีกรอบ ชายผู้มีฝ่ามือใหญ่ตบหลังอีวานเบาๆ หนึ่งทีก่อนจะก้าวขึ้นหลังม้าอีกครั้ง\n\n“รักษาและสั่งสอนเด็กคนนี้ให้ดี”\n\n“พระองค์จะทรงรับตัวเขามาหรือพ่ะย่ะค่ะ?”\n\n“ข้ายอมเลี้ยงสิงโตไว้ในสวนสัตว์เสียยังดีกว่า แค่เปิดทางให้เขาก็พอ หากเขาไต่เต้าขึ้นมาถึงจุดที่ยืนหยัดได้ด้วยตนเอง วันหน้าก็คงได้พบกันอีกไม่ใช่หรือ?”\n\nผู้บัญชาการควบม้าจากไป ทิ้งให้คิมซอนอูยืนนิ่งงันด้วยความตกตะลึง\n\nคิมซอนอูซึ่งถูกผู้บัญชาการเรียกว่า “อีวานตัวน้อย” สัมผัสได้ถึงความตื่นเต้นและความภาคภูมิใจอย่างประหลาด เขารู้ว่าตนเองได้ทำสิ่งที่ยิ่งใหญ่ลงไป แม้จะไม่รู้ว่ามันคืออะไรก็ตาม เขาตั้งปณิธานว่าจะตอบสนองความคาดหวังของผู้บัญชาการและก้าวขึ้นเป็นวีรบุรุษที่แท้จริงให้ได้\n\nห้าปีต่อมา เขาจึงได้พบกับชายผู้นั้นอีกครั้ง\n\nห้าปีต่อมา เขาได้รับมอบหมายให้เข้าสังกัด “หน่วยองครักษ์ราชวงศ์”\n\nหลังจากนั้น เขาก็ถูกเรียกว่า อีวาน ‘ตัวน้อย’ มันคือสมญานามอันทรงเกียรติอย่างยิ่ง\n\n***\n\nคืนนั้นอีวานไม่ฝันร้ายเลย\n\nเพราะเขาได้เห็นหน้าอดีตกษัตริย์อีกครั้งในรอบหลายปี อีวานจึงสามารถหลับสนิทลงได้\n\n***\n\n[“เควสต์ระดับ ???” คนสวนแห่งสถาบันเซนต์ยัน – ยกเลิก –]\n\n[โชคอันน่าอัศจรรย์ของคุณได้หยุดลูกเต๋าลงแล้ว คุณรอดชีวิตมาได้]\n\n[เป้าหมาย: สังหาร อีวาน เปโตรวิช คนสวนแห่งสถาบันเซนต์ยัน – ยกเลิก –]\n\n[เป้าหมายทางเลือก: เกลี้ยกล่อม อีวาน เปโตรวิช – ยกเลิก –]\n\n[เป้าหมายทางเลือก: ปกปิดข้อมูล – ยกเลิก –]\n\n[เป้าหมายเพิ่มเติม: เอาชีวิตรอด – ยกเลิก –]\n\n[บทลงโทษหากล้มเหลว: ความตาย – ยกเลิก –]\n\n“นี่มันบ้าอะไรกันวะเนี่ย? เอาจริงดิ นี่มันเรื่องบ้าอะไรกัน…! อธิบายมาเดี๋ยวนี้นะโว้ย!!”\n\nยูจีนกรีดร้องลั่นขณะจ้องมองหน้าต่างแสงสีฟ้าตรงหน้า\n\nแน่นอนว่าไอ้แถบสถานะเวรตะไลนี่ไม่ได้ให้คำตอบอะไรกับเขาเลยสักนิด"

      "title": "บทที่ 23",
      "content": "สถาบันเซนต์ยันไม่มีสวนหย่อม อย่างที่เคยกล่าวไปก่อนหน้านี้ นี่คือจุดสำคัญมาก ดังนั้นจึงควรเน้นย้ำซ้ำอีกเป็นครั้งที่สอง\n\nเพราะฉะนั้น ต่อให้ได้รับกรรไกรตัดแต่งกิ่งไม้ที่สำนักงานธุรการจัดเตรียมไว้ให้มาถือไว้ในมือ อีวานก็ไม่มีอะไรให้ทำอยู่ดี\n\nอย่างไรก็ตาม อีวานที่บัดนี้ตัดสินใจที่จะใช้ชีวิตของตัวเอง หรืออย่างน้อยก็พยายามทำให้ดีที่สุด ย่อมไม่มีทางเลือกอื่น\n\nนี่คือเรื่องราวในตอนที่เขากำลังใช้กรรไกรตัดแต่งกิ่งไม้โค่นต้นไม้อยู่\n\n“นายพยายามจะทำอะไรของนายน่ะ? นายกำลังตัดมันจนเละยิ่งกว่าบอนไซที่บ้านฉันอีกนะ”\n\n“หืม?”\n\nเอนริเก้หัวเราะคิกคักจากด้านหลังเขา อีวานเงยหน้ามองท้องฟ้าและมองต้นไม้อยู่ครู่หนึ่ง ก่อนจะหันกลับมาหาเอนริเก้\n\n“นี่ไม่ใช่เวลานอนของคุณเหรอครับ?”\n\n“แปลกใจที่ได้เห็นสาวงามที่ไม่ได้เป็นพวกขี้เซาหรือไง? นายคงจะเหนื่อยมากสินะ”\n\n(หมายเหตุผู้แปลอังกฤษ: ตอนนี้เป็นเวลากลางวันนะ เอนริเก้เป็นแวมไพร์)\n\nอีวาน ซึ่งเป็นคนปกติธรรมดาที่ไม่เคยมีความรู้สึกหวั่นไหวเชิงชู้สาวกับคนอายุเกิน 70 มาก่อน ก้มศีรษะลงเล็กน้อยเมื่อได้ยินคำพูดของเอนริเก้\n\nคิ้วของเอนริเก้ขมวดมุ่น เธอสูดลมหายใจลึกแล้วเอ่ยขึ้น\n\n“งานของนายคือคนสวนงั้นเหรอ?”\n\n“ก็ในตอนนี้ครับ”\n\n“ฟังดูเป็นเรื่องดีต่อสุขภาพจิตของนายดีนะ ไม่เลวหรอก แต่ใบสั่งยาของฉันมันต่างออกไปนิดหน่อย”\n\nเอลิซาเวตาคงคิดจะช่วยดูแลสุขภาพจิตของเจ้าสัตว์ประหลาดมีหนวดเครา (วัย 30 กว่า) คนนี้ด้วยกิจกรรมสบายๆ ยามว่างพร้อมกับให้ค่าขนมเล็กๆ น้อยๆ\n\nทว่าเอนริเก้คิดต่างออกไป ไอ้หมอนี่ต้องการการฝึกฝนในการปฏิสัมพันธ์กับผู้คน\n\nแน่นอนว่าไม่ใช่ด้วยขวานหรือปืน อย่างเคร่งครัดแล้ว ก็นับรวมเข้าไปด้วยนั่นแหละ แต่ไม่ว่าอย่างไร มันก็เป็นเรื่องของความสัมพันธ์แบบมนุษย์ปกติทั่วไป\n\n“ตามฉันมา ฉันต้องการคนช่วยนิดหน่อย”\n\n“หืม?”\n\n“วันนี้ฉันจะเริ่มสอนในฐานะอาจารย์พิเศษของคณะอัศวิน ฉันเป็นศาสตราจารย์กิตติมศักดิ์อยู่แล้ว แต่เบื่อจะแย่”\n\n“คณะอัศวินเหรอครับ?”\n\n“น่าเสียดายที่ที่นี่ไม่มีคณะนักฆ่าน่ะสิ”\n\nแน่นอนว่าโลกนี้ไม่จำเป็นต้องมีมหาวิทยาลัยที่สอนเรื่องพรรค์นั้นหรอก\n\nนี่คือเหตุผลที่อีวานพบว่าตัวเองกำลังจ้องเขม็งใส่นักศึกษาปีหนึ่งที่อยู่หน้าโพเดียม\n\nตอนที่ 23: นักบุญหญิงกับคนตัดไม้\n\nสถาบันเซนต์ยันเป็นมหาวิทยาลัยชื่อดังระดับนานาชาติที่มีสิ่งอำนวยความสะดวกล้ำสมัยที่สุดสำหรับยุคนี้\n\nตัวอย่างเช่น คณะเทววิทยาที่ดูราวกับยกโบสถ์ทั้งหลังมาตั้งไว้ คณะเวทมนตร์ที่จำลองสภาพแวดล้อมมาจากโรงเรียนนายร้อยคาลีออน และคณะพลศึกษา ซึ่งก็คือคณะอัศวิน\n\nนักศึกษาใหม่ต่างพากันหันซ้ายแลขวาอ้าปากค้าง พวกเขาดูเหมือนลูกเจี๊ยบตัวน้อย ซึ่งทำให้เอนริเก้นึกถึงวันวานเก่าๆ จนอดหัวเราะออกมาไม่ได้\n\nภายในโรงยิมที่จัดวางสังเวียนขนาดใหญ่และอุปกรณ์ฝึกซ้อมต่างๆ ไว้อย่างเป็นระเบียบ เอนริเก้ที่เดินขึ้นไปบนโพเดียมตบแท่นบรรยายดังปังแล้วตะโกนขึ้น\n\n“ยินดีต้อนรับ เด็กๆ ทั้งหลาย!”\n\nราวกับจะประกาศศักดาให้น่าเกรงขาม นักศึกษาใหม่ต่างเริ่มหันมามองศาสตราจารย์ที่พวกเขาไม่เคยเห็นหน้าค่าตามาก่อน\n\nวิชาบังคับของคณะอัศวิน [ความเข้าใจในการต่อสู้ระยะประชิด 1]\n\nมันควรจะเป็นวิชาสำคัญเนื่องจากเป็นวิชาบังคับสำหรับนักศึกษาปีหนึ่งทุกคนในคณะอัศวิน ทว่าหญิงสาวร่างเพรียวบางตรงหน้ากลับดูไม่คุ้นหน้าเอาเสียเลย\n\nเสียงพึมพำของนักศึกษาที่พยายามนึกทบทวนรายชื่อคณาจารย์ดังแว่วขึ้นมา\n\nเอนริเก้แสยะยิ้มพลางยืดออกผายไหล่ผึ่ง\n\n“ฉันชื่อเอนริเก้ เอนริเก้ เซอร์เกเยฟนา ถ้ารู้สึกเหมือนเคยได้ยินชื่อนี้มาก่อน ใช่แล้ว ฉันเองแหละ”\n\n“สมาชิกปาร์ตี้ผู้กล้า!!”\n\n“กรี๊ด!!”\n\n“คมดาบเงา!!”\n\nเอนริเก้หัวเราะร่าเมื่อได้ยินเสียงกรีดร้องและเสียงโห่ร้องปรบมือที่ดังขึ้นประปราย ใช่แล้ว แบบนี้แหละ นี่แหละคือความหมายของชื่อเสียง มูลค่าของชื่อเสียงที่แม้แต่ราชวงศ์ยังไม่กล้าล้อเล่นด้วย\n\nเอนริเก้กล่าวต่อด้วยรอยยิ้มขี้เล่นบนใบหน้า\n\n“สิ่งเดียวที่ฉันสามารถสอนพวกเธอได้ในเทอมนี้มีเพียงอย่างเดียว นั่นคือความพ่ายแพ้! พวกเธอคือผู้ที่เลือกจะต่อสู้ในแนวหน้าด้วยอาวุธ และวิชานี้คือปราการด่านแรกในการเตรียมพร้อมรับมือกับเรื่องนั้น!”\n\nนักรบผู้ถือดาบไม่มีวันชนะการต่อสู้ทุกครั้งไป สักวันหนึ่งความพ่ายแพ้ย่อมมาเยือนอย่างไม่อาจหลีกเลี่ยง และความพ่ายแพ้นั้นมักมาพร้อมกับความตาย\n\nดังนั้น พวกเธอจึงต้องทำความคุ้นเคยกับมัน กับความพ่ายแพ้ มันคือสิ่งที่ต้องเรียนรู้ก่อนจะไปฝึกฝนทักษะการต่อสู้เสียอีก\n\nวิธีรับมือกับความพ่ายแพ้ วิธีเอาชีวิตรอดแม้หลังจากพ่ายแพ้ไปแล้ว\n\nและหากเป็นไปได้ วิธีประเมินความแข็งแกร่งของคู่ต่อสู้ก่อนที่จะพ่ายแพ้\n\n“การสอนพวกเธอทุกคนทีละคนไม่ใช่เรื่องยากหรอก แต่เวลาเรียนมันกระชั้นชิดเกินไป ดังนั้นฉันจะแบ่งกลุ่มพวกเธอตามระดับฝีมือ”\n\nต่อให้เป็นนักศึกษาปีหนึ่งเหมือนกัน แต่ใช่ว่าทุกคนจะเรียนระดับเดียวกันได้ทั้งหมด\n\nแน่นอนว่ามันเป็นไปไม่ได้ที่จะสอนนักศึกษาที่สอบเข้ามาได้อันดับหนึ่งกับนักศึกษาที่เข้ามาด้วยโควตาสำรองในระดับเดียวกัน ใช่ไหมล่ะ?\n\nยิ่งสู้เก่งเท่าไหร่ ก็ยิ่งควรได้เรียนคลาสที่โหดหินมากขึ้นเท่านั้น\n\nดังนั้น การแบ่งกลุ่มจึงเป็นสิ่งจำเป็น ตั้งแต่แรกแล้ว การจะสอนคน 50 คนในเวลาสามชั่วโมงมันก็ยากเกินไปอยู่ดี\n\n“เอาเถอะ เด็กปีหนึ่งทั้งหลาย ถ้าฉันลงไปสู้กับพวกเธอเอง ฉันคงประเมินฝีมือพวกเธอไม่ได้หรอก เพราะพวกเธอคงจบเห่กันในกระบวนท่าเดียวหมด”\n\nแม้จะเจอกับคำพูดอันหยิ่งยโสของเธอ ทว่ากลับไม่มีใครกล้าเอ่ยปากโต้แย้งแม้แต่คนเดียว\n\nปาร์ตี้ผู้กล้าคือผู้ที่สังหารจอมมารและเจ็ดราชามังกร กล่าวอีกนัยหนึ่ง พวกเขาคือผู้ที่แข็งแกร่งที่สุดในสหราชอาณาจักร\n\n“ดังนั้นฉันจะจัดการเรียนการสอนในระดับสายตาที่เหมาะกับพวกเธอให้ นี่คือผู้ช่วยสอนของเรา!”\n\nเมื่อเหล่านักศึกษามองตามท่าทางผายมือของเอนริเก้ ในไม่ช้าพวกเขาก็มองเห็นสัตว์ประหลาดตนหนึ่งยืนกอดอกอยู่ในเงามืด\n\nดวงตาสีน้ำเงินไพลินที่ทอประกาย ใบหน้าคมคาย และสีหน้าเรียบเฉยเย็นชา\n\nทว่ามีหนวดเคราดกหนาปกคลุมช่วงกรามล่างทั้งหมด ทำให้ไม่อาจคาดเดาอายุได้เลย\n\nนอกจากนี้ ยังสวมชุดทำงานเก่าคร่ำคร่าและมีผ้าขนหนูพาดคอ (มันคือชุดทำสวนที่สำนักงานธุรการจัดเตรียมมาให้อย่างเร่งรีบ)\n\nเมื่อเครื่องหมายคำถามขนาดใหญ่ผุดขึ้นเหนือศีรษะของเหล่านักศึกษา เอนริเก้ก็ฉีกยิ้มกว้างพลางเอ่ยขึ้น\n\n“ผู้ช่วยสอนคนนี้คือคนสวนของมหาวิทยาลัยแห่งนี้นี่แหละ ฉันเพิ่งเชิญตัวเขามาอย่างเร่งด่วนเมื่อเช้านี้เอง เอาล่ะ ฉันจะบอกประวัติคร่าวๆ ของผู้ช่วยสอนคนนี้ให้ฟังนะ”\n\nอายุ 34 ปี (นักศึกษาส่วนใหญ่ต่างตกตะลึงกับข้อมูลนี้)\n\nตำแหน่งคือ คนสวน (มีนักศึกษาสองคนที่ตกตะลึงกับข้อมูลนี้)\n\nไม่มีรายได้ อาศัยเงินสงเคราะห์สวัสดิการของรัฐ เป็นคนยากไร้สิ้นเนื้อประดาตัว (เนื่องจากในทางราชการ พันโทเปโตรวิชเสียชีวิตไปแล้ว เขาจึงไม่มีทางได้รับเงินบำนาญทหาร เขาจึงดำรงชีพด้วยเงินบริจาคขณะดูแลสถานเลี้ยงเด็กกำพร้า)\n\n“ผู้ช่วยสอนคนนี้จะเป็นคนประเมินฝีมือของพวกเธอ ฉันจะให้คะแนนพวกเธอระหว่างที่เฝ้าดูการต่อสู้ และจะสรุปการแบ่งกลุ่มให้เรียบร้อยเมื่อจบคาบเรียนนี้”\n\n“ผมมีคำถามครับ!”\n\nนักศึกษาคนหนึ่งยกมือขึ้น เขาแต่งกายด้วยชุดวอร์มเนื้อบางอย่างเรียบร้อยและมีหน้าตาหมดจด ดูท่าทางเหมือนลูกชายตระกูลขุนนาง\n\nเอนริเก้พยักหน้า และชายหนุ่มคนนั้นก็เอ่ยขึ้นด้วยรอยยิ้มเยาะบนใบหน้า\n\n“แล้วถ้าคนสวนยากจนคนนั้นบาดเจ็บสาหัสเกินไปล่ะครับ?”\n\n“ว่าไงนะ? ฮ่าๆๆๆๆๆๆ!!”\n\nเอนริเก้ระเบิดเสียงหัวเราะออกมาจนน้ำตาเล็ด\n\n“งั้นฉันก็คงต้องให้รางวัลเธอแล้วล่ะ! ฉันจะบวกคะแนนพิเศษให้ตามความสาหัสของบาดแผลที่เธอทำกับผู้ช่วยสอนเลย! ฮ่าๆๆๆๆๆ! ให้ตายสิ!”\n\n“…?”\n\n“อ้อ อย่าเข้าใจผิดไปนะเด็กๆ ฉันไม่ได้ทำแบบนี้เพราะอยากเห็นใครตายหรอกนะ แต่อย่างน้อยก็ช่วยรักษามารยาทกันหน่อย ไม่ว่าจะเป็นมารยาทต่อรุ่นพี่หรือต่อผู้ที่มีประสบการณ์มากกว่าพวกเธอ”\n\n“ถ้าหากยังอยากมีชีวิตอยู่ล่ะก็นะ” เอนริเก้กล่าวปิดท้ายพร้อมเสียงหัวเราะ\n\n—\n\nในระหว่างนั้น อีวานกำลังจ้องเขม็งไปยังเหล่านักศึกษา\n\nไม่ใช่เรื่องน่าแปลกใจเลยที่เขาถูกเชิญมาเป็นผู้ช่วยสอนสำหรับการประเมินภาคปฏิบัติ\n\nท้ายที่สุดแล้ว มันเป็น “สามัญสำนึก” อยู่แล้วที่คาบเรียนแรกของสถาบันการศึกษาจะเป็นการประเมินฝีมือ\n\nไม่รู้เหมือนกันว่าทำไมการประเมินภาคปฏิบัติถึงถูกบรรจุไว้ตั้งแต่ชั่วโมงแรกของหลักสูตรมหาวิทยาลัย แต่ก็นั่นคงเป็นเพราะระบบการศึกษาในโลกแฟนตาซียุคก่อนสมัยใหม่แห่งนี้มันยังล้าหลังอยู่นั่นแหละ\n\nเอาเถอะ มีอยู่สี่คนที่น่าจับตามองเป็นพิเศษ\n\nออสการ์ อิซาเบลล์ ยูริ และเจ้ายักษ์กล้ามโตที่นั่งอยู่แถวหลังสุด ผู้คุ้มกันของเอคไดซิส\n\nเดี๋ยวก่อน ทำไมไอ้หมอนั่นมานั่งอยู่ตรงนั้น? มันเป็นนักศึกษาด้วยเหรอ? ไม่อายฟ้าดินบ้างหรือไง?\n\nมันดูประหลาดพิลึกที่มีสัตว์ประหลาดกล้ามโตวัย 40 ปีมานั่งปะปนอยู่ท่ามกลางนักศึกษาที่อายุน้อยกว่าตัวเองครึ่งหนึ่ง\n\nหมอนั่นน่าจะชื่อ มอร์ด ใช่ไหมนะ? มอร์ด เอริกสัน จำได้ว่าเคยเจอกันตอนที่ฉันยังรับราชการอยู่ หมอนี้เป็นหนึ่งในคนสนิทใกล้ชิดที่สุดของกษัตริย์ไอนาร์\n\nหมอนั่นคงพอมีไหวพริบอยู่บ้าง ถึงได้ปลดเกษียณแล้วแฝงตัวเข้ามาเป็น ‘นักศึกษาปีหนึ่ง’\n\n“และก็เด็กคนนั้น”\n\nยูริ ยูริ แฟรงก์ อันดับหนึ่งของนักศึกษาปีหนึ่งคณะอัศวิน ทำคะแนนสูงสุดในการประเมินวิชาดาบและได้คะแนนเต็มในข้อสอบข้อเขียน นักศึกษาทุนเต็มจำนวน\n\nพฤติกรรมของเด็กคนนั้นก็น่าสงสัยไม่แพ้กัน\n\nทันทีที่เห็นหน้าเขา เด็กคนนั้นก็แสดงอาการแปลกๆ ออกมา ทั้งรีบเบนสายตาหนี เหงื่อแตกพลั่ก และขยับตัวกระสับกระส่ายไปมา (เธอยังถึงกับสูดปากเฮือกตอนที่ได้ยินคำว่าคนสวนอีกด้วย)\n\nสายตาของเขาพลันคมกริบยิ่งขึ้น\n\n‘ผู้กลับชาติมาเกิด…’\n\nถ้าไม่ใช่ ก็ไม่มีเหตุผลอะไรที่ต้องหวาดกลัวเขา ซึ่งมีรูปลักษณ์ภายนอกที่แสนจะธรรมดาและไม่มีพิษมีภัยเลยแม้แต่น้อย\n\nเส้นใต้สีแดงสองเส้นถูกขีดทับลงไปในใจของอีวาน\n\n“เอาล่ะ ใครอยากจะขึ้นมาเป็นคนแรก?”\n\nหลังจากคำอธิบายอันยืดยาวของเอนริเก้ นักศึกษาจำนวนมากก็เริ่มหันมามองหน้ากันไปมา\n\nก็พอเข้าใจได้อยู่ คงน่าอายไม่น้อยสำหรับหนุ่มสาววัยยี่สิบต้นๆ ที่จะต้องมาแสดงฝีมือต่อหน้านักศึกษาที่เพิ่งรู้จักกันใหม่ๆ\n\nไม่ใช่ว่าพวกเขาขาดฝีมือหรือกลัวจะขายหน้าที่ต้องมาเผชิญหน้ากับอีวานหรอก ก็แค่ขี้อายกันเท่านั้นแหละ\n\nช่างไร้สาระสิ้นดี\n\nอีวานจ้องเขม็งไปยังเหล่านักศึกษาอย่างเงียบงัน\n\nทันใดนั้น นักศึกษาคนหนึ่งที่นั่งอยู่แถวหลังก็ยกมือขึ้น\n\nเขาคือยักษ์กล้ามโตวัย 40 ปี มอร์ด\n\n“พวกเราได้เจอกันอีกแล้วสินะ?”\n\n“…อืม”\n\n“และไม่ว่าจะมองยังไง เจ้าก็หน้าเหมือนคนที่ข้ารู้จักอยู่คนหนึ่งจริงๆ”\n\nมอร์ดหัวเราะร่าอย่างเปิดเผย พลางหมุนหัวไหล่คลายกล้ามเนื้อ\n\n“ขึ้นมาสิ มาสะสางเรื่องนี้ให้จบกัน อ้อ แล้วก็ ถ้าข้าชนะ”\n\nมอร์ดกระโดดขึ้นไปบนสังเวียนได้ในคราวเดียวแล้วเอ่ยต่อ\n\n“ข้าจะโกนหนวดให้เจ้าเอง”\n\n“สู้ๆ นะคะ คุณเอริกสัน!!”\n\nอิซาเบลล์ที่จ้องมองอีวานด้วยความหวั่นเกรงมาตลอดสูดลมหายใจเฮือกแล้วจู่ๆ ก็ตะโกนเชียร์ขึ้นมา\n\nนับเป็นการทรยศอันขมขื่นจากทายาทของปาร์ตี้ผู้กล้าโดยแท้"
    },

      "title": "บทที่ 24",
      "content": "อีวานเดินอย่างเชื่องช้ามุ่งหน้าไปยังสังเวียน ฝีเท้าของเขานั้นแสนจะธรรมดา ทว่าความเงียบงันของมันกลับดึงดูดสายตาของเหล่านักศึกษาทุกคน\n\nความประทับใจแรกของนักศึกษานั้นเรียบง่าย: “หมอนี่รู้จักวิธีสร้างบรรยากาศนี่นา”\n\nพวกนักศึกษาไม่ได้คิดอะไรมากนักตอนที่อีวานชักขวานออกมาจากเอว ท้ายที่สุดแล้ว ที่นี่คือคณะอัศวิน\n\nในกรณีส่วนใหญ่ เหล่านักศึกษามักจะติดอยู่กับสูตรสำเร็จที่ว่าดาบคืออาวุธที่แก้ปัญหาได้ทุกอย่าง ซึ่งก็เป็นความจริงเป็นส่วนใหญ่\n\nมันพกพาง่าย ใช้งานได้หลากหลาย และยังเหมาะกับเทคนิคที่ละเอียดอ่อนอีกด้วย\n\nทว่า ขวานนั้นเรียบง่ายกว่ามาก นั่นเป็นเพราะจุดศูนย์ถ่วงของมันรวมตัวกันอยู่ที่หัวขวาน ดังนั้น ทิศทางการโจมตีของขวานจึงต้องเป็นไปในทิศทางเดียวเสมอ\n\nกล่าวอีกนัยหนึ่ง หมายความว่ามันอ่านทางง่ายและทำลายวิถีการเหวี่ยงได้ไม่ยาก ด้วยเหตุนี้ นักศึกษาส่วนใหญ่จึงพากันดูแคลนขวาน\n\n“เอนริเก้”\n\nอีวานเอ่ยขึ้นเบาๆ ขณะยืนนิ่งอยู่บนสังเวียน น้ำเสียงของเขาทุ้มหนัก\n\n“อนุญาตให้ทำได้แค่ไหนครับ?”\n\n“อย่าฆ่าเขาก็พอ ยังไงที่นี่ก็มีนักบุญหญิงอยู่ทั้งคน”\n\nแพทริเซีย นักบุญหญิงแห่งปาร์ตี้ผู้กล้า ปัจจุบันดำรงตำแหน่งคณบดีคณะเทววิทยาของมหาวิทยาลัยแห่งนี้ นั่นหมายความว่ามีผู้เชี่ยวชาญด้านบาดแผลฉุกเฉินที่ดีกว่าโพชั่นรักษาบาดแผลคอยเตรียมพร้อมอยู่เสมอ\n\n“ดีครับ” อีวานพยักหน้า\n\n“เอริกสัน”\n\n“อย่างที่ข้าคิด พอได้เห็นเจ้าในระยะนี้ ข้าก็จำใบหน้าในตอนนั้นได้ชัดเจนเลย”\n\n“ถ้าฉันชนะ นายต้องไปทำงานอาสาสมัคร”\n\n“…หา?”\n\nไอ้หมอนี่คือเจ้าหน้าที่ข่าวกรองจากอาณาจักรโดรเวียน ฉากหน้าเป็นนักศึกษาปีหนึ่งของคณะอัศวิน และภายนอกทำหน้าที่เป็นองครักษ์ส่วนตัวของเอคไดซิส ทว่าแก่นแท้ของมันหมายความว่าหมอนี่สามารถเป็นสายลับของไอนาร์มหาราชได้\n\nพูดอีกอย่างคือ หมอนี่สามารถเข้าร่วมฝ่ายองค์หญิงหรือฝ่ายมกุฎราชกุมารในฐานะ “นักการทูตนอกระบบ” ได้ทุกเมื่อ หมอนี่คือตัวแปรสำคัญ\n\nดังนั้น จึงจำเป็นต้องมัดเท้าของมันเอาไว้จนกว่าแนวทางของเอคไดซิสจะได้รับการยืนยันแน่ชัด และวิธีที่ง่ายที่สุดก็คือการจับตาดูมันไว้ใกล้ๆ ตัว\n\nตลอดเวลาหลังเลิกเรียน ยกเว้นช่วงเวลาที่ต้องอยู่เคียงข้างเอคไดซิส\n\n“ฉันจะให้นายไปซักผ้าที่สถานเลี้ยงเด็กกำพร้า”\n\nงานอาสาสมัครเป็นสิ่งที่ดีต่อการขัดเกลาจิตใจ นี่คือความจริงที่ไม่อาจปฏิเสธได้ การดูแลเด็กกำพร้าช่วยเสริมสร้างอุปนิสัยได้อย่างมหาศาล\n\nดังนั้น นี่จึงเป็นโอกาสอันดีที่จะได้สอน “อารยธรรม” ให้แก่ฮัสคาลนักรบคลั่งแห่งโดรเวียนผู้นี้\n\n“ไร้สาระสิ้นดี”\n\n“เข้ามา”\n\nอีวานยกขวานขึ้น บัดนี้ นักรบทั้งสอง (อายุเฉลี่ย 40 ปี ในวิชาฝึกปฏิบัติปีหนึ่งของมหาวิทยาลัย) ไม่จำเป็นต้องพูดพร่ำทำเพลงอีกต่อไป\n\nตอนที่ชายทั้งสองปะทะกันเป็นครั้งแรก เหล่านักศึกษาปีหนึ่งถึงกับผงะไปเล็กน้อย นี่มันอะไรกัน? ทำไมสองคนนั้นถึงสู้กันได้เก่งขนาดนั้น?\n\n– เคร้งงง—!!\n\nถัดมา เมื่อขวานทั้งสองเล่มฟาดปะทะกันจนสะเก็ดไฟแตกกระจายใส่กันและกัน เหล่านักศึกษาปีหนึ่งก็ตกตะลึงจนตาค้าง นั่นมันอะไรน่ะ? คนตรงนั้นเคลื่อนไหวแบบนั้นได้ยังไง? เมื่อกี้ฉันเห็นคนอยู่ตรงนั้นหรือเปล่า? ไม่มีใครอยู่ตรงนั้นแล้วเหรอ?\n\n– แกร๊ง! กร๊อบ!\n\nในที่สุด เมื่อนักศึกษาปีหนึ่งที่แข็งแกร่งที่สุด (วัย 40 ปี) ทรุดเข่าลงหอบหายใจอย่างหนัก เหล่านักศึกษาก็สามารถมองเห็นชายผู้ยืนตัวตรงอยู่ได้อย่างชัดเจนเสียที\n\nดวงตาสองข้างที่ทอแสงสีฟ้าครามกับใบหน้าอันว่างเปล่า\n\nลมหายใจที่สงบนิ่งเสียจนไม่สั่นไหวเลยแม้แต่น้อย ทั้งที่เพิ่งเคลื่อนไหวอย่างดุเดือดขนาดนั้น\n\nเหล่านักศึกษาต่างพากันตะลึงงัน\n\n“นั่นมันตัวอะไรกันน่ะ?”\n\n“เขาเป็นสัตว์ประหลาดชัดๆ!”\n\n“ไม่ เขาไม่ใช่สัตว์ประหลาด เขาคือเทพเจ้าต่างหาก”\n\nอีวานก้มลงมองเอริกสันที่คุกเข่าอยู่บนพื้น\n\n“นายต้องไปทำงานอาสาสมัคร”\n\nเอริกสันพยักหน้าอย่างอ่อนแรง\n\n“ครับ ผมเข้าใจแล้ว”\n\nอีวานหันหลังแล้วเดินจากไป\n\nเหล่านักศึกษามองตามแผ่นหลังของเขาด้วยดวงตาที่เบิกกว้างด้วยความยำเกรง\n\n“อั่ก… เปโตรวิช… ว่าแล้วเชียว… อีวานตัวน้อย อึก…! เจ้ามาทำบ้าอะไรอยู่ที่นี่กันแน่…?”\n\n“ดูแลความปลอดภัย”\n\nอีวานเดินผ่านมอร์ดที่สภาพยับเยินราวกับผ้าขี้ริ้วไป\n\n“ดูแล…? ความปลอดภัย…?” เครื่องหมายคำถามตัวโตผุดขึ้นในหัวของเหล่านักศึกษาอีกครั้ง\n\n“คนต่อไป”\n\n“เอ่อ… ศาสตราจารย์ครับ ขอบเขตของข้อสอบมันกว้างเกินไปหน่อยนะครับ วันนี้เพิ่งจะคาบแรกเองไม่ใช่เหรอครับ…?”\n\nชายหนุ่มคนหนึ่งที่ตัวสั่นเทาเมื่อได้ยินคำพูดของอีวานยกมือขึ้นเอ่ยถาม เขาคือคุณชายขุนนางคนเดียวกับที่หัวเราะเยาะอีวานในตอนแรกนั่นเอง\n\nเอนริเก้พยักหน้าพร้อมรอยยิ้มเจ้าเล่ห์\n\n“ลำดับถัดไปกำหนดไว้แล้ว เอาล่ะ พวกเราไม่มีเวลาแล้วนะ รีบๆ ขึ้นไปเร็วเข้า”\n\n“เอ่อ… เอ่อ… อึก…”\n\nเพราะไม่มีใครอยากขึ้นไปบนสังเวียน ชายหนุ่มที่ถูกเพื่อนร่วมชั้นผู้มีน้ำใจช่วยกันลากตัวขึ้นไปบนสังเวียนจึงก้าวถอยหลังด้วยเหงื่อเย็นที่ไหลโทรมกาย\n\n“เข้ามา”\n\nอีวานยกขวานขึ้น\n\n“เอาล่ะ แค่แทงผู้ช่วยสอนของเราให้โดนสักครั้งเดียว พวกเราจะให้เกรด A+ ไปเลย คิดว่าไง? หรือบางที… ถ้าอยากได้ล่ะก็นะ! การฝึกตัวต่อตัวจากอาจารย์สาวสวยประจำปาร์ตี้ผู้กล้าคนปัจจุบัน!”\n\nอีวานไม่คิดจะใส่ใจแก้คำผิดในประโยคสุดท้ายของเอนริเก้ เพราะเขาเป็นคนมีเหตุผล\n\nแต่เขาเลือกที่จะหยิบขวานขึ้นมาแทน เพราะเขาเป็นคนจริงจังกับการฝึกฝนเหล่าทหารเกณฑ์หน้าใหม่\n\n“คนต่อไป”\n\nหลังจากศพห้าร่าง (ไม่หรอก ไม่ถึงขั้นนั้น) ถูกหามออกไป ก็ไม่มีใครยอมเดินขึ้นมาบนสังเวียนอีกเลย\n\n“เฮ้! ถ้าพวกเธอยอมแพ้กันแบบนี้ทั้งหมด ก็จะสอบตกวิชานี้กันยกชั้นเลยนะ! เข้าใจไหม? เอาแบบนี้เป็นไง ถ้าพวกเธอติด F กันหมดจนต้องมาลงเรียนซ้ำ ปีหน้าพวกเราก็จะเริ่มคาบเรียนกันแบบนี้อีก สู้ยอมโดนอัดให้มันจบๆ ไปก่อนเลยไม่ดีกว่าหรือไง?”\n\nเหล่านักศึกษากัดฟันกรอดขณะมองดูเอนริเก้ที่ยิ้มแย้มอย่างสดใส\n\nเอาวะ ถึงจะไม่มั่นใจนัก แต่… อย่างน้อยก็คงไม่ถึงตายหรอกมั้ง\n\nถ้าสามารถโจมตีโดนได้สักครั้งเดียว เกรดสูงๆ ก็การันตีอยู่ในกำมือแล้ว\n\nนี่เป็นวิชาบังคับของสาขาตั้งสามหน่วยกิต เห็นได้ชัดว่ามันจะส่งผลกระทบอย่างมากต่อเกรดเฉลี่ยสะสม และคณะอัศวินโดยพื้นฐานก็มีการแข่งขันสูงมากอยู่แล้ว\n\nนั่นเป็นเพราะพวกเขาทุกคนต่างก็เติบโตมาพร้อมกับคำชมเชยว่าเป็น “อัจฉริยะด้านวรยุทธ์” และ “ยอดฝีมือเพลงดาบ” ในละแวกบ้านเกิดของตัวเองกันทั้งนั้น\n\nขอแค่ครั้งเดียว\n\nขอแค่ครั้งเดียวเท่านั้น!\n\nแม้กระทั่งหลังจากศพ 30 ร่าง (ไม่หรอก ไม่ถึงขั้นนั้น) ถูกหามออกไปแล้ว นักศึกษาปีหนึ่งก็ยังไม่ยอมแพ้\n\n“คนต่อไป”\n\nและในที่สุด ก็ถึงคราวของยูริ\n\nยูริตัวสั่นเทาขณะหยิบดาบขึ้นมา เธอไม่เคยรู้สึกว่าคมดาบในมือจะหนักอึ้งขนาดนี้มาก่อนเลยตลอดเวลาที่ถือมันมา\n\nเธอรวบรวมความกล้าก้าวไปข้างหน้าหนึ่งก้าว แต่แล้วก็ต้องหดตัวถอยกลับเมื่อมองไปยังชายตรงหน้า\n\nเพราะมีบางสิ่งบางอย่างผุดขึ้นมาในหัวทุกครั้งที่เห็นชุดทำงานซอมซ่อและผ้าขนหนูเก่าๆ ที่พาดอยู่รอบคอของเขา\n\n“ยูริ แฟรงก์”\n\n“ค-คะ?”\n\nอีวานจ้องลึกเข้าไปในดวงตาของยูริ สายตาอันคมกริบของเขาที่ราวกับจะฉีกกระชากทะลุเข้าไปในจิตใจแทงทะลุมิติการมองเห็นของเธอ\n\nม่านตาของยูริสั่นระริกอย่างรุนแรง ศีรษะของเธอวิงเวียนและมือไม้พลันอ่อนแรงลงเรื่อยๆ\n\n“อันดับหนึ่งของคณะอัศวิน”\n\n“ค่ะ!”\n\n“ยูริ?”\n\n“เอ๊ะ…?”\n\n“คิมยูริ พัคยูริ หรือชเวยูริ?”\n\n“เอ่อ… อะ… พูดเรื่องอะไรคะ? ฉันไม่เข้าใจเลยว่าคุณหมายถึงอะไร…”\n\n“ในคราซิลอฟ ยูริเป็นชื่อของผู้ชาย”\n\n“อ๋อ จริงเหรอคะ? เอ่อ… คือว่า ฉันมีเหตุผลส่วนตัวเรื่องนั้นน่ะค่ะ…”\n\n“เข้ามา”\n\nอีวานยกขวานขึ้น\n\n“ค่อยๆ อธิบายเหตุผลของเธอมาทีหลังก็แล้วกัน”\n\n“โอ๊ย ไม่นะ ไม่ๆ ฉัน ฉันขอสละสิทธิ์ค่ะ ได้ไหมคะ? ฉันยอมสอบตก! ยอมติด F ก็ได้ค่ะ ไม่เป็นไรเลย! กรี๊ดดดด!”\n\nยังไม่ทันที่ยูริจะปล่อยมือจากดาบ อีวานก็พุ่งเข้าใส่เธอเสียแล้ว\n\nโดยสัญชาตญาณ เธอยกดาบขึ้นปัดป้องคมขวาน และยูริก็ต้องกลืนเสียงกรีดร้องที่จุกอยู่ที่ลำคอกลับลงไปอย่างยากลำบาก\n\nมันกำลังเลื้อยพันเข้ามา เหมือนงูเลย…! คมขวานดูราวกับพร้อมจะฉีกกระชากลำคอของเธอได้ทุกเมื่อ มันไต่เลื้อยขึ้นมาตามสันดาบของเธอ!\n\n– เคร้งงง!\n\nมันคือรูปแบบการโจมตีที่ได้เห็นเป็นประจักษ์มาแล้วจนกระทั่งนักศึกษาก่อนหน้าพากันกลายเป็นกระสอบทราย ทว่า มันเป็นการโหมกระหน่ำที่ไม่อาจทำความคุ้นชินได้เลย\n\nขวานของอีวานดูราวกับก้าวข้ามไปสู่อีกระดับหนึ่งแล้ว\n\nการเหวี่ยงแต่ละครั้งไม่ได้หนักหน่วง มอร์ด เอริกสัน ยังหนักหน่วงกว่าในแง่นั้น ทว่ามันรวดเร็ว ชั่วพริบตาที่เธอเพิ่งจะรู้สึกตัว มันก็เลื้อยเข้ามาพันเกี่ยวในจังหวะสวนกลับเสียแล้ว\n\nความช่ำชองในการใช้งานขวาน ไม่ใช่แค่การเหวี่ยงฟัน แต่เป็นการฟาดกระแทกใบมีด ใช้แรงเหวี่ยงหนีศูนย์กลางเชื่อมต่อกระบวนท่าอีกครั้ง สับลงมา และผลักดันพุ่งไปข้างหน้าในแนวทแยงทันที\n\n– แกร๊งงง!!\n\nใช้ส่วนโค้งของหัวขวานเกี่ยวรั้งดาบไว้ แล้วบิดด้ามจับเพื่อกระชากใบดาบให้หลุดลอย หากพลาดท่าปล่อยดาบหลุดมือจากแรงกระแทกนั้น ทุกอย่างก็เป็นอันจบสิ้น\n\nอีวานก้มลงมองยูริที่ทรุดเข่าลงกับพื้นแล้วพยักหน้า\n\n“เธอสู้ได้ดี”\n\n“ข-ขอบคุณค่ะ…”\n\n“ฉันจะจับตาดูเธอไว้ คนต่อไป”\n\nยูริก้าวลงจากสังเวียนด้วยเรี่ยวแรงที่อ่อนยวบยาบ แม้จะรอดพ้นมาได้โดยไร้รอยขีดข่วนราวกับปาฏิหาริย์ แต่นั่นก็เป็นเพียงความรู้สึกที่ว่าสิ่งมีชีวิตประหลาดตนนั้นจงใจไว้ชีวิตเธอเท่านั้นเอง\n\nเธอมองอีวานด้วยสีหน้าหวาดผวา ก่อนจะหลับตาลงแน่น\n\n***\n\n“คิม-พัค-ชเว อะไรกันเนี่ย! ฮะ คนเกาหลีเหรอ? หมอนั่นเป็นคนเกาหลีงั้นเหรอ?”\n\nยูริเคยเป็นนักวาดภาพประกอบ\n\nโปรเจกต์สุดท้ายของเธอคืองานรับจ้างนอกสำหรับเกมผู้ใหญ่แนวสถาบันมืดจากค่ายสถาบันนุงยอก (Nungyok Academy)\n\nที่มีชื่อว่า [ฮวีจัก 3 (Huijak 3)]\n\nเนื้อเรื่องว่าด้วยการหลบหนีจากคนสวนสุดโหด สุดแสนจะอำมหิต ที่คอยกุมความลับจุดอ่อนของเหล่านักศึกษาเอาไว้\n\nคนสวนคนนั้นเป็นชายวัยกลางคนที่มีผ้าขนหนูพาดคอและสวมชุดทำงานเก่าๆ\n\nและตอนนี้ เธอก็พบว่าตัวเองหลุดเข้ามาอยู่ในโลกเวรตะไลนั่นจริงๆ หลังจากที่เพิ่งอดหลับอดนอนส่งภาพร่างแรกของงานจ้างนอกชิ้นนั้นเสร็จหมาดๆ\n\nในโลกที่คนสวนมีเคราถือขวานกำลังจ้องมองเหล่านักศึกษาหญิง (เข้าใจผิดไปเอง) ด้วยสายตาละโมบ\n\n“ถ้าโดนจับได้ล่ะก็… ฉันจะต้องโดนทำเรื่องที่… สุดแสนจะ… สุดขั้วแน่ๆ!”\n\nเธอตัวสั่นเทาเมื่อนึกย้อนไปว่าพวก ‘นักศึกษา’ ที่โดนกุมจุดอ่อนถูกเปลี่ยนให้กลายเป็นอะไรบ้าง ‘คนสวน’ คนนั้นกำลังจับตามองเธออยู่\n\nทั้งที่รู้รสนิยมของเธอและรู้ว่าเธอเป็นผู้กลับชาติมาเกิดเหมือนกัน หมอนั่นอาจจะเปลี่ยนแนวเรื่องผ่านการบีบบังคับบางอย่างก็ได้\n\nเธอ… คือตัวเอก…. เอาเถอะ เป็นทั้งเด็กกำพร้าและนักศึกษาทุนเต็มจำนวน อัจฉริยะด้านเพลงดาบ นักวาดภาพประกอบที่เอาแต่วาดรูปมาทั้งชีวิตจะมาลงเอยแบบนี้ได้ยังไงกันล่ะ?\n\nแน่นอน เธอต้องเป็นตัวเอกแน่ๆ….\n\nเธอแค่อยากกลับบ้านเท่านั้นเอง\n\n***\n\nอิซาเบลล์ต้านทานได้สามกระบวนท่า ส่วนออสการ์ต้านทานได้สองกระบวนท่า\n\nเมื่อดูจากอันดับแล้ว ดูเหมือนจะเรียงลำดับเป็น มอร์ด, ยูริ, อิซาเบลล์, ออสการ์ ตามลำดับ เนื่องจากเดิมทีมอร์ดไม่ใช่นักศึกษาจริงๆ ก็ถือว่าตัดสินออกมาได้อยู่ในขอบเขตที่เขาคาดการณ์ไว้แล้วกัน\n\nสายตายังไม่คุ้นชินเท่าไหร่ อีวานคิดเช่นนั้นพลางพยักหน้าอย่างพึงพอใจ\n\n“นี่นายกำลังยิ้มอยู่เหรอ?” (เอนริเก้)\n\n“เป็นการเข้าใจผิดครับ” (อีวาน)\n\n“แต่ดูเหมือนนายกำลังยิ้มอยู่นะ?”\n\n“ปกติหน้าผมก็ยิ้มอยู่แล้วครับ”\n\n“บ้าไปแล้ว…! ไอ้งั่งเอ๊ย…!”\n\nเมื่อได้ยินเสียงที่ดังมาจากตรงหน้าโดยตรง อีวานจึงต้องปรับสีหน้าให้กลับมาเรียบเฉยอีกครั้ง ข้างๆ เขาคือเอนริเก้ที่กำลังยกมือทั้งสองข้างขึ้น เอนริเก้พยายามกลั้นขำจนน้ำตาแทบเล็ด\n\nอีวานซึ่งเป็นคนมีเหตุผล จึงไม่ตอบโต้กับท่าทีทะเล้นของอาจารย์สูงวัย\n\nในขณะที่ยูริกำลังขวัญผวาอยู่นั้น ในชั่วขณะเดียวกัน อีวานและเอนริเก้ก็กำลังถูกท่านนักบุญหญิงเทศนาชุดใหญ่\n\nนั่นคือราคาที่ต้องจ่ายสำหรับการส่งผู้ป่วยถึง 50 คนเข้าไปนอนแอ้งแม้งอยู่ในห้องทำงานของคณะเทววิทยา"
    },

      "title": "บทที่ 25",
      "content": "“ห้องทำงานคณบดีไม่ใช่ห้องพยาบาลนะคะ”\n\nท่านนักบุญหญิงเอ่ยคำพูดแปลกๆ ออกมา อีวานเอียงศีรษะเล็กน้อย\n\nในสถานที่ที่เรียกว่าห้องพยาบาล อย่างมากพวกเขาก็คงทำได้แค่ทาโพชั่นรักษาบาดแผลภายนอก หรือดีที่สุดก็คงมีนักบวชที่เพิ่งบวชใหม่มาร่ายเวทมนตร์รักษาให้เท่านั้น\n\nนี่หมายความว่านักศึกษาควรจะต้องไปเผชิญกับประสบการณ์อันเลวร้ายแบบนั้น ทั้งที่มีท่านนักบุญหญิงอยู่ตรงนี้เลยอย่างนั้นหรือ?\n\nเมื่อเห็นสีหน้าของอีวาน ท่านนักบุญหญิงก็ทุบอกตัวเองด้วยความคับข้องใจ (อีวานไม่ได้เบือนหน้าหนี แม้ว่าเธอกำลังสั่นไหวอยู่ก็ตาม เขาเป็นคนเคร่งศาสนาอย่างแท้จริง)\n\n“ไม่ใช่นะคะ! ดิฉันเองก็มีงานของตัวเองเหมือนกัน! คุณรู้ไหมว่าดิฉันยุ่งแค่ไหน? ดิฉันเพิ่งจะได้รับแต่งตั้งในปีนี้เองนะ! งานก็ยังไม่ได้รับการส่งมอบให้เรียบร้อย แล้วทุกคน — ทั้งนักศึกษาปีหนึ่ง นักศึกษาปริญญาตรี อาจารย์ — ต่างก็พากันบ่นพึมพำไม่หยุด โครงสร้างหลักสูตรก็เละเทะไปหมด ทำไมมหาวิทยาลัยนี้มันถึงเป็นแบบนี้กันเนี่ย!”\n\n“อืม”\n\n“อืม”\n\nอีวานและเอนริเก้พยักหน้าพลางมองดูท่านนักบุญหญิงระบายความอัดอั้นเกี่ยวกับหลักสูตรยุคกลาง\n\nพวกเขาพูดอะไรไม่ได้มากนัก แต่ก็จำต้องเห็นด้วยในเบื้องต้น\n\nอีวานละสายตาจากผู้ทรงศีลผู้น่าสงสารที่กำลังคร่ำครวญถึงสถานการณ์ของตนเองอย่างขยันขันแข็ง ห้องทำงานของหัวหน้าคณะมีเสน่ห์อันเงียบสงบ\n\nไม่ชัดเจนว่าเป็นรสนิยมของหัวหน้าคณะคนก่อนหรือของท่านนักบุญหญิง แต่ภายในห้องเต็มไปด้วยต้นไม้มากมาย\n\nอีวานผู้ไม่ได้มีความรู้เรื่องพฤกษศาสตร์มากนัก ฆ่าเวลาด้วยการจับใบไม้ของต้นไม้ต้นหนึ่งเล่น (เขาก็เป็นคนสวนนี่นะ)\n\n– เป๊าะ\n\nใบกล้วยไม้หักสะบั้นลง มันหักลงอย่างร่าเริงเพราะเป็นก้านที่อวบอิ่มและงดงามที่สุด\n\nอีวานหันกลับมาโดยไม่เปลี่ยนสีหน้า โชคดีที่ดูเหมือนท่านนักบุญหญิงจะไม่ทันสังเกตเห็น เธอกำลังคุยกับเอนริเก้เรื่องคาบเรียนด้วยอารมณ์ที่ยังคงเดือดดาลอยู่\n\nใช่เรื่อง ‘นิวเวิลด์ (Brave New World)’ หรือเปล่านะ? มีฉากคล้ายๆ แบบนี้ในหนังนัวร์เรื่องนั้นด้วย เขาหมุนกระถางต้นไม้ด้วยสีหน้าเรียบเฉย กระถางหมุนกลับด้านเพื่อซ่อนใบที่หักเอาไว้\n\n“เอาล่ะ ฉันเข้าใจแล้วว่าเธอกำลังลำบาก แพตตี้ ฉันผิดเองแหละ” (เอนริเก้)\n\n“ทำไมไม่ถือโอกาสนี้เปลี่ยนมานับถือศาสนาเสียเลยล่ะคะ? ดิฉันรอคุณด้วยหัวใจที่เปิดกว้างเสมอค่ะ เอนริเก้” (แพทริเซีย)\n\n“นั่นไม่ใช่การเปลี่ยนศาสนา นั่นมันฆ่าตัวตายชัดๆ….”\n\nท่านนักบุญหญิง ผู้ใกล้ชิดสรวงสวรรค์ที่สุดในโลกใบนี้รองจากองค์สันตะปาปา กดดันเอนริเก้ด้วยพลังศักดิ์สิทธิ์ ดูเหมือนร่างกายของเอนริเก้จะหดเล็กลงไปนิดหน่อย\n\nเอนริเก้เอ่ยขึ้นอย่างระมัดระวังด้วยท่าทีนอบน้อมยอมจำนน “เอ่อ อืม อ้อ จริงสิ แพตตี้ ฟังนะ อย่าเพิ่งตกใจล่ะ ฉันตั้งใจจะมาบอกเรื่องหนึ่ง แต่ดันลืมไปเสียสนิท ฟังฉันก่อนนะ”\n\n“ค่ะ ก่อนที่คุณจะพูดอะไร ช่วยบอกดิฉันทีว่ามันน่าตกใจน้อยกว่าเรื่องนักศึกษาปีหนึ่ง 50 คนอยู่ในอาการวิกฤตนะคะ”\n\nเอนริเก้หัวเราะออกมาพลางอ้าปากพูด\n\n“หมอนี่ถูกดึงตัวมาน่ะ”\n\n“ค่ะ ดิฉันทราบเรื่องนั้นแล้ว ตอนที่ผู้อำนวยการสถานเลี้ยงเด็กกำพร้ากลายมาเป็นคนสวน ดิฉันยังคิดจะแวะไปหาเอลิสอยู่เลย เธอทำอะไรกับคนที่เกษียณอายุไปแล้วกันแน่นะ?”\n\n“ไม่ใช่โว้ย ยัยบื้อ หมอนี่ถูก ‘ดึงตัวมา’ เหมือนกับแม็กซ์นั่นแหละ มาจากต่างโลกน่ะ”\n\n“แค่ก?!”\n\nท่านนักบุญหญิงสำลักน้ำชาออกมาแล้วกะพริบตาปริบๆ เธอไออยู่ครู่หนึ่ง ก่อนจะยืดตัวตรงในที่สุด\n\n“ทำไมคุณเพิ่งมาบอกดิฉันตอนนี้ล่ะคะ…?”\n\n“ก็หมอนี่นึกว่าตัวเองมีแค่คนเดียวนี่นา ไม่ใช่พวกที่ชอบไปขอคำปรึกษาใครด้วย”\n\n“คุณพระช่วย….”\n\nท่านนักบุญหญิงมองอีวานพลางกลืนน้ำลายลงคอ เธอเอ่ยด้วยน้ำเสียงสั่นเครือ\n\n“เขาคงจะโดดเดี่ยวมากขนาดไหนกันนะ… เขาไว้หนวดเคราก็เพราะความช็อกนั้นสินะ… บราเดอร์ซีริลผู้น่าสงสาร….”\n\n“เปล่าครับ ไม่ใช่เหตุผลนั้น”\n\n“ไม่เป็นไรค่ะ ทุกอย่างไม่เป็นไรแล้วนะคะ….”\n\nท่านนักบุญหญิงแย้มยิ้มพลางกุมมือของอีวาน พลังศักดิ์สิทธิ์ของเธอไหลเวียนผ่านเส้นเลือดของอีวาน มันช่างอบอุ่น\n\nแม้ในขณะที่เอนริเก้แทบจะเป็นลมล้มพับ ท่านนักบุญหญิงก็ยังคงยิ้มอย่างอบอุ่นให้อีวาน\n\n“ไม่เป็นไรนะคะ บราเดอร์… คุณไม่ได้แปลกประหลาดเลย มีคนแบบคุณอีกมากมาย และก็จะมีเพิ่มขึ้นอีก โอ้ พระผู้เป็นเจ้า โปรดทรงชี้นำลูกแกะผู้น่าสงสารตัวนี้ด้วย…”\n\n“ตอนนี้ผมรู้สึกแปลกๆ และกระอักกระอ่วนใจกับสถานการณ์นี้มากเลยครับ”\n\n“เข้าใจได้ค่ะ เข้าใจได้… ท่านผู้กล้าเองก็เป็นแบบนั้นเหมือนกัน…”\n\nเธอหวนนึกถึงวันที่ตัวเองซาบซึ้งจนน้ำตาไหลเมื่อรู้ว่าเขาเกษียณอายุราชการไปเปิดสถานเลี้ยงเด็กกำพร้า\n\nชายหนุ่มคนนี้ แม้จะมีวัยเด็กที่เต็มไปด้วยสงคราม แต่กลับเติบโตขึ้นมาอย่างแข็งแกร่งและเปี่ยมด้วยเมตตา คอยดูแลเด็กๆ ผู้โชคร้าย\n\nนั่นไม่ใช่กิจการของพระผู้เป็นเจ้าหรอกหรือ?\n\nท่านนักบุญหญิงสนับสนุนการเกษียณของอีวาน โดยบริจาคเงินช่วยเหลือให้ทุกปี เธอยังเป็นคนตั้งชื่อสถานเลี้ยงเด็กกำพร้าแห่งนั้นให้อีกด้วย!\n\nมองดูอีวานในตอนนี้สิ\n\nสถานเลี้ยงเด็กกำพร้ามักจะยากจน และผู้อำนวยการก็มักจะเอาเปรียบเด็กกำพร้า ทว่าชายคนนี้… กลับทำงานหนักเพื่อหาเลี้ยงชีพ สวมเสื้อผ้าสกปรกมอมแมม และเช็ดเหงื่อด้วยผ้าขนหนูเก่าๆ ที่มีรอยไหม้\n\nเห็นได้ชัดว่ามันก็เพื่อเลี้ยงดูเด็กๆ ให้เติบโตอย่างอุดมสมบูรณ์ยิ่งขึ้นไม่ใช่หรือไง?\n\n“โธ่เอ๊ย….”\n\nแม้จะมาจากต่างโลก แม้จะเป็นเพื่อเด็กกำพร้า “ต่างถิ่น” ที่ไม่ได้มีความเกี่ยวข้องทางสายเลือดกับเขาเลย…\n\nเป็นไปได้อย่างไรกัน?\n\nแก้มของท่านนักบุญหญิงแดงระเรื่อขึ้น\n\n“บราเดอร์ซีริล…”\n\n“ผมอยากให้คุณเลิกเรียกผมแบบนั้นมากกว่าครับ”\n\n“ดิฉันชอบชื่อศีลล้างบาปของคุณนี่คะ”\n\n“ตอนที่ตัดสินใจเลือกชื่อนั้น ผมยังเด็กเกินไปครับ”\n\nอีวานชักมือกลับ พลางเหลือบมองเอนริเก้ที่กำลังทำสีหน้าขี้เล่น ท่านนักบุญหญิงทำเครื่องหมายกางเขนและวางมือทาบลงบนอก\n\n“ดิฉันนึกว่าบราเดอร์เป็นเกย์เสียอีกค่ะ”\n\n“แค่ก…!”\n\nเอนริเก้สำลักจนต้องทุบหน้าอกตัวเอง\n\n“ก็แหม ถ้านึกถึงวิธีที่บราเดอร์ปฏิเสธคนพวกนั้นอย่างเย็นชา มันก็อดคิดแบบนั้นไม่ได้นี่คะ”\n\n“…มันมีเหตุผลจำเป็นครับ”\n\n“แน่นอนค่ะ แน่นอน”\n\nองครักษ์ราชวงศ์ไม่อาจมีความสัมพันธ์สนิทสนมส่วนตัวกับขุนนางหรือผู้มีอิทธิพลได้ ในตอนที่เขาเป็นที่รู้จักในนาม อีวาน “ตัวน้อย” ซึ่งเป็นสินค้าเนื้อหอมในตลาดการแต่งงาน เขาก็ดำรงตำแหน่งองครักษ์ราชวงศ์อยู่\n\nเป้าหมายของเขาคือการกลับไปยังโลกเดิม เขาจะไปเล่นเกมความรักได้อย่างไรกัน?\n\nความรู้สึกนั้นไม่ได้เปลี่ยนแปลงไปมากนัก สิ่งเดียวที่เปลี่ยนไปก็คือเขาไม่ได้เป็นคนเนื้อหอมอีกต่อไปแล้ว\n\n“เป็นเพราะคำปฏิญาณใช่ไหมคะ? คำปฏิญาณตามพระวรสารเรื่องความยากจน ความบริสุทธิ์ และความนอบน้อมเชื่อฟังในตอนรับศีลล้างบาป”\n\nคุณธรรมสามประการที่ปฏิญาณไว้เมื่อรับศีลล้างบาป: ความยากจน ความบริสุทธิ์ และความนอบน้อมเชื่อฟัง\n\nรูปลักษณ์ของอีวานนั้นสมถะ อายุเกินสามสิบแล้วแต่ไร้ข่าวฉาว บริสุทธิ์ผุดผ่อง และสละทิ้งทั้งชื่อเสียงและตำแหน่ง\n\nความศรัทธาอันมั่นคงเช่นนี้ช่างงดงามราวกับภาพวาด! ท่านนักบุญหญิงพยักหน้า\n\n“อย่าบวชเป็นนักบวชนะคะ เดี๋ยวจะแต่งงานไม่ได้จริงๆ เอา”\n\n“…อืม”\n\nอีวานถอนหายใจ เขาเคารพในคำปฏิญาณ แต่ก็รู้ดีว่าตัวเองไม่ใช่คนปกติ\n\nเขามาจากต่างโลก และการถือพรหมจรรย์ตลอดชีวิตอาจจะไม่ใช่สิ่งที่ทำได้จริงนัก\n\n“แต่ถ้าบราเดอร์ยังคงรักษาความบริสุทธิ์ผุดผ่องต่อไปเช่นนี้ บางที… บางทีพระเจ้าอาจจะทรงประทานความโปรดปรานให้ก็ได้นะคะ ความรักระหว่างผู้คนคือพระพรที่ยิ่งใหญ่ที่สุดใต้ผืนฟ้าค่ะ”\n\n“…อืม….”\n\n“วันนี้ดิฉันต้องไปที่สถานเลี้ยงเด็กกำพร้าของบราเดอร์ให้ได้เลยค่ะ ไปด้วยกันนะคะ”\n\n“เธอบอกว่างานตัวเองยังไม่เสร็จไม่ใช่เหรอ”\n\n“คนเดียวที่อยู่เหนือดิฉันในโรงเรียนนี้คืออธิการบดี และผู้เดียวที่อยู่เหนือดิฉันในโลกใบนี้คือองค์พระผู้เป็นเจ้าค่ะ เอนริเก้”\n\n“ว้าว”\n\nเอนริเก้พยักหน้าเห็นด้วยอย่างเงียบๆ\n\n***\n\nท่านนักบุญหญิงทำให้รู้สึกอึดอัด อีวานตระหนักถึงความจริงอันชัดเจนข้อนี้ขึ้นมาอีกครั้ง\n\nด้วยเหตุผลหลายประการ — วัยเด็กในสนามรบ ความเคร่งศาสนา และฐานะผู้สนับสนุนรายใหญ่ของสถานเลี้ยงเด็กกำพร้า\n\nความสัมพันธ์ที่เท่าเทียมกับผู้ที่ถือสายป่านการเงินย่อมเป็นไปไม่ได้ ด้วยเหตุนี้ อีวานจึงรักษาระยะห่างจากผู้สนับสนุนเสมอมา\n\n“โอ้… พระผู้เป็นเจ้า โปรดทอดพระเนตรภาพอันงดงามนี้สิคะ…”\n\nท่านนักบุญหญิงหลั่งน้ำตาออกมาขณะเดินเข้ามาจากทางเข้าของสถานเลี้ยงเด็กกำพร้า โดยธรรมชาติแล้ว เหล่าเด็กกำพร้าต่างพากันกรูเข้ามารายล้อมเธอพร้อมส่งเสียงเจี๊ยวจ๊าว\n\nใบหน้าของเด็กๆ เต็มไปด้วยชีวิตชีวา และแก้มก็อวบอิ่มสมบูรณ์ ไม่มีร่องรอยของความยากจนข้นแค้นให้เห็นเลยแม้แต่น้อย คนเดียวในสถานเลี้ยงเด็กกำพร้าที่ดูยากจนข้นแค้นที่สุดก็คือตัวอีวานเอง…!\n\nสิ่งอำนวยความสะดวกก็ยอดเยี่ยม และบานประตูทุกบานเปิดปิดได้อย่างลื่นไหลด้วยบานพับที่สะอาดและหยอดน้ำมันไว้อย่างดี มีการติดฟองน้ำนุ่มๆ ไว้ตามปลายทางเดินและมุมเฟอร์นิเจอร์อย่างใส่ใจ\n\nช่างละเอียดลอออะไรขนาดนี้!\n\nท่านนักบุญหญิงมองดูภาพวาดกราฟฟิตีขนาดใหญ่ที่ระบายสีไว้ตรงมุมหนึ่งของอาคารสถานเลี้ยงเด็กกำพร้า หยาดน้ำตาพลันเอ่อคลอขึ้นมาในดวงตา\n\nภาพกราฟฟิตีซึ่งถูกวาดขึ้นโดยเด็กกำพร้าจอมซนสักคน เป็นรูปสัตว์ประหลาดมีเคราที่กำลังขมวดคิ้วมุ่นขณะแจกของขวัญ\n\nความรักของเด็กๆ สัมผัสได้อย่างชัดเจนเสียจนในที่สุดท่านนักบุญหญิงก็ต้องยกมือกดดวงตาและพิงกำแพง\n\n“คุณได้กลายเป็นพ่อที่ดีไปแล้วจริงๆ…”\n\n“คุณพระช่วย”\n\n“เดิมที สิ่งที่วิเศษที่สุดก็คือความสัมพันธ์ที่ถือกำเนิดขึ้นจากหัวใจ บราเดอร์ซีริล… ดิฉันแสบตาเหลือเกิน… โอ้ พระผู้เป็นเจ้า…”\n\n“นายพยายามจะฆ่าฉันให้ตายเพราะขำใช่ไหมเนี่ย? เจ้าลูกศิษย์ ฉันชักจะเริ่มรู้สึกอึดอัดนิดหน่อยแล้วนะ ฉันกลับตอนนี้เลยได้ไหม?”\n\n“ไม่ได้ครับ”\n\nเอนริเก้ยกมือปิดหน้าผากแล้วครางออกมาอย่างเจ็บปวด\n\n—\n\n**หมายเหตุผู้เขียน (คำอธิบายจากผู้เขียน):**\n\nเหตุผลที่อีวานรู้สึกอายกับชื่อศีลล้างบาปของตัวเอง… สามารถเดาได้จากชื่อของเอลิซาเวตา!\n\n*Elizaveta Kirillovna Krasilov (เอลิซาเวตา คิริลลอฟนา คราซิลอฟ)\n\nชื่อศีลล้างบาปของอีวาน = ซีริล (Cyril)*"
    },

      "title": "บทที่ 26",
      "content": "เมื่อผู้มีพระคุณชาวต่างชาติผู้ร่ำรวยอย่างน่าสงสัยมาเยี่ยมเยียนห้องทำงานผู้อำนวยการสถานเลี้ยงเด็กกำพร้าและรู้ว่าอีวานไม่มีห้องนอน เธอก็โวยวายเสียยกใหญ่ก่อนจะเข้าเรื่อง\n\nท่านนักบุญหญิงตั้งใจฟังเรื่องราวของอีวานอย่างสงบ ซึ่งส่วนใหญ่เล่าโดยเอนริเก้ จากนั้นจึงจิบน้ำชาเข้าไปอึกหนึ่ง\n\nมีผู้ถูกสิงร่างอยู่อย่างน้อยหนึ่งถึงสามคนภายในมหาวิทยาลัย\n\n“นี่มันเป็นเรื่องแปลกประหลาดนะคะ” (แพทริเซีย)\n\n“หือ?” (เอนริเก้)\n\n“เอนริเก้ คุณเคยได้ยินเรื่องนี้ไหมคะ? ว่ากันว่าเหล่าผู้ที่ถูกดึงตัวมาจะปรากฏตัวขึ้นราวสองถึงสามคนในหนึ่งศตวรรษ” (แพทริเซีย)\n\n“อ้อ จริงสิ?” (เอนริเก้)\n\n“ตอนนี้มีกี่คนแล้วคะ?” (แพทริเซีย)\n\nท่านนักบุญหญิงวางถ้วยชาลงแล้วประสานมือเข้าด้วยกันอย่างเงียบสงบ\n\nบัดนี้ ดวงตาของเธอลึกล้ำราวกับดวงตาของมหาปุโรหิต\n\n“แม็กซิมิเลียน จอมมาร แล้วก็อีวาน งั้นก็สามคน ฉันไม่รู้หรอกนะว่ายังมีที่อื่นอีกไหม แต่ต่อให้มี อย่างมากก็คงมีคนที่ฉันไม่รู้จักแค่หนึ่งหรือสองคนเท่านั้นแหละ” (เอนริเก้)\n\n“อะแฮ่ม?” (อีวาน)\n\n“นั่นมันเมื่อยี่สิบปีก่อนค่ะ” (แพทริเซีย)\n\nช่วงเวลาที่จอมมาร แม็กซิมิเลียน และอีวานปรากฏตัวขึ้น\n\nช่วงเวลานั้นคือเมื่อยี่สิบปีก่อน ยังไม่ทันครบหนึ่งศตวรรษ อย่าว่าแต่หนึ่งรุ่นอายุคนเลยด้วยซ้ำ\n\n“เรื่องราวของจอมมารและแม็กซิมิเลียนจบลงไปแล้ว ส่วนเรื่องราวของบราเดอร์ซีริลยังไม่ชัดเจน แต่บทสรุปของมันก็ใกล้เข้ามาแล้ว ทว่า หากมีคนอื่นปรากฏตัวขึ้นที่นี่อีกจะเป็นอย่างไรคะ?” (แพทริเซีย)\n\n“หือ? แล้วมันมีปัญหาอะไรกับเรื่องนั้นล่ะ?” (เอนริเก้)\n\n“มันไม่ปกติค่ะ ดิฉันเคยรับใช้แม็กซิมิเลียน ซึ่งเป็น ‘ผู้ที่ถูกดึงตัวมา’ ดังนั้น ดิฉันจึงรู้บันทึกเก่าแก่ทั้งหมดเกี่ยวกับ ‘ผู้ที่ถูกดึงตัวมา’ ที่เก็บไว้ในมหาวิหาร” (แพทริเซีย)\n\nประมาณหนึ่งหรือสองครั้งในหนึ่งศตวรรษ\n\nเมื่อใดก็ตามที่พวกเขาปรากฏตัว พวกเขามักจะโดดเด่นขึ้นมาที่ไหนสักแห่งเสมอ\n\nอย่างกระตือรือร้น ราวกับกำลังพยายามสร้างเรื่องราวของตนเองขึ้นมา\n\nหลังจากจบเรื่องราวในยุคสมัยของตนและหายตัวไป เมื่อกาลเวลาผ่านพ้นไป คนอื่นๆ ก็จะถูกดึงตัวมาและพลิกเปิดหน้ากระดาษบทใหม่\n\nทว่า ในยุคสมัยนี้ที่จอมมารตายไปแล้วและทุกประเทศต่างก็สงบสุข\n\nเหตุใดจึงมีการปรากฏตัวของผู้ถูกสิงร่างคนใหม่ขึ้นมาอีก?\n\nแม้ว่าจะมีบางประเทศที่ยังคงรักษากำลังทหารเอาไว้ได้หลังสงครามกับจอมมาร และมีความขัดแย้งย่อยๆ ที่เกิดจากการขยายอาณานิคมอยู่บ้าง แต่สิ่งเหล่านั้นอย่างมากก็เป็นเพียงลางบอกเหตุแห่งภยันตรายเท่านั้น\n\nมันยังเร็วเกินไป โลกใบนี้บอบช้ำเกินกว่าจะเผชิญหน้ากับสงครามอีกครั้ง ไม่มีประเทศใดในตอนนี้ที่มีทรัพยากรมากพอจะกล้าเปิดฉากสงครามเต็มรูปแบบได้หรอก\n\nต่อให้จอมมารปรากฏตัวขึ้นอีกครั้ง แล้วมันจะเป็นปัญหาหรือ? สมาชิกส่วนใหญ่ของปาร์ตี้ผู้กล้ายังคงมีชีวิตอยู่ และแต่ละประเทศต่างก็เตรียมการรับมือเพื่อคานอำนาจ ‘บุคคลผู้ทรงพลัง’ เอาไว้เรียบร้อยแล้ว\n\nยิ่งไปกว่านั้น เหล่าปีศาจก็ถูกแยกย้ายไปตามเผ่าพันธุ์และตกเป็นทาสหรือถูกขับไล่ออกไปจากโลก เหลือเพียงเศษซากที่ยังคงหลงเหลืออยู่ในดินแดนอันห่างไกลโพ้น พวกมันไม่มีกำลังมากพอจะหล่อเลี้ยงสงครามได้อีกต่อไป\n\n“คุณบอกว่ามีคนที่คุณสงสัยอยู่สองสามคนใช่ไหมคะ?” (แพทริเซีย)\n\n“สามคนครับ” (อีวาน)\n\n“สัญชาติล่ะคะ?” (แพทริเซีย)\n\n“สองคนเป็นชาวคราซิลอฟ อีกคนเป็นชาวคาลีออนครับ” (อีวาน)\n\n“เอลฟ์หนึ่งคนกับมนุษย์สองคน” (อีวาน)\n\nท่านนักบุญหญิงกอดอกแล้วครุ่นคิดอยู่ครู่หนึ่ง\n\n“ทั้งสามคนเป็นนักศึกษาหมดเลยใช่ไหมคะ?” (แพทริเซีย)\n\n“ครับ” (อีวาน)\n\n“ยังไม่ได้รับการยืนยันแน่ชัดใช่ไหมคะ?” (แพทริเซีย)\n\n“อืม” (อีวาน)\n\n“ถ้าอย่างนั้น พวกเราก็จำเป็นต้องตรวจสอบให้แน่ชัดค่ะ” (แพทริเซีย)\n\nท่านนักบุญหญิงพยักหน้าอย่างง่ายดายเกินคาด อีวานเคยนึกว่าเธออาจจะกำลังคิดจะตั้งศาลไต่สวนศาสนาเสียอีก เพราะไม่เคยมีกรณีไหนเลยที่คำว่า “ตรวจสอบ” หลุดออกมาจากปากของผู้ศรัทธาแล้วจะจบลงโดยไม่มีเรื่องวุ่นวาย\n\n“สืบหาให้ได้ว่าในบรรดาผู้ต้องสงสัย ใครคือ ‘ผู้ที่ถูกดึงตัวมา’ จริงๆ และสืบหาด้วยว่าเด็กๆ เหล่านั้นถูกดึงเข้ามาในเรื่องราวแบบไหน หลังจากนั้น พวกเราก็จะสามารถล่วงรู้ได้ใช่ไหมคะว่ายังมีเรื่องราวอะไรหลงเหลืออยู่ในยุคสมัยของเราอีก?” (แพทริเซีย)\n\nหลังจากเรื่องราวของจอมมารและแม็กซิมิเลียนจบลง ผู้ถูกสิงร่างจะสร้างเรื่องราวแบบไหนขึ้นมาในโลกใบนี้ได้อีก? เรื่องราวแบบไหนกันที่ชักนำพวกเขามา?\n\nนั่นคือแผนการของท่านนักบุญหญิง\n\nแน่นอนว่าโลกใบนี้ไม่ใช่โครงเรื่องตายตัวเหมือนในเกมหรือนิยาย ไม่ว่าพวกเขาจะเคยสัมผัสเรื่องราวแบบใดมาใน ‘ต่างโลก’ ของตนเอง สิ่งประดิษฐ์จากจินตนาการย่อมไม่อาจส่งผลกระทบต่อกระแสของโลกใบนี้ได้\n\nทว่าผู้คนนั้นแตกต่างออกไป ผู้คนที่ได้รับอิทธิพลจาก ‘เรื่องราว’ เหล่านั้นต่างหากที่แตกต่างออกไป ผู้ถูกสิงร่างมีความรู้สึกแบบไหน และผู้ถูกสิงร่างวางแผนที่จะลงมือทำอะไร เรื่องแค่นั้นย่อมส่งผลกระทบต่อโลกใบนี้อย่างแน่นอน\n\nเฉกเช่นเดียวกับที่จอมมาร ผู้กล้า และผู้ถูกสิงร่างนับไม่ถ้วนก่อนหน้าพวกเขาเคยทำมา ผู้ถูกสิงร่างย่อมก่อให้เกิดเหตุการณ์ ความโกลาหล และประวัติศาสตร์ขึ้นมาอย่างหลีกเลี่ยงไม่ได้\n\nท่านนักบุญหญิงพยักหน้าแล้วเอนกายพิงโซฟา หลังจากจิบน้ำชาเข้าไปอีกอึก จู่ๆ เธอก็เอ่ยถามคำถามนี้ขึ้นมา\n\n“ว่าแต่ บราเดอร์ซีริล เรื่องราวของคุณคืออะไรเหรอคะ?” (แพทริเซีย)\n\n“ไม่ทราบครับ” (อีวาน)\n\n“…เอ๊ะ? ต่อให้มันจะผ่านมานานแค่ไหนแล้วก็เถอะ… เอ่อ คุณไม่มีเรื่องราวที่ทำให้รู้สึกถึงความมุ่งมั่นอันแรงกล้า หรือความรู้สึกราวกับเป็นโชคชะตาบ้างเลยเหรอคะ…?” (แพทริเซีย)\n\nมันก็น่าจะมีสักเรื่องไม่ใช่เหรอ…? นั่นคือสิ่งที่ผู้ถูกสิงร่างส่วนใหญ่จะเป็นกันนี่นา\n\nอีวานที่ลังเลอยู่ครู่หนึ่งต่อคำถามของท่านนักบุญหญิง อ้าปากตอบด้วยน้ำเสียงหนักอึ้ง\n\n“มันมีเยอะเกินไปครับ” (อีวาน)\n\n“เอ๊ะ…?” (แพทริเซีย)\n\nตลอดช่วงชีวิตที่ผ่านมา คิมซอนอูเคยเขียนคอมเมนต์ด่าทอไว้ในเกมทั้งหมด 8 เกม เว็บตูน 11 เรื่อง และเว็บโนเวลอีกกว่า 30 เรื่อง\n\nพวกมันล้วนเป็นคนละแนวกันหมด และไม่สำคัญเลยว่ามันจะเป็นแนวไหน ตราบใดที่เขาชอบมัน\n\nอีวานอธิบายเรื่องนี้อย่างระมัดระวัง เขาเล่าให้ท่านนักบุญหญิงฟังว่าในโลกของพวกเขามีความเชื่อโชคลางอยู่ว่า ‘ถ้าวิจารณ์นักเขียน คุณก็จะได้กลายเป็นผู้กลับชาติมาเกิด’\n\nชายหนุ่มหัวขบถนามว่าคิมซอนอูอยากจะกลายเป็นผู้กลับชาติมาเกิด เขาจึงเขียนคำวิจารณ์อันดุเดือดใส่ผลงานทุกประเภท อย่างเช่นหมัดแห่งความกตัญญูความยาว 5,700 ตัวอักษร\n\nหลังจากได้ฟังคำย้อนความหลังอันสงบนิ่งของเขา เอนริเก้ถึงกับเบือนหน้าหนี ส่วนท่านนักบุญหญิงก็นิ่งอึ้งพูดไม่ออกไปชั่วขณะ\n\n“มาสำนึกบาปกันเถอะค่ะ บราเดอร์” (แพทริเซีย)\n\nท่านนักบุญหญิงกุมมืออีวานไว้แน่นแล้วถ่ายทอดพลังศักดิ์สิทธิ์ของเธอเข้าไปให้ มันช่างอบอุ่น อบอุ่นเสียจนแสบแปลบไปถึงมุมหนึ่งของหัวใจ\n\n***\n\nเดือนมีนาคม ฤดูกาลที่ดอกไม้ผลิบานและสายลมฤดูใบไม้ผลิพัดพามาสัมผัสให้หัวใจไหวหวั่น\n\nเยฟเกนี หรือยูจีน กำลังอ่านพระคัมภีร์ พลางเสยผมสีดำสลวยที่ปรกหน้าออก นั่นเป็นเพราะช่วงเวลาอ่านพระคัมภีร์เวรตะไลกำลังจะมาถึงแล้ว\n\nคณะเทววิทยาและหอประชุมใหญ่ที่จำลองแบบมาจากโบสถ์ ภาพของเขายามนั่งอยู่บนม้านั่งใต้ร่มไม้เขียวขจีขณะก้มหน้าอ่านหนังสือนั้นงดงามราวกับภาพวาดในตัวเอง\n\nยูจีน ผู้หว่านเมล็ดพันธุ์แห่งความเสื่อมทรามทางศีลธรรมลงในหัวใจของแม่ชีฝึกหัดมากมาย พลันชะงักกึกเมื่อเห็นข้อความแจ้งเตือนกะพริบขึ้นตรงหางตา\n\n“หา?”\n\n[คำเตือน!]\n\n[คำเตือน!]\n\n[คำเตือน!]\n\n“อะ อะ อะไรกันวะเนี่ย! ทำไมจู่ๆ ถึงขึ้นมาล่ะ!! อย่ามาเล่นตลกนะโว้ย!”\n\nเขาหดตัวลงโดยสัญชาตญาณแล้วหันมองไปรอบๆ ไม่มีใครอยู่เลย\n\nอีกแล้ว อีกแล้ว ไอ้แถบสถานะเวรตะไลนี่มันเอาแต่พึมพำกับตัวเองอีกแล้วโดยไม่ยอมอธิบายอะไรสักอย่าง!\n\nขณะที่เขากำลังคิดอยู่นั้น ข้อความเตือนก็เด้งขึ้นมาอย่างกะทันหัน คราวนี้เจ้าสิ่งนั้นกลับเริ่มอธิบายสถานการณ์ออกมาอย่างน่าประหลาดใจ\n\n“นี่มันอะไรกัน…?”\n\n[คำเตือน!]\n\n[สัญชาตญาณเอาตัวรอด Lv.3]\n\n[ลุกขึ้นจากที่นั่งเดี๋ยวนี้และเดินตรงไปข้างหน้า]\n\n[อย่าหันหลังกลับ]\n\n[ทำตัวให้เป็นธรรมชาติ]\n\n[แม้ว่าจะมีใครเรียกชื่อคุณ…]\n\nก่อนอื่นเลย เขาต้องลุกออกไปจากที่นั่งตรงนี้ก่อน ต่อให้แถบสถานะจะไม่เป็นมิตรและไร้ประโยชน์อย่างเหลือเชื่อ แต่อย่างน้อยมันก็ไม่เคยโกหก\n\nคอนเซปต์แบบนี้มันต้องเป็นเรื่องสยองขวัญสไตล์นาโปลิแทนแน่ๆ เขาลูบหน้าผากตัวเองแล้วลุกขึ้นยืน จากนั้นก็เริ่มก้าวเดินออกไปอย่างเป็นธรรมชาติ\n\nเขามั่นใจว่าผลงานที่ตัวเองเข้ามาเกิดใหม่คือเรื่อง [ไอ้สารเลวอัจฉริยะเพลงดาบแห่งดัชชีเหนือ] และชื่อเรื่องนี้ก็ชวนให้นึกถึงจักรวรรดิโรมันอันศักดิ์สิทธิ์…\n\nทว่า\n\nเขาไม่ได้มาจากดัชชีเหนือ เขาไม่ใช่อัจฉริยะเพลงดาบ และเขาก็ไม่แม้แต่จะเป็นไอ้สารเลวด้วยซ้ำ!\n\nเขากัดริมฝีปากแน่น แบบนี้มันดูเหมือน SCP… หรืออะไรสักอย่างที่ใกล้เคียงกับเซตติ้งสยองขวัญเหนือธรรมชาติ (Cosmic Horror) มากกว่าอีก\n\nอย่างน้อยก็ไอ้แถบสถานะเฮงซวยนี่… ไม่สิ มันไม่ใช่แถบสถานะอีกต่อไปแล้ว ตอนนี้มันถูกเรียกว่า ‘แถบห่วยแตก’ ต่างหาก\n\nยูจีนขบฟันแน่นและพยายามควบคุมสีหน้าของตัวเอง ตามปกติแล้ว ด้วยใบหน้าที่สงบนิ่ง เขาซ่อนมือที่สั่นเทาไว้ในแขนเสื้ออย่างแนบเนียน พลางก้าวเท้าเดินฉับๆ ไปข้างหน้า\n\n“ยูจีน” (อีวาน)\n\n“ครับ?” (ยูจีน)\n\nทำตัวให้เป็นธรรมชาติ เป็นธรรมชาติเข้าไว้\n\nขณะที่กำลังพึมพำเช่นนั้น ยูจีนก็เผลอหันศีรษะกลับไปตามเสียงเรียกชื่อของตัวเองจากทางด้านหลังโดยไม่ทันยั้งคิด\n\nอย่างน้อยเขาก็ต้องรักษาชื่อเสียงในสถาบันเอาไว้ให้ดี ด้วยรอยยิ้มอันอบอุ่นและเปี่ยมด้วยศรัทธา\n\n“ว่าแล้วเชียว ฉันคิดไม่ผิดจริงๆ เยฟเกนีก็คือยูจีน จีน ญี่ปุ่น เกาหลี นายมาจากที่ไหน?” (อีวาน)\n\n“!!!!!”\n\nซานตาคลอสกระหายเลือดกำลังจ้องเขม็งมาที่เขาจากหลังต้นไม้\n\nยูจีนซึ่งเหลือบมองหน้าต่างแจ้งเตือนที่กะพริบถี่ยิบอย่างบ้าคลั่ง ค่อยๆ หันศีรษะกลับมาอย่างเชื่องช้าและระมัดระวัง\n\n“อือ~ อืม อา อากาศวันนี้ช่างแจ่มใสจังเลยนะครับ” (ยูจีน)\n\nเขาทำทีราวกับว่าที่หันกลับมาก็ไม่ใช่เพราะตอบรับเสียงเรียก แต่แค่หันมายืดเส้นยืดสายเท่านั้น เขาเหลือบมองข้อความแจ้งเตือนซ้ำแล้วซ้ำเล่า พลางครุ่นคิดว่าจะยังมีข้อความเพิ่มเติมอีกไหม หรือว่าไอ้แถบสถานะชวนหงุดหงิดนี่กำลังพยายามจะหักมุมเนื้อเรื่องอีกรอบกันแน่\n\n– ตุบ\n\nฝ่ามืออันหนักหน่วงวางลงบนไหล่ของยูจีน\n\nอีวานจ้องเข้าไปในดวงตาของเขาพลางครุ่นคิด การสบตาของหมอนี่ดูเคอะเขินพิกล มันไม่ใช่แค่อาการของคนที่ตกใจหรือหวาดกลัวเท่านั้น\n\nเห็นได้ชัดว่านั่นคือสายตาของคนที่กำลังตระหนักถึงอะไรบางอย่างอยู่ แน่นอนว่าในทิศทางที่เด็กหนุ่มกำลังมองไปนั้นไม่มีอะไรอยู่เลย\n\nดังนั้น ข้อสันนิษฐานที่สมเหตุสมผลที่สุดก็คือ ‘มีบางสิ่งที่มองเห็นได้เฉพาะเด็กคนนี้เท่านั้น’\n\n“นายมองเห็นอะไร?” (อีวาน)\n\nเขาไม่รู้ว่ามีสิทธิพิเศษอะไรสำหรับผู้ถูกสิงร่างหรือเปล่า อย่างน้อยตัวเขาเองก็ไม่เคยได้รับอะไรแบบนั้นมาก่อน\n\nเป็นไปได้ไหมว่าแม็กซิมิเลียนอาจจะเกิดมาพร้อมกับพรสวรรค์พิเศษบางอย่าง? เรื่องนั้นไม่อาจล่วงรู้ได้\n\nทว่าหากเป็นเช่นนั้น\n\nหากมีสิ่งพิเศษบางอย่างสำหรับ “ผู้ถูกสิงร่าง” พวกเราก็พอจะอนุมานอย่างมีเหตุผลได้สองสามข้อโดยอิงจาก “สามัญสำนึก” ของคิมซอนอู\n\nแถบสถานะ หน้าต่างค่าพลัง หรืออะไรทำนองนั้น\n\nโดยทั่วไปแล้ว มันมักจะปรากฏบ่อยครั้งในนิยายแนวสิงร่างยุคแรกๆ หน้าจอแสดงผลเสมือนจริงสีฟ้าอันแสนสะดวกสบายที่มองเห็นได้เพียงคนเดียว\n\nบางทีสิ่งที่เขาเคยโหยหามาตลอดอาจจะกำลังปรากฏอยู่ในสายตาของไอ้เด็กคนนี้ก็ได้\n\nในอีกด้านหนึ่ง ทันทีที่ได้ยินคำพูดของอีวาน ยูจีนก็คิดขึ้นมาโดยสัญชาตญาณ\n\nสัตว์ประหลาดตรงหน้าเขาคนนี้คือ “ผู้ถูกสิงร่าง” อีกคนอย่างแน่นอน และคงจะมีพื้นเพเป็นคนเกาหลีด้วย\n\nบ้าเอ๊ย ตัวเอกคู่… นั่นมันทางลัดสู่ความพินาศชัดๆ มันเชยสะบัดตกยุคเกินไปแล้วไม่ใช่หรือไง?\n\nยูจีนพยายามทำตัวให้ปกติที่สุดเท่าที่จะทำได้ หากเป็นผู้ถูกสิงร่างอีกคนที่ใช้ชีวิตอยู่ในโลกใบนี้มานานกว่าตัวผม พวกเขาจะมีแนวโน้มเป็นมิตรหรือเป็นศัตรูมากกว่ากันล่ะ?\n\nอย่างน้อยผู้ชายคนนี้ก็มีประวัติเคยปาหินที่อัดแน่นไปด้วยจิตสังหารใส่ทันทีที่จำเขาได้ กล่าวอีกนัยหนึ่ง หมายความว่านี่คือสัตว์ประหลาดที่เป็นศัตรู\n\nสมองของยูจีนหมุนติ้ว เขาหวนนึกถึงเควสต์แรก\n\nสังหาร อีวาน เปโตรวิช หรือไม่ก็ปกปิดข้อมูล หรือไม่ก็เกลี้ยกล่อม\n\nความตายในกรณีที่ล้มเหลว\n\n“เอ่อ เอ่อ ค-ใคร ใครน่ะครับ… คุณรู้จักผมด้วยเหรอครับ…?”\n\n“ฉันตั้งใจจะมาทำความรู้จักให้รู้แจ้งนับจากนี้แหละ”\n\n“ถ้าคุณทำแบบนี้ ท่านคณบดีจะไม่ยอมอยู่เฉยแน่….”\n\n“นี่เป็นเรื่องที่ได้รับอนุมัติจากท่านนักบุญหญิงแพทริเซียแล้ว”\n\nเสียงดังเปรี้ยงปร้างราวกับฟ้าผ่า ความศรัทธาของยูจีนซึ่งร่อยหรอมาตั้งแต่ต้นพังทลายลงอย่างย่อยยับ เขาถูกมือของอีวานลากตัวเดินจากไป\n\n[คำเตือน – ยกเลิก -]\n\n[สัญชาตญาณเอาตัวรอด Lv.3]\n\n[ลุกขึ้นจากที่นั่งและเดินตรงไปข้างหน้าเดี๋ยวนี้ – ยกเลิก -]\n\n[อย่าหันหลังกลับ – ยกเลิก -]\n\n[ทำตัวให้เป็นธรรมชาติ – ยกเลิก -]\n\n[อย่าตอบรับใครก็ตามที่เรียกชื่อคุณ เขาไม่ใช่พันธมิตรของคุณ – ยกเลิก -]\n\n[จงไปกับคนสวน อย่าขัดขืน เขาคือพันธมิตรของคุณ]\n\nในเรื่องสยองขวัญสไตล์นาโปลิแทน ถ้าเห็นข้อความแบบนี้แล้วมันต้องตายไม่ใช่เรอะ?\n\nยูจีนจ้องมองแถบสถานะอย่างว่างเปล่าพลางครุ่นคิด\n\nช่างเป็นเดือนมีนาคมอันแสนรื่นรมย์ที่มาพร้อมสายลมฤดูใบไม้ผลิอันอบอุ่นเสียจริง\n\n***\n\nเมื่อทอดสายตามองลงมายังทิวทัศน์อันสงบสุขของคณะเทววิทยา ท่านนักบุญหญิงก็ทำเครื่องหมายกางเขนอย่างเงียบเชียบ\n\nผู้ถูกสิงร่างคนหนึ่ง\n\nผู้ถูกสิงร่างที่ต้องทนทุกข์ทรมานอยู่เพียงลำพังมานานถึงสามสิบปี\n\nไม่ล่วงรู้เรื่องราวของตนเอง หลงทางอยู่ในเป้าหมายของตัวเอง ผู้ถูกสิงร่างที่ค่อยๆ เลือนหายไปในฐานะตัวประกอบ\n\nเธอมองตามหลังอีวานที่เดินจากไปพลางสวดภาวนาในใจอย่างเงียบงัน\n\nดิฉันขอภาวนาให้คนตัดไม้ผู้พูดน้อยคนนั้นได้มีเป้าหมายในชีวิตเสียที\n\nเพื่อที่ในบั้นปลายของชีวิต เขาจะได้กอบกุมความสุขแม้เพียงสักหยิบมือไว้ในอุ้งมือของตนได้บ้าง\n\n“นักศึกษาที่คุณบอกว่าต้องการตัวสำหรับ ‘คลาสพิเศษ’… คือนักศึกษาคณะเวทมนตร์ปีหนึ่ง ออสวัลด์ ใช่ไหมครับ?”\n\n“ใช่ค่ะ ชื่อนั้นแหละค่ะ มีปัญหาอะไรหรือเปล่าคะ?”\n\n“เอ่อ… ตัวเด็กคนนั้นเองไม่ได้มีปัญหาอะไรหรอกครับ เขาเป็นนักศึกษาที่ขยันขันแข็งและมีพรสวรรค์มากคนหนึ่ง เพียงแต่ว่า….”\n\nคณบดีคณะเวทมนตร์มองท่านนักบุญหญิงด้วยสีหน้าพิกล\n\nเขาเป็นเอลฟ์จากหมู่เกาะคาลีออน จนกระทั่งก่อนเปิดภาคเรียนไม่นาน เขายังเป็นจอมเวทผู้ทรงเกียรติที่เคลื่อนไหวอยู่ในคาลีออน\n\nเผ่าพันธุ์เอลฟ์มีจำนวนน้อย เมื่อเทียบกับมนุษย์แล้วถือว่าขาดแคลนอย่างเห็นได้ชัด ดังนั้น ทายาทของตระกูลอันทรงเกียรติส่วนใหญ่จึงรู้จักมักจี่กันเป็นอย่างดี\n\nเขาก็ไม่ใช่ข้อยกเว้น หากนักศึกษาที่ท่านนักบุญหญิงเอ่ยถึงเป็นนักศึกษาที่เดินทางมาจากดินแดนอันห่างไกล เขาก็ย่อมต้องมาจากตระกูลที่มีชื่อเสียง ดังนั้นเขาจึงสามารถนึกประวัติส่วนตัวที่เธอกล่าวถึงขึ้นมาได้อย่างง่ายดาย\n\nออสวัลด์ อีสต์เบลเฟน ทายาทแห่งตระกูลจอมเวทอันทรงเกียรติของคาลีออนและบุตรชายขององคมนตรีคนปัจจุบัน เขาเป็นขุนนางหนุ่มที่ขยันหมั่นเพียร ฉลาดหลักแหลม เอาใจใส่ผู้อื่น และมากความสามารถ\n\nหมายความว่าเขาเป็นชายหนุ่มผู้มีอนาคตไกล เพียงแต่มีปัญหาเล็กๆ น้อยๆ อยู่บ้าง\n\n“ออกจะ… อาภัพไปสักหน่อยน่ะครับ”\n\n“อาภัพเหรอคะ?”\n\n“เขาเป็นชายหนุ่มที่หมั้นหมายกับบุตรสาวขององคมนตรีมาตั้งแต่กำเนิด แต่เพิ่งจะหย่าร้างแยกทางกันเมื่อไม่นานมานี้น่ะครับ แต่ทว่า… เอ่อ”\n\nจะอธิบายเรื่องนี้ยังไงดีนะ\n\nเอิร์นเบิร์ต คณบดีคณะเวทมนตร์ ปาดเหงื่อออกจากหน้าผากแล้วถอนหายใจ\n\nเอลฟ์เป็นเผ่าพันธุ์ที่แทบจะสมบูรณ์แบบในทุกกรณี ทว่ามีความบกพร่องหนึ่งที่เทพเจ้าทรงทิ้งเอาไว้ด้วยความริษยาในความสมบูรณ์แบบนั้น\n\nจุดบกพร่องของพวกเขาคือ “ความลุ่มหลงยึดติด” (มันไม่ใช่ความหยิ่งยโส แต่มันเป็นเรื่องธรรมชาติสำหรับเอลฟ์)\n\nความยึดติดในความสำเร็จ ความยึดติดในชื่อเสียง ความยึดติดในความรู้ ประเภทนั้นมีหลากหลาย แต่ในกรณีนี้…\n\nเอเวอลิน รัสต์ฟิสต์ บุตรสาวขององคมนตรี ดันเกิดความลุ่มหลงยึดติดในตัวออสวัลด์อย่างประหลาดน่ะสิ\n\n***\n\n(มุมมองของออสวัลด์)\n\n[นางร้ายที่คลั่งไคล้จอมเวทอัจฉริยะ] คือนิยายที่ห่วยแตกที่สุดในชีวิตของฉัน\n\nบ้าเอ๊ย ฉันพูดจริงๆ นะ มันคือกองขยะชัดๆ ฉันถึงขั้นเททิ้งตั้งแต่ตอนที่ 30 และไม่ได้ทิ้งคอมเมนต์ด่าทอหรือคำวิจารณ์อะไรเอาไว้เลยด้วยซ้ำ\n\nฉันจากมาอย่างสะอาดหมดจด นักเขียนคงไม่รู้จักฉันในฐานะนักอ่านเลยด้วยซ้ำ แต่ทำไมกันล่ะ\n\nออสวัลด์พยายามเมินเฉยต่อสายตาอันคมกริบที่สัมผัสได้จากด้านหลังศีรษะแล้วแหงนหน้ามองท้องฟ้า\n\n“ชีวิตฉันพังยับเยินหมดแล้ว”"
    },
