      "title": "บทที่ 63",
      "content": "“ได้ยินว่าเป็นพระสหายของท่านพ่อ แต่เมื่อนึกถึงนิสัยของท่านพ่อ... ที่โปรดปรานมิตรภาพอันลึกซึ้งจนเปิดใจให้กันได้มากกว่าการคบค้าสมาคมไปทั่ว ดิฉันก็นึกไม่ถึงเลยค่ะว่าจะมีคนที่ดิฉันยังไม่เคยพบหน้ามาก่อนอยู่ด้วย”\n\nสมแล้ว เอลเฟียราไม่ใช่คนที่จะรับมือได้ง่ายๆ เลย แม้จะยังเยาว์วัย แต่เธอก็เชี่ยวชาญวาทศิลป์แบบฉบับเอลฟ์อย่างทะลุปรุโปร่งแล้ว\n\nนั่นคือการยิงเตือนแบบเอลฟ์\n\n— “แกเป็นเพื่อนของพ่อฉันจริงหรือเปล่า? ดูท่าทางเหมือนพวกต้มตุ๋นนะ พ่อฉันไม่ค่อยมีเพื่อนหรอก ฉันไม่เคยเห็น ‘มนุษย์’ อย่างแกมาก่อนเลย”\n\n“เอลฟ์เลือดบริสุทธิ์” ที่เพิ่งจิกกัดทั้งบิดาของตัวเองและอีวานไปพร้อมกันในประโยคสุดแสนสุภาพเพียงประโยคเดียว กลับยกมือขึ้นป้องปากพร้อมคลี่ยิ้มอ่อนโยนอย่างเอียงอาย\n\n“พวกเราเคยร่วมรบในสมรภูมิเดียวกัน”\n\n“ว้าว! ที่แท้ก็เป็นสหายร่วมรบของท่านพ่อหรือคะ น่าทึ่งจังเลยค่ะ! ในเมื่อเคยยืนหยัดอยู่แนวหน้าเคียงข้างท่านพ่อในยุคสมัยนั้นได้ คุณคงต้องเป็นบุคคลที่ไม่ธรรมดามากแน่ๆ เลยนะคะ!”\n\nเอลเฟียราเหลือบมองชุดทำงานเก่ามอซอและผ้าพันคอช่างไม้ของอีวานพลางยิ้มรับอย่างเป็นมิตร\n\nนัยที่แฝงอยู่นั้นชัดเจน: ถึงจะเชื่อคำพูดของนายได้ยาก แต่ในเมื่อการพบกันครั้งนี้จัดขึ้นโดยบุตรชายคนโตของท่านไวส์เคานต์อีสต์เบลเฟนแห่งสภาองคมนตรี อย่างน้อยฉันก็จะยอมรับฟังดูสักหน่อยก็แล้วกัน\n\nเรื่องนี้ก็นับว่าช่วยไม่ได้จริงๆ\n\nย่อมเป็นเรื่องธรรมดาที่จะต้องระแวงคนแปลกหน้าซึ่งเปิดประโยคว่า “ฉันเป็นเพื่อนของพ่อเธอนะ—” เว้นเสียแต่ว่าประโยคถัดมาจะเป็น “เอานี่ค่าขนมไปใช้สิ”\n\nโดยเฉพาะเมื่ออีกฝ่ายเป็นมนุษย์ การจะเกลี้ยกล่อมเอลฟ์ที่มีเหตุผลให้ยอมรับเพื่อนชาวมนุษย์ของพ่อตัวเองนั้นเป็นเรื่องยากแสนเข็ญ\n\nดังนั้น อีวานจึงตัดสินใจไม่เสียเวลาหว่านล้อมให้มากความ มันไร้ความหมายและเสียเวลาเปล่า\n\n“ฉันต้องการการตีความอาคมคลาสสิกและเวทป้องกัน อย่างที่ได้ยินมา นี่เป็นเรื่องความมั่นคงระดับชาติ ดังนั้นจึงจำเป็นต้องรักษาความลับด้วย”\n\n“ดิฉันจะกล้าปฏิเสธผู้ที่เป็นสหายของท่านพ่อได้ยังไงกันคะ? แต่น่าเสียดายที่ดิฉันเป็นเพียงนักศึกษาคนหนึ่งเท่านั้น งานระดับชาติที่สำคัญขนาดนี้ ให้จอมเวทของประเทศพวกคุณรับผิดชอบจะไม่เหมาะกว่าหรือคะ?”\n\nคำตอบนี้ตรงตามที่เขาคาดการณ์ไว้ไม่มีผิด อีวานยังมีไพ่อีกใบอยู่ในมือ\n\n“รู้จักงานอดิเรกของเบโอลกรินไหม?”\n\n“งานอดิเรก... ของท่านพ่อหรือคะ?”\n\nวิธีแสดงความสนิทสนมที่ตรงไปตรงมาที่สุด นั่นก็คือการเปิดฉากประมาณว่า “นี่ เธอรู้หรือเปล่าว่าพ่อตัวเองชอบอะไร?”\n\n“เวทมนตร์โบราณที่สาบสูญไปแล้ว โดยเฉพาะโบราณวัตถุที่ใกล้เคียงกับยุคเทพปกรณัม ฉันพูดผิดตรงไหนไหม?”\n\n“เอ่อ ก็... เรื่องนั้นก็จริงอยู่หรอกค่ะ...”\n\nความจริงแล้ว นี่แทบจะเป็นงานอดิเรกสามัญประจำตัวของจอมเวททุกคนเลยก็ว่าได้ โดยทั่วไป ยิ่งคนมีความรู้สูงและมียศถาบรรดาศักดิ์มากเท่าไร ก็ยิ่งมีแนวโน้มจะหมกมุ่นกับการสะสมของเก่ามากขึ้นเท่านั้น และพอหลงเข้าไปแล้วก็จะคลั่งไคล้ถึงขั้นยอมขายเสาเรือนบ้านตัวเองเลยทีเดียว\n\nเวทมนตร์โบราณส่วนใหญ่ขาดความสามารถในการใช้งานจริง เพราะศาสตร์วิชาการย่อมวิวัฒนาการไปตามกาลเวลา ความคิดที่ว่าแค่แปะคำว่า “โบราณ” นำหน้าแล้วทุกอย่างจะทรงพลังขึ้นมาโดยอัตโนมัตินั้น เป็นไปได้แค่ในเกมเท่านั้นแหละ\n\nทว่า โบราณวัตถุใต้ดินของสถาบันศึกษานั้นเป็นคนละเรื่องกัน พลังของโบราณวัตถุโบราณที่ถูกฝังอยู่ใต้สถาบันการศึกษาถือเป็นสูตรสำเร็จมาตรฐานมาตั้งแต่ยุคฮอกวอตส์แล้ว\n\n“ได้ข่าวว่าใต้ดินของมหาวิทยาลัยแห่งนี้เพิ่งมีการขุดพบโบราณสถานลับ และภายในนั้นมีเวทมนตร์ที่คาดว่ามีอายุอย่างน้อยหนึ่งพันห้าร้อยปีหลับใหลอยู่ อ้อ จะเอาไปป่าวประกาศที่ไหนก็ตามสบายนะ ท่าทีอย่างเป็นทางการของราชสำนักคราซิลอฟจะปฏิเสธว่าเป็นเพียง ‘ข่าวลือไร้สาระ’ อยู่ดี”\n\n“...หากเป็นภารกิจสำคัญขนาดนั้น ดิฉันก็อดสงสัยไม่ได้นะคะ ทำไมถึงต้องเจาะจงเป็นดิฉันด้วยล่ะคะ...?”\n\n“คนที่มีฝีมือไว้ใจไม่ได้ ส่วนคนที่ไว้ใจได้ก็ขาดฝีมือ”\n\n“ในสายตาของคุณ ดิฉันเป็นแบบแรกหรือแบบหลังกันคะ?”\n\n“เธอเป็นทั้งคนที่ไว้ใจได้และมีฝีมือ”\n\nอีวานจ้องมองเอลเฟียราด้วยสายตาจริงจัง\n\n“ต่อให้เธอเอาไปพูด มันก็เป็นแค่คำบอกเล่าของนักศึกษาคนหนึ่ง ไม่ใช่เรื่องแปลกที่คนวัยเธอจะหลงใหลทฤษฎีสมคบคิด และต่อให้มีคนโง่หลงเชื่อขึ้นมา ก็ไม่อาจเรียกร้องให้ตรวจสอบประเทศนี้โดยตรงได้อยู่ดี ดังนั้นเรื่องนี้จะไม่มีวันรั่วไหลสู่สาธารณะ นั่นคือเหตุผลที่ฉันไว้ใจเธอ และเป็นเหตุผลที่ฉันไม่ไปตามหาจอมเวท ‘มืออาชีพ’ คนอื่น”\n\n“ท่านพ่อต้องเชื่อดิฉันแน่ค่ะ”\n\n“แต่เบโอลกรินไม่ได้โง่พอจะมากดดันประเทศอื่นเพียงเพื่อสะสมโบราณวัตถุ ใช่ไหมล่ะ?”\n\n“อึก...”\n\nอีวานพูดต่อกับเอลเฟียราที่กำลังเม้มริมฝีปากแน่น\n\n“อีกอย่าง ฉันเชื่อใจเบโอลกริน ฉันนับถือความสามารถของเขา ถ้าเธอเก่งกาจได้สักครึ่งหนึ่งของพ่อเธอ ฝีมือของเธอก็ไม่ต้องสงสัยแล้ว”\n\n“อนึ่ง ทางเราก็ได้ตรวจสอบผลการเรียนของคุณกริเคนคอสเอาไว้เรียบร้อยแล้วด้วย”\n\n“ถ้ารับงานนี้ เธอก็จะได้มอบ ‘โบราณวัตถุจากยุคโบราณใต้พิภพพริตเชนคายา’ เป็นของขวัญให้พ่อของเธอ จะทำไหม?”\n\n“...ดูเหมือนดิฉันจะไม่มีทางเลือกอื่นสินะคะ”\n\nเอลเฟียรายื่นมือออกมาพร้อมรอยยิ้มอ่อนโยน\n\nอีวานที่เผลอผงะไปตามสัญชาตญาณผ่อนคลายลงเมื่อเห็นว่ามือของอีกฝ่ายยื่นมาในท่าขอจับมือ\n\n“ยินดีที่ได้ร่วมงานนะคะ ว่าแต่คุณชื่ออะไรหรือคะ?”\n\n“เรียกฉันว่าอีวาน”\n\n“ดิฉันเข้าใจวัฒนธรรมของคราซิลอฟดีค่ะ และคงต้องขอพูดเลยว่านั่นเป็นชื่อปลอมที่ไร้ความสร้างสรรค์สิ้นดีเลยนะคะ แม้จะใช้เป็นนามแฝงก็เถอะ”\n\n“ฉันรู้”\n\n“...พวกมนุษย์นี่นะ”\n\nขณะที่มองคนทั้งสองจับมือกัน ออสวัลด์ก็จำต้องปรับเปลี่ยนการประเมินที่มีต่ออีวานเสียใหม่\n\nทำไมจู่ๆ ถึงพูดจาคล่องแคล่วมีวาทศิลป์ขนาดนั้นล่ะ...?\n\nแล้วทำไมเวลาปกติถึงไม่ยอมพูดจาแบบนี้...?\n\nน่าเสียดายที่ผู้ข้ามมิติคนนี้ซึ่งยังไม่คุ้นชินกับโลกยุคก่อนสมัยใหม่ดีนัก ไม่ทันตระหนักว่าบางครั้งก็มีสิ่งที่ทรงพลังในการโน้มน้าวใจยิ่งกว่าคำพูดอยู่\n\nแต่อีวานเป็นคนมีเหตุผล เขาจึงรู้ดีว่าการโน้มน้าวใจที่ได้ผลที่สุดคือการทำอย่างรวดเร็วฉับไว\n\nการโน้มน้าวใจที่รวดเร็วที่สุดในโลก ย่อมเกิดขึ้นเมื่ออีกฝ่ายต้องเลือกระหว่างการมีชีวิตอยู่กับการพยักหน้าตกลง\n\n***\n\nแม้ในยุคก่อนสมัยใหม่ อาคารขนาดใหญ่ก็ยังคงเริ่มต้นการก่อสร้างด้วยการปรับหน้าดินขุดรากฐาน นั่นหมายความว่าผู้คนในยุคนี้รู้จักวิธีเริ่มงานวิศวกรรมโยธาจากโครงสร้างใต้ดินเป็นอย่างดี\n\nยิ่งไปกว่านั้น โลกใบนี้ยังมี “ท่อระบายน้ำ” อยู่ด้วย ระบบระบายน้ำส่วนใหญ่ที่แผ่ขยายอยู่ทั่วเมืองนี้เก่าแก่ยิ่งกว่าตัวเมืองเสียอีก แต่ถึงกระนั้น เวลาสร้างอาคารหลังใหม่ ก็ยังต้องเริ่มต้นจากโครงสร้างชั้นใต้ดินอยู่ดี\n\nและยังมีอีกเรื่องหนึ่ง\n\nมหาวิทยาลัยเซนต์ยานสก์ก่อตั้งมาไม่ถึงยี่สิบปี\n\nมันเป็นมหาวิทยาลัยที่เพิ่งก่อตั้งขึ้นใหม่ในช่วงสงคราม ไม่มีทั้งเหตุผล เป้าหมาย หรือขีดความสามารถพอจะสร้างอะไรอย่างห้องแห่งความลับไว้ในอาคารกลางเมืองแห่งนี้\n\nการที่โบราณสถานลับจะซุกซ่อนอยู่ใต้ชั้นใต้ดินของอาคารแบบนี้โดยไม่มีใครสังเกตเห็นได้ ความลึกทางกายภาพจะต้องมหาศาลอย่างยิ่ง\n\nลึกยิ่งกว่าระบบท่อระบายน้ำชั้นใต้ดินของมหาวิทยาลัย\n\nลึกพอที่จะลงไปถึงจุดต่ำสุดของ “ทางระบายน้ำใต้ดินพริตเชนคายา” ซึ่งว่ากันว่าเก่าแก่ยิ่งกว่าตัวเมืองแห่งนี้เสียอีก\n\n“อุก แหวะ...”\n\nอีวานเมินเอลเฟียราที่กำลังอุดจมูกทำท่าพะอืดพะอมอยู่ข้างๆ แล้วก้าวเดินต่อไป\n\nทางระบายน้ำใต้ดินพริตเชนคายาไม่ใช่สถานที่อันน่ารื่นรมย์อย่างแน่นอน ทั้งอับชื้น มืดมิด คับแคบ และเต็มไปด้วยสายน้ำเน่าเสียข้นคลั่กที่ไหลเอื่อย\n\nเป็นสถานที่ที่ยั้วเยี้ยไปด้วยสัตว์น่ารังเกียจอย่างหนูและแมลงสาบ ไม่ใช่ที่ที่เอลฟ์สาววัยแรกรุ่นจะเดินเล่นชิลๆ ได้โดยไม่รู้สึกรู้สา\n\n“ต้องเดิน... อึก... ไปอีกไกลแค่ไหนคะเนี่ย...?”\n\n“ใกล้ถึงแล้ว”\n\n“คุณพูดคำนั้น... อุหวะ อ้วก! มาสิบรอบแล้วนะคะ!”\n\n“อืม”\n\nอีวานกวาดตามองสำรวจรอบข้างระหว่างก้าวเดิน\n\nสายตาของเขาอ่านร่องรอยนับไม่ถ้วนที่หลงเหลืออยู่บนผนังท่อระบายน้ำ\n\nสิ่งปลูกสร้างฝีมือมนุษย์ที่ไม่ได้รับการบำรุงรักษาย่อมผุพังไปตามกาลเวลา ทางระบายน้ำใต้ดินพริตเชนคายาก็ไม่มีข้อยกเว้น ช่วงทางที่ขาดการดูแลย่อมเสี่ยงต่อการทรุดตัวของชั้นดินเสมอ\n\nสัญญาณของการเสื่อมสภาพ ยกตัวอย่างเช่น สามารถดูได้จากรอยแตกร้าวและการสึกกร่อนของก้อนอิฐ\n\nเขามองข้ามก้อนอิฐที่ถูกน้ำขังและกาลเวลากัดเซาะจนลบเหลี่ยมมุมมนกลม แล้วเพ่งความสนใจไปยังร่องรอยที่ขอบมุมยังคงคมกริบจนมีฝุ่นหินร่วงกราวลงมาเท่านั้น\n\nเหล่านั้นคือร่องรอยที่บิดเบี้ยวไปจากอิทธิพลของโบราณวัตถุขุดเจาะของคนแคระ\n\nหลังจากเดินตามร่องรอยที่แผ่ขยายราวกับใยแมงมุมอันถี่หนาขึ้นเรื่อยๆ มาได้พักใหญ่...\n\n“โอ้...”\n\nเอลเฟียรายืนนิ่งตะลึงงัน จนลืมแม้กระทั่งการยกมือปิดปาก\n\n— ซ่าาาา....\n\nโถงถ้ำขนาดมหึมาปรากฏขึ้นเบื้องหน้าพวกเขา สายน้ำใต้ดินที่ไหลมารวมตัวกันจากน้ำฝนกำลังร่วงหล่นลงมาประดุจน้ำตก\n\nเห็ดดอกเล็กๆ ที่เปล่งแสงสีฟ้า และกลุ่มแสงระยิบระยับที่พัดพามาจากที่ไหนสักแห่งรายล้อมอยู่ตามขอบโถงถ้ำ ส่องประกายเจิดจรัส\n\nกระแสน้ำที่พุ่งทะลักผ่านท่อส่งน้ำใต้ดินที่แตกหักก่อตัวเป็นม่านน้ำตกไหลดิ่งลงสู่ห้วงลึกอันไร้ก้นบึ้งตรงใจกลางโถงถ้ำอันกว้างใหญ่นี้\n\n“นี่คือ... โบราณสถานหรือคะ?”\n\n“เปล่า นี่แค่ทางเข้า”\n\nอีวานก้าวไปข้างหน้าพลางอ่านร่องรอยตรงหน้า แม้จะเพิ่งเกิดขึ้นได้ไม่ถึงหนึ่งสัปดาห์ แต่มันก็ถูกกระแสน้ำเชี่ยวกรากกัดเซาะและสึกกร่อนไปมากแล้ว\n\n‘ใกล้จะถล่มเต็มทีแล้ว ถ้าช้ากว่านี้คงอันตรายแน่’\n\nอย่างมากก็อีกหนึ่งสัปดาห์ พื้นดินบริเวณนี้จะพังทลายลงภายในเวลานั้น อีวานคิดอย่างเฉียบคมพลางกวาดตามองไปรอบๆ\n\n“แค่นี้ยังเป็นแค่ทางเข้าเองหรือคะ? มีจอมมารโบราณถูกผนึกไว้ที่นี่หรือยังไงกัน? ทำไมขนาดมันถึงใหญ่โตได้ขนาดนี้ล่ะคะ...?”\n\n“ฝีมือของพวกคนแคระน่ะ”\n\n“คนแคระหรือคะ?”\n\n“หน้าผานี้เองไม่ได้เกี่ยวอะไรกับโบราณสถานใต้ดินหรอก นี่เป็นแค่สถานที่ที่โบราณวัตถุของคนแคระ ‘เคยตั้งอยู่’ เท่านั้น”\n\nอีวานยืดหลังตรงแล้วลุกขึ้นยืน เขาขยับคอเสียงดังกร๊อบก่อนจะชักขวานออกมา\n\n“โบราณวัตถุของคนแคระ? เคยตั้งอยู่? นั่นหมายความว่ายังไงกันคะ ช่วยอธิบายที”\n\n“แผ่นดินไหวในพริตเชนคายาเมื่อสัปดาห์ก่อนเป็นฝีมือของพวกคนแคระ พวกมันนำโบราณวัตถุขุดเจาะมาแล้วขุดเจาะลงมายังพื้นที่ใต้ดินแห่งนี้”\n\n“อะไรนะคะ?!”\n\n“หน้าผาตรงนั้น ที่ดูเหมือนหน้าผา เหวลึกตรงนั้น คือจุดที่โบราณวัตถุนั่นเคยอยู่”\n\nเช่นเดียวกับที่พวกเอลฟ์มีเรือรบกลางเวหา พวกคนแคระก็มีโบราณวัตถุขุดเจาะ\n\nเหตุใดพวกคนแคระฝีมือฉกาจเหล่านั้นจึงไม่กล้าสร้างโบราณวัตถุพรรค์นี้ขึ้นมาใหม่?\n\nนั่นเป็นเพราะมันต้องใช้ทรัพยากรมหาศาลเกินไปในการสร้างใหม่ เนื่องจากขนาดอันใหญ่โตมโหฬาร รวมถึงองค์ความรู้ทางเทคนิคในการออกแบบชิ้นส่วนอันซับซ้อนและละเอียดอ่อนได้สูญหายไปแล้ว\n\nเช่นเดียวกับที่เรือรบกลางเวหาของคาลีออนได้รับสมญานามว่า “ป้อมปราการลอยฟ้า” โบราณวัตถุขุดเจาะของคนแคระก็ได้รับสมญานามว่า “หอคอยตีเมืองแห่งโลกใต้พิภพ”\n\nหน้าที่ของโบราณวัตถุขุดเจาะมีเพียงอย่างเดียวคือการขุดทะลวงผืนดิน มันเคลื่อนที่ผ่านชั้นใต้ดินลึกโดยบรรทุกพวกคนแคระไปด้วยเท่านั้น\n\nส่วนเหตุผลที่ของพรรค์นี้กล้าถูกเรียกว่า “โบราณวัตถุ” และกลายเป็นเป้าหมายทางยุทธศาสตร์ที่ต้องทำลายให้สิ้นซากนั้นแสนเรียบง่าย\n\n‘มันใหญ่เกินไป’\n\nมวลมหาศาลของมันกลายเป็นอาวุธในตัวมันเอง ชั้นดินที่ถูกโบราณวัตถุขุดเจาะทะลวงผ่านย่อมพังทลายลงอย่างไม่อาจหลีกเลี่ยง และหากเปิดใช้งานโบราณวัตถุเช่นนั้น ขนาดของมันก็ใหญ่โตเสียจนก่อให้เกิดแผ่นดินไหวในระหว่างการทำงานได้\n\nเวทมนตร์ที่สามารถทำลายวัตถุ... ไม่สิ “สิ่งปลูกสร้าง” ขนาดนั้นได้ในชั่วพริบตา ถูกนำมาใช้ที่นี่\n\n“พอจะตีความอะไรได้ไหม?”\n\n“คะ อะไรนะคะ?!”\n\n“ฉันถามว่าพอจะมองเห็นพลังเวทที่ปรากฏให้เห็น หรือร่องรอยการใช้เวทมนตร์บ้างไหม”\n\n“ไม่เลยค่ะ มีแค่น้ำ... แล้วถึงความเข้มข้นของพลังเวทจะหนาแน่น แต่มันก็อยู่ในระดับปรากฏการณ์ธรรมชาติเท่านั้นเองค่ะ...”\n\n“งั้นคงต้องใช้วิธีสำรองแล้ว”\n\nตั้งแต่แรกเขาก็ไม่ได้คาดหวังอะไรมากนัก สิ่งที่เขาคาดหวังจากเอลเฟียราไม่ใช่การค้นหาทางเข้าของโบราณวัตถุ\n\nหากเรื่องแค่นั้นทำได้ง่ายดาย เอลิซาเวตาคงตรวจพบไปตั้งแต่ตอนส่งทีมวิเคราะห์มาล่วงหน้าแล้ว นั่นเป็นเรื่องธรรมดา\n\nดังนั้น เขาจึงต้องลงมือทำในสิ่งที่จำเป็นต้องทำ อีวานค่อยๆ ปรับท่ายืนอย่างช้าๆ แล้วสูดลมหายใจเข้าลึก\n\n“เอ่อ ขอโทษนะคะ นี่... กำลังจะทำอะไรหรือคะ?”\n\n“เตรียมเวทป้องกันไว้ซะ”\n\n“...ตอนนี้ดิฉันเริ่มรู้สึกกังวลขึ้นมาจริงๆ แล้วนะคะ ทำไมต้องทำแบบนั้นด้วยล่ะคะ?”\n\n“เพราะเดี๋ยวเธอต้องใช้แน่”\n\nพลังเวทซึมซาบเข้าสู่กระแสเลือด พร้อมกับความรู้สึกซาบซ่านแปลบปลาบ เวลาค่อยๆ เริ่มถูกซอยแบ่งออกทีละเสี้ยวอย่างเชื่องช้า\n\nกลุ่มแสงที่ล่องลอยอยู่บิดโค้งอย่างเนิบนาบ และฝุ่นละอองในอากาศก็ปรากฏชัดจนไล่สายตาติดตามได้ทีละอนุภาค\n\nศีรษะของเขาร้อนผ่าวขึ้นเมื่อพลังเวทเร่งปฏิกิริยาโครงข่ายประสาท ราวกับคลื่นข้อมูลจากประสาทสัมผัสที่ถาโถมเข้าใส่\n\nสัมผัสทางกายที่ไวขึ้น สายตาที่เฉียบคมขึ้น ประสาทรับกลิ่นที่ตึงเขม็ง การได้ยินที่เปิดกว้างอย่างละเอียดลออ—ทั้งหมดพัดพาสึนามิแห่งความรู้สึกโหมกระหน่ำเข้ามาพร้อมกัน\n\nประสาทสัมผัสที่ถูกยกระดับเช่นนี้ย่อมใช้งานสมองเกินขีดจำกัด อวัยวะรับสัมผัสของมนุษย์ไม่ได้ถูกออกแบบมาให้รับข้อมูลปริมาณขนาดนี้\n\nดังนั้น เขาจึงตัดประสาทการได้ยินทิ้งเสีย\n\n— เปรี๊ยะ!!\n\nเฉกเช่นเดียวกับที่การได้ยินจะเฉียบคมขึ้นเมื่อคุณหลับตา\n\nอวัยวะรับสัมผัสของมนุษย์ไม่ได้ถูกสร้างมาให้ทำงานแยกขาดจากกันอย่างอิสระ ทุกครั้งที่ประสาทสัมผัสหนึ่งถูกจำกัด สมรรถภาพการรับรู้โดยรวมย่อมพุ่งสูงขึ้นอย่างมีนัยสำคัญ\n\nทันทีที่สูญเสียการได้ยิน พลังเวทในระบบประสาทก็พลุ่งพล่านขึ้นมาพร้อมเสียงวิ้งสั้นๆ ในหู เขาปรับจูนมันอย่างประณีต แล้วลงมืออีกครั้ง\n\n— เปรี๊ยะ!!\n\nถัดจากการได้ยินก็คือประสาทรับกลิ่น\n\nเพื่อแลกกับการสังเวยระบบประสาทสัมผัสที่ไร้ประโยชน์ไปสองอย่าง ประสาทตอบสนองของเขาก็บังคับทะลวงขีดจำกัดที่ปกติไม่มีวันกล้าก้าวข้ามไปได้\n\nท่ามกลางช่องว่างที่ห้วงเวลาเอียงกระเท่เร่อย่างหมิ่นเหม่นี้\n\n— ชิ้ง....\n\nพลาง “สัมผัส” ถึงคมขวานที่ถูกชักออกมาอย่างน่าสะพรึงกลัว เขาก็ปรับท่วงท่าของตัวเองอย่างเงียบเชียบ\n\nดวงตาที่มองตรงไปเบื้องหน้าถูกย้อมไปด้วยสีแดงฉาน นั่นเป็นเพราะเส้นเลือดฝอยในลูกตาแตกออก\n\nทว่าไม่จำเป็นต้องกังวล การทำงานของดวงตายังคงเป็นปกติดี\n\nจากนั้น เขาจึงยืนยัน “ทิศทาง” ที่โบราณวัตถุขุดเจาะของคนแคระเคยมุ่งหน้าไป\n\nร่องรอยเหล่านั้น ทีละจุด ทีละเส้น\n\n‘ขวาหน้า 15 องศา ล่างกลาง 22 องศา’\n\nเขาคำนวณย้อนกลับจากร่องรอยเพื่อจับทิศทางที่โบราณวัตถุขุดเจาะของคนแคระเคยถูกเปิดใช้งานได้อย่างแม่นยำ\n\nในขณะเดียวกัน เขาก็บิดคมขวานสะบัดไปด้านหลัง\n\n— กร๊อบ!!!\n\nสองเท้ายึดติดแน่นกับพื้น เอวบิดเกลียว มัดกล้ามเนื้อที่พาดยาวจากกล้ามเนื้อเฉียงหน้าท้อง แผ่ขยายไปยังกล้ามเนื้อหลังแขนที่เกร็งเขม็งตัดผ่านหัวไหล่\n\nการปลุกเร้าเส้นประสาทที่มีพลังเวทไหลเวียน แรงตึงในเส้นเอ็นทุกเส้นพุ่งสู่จุดสูงสุดในชั่วขณะนั้น\n\nภาพที่เขาวาดไว้ในห้วงคำนึง คือการฟาดฟันในลมหายใจเดียวที่สมบูรณ์แบบที่สุด\n\n‘ของแม็กซิมิเลียน’\n\nหวนนึกถึงท่วงท่าของชายหนุ่มผมทองในวันวาน ยามเมื่ออีกฝ่ายเงยหน้าขึ้นมองท้องฟ้ายามราตรี\n\nระลึกถึงเพลงดาบที่รุนแรงที่สุดเท่าที่เขารู้จัก\n\n‘ผ่าดาราประกายพรึก’\n\n— ฟู่....\n\nลมหายใจแผ่วต่ำระบายออกมา\n\n— ฟิ้ว...!\n\nประกายแสงวาบฉีกกระชากห้วงอากาศอันว่างเปล่า\n\n— ตูมมมมมม—!!!\n\nแรงกระแทกตามหลังมาในชั่วอึดใจต่อมา\n\n***\n\n“นี่มันเรื่อง... ไร้สาระอะไรกัน?”\n\nเอลิซาเวตาต้องอ่านรายงานสั้นกระชับฉบับนั้นซ้ำถึงสามรอบ\n\nแม้จะเขียนด้วยภาษากลางของคราซิลอฟ และเขียนด้วยตัวบรรจงงดงามตามระบบการรายงานอย่างถูกต้องครบถ้วน แต่มันก็เข้าใจยากเหลือเกิน\n\nเธอค่อยๆ วางรายงานลงแล้วหยิบถ้วยชาขึ้นมา\n\n– ปฏิกิริยาทางเวทมนตร์ในพื้นที่เกิดเหตุได้รับการยืนยันเฉพาะจากโบราณวัตถุขุดเจาะของคนแคระเท่านั้น\n\n– ด้วยเหตุนี้ จึงจำเป็นต้องดำเนินการตรวจสอบซ้ำภายใต้เงื่อนไขเดียวกัน เพื่อยืนยันการมีอยู่และตำแหน่งที่ตั้งของพื้นที่ดังกล่าว\n\n– เนื่องจากโบราณวัตถุขุดเจาะของคนแคระได้สูญหายไปแล้ว จึงไม่มีหนทางพิสูจน์ด้วยการนำโบราณวัตถุขุดเจาะกลับมาใช้งานซ้ำได้\n\n– ดังนั้น ด้วยดุลยพินิจของเจ้าหน้าที่ภาคสนาม จึงขอปล่อยแรงกระแทกเทียบเท่าแรงกระแทกโดยประมาณของโบราณวัตถุขุดเจาะลงสู่พื้นที่ดังกล่าว เพื่อให้สอดคล้องกับเงื่อนไขมากที่สุดเท่าที่จะเป็นไปได้\n\n– (เอกสารแนบ) จอมเวทผู้วิเคราะห์เวทมนตร์ของโบราณสถานต้องสามารถใช้งาน “เวทป้องกัน” ระดับสูงได้\n\n“คิดจะทำบ้าอะไรกันแน่เนี่ย...”\n\nเอลิซาเวตาเลิกล้มความตั้งใจที่จะทำความเข้าใจ ยกมือกุมหน้าผากแล้วถอนหายใจเฮือกใหญ่\n\nพอกลับมาเมื่อไร คราวนี้ต้องเอาจริงให้ได้ ต้องเอาจริงแบบสุดๆ\n\nเธอสาบานว่าจะต้องสั่งสอนเจ้าหมอนี่ให้รู้สำนึกถึงเรื่อง “การปฏิบัติตามระเบียบการรายงานล่วงหน้า” หรือไม่ก็ “จงมอบอำนาจการตัดสินใจภาคสนามไว้ที่เอลิซาเวตาซะ” ให้จงได้\n\n***\n\n**💬 ความคิดเห็นนักอ่าน:**\n- **@ผู้แปลภาษาเอลฟ์** (1 วันที่แล้ว • 👍 184): สุดยอดมากลุง! เอลเฟียราอุตส่าห์ร่ายวาทศิลป์เอลฟ์จิกกัดแบบผู้ดีซะยาว ลุงไม่เสียเวลาเล่นสงครามประสาทด้วยเลย เอาโบราณวัตถุมาล่อเป็นของขวัญให้พ่อเบโอลกรินตรงๆ จบข่าว! 555\n- **@ขวานผ่าดาราประกายพรึก** (1 วันที่แล้ว • 👍 219): ฉากลงทางระบายน้ำใต้พริตเชนคายาอย่างมัน! พอเอลเฟียราตรวจไม่เจอเวท ลุงสั่งกางเวทป้องกัน ตัดประสาทหูจมูกตัวเอง แล้วหวดขวานเลียนแบบท่า 'ผ่าดาราประกายพรึก' ของแม็กซิมิเลียนถล่มทางเข้าเลย โคตรบ้าพลัง!\n- ↳ **@เอลฟ์ผู้ตื่นตระหนก** (1 วันที่แล้ว • 👍 68): จอมเวทเอลฟ์ยังยืนงงกับมนุษย์สายกายภาพคนนี้เลย ใช้ขวานก๊อปปี้ท่าดาบผู้กล้าได้หน้าตาเฉย\n- **@เลขานุการองค์หญิง** (1 วันที่แล้ว • 👍 175): ร้อยทั้งร้อยต้องขำรายงานราชการสุดกวนท้ายตอน: \"...จึงขอปล่อยแรงกระแทกเทียบเท่าแรงกระแทกโดยประมาณของโบราณวัตถุขุดเจาะลงสู่พื้นที่ดังกล่าว...\" เอลิซาเวตากุมขมับถึงขั้นสาบานจะจับลุงมาอบรม \"การปฏิบัติตามระเบียบการรายงานล่วงหน้า\" ให้ได้ 555\n- ↳ **@คนอ่านที่รอฉากอบรม** (18 ชั่วโมงที่แล้ว • 👍 52): รอดูตอนหน้าเลยว่าใครจะสอนใครระหว่างองค์หญิงกับลุงทึ่มคนนี้ 5555"

      "title": "บทที่ 64",
      "content": "ไม่มีแสงจ้าชวนพร่ามัวหรือเสียงระเบิดตระการตาปรากฏขึ้นให้เห็น ซึ่งก็เป็นเรื่องที่คาดไว้อยู่แล้ว ปรากฏการณ์เช่นนั้นย่อมเกิดตามมาก็ต่อเมื่อมีวัตถุระเบิดเท่านั้น\n\nใต้ฐานรากที่เต็มไปด้วยน้ำบาดาลแห่งนี้จะมีสิ่งใดให้จุดระเบิดขึ้นมาได้เล่า?\n\n– ครืน ครืน ครืน...!!\n\nทว่าแรงสั่นสะเทือนนั้นมีอยู่จริง คลื่นกระแทกจากการทำลายล้างอันมหาศาลกำลังแผ่กระจายไปทั่วโพรงถ้ำใต้ผืนดินแห่งนี้\n\nอีวานหันกลับมาโดยที่มือยังคงกำด้ามขวานแน่น\n\n“...!!!!”\n\nเอลเฟียรากำลังตะโกนอะไรบางอย่าง สีหน้าของเธอเต็มไปด้วยความหวาดกลัว โกรธเกรี้ยว และงุนงงสับสนปนเปกันไปหมด\n\nอ้อ การตัดเสียงนี่เอง\n\nแต่เขาไม่มีความคิดจะปลดมันออก ถึงจะไม่มีการระเบิด แต่แรงอัดจากแรงกระแทกย่อมสะท้อนก้องไปทั่วโพรงถ้ำแห่งนี้ เสียงดังเกินระดับย่อมบั่นทอนสมาธิ\n\n“ร่ายเวทป้องกัน”\n\nอีวานเอ่ยบอกเอลฟ์สาวอย่างชัดเจนก่อนจะตั้งท่าเตรียมพร้อมอีกครั้ง\n\nครืน ครืน ครืน ผืนดินคำรามกึกก้อง รอยแยกแตกปร่าปรากฏขึ้นบนพื้นใต้ฝ่าเท้าของเขา\n\n“กำลังจะถล่มแล้ว”\n\n“...!!! ...!?!”\n\nเขาเป็นคนที่เรียนรู้การอ่านริมฝีปากมาก่อน จึงดูออกในทันทีว่าเอลฟ์สาวกำลังสบถคำหยาบคายออกมาอย่างสิ้นหวัง\n\nสิ่งที่เขาใส่ใจมีเพียงว่าเธอรู้จักวิธีร่ายเวทป้องกันหรือไม่ ดังนั้นเรื่องอื่นนอกเหนือจากนั้นจึงไม่คุ้มค่าแก่การสนใจ\n\nเขายื่นแขนออกไปโอบรอบเอวของเอลเฟียรา\n\n“!!!?!”\n\nนี่แกวางแผนเรื่องนี้มาตั้งแต่แรกแล้วเรอะ?! ไอ้คนวิปริต!! เจ้ามนุษย์สามัญ!\n\nเขาไม่แน่ใจว่าคำสุดท้ายนั้นหมายความว่าอย่างไร แต่คงจะเป็นคำด่าในภาษาเอลฟ์สักคำ\n\n“เวทป้องกัน”\n\nอีวานตอบสั้นๆ จากนั้นก็เอ่ยต่อ\n\n“แล้วก็อย่าหลับตา”\n\nเขาทิ้งตัวพุ่งลงไปทางหน้าผาเบื้องล่าง\n\n“ถ้าเห็นกระแสพลังเวทแล้วอย่าให้คลาดสายตา ทำสิ่งที่เธอต้องทำซะ ที่เหลือทั้งหมดเป็นหน้าที่ของฉันเอง”\n\nเขาไม่แน่ใจว่าเวทป้องกันจะต้านทานแรงกระแทกได้มากน้อยแค่ไหน ของเบโอลกรินนั้นแข็งแกร่งพอจะรับการโจมตีครั้งหนึ่งจากเจ็ดขุนพลมังกรได้เลยทีเดียว\n\nต่อให้ไม่ถึงระดับนั้น อย่างน้อยก็น่าจะกันเศษกรวดหินก้อนเล็กๆ ที่ปลิวมากระแทกร่างได้บ้าง\n\nอีวานเชื่อเช่นนั้นจึงเงยหน้ามองเพดานถ้ำ ขณะสัมผัสรู้สึกถึงสภาวะลอยตัวอันประหลาดเหนือเหวมืดมิด\n\n– ครืน ครืน ครืน...!!\n\nเกิดแผ่นดินไหวขึ้นอีกระลอก และจุดศูนย์กลางที่เคยแตกร้าวอย่างน่าหวาดเสียวก็พังทลายลงมาในที่สุด\n\nดินและหินก้อนมหึมาเริ่มร่วงกรูลงมาจากหน้าผาไล่หลังทั้งสองคน\n\n***\n\nอย่าหลับตางั้นเหรอ...?\n\nเอลเฟียราถลึงตามองเจ้าลุงลิงบ้าคลั่งคนนี้ (ซึ่งอันที่จริงเขาไม่ได้เป็นสักอย่าง) พลางพยายามปาดน้ำตา\n\nสายลมกรรโชกซัดเข้าใส่ใบหน้าของเธอ เส้นผมที่เคยภาคภูมิใจบัดนี้เปรอะเปื้อนดินและฝุ่นจนเขรอะ มันสะบัดฟาดใส่หน้าเธอตามแรงลมทุกครั้ง\n\nอึก อึก!\n\nแม้แต่จะหายใจในสถานการณ์นี้ยังยากลำบาก—ทั้งเสียงกัมปนาทที่สะท้อนก้องไปทั่วถ้ำ การร่วงหล่นอันไร้ที่สิ้นสุดเบื้องล่างฝ่าเท้า และความรู้สึกไร้น้ำหนัก นับเป็นปาฏิหาริย์แล้วด้วยซ้ำที่เธอยังพอร่ายเวทป้องกันออกมาได้ทัน\n\nไม่มีทางที่เธอจะรวบรวมสมาธิได้มากไปกว่านี้อีกแล้ว\n\n“จะทำแบบนั้นได้ยังไงกัน!!”\n\nเพราะไม่มีมนุษย์คนไหนที่มีความรู้เกี่ยวกับความลี้ลับและภูมิปัญญาแห่งเวทมนตร์อยู่บ้างจะกล้าพูดอะไรแบบนี้ ไอ้ลิงโง่เอ๊ย...\n\n– หากท่านเก่งกาจได้สักครึ่งหนึ่งของท่านพ่อ ฝีมือของท่านก็คงไร้ข้อกังขาแล้ว\n\n‘อ๊ะ....’\n\nมนุษย์ผู้นี้อ้างว่าเคยยืนหยัดอยู่บนสมรภูมิเดียวกับบิดาของเธอ สภาพมอมแมมซอมซ่อของเขาไม่มีส่วนใดที่ชวนให้เชื่อถือได้เลย\n\nเธอตามเขามาที่นี่เพียงเพราะคำรับรองจากบุตรชายคนโตของตระกูลไวส์เคานต์อีสต์เบลเฟนเท่านั้น\n\nแน่นอนว่ามันต้องเป็นเรื่องโกหก แต่เธอก็ยอมตกลงโดยคิดเพียงว่าอย่างน้อยคงใช้เป็นกับดักทางการเมืองเล่นงานทายาทแห่งสภาองคมนตรีได้ นั่นคือขอบเขตความตั้งใจทั้งหมดของเธอ\n\nทว่าเมื่อได้เห็นสถานการณ์ตรงหน้า ความคิดที่ว่ามันอาจเป็นเรื่องโกหกกลับไม่ผุดขึ้นมาในหัวเลยแม้แต่น้อย\n\nคนที่มีความสามารถหยุดยั้งการทำลายล้างระดับนี้ได้ด้วยร่างกายเปล่าเปลือย ย่อมมีคุณสมบัติมากพอจะยืนเคียงข้างบิดาของเธอในมหาสงครามเผ่าพันธุ์ครั้งก่อนอย่างแน่นอน\n\nนั่นหมายความว่า...\n\n‘ท่านพ่อของเธอคงทำเรื่องแค่นี้ได้อย่างง่ายดาย’\n\nเขาหมายความเช่นนั้น นั่นคือเขากำลังเชื่อมั่นในความสามารถของเธอ\n\nเฉกเช่นเดียวกับที่เธอเชื่อคำรับรองของออสวัลด์ อีสต์เบลเฟนและยอมตามมา\n\nชายผู้นี้กำลังเฝ้ามองเธอ โดยเชื่อมั่นในความสามารถของ “บุตรสาวแห่งเบโอลกริน กริเคนคอส”\n\n‘ถ้าเป็นท่านพ่อล่ะก็ ท่านพ่อต้องทำได้แน่...’\n\nเอลเฟียราฝืนลืมตาขึ้น แม้สายลมจะฟาดซัดเข้าใส่ใบหน้าอย่างไร้ปรานี เธอก็ยังกัดฟันเบิกดวงตาที่เอ่อคลอไปด้วยน้ำตาขึ้นมอง\n\nเธอคือเอลฟ์\n\nเอลฟ์แห่งหมู่เกาะคาลีออน เผ่าพันธุ์อันสูงส่งที่สุดในโลกใบนี้ และเป็นเผ่าพันธุ์ที่ทรงพลังที่สุด\n\nและในหมู่เอลฟ์เหล่านั้น เธอคือบุตรสาวของเบโอลกริน หนึ่งในมหาจอมเวทผู้ยิ่งใหญ่ที่สุดนับแต่ยุคตำนาน\n\nเธอนึกย้อนถึงถ้อยคำที่บิดามักพร่ำสอนเสมอในวัยเยาว์\n\n– เวทมนตร์คือศาสตร์แห่งการแปรเปลี่ยนจินตนาการให้กลายเป็นความจริง\n\n– เอลเฟียรา เวทมนตร์คือสิ่งที่สร้างบันไดสู่สรวงสวรรค์ให้แก่ปุถุชนผู้ย่ำเดินอยู่บนผืนดิน\n\n– ดังนั้น จงตั้งมโนภาพของเจ้าให้มั่น\n\n“ฟ้า...”\n\nเอลเฟียราพึมพำพลางจ้องมองเพดานสูงลิบของโพรงถ้ำในจุดที่ควรจะเป็นท้องฟ้า\n\nโอบรับพลังเวทเพื่อทะยานขึ้นสู่สรวงสวรรค์\n\n“ดิน...”\n\nยืนหยัดอยู่บนฝุ่นธุลีสีแดงแห่งผืนปฐพี ทว่าเปี่ยมด้วยจิตใจอันซื่อตรง เพราะเหตุนั้น\n\nคน... ตั้งมโนภาพของปุถุชนให้เที่ยงตรง แล้วก้าวเดินไปข้างหน้าอีกหนึ่งก้าวบนบันไดแห่งเจตจำนงสู่ฟากฟ้า\n\nฟ้า ดิน คน ไตรภาคีแห่งสรรพสิ่ง กระบวนการหลอมรวมเจตจำนงทั้งสามให้เป็นหนึ่งเดียว คือรากฐานแห่งเวทมนตร์ที่เบโอลกรินเป็นผู้คิดค้นขึ้น\n\n“กรี๊ดดดดด!!”\n\nจังหวะเดียวกับที่เธอกำลังวาดมโนภาพอาคม ก้อนหินขนาดมหึมาก้อนหนึ่งก็ร่วงดิ่งตรงลงมาทางศีรษะของเธอ\n\nเธอบิดตัวอย่างบ้าคลั่งเพื่อหลบหลีก แต่มันไร้ผล เธอกำลังอยู่กลางหน้าผา เธอกำลังร่วงหล่น\n\nไม่มีแม้แต่เวลาจะร่ายเวทลอยตัว เวทป้องกันไม่อาจต้านทานหินถล่มขนาดใหญ่เพียงนั้นได้!\n\nเธอกำลังจะตาย\n\nความหวาดกลัวอันรุนแรงบดบังทัศนวิสัยจนพร่ามัว มโนภาพที่เธออุตส่าห์พยายามก่อร่างขณะรวบรวมพลังเวทพลันแตกสลายกระเจิดกระเจิง\n\nเธอทำได้เพียงสะอื้นไห้ด้วยความสยดสยองขณะเฝ้ามองความตายที่พุ่งเข้ามาหา\n\nและในตอนนั้นเอง\n\n– โครม!!!\n\nคมขวานแหวกผ่านอากาศ เพียงการฟาดฟันครั้งเดียว ก้อนหินยักษ์ก็แตกกระจายเป็นเศษกรวดนับไม่ถ้วนปลิวว่อนไปทุกทิศทางอย่างไร้พิษสง\n\nเธอยังคงตัวสั่นเทาด้วยความหวาดกลัวที่ตกค้างอยู่ในร่าง ท่ามกลางสายฝนกรวดหินที่โปรยปรายลงมารอบตัว\n\nทันใดนั้น เสียงทุ้มต่ำและสงบเยือกเย็น—อันแสนจะขัดกับสถานการณ์นี้ จึงยิ่งแจ่มชัดขึ้นเป็นทวีคูณ—ก็ดังก้องเข้าสู่โสตประสาทของเธอ\n\n“ตั้งมโนภาพให้มั่น ถักทอเวทมนตร์ แล้วจงค้นหาพลังเวทในพื้นที่แห่งนี้”\n\n“แต่... แต่ฉันจะทำแบบนั้นได้ยังไง! ฉัน... ฉันน่ะ...!”\n\n“เอลเฟียรา”\n\n“ฮึก...?”\n\nฝ่ามืออันมั่นคงโอบกระชับรอบเอวของเธอไว้\n\nโอบรัดรอบเอวบอบบางปราดเปรียวที่กอดรัดได้ด้วยแขนเพียงข้างเดียว อย่างหนักแน่นและมั่นคง ราวกับจะขับไล่ความหวาดกลัวที่ทำให้ทั่วทั้งร่างของเธอสั่นสะท้านให้มลายหายไป\n\nโดยไม่ทันรู้ตัว เอลเฟียราก็สะอื้นไห้พลางเอนกายพิงร่างอันอบอุ่นนี้\n\nเสียงนั้นยังคงเอ่ยต่อไป เป็นสุ้มเสียงทุ้มต่ำ แหบพร่า ทว่าอ่อนโยน\n\n“โอบรับจินตนาการแล้วจงสร้างมันให้เป็นจริง”\n\n“คำพูด... นั้น...”\n\n“ลืมความคิดที่ว่าเป็นลูกสาวของเบโอลกรินไปซะ เธอสมบูรณ์พร้อมด้วยตัวของเธอเองแล้ว เอลเฟียรา จงมองดูตัวเอง และสร้างมโนภาพของเธอขึ้นบนผืนปฐพี”\n\n“คุณ... คุณ...”\n\n“เรื่องอื่นทั้งหมดไม่ใช่หน้าที่ของเธอ ทั้งความปลอดภัย ชีวิต และความกลัวของเธอ จงฝากทุกอย่างไว้ที่ฉัน นั่นคือหน้าที่ของฉัน เธอแค่ทำในสิ่งที่เธอทำได้ก็พอ”\n\nนั่นคือทั้งหมดที่ฉันคาดหวังจากเธอ\n\nส่วนที่เหลือทั้งหมดเป็นความรับผิดชอบของฉัน\n\nในทัศนวิสัยที่สั่นไหว มีเพียงดวงตาสีฟ้าที่ลุกโชนอย่างแรงกล้าคู่นั้นที่จับจ้องมองเธออย่างแน่วแน่\n\n“เช่นเดียวกับที่ฉันเชื่อมั่นในตัวเธอ เธอก็ควรเชื่อมั่นในตัวฉัน เหมือนที่เบโอลกรินเคยทำ ฉันไม่เคยทำหน้าที่ผิดพลาดเลยสักครั้ง แม้กระทั่งต่อหน้าพ่อของเธอ”\n\n“ช... ชื่อของคุณ... อย่างน้อยก็บอกชื่อหน่อยสิคะ”\n\nอย่างน่าประหลาด เอลเฟียรารู้สึกว่าแม้ในสถานการณ์เช่นนี้ เธอคงจะอุ่นใจขึ้นได้หากอย่างน้อยได้ยินชื่อของชายผู้นี้\n\nอีวานเบนสายตาไปอย่างเฉยเมย พลางฟาดเศษหินที่ร่วงลงมาอีกลูกให้กระเด็นพ้นทาง แล้วกระซิบแผ่วเบา\n\n“อีวาน”\n\n“...เป็นนามแฝงที่สิ้นคิดชะมัดเลยนะคะ”\n\n“ฉันรู้”\n\n“พวกมนุษย์นี่...”\n\nอีวานเป็นชื่อที่โหลที่สุดในคราซิลอฟ นับแต่ชาวนาจนถึงขุนนาง เป็นชื่อที่ดาษดื่นเสียจน—แม้กระทั่งในยุคนี้ที่ดูล้าสมัยไปแล้ว—ครอบครัวทาสติดที่ดินยังไม่คิดจะตั้งให้ลูกหลานเลยด้วยซ้ำ\n\nทว่าเพียงเท่านั้นก็เพียงพอแล้ว เอลเฟียราคลี่ยิ้มออกมาอย่างโล่งอก\n\nฝากฝังไว้แม้กระทั่งชีวิต เพียงแค่เชื่อใจ\n\nทั้งหมดที่ฉันต้องทำคือค้นหาเส้นสายของพลังเวทเพียงหนึ่งสายให้พบ\n\nมันไม่ใช่เรื่องยาก หากแม้แต่เรื่องแค่นี้ยังยาก ชื่อของเบโอลกริน—ไม่สิ ชื่อของเผ่าพันธุ์เอลฟ์—คงต้องร่ำไห้ด้วยความอัปยศ\n\nเอลเฟียรา บุปผาแห่งเหล่าภูตพราย หากได้รับนามเช่นนั้นมาจากบุรุษผู้ยิ่งใหญ่ที่สุดในคาลีออน เธอก็ต้องพิสูจน์ให้เห็นว่าคู่ควร\n\nเธอเริ่มถักทอพลังเวท\n\nตั้งมโนภาพให้มั่น ก่อสร้างบันไดสู่สรวงสวรรค์\n\nฝ่าเท้าย่ำบนผืนดิน เจตจำนงทะยานขึ้น มุ่งสู่ฟากฟ้าอันยิ่งใหญ่\n\nต้นกำเนิดแห่งความลี้ลับของเวทมนตร์คือท้องฟ้าเสมอมา เสาะแสวงหาภูมิปัญญาโบราณที่สถิตอยู่เบื้องพ้นฟากฟ้านั้น\n\nถักทอพลังเวทเพื่อมองเห็นกฎเกณฑ์แห่งโลก\n\nปั้นแต่งจินตนาการ ความนึกคิดอันเลือนราง และมโนภาพของปุถุชนที่ปลายนิ้ว ก่อนขึ้นรูปให้กลายเป็นความจริง\n\n“ฉัน... มองเห็นแล้ว!!”\n\n“ตรงไหน?”\n\n“ข้างหน้า ตรงไปข้างหน้าเลย...!”\n\n“ข้างหน้าตรงไหน”\n\n“ข้างหน้าทั้งหมดเลย!! อยู่ตรงหน้าฉันนี่เอง!!”\n\n– วูบบบบ....\n\nกระแสลมกรรโชกแรงสัมผัสได้แม้ในยามที่กำลังร่วงหล่น เกลียวคลื่นมหึมาและสายลมแห่งภาพมายาที่พลังเวทเผยให้เห็นพัดส่ายปั่นป่วนความคิดของเธอจนยุ่งเหยิง\n\nทำไมเธอถึงไม่ทันสังเกตเห็นสิ่งนี้มาก่อน? ไม่สิ ไม่ใช่แบบนั้น\n\nนี่คือเวทมนตร์ประเภทที่จะเผยตัวตนให้เห็นเฉพาะแก่ผู้ที่สามารถรับรู้ถึงมันได้เท่านั้น\n\n“คุณพระช่วย... ขอบเขตระดับนี้... ความวิจิตรซับซ้อนระดับนี้...!!”\n\nม่านพลังเวทสีฟ้าครามผืนหนึ่งกำลังกระเพื่อมพลิ้วไหวอยู่เบื้องหน้าเธอ\n\nเมื่อเผชิญกับภาพอันน่าตื่นตะลึงซึ่งตรงกันข้ามกับหุบเหวมืดมิดโดยสิ้นเชิง เอลเฟียราถึงกับจ้องมองอย่างเหม่อลอย ลืมแม้กระทั่งการกะพริบตา\n\n“ยอดเยี่ยม”\n\nเสียงของอีวานดังก้องสั้นๆ อยู่เหนือศีรษะของเธอ\n\nไม่ช้า อีวานก็ดีดตัวพุ่งทะยานแหวกผ่านหมู่ก้อนหินที่แตกกระจาย\n\nเอลเฟียราที่ถูกโอบอุ้มอยู่ในอ้อมแขนของเขากรีดร้องเสียงแหลมออกมาอย่างหวาดหวั่นต่อพลังเวทที่กำลังพุ่งเข้าประชิดตัว\n\n***\n\n**💬 ความคิดเห็นนักอ่าน:**\n- **@สายกระโดดเหว** (1 วันที่แล้ว • 👍 162): เปิดฉากมาคือโดดลงเหวมืดพร้อมโอบเอวเอลเฟียราฝ่าก้อนหินถล่มลงไปแบบไม่ถามความสมัครใจเลย ลุงนี่สายลุยของแท้ 555\n- **@ศิษย์อาจารย์เอลฟ์** (1 วันที่แล้ว • 👍 141): ชอบจังหวะที่อีวานพูดปลุกสติให้เอลเฟียราก้าวข้ามเงาของเบโอลกริน จนเธอใช้หลัก \"ฟ้า ดิน คน\" มองเห็นม่านพลังสีฟ้าครามได้ อ่านแล้วขนลุกเลย\n- ↳ **@เด็กคณะเวท** (22 ชั่วโมงที่แล้ว • 👍 48): ปกติเห็นลุงกวนอย่างเดียว พอจริงจังสวมบทผู้มากประสบการณ์ทีไรเท่ตลอด (ถึงประโยคต่อมาจะโดดเข้าม่านพลังจนน้องกรี๊ดลั่นก็เถอะ 555)\n- **@DarkDungeon_Fan** (20 ชั่วโมงที่แล้ว • 👍 55): ม่านพลังสีฟ้าครามขนาดมหึมาใต้ดิน       "title": "บทที่ 65",
      "content": "“อีวาน การที่ราชองครักษ์ยืนหลับสัปหงกได้แบบนี้ แสดงว่าบ้านเมืองคงเจริญขึ้นมากแล้วสินะ”\n\n“อึก...!”\n\nอีวานสะดุ้งเงยหน้าขึ้นด้วยความตกใจเมื่อได้ยินเสียงทุ้มต่ำกระซิบอยู่ข้างหู\n\nทัศนวิสัยที่พร่ามัวค่อยๆ กลับคืนมาอย่างช้าๆ เบื้องหน้าคือยามบ่ายอันเจิดจ้าภายในค่ายทหารที่คุ้นเคย\n\nเขากวาดสายตามองไปรอบๆ อย่างรวดเร็ว พร้อมตั้งท่าเตรียมพร้อมตามแบบฉบับสายลับที่ผ่านการฝึกฝนมาอย่างดีเมื่อถูกโยนมาอยู่ในสถานที่ที่ไม่คุ้นเคย\n\nอันดับแรก เขาต้องประเมินภูมิประเทศโดยรอบก่อน\n\n“อะไรกัน...?”\n\nหลังจากกวาดตามองไปทั่วโรงนอนค่ายทหารอย่างรวดเร็ว อีวานก็พึมพำออกมาอย่างเหม่อลอยจนพูดไม่ออก\n\nธงสีแดงที่มีตราประจำตระกูลรูปหมีคำราม\n\nโรงนอนอันกว้างขวาง โต๊ะไม้ขนาดมหึมาที่มีแผนที่ยุทธวิธีกางแผ่อยู่ด้านบน\n\nโต๊ะทำงาน และเบื้องหลังโต๊ะนั้น มีเงาร่างสูงใหญ่กำยำนั่งอยู่\n\nหัวไหล่บึกบึน ท่อนแขนหนาเตอะ และดวงตาสีฟ้าคมกริบดุจเจาะทะลุ\n\n“อ๊ะ....”\n\n“อีวาน? เจ้าไม่สบายหรือ?”\n\n“อ๊า....”\n\nบุรุษผู้นั้นวางช้อนส้อมที่กระทบกันดังกรุ๊งกริ๊งลง แล้วค่อยๆ ลุกขึ้นยืน\n\nเงาร่างขนาดใหญ่ทอดยาวพาดผ่านทั่วโรงนอน บดบังแสงสว่างจนสลัว อีวานทรุดเข่าข้างหนึ่งลงบนขาที่อ่อนแรงและก้มศีรษะลงต่ำ\n\n“กระหม่อม... ขอถวายบังคมฝ่าบาทพ่ะย่ะค่ะ”\n\n“...อืม เจ้าเห็นข้าแล้วสินะ แล้วนี่เจ้ากำลังทำอะไรอยู่กันแน่?”\n\n“กระหม่อม...”\n\nอีวานเงยหน้าขึ้นมองด้วยสายตาสับสน\n\nแววตาอันอบอุ่นที่เปี่ยมด้วยความห่วงใย และฝ่ามือใหญ่โตที่ตบลงบนไหล่ของเขาก่อนจะผละออกไป\n\n‘ผู้ยิ่งใหญ่’ ‘จักรพรรดิสายฟ้า’ ‘หมีแห่งคราซิลอฟ’ ‘ผู้พิชิต’ ‘องค์มหาราชา’.... บุรุษผู้ถูกขนานนามด้วยฉายานับไม่ถ้วนจากทั้งศัตรูและพันธมิตร\n\nบัดนี้ พระองค์กำลังก้มลงมองเขาอยู่ ด้วยสายตาแบบเดียวกับในวันวาน ด้วยพระพักตร์เดิมไม่ผิดเพี้ยน\n\nนี่ต้องเป็นความฝันแน่ๆ\n\nอีวานรีบรวบรวมสติกลับมาอย่างรวดเร็ว\n\nหากนี่คือความฝันในห้วงเวลานั้น เขาจะทำพลาดไม่ได้เป็นอันขาด ทันทีที่เกิดความคลาดเคลื่อนระหว่างความฝันกับความทรงจำ เขาอาจจะตื่นขึ้นมาก็ได้\n\nคิดสิ สถานการณ์นี้ต้องเป็นความทรงจำจากอดีตของเขา และไม่ใช่แค่ความทรงจำธรรมดา แต่เป็นความทรงจำอันสำคัญยิ่ง\n\nเขาจะตื่นขึ้นมาตอนนี้ไม่ได้ ยังก่อน\n\nทันใดนั้น อีวานก็สังเกตเห็นจานอาหารบนโต๊ะทำงาน อ้อ ช่วงเวลานั้นเอง\n\nช่วงเวลาไม่นานนักหลังจากที่เขาเริ่มเข้ามาทำหน้าที่เป็นราชองครักษ์ขององค์มหาราชา เขาจำได้แล้ว วันนั้นคือวันที่เขาได้เห็นสิ่งที่เรียกว่าพระกระยาหารมื้อใหญ่ของกษัตริย์เป็นครั้งแรก\n\nคำถามที่เขาเอ่ยออกไปในตอนนั้นคือ...\n\n“กระหม่อมคิดว่าฝ่าบาทจะทรงเสวยพระกระยาหารที่ดีกว่านี้เสียอีกพ่ะย่ะค่ะ”\n\n“หืม? ฮ่าๆ! เจ้าหมายถึงเจ้านี่น่ะรึ? มันแย่ขนาดนั้นเชียวหรือ?”\n\n“นี่มันเสบียงของพลทหารเกณฑ์ไม่ใช่หรือพ่ะย่ะค่ะ?”\n\n“ถูกต้องแล้ว”\n\nองค์มหาราชาแสยะยิ้มพลางใช้ส้อมบดมันฝรั่ง พระองค์ปาดมันฝรั่งลงบนบิสกิตแข็งๆ แห้งๆ จุ่มลงในน้ำ เคี้ยวจนละเอียดแล้วจึงตรัสต่อ\n\n“นี่คือการเสแสร้งของข้าเอง”\n\n“การเสแสร้ง... หรือพ่ะย่ะค่ะ?”\n\n“พวกไพร่ฟ้าประชาชนคงพากันสรรเสริญข้าด้วยความปีติยินดีหากได้ยินว่าข้ากินอาหารแบบนี้ โอ้ ช่างเป็นพระราชาที่สมถะเสียนี่กระไร! ฮ่าๆ ผิดถนัดเลย”\n\nองค์มหาราชาทรงดื่มน้ำอึกใหญ่แล้ววางแก้วลง\n\n“เจ้ารู้หรือไม่ว่าพวกขุนนางและเชื้อพระวงศ์ผู้สูงศักดิ์ของประเทศนี้ ต้องผลาญงบประมาณไปเท่าไรเพื่อกินอาหารราคาแพงและถ่ายของเสียราคาแพงออกมา? เคยมีช่วงหนึ่งที่ค่าอาหารของขุนนางเพียงสิบคนเทียบเท่ากับงบเสบียงของทหารทั้งกองพลเลยทีเดียว”\n\n“...”\n\n“หากไอ้พวกสารเลวนั่นกินให้น้อยลง อัตราการรอดชีวิตของทหารพวกเราจะสูงขึ้นอีกสักเท่าไร? เราคงจัดหาเกราะที่แข็งแกร่งกว่านี้ให้ได้ และคงแจกกระสุนเพิ่มให้ได้อีกคนละกำมือ เอาล่ะ อีวาน เจ้าเข้าใจหรือไม่ว่าต้องทำอย่างไรถึงจะสั่งให้ไอ้พวกขุนนางเวรนั่นกินให้น้อยลงได้?”\n\nองค์มหาราชาทรงยักพระอังสาแล้วเคาะจานเปล่าเบาๆ\n\n“ข้าต้องกินให้น้อยลงเป็นตัวอย่างก่อน หากมีใครบังอาจกล้ากินของที่เลอค่ายิ่งกว่ากษัตริย์ของประเทศนี้ล่ะก็ หึ ข้าจะยอมรับในความกล้าหาญนั้นด้วยตัวเองด้วยการส่งมันไปอยู่แนวหน้า แล้วเจ้าคิดอย่างไรล่ะ? การเสแสร้งของข้า?”\n\n“กระหม่อมไม่เข้าใจเลยว่าเหตุใดเรื่องนั้นถึงเรียกว่าการเสแสร้งพ่ะย่ะค่ะ...”\n\n“ก็เพราะข้าเองก็ไม่ได้อยากกินไอ้ของห่วยๆ พรรค์นี้เหมือนกันน่ะสิ”\n\nองค์มหาราชาทรงพระสรวลลั่นอย่างเบิกบานพลางตบไหล่อีวาน\n\n“เช่นนั้นจะไม่เรียกว่าการเสแสร้งได้อย่างไร? ข้าไม่ได้ทำเพราะอยากทำจริงๆ เสียหน่อย แต่แสร้งเล่นละครเพื่อข่มขู่พวกขุนนางและประหยัดเงินไว้สักแดงสองแดง แบบนี้จะไม่เรียกว่าเสแสร้งได้ยังไงกัน? หืม? มานี่สิ อีวาน บัดนี้ข้าจะแสดงความโลภอันน่าสะพรึงกลัวที่มีเพียงกษัตริย์เท่านั้นที่จะสำแดงออกมาได้ให้เจ้าดู”\n\nองค์มหาราชาทรงพระสรวลอย่างขี้เล่นและก้าวฉับๆ ไปที่โต๊ะ ก่อนจะดึงลิ้นชักด้านล่างออกมา\n\nสิ่งที่ปรากฏออกมาคือพวงองุ่นกึ่งแห้ง แฮมรมควันก้อนโตที่มีไขมันจับตัวเป็นก้อน และนมสดหนึ่งขวด\n\n“น่าหวาดหวั่นใช่ไหมล่ะ? นี่แหละคือผลลัพธ์อันเลวร้ายจากความโลภและความฟุ่มเฟือยของกษัตริย์”\n\n“นั่นมัน... เอ่อ”\n\n“อะไร? เจ้ากล้าคัดค้านคำพูดของข้าเรอะ? ข้าบังคับให้พวกขุนนางกินอาหารแห้งๆ เพื่อประหยัดเงิน แต่ลับหลังกลับแอบมากินของเลิศรสพรรค์นี้อยู่คนเดียว!”\n\n“กระหม่อม... ก็คิดเช่นนั้นพ่ะย่ะค่ะ”\n\n“เหอะ เจ้ายังเด็กเกินกว่าจะเข้าใจ รู้หรือไม่ว่าต้องใช้ภาระงานธุรการมากมายขนาดไหนกว่าจะขนส่งนมสดมาถึงแนวหน้าแห่งนี้ได้โดยไม่เสียก่อน? อ้อ จริงสิ เจ้าอายุเท่าไรแล้วนะ?”\n\n“สิบแปดพ่ะย่ะค่ะ ฝ่าบาท”\n\nองค์มหาราชาทรงขมวดคิ้วพลางทอดพระเนตรดูไหล่และท่อนแขนของอีวาน\n\n“แต่เกิดมาเป็นลูกผู้ชายทั้งที ทำไมถึงผอมแห้งแรงน้อยนักเล่า”\n\nอีวานเป็นคนรู้กาลเทศะ จึงไม่ได้บ่นอุบอิบต่อหน้าพระพักตร์ ถึงอย่างไร เขาก็มีส่วนสูงและรูปร่างเกินกว่าค่าเฉลี่ยของโลกยุคก่อนสมัยใหม่อันล้าหลังใบนี้แล้ว\n\nเพียงแต่บุรุษตรงหน้าเขานั้นร่างใหญ่โตมหึมาเกินไปต่างหาก\n\nพระราชาทรงพระสรวลเบาๆ แล้วกวักพระหัตถ์เรียก\n\n“เข้ามารับไปสิ”\n\n“พ่ะย่ะค่ะ?”\n\n“ข้าบอกว่าเข้ามารับไป ข้าต้องเติมการเสแสร้งลงไปอีกสักข้อเสียหน่อย ข้าจะรักษาพระเกียรติยศเอาไว้ได้อย่างไรหากราชองครักษ์ที่คอยปกป้องข้าดูบอบบางปานนี้? จงกินแล้วเติบโตขึ้นเสีย ‘เจ้าตัวเล็ก’ อีวาน”\n\nองค์มหาราชาทรงแย้มสรวลอย่างพึงพอใจแล้วเลื่อนจานอาหารมาตรงหน้า\n\nอีวานเป็นคนมีความอดทนสูง ทว่าเขาก็ไม่อาจต้านทานสิ่งยั่วยวนอย่างเนื้อติดมันและนมสดได้นานนัก\n\nอย่างไรเสีย แม้กระทั่งตอนที่เขาเติบโตมาในฐานะลูกชาวนา นมสดก็เป็นของฟุ่มเฟือยที่เขาไม่กล้าแม้แต่จะฝันถึงรสชาติ\n\nไม่มีวิธีเก็บรักษาความสดใหม่ และมันบูดเสียได้ในพริบตา หลังจากส่งส่วยแล้ว นมที่เหลือทั้งหมดต้องนำไปแปรรูปเป็นชีสหรือเนย ในโลกอันป่าเถื่อนใบนี้ แม้แต่การถนอมอาหารก็ยังเป็นเรื่องยากลำบาก\n\nกว่าจะรู้ตัวอีกที อีวานก็กำลังซัดแฮมและดื่มนมสดเข้าไปอย่างรีบร้อนเสียแล้ว\n\nองค์มหาราชาทรงทอดพระเนตรภาพนั้นอย่างเงียบงันอยู่ครู่หนึ่ง ก่อนจะทรงถอนพระทัย\n\n“บาปของข้าช่างหนักหนานัก”\n\n“พ่ะย่ะค่ะ? โอ้ ขออภัยด้วยพ่ะย่ะค่ะ ฝ่าบาท”\n\n“พอเถอะ จะขออภัยทำไมกัน? ในเมื่อข้าเอ่ยถึงบาปของตัวข้าเอง เจ้ามีเรื่องอะไรให้ต้องรู้สึกผิดเล่า?”\n\nองค์มหาราชาตรัสพลางทรงเก็บจานเปล่าด้วยพระองค์เอง\n\n“โลกที่ชายหนุ่มวัยเดียวกับเจ้าต้องคลั่งไคล้เนื้อราคาถูกเพียงชิ้นเดียวเช่นนี้... มันไม่ถูกต้องเลย ตอนที่ข้าขึ้นครองราชย์ ประเทศนี้ไม่ได้เป็นแบบนี้ สัปดาห์ละครั้ง กลิ่นหอมของขนมปังอบและเนื้อย่างเคยอบอวลไปทั่วท้องถนนของพริตเชนคายา”\n\nในที่สุดองค์มหาราชาก็ทรงส่ายพระพักตร์\n\n“ข้าไม่รู้เหมือนกันว่าเหตุใดถึงมาพูดเรื่องนี้กับเด็กที่อายุยังไม่ถึงครึ่งหนึ่งของข้าด้วยซ้ำ พอแค่นี้แหละ อย่าเก็บไปใส่ใจเลย อีวาน นับแต่วันนี้เป็นต้นไป เจ้าจงมาร่วมเสวยอาหารเป็นเพื่อนข้าทุกมื้อ”\n\n“รับด้วยเกล้าพ่ะย่ะค่ะ ฝ่าบาท”\n\n“อย่างน้อยข้าก็ยังเลี้ยงดูเจ้าเด็กน้อยคนหนึ่งได้ จงดูเอาไว้เถิดว่าพระราชอำนาจของราชาผู้นี้ตั้งตระหง่านสูงส่งเพียงใด คงไม่เป็นปัญหาหรอกหากจะมีพสกนิกรผู้น่าสงสารมาร่วมเล่นละครเสแสร้งเป็นเพื่อนข้าเพิ่มอีกสักคน”\n\nองค์มหาราชาทรงแย้มสรวลขื่นๆ แล้วโบกพระหัตถ์เป็นสัญญาณว่าเขาออกไปได้แล้ว\n\nอีวานค้อมศีรษะคำนับอย่างนอบน้อมแล้วค่อยๆ ถอยหลังออกจากโรงนอนไป\n\nวันนั้นคือวันหนึ่งในชีวิตทหารปีที่หก สิบหกปีหลังจากที่เขาข้ามมิติมา\n\nภายนอกโรงนอน ค่ายทหารเต็มไปด้วยเหล่าทหารที่เดินคอตกด้วยความสิ้นหวัง ใบหน้าของทุกคนฉายชัดถึงร่องรอยแห่งความปราชัย\n\nคราซิลอฟกำลังล่มสลาย\n\nไม่สิ มวลมนุษยชาติกำลังพินาศย่อยยับ\n\nผู้กล้าจะปรากฏตัวขึ้นก็ต่อเมื่อผ่านพ้นจุดนี้ไปอีกสองปีข้างหน้าเท่านั้น\n\nดังนั้น บางครั้งอีวานจึงอดคิดไม่ได้ว่า\n\nหากผู้กล้าค้นพบพวกเราเร็วกว่านี้สักหน่อย องค์มหาราชาก็คงจะยังมีพระชนม์ชีพอยู่\n\nพระองค์คงจะมีชีวิตอยู่รอดจนได้ทอดพระเนตรควันไฟที่ลอยกรุ่นขึ้นจากเตาย่างเนื้อในพริตเชนคายาอีกครั้ง และคงได้ทรงแย้มสรวลออกมา\n\nหากเป็นเช่นนั้นได้ บางทีอีวานอาจจะชอบโลกใบนี้มากขึ้นอีกสักนิดก็ได้\n\nทุกสิ่งทุกอย่างที่เขาเคยเคารพ เทิดทูน หรือชื่นชม ต่างพินาศสูญสิ้นไปตลอดสงครามสิบแปดปีนั้นจนหมดสิ้น\n\nเขาอยากกินแกงกิมจิจังเลย\n\n“มีแค่นี้เองหรือ?”\n\nอีวานยืนอยู่กลางค่ายทหาร พลางแหงนหน้ามองขึ้นไปบนท้องฟ้า\n\n“ถ้าคิดจะใช้ความเสียดายหรือความอาลัยอาวรณ์มาล่อลวง แค่นี้ยังไม่พอหรอก มีแค่นี้เองหรือ?”\n\nวันเวลาที่เขายังเยาว์วัยพอจะหลงใหลไปกับความฝันได้มันผ่านพ้นไปนานแล้ว อีวานครุ่นคิดพลางจ้องมองท้องฟ้า\n\nเขาไม่เข้าใจว่าเหตุใดโบราณสถานที่ทรงพลังพอจะทำลายโบราณวัตถุขุดเจาะของคนแคระลงได้ในพริบตา จึงคิดจะลวงเขาด้วยความฝันเช่นนี้\n\nหากมันเชื่อว่าจะสยบเขาได้ด้วยสิ่งล่อใจระดับนี้ นั่นไม่ดูโง่เขลาเกินไปหน่อยหรือ?\n\nอีวานล้วงมือเข้าไปในกระเป๋า อาวุธสำคัญที่เขาพกติดตัวไว้เสมอยังคงอยู่ในกำมือ\n\nเมื่อคิดได้ดังนั้นเขาก็ลงมือทันที เขาชักมีดสั้นออกมา แทงลงบนท่อนแขนของตนเอง แล้วเทโพชั่นรักษาบาดแผลราดลงไป\n\nพร้อมกับความเจ็บปวดแสบซ่าราวกับเนื้อไหม้...\n\n– เพล้ง!!\n\nความฝันพลันแตกสลายลง\n\n***\n\nอีวานเรียกสติกลับคืนมาแล้วก้าวเท้าไปข้างหน้าหนึ่งก้าว\n\nภาพสุดท้ายที่เขาเห็นคือตอนที่กระโจนทะลุผ่านกระแสพลังเวทที่หมุนวนอยู่ตรงริมหน้าผา\n\nบัดนี้ เขาเชื่อว่าในที่สุดตนก็เดินทางมาถึงโบราณสถานแห่งนั้นแล้ว\n\n“ที่นี่คือ”\n\nทัศนวิสัยที่พร่ามัวกลับคืนสู่ความแจ่มชัดอย่างรวดเร็ว และประสาทสัมผัสที่ขาดหายไปก็ทยอยกลับคืนสู่ร่างกายทีละส่วน\n\nอีวานขยับไหล่คลายความตึงเล็กน้อยแล้วกวาดตามองไปรอบๆ ระเบียงทางเดินอันสะอาดสะอ้าน เสาหินขนาดมหึมา ภาพนูนต่ำที่สลักเสลาจากหินอ่อน เพดานสูงใหญ่...\n\nโถงทางเดินอันโอ่อ่าที่เรียงรายไปด้วยรูปปั้นอันไม่อาจเข้าใจความหมาย\n\n“วิหารงั้นหรือ...?”\n\nอีวานลุกขึ้นยืนอย่างระมัดระวังและขยับตัว พร้อมกับเสียงสายลมที่พัดมาจากระยะไกล เขาได้ยินเสียงลมหายใจแผ่วเบาดังมาจากจุดที่อยู่ใกล้กว่านั้น\n\nเมื่อเดินเข้าไปตามทิศทางของเสียง เขาก็พบเอลเฟียรานอนเหยียดกายเรียบร้อยอยู่บนพื้นโดยหลับตาพริ้ม\n\n“ตื่นได้แล้ว”\n\nอีวานตบแก้มของเอลเฟียราเบาๆ สิ้นเสียงดังแปะ เอลเฟียราก็สะดุ้งตื่นและลุกพรวดขึ้นมานั่ง\n\n“อิ๊ย?!! จู่ๆ ทำบ้าอะไรของคุณเนี่ย...!”\n\n“ชู่ว”\n\nเงียบไว้ก่อน เพราะพวกเรายังไม่รู้ว่าที่นี่มีอะไรอยู่บ้าง\n\nเมื่อเห็นสัญญาณมือของอีวาน เอลเฟียราก็หุบปากแล้วมองไปรอบๆ ก่อนจะบ่นอุบอิบขึ้นมาอย่างกะทันหัน\n\n“ชิ... กำลังฝันดีสุดๆ อยู่เลยเชียว...”\n\n“ก็คงจะเป็นอย่างนั้น”\n\n“พวกมนุษย์นี่มัน... ทั้งโง่ ทั้งทื่อ แถมยังไร้มารยาทอีกต่างหาก ไปเรียนนิสัยเสียๆ อย่างการปลุกคนอื่นด้วยวิธีนี้มาจากไหนกัน...”\n\n“ยังไม่ตื่นเต็มตาอีกหรือ?”\n\nอีวานมองดูเอลเฟียราที่กำลังบ่นพึมพำพลางยกมือขึ้น หากเธอยังไม่ตื่นดีจากความฝัน เขาก็ยินดีจะปลุกเธออีกรอบ\n\nเอลเฟียราสะดุ้งโหยง รีบยกมือปิดแก้มตัวเองแล้วส่ายหน้าพัลวัน\n\n“ต้องเริ่มตีความภาษาโบราณแล้ว”\n\n“ตรงไหนคะ?”\n\n“ทั้งหมดนี่เลย”\n\nอีวานพยักหน้าไปทางภาพสลักนูนต่ำที่ปกคลุมอยู่ทั่วทั้งเพดานและเสาหิน\n\nเอลเฟียราเงยหน้ามองอย่างเหม่อลอย ก่อนจะค่อยๆ อ้าปากแล้วหัวเราะออกมาอย่างจนใจ\n\n“ทั้งหมดนี่เลยหรือคะ...?”\n\n“นั่นไม่ใช่เหตุผลที่พวกเรามาหรอกหรือ?”\n\n“ฉันเป็นสายใช้ความคิดมากกว่า เลยไม่ค่อยถนัดงานใช้แรงงานเท่าไรน่ะค่ะ”\n\n“แต่อ่านออกใช่ไหม?”\n\n“คุณเห็นฉันเป็นใครกันคะ...! แน่นอนว่าอ่านออกสิ ขอดูหน่อยนะ อืม... อืม... เอ๊ะ?”\n\nเอลเฟียราเดินตรงเข้าไปที่เสาหินต้นที่อยู่ใกล้ที่สุดทันที เธอขมวดคิ้วอยู่ครู่หนึ่งก่อนจะเอ่ยขึ้น\n\n“ไหนคุณบอกว่าโบราณวัตถุพวกนี้อายุ 1,500 ปีไม่ใช่หรือคะ?”\n\n“ใช่”\n\n“ถ้าเป็นการตีความระดับนี้ คุณน่าจะเรียกนักบวชมาแทนที่จะเรียกจอมเวทนะคะ”\n\nเอลเฟียราถอยหลังออกมาด้วยสีหน้าประหลาดใจ\n\n“นักบวช?”\n\n“ค่ะ นี่คือภาษาเดเลนโบราณ... ภาษาที่ใช้ในพระคัมภีร์ ถึงจะเป็นภาษาเก่าแก่ แต่เหล่านักบวชก็ต้องเรียนกันในการฝึกอบรมขั้นพื้นฐานอยู่แล้วค่ะ”\n\n“แล้วเธอทำไม่ได้หรือ?”\n\n“ก็ทำได้สิคะ คุณเห็นฉันเป็นตัวอะไรกันแน่คะเนี่ย เจ้ามนุษย์ธรรมดา”\n\n“...”\n\nเอลเฟียรากวาดสายตาอ่านภาพสลักนูนต่ำพลางผึ่งหูฟังเสียงรอบข้าง\n\n“นี่มัน... อนุสาวรีย์แห่งชัยชนะหรือคะ?”\n\n“อนุสาวรีย์แห่งชัยชนะ”\n\n“ค่ะ เต็มไปด้วยบทสรรเสริญแด่เทพแห่งแสงทั้งนั้นเลย อนุสาวรีย์แห่งชัยชนะ... พวกเขาไปต่อสู้กับตัวอะไรมาถึงได้สร้างโบราณสถานที่น่าเกรงขามขนาดนี้ขึ้นมาได้กันนะ...”\n\n“อืม”\n\nใน ‘สูตรสำเร็จ’ ของแนวสถาบันการศึกษา มีเรื่องทำนองว่า ‘โบราณสถานที่มีปีศาจบรรพกาลถูกผนึกไว้’ อยู่ด้วยหรือเปล่านะ\n\nหวังว่าคงจะไม่มีหรอกนะ\n\nอีวานตรวจเช็กอาวุธของตนเองแล้วเดาะลิ้นเบาๆ\n\n***\n\n**💬 ความคิดเห็นนักอ่าน:**\n- **@สายแทงค์โพชั่น** (1 วันที่แล้ว • 👍 189): เจอภาพลวงตาเมื่อ 14 ปีก่อนเข้าไป... แทนที่จะพยายามพูดปลุกใจแบบพระเอกทั่วไป ลุงแกหยิบมีดกรีดแขนตัวเองแล้วเทโพชั่นราดตามสูตรเดิมเป๊ะ! \"สูตรสำเร็จแก้ฝันลวงด้วยความเจ็บปวด\" 5555\n- ↳ **@พยาบาลสนามคราซิลอฟ** (20 ชั่วโมงที่แล้ว • 👍 62): เอนริเก้หรือมหาราชาในภาพลวงตาก็เอาลุงไม่อยู่ มีดกับโพชั่นคือคำตอบของทุกสิ่ง!\n- **@อดีตจักรพรรดิสายฟ้า** (21 ชั่วโมงที่แล้ว • 👍 137): พอได้เห็นอดีตสมัยรับใช้มหาราชา (หมีแห่งคราซิลอฟ) แล้วรู้เลยว่าช่วงชีวิตทหารของอีวานผ่านสงครามมาโหดแค่ไหน\n- **@คนจดสูตรนิยาย** (19 ชั่วโมงที่แล้ว • 👍 94): ขำประโยคท้ายตอนมาก: \"ใน ‘สูตรสำเร็จ’ ของแนวสถาบันการศึกษา มีเรื่องทำนองว่า ‘โบราณสถานที่มีปีศาจบรรพกาลถูกผนึกไว้’ อยู่ด้วยหรือเปล่านะ... หวังว่าคงจะไม่มีหรอกนะ\" — ลุงเพิ่งปักธงมรณะใส่ตัวเองไปแล้ว 1 ดอกครับ!!"

      "title": "บทที่ 66",
      "content": "ครู่หนึ่ง เอลเฟียราเดินวนไปรอบๆ ภาพสลักนูนต่ำและเสาหินอย่างขะมักเขม้นพลางจดบันทึกไม่หยุด ไม่นานเธอก็เดินกลับมาพร้อมสีหน้าอันเปี่ยมด้วยความภาคภูมิใจ\n\n“ฉันตรวจสอบทุกส่วนที่อ่านออกเรียบร้อยแล้วค่ะ! นี่คืออนุสาวรีย์แห่งชัยชนะจริงๆ ด้วย!”\n\n“ใครเป็นคนสร้าง แล้วสร้างขึ้นเพื่อรำลึกถึงสงครามครั้งไหน?”\n\n“เอ่อ... อืม ส่วนนั้นเขียนไว้ค่อนข้างกำกวมน่ะค่ะ”\n\nเมื่ออีวานหรี่ตามอง เอลเฟียราก็ขมวดคิ้วแล้วตะโกนกลับทันควัน\n\n“อย่ามองฉันแบบนั้นสิคะ! ไม่ว่าจะยุคโบราณหรือยุคปัจจุบัน พวกคนของศาสนจักรก็ชอบฉาบทุกอย่างไว้ด้วยคำอุปมาอุปไมยราวกับกำลังทายปริศนาธรรมอยู่ตลอดเวลา! ถ้าไม่ได้เรียนเอกคัมภีร์ศาสนามาโดยตรง การจะเข้าใจความหมายได้ทั้งหมดย่อมไม่ใช่เรื่องปกติอยู่แล้วค่ะ!”\n\nรู้อย่างนี้ตั้งแต่แรกน่าจะพานักบวชมาด้วยเสียก็ดี\n\nเอลเฟียราเบ้ปากแล้วบ่นพึมพำ\n\n“อธิบายแค่ส่วนที่เธอตีความออกก็พอ”\n\n“ดูจากตัวภาษาอย่างเดียวก็รู้ได้ทันทีเลยค่ะว่านี่คือร่องรอยของศาสนจักรยุคโบราณ ไม่ใช่ยุคเทพนิยาย แต่เป็นยุคโบราณ... สมัยจักรวรรดิเดเลนตะวันออก ดูเหมือนจะมีอายุราว 2,000 ปีแล้วค่ะ”\n\n“ต่อให้ยุคนั้นสงครามจะเกิดขึ้นเป็นเรื่องปกติ แต่เหตุใดศาสนจักรจึงต้องสร้างอนุสาวรีย์แห่งชัยชนะขึ้นมาด้วย?”\n\n“ในสมัยนั้นมีเหตุผลอยู่มากมายเลยล่ะค่ะ นั่นเป็นยุคที่ศาสนจักรบังคับใช้โทษลบประวัติศาสตร์อย่างจริงจัง โบราณสถานแห่งนี้ก็คงเป็นหลักฐานของเรื่องนั้น จากเท่าที่ฉันอ่านออก ดูเหมือนเหล่านักรบครูเสดในยุคนั้นจะทำสงครามต่อสู้กับ ‘ความสุข’ ค่ะ”\n\n“...ความสุข?”\n\nนั่นฟังดูเป็นแนวคิดที่ประหลาดพิลึกสำหรับพวกนักบวชที่จะยกทัพไปทำสงครามด้วย\n\nเมื่ออีวานขมวดคิ้ว เอลเฟียราก็ยักไหล่\n\n“ตามข้อความบนเสาต้นที่ห้า ‘กล่าวกันว่าความชั่วร้ายอันดำมืดที่สุด คือผู้ที่กระซิบถ้อยคำแห่งความสุขสำราญเข้าข้างหูของเหล่าผู้ศรัทธา ความปีติสุขที่แท้จริงในโลกนี้ย่อมบังเกิดจากอ้อมกอดขององค์พระผู้เป็นเจ้าเท่านั้น และหามีพระวรสารใดนอกเหนือไปจากสันติสุขแห่งองค์ราชันสวรรค์ไม่’ อืม... แล้วถัดจากนั้นก็เป็นชุดบทพระคัมภีร์ที่เดาทางได้ไม่ยาก สรุปก็คือ ที่นี่เคยเป็นที่ตั้งของลัทธินอกรีตสักกลุ่มหนึ่งค่ะ”\n\n“...ลัทธินอกรีต”\n\n“พวกนอกรีต ใช่ค่ะ ทำนองนั้นเลย อิทธิพลของพวกมันคงต้องยิ่งใหญ่มากแน่ๆ เลยนะคะ? เพราะตัวรูปแบบเสาหินพวกนี้เองก็ไม่ใช่สถาปัตยกรรมของศาสนจักรค่ะ”\n\nอีวานกวาดสายตามองไปรอบๆ ด้วยมุมมองใหม่ ที่แท้สถานที่แห่งนี้เคยเป็นศูนย์บัญชาการของลัทธินอกรีตบางกลุ่มมาก่อน\n\nและหลังจากปราบปรามพวกมันลงได้ ทางศาสนจักรก็สลักภาพนูนต่ำชุดใหม่ลงบนสถานที่แห่งนี้โดยตรงเพื่อใช้เป็นอนุสาวรีย์แห่งชัยชนะ แล้วฝังกลบมันไว้ใต้ดินทราย...\n\nไม่แปลกไปหน่อยหรือ?\n\n“ทำไปทำไม?”\n\n“คะ?”\n\n“หลังจากคว้าชัยชนะและกวาดล้างนิกายนอกรีตจนสิ้นซากแล้ว เหตุใดจึงต้องฝังกลบไว้ใต้ดินด้วย? การทำลายอาคารทิ้งทั้งหลังมันง่ายกว่าการฝังกลบตั้งหลายเท่า และต่อให้การฝังกลบจะมีความหมายเชิงศาสนาก็ตาม ก็ไม่มีเหตุผลอะไรจะต้องสร้างอาคมและภาพสลักที่ซับซ้อนถึงเพียงนี้”\n\n“อืม... พิธีกรรมของศาสนจักรในยุคนั้นไม่ได้อยู่ในขอบเขตความเชี่ยวชาญของจอมเวทหรอกนะคะ คุณน่าจะไปปรึกษานักบวชที่เชี่ยวชาญด้านการตีความเอกสารโบราณหรือบันทึกประวัติศาสตร์พระคัมภีร์จะดีกว่า ยังไงก็ตาม ฉันรู้เท่านี้แหละค่ะ อีกอย่าง เราก็ไม่อาจฟันธงได้นี่คะว่าพวกเขาจงใจฝังกลบมันไว้จริงๆ?”\n\n“หืม?”\n\n“ก็นะคะ พอเวลาผ่านไปตั้ง 2,000 ปี อาคารบ้านเรือนก็อาจจมลงไปใต้ระดับพื้นดินตามธรรมชาติเมื่อกาลเวลาผันผ่านได้เหมือนกัน”\n\n“เป็นไปไม่ได้”\n\nอีวานส่ายศีรษะ\n\nเขายกมือขึ้นชี้ไปยังเพดานขนาดมหึมาที่ค้ำยันไว้ด้วยเสาหินเหล่านั้น\n\n“หากสถานที่แห่งนี้ถูกฝังกลบตามธรรมชาติเมื่อกาลเวลาผ่านไป มันก็ควรจะถูกขุดพบในสภาพซากปรักหักพังที่จมอยู่ในชั้นทราย แต่นี่กลับอยู่ในสภาพสมบูรณ์เกินไป และหากเป็นกรณีนั้น ก็คงไม่จำเป็นต้องร่ายเวทป้องกันขนาดมหึมาไว้ปกป้องสถานที่แห่งนี้หรอก”\n\nเมื่อพิจารณาจากวิธีที่เวทป้องกันทำงานในทันทีที่โบราณวัตถุขุดเจาะของคนแคระบังเอิญสร้างความเสียหายแก่พื้นที่ใกล้เคียง ทุกอย่างก็กระจ่างชัด\n\nสถานที่แห่งนี้ถูกผนึกไว้โดยเจตนา\n\nถูกผนึก คำว่าผนึก\n\nอีวานครุ่นคิดถึงถ้อยคำอันชวนไม่สบายใจนี้พลางก้าวเดินไปข้างหน้าอย่างช้าๆ\n\n“เธอเปิดใช้งานเวทป้องกันอีกครั้งได้ไหม?”\n\n“เอ๊ะ ทำไมคะ?! คุณวางแผนจะไปทำลายอะไรอีกแล้วเหรอคะ?!”\n\n“ไม่ใช่แบบนั้น ที่ฉันพูดก็เพราะข้างในนี้อาจจะอันตราย ถ้าทำไม่ได้ก็รออยู่ข้างหลัง”\n\n“คะ? อันตราย? นี่มันก็แค่โบราณสถานเก่าแก่...”\n\n“คงไม่ใช่แค่นั้นหรอก”\n\nอีวานกล่าวพลางเตรียมขวานและปืนพกให้พร้อมรบ\n\n“มีความเป็นไปได้สูงว่าสิ่งที่ศาสนจักรในยุคนั้นไม่กล้าทำลายทิ้ง จนต้องนำมาผนึกไว้ใต้ดิน กำลังหลับใหลอยู่ข้างในนี้”\n\nนั่นไม่เชิงเป็นความรู้พื้นฐานในแนวสถาบันการศึกษาเสียทีเดียว\n\nแต่เมื่อประเมินจากสถานการณ์แล้ว มันแทบจะเป็นสามัญสำนึกในนิยามของ “แฟนตาซี” เลยก็ว่าได้ โดยเฉพาะในแนวแฟนตาซีสายดาร์ก\n\nข้างหน้านี้ย่อมต้องมีสถานการณ์ที่จำเป็นต้องใช้การตีความทางเวทมนตร์อยู่แน่ ทว่านั่นไม่ใช่เรื่องที่คุ้มค่าจะนำตัวผู้ที่อยู่ในความคุ้มครองของปาร์ตี้ผู้กล้ามาเสี่ยงอันตรายอย่างที่ไม่เคยพบเจอมาก่อน\n\nจนกระทั่งมาถึงสถานที่แห่งนี้ ทุกสิ่งยังคงอยู่ในขอบเขตที่คาดการณ์ไว้ และหาก “สามัญสำนึก” ของเขาถูกต้อง ที่นี่ก็ควรเป็นเพียงคลังสมบัติธรรมดาๆ แห่งหนึ่งเท่านั้น โดยธรรมชาติแล้ว การคุ้มกันคนเพียงคนเดียวไม่ใช่เรื่องยากเลย\n\nแต่บัดนี้สถานการณ์เปลี่ยนไปแล้ว หากมีปีศาจบรรพกาลบางตนที่ถูกเหล่านักรบครูเสดแห่งศาสนจักรโบราณผนึกไว้กำลังหลับใหลอยู่ที่นี่ เขาไม่อาจรับประกันความปลอดภัยของเด็กคนนี้ได้\n\n“รออยู่ที่นี่ ใช้เวทลอยตัวเป็นใช่ไหม?”\n\n“คุณเห็นฉันเป็นใครกันคะ! นั่นมันเวทพื้นฐานเลยนะคะ!”\n\n“ดีแล้ว ถ้าดูท่าไม่ดี ให้หนีออกจากสถานที่แห่งนี้แล้วบินไปที่ทางระบายน้ำด้วยเวทลอยตัว หากหลงทางระหว่างทาง ให้อยู่เฉยๆ แล้วรอ”\n\nในทางระบายน้ำใต้ดินพริตเชนคายาน่าจะมีสายลับของเอลิซาเวตาประจำการอยู่ หากเวลาผ่านพ้นไปหลังจากเขาออกปฏิบัติภารกิจ ทีมช่วยเหลือย่อมถูกส่งลงมาอย่างแน่นอน\n\nส่งเธอไปทางนั้นย่อมดีกว่า อีวานหันหลังกลับแล้วก้าวเดินไปข้างหน้า\n\n“เดี๋ยวค่ะ แล้วคุณล่ะคะ?”\n\n“ฉันมีสิ่งที่ต้องทำ”\n\n“คะ? ไม่สิ ถ้ามันดูอันตราย ถอยกลับไปรอให้กำลังเสริมมาช่วยก่อนไม่ดีกว่าหรือคะ...!”\n\n“ที่นี่อยู่ใต้มหาวิทยาลัยเซนต์ยานสก์โดยตรง”\n\nอีวานยังคงเดินต่อไปโดยไม่หันศีรษะกลับมา\n\n“พอโบราณวัตถุของคนแคระก่อให้เกิดรอยร้าว โบราณสถานที่ไม่มีใครล่วงรู้มาหลายศตวรรษก็พลันปรากฏตัวขึ้นอย่างกะทันหัน เธอรับประกันได้ไหมว่ามันจะยังคงปลอดภัยเมื่อเวลาผ่านไป?”\n\nไม่จำเป็นต้องมีคำอธิบายหรือเหตุผลเพิ่มเติมใดๆ อีก\n\nนี่คือ “สามัญสำนึก” ของอีวาน ทันทีที่ผนึกถูกค้นพบ ไม่ช้าก็เร็วมันย่อมถูกทำลายลงอย่างไม่อาจหลีกเลี่ยง\n\nมันแทบจะเหมือนกลศาสตร์ควอนตัมฉบับแฟนตาซีเลยทีเดียว เรียกได้ว่าสถานะถูกกำหนดขึ้นในชั่วขณะที่ถูกสังเกตการณ์ พูดง่ายๆ ก็คือสถานการณ์เผชิญหน้าศัตรูนั่นแหละ\n\nในเมื่อไม่มีทางอธิบายเรื่องทั้งหมดนี้ให้ฟังได้ อีวานจึงมุ่งหน้าลึกเข้าไปในโบราณสถาน\n\n“แต่... แต่จะไปคนเดียวเลยหรือคะ?”\n\n“ฉันชินแล้ว”\n\nแม้จะปฏิบัติการเป็นหน่วยจู่โจมขนาดเล็กเป็นหลัก แต่โดยพื้นฐานแล้วหน่วยเก็บกวาดคือหน่วยรบพิเศษที่เชี่ยวชาญด้านการแทรกซึมและลาดตระเวน ดังนั้นเขาจึงเคยปฏิบัติภารกิจเดี่ยวในพื้นที่เฉพาะมามากมายนับครั้งไม่ถ้วน\n\nและในอีกความหมายหนึ่ง เขาก็ “ชินแล้ว” จริงๆ\n\nการลาดตระเวนคืออะไร?\n\nการลาดตระเวนหมายถึงเจ้าหน้าที่ที่ถูกส่งล่วงหน้าไปเพื่อระบุปัจจัยคุกคามเมื่อกองกำลังฝ่ายพันธมิตรกำลังมุ่งหน้าเข้าสู่ดินแดนที่ยังไม่ถูกสำรวจ\n\nดังนั้น การได้ประจำการอยู่ในหน่วยลาดตระเวน โดยเฉพาะอย่างยิ่งหน่วยลาดตระเวนของปาร์ตี้ผู้กล้า จึงหมายถึงสิ่งเดียวเท่านั้น\n\nคือการเอาชีวิตรอดให้ได้ในทุกสถานการณ์\n\nคือการรับมือให้ได้กับทุกสถานการณ์ที่เผชิญหน้า\n\nโดยพื้นฐานแล้ว อีวานได้รับมอบหมายเฉพาะภารกิจที่ตั้งสมมติฐานว่าจะต้องปะทะกับศัตรูที่ไม่รู้จักเสมอมา จนกระทั่งพวกเขาก้าวไปถึงหน้าประตูวังของจอมมาร\n\nดังนั้น ในทุกความหมาย นี่จึงเป็นสถานการณ์ที่คุ้นเคยเป็นอย่างดี แม้จะไม่น่ายินดีนัก แต่ถ้าจำเป็นต้องทำ ก็ต้องลงมือทำ\n\n“อิ๊ย!!”\n\nเขาได้ยินเสียงฝีเท้าเร่งรีบดังใกล้เข้ามา\n\nเอลเฟียรามายืนชิดอยู่ด้านหลังแผ่นหลังของอีวานแล้วถอนหายใจเฮือกใหญ่\n\n“การดูแลเผ่าพันธุ์ที่ต่ำกว่าเป็นหน้าที่ของเอลฟ์ และการปกป้องสามัญชนก็เป็นหน้าที่ของชนชั้นสูงค่ะ!”\n\n“นั่นฟังดูต่างจากหน้าที่ของเอลฟ์ที่ฉันรู้จักอยู่หน่อยนะ”\n\n“คุณรู้จักเอลฟ์ดีกว่าฉันหรือไงคะ?!”\n\n“ก็ไม่เชิง”\n\n“ถ้างั้นนับตั้งแต่วันนี้เป็นต้นไป จงจำใส่ใจไว้เลยนะคะ ฉันไม่เข้าใจจริงๆ ว่าทำไมในหมู่พวกมนุษย์ถึงมีพวกเหยียดเผ่าพันธุ์เยอะแยะนัก เป็นเพราะวัฒนธรรมทางสังคมที่ยังไม่พัฒนาของพวกคุณหรือเปล่าคะ?”\n\nไอ้คำพูดเมื่อกี้นั่นแหละที่เรียกว่าเหยียดเผ่าพันธุ์ไม่ใช่หรือไง?\n\nอีวานคิดเช่นนั้นอยู่ชั่วครู่ ทว่าพอเห็นเอลเฟียราเดินตามหลังมาอย่างประหม่าด้วยเสียงฝีเท้าดังกึกกัก เขาก็คลี่ยิ้มออกมา\n\nเขาเคยคิดว่าขอแค่เธอมีส่วนคล้ายเบโอลกรินสักครึ่งหนึ่งก็เพียงพอแล้ว\n\nนิสัยของเธอดูดีกว่าเบโอลกรินอยู่นิดหน่อยแฮะ\n\n“กาลเวลามันเดินเร็วจริงๆ นะ เธอโตขึ้นมาได้ดีทีเดียว”\n\n“เอ๊ะ...? คุณรู้จักฉันด้วยหรือคะ?”\n\n“แน่นอนสิ จะลืมได้ยังไงกัน”\n\nอีวานหัวเราะเบาๆ ขณะหวนนึกถึงเอลเฟียราในวันวาน\n\nความวิตกกังวลปรากฏซ้อนทับลงบนใบหน้าของเอลเฟียรา\n\n“เมื่อไร...? พวกเราเคยเจอกันเมื่อไรหรือคะ?”\n\n“สิบสองปีก่อน ตอนที่เบโอลกรินมาที่ค่ายของพวกเรา เธอไม่ได้บอกให้ฉันเอาอาหารมาให้ ‘ท่านเอลฟ์’ หรอกหรือ? โดยบอกว่าควรเสิร์ฟอาหารคน ไม่ใช่อาหารสัตว์น่ะ”\n\n“เอ่อ... อึก...!!”\n\n“จำได้แล้วใช่ไหม?”\n\n“พวกเราไม่เหมือนมนุษย์นะคะ!! ความจำของพวกเราน่ะ... ดีเยี่ยมค่ะ”\n\nใบหน้าของเอลเฟียราแดงก่ำขึ้นมาทันตา\n\n“คุณ... เอ่อ คุณเปลี่ยนไป... เปลี่ยนไป... แตกต่างจากในความทรงจำของฉันมากเลยนะคะ?”\n\n“เวลามันก็เดินไปตามกาลเวลาของมัน”\n\n“...นั่นสินะคะ มนุษย์แก่ตัวเร็วจะตายไป นั่นสินะคะ....”\n\nเธอดูเหมือนมีเรื่องอยากจะพูดต่อขณะพึมพำเบาๆ แต่ไม่ช้าก็เบือนหน้าหนีไปอีกทาง\n\n***\n\nแม้ในยามที่เดินผ่านเสาหินและมุ่งหน้าลึกเข้าไปในโบราณสถาน เอลเฟียราก็ยังคงปิดปากเงียบ\n\nเธอลอบเหลือบมองใบหน้าของอีวานเป็นระยะ ก่อนจะเดินตามหลังเขามาอย่างเงียบเชียบ\n\nหลังจากเดินมาเป็นเวลานาน ในที่สุดเมื่อทั้งสองมาถึงปลายสุดของวิหารขนาดมหึมาแห่งนี้ อีวานก็หยุดฝีเท้าลง\n\nเบื้องหน้าของพวกเขาคือประตูบานใหญ่ที่ดูน่าสงสัยอย่างเห็นได้ชัด\n\n“สัมผัสได้ถึงอะไรบ้างไหม?”\n\n“ไม่ค่ะ พลังเวทมนตร์กลับ... จางลงยิ่งกว่าตรงทางเข้าเสียอีก”\n\n“อืม”\n\nอีวานยกขวานขึ้นอย่างระมัดระวังแล้วผลักประตูบานนั้น\n\nแม้เขาจะคาดการณ์ว่าอาจมีผนึกหรือแรงต้านทานบางอย่าง ทว่าตรงกันข้ามกับที่คาดไว้ ประตูกลับเปิดออกอย่างราบรื่นราวกับบานพับเพิ่งถูกชโลมน้ำมันมาหมาดๆ\n\n– วูบ\n\nกระแสลมอุ่นพัดผ่านใบหน้าของเขา\n\nอีวานยกมือข้างหนึ่งขึ้นบังดวงตาพร้อมกลั้นลมหายใจ กลิ่นหอมหวานอบอวลไปทั่วอากาศ\n\nยาพิษงั้นหรือ?\n\nขณะที่เขากำลังจะรีบตะโกนเตือนเอลเฟียรา อีวานก็ถึงกับชะงักงันต่อภาพที่ปรากฏอยู่ตรงหน้า\n\n“...นี่มันอะไรกัน”\n\nเบื้องหลังบานประตูคือพื้นที่อันกว้างใหญ่ไพศาลที่เต็มไปด้วยภูเขาสิ่งของชิ้นจิ๋วซึ่งมีขนาดเล็กกว่าฝ่ามือ\n\nเปล่งประกายระยิบระยับใต้แสงสว่างที่สาดส่องลงมาจากที่ใดสักแห่งบนเพดาน\n\nกองพะเนินเทินทึกสูงเสียดฟ้าประดุจมหาสมบัติจากในนิทาน....\n\n“หวีงั้นเหรอ...?”\n\nอีวานหรี่ตาลงแล้วเพ่งมองไปข้างหน้า ไม่มีสิ่งอื่นใดปรากฏให้เห็นเลย\n\nหวีสารพัดรูปแบบที่ประดับประดาด้วยมุกดา ทองคำ เงิน รวมถึงโลหะมีค่าและอัญมณีนานาชนิด... กองสุมกันอยู่อย่างไร้ที่สิ้นสุด ส่องแสงระยิบระยับบาดตา\n\nไม่สิ เมื่อสังเกตดูอย่างถี่ถ้วน มันแตกต่างจากหวีธรรมดาอยู่เล็กน้อย\n\nขนาดเล็กกว่าหวีทั่วไปราวหนึ่งคืบ เป็นหวีแบบที่จะใช้เพื่อวัตถุประสงค์อันจำเพาะเจาะจงเท่านั้น....\n\n‘หวี... สางเครางั้นเหรอ...?’\n\nอีวานก้าวถอยหลังอย่างระมัดระวัง เหตุใดหวีสางเคราถึงมาโผล่ในสถานที่แบบนี้ได้อย่างกะทันหัน? ในสถานการณ์ที่น่าสงสัยอย่างชัดแจ้งนี้ อีวานยกขวานขึ้นและหันไปมองหาเอลเฟียรา\n\nเอลเฟียราที่ยืนอยู่ข้างหลังเขามาตลอดกำลังพึมพำออกมาด้วยสีหน้าเหม่อลอย\n\n“ทองคำ... ม้วนคัมภีร์เวทมนตร์... คุณพระช่วย นั่นมันลอเรนไม่ใช่หรือ...?! ของล้ำค่าขนาดนั้นมาอยู่ที่นี่ได้ยังไงกัน...? นั่น... นั่นสามารถยืดอายุขัยออกไปได้อย่างน้อย 10 ปีเลยนะ....”\n\nดูเหมือนเธอกำลังเพ้อพึมพำด้วยภาษาปนเปกัน รวมถึงภาษาเอลฟ์ด้วย เมื่อพิจารณาจากถ้อยคำอันไม่อาจเข้าใจได้ที่หลุดออกมาจากปากเธอ\n\nมาถึงจุดนี้ อีวานก็พยักหน้าอย่างเข้าใจ\n\n‘ที่แท้ความสุขก็หมายถึงแบบนี้นี่เอง’\n\nอนุสาวรีย์แห่งชัยชนะบนภาพสลักระบุไว้ว่า ‘ความชั่วร้ายอันดำมืดที่สุด คือผู้ที่กระซิบถ้อยคำแห่งความสุขสำราญเข้าข้างหูของเหล่าผู้ศรัทธา’\n\nและเศษเสี้ยวแห่งอดีตที่อีวานได้เห็นเพียงชั่วครู่ยามก้าวเข้าสู่พื้นที่แห่งนี้ ความทรงจำร่วมกับองค์กษัตริย์ผู้ล่วงลับ\n\nคำพูดที่เอลเฟียราเอ่ยออกมาตอนถูกปลุกให้ตื่นจากอาการหมดสติ ‘กำลังฝันดีสุดๆ อยู่เลยเชียว’\n\nมันไม่ใช่ภาพลวงตาที่สร้างขึ้นมาเพื่อแสดงความเสียใจหรือความอาลัยอาวรณ์แต่อย่างใด มันเป็นเพียงภาพมายาที่จำลองห้วงเวลาซึ่งคนผู้นั้นปรารถนามากที่สุดขึ้นมาเท่านั้น\n\nลมเหนือกับดวงอาทิตย์\n\nจริงแท้ทีเดียว คู่ต่อสู้ที่ยากจะต้านทานมากที่สุดก็คือความสุขของตนเองนั่นเอง\n\nอีวานพยักหน้า ในแง่นั้นก็นับว่าโชคดีแล้ว\n\nเพราะในโลกยุคก่อนสมัยใหม่อันล้าหลังใบนี้ เขาไม่ปรารถนาสิ่งใดเลยนอกจากหวีสางเครา\n\nสิ่งที่เขาปรารถนาในตอนนี้มีอยู่เพียงแค่บนโลกมนุษย์เท่านั้น\n\nครอบครัวที่ใบหน้าเริ่มเลือนราง เพื่อนฝูงที่จำชื่อไม่ได้แล้ว อาหารบ้านเกิดที่กินได้ทุกเมื่อที่ต้องการ ทีวีและสมาร์ตโฟน ไม่ว่ามันจะกลายเป็นเช่นไรไปแล้วก็ตาม\n\nที่แท้มิน่าถึงได้ออกมาเป็นแบบนี้\n\nอีวานแย้มยิ้มขื่นขณะมองดูสายธารหวีสางเคราหลากสีสันที่ร่วงพรูลงมาตรงหน้า\n\nและในทันใดนั้น เขาก็ตบแก้มของเอลเฟียราดังฉาด\n\n***\n\n**💬 ความคิดเห็นนักอ่าน:**\n- **@ภูเขาหวีสางเครา** (20 ชั่วโมงที่แล้ว • 👍 274): โอ๊ยยย สงสารปนขำลุงจนน้ำตาเล็ด!! กับดักลวงใจอ่านความปรารถนาลึกที่สุด... เอลเฟียราเห็นทองคำ คัมภีร์เวท ยาอายุวัฒนะลอเรน ส่วนลุงอีวานดันเห็น \"ภูเขาหวีสางเคราหลากสีสัน\" ร่วงพรูลงมาตรงหน้า 55555\n- ↳ **@คนอยากกลับบ้าน** (19 ชั่วโมงที่แล้ว • 👍 132): แต่มันก็เศร้าลึกๆ นะ ที่ลุงเห็นแค่หวีสางเคราก็เพราะในโลกนี้ลุงไม่ได้ปรารถนาสมบัติ ยศถา หรืออำนาจอะไรเลย สิ่งที่ลุงอยากได้จริงๆ คือครอบครัว เพื่อน กับของกินที่โลกมนุษย์เท่านั้นเอง...\n- ↳ **@ตบเรียกสติ101** (18 ชั่วโมงที่แล้ว • 👍 88): พอซึ้งปุ๊บ ย่อหน้าสุดท้ายตบแก้มเอลเฟียราดังฉาดทันที! ลุงสายทรีตเมนต์แรงตลอด 555\n- **@นักประวัติศาสตร์เดเลน** (17 ชั่วโมงที่แล้ว • 👍 115): จักรวรรดิเดเลนตะวันออกเมื่อ 2,000 ปีก่อนสร้างอนุสาวรีย์ปิดผนึกพวกที่ต่อสู้กับ \"ความสุข\" เหรอ? นี่มันฟังดูเหมือนศาสนจักรยุคโบราณซ่อนความจริงอะไรสักอย่างเลยนะ"

      "title": "บทที่ 67",
      "content": "“เพียะ!”\n\nแก้มเป็นอวัยวะอันแสนพิศวงที่สามารถทำให้คนได้สติหรือเสียสติไปก็ได้ทั้งคู่ (โดยทั่วไปแล้ว อย่างหลังมักจะเป็นการใช้งานหลักเสียมากกว่า)\n\nอีวานผู้เป็นสายลับมากฝีมือจึงสามารถปลุกสติของเอลเฟียราให้กลับคืนมาได้สำเร็จ\n\n“เอ๊ะ... ทำไม...?”\n\n“ตั้งสติหน่อย”\n\n“ตั้งสติ? คุณพูดเรื่องอะไรคะ? ฉันไม่เคยเสียสติสักหน่อย! ฉันกำลังครุ่นคิดอยู่ต่างหากว่าจะแบ่งส่วนนั้นให้คุณยังไงดีโดยคำนึงถึงความคิดของคุณด้วย แต่เจ้ามนุษย์ไร้มารยาทคนนี้... ไม่สิ คำว่า ‘ไร้มารยาท’ กับ ‘มนุษย์’ มันก็ความหมายเดียวกันนั่นแหละ”\n\nเอลเฟียราพ่นคำพูดไร้สาระออกมาไม่หยุด ทว่าสายตาก็ยังคงเหลือบมองกองหวีอยู่อย่างละสายตาไม่ได้\n\n“สิ่งนั้นดูเหมือนอะไรในสายตาเธอ?”\n\n“เอ๊ะ? นั่นมันขุมทรัพย์ชัดๆ เลยนะคะ! ฉันเป็นเอลฟ์ผู้เปี่ยมด้วยเมตตา ดังนั้นจะยอมแบ่งให้คุณด้วยก็แล้วกัน อ้อ แต่ไม่รวมลอเรนนะคะ ของชิ้นนั้นมีจุดประสงค์การใช้เฉพาะทาง ไม่ใช่ของที่กินดิบๆ ได้เลย เดี๋ยวฉันต้องนำไปสกัดปรุงก่อน มันเป็นวัตถุดิบที่จัดการยากมากเลยล่ะค่ะ....”\n\n“ในสายตาฉัน มันดูเหมือนหวีน่ะ”\n\nอีวานเอ่ยอย่างเรียบเฉยใส่เอลเฟียราที่เริ่มพึมพำภาษาเอลฟ์ขึ้นมาอีกแล้ว\n\n“คะ? หวี? จู่ๆ พูดเรื่องอะไรขึ้นมาคะ?”\n\n“หวีสำหรับหวีผมตรงตัวเลย”\n\nอีวานคว้าแขนของเอลเฟียราแล้วค่อยๆ ก้าวถอยหลัง\n\n“นั่นมันกับดัก”\n\n“กับดัก... โอ้... จริงหรือคะ? มันดูเหมือนหวีจริงๆ เหรอ? แต่กับดักแบบไหนกันคะ...?”\n\n“กับดักที่จะสำแดงสิ่งที่ปรารถนามากที่สุดจากมุมมองของผู้ที่มองเห็น คงจะเป็นกับดักจำพวกลวงจิตคล้ายๆ กับตอนที่พวกเราเพิ่งเข้ามาในวิหารแห่งนี้ครั้งแรก”\n\n“ฟังดูสมเหตุสมผลตรงไหนคะ? มนุษย์แบบไหนกันถึงใช้ชีวิตโดยมีหวีเป็นสิ่งที่ปรารถนามากที่สุดน่ะ...? โดยเฉพาะอย่างยิ่งตอนที่มีเอลฟ์ยืนอยู่ข้างๆ ทั้งที่ตัวเองก็ไม่ได้สลักสำคัญอะไรเลยแท้ๆ?”\n\nช่างเป็นกับดักที่น่าสะพรึงกลัวเสียจริง ถึงขั้นทำลายจิตใจของเอลฟ์ได้ถึงเพียงนี้\n\nแต่อีวานไม่ได้รู้สึกแปลกใจแต่อย่างใด ความบกพร่องทางอุปนิสัยอันเป็นสันดานเดิมของพวกเอลฟ์ถือเป็นเรื่องที่รู้กันโดยทั่วไป ซึ่งย่อมบ่งชี้โดยธรรมชาติว่าเอลฟ์เป็นเผ่าพันธุ์ที่มีจิตใจอ่อนแอ ผู้ที่มีจิตใจสมบูรณ์เข้มแข็งย่อมไม่ดูแคลนเผ่าพันธุ์อื่น\n\nอีวานยังคงจ้องมองเนินหวีอันเปล่งประกายระยิบระยับด้วยสายตาเย็นชา\n\nหากมันเป็นกับดัก ย่อมต้องมีเจตนาแอบแฝงอยู่เบื้องหลัง\n\nเขาหรี่ตาลง กวาดสายตาสำรวจจากสุดมุมห้องด้านหนึ่งไปยังอีกด้านหนึ่ง การล่อลวงย่อมมีวัตถุประสงค์เสมอ\n\nไม่มีทางที่จะมีกับดักโดยปราศจากเจตนา\n\nกองสมบัตินั้นคอยล่อเหยื่อให้เดินเข้าไปหา เหมือนดั่งโคมไฟที่ห้อยอยู่บนหัวของสัตว์นักล่า บัดนี้ได้เวลาค้นหาคมเขี้ยวของสัตว์นักล่าตัวนั้นแล้ว\n\n‘กลิ่นหอมที่ได้กลิ่นตอนเปิดประตูทางเข้ามา’\n\nเช่นนั้น นี่ก็คือกับดักที่รบกวนทั้งการมองเห็นและการรับกลิ่น เพื่อล่อลวงเหยื่อให้เดินเข้าไปหากองสมบัติอันเป็นที่ปรารถนาด้วยการปลดเปลื้องการป้องกันในจิตใต้สำนึก\n\n“เอลเฟียรา”\n\n“คะ?”\n\n“ยังคงไม่สัมผัสถึงไอพลังเวทมนตร์อยู่ใช่ไหม?”\n\n“เอ่อ ไม่เลยค่ะ ถ้ามี ฉันคงรู้ได้ทันทีว่ามันเป็นกับดัก แต่นี่ไม่มีวี่แววเลยแม้แต่นิดเดียว”\n\n“อืม”\n\nหากไม่ใช่กลไกทางเวทมนตร์ ก็จงตั้งสมมติฐานว่านี่คือกับดักที่ทำงานจากการกระทำทางกายภาพ\n\nอีวานหลับตาลง ปิดกั้นประสาทรับกลิ่น แล้วค่อยๆ เงี่ยหูฟังอย่างช้าๆ\n\n– ตุบ ตุบ ตุบ...\n\nเสียงสะท้อนก้องออกไปเบื้องหลังเปลือกตาที่ปิดสนิท ก่อนจะกระดอนกลับมาเป็นเสียงสะท้อน เสียงที่ปะทะเข้ากับสภาพพื้นที่และวัตถุต่างๆ ย้อนกลับมาพร้อมการหักเหอันจำเพาะเจาะจง ค่อยๆ ก่อร่างขึ้นเป็นรูปร่าง\n\nนี่คือการใช้งานพื้นฐานของการกำหนดตำแหน่งด้วยเสียงสะท้อน\n\nภายในห้องอันกว้างขวางแห่งนี้ มี ‘กองวัตถุบางอย่าง’ และ ‘บางสิ่งที่ยื่นโดดเด่นออกมา’\n\nเป็นภาพนิ่งที่ไร้การเคลื่อนไหว ดังนั้นโอกาสที่จะมีศัตรูซ่อนตัวอยู่ในระยะประชิดจึงต่ำ\n\n“ในกองสมบัติที่เธอมองเห็น ตรงใจกลางนั้น เธอเห็นอะไรยื่นออกมาไหม?”\n\n“ยื่นออกมาเหรอคะ?”\n\n“รูปร่างหน้าตาไม่สำคัญ คิดตามอิสระได้เลย ตอนที่เธอเห็นมันครั้งแรก มีอะไรที่เธออยากคว้าขึ้นมาเป็นอันดับแรกไหม?”\n\n“อ้อ ค่ะ ถ้าต้องระบุล่ะก็... มีบางอย่างยื่นออกมาจริงๆ ด้วย น่าจะเป็นต้นหญ้าสักอย่างค่ะ”\n\n“เข้าใจแล้ว”\n\nอีวานลืมตาขึ้น ตรงใจกลางกองหวี มีหวีที่ประดิษฐ์อย่างประณีตงดงามเป็นพิเศษอันหนึ่งปักเอียงอยู่ท่ามกลางข้าวของชิ้นอื่นๆ ซึ่งตรงกับตำแหน่งที่เขาระบุได้จากการกำหนดตำแหน่งด้วยเสียงสะท้อนอย่างแม่นยำ\n\nหากเจตนาของกับดักคือการทำให้เขาอยากดึงสิ่งนั้นออกมา\n\nอีวานก้าวเดินอย่างระมัดระวัง สัมผัสได้ถึงแรงกดใต้ฝ่าเท้าขณะเหยียบย่ำลงบนกองหวีที่แตกหักดังกรอบแกรบ\n\nเขาเดินเข้าไปอย่างเชื่องช้าแล้วหยิบหวีอันนั้นขึ้นมา\n\nทันใดนั้น งานฝีมืออันวิจิตรบรรจงก็ช่างยอดเยี่ยมเสียจนเขาเกิดความรู้สึกอยากครอบครองขึ้นมา ตรงตามรสนิยมของเขาเป๊ะ ทั้งดีไซน์ที่เรียบง่ายแต่งดงามใช้งานได้จริง พร้อมคลิปหนีบอเนกประสงค์ขนาดเล็กที่ออกแบบให้เหมือนมีดสั้นเพื่อเพิ่มความมั่นคงแข็งแรง\n\nบางทีไว้คราวหน้าเขาอาจจะลองสั่งทำพิเศษดูบ้างก็ได้ จึงจดจำรูปทรงของมันเอาไว้ ก่อนที่อีวานจะหลับตาลง\n\n– ซู่ว...\n\nจากนั้น เขาก็ถ่ายเทพลังเวทเข้าไปในประสาทสัมผัส กระแสอากาศที่สัมผัสผิวหนัง แม้กระทั่งระลอกคลื่นแผ่วเบาที่เกิดจากลมหายใจออกของตนเอง พลันเลือนรางลงอย่างซับซ้อน\n\nตึก ตัก เสียงหัวใจเต้นของเขา เขารีดเร้นสมาธิจนถึงขีดสุด แล้วถ่ายทอดประสาทสัมผัสทั้งหมดลงไปสู่การสัมผัส\n\nเอื้อมมือไปยังหวีอันวิจิตรงดงามที่ปักนิ่งอยู่นั้น อย่างเชื่องช้าและแม่นยำ ราวกับมีดผ่าตัดของศัลยแพทย์\n\nสัมผัสอันเย็นเยียบ น้ำหนักอันหนักแน่นของโลหะ ด้ามจับยาวราว 13 เซนติเมตร\n\nออกแรงกดที่ปลายนิ้วเล็กน้อยแล้วรับรู้แรงสะท้อนกลับยามเขย่าเบาๆ เขาอนุมานรูปทรงส่วนที่เหลือได้ทั้งหมด\n\nเมื่อกำไว้แน่น ในที่สุดเขาก็จับจ้องแยกแยะรูปทรงที่สมบูรณ์ของมันได้\n\n“คมดาบ... มันคือดาบ”\n\n“คะ?”\n\n“ออกแบบมาโดยตั้งใจให้คนอยากดึงมันออกมา ปักคาอยู่ที่ไหนสักแห่ง โลหะทรงยาวแนวตั้ง ใจกลางของกับดักนี้และเงื่อนไขการทำงานของมัน นี่คือดาบ”\n\nอีวานค่อยๆ ลืมตาขึ้น\n\nเขากำลังยืนอยู่บนซากโครงกระดูกนับไม่ถ้วน\n\nโดยที่มือทั้งสองข้างกำลังกำดาบซึ่งปักทะลุกลางอกของรูปปั้นหินสีดำเอาไว้\n\nเขาไม่ได้ตกใจ ตอนที่ยกระดับประสาทสัมผัส เขาได้คาดการณ์ไว้แล้วจากสัมผัสทางกายภาพของหวีที่เหยียบลงไป\n\nความรู้สึกกรอบแกรบใต้ฝ่าเท้านั้น แทนที่จะเป็นหวีอันเล็กๆ มันใกล้เคียงกับกระดูกมากกว่า\n\n“ภาพมายาที่จะสลายตัวลงทันทีที่ตระหนักรู้ ไม่ใช่กับดักทางกายภาพ”\n\n“คะ? แต่ไม่มีเวทมนตร์เลยสักนิดนะคะ...”\n\n“ต่อให้ไม่มีเวทมนตร์ แต่ก็ยังมีอีกหนึ่งเงื่อนไขไม่ใช่หรือ ที่สามารถแปรเปลี่ยนภาพมายาให้กลายเป็นปรากฏการณ์จริงได้?”\n\nดูเหมือนเอลเฟียราจะยังคงมองไม่เห็นแก่นแท้ของกับดักนี้ หากเป็นเช่นนั้น เธอก็ย่อมไม่อาจตอบสนองได้ทันท่วงที\n\nอีวานกุมด้ามดาบไว้พลางจ้องตรงไปยังรูปปั้นหินแล้วเอ่ยขึ้น\n\n“พลังศักดิ์สิทธิ์ กับดักนี้ถักทอขึ้นด้วยพลังศักดิ์สิทธิ์”\n\nเบื้องหน้าของเขาคือรูปปั้นหินสีดำในท่วงท่าของใครบางคนที่กำลังคุกเข่าภาวนา\n\nวัสดุทำจากหินอ่อน และมีดาบเหล็กกล้าเรียวยาวปักเอียงลงไปที่กลางอก หากนี่เป็นกับดักที่ทำงานเมื่อดึงออก รูปปั้นนี้ก็คงเป็นตัวตนที่ถูกผนึกไว้\n\nอีวานจ้องมองรูปปั้นพลางกุมด้ามดาบไว้แน่น\n\nลูกตาดำของดวงตารูปปั้นกลอกกลิ้ง หันตรงมาทางอีวาน\n\n[ถูกต้อง]\n\n***\n\nไม่ว่าแห่งหนใดบนโลก ย่อมมีสถานที่ที่พลังเวทมนตร์รวมตัวกันหนาแน่นและสถานที่ที่เบาบางลงตามลำดับ ทว่าพลังเวทมนตร์ที่แทรกซึมอยู่ทั่วทุกสารทิศอย่างแท้จริงนั้น หากต้องนิยามแล้ว ก็ใกล้เคียงกับต้นกำเนิดแห่งสรรพสิ่ง\n\nวัตถุทุกชิ้นต่างมีพลังเวทมนตร์บรรจุอยู่ในระดับหนึ่ง พวกมันซึมซับพลังเวทมนตร์ที่กระจายตัวอยู่ในชั้นบรรยากาศโดยธรรมชาติ\n\nแต่พลังศักดิ์สิทธิ์นั้นแตกต่างออกไป พลังศักดิ์สิทธิ์เป็นของเทพแห่งแสง องค์ราชันสวรรค์เพียงผู้เดียวเท่านั้น\n\nมันคือเศษเสี้ยวของพระผู้เป็นเจ้าที่สถิตลงมายังเหล่านักบวชยามพวกเขาสวดภาวนาต่อองค์พระผู้เป็นเจ้า เป็นขุมพลังอันไร้ผู้ทัดเทียมที่นักรบและจอมเวทมิอาจหาญครอบครอง ไม่มีหนทางจะวิเคราะห์ที่มาของมัน และไม่มีเหตุผลที่จะต้องทำเช่นนั้นด้วย\n\nดังนั้น คนเราจึงไม่อาจพูดอะไรทำนองว่า ‘อึก พลังศักดิ์สิทธิ์ของเทพอสูรชั่วร้าย...!’ ออกมาได้ เพราะไม่มีฐานข้อมูลเปรียบเทียบใดๆ สำหรับขุมพลังเช่นนั้น ทว่ายังมีสิ่งที่เรียกว่าการอนุมานอย่างมีเหตุผล ซึ่งสามารถไปถึงจุดนั้นได้ด้วยการสังเกตปรากฏการณ์และตัดเงื่อนไขที่เป็นไปไม่ได้ออกไป\n\n‘อเล็กซานเดอร์พูดถูก\n\nคิดไม่ถึงว่าจะมีเทพที่ถูกผนึกอยู่จริงๆ แถมยังอยู่ใต้สถาบันการศึกษาเสียด้วย\n\nนี่คือสเตจที่สองงั้นหรือ? สำหรับพวกทายาทของปาร์ตี้ผู้กล้า?\n\nไม่สิ ระดับความยากมันสูงเกินไปสำหรับเรื่องแบบนั้น สเตจแรกก็ยากมากอยู่แล้ว แต่กรณีนี้มันคนละระดับกันโดยสิ้นเชิง\n\nบางทีนี่อาจจะถูกวางไว้เป็นอีเวนต์ลับที่จะปรากฏขึ้นในภายหลัง และด้วยความบังเอิญอันน่าประหลาด มันจึงเผยตัวออกมาให้ฉันเห็น’\n\nอีวานจ้องเขม็งไปยังรูปปั้นพลางกำด้ามดาบไว้แน่น ราวกับไม่ยอมปล่อยให้ตัวเองละสายตาหรือคลายมือออกจากดาบ พลังอันไร้ผู้ทัดเทียมได้เข้ายึดกุมร่างกายของเขาไว้\n\n[ในโลกที่หลงเหลือเพียงผู้ที่มองเห็นปรากฏการณ์หนึ่งและเข้าใจสัจธรรมเพียงหนึ่ง กับเหล่าผู้เผยแพร่ลวงโลกที่ป่าวประกาศว่าสิ่งเดียวเท่านั้นคือความจริง ช่างเป็นความทุกข์ทรมานเพียงใดที่ต้องถือกำเนิดมาพร้อมคุณสมบัติในการมองเห็นภูมิปัญญาอันแท้จริง เด็กน้อยเอ๋ย ข้ารู้ถึงความกังวลใจของเจ้า]\n\nดวงตาของรูปปั้นจ้องมองอีวานแล้วบิดเบี้ยวเป็นสีหน้าอันผิดเพี้ยน\n\nมันเป็นรอยยิ้มอันประหลาด ราวกับกำลังฝืนเลียนแบบสีหน้าของมนุษย์\n\nอีวานจ้องมองรูปปั้นอย่างไร้ความรู้สึกพลางค่อยๆ กระชับมือที่กำด้ามดาบให้แน่นขึ้น เขายังคงไม่ขยับเขยื้อน\n\n‘ศาสนจักรไม่มีทางวางกับดักเอาไว้แน่’\n\nอีวานเป็นคนที่ต้องตั้งคำถามและสืบสาวหาเหตุผลจากความระแวงเสมอ แม้จะเป็นเบาะแสเพียงเล็กน้อยก็ตาม ชีวิตทั้งชีวิตของเขาบีบบังคับให้ต้องคิดเช่นนี้ ไม่มีสิ่งใดสังหารทหารในสมรภูมิได้ง่ายดายไปกว่าคำว่า “ความมั่นใจจนเกินเหตุ” อีกแล้ว\n\nดังนั้น อีวานจึงอนุมานได้ทันทีที่เห็นกับดักนี้ หากตั้งสมมติฐานว่า “บางสิ่ง” ถูกผนึกอยู่ในสถานที่แห่งนี้ ย่อมไม่มีเหตุผลใดที่จะต้องบิดเบือนการรับรู้อย่างแยบยลเพื่อปลดปล่อยผนึกนั้นออกมา\n\nเช่นนั้นข้อสรุปจึงเรียบง่าย เมื่อสองพันปีก่อน ผนึกนี้ไม่เคยมีกับดักเช่นนี้อยู่เลย\n\n“สิ่งก่อสร้าง” ทุกประเภทล้วนมีอายุขัยอย่างหลีกเลี่ยงไม่ได้ โบราณสถานที่ขาดการบำรุงรักษาอย่างต่อเนื่องย่อมต้องพังทลายลงตามกาลเวลา ด้วยเหตุนั้น หากผนึกนี้ได้ “คลายตัว” ลงในแง่ใดแง่หนึ่ง\n\nหากในระหว่างนั้น “บางสิ่ง” ที่ถูกผนึกอยู่ได้แผ่อิทธิพลออกมาและวางกับดักบางอย่างไว้ในโบราณสถานแห่งนี้\n\nหากมันชักนำให้ใครสักคนปลดผนึกของตนเองออกอย่างสมบูรณ์ โดยเฉพาะอย่างยิ่งเมื่อมันไม่ใช่กับดักที่ใช้เวทมนตร์\n\nหากอนุมานเงื่อนไขเหล่านี้ได้แล้ว ใครก็ตามที่ยังไม่สามารถปะติดปะต่อเรื่องราวทั้งหมดได้ก็คงไม่ใช่มนุษย์โลกแล้วล่ะ มนุษย์โลกทุกคนต่างรู้จักสูตรสำเร็จประเภทนี้ รู้จัก “สามัญสำนึก” แบบนี้กันทั้งนั้น\n\nบนโลกมนุษย์ในศตวรรษที่ 21 สถานการณ์เช่นนี้ย่อมถูกอธิบายว่า “ดันเจี้ยนใต้ดินที่มีเทพอสูรโบราณถูกผนึกไว้” เป็นสถานการณ์ที่พบเห็นได้ทั่วไปในเกมแนว Hack-and-Slash Action RPG\n\n[ความคิดของเจ้าถูกต้องแล้ว]\n\nรูปปั้นเอ่ยต่อด้วยรอยยิ้มอันประหลาดของมัน\n\n[ใช่ การอนุมานของเจ้าแม่นยำ และความคิดที่เจ้ากำลังจะมีต่อจากนี้ก็ถูกต้องเช่นกัน ข้าคือผู้ที่พวกเจ้าเคยสรรเสริญว่าเป็นเทพเจ้า ประณามว่าเป็นปีศาจร้าย และกำลังจะถูกแซ่ซ้องอีกครั้งในฐานะผู้ช่วยให้รอดของพวกเจ้า ข้ามีนามมากมาย แต่เจ้าอาจเรียกข้าว่า ‘ความรอด’ ก็ได้ ข้ารู้ถึงความปรารถนาที่เจ้าเก็บงำไว้ จงปรารถนาอย่างเที่ยงธรรม แล้วมันจักสัมฤทธิ์ผล]\n\nอีวานมองรูปปั้นด้วยสายตาแห้งแล้งไร้แวว\n\nรูปปั้นเอ่ยด้วยน้ำเสียงที่เจือไปด้วยเสียงหัวเราะ\n\n[จงดึงมันออกมา แล้วเจ้าจักได้รับ เฉกเช่นที่เหล่าผู้พเนจรอย่างพวกเจ้าทำมาโดยตลอด เจ้าเองก็กำลังเร่ร่อน โหยหาดวงดาวอันไกลโพ้นอยู่ไม่ใช่หรือ? ข้าขอบอกแก่เจ้าว่าเจ้าจักได้รับสิ่งที่เจ้าแสวงหามาตลอดชีวิต จงยกมือขึ้นแล้วดึงมันออกมาเสีย]\n\nกริ๊ก ดาบเหล็กกล้าในกำมือของอีวานกระตุกสั่นขึ้นมา\n\nอ้อ ใช่แล้ว การล่อลวง\n\nการล่อลวงที่จะส่งเขากลับไปยังโลกมนุษย์ และสิ่งแลกเปลี่ยนมีเพียงแค่การดึงดาบเล่มนี้ออกมาเท่านั้น\n\nช่างเรียบง่ายและเย้ายวนใจเสียจริง\n\nอีวานยังคงยืนนิ่ง ไม่ยอมคลายมือที่กำด้ามดาบ\n\n[เจ้าขัดขืนงั้นรึ? เป็นเพราะความผูกพัน ความเวทนา ความอาลัยอาวรณ์? หรือว่า... ความหวาดกลัว?]\n\n“เปล่า”\n\nอีวานเอ่ยปากพูดขณะข่มแขนที่พยายามจะยกขึ้นเองโดยอัตโนมัติเอาไว้อย่างสุดกำลัง\n\n“คำพูดของแกมันโกหก”\n\n[เจ้าไม่มีศรัทธางั้นรึ? เหมือนพวกเผยแพร่ลวงโลกเหล่านั้นน่ะหรือ?]\n\n“ไม่ใช่”\n\nอีวานค่อยๆ หลับตาลง\n\nกร๊อบ ฉีกกระชากประสาทการได้ยินของตนเองจนขาดสะบั้น\n\nพรืด ถอดถอนประสาทรับกลิ่นของตนเองจนดับวูบ\n\n“ถ้าแกอ่านความคิดของฉันได้จริงๆ และรู้จักบ้านเกิดของฉัน ในกับดักนี้มันคงต้องมีของที่ดีกว่าแค่หวีโง่ๆ แล้วล่ะ ถ้างั้นมันคงจะอันตรายมากทีเดียว”\n\nหากข้าวของจากโลกมนุษย์กองสุมอยู่ราวกับภูเขา อีวานคงไม่มีวันต้านทานได้แน่\n\nการที่มันไม่อาจแสดงวิธีการง่ายๆ อย่างสิ่งที่เขาโหยหาอย่างแท้จริงออกมาได้ ย่อมเป็นตัวกำหนดขีดจำกัดของตัวตนนี้\n\nเป็นเพียงแค่หวี ของประดับชิ้นเล็กๆ ราคาถูกและไร้ความหมายเหล่านั้นคือขีดจำกัดของตัวตนนี้\n\nมันไม่อาจระลึกถึงโลกมนุษย์ได้ ไม่อาจสร้างข้าวของจากโลกมนุษย์ขึ้นมาได้\n\nนั่นหมายความว่ามันก็ไม่มีความสามารถพอจะส่งเขากลับไปยังโลกมนุษย์ด้วยเช่นกัน\n\n[ผู้คนส่วนใหญ่ที่เผชิญหน้ากับข้าต่างเริ่มต้นด้วยความกังขา ก้าวผ่านไปสู่ความมั่นใจ และท้ายที่สุดก็หลงเหลือเพียงคำสรรเสริญ เจ้าเองก็จักเป็นเช่นเดียวกัน]\n\n“แกถูกผนึกด้วยน้ำมือของมนุษย์”\n\nอีวานเอ่ยอย่างเฉยเมย ไม่คิดจะใส่ใจคำพูดเพ้อเจ้อของรูปปั้นแม้แต่น้อย\n\n[อะไรนะ...?]\n\n“หากซากกระดูกในสถานที่แห่งนี้คือร่องรอยของผู้คนในยุคโบราณ”\n\nกองซากกระดูกที่อีวานมองเห็นในที่สุดหลังจากทำลายภาพลวงตาลงได้ ล้วนมีโครงสร้างกระดูกของมนุษย์ ทั้งรูปทรงของแขนขา โครงสร้างของกระดูก แม้กระทั่งความยาวของแต่ละส่วนก็เป็นของมนุษย์โดยสมบูรณ์\n\nดังนั้น เมื่ออนุมานดูแล้ว สิ่งนี้ย่อมถูกผนึกด้วยน้ำมือของมนุษย์\n\nเขารู้จักตัวตนที่ถูกกราบไหว้บูชาประดุจเทพเจ้าทั้งที่ยังมีชีวิตอยู่ และเขายังเคยเผชิญหน้ากับตัวตนเหล่านั้นบางรายมาแล้วด้วยซ้ำ\n\nเจ็ดขุนพลมังกรและจอมมาร\n\nจอมทัพผู้ครองความเป็นใหญ่แห่งแต่ละเผ่าพันธุ์ ราชันผู้ยิ่งใหญ่ที่ปกครองด้วยพลังเฉพาะตัวอันมหาศาลเหนือคนทั้งเผ่าพันธุ์\n\nและกระทั่งจอมมารผู้สยบเจ็ดราชันเหล่านั้นไว้ใต้บัญชา จนได้รับการแซ่ซ้องในท้ายที่สุดว่าเป็นจักรพรรดิแห่งเจ็ดเผ่าพันธุ์\n\nพวกมันทั้งหมดล้วนเป็นเทพเจ้าในวิถีของตนเอง เป็นตัวตนอันไม่อาจเอื้อมถึง\n\nกองทัพนับหมื่นนับแสนพินาศย่อยยับต่อหน้าเจ็ดขุนพลมังกร อาณาจักรกว่าครึ่งในบรรดายี่สิบกว่าอาณาจักรสูญหายไปในหน้าประวัติศาสตร์ และจำนวนมนุษย์ที่ล้มตายลงก็มากเกินกว่าจะนับไหว เกินกว่าครึ่งหนึ่งเลยทีเดียว\n\nมันเป็นยุคสมัยอันแสนโหดร้าย ยุคที่ไม่มีใครสามารถต่อกรได้ ยุคที่เหตุผลในการจับอาวุธมิใช่เพื่อชัยชนะ แต่เพื่อความอยู่รอด\n\nในห้วงเวลาที่ทุกคนต่างกระซิบถ้อยคำแห่งความสิ้นหวัง ผู้กล้าก็ได้ปรากฏตัวขึ้น\n\n***\n\nอีวานเข้าใจแล้วถึงขุมพลังอันไร้ผู้ทัดเทียมที่กำลังกดทับมือของเขาไว้\n\nมันคือ “ความสุข” ความสุขตามสัญชาตญาณที่ปิดกั้นไม่ให้เขาจินตนาการถึงสิ่งอื่นใดได้อีกนอกจากการชักดาบออกเพื่อทำลายผนึก เป็นความสุขสุดยอดดุจเสียงกระซิบจากนรกหรือท่วงทำนองแห่งสรวงสวรรค์\n\nทว่ามือของอีวานก็ยังคงไม่ขยับเขยื้อน\n\nช้าๆ นิ้วมือทีละนิ้วค่อยๆ คลายตัวออก เหล่านิ้วมือที่เคยกำด้ามดาบไว้แน่น หลุดออกอย่างยากลำบากทว่ามั่นคง ราวกับถูกทากาวติดไว้\n\nเพราะเขายังจดจำผู้กล้าได้\n\n***\n\nเขานึกถึงผู้กล้า\n\nผู้กล้าไม่ได้จับดาบขึ้นมาเพื่อความสุขของตนเอง\n\nในคราแรกที่ผู้กล้าฟาดฟันหนึ่งในเจ็ดขุนพลมังกรลงได้ สิ่งที่เขานำพากลับมามิใช่เพียงศีรษะที่ถูกตัดขาด แต่มันคือความหวัง\n\nเขากวัดแกว่งดาบเพื่อความหวัง ดุจการเฝ้ามองดวงดาวท่ามกลางเมฆหมอกหนาทึบในคืนเดือนมืด\n\nหากให้คาดเดาว่าความหวังที่เขาปรารถนาคือสิ่งใด บางทีมันอาจจะเป็นสันติสุขสำหรับทุกคน\n\nอีวานเป็นคนเห็นแก่ตัว ดังนั้น เขาไม่อาจโอบอุ้มความหวังเฉกเช่นเดียวกับผู้กล้าได้ ความหวังของเขามีไว้เพื่อตัวเขาเองเพียงผู้เดียวเท่านั้น\n\nความปรารถนาที่จะได้กลับไปยังโลกมนุษย์\n\nสิ่งนั้นยังหมายถึงอีกนัยหนึ่งไปพร้อมกันว่า ในโลกใบนี้ ในโลกแฟนตาซียุคก่อนสมัยใหม่อันล้าหลังใบนี้ ไม่มีความสุขอยู่เลยแม้แต่น้อย\n\n[อะไรกัน...? เจ้ากำลังทำอะไร...?! มนุษย์จะคิดแบบนี้ได้อย่างไร...!]\n\nมือซ้ายของเขาได้รับอิสรภาพในที่สุด\n\nเขายกมันขึ้น เพิกเฉยต่อเสียงกรีดร้องของกล้ามเนื้อและเส้นประสาทที่อ้อนวอนขอพักผ่อน ร้องขอให้หยุด\n\nเพิกเฉยต่อเสียงกระซิบแห่งความเหนื่อยล้า ที่พร่ำบอกว่าการได้พักเพียงชั่วครู่นั้นแสนหวานปานใด\n\n[หยุดนะ หยุด...!! ฟังข้าก่อน!!]\n\n“ไม่”\n\nมือขวาของเขาได้รับอิสรภาพ\n\nไม่มีความสุขใดในดินแดนแห่งนี้ มีเพียงหน้าที่เท่านั้น\n\nเขาเพียงทำในสิ่งที่จำเป็นต้องทำ นอกเหนือจากนั้น ความยินดีใดๆ ที่เขาพอจะนึกฝันได้เพื่อตนเองได้ตายจากไปหมดแล้วตลอด 30 ปีที่ผ่านมา\n\nมือทั้งสองข้างของเขาค่อยๆ ยกขึ้น จับเข้าที่ศีรษะของรูปปั้น\n\n[หยุดนะ หยุดเดี๋ยวนี้!! เจ้าฆ่าข้าไม่ได้! ข้าคือพระเจ้าของเจ้า!]\n\n“ฉันเคยเจอพวกที่เชื่อว่าตัวเองเป็นเทพเจ้ามาก่อนแล้ว”\n\nเส้นเอ็นในกำมือของอีวานบิดเกร็งราวกับอสรพิษ\n\n“พวกมันตายหมดแล้ว”\n\n***\n\nศีรษะของรูปปั้นหินแตกร้าวลงดังลั่นภายใต้แรงบีบของเขา\n\nอีวานเคยเผชิญหน้ากับตัวตนที่ถูกกราบไหว้บูชาดั่งเทพเจ้าทั้งที่ยังมีชีวิตอยู่ เขายังเคยพบปะพวกมันแบบตัวต่อตัวมาแล้วด้วยซ้ำ\n\nจอมมารและเจ็ดขุนพลมังกร\n\nและหนึ่งในนั้นก็สิ้นชีพลงด้วยน้ำมือของเขา\n\nดังนั้น การสังหารใครสักคนที่หลงเชื่ออย่างไร้ข้อกังขาว่าตนเองเป็นเทพเจ้า จึงไม่ใช่ครั้งแรกสำหรับเขา\n\nและอีวานเป็นคนยึดถือประสิทธิภาพ เขาจึงไม่รู้สึกว่ามีความยากลำบากใดๆ ในการทำสิ่งเดิมเป็นครั้งที่สอง\n\n***\n\nดังสนั่นกึกก้อง\n\nศีรษะของรูปปั้นหินอ่อนพังทลายป่นปี้ลงใต้มือทั้งสองข้างของเขา\n\n***\n\n**💬 ความคิดเห็นนักอ่าน:**\n- **@มือบีบรูปปั้น** (18 ชั่วโมงที่แล้ว • 👍 226): โคตรเดือด!! รูปปั้น 'ความรอด' (Salvation) อุตส่าห์ร่ายมนต์ลวงสร้างภาพโลกมนุษย์มาล่อ แต่พลาดตรงรายละเอียดสิ่งของยุคใหม่จนลุงจับไต๋ได้ ก่อนจะบีบหัวรูปปั้นหินอ่อนแหลกคามือเปล่าเลย!!\n- **@สายแกะลอร์_99** (17 ชั่วโมงที่แล้ว • 👍 169): อ่านประโยค \"ดังนั้น การสังหารใครสักคนที่หลงเชื่ออย่างไร้ข้อกังขาว่าตนเองเป็นเทพเจ้า จึงไม่ใช่ครั้งแรกสำหรับเขา\" แล้วขนลุกซู่... ในสงคราม 10 ปีก่อนลุงกับปาร์ตี้ผู้กล้าไปฆ่าตัวอะไรมาบ้างเนี่ย!\n- ↳ **@มังกรขี้เซา** (16 ชั่วโมงที่แล้ว • 👍 59): เหมือนคำพูดอเล็กซานเดอร์ตอนก่อนหน้านี้เลยเรื่องทวยเทพกับเศษเสี้ยวยักษ์โบราณ ปมค่อยๆ เชื่อมเข้าหากันแล้ว!\n- **@ฟาดด้วยขวานไม่คุย** (15 ชั่วโมงที่แล้ว • 👍 73): คนยึดถือประสิทธิภาพไม่เสียเวลาฟังตัวร้ายโม้นาน บีบหัวพังในหมัดเดียว จบ!"
