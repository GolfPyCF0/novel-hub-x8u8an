  "glossary": "# 📚 คัมภีร์ตัวละคร คำศัพท์ และสรรพนาม — 30 ปีผ่านไปนับจากบทนำ (30 Years Have Passed Since the Prologue)\n\n## ตัวละครหลัก\n- **อีวาน เปโตรวิช (Ivan Petrovich)** / **คิมซอนอู (Kim Sunwoo)** / **วานก้า (Vanka)** / **คิริลล์ (Kirill / Cyril — ชื่อศีลล้างบาป)**: พระเอก อายุ 34 ปี ชาวเกาหลีข้ามมิติจากปี 2021 มาเกิดใหม่ในโลกนี้ 30 ปีก่อน อดีตทหาร 18 ปี (ทหารเกณฑ์ -> ประจำการ -> **ร้อยเอก -> พันโท** แห่งหน่วยเก็บกวาด) ปัจจุบันเป็นผู้อำนวยการสถานเลี้ยงเด็กกำพร้าเซนต์วาซิลีซา และแฝงตัวเป็นคนสวนที่มหาวิทยาลัยเซนต์ยานสก์ **รูปลักษณ์และพลัง:** ผมสีดำ/สีถ่าน, **ดวงตาสีฟ้า / สีฟ้าคราม**, **มานาและอาวุธเรืองแสงสีฟ้า** ฉายา: *ลูกเขยพระราชา, คนตัดไม้, ผู้สังหารมังกรเจ็ดตัว, ผู้เป็นอมตะ, ทหารกองหนุน* (แพทริเซียเรียกว่า *บราเดอร์คิริลล์*; เว็บอื่น: *พี่ชายคิริลซ์*)\n  - **สรุปสรรพนามของอีวาน:**\n    - กับ **รุ่นน้อง/ยูจีน/ออสการ์/ดมิทรี/ศัตรู (เช่น ดิโอนาร์, อัสตุก)**: อีวานใช้ *ฉัน / นาย* (หรือเรียกชื่อ/ตำแหน่งอย่างเย็นชา); ศัตรูใช้ *ข้า / เจ้า* หรือ *ข้า / แก*\n    - กับ **อิซาเบลล์ / เอซิดิส / ลูเซีย**: อิซาเบลล์และเอซิดิสใช้ *หนู / คุณลุง* (ลงท้าย *ค่ะ / คะ*), ลูเซียใช้ *หนู / ศิษย์พี่เปโตรวิช* (ลงท้าย *ค่ะ / คะ*); อีวานเรียกชื่อหรือแทนตัวเองว่า *ฉัน / ลุง* ตามจังหวะสนิทสนม\n    - กับ **เอลิซาเวตา (คิริลลอฟนา)**: เอลิซาเวตาเรียกอีวานว่า *วานก้า (Vanka)* และใช้ *ข้า / เจ้า* (แม้หลังครองราชย์เป็น *ฝ่าบาท* ก็ยังใช้ *ข้า / เจ้า* กับอีวาน); อีวานเรียก *พันเอกคิริลลอฟนา* / *ฝ่าบาท* (ข้าราชบริพารอื่นทูล *ฝ่าบาท / พ่ะย่ะค่ะ / หม่อมฉัน*)\n    - กับ **ออสการ์**: ออสการ์เรียกอีวาน *คุณ* แทนตัว *ผม* ลงท้าย *ครับ*\n    - กับ **ดมิทรี / โอซิป / ยูจีน**: ดมิทรีเรียก *รุ่นพี่* (*ผม / คุณ*), โอซิปเรียก *ผู้หมวดเปโตรวิช*, ยูจีนเรียก *ลูกพี่*\n\n## ตัวละครรองและกลุ่มตัวละคร\n- **เอลิซาเวตา คิริลลอฟนา คราซิลอฟ (Elizaveta Kirillovna Krasilov)** / **คิริลลอฟนา (Kirillovna)** / **เอลิส (Elise)** *(เว็บอื่น: เอลิซาเบธ)*: อดีตผู้บังคับบัญชาของอีวาน (พันตรี -> พันเอก -> **อัครมหาเสนาบดี / Royal Chancellor**, **องค์หญิง / Her Highness**, และผู้สืบทอดราชบัลลังก์ / **ฝ่าบาท / Your Majesty** รวมถึง **อธิการบดีมหาวิทยาลัยเซนต์ยานสก์ (Chancellor)** ชั่วคราวในบทที่ 59) ฉายา: **“ริซ่าแห่งเหล็กกล้า” (Riza of Steel)** ตราประจำตัว: ดอกเบญจมาศ (ใช้ *ข้า / เจ้า* กับอีวาน; ให้คนในมหาวิทยาลัยเรียก *ท่านอธิการบดี*)\n- **กษัตริย์คิริลล์ที่ 2 (Kirill II)**: พระราชบิดาของเอลิซาเวตาและอเล็กซานเดอร์ (สละราชสมบัติในบทที่ 54)\n- **ดมิทรี เชอร์คาตอฟ (Dmitry / Dmitri Cherkatov)** *(เว็บอื่น: ดิมิทรี)*: พันโทแห่งกองบัญชาการต่อต้านข่าวกรอง รุ่นน้องหน่วยเก่าของอีวาน เรียกอีวานว่า *รุ่นพี่* (*ผม / คุณ*), ใช้ *ข้า / แก* กับคนทรยศ, ลูกน้องเรียก *ท่านพันโท* ลงท้าย *ครับ*\n- **มกุฎราชกุมารอเล็กซานเดอร์ คิริลโลวิช คราซิลอฟ (Crown Prince Alexander / Alexandr Kirillovich Krasilov)**: พระเชษฐาของเอลิซาเวตา อดีตผู้บัญชาการสูงสุดแนวรบตะวันตกเฉียงเหนือ และรัฐมนตรีว่าการกระทรวงการต่างประเทศ รูปลักษณ์ชายหนุ่มผมสีเงินตัดสั้น ปรากฏด้วย **การฉายภาพจิต (Astral Projection)** ใช้ *ข้า / เจ้า* กับอีวาน (อีวานพูดเย็นชา)\n- **มหาราชา (Great King)** / **สุริยราชา (Sun King)** / **จักรพรรดิสายฟ้า (Thunder Emperor)** / **หมีแห่งคราซิลอฟ (Bear of Krasilov)**: พระราชาองค์ก่อน/แนวทางพระราชาในอดีต ผู้ยกเลิกเกณฑ์จำกัดอายุมหาวิทยาลัยเซนต์ยานสก์ (ใช้ *ข้า / เจ้า* กับอีวาน; อีวานใช้ *กระหม่อม / ฝ่าบาท / พ่ะย่ะค่ะ*)\n- **ปาร์ตี้ผู้กล้า (Hero Party) และลูกหลาน/ศิษย์:**\n  - **ผู้กล้าแม็กซิมิเลียน (Maximilian)** — ฉายา **“จักรพรรดิทองคำ” (The Golden Emperor)** / **‘ผู้สังหารจอมมาร’ (‘Demon King Slayer’)** ท่า ‘ฟันผ่าท้องฟ้า’ / **‘ผ่าดาราประกายพรึก’ (‘Morning Star Slash’)** (“ผู้ที่ถูกดึงตัวมา” จากต่างโลก) | ภรรยา: **มารี (Marie)** | ลูกสาว: **อิซาเบลล์ เดอ เอตัวล์ (Isabelle de Etoile / เอซิดิสเรียกว่า เบลล่า Bella)** (อาชีพคู่: จอมเวทและนักรบ, ทิลเลส, ชอบชายกำยำเหมือนหมี, เรียกอีวาน *คุณลุง* / แทนตัว *หนู* / *ค่ะ-คะ*)\n  - **ดิอัน ออกัสต์ (Dian August)**: อัศวินองครักษ์สามัญชนของอิซาเบลล์จากทิลเลส\n  - **อัศวินจิลแบร์ (Jilber / Gil Ber)**: ดยุกผู้พิทักษ์ชายแดนทิลเลส, ภรรยา **จูเลีย (Julia)** | ลูกชาย: **ออสการ์ เดอ ซาติยง (Oscar de Sation)** (อัศวิน, ทิลเลส, เรียกอีวาน *คุณ* / *ผม* / *ครับ*)\n  - **จอมเวทเบโอลกริน กริเคนคอส (Beolgrin Grikenkos)** — ฉายา **‘ผู้ทำลายป้อมปราการ’ (Fortress Destroyer)** รักษาการประธานสภาองคมนตรีแห่งหมู่เกาะคาลีออน พลังเวทสีเขียวมรกต ใช้ ‘เวทย้ายวิญญาณ’ เรียกอีวานว่า *กองระวังหลังของพวกเรา* | ลูกสาว: **เอลเฟียรา กริเคนคอส (Elpheira Grikenkos)** (ที่ 1 สอบเข้าเซนต์ยานสก์, เชี่ยวชาญตีความเวทโบราณ & เวทป้องกัน, ใช้ *ดิฉัน / ฉัน / ค่ะ-คะ*, เลี้ยงสุนัขพูเดิลชื่อ **ท่านมงบล็อง / Lord Montblanc**)\n  - **กษัตริย์ไอนาร์ อูลริกส์สัน / ไอนาร์มหาราช (Einar Ulriksson / King Einar the Great / พาลาดินไอนาร์)** — ฉายา ‘จอมเชือด’ (Butcher) แห่งโดรอัน | ธิดาคนโต: **องค์หญิงเอซิดิส ไอนาร์สดอตตีร์ (Asidis Einarsdotir / เอซี่ Ecy / Esideth)** สาขาออร์เคสตรา (ไวโอลินตระกูล **สตราดิวาเรียส / Stradivarius** ชื่อ **พี่วีโอ / Vio-unnie** รุ่น 3, อาชีพคู่: กวีและเบอร์เซิร์กเกอร์, ใช้ *หนู / คุณลุง* / *ค่ะ-คะ* กับอีวาน)\n  - **‘คมดาบเงา’ เอนริเก้ / เอนริเก้ เซอร์เกเยฟนา (Shadow Blade Enrique / Enrique Sergeevna)**: แวมไพร์หญิงระดับตำนาน ตำแหน่งปาร์ตี้ผู้กล้า: **จอมโจร (Rogue)**, ท่านปรมาจารย์ใหญ่ (Grand Master) ผู้ก่อตั้งหน่วยเก็บกวาดและอาจารย์อีวาน, อาจารย์พิเศษวิชา *[ความเข้าใจในการต่อสู้ระยะประชิด 1]*, มีแผลเป็นรูปกางเขนที่ฝ่ามือ (ใช้ *ฉัน / นาย* กับอีวาน; อีวานใช้ *ผม / คุณ*) | ศิษย์: **ลูเซีย (Lucia)** ผมน้ำตาลเข้ม (โจร/นักฆ่า, เรียกอีวาน *ศิษย์พี่เปโตรวิช* / *หนู* / *ค่ะ-คะ*)\n  - **นักบุญหญิงแพทริเซีย (Saint Patricia / แพตตี้ Patty)**: คณบดี/อาจารย์วิชาเทววิทยา (Theology) มหาวิทยาลัยเซนต์ยานสก์ ผู้อุปถัมภ์สถานเลี้ยงเด็กกำพร้าเซนต์วาซิลีซา เรียกอีวานว่า *บราเดอร์คิริลล์*\n- **ฮิวโก้ (Hugo)**: หัวหน้ากลุ่มโจรผู้รับงานปล้น/ก่อการร้ายรถไฟสาย 12\n- **มอร์ด เอริกสัน (Mord Erikson)**: ฮัสคาลและพี่น้องร่วมสาบานของกษัตริย์ไอนาร์ เข้าปี 1 วิทยาลัยพลศึกษาเพื่อคุ้มกันเอซิดิส — สรรพนาม: ใช้ *ข้า / เจ้า*, ลูกศิษย์คณะอัศวินเรียก *ลูกพี่*, เรียกเอซิดิส *เอซี่*\n- **พริสซิลลา (Priscilla)**: ศิษย์เก่าสถานเลี้ยงเด็กกำพร้าเซนต์วาซิลีซา วัย 17 ปี\n- **อิคารัส (Icarus)**: ปีศาจมีเขา อดีตผู้บัญชาการกององครักษ์จักรวรรดิที่ 6 (6th Imperial Guards) ปัจจุบันอยู่สถานเลี้ยงเด็กกำพร้า (ลูกน้อง: **อินอฟ Inoff**)\n- **โอซิป โซเรนอฟ (Osip Sorenov)**: อดีตทหารหน่วยจู่โจมที่ 3 หน่วยเก็บกวาด ปัจจุบันเป็นสายลับใต้บังคับบัญชาดมิทรี เรียกอีวานว่า *ผู้หมวดเปโตรวิช*\n- **เชอร์โนวิกา (Chernovika)** และ **ซาชา (Sasha)**: อดีตเพื่อนร่วมรบใต้บังคับบัญชาอีวานที่เสียชีวิตในสงคราม\n- **ยูริ แฟรงก์ (Yuri Frank)** / **อียูริ (Lee Yuri)**: อันดับ 1 ปี 1 คณะอัศวิน (ทุนภาคปฏิบัติ) อดีตนักวาดภาพประกอบชาวเกาหลีใต้ (อายุ 29 ตอนข้ามมิติ, อยู่มา 4 ปี) จากเกมผู้ใหญ่ *[ฮวีจัก 3 (Huijak 3)]* ค่ายสถาบันนุงยอก\n- **เยฟเกนี โนวิคอฟ คารัมซิน (Yevgeny Novikov Karamzin)** / **ยูจีน (Eugene)** / **คิมยูจิน (Kim Yujin)**: ปี 1 คณะเทววิทยา ลูกคนเล็กตระกูลดยุกคารัมซิน ผู้ข้ามมิติจากปี 2022 (อายุ 31, อยู่มา 4 ปี) จากนิยาย *“นักดาบคลั่งแห่งดัชชีเหนือ”* (*[ไอ้สารเลวอัจฉริยะเพลงดาบแห่งดัชชีเหนือ]*) สกิล `[ความเชี่ยวชาญดาบ Lv 5]`, `[สัญชาตญาณขยายขอบเขต Lv 3]`, `[สัญชาตญาณเอาตัวรอด Lv 3]`, `[ฟาดฟันศักดิ์สิทธิ์]` (`[Sacred Strike]`), อวดอ้าง `[ย่างก้าวขนนก]`, ช่องเวทพาลาดิน และหน้าต่างสถานะ (*แถบห่วยแตก / หอกเฮงซวย*) — เรียกอีวานว่า *ลูกพี่* (ยูริเข้าใจผิดว่าเป็นสาย *โกลด์ซัน / คิมแทยัง*)\n- **เอิร์นเบิร์ต (Ernbert)**: คณบดีคณะเวทมนตร์ เผ่าเอลฟ์จากคาลีออน\n- **ออสวัลด์ อีสต์เบลเฟน (Oswald Eastbelfen)** / **พัคแจยอง (Park Jaeyoung)**: ปี 1 เอกเวทมนตร์จิตใจ (Mind Sorcery) ลูกชายรองไวส์เคานต์อีสต์เบลเฟน (คาลีออน) ผู้ข้ามมิติจาก พ.ค. 2023 (อายุ 27, อยู่มา 4 ปี) เคยอ่าน *[อัจฉริยะเวทมนตร์ผู้ถูกนางร้ายคลั่งไคล้เวทมนตร์ตามหลอกหลอน]* ใช้เวท `[ประทานความกล้า]` (`[Grant Courage]`), `[ชี้นำปัญญา]` (`[Wisdom Guidance]`), `[จิตเภท]` (`[Schizophrenia]`)\n- **เอเวอลิน รัสต์ฟิตซ์ (Evelyn Rustfitz)**: บุตรสาวประธานสภาองคมนตรี/ดยุกรัสต์ฟิตซ์แห่งคาลีออน อดีตคู่หมั้นผู้คลั่งไคล้ออสวัลด์\n- **เออร์เนสต์ (Ernest / Onerst)** และ **เซอร์เวลเชสต์ (Sir Veilchest)**: กัปตันเรือและนายทหารฝ่ายเทคนิคเรือประจัญบานลอยฟ้าชั้น **“วูล์ฟสทาล” (“Wolfstal”-class)** นาม **“เกียรติภูมิแห่งบอยล์” (“Glory of Boil”)** ของคาลีออน\n- **ลิลี ดาวเนอร์ (Lily Downer)** และ **มารี ฟิลลิปสัน (Marie Phillipson)**: ปี 2 คณะอัศวิน (เลเวล 32 และ 29)\n- **นิโคไล สโลโบดาโนวิช รยูริก (Nikolai Slobodanovich Ryurik)**: ทูตกระทรวงการต่างประเทศคราซิลอฟ\n- **ศาสตราจารย์โรเบิร์ต เซนนาร์ เดอ มอนดรังกี (Robert Sennar de Mondrangi)**: อาจารย์ปี 2 คณะอัศวิน (อดีตราชองครักษ์ทิลเลส)\n- **อาแลง (Alain)** และ **แพทริก (Patrick)**: นักศึกษาปี 1 คณะอัศวิน\n- **‘นักถักทอใย’ แห่งกองทัพมังกรที่ 5 (The 5th Dragon Corps, ‘Webmaker’)**: แม่ทัพมังกรฝ่ายจอมมาร (จาก **สงครามกังโด / Gangdo War**)\n- **ร้อยโทอาวุโสอัสตุก (Senior Lieutenant Astuk)**: ผู้บังคับกองพันที่ 3 หน่วยทหารช่าง ‘นักถักทอใย’ แห่งกองพลน้อยมังกรที่ 5 (ผู้นำกองกำลังคนแคระ)\n- **ดิโอนาร์ เอริกสัน (Dionarr / Dionar Eriksson)** *(เว็บอื่น: ไดโอนาร์)*: ฮัสคาลผู้ทรยศของไอนาร์ (น้องมอร์ด, บิดาเคยเป็นยาร์ล) ใช้ **เส้นด้ายเวทมนตร์** และ **ดาบใหญ่ (Greatsword)** — สรรพนามกับศัตรู/อีวาน: ดิโอนาร์ใช้ *ข้า / เจ้า* (หรือ *แก*), อีวานใช้ *ฉัน / นาย*\n- **ฤดูใบไม้ผลิของปวงชน (A spring for the citizens)**: องค์กรกบฏข้ามชาติที่อเล็กซานเดอร์หนุนหลัง\n- **เคานต์ยูซุฟ (Count Yusuf)** *(เว็บอื่น: ยูสฟ)*: ขุนนางและผู้บัญชาการกองทหารม้าแห่งพริตเชนคายา คนแรกในสภาขุนนางที่เข้าเฝ้าคุกเข่าถวายความภักดีต่อเอลิซาเวตาหลังทรงประกาศระบอบราชาธิปไตยภายใต้รัฐธรรมนูญ (บทที่ 58)\n\n## สถานที่และองค์กร\n- **อาณาจักรคราซิลอฟ (Krasilov Kingdom)** — เมืองหลวง: **พริตเชนคายา (Pritzenkaya / Prizhenkaya)** | จุดสำคัญ: **สวนสาธารณะกลางพริตเชนคายา (Pritzenkaya Central Garden)** (รูปปั้น **พระเจ้าอีวานมหาราช / King Ivan the Great**), **พระราชวังตะวันออก (East Palace)** (ที่ประทับเอลิซาเวตา), **ทำเนียบกระทรวงการต่างประเทศ (Ministry of Foreign Affairs Residence)**\n- **อาณาจักรโดรอัน (Droan Kingdom)**: บ้านเกิดไอนาร์และเอซิดิส (รถไฟสายที่ 12)\n- **อาณาจักรทิลเลส (Tilles Kingdom)** — เมืองหลวง: **ซังต์มาตีแลน (San Matilenne)** | หน่วย/พื้นที่: **กองพลรักษาการณ์ที่ 3 แห่งทิลเลส (Tilles's 3rd Guard Division)**, **กองพลป้องกันชายแดนคราซิลอฟ**, **กองบัญชาการป้องกันพริตเชนคายา**, **ป่าสนคราเชนรอฟ (Kraschenrov)**\n- **จักรวรรดิคาลีออน (Kalion Empire)**: จักรวรรดิบนเกาะอีกฟากของ **ทะเลดำ (Black Sea)**\n- **สถานีอิกอรอวิช (Igorovich Station)**: สถานีรถไฟชายแดนโดรอัน–คราซิลอฟ\n- **สถานเลี้ยงเด็กกำพร้าเซนต์วาซิลีซา (St. Vasilisha Orphanage)**: สถานเลี้ยงเด็กกำพร้าของอีวาน\n- **มหาวิทยาลัยเซนต์ยานสก์ (St. Yansk University)**: วิทยาลัยดุริยางคศิลป์ (Music College), วิทยาลัยพลศึกษา (Athletic College), คณะอัศวิน (Knight Department), คณะเทววิทยา (Theology Department), คณะเวทมนตร์ (Magic Department)\n- **หน่วยควบคุมเขตฟื้นฟูและพิสูจน์ฝ่ายศัตรู (Restoration Zone Control and Enemy Faction Identification Unit)** / **หน่วยเก็บกวาด (Cleanup Unit)**\n- **หมวดทหารช่างที่ 7 กองพันที่ 3 กองร้อยที่ 12**: หน่วยขุดอุโมงค์คนแคระใต้แม่ทัพมังกรที่ 5\n- **สหราชอาณาจักร (United Kingdoms — 12 ชาติ)** และหน่วยข่าวกรอง 4 มหาอำนาจ (โดรอัน, คาลีออน, ทิลเลส, คราซิลอฟ: **‘เหล่าบุตรแห่งเอนริเก้’ / Enrique’s Children** -> หน่วยเก็บกวาด -> **กองบัญชาการต่อต้านข่าวกรองคราซิลอฟ**)\n- **สุสานแห่งชาติคราซิลอฟแห่งพริตเชนคายา (Krasilov National Cemetery of Pritzenkaya)**\n- **เป้าหมายระเบิดพริตเชนคายา (บทที่ 50):** **ธนาคารกลางพริตเชนคายา (Pritzenkaya Central Bank)**, **โรงละครทรงกลมซาเทรา (Satera Circular Theater)**, **มหาวิทยาลัยเซนต์ยานสก์**, **มหาวิหารเซนต์เชเรห์ตา (Cathedral of Saint Cherehta)**, **สถานีตำรวจกลางพราเชนโกเหนือ (North-Prachenko Central Police Station)**\n- **กองพลรักษาการณ์นครหลวง (Capital Guard Division)** และ **กองบัญชาการต่อต้านข่าวกรอง (Counterintelligence Command / Headquarters)**\n\n## คำศัพท์เฉพาะ\n- **ดูแคต (Ducat)**: สกุลเงิน (เงินเดือนทหารเกณฑ์ 15 ดูแคต)\n- **บทวิจารณ์ 5,700 ตัวอักษร (5,700-character critique)**: เงื่อนไข/มุกการข้ามมิติของชาวเกาหลีใต้\n- **วันเปิดภาคเรียนมานลิตา (Manlita opening day)**: วันเปิดภาคเรียนมหาวิทยาลัยเซนต์ยานสก์\n- **ทัณฑ์อินทรีโลหิต (Blood Eagle)**: ธรรมเนียมโทษประหารของโดรอัน\n- **การตรวจจับแนววิถีกระสุน (Line of Fire Detection)** และ **จิตสังหาร (‘life’)**: ความสามารถตรวจจับจิตสังหารและวิถีกระสุน\n- **ยาร์ล (Jarls) / เกชิน (Geshins) / ฮัสคาล (Huscals)**: ผู้นำชนเผ่าและเหล่านักรบองครักษ์ผู้ภักดีของโดรอัน\n- **ผู้ปีนหอคอยจอมมาร (Climber of Demon King’s Tower)** และ **“ผู้ที่ถูกดึงตัวมา” (“Those who were drawn”)**: นิยามผู้ข้ามมิติจากต่างโลก\n- **การกำหนดตำแหน่งด้วยเสียงสะท้อน (Resonance Positioning)**: การฟังคลื่นเสียงสะท้อนระบุตำแหน่งในที่มืด\n- **ชมรมอาสาสมัคร (Volunteer Club)**: ชื่อชมรมผู้ข้ามมิติทั้ง 4 คน (ยูจีนอยากตั้งว่า *กลุ่มผู้รักชาติเกาหลี / Korean Patriots*)\n- **‘เวทย้ายวิญญาณ’ (‘Soul Transfer Spell’)** และ **‘ผู้ก้าวข้ามขีดจำกัด’ (‘Transcendent’)**: เวทในลูกแก้วของเบโอลกริน และระดับยอดฝีมือที่รับรู้ห้วงเวลาเป็นไมโครวินาที\n- **โบราณวัตถุขุดเจาะของคนแคระ (Dwarven Excavation Artifact / Drilling Artifact)**: เครื่องจักรกลโบราณสำหรับขุดเจาะและถล่มชั้นดินขนาดมหึมาของเผ่าคนแคระ (ใช้โจมตีใต้ดินพริตเชนคายาและสูญหายเข้าไปในโพรงอาคมโบราณเบื้องล่างมหาวิทยาลัยเซนต์ยานสก์)\n- **การแยกส่วนห้วงเวลา (Temporal Dissociation)**: การเร่งระบบประสาทด้วยพลังเวท (ประสาทหู 0.1 วิ, ประสาทสัมผัส 0.25 วิ) ประตูสู่ระดับ ‘ผู้ก้าวข้ามขีดจำกัด’\n- **ขอบเขตของผู้เหนือมนุษย์ (Realm of the Superhuman / Domain of the Transcendent)**: ขั้นเสริมประสาทสัมผัสจนมองเห็น ‘รอยกลิ่น’ ในอากาศเป็นแสงเรืองรอง\n- **เครื่องขุดเจาะทลายปฐพี (Earthbreaker Excavator)**: เครื่องขุดอุโมงค์ขนาดใหญ่ของเผ่าคนแคระ\n- **ตัวสำรอง / ตัวสำรองผู้กล้า (Reserve Force / Hero Reserve Force)**: ยอดมนุษย์สำรองสำหรับปาร์ตี้ผู้กล้า (เกิดจากอีวาน)\n- **สัญชาตญาณ (Intuition)**: ทักษะหยั่งรู้การลอบโจมตีของยอดมนุษย์\n- **วิชา ‘ผ่าเกราะคนแคระ’ (‘Dwarf Armor Splitting’)** และ **สงครามเหมืองแร่ (Mine War)**: ยุทธวิธีและสมรภูมิสู้คนแคระในอุโมงค์เมื่อ 10 ปีก่อน\n- **แนวกลุ่มดาว (Constellation story)**: แนวเรื่องราวที่มีทวยเทพ/เศษเสี้ยวยักษ์โบราณดึงผู้ข้ามมิติมาร่วมเล่นบนกระดานเกม (กลับบ้านได้เมื่อถึงหน้าสุดท้าย)\n- **ภาษาเดเลนโบราณ (Ancient Delen)** / **จักรวรรดิเดเลนตะวันออก (Eastern Delen Empire)** และ **เทพแห่งแสง (God of Light)**: ภาษาคัมภีร์โบราณยุคจักรวรรดิเดเลนตะวันออก (ราว 2,000 ปีก่อน) ที่นักบวชเรียนขั้นพื้นฐาน และเทพเจ้าหลักของสหราชอาณาจักร\n- **ลอเรน (Loraine)**: สมุนไพร/ของวิเศษล้ำค่าที่ช่วยยืดอายุขัยได้ถึง 10 ปี (ปรากฏในภาพลวงตาความปรารถนาของเอลเฟียรา)\n- **‘ความรอด’ (Salvation)**: เทพอสูรโบราณในรูปปั้นหินอ่อนสีดำที่ถูกศาสนจักรยุคเดเลนตะวันออกผนึกไว้ใต้มหาวิทยาลัยเซนต์ยานสก์ด้วยดาบเหล็ก (ใช้ภาพลวงตาความสุขและคำสาปความทุกข์)\n\n## 🔄 ตารางเทียบชื่อมาตรฐานจากต้นฉบับภาษาอังกฤษ (`source_en/`)\n*(ปรับมาตรฐานทุกตอนตั้งแต่บทที่ 1–63 ให้ตรงกับต้นฉบับหลัก `source_en/chXXX_en.txt` ควบคู่กับความแม่นยำทางภาษาแล้ว **บทที่ 64+ ให้ยึดชื่อไทยที่ล็อกไว้ในตารางนี้เสมอ**)*\n- `Kim Seon-woo` → **คิมซอนอู**\n- `Vanka` → **วานก้า**\n- `Brother Cyril / Kiril` → **บราเดอร์คิริลล์**\n- `Asidis` / `Esideth` → **เอซิดิส (เอซี่)**\n- `Dian August` → **ดิอัน ออกัสต์**\n- `Einarr` / `Einar` → **ไอนาร์**\n- `Droan` → **อาณาจักรโดรอัน**\n- `Tilles` → **อาณาจักรทิลเลส**\n- `San Matilenne` → **ซังต์มาตีแลน**\n- `Pritzenkaya` → **พริตเชนคายา**\n- `St. Vasilisha Orphanage` → **สถานเลี้ยงเด็กกำพร้าเซนต์วาซิลีซา**\n- `Igorovich Station` → **สถานีอิกอรอวิช**\n- `Jarls` / `Huscals` → **ยาร์ล** / **ฮัสคาล**\n- `Counterintelligence Command` → **กองบัญชาการต่อต้านข่าวกรอง**\n- `Cleanup Unit` / `Annihilation Squad` → **หน่วยเก็บกวาด**\n- `Seven Dragon Generals` / `Seven Dragon Lords` → **เจ็ดขุนพลมังกร / เจ็ดราชามังกร**\n- `Beolgreen` / `Beolgrin` → **เบโอลกริน กริเคนคอส**\n- `Elfihera` / `Elpheira` → **เอลเฟียรา กริเคนคอส**\n- `Dionarr` → **ดิโอนาร์**\n- `Yevgeny Novikov Karamzin` → **เยฟเกนี โนวิคอฟ คารัมซิน**\n- `Evelyn Rustfitz` → **เอเวอลิน รัสต์ฟิตซ์**\n- `Astuk` → **อัสตุก**\n- `Gil Ber` / `Oskar de Satieon` → **อัศวินจิลแบร์** / **ออสการ์ เดอ ซาติยง**\n- `Reserve Force` / `Hero Reserve Force` → **ตัวสำรอง / ตัวสำรองผู้กล้า**\n- `Domain of the Transcendent` → **ขอบเขตของผู้เหนือมนุษย์**\n- `Constellation story` → **แนวกลุ่มดาว**\n- `St. Yansk University` / `Rector` → **มหาวิทยาลัยเซนต์ยานสก์** / **อธิการบดี**\n- `Excavation Artifact` / `Drilling Artifact` → **โบราณวัตถุขุดเจาะ**\n- `Northwestern Front` → **แนวรบตะวันตกเฉียงเหนือ**\n- `Lieutenant Colonel` / `Captain` (ยศอีวาน) → **พันโท** / **ร้อยเอก**\n- `Rogue` (อาชีพเอนริเก้ในปาร์ตี้ผู้กล้า) → **จอมโจร**\n- `Status Window` → **หน้าต่างสถานะ**\n- `Episode X: ...` / `Stage` / `Event` / `Easter egg` → **เอพพิโซด X: ...** (ท้ายบทใช้ `**เอพพิโซด <เลข>: <ชื่อตอน>**`) / **สเตจ** / **อีเวนต์** / **อีสเตอร์เอ้ก**\n- `Author's Note` → **`***` ตามด้วย `**หมายเหตุผู้เขียน:**`** (แปลครบทุกบรรทัด)\n",
  "story_memory": "# 🧠 เรื่องย่อสะสมแต่ละตอน — 30 ปีผ่านไปนับจากบทนำ (30 Years Have Passed Since the Prologue)\n\n## 📌 สรุปภาพรวมเนื้อเรื่องและสถานะปัจจุบัน (Arc & Current State Summary — อัปเดตถึงบทที่ 69)\n- **ตัวตนและบทบาทพระเอก:** คิมซอนอู (นักศึกษาเกาหลีใต้) เกิดใหม่เป็น **อีวาน เปโตรวิช** อายุ 34 ปี ใช้ชีวิต 30 ปีในต่างโลก (ทหารเกณฑ์ 18 ปี -> พันโทหน่วยเก็บกวาด -> ผู้อำนวยการสถานเลี้ยงเด็กกำพร้าเซนต์วาซิลีซา) ถูกส่งแฝงตัวเป็น “คนสวน” ที่มหาวิทยาลัยเซนต์ยานสก์เพื่อคุ้มครองทายาทปาร์ตี้ผู้กล้า\n- **การเมืองคราซิลอฟ & ปริศนาใต้ดิน (ล่าสุดบทที่ 58–69):** **เอลิซาเวตา** ทรงปฏิเสธราชบัลลังก์สมบูรณาญาสิทธิราชย์แล้วประกาศปฏิรูปสู่ **ระบอบราชาธิปไตยภายใต้รัฐธรรมนูญ** รวบอำนาจทหาร-การคลัง-ข่าวกรองไว้ที่พระราชวังตะวันออกจนเหล่าขุนนางรวมถึง **เคานต์ยูซุฟ** ต้องศิโรราบ จากนั้นทรงเข้าคุมตำแหน่ง **อธิการบดีมหาวิทยาลัยเซนต์ยานสก์** ชั่วคราว ส่วน **อีวาน** จับกุมคนทรยศส่งให้ **ดมิทรี** รีดข้อมูลต่อ ก่อนรับภารกิจลับจากเอลิซาเวตาพา **เอลเฟียรา** ลงสำรวจวิหารโบราณอายุ 2,000 ปีใต้มหาวิทยาลัยเซนต์ยานสก์และทำลายเทพอสูรที่เรียกตนเองว่า **‘ความรอด’ (Salvation)** ลงได้สำเร็จ (จบเอพพิโซด 11) หลัง **แพทริเซีย** ช่วยถอนคำสาปความทุกข์ให้อีวานตลอดคืน เอลเฟียราก็ตั้งใจจะคอยดูแลฟื้นฟูความสุขให้อีวาน ขณะที่ **อิซาเบลล์** กับ **เอซิดิส** เห็นอีวานเดินออกมาจากบ้านเอลเฟียราตอนเช้าจึงเข้าใจผิดและจับมือเป็นพันธมิตรต่อต้าน “แม่มดเอลฟ์” ด้าน **เอนริเก้** กำลังไล่ล่าคนแคระและ **อเล็กซานเดอร์** ที่ร่วมมือกับ *ฤดูใบไม้ผลิของปวงชน* อยู่นอกวัง\n- **ปาร์ตี้ผู้กล้าและทายาท:** ผู้กล้า **แม็กซิมิเลียน** หายสาบสูญ 4 ปีหลังปราบจอมมาร (เบโอลกรินเผยว่ายังไม่หายไปไหน); **จอมเวทเบโอลกริน** ย้ายจิตทดสอบอีวานบนเรือรบคาลีออนและฝากลูกสาว **เอลเฟียรา** (ล่าสุดบทที่ 61–63: อีวานชวนเอลเฟียราลงสำรวจทางระบายน้ำใต้พริตเชนคายาจนพบโพรงเข้าถ้ำโบราณวัตถุและใช้ท่าเลียนแบบแม็กซิมิเลียนทดสอบแรงปะทะ ส่วนเอซิดิสเตรียมจดหมายขออนุญาตไอนาร์แต่งงานกับอีวาน); **เอนริเก้** (‘คมดาบเงา’) สอนที่สถาบันคู่กับศิษย์ **ลูเซีย**; **นักบุญหญิงแพทริเซีย** เป็นคณบดีคณะเทววิทยา; อีวานเพิ่งบุกทำเนียบกระทรวงการต่างประเทศสังหาร **ดิโอนาร์** และช่วย **เอซิดิส**, **อิซาเบลล์**, **ออสการ์** ออกมาได้ (เอซิดิสจำได้แล้วว่าอีวานคือ “คุณลุง” ที่เคยแนะนำไวโอลินเมื่อ 10 ปีก่อน ส่วนอิซาเบลล์กำลังหึงหวง/เข้าใจผิด)\n- **ความลับผู้ข้ามมิติ & แนวกลุ่มดาว:** อีวานรวมผู้ข้ามมิติชาวเกาหลีอีก 3 คนในสถาบัน (**ยูจีน**, **ยูริ**, **ออสวัลด์**) ตั้ง *ชมรมอาสาสมัคร* ใช้หน้าต่างเควสต์ของยูจีนจับทิศทางเรื่องราว; ท้ายบทที่ 57 อเล็กซานเดอร์ฉายภาพจิตเผยเบาะแสบันทึกต้องห้ามว่าโลกนี้เชื่อมโยงกับ **แนวกลุ่มดาว** (เศษเสี้ยวทวยเทพ/ยักษ์โบราณ) และผู้ที่พลิกหน้าสุดท้ายของเรื่องได้จึงจะกลับบ้านได้\n\n## 📖 บันทึกเหตุการณ์รายตอน\n- **บทที่ 1**: คิมซอนอูข้ามมิติมาเกิดใหม่ในร่างเด็กชายชาวนาชื่อ **อีวาน เปโตรวิช** โดยไม่มีหน้าต่างสถานะหรือความรู้เกี่ยวกับเรื่องราวของโลกใบนี้ เมื่ออายุ 14 ปี พ่อถูกเกณฑ์ไปรบและเสียชีวิต อีวานจึงสมัครเป็นทหารเพื่อส่งเงินให้แม่ เขาไต่เต้าจากทหารเกณฑ์จนได้เป็นทหารประจำการและเข้าสังกัด **หน่วยเก็บกวาด** ร่วมค่ายเดียวกับปาร์ตี้ผู้กล้า จนกระทั่งปราบจอมมารได้เมื่ออายุ 30 ปี แต่ฉากจบก็ไม่มาเสียที จึงปลดประจำการตอนอายุ 32 ปีมาเปิดสถานเลี้ยงเด็กกำพร้า จนอายุ 34 ปี (ครบ 30 ปีที่ข้ามมิติ) มีแขกจากวังหลวงมาหา ทำให้เขาเพิ่งรู้ตัวว่าโลกนี้อาจจะกำลังเข้าสู่แนว **สถาบันการศึกษา**\n- **บทที่ 2 (ทหารแก่ก็ต้องการพักผ่อน)**: นายทหารรุ่นน้องจากหน่วยเก่าลอบมาพบอีวานที่สถานเลี้ยงเด็กกำพร้าเซนต์วาซิลีซา พร้อมอัญเชิญจดหมายประทับตราขี้ผึ้งรูปดอกเบญจมาศจาก **เอลิซาเวตา คิริลลอฟนา คราซิลอฟ** (อดีตผู้บังคับบัญชา ฉายา “ริซ่าแห่งเหล็กกล้า” ปัจจุบันเป็นองค์หญิงและอัครมหาเสนาบดี) ในจดหมายขอร้องให้ \"วานก้า\" กลับมาช่วยดูแล \"สวน\" ที่กำลังเสื่อมโทรมท่ามกลางวิกฤตการเมืองที่มกุฎราชกุมารอเล็กซานเดอร์คิดขายชาติ รุ่นน้องเปิดเผยว่าปีนี้บรรดาลูกหลานและศิษย์ของสมาชิกปาร์ตี้ผู้กล้า รวมถึงตัวนักบุญหญิงแพทริเซียเอง ต่างพากันเข้ามาเรียนและสอนที่ **มหาวิทยาลัยเซนต์ยานสก์** อีวานจึงถูกส่งเข้าไปเป็น \"คนสวน\" เพื่อคอยคุ้มครองและจับตาดูคนเหล่านั้นไม่ให้เกิดเรื่องลุกลามเป็นสงครามระหว่างประเทศ อีวานจำใจรับพระบัญชา โดยหวังว่าอดทนอีกแค่ 3 ปีคงจะได้เห็นฉากจบเสียที\n- **บทที่ 3**: อีวานขุดคุ้ยความทรงจำของคิมซอนอูเพื่อวิเคราะห์สูตรสำเร็จของนิยายแนวสถาบันการศึกษา (ทั้งปีศาจแอบแฝง คนทรยศในคณาจารย์ ห้องลับ สายลับรัฐบาล และเงื่อนไขฉากจบที่อาจเป็นการคืนชีพของจอมมาร) เขาฟันธงว่า \"รถไฟรับนักเรียนเข้าสถาบัน\" จะต้องโดนก่อการร้ายแน่นอน ฝั่งอาณาจักรโดรอัน **องค์หญิงเอซิดิส** ธิดาของกษัตริย์ไอนาร์ (ผู้สอบติดสาขาออร์เคสตรา มหาวิทยาลัยเซนต์ยานสก์) ขึ้นรถไฟออกเดินทางก่อนใคร สองวันต่อมารถไฟขบวนนั้นก็ตกรางใกล้ชายแดนคราซิลอฟ อีวานจึงคว้าปืนพกและขวานออกปฏิบัติการทันที\n- **บทที่ 4**: อีวานวิเคราะห์เส้นทางรถไฟสาย 12 ร่วมกับรุ่นน้อง (**ดมิทรี เชอร์คาตอฟ**) และฟันธงว่าจุดก่อการร้ายจะอยู่ที่ **สถานีอิกอรอวิช** ใกล้ชายแดนก่อนเข้าสู่เขตทหารสามเขตของคราซิลอฟ เพื่อป้ายความผิดและสร้างรอยร้าวระหว่างคราซิลอฟกับโดรอัน อีวานขึ้นรถไฟมุ่งหน้าไปชายแดนเพียงลำพังเพื่อคุ้มกันทั้ง 5 เส้นทาง ขณะเดียวกัน ดมิทรีกลับไปรายงาน **เอลิซาเวตา** (อัครมหาเสนาบดี) ที่พระราชวัง ซึ่งเธอสั่งให้ดมิทรีส่งคนติดตามบันทึกกิจวัตรประจำวันของวานก้าไว้ตลอดเวลา เมื่อสายลับของดมิทรีไปถึงสถานีอิกอรอวิช พวกเขาก็พบเพียงถุงใส่ศพ 3 ใบที่ห่อไว้อย่างเรียบร้อยและสถานที่เกิดเหตุที่ถูกเช็ดคราบเลือดจนสะอาด ส่วนอีวานกำลังวิ่งลัดเลาะป่าพร้อมขวานในมือ\n- **บทที่ 5**: ที่สถานีอิกอรอวิช อีวานสังเกตเห็นชายต้องสงสัย 3 คน (คนดูนาฬิกา-หนังสือพิมพ์, คนแกล้งหลับ, และพ่อค้าผักเหี่ยว) เมื่อทดสอบด้วยคำถามรหัสความภักดีแล้วพบว่าเป็นแค่ทหารรับจ้างไร้ฝีมือตรวจจับแนววิถีกระสุน อีวานจึงสังหารทั้ง 3 คนและรีดข้อมูลจากพ่อค้าผักก่อนฆ่าทิ้งจนรู้ว่ามีโจรอีก 15 คนดักปล้น \"รถไฟขนทองคำแท่ง\" อยู่ริมราง อีวานลบร่องรอยใน 5 นาทีและสะกดรอยตามสัญญาณเวทมนตร์ไป โดยตั้งใจปล่อยให้เหตุการณ์ก่อการร้ายรถไฟซึ่งเป็น \"ด่านฝึกสอนของตัวเอกทุกคน\" ดำเนินไป แต่ตัวเองจะคอยเก็บกวาดเบื้องหลังและสาวถึงตัวบงการแทน\n- **บทที่ 6**: หัวหน้าโจร **ฮิวโก้** กดจุดระเบิดทำให้รถไฟที่เอซิดิสโดยสารมาตกรางก่อนถึงสถานีอิกอรอวิช อีวานซุ่มยิงเก็บลูกสมุน 5 คนที่อยู่แนวหลังได้อย่างเฉียบขาดและจับเป็นฮิวโก้เพื่อทรมานรีดเบาะแสเกี่ยวกับผู้จ้างวาน (ไม่ฆ่าเพราะกะเก็บไว้เป็นบอสฝึกสอนให้ตัวเอก) บนรถไฟ **องค์หญิงเอซิดิส** ฟื้นขึ้นมาและคว้าไวโอลินขึ้นมากำด้ามราวกับขวานเตรียมสู้ ขณะเดียวกันที่ชายป่า นักรบ **ฮัสคาล** วัยสี่สิบกว่าปีซึ่งเป็น \"คุณลุง/พี่น้องร่วมสาบาน\" ของกษัตริย์ไอนาร์ (และแอบสอบเข้าเป็นนักศึกษาปี 1 วิทยาลัยพลศึกษาของมหาวิทยาลัยเซนต์ยานสก์ไว้ล่วงหน้า) ที่วิ่งเท้าเปล่าตามรถไฟมาตลอด 2 วัน เห็นรถไฟตกรางจึงพุ่งทะยานฝ่าป่าเข้าไปช่วยหลานสาวทันที\n- **บทที่ 7**: อีวานใช้วิธีสอบปากคำแบบยั่งยืนด้วยการราดโพชั่นรักษาบาดแผลสลับกับซักถามฮิวโก้ แต่ไม่พบเบาะแสเพิ่มเนื่องจากพวกโจรใส่เสื้อโค้ตหนาและใช้เวทมนตร์ปิดบังตัวตน ทันใดนั้น **ชายคนนั้น (คุณลุงฮัสคาล / มอร์ด)** พุ่งเข้ามาปะทะกับอีวานด้วยขวานเพราะเข้าใจผิดว่าอีวานเป็นพวกเดียวกับโจร ฝั่งเอซิดิสใช้ไวโอลินคู่ใจ (\"พี่วีโอ\") ฟาดหัวโจรจนไวโอลินพังยับและทำให้พวกโจรที่เหลือวิ่งหนีตายออกมาเจอทั้งสองคน เมื่อเอซิดิสปรากฏตัวปลอดภัยดี อีวานจึงถอนตัวกลับไปส่งรายงานเข้ารหัสให้ราชสำนัก ส่วนชายคนนั้นที่จำวิชาขวานของไอนาร์ได้ก็นึกสงสัยว่าอีวาน (‘ตัวสำรองผู้กล้า’ ที่ลือว่าตายไปเมื่อ 2 ปีก่อน) ยังมีชีวิตอยู่และสังกัดหน่วยข่าวกรอง จึงพาเอซิดิสบังคับพวกโจรแบกแคร่หามเดินทางต่อสู่เมืองหลวง\n- **บทที่ 8**: อีวานตรวจเช็กกำหนดการเดินทางของทายาทปาร์ตี้ผู้กล้าคนอื่นๆ (อิซาเบลล์และออสการ์จากอาณาจักรทิลเลส, เอลเฟียราจากจักรวรรดิคาลีออนทางเรือ, และลูเซียที่อยู่ในเมืองหลวงแล้ว) และกลับมานั่งพักผ่อนที่สถานเลี้ยงเด็กกำพร้ากับเด็กๆ ที่ชอบเล่นเกมแอบย่องเข้าหาเขา ทว่า **พริสซิลลา** ศิษย์เก่าอายุ 17 ปีถูกลักพาตัวไปในตรอกมืดของเมืองหลวง **พริตเชนคายา** เมื่อเธอเอ่ยชื่ออีวานขู่พวกนักเลง **‘คมดาบเงา’ เอนริเก้** (อาจารย์ของลูเซียและผู้ก่อตั้งหน่วยเก็บกวาด) ก็บังเอิญมาได้ยินและเข้าใจผิดคิดว่าอีวานแอบฝึกเด็กกำพร้าเป็นหน่วยนักฆ่าลับหลังตน เอนริเก้จึงฝากเสื้อโค้ตที่มีรอยประทับมือเป็นแผลเป็นรูปกางเขนส่งกลับมาเพื่อเรียกตัวอีวานไปพบ\n- **บทที่ 9**: อีวานแกะรอยไปยังดันเจี้ยนใต้ดินทางตอนใต้ของพริตเชนคายา ซึ่งเป็นที่ซ่อนรูปปั้น “ผู้กล้านิรนาม” ที่เอนริเก้ขโมยมาจากสวนกลางเมืองหลวง และได้พบหน้า **เอนริเก้** (แวมไพร์หญิงระดับตำนานและอดีตอาจารย์ของเขาที่ไม่เจอกัน 7 ปี) ทั้งสองฝ่ายต่างระแวงและเข้าใจผิดกันไปคนละทาง: เอนริเก้คิดว่าอีวานแอบตั้งองค์กรนักฆ่าแข่งในถิ่นเธอและส่งคนมาประกาศสงคราม ส่วนอีวานก็ระแวงว่าเอนริเก้แปรพักตร์ไปเข้าข้างมกุฎราชกุมารอเล็กซานเดอร์ ทั้งคู่ต่างแลกเปลี่ยนวาทะเชิงหยั่งเชิงท่ามกลางความเข้าใจผิดในช่วงกลางเดือนมกราคม\n- **บทที่ 10**: อีวานยอมอ่อนข้อก่อนและเอ่ยถึง **ลูเซีย** ลูกศิษย์ของเอนริเก้ที่จะเข้าเรียนมหาวิทยาลัยเซนต์ยานสก์ ทำให้เอนริเก้ยิ่งเข้าใจผิดว่าอีวานเอาลูกศิษย์มาข่มขู่ ก่อนจะเรียกลูเซียออกมาแนะนำตัว (ลูเซียเปิดเผยทัศนคติสุดหัวก้าวหน้าเรื่อง ‘มนุษยธรรม’ จนอีวานทึ่ง) เมื่อบรรยากาศตึงเครียดถึงขีดสุด ทั้งคู่จึงได้ปรับความเข้าใจกันจนรู้ว่าต่างฝ่ายต่างไม่ได้เข้าข้างอเล็กซานเดอร์ และพริสซิลลาฝึกซุ่มโจมตีจากการละเล่นในสถานเลี้ยงเด็กกำพร้าเอง ส่วนอีวานได้รับภารกิจจากเอลิซาเวตาให้ช่วยอารักขาเอนริเก้และศิษย์ หลังแยกจากเอนริเก้และพาพริสซิลลากลับมาอย่างปลอดภัย เธอถามด้วยน้ำตาว่าเขาจะจากไปใช่ไหม อีวานจึงเผลอบอกไปว่าเขากำลังจะไป **มหาวิทยาลัยเซนต์ยานสก์** ส่งผลให้ชาวสถานเลี้ยงเด็กกำพร้าเซนต์วาซิลีซาทุกคนพากันคร่ำเคร่งเตรียมตัวสอบเข้ามหาวิทยาลัยเซนต์ยานสก์กันยกใหญ่\n- **บทที่ 11**: ย้อนความทรงจำสมัยสงครามที่ **แม็กซิมิเลียน** เคยตวัดดาบ ‘ฟันผ่าท้องฟ้า’ และ **ไอนาร์** จามภูเขาทั้งลูกจนปาร์ตี้ผู้กล้าต้องวิ่งหนีฝูงไวเวิร์นกันหัวซุกหัวซุน ก่อนตัดกลับมาที่ปัจจุบันในอีก 2 สัปดาห์ต่อมา อีวานต้องเดินทางไปที่เมืองหลวง **ซังต์มาตีแลน** ของ **อาณาจักรทิลเลส** พร้อมกับสายลับมือใหม่จากกองบัญชาการต่อต้านข่าวกรอง 5 คนที่ **ดมิทรี** ส่งมาประกบ (ด้วยความสงสัยว่าอีวานมีเครือข่ายลับ) อีวานจึงอบรมสั่งสอนพวกสายลับแบบเข้มงวดตลอด 18 ชั่วโมงก่อนปล่อยให้พวกนั้นไปคุ้มครอง **ออสการ์** ส่วนตัวเองแยกตัวมาขึ้นรถไฟขบวนเดียวกับ **อิซาเบลล์** (ลูกสาวผู้กล้าแม็กซิมิเลียน) ซึ่งกำลังน้อยใจที่พ่อไม่มาส่งและไล่ตะเพิด **ออกัสต์** อัศวินองครักษ์ที่คอยยิ้มเอาใจอย่างไร้ความจริงใจ\n- **บทที่ 12**: รถไฟจากทิลเลสมุ่งหน้าคราซิลอฟแล่นผ่านจุดซุ่มโจมตีที่คาดการณ์ไว้ถึง 3 จุดอย่างสงบจนอีวานเริ่มสติแตกและวิตกกังวลว่าตัวเองอาจเดาแนวเรื่องผิดและโลกนี้ไม่มีฉากจบ ทำให้จิตสังหารแผ่ซ่านออกมาจนคนข้างๆ แทบขาดใจ ทว่าจังหวะที่รถไฟแล่นออกจากอุโมงค์ขึ้นสะพานเหนือหุบเขา สะพานก็ถูกระเบิดถล่มจนรถไฟตกราง อีวานจึงสงบใจลงและรีบไต่ขึ้นซากรถไฟเพื่อเข้าช่วยเหลือ ด้าน **อิซาเบลล์** ฟื้นขึ้นมาในตู้โดยสารที่ถูกดินกลบและพบว่า **ดิอัน ออกัสต์** อัศวินองครักษ์ยอมเอาตัวรับแรงกระแทกปกป้องเธอจนบาดเจ็บสาหัส ออกัสต์เปิดเผยว่าแม้จะไม่ชอบนิสัยเธอ แต่การมีอยู่ของเธอในฐานะทายาทผู้กล้าคือความหวังของการฟื้นฟูยุคสมัยใหม่ ทันใดนั้นอีวานก็ขุดดินทะลุเข้ามาช่วยและหยิบโพชั่นรักษาบาดแผลออกมาช่วยชีวิตออกัสต์ไว้\n- **บทที่ 13**: ฤทธิ์เจ็บปวดของโพชั่นทำให้เซอร์ดิอัน ออกัสต์ ช็อกจนสติย้อนวัยกลับเป็นเด็กชั่วคราว อีวานจึงให้อิซาเบลล์แบกออกัสต์ออกไปรวมตัวกับผู้รอดชีวิตที่เหลืออีก 10 คนและก่อกองไฟรอ ส่วนตัวเองแยกออกไปในป่ามืดเพื่อเปิดฉากซุ่มโจมตีหน่วยเก็บกวาดใส่ศัตรูที่โอบล้อมอยู่รอบภูเขาก่อน ทันทีที่ได้ยินเสียงปืนนัดแรกของอีวาน ออกัสต์ที่เพิ่งได้สติคืนมาก็ได้ถ่ายทอดคำสอนวิถีอัศวินโบราณบทสุดท้ายให้กับอิซาเบลล์ว่าให้จับดาบเพื่อความเที่ยงธรรมและยืนหยัดในจุดเดียวกับผู้อ่อนแอ ทำให้อิซาเบลล์ตั้งปณิธานได้สำเร็จ\n- **บทที่ 14**: อีวานใช้กลยุทธ์กองโจรของหน่วยเก็บกวาดซุ่มยิงและฟันสังหารกำลังพลราว 50 คนของฝ่ายศัตรูทีละจุด พร้อมทั้งวางกับดักด้ายผูกไกปืนกับศพเพื่อปั่นประสาทหน่วยบัญชาการศัตรู จน **อิคารัส** (ปีศาจมีเขา อดีตผู้บัญชาการกององครักษ์จักรวรรดิที่ 6) จับไต๋ได้ว่าผู้ลอบโจมตีมีเพียงคนเดียวและกำลังล่อให้พวกตนแตกแถว อิคารัสจึงสั่งลูกน้องไปรุมจัดการอีวานในป่า ส่วนตัวเองมุ่งหน้าไปเผชิญหน้ากับอิซาเบลล์ที่จุดพักแรมโดยตรง\n- **บทที่ 15**: อีวานเริ่มสงสัยว่าด่านฝึกสอนของอิซาเบลล์ยากผิดปกติเมื่อเทียบกับเอซิดิส และกังวลว่าตัวเองอาจเป็นเพียง NPC ตัวช่วยในเกม จึงแอบขึ้นไปสังเกตการณ์บนต้นไม้โดยไม่ยื่นมือเข้าไปช่วยในทันที ด้านอิซาเบลล์สู้กับอิคารัสจนดาบกระเด็นหลุดมือและเกือบถูกฟันสังหาร ทว่าเมื่อนึกถึงคำสอนวิถีอัศวินของออกัสต์ เธอก็ตื่นรู้พลังในเสี้ยววินาที ย่อตัวหลบคมดาบแล้วแทงทะลุร่างอิคารัสจนเอาชนะได้ อีวานซึ่งจัดการศัตรูในป่าทั้งหมดเรียบร้อยแล้วจึงเดินออกมาชื่นชม (ยืนยันได้ว่าตัวเองคือตัวแปรที่ไม่ใช่ NPC) และเปิดขวดโพชั่นรักษาบาดแผลเพื่อเตรียมสอบปากคำอิคารัสหาเบื้องหลังการแทรกซึมของพวกปีศาจ\n- **บทที่ 16**: อีวานราดโพชั่นรักษาบาดแผลใส่แผลฉกรรจ์ของ **อิคารัส** และช่วยชีวิตตอนที่อิคารัสกัดลิ้นฆ่าตัวตาย จนได้ข้อมูลว่าที่พวกปีศาจต้องส่งอิคารัสมาลงมือเองเพราะหน่วยสาวกในสหราชอาณาจักรถูกแทรกซึมและพ่ายแพ้สงครามข่าวสารไปแล้ว เมื่ออิคารัสสิ้นหนทางกลับและขอตาย อีวานกลับยื่นข้อเสนอให้ละทิ้งตัวตนเดิมแล้วไปเริ่มต้นชีวิตใหม่ที่สถานเลี้ยงเด็กกำพร้าเซนต์วาซิลีซา อิคารัสเลือกจะมีชีวิตอยู่และยอมให้อีวานตัดเขาทิ้ง หลังจบเรื่อง อีวานจึงปลอบใจอิซาเบลล์ที่รู้สึกผิดต่อผู้เสียสละและกระตุ้นให้เธอเงยหน้าขึ้นเป็นความหวังและผู้กล้าของทุกคน\n- **บทที่ 17**: ปลายเดือนกุมภาพันธ์ วันพิธีปฐมนิเทศของ **มหาวิทยาลัยเซนต์ยานสก์** เรือประจัญบานลอยฟ้าซึ่งเป็นเรือธงของ **จักรวรรดิคาลีออน** บินข้ามเขตแดนมาส่ง **เอลเฟียรา** เพื่อแสดงการประท้วงเรื่องความปลอดภัยในคราซิลอฟ อีวานที่แฝงตัวเป็นเจ้าหน้าที่ได้พบกับ **อิซาเบลล์** และ **ออสการ์ เดอ ซาติยง** (ลูกชายของจิลแบร์) พออีวานแนะนำตัวว่าเป็น “คนสวน” อิซาเบลล์ก็เข้าใจผิดคิดว่าเป็นรหัสลับของสายลับรัฐบาล ตัดฉากไปในหอประชุมใหญ่ จู่ๆ ก็มีใครบางคนมองเห็น **หน้าต่างสถานะ** ปรากฏขึ้นตรงหน้า\n- **บทที่ 18**: อีวานใช้เวลาว่างในตำแหน่งคนสวนที่ไม่มีสวนของมหาวิทยาลัยเซนต์ยานสก์เดินไล่เก็บกู้ระเบิดเวทมนตร์ทำมือ 3 ลูกที่คนร้ายลอบวางไว้ก่อนพิธีปฐมนิเทศ ทันใดนั้นเขาก็ได้ยินเสียงคนพูดพึมพำเรียกตัวเองว่า “ซานตาคลอส” เมื่อปะทะกันชั่วพริบตา อีวานก็วิเคราะห์ได้ทันทีว่าอีกฝ่ายคือ **ผู้ข้ามมิติ** ที่รู้จักต้นฉบับและรู้ฉากจบของโลกนี้ อีวานจึงแสดงตัวกับ **โอซิป โซเรนอฟ** (อดีตทหารหน่วยเก็บกวาดจากหน่วยจู่โจมที่ 3) เพื่อสั่งการผ่านดมิทรีให้รวบรวมรายชื่อผู้เข้าออกสถาบันทั้งหมดและตั้งใจจะกำจัดผู้ข้ามมิติคนนั้นทิ้งเพื่อไม่ให้ถูกขวางทางกลับบ้าน ส่วนทางฝั่งผู้ข้ามมิติปริศนา (ในร่างลูกคนเล็กจอมเสเพล) ที่เพิ่งพลาดเควสต์กู้ระเบิดเพราะอีวานเก็บกู้ไปหมดแล้ว ก็ได้รับเควสต์ระดับ `???` ให้กำจัดหรือเอาชีวิตรอดจาก “คนสวนแห่งมหาวิทยาลัยเซนต์ยานสก์ อีวาน เปโตรวิช” โดยมีบทลงโทษคือความตาย\n\n- **บทที่ 19**: อีวานนำระเบิดเวทมนตร์ 3 ลูกที่ถอดชนวนแล้วไปพบ **ดมิทรี** ที่ร้านกาแฟลับใกล้มหาวิทยาลัยเซนต์ยานสก์เพื่อส่งให้แผนกเวทมนตร์ตรวจสอบ และรับแฟ้มรายชื่อบุคลากร นักศึกษา รวมถึงครอบครัวผู้เข้าร่วมพิธีปฐมนิเทศรวม 2,429 คนมาคัดกรองหาผู้ข้ามมิติ ดมิทรีเป็นห่วงสภาพอิดโรยของอีวานจึงสั่งให้ลูกน้องคอยเฝ้าสังเกตการณ์จากระยะปลอดภัย อีวานนำข้อมูลกลับมานั่งวิเคราะห์จนเกิดฝันร้ายถึงอดีตเพื่อนร่วมรบ (**เชอร์โนวิกา** และ **ซาชา**) และท่องชื่ออาหารกับความทรงจำของ **คิมซอนอู** เพื่อประคองสติไม่ให้ยอมรับว่าชีวิตของสหายเป็นเพียงฉากหลังในเกม ตัดฉากไปหลังเปิดเทอม **องค์หญิงเอซิดิส** ถูกเพื่อนร่วมสถาบันหวาดกลัวและโดดเดี่ยวเพราะ **คุณลุงฮัสคาล (มอร์ด)** คอยยืนถือขวานจ้องเขม็งปกป้องจนไม่มีใครกล้าเข้าใกล้\n- **บทที่ 20**: หลังอดหลับอดนอนคัดกรองข้อมูลอยู่ 3 วัน อีวานก็ตัดตัวเลือกจนเหลือผู้ต้องสงสัย 3 คน (เด็กกำพร้าทุนภาคปฏิบัติ 1 คน และทายาทขุนนางสายมกุฎราชกุมารอีก 2 คน) ก่อนจะเริ่มเข้ามาทำงานในมหาวิทยาลัยเซนต์ยานสก์อย่างเต็มตัว ด้าน **เอซิดิส** ได้ร่วมโต๊ะกินมื้อกลางวันกับ **อิซาเบลล์** และเพื่อนใหม่ **ยูริ แฟรงก์** (เด็กสาวกำพร้าทุนเต็มจำนวนของคณะอัศวินที่มีฝีมือดาบเหนือกว่าอิซาเบลล์และออสการ์) แต่อีวานที่แอบสังเกตการณ์อยู่บนต้นไม้กลับขีดเส้นแดงให้ยูริเพราะใช้ชื่อผู้ชายแบบคราซิลอฟซึ่งนิยมใช้เป็นชื่อผู้หญิงในเอเชียตะวันออก ขณะเดียวกัน **เอนริเก้** ที่ได้รับไหว้วานให้มาคอยดูอีวานก็เริ่มสังเกตว่าเขาสะกดรอยตามนักศึกษา 3 คนอย่างน่าสงสัย หนึ่งในนั้นคือ **เยฟเกนี โนวิคอฟ คารัมซิน (ยูจีน)** นักศึกษาคณะเทววิทยา ซึ่งเป็นผู้ข้ามมิติชาวเกาหลีใต้ที่เข้ามาสิงร่างตัวเอกนิยาย *“นักดาบคลั่งแห่งดัชชีเหนือ”* ยูจีนรู้ตัวว่าถูก “ซานตาคลอสหน้าหิน” สะกดรอยและมองไม่เห็นเลเวลของอีวาน ส่วนอีวานก็ยืนยันความสงสัยทั้งจากทักษะตรวจจับการพรางตัวและชื่อ “ยูจีน”\n- **บทที่ 21**: **เอนริเก้** ตามสังเกตการณ์อีวานที่ยืนจ้องเป้าหมายไม่หลับไม่นอนอยู่ 3 วันเต็มจนทนไม่ไหว จึงยิงปืนเตือนและพาเขากลับไปที่สถานเลี้ยงเด็กกำพร้าเซนต์วาซิลีซา ที่นั่นเธอประหลาดใจกับวินัยอันเงียบกริบของเด็กๆ รวมถึงการที่อีวานรับ **อิคารัส** ปีศาจมีเขามาอยู่ด้วย และยิ่งตกใจหนักเมื่อเห็นห้องทำงานผู้อำนวยการที่ขึงลวดกับดักเต็มไปหมดพร้อมกระดานวิเคราะห์ข้อมูลและด้ายแดงโยงใยเต็มห้องและเพดาน เมื่อเอนริเก้คาดคั้นอย่างจริงจัง อีวานซึ่งอดนอนมานานหนึ่งสัปดาห์จึงยอมสารภาพความจริงเรื่องที่ตนเป็นผู้กลับชาติมาเกิดจากต่างโลกและเพิ่งพบผู้ข้ามมิติอีกคนซึ่งต้องกำจัดทิ้ง เอนริเก้จึงขอโทษอีวานที่ทุกคนเข้าใจผิดคิดว่าเขาเป็นผู้ปีนหอคอยจอมมารเช่นเดียวกับคนอื่น และเปิดเผยความจริงว่า **ผู้กล้าแม็กซิมิเลียน** ก็ไม่ใช่ชาวทิลเลสแต่เป็น “ผู้ที่ถูกดึงตัวมา” จากต่างโลกเหมือนกับอีวานเช่นกัน\n- **บทที่ 22**: **เอนริเก้** ตบหน้าเรียกสติอีวานที่กำลังจมดิ่งในความสิ้นหวังเรื่องจุดจบและชะตากรรมของ **แม็กซิมิเลียน** เธอเตือนสติว่าทุกคนในโลกนี้ต่างก็มีชีวิตจิตใจและเป็นตัวเอกในเรื่องราวของตนเอง ไม่ใช่แค่ตัวประกอบในนิยาย พร้อมยื่นมือปลอบโยนให้อีวานพลิกหน้ากระดาษชีวิตด้วยมือของตัวเองและอาสาเฝ้ายามให้เขานอนหลับ อีวานจึงปลดปล่อยความกดดันและหลับใหลไปโดยฝันย้อนรำลึกถึงวัย 16 ปีสมัยเป็นทหารเกณฑ์ที่ **พระเจ้าอีวานมหาราช** เคยช่วยชีวิตและมอบฉายา “อีวานตัวน้อย” ให้ ทำให้คืนนั้นเขาหลับสนิทไร้ฝันร้าย ขณะเดียวกัน ทางฝั่ง **ยูจีน** หน้าต่างสถานะเควสต์ระดับ `???` ที่ให้สังหารอีวานก็ถูกยกเลิกไปเองอย่างปริศนาด้วยผลของโชคชะตา\n- **บทที่ 23**: อีวานที่ตัดสินใจใช้ชีวิตต่อไปตามคำแนะนำของเอนริเก้ถือกรรไกรตัดแต่งกิ่งไม้ออกมาตัดต้นไม้ทั้งที่มหาวิทยาลัยเซนต์ยานสก์ไม่มีสวน **เอนริเก้** จึงชวนเขาไปเป็นผู้ช่วยสอนในวิชาบังคับ *[ความเข้าใจในการต่อสู้ระยะประชิด 1]* ของคณะอัศวินที่เธอรับหน้าที่เป็นอาจารย์พิเศษ และประกาศให้คะแนนพิเศษตามความสาหัสที่นักศึกษาสามารถทำกับ “คนสวน” อีวานได้ อีวานที่กำลังจับตามองกลุ่มคนสำคัญ (ออสการ์, อิซาเบลล์, ยูริ และ **มอร์ด เอริกสัน**) จึงขึ้นสังเวียนประเมินฝีมือ โดยมี **มอร์ด เอริกสัน** (คุณลุงฮัสคาลผู้คุ้มกันเอซิดิส) อาสาขึ้นสู้เป็นคนแรก\n- **บทที่ 24**: อีวานประลองขวานเอาชนะ **มอร์ด เอริกสัน** ได้อย่างเฉียบขาดและบังคับให้มอร์ดไปทำงานอาสาสมัครซักผ้าที่สถานเลี้ยงเด็กกำพร้าเพื่อผูกมัดไม่ให้เคลื่อนไหวทางการเมือง จากนั้นอีวานก็ไล่โค่นนักศึกษาปี 1 คณะอัศวินทีละคนจนถึงคิวของ **ยูริ แฟรงก์** เมื่ออีวานเอ่ยปากถามแซวเรื่องชื่อเกาหลี (“คิมยูริ พัคยูริ หรือชเวยูริ?”) ยูริก็ตกใจสุดขีดและพ่ายแพ้ให้เชิงขวานของอีวานโดยไร้รอยขีดข่วน ความจริงเปิดเผยว่าเธอคืออดีตนักวาดภาพประกอบชาวเกาหลีใต้ที่ข้ามมิติมาในโลกของเกมผู้ใหญ่ที่ตัวเองเพิ่งวาดส่งงาน (*ฮวีจัก 3*) จึงเข้าใจผิดคิดว่าคนสวนมีผ้าขนหนูพาดคออย่างอีวานเป็นคนสวนโรคจิตที่จะจับเธอไปทำมิดีมิร้าย สุดท้าย **อิซาเบลล์** ต้านได้ 3 กระบวนท่า **ออสการ์** ต้านได้ 2 กระบวนท่า และทั้งอีวานกับเอนริเก้ก็โดน **นักบุญหญิงแพทริเซีย** เทศนายับข้อหาส่งผู้ป่วย 50 คนเข้าไปนอนในคณะเทววิทยา\n- **บทที่ 25**: อีวานและ **เอนริเก้** เข้าไปพบ **นักบุญหญิงแพทริเซีย** ที่ห้องทำงานคณบดีคณะเทววิทยา เอนริเก้เปิดเผยความจริงว่าอีวานเป็น “ผู้ที่ถูกดึงตัวมา” จากต่างโลกเช่นเดียวกับแม็กซิมิเลียน ทำให้แพทริเซียซาบซึ้งใจในความเสียสละของ “บราเดอร์คิริลล์” (ชื่อศีลล้างบาปของอีวาน) อย่างยิ่งจนขอตามไปเยี่ยมสถานเลี้ยงเด็กกำพร้าเซนต์วาซิลีซาด้วยตนเอง และยิ่งปลาบปลื้มเมื่อเห็นความเป็นอยู่ที่ดีของเด็กๆ กับภาพวาดที่เด็กๆ วาดให้อีวาน\n- **บทที่ 26**: ที่สถานเลี้ยงเด็กกำพร้า **แพทริเซีย** วิเคราะห์ว่าปกติ “ผู้ที่ถูกดึงตัวมา” จะปรากฏตัวเพียงศตวรรษละ 2–3 คน แต่ในยุคนี้กลับมีทั้งจอมมาร แม็กซิมิเลียน และอีวานเมื่อ 20 ปีก่อน แล้วยังมีผู้ต้องสงสัยโผล่มาอีกถึง 3 คน เธอจึงอนุมัติให้อีวานตรวจสอบตัวตนและ “เรื่องราว” ของทั้งสามคน ฝั่ง **ยูจีน (เยฟเกนี)** ที่กำลังนั่งอ่านพระคัมภีร์อยู่ได้รับคำเตือนจาก `[สัญชาตญาณเอาตัวรอด Lv.3]` ให้เดินหนีแต่อีวานก็ตามมาดักตัวไว้ได้และพาตัวไปพร้อมบอกว่าเป็นเรื่องที่แพทริเซียอนุมัติแล้ว ขณะเดียวกันทางฝั่ง **เอิร์นเบิร์ต** คณบดีคณะเวทมนตร์ก็ได้พูดคุยกับแพทริเซียเรื่อง **ออสวัลด์ อีสต์เบลเฟน** นักศึกษาปี 1 ชาวคาลีออนผู้ต้องสงสัยรายที่ 3 ซึ่งเพิ่งหย่าร้างกับอดีตคู่หมั้น **เอเวอลิน รัสต์ฟิตซ์** (ตัวออสวัลด์เองก็เป็นผู้ข้ามมิติที่หลุดเข้ามาในนิยาย *[นางร้ายที่คลั่งไคล้จอมเวทอัจฉริยะ]*)\n- **บทที่ 27**: อีวานเจรจากับ **ยูจีน** และพบว่าอีกฝ่ายเป็นคนเกาหลีใต้ที่ข้ามมิติมาจากปี 2022 (หลังอีวาน 1 ปี) และมีหน้าต่างสถานะที่เอาแต่ส่งคำเตือนประหลาดๆ ยูจีนอาสาร่วมมือกับอีวานอย่างกระตือรือร้นและขอเรียกอีวานว่า “ลูกพี่” เพื่อช่วยตั้ง “ชมรมอาสาสมัคร” ใช้เป็นฉากหน้ารวบรวมและตรวจสอบกลุ่มผู้ต้องสงสัยว่าเป็นผู้ข้ามมิติทั้ง 3 คน (ยูจีน, ยูริ และออสวัลด์) จากนั้นทั้งสองคนก็เดินตรงเข้าไปหาวงกินมื้อกลางวันของ **อิซาเบลล์**, **เอซิดิส** และ **ยูริ** ทำให้ยูริตกใจสุดขีดจนทำแซนด์วิชหล่นเพราะนึกว่า “คนสวนโรคจิต” พาตัวละครสาย “โกลด์ซัน” มาด้วย\n- **บทที่ 28**: อีวานทดลองใช้ความสามารถหน้าต่างสถานะของ **ยูจีน** เดินสแกนทั่วมหาวิทยาลัยจนพบนักศึกษาที่ชื่อไม่ตรงกับทะเบียนและมองไม่เห็นเลเวลราว 7 คน (ที่น่าจะเป็นสายลับต่างแดนหรือผู้ร่วมมือกับปีศาจ) จากนั้นอีวานแวะไปพูดคุยกับ **อิซาเบลล์** ที่เข้าใจผิดคิดว่าเขาเป็นสายลับรัฐบาลและอาสาช่วยสืบหาสายลับจากทิลเลสให้ ด้านบนเรือประจัญบานลอยฟ้า **“เกียรติภูมิแห่งบอยล์”** ของคาลีออนซึ่งขัดข้องจนขยับไม่ได้ **เอลิซาเวตา** บุกขึ้นไปข่มขู่กัปตัน **เออร์เนสต์** ด้วยตนเองว่าจะส่ง “คนตัดไม้” มาหา ก่อนจะสั่งการให้ **ดมิทรี** เรียกตัว “วานก้า” มาปฏิบัติภารกิจตามแผน\n- **บทที่ 29**: หลังเรือรบคาลีออนลอยค้างเหนือสถาบันนานกว่า 15 วัน นักศึกษาเอลฟ์ก็แตกคอกันเองระหว่างฝ่ายสภาองคมนตรีกับฝ่ายกองบัญชาการกองทัพเรือ ขณะเดียวกัน **ดมิทรี** เดินทางมาที่สถานเลี้ยงเด็กกำพร้า (ซึ่งเขาแอบยักย้ายงบมาช่วยอุปถัมภ์ทุกปี) และพบว่า **ยูจีน** บุตรชายตระกูลดยุกคารัมซินมาเรียกอีวานว่าลูกพี่ ดมิทรีจึงมอบคำสั่งจากเอลิซาเวตาให้อีวานลอบขึ้นไปข่มขู่กัปตันเรือรบคาลีออนโดยห้ามมีผู้เสียชีวิต เพื่อบีบให้กัปตันไปจับมือกับมกุฎราชกุมารอเล็กซานเดอร์และใช้เป็นข้ออ้างยึดเรือเหาะมาถอดแบบวิศวกรรมย้อนกลับ พอจบการสนทนา ยูจีนก็พบว่าหน้าต่างเควสต์เปลี่ยนเป็น `[“เควสต์ต่อเนื่องระดับ B” อุบายวังหลวงคราซิลอฟ]` อีวานจึงสั่งให้ยูจีนร่วมปฏิบัติการในคืนวันพรุ่งนี้เพื่อสังเกตการณ์ระบบเควสต์และรางวัล\n- **บทที่ 30**: อีวานพายูจีนเดินไปที่คณะเวทมนตร์ ระหว่างทางยูจีนเล่าเรื่องช่องสล็อตเวทมนตร์ศักดิ์สิทธิ์และความฝันอยากเป็น “พาลาดิน” คนแรกของโลก ทำให้ีวานอดสงสัยไม่ได้ว่ายูจีนอาจจะมีคุณสมบัติคล้ายผู้กล้า จากนั้นทั้งคู่ก็ไปดักจับตัว **ออสวัลด์** (ที่กำลังหนีสายตาคลั่งรักของ **เอเวอลิน รัสต์ฟิตซ์**) ได้สำเร็จ อีวานเฉลยว่าจับพิรุธออสวัลด์ได้จากการใช้คำสุภาพในเอกสารสมัครเรียนซึ่งผิดวิสัยเอลฟ์ เมื่อแลกเปลี่ยนข้อมูลกันจนรู้ว่าออสวัลด์ข้ามมิติมาในเดือนพฤษภาคม ปี 2023 ทั้งสามคนก็ไปดักพบ **ยูริ แฟรงก์** ที่คณะอัศวิน (ทำเอายูริขวัญผวาจนภาพตัดเพราะคิดว่าเป็นคนสวนโรคจิตกับตัวละครสายโกลด์ซันและจอมเวทจิตใจ) อีวานมองดูผู้ข้ามมิติทั้ง 4 คนในห้องชมรมแล้วนึกในใจว่าการจัดทีมแบบนี้มันเหมือนปาร์ตี้ผู้กล้าไม่มีผิด\n- **บทที่ 31**: ผู้ข้ามมิติทั้ง 4 คนแนะนำตัวและแลกเปลี่ยนข้อมูลในห้องชมรม **ยูจีน** (คิมยูจิน อายุ 31) มาจากนิยายลากยาวไร้ตอนจบ *“ไอ้สารเลวอัจฉริยะเพลงดาบแห่งดัชชีเหนือ”*, **ออสวัลด์** (พัคแจยอง อายุ 27) อ่าน *“อัจฉริยะเวทมนตร์ผู้ถูกนางร้ายคลั่งไคล้เวทมนตร์ตามหลอกหลอน”* ไม่ถึง 30 ตอน, และ **ยูริ** (อียูริ อายุ 29) เป็นนักวาดภาพประกอบที่ถูกดึงมาขณะส่งงานเกมผู้ใหญ่ (จนเข้าใจผิดคิดว่าพวกอีวานเป็นตัวละครสายมืดและสายสะกดจิต) ทั้งสามต่างถูกสิงมาได้ 4 ปีพอดีหลังจอมมารตาย อีวานนำคำสอนของ **เอนริเก้** มาวิเคราะห์ว่าโชคชะตาอาจกำหนดแค่จุดเริ่มต้นในฉากหลังแนวสถาบันการศึกษา แต่ตอนจบขึ้นอยู่กับพวกเขาเอง พร้อมตั้งชมรม (อีวานแอบตั้งชื่อว่า *ชมรมอาสาสมัคร*) โดยใช้หน้าต่างเควสต์ของยูจีนเป็นตัวจับกระแสเรื่องราว\n- **บทที่ 32**: ทีมทั้ง 4 คนวางแผนลอบขึ้นเรือรบลอยฟ้า **“เกียรติภูมิแห่งบอยล์”** ที่ลอยสูง 800 เมตรเหนือมหาวิทยาลัยเซนต์ยานสก์เพื่อข่มขู่กัปตันเรือโดยห้ามฆ่าใคร หลังออสวัลด์ใช้เวท `[จิตเภท]` ปิดปากยูจีนที่โวยวายเรื่องสกิล `[ย่างก้าวขนนก]` อีวานวิเคราะห์ว่ากัปตันจะต้องติดต่อมกุฎราชกุมารอเล็กซานเดอร์ในคืนนี้ด้วยรถม้าลงอาคมลอยตัว จึงให้ยูริแบกยูจีนและตัวเองแบกออสวัลด์ไปดักรอที่หอดูดาวคณะเวทมนตร์ ก่อนใช้วิธีขว้างขวานผูกเชือกเหวี่ยงทุกคนไปเกาะล้อใต้ท้องรถม้ากลางอากาศ พอรถม้าเข้าใกล้ดาดฟ้าเรือ อีวานก็ทิ้งทั้งสามคนไว้เป็นตัวล่อเบี่ยงเบนความสนใจ ส่วนตัวเองขว้างขวานพุ่งไปเจาะกราบเรือไม้และลอบเข้าไปในเรือเพียงลำพัง\n- **บทที่ 33**: บนดาดฟ้าเรือ ยูริ ยูจีน และออสวัลด์ถูกเหล่าทหารเอลฟ์ล้อมกรอบ ออสวัลด์จึงร่าย `[ประทานความกล้า]` ใส่ยูจีนจนทำให้ยูจีนเข้าสู่โหมดสวมบทบาทอัศวินศักดิ์สิทธิ์เต็มขั้นและพุ่งเข้าฟาดฟันด้วย `[ฟาดฟันศักดิ์สิทธิ์]` ดึงความสนใจบนดาดฟ้าไว้ได้ทั้งหมด ฝั่งอีวานใช้เทคนิคการกำหนดตำแหน่งด้วยเสียงสะท้อนจากเสียงไซเรนและไฟเตือนภัยลอบเดินผ่านโถงทางเดินอันมืดมิด จัดการทหารเอลฟ์ด้วยสันขวานและปืนพกโดยไม่ให้ถึงตาย จนมาถึงหน้าห้องกัปตัน **เออร์เนสต์** ซึ่งกำลังระแวงว่าเป็นการโจมตีจากฝ่ายเอลิซาเวตา อีวานขว้างขวานผูกเชือกทะลุประตูเข้าไปปักโต๊ะก่อนกระชากเชือกฟาดข้อเท้าเออร์เนสต์หักและจ่อปืนใส่ ปฏิเสธการเจรจาแล้วลั่นไกปืนท่ามกลางความมืด\n- **บทที่ 34**: กัปตัน **เออร์เนสต์** (นักรบสายเวทที่เชี่ยวชาญวิชาดาบ) หลบกระสุนของอีวานได้และแสร้งยอมจำนน ก่อนเขวี้ยงดาบหลอกล่อแล้วกดใช้งานลูกแก้วเวทมนตร์ระเบิดตัวเอง แต่แทนที่จะเป็นระเบิดสังหาร กลับเป็น **‘เวทย้ายวิญญาณ’** ที่ส่งจิตของจอมเวท **เบโอลกริน** แห่งปาร์ตี้ผู้กล้าเข้ามาสิงร่างเออร์เนสต์แทน เบโอลกรินยอมรับว่าจงใจทำให้เรือขัดข้องเพื่อล่อให้ **เอลิซาเวตา** โกรธจนมกุฎราชกุมาร **อเล็กซานเดอร์** ต้องติดต่อมาหา ก่อนจะเปิดฉากประมือกับอีวานเพื่อทดสอบฝีมือ แม้เบโอลกรินจะมีพลังเวทจำกัดตามร่างกัปตัน แต่อีวานในโหมด ‘ผู้ก้าวข้ามขีดจำกัด’ ที่พุ่งทะลวงเข้าไปได้หนึ่งชั้นก็ยังต้องเผชิญกับวงเวทกว่าสี่สิบบทกลางอากาศของเบโอลกริน\n- **บทที่ 35**: ขณะที่ **ยูจีน** **ยูริ** และ **ออสวัลด์** กำลังถูกลูกเรือเอลฟ์ระดับทหารผ่านศึกกดดันบนดาดฟ้าเรือ **อีวาน** ก็ถูก **เบโอลกริน** ซัดทะลุดาดฟ้าเรือขึ้นมา (เบโอลกรินเสียแขนไปหนึ่งข้างแต่ยังคงเหนือกว่า) เบโอลกรินไม่ฆ่าใครแต่จับทูตจากกระทรวงการต่างประเทศ (**นิโคไล สโลโบดาโนวิช รยูริก**) ที่ซ่อนอยู่ในรถม้ามาเค้นความจริงทางจิตก่อนสังหารทิ้ง และพบว่าอเล็กซานเดอร์ไม่ได้อยู่ในเมืองพริตเชนคายา เบโอลกรินทิ้งปริศนาให้อีวานเตรียมรับมือกระดานเกมที่เชื่อมโยงกับมหาวิทยาลัยเซนต์ยานสก์ ฝากฝังลูกสาวของตน (**เอลเฟียรา**) และอ่านปากบอกอีวานว่า *“แม็กซิมิเลียนยังไม่หายไปไหน”* ก่อนสลายร่างไป กัปตันเรือที่ขวัญเสียจึงรีบส่งอีวานและกลุ่มผู้ข้ามมิติกลับลงพื้น อีวานปล่อยให้ทั้งสามแยกย้ายกลับไปพักผ่อนส่วนตัวเองมุ่งหน้าไปรายงาน **เอลิซาเวตา**\n- **บทที่ 36**: **อีวาน** ไปถึงกองบัญชาการต่อต้านข่าวกรองท่ามกลางความยำเกรงของเหล่ารุ่นน้อง ก่อนจะถูกพาไปยัง **พระราชวังตะวันออก** เพื่อพบ **ดมิทรี** และเข้าเฝ้า **เอลิซาเวตา** ในสวนอนุสรณ์สถานที่ปลูกดอกไม้ซึ่งเหล่าสหายผู้ล่วงลับชื่นชอบ (ย้อนความทรงจำเมื่อ 4 ปีก่อนในวันฝนตกที่เอลิซาเวตาขอให้อีวานไว้หนวดเคราแบบคุณปู่และใช้ชีวิตเงียบๆ จนเธอกลับมาตกใจกับเคราจริงของเขาในวันนี้) เมื่ออีวานรายงานเรื่องเบโอลกริน เอลิซาเวตาก็วิเคราะห์ว่ามกุฎราชกุมารอเล็กซานเดอร์ตัวจริงอาจร่วมมือกับเบโอลกรินเพื่อหาทางกำจัดผู้กล้า **แม็กซิมิเลียน** (‘จักรพรรดิทองคำ’) เช่นเดียวกับที่ราชสำนักเคยกลัวอำนาจของหน่วยเก็บกวาด หลังคุยเรื่องงาน เอลิซาเวตาชวนอีวานนั่งจิบชาชมสวน แต่อีวานเตือนให้เธอยึดมั่นในคำสอนของหน่วย (“อย่าเศร้าโศกถึงผู้ที่ล่วงหน้าไปก่อน”) และมองดวงดาวบนท้องฟ้าแทนดอกไม้ ทั้งคู่หยอกล้อกันเรื่องหนวดเคราอย่างเป็นกันเองอีกครั้ง\n- **บทที่ 37**: ช่วงสอบกลางภาคเดือนพฤษภาคม **ยูจีน** **ยูริ** และ **ออสวัลด์** ต่างคร่ำครวญกับข้อสอบและกองการบ้านในห้องชมรม ขณะที่ **อีวาน** กำลังสั่งสอนนักศึกษา 12 คนที่ทิ้งก้นบุหรี่ใต้ต้นไม้ด้วยโพชั่นรักษาบาดแผล ก่อนที่ **อิซาเบลล์** จะเข้ามาขอให้อีวานช่วยติวสอบภาคปฏิบัติวิชา *ยุทธวิธีรับมือการซุ่มโจมตี* ของ **เอนริเก้** อีวานเดาออกว่าเอนริเก้ต้องจัดสอบในป่าทางตะวันออกของพริตเชนคายาจึงพาอิซาเบลล์ไปที่นั่น แล้วเปิดฉากโยนระเบิดควันและยิงกระสุนจริงไล่ต้อนเธอทันทีเพื่อฝึกแบบสมจริง ทำเอาอิซาเบลล์ที่อุตส่าห์เตรียมตะกร้าปิกนิกแซนด์วิชมาแสดงความขอบคุณถึงกับเดือดจัดและคิดจะสั่งสอนอีวานให้รู้จักคำว่าสามัญสำนึก\n- **บทที่ 38**: อีวานฝึกสอนอิซาเบลล์ด้วยกลยุทธ์ซุ่มยิงจริงและกับดักระเบิดในป่า พร้อมอธิบายหลักการโอบล้อมด้วยการจำกัดข้อมูลข่าวสารและการชักนำเป้าหมายในเขาวงกตธรรมชาติ ทำให้อิซาเบลล์ระลึกถึงคำสอนของ **ออกัสต์** จนปลุกพลังเวทสีฟ้าและยกระดับการตรวจจับแนววิถีกระสุนเข้าใกล้ระดับผู้เหนือมนุษย์ได้สำเร็จ บนรถไฟขากลับ อิซาเบลล์หลับซบไหล่อีวานและแอบได้ยินเขาชมกับตัวเองว่าแม็กซิมิเลียนมีลูกสาวที่ยอดเยี่ยม จนเธอเริ่มหวั่นไหวและคิดอยากดูแล “คนสวนซื่อบื้อ” คนนี้ ขณะเดียวกัน ใต้ดินในป่านั้น **หมวดทหารช่างที่ 7 ของคนแคระฝ่ายจอมมาร** ที่เตรียมขุดอุโมงค์ซุ่มโจมตีงานสอบของเอนริเก้กลับถูกแรงระเบิดจากการฝึกของอีวานกับอิซาเบลล์ถล่มพังไป 3 จุดจนต้องเร่งซ่อมกันจ้าละหวั่นก่อนวันสอบในอีก 1 สัปดาห์\n- **บทที่ 39**: ตลอดสัปดาห์ อีวานฝึกอิซาเบลล์จนแพ้ 17 ครั้งรวด ก่อนจะถ่ายทอดเคล็ดวิชาขั้นสูง **การแยกส่วนห้วงเวลา (Temporal Dissociation)** เพื่อก้าวเข้าสู่สนามรบของผู้ก้าวข้ามขีดจำกัดด้วยการฟันดาบเธอหักและหวดเธอให้เอาตัวรอดในเสี้ยววินาที แม้จะถูกนักบวชจากทิลเลสช่วยรักษาทุกคืนแต่อิซาเบลล์ก็ยังอ่อนล้าจน **เอซิดิส** และ **ยูริ** สังเกตเห็น (และอิซาเบลล์ปฏิเสธเรื่อง **ออสการ์** พร้อมเปรยว่าชอบคนกำยำเงียบขรึมเหมือนหมี) ก่อนวันสอบ 1 วัน อิซาเบลล์แวะมาชวนอีวานฝึกต่อและอ่อยชวนกินข้าว แต่ถูกอีวานปฏิเสธเพราะต้องไป “เก็บกวาด” เหล่าศัตรูที่จะมาซุ่มโจมตีในวันสอบล่วงหน้า ทำเอาเอซิดิสกับยูริที่แอบดูอยู่ถึงกับทำกาแฟหกและเปรียบอีวานว่าเหมือน *จอห์น วิค* เวอร์ชันถือขวานไว้เครา\n\n- **บทที่ 40**: วันสอบภาคปฏิบัติวิชา **[การรับมือการซุ่มโจมตี]** ของนักศึกษาปี 1 คณะอัศวิน 52 คน อีวานเตรียมอาวุธครบมือทั้งดาบ ขวาน กริช ปืนพก และระเบิดมือมาสังเกตการณ์โดยร่วมมือกับ **เอนริเก้** (ซึ่งช่วยตวาดขู่ **ศาสตราจารย์โรเบิร์ต เซนนาร์ เดอ มอนดรังกี** ขุนนางจากทิลเลสที่เข้ามาดูถูกอีวานว่าเป็นแค่คนสวนสามัญชน) กติกาคือการถือลูกแก้วติดตามตำแหน่งฝ่าป่าไปอีกฟากภายใน 4 ชั่วโมงพร้อมหลบหนีลูกศิษย์ของเอนริเก้ อีวานวิเคราะห์ออกทันทีว่าจะต้องมี **เผ่าคนแคระ** บุกโจมตีจากใต้ดินเพื่อหมายหัว **อิซาเบลล์** หรือ **ออสการ์** จึงชักดาบเตรียมตัวลงมือ\n- **บทที่ 41**: ทันทีที่เริ่มสอบ **อิซาเบลล์** แยกตัววิ่งเข้าป่าเพียงลำพังเพื่อคว้าอันดับหนึ่งและพิสูจน์ฝีมือให้อีวานเห็น เธอปลดกับดักและอ่านทางกับดักลวงของลูกศิษย์เอนริเก้ได้ทั้งหมดก่อนจะเข้าปะทะกับกลุ่มของ **อาแลง** 5 คนอย่างสบายๆ ขณะเดียวกัน อีวานที่ขึ้นไปสังเกตการณ์บนยอดไม้สัมผัสได้ถึงแรงสั่นสะเทือนใต้ดินรูปแบบใยแมงมุมอันเป็นเอกลักษณ์ของ **‘นักถักทอใย’ แห่งกองทัพมังกรที่ 5** ก่อนที่ผืนป่าจะถล่มยุบตัวลงเป็นโพรงอุโมงค์ลึก อีวานมอบหมายหน้าที่กู้ภัยนักศึกษาทั่วไปให้เอนริเก้ แล้วกระโดดลงไปในอุโมงค์เพื่อมุ่งหน้าไปช่วย **ออสการ์** ที่อยู่ใกล้ที่สุดก่อน\n- **บทที่ 42**: ใต้โพรงอุโมงค์ที่มืดสนิท **ออสการ์** ที่ขาหักและครอบครองลูกแก้วไว้ 3 เม็ด (ซึ่งรวมถึงลูกแก้วของเพื่อนอีก 2 คนที่เขาชิงมา) ตัดสินใจออกเดินหาเพื่อนร่วมชั้นเพื่อช่วยเหลือตามวิถีอัศวินแห่งทิลเลส ด้านอีวานเดินฝ่าความมืดด้วยจังหวะก้าวคงที่ 86 เซนติเมตรและคำนวณพิกัดในหัวจนพบ **แพทริก** (นักศึกษาที่ถูกออสการ์ชิงลูกแก้วไป) และมอบลูกแก้วสำรองช่วยชี้ทางหนีให้ จากนั้นเมื่อออสการ์รู้ตัวว่าเสียงตะโกนเรียกชื่อในความมืดเป็นกับดักของศัตรู และได้ยินเสียงนักศึกษาอีกคนกำลังตกอยู่ในอันตราย ออสการ์จึงยอมตะโกนเปิดเผยตัวตนว่าเป็นบุตรชายของดยุกจิลแบร์เพื่อล่อคนแคระมาหาตนเอง อีวานที่มาถึงทันเวลาจึงเล็งปืนพกคำนวณระยะในความมืดผ่านตำแหน่งของออสการ์และลั่นไกสังหารคนแคระทันที\n\n- **บทที่ 43**: อีวานใช้เทคนิคการแยกส่วนห้วงเวลาควบคู่กับแสงวาบจากปากกระบอกปืนพกและวิชา **‘ผ่าเกราะคนแคระ’** สังหารคนแคระ 2 ตนที่กำลังไล่ล่าออสการ์ได้อย่างรวดเร็ว ก่อนจะฝากฝังให้ออสการ์รอทีมกู้ภัยอยู่ที่เดิมและเอ่ยชมเชยลูกชายของจิลแบร์ จากนั้นอีวานมุ่งหน้าไปช่วย **อิซาเบลล์** ที่ถูกล้อมด้วยกองกำลังคนแคระจำนวนมากภายใต้การนำของ **ร้อยโทอาวุโสอัสตุก** (ระดับผู้บัญชาการกองพันหนึ่งพันนาย) ซึ่งหมายจะสังหารทายาทผู้กล้า อีวานส่งสัญญาณเสียงเดาะลิ้นระบุตำแหน่งด้วยเสียงสะท้อนจนคนแคระจำได้ว่าเป็น **หน่วยเก็บกวาด** และเปิดฉากยิงส่องสว่างเข้าปะทะ\n- **บทที่ 44**: อีวานเดินมาหาอิซาเบลล์ (ซึ่งเข้าใจผิดคิดไปไกลว่าคำสั่งให้อยู่เฉยๆ เป็นเหมือนคำสารภาพรัก) ก่อนเปิดฉากสังหารหมู่กองกำลังองครักษ์คนแคระ 30–50 ตนในโถงทางเดินมืดด้วยตัวคนเดียวอย่างเหนือชั้นทั้งดาบ กริช ปืนพก ขวาน และค้อนที่ชิงมา พร้อมรำลึกถึง **สงครามเหมืองแร่** เมื่อ 10 ปีก่อน จนกระทั่งเข้าประชิดตัว **อัสตุก** และสังหารทิ้งหลังอีกฝ่ายเอ่ยปากดูหมิ่นหนวดเคราของ **องค์สุริยราชา** หลังจบศึกอีวานอุ้มอิซาเบลล์ที่ขาอ่อนแรงออกมาแต่ปฏิเสธคำชวนเลี้ยงข้าวตามหลักปฏิบัติของสายลับ\n- **บทที่ 45**: **ดมิทรี** สั่งตัดเงินเดือนตนเองด้วยความอับอายที่ข่าวกรองพลาดท่าให้คนแคระลอบขุดอุโมงค์ในเมืองหลวงและรีบออกตามหาอีวาน ด้าน **อิซาเบลล์** ระบายความสับสนเรื่องความสัมพันธ์กับอีวานให้ **เอซิดิส** ฟังเป็นรอบที่ 4 (เอซิดิสรับปากจะช่วยสืบผ่านคุณลุง **มอร์ด**) ส่วน **เอนริเก้** ก็หนีความรับผิดชอบมานอนอู้ในห้องทำงานของอีวานที่สถานเลี้ยงเด็กกำพร้าเซนต์วาซิลีซาหลายวันจนถูกอีวานไล่กลับไป (พร้อมเอ่ยเปรยไอเดียจัดทริปทัศนศึกษาทางทะเลให้มหาวิทยาลัยเซนต์ยานสก์) ส่งผลให้ **มอร์ด** นำไปเล่าให้หลานสาวฟังจน **เอซิดิส** เข้าใจผิดใหญ่โตว่าอีวานเป็นเสือผู้หญิงที่คบซ้อนอยู่กับเอนริเก้ถึงขั้นนอนค้างด้วยกัน 3 วัน และสาบานต่อหน้าไวโอลินว่าจะกำจัดอีวานเพื่อปกป้องเพื่อนรักให้ได้\n- **บทที่ 46 (สตอล์กเกอร์ ปะทะ สตอล์กเกอร์)**: เกริ่นระบบข่าวกรองของ 4 มหาอำนาจในสหราชอาณาจักร (โดรอัน คาลีออน ทิลเลส และคราซิลอฟจากยุค *เหล่าบุตรแห่งเอนริเก้* -> *หน่วยเก็บกวาด* -> *กองบัญชาการต่อต้านข่าวกรอง*) ขณะที่ **อีวาน** นั่งส่องกล้องจดบันทึกเมนูอาหารกลางวันของเด็กๆ ในสายปาร์ตี้ผู้กล้า หลังเหตุการณ์คนแคระซุ่มโจมตีจนเด็กปี 1 คณะอัศวินเข้าโรงพยาบาลกันหมด สถาบันจึงเลื่อนสอบ 1 สัปดาห์ ทำให้นักศึกษาคณะอัศวินเดือดดาลกับข้อสอบข้อเขียนจนพาลไปหาเรื่องคณะดุริยางคศิลป์ ทว่า **เอซิดิส** (กับพี่วีโอรุ่นที่ 3) กลับฟาดนักศึกษาปี 1 คณะอัศวินร่วงไป 5 คนรวด พวกนักศึกษาจึงไปตาม **มอร์ด** ออกมาสู้แต่พอเห็นหลานสาว มอร์ดก็ยอมแพ้ทันทีและไล่พวกนักศึกษาขุนนางทิลเลสกลับไปอ่านหนังสือ ด้านเอซิดิสตั้งสติกลับมาสืบหา “คนสวน” อีวานจนเห็นเขากำลังแอบจดประวัติ **เอลเฟียรา** อยู่บนต้นไม้ จึงเริ่มสะกดรอยตามอีวานในฐานะสตอล์กเกอร์\n- **บทที่ 47**: **อีวาน** รู้ตัวตั้งแต่ต้นว่า **เอซิดิส** กำลังสะกดรอยตามตนด้วยกิ่งไม้พรางตัวอย่างไม่เนียนเลยแม้แต่น้อย ก่อนจะใช้เวท ‘รบกวนการรับรู้’ ไปพบ **ดมิทรี** ที่ระเบียงทางเดินคณะอัศวิน ดมิทรีรายงานว่าสืบพบเบาะแสชิ้นส่วนระเบิดในวันปฐมนิเทศว่ามาจากกลุ่มขุนศึก **‘ยาร์ล’** ใน **โดรอัน** ที่ยอมจำนนต่อไอนาร์แต่ยังแอบก่อเหตุลับๆ เพื่อหมายหัว **เอซิดิส** หวังจุดชนวนสงครามระหว่างไอนาร์กับคราซิลอฟและบีบให้ **เอลิซาเวตา** เสียความน่าเชื่อถือเพื่อปูทางให้กองทัพหนุน **มกุฎราชกุมารอเล็กซานเดอร์** อีวานจึงวางแผนปล่อยให้เอซิดิสสะกดรอยตามตนต่อไปเพื่อให้อยู่ในสายตาตลอดเวลาและใช้เป็นเหยื่อล่อพวกผู้ก่อการร้าย จนทำให้เอซิดิสเข้าใจผิดคิดว่าตนเองกลายเป็นเป้าหมายรายต่อไปของอีวานจนแทบร้องไห้\n- **บทที่ 48**: **เอซิดิส** ถูกเพื่อนร่วมคณะดุริยางคศิลป์อิจฉาดูแคลนเรื่องไวโอลินสตราดิวาเรียสราคาแพงและไม่ยอมบอกตารางเรียนที่เปลี่ยนไป จนเธอนั่งร้องไห้ในห้องซ้อมคนเดียว ก่อนจะนึกย้อนถึงเหตุการณ์เมื่อ 10 ปีก่อนข้างกองไฟในสนามรบที่ “คุณลุง” คนหนึ่ง (ซึ่งแท้จริงคือ **อีวาน** สมัยสงคราม) เคยบอกให้เธอวางขวานแล้วเลือกจับเครื่องดนตรีอย่าง **ไวโอลิน** เพื่อเป็นสะพานเชื่อมผู้คนในยุคสันติภาพ เธอจึงฮึดสู้และไม่ยอมแพ้เพื่อรำลึกถึงคุณลุงที่เธอเข้าใจว่าเสียชีวิตไปแล้วและถูกฝังที่สุสานแห่งชาติคราซิลอฟ ตัดกลับมาที่สถานเลี้ยงเด็กกำพร้า **อีวาน** ไล่ **มอร์ด** ออกจากงานอาสาสมัครซักผ้าหลังจากซักผ้าเด็กขาดยับเยินมา 2 เดือน เพื่อปล่อยให้มอร์ดกลับไปทำหน้าที่คุ้มกันข้างกายเอซิดิสและใช้เป็นตัวล่อสายลับจากโดรอันที่อาจติดต่อเข้ามาหาเขา\n- **บทที่ 49**: **อีวาน** ฝึกฝน ‘ขอบเขตของผู้เหนือมนุษย์’ ให้ **อิซาเบลล์** ทุกค่ำคืนโดยถ่ายทอดคำสอนของ **เอนริเก้** ว่าอย่าหลงอยู่ในเงาของผู้เดินนำหน้า อิซาเบลล์เล่าว่า **เซอร์ดิอัน ออกัสต์** เจอชายต้องสงสัยมาด้อมๆ มองๆ หน้าบ้านของเธอแล้วหนีรอดไปได้ อีวานจึงวางตารางเฝ้าระวังแบบเต็มวัน (กลางวันเฝ้า **เอซิดิส** กลางคืนเฝ้า **อิซาเบลล์**) วันต่อมา อิซาเบลล์ชวนอีวานมาร่วมโต๊ะมื้อกลางวันกับ **ยูริ** และ **เอซิดิส** ได้สำเร็จ ทำเอาเอซิดิสช็อกหนักเมื่ออีวานวางผักลงบนแซนด์วิชของเธอพร้อมเทศนาเรื่องโภชนาการจนเธอเข้าใจว่าอีวานสอดแนมกระทั่งเมนูอาหารทุกวันของตน\n- **บทที่ 50**: ขณะที่ **อีวาน** ตามดู **เอซิดิส** และเตรียมเปลี่ยนขนมคุกกี้เป็นแครอตกรอบอบแห้งให้ **อิซาเบลล์** ก็แอบหนีเรียนมาจับผิดอีวานจนถูกไล่กลับไปตั้งใจเรียนและตั้งปณิธานว่าจะเข้าสู่ขอบเขตผู้เหนือมนุษย์เพื่อจับอีวานมัดสั่งสอนสามัญสำนึกให้ได้ ด้านเอซิดิสซึ่งหาห้องซ้อมรวมวงไม่เจอก็ได้รับความช่วยเหลือจากอีวานพร้อมกล่องแครอตกรอบอบแห้งและคำให้กำลังใจเรื่องดนตรีเชื่อมโยงผู้คน จังหวะที่อีวานยิ้ม เอซิดิสลองเอามือบังหนวดเคราของเขาและตกตะลึงที่ใบหน้าของอีวานละม้ายคล้าย “คุณลุง” ผู้ล่วงลับอย่างน่าประหลาด คืนนั้นเกิดเหตุระเบิดพร้อมกัน 5 จุดทั่วพริตเชนคายา (ธนาคารกลาง โรงละครทรงกลมซาเทรา มหาวิทยาลัยเซนต์ยานสก์ มหาวิหารเซนต์เชเรห์ตา และสถานีตำรวจกลางพราเชนโกเหนือ) ก่อนตัดเข้าสู่เหตุการณ์ที่อีวานเดินลาดตระเวนหน้าบ้านอิซาเบลล์เป็นคืนที่ 3 และใช้ประสาทรับกลิ่นระดับเหนือมนุษย์ตาม ‘รอยกลิ่น’ ของชายสอดแนมไปในความมืด\n- **บทที่ 51**: สายลับที่คอยสอดแนมบ้าน **อิซาเบลล์** วิ่งกลับมารายงานพรรคพวกและพูดหลุดปากถึงกำหนดการมาถึงของ **ดิโอนาร์ เอริกสัน** จากโดรอัน ก่อนถูก **อีวาน** ที่สะกดรอยตามมาจับตัวสอบปากคำด้วยโพชั่นรักษาบาดแผล ฝั่ง **เอซิดิส** สวดอธิษฐานต่อดวงดาวขอโทษคุณลุงอีวานที่เผลอเอาคนสวนจอมเจ้าชู้ไปเปรียบเทียบ ก่อนชวน **มอร์ด** ออกไปเดินเล่นยามค่ำคืนฤดูร้อนในพริตเชนคายา ส่วนอีวานเค้นความจริงจากลูกสมุนจนรู้ชื่อองค์กรกบฏข้ามชาติ **‘ฤดูใบไม้ผลิของปวงชน’** ที่ชูอุดมการณ์ประชาธิปไตยบังหน้าเพื่อลอบสังหารทายาทปาร์ตี้ผู้กล้า โดยมี **มกุฎราชกุมารอเล็กซานเดอร์** และสายข่าวที่รั่วไหลจากในวังคราซิลอฟหนุนหลังอยู่ อีวานจึงแบกขวานขึ้นบ่าเตรียมตามล่าตัว **ดิโอนาร์ เอริกสัน** ต่อไป\n\n- **บทที่ 52**: **ดมิทรี** เตรียมรับมือสงครามกลางเมืองที่ใกล้ปะทุในคราซิลอฟ ด้าน **อีวาน** สอบปากคำสายลับด้วยขวานสลับโพชั่นรักษาบาดแผลจนรู้ว่า **ดิโอนาร์** ลอบเข้ามาในพริตเชนคายาแล้วและไม่ได้เล็งแค่ตัวเอซิดิสแต่หมายจะก่อปฏิวัติทั่วเมืองหลวง อีวานจึงรีบมุ่งหน้าไปคุ้มกัน **เอซิดิส** ทว่าเธอและ **มอร์ด** ที่เพิ่งออกมาเดินเล่นยามค่ำคืนกลับเผชิญหน้ากับ **ดิโอนาร์ เอริกสัน** (ฮัสคาลของกษัตริย์ไอนาร์และน้องร่วมสาบานของมอร์ด) เข้าเสียก่อน\n- **บทที่ 53 (สายฝนฤดูร้อน)**: ท่ามกลางสายฝนฤดูร้อน **อีวาน** มาถึงบ้านพักที่ว่างเปล่าของเอซิดิส ขณะที่ **เอนริเก้** และ **ลูเซีย** ลงไปสกัดฝูงก็อบลินนักขุดเหมืองของคนแคระในคลองใต้ดินพริตเชนคายา จู่ๆ แรงสั่นสะเทือนจากการขุดเจาะใต้ดินด้วย **เครื่องขุดเจาะทลายปฐพี** ก็ปะทุขึ้น 5 จุดทั่วเมือง อีวานวิเคราะห์ว่าเป็นตัวลวงและรีบแกะรอยตามกลิ่นของมอร์ดจนพบร่าง **มอร์ด** นอนจมกองเลือดหลังถูก **ดิโอนาร์** (ที่ทรยศเพราะต้องการเป็นยาร์ลตามรอยบิดา) แทงชิงตัว **เอซิดิส** ไป อีวานช่วยชีวิตมอร์ดด้วยโพชั่นและตามรอยกลิ่นจากเศษแขนเสื้อของดิโอนาร์ต่อ ส่วนที่พระราชวัง **เอลิซาเวตา** มีรับสั่งให้ **ดมิทรี** เตรียมกำลังพลเพื่อโค่นบัลลังก์คราซิลอฟ\n- **บทที่ 54**: **อีวาน** แกะรอยกลิ่นดิโอนาร์ไปจนถึง **ทำเนียบกระทรวงการต่างประเทศ** ที่ **มกุฎราชกุมารอเล็กซานเดอร์** เป็นเจ้ากระทรวงและลอบบุกเข้าไปเพียงลำพัง ฝั่ง **ดมิทรี** และกองบัญชาการต่อต้านข่าวกรองบุกยึดกองพลรักษาการณ์นครหลวง ประหารนายทหารสมคบคิด ยึดพระราชวังหลวง ควบคุมตัวกษัตริย์ **คิริลล์ที่ 2** จนทรงสละราชสมบัติ และสั่งอพยพพลเรือนเพื่อให้ระเบิดของพวกกบฏกลายเป็นปืนใหญ่เฉลิมฉลองการครองราชย์ของเอลิซาเวตา ด้าน **เอซิดิส** ฟื้นขึ้นมาในคุกและพบว่า **อิซาเบลล์** กับ **ออสการ์** ก็ถูกจับมาด้วยเช่นกัน ส่วนอีวานพบ **ดิอัน** ที่บาดเจ็บในห้องสอบสวนชั้นสอง จึงรู้ว่าทิลเลสไม่มีไส้ศึก ก่อนจะเดินฝ่าซากศพทหารยามมุ่งหน้าขึ้นสู่ชั้นบนสุดของทำเนียบกระทรวงการต่างประเทศ\n- **บทที่ 55**: **อีวาน** สังหารทหารรับจ้างตามรายทางขึ้นมาถึงชั้นสามและชั้นสี่ของทำเนียบกระทรวงการต่างประเทศจนได้ยินเสียงกระซิบของ **เอซิดิส**, **อิซาเบลล์** และ **ออสการ์** จากชั้นห้า ทว่าถูก **ดิโอนาร์ เอริกสัน** ดักซุ่มโจมตีด้วยการขว้างดาบใหญ่ อีวานใช้ **สัญชาตญาณ** ของยอดมนุษย์หลบเลี่ยงและเปิดฉากประมือกับดิโอนาร์ซึ่งต่อสู้แบบสายเทคนิคด้วยเส้นด้ายเวทมนตร์ใยแมงมุมควบคู่กับดาบใหญ่ แต่เพราะอีวานเคยบุกทะลวงแนวรบกับ **เอนริเก้** ในฐานะหน่วยลาดตระเวนปาร์ตี้ผู้กล้าและเป็นผู้ให้กำเนิดนิยาม **ตัวสำรอง** จึงอ่านทางกับดักออกทั้งหมด ใช้ขวานอาบพลังเวทสีฟ้าตัดเส้นด้าย ชิงดาบใหญ่ของดิโอนาร์มาแทงทะลุท้อง และฟันสะบั้นแขนของอีกฝ่ายขาดรุ่งริ่งก่อนเหยียบอกกดลงพื้นเตรียมสอบปากคำต่อไป\n- **บทที่ 56**: **อีวาน** ใช้โพชั่นรักษาบาดแผลห้ามเลือดบาดแผลตัดแขนของ **ดิโอนาร์** แล้วใช้ขวานทรมานสลับกับการรักษาจนอีกฝ่ายยอมคายคำให้การทั้งหมดออกมาอย่างละเอียด ก่อนจะสิ้นใจลงหลังอีวานทวนถามข้อมูลซ้ำจนมั่นใจ จากนั้นอีวานเดินขึ้นมายังชั้นห้าและตรวจพบกระแสพลังเวทที่ไร้ตัวตนชีวภาพจากห้องทำงานรัฐมนตรีว่าการกระทรวงการต่างประเทศ จึงตามเข้าไปตรวจดูเสมือนเจอฮิดเดนพีซ แต่กลับพบ **มกุฎราชกุมารอเล็กซานเดอร์** ปรากฏกายด้วยเวท **การฉายภาพจิต (Astral Projection)** ระยะไกลในรูปลักษณ์เหมือนเมื่อ 10 ปีก่อน อเล็กซานเดอร์—ผู้เคยร่วมประทับตราคำสั่งภารกิจสุดท้ายของหน่วยเก็บกวาดเมื่อ 4 ปีก่อน—เอ่ยถามปริศนาเชิงปรัชญากับอีวานว่าเหตุใดความชั่วร้ายจึงยังหลงเหลืออยู่บนโลกแม้จอมมารจะตายไปแล้วก็ตาม (หมายเหตุผู้เขียนอธิบายความหมายชื่อรอง *คิริลลอฟนา/คิริลโลวิช* และที่มาชื่อศีลล้างบาปของอีวาน)\n- **บทที่ 57**: **อีวาน** ระงับความแค้นไว้เพื่อทำหน้าที่เก็บข้อมูลให้เอลิซาเวตาและสนทนากับ **มกุฎราชกุมารอเล็กซานเดอร์** ซึ่งเปิดเผยว่าตนเองล่วงรู้ความลับเรื่องผู้ข้ามมิติ อเล็กซานเดอร์อ้างถึงบันทึกต้องห้ามของศาสนจักรที่ชี้ว่าทวยเทพและปีศาจอาจเป็นเศษเสี้ยวของเหล่ายักษ์โบราณที่เกี่ยวข้องกับ **“ผู้ที่ถูกดึงตัวมา”** ทำให้อีวานเชื่อมโยงกับคำพูดของเบโอลกรินและเอนริเก้จนรู้ว่าเรื่องนี้เป็น **แนวกลุ่มดาว** และผู้ที่พลิกหน้าสุดท้ายของเรื่องราวได้ย่อมสามารถกลับบ้านได้ ก่อนจะฟาดทำลายอุปกรณ์ฉายภาพจิตทิ้งพร้อมประกาศกร้าวให้อเล็กซานเดอร์มีชีวิตอยู่รอจนกว่าตนจะตามหาเจอ จากนั้นอีวานไปผ่าโซ่ตรวนช่วย **เอซิดิส**, **อิซาเบลล์** และ **ออสการ์** ออกจากห้องขัง ระหว่างที่อีวานให้เอซิดิสขี่หลังเดินฝ่าโถงทางเดินอันโชกเลือดและปลอบโยนเธอด้วยถ้อยคำเดิมเมื่อ 10 ปีก่อน เอซิดิสก็จำได้ในที่สุดว่าเขาคือ **“คุณลุงอีวาน”** จากปาร์ตี้ผู้กล้าจนช็อกสลบไป ส่วน **อิซาเบลล์** ที่เดินตามมากับ **ออสการ์** กลับเข้าใจผิดคิดว่าเอซิดิสแกล้งขาอ่อนอ่อยขี่หลังอีวานจนหึงหวงกัดนิ้วเลือดซิบด้วยความแค้นเคือง (ปิดฉาก *เอพพิโซด 10: สตอล์กเกอร์ ปะทะ สตอล์กเกอร์*)\n- **บทที่ 58**: **อีวาน** ตื่นขึ้นมาอย่างมึนงงบนเตียงหรูพร้อมมีผู้หญิงตัวเล็กร่างบอบบางนอนขดอยู่บนเตียงเดียวกัน เขาคิดว่าเป็นความฝันของซัคคิวบัสจึงลองกรีดแขนตัวเองแล้วเทโพชั่นรักษาบาดแผลราดปลุกสติแต่ภาพตรงหน้ากลับไม่สลาย จึงตระหนักว่านี่คือความจริงและนึกย้อนว่าเมื่อวานตนกำลังค้นหา “ห้องลับ” ของมหาวิทยาลัยเซนต์ยานสก์ (*เอพพิโซด 11: มหาวิทยาลัยเซนต์ยานสก์กับห้องลับ*) ก่อนตัดย้อนไปหลังจบเหตุการณ์ในพริตเชนคายา: **เอลิซาเวตา** ทรงปฏิเสธราชบัลลังก์และประกาศปฏิรูปสู่ **ระบอบราชาธิปไตยภายใต้รัฐธรรมนูญ** โดยอ้างเหตุการณ์ลักพาตัวและมกุฎราชกุมารตัวปลอม ทรงเปิดท้องพระคลังแผ่นดินและรวบอำนาจทหาร การคลัง และข่าวกรองไว้ที่พระราชวังตะวันออกจนเหล่าขุนนางรวมถึง **เคานต์ยูซุฟ** ต้องรีบมาศิโรราบ ขณะที่อีวานในเวลานั้นกำลังลอบหลบหนี **เอซิดิส** ที่ถือมีดสั้นกับโฟมโกนหนวดวิ่งไล่จะจับเขาโกนเคราให้ได้\n- **บทที่ 59**: **อีวาน** บินกลับมาถึงพริตเชนคายาพร้อมลักพาตัวคนทรยศทั้งชุดนอนมาโยนส่งให้ **ดมิทรี** รีดข้อมูลต่ออย่างเงียบเชียบ ส่วน **เอลิซาเวตา** ทรงแจ้งดมิทรีว่าจะเสด็จไปมหาวิทยาลัยเซนต์ยานสก์พร้อมเตรียมปูนบำเหน็จให้อีวานเป็นพันเอกในภายหลัง ตัดกลับมาที่ห้องทำงานอธิการบดีมหาวิทยาลัยเซนต์ยานสก์อันหรูหรา เอลิซาเวตาทรงรับตำแหน่งอธิการบดีชั่วคราวด้วยพระองค์เอง สั่งผู้ใต้บังคับบัญชาเรียกขานว่า “ท่านอธิการบดี” และทรงเรียกตัวอีวานที่เพิ่งซักชุดทำงานเสร็จให้เข้าพบเพื่อหารือเรื่องใหญ่\n- **บทที่ 60**: ในห้องทำงานอธิการบดี **เอลิซาเวตา** ทรงเปิดเผยเอกสารลับว่า **โบราณวัตถุขุดเจาะของคนแคระ** หายสาบสูญเข้าไปในโพรงใต้ดินเบื้องล่างมหาวิทยาลัยเซนต์ยานสก์ซึ่งมีอาคมป้องกันโบราณอายุ 1,500–2,500 ปี จึงทรงเสนอ “ข้อตกลง” ให้อีวานลอบสำรวจและจัดการเรื่องนี้อย่างลับๆ อีวานตอบรับทันทีโดยไม่เรียกร้องสิ่งใดเพราะหวังทั้ง “ฮิดเดนพีซ” ในดันเจี้ยนและ “หนี้ทางใจ” เพื่อขอรับเงินอุปถัมภ์สถานเลี้ยงเด็กกำพร้าระยะยาว ทิ้งให้เอลิซาเวตาที่ซักซ้อมคำมั่นสัญญาสุดโรแมนติกหน้ากระจกไว้ล่วงหน้า 30 นาทีต้องซุกหน้าลงโซฟาแล้วบ่นว่า “เจ้าทึ่ม”\n- **บทที่ 61**: **เอซิดิส** ตัดสินใจจะดัดนิสัยและแต่งงานกับอีวานจึงเขียนจดหมายส่งกลับไปขออนุญาตท่านพ่อ และจับตาดู **อิซาเบลล์** ที่คอยเข้าหาอีวานอย่างหึงหวง ฝั่งอีวานที่กำลังตามหาจอมเวทสายตีความซึ่งไว้ใจได้เพื่อร่วมลงดันเจี้ยนใต้ดินได้พบกับอิซาเบลล์และแปะพลาสเตอร์ที่นิ้วหัวแม่มือให้ พร้อมทั้งปฏิเสธคำชวนทานข้าวของเธอทุกช่วงเวลาเพราะต้องทำงานภารกิจลับและดูแลสถานเลี้ยงเด็กกำพร้าในวันหยุด จนอิซาเบลล์ร้องไห้หนีไป\n- **บทที่ 62**: อีวานไปหา **ออสวัลด์** ที่คณะเวทมนตร์เพื่อตามหาจอมเวทที่เชี่ยวชาญ “การตีความเวทมนตร์โบราณ” และ “เวทป้องกัน” พร้อมรักษาความลับได้ ออสวัลด์จึงแนะนำ **เอลเฟียรา กริเคนคอส** ลูกสาวของเบโอลกรินซึ่งทำคะแนนสอบเข้ามหาวิทยาลัยเซนต์ยานสก์ได้สูงสุดเป็นประวัติการณ์ ทำให้อีวานนึกย้อนถึงความทรงจำอันย่ำแย่กับสองพ่อลูกเอลฟ์เมื่อ 12 ปีก่อน แต่พอได้พบเอลเฟียราในปัจจุบัน เธอกลับดูอ่อนน้อมถ่อมตนราวกับภาพวาดจนอีวานถึงกับงุนงง\n- **บทที่ 63**: อีวานโน้มน้าว **เอลเฟียรา** ได้สำเร็จด้วยข้อเสนอเรื่องโบราณวัตถุยุคโบราณเป็นของขวัญให้เบโอลกริน ก่อนจะพาเธอลงไปตามร่องรอยในทางระบายน้ำใต้ดินพริตเชนคายาจนพบโถงถ้ำทางเข้าที่ **โบราณวัตถุขุดเจาะของคนแคระ** ถูกทำลายหายไป เมื่อเอลเฟียราไม่พบร่องรอยเวทมนตร์ใดๆ อีวานจึงสั่งให้เธอเตรียมเวทป้องกันแล้วตัดประสาทการได้ยินและรับกลิ่นของตัวเอง ก่อนจะเหวี่ยงขวานเลียนแบบท่า ‘ผ่าดาราประกายพรึก’ ของแม็กซิมิเลียนซัดใส่จุดดังกล่าว ทิ้งให้เอลิซาเวตาที่ได้รับรายงานล่วงหน้าสุดมึนงงต้องกุมขมับว่าจะจับเขามาสั่งสอนระเบียบการรายงานให้ได้\n- **บทที่ 64**: แรงกระแทกจากคมขวานของอีวานทำให้โพรงถ้ำใต้ดินพังถล่มลงสู่เหว อีวานโอบเอว **เอลเฟียรา** กระโดดตามลงไปพร้อมใช้ขวานฟาดทำลายหินถล่มและปลุกขวัญให้เธอก้าวข้ามเงาของ **เบโอลกริน** จนสามารถรวบรวมสมาธิใช้หลักเวท “ฟ้า ดิน คน” มองเห็นม่านพลังเวทสีฟ้าครามขนาดมหึมาที่ซ่อนอยู่เบื้องหน้า ก่อนที่อีวานจะพยุงร่างเธอพุ่งทะยานตรงเข้าหาม่านพลังนั้น\n- **บทที่ 65**: อีวานติดอยู่ในภาพลวงตาความทรงจำสมัยรับใช้องค์ **มหาราชา** (จักรพรรดิสายฟ้า / หมีแห่งคราซิลอฟ) เมื่อ 14 ปีก่อน จึงใช้มีดสั้นกรีดแขนราดโพชั่นเรียกความเจ็บปวดทำลายฝันลวงจนทะลุเข้ามาในโบราณสถานรูปวิหารใหญ่ได้สำเร็จ ก่อนปลุก **เอลเฟียรา** ขึ้นมาตีความภาพสลัก **ภาษาเดเลนโบราณ** บนเสาหินและพบว่าที่นี่คืออนุสาวรีย์แห่งชัยชนะเพื่อสรรเสริญ **เทพแห่งแสง**\n- **บทที่ 66**: **เอลเฟียรา** ตีความจารึกอายุราว 2,000 ปีสมัย **จักรวรรดิเดเลนตะวันออก** พบว่าศาสนจักรสร้างอนุสาวรีย์ชัยชนะปิดผนึกลัทธินอกรีตที่ต่อสู้กับ “ความสุข” อีวานจึงสั่งให้เธอรอข้างหลังแต่เอลเฟียราก็ดื้อรั้นเดินตามพร้อมเฉลยความหลังเมื่อ 12 ปีก่อนที่ทั้งคู่เคยพบกัน เมื่อเปิดประตูบานใหญ่ด้านในสุด อีวานกลับเห็นภูเขา **หวีสางเครา** ขณะที่เอลเฟียราหลงเคลิ้มไปกับภาพลวงตาของทองคำ คัมภีร์เวท และยาอายุวัฒนะ **ลอเรน** ทำให้อีวานรู้ตัวว่านี่คือกับดักภาพมายาความปรารถนาจึงรีบตบแก้มเรียกสติเธอทันที\n- **บทที่ 67**: อีวานใช้เสียงสะท้อนและประสาทสัมผัสจับโครงสร้างของกับดักจนพบว่าแท้จริงแล้วกองสมบัติคือซากโครงกระดูกมนุษย์และมีดาบเหล็กปักอกรูปปั้นหินอ่อนสีดำที่ถักทอขึ้นด้วยพลังศักดิ์สิทธิ์ รูปปั้นซึ่งเรียกตัวเองว่า **‘ความรอด’ (Salvation)** พยายามล่อลวงให้อีวานดึงดาบปลดผนึกแลกกับการส่งกลับโลกมนุษย์ ทว่าอีวานจับไต๋ได้ว่ามันไม่สามารถจำลองสิ่งของจากโลกได้จริงและนึกถึงปณิธานของผู้กล้า จึงฝืนพลังสุขสันต์ปลดมือออกจากด้ามดาบแล้วบีบทำลายศีรษะของรูปปั้นหินอ่อนจนแหลกละเอียด\n- **บทที่ 68**: **เอลเฟียรา** ที่เพิ่งรอดจากแรงล่อลวงของรูปปั้นเห็นอีวานบดขยี้ศีรษะรูปปั้นด้วยมือเปล่า ก่อนจะร้องเตือนให้หนีเพราะพลังศักดิ์สิทธิ์กำลังคลุ้มคลั่งกลับตาลปัตร อีวานจึงเหวี่ยงเอลเฟียราออกไปรอนอกประตูส่วนตัวเองอยู่รับมือ “เฟส 2” กับเงามืดห้าหัวเพียงลำพังพร้อมดึงดาบเหล็กที่ใช้ผนึกเทพอสูรออกมาเป็นอาวุธ เมื่อจบศึก อีวานที่ตัวร้อนเป็นไฟจากพิษพลังศักดิ์สิทธิ์ประคองเอลเฟียราลอยขึ้นทางระบายน้ำใต้ดินก่อนหมดสติไป และฟื้นขึ้นมาบนเตียงหรูหราที่มีหญิงสาวนอนหันหลังอยู่ข้างกาย\n- **บทที่ 69 (มหาวิทยาลัยเซนต์ยานสก์กับห้องลับ)**: อีวานตื่นขึ้นในบ้านพักของ **เอลเฟียรา** ที่เขตหอพักเอลฟ์และรู้ว่า **นักบุญหญิงแพทริเซีย** มาสวดมนต์ถอนคำสาปความทุกข์ให้ตลอดทั้งคืน ก่อนเขาจะกลับไปรายงาน **เอลิซาเวตา** ตามปกติ ส่วนเอลเฟียราที่วิเคราะห์ความว่างเปล่าของอีวานจากกับดักหวีก็ตั้งปณิธานจะคอยฟื้นฟูอายุขัยและสอนให้เขารู้จัก “ความสุข” ทว่า **อิซาเบลล์** กับ **เอซิดิส** ดันมาเห็นอีวานเดินออกจากบ้านเอลเฟียราตอนเช้าจึงเข้าใจผิดและตกลงเป็นพันธมิตรปาร์ตี้ผู้กล้าต่อต้าน “แม่มดเอลฟ์” (จบ **เอพพิโซด 11**)\n"
};
