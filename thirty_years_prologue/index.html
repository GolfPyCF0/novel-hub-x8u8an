  "glossary": "# 📚 คัมภีร์ตัวละคร คำศัพท์ และสรรพนาม — 30 ปีผ่านไปนับจากบทนำ (30 Years Have Passed Since the Prologue)\n\n## ตัวละครหลัก\n- **อีวาน เปโตรวิช (Ivan Petrovich)** / **คิมซอนอู (Kim Sunwoo)** / **วันก้า (Vanka)**: พระเอก อายุ 34 ปี ชาวเกาหลีที่ข้ามมิติมาเกิดใหม่ในร่างเด็กชายชาวนาตั้งแต่ 30 ปีก่อน เคยรับราชการทหาร 18 ปี (ทหารเกณฑ์ -> ทหารประจำการ -> หน่วยเก็บกวาด) ปัจจุบันเป็นผู้อำนวยการสถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซีย และได้รับมอบหมายให้แฝงตัวไปเป็นคนสวนที่สถาบันเซนต์ยัน ฉายา: *ลูกเขยพระราชา, คนตัดไม้, ผู้สังหารมังกรเจ็ดตัว, ผู้เป็นอมตะ, ทหารกองหนุน*\n  - สรรพนาม: ใช้ *ฉัน / นาย* กับรุ่นน้องในกองทัพ, คิริลลอฟนาเรียกเขาว่า *วันก้า (Vanka)* และใช้ *ข้า / เจ้า*\n\n## ตัวละครรองและกลุ่มตัวละคร\n- **เอลิซาเวตา คิริลลอฟนา คราซิลอฟ (Elizaveta Kirillovna Krasilov)** / **คิริลลอฟนา (Kirillovna)**: อดีตผู้บังคับบัญชาของอีวานในกองทัพ (อีวานเรียก *พันเอกคิริลลอฟนา*, รุ่นน้องบอกตอนอีวานปลดประจำการเธอเป็น *พันตรี*) ปัจจุบันดำรงตำแหน่ง **อัครมหาเสนาบดี (Royal Chancellor)** และเป็น **องค์หญิง (Her Highness)** ฉายาในแนวหน้า: **“ริซ่าแห่งเหล็กกล้า” (Riza of Steel)** ตราประจำตัว: ดอกเบญจมาศ\n- **ดมิทรี เชอร์คาตอฟ (Dmitry / Dmitri Cherkatov)**: นายทหารรุ่นน้องจากหน่วยเก่าของอีวาน ปัจจุบันเป็นสายลับ/เจ้าหน้าที่ใต้บังคับบัญชาของเอลิซาเวตา เรียกอีวานว่า *รุ่นพี่* และใช้ *ผม / คุณ / รุ่นพี่*\n- **มกุฎราชกุมารอเล็กซานเดอร์ (Crown Prince Alexander)**: มีแผนจะแบ่งแยกและขายชาติ\n- **มหาราชา (Great King)**: พระราชาองค์ปัจจุบันที่ยังทรงนิ่งเฉย และเป็นผู้ยกเลิกเกณฑ์จำกัดอายุของสถาบันเซนต์ยัน\n- **ปาร์ตี้ผู้กล้า (Hero Party) และลูกหลาน/ศิษย์**:\n  - **ผู้กล้าแม็กซิมิเลียน (Maximilian)** — เคยมีวีรกรรม ‘ฟันผ่าท้องฟ้า’ แต่หายสาบสูญไปนานกว่า 4 ปีหลังปราบจอมมาร (ลือกันว่าปลีกวิเวกเข้าหุบเขาลึก) ภรรยา: **มารี (Marie)** — ลูกสาว: **อิซาเบลล์ (Isabelle)** (อาชีพคู่: จอมเวทและนักรบ, จากอาณาจักรทิลีส, ขาดความอบอุ่นและมีปมวิตกกังวลจากการรอคอยบิดา)\n  - **ดิอัน ออกัสต์ / ออกัสตัส (Dian August / Augustus)**: อัศวินองครักษ์สามัญชนของอิซาเบลล์ที่ราชวงศ์ทิลีสแต่งตั้ง ยอมเอาตัวเข้าแลกปกป้องอิซาเบลล์ในเหตุรถไฟตกรางจนบาดเจ็บสาหัสเพราะเชื่อว่าทายาทผู้กล้าคือความหวังของการฟื้นฟูยุคสมัยใหม่ ก่อนอีวานจะเข้ามาช่วยด้วยโพชั่นรักษาบาดแผล\n  - **อัศวินจิลแบร์ (Jilber / บทที่ 2 เรียกจิล Jill)** (ผู้พิทักษ์ชายแดน ภรรยาชื่อ **จูเลีย Julia**) — ลูกชาย: **ออสการ์ เดอ ซาติยง (Oscar de Sation)** (อัศวิน, จากอาณาจักรทิลีส, หน้าตาหล่อเหลา มีสาวๆ ห้อมล้อม ได้รับคำสั่งจากพ่อให้คุ้มครองอิซาเบลล์ยิ่งชีพ)\n  - **จอมเวทเวียลกริน (Veolgrin)** — ลูกสาว: **เอลเฟียรา (Elpheira / Elphira)** (จอมเวทหญิง, จากจักรวรรดิคาลีออน)\n  - **กษัตริย์ไอนาร์ อูลริกส์สัน / ไอนาร์มหาราช (Einar Ulriksson / King Einar the Great / บทที่ 2 เรียกพาลาดินไอนาร์)** ฉายา ‘จอมเชือด’ (Butcher) แห่งอาณาจักรโดรเวียน — ธิดาคนโต: **องค์หญิงเอคไดซิส ไอนาร์สดอตตีร์ (Ecdysis Einarsdotir / ชื่อเล่น: เอซี่ Ecy / บทที่ 2 สะกดว่า Esideth)** สมัครเข้าเรียนวิทยาลัยดุริยางคศิลป์ สาขาออร์เคสตรา (ไวโอลินชื่อ **พี่วีโอ / Vio-unnie**) ของสถาบันเซนต์ยัน (อาชีพคู่: กวีและเบอร์เซิร์กเกอร์)\n  - **‘คมดาบเงา’ เอนริเก้ / เอนริเก้ เซอร์เกเยวิช (Shadow Blade Enrique / Enrique Sergeyevich)**: แวมไพร์ระดับตำนานเพศหญิงอายุกว่า 100 ปี ผู้ให้กำเนิดหน่วยเก็บกวาด / ท่านปรมาจารย์ใหญ่ (Grand Master) ขององค์กรนักฆ่า และเป็นอาจารย์ของอีวาน (ไม่ได้เจอกันมา 7 ปี) มีรอยแผลเป็นรูปกางเขนที่โคนฝ่ามือ ขโมยรูปปั้น “ผู้กล้านิรนาม” จากสวนกลางเฟรเชนกายาไปไว้ในดันเจี้ยนใต้ดินทางตอนใต้ — ศิษย์: **ลูเซีย (Lucia / ชื่อเล่น: ลูซี่ Lucy)** หญิงสาววัยปลายรุ่นผมสีน้ำตาลเข้ม (โจรหรือนักฆ่า, อยู่ในเมืองหลวงคราซิลอฟ, เรียกอีวานว่า *ศิษย์พี่เปโตรวิช*)\n    - สรรพนาม: เอนริเก้ใช้ *ฉัน / นาย* กับอีวาน (อีวานใช้ *ผม / คุณ*)\n  - **นักบุญหญิงแพทริเซีย (Saint Patricia)** — ปีนี้เข้ามาเป็นอาจารย์สอนวิชาเทววิทยา (Theology) ที่สถาบันเซนต์ยัน\n- **ฮิวโก้ (Hugo)**: หัวหน้ากลุ่มโจรที่รับงานปล้น/ก่อการร้ายรถไฟสาย 12 ถูกอีวานจับเป็นและทรมานด้วยโพชั่นรักษาบาดแผลเพื่อรีดเบาะแส\n- **ฮัน (Han / ฮัสคาลผู้แฝงตัว / คุณลุงของเอคไดซิส)**: หนึ่งในพี่น้องร่วมสาบาน (ฮัสคาล) วัยสี่สิบกว่าปีของกษัตริย์ไอนาร์ ที่สอบผ่านข้อเขียนแบบเฉียดฉิวเข้าเป็นนักศึกษาปี 1 วิทยาลัยพลศึกษาของสถาบันเซนต์ยัน และวิ่งเท้าเปล่าตามรถไฟมาตลอด 2 วันเพื่อคุ้มกันเอคไดซิส\n- **พริสซิลลา (Priscilla)**: ศิษย์เก่าสถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซีย อายุ 17 ปี ไม่มีนามสกุล เด็กกำพร้าสงคราม ถูกลักพาตัวในตรอกมืดของเมืองหลวงโดยกลุ่มของเอนริเก้\n- **อิคารัส (Icarus)**: ปีศาจมีเขา อดีตผู้บัญชาการกององครักษ์จักรวรรดิที่ 6 (6th Imperial Guards) หัวหน้าหน่วยซุ่มโจมตีรถไฟของอิซาเบลล์ มีประสาทตรวจจับทิศทางเสียงปืน พ่ายแพ้ต่ออิซาเบลล์และถูกอีวานสอบปากคำด้วยโพชั่น หลังยอมรับข้อเสนอของอีวานให้ตัดเขาทิ้งเพื่อเริ่มต้นชีวิตใหม่ จึงถูกขึ้นทะเบียนเป็นสมาชิกใหม่ของสถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซีย (อายุ 50 ปี) (ลูกน้องที่ปรากฏชื่อ: **อินอฟ Inoff**)\n- **โอซิป โซเรนอฟ (Osip Sorenov)**: อดีตทหารเกณฑ์รุ่นสุดท้ายจากหน่วยจู่โจมที่ 3 ของหน่วยเก็บกวาดที่รอดชีวิตจากภารกิจสังหารเจ็ดราชามังกร ปัจจุบันเป็นสายลับใต้บังคับบัญชาของดมิทรี เรียกอีวานว่า *ผู้หมวดเปโตรวิช*\n- **ผู้ข้ามมิติปริศนา (เจ้าของหน้าต่างสถานะ / ‘ลูกคนเล็กจอมเสเพล’)**: นักศึกษาหรือบุคคลที่เข้าร่วมพิธีปฐมนิเทศสถาบันเซนต์ยัน รู้เนื้อเรื่องต้นฉบับและมีระบบหน้าต่างสถานะ/เควสต์ เผลอเรียกอีวานว่า “ซานตาคลอส” จนถูกอีวานจับสังเกตได้ว่าเป็นผู้ข้ามมิติและตกเป็นเป้าหมายไล่ล่า\n\n## สถานที่และองค์กร\n- **อาณาจักรคราซิลอฟ (Krasilov Kingdom)** — เมืองหลวง: **เฟรเชนกายา (Frechenkaya)** อาณาจักรที่อีวานอาศัยอยู่และเอลิซาเวตาดำรงตำแหน่งอัครมหาเสนาบดี มี **สวนสาธารณะกลางเฟรเชนกายา (Frechenkaya Central Garden)** ซึ่งเคยตั้งรูปปั้นอนุสรณ์ของ **พระเจ้าอีวานมหาราช (King Ivan the Great)** (“ผู้กล้าผู้เดินทัพ”, “เทพีแห่งชัยชนะ”, และ “ผู้กล้านิรนาม”)\n- **อาณาจักรโดรเวียน (Drovian Kingdom)**: อาณาจักรบ้านเกิดของไอนาร์และองค์หญิงเอคไดซิส เชื่อมต่อกับคราซิลอฟผ่านทางรถไฟสายที่ 12 (อดีตปกครองด้วยผู้นำชนเผ่า ‘ยาร์ล’ และมีกองกำลังองครักษ์ ‘เกชิน / ฮัสคาล’)\n- **อาณาจักรทิลีส (Tyllese Kingdom)**: อาณาจักรเพื่อนบ้านของคราซิลอฟ บ้านเกิดของอิซาเบลล์และออสการ์ เมืองหลวง: **เซนต์มาทิลด์ (St. Mathilde)** มี **กองพลรักษาการณ์ที่ 3 แห่งทิลีส (Tyllese's 3rd Guard Division)** ประจำแนวชายแดนตะวันตกเฉียงเหนือ (ฝั่งคราซิลอฟมี **กองพลป้องกันชายแดนคราซิลอฟ**, **กองบัญชาการป้องกันเฟรเชนกายา**, และเขต **ป่าสนคราเชนรอฟ (Kraschenrov)**)\n- **จักรวรรดิคาลีออน (Kalion Empire)**: จักรวรรดิบนเกาะอีกฟากของ **ทะเลดำ (Black Sea)** อาณาเขตของจอมเวทเวียลกรินและเอลเฟียรา\n- **สถานีอิกอเรวิชี / อิกอรอวิช (Igorevichi / Igorovich Station)**: สถานีรถไฟใกล้ชายแดนโดรเวียน–คราซิลอฟ ก่อนเข้าเขตทหารสามเขต\n- **สถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซีย (St. Basilicia Orphanage)**: สถานเลี้ยงเด็กกำพร้าสำหรับเด็กกำพร้าจากสงครามใกล้นครหลวง ก่อตั้งโดยอีวาน\n- **สถาบันเซนต์ยัน (St. Jan's Academy)**: สถาบันการศึกษานานาชาติชื่อดังแห่งสหราชอาณาจักร ก่อตั้งขึ้นในช่วงสงคราม ไม่จำกัดอายุผู้เข้าเรียน (ประกอบด้วยวิทยาลัยดุริยางคศิลป์ / Music College / Conservatory และวิทยาลัยพลศึกษา / Athletic College)\n- **หน่วยควบคุมเขตฟื้นฟูและพิสูจน์ฝ่ายศัตรู (Restoration Zone Control and Enemy Faction Identification Unit)** / **หน่วยเก็บกวาด / หน่วยกวาดล้าง (Cleanup Unit / Eradication Unit)**: หน่วยเฉพาะกิจที่อีวานสังกัดช่วงสงคราม ทำหน้าที่เก็บกวาดพื้นที่หลังปาร์ตี้ผู้กล้าสังหารผู้นำศัตรู\n\n## คำศัพท์เฉพาะ\n- **ดูแคต (Ducat)**: สกุลเงิน (เงินเดือนทหารเกณฑ์ 15 ดูแคตจากเขตตะวันออก)\n- **บทวิจารณ์ 5,700 ตัวอักษร (5,700-character critique)**: เงื่อนไข/มุกการข้ามมิติของชาวเกาหลีใต้ (เขียนวิจารณ์ยาวๆ จนนักเขียนตอบโต้ว่า \"งั้นลองมาทำเองดูสิ\")\n- **วันเปิดภาคเรียนมานลิตา (Manlita opening day)**: วันเปิดภาคเรียนของสถาบันเซนต์ยัน\n- **ทัณฑ์อินทรีโลหิต (Blood Eagle)**: โทษประหาร/ธรรมเนียมโหดของชาวโดรเวียน\n- **การตรวจจับแนววิถีกระสุน (Line of Fire Detection)** และ **จิตสังหาร (‘life’)**: ความสามารถของยอดฝีมือในการสัมผัสจิตสังหารและวิถีกระสุน/ลูกธนู ทำให้ปืนและธนูไร้ผลกับผู้แข็งแกร่ง\n- **ยาร์ล (Yals) / เกชิน (Geshins) / ฮัสคาล (Huscals)**: ผู้นำชนเผ่าและเหล่านักรบองครักษ์ผู้ภักดีของโดรเวียนที่ไม่รับเงินหรือที่ดิน มีสถานะเสมือนพี่น้องร่วมสาบานของกษัตริย์ไอนาร์\n",
  "story_memory": "# 🧠 เรื่องย่อสะสมแต่ละตอน — 30 ปีผ่านไปนับจากบทนำ (30 Years Have Passed Since the Prologue)\n\n- **บทที่ 1**: คิมซอนอูข้ามมิติมาเกิดใหม่ในร่างเด็กชายชาวนาชื่อ **อีวาน เปโตรวิช** โดยไม่มีหน้าต่างสถานะหรือความรู้เกี่ยวกับเรื่องราวของโลกใบนี้ เมื่ออายุ 14 ปี พ่อถูกเกณฑ์ไปรบและเสียชีวิต อีวานจึงสมัครเป็นทหารเพื่อส่งเงินให้แม่ เขาไต่เต้าจากทหารเกณฑ์จนได้เป็นทหารประจำการและเข้าสังกัด **หน่วยเก็บกวาด** ร่วมค่ายเดียวกับปาร์ตี้ผู้กล้า จนกระทั่งปราบจอมมารได้เมื่ออายุ 30 ปี แต่ฉากจบก็ไม่มาเสียที จึงปลดประจำการตอนอายุ 32 ปีมาเปิดสถานเลี้ยงเด็กกำพร้า จนอายุ 34 ปี (ครบ 30 ปีที่ข้ามมิติ) มีแขกจากวังหลวงมาหา ทำให้เขาเพิ่งรู้ตัวว่าโลกนี้อาจจะกำลังเข้าสู่แนว **สถาบันการศึกษา**\n- **บทที่ 2 (ทหารแก่ก็ต้องการพักผ่อน)**: นายทหารรุ่นน้องจากหน่วยเก่าลอบมาพบอีวานที่สถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซีย พร้อมอัญเชิญจดหมายประทับตราขี้ผึ้งรูปดอกเบญจมาศจาก **เอลิซาเวตา คิริลลอฟนา คราซิลอฟ** (อดีตผู้บังคับบัญชา ฉายา “ริซ่าแห่งเหล็กกล้า” ปัจจุบันเป็นองค์หญิงและอัครมหาเสนาบดี) ในจดหมายขอร้องให้ \"วันก้า\" กลับมาช่วยดูแล \"สวน\" ที่กำลังเสื่อมโทรมท่ามกลางวิกฤตการเมืองที่มกุฎราชกุมารอเล็กซานเดอร์คิดขายชาติ รุ่นน้องเปิดเผยว่าปีนี้บรรดาลูกหลานและศิษย์ของสมาชิกปาร์ตี้ผู้กล้า รวมถึงตัวนักบุญหญิงแพทริเซียเอง ต่างพากันเข้ามาเรียนและสอนที่ **สถาบันเซนต์ยัน** อีวานจึงถูกส่งเข้าไปเป็น \"คนสวน\" เพื่อคอยคุ้มครองและจับตาดูคนเหล่านั้นไม่ให้เกิดเรื่องลุกลามเป็นสงครามระหว่างประเทศ อีวานจำใจรับพระบัญชา โดยหวังว่าอดทนอีกแค่ 3 ปีคงจะได้เห็นฉากจบเสียที\n- **บทที่ 3**: อีวานขุดคุ้ยความทรงจำของคิมซอนอูเพื่อวิเคราะห์สูตรสำเร็จของนิยายแนวสถาบันการศึกษา (ทั้งปีศาจแอบแฝง คนทรยศในคณาจารย์ ห้องลับ สายลับรัฐบาล และเงื่อนไขฉากจบที่อาจเป็นการคืนชีพของจอมมาร) เขาฟันธงว่า \"รถไฟรับนักเรียนเข้าสถาบัน\" จะต้องโดนก่อการร้ายแน่นอน ฝั่งอาณาจักรโดรเวียน **องค์หญิงเอคไดซิส** ธิดาของกษัตริย์ไอนาร์ (ผู้สอบติดสาขาออร์เคสตรา สถาบันเซนต์ยัน) ขึ้นรถไฟออกเดินทางก่อนใคร สองวันต่อมารถไฟขบวนนั้นก็ตกรางใกล้ชายแดนคราซิลอฟ อีวานจึงคว้าปืนพกและขวานออกปฏิบัติการทันที\n- **บทที่ 4**: อีวานวิเคราะห์เส้นทางรถไฟสาย 12 ร่วมกับรุ่นน้อง (**ดมิทรี เชอร์คาตอฟ**) และฟันธงว่าจุดก่อการร้ายจะอยู่ที่ **สถานีอิกอเรวิชี** ใกล้ชายแดนก่อนเข้าสู่เขตทหารสามเขตของคราซิลอฟ เพื่อป้ายความผิดและสร้างรอยร้าวระหว่างคราซิลอฟกับโดรเวียน อีวานขึ้นรถไฟมุ่งหน้าไปชายแดนเพียงลำพังเพื่อคุ้มกันทั้ง 5 เส้นทาง ขณะเดียวกัน ดมิทรีกลับไปรายงาน **เอลิซาเวตา** (อัครมหาเสนาบดี) ที่พระราชวัง ซึ่งเธอสั่งให้ดมิทรีส่งคนติดตามบันทึกกิจวัตรประจำวันของวันก้าไว้ตลอดเวลา เมื่อสายลับของดมิทรีไปถึงสถานีอิกอเรวิชี พวกเขาก็พบเพียงถุงใส่ศพ 3 ใบที่ห่อไว้อย่างเรียบร้อยและสถานที่เกิดเหตุที่ถูกเช็ดคราบเลือดจนสะอาด ส่วนอีวานกำลังวิ่งลัดเลาะป่าพร้อมขวานในมือ\n- **บทที่ 5**: ที่สถานีอิกอรอวิช อีวานสังเกตเห็นชายต้องสงสัย 3 คน (คนดูนาฬิกา-หนังสือพิมพ์, คนแกล้งหลับ, และพ่อค้าผักเหี่ยว) เมื่อทดสอบด้วยคำถามรหัสความภักดีแล้วพบว่าเป็นแค่ทหารรับจ้างไร้ฝีมือตรวจจับแนววิถีกระสุน อีวานจึงสังหารทั้ง 3 คนและรีดข้อมูลจากพ่อค้าผักก่อนฆ่าทิ้งจนรู้ว่ามีโจรอีก 15 คนดักปล้น \"รถไฟขนทองคำแท่ง\" อยู่ริมราง อีวานลบร่องรอยใน 5 นาทีและสะกดรอยตามสัญญาณเวทมนตร์ไป โดยตั้งใจปล่อยให้เหตุการณ์ก่อการร้ายรถไฟซึ่งเป็น \"ด่านฝึกสอนของตัวเอกทุกคน\" ดำเนินไป แต่ตัวเองจะคอยเก็บกวาดเบื้องหลังและสาวถึงตัวบงการแทน\n- **บทที่ 6**: หัวหน้าโจร **ฮิวโก้** กดจุดระเบิดทำให้รถไฟที่เอคไดซิสโดยสารมาตกรางก่อนถึงสถานีอิกอรอวิช อีวานซุ่มยิงเก็บลูกสมุน 5 คนที่อยู่แนวหลังได้อย่างเฉียบขาดและจับเป็นฮิวโก้เพื่อทรมานรีดเบาะแสเกี่ยวกับผู้จ้างวาน (ไม่ฆ่าเพราะกะเก็บไว้เป็นบอสฝึกสอนให้ตัวเอก) บนรถไฟ **องค์หญิงเอคไดซิส** ฟื้นขึ้นมาและคว้าไวโอลินขึ้นมากำด้ามราวกับขวานเตรียมสู้ ขณะเดียวกันที่ชายป่า นักรบ **ฮัสคาล** วัยสี่สิบกว่าปีซึ่งเป็น \"คุณลุง/พี่น้องร่วมสาบาน\" ของกษัตริย์ไอนาร์ (และแอบสอบเข้าเป็นนักศึกษาปี 1 วิทยาลัยพลศึกษาของสถาบันเซนต์ยันไว้ล่วงหน้า) ที่วิ่งเท้าเปล่าตามรถไฟมาตลอด 2 วัน เห็นรถไฟตกรางจึงพุ่งทะยานฝ่าป่าเข้าไปช่วยหลานสาวทันที\n- **บทที่ 7**: อีวานใช้วิธีสอบปากคำแบบยั่งยืนด้วยการราดโพชั่นรักษาบาดแผลสลับกับซักถามฮิวโก้ แต่ไม่พบเบาะแสเพิ่มเนื่องจากพวกโจรใส่เสื้อโค้ตหนาและใช้เวทมนตร์ปิดบังตัวตน ทันใดนั้น **ฮัน (คุณลุงฮัสคาล)** พุ่งเข้ามาปะทะกับอีวานด้วยขวานเพราะเข้าใจผิดว่าอีวานเป็นพวกเดียวกับโจร ฝั่งเอคไดซิสใช้ไวโอลินคู่ใจ (\"พี่วีโอ\") ฟาดหัวโจรจนไวโอลินพังยับและทำให้พวกโจรที่เหลือวิ่งหนีตายออกมาเจอทั้งสองคน เมื่อเอคไดซิสปรากฏตัวปลอดภัยดี อีวานจึงถอนตัวกลับไปส่งรายงานเข้ารหัสให้ราชสำนัก ส่วนฮันที่จำวิชาขวานของไอนาร์ได้ก็นึกสงสัยว่าอีวาน (‘ตัวสำรองผู้กล้า’ ที่ลือว่าตายไปเมื่อ 2 ปีก่อน) ยังมีชีวิตอยู่และสังกัดหน่วยข่าวกรอง จึงพาเอคไดซิสบังคับพวกโจรแบกแคร่หามเดินทางต่อสู่เมืองหลวง\n- **บทที่ 8**: อีวานตรวจเช็กกำหนดการเดินทางของทายาทปาร์ตี้ผู้กล้าคนอื่นๆ (อิซาเบลล์และออสการ์จากอาณาจักรทิลีส, เอลเฟียราจากจักรวรรดิคาลีออนทางเรือ, และลูเซียที่อยู่ในเมืองหลวงแล้ว) และกลับมานั่งพักผ่อนที่สถานเลี้ยงเด็กกำพร้ากับเด็กๆ ที่ชอบเล่นเกมแอบย่องเข้าหาเขา ทว่า **พริสซิลลา** ศิษย์เก่าอายุ 17 ปีถูกลักพาตัวไปในตรอกมืดของเมืองหลวง **เฟรเชนกายา** เมื่อเธอเอ่ยชื่ออีวานขู่พวกนักเลง **‘คมดาบเงา’ เอนริเก้** (อาจารย์ของลูเซียและผู้ก่อตั้งหน่วยเก็บกวาด) ก็บังเอิญมาได้ยินและเข้าใจผิดคิดว่าอีวานแอบฝึกเด็กกำพร้าเป็นหน่วยนักฆ่าลับหลังตน เอนริเก้จึงฝากเสื้อโค้ตที่มีรอยประทับมือเป็นแผลเป็นรูปกางเขนส่งกลับมาเพื่อเรียกตัวอีวานไปพบ\n- **บทที่ 9**: อีวานแกะรอยไปยังดันเจี้ยนใต้ดินทางตอนใต้ของเฟรเชนกายา ซึ่งเป็นที่ซ่อนรูปปั้น “ผู้กล้านิรนาม” ที่เอนริเก้ขโมยมาจากสวนกลางเมืองหลวง และได้พบหน้า **เอนริเก้** (แวมไพร์หญิงระดับตำนานและอดีตอาจารย์ของเขาที่ไม่เจอกัน 7 ปี) ทั้งสองฝ่ายต่างระแวงและเข้าใจผิดกันไปคนละทาง: เอนริเก้คิดว่าอีวานแอบตั้งองค์กรนักฆ่าแข่งในถิ่นเธอและส่งคนมาประกาศสงคราม ส่วนอีวานก็ระแวงว่าเอนริเก้แปรพักตร์ไปเข้าข้างมกุฎราชกุมารอเล็กซานเดอร์ ทั้งคู่ต่างแลกเปลี่ยนวาทะเชิงหยั่งเชิงท่ามกลางความเข้าใจผิดในช่วงกลางเดือนมกราคม\n- **บทที่ 10**: อีวานยอมอ่อนข้อก่อนและเอ่ยถึง **ลูเซีย** ลูกศิษย์ของเอนริเก้ที่จะเข้าเรียนสถาบันเซนต์ยัน ทำให้เอนริเก้ยิ่งเข้าใจผิดว่าอีวานเอาลูกศิษย์มาข่มขู่ ก่อนจะเรียกลูเซียออกมาแนะนำตัว (ลูเซียเปิดเผยทัศนคติสุดหัวก้าวหน้าเรื่อง ‘มนุษยธรรม’ จนอีวานทึ่ง) เมื่อบรรยากาศตึงเครียดถึงขีดสุด ทั้งคู่จึงได้ปรับความเข้าใจกันจนรู้ว่าต่างฝ่ายต่างไม่ได้เข้าข้างอเล็กซานเดอร์ และพริสซิลลาฝึกซุ่มโจมตีจากการละเล่นในสถานเลี้ยงเด็กกำพร้าเอง ส่วนอีวานได้รับภารกิจจากเอลิซาเวตาให้ช่วยอารักขาเอนริเก้และศิษย์ หลังแยกจากเอนริเก้และพาพริสซิลลากลับมาอย่างปลอดภัย เธอถามด้วยน้ำตาว่าเขาจะจากไปใช่ไหม อีวานจึงเผลอบอกไปว่าเขากำลังจะไป **สถาบันเซนต์ยัน** ส่งผลให้ชาวสถานเลี้ยงเด็กกำพร้าบาซิลิเซียทุกคนพากันคร่ำเคร่งเตรียมตัวสอบเข้าสถาบันเซนต์ยันกันยกใหญ่\n- **บทที่ 11**: ย้อนความทรงจำสมัยสงครามที่ **แม็กซิมิเลียน** เคยตวัดดาบ ‘ฟันผ่าท้องฟ้า’ และ **ไอนาร์** จามภูเขาทั้งลูกจนปาร์ตี้ผู้กล้าต้องวิ่งหนีฝูงไวเวิร์นกันหัวซุกหัวซุน ก่อนตัดกลับมาที่ปัจจุบันในอีก 2 สัปดาห์ต่อมา อีวานต้องเดินทางไปที่เมืองหลวง **เซนต์มาทิลด์** ของ **อาณาจักรทิลีส** พร้อมกับสายลับมือใหม่จากกองบัญชาการข่าวกรอง 5 คนที่ **ดมิทรี** ส่งมาประกบ (ด้วยความสงสัยว่าอีวานมีเครือข่ายลับ) อีวานจึงอบรมสั่งสอนพวกสายลับแบบเข้มงวดตลอด 18 ชั่วโมงก่อนปล่อยให้พวกนั้นไปคุ้มครอง **ออสการ์** ส่วนตัวเองแยกตัวมาขึ้นรถไฟขบวนเดียวกับ **อิซาเบลล์** (ลูกสาวผู้กล้าแม็กซิมิเลียน) ซึ่งกำลังน้อยใจที่พ่อไม่มาส่งและไล่ตะเพิด **ออกัสตัส** อัศวินองครักษ์ที่คอยยิ้มเอาใจอย่างไร้ความจริงใจ\n- **บทที่ 12**: รถไฟจากทิลีสมุ่งหน้าคราซิลอฟแล่นผ่านจุดซุ่มโจมตีที่คาดการณ์ไว้ถึง 3 จุดอย่างสงบจนอีวานเริ่มสติแตกและวิตกกังวลว่าตัวเองอาจเดาแนวเรื่องผิดและโลกนี้ไม่มีฉากจบ ทำให้จิตสังหารแผ่ซ่านออกมาจนคนข้างๆ แทบขาดใจ ทว่าจังหวะที่รถไฟแล่นออกจากอุโมงค์ขึ้นสะพานเหนือหุบเขา สะพานก็ถูกระเบิดถล่มจนรถไฟตกราง อีวานจึงสงบใจลงและรีบไต่ขึ้นซากรถไฟเพื่อเข้าช่วยเหลือ ด้าน **อิซาเบลล์** ฟื้นขึ้นมาในตู้โดยสารที่ถูกดินกลบและพบว่า **ดิอัน ออกัสต์ (ออกัสตัส)** อัศวินองครักษ์ยอมเอาตัวรับแรงกระแทกปกป้องเธอจนบาดเจ็บสาหัส ออกัสต์เปิดเผยว่าแม้จะไม่ชอบนิสัยเธอ แต่การมีอยู่ของเธอในฐานะทายาทผู้กล้าคือความหวังของการฟื้นฟูยุคสมัยใหม่ ทันใดนั้นอีวานก็ขุดดินทะลุเข้ามาช่วยและหยิบโพชั่นรักษาบาดแผลออกมาช่วยชีวิตออกัสต์ไว้\n- **บทที่ 13**: ฤทธิ์เจ็บปวดของโพชั่นทำให้เซอร์ดิอัน ออกัสต์ ช็อกจนสติย้อนวัยกลับเป็นเด็กชั่วคราว อีวานจึงให้อิซาเบลล์แบกออกัสต์ออกไปรวมตัวกับผู้รอดชีวิตที่เหลืออีก 10 คนและก่อกองไฟรอ ส่วนตัวเองแยกออกไปในป่ามืดเพื่อเปิดฉากซุ่มโจมตีหน่วยเก็บกวาดใส่ศัตรูที่โอบล้อมอยู่รอบภูเขาก่อน ทันทีที่ได้ยินเสียงปืนนัดแรกของอีวาน ออกัสต์ที่เพิ่งได้สติคืนมาก็ได้ถ่ายทอดคำสอนวิถีอัศวินโบราณบทสุดท้ายให้กับอิซาเบลล์ว่าให้จับดาบเพื่อความเที่ยงธรรมและยืนหยัดในจุดเดียวกับผู้อ่อนแอ ทำให้อิซาเบลล์ตั้งปณิธานได้สำเร็จ\n- **บทที่ 14**: อีวานใช้กลยุทธ์กองโจรของหน่วยเก็บกวาดซุ่มยิงและฟันสังหารกำลังพลราว 50 คนของฝ่ายศัตรูทีละจุด พร้อมทั้งวางกับดักด้ายผูกไกปืนกับศพเพื่อปั่นประสาทหน่วยบัญชาการศัตรู จน **อิคารัส** (ปีศาจมีเขา อดีตผู้บัญชาการกององครักษ์จักรวรรดิที่ 6) จับไต๋ได้ว่าผู้ลอบโจมตีมีเพียงคนเดียวและกำลังล่อให้พวกตนแตกแถว อิคารัสจึงสั่งลูกน้องไปรุมจัดการอีวานในป่า ส่วนตัวเองมุ่งหน้าไปเผชิญหน้ากับอิซาเบลล์ที่จุดพักแรมโดยตรง\n- **บทที่ 15**: อีวานเริ่มสงสัยว่าด่านฝึกสอนของอิซาเบลล์ยากผิดปกติเมื่อเทียบกับเอคไดซิส และกังวลว่าตัวเองอาจเป็นเพียง NPC ตัวช่วยในเกม จึงแอบขึ้นไปสังเกตการณ์บนต้นไม้โดยไม่ยื่นมือเข้าไปช่วยในทันที ด้านอิซาเบลล์สู้กับอิคารัสจนดาบกระเด็นหลุดมือและเกือบถูกฟันสังหาร ทว่าเมื่อนึกถึงคำสอนวิถีอัศวินของออกัสต์ เธอก็ตื่นรู้พลังในเสี้ยววินาที ย่อตัวหลบคมดาบแล้วแทงทะลุร่างอิคารัสจนเอาชนะได้ อีวานซึ่งจัดการศัตรูในป่าทั้งหมดเรียบร้อยแล้วจึงเดินออกมาชื่นชม (ยืนยันได้ว่าตัวเองคือตัวแปรที่ไม่ใช่ NPC) และเปิดขวดโพชั่นรักษาบาดแผลเพื่อเตรียมสอบปากคำอิคารัสหาเบื้องหลังการแทรกซึมของพวกปีศาจ\n- **บทที่ 16**: อีวานราดโพชั่นรักษาบาดแผลใส่แผลฉกรรจ์ของ **อิคารัส** และช่วยชีวิตตอนที่อิคารัสกัดลิ้นฆ่าตัวตาย จนได้ข้อมูลว่าที่พวกปีศาจต้องส่งอิคารัสมาลงมือเองเพราะหน่วยสาวกในสหราชอาณาจักรถูกแทรกซึมและพ่ายแพ้สงครามข่าวสารไปแล้ว เมื่ออิคารัสสิ้นหนทางกลับและขอตาย อีวานกลับยื่นข้อเสนอให้ละทิ้งตัวตนเดิมแล้วไปเริ่มต้นชีวิตใหม่ที่สถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซีย อิคารัสเลือกจะมีชีวิตอยู่และยอมให้อีวานตัดเขาทิ้ง หลังจบเรื่อง อีวานจึงปลอบใจอิซาเบลล์ที่รู้สึกผิดต่อผู้เสียสละและกระตุ้นให้เธอเงยหน้าขึ้นเป็นความหวังและผู้กล้าของทุกคน\n- **บทที่ 17**: ปลายเดือนกุมภาพันธ์ วันพิธีปฐมนิเทศของ **สถาบันเซนต์ยัน** เรือประจัญบานลอยฟ้าซึ่งเป็นเรือธงของ **จักรวรรดิคาลีออน** บินข้ามเขตแดนมาส่ง **เอลเฟียรา** เพื่อแสดงการประท้วงเรื่องความปลอดภัยในคราซิลอฟ อีวานที่แฝงตัวเป็นเจ้าหน้าที่ได้พบกับ **อิซาเบลล์** และ **ออสการ์ เดอ ซาติยง** (ลูกชายของจิลแบร์) พออีวานแนะนำตัวว่าเป็น “คนสวน” อิซาเบลล์ก็เข้าใจผิดคิดว่าเป็นรหัสลับของสายลับรัฐบาล ตัดฉากไปในหอประชุมใหญ่ จู่ๆ ก็มีใครบางคนมองเห็น **หน้าต่างสถานะ** ปรากฏขึ้นตรงหน้า\n- **บทที่ 18**: อีวานใช้เวลาว่างในตำแหน่งคนสวนที่ไม่มีสวนของสถาบันเซนต์ยันเดินไล่เก็บกู้ระเบิดเวทมนตร์ทำมือ 3 ลูกที่คนร้ายลอบวางไว้ก่อนพิธีปฐมนิเทศ ทันใดนั้นเขาก็ได้ยินเสียงคนพูดพึมพำเรียกตัวเองว่า “ซานตาคลอส” เมื่อปะทะกันชั่วพริบตา อีวานก็วิเคราะห์ได้ทันทีว่าอีกฝ่ายคือ **ผู้ข้ามมิติ** ที่รู้จักต้นฉบับและรู้ฉากจบของโลกนี้ อีวานจึงแสดงตัวกับ **โอซิป โซเรนอฟ** (อดีตทหารหน่วยเก็บกวาดจากหน่วยจู่โจมที่ 3) เพื่อสั่งการผ่านดมิทรีให้รวบรวมรายชื่อผู้เข้าออกสถาบันทั้งหมดและตั้งใจจะกำจัดผู้ข้ามมิติคนนั้นทิ้งเพื่อไม่ให้ถูกขวางทางกลับบ้าน ส่วนทางฝั่งผู้ข้ามมิติปริศนา (ในร่างลูกคนเล็กจอมเสเพล) ที่เพิ่งพลาดเควสต์กู้ระเบิดเพราะอีวานเก็บกู้ไปหมดแล้ว ก็ได้รับเควสต์ระดับ `???` ให้กำจัดหรือเอาชีวิตรอดจาก “คนสวนแห่งสถาบันเซนต์ยัน อีวาน เปโตรวิช” โดยมีบทลงโทษคือความตาย\n"
};

</script>
  <script>
    const STORAGE_PREFIX = "thirty_years_prologue";
    const data = window.NOVEL_DATA || { novel_title: "30 ปีผ่านไปนับจากบทนำ (30 Years Have Passed Since the Prologue)", chapters: [], illustrations: [] };
    let currentIdx = parseInt(localStorage.getItem(STORAGE_PREFIX + "_ch_idx") || "0", 10);
    let fontSize = parseInt(localStorage.getItem("novel_reader_font_size") || "20", 10);
    let theme = localStorage.getItem("novel_hub_theme") || "dark";
    let currentVolIdx = 0;
    let illustViewMode = localStorage.getItem("novel_reader_illust_view") || "vertical";
    let currentLightboxIdx = 0;

    function goBookshelf() {
      if (location.protocol === "file:") {
        location.href = "../คลังนิยายทั้งหมด.html";
      } else {
        location.href = "../index.html";
      }
    }

    function formatBody(text) {
      const paras = text.split(/\n\s*\n/);
      return paras.map(p => {
        const trimmed = p.trim();
        if (!trimmed) return "";
        if (trimmed === "***" || trimmed === "...") return "<hr/>";
        const html = trimmed
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/\n/g, "<br/>");
        return `<p>${html}</p>`;
      }).join("");
    }

    function updateIllustButtonLabel() {
      const vols = data.illustrations || [];
      const total = vols.reduce((acc, v) => acc + ((v.images || []).length), 0);
      const btn = document.getElementById("btnIllust");
      if (btn) {
        btn.textContent = total > 0 ? `🖼️ ภาพประกอบ (${total})` : `🖼️ ภาพประกอบ`;
      }
    }

    function render() {
      document.getElementById("novelTitle").textContent = data.novel_title || "คลังนิยาย";
      updateIllustButtonLabel();
      const chapters = data.chapters || [];
      if (currentIdx >= chapters.length) currentIdx = Math.max(0, chapters.length - 1);

      const volSel = document.getElementById("volumeSelect");
      const sel = document.getElementById("chapterSelect");
      volSel.innerHTML = "";
      sel.innerHTML = "";

      const ch = chapters[currentIdx];
      if (!ch) {
        document.getElementById("volumeBadge").textContent = "";
        document.getElementById("chapterTitle").textContent = "ยังไม่มีตอนที่แปล";
        document.getElementById("chapterBody").innerHTML = "";
        return;
      }

      const volumes = [];
      chapters.forEach(item => {
        const v = item.volume || "เล่ม 1";
        if (!volumes.includes(v)) volumes.push(v);
      });
      volumes.forEach(v => {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = `📘 ${v}`;
        volSel.appendChild(opt);
      });

      const currentVol = ch.volume || "เล่ม 1";
      volSel.value = currentVol;
      volSel.style.display = volumes.length > 1 ? "" : "none";

      chapters.forEach((item, idx) => {
        if ((item.volume || "เล่ม 1") !== currentVol) return;
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = `${item.title}`;
        sel.appendChild(opt);
      });
      sel.value = currentIdx;

      document.getElementById("volumeBadge").textContent = `📘 ${currentVol}`;
      document.getElementById("chapterTitle").textContent = ch.title;
      document.getElementById("chapterBody").innerHTML = formatBody(ch.content);
      document.getElementById("pageIndicator").textContent = `${currentVol} • ตอนที่ ${currentIdx + 1} จากทั้งหมด ${chapters.length} ตอนที่แปลแล้ว`;

      const hasPrev = currentIdx > 0;
      const hasNext = currentIdx < chapters.length - 1;
      document.getElementById("btnPrevTop").disabled = !hasPrev;
      document.getElementById("btnPrevBottom").disabled = !hasPrev;
      document.getElementById("btnNextTop").disabled = !hasNext;
      document.getElementById("btnNextBottom").disabled = !hasNext;

      localStorage.setItem(STORAGE_PREFIX + "_ch_idx", String(currentIdx));
    }

    function selectVolume(volName) {
      const chapters = data.chapters || [];
      const firstIdx = chapters.findIndex(item => (item.volume || "เล่ม 1") === volName);
      if (firstIdx !== -1) {
        selectChapter(firstIdx);
      }
    }

    function selectChapter(idx) {
      currentIdx = parseInt(idx, 10);
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function prevChapter() { if (currentIdx > 0) selectChapter(currentIdx - 1); }
    function nextChapter() { if (currentIdx < (data.chapters || []).length - 1) selectChapter(currentIdx + 1); }

    function changeFont(delta) {
      fontSize = Math.max(14, Math.min(32, fontSize + delta));
      document.documentElement.style.setProperty("--font-size", fontSize + "px");
      localStorage.setItem("novel_reader_font_size", String(fontSize));
    }

    function setTheme(t) {
      theme = t;
      document.body.classList.remove("theme-sepia", "theme-light");
      if (t !== "dark") {
        document.body.classList.add("theme-" + t);
      }
      document.getElementById("tDark").classList.toggle("active", t === "dark");
      document.getElementById("tSepia").classList.toggle("active", t === "sepia");
      document.getElementById("tLight").classList.toggle("active", t === "light");
      localStorage.setItem("novel_hub_theme", t);
    }

    function toggleMenu(hide) {
      const shouldHide = typeof hide === "boolean"
        ? hide
        : !document.body.classList.contains("menu-hidden");
      document.body.classList.toggle("menu-hidden", shouldHide);
      localStorage.setItem("novel_reader_menu_hidden", shouldHide ? "1" : "0");
    }

    function openModal(type) {
      const m = document.getElementById("infoModal");
      const title = document.getElementById("modalTitle");
      const content = document.getElementById("modalContent");
      if (type === "glossary") {
        title.textContent = "📚 คัมภีร์ตัวละคร คำศัพท์ และสรรพนาม";
        content.textContent = data.glossary || "";
      } else {
        title.textContent = "🧠 เรื่องย่อสะสมแต่ละตอน";
        content.textContent = data.story_memory || "";
      }
      m.classList.add("open");
    }
    function closeModal() {
      document.getElementById("infoModal").classList.remove("open");
    }

    function openIllustModal() {
      const vols = data.illustrations || [];
      const firstWithImgs = vols.findIndex(v => (v.images || []).length > 0);
      if (firstWithImgs !== -1 && ((vols[currentVolIdx] || {}).images || []).length === 0) {
        currentVolIdx = firstWithImgs;
      }
      renderIllustModal();
      document.getElementById("illustModal").classList.add("open");
    }
    function closeIllustModal() {
      document.getElementById("illustModal").classList.remove("open");
    }
    function setIllustView(mode) {
      illustViewMode = mode;
      localStorage.setItem("novel_reader_illust_view", mode);
      renderIllustModal();
    }
    function selectIllustVol(idx) {
      currentVolIdx = idx;
      renderIllustModal();
    }
    function renderIllustModal() {
      const vols = data.illustrations || [];
      const tabList = document.getElementById("volTabList");
      const container = document.getElementById("illustContainer");
      document.getElementById("btnViewVertical").classList.toggle("active", illustViewMode === "vertical");
      document.getElementById("btnViewGrid").classList.toggle("active", illustViewMode === "grid");

      tabList.innerHTML = "";
      vols.forEach((v, idx) => {
        const count = (v.images || []).length;
        const btn = document.createElement("button");
        btn.className = idx === currentVolIdx ? "active" : "";
        btn.textContent = `📁 ${v.volume} (${count})`;
        btn.onclick = () => selectIllustVol(idx);
        tabList.appendChild(btn);
      });

      const activeVol = vols[currentVolIdx];
      const imgs = activeVol ? (activeVol.images || []) : [];

      if (!activeVol || imgs.length === 0) {
        const folderName = activeVol ? activeVol.volume : "เล่ม 1";
        container.innerHTML = `
          <div class="empty-illust-guide">
            <strong style="color: var(--accent); font-size: 16px;">💡 ยังไม่มีรูปภาพในโฟลเดอร์ "${folderName}"</strong>
            <p style="margin: 10px 0 6px;">วิธีเพิ่มภาพประกอบไลท์โนเวลแบบแยกตามเล่มง่ายๆ:</p>
            <ol style="margin: 0; padding-left: 22px;">
              <li>นำไฟล์รูปภาพ (<code>.jpg</code>, <code>.png</code>, <code>.webp</code>) ไปวางใส่โฟลเดอร์ <code>illustrations/${folderName}/</code> (หรือสร้างโฟลเดอร์ <code>เล่ม 1</code>, <code>เล่ม 2</code>, <code>เล่ม 3</code> เพิ่มได้ตามต้องการ)</li>
              <li>ตั้งชื่อไฟล์เรียงตามลำดับ เช่น <code>00_cover.jpg</code>, <code>01.jpg</code>, <code>02.jpg</code> ระบบจะเรียงรูปให้ตามตัวเลขและนำรูป cover ขึ้นเป็นหน้าปกให้เอง</li>
              <li>ดับเบิลคลิกไฟล์ <code>เปิดคลังนิยายทั้งหมด.bat</code> หรือ <code>เปิดอ่านนิยาย.bat</code> รูปทั้งหมดจะแสดงในหน้านี้ทันทีครับ!</li>
            </ol>
          </div>
        `;
        return;
      }

      const listClass = illustViewMode === "grid" ? "illust-list-grid" : "illust-list-vertical";
      container.innerHTML = `<div class="${listClass}">` + imgs.map((img, i) => `
        <div class="illust-card" onclick="openLightbox(${i})">
          <img src="${encodeURI(img.src)}" alt="${img.name}" loading="lazy" />
          <div class="illust-caption">${i + 1}. ${img.name}</div>
        </div>
      `).join("") + `</div>`;
    }

    function openLightbox(imgIdx) {
      const vols = data.illustrations || [];
      const imgs = (vols[currentVolIdx] || {}).images || [];
      if (!imgs.length) return;
      currentLightboxIdx = (imgIdx + imgs.length) % imgs.length;
      const item = imgs[currentLightboxIdx];
      document.getElementById("lightboxImg").src = encodeURI(item.src);
      document.getElementById("lightboxCaption").textContent = `[${vols[currentVolIdx].volume}] รูปที่ ${currentLightboxIdx + 1}/${imgs.length} — ${item.name}`;
      document.getElementById("lightbox").classList.add("open");
    }
    function stepLightbox(delta) {
      openLightbox(currentLightboxIdx + delta);
    }
    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("open");
    }

    document.addEventListener("keydown", (e) => {
      const lbOpen = document.getElementById("lightbox").classList.contains("open");
      if (lbOpen) {
        if (e.key === "ArrowLeft") stepLightbox(-1);
        if (e.key === "ArrowRight") stepLightbox(1);
        if (e.key === "Escape") closeLightbox();
        return;
      }
      if (e.key === "ArrowLeft") prevChapter();
      if (e.key === "ArrowRight") nextChapter();
      if (e.key === "m" || e.key === "M") toggleMenu();
      if (e.key === "Escape") {
        closeModal();
        closeIllustModal();
      }
    });

    document.documentElement.style.setProperty("--font-size", fontSize + "px");
    setTheme(theme);
    if (localStorage.getItem("novel_reader_menu_hidden") === "1") {
      toggleMenu(true);
    }
    render();
  </script>

  <div id="pinGateOverlay" style="display:none; position:fixed; inset:0; z-index:99999; background:#0f172a; color:#e2e8f0; flex-direction:column; align-items:center; justify-content:center; padding:20px; font-family:'Sarabun','Segoe UI',sans-serif;">
    <div style="background:#1e293b; border:1px solid #334155; border-radius:14px; padding:28px 26px; max-width:340px; width:100%; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.4);">
      <div style="font-size:38px; margin-bottom:8px;">🔒</div>
      <div style="font-size:18px; font-weight:bold; color:#38bdf8; margin-bottom:6px;">คลังนิยายส่วนตัว</div>
      <div style="font-size:13px; color:#94a3b8; margin-bottom:16px;">กรอกรหัส PIN เพื่อเข้าอ่าน (จำรหัสอัตโนมัติในเครื่องนี้)</div>
      <input id="pinGateInput" type="password" inputmode="numeric" placeholder="รหัส PIN..." style="width:100%; padding:10px 12px; font-size:18px; text-align:center; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#f8fafc; margin-bottom:12px;" onkeydown="if(event.key==='Enter') checkPinGate()" />
      <button onclick="checkPinGate()" style="width:100%; padding:10px; font-size:15px; font-weight:bold; border-radius:8px; border:none; background:#38bdf8; color:#020617; cursor:pointer;">เข้าสู่คลังนิยาย</button>
      <div id="pinGateErr" style="color:#f87171; font-size:13px; margin-top:10px; display:none;">❌ รหัส PIN ไม่ถูกต้อง</div>
    </div>
  </div>
  <script>
    (function() {
      const EXPECTED_PIN = "0909";
      if (localStorage.getItem("novel_hub_pin_ok") !== EXPECTED_PIN) {
        const gate = document.getElementById("pinGateOverlay");
        if (gate) gate.style.display = "flex";
      }
      window.checkPinGate = function() {
        const val = (document.getElementById("pinGateInput").value || "").trim();
        if (val === EXPECTED_PIN) {
          localStorage.setItem("novel_hub_pin_ok", EXPECTED_PIN);
          document.getElementById("pinGateOverlay").style.display = "none";
        } else {
          document.getElementById("pinGateErr").style.display = "block";
        }
      };
    })();
  </script>
</body>
</html>
