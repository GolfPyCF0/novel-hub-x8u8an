      "title": "บทที่ 33",
      "content": "“วางอาวุธลงแล้วยอมจำนนซะ!”\n\nด้านหลังมีรถม้าจอดอยู่ ดูเหมือนคนข้างในจะไม่มีเจตนาออกมานอกรถจนกว่าสถานการณ์จะคลี่คลาย\n\nส่วนเบื้องหน้าของพวกเขา มีเหล่าเอลฟ์จำนวนมากกำลังกวัดแกว่งอาวุธอันน่าเกรงขามด้วยสีหน้าเคร่งเครียดพลางคำรามขู่\n\nไม่มีทางหนีไปไหนได้นอกจากท้องฟ้าอันเวิ้งว้าง หากตกลงไปย่อมหมายถึงความตายสถานเดียว\n\n“ฮ่า ช่างเป็นวันที่เหมาะแก่การตายเสียจริง” (ยูจีน)\n\nยูจีนเอ่ยมุกตลกร้ายด้วยสีหน้าเศร้าสร้อย เขายกโล่และดาบขึ้น จากนั้นก็ผลักตัวยูริออกไปข้างหน้าอย่างกะทันหัน\n\n“เอ๊ะ…?” (ยูริ)\n\n“ไปเลย ยูริ แฟรงก์! นักศึกษาดีเด่นจากคณะอัศวินแห่งสถาบันเซนต์ยัน!” (ยูจีน)\n\n“เอ๊ะ…?” (ยูริ)\n\nยูริก้าวไปข้างหน้าอย่างลังเลด้วยสีหน้างุนงง\n\n“เอ่อ ฉันเป็นสายแนวหน้าก็จริง แต่ให้ลุยคนเดียวจริงๆ เหรอ? เอาจริงดิ?” (ยูริ)\n\n“ตั้งแต่มาจากศตวรรษที่ 21 ผมยังไม่เคยลงสนามรบจริงสักครั้งเลยนะครับ!” (ยูจีน)\n\n“ฉันก็เคยเป็นนักวาดภาพประกอบนะ!” (ยูริ)\n\n“ก็เธออยู่คณะอัศวินนี่นา!” (ยูจีน)\n\n“แต่นายก็หยิบอาวุธขึ้นมาเหมือนกันไม่ใช่หรือไง!” (ยูริ)\n\n“อันนี้เอาไว้ป้องกันตัวครับ!” (ยูจีน)\n\nขณะที่ทั้งสองกำลังเถียงกันอยู่ เหล่าเอลฟ์ที่ล้อมรอบอยู่ต่างมองดูด้วยสายตาฉงนสนเท่ห์\n\n“เจ้าพวกนี้มันใครกันน่ะ?”\n\n“ดูเหมือนจะเป็นพวกขุนนางมนุษย์ที่ออกมาเดินเล่นเรื่อยเปื่อย จัดการให้เหมาะสม อย่าให้ถึงตายล่ะ”\n\nนักศึกษาของสถาบันโดยพื้นฐานแล้วก็ล้วนเป็นขุนนาง ดังนั้นการจับกุมตัวพวกเขาไว้อาจนำไปสู่การเจรจาต่อรองกับคราซิลอฟและสร้างเงื่อนไขที่ได้เปรียบได้\n\nหัวหน้าหน่วยถอนหายใจ และเหล่าลูกเรือต่างยกอาวุธขึ้นอย่างระแวดระวัง\n\nยังโชคดีที่ฝ่ายตรงข้ามเป็นมนุษย์วัยเยาว์ที่ดูเหมือนจะไม่มีทั้งเจตจำนงและประสบการณ์ในการต่อสู้\n\nเบื้องหลังผู้บุกรุกถืออาวุธทั้งสองคน ชายร่างสูงที่สวมฮู้ดคลุมศีรษะยกมือขึ้นพลางถอนหายใจเฮือกใหญ่\n\n“พวกงี่เง่า ปาร์ตี้บ้าอะไรมีแนวหน้าคนเดียวกับแนวหลังตั้งสองคนเนี่ย? ไม่เคยเล่นเกมกันหรือไง?” (ออสวัลด์)\n\nออสวัลด์โบกมือ ถักทอรูปทรงประหลาดขึ้นด้วยพลังเวทสีม่วง\n\n[ประทานความกล้า] แม้จะเป็นเวทมนตร์ระดับต่ำ แต่เขาก็รู้จากประสบการณ์ว่ายูจีนไม่มีภูมิคุ้มกันต่อเวทมนตร์จิตใจเลยแม้แต่น้อย\n\nราวกับเป็นไปตามคาด ยูจีน ตัวตนที่เพิ่งข้ามมิติมาจากศตวรรษที่ 21 ไม่อาจต้านทานเวทมนตร์จิตใจที่ต้องอาศัย ‘เจตจำนง’ ได้\n\n– วิ้งงง –\n\n“อึ่ก” (ยูจีน)\n\nศีรษะของยูจีนคอพับลงภายใต้อิทธิพลของเวทมนตร์\n\n“น-นายทำอะไรน่ะ?” (ยูจีน)\n\n“ผมเติมความกล้าให้คุณนิดหน่อย ผมจะคอยสนับสนุนให้ ดังนั้นช่วยถ่วงเวลาข้างหน้าไว้ที จนกว่าอีวานจะมาถึง” (ออสวัลด์)\n\n“เอ่อ… อืม อืม ยูจีน?” (ยูริ)\n\nยูริพึมพำพลางก้มหน้ามอง\n\n“นายโอเคไหม?” (ยูริ)\n\n“ครับ ผมสบายดี” (ยูจีน)\n\n“…จริงเหรอ?” (ยูริ)\n\n“นามของข้าคือ ยูจีน โนบิคอฟ คารัมจิน” (ยูจีน)\n\nด้วยมือข้างที่กุมดาบ ยูจีนวาดสัญลักษณ์เล็กๆ ขึ้นกลางอากาศและกระซิบแผ่วเบาขณะริมฝีปากแตะลงบนใบดาบ\n\n“ขอองค์พระผู้เป็นเจ้าทรงเฝ้ามองการศึกของพวกเราในวันนี้ด้วยเถิด” (ยูจีน)\n\n“เฮ้ ออสวัลด์? นายร่ายเวทผิดบทหรือเปล่า?” (ยูริ)\n\n“ไม่ผิดแน่นอนครับ ผมใช้ [ประทานความกล้า] ไปนี่นา แต่ว่า…?” (ออสวัลด์)\n\nยูจีนไม่สนใจบทสนทนาของเหล่าผู้ถูกสิงร่างที่กำลังสับสน และค่อยๆ ลืมตาขึ้นอย่างเงียบเชียบ\n\nด้วยเจตจำนงอันแน่วแน่ที่ส่องประกายในดวงตาสีฟ้าคราม เขายกดาบขึ้นสูง\n\n“จงสรรเสริญพระสิริรุ่งโรจน์แห่งองค์พระผู้เป็นเจ้า พระองค์คือผู้ทรงนำสันติสุขมาสู่ผืนแผ่นดินนี้ด้วยการสถาปนาคุณธรรมผ่านความเที่ยงธรรม” (ยูจีน)\n\n“เอ่อ… อืม…” (ยูริ)\n\n“หรือว่ามันจะเกิดอาการขัดแย้งกันจากการผสมผสานคลาสนักบวชเข้ากับคลาสอัศวิน?” (ออสวัลด์)\n\n“นั่นมัน… เป็นไปได้นะ ขอร้องล่ะ อย่าทำแบบนั้นกับฉันเด็ดขาด ฉันจัดการเองได้” (ยูริ)\n\nหมอนั่นสติหลุดไปแล้วเหรอ? ยูริตัวสั่นด้วยความหวาดกลัว\n\nการสวมบทบาทตามเซ็ตติ้งของเกมจนสูญเสียตัวตนไปกับการสวมบทบาท (RP) อย่างสมบูรณ์อาจนำไปสู่สภาวะเช่นนั้นได้\n\nหากยูริดำดิ่งสู่การสวมบทบาทในเซ็ตติ้งของเกมสถาบันลามกนั่น ตัวตนที่แท้จริงของเธอจะกลายสภาพเป็นแบบไหนกัน?\n\nสู้ให้เธอจับดาบฟาดฟันเสียยังดีกว่า โชคดีที่ยูริเชี่ยวชาญวิชาดาบเป็นเลิศ ในฐานะนักศึกษาอันดับหนึ่งของคณะอัศวิน\n\n“โอ้ เหล่าคนนอกรีต! จงสดับฟังพระวจนะอันศักดิ์สิทธิ์แห่งพระเจ้าองค์เดียวที่แท้จริงของพวกเรา! จงเคารพบูชาและแซ่ซ้องสรรเสริญเสีย!” (ยูจีน)\n\nยูจีนตะโกนลั่นแล้วพุ่งทะยานไปข้างหน้า พลางตวัดดาบออกไปอย่างกะทันหัน ตูม! พร้อมเสียงกัมปนาท แสงสีขาวเจิดจ้าพลันระเบิดออกจากคมดาบของเขา\n\n“[ฟาดฟันศักดิ์สิทธิ์]…!” (ยูจีน)\n\n“เจ้าโง่นั่น แทนที่จะไปเรียนสกิลฟื้นฟูรักษากลับมาเรียนอะไรแบบนี้”\n\nยูริและออสวัลด์วิ่งตามหลังยูจีนไปพลางบ่นอุบอิบ\n\nเหล่าผู้ถูกสิงร่างทั้งสามคนประสบความสำเร็จในการก่อความโกลาหลบนดาดฟ้าเรือ ทุกอย่างกำลังดำเนินไปตามแผนของอีวาน\n\nขณะที่เดินลัดเลาะไปตามโถงทางเดินอันมืดมิดที่มีไฟเตือนภัยกะพริบวาบ อีวานเงี่ยหูฟังอย่างตั้งใจ\n\nวี้ด วี้ด ท่ามกลางเสียงไซเรนที่ดังกึกก้อง เขาวิเคราะห์เสียงเล็กๆ น้อยๆ แต่ละเสียงอย่างละเอียดถี่ถ้วน\n\nเสียงดังซ้ำๆ ที่สะท้อนก้องอยู่ในพื้นที่แคบภายในตัวเรือสามารถใช้เป็นตัวบ่งชี้ในการกำหนดตำแหน่งด้วยเสียงสะท้อนได้ หากสามารถแยกแยะต้นกำเนิดของเสียงเหล่านั้นออก\n\nแม้จะไม่ได้เฉียบคมเท่าเผ่าเอลฟ์ แต่ประสาทการได้ยินของเจ้าหน้าที่ที่ผ่านการฝึกฝนมาอย่างโชกโชนก็สามารถระบุตำแหน่งเป้าหมายผ่านคลื่นเสียงสะท้อนที่เกิดขึ้นเมื่อคลื่นเสียงกระทบเข้ากับวัตถุได้\n\nด้วยวิธีการนี้ อีวานจึงสัมผัสได้ถึงการมีอยู่ของบุคคลสองคนที่ยืนดักรออยู่ก่อนจะเลี้ยวผ่านหัวมุมของโถงทางเดิน\n\n– ฟึ่บ!\n\nแทบจะพร้อมๆ กับที่ปรากฏตัวออกมาในโถงทางเดิน เสียงยิงก็ดังขึ้น เป้าหมายซึ่งตกใจสุดขีดรีบบิดตัวหลบอย่างรวดเร็ว เฉียดแนววิถีการยิงไปอย่างหวุดหวิด\n\nการตรวจจับแนววิถีกระสุน\n\nอีวานพยักหน้าพลางชักขวานออกมา\n\n“นั่นใคร!”\n\nเป็นคำถามที่ผิดพลาด นั่นคือตัวชี้วัดระดับการฝึกฝนของเหล่าเอลฟ์ฝึกหัด\n\nตามหลักข้อแรก คำถามควรถูกเอ่ยขึ้นหลังจากทำให้ศัตรูหมดสภาพแล้วเท่านั้น และการถามหาตัวตนของอีกฝ่ายในขณะที่ฝ่ายนั้นแสดงเจตนารมณ์มุ่งร้ายอย่างชัดเจนถือเป็นคำถามที่โง่เขลา\n\nดังนั้น แทนที่จะเอ่ยตอบ อีวานจึงพุ่งตัวเข้าใส่ เอลฟ์ฝึกหัดผู้ไร้ประสบการณ์จำต้องชดใช้ให้กับคำถามที่ผิดพลาดนั้น\n\n– ฟิ้ว\n\n– ปั้ก!\n\n“อ๊าก!”\n\nขวานหมุนคว้างกลางอากาศแล้วฟาดเข้าที่ลำคอของเอลฟ์ ทิ้งรอยวิถีอันหมดจดเอาไว้ เอลฟ์ผู้นั้นกระเด็นไปกระแทกผนังดังสนั่นพลางหอบหายใจเฮือก\n\nในเวลาเดียวกัน อีวานยกปืนขึ้นเล็งไปยังร่างที่กำลังพุ่งเข้ามา โดยไม่ต้องเล็งประณีต เขาลั่นไกยิงทันที\n\n– ปัง!\n\n“แก!!”\n\nแน่นอนว่าอีกฝ่ายหลบได้ เจ้าหมอนั่นมีความสามารถในการตรวจจับแนววิถีกระสุน ทว่า ในชั่วพริบตาที่มันบิดตัวเพื่อหลบแนววิถีกระสุน ช่วงเวลาสั้นๆ เพียงเท่านั้นแหละคือสิ่งที่เขาต้องการ\n\nทันทีที่เจ้าหมอนั่นหันตัวกลับมาอีกครั้ง อีวานก็เหวี่ยงขวานเสยขึ้นใต้คางของมันเรียบร้อยแล้ว\n\n– ปั้ก!\n\nเอลฟ์ที่ขากรรไกรบิดเบี้ยวทรุดฮวบลงไปกองกับพื้นโดยไม่ทันได้ส่งเสียงร้องครวญคราง\n\nเนื่องจากเป็นการฟาดด้วยด้านสันขวาน จึงให้ความรู้สึกเหมือนเอาพลองสั้นฟาดใส่มากกว่าคมขวาน แต่ตราบใดที่มันยังไม่ตาย แค่นั้นก็น่าจะเพียงพอแล้ว\n\nอีวานเตะร่างของเอลฟ์ที่กรามหลุดให้พ้นทางแล้วก้าวเดินต่อไปข้างหน้า\n\n– วี้ดดดด!\n\n– วี้ดดดด!\n\nเสียงไซเรนยังคงดังกึกก้องไปทั่วโถงทางเดิน\n\nท่ามกลางโถงทางเดินอันอื้ออึงที่มีไฟเตือนภัยสีแดงกะพริบวูบวาบ อีวานหลับตาลงและเดินหน้าต่อไป พลางคำนวณความต่างของเวลาที่คลื่นเสียงความถี่สูงสะท้อนกลับมาจากทุกซอกทุกมุมของโถงทางเดิน\n\nบนเรือเหาะชั้น “วูล์ฟสทาล” แห่งกองเรือคาลีออน กัปตันเออร์เนสต์แห่งเรือ “เกียรติภูมิแห่งบอยล์” กำลังขมวดคิ้วมุ่นอยู่ในห้องกัปตัน\n\nรายงานฉบับล่าสุดที่เขาได้รับระบุไว้อย่างชัดเจนว่า “นักศึกษาไม่ทราบฝ่ายพยายามบุกโจมตี ขณะนี้กำลังพยายามควบคุมตัว”\n\nเหตุการณ์นี้ดันเกิดขึ้นพอดิบพอดีกับช่วงเวลาที่พวกเขากำลังเตรียมการต้อนรับทูตของมกุฎราชกุมารอเล็กซานเดอร์และเตรียมความพร้อมสำหรับพันธมิตรลับ ทำให้สถานการณ์ค่อนข้างอ่อนไหวอยู่บ้าง แต่ก็ไม่ได้มีอะไรมากไปกว่านั้น\n\nหรือว่าจะเป็นความผิดพลาดตั้งแต่แรกที่เอาเรือมาจอดทอดสมออยู่เหนือสถาบันแห่งนี้?\n\nหากเป็นคนหนุ่มสาวที่เปี่ยมด้วยพลังในวัยนั้น พวกเขาก็อาจจะดื่มเหล้ากันมาบ้างแล้วนึกสนุกอยากลองแอบลอบเข้ามาโดยใช้เวทมนตร์สนับสนุนสักหน่อย\n\nในวัยนั้น การอยากพิสูจน์ความกล้าหาญหรือความบ้าระห่ำถือเป็นเรื่องธรรมดาสามัญ\n\nทว่า ทว่า\n\n“ทำไมถึงยังไม่มีรายงานเพิ่มเติมเข้ามาอีก?” (เออร์เนสต์)\n\nเขาได้ยินมาว่ามีนักศึกษาอายุน้อยอยู่สามคน\n\nเนื่องจากนักศึกษาทุกคนที่สถาบันเซนต์ยันล้วนเป็นขุนนาง หรืออย่างน้อยก็มาจากตระกูลผู้มีอิทธิพล เขาจึงสั่งให้จับกุมตัวเป็นๆ เอาไว้\n\nต่อให้เอลฟ์จะหยิ่งผยองสักเพียงใด ก็ไม่ใช่ธุระกงการอะไรของพวกเขาที่จะมาสังหารนักศึกษาของประเทศอื่นกลางดินแดนต่างชาติ\n\nแต่ถึงกระนั้น พวกนั้นก็เป็นแค่นักศึกษา ต่อให้จะหมกมุ่นกับการร่ำเรียนมากเพียงใด มันก็ย่อมมีขีดจำกัด และในวัยเพียงเท่านั้น ต่อให้จะกล้าบ้าบิ่นแค่ไหน สุดท้ายมันก็ยังคงเป็นเพียง ‘ระดับนักศึกษา’ เท่านั้น\n\nดังนั้น ไม่ว่าลูกเรือจะจับกุมตัวพวกนั้นได้สำเร็จ หรือพวกนั้นจะหนีรอดลงไปใต้ดาดฟ้าเรือได้ ป่านนี้ผ่านไปสิบนาทีหลังการโจมตีแล้ว ก็น่าจะมีรายงานเพิ่มเติมส่งเข้ามาบ้างสิ\n\n“ไม่มีใครอยู่ข้างนอกเลยหรือไง? พลลาดตระเวน! ไปตรวจสอบสถานการณ์บนดาดฟ้าแล้วมารายงานเดี๋ยวนี้!” (เออร์เนสต์)\n\nเขาตะโกนสั่งอย่างหงุดหงิด เขาไม่อาจเดินออกไปที่ดาดฟ้าเรือด้วยตัวเองได้\n\nทูตของมกุฎราชกุมารอเล็กซานเดอร์น่าจะเดินทางมาถึงดาดฟ้าเรือแล้วในตอนนี้ การที่กัปตันเรือเดินออกไปต้อนรับด้วยตัวเองย่อมไม่เป็นผลดีในแง่ของศักดิ์ศรี และในสถานการณ์เช่นนี้ก่อนที่จะบรรลุข้อตกลงพันธมิตรระหว่างประเทศ การถูกมองว่าด้อยกว่าถือเป็นจุดจบเลยทีเดียว\n\n“ไม่มีใครอยู่ข้างนอกเลยเรอะ? พวกเจ้ามัวทำอะไรกันอยู่! ปิดไอ้เสียงไซเรนบ้าบอนั่นเสียที! ขืนปล่อยให้เสียงดังแบบนี้ต่อไปพวกเราจะอยู่กันได้ยังไง!” (เออร์เนสต์)\n\nในที่สุด เออร์เนสต์ก็ลุกขึ้นจากที่นั่ง\n\nเขาก้าวข้ามห้องกัปตันไปด้วยท่าทีเคร่งขรึม เปิดประตูออกกว้าง แล้วตะโกนลั่น\n\n– วี้ดดดด!\n\n– วี้ดดดด!\n\nทว่า ในโถงทางเดินที่อื้ออึงไปด้วยเสียงไซเรนอันดังสนั่น กลับไม่มีวี่แววของแสงไฟปกติเลยแม้แต่ดวงเดียว\n\nระบบขัดข้องงั้นหรือ? ความคิดนั้นแวบผ่านเข้ามาในหัวของเขาชั่วครู่ ทว่า ไม่นานเขาก็ส่ายศีรษะปฏิเสธ\n\nไม่มีทางที่จะเกิดระบบขัดข้องได้ นี่คือการโจมตี\n\n“บัดซบเอ๊ย!”\n\nเขาสบถพลางกดขมับและรีบซ่อนตัวเข้าหลังบานประตู เขาชักดาบพิธีการที่แขวนอยู่บนผนังออกมา สูดหายใจเข้าลึก แล้วตั้งท่าเตรียมพร้อม\n\n“เป็นคนที่เอลิซาเวตาส่งมางั้นเรอะ!”\n\n“….”\n\n“โธ่เว้ย ตอบมาสิถ้าแกอยู่ตรงนั้น! การโจมตีโดยพวกนักศึกษาเนี่ยนะ ไร้สาระสิ้นดี พวกมันถึงขั้นใช้ปฏิบัติการสองทางและหลอกใช้พวกนักศึกษาเลยงั้นเรอะ!?” (เออร์เนสต์)\n\nสถานการณ์บนดาดฟ้าเรือยังไม่ชัดเจน แต่อย่างน้อยก็ดูเหมือนว่าสถานการณ์จะยังไม่ยุติลง\n\nต่อให้พวกมันจะนำกองกำลังที่น่าเกรงขามมาด้วย แต่ด้วยจำนวนคนเพียงสามคน ย่อมเป็นไปไม่ได้ที่จะกำจัดลูกเรือทั้งหมดลงได้ภายในเวลาสิบนาที\n\nดังนั้น ในตอนนี้ต้องอดทนไว้ก่อน มกุฎราชกุมารอเล็กซานเดอร์อาจจะพิจารณาแทรกแซงทางทหารทันทีที่เข้าใจสถานการณ์\n\nทั้งเออร์เนสต์และอเล็กซานเดอร์ต่างก็ไม่อยากถูกเปิดโปงต่อหน้าเอลิซาเวตาในเวลานี้\n\nทันใดนั้น เสียงหนึ่งก็ดังก้องขึ้น\n\n“ท่านอัครมหาเสนาบดีคงจะได้บอกคุณไว้อย่างชัดเจนแล้วสินะ” (อีวาน)\n\n“อะไรนะ…?” (เออร์เนสต์)\n\nเออร์เนสต์หันศีรษะไปตามเสียงทุ้มต่ำที่ดังมาจากสุดโถงทางเดิน\n\nระยะห่างระดับนั้น น่าจะเป็นช่วงปลายสุดของโถงทางเดินหน้าห้องกัปตัน ที่ระยะขนาดนั้น ต่อให้พวกมันขว้างเวทมนตร์ทำลายล้างขนาดใหญ่ออกมา ก็ไม่มีทางพุ่งมาถึงห้องกัปตันได้หรอก\n\nเขาพยักหน้าและประสานนิ้วมือเข้าด้วยกัน พลังเวทลุกโชนเป็นสีฟ้าสว่างไสวและแผ่ขยายออกจากปลายนิ้วของเขา\n\nในวินาทีนั้นเอง\n\n– บูมมม—!!\n\nพร้อมเสียงแหวกอากาศอันรุนแรง\n\n– โครมมมม!!\n\n‘บางสิ่ง’ ที่พุ่งผ่านบานประตูที่เปิดอ้าอยู่ ฟาดกระแทกลงบนโต๊ะทำงานในห้องกัปตันอย่างจัง\n\nเวทมนตร์งั้นเรอะ? เวททำลายล้างเหรอ? เออร์เนสต์รีบหันขวับไปมอง หากมันเป็นเวทระเบิด เขาจำเป็นต้องรีบกางเวทป้องกันทันที\n\n“…ขวานเรอะ?”\n\nขวานที่ผูกเชือกติดไว้ครึ่งเล่มปักลึกเข้าไปในโต๊ะทำงานห้องกัปตัน จนโต๊ะแตกกระจายไปส่วนหนึ่ง\n\nเออร์เนสต์พึมพำอย่างไม่อยากเชื่อสายตา\n\n“คนตัดไม้… มีตัวตนอยู่จริงงั้นเหรอ?”\n\nมันเป็นถ้อยคำที่ตรงไปตรงมา ปราศจากคำอุปมาอุปไมยซับซ้อนหรือเจตนาร้ายใดๆ\n\nเออร์เนสต์หัวเราะออกมาอย่างไม่อยากจะเชื่อ\n\nพร้อมเสียงตึง เชือกที่ผูกติดกับด้ามขวานถูกกระตุกจนตึงเปรี๊ยะ\n\n– ขวับ!\n\nขวานถูกกระชากหลุดออกมาตามแรงเชือก และด้วยความยืดหยุ่นของมัน มันก็เหวี่ยงหมุนคว้างเข้าฟาดขาของเออร์เนสต์อย่างจัง\n\n“อั่ก!”\n\nโชคดีที่มันฟาดถูกด้วยด้านสันขวาน และไม่ได้เข้าที่ศีรษะ เออร์เนสต์กลิ้งตัวไปบนพื้นทั้งที่ข้อเท้าหัก เพื่อหลบให้พ้นระยะของคมขวาน\n\nขวานเล่มนั้นหายลับกลับเข้าไปในความมืดมิดที่สุดโถงทางเดิน ราวกับถูกดูดกลืนเข้าไป ขณะที่เออร์เนสต์กำลังตะเกียกตะกายลุกขึ้น เสียงฝีเท้าอันมั่นคงสม่ำเสมอก็ดังก้องขึ้นท่ามกลางความมืด\n\nแสงเรืองรองสีฟ้าครามวูบวาบอยู่ท่ามกลางเงามืด\n\nไม่นานนัก ใบหน้าที่มีเครารกรุงรังก็ปรากฏขึ้น\n\nท่อนแขนกำยำมัดกล้ามราวกับอสรพิษ และใบขวานที่พันผูกติดอยู่กับมืออย่างแน่นหนา\n\nไล่มาจนถึงปากกระบอกปืนที่จ่อตรงมายังเขา\n\n“เรามาเจรจากันเถอะ” (เออร์เนสต์)\n\n“นั่นไม่ใช่คำสั่งที่ฉันได้รับมานะ” (อีวาน)\n\n– ปังงง—!\n\nประกายไฟแลบวาบออกจากปลายกระบอกปืนท่ามกลางโถงทางเดินอันมืดมิด\n\n***\n\n**หมายเหตุผู้เขียน:**\n\nการกำหนดตำแหน่งด้วยเสียงสะท้อน (Resonance Positioning): เทคนิคที่ใช้วัดทิศทางและระยะห่างของวัตถุและตนเองโดยการฟังเสียงสะท้อนของคลื่นเสียงความถี่สูงที่สะท้อนกลับภายในพื้นที่เฉพาะ คล้ายกับคลื่นเสียงความถี่สูงของค้างคาว มนุษย์เองก็สามารถใช้เทคนิคนี้ได้ในระดับหนึ่งเช่นกัน!"

      "title": "บทที่ 34",
      "content": "เสียงกระสุนแหวกอากาศพุ่งเฉียดผ่านไป เออร์เนสต์เอี้ยวศีรษะหลบคมกระสุนได้อย่างหวุดหวิด\n\nมันเป็นการยิงที่แม่นยำ เล็งตรงเข้าใส่กลางหน้าผาก บัดซบเอ๊ย เออร์เนสต์กัดฟันกรอดพลางก้าวเซถอยหลังไป\n\n“บ้าเอ๊ย แกเอาจริงเรอะ? กล้าดียังไงมาลอบสังหารกัปตันถึงบนเรือรบของคาลีออน! อย่าคิดว่าจะรอดออกไปจากที่นี่ได้นะ เจ้าทหาร!”\n\n“รอดจากอะไร?”\n\nอีวานก้าวเท้าเข้ามาพลางควงขวานในมือ โดยไม่รีบร้อนลดระยะห่าง\n\nเขาค่อยๆ พิจารณาสภาพของอีกฝ่ายอย่างใจเย็น นักรบสายเวทที่เชี่ยวชาญวิชาดาบ\n\nเอลฟ์ส่วนใหญ่ไม่ค่อยจับดาบกันนัก โดยเฉพาะเหล่านายทหารระดับสัญญาบัตร\n\nนายทหารระดับสัญญาบัตรในกองทัพเอลฟ์ล้วนเป็นขุนนางชั้นสูง และขุนนางเอลฟ์ต่างก็รังเกียจการเสียเหงื่อ\n\nทว่า ในหมู่พวกมันก็ยังมีบางคนที่จับดาบอยู่ เรื่องนี้จึงกลายเป็นปัญหาที่ยุ่งยากขึ้นมา\n\nทั้งที่ถูกคนรอบข้างดูแคลน แต่การฝึกฝนวิชาดาบจนช่ำชองย่อมหมายถึงศักยภาพอันมหาศาล เมื่อคำนึงถึงอายุขัยอันยืนยาวของเผ่าพันธุ์เอลฟ์\n\nเอลฟ์ส่วนใหญ่มักชิงชังการต่อสู้ระยะประชิด แต่เรื่องน่าตลกร้ายก็คือ ผู้ใช้ดาบที่เก่งกาจที่สุดในโลกใบนี้กลับเป็นเอลฟ์ มีข่าวลือว่าเธอเคยเป็นอาจารย์ของผู้กล้ามาก่อน\n\nกล่าวอีกนัยหนึ่ง\n\nการต้องมาเผชิญหน้ากับนายทหารเอลฟ์สายเวทที่เชี่ยวชาญวิชาดาบทำให้อีวานตกเป็นฝ่ายตึงมือ ต่อให้เขาจะซัดขาข้างหนึ่งของมันจนหักไปแล้วในการโจมตีครั้งแรกก็ตาม\n\n“เอลิซาเวตาส่งหมาล่าเนื้อฝีมือดีมาเสียด้วย แกชื่ออะไร เจ้าทหาร?”\n\n“คิดว่าการถ่วงเวลาจะช่วยให้แกได้เปรียบขึ้นมาหรือไง?”\n\nเออร์เนสต์ขมวดคิ้วให้กับคำพูดของอีวาน เจ้าหมอนี่หัวไวไม่เบา\n\nเขาเลียริมฝีปากสั้นๆ\n\nเขาไม่อาจร่ายเวทมนตร์อย่างสุ่มสี่สุ่มห้าได้ สำหรับผู้ที่ถูกจัดอยู่ในระดับ ‘เหนือมนุษย์’ ระยะห่างระหว่างเขากับอีวานนั้นสั้นยิ่งกว่าหนึ่งก้าวเสียอีก\n\nทั้งคู่อยู่ในระยะสังหารของกันและกันแล้ว\n\nหลังจากคุมเชิงกันอยู่ชั่วครู่ เอลฟ์ผู้นั้นก็ถอนหายใจแล้วยักไหล่\n\n“เอาเถอะ ข้ายอมแพ้แล้ว เจ้าทหาร!”\n\n“โยนดาบของแกทิ้งซะ”\n\n“ฝันไปเถอะ แกไม่ได้รับประกันสักหน่อยว่าจะไม่ปาดคอข้าทันทีที่ข้าทิ้งดาบน่ะ”\n\nคำพูดของมันไม่ได้ผิด ทว่าอีวานหรี่ตาลงอย่างเย็นชา\n\nเอลฟ์เนี่ยนะที่จะยอมจำนนง่ายดายขนาดนี้? ทั้งที่ยังไม่ได้ประมือกันอย่างจริงจังเลยด้วยซ้ำ? ไม่ต้องพูดถึงว่านี่คือขุนนางระดับนายทหารสัญญาบัตร\n\nเป็นไปไม่ได้เด็ดขาด\n\nอีวานยกขวานขึ้นอย่างเงียบเชียบ การยอมจำนนเอาไว้ทำหลังจากทำให้ภัยคุกคามหมดสภาพลงไปแล้วค่อยว่ากัน\n\nเมื่อเห็นดังนั้น เออร์เนสต์ก็เลียริมฝีปาก\n\n“บัดซบ เอาสิ รับไปซะ”\n\nว่าแล้วมันก็เขวี้ยงดาบพุ่งตรงเข้าใส่อีวานอย่างเต็มแรง\n\n– เคร้ง!\n\nในจังหวะที่อีวานปัดป้องใบดาบที่พุ่งเข้ามา เออร์เนสต์ก็ดีดตัวกระโดดถอยหลังไปพร้อมล้วงมือเข้าไปในกระเป๋าคาดเอวเรียบร้อยแล้ว\n\nอีวานพุ่งทะยานเข้าหาเออร์เนสต์พลางลดระดับท่าทางลงต่ำ ใต้เครื่องแบบที่ติดกระดุมรัดกุมมิดชิดไม่ปรากฏโครงร่างของอาวุธชิ้นใหญ่อะไรเลย\n\nเช่นนั้น สิ่งที่อาจโผล่ออกมาจากตรงนั้นได้คืออะไร? ปืนพก มีดสั้น หรืออาวุธเวทมนตร์แบบระเบิด\n\nในบรรดาสิ่งเหล่านั้น ความเป็นไปได้ของอย่างหลังมีสูงที่สุดและน่ารำคาญที่สุด\n\n“ท่าน… เวียลกริน!” (เออร์เนสต์)\n\n“…?” (อีวาน)\n\nทำไมชื่อของชายคนนั้นถึงได้โผล่ขึ้นมาอย่างกะทันหัน?\n\nอีวานสลัดความสับสนชั่ววูบที่ถาโถมเข้ามาทิ้งไป ตอนนี้ไม่ใช่เวลามาขบคิดเรื่องพรรค์นั้น\n\nการตะโกนชื่อกระบวนท่าหรือร้องเรียกชื่อบุคคลสำคัญโดยทั่วไปมักเป็นกลยุทธ์ที่โง่เขลา\n\nอีวานกระทืบเท้าลงบนพื้นแล้วกระโจนเข้าใส่พร้อมเงื้อขวาน ไม่มีเวลามามัวบรรจงฟาดด้วยสันขวานอีกแล้ว เขายกคมขวานขึ้นตรงๆ และฟันลงใส่ท่อนแขนของเออร์เนสต์ทันที\n\nเมื่อต้องเผชิญหน้ากับอุปกรณ์เวทมนตร์ที่น่าสงสัย ย่อมไม่อาจประมาทได้แม้แต่วินาทีเดียว\n\n– กริ๊ก\n\nเป็นไปตามคาด สิ่งที่เออร์เนสต์ควักออกมาจากกระเป๋าคืออุปกรณ์เวทมนตร์ทรงลูกแก้วขนาดเล็ก มันอัดแน่นไปด้วยออร่าสีม่วงเข้มข้น ดูอัปมงคลอย่างถึงที่สุด\n\nเสี้ยววินาทีก่อนที่คมขวานของอีวานจะสับท่อนแขนของเออร์เนสต์ขาดสะบั้น นิ้วหัวแม่มือของมันก็กดลงบนยอดของอุปกรณ์เวทมนตร์นั้นอย่างหนักแน่น\n\nและทันใดนั้น คลื่นกระแทกมหาศาลก็ปะทุขึ้น\n\n– กว๊ากกกกก!!\n\nอีวานคิดอยู่ในใจขณะที่ร่างถูกแรงกระแทกอันรุนแรงซัดปลิวกระเด็นออกไป\n\nภารกิจล้มเหลว มันระเบิดตัวเอง\n\nภารกิจที่เอลิซาเวตามอบหมายมาคือการจับกุมกัปตันเรือรบและยึดจุดนัดพบกับมกุฎราชกุมารอเล็กซานเดอร์\n\nทว่าใครจะไปคาดคิดว่าจู่ๆ กัปตันเรือจะกดสวิตช์ระเบิดตัวเองขึ้นมาดื้อๆ แบบนี้? ใครมันจะไปคาดการณ์และเตรียมตัวรับมือเรื่องแบบนี้ได้ทันกัน?\n\nอีวานรับรู้ถึงเสียงวิ้งอื้ออึงในหูจากคลื่นกระแทกอันรุนแรง ขณะร่างร่วงหล่นไปกระแทกเข้ากับมุมหนึ่งของโถงทางเดิน\n\n“อั่ก”\n\nเสียงครางหลุดรอดออกมาเมื่อปอดถูกบีบรัดจากแรงกระแทก ทว่าสีหน้าของเขายังคงสงบนิ่งเยือกเย็น\n\nเขาตรวจสอบสภาพแขนขา เช็กการขยับของปลายนิ้วมือและปลายนิ้วเท้าให้แน่ใจว่ายังเป็นปกติ จากนั้นก็ปัดฝุ่นออกจากร่างกาย\n\nมันคือ ‘การตรวจสอบอุปกรณ์’ ที่ฝึกฝนจนขึ้นใจผ่านการเคี่ยวกรำมาอย่างยาวนาน ร่างกายของเจ้าหน้าที่ที่ผ่านการฝึกฝนมาแล้วก็ถือเป็นอุปกรณ์ชนิดหนึ่ง\n\n“โดนระเบิดระยะประชิดขนาดนั้น แต่กลับยังอยู่ครบสมบูรณ์อย่างน่าประหลาดใจแฮะ”\n\nอีวานคิดขณะพยุงร่างลุกขึ้นยืนท่ามกลางแรงสั่นสะเทือนที่หลงเหลืออยู่ แรงระเบิดทำให้ทัศนวิสัยของเขาสั่นไหวเล็กน้อย เมื่อเสียงอื้ออึงในหูค่อยๆ จางลง เสียงไซเรนก็ดังก้องสะท้อนขึ้นอีกครั้งในโถงทางเดิน\n\nเป็นสัญญาณที่ดี แม้แต่การได้ยินของเขาก็ยังเป็นปกติ\n\n“ไม่คาดคิดมาก่อนเลยนะเนี่ย”\n\nและไม่นานนัก อีวานก็ตัวแข็งทื่อกับเสียงที่ได้ยิน เสียงที่คุ้นเคยเป็นอย่างยิ่ง เสียงที่ไม่ควรจะมาได้ยินอยู่ในสถานที่แห่งนี้\n\nท่ามกลางสายตาที่ยังพร่าไหว เปลวไฟสีมรกตอันเป็นเอกลักษณ์\n\nลุกโชนขึ้นจากใต้ดวงตาทั้งสองข้าง สัญลักษณ์แห่งการจุติลงมาใหม่\n\nกระทั่งการจัดเรียงพลังเวทก็ยังคุ้นเคยเสียจนเกินไป\n\n“เอาจริงดิ… เวียลกริน…?” (อีวาน)\n\n“เออ ทำไมเจ้าถึงมาอยู่ที่นี่ได้? นี่ยังมีชีวิตอยู่เรอะ?” (เวียลกริน)\n\nเครื่องแบบที่ขาดวิ่น โครงสร้างร่างกายและความสูงที่มองเห็นอยู่เบื้องใต้ รวมถึงรูปลักษณ์ภายนอก ทุกอย่างล้วนเป็นของเออร์เนสต์ ทว่า…\n\nอีวานตระหนักได้โดยสัญชาตญาณ ‘วิญญาณ’ ของเจ้าหมอนี่เปลี่ยนไปแล้ว\n\n“สิงร่างงั้นเรอะ?” (อีวาน)\n\n“เลือกใช้คำได้น่าสนใจดีนี่ สิ่งนี้เรียกว่า ‘เวทย้ายวิญญาณ’ ต่างหาก” (เวียลกริน)\n\nจอมเวทแห่งปาร์ตี้ผู้กล้า เวียลกริน ‘ผู้ทำลายป้อมปราการ’\n\nเปี่ยมไปด้วยพลังเวทที่คุ้นเคย น้ำเสียงที่คุ้นเคย และความหยิ่งยโสที่คุ้นเคยเป็นอย่างยิ่ง หนึ่งในจอมเวทที่ยิ่งใหญ่ที่สุดเท่าที่เคยมีมาเอ่ยปากขึ้น\n\n“อเล็กซานเดอร์อยู่ที่ไหน แล้วทำไมเจ้าถึงมาอยู่ที่นี่?” (เวียลกริน)\n\n“…” (อีวาน)\n\nการที่เวียลกรินมาปรากฏตัวในสถานที่แห่งนี้เป็นเรื่องที่คาดไม่ถึง ท้ายที่สุดมันก็เป็นสิ่งที่ไม่อาจคาดเดาได้ตั้งแต่แรกอยู่แล้ว\n\nทว่ายิ่งไปกว่านั้น อีวานหวนนึกถึงแก่นแท้ของภารกิจในครั้งนี้\n\n‘ยืนยันความเชื่อมโยงระหว่างมกุฎราชกุมารอเล็กซานเดอร์กับกัปตันเอลฟ์ และรวบรวมหลักฐาน’\n\n‘กัปตันเอลฟ์… ไม่สิ เรือประจัญบานลอยฟ้าลำนี้น่าจะกำลังประสบเหตุขัดข้อง’\n\n‘เอลิซาเวตาวางหมากไว้เพื่อบีบให้มกุฎราชกุมารอเล็กซานเดอร์กลายเป็นทางเลือกเดียวที่กัปตันเรือสามารถเลือกได้’\n\n‘และคำพูดของเวียลกริน’\n\n“อเล็กซานเดอร์อยู่ที่ไหน แล้วทำไมเจ้าถึงมาอยู่ที่นี่?” ภายในคำถามอันเรียบเฉยนี้แฝงความนัยอันลึกซึ้งเอาไว้ และอีวานก็ขมวดคิ้วมุ่น\n\nเวียลกรินได้มอบอุปกรณ์เวทมนตร์ที่บรรจุ ‘เวทย้ายวิญญาณ’ ให้แก่กัปตันเรือมาตั้งแต่แรกแล้ว\n\nทำไมล่ะ? ก็เพื่อมาเผชิญหน้ากับอเล็กซานเดอร์\n\nถ้าอย่างนั้น… ทำไมกัน?\n\nก็เพราะเขาได้ร่วมมือกับอเล็กซานเดอร์แล้ว\n\n“วางแผนเอาไว้ตั้งแต่แรกเลยงั้นเรอะ?”\n\n“อืม เรือประจัญบานลอยฟ้าของคาลีออนคือสุดยอดแห่งวิทยาการทางทหาร มันไม่น่าจะเกิดเหตุขัดข้องขึ้นมาดื้อๆ หลังจากออกปฏิบัติการไปได้แค่ราวสองสัปดาห์หรอก จริงไหมล่ะ?”\n\nยิ่งไปกว่านั้น เรือรบลำนี้แล่นออกจากท่าโดยมีจุดประสงค์หลักเพื่อคุ้มกัน เอลเฟียรา บุตรสาวของเวียลกรินอย่างปลอดภัย\n\nเธอเป็นหนึ่งในเอลฟ์ที่แข็งแกร่งที่สุด และเป็นบุตรสาวของจอมเวทแห่งปาร์ตี้ผู้กล้า แม้แต่ในหมู่ขุนนางชั้นสูงจำนวนมากในคาลีออน เธอก็ยังมีสถานะอันโดดเด่นเป็นพิเศษ\n\nเรือลำนี้เพิ่งออกเดินทางเมื่อสองสัปดาห์ก่อนเพื่อคอยระแวดระวังปัจจัยที่อาจคุกคามเธอ\n\nเว้นเสียแต่ว่าจะมีใครสักคนจงใจทำให้เรือเกิดขัดข้องเสียเอง\n\nความเย็นเยียบแล่นพล่านไปตามแนวกระดูกสันหลังของอีวานเมื่อคิดถึงเรื่องนี้\n\n“ถูกต้อง มันถูกวางเอาไว้เพื่อยั่วยุองค์หญิงเอลิซาเวตาตั้งแต่แรก ถ้านังหนูนั่นโกรธขึ้นมา ก็เห็นๆ กันอยู่แล้วไม่ใช่หรือว่าอเล็กซานเดอร์จะต้องเป็นฝ่ายเข้ามาติดต่อ?”\n\n“ทำไม? ทำไมคุณถึงลดตัวลงมาใช้อุบายพรรค์นี้?”\n\n“ก็นะ”\n\nเวียลกรินแสยะยิ้ม เขายกปลายนิ้วขึ้นดีดเพื่อควบคุมพลังเวท ก่อนจะเอ่ยถามขึ้นมาอย่างกะทันหัน\n\n“ความภักดีของเจ้าตั้งมั่นอยู่ที่ใด เจ้าสายลับ?”\n\n“แด่องค์มหาราชาพ่ะย่ะค่ะ”\n\n“ยังคงเหมือนเดิมไม่เปลี่ยน น่ายกย่องจริงๆ ถ้าเจ้ายังมีชีวิตอยู่ อย่างน้อยก็น่าจะแวะไปแสดงความเคารพกันบ้าง มิตรภาพของพวกเรามันยังไม่ถึงขั้นนั้นเลยสินะ”\n\nอีวานฟังคำพูดของเวียลกรินพลางกระชับด้ามขวานในมือแน่น\n\nโชคดีที่สมรรถภาพทางกายของเขายังเป็นปกติ คลื่นกระแทกที่ซัดเขากระเด็นออกไปเมื่อครู่ไม่ได้เป็นเวทมนตร์สายโจมตีตั้งแต่แรกอยู่แล้ว\n\nเขาจะสามารถเอาชนะเวียลกรินแบบซึ่งๆ หน้าได้ไหม?\n\nวินาทีที่คิดถึงเรื่องนั้น เขาก็รู้คำตอบทันที เป็นไปไม่ได้\n\nแต่เวียลกรินจะสามารถสำแดงพลังดั้งเดิมทั้งหมดของตัวเองออกมาได้งั้นหรือ?\n\nคงไม่ ปริมาณพลังเวทที่สัมผัสได้ไม่ได้ต่างไปจากระดับของกัปตันเรือเลยแม้แต่น้อย\n\n“โอ้ คิดจะสู้เรอะ เอาเถอะ… เจ้าก็เป็นแบบนี้มาตลอดนี่นะ อีวาน ‘ตัวน้อย’”\n\n“มีทางเลือกอื่นด้วยหรือไง?”\n\n“ย่อมมีอยู่แล้ว แต่ดูท่าเจ้าคงไม่คิดจะเลือกทางนั้นสินะ เอาเลย ให้ข้าได้เห็นฝีมือของเจ้าหน่อยหลังจากไม่ได้เจอกันมานาน”\n\nแม้ปริมาณพลังเวทของกัปตันเรือจะสูงกว่ามนุษย์ทั่วไป แต่ช่องว่างก็ไม่ได้กว้างใหญ่จนสิ้นหวัง\n\nกล่าวอีกนัยหนึ่ง มันคือความแตกต่างที่ยังพอมีช่องทางให้ต่อกรได้\n\nทว่า… ต่อให้ครอบครองพลังเวทในระดับนั้น แต่ถ้าตัวเวียลกรินเองเป็นผู้ควบคุมร่างนั้นอยู่ โอกาสที่จะชนะจะมีอยู่จริงงั้นหรือ?\n\n‘ไม่มี’\n\nอีวานตระหนักถึงขีดจำกัดของตนเองเป็นอย่างดี นั่นคือหนึ่งในคุณสมบัติที่สำคัญที่สุดของเจ้าหน้าที่ที่ผ่านการฝึกฝนมา\n\nเนื่องจากเขาต้องมองตนเองเป็นเครื่องมือในการบรรลุภารกิจ เขาจึงจำเป็นต้องเข้าใจสเปกความสามารถตามรายการของตนเองอย่างแม่นยำ\n\nดังนั้น อีวานจึงรู้ดีว่าตัวเองไม่มีโอกาสชนะเลย เวียลกรินสามารถแยกชิ้นส่วนเขาได้อย่างง่ายดายด้วยพลังเวทเพียงครึ่งเดียวของระดับนั้นด้วยซ้ำ\n\nทว่า ทว่า…\n\nโอกาสชนะไม่ได้สำคัญเลยสักนิด\n\n“รับไปสักกระบวนท่าสองกระบวนท่าแล้วกัน”\n\nอีวานกำด้ามขวานแน่นด้วยดวงตาที่ลุ่มลึกลง\n\nชัยชนะไม่สำคัญ\n\nทำได้หรือไม่ได้ เรื่องพรรค์นั้นไม่เคยถูกนับว่าสำคัญมาก่อน\n\nสมควรต้องทำหรือไม่? ถ้าสมควรต้องทำ ไม่ว่าจะด้วยวิธีใด ในสถานการณ์ไหน ก็ต้องทุ่มเทให้สุดความสามารถไม่ว่าสภาพการณ์จะเป็นเช่นไร\n\nในฐานะเจ้าหน้าที่ที่ผ่านการฝึกฝน สิ่งที่ควรหวาดกลัวไม่ใช่ความล้มเหลว แต่คือการยอมแพ้ต่างหาก\n\n***\n\nตัดสินใจภายในเสี้ยววินาทีที่สั้นที่สุด และลงมือให้รวดเร็วที่สุดเท่าที่จะทำได้\n\nวินาทีที่อีวานตัดสินใจบุกโจมตี เขาก็พุ่งทะยานร่างออกไปทันที ตรงเข้าใส่เวียลกริน\n\nสัมผัสแห่งการชำแหละ แยกย่อยชั่วขณะหนึ่งออกเป็นหน่วยไมโครวินาที\n\nความรู้สึกของแรงต้านอากาศที่ปะทะเข้ากับร่างกาย ทำให้กระแสเวลาเองดูเหมือนจะเคลื่อนตัวช้าลง\n\nประสาทสัมผัสอันเฉียบคมของ ‘ผู้ก้าวข้ามขีดจำกัด’ ที่แล่นพล่านเข้ามาในจังหวะที่พลังเวทถูกกระตุ้นอย่างรุนแรงด้วยการส่งกระแทกเข้าสู่เส้นประสาท\n\nชั่วพริบตาแห่งการมองเห็นภาพชั่วขณะ ชั่วขณะนี้แหละคือสนามรบของเหล่าผู้ก้าวข้ามขีดจำกัด\n\nในห้วงเวลาที่กระทั่งการหายใจยังถูกแบ่งแยกเป็นชิ้นส่วน ขวานของอีวานล่องลอยผ่านอากาศราวกับไร้น้ำหนัก ลื่นไหล คมกริบ ทว่าหนักแน่นมั่นคง\n\n– วูมมม—!!\n\nตรงจังหวะที่พลังเวทสีเขียวมรกตกำลังก่อตัวขึ้นพอดี\n\nเขาฉีกกระชากม่านเวทออกไปได้ชั้นหนึ่ง\n\nเข้าถึงตัวแล้ว เวียลกริน\n\nอีวานจ้องมองมัน เอ่ยวจีผ่านสายตา และเตรียมพร้อมสำหรับการโจมตีครั้งถัดไป\n\nในจังหวะที่เขาปอกเปลือกเวทมนตร์ทิ้งไปก่อนที่มันจะก่อตัวสมบูรณ์ หากคำนวณจากเวลาที่ต้องใช้ในการร่ายเวทบทถัดไป ขวานของอีวานย่อมรวดเร็วกว่าอย่างไม่ต้องสงสัย\n\nเช่นนั้น เขาจึงเข้าประชิดตัวได้ ในตำแหน่งเดียวกับเหล่ายักษ์ใหญ่ที่เขาเคยเผชิญหน้ามาในยุคสมัยนั้น\n\n“ยอดเยี่ยม”\n\nน้ำเสียงที่เจือปนไปด้วยเสียงหัวเราะดังกังวานขึ้นอย่างนุ่มนวล\n\n– ฟู่ววว—!!\n\nแรงต้านอันบางเบาขวางกั้นเส้นทางของเขาไว้ อีวานตอบสนองในทันทีด้วยการบิดเอวหลบ ผ่านช่องว่างนั้น หอกน้ำแข็งอันแหลมคมห้าเล่มพุ่งทะลวงเฉียดผ่านไป\n\nความเร็วที่เหนือล้ำยิ่งกว่าการตรวจจับแนววิถีกระสุน เวทมนตร์ที่ก่อตัวเสร็จสมบูรณ์ทันทีในเสี้ยววินาทีที่จิตเริ่มร่ายคาถา\n\nช่วงเวลานับตั้งแต่รับรู้ถึงเสี้ยววินาทีนั้นจนกระทั่งอีวานปรับท่าทางใหม่และเงื้อขวานขึ้น ยังคงเป็นเพียงชั่วพริบตาเดียวภายในห้วงเวลาที่ถูกซอยย่อย\n\nทว่า ณ จุดสิ้นสุดของการปะทะอันแสนสั้นนั้น\n\n“ฮะ”\n\nมองเห็นได้อย่างชัดเจน วงเวทที่ถูกสลักโครงสร้างไว้อย่างสมบูรณ์มากกว่าสี่สิบบทลอยจารึกอยู่กลางอากาศ\n\nเวียลกรินยิ้มละไมพลางปรบมือเบาๆ\n\n“แสดงให้ข้าดูมากกว่านี้สิ เจ้าเติบโตขึ้นมากแค่ไหนแล้ว?”\n\nอีวานตระหนักได้ถึงเรื่องนั้น กัดฟันกรอด แล้วพุ่งทะยานไปข้างหน้า"

      "title": "บทที่ 35",
      "content": "“ข้าแต่พระผู้เป็นเจ้า โปรดทรงใช้ข้าเป็นเครื่องมือแห่งสันติสุขของพระองค์ด้วยเถิด!” (ยูจีน)\n\n“อย่ามัวแต่พล่ามไร้สาระ ตั้งสมาธิหน่อย!” (ออสวัลด์)\n\nยูจีนยังคงไล่ฟาดฟันเหล่าเอลฟ์ให้ร่วงลงไปอย่างต่อเนื่องด้วยดวงตาที่ลุกโชนอย่างดุเดือด\n\nเมื่อเห็นแสงสีขาวตรงปลายคมดาบระเบิดออกทุกครั้งที่ตวัดฟัน ดูเหมือนว่า ‘พระเจ้า’ ของเขาจะทรงพอพระทัยกับคำสวดภาวนาของเจ้าตัวอยู่ไม่น้อยทีเดียว\n\nทว่าต่อให้พวกเขาจะเก่งกาจเหนือธรรมดาเพียงใด สุดท้ายพวกเขาก็ยังคงเป็นเพียงนักศึกษา ฝีมือของพวกเขาอาจจะเหนือกว่าชั้นปีของตน แต่คุณภาพของประสบการณ์นั้นต่างกันโดยสิ้นเชิง\n\n“พวกเรากำลังโดนดันถอยแล้ว! โดนดันถอยแล้ว!” (ยูริ)\n\n“รู้น่า! อดทนไว้!” (ออสวัลด์)\n\nออสวัลด์และยูริกวัดแกว่งมือไปมาอย่างหัวเสีย กองกำลังที่รุกคืบเข้ามาพร้อมการตั้งรับอันแน่นหนา ไม่มีช่องโหว่ให้ตีฝ่าออกไปได้เลย\n\nคนพวกนี้คือทหารที่ผ่านยุคสงครามปีศาจมาแล้ว แม้จะผ่านมาสี่ปีนับตั้งแต่ความสงบสุขมาเยือน แต่พวกเขาก็ยังคงเป็นทหารที่จดจำสัญชาตญาณยามประจำการรบได้เป็นอย่างดี\n\nกล่าวอีกนัยหนึ่ง การต้องมาเผชิญหน้ากับกองกำลังระดับหัวกะทิเกินเหตุเหล่านี้เป็นคู่ต่อสู้กลุ่มแรก สำหรับเหล่าผู้กลับชาติมาเกิดจากศตวรรษที่ 21 ที่แทบไม่มีประสบการณ์การต่อสู้จริงเลย ย่อมเป็นบททดสอบที่หนักหนาสาหัส\n\nหากเป้าหมายตั้งแต่แรกคือการสังหาร การต่อสู้นี้คงจบลงไปนานแล้ว ผู้บัญชาการหน่วยหัวเราะเยาะ\n\n“พวกนักศึกษา พอแค่นี้เถอะ วางอาวุธลงซะ!”\n\n“เมื่อไหร่คุณอีวานจะมาสักทีคะเนี่ย?!” (ยูริ)\n\nขณะที่เสียงกรีดร้องเจือน้ำตาของยูริแหลมสูงขึ้นเรื่อยๆ ดาดฟ้าเรือก็เริ่มสั่นสะเทือน\n\n– เอี๊ยด เอี๊ยด เอี๊ยด…!\n\n“อะไรกันวะเนี่ย…?!”\n\n“ห้องหางเสือ รีบไปดูที่ห้องหางเสือ เกิดอะไรขึ้น นายทหารเวรยาม!”\n\n“กัปตันอยู่ที่ไหน?!”\n\nแรงกระแทกมหึมาราวกับตัวเรือเกิดระเบิดขึ้นพุ่งเข้าซัดดาดฟ้าเรือ พร้อมเสียงโครงสร้างเรือบิดเบี้ยวลั่นครืดคราดและเสียงครืนครั่นจากใต้ท้องเรือ\n\nทั้งเหล่าทหารและผู้ข้ามมิติต่างเซถลาล้มกลิ้งลงไปกองกับพื้น\n\n“นี่มันอะไรกัน?” (ออสวัลด์)\n\n“คุณอีวานเป็นคนทำเหรอคะ…?” (ยูริ)\n\nออสวัลด์ยันตัวขึ้นจากพื้น ก่อนจะเงยหน้าขึ้นมองอย่างกะทันหัน\n\nกระแสพลังเวทอันมหาศาล… ไม่สิ พลังเวทที่หลอมรวมเข้ากับเทคนิคชั้นสูงปรากฏให้เห็นเด่นชัด\n\nพลังเวทสีเขียวมรกตทะลักเข้าสู่ห้องโดยสารราวกับกระแสน้ำเชี่ยว ตึง โครม เสียงระเบิดดังใกล้เข้ามาเรื่อยๆ\n\n“ไม่ ไม่ใช่คุณอีวาน นี่มัน…” (ออสวัลด์)\n\nออสวัลด์หรี่ตาลง ไม่นานนัก พลังเวทอันหนาแน่นก็มารวมตัวกันอยู่ใต้ดาดฟ้าเรือ\n\n“หลบเร็ว!!”\n\n– กว๊ากกกก!\n\nยูริจับตัวยูจีนที่ยังติดอยู่ในฤทธิ์บัฟความกล้าโยนออกไป ก่อนจะคว้าคอเสื้อของออสวัลด์แล้วกระโดดถอยหลัง รอยแยกขนาดใหญ่ปะทุขึ้นกลางดาดฟ้าเรือ และมีร่างหนึ่งกระเด็นพุ่งออกมา\n\nร่างนั้นหมุนตัวกลางอากาศอย่างสง่างามราวกับนักยิมนาสติก ก่อนจะร่อนลงแตะพื้นใกล้กับกลุ่มผู้ข้ามมิติ เป็นการลงจอดด้วยร่มชูชีพที่งดงามหมดจด (หากมีร่มชูชีพ)\n\n“คุณอีวาน!” (ยูริ)\n\n“อืม” (อีวาน)\n\nกลิ่นเหม็นไหม้ฉุนเฉียวแผ่ออกมาจากร่างของอีวานขณะที่เขาเผชิญหน้ากับพวกเขาอย่างสงบนิ่งพร้อมขวานในมือ\n\n“ยอดเยี่ยม! ช่างเพาะบ่มปณิธานเช่นนี้ขึ้นมาได้ในโลกที่ถูกเก็บรักษาไว้ด้วยสันติภาพ!” (เวียลกริน)\n\n“ท-ท่านเวียลกรินงั้นหรือขอรับ?!”\n\nดวงตาของเหล่าลูกเรือเบิกกว้างราวกับไม่คาดคิดมาก่อนว่าเวียลกรินจะโผล่ออกมา อีวานหรี่ตาลงเมื่อเห็นปฏิกิริยาของพวกนั้น เกิดอะไรขึ้นกันแน่? หมอนี่หลอกกระทั่งพวกเอลฟ์ด้วยกันเองงั้นเรอะ?\n\nทำไมต้องใช้วิธีลับๆ ล่อๆ ขนาดนี้ด้วย ถ้าฝ่ายคาลีออนต้องการสนับสนุนอเล็กซานเดอร์ในระดับประเทศอยู่แล้ว?\n\n“เอ่อ คุณอีวาน ช่วยอธิบายหน่อยได้ไหมครับว่ามันเกิดเรื่องบ้าอะไรขึ้น…” (ออสวัลด์)\n\nออสวัลด์มองไปยังเวียลกรินที่ลอยตัวอยู่กลางอากาศด้วยสีหน้าสับสน\n\nในฐานะที่เป็นเอลฟ์เหมือนกัน เขาเคยพบหน้าเวียลกรินมาแล้วสองสามครั้ง จอมเวทผู้ทรงพลังล้นฟ้าอย่างแท้จริง\n\nและบัดนี้ ตัวตนระดับนั้นกำลังลอยตัวอยู่เหนือศีรษะของพวกเขา พลางเตรียมร่ายเวทโจมตี\n\n“สรุปสั้นๆ ก็คือ… ฉันเกือบจะทำสำเร็จแล้วเชียว” (อีวาน)\n\nเวียลกรินก้มลงมองอีวานด้วยรอยยิ้มที่เจือเสียงหัวเราะ เขาสูญเสียแขนไปข้างหนึ่งแล้ว\n\nเขาเอ่ยขึ้นด้วยรอยยิ้มขื่นๆ\n\n“อีวาน ข้าแปลกใจมากนะที่เห็นเจ้าโผล่มาที่นี่ แต่… เอาเถอะ สงสัยข้าคงจะยั่วโมโหองค์หญิงเอลิซาเวตาหนักกว่าที่คิดไปหน่อย เดิมทีข้าวางแผนจะแอบลอบเข้ามาในสถานการณ์ที่เป็นมิตรกว่านี้แท้ๆ” (เวียลกริน)\n\nขณะที่เขายกมือข้างที่เหลือขึ้น พลังเวทสีเขียวมรกตก็พวยพุ่งออกมาอย่างรุนแรง อีวานเตรียมพร้อมที่จะขว้างขวาน พลางจับตาสังเกตสถานการณ์อย่างใกล้ชิด\n\nหากผู้กลับชาติมาเกิดอย่างน้อยสักคนสามารถดึงความสนใจของเวียลกรินได้ พวกเขาก็อาจจะมีโอกาส\n\nทว่า สนามรบและสถานการณ์ในตอนนี้ไม่ได้เอื้ออำนวยเอาเสียเลย\n\n“ไว้ค่อยมาพบกันใหม่ทีหลัง สำหรับตอนนี้ สถานการณ์ดูไม่ค่อยดีเท่าไหร่นัก” (เวียลกริน)\n\n“เวียลกริน” (อีวาน)\n\n“เจ้ารู้เรื่องเกี่ยวกับมกุฎราชกุมารอเล็กซานเดอร์มากน้อยแค่ไหนกัน และเจ้ายังคงภักดีต่อกษัตริย์ของเจ้าอยู่หรือเปล่า ทั้งที่รู้เรื่อง ‘นั้น’ แล้วน่ะ?” (เวียลกริน)\n\n“…ว่าไงนะ?” (อีวาน)\n\nเวียลกรินโบกมือ พลังเวทอันทรงพลังก่อตัวเป็นมือที่มองไม่เห็นแล้วยกเอารถม้าที่จอดนิ่งอยู่มุมหนึ่งของดาดฟ้าเรือลอยขึ้นกลางอากาศ\n\nภายในรถม้าเกิดเสียงเอะอะโวยวายและเสียงกรีดร้อง ไม่นานนัก ประตูรถม้าก็เปิดออกดังปัง\n\n“ออกมา” (เวียลกริน)\n\n“ก-เกิดความโกลาหลอะไรขึ้นกันแน่…! พ-พวกเรามาที่นี่เพื่อทำข้อตกลงลับ…!” (ชายในรถม้า)\n\n“ชู่ เงียบเดี๋ยวนี้” (ชายอีกคนในรถม้า)\n\nเวียลกรินตวัดแขนข้างที่เหลือ ชายวัยกลางคนที่โผล่ศีรษะออกมานอกตัวรถม้าลอยละลิ่วขึ้นมาบนอากาศตามแรงดึงดูดของเวทมนตร์\n\n“ที่แท้ อเล็กซานเดอร์ก็ไม่ได้มาด้วยตัวเองจริงๆ สินะ เจ้าเป็นใคร?” (เวียลกริน)\n\n“ข-ข้าคือ นิโคไล สโลโบดาโนวิช รยูริก…! ข-ข้าได้รับมอบอำนาจเต็มมาจากกระทรวงการต่างประเทศของประเทศนี้! จ-เจ้าจะมาทำอันตรายข้าไม่ได้นะ!”\n\n“โอ้ เป็นเจ้าเองเรอะที่กล้ากล่าวอ้างเช่นนั้น เจ้ารู้ตัวหรือเปล่าว่ากำลังพูดอยู่กับใคร?” (เวียลกริน)\n\nเวียลกรินหัวเราะในลำคอแล้วค่อยๆ ลอยเข้าไปใกล้ชายคนนั้น\n\nเขาวางมือข้างที่เหลือลงบนศีรษะของชายคนนั้นแล้วกระซิบแผ่วเบา\n\n“พูดมา ตอนนี้มกุฎราชกุมารอเล็กซานเดอร์อยู่ที่ไหน?” (เวียลกริน)\n\nใต้ฝ่ามือของเวียลกริน พลังเวทสีเขียวมรกตพลุ่งพล่าน เวทมนตร์ราวกับอสรพิษแทรกซึมเข้าไปในหูและดวงตาของชายผู้นั้น\n\nสีหน้าของชายคนนั้นค่อยๆ เลือนหายไปกลายเป็นว่างเปล่า เขาพึมพำออกมาด้วยใบหน้าเหม่อลอย\n\n“ตอนนี้พระองค์กำลังรออยู่ที่กระทรวงการต่างประเทศ….”\n\n“ไอ้คนไม่รู้อีโหน่อีเหน่ เสียเวลาเปล่าชะมัด” (เวียลกริน)\n\nพร้อมเสียงหักคมกริบ ศีรษะของชายคนนั้นก็พับตกลง เวียลกรินที่โยนร่างนั้นทิ้งราวกับขยะค่อยๆ ร่อนตัวลงมาบนดาดฟ้าเรือ\n\n“นี่มันเรื่องอะไรกันแน่? เวียลกริน คุณกำลังวางแผนอะไรอยู่?” (อีวาน)\n\nอีวานหรี่ตาลงจนแคบ\n\nกระตุ้นเอลิซาเวตาเพื่อให้ติดต่อกับอเล็กซานเดอร์ โดยธรรมชาติแล้วฝ่ายคาลีออนย่อมพยายามแทรกแซงกิจการภายในด้วยการสนับสนุนมกุฎราชกุมารอเล็กซานเดอร์\n\nในสถานการณ์เช่นนี้ ดูเหมือนจะไม่มีข้อสันนิษฐานอื่นใดที่เป็นไปได้อีกแล้ว\n\nทว่า จู่ๆ เวียลกรินกลับสังหารทูตทิ้งเสียดื้อๆ แถมยังถามหาที่อยู่ของอเล็กซานเดอร์อีกงั้นหรือ?\n\n“หมอนั่นไม่ได้อยู่ในเมืองในเวลานี้ อืม… มีเรื่องราวที่ไม่อาจเอ่ยถึงอีกมากมายระหว่างพวกเรา แต่มันลำบากใจที่จะพูดขึ้นมา” (เวียลกริน)\n\nเวียลกรินลังเลอยู่หลายครั้ง ก่อนจะขมวดคิ้วมุ่น\n\n“ทางตันสินะ ถ้าเจ้าไม่อาจไขปริศนาได้ด้วยตัวเอง ข้าก็ไม่อาจบอกเจ้าได้ น่าเสียดายที่เหล่าจอมเวทมักถูกพันธนาการไว้ด้วยความลี้ลับเสมอ” (เวียลกริน)\n\n“ทำไมคุณไม่ยอมอธิบายให้ผมฟังตั้งแต่แรก? ถ้าคุณไม่ได้คิดจะไปเข้าพวกกับอเล็กซานเดอร์ คุณก็น่าจะบอกผมล่วงหน้าได้นี่….” (อีวาน)\n\n“ขืนทำแบบนั้น ข้าก็ตรวจสอบคุณสมบัติของเจ้าไม่ได้น่ะสิ และข้าก็จะไม่รู้ด้วยว่าเจ้ายืนอยู่ฝั่งไหนกันแน่ ข้านึกว่าเจ้าตายไปแล้วเสียอีก มันเป็นเรื่องจำเป็น” (เวียลกริน)\n\nเวียลกรินยักไหล่ พลังเวทของเขาค่อยๆ อ่อนแรงและจางหายลงทีละน้อย\n\n“พวกเราเหลือเวลาไม่มากแล้ว สักวันหนึ่ง เจ้าอาจจะต้องเดินทางไปยังหอคอยของข้าในคาลีออน เจ้าคงไม่อาจเผชิญหน้ากับข้าได้โดยตรงหรอก… อีวาน กองระวังหลังของพวกเรา เจ้ามีคุณสมบัติแล้ว” (เวียลกริน)\n\n“คุณสมบัติอะไรที่คุณพูดถึง?” (อีวาน)\n\n“คุณสมบัติที่จะเปิดพลิกหน้าสุดท้ายแห่งความจริง คุณสมบัติที่จะมองเห็นเหล่าเบี้ยบนกระดานหมากรุกนี้ อา ให้ตายสิ บัดซบเอ๊ย” (เวียลกริน)\n\nรอยร้าวปรากฏขึ้นบนใบหน้าของเวียลกรินราวกับแก้วแตกร้าว เขาเอามือแตะใบหน้าตัวเองอีกครั้งแล้วถอนหายใจ\n\n“มันโหดร้ายเกินไปหากไม่บอกอะไรเลยแม้แต่นิดเดียว โดยปกติพวกจอมเวทก็เป็นพวกช่างจ้ออยู่แล้วด้วย” (เวียลกริน)\n\n“ผมควรทำยังไง?” (อีวาน)\n\n“เตรียมตัวไว้ เกมกระดานนี้ดูเหมือนจะเกี่ยวข้องกับสถาบันการศึกษาข้างล่างนั่น มีวันคืนอีกมากมายแผ่ขยายอยู่เบื้องล่างนั้น” (เวียลกริน)\n\n“เตรียมตัว…?” (อีวาน)\n\n“พวกเขาก็ไม่เลวหรอก แต่ไม่ได้ถูกจัดเตรียมไว้ตั้งแต่แรก อยู่ๆ ก็โผล่ขึ้นมาบนกระดานหมากรุก… อืม จะเรียกว่าไพ่ที่ถูกโยนลงมาก็คงได้ ดังนั้น จงใส่ใจเหล่าหมากบนกระดานด้วยล่ะ ฝากดูแลลูกสาวของข้าด้วยนะ” (เวียลกริน)\n\nใบหน้าของเวียลกรินค่อยๆ เลือนรางลง เสี้ยววินาทีก่อนที่จะสลายหายไปโดยสมบูรณ์ เขามองตรงมาที่อีวานแล้วยิ้มกว้าง\n\nแม้จะไม่มีเสียงใดเล็ดลอดออกมา แต่อีวานก็อ่านริมฝีปากของเขาได้โดยสัญชาตญาณด้วยทักษะการอ่านปาก\n\n– แม็กซิมิเลียนยังไม่หายไปไหน\n\nพร้อมเสียงหัวเราะเบาๆ พลังเวทของเวียลกรินก็จางหายไปจนหมดสิ้น\n\nความโกลาหลบนดาดฟ้าเรือไม่ได้ส่งไปถึงหูของชาวเมืองเฟรเชนกายา ดูเหมือนเรือรบยังคงลอยนิ่งอยู่บนท้องฟ้าตามปกติ\n\nอีวานและเหล่าผู้ข้ามมิติได้รับการส่งตัวลงมาจากเรืออย่างนอบน้อมจากกัปตันที่ขวัญหนีดีฝ่อ และสามารถร่อนลงสู่พื้นดินได้อย่างปลอดภัย ขณะที่รถม้าที่พลิกคว่ำถูกทิ้งไว้ตรงมุมตรอกแห่งหนึ่ง อีวานก็กวาดสายตามองเหล่าผู้ข้ามมิติ\n\nกระดานเกม\n\nราวกับไพ่ที่ถูกโยนลงมาบนกระดานหมากรุก บางทีอาจจะตีความได้ว่าเป็นการผสมผสานของเกมที่มีกฎกติกาแตกต่างกัน\n\nพวกเขาต้องการเรื่องราวแบบไหนกัน? เรื่องราวแบบใดที่ถูกจัดเตรียมไว้ และกระแสไหลเวียนแบบใดที่กำลังถูกชักนำอยู่?\n\nใครกันคือมือที่คอยขยับหมากบนกระดาน?\n\nพระเจ้างั้นหรือ?\n\nอีวานมองไปยังยูจีนที่สามารถใช้เวทมนตร์ศักดิ์สิทธิ์ได้ เนื่องจากผลของบัฟ [ประทานความกล้า] หมดลงแล้ว บนใบหน้าของยูจีนจึงเต็มไปด้วยสีหน้าอ่อนล้าหมดแรง\n\n“นายยังมีช่องสล็อตเวทมนตร์ศักดิ์สิทธิ์อยู่ใช่ไหม?” (อีวาน)\n\n“ครับ? อ้อ ครับผม” (ยูจีน)\n\n“อืม”\n\nแตกต่างจากเวทมนตร์ทั่วไป เวทมนตร์ศักดิ์สิทธิ์คือพรชนิดหนึ่งที่ประทานลงมาจากทวยเทพโดยตรง มันคือเวทมนตร์ที่สำแดงออกมาโดยใช้ร่างกายมนุษย์เป็นสื่อกลางเพื่อเป็นตัวแทนแห่งเจตจำนงของทวยเทพ\n\nกล่าวอีกนัยหนึ่ง คำว่า “ช่องสล็อตเวทมนตร์ศักดิ์สิทธิ์” ย่อมไม่มีความหมายอื่นใดนอกจาก ‘แถบสถานะ’ ของยูจีนได้รับการรับรองอำนาจจากทวยเทพแล้ว\n\nไม่สิ บางทีมันอาจจะเป็นเทพจำแลงที่ถูกสร้างขึ้นโดยการสมมติบุคลาธิษฐานของทวยเทพในโลกแฟนตาซียุคใหม่เฮงซวยนั่น เพื่อทำหน้าที่เป็นช่องทางสื่อสารก็ได้\n\nโดยเฉพาะอย่างยิ่งเมื่อพิจารณาถึงการออกแบบที่ละเอียดถี่ถ้วน รวมถึงรายละเอียดปลีกย่อยอย่างหน้าต่างเควสต์ด้วย\n\n“วันนี้พวกนายเหนื่อยมามากแล้ว กลับไปพักผ่อนเถอะ เจอกันพรุ่งนี้” (อีวาน)\n\n“เอ่อ คุณอีวาน เรื่องมันจบลงแค่นี้เลยเหรอคะ?” (ยูริ)\n\n“ไว้พรุ่งนี้”\n\nอีวานปรายตามองเหล่าผู้ข้ามมิติที่กำลังเดินจากไป จากนั้นก็หันหลังเดินแยกออกมา\n\nตอนนี้ยังไม่ใช่เวลาที่เหมาะสมจะพาพวกนั้นไปยังจุดส่งรายงาน โดยเฉพาะอย่างยิ่งในสถานการณ์เช่นนี้ ที่พวกนั้นไม่ควรเข้ามามีส่วนพัวพันอย่างลึกซึ้ง โดยเฉพาะในคดีนี้ จะเป็นการดีกว่าหากพวกนั้นไม่ต้องเข้ามาพัวพันมากไปกว่านี้\n\nหากเป็นเพียงเรื่องความขัดแย้งธรรมดาระหว่างองค์หญิงกับมกุฎราชกุมาร ก็คงจะดีกว่าหากตัดสินใจเลือกข้างไปเลยถ้ามั่นใจในชัยชนะ\n\nทว่า นับตั้งแต่ได้รับข่าวว่ามกุฎราชกุมารที่อยู่ในเฟรเชนกายาไม่ใช่ตัวจริง คดีนี้ก็ก้าวข้ามระดับที่นักศึกษาจะรับมือไหวไปเสียแล้ว\n\nโดยเฉพาะเด็กน้อยที่เพิ่งข้ามมิติมาได้แค่สี่ปี\n\nมันก็ผ่านมานานหลายปีแล้วสินะ\n\nขณะเดินไปตามท้องถนนยามค่ำคืน อีวานก็ครุ่นคิด\n\nเมื่อนึกถึงภาพลักษณ์ครั้งสุดท้ายของพันเอกคิริลลอฟนา อีวานก็มุ่งหน้าไปยังกองบัญชาการข่าวกรอง\n\nถึงเวลาต้องไปเผชิญหน้ากับองค์หญิงแล้ว"
    },

      "title": "บทที่ 36",
      "content": "เมื่ออีวานเดินทางมาถึงกองบัญชาการข่าวกรอง ทุกคนตั้งแต่ทหารยามไปจนถึงเจ้าหน้าที่ที่ประจำอยู่ตามโต๊ะทำงานต่างพากันลุกขึ้นยืนและหันมามองเขาเป็นตาเดียว\n\n“คุณพระช่วย นี่เรื่องจริงเหรอเนี่ย?”\n\n“อีวานตัวน้อย….”\n\nเสียงกระซิบกระซาบดังระงมไปทั่วกองบัญชาการขณะที่อีวานก้าวเดินผ่าน ทุกคนต่างค้อมศีรษะให้อย่างเงียบเชียบเบื้องหลัง และยืนตัวตรงแน่วอยู่เบื้องหน้าของเขา\n\nทันใดนั้น เจ้าหน้าที่นายหนึ่งที่สบตาเข้ากับอีวานก็รีบยกมือขึ้นทำความเคารพและก้าวเข้ามาหาอย่างรวดเร็ว\n\n“อะ เป็นเกียรติอย่างยิ่งที่ได้พบท่านครับ ร้อยโทเปโตรวิช!”\n\n“นายรู้จักฉันด้วยเรอะ?” (อีวาน)\n\n“รู้จักครับ”\n\nชายหนุ่มที่สบตาเข้ากับอีวานตัวสั่นเทาและรีบเอ่ยขึ้นอย่างรวดเร็ว\n\n“พวกเราเป็นรุ่นที่เรียนรู้จากคู่มือที่ท่านเขียนเอาไว้ครับ!”\n\n“อ้อ ไอ้นั่นเอง” (อีวาน)\n\nอีวานพยักหน้าพลางนึกขึ้นได้ว่าเขาเคยเขียนอะไรทำนองบันทึกประจำวันเอาไว้ โดยบันทึกรายละเอียดประสบการณ์การแทรกซึมเข้าไปในเขตที่ปีศาจอาศัยอยู่และการลอบสังหารศัตรูในสนามรบ\n\nและตามปกติของบันทึกประจำวัน มันค่อนข้างน่าอับอายอยู่ไม่น้อยเวลาที่มีใครมาอ่านสิ่งที่ตัวเองเขียนเอาไว้ อีวานเบือนหน้าหนีด้วยสีหน้าไร้อารมณ์\n\n“ท่านมาพบร้อยโทเชอร์คาตอฟหรือครับ?”\n\n“อืม ฉันมีเรื่องต้องรายงานโดยตรงต่อคิริลลอฟนา ท่านอัครมหาเสนาบดี” (อีวาน)\n\n“…กระผมจะนำทางท่านไปยังพระราชวังตะวันออกเองครับ เชิญตามมาทางนี้ได้เลย”\n\nอีวานพยักหน้าสั้นๆ แล้วเดินตามเจ้าหน้าที่ที่ไม่รู้จักคนนั้นไป ความเงียบอันน่าอึดอัดปกคลุมบรรยากาศอย่างหนักอึ้ง\n\nมารายงานต่อองค์หญิงโดยตรงเลยงั้นหรือ? เรื่องนี้มันต้องใหญ่หลวงขนาดไหนกันแน่?\n\nเหล่าเจ้าหน้าที่ต่างยืนตัวตรงแน่วอย่างแข็งขัน ค้อมศีรษะทำความเคารพเบื้องหลังอีวานอย่างนอบน้อม ก่อนจะแยกย้ายกลับไปประจำตำแหน่งของตน บรรยากาศแห่งความวุ่นวายที่กำลังจะมาถึงลอยอบอวลอยู่จางๆ\n\nไม่ว่าจะเกิดอะไรขึ้นก็ตาม หาก ‘อีวานตัวน้อย’ เข้ามาพัวพันกับองค์หญิงเป็นการส่วนตัว ผลกระทบย่อมแผ่ขยายมาถึงพวกเขาอย่างไม่ต้องสงสัย\n\nพระราชวังตะวันออกแห่งคราซิลอฟเป็นสิ่งปลูกสร้างหินอ่อนขนาดมหึมาที่สร้างขึ้นเพื่อองค์หญิงเพียงพระองค์เดียว\n\nด้วยพระอุปนิสัยขององค์หญิง พระราชวังจึงแสดงให้เห็นถึงแนวโน้มที่มุ่งเน้นประโยชน์ใช้สอยสูงสุดมากกว่าความโอ่อ่าหรูหราของพระราชวังทั่วไป ทว่าตัวอาคารเพียงแค่ขนาดและความหมายเชิงสัญลักษณ์เพียงอย่างเดียวก็สร้างความประทับใจอันแรงกล้าได้แล้ว\n\nอีวานก้าวลงจากรถม้าตรงหน้าประตูใหญ่ที่ประดับด้วยภาพแกะสลักนูนต่ำ เจ้าหน้าที่ผู้ขับรถม้าทำความเคารพโดยไม่เอ่ยคำใดแล้วหายลับไปในความมืดเบื้องหน้า\n\nคงไม่มีใครรู้สึกแปลกใจหากจะมีใครคอยจับตามองอยู่หน้าพระราชวัง ทว่าอีวานไม่ได้ใส่ใจนัก\n\n“ดมิทรี” (อีวาน)\n\n“โอ้ รุ่นพี่!” (ดมิทรี)\n\nดมิทรีซึ่งดูเหมือนจะยังไม่ตื่นเต็มตาปรากฏตัวขึ้นทันทีที่ได้รับรายงาน เขาใช้มือสางผมลวกๆ แล้วยิ้มให้อย่างเป็นมิตร\n\n“เข้าไปข้างในกันเลยดีกว่าครับ! องค์หญิงทรงรออยู่แล้ว” (ดมิทรี)\n\n“นายรู้ว่าฉันจะมางั้นเรอะ?” (อีวาน)\n\n“ก็คืนนี้พี่ไม่ได้กลับไปนอนที่ค่ายทหารนี่ครับ!” (ดมิทรี)\n\nดมิทรีหัวเราะเบาๆ พลางนึกถึงเอลิซาเวตาที่ป่านนี้คงกำลังเดินวนไปวนมาด้วยความกระวนกระวาย\n\nหากภารกิจสำเร็จลุล่วง เรือประจัญบานลอยฟ้าก็น่าจะหายไปจากน่านฟ้าของเฟรเชนกายาแล้ว และหากภารกิจล้มเหลว ข่าวการเสียชีวิตของอีวานก็คงแพร่สะพัดออกมาแล้วเช่นกัน\n\nไม่ว่าจะเป็นข่าวไหนก็ล้วนทำให้ข่มตาหลับไม่ลงทั้งสิ้น เมื่อคาดเดาได้ถึงความกังวลของเอลิซาเวตา ดมิทรีเองก็จัดการงานในความรับผิดชอบของตนด้วยสายตาที่วอกแวกไม่แพ้กัน\n\n“องค์หญิงประทับอยู่ที่ห้องรับรอง ไปกันเถอะครับ!” (ดมิทรี)\n\nระเบียงขององค์หญิงหันหน้าไปทางทิศของถนนสายหลักที่มุ่งหน้าสู่สถาบันเซนต์ยัน นั่นหมายความว่าหากนั่งอยู่บนระเบียง ก็จะสามารถมองเห็นเรือเหาะบนท้องฟ้าได้\n\nสตรีผู้เด็ดเดี่ยวทว่าแฝงความซับซ้อนอันลุ่มลึกทรงเฝ้ารออยู่ ณ ที่แห่งนั้น ทรงทอดพระเนตรมองขึ้นไปบนฟากฟ้าเพื่อรอคอยผลลัพธ์ของภารกิจ\n\nดมิทรีเดินนำหน้าไปพร้อมรอยยิ้มบางๆ\n\n“การพบกันของพวกเราควรจะเกิดขึ้นในเวลาและสถานที่ที่เหมาะสมกว่านี้”\n\nท้ายที่สุด การกลับมาพบกันอีกครั้งของทั้งคู่ก็ไม่ได้โรแมนติกอย่างที่เธอคาดหวังไว้ ดมิทรีหัวเราะหึๆ พลางหวนนึกถึงคำพูดของเอลิซาเวตา\n\nอีวานที่จมอยู่ในห้วงความคิดเดินมุ่งหน้าไปยังระเบียง พลางรำลึกถึงภาพสุดท้ายของเอลิซาเวตาที่ติดอยู่ในความทรงจำของเขา\n\n“ขอโทษนะ ข้าขอโทษจริงๆ วันก้า ข้าขอโทษจากใจจริง” (เอลิซาเวตา)\n\nในวันฝนตกวันนั้น เธอยืนอยู่ตรงนั้น พลางสะอื้นไห้จนเสียงเครือ สตรีร่างเล็กบอบบาง อีวานเคยนึกสงสัยว่าสตรีเช่นเธอถือกำเนิดขึ้นมาจากสายเลือดราชวงศ์อันบึกบึนกำยำได้อย่างไรกัน\n\n“เจ้า… เจ้ามีสิทธิ์ที่จะโกรธแค้นข้า โกรธแค้นประเทศนี้ ต่อให้เจ้าจะหนีไป ข้าก็คงไม่โทษเจ้าหรอก” (เอลิซาเวตา)\n\nเขาจำได้ถึงสิ่งที่ตัวเองพูดกับองค์หญิงผู้ร่ำไห้อยู่ท่ามกลางสายฝนในวันนั้น\n\nมันง่ายดายสำหรับอีวานที่จะหวนรำลึกถึง\n\n“พอจะมีดอกกุหลาบบ้างไหมครับ?” (อีวาน)\n\n“อะไรนะ…?” (เอลิซาเวตา)\n\n“เชอร์โนวิกาชอบดอกกุหลาบน่ะครับ” (อีวาน)\n\nสถานที่แห่งนั้นเป็นทั้งศาลาประกอบพิธีศพและสุสานในเวลาเดียวกัน สถานที่ที่ไม่มีป้ายหลุมศพตั้งอยู่ และไม่มีผู้ใดมาเคารพศพ ศาลาประกอบพิธีศพสำหรับเหล่าผู้ที่ถูกลิขิตให้ต้องถูกลืมเลือน\n\nจนกระทั่งอาคารแห่งนี้กลายมาเป็นกองบัญชาการข่าวกรอง เดิมทีมันเป็นเพียงจัตุรัสอันรกร้างว่างเปล่าตรงมุมหนึ่งของเมืองเฟรเชนกายาที่บอบช้ำจากสงคราม โดยไม่มีแม้แต่หลังคาให้หลบฝน\n\nท่ามกลางสายฝนหนาวเหน็บในฤดูหนาว เอลิซาเวตาเอ่ยถามด้วยสีหน้าโศกเศร้าขณะเปียกปอนไปทั้งร่าง\n\n“เจ้าจำสิ่งที่คนอื่นๆ ชอบได้ด้วยเหรอ?” (เอลิซาเวตา)\n\n“ครับ จำได้ทุกคนเลย” (อีวาน)\n\n“บอกข้าสิ ข้าจะเป็นคนจดจำเอาไว้เอง” (เอลิซาเวตา)\n\nเท่านั้นก็เพียงพอแล้ว อีวานเริ่มเอ่ยปากพูดอย่างเงียบเชียบ เมื่อถ้อยคำของเขาจบลง เอลิซาเวตาก็พึมพำทวนซ้ำแผ่วเบา\n\n“ดอกกุหลาบ เค้กช็อกโกแลต น้ำหอมกลิ่นชะมด ที่แขวนเสื้อคลุมผ้าไหม…” (อีวาน)\n\nเอลิซาเวตาท่องทวนรายชื่อของเหล่าเจ้าหน้าที่ผู้ล่วงลับและสิ่งที่พวกเขาชื่นชอบซ้ำแล้วซ้ำเล่า\n\nเมื่อสายฝนที่โปรยปรายเริ่มซาลง เธอก็เงยหน้าขึ้นมองเขาด้วยดวงตาที่เปียกชุ่ม พลางยื่นแขนออกมา\n\nมันหนาวเย็น ปลายนิ้วเรียวบางของเอลิซาเวตาที่ลูบไล้แก้มของเขารู้สึกเย็นเยียบ คงเป็นเพราะอากาศอันหนาวเหน็บ\n\nอีวานยืนนิ่งไม่ไหวติงขณะรับรู้ถึงสัมผัสจากมือของเอลิซาเวตาบนแก้มของตน\n\n“วันก้า ช่วยใช้ชีวิตอย่างเงียบเชียบด้วยเถอะนะ อย่าให้ใครสังเกตเห็น เพื่อที่ประเทศนี้จะได้ลืมเลือนเจ้าไป” (เอลิซาเวตา)\n\nในฐานะเจ้าหน้าที่พิเศษที่ผ่านการฝึกฝนทักษะการลอบเร้น อีวานสามารถอ่านออกได้กระทั่งถ้อยคำพึมพำที่เอลิซาเวตาไม่ได้เอื้อนเอ่ยออกมา\n\nมีเพียงข้าเท่านั้นที่ควรจะจดจำเจ้าได้\n\nคนอื่นในประเทศนี้ไม่มีสิทธิ์\n\n“แต่อย่าทำลายใบหน้าของตัวเองล่ะ อืม… ใช่แล้ว ลองไว้หนวดเคราดูเป็นไง แบบคุณปู่น่ะ?” (เอลิซาเวตา)\n\n“หนวดเครา… งั้นเหรอครับ?” (อีวาน)\n\n“ใช่ แบบคุณปู่ มันอาจจะเข้ากับเจ้าดีก็ได้นะ” (เอลิซาเวตา)\n\nเมื่อนึกถึงพระพักตร์อันสง่างามขององค์ราชา อีวานก็พยักหน้าเล็กน้อย มันเป็นหนวดเคราที่ดูดีมีระดับจริงๆ แผ่ซ่านเสน่ห์อันน่าเกรงขามและความเป็นลูกผู้ชายออกมาอย่างเต็มเปี่ยม\n\nหลังจากยืนตากฝนอยู่ครู่หนึ่ง อีวานก็หันหลังแล้วเดินจากไป\n\nนั่นคือการพบกันครั้งสุดท้ายระหว่างเขากับองค์หญิง สี่ปีได้ล่วงเลยผ่านไปนับจากวันนั้น\n\nต้องขอบคุณความช่วยเหลือขององค์หญิง ทำให้ผู้คนมากมายต่างลืมเลือนเขาไปแล้ว\n\nยังนับว่าโชคดีที่ในฐานะนายทหารระดับสูงซึ่งเคยนำทัพต่อกรกับศัตรูในหน่วยราชองครักษ์ ชื่อของเขาจึงยังคงถูกจารึกไว้ในสุสานแห่งชาติ\n\nเมื่อเดินผ่านซุ้มประตูทางเข้าอนุสรณ์สถาน สวนอันกว้างใหญ่ไพศาลก็ปรากฏขึ้นเบื้องหน้า\n\nมวลหมู่ดอกไม้ที่ได้รับการดูแลด้วยเวทมนตร์เบ่งบานอย่างงดงามภายใต้ท้องฟ้ายามราตรี\n\nอีวานหยุดฝีเท้าลงชั่วครู่\n\nดอกกุหลาบ ดอกลิลลี่ ดอกฟรีเซีย… สำหรับบางคน ทิวทัศน์นี้อาจดูเหมือนแปลงดอกไม้ที่ปลูกไว้อย่างสะเปะสะปะ ทว่าอีวานรู้ดี นี่คือสวนอนุสรณ์สถานสำหรับเหล่าผู้ที่สละชีพในสงครามครั้งก่อน\n\nพวกเขาไปสืบเสาะหาจนรู้ว่าผู้วายชนม์แต่ละคนชื่นชอบดอกไม้ชนิดใดและนำมาปลูกไว้ที่นี่ เพื่อให้มั่นใจว่าพวกมันจะเบ่งบานผลัดเปลี่ยนหมุนเวียนไปตลอดทุกฤดูกาล\n\nเพื่อที่พวกเขาจะไม่มีวันถูกลืมเลือน\n\n“ฝ่าบาท กระหม่อมดมิทรี เชอร์คาตอฟ พาตัวมาเข้าเฝ้าแล้วพ่ะย่ะค่ะ” (ดมิทรี)\n\n“เข้ามาใกล้ๆ สิ” (เอลิซาเวตา)\n\nน้ำเสียงเย็นชาดังก้องกังวาน พ้นแนวสวนออกไป มองเห็นโต๊ะยาวกลางแจ้งตั้งตระหง่านอยู่\n\nใต้แสงจันทร์ โต๊ะตัวนั้นทอประกายสีขาวสะอาดตา ประดับประดาไปด้วยเครื่องดื่มและของว่างเรียบง่าย\n\nสตรีร่างเล็กเบื้องหลังโต๊ะซึ่งกำลังคัดแยกกองเอกสารปรากฏแก่สายตา\n\n“วันก้า ไม่ได้เจอกันเสียนานเลยนะ” (เอลิซาเวตา)\n\nสตรีผู้เกล้าเรือนผมสีเงินไว้อย่างเรียบร้อยและกลัดด้วยปิ่นสีน้ำเงิน ไม่ได้สวมเครื่องแบบทหารอย่างที่อีวานจดจำได้ หากแต่สวมใส่ชุดราตรีแห่งราชวงศ์\n\nสตรีในชุดกระโปรงสีน้ำเงินเงยหน้าขึ้นมองเขา\n\nขณะที่อีวานกำลังเรียบเรียงคำพูด ดวงตาของเธอก็เบิกกว้างด้วยความตกตะลึง\n\n“โอ้… สวรรค์…” (เอลิซาเวตา)\n\nในฐานะเจ้าหน้าที่ที่ผ่านการฝึกฝน อีวานสามารถแกะความหมายของถ้อยคำที่เธอกลืนกลับลงคอไปได้ผ่านการอ่านริมฝีปาก\n\n“นี่ฉันทำอะไรลงไปเนี่ย…” (เอลิซาเวตา)\n\nสายตาของเธอจับจ้องแน่นิ่งอยู่ที่คางของอีวาน\n\n***\n\nต้องใช้เวลาอยู่ครู่หนึ่งกว่าที่เอลิซาเวตาจะตั้งสติฟื้นตัวจากอาการช็อกได้\n\nเธอพยายามอย่างหนักที่จะไม่มองตรงๆ ไปยังใบหน้าของอีวาน พลางกระแอมไอออกมาหลายต่อหลายครั้ง\n\nกระทั่งอีวานรายงานจบ เธอก็กลับมามีท่าทีสงบนิ่งเยือกเย็นดังเดิมด้วยสีหน้าเรียบเฉย\n\n“เวียลกรินปรากฏตัวขึ้นมาด้วยตัวเองแล้วพูดแบบนั้นสินะ” (เอลิซาเวตา)\n\n“พ่ะย่ะค่ะ ฝ่าบาท” (อีวาน)\n\n“อืม” (เอลิซาเวตา)\n\nเอลิซาเวตาเคาะนิ้วลงบนโต๊ะอย่างครุ่นคิด\n\nผ่านไปครู่หนึ่ง เธอก็เงยหน้าขึ้นมองท้องฟ้า ดวงดาวพราวพรายกระจายอยู่เต็มฟากฟ้ายามค่ำคืน\n\n“วันก้า คนตัดไม้ที่ข้าไว้วางใจมากที่สุด” (เอลิซาเวตา)\n\n“พ่ะย่ะค่ะ ฝ่าบาท” (อีวาน)\n\n“เจ้าเคยเข้าเฝ้าเสด็จพ่อของข้าแล้ว เจ้ารู้สึกยังไงบ้าง?” (เอลิซาเวตา)\n\n“…องค์ราชา…” (อีวาน)\n\nเมื่อได้ฟังคำพูดของอีวาน เอลิซาเวตาก็หัวเราะหึๆ แล้วเอ่ยขึ้น\n\n“องค์ราชางั้นเหรอ นั่นคือสิ่งที่เจ้ามองเห็นสินะ?” (เอลิซาเวตา)\n\n“…” (อีวาน)\n\n“ชายผู้โง่เขลาที่เชื่อว่าทุกสิ่งทุกอย่างจะคลี่คลายลงได้เพียงแค่หุบปากเงียบและนั่งอยู่เฉยๆ ข้ายอมดูหมิ่นดูแคลนเสด็จพ่อของตัวเองเสียยังดีกว่า นั่นคือสิ่งที่ข้าควรจะทำ” (เอลิซาเวตา)\n\nนั่นคือช่วงเวลาสุดท้ายที่พวกเขาได้อยู่ด้วยกัน และจากนั้นสี่ปีก็ผ่านพ้นไป\n\nดวงตาของเธอกำลังลุกโชนอย่างดุดัน\n\n“สหราชอาณาจักรหวาดกลัวดาบที่ลับคมจนช่ำชอง เจ้ารู้เรื่องนั้นไหม? หากปาร์ตี้ผู้กล้าไม่ได้แยกย้ายกันไป ป่านนี้คงเกิดสงครามครั้งที่สองขึ้นแล้ว สงครามที่จะถูกจารึกไว้ในประวัติศาสตร์ว่าเป็นการปะทะกันระหว่างปัจเจกบุคคลกับกลุ่มก้อนอำนาจ” (เอลิซาเวตา)\n\nนับตั้งแต่จอมมารปรากฏตัวขึ้น เหล่าผู้ปกครองแห่งสหราชอาณาจักรต่างก็กลัดกลุ้มใจอย่างหนัก\n\nไม่เพียงแต่แสนยานุภาพทางทหารของศัตรูจะน่าสะพรึงกลัวเท่านั้น ทว่าการมีอยู่ของปัจเจกบุคคลที่แข็งแกร่งเหนือกว่ากองทัพทั้งกองทัพกลับน่าหวาดหวั่นยิ่งกว่า\n\nการดำรงอยู่ของปัจเจกบุคคลที่สามารถรับมือกับคนหมู่มากได้ ในตัวมันเองก็คือการท้าทายต่ออำนาจการปกครองอยู่แล้ว\n\nดังนั้น หากปาร์ตี้ผู้กล้าไม่ยอมสลายตัว และไม่ยอมแยกย้ายกลับคืนสู่มาตุภูมิของตน โลกใบนี้ก็คงต้องเผชิญหน้ากับสงครามครั้งที่สองไปแล้ว\n\n“แม็กซิมิเลียนยังไม่หายไปไหน… และเวียลกรินก็กำลังตามหาตัวปลอมของอเล็กซานเดอร์อยู่” (เอลิซาเวตา)\n\n“พ่ะย่ะค่ะ ฝ่าบาท” (อีวาน)\n\n“ข้าจะเป็นคนจัดการกับ ‘ตัวปลอม’ ที่อยู่ในเมืองนี้ด้วยตัวเอง ไม่ต้องเป็นห่วงเรื่องนั้นหรอก แต่ว่านะ… ทำไม ‘ตัวจริง’ ถึงได้ไปจับมือเป็นพันธมิตรกับจอมเวทผู้ยิ่งใหญ่แห่งปาร์ตี้ผู้กล้าได้ล่ะ?” (เอลิซาเวตา)\n\nดวงตาของเอลิซาเวตาทอประกายเฉียบคม\n\n“ลองสมมติดูสิว่า เหมือนกับเหตุผลที่พวกเจ้าจำเป็นต้องถูกยุบหน่วยทิ้งในตอนนั้น ปาร์ตี้ผู้กล้าเองก็มีเหตุผลแบบเดียวกันอยู่ ถ้าลองพิจารณาดูแบบนั้น… ตัดคนอื่นออกไปก่อน หากเจ้าต้องสมมติว่ามีบุคคลหนึ่งที่จำเป็นต้องถูกกำจัดทิ้ง คนคนนั้นจะเป็นใคร?” (เอลิซาเวตา)\n\n“…แม็กซิมิเลียนพ่ะย่ะค่ะ” (อีวาน)\n\n“ใช่ ถูกต้องแล้ว ผู้ที่แข็งแกร่งที่สุดของมนุษยชาติ จักรพรรดิทองคำ แม็กซิมิเลียน ‘ผู้สังหารจอมมาร’ ชายคนนั้นนั่นแหละ” (เอลิซาเวตา)\n\nเวียลกรินวางแผนทั้งหมดนี้ขึ้นมาเพื่อค้นหาตำแหน่งของมกุฎราชกุมารตัวจริง\n\nหากเขากล่าวถึงที่ซ่อนของแม็กซิมิเลียนขึ้นมาท่ามกลางเรื่องนั้น ย่อมสมเหตุสมผลที่จะสันนิษฐานว่ามีความเชื่อมโยงที่มีนัยสำคัญบางอย่างระหว่างคนทั้งสอง\n\nบัดนี้ เหลือคำถามอยู่อีกเพียงข้อเดียวเท่านั้น\n\n‘ด้วยวิธีใด’\n\nพวกมันกล้าดีอย่างไรจึงคิดจะ ‘กำจัด’ ชายผู้แข็งแกร่งดุจขุนเขาผู้นั้น\n\nต้องใช้มาตรการแบบไหนถึงจะกำจัดเขาลงได้? มันเป็นไปได้ด้วยหรือ? กระทั่งอีวานผู้รู้จักยอดฝีมือมากมายทั่วสหราชอาณาจักร ยังไม่อาจคิดหาหนทางออกมาได้โดยง่าย\n\nหากเหล่าสมาชิกปาร์ตี้ผู้กล้ารุมโจมตีแม็กซิมิเลียน ก็อาจจะเป็นไปได้อยู่\n\nทว่าเรื่องแบบนั้นไม่ได้เกิดขึ้น และหากไม่ใช่กรณีเช่นนั้น แม็กซิมิเลียนไม่มีทางตกอยู่ในเงื้อมมือของมนุษย์ธรรมดาได้เลย\n\n“รอหน่อยนะ ข้าจะสืบหาวิธีการนั้น… และเหตุผลที่จำเป็นต้องทำเช่นนั้นมาให้ได้” (เอลิซาเวตา)\n\n“พ่ะย่ะค่ะ” (อีวาน)\n\n“นั่งลงสิ แขกยืนมานานเกินไปแล้ว ขออภัยด้วยนะ” (เอลิซาเวตา)\n\nอีวานนั่งลงบนเก้าอี้ที่จัดเตรียมไว้ นางกำนัลเดินเข้ามาใกล้และรินน้ำชาอุ่นๆ ลงในถ้วยของเขา\n\n– จอก\n\nเอลิซาเวตาดึงเก้าอี้มานั่งลงข้างกายเขา\n\n“เอาล่ะ เลื่อนเรื่องงานออกไปคุยทีหลังก่อน ตอนนี้ ใช่แล้ว เจ้าช่วยดื่มด่ำกับช่วงเวลาปัจจุบันหน่อยได้ไหม?” (เอลิซาเวตา)\n\n“….” (อีวาน)\n\n“สี่ปีเลยนะ วันก้า ข้าหวังว่าการพบกันของเราจะโรแมนติกกว่านี้สักหน่อย แต่เอาเถอะ โลกใบนี้ไม่ได้หมุนไปตามที่คาดหวังเสมอไปหรอก” (เอลิซาเวตา)\n\nทั้งสองนั่งเคียงข้างกัน ทอดสายตามองไปยังสวนดอกไม้\n\nใต้แสงจันทร์ ดอกไม้ที่ทอประกายเรืองรองเอนไหวเบาๆ ตามสายลม\n\n“เจ้าจำได้ไหม?” (เอลิซาเวตา)\n\n“จำได้พ่ะย่ะค่ะ ฝ่าบาท” (อีวาน)\n\n“กระหม่อมไม่เคยลืม” (อีวาน)\n\nสตรีร่างเล็กที่ส่วนสูงยังคงไม่ถึงระดับอกของเขายิ้มออกมาบางๆ\n\nเป็นรอยยิ้มที่ยังคงหลงเหลือร่องรอยของวันวานอันมีชีวิตชีวา ซึ่งยังคงสว่างไสวแม้จะเต็มไปด้วยบาดแผลอันลึกซึ้งและความเจ็บปวดก็ตาม\n\n“เดินมาที่ระเบียงห้องทำงานของข้าสิ แล้วเจ้าจะได้เห็นสวนแห่งนี้ทอดยาวอยู่เบื้องหน้า” (เอลิซาเวตา)\n\n“ฝ่าบาท กระหม่อมหวังว่าพระองค์จะไม่ทอดพระเนตรดูดอกไม้เหล่านี้” (อีวาน)\n\n“หือ?” (เอลิซาเวตา)\n\n“ในตอนที่พระองค์เสด็จมาหากระหม่อม พระองค์เคยตรัสอะไรบางอย่างไว้กับกระหม่อม” (อีวาน)\n\nอีวานเลือกใช้ถ้อยคำอย่างระมัดระวัง พลางหวนนึกถึงช่วงเวลาที่เขายังประจำการอยู่ในหน่วยราชองครักษ์\n\n“‘หน้าที่ของเจ้าคือการเป็นเครื่องมือแห่งสงครามของพระราชา ส่วนข้าปรารถนาจะใช้เวลาเฝ้ามองท้องฟ้ามากกว่าผืนแผ่นดิน’” (อีวาน)\n\n“….” (เอลิซาเวตา)\n\nเอลิซาเวตาลูบถ้วยชาอย่างเงียบเชียบ อีวานเงยหน้าขึ้นมองท้องฟ้า\n\nหมู่ดาวพร่างพราวกระจายอยู่ราวกับเม็ดทรายบนท้องฟ้ายามราตรี\n\nในโลกแฟนตาซียุคก่อนสมัยใหม่แห่งนี้ บางทีการที่ท้องฟ้ายามค่ำคืนงดงามจับตานี้อาจจะเป็นข้อดีเพียงไม่กี่อย่างที่มีอยู่ก็ได้\n\nอีวานเอ่ยขึ้นด้วยน้ำเสียงสงบนิ่ง\n\n“ฝ่าบาท พระองค์ตรัสว่าเมื่อทอดพระเนตรมองดอกไม้แล้วจะทรงระลึกถึงผู้ที่จากไป แต่นั่นไม่ใช่เรื่องที่ถูกต้องพ่ะย่ะค่ะ พระองค์ทรงจำหลักคำสอนของพวกเราได้หรือไม่?” (อีวาน)\n\n“จงอย่าเศร้าโศกถึงผู้ที่ล่วงหน้าไปก่อน” (เอลิซาเวตา)\n\n“พ่ะย่ะค่ะ พวกเราเองก็ยืนอยู่ในแถวเดียวกับพวกเขาเช่นกัน พวกเราทุกคนต่างก็เป็นผู้ที่จะต้องจากผืนแผ่นดินนี้ไปในสักวันหนึ่ง” (อีวาน)\n\nเอลิซาเวตาหลับตาลงเมื่อได้ยินคำพูดของอีวาน\n\nเขารินน้ำชาใส่ถ้วยของเอลิซาเวตาแล้วยื่นส่งให้เธอ\n\nถ้วยชาสีขาวค่อยๆ อบอุ่นขึ้นด้วยน้ำชาดำ มันชวนให้รู้สึกอบอุ่นสบายใจ\n\n“ฝ่าบาท โปรดทรงสืบสานปณิธานแห่งสุริยราชาต่อไปเถิดพ่ะย่ะค่ะ ทอดพระเนตรมองท้องฟ้า ไม่ใช่ผืนแผ่นดิน ยามใดที่พระองค์ทรงรำลึกถึงผู้ที่จากไป โปรดแหงนพระพักตร์มองท้องฟ้ายามราตรี” (อีวาน)\n\nเอลิซาเวตาลืมตาขึ้นตามคำพูดของเขา ท้องฟ้ายามราตรีไม่ได้มืดมิด พ้นผ่านผืนฟ้ายามรัตติกาล ระหว่างหมู่เมฆที่เคลื่อนตัวแยกออกจากกัน แสงดาวได้สาดส่องแผ่ขยายออกมาอย่างงดงาม\n\n“อย่าได้วาดภาพของผู้ที่จากไปไว้ในมวลหมู่ดอกไม้เลยพ่ะย่ะค่ะ โปรดทรงนับพวกเราเป็นดั่งดวงดาวเถิด พวกเขาเองก็คงปรารถนาเช่นนั้นจากพระองค์เหมือนกัน” (อีวาน)\n\n“วันก้า….” (เอลิซาเวตา)\n\nเอลิซาเวตาละสายตาจากท้องฟ้ายามราตรีแล้วหันมาจับจ้องมองอีวาน\n\nด้วยดวงตาที่เอ่อคลอไปด้วยน้ำตา เธอจ้องมองอีวานอยู่ครู่หนึ่ง ก่อนจะค่อยๆ ยื่นมือออกไปอย่างเงียบเชียบ\n\nมือที่เคยประคองถ้วยชาอันอบอุ่นถูกวางทาบทับลงบนแก้มของเขาอย่างแผ่วเบา หลังจากจ้องมองเขาอยู่ชั่วอึดใจ เอลิซาเวตาก็เอ่ยถามขึ้นเบาๆ\n\n“ลองเล็มหนวดเคราออกสักหน่อยดีไหม?” (เอลิซาเวตา)\n\n“…กระหม่อมขอปฏิเสธด้วยความสัตย์จริงพ่ะย่ะค่ะ” (อีวาน)\n\n“ถ้าข้าสั่งล่ะ?” (เอลิซาเวตา)\n\n“กระหม่อมลาออกจากราชการแล้วพ่ะย่ะค่ะ” (อีวาน)\n\n“ดูเหมือนตั้งแต่นั้นมา เจ้าจะยิ่งปากเก่งขึ้นเยอะเลยนะ” (เอลิซาเวตา)\n\nหลังจากเอ่ยถ้อยคำที่หากเอนริเก้มาได้ยินเข้าคงจะรีบประท้วงเสียงแข็งขึ้นมาทันที เอลิซาเวตาก็หัวเราะร่าออกมา"
    },

      "title": "บทที่ 37",
      "content": "“เดือนพฤษภาคมช่างสดใส พวกเรากำลังเติบโตขึ้นทุกวัน~~” (ยูริ)\n\n“สงสัยจัง เด็กสมัยนี้ยังรู้จักเพลงนี้กันอยู่ไหมนะ?” (ยูริ)\n\n“อีวานเป็นคนที่อายุน้อยที่สุดในบรรดาพวกเราตอนมาเกิดใหม่ ลองไปถามเขาดูสิ” (ออสวัลด์)\n\n“…?!” (ยูริ)\n\nภายในห้องชมรมอันวังเวงของเหล่าตัวตนประหลาดผู้ข้ามมิติมาสิงร่างซึ่งยังไม่มีชื่อเรียกอย่างเป็นทางการ บรรยากาศอันมืดมนแห่งความเจ็บปวดและความโศกเศร้าลอยอบอวลอยู่ท่ามกลางพวกเขา\n\nผู้ถูกสิงร่างทั้งสามคนนอนแผ่ระเกะระกะอยู่ท่ามกลางกองหนังสือ แต่ละคนมีสีหน้าว่างเปล่าไร้ชีวิตชีวา\n\n“ฉันอยู่คณะอัศวินนะ ทำไมถึงต้องมาสอบข้อเขียนด้วยเนี่ย?” (ยูริ)\n\n“ผมมีหน้าต่างสถานะก็จริง แต่ดันไม่มีฟังก์ชันจดโน้ตซะงั้น” (ยูจีน)\n\n“ผมเกลียดเวทมนตร์” (ออสวัลด์)\n\nในโลกแฟนตาซียุคก่อนสมัยใหม่แห่งนี้ เดือนพฤษภาคมไม่ใช่เดือนแห่งครอบครัว ทว่าหากมีสิ่งหนึ่งที่เหมือนกันระหว่างโลกมนุษย์กับต่างโลกแห่งนี้ นั่นก็คือการมีอยู่ของการสอบในรั้วมหาวิทยาลัย\n\n“ฉันอิจฉาคุณอีวานจังเลย ไม่มีงานที่ต้องส่ง ไม่มีการสอบ แถมยังเป็นผู้ใหญ่ที่มีเงินอีกต่างหาก” (ยูริ)\n\n“ถ้าเธอพูดแบบนั้นต่อหน้าลูกพี่ละก็ วันรุ่งขึ้นเธออาจจะถูกพบเป็นศพก็ได้นะ ยูริ” (ยูจีน)\n\n“ฉันอยากใช้เวลาร่วมกับพ่อแม่จัง” (ยูริ)\n\n“พอเธอเริ่มปล่อยมุกตลกร้ายทิ่มแทงตัวเองแบบนี้ ผมก็ไปไม่เป็นเลยแฮะ” (ยูจีน)\n\n“มันหมายถึงการได้กลับไปที่โลกเดิมต่างหากล่ะ” (ยูริ)\n\nน่าเศร้าที่สถาบันเซนต์ยันเป็นมหาวิทยาลัยชั้นนำ การสอบกลางภาคครั้งแรกของนักศึกษาปีหนึ่งจึงเปรียบเสมือนพิธีกรรมรับน้องสุดโหดที่ทลายความคาดหวังอันเรียบง่ายเรื่องการดื่มกินสังสรรค์ลงจนหมดสิ้น\n\nเมื่อต้องเผชิญหน้ากับเนื้อหาข้อสอบอันน่าหวาดหวั่นและกองการบ้านพะเนินเทินทึก เหล่าผู้ถูกสิงร่างก็ตกอยู่ในสภาพแทบสิ้นหวัง\n\nในขณะที่เหล่าผู้ถูกสิงร่างวัยมหาวิทยาลัยทุกคนต่างพากันตัวสั่นงันงกอยู่ในสังคมยุคก่อนสมัยใหม่อันโหดร้าย ณ เวลานี้ อีวานกำลัง…\n\n“อ๊ากกกก!”\n\n“ชู่ เงียบเดี๋ยวนี้” (อีวาน)\n\nเขากำลังราดโพชั่นรักษาบาดแผลลงบนแผลของนักศึกษาคนหนึ่ง\n\n“ชะ-ช่วยด้วย…! อึก!”\n\n“ฉันไม่คิดว่านั่นคือคำที่นายควรจะพูดนะ” (อีวาน)\n\n“ผม…. ขอโทษ….!!”\n\n“ชู่ เลือกคำพูดประโยคต่อไปให้ดีๆ ล่ะ” (อีวาน)\n\nเขานั่งลงข้างกายนักศึกษาที่กำลังน้ำลายฟูมปากและร้องไห้ฟูมฟายอย่างใจเย็น\n\n“พูดมา” (อีวาน)\n\n“ผมจะไม่… ผมจะไม่ทิ้งก้นบุหรี่ลงบนพื้นอีกแล้วครับ…!”\n\n“แล้วก็?” (อีวาน)\n\n“ผมจะไม่ทำลายต้นไม้อีกแล้วครับ…!”\n\n“ดีมาก” (อีวาน)\n\nต่อหน้าคนสวน การทิ้งก้นบุหรี่ไว้ใต้ต้นไม้ถือเป็นอาชญากรรมร้ายแรงเทียบเท่าโทษประหารชีวิตในกฎหมายระหว่างประเทศ\n\nเมื่อคำนึงถึงความเยาว์วัยของนักศึกษา อีวานจึงกำลังเปิดคลินิกเลิกบุหรี่ฟรีให้กับนักศึกษาทั้งสิบสองคน\n\n“นี่! คุณลุง!” (อิซาเบลล์)\n\nนี่คือเหตุการณ์หลังจากที่อีวานจัดการทำลายผู้ทำลายสิ่งแวดล้อมทั้งสิบสองคนลงได้\n\nท่ามกลางความสงบสุขของวิทยาเขตที่กลับคืนมา อีวานปิดฝาขวดโพชั่นรักษาบาดแผล\n\nเมื่อหันศีรษะไปตามทิศทางของเสียง เขาก็เห็นอิซาเบลล์กำลังวิ่งตรงเข้ามาหาพร้อมโบกมือให้\n\n“อืม” (อีวาน)\n\n“คำทักทายปกติเขาต้องพูดว่า ‘สวัสดี’ ‘อรุณสวัสดิ์’ ‘ทานข้าวหรือยัง?’ ‘ช่วงนี้เป็นยังไงบ้าง?’ อะไรทำนองนี้ไม่ใช่เหรอคะ!”\n\nอิซาเบลล์เดินเข้ามาอย่างกระฉับกระเฉงพร้อมรอยยิ้ม แล้วกวาดสายตามองไปรอบๆ หลังจากสำรวจพุ่มไม้ที่มีคราบเลือดและโพชั่นรักษาบาดแผลปะปนกันอยู่ เธอก็ทำหน้าเหยเก\n\n“โอ้… พวกปีศาจบุกมาเหรอคะ?” (อิซาเบลล์)\n\n“ทำนองนั้นแหละ” (อีวาน)\n\n“ขอบคุณสำหรับความเหน็ดเหนื่อยนะคะ! เมื่อกี้มีคนกรีดร้องระหว่างช่วงสอบ หนูเลยนึกว่าคุณลุงไปฆ่าใครเข้าอีกแล้ว เลยรีบแวะมาดูน่ะค่ะ!”\n\n“ดูเหมือนเธอจะใส่ใจภาพลักษณ์ของฉันมากเลยนะ” (อีวาน)\n\n“อะฮ่าๆ” อิซาเบลล์หัวเราะแล้วเบือนหน้าหนีไปเล็กน้อย นั่นเป็นคำตอบที่เพียงพอแล้ว\n\n“อ้อ จะว่าไปแล้ว คุณลุงพอจะช่วยหนูสักหน่อยได้ไหมคะ? หนูต้องการความช่วยเหลือจากคุณลุง…” (อิซาเบลล์)\n\n“ช่วย?” (อีวาน)\n\n“คือว่า มันมีการประเมินผลภาคปฏิบัติน่ะค่ะ แล้วมันยากเกินไป ไม่สิ หนูสงสัยด้วยซ้ำว่าข้อสอบภาคปฏิบัติของกลางภาคเทอมแรกมันจำเป็นต้องโหดขนาดนี้เลยเหรอ” (อิซาเบลล์)\n\n“อืม” (อีวาน)\n\nอีวานครุ่นคิดดูว่าเขาจะช่วยอะไรสำหรับการสอบกลางภาคของคณะอัศวินได้บ้าง\n\nเขาคงไม่ได้ต้องไปสอนเรื่องอย่างการสอบปากคำหรือการปกปิดข้อมูลที่คล้ายกับงานก่อวินาศกรรมหรอกมั้ง\n\nอ้อ หรือว่าจะเป็นยุทธวิธี? ยังโชคดีที่ด้วยประสบการณ์ในฐานะผู้บัญชาการภาคสนาม เขารู้สึกว่าพอจะให้คำแนะนำในด้านนั้นได้บ้าง\n\nขณะที่อีวานกำลังจมอยู่ในความคิด อิซาเบลล์ก็เอ่ยขึ้นด้วยรอยยิ้ม\n\n“มันคือยุทธวิธีรับมือการซุ่มโจมตีค่ะ!” (อิซาเบลล์)\n\n“…อืม” (อีวาน)\n\nสอนเรื่องพรรค์นั้นให้กับนักศึกษาปีหนึ่งเนี่ยนะ… ช่างเป็นวิชาที่พิลึกกึกกือไม่เบา\n\nอีวานทบทวนถึงความมีประโยชน์ของมหาวิทยาลัยแห่งนี้อีกครั้ง มันจำเป็นจริงๆ เหรอเนี่ย?\n\nแต่ช่างเถอะ ยังไงเรื่องนี้ก็อยู่ในขอบเขตความสามารถที่เขาพอช่วยได้ ทั้งการซุ่มโจมตีและการรับมือการซุ่มโจมตีล้วนอยู่ในความเชี่ยวชาญทางทหารของเขาทั้งสิ้น\n\n“วิชาของเอนริเก้สินะ?” (อีวาน)\n\n“ใช่ค่ะ ให้ตายสิ หนูสงสัยจริงๆ ว่าการสอนแบบนี้มันจะเอาไปใช้ประโยชน์จริงในชีวิตประจำวันได้ยังไง”\n\n“ฉันเองก็เคยสงสัยเรื่องนั้นเหมือนกัน”\n\nอีวานพยักหน้าแล้วเดินนำหน้าไป\n\n***\n\nเฟรเชนกายาเป็นมหานครที่พัฒนาอย่างสูง แม้จะเทียบกับทั้งสหราชอาณาจักรก็ตาม และมหานครในยุคก่อนสมัยใหม่ที่ยังไม่พัฒนาเต็มที่แห่งนี้ก็ครอบคลุมพื้นที่ปริมณฑลอันกว้างใหญ่ไพศาลทั้งหมด\n\nกล่าวอีกนัยหนึ่ง ทรัพยากรพื้นฐานบางอย่าง เช่น พื้นที่เกษตรกรรม ที่ราบ ป่าไม้ และแม่น้ำ ย่อมต้องมีอยู่อย่างเพียงพอในบริเวณใกล้เคียง เฟรเชนกายาก็ไม่ใช่ข้อยกเว้น\n\nผืนป่าแห่งหนึ่งแผ่ขยายออกไปทางทิศตะวันออกของเฟรเชนกายา เลยแนวกำแพงเมืองชั้นนอกออกไป อีวานเดินทางมาถึงปากทางเข้าป่าพร้อมกับอิซาเบลล์และยืดเส้นยืดสายสั้นๆ\n\n“พอมาที่นี่ทีไร หนู็นึกถึงตอนนั้นทุกทีเลยค่ะ โอ๊ย วันนั้นหนูนึกว่าตัวเองจะตายจริงๆ ซะแล้ว” (อิซาเบลล์)\n\n“อืม” (อีวาน)\n\nสามเหลี่ยมแห่งมโนธรรมในใจของอีวานรู้สึกคันยุบยิบขึ้นมาตรงไหนสักแห่ง ในความเป็นจริง อีวานเคยทำการทดลองโดยใช้อิซาเบลล์เป็นหนูทดลองมาแล้ว\n\nมันเป็นการทดลองประเภทที่ว่า “ลองดูซิว่าตัวเอกจะตายในด่านฝึกสอนหรือเปล่า…”\n\nแม้มันจะเป็นภารกิจที่จำเป็น แต่อีวานซึ่งเป็นคนซื่อตรงก็อดรู้สึกผิดในใจขึ้นมาเล็กน้อยไม่ได้\n\n“คุณลุงคะ ตอนนี้คุณลุงทำหน้าตาน่าเกลียดมากเลยนะคะ”\n\n“ปกติฉันก็ทำหน้ายิ้มแย้มอยู่ตลอดนะ” (อีวาน)\n\n“หนูอยากจะชกคุณลุงจริงๆ เลยค่ะ” (อิซาเบลล์)\n\nอิซาเบลล์บ่นอุบอิบพลางหรี่ตาลง\n\n“อืม แต่สนามสอบเองก็ยังไม่เปิดเผยออกมาเลยนี่คะ ทำไมคุณลุงถึงคิดว่าต้องมาฝึกอะไรกันที่นี่… เหตุผลที่มาที่นี่คืออะไรเหรอคะ?” (อิซาเบลล์)\n\n“เพราะเอนริเก้ขาดจินตนาการ” (อีวาน)\n\n“…อะไรนะคะ?” (อิซาเบลล์)\n\n“ถ้าเอนริเก้จะจัดการฝึกซุ่มโจมตี ถ้าไม่ใช่ที่ทางระบายน้ำใต้ดินของเฟรเชนกายา ก็ต้องเป็นป่าแห่งนี้แหละ ถ้าหล่อนต้องเลือกสถานที่ที่ยากลำบากกว่า ยังไงก็ต้องเป็นที่นี่” (อีวาน)\n\nเอนริเก้เป็นคนบ้าที่ทั้งซื่อบื้อและบ้าอำนาจ อีวานพยักหน้าพลางนึกถึงเอนริเก้ในวันวาน\n\nเช่นเดียวกับคนแก่จำนวนมากที่มีชีวิตอยู่มานาน เอนริเก้คือคนที่ไม่สามารถหลุดพ้นจากอคติและความเคยชินของตัวเองได้\n\nดังนั้น อีวานจึงมั่นใจ หากหล่อนจงใจจัดสอบ ‘การรับมือการซุ่มโจมตี’ ขึ้นมา เมื่อพิจารณาจากนิสัยของหล่อนแล้ว โอกาสที่จะจัดขึ้นทั่วทั้งผืนป่าแห่งนี้ย่อมมีสูงลิ่ว\n\n“การทำความเข้าใจเจตนาของผู้คุมสอบเป็นทักษะพื้นฐานของผู้เข้าสอบไม่ใช่หรือไง?” (อีวาน)\n\n“ว้าว คุณลุงเรียนเก่งเหรอคะเนี่ย?” (อิซาเบลล์)\n\n“ก็ไม่ได้แย่เท่าไหร่หรอก”\n\nในโลกแฟนตาซีใบนี้ นักเรียนไม่อาจจินตนาการถึงเรื่องพรรค์นี้ได้ แต่เด็กนักเรียนในเกาหลีใต้ต้องรับการศึกษาภาคบังคับนานถึง 12 ปีตั้งแต่อายุ 7 ขวบเชียวนะ\n\n“หนูเองก็สอบข้อเขียนเก่งนะคะ มั่นใจว่าจะได้เกรด A เกือบหมดในวิชาภาคปฏิบัติด้วย แต่แปลกตรงที่วิชาของศาสตราจารย์เอนริเก้มันยากชะมัด แม้แต่ในการประเมินภาคปฏิบัติปกติ คุณลุงก็น่าจะเห็นว่าอาจารย์แกไร้ความปรานีขนาดไหน” (อิซาเบลล์)\n\n“เอนริเก้ก็เป็นแบบนั้นมาตลอดนั่นแหละ” (อีวาน)\n\n“โห คุณลุงคะ หรือว่าคุณลุงก็จบจากสถาบันเซนต์ยันเหมือนกัน? เป็นรุ่นพี่เหรอคะ?” (อิซาเบลล์)\n\n“เปล่า ฉันไม่ได้เรียนมหาวิทยาลัย” (อีวาน)\n\nคิมซอนอูเองก็ไม่ได้เรียนจบรับปริญญามหาวิทยาลัยเช่นกัน หลังจากปลดประจำการ เขาก็หลุดเข้ามาในต่างโลกตอนเรียนอยู่ปีสาม และรับราชการทหารต่อเนื่องมานานกว่า 20 ปี\n\nในวินาทีนั้น คิมซอนอูที่อยู่ข้างในกรีดร้องออกมาด้วยความคับแค้นใจ อีวานเดินหน้าต่อไปอย่างเงียบเชียบ\n\n“ยังไงก็ตาม! ค่ะ อืม… ก็ ถ้าคุณลุงเคยเรียนอะไรบางอย่างมาจากศาสตราจารย์เอนริเก้ ก็ถือเป็นรุ่นพี่เหมือนกันใช่ไหมล่ะคะ? ใช่ไหม? อืม ค่ะ” (อิซาเบลล์)\n\n“ไม่ต้องมาปลอบใจฉันหรอก” (อีวาน)\n\nกล้าดียังไงนะ เจ้ายัยคนพื้นเมืองยุคก่อนสมัยใหม่นี่\n\n“ค่ะ… สุภาพบุรุษนอกระบบการศึกษาที่เรียนเก่ง เอาล่ะ แล้วคุณลุงเตรียมตัวสอบของศาสตราจารย์เอนริเก้ไว้ยังไงบ้างคะ?” (อิซาเบลล์)\n\n“เตรียมตัว?”\n\nอีวานหัวเราะเบาๆ แล้วล้วงมือเข้าไปในกระเป๋า เขาหยิบลูกเหล็กขนาดเล็กออกมาลูกหนึ่ง\n\nเขาควักมันออกมาแล้วกลิ้งไปบนพื้นดิน\n\n“ฉันเริ่มไปแล้วล่ะ”\n\n“เอ๊ะ? อะไรกัน—”\n\n– ตูม!\n\nลูกเหล็กเกิดระเบิดขึ้น ปลดปล่อยกลุ่มควันหนาทึบออกมา\n\nอิซาเบลล์รีบก้าวถอยหลังไปอย่างรวดเร็วพลางไอโขลก ระเบิดควัน…? ไม่สิ นี่มัน…!\n\n“ไอ้คนบ้า! คุณลุงปาระเบิดแก๊สพิษใส่นักศึกษาเนี่ยนะ!” (อิซาเบลล์)\n\nอีวานเคลื่อนไหวร่างกายท่ามกลางกลุ่มควันโดยไม่เอ่ยตอบ ตุบ ตุบ เขาย่ำเท้าสองสามครั้ง ก่อนจะทะยานตัวขึ้นไปบนต้นไม้และหายลับเข้าไปในเงามืดของผืนป่า\n\nจากเบื้องหลังเงามืด เขากระซิบออกมาเบาๆ\n\n“ปรับระดับของเธอซะ” (อีวาน)\n\n“ถ้าพลาดถูกจับได้จริงๆ เธอตายแน่ ฉันจะเก็บเธอให้เรียบ” (อีวาน)\n\n“…ฉันจะฝึกเธอให้เหมือนกับของจริงเลย” (อีวาน)\n\nการฝึกภาคสนามของเจ้าหน้าที่หน่วยเก็บกวาด เริ่มต้นขึ้น ณ บัดนี้!\n\nอีวานวิ่งลัดเลาะไปทั่วผืนป่า พลางยิงปืนเข้าใส่อิซาเบลล์เป็นระยะเพื่อรักษาระยะห่าง\n\nไม่จำเป็นต้องทุ่มสุดกำลัง เนื่องจากประสาทสัมผัสตรวจจับภัยคุกคามของอิซาเบลล์พัฒนาขึ้นจนเกือบสมบูรณ์แล้ว การยิงขู่เพียงนัดเดียวก็มากพอจะทำให้เธอชะงักได้\n\nดังนั้น เขาจึงใช้กระสุนจริง การคุกคามชีวิตของเธอโดยตรงคือวิธีที่ได้ผลดีที่สุดในการพัฒนาประสาทสัมผัสตรวจจับภัยคุกคามให้สมบูรณ์แบบ\n\n“บ้าไปแล้ว! คุณลุงเสียสติไปแล้วจริงๆ เหรอคะ!? ยิง เฮ้ย ยิงปืนจริงเลยนะนั่น!” (อิซาเบลล์)\n\n– ปัง!\n\nทุกครั้งที่เธอตะโกน เขาก็เล็งไปที่กลางหน้าผากของเธอ ลั่นไกยิง แล้วถอยฉากออกไป\n\nเธอคงจะได้รับบทเรียนจากเรื่องนี้บ้างแล้ว เมื่อตกเป็นเป้าหมายของการซุ่มโจมตี เธอจำเป็นต้องเคลื่อนไหวให้แนบเนียนและรอบคอบยิ่งกว่าฝ่ายตรงข้าม\n\nการซุ่มโจมตีโดยพื้นฐานแล้วก็เหมือนกับการล่าสัตว์ ทั้งผู้ล่าและเหยื่อต่างก็ต้องกลมกลืนไปกับสภาพแวดล้อมรอบข้างเพื่อหลีกเลี่ยงสายตาของอีกฝ่าย\n\nดังนั้น อิซาเบลล์ที่แต่งตัวหรูหราฟู่ฟ่าเกินความจำเป็น จึงสมควรได้รับเกรด F ไปตั้งแต่เริ่มการสอบแล้ว\n\nอีวานป้ายโคลนลงใต้ดวงตาเพื่อป้องกันแสงสะท้อนแล้วพยักหน้า\n\nแกร๊ก ปัง\n\nเขาลั่นไกยิงจากด้านหลังเครื่องกีดขวางเพื่อเบี่ยงเบนสายตาของอิซาเบลล์ก่อนจะย้ายตำแหน่ง\n\n“จะว่าไปแล้ว การฝึกภาคสนามนอกสถานที่”\n\nอีวานกวาดสายตามองไปรอบตัวอย่างเฉียบคม ดังที่เขาเคยไตร่ตรองไว้ก่อนหน้านี้ ป่าแห่งนี้อยู่ใกล้กับค่ายทหารของกองกำลังป้องกันนครหลวงเฟรเชนกายา\n\nกล่าวอีกนัยหนึ่ง นั่นหมายความว่ามันเป็นพื้นที่ที่มีความปลอดภัยสูงมากและได้รับการจัดระดับความมั่นคงไว้ในเกณฑ์สูง ดังนั้นเอนริเก้จึงน่าจะสามารถใช้เป็นสนามสอบได้โดยไม่ต้องกังวลนัก\n\nทว่า อีวานรู้ดี\n\n“ในการฝึกภาคสนามนอกสถานที่ การปะทะกับศัตรูที่แท้จริงถือเป็น ‘สามัญสำนึก’….”\n\nในฐานะที่เป็นคนมีสามัญสำนึกเป็นอย่างยิ่ง อีวานจึงตัดสินใจสังเกตการณ์ทั้งการฝึกของอิซาเบลล์และร่องรอยการซุ่มโจมตีจากศัตรูตัวจริงไปพร้อมๆ กัน\n\n***\n\nอิซาเบลล์กำชายกระโปรงที่ขาดวิ่นของตนเองแน่น ตัวสั่นเทาด้วยความโกรธ\n\n“ให้ตายสิ นี่มันเรื่องบ้าอะไรกันวะเนี่ย…!!” (อิซาเบลล์)\n\nเอาจริงดิ! ตามสามัญสำนึกทั่วไป เวลาที่เด็กสาววัยสิบกว่าปีขอให้ช่วยมาฝึกซ้อมในป่าสักหน่อย ความคาดหวังแรกของเธอก็น่าจะเป็นการปิกนิกไม่ใช่หรือไง?\n\nเดต… คงไม่ใช่หรอก ไม่ได้เกิดจากความรักใคร่หรือแอบชอบอะไรทั้งนั้น แต่แค่อยากแสดงความขอบคุณที่ช่วยชีวิตไว้ ก็แค่อยากจะสื่อถึงความซาบซึ้งใจเท่านั้นเอง\n\nขณะที่ตะกร้าปิกนิกถูกแรงระเบิดแก๊สควันและฝุ่นดินซัดกระเด็นไป อิซาเบลล์ที่จ้องมองอย่างเหม่อลอยก็สังเกตเห็นแซนด์วิชที่เละเทะผ่านฝาตะกร้าที่เปิดอ้าออก จนตัวสั่นเทิ้ม\n\n“คุณลุง” (อิซาเบลล์)\n\nเธอรวบผมที่ยุ่งเหยิงขึ้นมัดไว้แล้วแสยะยิ้ม\n\n“หนูอยากจะฆ่าคุณลุงจริงๆ แล้วค่ะ” (อิซาเบลล์)\n\nเพื่อสั่งสอนเจ้าสายลับสติเฟื่องที่ไร้สามัญสำนึกให้รู้จักคำว่า ‘สามัญสำนึก’ เสียบ้าง\n\nผู้กล้า จงตื่นขึ้น"
    },

      "title": "บทที่ 38",
      "content": "หลักสูตรการฝึกฝนรับมือการซุ่มโจมตีของหน่วยรบพิเศษนั้นครอบคลุมบทเรียนอันหลากหลาย ทั้งปฏิกิริยาตอบสนองต่อเสียงปืนและกลยุทธ์ที่เหมาะสมที่สุดหลังจากตรวจจับแนววิถีกระสุนได้สำเร็จ การฝึกนี้ยังรวมถึงการวิเคราะห์ภูมิประเทศ จำนวนข้าศึก และอาวุธยุทโธปกรณ์ผ่านการฝึกภาคสนามหลากหลายรูปแบบ\n\nทว่า การเตรียมการของอีวานสำหรับอิซาเบลล์กลับสรุปเหลือเพียงสิ่งเดียว นั่นคือแนวทางที่ตรงไปตรงมาและเป็นพื้นฐานที่สุด — “โจมตีจนกว่าจะสวนกลับได้” ดังนั้น อีวานจึงนั่งซุ่มเงียบอยู่บนต้นไม้พลางยกปืนขึ้นเล็ง พ้นจุดเล็งออกไป ร่างอันองอาจของอิซาเบลล์ปรากฏขึ้นโดยไม่มีเจตนาจะพรางตัวเลยแม้แต่น้อย\n\n– กริ๊ก\n\nเขาจัดแนวศูนย์เล็งให้ตรง แล้วเสี้ยววินาทีก่อนจะเหนี่ยวไก ก็จงใจเบี่ยงจุดเล็งให้คลาดเคลื่อนออกไป\n\n– ปัง!\n\nปัญหาของการพึ่งพาการตรวจจับแนววิถีกระสุนอยู่ที่ความจำเป็นในการสร้างความเชื่อมั่นในประสาทสัมผัสของตนเองอย่างสมบูรณ์แบบ\n\nการตรวจจับแนววิถีกระสุนเป็นทักษะทางประสาทสัมผัสที่คล้ายคลึงกับสัญชาตญาณ และหากไม่พึ่งพาเพียงสายตากับการได้ยิน ก็ไม่อาจตอบสนองได้อย่างเหมาะสม\n\n“อ๊ะ!” (อิซาเบลล์)\n\n“…พลาดเป้าไปไกลแท้ๆ” อีวานถอนหายใจขณะเฝ้ามองอิซาเบลล์รีบก้มศีรษะหลบอย่างลนลานพลางกรีดร้องอยู่ในระยะไกล\n\nทั้งที่กระสุนนัดนั้นพลาดเป้าไปอย่างชัดเจน แต่อิซาเบลล์กลับพยายามหลบ ทำให้เสียสมดุลจนเปิดช่องโหว่ขนาดใหญ่\n\n– กริ๊ก ปัง—!!\n\nเมื่อสบโอกาส เขาก็ลั่นไกอีกครั้ง คราวนี้เล็งตรงไปที่กลางหน้าผากของเธอ\n\nอิซาเบลล์ที่หลบคมกระสุนได้สำเร็จจ้องมองรูกระสุนบนลำต้นไม้พลางตัวสั่นระริก\n\n“กระสุน! ยิงใส่หัวหนูเลยเนี่ยนะ! เอาจริงดิคะ?!” (อิซาเบลล์)\n\nไม่นานนัก เธอก็เบิกตากว้าง ดวงตาที่ลุกโชนด้วยเพลิงโทสะจ้องเขม็งตรงมายังจุดที่อีวานซ่อนตัวอยู่อย่างแม่นยำ\n\n“เก่งขึ้นแล้วนี่” (อีวาน)\n\nอีวานพยักหน้าพลางรู้สึกภาคภูมิใจในแบบฉบับครูฝึกมาตรฐาน\n\nเขาผละออกจากจุดซ่อนตัวไปอย่างรวดเร็ว\n\n“ฮ่าๆ อะฮ่าๆ หนูจะฆ่าคุณลุงจริงๆ แล้วนะ” (อิซาเบลล์)\n\nอิซาเบลล์กุมด้ามดาบแน่นพลางก้าวเดินอย่างโอนเอน\n\nยิงกระสุนเล็งใส่หน้าผากงั้นเหรอ…?\n\n“ฉันต้องบ้าไปแล้วแน่ๆ ฉันมันโง่เอง ฉันทำพังหมดแล้ว เออ มันเป็นความผิดของฉันเอง ช่างมันเถอะ”\n\nเป็นเพราะความกระตือรือร้นที่จะได้ฝึกฝนในป่าซึ่งเคยเกิด ‘เหตุการณ์นั้น’ ขึ้นงั้นหรือ?\n\nหรือเป็นเพราะแม้เธอจะเอ่ยปากขอความช่วยเหลืออย่างกะทันหัน เขากลับยอมวางทุกอย่างลงแล้วตกลงมาช่วยอย่างเต็มใจ?\n\nใช่ มันเป็นความผิดของฉันเองทั้งหมดนั่นแหละ ช่างหัวมันเถอะ\n\nภาพในจินตนาการที่เธอตวัดดาบไปมาเบาๆ สองสามครั้ง หัวเราะอย่างสนุกสนาน และได้รับคำแนะนำติชมบ้าง…\n\nการได้พูดคุยถึงเรื่องราวที่เกิดขึ้นในวันนั้นราวกับว่ามันเป็นเพียงความทรงจำไปแล้ว\n\nในเวลาเช่นนั้น การเตรียมแซนด์วิชมาแบ่งกันกิน การสวมใส่เสื้อผ้าตัวโปรด หรือกระทั่งลองแต่งหน้าที่นานๆ ทีจะทำสักครั้งโดยไม่มีเหตุผล\n\nใช่แล้ว\n\nฉันมันคนโง่เง่าเต็มขั้นเลยจริงๆ\n\n– กริ๊ก\n\nกุมด้ามดาบไว้แน่น ก้าวเท้าไปข้างหน้าอีกหนึ่งก้าว\n\n– ครืดดด\n\nชักดาบออกจากฝักพร้อมยกขึ้นสูง ใบดาบส่องประกายคมกริบอย่างเงียบเชียบ ทว่าจับไว้ด้วยฝ่ามืออันมั่นคง\n\nฟิ้ววว—!\n\n– เคร้ง!\n\nตัดผ่านวิถีกระสุนได้อย่างแม่นยำ ปัดป้องลูกกระสุนให้กระเด็นออกไป\n\n“จริงๆ… จริงๆ เลย… คุณลุงตายแน่! คุณลุง!!” (อิซาเบลล์)\n\nเพลิงพิโรธอันเที่ยงธรรมของผู้กล้าลุกโชนขึ้น เธอปัดป้องกระสุนทุกนัดที่พุ่งเข้ามาและพุ่งทะยานตรงเข้าหาต้นทางทันที\n\nที่ที่กระสุนพุ่งออกมา ย่อมต้องมีมือปืนอยู่ตรงนั้น\n\nแค่ไม่โดนกระสุนยิงเข้าก็พอแล้ว\n\nขออีกแค่ครั้งเดียว ฉันทำได้แน่\n\n***\n\nหล่อนคงจะกำลังคิดแบบนั้นอยู่สินะ\n\nอีวานถอยฉากออกไปอย่างเงียบเชียบ ขณะจ้องมองตรงไปยังอิซาเบลล์ที่กำลังพุ่งทะยานเข้ามา\n\nการจะหาตัวสายลับที่พรางตัวไว้อย่างสมบูรณ์แบบท่ามกลางเงามืดของผืนป่าเป็นเรื่องที่เป็นไปไม่ได้มานานแล้ว ต่อให้มีการตรวจจับแนววิถีกระสุน ก็ไม่ได้เปลี่ยนแปลงอะไรเลย\n\nในเมื่อมีมือซุ่มยิงอยู่ที่ปลายทางของวิถีกระสุน มือซุ่มยิงคนนั้นย่อมต้องตระหนักถึงข้อเท็จจริงข้อนั้นเป็นอย่างดีเช่นกัน\n\n“บทเรียนที่สอง มาแล้ว” (อีวาน)\n\nในฐานะครูฝึกผู้ยอดเยี่ยม อีวานเตรียมพร้อมที่จะมอบบทเรียนอันแสนเอาใจใส่ให้\n\nการตวัดดาบอย่างบ้าระห่ำด้วยความโกรธแล้วพุ่งทะยานไปข้างหน้า แม้แรงส่งจะน่าเกรงขามก็จริง ทว่าหาใช่ทางเลือกที่ดีเลยแม้แต่น้อย\n\nโดยเฉพาะอย่างยิ่งในสถานการณ์ ‘ซุ่มโจมตี’ เขาตัดสินใจที่จะสั่งสอนให้รู้ว่านั่นคือทางเลือกที่เลวร้ายที่สุด\n\n– ตูม!\n\nอีวานหัวเราะในลำคอขณะเฝ้ามองอิซาเบลล์เหยียบเข้ากับกับดักและถูกแรงระเบิดพัวพันเข้าไปท่ามกลางเงามืดของผืนป่า\n\n***\n\n“เยี่ยม” (อิซาเบลล์)\n\nอิซาเบลล์ซึ่งหลบแรงระเบิดออกมาได้แบบเฉียดฉิว ปัดเศษดินที่ร่วงลงมาใส่ศีรษะออกแล้วหัวเราะ\n\n“หนูจะต้องฆ่าคุณลุงให้ได้แน่ๆ” (อิซาเบลล์)\n\nขออีกแค่ครั้งเดียว ฉันทำได้แน่? ความคิดตื้นเขินพรรค์นั้นมีแต่จะก่อให้เกิดสถานการณ์แบบนี้ขึ้นเท่านั้น การจะรับมือกับคนซื่อบื้ออย่างหล่อนจำเป็นต้องเขย่าหัวเรียกสติให้แรงๆ เสียหน่อย\n\nอิซาเบลล์ปัดป้องกระสุนที่พุ่งเข้ามาโดยไม่ต้องหันไปมองด้วยซ้ำ\n\n“ตอนนี้เข้าใจแล้วหรือยังว่าทำไมป่าถึงรับมือยากกว่า?” (อีวาน)\n\nน้ำเสียงอันสงบนิ่งเป็นอย่างยิ่งดังลอยมาเข้าหูของเธอ\n\nกร๊อบ มือที่กุมด้ามดาบอยู่บีบแน่นขึ้น\n\n“อุโมงค์ใต้ดินหรือบังเกอร์มีโครงสร้างเขาวงกตแบบเส้นตรง สิ่งปลูกสร้างที่มนุษย์สร้างขึ้นย่อมมีรูปแบบเฉพาะตัวของมัน นั่นหมายความว่าจุดสำหรับวางกับดักหรือเปิดฉากซุ่มโจมตีถูกกำหนดไว้ตายตัวแล้ว” (อีวาน)\n\nคำสอนยังคงดำเนินต่อไป แน่นอนว่าสำหรับเธอ นี่คือคำแนะนำอันล้ำค่ายิ่ง\n\n“แต่ป่ามีลักษณะหลากหลายซ้อนทับกันอยู่ในเวลาเดียวกัน ทั้งการพรางตัวและที่กำบังทำได้ง่าย และแทบจะเป็นไปไม่ได้เลยที่จะสังเกตเห็นกับดักล่วงหน้า เนื่องจากมันมีโครงสร้างเขาวงกตที่ซับซ้อน การชักนำเส้นทางการเคลื่อนที่ของเป้าหมายจึงทำได้ง่ายมากเช่นกัน” (อีวาน)\n\nการสั่งสอนยังคงดำเนินต่อไป การใช้คนจำนวนน้อยโอบล้อมคนจำนวนมากก็เป็นเช่นนี้แหละ\n\nตรงกันข้ามกับความเข้าใจผิดของคนส่วนใหญ่ การโอบล้อมคือการจำกัดข้อมูลข่าวสารในระดับยุทธวิธี ในความเป็นจริง ไม่จำเป็นต้องวางกำลังปิดล้อมอย่างหนาแน่นหรือบุกโจมตีอย่างรุนแรงเลย\n\nเพียงแค่การปะทะในจังหวะที่เหมาะสมไม่กี่ครั้งก็เพียงพอแล้ว การบีบให้อีกฝ่ายตัดสินใจผิดพลาดในขณะที่ตัวเองกุมความได้เปรียบด้านข้อมูลข่าวสารไว้ได้ นั่นคือแก่นแท้ของการโอบล้อม\n\n– หลังแนวป่านั้น มีศัตรูจำนวนมากซ่อนตัวอยู่\n\n– หากเข้าใกล้ป่านั้น เจ้าจะตกอยู่ในวงล้อมโจมตี\n\n– เบื้องหลังป่านั้น ไม่มีพันธมิตรเหลืออยู่เลย\n\nเมื่อความตัดสินใจผิดพลาดเหล่านั้นสั่งสมมากขึ้น การโอบล้อมด้วยกำลังพลส่วนน้อยก็จะเสร็จสมบูรณ์ บั่นทอนการสั่งการของผู้บัญชาการภาคสนามจนพังพินาศ\n\nอีวานเอ่ยอธิบายต่อไปอย่างเงียบๆ ทว่าจู่ๆ ก็หยุดชะงักลง\n\nอิซาเบลล์ที่ก้มหน้าอยู่กำลังตัวสั่นเทา\n\n“คุณลุงคะ” (อิซาเบลล์)\n\n“หือ?” (อีวาน)\n\n“ฟู่… ขอบคุณนะคะ เพราะคุณลุงแท้ๆ หัวหนูเลยโล่งขึ้นมาเลย” (อิซาเบลล์)\n\n“หา?” (อีวาน)\n\nอิซาเบลล์มองไปยังจุดที่เขาอาจจะอยู่ด้วยรอยยิ้มอันมีชีวิตชีวาบนใบหน้า\n\nเมื่อพิจารณาจากทิศทางของเสียงและทิศทางที่ตรวจจับแนววิถีกระสุนได้ ยังไงก็ต้องเป็นทางนี้แน่\n\nเธอพยักหน้า พลางยกด้ามดาบขึ้น\n\n– จงชูดาบขึ้น\n\n– เพื่อปณิธานของเจ้า มิใช่เพื่อพละกำลัง จงชูดาบขึ้น\n\n– จงมองคนเช่นพวกเราด้วยสายตาของผู้อ่อนแอ\n\n“ค่ะ หนูจะทำตามนั้นค่ะ” (อิซาเบลล์)\n\nอิซาเบลล์จับดาบราวกับต้องมนตร์สะกด พลางตั้งท่าเตรียมพร้อม พลังเวทสีฟ้าหมุนวนรอบกายของเธอ ส่องประกายระยิบระยับขับไล่ความมืดมิดในผืนป่าให้สว่างไสว\n\nสายลมอันสดชื่นพัดโชยผ่านผืนป่าในปลายฤดูใบไม้ผลิ\n\n“อืม”\n\nอีวานจ้องมองเธอด้วยดวงตาที่ทอประกาย โครงสร้างของพลังเวท วิธีการไหลเวียน — แม้จะแตกต่างกัน แต่กลับชวนให้นึกถึงแม็กซิมิเลียนอย่างน่าประหลาด\n\nบางทีเขาอาจจะมีพรสวรรค์ในการสั่งสอนคนมากกว่าที่ตัวเองคิดไว้ก็ได้ (ความเป็นครูวัดกันที่ความสำเร็จของลูกศิษย์นี่นะ)\n\nอีวานพยักหน้าอย่างเต็มใจแล้วลดปืนลง ประสาทสัมผัสของอิซาเบลล์เบ่งบานเต็มที่แล้ว ในระดับนี้ การยิงซ้อนสองนัดเพื่อหลอกล่อการตรวจจับแนววิถีกระสุนใช้ไม่ได้ผลอีกต่อไป\n\nด้วยการเร่งระบบประสาทด้วยพลังเวท ขัดเกลาความเร็วในการตอบสนองของร่างกายทั้งหมดจนถึงขีดสุด — ความสำเร็จที่รู้จักกันในนาม ‘สนามรบของผู้เหนือมนุษย์’ พวกเขาก้าวมาถึงจุดที่สามารถเหยียบย่างบนเส้นแบ่งเขตนั้นได้แล้ว\n\nสำหรับผู้ที่ก้าวถึงระดับนี้ อาวุธประเภทกระสุนหรือวัตถุขว้างปาไม่อาจใช้ได้ผลอีกต่อไป นั่นเป็นเพราะการตรวจจับแนววิถีกระสุนได้พัฒนาขึ้นจนเกือบจะเทียบเท่ากับการหยั่งรู้อนาคตแล้ว\n\nดังนั้น\n\n– ครืดดด…\n\nเขาจึงยกขวานขึ้น\n\n***\n\n“ได้โปรด… อย่าทิ้ง..ฉันไว้…”\n\nขบวนรถไฟมุ่งหน้ากลับสู่เฟรเชนกายา อีวานยิ้มบางๆ ขณะก้มลงมองอิซาเบลล์ที่หลับสนิท\n\nแม้จะมอมแมมไปด้วยฝุ่นดินและบาดแผลเล็กน้อย พร้อมเสื้อผ้าที่ขาดวิ่น แต่เธอกลับดูสูงส่งสง่างามยิ่งนัก นั่งอยู่ริมหน้าต่างใต้แสงจันทร์ เรือนผมสีทองของเธอส่องประกายระยิบระยับดุจทุ่งข้าวสาลี\n\nตึก ตัก\n\nลมหายใจแผ่วเบา ศีรษะเอนพิงลงบนไหล่ของเขา อิซาเบลล์ยามหลับใหลดูเหมือนเด็กน้อยสมวัยของเธอจริงๆ\n\n“แม็กซิมิเลียน”\n\nขณะที่รถไฟวิ่งสั่นสะเทือนไปตามรางเหล็ก อีวานประคองศีรษะของอิซาเบลล์ที่สั่นคลอนเบาๆ อย่างนุ่มนวลแล้วกระซิบออกมา\n\n“นายมีลูกสาวที่ยอดเยี่ยมมากเลยนะ”\n\n***\n\n– นายมีลูกสาวที่ยอดเยี่ยมมากเลยนะ\n\nอิซาเบลล์กำมือแน่นอยู่ภายในแขนเสื้อและเม้มริมฝีปากเข้าหากันเพื่อกลั้นไม่ให้รอยยิ้มหลุดออกมา\n\nเธอซุกแก้มลงกับไหล่อันกว้างใหญ่ของเขาอย่างระมัดระวังไม่ให้อีกฝ่ายรู้ตัว\n\nครืด คราด\n\nรถไฟแล่นไปตามราง\n\nอากาศอันอบอุ่นภายในตู้โดยสารไหลเวียนอย่างนุ่มนวล ภายในตู้รถไฟที่มีแสงสลัวปรากฏให้เห็นจางๆ ผ่านเปลือกตาที่แง้มเปิดเพียงเล็กน้อย\n\nแสงจันทร์สาดส่องเข้ามาทางหน้าต่าง ผืนป่าที่พวกเขาไปฝึกฝนกันมาตลอดวันนี้ทอดตัวยาวเหยียดอยู่ไกลออกไป\n\nไอ้บ้าที่ทั้งโรแมนติก มีเหตุผล ทว่าไร้เดียงสา คนบ้าที่เอาหนวดเครามาปิดบังใบหน้าที่ชวนให้เห็นอกเห็นใจอยู่บ้าง\n\nถึงอย่างนั้น ถึงอย่างนั้น ก็พอทนได้อยู่นะ เอาเถอะ เมื่อลองพิจารณาดู ยังไงเขาก็เป็นคนที่ช่วยชีวิตฉันเอาไว้นี่นา แค่นั้นแหละ ไม่ใช่ความชอบพอที่ด่วนสรุปเกินไป แค่นั้นจริงๆ\n\nต้องสอนสามัญสำนึกให้เขา และสักวันหนึ่ง ก็ต้องจับโกนหนวดเครานั่นทิ้งซะ\n\nใช่ ตกลงตามนั้น\n\nฉันรู้สึกเหมือนตัวเองกำลังปั้นคนขึ้นมาเลยแฮะ ใครจะมาเก็บไอ้คนน่าสงสารคนนี้ไปดูแลถ้าไม่ใช่ฉัน มันก็เหมือนกับ… จิตวิญญาณแห่งอัศวินในเรื่อง ‘การรับใช้ช่วยเหลือ’ นั่นแหละ ใช่เลย\n\n***\n\nมีหน่วยรบหนึ่งที่มีประวัติศาสตร์และประเพณีอันยาวนานน่าภาคภูมิใจ นามว่า หมวดทหารช่างที่ 7 กองพันที่ 3 กองร้อยที่ 12 ภายใต้การบังคับบัญชาของแม่ทัพมังกรที่ 5\n\nพวกเขาเฆี่ยนตีพวกทาสเพื่อปลุกใจ ชายผู้หนึ่งยกกล้องส่องทางไกลขึ้นมองอย่างเงียบเชียบ\n\n“เอาจริงดิ พวกนั้นทะเลาะเรื่องบ้าอะไรกันอยู่เนี่ย?”\n\n“ต้องเป็นความเห็นไม่ตรงกันแน่ๆ สหาย!”\n\n“เวลาความเห็นไม่ตรงกันกับใคร เขาใช้ปืนยิงใส่กันแล้วจุดระเบิดบึ้มบั้มกันหรือไง สหาย?”\n\n“ไม่ครับ สหาย!”\n\nจุดซุ่มโจมตีทั้งสามแห่งพังทลายลงโดยสิ้นเชิงเนื่องจากการมาเยือนอย่างไม่คาดฝันของเป้าหมายและการต่อสู้ที่ตามมา โอ้ ในสมัยที่ท่านแม่ทัพมังกรที่ 5 ผู้ยิ่งใหญ่ยังมีชีวิตอยู่ ไม่เคยมีงานก่อสร้างห่วยแตกแบบนี้เกิดขึ้นมาก่อนเลย! ผู้บังคับหมวดรู้สึกผิดหวังอย่างยิ่ง\n\nโดยส่วนใหญ่แล้ว เวลาผู้บังคับหมวดรู้สึกผิดหวัง พวกเขามักจะมองหาต้นตอของปัญหาจากภายในหน่วยของตัวเอง\n\nและโดยส่วนใหญ่ ความพยายามนี้มักจะให้ผลลัพธ์ตามที่ต้องการเสมอ วัฒนธรรมอันงดงามของ “ความรักที่แฝงด้วยความเข้มงวด” ฝังรากลึกอยู่ในกองทัพทุกแห่งทั่วโลก แม้กระทั่งในหมู่ปีศาจและคนแคระก็ตาม\n\n“การละเล่นเล็กๆ ของคมดาบเงาเหลือเวลาอีกแค่สัปดาห์เดียวแล้ว สหายทั้งหลาย จงซ่อมแซมจุดที่พังทลายขึ้นมาใหม่และเตรียมพร้อมรับมืออย่างสุดกำลัง!”\n\n“ครับผม สหาย!!”\n\nคนแคระไว้เคราสีเทาคนหนึ่งยกมือขึ้นทำความเคารพก่อนจะเดินย่ำเท้าหนักๆ ออกไป\n\nคนแคระคือปรมาจารย์ด้านวิศวกรรมโยธา และวิศวกรรมโยธาก็รวมถึงการขุดอุโมงค์ และเมื่ออ้างอิงตามหลักตรรกศาสตร์นิรนัย ข้อความต่อไปนี้ย่อมเป็นความจริง\n\nคนแคระสามารถซ่อนตัวได้ทุกหนทุกแห่งที่มีผืนดิน\n\nนี่คือเหตุผลที่อีวานเรียกพวกมันว่าหนู\n\nในช่วงเวลาที่การสอบของเอนริเก้เหลือเวลาอีกเพียงหนึ่งสัปดาห์ เฟรเชนกายาก็ยังคงสงบสุขอยู่เช่นเคย\n\n*(หมายเหตุผู้แปลอังกฤษ: เผ่าคนแคระเป็นส่วนหนึ่งของฝ่ายจอมมาร การฝึกซ้อมระหว่างอีวานกับอิซาเบลล์สร้างความเสียหายให้กับอุโมงค์ที่พวกมันสร้างเอาไว้ ทำให้พวกมันต้องเร่งซ่อมแซมอย่างยากลำบากเพื่อเตรียมการซุ่มโจมตีในวันที่เอนริเก้จะจัดสอบเหล่านักศึกษา)*"
    },
