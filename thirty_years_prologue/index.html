      "title": "บทที่ 45",
      "content": "การฝึกภาคสนามของคณะอัศวินแห่งสถาบันเซนต์ยันตกเป็นเป้าหมายของผู้ก่อการร้าย เมื่อข่าวสารนี้ส่งมาถึงกองบัญชาการข่าวกรอง ดมิทรีก็ขมวดคิ้วมุ่นแล้วเอ่ยขึ้น “ลงโทษไอ้พวกสารเลวพวกนั้นซะ”\n\n“รับทราบครับท่าน”\n\nกองบัญชาการข่าวกรองเฝ้าจับตาดูงานกิจกรรมของสถาบันอย่างใกล้ชิดอยู่แล้ว โดยธรรมชาติ มาตรการรักษาความปลอดภัยสำหรับพื้นที่ฝึกภาคสนามย่อมถูกจัดเตรียมไว้อย่างไร้ที่ติ\n\nส่วนฝ่ายมกุฎราชกุมารก็ยังคงเก็บตัวเงียบเชียบมาตลอดนับตั้งแต่เหตุการณ์ครั้งล่าสุด\n\nองค์กรต่อต้านรัฐบาลต่างชาติ ไอ้พวกงี่เง่าไร้พิษสงพวกนั้น มันจะไปทำอะไรได้กัน?\n\nแล้วพวกปีศาจล่ะ? พวกมันมีขุมกำลังพอที่จะส่งกองกำลังเข้ามาใกล้เฟรเชนกายาได้หรือไง?\n\nฉะนั้น เมื่อประเมินจากหลักฐานเชิงประจักษ์และการอนุมานอย่างมีเหตุผลแล้ว ดมิทรีจึงเชื่อว่าไม่มีภัยคุกคามใดๆ ต่อสถาบันเซนต์ยัน\n\nไอ้บ้าที่ไหนจะมาซ่องสุมองค์กรก่อการร้ายไว้ในเมืองหลวงแล้วพยายามก่อกวนงานกิจกรรมของมหาวิทยาลัยกันเล่า?\n\nถ้าจะลงทุนทำถึงขนาดนั้น สู้ไปวางระเบิดพระราชวังหลวงเสียเลยไม่ดีกว่าหรือไง? แล้วซ้ำร้าย ท่านเอนริเก้ยังเป็นคนพานักศึกษาออกไปฝึกภาคสนามด้วยตัวเองอีกต่างหาก?\n\nไอ้พวกขี้ข้าพวกนั้น ที่ผ่านมาพวกมันมัวแต่ทำอะไรกันอยู่? วันๆ เอาแต่กินเงินเดือนหลวงไปเปล่าๆ หรือไง?\n\nผลก็คือ เมื่อสายข่าวคนที่สามเข้ามารายงานเรื่องราวเดิมเป๊ะๆ ดมิทรีก็ทำหน้าบูดเบี้ยวพลางยกมือลูบใบหน้าที่แห้งผากของตนเอง\n\n“…หักเงินเดือนฉันซะ”\n\n“ครับ ท่านพันเอก”\n\nเขาหมุนตัวกลับ\n\nคว้าเสื้อโค้ตขึ้นมาสวมแล้วเดินออกจากกองบัญชาการไป เขาต้องไปพบกับรุ่นพี่ให้ได้ ในเมื่อรุ่นพี่อยู่ในที่เกิดเหตุพอดี บางทีเขาอาจจะรู้อะไรบ้าง\n\n***\n\n“นี่ เอซี่” (อิซาเบลล์)\n\n“ได้สิ เอาเลย” (เอคไดซิส)\n\n“พวกเรายังไม่ได้เริ่มคุยกันเลยนะ” (อิซาเบลล์)\n\n“นี่มันรอบที่สี่แล้วนะที่ฉันได้ฟังเรื่องนี้น่ะ” (เอคไดซิส)\n\nเอคไดซิสมองดูอิซาเบลล์ด้วยสีหน้าเคร่งขรึม\n\nเมื่อข่าวเหตุการณ์ก่อการร้ายระหว่างการฝึกภาคสนามแพร่สะพัดไปทั่วสถาบัน เธอก็รีบกุลีกุจอมาหาเพื่อนสนิทที่คบหากันมานานและแทบจะเป็นเพื่อนเพียงคนเดียวของเธอทันที\n\nทว่าเมื่อมาถึงบ้านของอีกฝ่าย เธอกลับไม่พบท่าทางของเหยื่อผู้เคราะห์ร้ายจากเหตุก่อการร้ายเลยสักนิด\n\nข้างกายกองดาบไม้ที่หักไปแล้วหกเล่ม อิซาเบลล์กำลังฟาดฟันหุ่นไล่กาด้วยดาบไม้เล่มใหม่ โดยบนตัวหุ่นมีการวาดรูปหนวดเคราเอาไว้อย่างประณีตบรรจง\n\n“ถึงอย่างนั้นก็ฟังหน่อยเถอะน่า ฉันรู้สึกเหมือนตัวเองกำลังจะเสียสติและสับสนไปหมดแล้ว” อิซาเบลล์ระบายออกมา\n\n“อืม” เอคไดซิสตอบรับ\n\n“อย่าเข้าใจผิดนะ นี่เป็นเรื่องของเพื่อนฉันน่ะ”\n\nเอคไดซิสยั้งปากไว้ได้ทันก่อนที่จะเผลอโพล่งความจริงอันโหดร้ายออกไปว่า\n\n‘เธอไม่มีเพื่อนคนอื่นนอกจากฉันสักหน่อย’\n\nเธอช่างเป็นนักศึกษาดนตรีที่แสนดีและละเอียดอ่อนเสียจริงๆ\n\n“เมื่อไหร่ก็ตามที่ฉันตกอยู่ในอันตราย เขาจะปรากฏตัวออกมา ช่วยเหลือฉันไว้ จัดการทุกสิ่งทุกอย่างจนเรียบร้อย และถึงขั้นมาพบฉันเป็นการส่วนตัวเพื่อบอกเล่าความลับให้ฟัง ฉันเชื่อว่าเขามีใจให้ฉันแน่ๆ” (อิซาเบลล์)\n\n“นั่นมันเป็นการตีความที่ค่อนข้างเฉพาะตัวไปหน่อยนะ…” (เอคไดซิส)\n\n“ถ้าอย่างนั้น มีคำอธิบายอื่นอีกเหรอ? ไม่มีทางที่เขาจะมองฉันเป็นแค่เพื่อนธรรมดาแน่ๆ” (อิซาเบลล์)\n\nแม็กซิมิเลียนก็แทบจะไม่ต่างอะไรกับคนที่ไม่มีตัวตนแล้ว ด้วยเหตุผลทางการเมืองและเศรษฐกิจ การหายสาบสูญไปนานถึงสี่ปีก็แทบไม่ต่างจากการเสียชีวิต แม้แต่ในเกาหลีใต้เองก็ยังถือว่าเสียชีวิตไปแล้วเหมือนกัน\n\nดังนั้น ในทางไม่เป็นทางการ อิซาเบลล์จึงอยู่ในฐานะครอบครัวที่ขาดเสาหลัก มารดาของเธอเป็นสามัญชน ดังนั้นนอกเหนือจากความกรุณาที่พระราชวังทิลีสมอบให้ เธอก็ไม่มีภูมิหลังทางสังคมหรือเศรษฐกิจใดเป็นพิเศษ\n\nอาจฟังดูไม่ยุติธรรมนักสำหรับเด็กกำพร้าตัวจริงอย่างยูริที่ได้ยิน แต่ตัวอิซาเบลล์เชื่อเช่นนั้นจริงๆ\n\n“อย่างนั้น… เหรอ?” (เอคไดซิส)\n\nอาจฟังดูไม่ยุติธรรมสำหรับเด็กสาวที่ยากจนจริงๆ หากได้ยินเข้า ทว่าในมุมมองของเอคไดซิส อิซาเบลล์ถือเป็นผู้ที่เปราะบางทางเศรษฐกิจ (ทั้งที่อิซาเบลล์มีบ้านสองชั้นพร้อมสนามหญ้าเป็นของตัวเองด้วยซ้ำ)\n\nเอคไดซิสเป็นถึงองค์หญิงของประเทศหนึ่ง เป็นธิดาองค์โตของไอนาร์ และเป็นแก้วตาดวงใจที่เขาทะนุถนอมที่สุด เธอร่ำรวยถึงขนาดสามารถเอาเครื่องดนตรีที่มีราคาแพงพอๆ กับบ้านหนึ่งหลังไปฟาดหัวโจรได้หน้าตาเฉย\n\nฉะนั้น บทสนทนาของทั้งคู่จึงเผยให้เห็นความเข้าใจอันแปลกประหลาด\n\nเอาตามตรง คงไม่มีผลประโยชน์อะไรให้กอบโกยจากการเข้าหาอิซาเบลล์หรอกมั้ง นี่ไม่ได้กำลังล้อเล่นอยู่ใช่ไหมเนี่ย?\n\nเมื่อบทสนทนาดำเนินมาถึงจุดนี้ อิซาเบลล์ก็รู้สึกเหมือนไม่ได้รับความเป็นธรรมจนต้องทุบหน้าอกตัวเอง\n\n“แล้วทำไมเขาถึงปฏิเสธทุกครั้งเวลาที่ฉันชวนเขาไปกินข้าวด้วยล่ะ?” (อิซาเบลล์)\n\n“ไม่สิ ฟังนะ ผู้หญิงที่อายุน้อยกว่าตั้งสิบปี ทั้งสวย ทั้งใจดี ทั้งเรียนเก่งกีฬาเด่น แถมยังใช้ชีวิตดี๊ดี ถ้าเขาไม่ได้ชอบ แล้วทำไมถึงเอาแต่ผลักไสเธอออกไปล่ะ?” (อิซาเบลล์)\n\n“เธอดูจะหมกมุ่นกับเรื่องของ ‘เพื่อน’ คนนั้นมากเลยนะ…” (เอคไดซิส)\n\nเมื่อได้ผลลัพธ์ที่ไม่อาจทำความเข้าใจได้ ผู้คนก็มักจะเริ่มตีความสถานการณ์ไปในทิศทางที่ตนเองอยากจะเชื่อ\n\nอคติยืนยันความคิดตนเองเป็นสิ่งที่น่ากลัวยิ่งนัก\n\nในท้ายที่สุด เอคไดซิสก็พยักหน้าแล้วเอ่ยขึ้น “เดี๋ยวฉันช่วยสืบให้เอง คุณลุงของฉันบอกว่าเขาสนิทกับผู้ชายคนนั้นอยู่ ใครจะไปรู้ล่ะ หมอนั่นอาจจะเป็นพวกเจ้าชู้ตัวพ่อ ที่คอยหว่านเสน่ห์เล่นหูเล่นตากับผู้หญิงไปทั่วก็ได้นะ”\n\nถึงขั้นนั้นเลยเหรอ?\n\nอิซาเบลล์ครุ่นคิดพลางนึกถึงใบหน้าของอีวาน พวกเจ้าชู้… คอยยุ่งเกี่ยวกับผู้หญิงหลายคนงั้นเหรอ…?\n\nอืม เมื่อมองจากมุมของบุรุษที่ดูเท่ขนาดเขา ก็น่าจะเป็นไปได้… มั้ง? เอ๊ะ ก็ดูมีแนวโน้มอยู่นะ\n\nอิซาเบลล์ตกอยู่ในความสับสนว้าวุ่นใจ!\n\nน่าเศร้าที่ยูริซึ่งน่าจะเข้ามาขัดจังหวะได้ถูกจังหวะพอดี เวลานี้กำลังนอนพักฟื้นอยู่ในห้องพยาบาลของคณะเทววิทยา ฉะนั้นจึงไม่มีใครอยู่ที่นี่เพื่ออธิบายความจริงให้ฟังว่า ไอ้คนบ้าถือขวานอย่างจอห์น วิค คนนั้น สามารถฆ่าคนเพิ่มได้อีกสิบศพในช่วงเวลาเท่ากับที่เขาใช้เดินเข้าไปจีบผู้หญิงหนึ่งคนเสียด้วยซ้ำ…\n\n***\n\nชีวิตประจำวันของอีวานนั้นยุ่งวุ่นวาย ทั้งบริหารจัดการสถานเลี้ยงเด็กกำพร้า เดินทางไปมหาวิทยาลัยเพื่อดูแลต้นไม้ คอยอารักขาเหล่าผู้ฝึกตนสายวีรชน จัดระเบียบรายงานประจำวันและบัญชีการเงินของสถานเลี้ยงเด็กกำพร้า – หลังจากจัดการทั้งหมดนี้เสร็จสิ้นแล้วเท่านั้น เขาถึงจะได้พักผ่อนเสียที\n\nเวลาพักผ่อนของเขามักจะหมดไปกับการทำความสะอาดอุปกรณ์ประจำกายของจ่าสิบเอก ลับคมขวานจนกระทั่งตัดปุยฝ้ายขาดได้โดยไร้เสียง ถอดประกอบและทำความสะอาดอาวุธปืน จากนั้นจึงเอนหลังพิงโซฟาหลังจากชโลมน้ำมันเสร็จ แล้วหลับตาลงพักสายตาสักครู่\n\nนั่นเคยเป็นกิจวัตรประจำวันของอีวาน\n\nจุดสำคัญคือบัดนี้มันได้กลายเป็นอดีตไปแล้ว หลังจากเหตุการณ์ก่อการร้ายระหว่างการฝึกภาคสนาม ติดต่อกันมาหลายวันแล้วที่เอนริเก้เข้ามายึดครองพื้นที่พักผ่อนอันแสนล้ำค่าของเขา ประท้วงและไม่ยอมกลับไปเสียที\n\n“เอนริเก้ ได้เวลากลับบ้านแล้วนะครับ” (อีวาน)\n\n“พูดอะไรของนายน่ะ? ฉันสัญญาเอาไว้แล้วใช่ไหม? คำสัญญาที่ไม่อาจผิดคำพูดได้ไง หืม? ไม่มีน้ำใจนักรบเอาซะเลยเหรอ?”\n\n“…ไม่ใช่ว่าคุณแค่ไม่อยากไปทำงานหรือไงครับ?” (อีวาน)\n\n“อาจารย์เสียใจนะ อีวานวัยเยาว์เคยเชื่อฟังทุกคำที่ฉันพูดแท้ๆ เอาอีวานคนเดิมของฉันคืนมาเลยนะ” (เอนริเก้)\n\nนับตั้งแต่เกิดเหตุก่อการร้ายระหว่างการฝึกภาคสนาม เอนริเก้ก็เก็บตัวหมกตัวอยู่ในห้องทำงานผู้อำนวยการสถานเลี้ยงเด็กกำพร้ามาโดยตลอด\n\nในฐานะตัวการหลักที่ลากนักศึกษาขุนนางฝึกหัดราวห้าสิบคนเข้าไปพัวพันกับเหตุก่อการร้าย เธอจึงกำลังถูกทุกคนไล่ล่าถามหาความรับผิดชอบและพากันหลบหน้าหนีหาย\n\n“ฉันไม่ได้รับความเป็นธรรมเลยนะ หมายถึงว่า แกคิดว่าฉันเป็นคนทำหรือไง? ถ้าจะมีเด็กคนไหนที่คาดการณ์ไว้แล้วว่าพวกคนแคระจะโผล่พรวดเข้ามา ก็ควรจะจับไอ้หมอนั่นมาทรมานเค้นความจริงสิวะ บ้าเอ๊ย” (เอนริเก้)\n\n“ก็นะครับ” (อีวาน)\n\nในชั่วพริบตา อีวานผู้กลายเป็นสายลับฝ่ายปีศาจไปเสียแล้วก็พยักหน้ารับโดยไม่เอ่ยปากพูดอะไร\n\n“ก็ฉันหมายถึงอย่างนั้นนั่นแหละ แล้วนี่ อย่าพยายามโยนความผิดทั้งหมดมาให้ฉันเพียงเพราะนายไม่อยากรับผิดชอบสิ นายยังโตเป็นผู้ใหญ่ไม่พอเลยนะ” (เอนริเก้)\n\nคำพูดพวกนั้นของคุณต่างหากที่ยังไม่เป็นผู้ใหญ่เอาซะเลย อีวานคิดในใจ\n\nอีวานเชื่อมั่นว่าต่อให้เขาต้องมีชีวิตอยู่ต่อไปอีกเกินหนึ่งศตวรรษ เขาก็ไม่อยากจะแก่ตัวลงไปในสภาพแบบนี้เด็ดขาด\n\n“เอาเป็นว่า ที่ฉันจะพูดก็คือ อืม… จะเป็นยังไงถ้าฉันแสดงความสำนึกผิดแล้วเกษียณตัวเองไปเลยดีไหม? ไม่ว่าจะคิดทบทวนดูยังไง ก็ดูเหมือนที่ผ่านมาฉันจะใช้ชีวิตหนักหน่วงเกินไปหน่อยแล้ว มันถึงเวลาพักผ่อนบ้างสักนิดแล้วใช่ไหมล่ะ?” (เอนริเก้)\n\n“อืม”\n\n“ไปเที่ยวกันสักทริปไหม? ทะเลเป็นไง? ฉันไม่ชอบภูเขาน่ะ”\n\n“ทำไมฟังดูเหมือนผมต้องไปกับคุณด้วยเลยล่ะครับ?”\n\n“อ้าว ก็นายต้องไปกับฉันด้วยไม่ใช่หรือไง?”\n\nในฐานะคนที่ยึดหลักปฏิบัติจริงจัง อีวานไม่มีเจตนาจะไปเล่นตามน้ำกับคำเพ้อเจ้อของคนชราจากเมื่อกว่าหนึ่งศตวรรษก่อนแต่อย่างใด\n\nเขาฉวยถ้วยชาของเอนริเก้ขึ้นมาพลางเอ่ยว่า “ยังไงทางมหาวิทยาลัยก็ไม่เอาผิดคุณเป็นพิเศษหรอกครับ มันเป็นอุบัติเหตุจริงๆ นี่นา”\n\n“จะ-จริงเหรอ?”\n\n“ครับ เดิมทีความรับผิดชอบควรเป็นของกองบัญชาการข่าวกรอง การป้องกันการแทรกซึมของกองกำลังศัตรูเป็นหน้าที่ของพวกเขา”\n\n“จริงด้วย… เยี่ยมไปเลย!”\n\nเอนริเก้ผุดลุกขึ้นยืนแล้วปรบมือชอบใจ ดูเหมือนเธอแค่อยากจะหาคำปลอบใจเท่านั้น เพราะคนอย่างเธอไม่มีทางมองข้ามเรื่องพื้นๆ แค่นี้ไปได้แน่\n\nอีวานรู้จักวิธีเคารพผู้อาวุโส ต่างจากโลกที่ยังไม่พัฒนาแห่งนี้ ประเทศเกาหลีใต้ได้วางรากฐานหลักจริยธรรม ศีลธรรม บรรทัดฐานทางสังคม และประเพณีเคารพผู้สูงอายุแบบขงจื๊อเอาไว้อย่างมั่นคง (ซึ่งเรื่องนี้ยังพอถกเถียงกันได้อยู่บ้าง)\n\nเขาช่างเป็นคนที่สุภาพอ่อนน้อมเสียจริงๆ\n\n“งั้นตอนนี้ก็กลับไปได้แล้วครับ ผมเองก็มีงานต้องทำอีกเยอะเหมือนกัน”\n\n“แหม อาจารย์ขอโทษด้วยนะที่มาเบียดบังเวลาอันยุ่งเหยิงของนายน่ะ!”\n\n“ไม่เป็นไรหรอกครับ”\n\nสถานเลี้ยงเด็กกำพร้าเซนต์บาซิลิเซียคือผลงานชิ้นเอกของเขา ที่สร้างขึ้นด้วยเส้นสายและทรัพย์สินทั้งหมดที่เขาสั่งสมมาตลอดทั้งชีวิต\n\nอีวานซึ่งแต่เดิมไม่มีแผนจะเปลี่ยนสถานที่แห่งนี้ให้กลายเป็นบ้านพักคนชราสำหรับแวมไพร์อาวุโส จึงไล่ส่งเอนริเก้ที่ทำหน้าเจ็บปวดรวดร้าวให้ออกไปจากห้องทำงานผู้อำนวยการ\n\n“อ้อ จริงสิ เรื่องไปทะเลไม่ได้ล้อเล่นนะ ในเมื่อเรื่องมันลงเอยแบบนี้แล้ว การเรียนรู้เชิงประสบการณ์ พวกเราน่าจะลองจัดอะไรทำนองนั้นอีกสักครั้งดีไหม? อีกอย่าง ฉันได้ยินเสียงซุบซิบมาจากในวังหลวงด้วยนะ”\n\n“ในวังหลวงเหรอครับ?”\n\n“ใช่แล้ว ก็แหม ช่วงนี้คราซิลอฟกำลังติดขัดเรื่องอุตสาหกรรมการท่องเที่ยวนิดหน่อยนี่นา นักศึกษามหาวิทยาลัยล้วนมาจากตระกูลขุนนางกันทั้งนั้น ในอนาคตพวกเขาก็จะได้ขึ้นไปดำรงตำแหน่งสำคัญกันหมด เรามาช่วยโปรโมตล่วงหน้ากันหน่อยเถอะ มันก็เหมือนโครงการระดับชาติเลยนะ!”\n\n“…ล้มเลิกความคิดนั้นไปน่าจะดีกว่านะครับ”\n\nแนวคิดน่ะพอเข้าใจได้ แต่มันเป็นตัวเลือกที่โง่เง่าสิ้นดี\n\nการท่องเที่ยวแบบหมู่คณะของสถาบันการศึกษามักจะนำไปสู่วิกฤตการณ์อันเลวร้ายเสมอ\n\nถ้าเป็นที่ทะเล เผ่าพันธุ์ประหลาดอย่างนางเงือกหรือไม่ก็คราเคนอาจจะโผล่พรวดขึ้นมาอย่างไม่มีปี่มีขลุ่ยก็ได้\n\nทว่าอีวานเป็นคนยึดหลักปฏิบัติจริงจัง เขาไม่ได้ปรารถนาจะถูกปฏิบัติราวกับเป็นตัวประหลาดอย่างแวมไพร์กอบลินหรือผู้หยั่งรู้อนาคต ดังนั้นเขาจึงมีมารยาทมากพอที่จะไม่ไปยัดเยียด ‘สามัญสำนึก’ ของตนเองให้ผู้อื่น\n\nหลังจากส่งเอนริเก้กลับไปอย่างลวกๆ แล้ว เขาก็นั่งลงและถอนหายใจออกมาเฮือกใหญ่\n\nในที่สุดก็ได้พักผ่อนเสียที\n\nเขาหยิบขวานคู่ใจออกมาเพื่อสงบสติอารมณ์ และหลังจากชโลมน้ำมันเสร็จแล้ว ก็เริ่มต้นเช็ดถูด้วยผ้าชุบน้ำมันอย่างบรรจง\n\n***\n\nในขณะที่อีวานกำลังดื่มด่ำกับช่วงเวลาอันเงียบสงบกับขวานแสนรักของเขา เอคไดซิสก็กำลังลักลอบติดต่อกับคุณลุงของเธอซึ่งมาทำงานอาสาสมัครอยู่ที่สถานเลี้ยงเด็กกำพร้า เพื่อรวบรวมข้อมูลข่าวกรอง\n\n‘ศาสตราจารย์เอนริเก้พักอยู่ห้องเดียวกันนานถึงสามวันเลยงั้นเหรอ…?!’\n\nเอคไดซิสไม่กล้าพอที่จะนำข้อมูลสุดช็อกนี้ไปบอกเล่าให้เพื่อนรักฟัง ก็ศาสตราจารย์เอนริเก้เป็นเพื่อนของท่านพ่อเธอ และยังเป็นสมาชิกของปาร์ตี้ผู้กล้าอีกด้วยนี่นา!\n\nเอคไดซิสจดจำอีกฝ่ายได้แม่นยำ แม้ยามอยู่ในมหาวิทยาลัยเธอจะวางตัวเหมือนอาจารย์ผู้เงียบขรึม ทว่าตัวตนที่แท้จริงของเธอก็คือแวมไพร์\n\nในสมัยที่ยังออกรบประจำการ เหล่าทหารหาญที่ตกหลุมเสน่ห์ของเธอนั้นมีอยู่นับไม่ถ้วนทั่วทั้งแนวหน้า โฉมงามผู้เย้ายวนเปี่ยมด้วยพลังเวทอันล้นเหลือ แม้แต่ตัวเธอเองในวันวานก็ยังเคยแอบชื่นชมเอนริเก้อยู่เงียบๆ…\n\nตามตรงแล้ว เมื่อนำไปเปรียบเทียบกับเอนริเก้ อิซาเบลล์แทบจะไม่มีโอกาสชนะเลย นอกจากเรื่องที่เธอยังอายุน้อยกว่าแล้ว เธอจะเอาอะไรไปสู้กับวีรบุรุษแห่งปาร์ตี้ผู้กล้าได้เล่า?\n\nเอคไดซิสสะอึกสะอื้นในอก เมื่อนึกถึงความรักอันแสนเศร้าของเพื่อนรัก หัวใจอันบริสุทธิ์ของเธอพังทลายลงท่ามกลางเกมรักอันน่าชิงชังของพวกผู้ใหญ่ (ไม่ใช่อย่างนั้นสักหน่อย)\n\n‘ฉันต้องปิดเรื่องนี้ไม่ให้เบลล่ารู้เด็ดขาด…’\n\nเอคไดซิสไม่ได้ใจกล้าบ้าบิ่นพอที่จะเปิดเผยความจริงได้อย่างหน้าตาเฉย ว่าคนที่กำลังตามจีบเพื่อนเธออย่างจริงจัง (เปล่าเลย ไม่ใช่แบบนั้น) ดันมีความสัมพันธ์ทางกายกับอาจารย์มหาวิทยาลัยเป็นกิจวัตร (ไม่ใช่อย่างนั้นเหมือนกัน) — ช่างเป็นเสือผู้หญิงที่น่าสะพรึงกลัวยิ่งนัก (มันเป็นเรื่องเข้าใจผิดทั้งหมด)\n\nเอคไดซิสกอดลูกรักวัยสามเดือน (ไวโอลิน) เอาไว้แน่น พลางสาบานว่าจะจัดการชายผู้นั้นให้จงได้ภายในขอบเขตกำลังของตนเอง\n\nเพื่อเห็นแก่เพื่อนรักและเหล่าพี่น้อง นักรบแห่งโดรเวียนย่อมไม่ลังเลที่จะให้มือตนเองแปดเปื้อนโลหิต\n\nและเธอคือนักรบที่เก่งกาจที่สุดในโดรเวียน เป็นธิดาแห่งกษัตริย์ไอนาร์ เธอปฏิญาณอย่างแน่วแน่ว่าจะกลายเป็นนักรบผู้ผดุงความยุติธรรมซึ่งสาบานตนต่อเกียรติภูมิของบิดา เพื่ออุทิศตนกำจัดศัตรูเจ้าเล่ห์เพทุบายให้สิ้นซาก"
    },

      "title": "บทที่ 46",
      "content": "ดังที่ได้กล่าวไปก่อนหน้านี้ สหราชอาณาจักรกำลังเร่งพัฒนาหน่วยงานข่าวกรองของตนเองอย่างขยันขันแข็ง\n\nในบรรดาสิบสองชาติภายในสหราชอาณาจักร มีสี่ชาติที่มีอิทธิพลโดดเด่นเป็นพิเศษ ได้แก่ โดรเวียน คาลีออน ทิลีส และคราซิลอฟ ชาติเหล่านี้แสดงให้เห็นถึงความเชี่ยวชาญเฉพาะทางในระดับที่สูงกว่าชาติอื่นๆ\n\nยกตัวอย่างเช่น องค์กรข่าวกรองของโดรเวียน ประกอบด้วยเหล่าผู้ศรัทธาในธาตุปฐมภูมิทั้งสี่\n\nถือครองคำตอบอันหลั่งไหลไม่ขาดสายประดุจสายน้ำ\n\nเปลวเพลิงอันน่าหลงใหลที่เมื่อจุดติดขึ้นมา จะทำให้คายความจริงออกมาจนหมดเปลือก\n\nสายลมลึกลับที่เมื่อแขวนขึ้นบนเสา จะช่วยเปิดเผยเรื่องราวในอดีต\n\nผืนดินอันเงียบงันที่เมื่อฝังกลบลงไป จะช่วยปกปิดความจริงทั้งปวง\n\nการรวบรวมความรักที่มีต่อธาตุของตนเช่นนี้ถือเป็นการเสร็จสิ้นองค์กรข่าวกรองฉบับโดรเวียน ทว่าในความเป็นจริง มันก็หมายถึงแค่การจับตัวคนมาแล้วนำไปถวายสังเวยเท่านั้นเอง\n\nในทางกลับกัน เหล่าเอลฟ์ในกองทัพคาลีออนกลับนิยมวิธีการอันประณีตลึกซึ้ง ในฐานะผู้นำด้านเวทมนตร์จิตใจ ข่าวกรองของพวกเขาจึงละเมียดละไมและเป็นมิตร โดยเชี่ยวชาญการล้วงข้อมูลอย่างแนบเนียนผ่านการผูกสัมพันธ์ การบิดเบือนความทรงจำ และการใช้เวทมนตร์ทางจิตอย่างคล่องแคล่ว\n\nส่วนทิลีส อาณาจักรแห่งอัศวิน หากสงสัยเรื่องใดก็จะเอ่ยปากถามออกไปตรงๆ เว้นเสียแต่ว่าหากอีกฝ่ายไม่ยอมตอบ ก็จะถือว่าเป็นการดูหมิ่นเกียรติและเปิดฉากท้าดวลเสียตรงนั้น\n\nในทางตรงกันข้าม หน่วยเก็บกวาดซึ่งครั้งหนึ่งเคยเป็นส่วนหนึ่งของระบบดังกล่าว รวมถึงองค์กรรุ่นก่อนอย่าง ‘เหล่าบุตรแห่งเอนริเก้’ และกองบัญชาการข่าวกรองแห่งคราซิลอฟในยุคต่อมา กลับนิยมปฏิบัติการจารกรรมสมัยใหม่อย่างน่าทึ่ง อาทิ การเฝ้าสังเกตการณ์ การรวบรวมหลักฐาน ข่าวกรองทางสัญญาณ การเสาะหาข้อมูลทางเทคโนโลยี การลาดตระเวนภูมิประเทศ และการวางเครือข่ายสายลับภาคพื้นดิน\n\nกล่าวโดยสรุป พวกเขาดำเนินกิจกรรมจารกรรมตามแบบแผนดั้งเดิมที่มหาอำนาจชาติอื่นมองว่า “ล้าสมัย” นั่นเอง\n\n– วันนี้ มื้อกลางวันกินแซนด์วิชอกไก่ราดซอสมัสตาร์ด กังวลเรื่องความไม่สมดุลทางโภชนาการ ขาดผักยกเว้นมะเขือเทศ แนะนำให้ปรับมากินอาหารที่เน้นผักเป็นหลักให้มากขึ้น\n\nอีวาน ผู้รับผิดชอบด้านความปลอดภัยและสุขภาพของบรรดาสมาชิกปาร์ตี้ผู้กล้า ละสายตาจากกล้องส่องทางไกลชั่วครู่ เพื่อจดบันทึกข้อมูลสำคัญลงในสมุดพกของตน\n\n**ตอนที่ 46: สตอล์กเกอร์ ปะทะ สตอล์กเกอร์**\n\nสถานการณ์ที่ไม่เคยเกิดขึ้นมาก่อนอย่างการที่นักศึกษาชั้นปีที่หนึ่งของคณะอัศวินทั้งหมดต้องนอนซมอยู่บนเตียงโรงพยาบาล ได้นำมาซึ่งผลลัพธ์อันเกินคาด\n\n“เรื่องแบบนี้มันเป็นไปไม่ได้!!”\n\nช่วงเวลาสอบถูกเลื่อนออกไปอีกหนึ่งสัปดาห์\n\nหากมีผู้เข้าสอบขาดสอบเพียงไม่กี่คน พวกเขาก็คงต้องสอบตกหรือไม่ก็ต้องมาสอบซ่อมในภายหลัง\n\nทว่า เมื่อนักศึกษาระดับปริญญาตรีเกือบทั้งหมดกลายเป็นผู้ป่วยบาดเจ็บสาหัส ทางมหาวิทยาลัยจึงประกาศเลื่อนการสอบออกไปหนึ่งสัปดาห์\n\nสำหรับการสอบภาคปฏิบัตินั้นไม่ใช่ปัญหา แต่สำหรับการสอบข้อเขียน มันกลับกลายเป็นคนละเรื่องกันเลยทีเดียว นักศึกษาสายพลศึกษาที่เพิ่งเคยสัมผัสประสบการณ์การอ่านหนังสือเตรียมสอบเป็นครั้งแรก ต่างพากันระบายความอัดอั้นตันใจออกมา\n\nเป้าหมายหลักของการระบายอารมณ์ส่วนใหญ่คือคณะเทววิทยา คณะเวทมนตร์ คณะวิจิตรศิลป์ และคณะดุริยางคศิลป์…\n\nโดยเฉพาะอย่างยิ่งเหล่านักศึกษาดุริยางคศิลป์\n\n“ทำไมพวกนายถึงได้โชคดีขนาดนี้วะ!!” (นักศึกษาคนหนึ่ง)\n\n“พวกเราก็อยู่สำนักวิชาศิลปะเดียวกันไม่ใช่เรอะ!! ทำไมมีแค่พวกแกที่ยิ้มระรื่นกันอยู่ได้!!” (นักศึกษาคณะอัศวินคนหนึ่ง)\n\n“ไม่อยากจะเชื่อเลย! นี่มันเรื่องบ้าอะไรกัน! ทำไมอัศวินถึงต้องมานั่งอ่านหนังสือสอบข้อเขียนด้วยวะ?” (นักศึกษาคณะอัศวินคนหนึ่ง)\n\nอนึ่ง นักศึกษาสาขาดุริยางคศิลป์เองก็ต้องสอบข้อเขียนเช่นกัน ทั้งประวัติศาสตร์ดนตรี การวิเคราะห์รูปแบบดนตรี วิชาประสานทำนองสอดประสาน และวิชาทฤษฎีการประสานเสียง เผลอๆ จะมีรายวิชาที่เน้นการสอบข้อเขียนมากกว่าสาขาวิชาอัศวินเสียด้วยซ้ำ\n\nแน่นอนว่าข้อเท็จจริงเหล่านั้นหาได้สลักสำคัญในสายตาของพวกคณะดาบและโล่ไม่\n\nไอ้พวกเด็กดนตรีพวกนั้น\n\nในขณะที่ผู้คนผู้ขยันขันแข็งต้องอาบเหงื่อต่างน้ำเพื่อหาเลี้ยงชีพไปวันๆ ไอ้พวกนี้กลับเอาแต่นั่งอยู่บนพื้นตลาด ร้องรำทำเพลงแล้วก็ได้เงินไปฟรีๆ! (การเปิดหมวกเล่นดนตรีเป็นงานที่หนักหนาสาหัสมากนะ)\n\n“เฮ้อ เหม็นกลิ่นเหงื่อชะมัด เวลาจะเข้าร้านอาหารของคุณลุง หัดไปอาบน้ำเสียก่อนสิยะ หมายถึงเอาน้ำราดตัว ฟอกสบู่ให้เกิดฟองเยอะๆ ถูทำความสะอาดให้ทั่วทุกซอกทุกมุม แล้วค่อยล้างออกด้วยน้ำสะอาดอีกรอบน่ะ” (นักศึกษาดุริยางคศิลป์คนหนึ่ง)\n\n“ยัยพวกบ้าเอ๊ย…!!” (นักศึกษาคณะอัศวินคนหนึ่ง)\n\nในช่วงเวลานี้ ภาพเหตุการณ์ทำนองเดียวกันสามารถพบเห็นได้ทั่วไปทั่วทั้งบริเวณมหาวิทยาลัย\n\nเหล่านักศึกษาคณะอัศวินผู้เดือดดาล กับสายตาเย้ยหยันของเหล่านักศึกษาคณะดุริยางคศิลป์\n\nไม่รู้ว่าใครกันแน่ที่เป็นคนต้นคิดจับเอาคณะอัศวินกับคณะดุริยางคศิลป์มามัดรวมไว้ในวิทยาลัยศิลปะเดียวกัน แต่เบื้องหลังความคิดนั้นจะต้องมีคำสาปแฝงอยู่เป็นแน่\n\nเอคไดซิสกำลังขับขานบทเพลงอันแสนเศร้าท่ามกลางยุคสมัยอันโกลาหลเช่นนี้เอง\n\n***\n\n“คนต่อไปใครดี?” (เอคไดซิส)\n\n“ยัยบ้า… ยัยปีศาจบ้าเอ๊ย…!”\n\nโรงยิมกลางแจ้งของวิทยาลัยศิลปะ\n\nเอคไดซิสจ้องมองไวโอลินที่บิดเบี้ยวซึ่งเธอถือกลับหัวอยู่ในมือด้วยสายตาน่าขนลุก\n\nด้านหลังของเธอคือเพื่อนนักศึกษาร่วมคณะ\n\nตรงหน้าเธอคือเหล่านักศึกษาคณะอัศวินในสภาพสะบักสะบอมยับเยิน\n\nแทบเท้าของเธอ มีศพที่หัวระเบิดกระจุยอยู่ห้าร่าง (เปล่าหรอก ไม่ใช่เรื่องจริงเสียหน่อย)\n\nทั้งหมดนี้ล้วนเป็นผลลัพธ์จากการที่นักศึกษาดุริยางคศิลป์ผู้แข็งแกร่งที่สุดลุกขึ้นมายืนหยัดเพื่อความยุติธรรม\n\nพี่วีโอรุ่นที่หนึ่งสละชีพเพื่อปกป้องเพื่อนของเธอไปแล้ว\n\nพี่วีโอรุ่นที่สองก็ถูกพรากไปอย่างสูญเปล่า\n\nและบัดนี้ ณ ที่แห่งนี้ พี่วีโอรุ่นที่สามกำลังต่อสู้เพื่อปกป้องเกียรติยศของเธออยู่\n\nดังที่เคยตระหนักได้ในคราวหนึ่ง เครื่องดนตรีคือชีวิตจิตใจของนักดนตรี\n\nด้วยปณิธานอันแน่วแน่ในหัวใจ เอคไดซิสกำลังสั่งสอนพวกที่บังอาจย่างกรายเข้ามาในประตูหลักของคณะดุริยางคศิลป์โดยไม่เข้าใจความหมายของดนตรี\n\n“นักศึกษาปีหนึ่งคณะอัศวินโดนปีหนึ่งคณะดุริยางคศิลป์สอยร่วงไปแล้วตั้งห้าคนแน่ะ!”\n\n“ฮ่าๆๆๆ!”\n\n“เห็นหรือยัง พวกคนเขลาเอ๋ย ‘ดนตรี’ ที่พัฒนาไปจนถึงขีดสุด ย่อมไม่อาจแยกออกจาก ‘พละกำลัง’ ได้หรอก”\n\n“ไสหัวกลับไปซะ แล้วไปบอกทุกคนด้วยว่า… จากนี้ไปคณะดุริยางคศิลป์จะเป็นผู้ ‘ปกครอง’ วิทยาลัยศิลปะทั้งหมดเอง….”\n\nเหล่ารุ่นพี่ไม่ได้เข้ามาร่วมวงในเรื่องเล่นสนุกของพวกเด็กปีหนึ่งด้วย\n\nรุ่นพี่คณะอัศวินพากันนั่งเคี้ยวป๊อปคอร์นพลางดูมหรสพรุ่นน้องปีหนึ่งโดนซ้อมอย่างเพลิดเพลิน ส่วนรุ่นพี่คณะดุริยางคศิลป์ก็ไม่คิดจะเสียเวลาไปท้าดวลกับเด็กปีหนึ่งคณะอัศวินตั้งแต่แรกอยู่แล้ว\n\nดังนั้น ‘การประลอง’ ที่ก่อตัวขึ้นเองตามธรรมชาตินี้ จึงค่อยๆ กลายเป็นเทศกาลงานรื่นเริงสำหรับนักศึกษาชั้นปีที่หนึ่งของวิทยาลัยศิลปะไปโดยปริยาย (หมายเหตุ: คณะอัศวินยังคงอยู่ในช่วงสอบ)\n\nพวกคนทรยศอย่างยูริ อิซาเบลล์ ออสการ์ และคนอื่นๆ ในกลุ่มหัวแถวของแต่ละคณะ กลับสร้างความประหลาดใจให้ทุกคนด้วยการขยันอ่านหนังสือเตรียมสอบโดยไม่แยแสเรื่องวุ่นวายนี้แม้แต่น้อย ดังนั้น จึงเหลือทางเลือกให้เหล่านักศึกษาอยู่เพียงทางเดียว\n\nปีศาจผู้ที่ไม่ต้องอ่านหนังสือเลยสักนิด แต่กลับทำให้คนทั้งคณะต้องสยบแทบเท้าด้วยคะแนนสอบภาคปฏิบัติเพียงครั้งเดียว…!\n\n“ไปสั่งสอนพวกมันให้รู้สำนึกกันเถอะครับลูกพี่!”\n\n“ใช่แล้วครับลูกพี่ ถ้าลูกพี่ลงมือเมื่อไหร่ พวกมันจบเห่กันหมดแน่!”\n\nนักศึกษาปีหนึ่งคนหนึ่งวิ่งแจ้นออกไปพลางตะโกนบทพูดแบบตัวร้ายเกรดสาม\n\nไม่นานนัก ชายวัยกลางคนในสภาพซอมซ่อก็ปรากฏตัวขึ้นจากที่ไหนสักแห่ง มอร์ด นักศึกษาปีหนึ่งที่แข็งแกร่งที่สุดแห่งคณะอัศวินมาถึงแล้ว\n\n“ไม่ล่ะ ข้าต้องเตรียมตัวสอบวิชาต่อไป…” (มอร์ด)\n\n“อย่ามาโกหกเลยครับลูกพี่!! แล้วไอ้การสอบกระจอกๆ นั่นมันสำคัญกว่าเกียรติยศของคณะที่ตอนนี้กำลังกลิ้งเกลือกอยู่บนพื้นงั้นเหรอครับ?”\n\nไอ้พวกงี่เง่าพวกนี้มันพล่ามอะไรกันอยู่?\n\nแน่ล่ะว่าพวกมันเป็นกลุ่มเดียวที่เดือดร้อนเรื่องการสอบ แล้วถ้าตอนนี้การสอบมันกลายเป็นเรื่องขี้ปะติ๋วไปแล้ว ก่อนหน้านี้พวกมันจะโวยวายกันขึ้นมาเพื่อจุดประสงค์อะไรกันเล่า?\n\nฮัสคาลผู้ชาญฉลาดแห่งโดรเวียนตระหนักได้ในทันที อ้อ ที่แท้พวกมันก็แค่อยากจะหนีการอ่านหนังสือสอบมาหาเรื่องสนุกทำกันเท่านั้นเอง\n\nเมื่อตั้งสติกลับมาได้และมองตรงไปข้างหน้า เขาก็เห็นเอคไดซิสกำลังกำไวโอลินที่เสียหายไปบางส่วนเอาไว้แน่น\n\n“คราวนี้ใช้มาได้กี่เดือนแล้วล่ะ (ไวโอลินน่ะ) เอซี่?”\n\n“แค่เดือนเดียวค่ะ คุณลุง…”\n\n“ยอดเยี่ยม ถึงอย่างนั้นก็ผ่านมาเกินสามสัปดาห์แล้วนี่นะ”\n\nมอร์ดพยักหน้าอย่างพึงพอใจแล้วหันหลังเดินจากไป\n\n“ขอยอมแพ้ ข้าแพ้แล้ว อา คณะดุริยางคศิลป์แข็งแกร่งเกินไปจริงๆ ก็เธอเป็นลูกสาวของไอนาร์นี่นะ”\n\n“ไม่อยากจะเชื่อเลย… สายเลือดมันสำคัญกว่าตำแหน่งทางวิชาการอีกเหรอครับลูกพี่…? แล้วเกียรติยศของคณะอัศวินล่ะครับ!?”\n\n“อ้อ จะว่าไป เอซี่กับข้าไม่ได้เกี่ยวพันกันทางสายเลือดหรอกนะ มันเป็นความสัมพันธ์แบบรับอุปถัมภ์น่ะ” (มอร์ด)\n\n“โดรเวียน… ข้าจะไม่มีวันลืมเรื่องนี้เลย…!!” (นักศึกษาคณะอัศวินคนหนึ่ง)\n\n“เลิกพูดจาไร้สาระแล้วไปอ่านหนังสือสอบกันได้แล้วพวกเจ้า” (มอร์ด)\n\n“นับตั้งแต่วันนี้เป็นต้นไป เจ้าไม่ใช่พี่น้องของข้าอีกต่อไปแล้ว!!” (นักศึกษาคณะอัศวินคนหนึ่ง)\n\nพร้อมกับภาพขุนนางหนุ่มจากทิลีสที่วิ่งร้องไห้โฮมุ่งหน้าไปยังอาคารหลักของคณะระดับปริญญาตรี ความวุ่นวายประจำวันก็ปิดฉากลง\n\nอีวานสังเกตการณ์เหตุการณ์ทั้งหมดอย่างเงียบเชียบจากหลังต้นไม้ พลางใช้ปากกาแก้ไขบันทึกของตน\n\n– เอคไดซิส เครื่องดนตรีประเภทเครื่องตีเหมาะกับเธอมากกว่าเครื่องสายนะ\n\n***\n\n“บ้าเอ๊ย นี่มันไม่ใช่เวลามามัวทำเรื่องแบบนี้นะ!”\n\nเอคไดซิสโกรธจัดที่ตนเองมัวแต่หลงระเริงไปกับความวุ่นวายจนลืมเลือนสิ่งที่สมควรต้องทำไปเสียสนิท\n\nแน่นอนว่าหน้าที่ของเธอคือการเป็นนักศึกษา\n\nทว่า เอคไดซิส ไอนาร์สดอตตีร์ นักศึกษาปีหนึ่งคณะดุริยางคศิลป์ กับเอคไดซิสผู้เป็น ‘เพื่อนของอิซาเบลล์’ ควรจะต้องแยกออกจากกันโดยสิ้นเชิง\n\nเวลานี้ไม่ใช่วาระของนักศึกษาดนตรีธรรมดาๆ แต่ต้องการนักรบผู้สวมเกราะแห่งความยุติธรรมและความร่วมแรงร่วมใจต่างหาก\n\nบังเอิญเสียเหลือเกินที่พี่วีโอเพิ่งจะชโลมเลือดมาหมาดๆ\n\nเอคไดซิสตั้งมั่นในปณิธานและก้าวเดินไปข้างหน้า เพื่อตามหาศัตรูเจ้าเล่ห์ที่ซ่อนตัวอยู่ ณ แห่งหนใดในรั้วมหาวิทยาลัยแห่งนี้\n\nเพื่อล่วงรู้เจตนาของศัตรู และเพื่อผดุงความยุติธรรม\n\nท่านพ่อของเธอจะต้องสนับสนุนพลังอันชอบธรรมของเธออย่างแน่นอน\n\n***\n\nขอย้ำอีกครั้งว่า อีวานเป็นบุคลากรที่มีรูปลักษณ์แสนธรรมดาและไร้พิษสงโดยสิ้นเชิง\n\nโดยพื้นฐานแล้ว เขาคือปรมาจารย์ด้านการอำพรางตัว การแทรกซึม และปฏิบัติการลับ หากเขาต้องการจะทำตัวให้ดูธรรมดา เขาก็สามารถกลมกลืนได้ยิ่งกว่าใครๆ\n\nทว่าเขาไม่จำเป็นต้องใช้ทักษะการแทรกซึมขั้นสูงถึงเพียงนั้นเลย เพราะโดยเนื้อแท้แล้ว เขามีรูปลักษณ์ที่จืดจางไร้จุดเด่น ชนิดที่ว่าต่อให้เดินสวนกันก็ลืมเลือนไปได้ง่ายๆ\n\n“อึ๋ย…!”\n\nนักศึกษาจากคณะเวทมนตร์คนหนึ่งวิ่งหนีเตลิดเปิดเปิงจนเกิดความโกลาหล\n\nในขณะที่อีวานกำลังห้อยตัวอยู่บนยอดไม้ ซ่อนกายอยู่หลังเงามืด นักศึกษาคนที่สังเกตเห็นเขานั้นสมควรได้รับคำชมเชยในเรื่องสายตาอันเฉียบคมเสียจริงๆ\n\nแน่นอนว่าอีวานจดจำประวัติของนักศึกษาทุกคนในมหาวิทยาลัยแห่งนี้ได้ขึ้นใจ เขาจึงจำเด็กหนุ่มที่เพิ่งวิ่งหนีไปได้ทันที ไอ้หนุ่มที่เคยแอบทิ้งก้นบุหรี่โดยไม่ได้รับอนุญาตจนโดนจับเข้า ‘คลินิกเลิกบุหรี่’ ไปนั่นเอง ช่างเป็นนักศึกษาที่หน้าบางเสียจริง\n\nพฤติกรรมตามแบบฉบับเด็กมหาวิทยาลัย อีวานพยักหน้าด้วยสีหน้าเรียบเฉยก่อนจะเบนสายตาออกไป\n\nเอลเฟียรา\n\nธิดาแห่งเวียลกริน\n\nนักศึกษาปีหนึ่งอันดับหนึ่งของคณะเวทมนตร์ อัจฉริยะผู้ทำคะแนนสอบภาคปฏิบัติเข้าศึกษาต่อได้สูงที่สุดในประวัติศาสตร์ของคณะ\n\nเขามองดูเอลเฟียราที่กำลังหรี่ตาจ้องมองมา พลางถือสมุดบันทึกของตนไว้ในมือ\n\n– ยกเว้นผู้ติดตามไม่กี่คนแล้ว มนุษยสัมพันธ์ไม่ราบรื่นนัก นิสัยเหมือนพ่อ\n\nเขาบรรจงเขียนประวัติลงไปอย่างจริงใจ เต็มเปี่ยมไปด้วยความซื่อสัตย์สุจริตและปราศจากเจตนาร้ายใดๆ ทั้งสิ้น\n\n“อืม”\n\nอีวานสัมผัสได้ถึงสายตาของใครบางคนจึงหันศีรษะไปมอง\n\n***\n\n“…ไม่ได้มีแค่เบลล่าคนเดียวสินะ….”\n\nอิซาเบลล์ และบางทีอาจรวมถึงเอนริเก้ด้วย คงไม่ใช่ ‘เหยื่อ’ เพียงรายเดียวของชายคนนั้น เธอคิดเช่นนั้น\n\nความน่าสะพรึงกลัวของนักล่าที่คอยเฝ้ามองเหยื่อจากระยะไกล เพื่อเสาะหา ‘จุดอ่อน’ ถาโถมเข้ากดทับจิตใจของเธอ\n\nเจ้าของข่าวลือผู้ส่งนักศึกษาปีหนึ่งคณะอัศวินทั้งห้าสิบคนเข้าไปนอนในห้องไอซียูของคณะเทววิทยา นักสะสมก้นบุหรี่วิปลาส ฝันร้ายหลังต้นไม้ ยักษ์ใหญ่ไว้หนวดเครา…. บุรุษผู้มีรูปโฉมหล่อเหลา (ตามมุมมองของอิซาเบลล์)….\n\nในขณะที่เอคไดซิสค่อยๆ เข้าใกล้ความจริงอันน่าสยดสยองมากขึ้นทุกทีที่รวบรวมข่าวลือเกี่ยวกับ ‘คนสวน’ เธอก็ลอบสังเกตอีวานจากในพุ่มไม้\n\nภาพของสิ่งมีชีวิตที่ห้อยตัวอยู่บนต้นไม้ กำลังจดบันทึกพลางจ้องมองใครบางคนจากคณะเวทมนตร์\n\n“สตอล์กเกอร์….”\n\nเธอได้กลายเป็นสตอล์กเกอร์ที่กำลังสะกดรอยตามสตอล์กเกอร์ประจำสถาบันเข้าเสียแล้ว\n\n***\n\n**หมายเหตุผู้เขียน:**\n\nหมายเหตุ: ผู้เขียนเป็นศิษย์เก่าของวิทยาลัยศิลปะ และในความเป็นจริง นักศึกษาดุริยางคศิลป์ก็มักจะสร้างเสียงดังรบกวนจากการซ้อมวงและซ้อมขับร้องในห้องชมรมจริงๆ นั่นแหละครับ"

      "title": "บทที่ 47",
      "content": "อีวานไม่ได้ใส่ใจกับป้ายสัญญาณผ่านเข้า-ออกมากนัก เขารู้ดีว่าท่าทีเช่นนี้ต่างหากที่จะนำไปสู่ผลลัพธ์ที่ดียิ่งกว่า\n\nโดยเนื้อแท้แล้ว มหาวิทยาลัยเป็นพื้นที่เปิดโล่ง ตราบใดที่ไม่ได้บุกรุกเข้าไปในห้องเรียน ใครๆ ก็สามารถเดินเข้าออกได้โดยไม่มีข้อจำกัด\n\nยิ่งไปกว่านั้น เหล่านักศึกษาต่างก็เฉยเมยต่อผู้อื่น เช่นเดียวกับคนส่วนใหญ่ พวกเขาไม่เคยให้ความสนใจกับการเคลื่อนไหวของ ‘เจ้าหน้าที่’ หรอก\n\nสำหรับนักศึกษา เจ้าหน้าที่ก็เป็นเพียงตัวตนที่เลือนหายไปตรงขอบสายตาเท่านั้น\n\nดังนั้น อีวานจึงเข้าใจดีว่าการเดินทอดน่องอย่างเป็นธรรมชาติในชุดธรรมดา ช่วยเรื่องการรักษาความปลอดภัยได้ดีกว่าการพยายามหลบซ่อนตัวเสียอีก\n\nทว่า มันมีปัญหาอยู่อย่างหนึ่ง หากมีใครสักคนเริ่มหันมาให้ความสนใจเขาขึ้นมา กลยุทธ์การรักษาความปลอดภัยทั้งหมดที่เขาเพียรสร้างมาจนถึงบัดนี้ย่อมต้องพังทลายลง\n\nและในเวลานี้ ก็มีนักศึกษาคนหนึ่งกำลังจับจ้องทุกย่างก้าวของอีวานอย่างไม่วางตา\n\n“เขาทำอะไรอยู่น่ะ?” (เอคไดซิส)\n\nอีวานขมวดคิ้วให้กับสายตาอันดื้อด้านที่คอยจับจ้องตามติดตนไม่ลดละ\n\nทำไมยัยนั่นถึงทำตัวแบบนั้นกันนะ?\n\nเขาแกล้งทำทีเป็นก้มลงผูกเชือกรองเท้า ก่อนจะเบนสายตากลับไปมองด้านหลังอย่างแนบเนียน\n\nเอคไดซิสกำลังจ้องเขม็งมาที่เขาด้วยดวงตาที่ลุกโชน\n\n“นั่นมัน… การพรางตัวเรอะ?” (อีวาน)\n\nเธอถือกิ่งไม้ที่มีใบไม้ดกหนาไว้บังใบหน้า พลางย่องเดินไปตามแนวพุ่มไม้อย่างลับๆ ล่อๆ\n\nผู้คนจากโดรเวียนล้วนมีรูปร่างสูงใหญ่ ในกรณีของบุรุษย่อมกำยำล่ำสัน ส่วนในกรณีของสตรีก็ใหญ่โตในความหมายที่แตกต่างออกไปเล็กน้อย\n\nเอคไดซิสผู้สืบสายเลือดอันเลิศล้ำที่สุดแห่งโดรเวียน มีสัดส่วนร่างกายที่ใหญ่โตทรงพลังทำลายล้าง แม้จะมีรูปลักษณ์ภายนอกน่ารักน่าเอ็นดูราวกับสัตว์ตัวเล็กๆ ก็ตาม\n\nด้วยเหตุนี้ กิ่งไม้แค่นั้นจึงไร้ประโยชน์โดยสิ้นเชิงในการปกปิดส่วนสูงอันตระหง่านกับสิ่งอื่นที่ใหญ่โตยิ่งกว่านั้นเสียอีก\n\nอีวานมองดูเธอครู่หนึ่งราวกับรู้สึกเวทนา จากนั้นจึงหยิบสมุดบันทึกออกมา\n\n– เอคไดซิส ต้องสงสัยว่าประพฤติมิชอบทางการศึกษา ความสามารถในการรับรู้บกพร่องอย่างร้ายแรง\n\nอีวานเป็นคนซื่อตรง เขาจึงไม่ลังเลเลยที่จะจดบันทึกความจริงลงไป เขาปิดสมุดบันทึกแล้วออกเดินต่อไป\n\nเขามุ่งหน้าไปยังคณะอัศวิน มนตราอันคุ้นเคยช่วยกระตุ้นประสาทสัมผัสของเขา\n\nกองบัญชาการข่าวกรองกำลังเรียกตัวเขาอยู่\n\n***\n\nเอคไดซิสเคลื่อนไหวอย่างระมัดระวังท่ามกลางความตึงเครียดจนริมฝีปากแห้งผาก\n\nการพรางตัวของเธอช่างสมบูรณ์แบบ ไม่มีคุณลุงคนไหนเลยสักคนที่สังเกตเห็นเธอเวลาที่เธอย่องเดิน (เหล่าฮัสคาลมักจะใจอ่อนให้กับการเล่นซนของหลานสาวเสมอ)\n\nฉะนั้น ด้วยความมั่นใจเต็มเปี่ยม เธอจึงคอยแอบลอบมองอีวานอยู่ห่างๆ\n\nเขาเป็นคนประหลาดพิกล\n\nบางครั้ง เขาก็พลันหายวับไปจากสายตา ทำเอาคนที่เฝ้าดูอยู่ตกใจแทบแย่ ก่อนจะไปพบว่าเขาปีนขึ้นไปอยู่บนต้นไม้เพื่อกวาดสายตาสอดส่องไปรอบๆ\n\nตั้งแต่คณะเวทมนตร์ไปจนถึงคณะอัศวิน และที่น่าตกตะลึงยิ่งกว่านั้นคือกระทั่งคณะปรัชญา อีวานเคลื่อนไหวอยู่ตลอดเวลาเพื่อจับตาดูใครบางคน\n\nจู่ๆ เขาก็ขมวดคิ้ว วิ่งทะยานไปราวกับภูตผี หรือไม่ก็พุ่งตัวเข้าไปในพุ่มไม้ที่ควันบุหรี่ลอยกรุ่นขึ้นมา\n\nพอเดินเข้าไปในอาคารคณะ เขาก็ก้าวเดินฉับๆ ราวกับจะมุ่งหน้าไปที่ไหนสักแห่ง แต่แล้วก็หายตัวไปราวกับวิญญาณ!\n\n– “คนสวน?”\n\n– ไม่เคยเห็นทำสวนเลยสักครั้ง\n\n– ในมหาวิทยาลัยมีสถานที่ที่พอจะเรียกว่าสวนอยู่ด้วยเหรอ?\n\n– ไม่รู้สิ… หมอนั่นกำลังทำอะไรอยู่กันแน่? คอยสะกดรอยตามใครบางคนอยู่ตลอดเวลาเลย\n\n– ไม่รู้จักหยุดพัก ทำไมกัน? รับงานจากใครมางั้นเหรอ? หรือว่าเป็นงานอดิเรก?\n\nเธอขีดเขียนข้อความลงในสมุดบันทึกอย่างขะมักเขม้นท่ามกลางความสับสนงุนงง\n\nไอ้สตอล์กเกอร์ผู้ขยันขันแข็งคนนั้นตระเวนไปทั่วรั้วมหาวิทยาลัยอย่างไม่รู้จักเหน็ดเหนื่อย ไม่ยอมพักผ่อนหรือกินข้าว คอยเดินเตร็ดเตร่ไปตามระเบียงทางเดินอยู่ตลอดเวลา…!\n\nอะไรกันแน่ที่ทำให้ผู้ชายคนนั้นกลายเป็นแบบนี้ไปได้?\n\nมาถึงจุดนี้ ความอยากรู้อยากเห็นได้เอาชนะความหวาดกลัวไปเสียแล้ว เอคไดซิสกำลังตามหาตัวอีวานพลางเคี้ยวแซนด์วิชในมือไปด้วย\n\nเขาหายลับไปจากสายตาอีกแล้ว ทั้งที่เมื่อครู่ดูเหมือนกำลังเดินมุ่งหน้าไปยังคณะอัศวินแท้ๆ แต่พอเลี้ยวหัวมุมไปเขาก็พลันอันตรธานหายไปราวกับกลุ่มควัน\n\n“อืม หายไปไหนของเขากันนะ?”\n\nเธอเช็ดซอสมัสตาร์ดที่เลอะริมฝีปากออก แล้วก้าวเดินฉับๆ ต่อไป\n\n***\n\n“ไม่รู้ทำไม เอคไดซิสถึงพยายามสะกดรอยตามฉันอยู่ได้”\n\nแต่เรื่องนั้นมันเป็นไปไม่ได้หรอก ถึงจะน่ารำคาญอยู่บ้าง แต่ฉันก็ยังไม่ได้ทื่อลงถึงขนาดปล่อยให้มือใหม่หัดขับแบบนั้นจับได้ไล่ทันหรอกนะ\n\nอีวานเดินไปตามระเบียงทางเดินโดยมีเวทมนตร์ ‘รบกวนการรับรู้’ กางกั้นเอาไว้\n\n“ดมิทรี”\n\n“สบายดีไหมครับ รุ่นพี่?”\n\nไม่มีนักศึกษาคนใดเดินเพ่นพ่านอยู่บนระเบียงทางเดินของคณะเลยแม้แต่คนเดียว ทั้งหมดเป็นผลมาจากเวทมนตร์ ‘รบกวนการรับรู้’ ของกองบัญชาการข่าวกรอง\n\nกลางระเบียงทางเดิน ดมิทรีซึ่งถือซองเอกสารสีเหลืองอยู่ในมือ กำลังยืนทอดสายตามองออกไปนอกหน้าต่าง\n\n“รุ่นพี่ปรากฏตัวขึ้นทันทีหลังจากร่ายเวทเสร็จเลยนะครับ สมกับเป็นรุ่นพี่จริงๆ น่าทึ่งเสมอไม่เคยเปลี่ยนเลย”\n\n“ที่มหาวิทยาลัยมีเรื่องอะไรเกิดขึ้น ดมิทรี?”\n\n“เอ่อ มีเรื่องที่ต้องขอปรึกษาและเรื่องที่ต้องรายงานครับ ในสถานการณ์แบบนี้… อืม ครับ”\n\nดมิทรีหยิบแฟ้มเอกสารออกมาแล้วยื่นส่งให้\n\n“พวกเราจับตัวคนร้ายคดีขู่วางระเบิดวันปฐมนิเทศนักศึกษาใหม่ได้แล้วครับ”\n\n“ถ้าอย่างนั้นก็แค่จัดการปิดคดีไปเลยไม่ใช่เหรอ?”\n\n“มันมีปัญหาอยู่นิดหน่อยครับ”\n\nกองบัญชาการข่าวกรองคราซิลอฟนั้นเปี่ยมด้วยประสิทธิภาพ อันที่จริง ในบรรดาหน่วยงานบริหารทั้งหมดของคราซิลอฟ กองบัญชาการข่าวกรองคือหน่วยงานที่มีประสิทธิภาพสูงที่สุด\n\nโดยพื้นฐานแล้ว คราซิลอฟ… ไม่สิ ในสังคมยุคก่อนสมัยใหม่ที่แสนล้าหลังแห่งนี้ การทุจริตคอร์รัปชันแพร่ระบาดไปทั่วทุกหย่อมหญ้า ข้าราชการที่ไม่รับสินบนนั้นเป็นเรื่องที่เป็นไปไม่ได้พอๆ กับยูนิคอร์นหรือมังกร (ซึ่งเอาเข้าจริง พวกมันก็มีตัวตนอยู่จริงนั่นแหละ)\n\nกระนั้น แม้จะตกอยู่ในบริบทเช่นนั้น กองบัญชาการข่าวกรองกลับสะอาดสะอ้านอย่างน่าอัศจรรย์ ซึ่งเป็นเรื่องที่ช่วยไม่ได้เมื่อมีองค์หญิงเอลิซาเวตาเป็นผู้บัญชาการสูงสุด\n\nดังนั้น หากกองบัญชาการข่าวกรองแกะรอยตามตัวพวกผู้ก่อการร้ายได้แล้ว ก็นับว่าแปลกประหลาดยิ่งนักที่เรื่องนี้จะตกมาถึงมืออีวาน\n\nอีวานขมวดคิ้วพลางเปิดซองเอกสารออกดู\n\n“โดรเวียน…?”\n\n“ครับ โดรเวียน”\n\nโดรเวียน ดินแดนแห่งนักรบ บ้านเกิดของไอนาร์\n\nโดรเวียน ดินแดนที่เลื่องชื่อเรื่องเหล่านักรบ เป็นผู้บงการเหตุขู่วางระเบิดในคราซิลอฟงั้นหรือ?\n\nอีวานพลิกอ่านเอกสารอย่างครุ่นคิด\n\n“ตอนที่พวกเราตรวจสอบระเบิดเวทมนตร์ที่ใช้ในครั้งนั้น ชิ้นส่วนส่วนใหญ่ล้วนสืบย้อนกลับไปถึงโดรเวียนครับ”\n\n“โดรเวียนบงการเหตุก่อการร้ายด้วยระเบิดเวทมนตร์เนี่ยนะ? มันฟังดูสมเหตุสมผลตรงไหน?”\n\n“ตามหลักตรรกะแล้ว ย่อมเป็นไปไม่ได้แน่นอนครับ”\n\n“ก็ใช่น่ะสิ….”\n\nเหล่านักรบแห่งโดรเวียนขึ้นชื่อเรื่องการใช้ขวานสะบั้นกะโหลกศัตรูแทนที่จะมาใช้ระเบิด\n\nฉะนั้น หากคิดย้อนกลับ พวกเขาก็อาจจะเป็นฝ่ายที่ถูกสงสัยน้อยที่สุดเมื่อเกิดเหตุขู่วางระเบิดขึ้นมา\n\nทว่า ‘สามัญสำนึก’ ของกองบัญชาการข่าวกรอง ย่อมต้องตรงกันข้ามกับสามัญสำนึกของพลเรือนทั่วไป\n\nหากมีกลุ่มคนที่ไม่มีใครสงสัยเลย ในทางกลับกัน คนกลุ่มนั้นนั่นแหละที่ควรจะต้องตกเป็นผู้ต้องสงสัยมากที่สุด\n\n“ดังนั้น พวกเราจึงสืบสาวลึกลงไปอีก กรุณาอ่านตั้งแต่หน้า 11 เป็นต้นไปครับ”\n\n“…ดูเหมือนไอนาร์จะทำงานไม่เรียบร้อยเท่าไหร่นะ”\n\n“ครับ ไม่ค่อยสมกับเป็นกษัตริย์เท่าไหร่เลยใช่ไหมล่ะครับ? ที่ดันไปแสดงความปรานีต่อศัตรูแบบนั้น”\n\nจวบจนกระทั่งไอนาร์เดินทางกลับคืนสู่มาตุภูมิหลังการสิ้นชีพของจอมมาร โดรเวียนยังไม่เคยเป็นปึกแผ่นรวมเป็นหนึ่งเดียวมาก่อน\n\nยุคนั้นคือยุคสมัยแห่งความโกลาหลที่มีขุนศึกจำนวนมากซึ่งถูกเรียกว่า ‘ยาร์ล’ กระจัดกระจายอยู่ทั่วแผ่นดิน บัดนี้เมื่อภัยคุกคามจากจอมมารมลายหายไปแล้ว พวกมันจึงพากันอาละวาดคลุ้มคลั่งราวกับม้าพยศที่หลุดจากบังเหียน\n\nในกาลเช่นนั้น ไอนาร์ได้สถาปนาอาณาจักรขึ้นมาด้วยขวานคู่ในมือ นั่นคือเหตุผลที่เขาได้รับการขนานนามว่า ‘มหาราช’\n\nไอนาร์นำความสงบสุขกลับคืนสู่บ้านเกิดและหลอมรวมผู้คนให้เป็นหนึ่งเดียวในฐานะชนชาติเดียวกัน\n\nเรื่องราวมันเป็นที่รับรู้กันเช่นนั้น\n\n“หนึ่งในยาร์ลที่ยอมสวามิภักดิ์ต่อไอนาร์คือหนึ่งในตัวการเบื้องหลัง ข้อมูลนี้ส่งไปถึงหูไอนาร์แล้วหรือยัง?”\n\n“ท่านอัครมหาเสนาบดีกำลังพิจารณาเรื่องนี้อยู่ครับ หากไอนาร์ล่วงรู้เรื่องนี้เข้า…”\n\n“กลองศึกก็จะดังกึกก้องขึ้นสินะ”\n\n“ครับ และเมื่อพิจารณาจากสถานการณ์บริเวณแนวชายแดน พวกเราย่อมได้รับผลกระทบอย่างหลีกเลี่ยงไม่ได้ และอย่างที่รุ่นพี่ทราบ… ขณะนี้ยังไม่แน่ชัดว่ามกุฎราชกุมารอเล็กซานเดอร์ทรงประทับอยู่ที่ใด ความเคลื่อนไหวของกองทัพเองก็น่าสงสัยเช่นกันครับ”\n\nหลังจากพลิกดูแฟ้มเอกสารจนครบถ้วน อีวานก็ถ่ายเทพลังเวทลงในอักขระรูนที่ทิ้งไว้บนหน้าสุดท้ายแล้วปัดมือเบาๆ\n\nเอกสารลับสุดยอดพลันลุกไหม้เป็นเปลวเพลิงในพริบตาและมอดไหม้กลายเป็นเถ้าถ่านปลิวว่อนไป\n\n“รู้ตัวคนร้ายเบื้องหลังเหตุก่อการร้ายแล้ว แต่พวกที่กำลังเตรียมการลงมือกลับยังไร้ร่องรอย ทว่า เป้าหมายของพวกมันชัดเจนมาก…”\n\n“เอคไดซิส”\n\n“ครับ พระธิดาที่ไอนาร์มหาราชทรงหวงแหนที่สุด หากเกิดเรื่องร้ายแรงขึ้นกับเธอ กษัตริย์ไอนาร์จะต้องเปิดฉากทำสงครามทันที และความรับผิดชอบทั้งหมดจะพุ่งตรงมาที่องค์หญิง ในฐานะที่พระองค์ทรงเป็นผู้นำสูงสุดของกองบัญชาการข่าวกรอง”\n\n“ถึงตอนนั้น กองทัพก็จะพากันไปสนับสนุนมกุฎราชกุมาร”\n\nเพื่อให้กองทัพอยู่รอดได้ สงครามย่อมเป็นสิ่งจำเป็น ในทางกลับกัน ในประเทศที่ปราศจากภัยคุกคามจากสงคราม การลดขนาดกองทัพย่อมกลายเป็นสิ่งที่หลีกเลี่ยงไม่ได้\n\nเพิ่งจะผ่านพ้นสงครามจอมมารมาได้เพียงสี่ปีเท่านั้น บ้านเมืองกำลังอยู่ในช่วงฟื้นฟูบูรณะ ทว่าราชสำนักกลับต้องจัดสรรงบประมาณไปหล่อเลี้ยงกองทหารแทนที่จะนำไปใช้ในการฟื้นฟูประเทศ\n\nดังนั้น ผู้ที่กระหายสงครามมากที่สุดในเวลานี้ก็คือฝ่ายกองทัพ\n\nรวมถึงมกุฎราชกุมารผู้ปรารถนาจะบ่อนทำลายราชสำนักและทำลายความน่าเชื่อถือขององค์หญิงเอลิซาเวตา\n\n“พวกผู้ก่อการร้ายจะต้องเล็งเป้าหมายมาที่เอคไดซิสอีกครั้งอย่างแน่นอนครับ รุ่นพี่”\n\n“ไปกราบทูลองค์หญิงด้วย”\n\nอีวานเหลือบมองระเบียงทางเดินอันว่างเปล่าก่อนจะหมุนตัวเดินจากไป\n\n“ฉันจะทำในสิ่งที่จำเป็นต้องทำเอง”\n\n“ขอบคุณสำหรับความทุ่มเทนะครับ ‘อีวานตัวน้อย’”\n\n“เรื่องแค่นี้เอง”\n\nอีวานส่ายศีรษะสั้นๆ แล้วเดินจากไป หลังจากมองตามแผ่นหลังของอีกฝ่าย ดมิทรีก็ปัดมือเบาๆ\n\nอักขระรูน ‘รบกวนการรับรู้’ ที่ปลายสุดของระเบียงทางเดินมอดดับลง และเหล่านักศึกษาก็เริ่มทยอยเดินกลับเข้ามาในทางเดินอีกครั้ง\n\nทว่าบนระเบียงทางเดินที่เหล่านักศึกษากลับคืนมา กลับไม่หลงเหลือร่องรอยของดมิทรีอยู่อีกต่อไป\n\n***\n\nอีวานซึ่งเป็นคนที่มีตรรกะความคิดสูงมาก ได้วางแผนการขึ้นด้วยตรรกะอันเรียบง่าย\n\n1. มีใครบางคนกำลังหมายหัวเอคไดซิสอยู่\n\n2. ด้วยเหตุผลบางประการ เอคไดซิสกำลังพยายามสะกดรอยตามอีวาน\n\nการนำข้อมูลที่ว่าเป้าหมายอารักขากำลังตกอยู่ในอันตราย มาประกอบเข้ากับข้อเท็จจริงที่ว่าเป้าหมายอารักขากำลังตามติดตนเองอยู่ นำไปสู่ทางออกที่แสนตรงไปตรงมา\n\nเขาจำเป็นต้องอยู่ในระยะสายตาเพื่อให้เอคไดซิสสะกดรอยตามเขาได้ง่ายขึ้น\n\nในสถานการณ์อันน่ายินดีที่เป้าหมายเฝ้าระวังและเป้าหมายอารักขากำลังเดินตามหลังมาด้วยความสมัครใจเช่นนี้ จึงไม่มีเหตุผลอะไรที่เขาจะต้องซ่อนตัว เพียงแค่เปิดเผยตัวให้อยู่ในสายตา ก็ช่วยให้อีวานสามารถคุมตัวเอคไดซิสให้อยู่ในสายตาของตนได้เช่นกัน\n\nขณะเดียวกัน การคอยวนเวียนอยู่ใกล้ๆ เอคไดซิส ย่อมนำพาเขาไปพบกับ ‘ผู้ก่อการร้ายปริศนา’ อย่างหลีกเลี่ยงไม่ได้\n\nดังที่เขาเคยตระหนักได้ก่อนหน้านี้ เจ้าหน้าที่ที่ผ่านการฝึกฝนมาอย่างดีจะไม่มีวันเคลื่อนไหวโดยมีเป้าหมายเพียงอย่างเดียวในหัว\n\nการวางเหยื่อล่อไว้มากกว่าหนึ่งตัวสำหรับการลงมือเพียงครั้งเดียว\n\nนั่นแหละคือรูปแบบการปฏิบัติงานของหน่วยเก็บกวาด\n\n***\n\n“มะ ไม่จริงน่า…?!”\n\nเอคไดซิสที่กำลังจิบกาแฟอยู่ทำกาแฟหกเลอะเทอะพลางจ้องมองไปด้านหลังแนวต้นไม้อย่างเหม่อลอย\n\n“เอซี่ เป็นอะไรไปน่ะ?”\n\n“อะ เอ่อ อะ อะ เอ่อ… เอ่อ… บะ เบลล่า เบลล่าอยู่แถวนี้หรือเปล่า?”\n\n“ไม่อยู่นี่? อิซาเบลล์บอกว่าวันนี้ต้องแยกไปกินมื้อกลางวันเพราะติดเรียน… ทำไมเหรอ?”\n\n“ถ้าอย่างนั้น… ถ้าอย่างนั้น… ก็ฉัน…?”\n\nเมื่อมองดูคนสวนที่ยืนอยู่หลังแนวต้นไม้ เอคไดซิสก็ทำหน้าเบ้ราวกับกำลังจะปล่อยโฮออกมา\n\n“ฉันคือเป้าหมายงั้นเหรอ…?”\n\n“อะไรนะ? เธอพูดเรื่องอะไรของเธอน่ะ?”\n\n“มะ ไม่มีอะไร ไม่มีอะไรทั้งนั้นแหละ… ยูริ ฉันขอตัวลุกไปก่อนนะ ขอโทษด้วย”\n\n“ไม่เป็นไร ฉันเองก็ต้องไปเรียนคาบต่อไปเหมือนกัน ไว้เจอกันพรุ่งนี้นะ!”\n\n“อื้ม อื้ม”\n\nเอคไดซิสเดินโซซัดโซเซออกไป เมื่อมายืนอยู่ที่หน้าทางเข้าสาขาออร์เคสตรา เธอก็หันกลับมามองด้วยสายตาสั่นระริก\n\n“…!”\n\nณ ระยะห่างเท่าเดิมเป๊ะกับเมื่อครู่ ที่ฟากโน้นของแนวต้นไม้\n\n‘เขา’ กำลังจ้องมองมาที่เธออยู่\n\nจู่ๆ เอคไดซิสก็รู้สึกอยากจะร้องไห้ออกมาเสียดื้อๆ"
    },

      "title": "บทที่ 48",
      "content": "“อ้าว คุณหนูไอนาร์สดอตตีร์ ได้ไวโอลินคันใหม่มาเหรอคะ?”\n\n“อะ ค่ะ…”\n\n“ว้าว! นี่มันตระกูลสตราดิวาเรียสเลยไม่ใช่เหรอ?! แพงขนาดนี้… ไม่สิ ไวโอลินคันที่แล้วของเธอก็รุ่นนี้เหมือนกันไม่ใช่หรือไง?”\n\n“ค่ะ… คุณลุงให้มาน่ะค่ะ”\n\n“น่าอิจฉาจังเลย!”\n\nทว่ายิ่งกว่าความอิจฉา คือสายตาที่เต็มไปด้วยความขุ่นเคืองและการดูแคลน\n\nมันเป็นสายตาที่คุ้นเคยและเสียดแทงใจสำหรับเอคไดซิส\n\nวันเวลาที่เธออุทิศตนเข้าขวางทางบุกของเหล่านักศึกษาปีหนึ่งคณะอัศวิน ดูเหมือนจะถูกลืมเลือนไปจนหมดสิ้น ท่าทีของคนพวกนั้นราวกับเรื่องเหล่านั้นไม่เคยเกิดขึ้นมาก่อน\n\nในคณะดุริยางคศิลป์ เอคไดซิสมักจะได้รับการปฏิบัติเช่นนี้อยู่เสมอ\n\nบางทีมันอาจจะเป็นเรื่องธรรมดา โดรเวียนเป็นอาณาจักรอันทรงอำนาจในสหราชอาณาจักร ทว่าไม่ใช่ประเทศที่สถาปนาสถานะของตนขึ้นมาด้วยวัฒนธรรมและศิลปะ\n\nคนเถื่อนผู้ดุดันและแข็งแกร่ง นั่นคือคำประเมินที่ประเทศของเธอได้รับ\n\nถึงกระนั้น เอคไดซิสก็ยังสอบเข้ามาเรียนในคณะดุริยางคศิลป์ทั้งที่ไม่มีพรสวรรค์อันโดดเด่น\n\nเครื่องดนตรีที่เธอพกพาล้วนเป็นของชั้นเลิศอยู่เสมอ ทว่าแม้แต่ของล้ำค่าเหล่านั้นก็กลับพังเสียหายได้อย่างง่ายดาย\n\nสภาพแวดล้อมรอบข้างก็ไม่เป็นมิตรเอาเสียเลย แถมสัตว์ประหลาด ‘คุณลุง’ ที่เข้ามาเรียนเป็นนักศึกษาปีหนึ่งก็ยังคอยตามหาตัวเธออยู่ตลอดเวลา\n\nเอคไดซิสเป็นเด็กสาวที่ได้รับความรักใคร่มาโดยตลอด ในฐานะธิดาแห่งกษัตริย์และขุมกำลังอันน่าเกรงขามที่เลื่องลือไปทั่วทั้งทวีป เธอจึงเป็นที่เชิดชูของใครหลายคน\n\nทว่า สภาพแวดล้อมเช่นนี้กลับโหดร้ายเกินไปสำหรับเธอ\n\n“อึก… ฮึก… ฮือ….”\n\nในคาบเรียนถัดไป เธอนั่งสะอื้นไห้อยู่ในห้องซ้อมเพียงลำพัง\n\nเนื่องจากไม่มีใครแจ้งให้เธอทราบเลยว่าตารางเรียนมีการเปลี่ยนแปลง เธอจึงนั่งตัวสั่นและร้องไห้อยู่คนเดียว\n\nมือที่เพิ่งจะลากคันชักบนสายไวโอลินไปได้ไม่กี่ครั้งร่วงผล็อยลงอย่างอ่อนแรง\n\n“ท่านพ่อ… คุณลุง….”\n\nเธอกอดไวโอลินไว้แน่นพลางสูดน้ำมูก จากนั้นจึงค่อยๆ วางมันลงในกล่องด้วยมืออันสั่นเทา\n\nมันเป็นช่วงเวลาที่เธออยากจะยอมแพ้เหลือเกิน\n\nอันที่จริง ทุกช่วงเวลาที่ผ่านมาล้วนเป็นเช่นนั้น ทุกวินาทีที่ได้เล่นไวโอลิน\n\nสำหรับชาวโดรเวียน ไวโอลินเป็นเครื่องดนตรีต่างแดนอันแสนประหลาด ยิ่งไปกว่านั้น หากจะเสาะหาของที่ได้มาตรฐานสักคันก็มีราคาแพงหูฉี่ แต่ทั้งที่แพงขนาดนั้น เครื่องดนตรีอันบอบบางนี้กลับพังทลายลงได้อย่างง่ายดาย\n\nโดรเวียนเป็นดินแดนที่แห้งแล้ง เพียงแค่ปล่อยให้โดนลมข้างนอกชั่วครู่ แผ่นไม้และลำตัวของไวโอลินก็จะบิดงอ เป็นอันจบสิ้นอายุขัยของเครื่องดนตรีทันที\n\nต่อให้ตั้งสายทุกวันก็ไม่มีความหมายใดๆ เครื่องสายย่อมต้องการการดูแลเอาใจใส่อย่างประณีตจากผู้เชี่ยวชาญที่มีประสบการณ์เป็นทุนเดิมอยู่แล้ว\n\nเหล่าฮัสคาลต่างมองว่าองค์หญิงกำลังลุ่มหลงในความฟุ่มเฟือย ส่วนครูผู้สอนที่หามาได้ก็เป็นเพียงพวกโง่เขลาไร้ประสบการณ์ ไม่ได้ใกล้เคียงกับนักดนตรีหรือกวีผู้ช่ำชองเลยแม้แต่น้อย\n\nด้วยเหตุนั้น เธอจึงต้องดิ้นรนหาโน้ตเพลงอย่างยากลำบากและฝึกฝนด้วยตนเองมาเป็นเวลานาน\n\nครั้นต่อมา เมื่อเธอสามารถสอบเข้าวิทยาลัยดุริยางคศิลป์แห่งสถาบันเซนต์ยัน ซึ่งเป็นโรงเรียนดนตรีอันทรงเกียรติระดับโลกได้สำเร็จ โอ้ เธอช่างปีติยินดีมากเพียงใด\n\n“…ไชโย”\n\nเอคไดซิสตบกระเป๋าที่สะพายอยู่บนไหล่เบาๆ\n\nตลอดชีวิตที่ผ่านมา เธอมักจะอยากยอมแพ้อยู่ร่ำไป การปล่อยวางทุกสิ่งแล้วใช้ชีวิตอย่างสงบในฐานะองค์หญิงดูเหมือนจะไม่ใช่เรื่องเลวร้ายอะไร\n\nทว่า การมีชีวิตอยู่ในฐานะธิดาของกษัตริย์ ย่อมหมายถึงการถูกจัดแสดงประดุจสิ่งของราคาแพงที่ถูกเก็บรักษาเอาไว้\n\nทอผ้าเพื่อเพิ่มมูลค่าในตลาด ขับร้องเพลงเพื่อน้ำเสียงอันไพเราะ ฝึกฝนศิลปะการต่อสู้เป็นครั้งคราว\n\nผลลัพธ์สุดท้ายก็คือการแต่งงานกับนักรบที่เหมาะสมที่สุดเพื่อสืบสานสายเลือดราชวงศ์ นั่นคงจะเป็นชะตากรรมของเธอ\n\nเธอไม่อยากใช้ชีวิตแบบนั้น\n\nเธออยากจะเรียนรู้เครื่องดนตรี เธออยากจะเรียนดนตรี โดยเฉพาะอย่างยิ่ง ไวโอลิน\n\nความปรารถนานั้นเริ่มต้นขึ้นเมื่อสิบปีก่อน จากบทสนทนาข้างกองไฟ\n\nมันเริ่มต้นจากเรื่องเล่าที่เธอได้ยินจากชายผู้หนึ่งซึ่งบัดนี้ใบหน้าของเขาเริ่มเลือนรางไปแล้ว\n\nไอนาร์เป็นบุรุษผู้มีเหตุผล แม้จะเป็นตรรกะแบบฉบับโดรเวียน แต่เขาก็เป็นบิดาที่ยอดเยี่ยมซึ่งใช้ความคิดอย่างมีเหตุมีผลเสมอ\n\nด้วยเหตุนี้ เขาจึงพาลูกๆ ทุกคนออกสู่สนามรบด้วย มีเหตุผลหลายประการสำหรับเรื่องนี้\n\nประการแรก หากเป็นลูกของเขา พวกเขาก็จำเป็นต้องสัมผัสบรรยากาศของสมรภูมิรบด้วยตนเอง\n\nประการที่สอง ข่าวลือเกี่ยวกับเหล่านักรบแห่งโดรเวียนนั้นไม่อาจไว้วางใจได้\n\nเหตุผลประการหลังมีความสำคัญยิ่งกว่า ไอนาร์เป็นยอดนักรบ และแม้แต่ในเวลานั้น เขาก็เป็นชายที่ไร้ผู้ทัดเทียมภายในโดรเวียนอยู่แล้ว\n\nหากเขายุติสงครามได้อย่างปลอดภัยและเดินทางกลับบ้าน ก็มีความเป็นไปได้สูงที่จะมีนักรบคนใดคนหนึ่งหมายปองธิดาของเขาไว้เป็นรางวัลเชลย\n\nดังนั้น เอคไดซิสจึงเข้าใจเรื่องสงครามเป็นอย่างดี\n\nและเธอก็รู้จักเรื่องราวของปาร์ตี้ผู้กล้าในยุคสมัยนั้น\n\nเธอจดจำภาพของเหล่าผู้กล้าที่เดินโซซัดโซเซกลับมาในสภาพบาดเจ็บได้เสมอ แขนขาหัก บางครั้งถึงกับสูญเสียอวัยวะบางส่วน กลับมาในสภาพสะบักสะบอมยับเยิน\n\nเช็ดคราบเลือด พันผ้าพันแผลทับรอยแผล นั่งหมดแรงอยู่ข้างกองไฟ แบ่งปันสุรากันดื่ม\n\nในช่วงเวลาเหล่านั้น เธอมักจะเอ่ยถามคำถามเช่นนี้กับชายผู้ที่มักจะบาดเจ็บสาหัสที่สุดนอกเหนือจากคนในปาร์ตี้อยู่เสมอ\n\n“ทำไมคุณลุงไม่หนีไปล่ะคะ?”\n\n“หือ?”\n\nเขาเป็นชายที่อายุน้อยกว่าพ่อของเธออย่างน้อยสิบปี ทว่าก็ยังแก่กว่าเธออยู่มาก ยกเว้นนักบุญหญิงแล้ว เขาคือคนที่อายุน้อยที่สุดในบรรดาสมาชิกของปาร์ตี้นี้ เอคไดซิสจึงมักจะชวนชายท่าทางหยาบกระด้างคนนี้พูดคุยอยู่บ่อยๆ\n\nชายคนนั้นทอดสายตามองกองไฟอยู่ครู่หนึ่ง ก่อนจะแย้มรอยยิ้มจางๆ แล้วเอ่ยว่า\n\n“ไม่มีที่ให้หนีหรอก โลกกำลังจะกลายเป็นนรกแล้ว”\n\n“ถึงอย่างนั้น ก็ยังดีกว่าออกไปสู้รบไม่ใช่เหรอคะ? ที่ๆ ไม่รู้เลยว่าจะตายเมื่อไหร่ทุกครั้งไปน่ะ”\n\n“เรื่องนี้เธอไม่จำเป็นต้องรีบเรียนรู้ตั้งแต่เด็กหรอกนะ”\n\nชายคนนี้มักจะใช้ถ้อยคำที่เข้าใจยากอยู่เป็นบางครั้ง เพราะมันดูภูมิฐานมีระดับ เอคไดซิสจึงแอบชื่นชมเขาอยู่ในใจเงียบๆ\n\nเด็กๆ มักจะคิดว่าคำศัพท์ยากๆ นั้นดูเท่เสมอ\n\n“เอคไดซิส เหตุผลที่พ่อของเธอกับฉันกวัดแกว่งขวาน แม็กซิมิเลียนกับจิลแบร์แบกดาบ ท่านนักบุญคอยประคองชีวิตพวกเราไว้ และเอนริเก้ยอมเสี่ยงชีวิตแทรกซึมแนวหลังศัตรู ทั้งหมดนี้ก็เพื่อเหตุผลเดียวเท่านั้นแหละ”\n\n“อะไรเหรอคะ?”\n\n“พวกเราหวังว่าพวกเราจะเป็นรุ่นสุดท้าย”\n\nชายคนนั้นกุมขวานไว้ข้างกองไฟ พลางแยกเขี้ยวกัดฟันแน่นจนแทบจะแตกหัก\n\n“ชีวิตที่ต้องเข่นฆ่าศัตรูทุกเมื่อเชื่อวันเพื่อเอาชีวิตรอด พวกเราหวังว่าชีวิตแบบนั้นมันจะจบลงที่พวกเรา เพื่อเธอ เพื่อพี่น้องของเธอ และเพื่อเด็กๆ อีกมากมายที่อยู่เบื้องหลังพวกเรา และพวกเราก็หวังว่าลูกหลานของเด็กๆ เหล่านั้น จะได้ถือคันไถ ไม่ใช่ถืออาวุธ”\n\nสงครามจะต้องไม่ยืดเยื้ออีกต่อไป โครงสร้างของสหราชอาณาจักรไม่อาจทานทนต่อสงครามครั้งใหม่ได้อีกแล้ว\n\nไม่ควรมีสงครามใดที่ยาวนานเกินหนึ่งชั่วอายุคน ต่อให้ได้รับชัยชนะหลังจากนั้น มันก็ไม่อาจนับเป็นชัยชนะที่แท้จริงได้\n\nคนรุ่นพวกเขาคือขีดจำกัดสุดท้ายที่ชีวิตจะยังดำรงอยู่เพื่อผู้คน และประเทศชาติจะยังคงทำหน้าที่เป็นรัฐชาติต่อไปได้\n\nด้วยความหมายเช่นนั้น ชายคนนั้นจึงวางขวานลงอย่างเงียบเชียบ\n\n“เพราะฉะนั้น อย่าโตมาเป็นเหมือนพ่อของเธอเลยนะ”\n\n“เอ่อ… อืม แล้วหนูควรทำอะไรดีล่ะคะ? หนูน่ะ เอ่อ… ใช้ขวานเก่งนะ!”\n\n“งั้นเหรอ โตขึ้นอีกหน่อยคงทำให้พวกเราตกใจน่าดูเลยสิ แต่ถึงอย่างนั้น ถ้าเป็นไปได้ ก็ลองจับถืออย่างอื่นที่ไม่ใช่ขวานดูบ้างเถอะ”\n\n“หนูเย็บปักถักร้อยไม่ค่อยเก่งเท่าไหร่…”\n\n“ก็ไม่จำเป็นต้องเย็บผ้าหรอก อืม”\n\nชายคนนั้นมองเอคไดซิสด้วยสีหน้าครุ่นคิด เนื่องจากเขาไม่ใช่คนพูดจาคล่องแคล่ว จึงไม่มั่นใจนักว่าจะให้คำแนะนำที่เหมาะสมแก่เด็กน้อยคนนี้ได้อย่างไร\n\nเขาลูบคางอยู่ครู่หนึ่งก่อนจะเอ่ยขึ้นว่า\n\n“ถ้าต้องถืออะไรสักอย่าง เลือกเครื่องดนตรีจะดีกว่านะ”\n\n“เครื่องดนตรีเหรอคะ?”\n\n“อาวุธใช้เข่นฆ่าผู้คน แต่ดนตรีช่วยชีวิตผู้คนได้”\n\nก้าวข้ามผ่านพรมแดน วัฒนธรรม และภาษา ดนตรีอันยอดเยี่ยมโดยตัวมันเองจะกลายเป็นสะพานเชื่อมโยงผู้คนเข้าไว้ด้วยกัน\n\nหากยุคสมัยแห่งสันติภาพมาเยือน หนึ่งในสิ่งที่จำเป็นมากที่สุดย่อมต้องเป็นเครื่องดนตรีอย่างแน่นอน\n\nเอคไดซิสจ้องมองชายคนนั้นอย่างเหม่อลอย เส้นผมสีถ่าน ดวงตาสีฟ้าเข้มล้ำลึก และสีหน้าอันสุขุมเยือกเย็นยามจ้องมองกองไฟ\n\nบุรุษผู้เปี่ยมด้วยปณิธานคนนั้นคือบุคคลที่เด็กหญิงเฝ้าเทิดทูนชื่นชม\n\n“คุณลุงคะ เครื่องดนตรีที่คุณลุงชอบที่สุดคืออะไรเหรอคะ?”\n\n“อืม ฉันเองก็ไม่ค่อยรู้จักเครื่องดนตรีของโลกนี้เท่าไหร่หรอกนะ”\n\nเขาลูบคางอย่างเก้อเขิน มันเป็นนิสัยติดตัวเวลาจมอยู่ในห้วงความคิด\n\nอา แต่ดูเหมือนจะมีเครื่องดนตรีอย่างหนึ่งที่มีเหมือนกัน ชายคนนั้นหัวเราะเบาๆ ขณะนึกย้อนไป เนื่องจากการถูกเกณฑ์ทหารทำให้เขาต้องใช้เวลาถึงสิบปีอยู่ในสมรภูมิ จึงไม่ค่อยได้สัมผัสกับเครื่องดนตรีบ่อยนัก\n\nบางทีอาจจะเป็นเครื่องดนตรีที่เขาเคยเห็นตอนที่มหาราชของพวกเราจัดงานเฉลิมฉลอง มันเป็นเครื่องดนตรีที่คล้ายคลึงกันและมีชื่อเรียกเดียวกันในโลกนี้\n\n“น่าจะเป็นไวโอลินล่ะมั้ง…?”\n\n“ไวโอลินเหรอคะ?”\n\n“อืม”\n\nเอคไดซิสทวนชื่อนั้นซ้ำไปซ้ำมาหลายครั้ง เพื่อสลักมันลงในความทรงจำ\n\nสิบปีล่วงเลยผ่านไปนับจากวันนั้น ตลอดช่วงเวลาดังกล่าว เธอแปรเปลี่ยนจากบุตรสาวของยอดนักรบ มาเป็นธิดาขององค์มหาราช\n\nโลกได้ก้าวเข้าสู่ยุคสมัยที่มหาราชของพวกเราไม่จำเป็นต้องปกครองอาณาจักรด้วยขวานอีกต่อไป มันกลายเป็นยุคสมัยที่วาทศิลป์จำเป็นยิ่งกว่าอาวุธ และการทูตกับทองคำจำเป็นยิ่งกว่าวาทศิลป์\n\nดังที่คุณลุงเคยกล่าวไว้ โลกที่ไม่ต้องการอาวุธอีกต่อไปได้มาถึงแล้ว\n\nเอคไดซิสหยิบไวโอลินขึ้นมา อดทนบากบั่นฝึกฝนแม้พ่อแม่จะคัดค้านด้วยความห่วงใยและเหล่าคุณลุงคนอื่นจะคอยวิพากษ์วิจารณ์ กำนิ้วลงบนฟิงเกอร์บอร์ดจนมือฟกช้ำ ดึงคันชักจนข้อมือเคล็ด\n\nเพื่อรำลึกถึงคุณลุงผู้ล่วงลับไปในสงครามในท้ายที่สุด เธอตั้งใจว่าสักวันหนึ่งจะต้องไปเยือนและทิ้งบทเพลงไว้อาลัยที่สมบูรณ์แบบที่สุดเอาไว้ให้ได้\n\nเธอได้ยินมาว่าอัฐิของคุณลุงถูกฝังไว้ที่สุสานแห่งชาติคราซิลอฟแห่งเฟรเชนกายา\n\nและในคราซิลอฟ ก็มีมหาวิทยาลัยดนตรีอันทรงเกียรติอันดับหนึ่งของทวีปตั้งอยู่\n\nการที่เธอได้เข้าเรียนที่สถาบันเซนต์ยันจึงไม่ต่างอะไรกับโชคชะตาเลยแม้แต่น้อย\n\nดังนั้น เธอจะไม่มีวันยอมแพ้ ไม่มีวันเป็นอันขาด\n\n***\n\nเอคไดซิสเช็ดน้ำตาจนแห้งสนิท ลุกขึ้นยืน และเดินออกจากอาคารภาควิชาออร์เคสตรา\n\nคาบเรียนในวันนี้ถูกนับว่าเป็นการขาดเรียนโดยพลการ ทว่าเธอก็มีพื้นที่เพียงพอสำหรับการฝึกซ้อมที่บ้านอยู่แล้ว\n\nเธอจะไม่มีวันยอมแพ้\n\n“เครื่องดนตรีคือสะพานเชื่อมโยงผู้คน…”\n\nไม่มีวัน\n\n***\n\n“มอร์ด” (อีวาน)\n\n“อะไร?” (มอร์ด)\n\n“นายกลับไปได้แล้วล่ะ” (อีวาน)\n\n“…ว่าไงนะ?” (มอร์ด)\n\nอีวานเหลือบมองเสื้อผ้าฉีกขาดจำนวนมากที่มอร์ดทำพังอย่างเงียบเชียบ\n\n“ระหว่างที่นายมาทำงานอาสาสมัครที่สถานเลี้ยงเด็กกำพร้าของฉัน ความเสียหายทางการเงินของสถานเลี้ยงเด็กกำพร้ากลับเพิ่มขึ้นอย่างมีนัยสำคัญ”\n\n“…อึก…!”\n\n“นายรู้ไหมว่าการซักผ้าจนผ้าฉีกขาดมันไม่ได้เรียกว่าการซักผ้า แต่เรียกว่าการทำลายข้าวของน่ะ?”\n\n“อึก…”\n\nมอร์ดเม้มริมฝีปากและหลบสายตาของอีวาน\n\nทว่าเขาก็มีข้อแก้ตัวที่จะโต้กลับอยู่เหมือนกัน\n\n“ขะ… ข้าไม่เคยซักผ้ามาก่อนในชีวิตเลยนี่หว่า!”\n\n“ต่อให้เป็นคนที่ไม่เคยซักผ้ามาก่อนในชีวิตเลย ก็น่าจะพอซักกางเกงในเด็กให้รอดได้ภายในสองเดือนมั้ง”\n\n“อึก…!!”\n\nอีวานไม่แยแสต่อมอร์ดที่กำลังเจ็บปวดทางใจและเดินหน้าต่อไป\n\nแผนการกักตัวมอร์ดเอาไว้เพื่อจับตาดูความเคลื่อนไหวของสายลับที่โดรเวียนส่งมาหวังจะล่วงรู้เจตนาของพวกมันถูกยกเลิกไปแล้ว\n\nตราบใดที่มีข้อมูลว่ามีใครบางคนในหมู่ “สายลับที่โดรเวียนส่งมา” กำลังหมายเอาชีวิตเอคไดซิส ก็ไม่มีเหตุผลอะไรที่จะต้องกักตัวมอร์ดเอาไว้อีกต่อไป\n\nมอร์ดเป็นคนซื่อบื้ออยู่บ้าง แต่อย่างน้อยเขาก็ห่วงใยเอคไดซิสอย่างจริงใจ เขาคือหนึ่งในข้ารับใช้ผู้จงรักภักดีของกษัตริย์ไอนาร์\n\nเพื่อความปลอดภัยของเอคไดซิส มอร์ดจำเป็นต้องกลับมาทำหน้าที่ของตนเองอีกครั้ง เขาไม่ได้เข้ามาสมัครเรียนในมหาวิทยาลัยเพื่อมานั่งเข้าเรียนในคณะอัศวินเสียหน่อย\n\nหน้าที่ของเขาคือการคุ้มครองเอคไดซิส\n\n“และถ้ามอร์ดอยู่ข้างกายเอคไดซิส จะต้องมีใครบางคนติดต่อเข้ามาหาเขาอย่างแน่นอน”\n\nตราบใดที่มีมอร์ดคอยอารักขาอยู่ ความปลอดภัยของเอคไดซิสย่อมมั่นคง หากมีใครสักคนจากโดรเวียนพยายามติดต่อมอร์ดเพื่อแยกตัวเขาออกไปจากเอคไดซิส อีวานก็จะแกะรอยการติดต่อนั้นแล้วกำจัดต้นตอให้สิ้นซาก\n\nอีวานจ้องมองชายวัยกลางคนที่เดินออกจากสถานเลี้ยงเด็กกำพร้าไปด้วยสีหน้าเศร้าสร้อยอยู่ครู่หนึ่งก่อนจะหันหน้ากลับไป"
    },

      "title": "บทที่ 49",
      "content": "คมดาบโปรยปรายแสงจันทร์ยามฟาดฟันลงมา ปักแน่นด้วยพละกำลังอันมหาศาลและท่วงท่าอันไร้ที่ติ\n\n“ยอดเยี่ยม” อีวานพยักหน้า ปัดป้องด้วยขวานแล้วคว้าคมดาบเอาไว้\n\n– เคร้ง!\n\nใบขวานที่เกี่ยวติดอยู่ตรงปลายสะบัดหลุดจากวิถีแล้วร่วงกระทบพื้นดังกังวาน อีวานยกคมดาบที่ปักคาพื้นขึ้นมาพลางประเมินสถานการณ์\n\n“เมื่อกี้เป็นยังไงบ้างคะ?”\n\n“ดีมากทีเดียว”\n\n“ฮ่าๆ เห็นไหมคะ? หนูบอกแล้วว่าหนูเรียนรู้ไวจะตาย จริงไหมคะ?”\n\n“แน่นอน”\n\nอีวานพยักหน้ารับแล้วโยนดาบคืนไป\n\nอิซาเบลล์รับดาบที่หมุนคว้างกลางอากาศได้อย่างคล่องแคล่วพลางแย้มยิ้ม\n\n“ถ้าให้ประเมิน คิดว่ายังไงบ้างคะคุณลุง? เทียบกับท่านพ่อสมัยอายุเท่าหนูแล้วเป็นไงบ้างคะ”\n\n“ถ้าเอาไปเทียบกับแม็กซิมิเลียน ไม่ว่าใครในทวีปนี้ก็เทียบไม่ติดหรอก”\n\nอีวานหัวเราะเบาๆ กับคำพูดอันห้าวหาญของอิซาเบลล์\n\nเขาเดินเข้าไปหาอิซาเบลล์ที่กำลังทำแก้มป่องบ่นพึมพำ พาดผ้าขนหนูลงบนลำคอที่ชุ่มเหงื่อของเธอ แล้ววางมือลูบศีรษะเบาๆ\n\n“อย่ามัวแต่หลงทางอยู่ในเงาของคนที่เดินนำหน้าไปก่อน”\n\n“โห คำพูดคมจังเลย! คุณลุงคิดคำนี้ขึ้นมาเองเหรอคะ?”\n\n“เปล่า เอนริเก้เป็นคนพูดน่ะ”\n\nถ้อยคำที่เคยเอ่ยแก่ ‘อีวานตัวน้อย’ ผู้ครั้งหนึ่งเคยจมดิ่งอยู่ใต้เงาขององค์สุริยราชา\n\nการชื่นชมใครสักคนเป็นเรื่องธรรมดา โลกใบนี้กว้างใหญ่ไพศาล และมีผู้คนผู้ยอดเยี่ยมอยู่มากมาย\n\nทว่าการพยายามเลียนแบบพวกเขาทีละคนๆ ย่อมลงเอยด้วยการเป็นเพียงการเลียนแบบอันเก้ๆ กังๆ เท่านั้น\n\nเอนริเก้เคยบอกอีวานเอาไว้ และบัดนี้อีวานก็นำมาบอกต่อแก่อิซาเบลล์\n\nอย่ามัวแต่หลงทางอยู่ในเงาของคนที่เดินนำหน้าไปก่อน จงก้าวเดินไปบนเส้นทางของตนเอง\n\n“อืม เป็นคำพูดที่ดีนะคะ แต่ไม่รู้ทำไมมันถึงดูไม่ค่อยเข้ากับภาพลักษณ์ของศาสตราจารย์เอนริเก้เท่าไหร่เลย!”\n\n“สมัยนั้น เอนริเก้เป็นคนที่จริงจังมากนะ”\n\n“แล้วคุณลุงล่ะคะ? สมัยนั้นก็พูดแต่คำว่า ‘อืม’ ‘จริงด้วย’ ‘ไม่’ ‘ยุ่งอยู่’ แค่นี้เหรอคะ?”\n\n“ก็….”\n\nย้อนกลับไปในวันวานเหล่านั้น\n\nอีวานลูบคางครุ่นคิดอยู่ครู่หนึ่ง\n\n“ก็ไม่ต่างกันเท่าไหร่หรอก”\n\n“น่าเบื่อชะมัด! ฮึ่ย จริงๆ เลยค่ะ อารมณ์ขันของคุณลุงตายตามไปในสงครามด้วยหรือไงคะ? ในหัวใจของคุณลุงมีอะไรอยู่กันแน่คะ? ให้หนูเดานะ ขวาน กับโพชั่นรักษาบาดแผล?”\n\n“ไร้สาระ”\n\nอีวานหัวเราะหึๆ ยีผมของอิซาเบลล์หนึ่งทีก่อนจะลุกขึ้นยืน\n\nนับตั้งแต่เหตุการณ์ก่อการร้ายในการฝึกภาคสนาม อีวานก็คอยจับตาดูอิซาเบลล์และจัดฝึกซ้อมพิเศษให้เธอทุกค่ำคืน\n\nความสัมพันธ์แบบศิษย์อาจารย์นี้คงต้องพิจารณากันอีกที หากว่ากันตามจริงแล้ว อิซาเบลล์ต่างหากที่เป็นฝ่ายมาคว้าตัวอีวานไว้และขอร้องให้ช่วยฝึกให้\n\nมันคือสิ่งที่เรียกกันว่า ‘ขอบเขตของผู้เหนือมนุษย์’ การฝึกฝนพิเศษเพื่อก้าวไปให้ถึงระดับนั้น\n\n“เอาล่ะ ไปขั้นตอนต่อไปกันเลยค่ะ เร็วๆ เข้า เร็วเข้า”\n\n“ได้สิ”\n\nอิซาเบลล์นั่งขัดสมาธิลงบนพื้นหญ้า ผ่อนลมหายใจออกอย่างเงียบเชียบ “รีบๆ เอามือมาแตะตัวหนูสิคะ” เธอเอ่ยขึ้น\n\n“มาถึงขั้นนี้แล้ว ก็ไม่จำเป็นต้องทำแบบนั้นหรอก” อีวานตอบ\n\n“โธ่ น่านะคะ หนูยังไม่ชินเลยนี่นา” อิซาเบลล์คะยั้นคะยอ\n\nขอบเขตของผู้เหนือมนุษย์เริ่มต้นจากการหมุนเวียนพลังเวทเพื่อเสริมความแข็งแกร่งให้ระบบประสาท ฝึกฝนความรู้สึกในการส่งผ่านพลังเวทไปยังส่วนต่างๆ ของร่างกาย ในช่วงแรก อีวานช่วยตรวจสอบการไหลเวียนของพลังเวทให้เธอด้วยการวางมือลงบนแผ่นหลัง แล้วถ่ายเทพลังเวทเข้าไปชี้นำทางให้\n\n“อืม…”\n\n“หุบปากแล้วตั้งสมาธิจดจ่อกับความรู้สึกซะ”\n\n“แต่ว่ามันอุ่นดี… นี่คะ…”\n\nแม้ในขณะที่อีวานกำลังถ่ายเทพลังเวทให้ อิซาเบลล์ก็ถอนหายใจออกมาเบาๆ\n\n“ช่วงนี้ทั้งยูริทั้งเอซี่ต่างก็ยุ่งกันหมด หนูเลยไม่มีเพื่อนมานั่งผ่อนคลายด้วยเลยค่ะ…”\n\n“นี่ไม่ใช่เวลาพักผ่อนหย่อนใจนะ”\n\n“แต่ก็ใช่ไม่ใช่เหรอคะ? เวลาพักผ่อนไง”\n\nอิซาเบลล์หรี่ตาลงแล้วช้อนสายตาขึ้นมองอีวาน พลางประเมินท่าทีของเขาอย่างซุกซน\n\n“สรุปว่าตอนนี้คุณลุงก็ไม่ได้กำลังทำงานอยู่สินะคะ?”\n\n“ฉันกำลังฝึกเธออยู่”\n\n“นั่นมันก็แค่ข้ออ้างไม่ใช่เหรอคะ? จริงๆ คุณลุงก็แค่อยากจะอู้งานพักผ่อนเหมือนกันนั่นแหละ ช่วงหลังๆ มานี้รู้สึกเหมือนสิ่งที่พวกเราทำอยู่มันเหมือนการเล่นสนุกมากกว่าฝึกซะอีก”\n\n“เห็นทีฉันคงต้องประเมินระดับความเข้มข้นในการฝึกของพวกเราเสียใหม่แล้วล่ะมั้ง”\n\nอีวานชะงักไปเล็กน้อย พลางตั้งคำถามในใจว่าการอบรมสั่งสอนอันเข้มงวดของตนกำลังถูกบ่อนทำลายอยู่หรือไม่\n\nเมื่อสังเกตเห็นปฏิกิริยาของเขา อิซาเบลล์ก็ถอนหายใจออกมา พลางมองเขาด้วยสายตาราวกับกำลังมองดูสิ่งที่น่าเวทนา เธอบิดขี้เกียจแล้วยันกายลุกขึ้นยืน\n\n“ช่างเถอะค่ะ” เธอเอ่ยขึ้น “หนูจำใส่ใจไว้แล้วล่ะ”\n\n“อืม”\n\n“อ้อ จริงสิ คุณลุงยังคงทำงานเป็นสายลับอยู่ใช่ไหมคะ? ช่วงนี้หนูได้ยินเรื่องแปลกๆ มาน่ะค่ะ”\n\n“เรื่องแปลกๆ เหรอ?”\n\n“ค่ะ! ไอ้เรื่องที่คุณลุงไม่เคยยอมเล่าให้ฟังนั่นแหละค่ะ เซอร์ดิอันบอกว่าเมื่อไม่กี่วันก่อนเห็นผู้ชายท่าทางแปลกๆ มาวนเวียนอยู่หน้าบ้านของพวกเราน่ะค่ะ”\n\n“ผู้ชายท่าทางแปลกๆ?”\n\n“ค่ะ! หมอนั่นยืนจ้องมองบ้านของพวกเราจากหลังกำแพงอยู่พักใหญ่ พอเขาเดินตามไปดูว่าหมอนั่นคิดจะทำอะไร อีกฝ่ายก็หนีรอดไปได้เฉยเลย”\n\nอีวานขมวดคิ้วมุ่นกับคำบอกเล่าของเธอ\n\nดิอัน ออกัสต์ องครักษ์ที่ราชวงศ์ทิลีสจัดส่งมาคุ้มครองเธอโดยเฉพาะ\n\nการปล่อยให้ใครบางคนหลุดรอดสายตาไปได้ต่อหน้าต่อตาเช่นนั้น… ย่อมไม่ใช่เรื่องที่จะคาดหวังได้จากคนระดับนักศึกษาหรือพลเรือนทั่วไปแน่\n\n“ไม่ใช่พวกพ้องของคุณลุงใช่ไหมคะ?”\n\n“ไม่ใช่”\n\nกองบัญชาการข่าวกรองไม่ได้ปฏิบัติงานด้วยวิธีการแบบนั้น\n\n“ฉันจะไปตรวจสอบดูเอง ไม่ต้องกังวลไปหรอก”\n\n“แต่ว่า… ถ้ามีคนมาคอยเฝ้าดูบ้านของหนูอยู่ จะไม่ให้หนูกังวลได้ยังไงคะ?”\n\n“นั่นเป็นหน้าที่ของฉัน นักศึกษาก็ควรตั้งใจเรียนหนังสือไป”\n\n“เอ่อ…”\n\nบางครั้ง คำพูดแบบนี้มันก็หลุดออกมาเองโดยไม่รู้ตัว\n\nอิซาเบลล์จ้องมองแผ่นหลังของอีวานที่เดินจากไปอยู่ครู่หนึ่ง ก่อนจะถอนหายใจออกมาเฮือกใหญ่\n\nไม่ง่ายเลย จริงๆ นะ\n\nเธอยิ้มมุมปากอย่างอ่อนใจพลางกำผ้าขนหนูรอบคอเอาไว้แน่น\n\nอิซาเบลล์กำลังถูกใครบางคนจับตาดูอยู่\n\nย่อมไม่ใช่ฝีมือของกองบัญชาการข่าวกรองอย่างแน่นอน พวกเขาไม่ได้ปฏิบัติการในลักษณะนั้น อีกทั้งอิซาเบลล์และบรรดาผู้เกี่ยวข้องกับปาร์ตี้ผู้กล้าก็อยู่ในเขตความรับผิดชอบของอีวาน\n\nดมิทรีไม่มีทางทำอะไรที่จะเป็นการรบกวนการทำงานของเขาเด็ดขาด\n\nอีวานเดินไปตามท้องถนนอย่างครุ่นคิด\n\n– มีใครบางคน หรือกลุ่มคนบางกลุ่ม กำลังจับตาดูปาร์ตี้ผู้กล้าอยู่\n\n– หนึ่งในสายลับทั้งห้าของโดรเวียนพยายามก่อเหตุวางระเบิดที่สถาบัน\n\nความเชื่อมโยงระหว่างเหตุการณ์ทั้งสองนี้คืออะไรกันแน่? กรณีหลังนั้นย่อมเป็นการหมายเอาชีวิตเอคไดซิสอย่างไม่ต้องสงสัย\n\nหากเอคไดซิสเสียชีวิตหรือได้รับบาดเจ็บ กษัตริย์ไอนาร์ย่อมต้องเคลื่อนไหวทันที\n\nและไอนาร์กับเหล่าพี่น้องร่วมสาบานของเขาก็ครอบครองขุมกำลังที่แข็งแกร่งที่สุดบนแผ่นดินใหญ่โดรเวียนในเวลานี้ หากพวกเขาเคลื่อนพล โดรเวียนก็แทบจะไม่ต่างอะไรจากเมืองร้าง\n\nหนึ่งในสายลับพวกนั้นกำลังเล็งเป้าไปที่จุดนี้อยู่ เป็นไปได้ว่ามันคือแผนการโค่นล้มราชบัลลังก์ในช่วงที่ไอนาร์ไม่อยู่\n\n‘อิซาเบลล์มีส่วนเกี่ยวข้องกับเรื่องนี้ด้วยหรือเปล่า?’\n\nอาจจะเป็นการคิดมากเกินไป บางทีมันอาจเป็นคนละเหตุการณ์ที่ไม่เกี่ยวข้องกันเลยก็ได้\n\nทว่าอีวานกลับรู้สึกตะขิดตะขวงใจเกี่ยวกับบางสิ่ง และสัญชาตญาณของเขาก็ถูกหล่อหลอมมาตลอดระยะเวลากว่ายี่สิบปีท่ามกลางสมรภูมิสงคราม\n\n‘ตราบใดที่มอร์ดยังอยู่ ตอนกลางคืนเอคไดซิสก็ปลอดภัย’\n\nมอร์ดสำเร็จการศึกษาจากงานอาสาสมัครที่สถานเลี้ยงเด็กกำพร้าและกลับไปทำหน้าที่องครักษ์ส่วนตัวของเอคไดซิสเรียบร้อยแล้ว\n\nตราบใดที่หมอนั่นยังอยู่ ต่อให้เกิดเหตุการณ์ไม่คาดฝันขึ้น ก็ยังมีเวลาเหลือเฟือพอที่จะรอให้อีวานไปถึงได้ทันท่วงที\n\nฉะนั้น เขาจึงต้องคอยจับตาดูสถานการณ์หลังพระอาทิตย์ตกดินอย่างไม่อาจวางใจได้\n\n‘ตอนกลางวันเฝ้าดูเอคไดซิส ส่วนตอนกลางคืนคอยจับตาดูอิซาเบลล์’\n\nอีวานจัดตารางเวลาของตนให้เข้าที่แล้วมุ่งหน้าไปยังห้องทำงาน\n\nเขาไม่เคยคิดมาก่อนเลยว่าเรื่องนี้จะเป็นงานง่ายตั้งแต่ต้น การตามล่าหาตัวคนร้ายที่กองบัญชาการข่าวกรองไม่สามารถจับตัวได้ภายในสองเดือนย่อมเป็นภารกิจที่ท้าทาย\n\nแม้กองบัญชาการข่าวกรองอาจจะไม่ได้ทุ่มเทสรรพกำลังทั้งหมดให้กับคดีนี้ ทว่าการสืบสวนสิ่งที่หน่วยงานระดับชาติยังจัดการไม่ได้ย่อมไม่ใช่เรื่องง่ายสำหรับคนเพียงคนเดียว\n\nทว่า เช่นเดียวกับทุกครั้ง\n\nทำได้ หรือทำไม่ได้? คำถามนั้นหาได้สลักสำคัญไม่\n\nสำหรับหน่วยเก็บกวาด มีเพียงข้อเสนอเดียวเท่านั้น\n\nควรทำ หรือไม่ควรทำ?\n\nหากสมควรต้องทำ ก็ไม่มีความลังเลใดๆ แค่ลงมือทำเสียก็สิ้นเรื่อง\n\nอีวานปลดกับดักระเบิดที่ขึงไว้ภายในห้องทำงานออกทีละจุด ก่อนจะกลับไปนั่งที่โต๊ะทำงานและเปิดโคมไฟเวทมนตร์\n\nจวบจนดึกดื่นค่อนคืน เสียงของการจัดเรียงรายงานและการจัดการบัญชีรายรับรายจ่ายยังคงดังต่อเนื่องอยู่ภายในห้องทำงาน\n\nเอคไดซิสเดินข้ามลานกว้างมุ่งหน้าไปยังม้านั่ง\n\nม้านั่งข้างลานฝึกกลางแจ้งของคณะอัศวินคือแหล่งกบดานประจำของเอคไดซิส อิซาเบลล์ และยูริ ซึ่งเป็นที่ที่พวกเธอมักจะมานั่งกินมื้อกลางวันด้วยกันเสมอ\n\nวันนี้ก็เป็นอีกวันที่เหน็ดเหนื่อยเหลือเกิน วิชาเรียนก็แสนยากลำบาก เพื่อนร่วมชั้นก็เฉยเมย และโลกใบนี้ก็ช่างโหดร้าย\n\nเอคไดซิสเดินถือถุงอาหารกลางวันแน่นเข้าใกล้ม้านั่ง ก่อนจะชะงักแข็งทื่อไปในทันที\n\n“อ้าว เอซี่! วันนี้มาเร็วกว่าปกตินิดหน่อยนะ!” (อิซาเบลล์)\n\n“อะ อะไร…? นี่มัน…? นี่มันเกิดเรื่องอะไรขึ้นเนี่ย…? หมายถึง…?” (เอคไดซิส)\n\n“อ้อ ทักทายสิ! ตั้งแต่วันนี้เป็นต้นไป พวกเราตัดสินใจว่าจะมากินข้าวกลางวันด้วยกันน่ะ เธอยังไม่เคยเจอเขาเลยใช่ไหม? นี่คุณลุงอีวานไง!”\n\nอิซาเบลล์หัวเราะร่าเริงอย่างเปี่ยมพลังพลางตบหลัง ‘เขา’ ปุๆ\n\n“ยังไงก็ตาม ชวนมากินข้าวด้วยกันยากแสนยาก แต่พอวันนี้ฉันลองชวนดู เขาก็ตอบตกลงเฉยเลย ขอบคุณที่อุตส่าห์สละเวลาอันมีค่ามานะคะ…” (อิซาเบลล์)\n\nอิซาเบลล์พูดจ้อไม่หยุดด้วยอารมณ์เบิกบาน เอคไดซิสแทบจะไม่ได้ยินเสียงของเพื่อนเลยสักนิด\n\nเธอจ้องมองอีวานอย่างเหม่อลอย จากนั้นจึงเบนสายตาไปยังยูริที่นั่งอยู่ข้างๆ เขา\n\n– นี่มันเรื่องอะไรกันน่ะ?\n\n– ฉันเองก็สงสัยเหมือนกัน\n\nปกติสตอล์กเกอร์ไม่ใช่พวกที่คอยหลบซ่อนตัวอยู่ห่างๆ เพื่อระบายความปรารถนาอันมืดมนแบบลับๆ ล่อๆ หรอกเรอะ? แล้วทำไมหมอนี่ถึงได้กล้าทำตัวโจ่งแจ้งขนาดนี้…?\n\nเธอค่อยๆ หย่อนตัวนั่งลงบนม้านั่งอย่างระมัดระวัง หยิบกล่องข้าวออกมา จากนั้นเมื่อเหลือบมองอีวานที่กำลังหยิบกล่องข้าวของตนเองออกมาอย่างเงียบเชียบข้างตัวอิซาเบลล์ เธอก็ส่งสายตาไปหายูริอีกครั้ง\n\n– เกิดอะไรขึ้นตรงนี้กันแน่?\n\n– ฉันเองก็สงสัยเหมือนกัน\n\nเบลล่าชอบหมอนี่ขนาดนี้ เขายังคิดจะมาหว่านเสน่ห์ใส่ผู้หญิงคนอื่นอีกงั้นเหรอ?\n\nแถมวิธีจีบยังเป็นการคอยสะกดรอยตามอีก…? ให้ตายสิ นี่มันแย่ที่สุดเลย\n\nครู่ต่อมา อีวานซึ่งตกอยู่ภายใต้สายตาจ้องมองของเอคไดซิสมาพักใหญ่ก็พลันเงยหน้าขึ้น\n\nในจังหวะที่สายตาของทั้งคู่สบประสานกันชั่วครู่ ประจวบเหมาะกับตอนที่เอคไดซิสเริ่มรู้สึกกระสับกระส่ายจนต้องก้มหน้าหลบตา\n\n“…?”\n\nมีบางสิ่งบางอย่างโผล่ขึ้นมาวางอยู่บนกล่องข้าวของเธอ แปดเปื้อนแซนด์วิชไก่อันแสนล้ำค่าของเธอเข้าอย่างจัง\n\n“นี่มันอะไร…? อะ อะไรเนี่ย?” (เอคไดซิส)\n\n“ผัก” (อีวาน)\n\nอีวานหยิบกล่องข้าวขึ้นมาพลางอธิบายให้อิซาเบลล์และยูริฟัง โดยยื่นเมนูอาหารที่แตกต่างกันให้พวกเธอ\n\n“ปกติพวกเธอกินแต่คาร์โบไฮเดรตกับโปรตีน… ขนมปังกับเนื้อสัตว์ มันเป็นพฤติกรรมการกินที่ทำให้สมดุลทางโภชนาการเสียได้ง่าย ควรเพิ่มผัก ผลไม้ และถั่วเข้าไปในมื้ออาหารด้วย”\n\nอีวานซึ่งเป็นคนละเอียดอ่อนและเอาใจใส่ผู้อื่น อธิบายด้วยถ้อยคำที่เข้าใจง่ายแม้กระทั่งสำหรับเด็กในสังคมยุคก่อนสมัยใหม่\n\nเขาเป็นผู้ดูแลสถานเลี้ยงเด็กกำพร้า และสถานเลี้ยงเด็กกำพร้าโดยความหมายตรงตัว ก็คือสถานที่ที่เด็กผู้สูญเสียพ่อแม่จะได้รับการดูแล อบรมสั่งสอน และเลี้ยงดูให้เติบโต\n\nการจัดเตรียมมื้ออาหาร การบริหารตารางเวลาพักผ่อนและการเรียน รวมถึงการดึงศักยภาพ งานอดิเรก และคุณลักษณะที่ดีของเด็กออกมาให้ถึงขีดสุด ล้วนเป็น ‘งานหลัก’ ของอีวาน\n\nด้วยความภาคภูมิใจลึกๆ อย่างบอกไม่ถูก อีวานจึงแบ่งปันอาหารกลางวันของตนให้แก่ยูริและอิซาเบลล์ด้วยเช่นกัน\n\n“ว้าว สุดยอดเลย! ขอบคุณค่ะคุณลุง! ถ้ารู้ล่วงหน้า หนูคงเตรียมอะไรมาด้วยแล้ว หนูทำอาหารเก่งมากเลยนะคะ ว่าแต่ คุณลุงคิดยังไงกับผู้หญิงที่ทำอาหารเก่งเหรอคะ?” (อิซาเบลล์)\n\n“ฉันคิดว่าเธอทำอาหารเก่งดีนะ”\n\n“อยากจะฆ่าหมอนั่นให้ตายจริงๆ….”\n\nในขณะที่อิซาเบลล์ชวนคุยจ้ออย่างร่าเริง เอคไดซิสกลับจ้องมองอีวานด้วยดวงตาที่เปี่ยมไปด้วยความหวาดผวา\n\n‘นี่เขาสอดแนมกระทั่งเมนูอาหารที่ฉันกินในแต่ละวันเลยเหรอ…?’"

      "title": "บทที่ 50",
      "content": "ตรงกันข้ามกับความเข้าใจผิดของผู้คนมากมาย อีวานเป็นคนที่ยึดหลักปฏิบัติจริงอย่างยิ่งยวด\n\nเฉกเช่นเดียวกับที่เหตุก่อการร้ายในพิธีปฐมนิเทศของสถาบันถือเป็นเรื่องสามัญสำนึก โลกใบนี้กลับเต็มไปด้วยผู้คนที่ไร้สามัญสำนึกและคอยตั้งข้อสงสัยในสามัญสำนึกเช่นนั้น ประหนึ่งพลเมืองยุคก่อนสมัยใหม่ผู้ไร้อารยะ\n\nทว่า อีวานไม่ได้ตำหนิติเตียนคนเหล่านั้น นั่นเป็นเพราะเขาคือคนยุคใหม่ผู้มีวัฒนธรรมและเปิดกว้างทางความคิด\n\nแต่เขากลับคว้าขวานและปืนพกขึ้นมาแทน\n\nโดยส่วนใหญ่แล้ว การลงมือปฏิบัติจริงย่อมช่วยคลี่คลายสถานการณ์ได้ดีกว่าการหว่านล้อมด้วยคำพูด\n\nนี่คือชนวนเหตุที่ทำให้อีวานเข้าไปพัวพันกับเหตุวางระเบิดครั้งใหญ่ในเฟรเชนกายา\n\nเรื่องราวทั้งหมดเริ่มต้นขึ้นจากการสะกดรอยตามเอคไดซิสตามปกติ\n\nเช่นเคย อีวานกำลังเดินตามเอคไดซิสอยู่ การสะกดรอยตามเป็นไปอย่างสมบูรณ์แบบ เป้าหมายปลอดภัยดี และไม่มีภัยคุกคามอื่นใดอยู่รอบข้าง มันเป็นเพียงวันธรรมดาอีกวันหนึ่งเท่านั้น\n\n“อืม…”\n\nเธอกินคุกกี้บ่อยเกินไป อีวานตัดสินใจใช้โอกาสนี้เพื่ออธิบายถึงปัญหาทั่วไปที่เกิดจากไขมัน คาร์โบไฮเดรต และน้ำตาลที่พบในคุกกี้ช็อกโกแลต\n\nเอคไดซิสยังคงมีไขมันส่วนเกินสะสมอยู่ในบางจุด แม้มันอาจจะไม่ได้สร้างปัญหาให้กับนักดนตรี ทว่าหากวันข้างหน้าเธอจำเป็นต้องกวัดแกว่งอาวุธขึ้นมา มันอาจกลายเป็นจุดอ่อนสำคัญได้อย่างยิ่ง\n\nเตรียมแครอตกรอบอบแห้งไว้เป็นของว่างทดแทนดีกว่า อีวานพยักหน้ากับตนเองแล้วเดินตามเอคไดซิสต่อไป\n\nครู่ต่อมา จู่ๆ อีวานก็สัมผัสได้ถึงสายตาคู่หนึ่งจึงหันศีรษะไปมอง\n\n“คุณลุงกำลังทำอะไรอยู่คะ?”\n\n“ทำงาน”\n\nอิซาเบลล์ปรากฏตัวขึ้นพลางจ้องมองเขาด้วยสีหน้าเคร่งขรึมจริงจังอย่างยิ่ง\n\nเธอค่อยๆ เบนสายตามองไปข้างหน้าแล้วขมวดคิ้วมุ่นเมื่อเห็นเอคไดซิสอยู่ห่างออกไปลิบๆ\n\nไม่รู้ทำไม ดูเหมือนจะมีเรื่องไม่น่าอภิรมย์เกิดขึ้นเสียแล้ว แต่ก็ไม่มีความจำเป็นต้องกังวลแต่อย่างใด\n\nอีวานดูแลสถานเลี้ยงเด็กกำพร้า นั่นหมายความว่าเขามีทักษะในการปลอบประโลมเด็กที่การตัดสินใจบิดเบี้ยวไปด้วยเหตุผลอันไม่อาจอธิบายได้ อีกทั้งเขาก็ไม่เคยทำอะไรให้อิซาเบลล์ขุ่นเคืองใจเลยสักครั้ง\n\n“ทำไมคุณลุงถึงเอาแต่มองเอซี่ล่ะคะ?”\n\n“…ว่าไงนะ?”\n\n“เอซี่ไงคะ คุณลุงกำลังสะกดรอยตามเธออยู่ไม่ใช่เหรอคะ?”\n\n“เข้าใจผิดแล้ว”\n\nเขาไม่ได้กำลังสะกดรอยตาม เขากำลังทำหน้าที่ของตนเอง และเขาก็กำลังทำมันอย่างภาคภูมิใจ\n\nสิ่งเดียวที่เขาคาดไม่ถึงก็คือการได้เห็นอิซาเบลล์ ซึ่งเวลานี้ควรจะนั่งเรียนอยู่ในห้องเรียน กลับมาเดินเพ่นพ่านอยู่ในบริเวณมหาวิทยาลัยเสียได้\n\n“คาบเรียนล่ะ?”\n\n“หนูเห็นคุณลุงอยู่นอกหน้าต่าง… ไม่สิ หมายถึง ตอนนี้เรื่องเรียนของหนูมันสำคัญตรงไหนคะ?”\n\n“…? แน่นอนว่าสำคัญ ฉันไม่อยากให้เธอขาดเรียน”\n\nหากเธอเป็นนักศึกษาธรรมดาทั่วไป เขาคงไม่คิดจะไล่ต้อนเธอเข้าห้องเรียนหรอก อิซาเบลล์ลืมไปแล้วหรือไงว่าประเทศบ้านเกิดของเธอกำลังจ่ายค่าเล่าเรียนให้ทั้งหมดอยู่น่ะ?\n\nอีวานเดาะลิ้นอย่างขัดใจ\n\nอีวานเอ่ยขึ้นพร้อมถอนหายใจ “ถ้าเธอไม่ได้เป็นนักศึกษาทุนเต็มจำนวน ก็ควรตั้งใจเข้าเรียนเสียบ้าง สถาบันเซนต์ยันค่าเทอมแพงนะ”\n\n“ก็… อึก! เรื่องนั้นมันก็จริงอยู่หรอกค่ะ! ไม่สิ ทำไมคุณลุงเอาแต่เปลี่ยนเรื่องคุยล่ะคะ?! ทำไมคุณลุงถึงได้แอบตามดูเอซี่อยู่กันแน่?”\n\n“นั่นไม่ใช่เรื่องที่เธอต้องมายุ่ง”\n\n“ว่าไงนะคะ…?!”\n\nอิซาเบลล์ทำหน้าเหมือนถูกทำร้ายจิตใจอย่างแสนสาหัส ช่างเป็นเรื่องที่ไม่อาจเข้าใจได้เลย ทำไมเธอถึงต้องเสียใจกับคำแนะนำให้ตั้งใจเรียนแทนที่จะมามัวสนใจงานอารักขาของเขาด้วยเล่า?\n\nทว่า อีวานผู้เป็นคนใจดี ย่อมรู้วิธีปลอบโยนวัยรุ่นที่กำลังสับสน (ไม่ใช่เรื่องวัยว้าวุ่น)\n\nสำหรับวัยรุ่นที่กำลังเผชิญปัญหาอันไม่อาจอธิบายได้ สิ่งที่จำเป็นที่สุดคือการปล่อยให้อยู่ตามลำพังสักพัก (แน่นอนว่าไม่ใช่สักหน่อย)\n\nในฐานะผู้ใหญ่ผู้เปี่ยมด้วยความเอาใจใส่ อีวานจึงพยักหน้าแล้วก้าวถอยออกมา โดยตัดสินใจที่จะไม่เทศนาเธอเรื่องให้กลับเข้าห้องเรียนอีก\n\n“ไม่นะ จะไปไหนคะ? อธิบายมาสิ อย่างน้อยก็อธิบายมาหน่อย! หาข้อแก้ตัวอะไรก็ได้! ฮึ่ย!!”\n\nอีวานทิ้งอิซาเบลล์ที่กำลังลนลานเอาไว้เบื้องหลังแล้วรีบปลีกตัวหนีออกมาอย่างรวดเร็ว อิซาเบลล์ซึ่งยังคงตกตะลึงงันจ้องมองแผ่นหลังที่เดินห่างออกไปอย่างเหม่อลอย ก่อนจะถอนหายใจด้วยความผิดหวัง\n\n“จะจับมัดไว้ตรงไหนดีนะ? บางทีหนูคงต้องจับเขามัดไว้แล้วสอนวิธีพูดจาให้รู้เรื่องเสียหน่อยแล้วมั้ง….”\n\nพอเห็นเขาเดินผ่านนอกหน้าต่างระหว่างคาบเรียน เธอก็แอบย่องออกมาและพบว่าเขากำลังเดินตามหลังเอคไดซิสอย่างเงียบเชียบ พร้อมจดอะไรบางอย่างลงในสมุดพก\n\nเมื่อพิจารณาจากนิสัยของเขา เขาก็คงกำลังทำอะไรสักอย่างอยู่นั่นแหละ แต่ถึงอย่างนั้น\n\nแต่ถึงอย่างนั้นก็เถอะ…!\n\n“หนูอุตส่าห์เข้าหาอย่างเปิดเผยขนาดนี้ แต่คุณลุงกลับมาเดินตามเพื่อนของหนูเนี่ยนะ…?”\n\nอิซาเบลล์หัวเราะขมขื่นก่อนจะยกมือลูบหน้าลูบตาอยู่สองสามครั้ง\n\nเอาล่ะ\n\nตั้งเป้าหมายได้แล้ว\n\n“ขอบเขตของผู้เหนือมนุษย์งั้นเหรอ? ใช่แล้ว หมายความว่าหนูต้องก้าวเข้าสู่ขอบเขตนั้นถึงจะพอรับมือกับไอ้คนบ้าคนนั้นแล้วเอาชนะเขาให้ได้สินะ”\n\nให้เร็วที่สุดเท่าที่จะทำได้ ก้าวเข้าสู่ขอบเขตนั้น ยกระดับตนเองขึ้นไปถึงจุดที่สามารถโค่นผู้ชายคนนั้นลงได้\n\nจับกุมและสยบเขาให้สิ้นฤทธิ์ มัดตัวเขาเอาไว้ อย่างช้าๆ อย่างละเอียดถี่ถ้วน หนูคงต้องสอนพื้นฐานของสามัญสำนึกให้เขาทีละขั้นๆ เสียแล้ว\n\nงานอาสาสมัคร ใช่แล้ว ด้วยหัวใจแห่งการทำงานอาสาสมัคร ถ้าหนูไม่ทำ แล้วใครหน้าไหนจะมาช่วยเยียวยาคนแก่ที่น่าสงสารคนนั้นกันเล่า (ไม่น่าสงสารเลยสักนิด)?\n\n***\n\nวันนี้เอคไดซิสก็ยังคงเดินเตร็ดเตร่อย่างไร้จุดหมาย เพราะหาห้องซ้อมไม่เจออีกตามเคย\n\nการซ้อมวงออร์เคสตราซึ่งรวมถึงการประเมินผลการแสดงแบบกลุ่ม คือวิชาเรียนที่น่าหวาดหวั่นที่สุดสำหรับเธอ ไม่มีใครเต็มใจรับเธอเข้าร่วมกลุ่มเลยสักคน\n\nฉะนั้น เธอจึงเดินคอตกพลางพึมพำกับตนเองอย่างเศร้าสร้อย\n\n“ห้องซ้อมที่ขาดสมาชิกอยู่อีกหนึ่งคนคือห้อง 154 นะ”\n\n“…?!”\n\nทันใดนั้น อีวานก็โผล่พรวดขึ้นมาข้างๆ เธอ\n\n“เฮือก?!”\n\n“วิชาของเธอคือ [ปฏิบัติการรวมวง 1] ถ้าขาดเรียนเพิ่มอีกรอบมันจะไม่หมิ่นเหม่เอาเหรอ?”\n\n“ทะ ทำไมคุณถึง…?”\n\n“ตอนนี้ไม่ใช่เวลามามัวกังวลเรื่องนั้น”\n\nอีวานล้วงสมุดบันทึกลึกลับออกมาจากกระเป๋าเสื้อแล้วเอ่ยขึ้นด้วยน้ำเสียงเรียบนิ่ง\n\n“ผลสอบกลางภาค: ปฏิบัติการรวมวง D, ดนตรีเชมเบอร์ C, การขับร้องและโสตทักษะ B+, ดนตรีเชมเบอร์ C, การบรรเลงเครื่องสาย D, การประสานเสียงและทำนองสอดประสาน B+ โดยรวมแล้วคะแนนภาคทฤษฎีดูจะดีกว่าภาคปฏิบัติ แต่การได้เกรดเฉลี่ยอยู่แถวๆ 2 กลางๆ แบบนี้มันเป็นปัญหานะ”\n\n“อะ อา….”\n\n“ทำไมเธอถึงสมัครเข้าเรียนวิทยาลัยดุริยางคศิลป์ล่ะ?”\n\nอีวานจ้องมองเอคไดซิสด้วยแววตาจริงจังเคร่งขรึม\n\nเพราะไม่เคยคาดคิดมาก่อนเลยว่าจะได้ยินคำถามเช่นนี้จากชายที่เธอคิดว่าเป็นเพียงแค่สตอล์กเกอร์ เอคไดซิสจึงกลืนน้ำลายอย่างประหม่าแล้วก้มหน้าลง\n\nทำไมน่ะหรือ? ก็เพราะเธออยากทำแบบนั้นนี่นา\n\nไม่ใช่ด้วยอาวุธ แต่เป็นด้วยเครื่องดนตรี\n\nเอคไดซิสเลือกเฟ้นถ้อยคำอย่างระมัดระวังพลางบิดปลายนิ้วมือไปมา\n\n“เครื่องดนตรี เครื่องดนตรีน่ะ… มันเชื่อมโยงผู้คนเข้าด้วยกันเหมือนสะพานค่ะ”\n\n“ยอดเยี่ยม”\n\nอีวานแย้มยิ้มออกมา\n\nเอคไดซิสเบิกตากว้างด้วยความตกตะลึงต่อรอยยิ้มอันไม่คาดฝันนั้น\n\nเธอจ้องมองใบหน้าของอีวานอย่างเหม่อลอย ก่อนจะอ้าปากค้างด้วยความตกใจ\n\nน้ำเสียงทุ้มต่ำแหบพร่านั้น และดวงตาคมเข้มที่โค้งลงอย่างอ่อนโยนคู่นั้น\n\nคุ้นเคย คุ้นเคยเหลือเกิน\n\nเธอยกมือขึ้นโดยไม่รู้ตัว แบฝ่ามือออกอย่างเชื่องช้า\n\nเธอใช้ฝ่ามือยกขึ้นบังช่วงหนวดเครารกรุงรังอันสะดุดตาเอาไว้ เหลือเพียงสันจมูกและดวงตาที่มองเห็นได้ ก่อนจะเพ่งมอง\n\nในห้วงเวลานั้น ดวงตาอันสั่นระริกของเอคไดซิสและสายตาอันล้ำลึกของอีวานก็สบประสานเข้าหากัน\n\n“ไม่จริงน่า…? ไม่สิ แต่ว่า คุณลุงตายไปแล้วนี่นา….”\n\n“ดูแลสุขภาพด้วยล่ะ”\n\nด้วยความเป็นคนยึดหลักประสิทธิภาพ อีวานจึงไม่เสียเวลามานั่งใส่ใจกับการคาดเดาของเอคไดซิส เด็กคนนี้กำลังคิดอะไรอยู่เป็นเรื่องรองลงไป ยังมีเรื่องสำคัญกว่านั้นรออยู่ในมือ\n\nต่อให้มันหมายถึงการช่วยป้องกันไม่ให้เธอขาดเรียนเพิ่มเพื่อกอบกู้เกรดอันย่ำแย่ของเธอก็ตาม\n\nอีวานนำทางเอคไดซิสมาจนถึงห้องซ้อมของคณะดุริยางคศิลป์ แล้วส่งกล่องอาหารกลางวันให้เธอด้วยสีหน้าว่างเปล่าเช่นเดิม\n\nด้านในบรรจุกล่องของว่างที่มีแครอตกรอบอบแห้งอยู่เต็มเปี่ยม\n\n“ดูแลสุขภาพด้วย ไอนาร์เป็นห่วงเรื่องสุขภาพของเธอมากกว่าเรื่องผลการเรียนเสียอีก แต่นั่นก็ไม่ได้หมายความว่านักศึกษาควรจะโดดเรียน สายแล้ว รีบเข้าไปข้างในเถอะ”\n\nอีวานผลักหลังเอคไดซิสที่ยังคงยืนมึนงงเข้าไปในห้องซ้อมเครื่องสาย ก่อนจะก้มลงมองนาฬิกาข้อมือ\n\nกว่าวิชาซ้อมรวมวงจะเลิก คาบเรียนของมอร์ดก็คงจบลงพอดี ถึงตอนนั้นเขาก็ไม่จำเป็นต้องคอยอารักขาเอคไดซิสอีกต่อไป\n\nจากนี้ไปคงได้ยุ่งกันหัวหมุนแน่\n\nอีวานหัวเราะเบาๆ แล้วก้าวเดินต่อไป บัดนี้ หลังจากเฝ้ายามให้บ้านของอิซาเบลล์ในตอนกลางคืนเสร็จสิ้น เขาก็จะได้เลิกงานเสียที\n\nมันเป็นเพียงวันธรรมดาอีกวันหนึ่ง\n\nวันที่เหมือนกับวันอื่นๆ นับเป็นวันที่สามติดต่อกันแล้ว\n\nเฝ้าดูเอคไดซิสในตอนกลางวัน ลาดตระเวนแถวบ้านอิซาเบลล์ในตอนกลางคืน – กิจวัตรอันแสนสงบสุขของเจ้าหน้าที่รักษาความปลอดภัย\n\nทว่าในวันนี้ ธนาคารกลางเฟรเชนกายา โรงละครทรงกลมซาเทรา สถาบันเซนต์ยัน มหาวิหารเซนต์เชเรห์ตา และสถานีตำรวจกลางพราเชนโกเหนือ ต่างเกิดเหตุระเบิดขึ้นอย่างกึกก้องพร้อมกันในชั่วโมงเดียวกัน\n\nในค่ำคืนนั้น นครหลวงลุกโชติช่วงสว่างไสวเป็นสีขาวโพลน\n\n***\n\nอีวานเดินทอดน่องอย่างเชื่องช้า พลางตระหนักถึงสัมผัสของปืนพกในอ้อมอก\n\nเป็นเวลาสามคืนติดต่อกันแล้วที่เขาเดินลาดตระเวนอยู่หน้าบ้านของอิซาเบลล์\n\n“อืม”\n\nเมื่อเขาเดินวนรอบบ้านของเธอเป็นรอบที่สาม เขาก็สังเกตเห็นว่าตนเดินสวนกับคนสัญจรคนเดิมเป็นครั้งที่สามแล้ว\n\nในระยะห่างจากบ้านของอิซาเบลล์พอๆ กันทุกครั้ง ทว่าเปลี่ยนจุดไปเรื่อยๆ\n\n‘จุดศูนย์ถ่วงเอียงไปทางขวา ถนัดขวา พกปืนไว้ที่สะโพกซ้าย ดูจากช่วงอกที่นูนผิดปกติ น่าจะสอดแผ่นเกราะกันกระสุนเอาไว้ด้วย’\n\nอีวานเดินผ่านผู้สัญจรคนนั้นไปอย่างไม่สะทกสะท้าน ก่อนจะเบนสายตากลับไปมอง\n\n‘สอดแผ่นเกราะกันกระสุน แปลว่าไม่มีทักษะตรวจจับแนววิถีกระสุน หมอนี่ฝีมือระดับล่างชัดๆ’\n\nชายผู้ต้องสงสัยกวาดสายตามองไปรอบบริเวณ ก่อนจะเลือนหายเข้าไปในความมืดมิดเบื้องหน้า\n\nอีวานค่อยๆ รวบรวมสมาธิแล้วหลับตาลงอย่างเงียบเชียบ\n\nการไล่ตามเป้าหมายที่มีความระแวดระวังตัวสูงจากด้านหลังตรงๆ เป็นวิธีที่ต่ำกว่ามาตรฐานของเขา เจ้าหน้าที่ที่ผ่านการฝึกฝนมาอย่างดีจะไม่มีวันสะกดรอยตามในลักษณะนั้น\n\nพลังเวทไหลเวียนไปทั่วร่างของอีวานอย่างเชื่องช้า ด้วยความรู้สึกที่พันธนาการรอบระบบประสาทประดุจโซ่ตรวน\n\nเมื่อเขาลืมตาขึ้นอีกครั้ง เขาก็ได้ก้าวเข้าสู่ห้วงความรู้สึกอันเชื่องช้าราวกับใบไม้ที่กำลังร่วงหล่น\n\n– ซู่ววว….\n\nเมื่อสูดลมหายใจเข้าลึกอย่างเชื่องช้า ประสาทสัมผัสที่ถูกกระตุ้นก็เริ่มต้นแยกแยะกลิ่นที่ล่องลอยอยู่ในอากาศ\n\nว่ากันว่าหนูสามารถรับรู้ถึงสัตว์ทุกตัวบนลาดเขาได้ผ่านสายลมที่พัดผ่านหมู่ใบไม้ ประสาทรับกลิ่นซึ่งโดยปกติเป็นสมบัติของสัตว์ป่า มันก้าวข้ามความหนาแน่นของเซลล์เยื่อบุรับกลิ่นในมนุษย์ไปอย่างเทียบไม่ติด\n\nทว่าผู้เหนือมนุษย์สามารถเข้าใกล้ระดับนั้นได้อย่างไม่มีที่สิ้นสุด มันคือความสามารถในการบังคับกระตุ้นอวัยวะรับสัมผัส และแยกแยะทำความเข้าใจอวัยวะประสาทแต่ละส่วนที่ถูกปลุกให้ตื่นขึ้นมาจากสภาวะหลับใหล\n\nใช่ว่าผู้เหนือวิสัยทุกคนจะสามารถใช้ประสาทสัมผัสเช่นนี้ได้ นี่ไม่ใช่พรสวรรค์ ทว่าคือขอบเขตของการฝึกฝน ผู้ตื่นรู้ส่วนใหญ่ต่างมุ่งเน้นการฝึกฝนไปที่ทักษะการต่อสู้มากกว่าการนำประสาทสัมผัสมาใช้งานในรูปแบบนี้\n\nแต่อีวานแตกต่างออกไป เขาเชี่ยวชาญเฉพาะทางในด้านนี้ยิ่งกว่าผู้เหนือวิสัยคนไหนๆ\n\nหรือหากจะกล่าวให้แม่นยำยิ่งกว่านั้น\n\nเขาขัดเกลาและลับคมความสามารถของตนในทิศทางนี้มาหนักหน่วงยิ่งกว่าผู้เหนือวิสัยทุกคน\n\n– ฟู่ววว….\n\nเมื่อผ่อนลมหายใจที่สูดเข้าไปออกมาอย่างเชื่องช้า อีวานก็ก้าวเดินต่อไป\n\nสายลมแห่งนครหลวงที่พัดผ่านหมู่ตึกรามบ้านช่องพัดพาเอากลิ่นอายนานาชนิดติดตัวมาด้วย\n\nประสาทสัมผัสที่ถูกพัฒนาจนถึงขีดสุดก่อให้เกิดผัสสะเชื่อมโยง บัดนี้อีวานซึ่งยืนอยู่ท่ามกลางความมืดมิดกำลังก้าวเดิน พลางจ้องมอง ‘รอยกลิ่น’ ที่ส่องแสงเรืองรองอย่างชัดเจน\n\nอย่างเชื่องช้า โดยไม่เร่งรีบ\n\nตรงไปหาเหยื่อ\n\nภายในเฟรเชนกายา เมื่อใดก็ตามที่เขาได้เผชิญหน้ากับเป้าหมายเกินกว่าหนึ่งครั้ง เป้าหมายนั้นย่อมไม่มีวันหลุดรอดไปจากประสาทสัมผัสของเขาได้\n\nอีวานก้าวเดินต่อไปด้วยฝีเท้าอันมั่นคง\n\nจนกว่าเป้าหมายจะเลื้อยเข้ามาติดกับในอ้อมอกของเขาเอง อย่างอดทนประดุจอสรพิษในความมืดมิด"
    },
