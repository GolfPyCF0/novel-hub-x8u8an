      "title": "บทที่ 52",
      "content": "ในมุมมองของอีวาน โลกใบนี้อาจดูเหมือนสังคมยุคก่อนสมัยใหม่ที่ล้าหลังอย่างน่าอนาถ ทว่านั่นเป็นการใส่ร้ายป้ายสีอันไร้เหตุผล โดยธรรมชาติแล้ว ผู้คนในโลกนี้ล้วนมากด้วยความสามารถ (เพราะพวกไร้ความสามารถเอาชีวิตรอดมาไม่ได้)\n\nความสามารถเหล่านี้ไม่อาจถูกนำไปใช้ในทิศทางอันดีงามได้เสมอไป ดังนั้น เหล่าหัวกะทิผู้ทรงภูมิและผู้มีตำแหน่งสูงส่งในสังคมส่วนใหญ่ จึงสั่งสมการทุจริตคอร์รัปชันได้อย่างแยบยลน่าทึ่ง (นี่คือเหตุผลที่กองบัญชาการต่อต้านข่าวกรองเชื่อมั่นในทฤษฎีสันดานดิบอันชั่วร้ายของมนุษย์)\n\nอย่างที่ใครๆ ต่างก็รู้กันดี การคอร์รัปชันของคนเก่งนั้นร้ายแรงถึงตายยิ่งกว่าการคอร์รัปชันของคนโง่เขลามากนัก ยิ่งเมื่อมันลุกลามจากการกอบโกยผลประโยชน์ส่วนตนไปสู่การท้าทายโครงสร้างระบบสังคมด้วยแล้ว ก็ยิ่งทวีความอันตรายขึ้นเป็นเท่าทวี\n\nกล่าวคือ เหล่าผู้ทะเยอทะยานที่ตัดสินใจหันไปสมคบคิดกับเผ่าปีศาจเพื่อกระโจนลงเล่นในน่านน้ำที่ลึกกว่าเดิมนั่นเอง\n\n“พวกนี้จะให้จัดการยังไงดีครับ?”\n\n“ถามอะไรอย่างนั้น? ทำตัวเป็นมือสมัครเล่นไปได้ จัดการให้มันเป็นงานเป็นการ สมกับมืออาชีพหน่อยสิ”\n\nดมิทรียักไหล่แล้วหันหลังกลับ เสื้อโค้ตยาวของเขาสะบัดพลิ้วตามแรงหมุน ในจังหวะที่เขาหันหลังให้ ปัง ปัง เสียงปืนอันแห้งผากสองนัดก็ดังขึ้น\n\nดมิทรีจุดบุหรี่ขึ้นสูบคลอไปกับเสียงปืน สูดเข้า พ่นออก ปลายบุหรี่ที่ลุกไหม้ส่องประกายสีแดงวาบในห้องอันมืดสลัว\n\n“ไอ้พวกน่ารำคาญเอ๊ย”\n\nยิ่งระบบสังคมมีความซับซ้อนประณีตมากเท่าใด เหล่าผู้ทะเยอทะยานก็ยิ่งฝังความมักใหญ่ใฝ่สูงของตนลงไปในเงามืดลึกขึ้นเท่านั้น\n\nในโลกใบนี้ “ผู้ทะเยอทะยานที่รอดชีวิตมาได้” ล้วนมีความสามารถโดดเด่นเหนือธรรมดาทั้งสิ้น ดังที่กล่าวไปข้างต้น พวกไร้ฝีมือที่เผยความทะเยอทะยานออกมาในช่วงสงครามล้วนถูกกำจัดทิ้งไปหมดแล้ว\n\nเรียกได้ว่าควรค่าแก่การขนานนามว่าเป็นการทดลองคัดเลือกพันธุ์มนุษย์ระดับโลกเลยทีเดียว\n\nหากเปรียบเทียบตามหลักตรรกศาสตร์แบบดั้งเดิม ย่อมเป็นไปตามนี้:\n\n1. พวกกบฏ ผู้ก่อการร้าย หรือกลุ่มต่อต้านระบอบที่เคลื่อนไหวอยู่ในปัจจุบัน ล้วนมีฝีมือติดตัวกันพอสมควร\n2. ทว่าระบบสังคมของสหราชอาณาจักรยังคงตั้งตระหง่านอย่างมั่นคง\n3. ดังนั้น เจ้าหน้าที่ต่อต้านข่าวกรองทุกนายที่จับกุม “พวกกบฏมากฝีมือ” เหล่านี้ได้ ย่อมต้องมากความสามารถยิ่งกว่าพวกมันขึ้นไปอีก\n\nสงครามเพิ่งจะสิ้นสุดลงเมื่อ 4 ปีก่อน รากฐานของทุกอาณาจักรล้วนบอบช้ำถึงขีดสุดจนไม่อาจทานทนความขัดแย้งใดๆ ได้อีกต่อไป\n\nซ้ำร้าย ประชากรวัยแรงงานส่วนใหญ่ยังสูญเสียไปแทบหมดสิ้น โดยส่วนใหญ่หายสาบสูญเข้าไปอยู่ในกระเพาะของเผ่าปีศาจ\n\nกระแสความเปลี่ยนแปลงคล้ายคลึงกับยุคที่กาฬโรคระบาดหนักจนสิทธิของสามัญชนพุ่งสูงขึ้นกำลังก่อตัวขึ้น ทว่าข้อแตกต่างสำคัญก็คือ เหล่าขุนนางผู้ขูดรีดไพร่ฟ้ากลับมีพลังอำนาจเหนือล้ำอย่างท่วมท้น — พวกเขาครอบครองพลังเวทมนตร์อย่างแท้จริง\n\nย่อมเป็นเรื่องธรรมดาที่ความขัดแย้งระหว่างสามัญชนกับผู้กดขี่ขูดรีดจะดูเหมือนไม่อาจหลีกเลี่ยงได้ พร้อมจะลุกโชนขึ้นเป็นเปลวเพลิงได้ทุกเมื่อหากมีใครสักคนคอยโหมพัดถ่านไฟ\n\nในปรากฏการณ์ทางสังคม เมื่อใดก็ตามที่เกิดเหตุการณ์ใหญ่ขึ้น ผู้ร้ายตัวจริงมักจะเป็นฝ่ายที่เก็บเกี่ยวผลประโยชน์ได้มากที่สุดเสมอ\n\nเมื่อลองไล่เรียงว่าผู้ใดจะได้ประโยชน์สูงสุดจากการที่ประเทศชาติลุกเป็นไฟ ก็ย่อมหนีไม่พ้นกลุ่มคนเหล่านี้:\n\nเผ่าปีศาจใต้การปกครองแบบอาณานิคม ประเทศเพื่อนบ้าน กลุ่มกบฏภายในประเทศ เชื้อพระวงศ์ที่ถูกผลักไสออกจากเส้นทางสืบราชบัลลังก์ และเหล่านักอุดมการณ์ที่จมดิ่งอยู่ในแนวคิดประชานิยม\n\n“เฮ้อ…”\n\nดมิทรีพ่นลมหายใจถอนสายยาวเจือมากับควันบุหรี่ มีตัวแปรเยอะเกินไปแล้ว พวกมันกระจายตัวอยู่หลายแนวรบทั้งในและนอกประเทศ และเวลานี้คราซิลอฟก็กำลังยืนอยู่บนปากเหวของสงครามกลางเมือง\n\nคืนนี้กองบัญชาการต่อต้านข่าวกรองคราซิลอฟก็คงต้องอดหลับอดนอนกันอีกตามเคย\n\nมันเป็นค่ำคืนฤดูร้อนอันแสนเหนื่อยหน่าย ไม่ต่างอะไรจากปีก่อนๆ\n\nตราบจนกระทั่งพริตเชนคายาลุกเป็นไฟ\n\n***\n\nอีวานเป็นคนรักสันติ เขาจึงมักคลี่คลายปัญหาส่วนใหญ่ด้วยการพูดคุยเจรจา\n\nหากจะมีอุปสรรคเล็กน้อยอยู่บ้าง ก็เห็นจะเป็นเรื่องที่คนส่วนใหญ่ในยุคสมัยอันล้าหลังนี้มักปิดล็อกประตูหัวใจและปฏิเสธที่จะยอมเปิดปากพูด\n\nทว่าในฐานะคนสมัยใหม่ผู้ชาญฉลาด อีวานย่อมแก้ไขปัญหานี้ได้อย่างง่ายดาย\n\nกลอนประตูทุกบานล้วนทำจากไม้ และไม้ทุกชนิดย่อมพังทลายลงภายใต้คมขวาน\n\nดังนั้น ท่ามกลางคุณประโยชน์นานัปการ (ทั้งที่เปิดขวด ที่เปิดกระป๋อง ที่เปิดกะโหลก ฯลฯ) ขวานของอีวานจึงทำหน้าที่เป็นดั่ง ‘ที่เปิดประตู’ ซึ่งกระแทกเปิดกลอนประตูหัวใจของผู้คนให้ผางออกกว้างได้อย่างหมดจด\n\n“ผะ… อั่ก!! ผมจะบอกทั้งหมดครับ! หยุด! หยุดเถอะ!”\n\n“ชู่ว์ ฉันยังไม่ได้เริ่มเลยนะ”\n\n“ผมบอกว่าผมจะพูดไงเล่า!!”\n\nอีวานส่ายศีรษะให้กับนักเคลื่อนไหวทางอุดมการณ์มือสมัครเล่นตรงหน้า\n\nข้อมูลที่พรั่งพรูออกมาก่อนที่กลอนประตูหัวใจจะเปิดอ้าออกอย่างสมบูรณ์ มักมีความเป็นไปได้สูงที่จะเจือปนคำลวง\n\nฉะนั้น เพื่อยกระดับความน่าเชื่อถือของข้อมูล จึงจำเป็นต้องเปิดหัวใจให้กว้างยิ่งขึ้นไปอีก ในเชิงกายภาพแล้ว การผ่าเปิดตำแหน่งที่หัวใจตั้งอยู่มักช่วยให้หัวใจในเชิงจิตวิทยาเปิดกว้างตามไปด้วยเสมอ\n\n“อึก…!”\n\n“เดี๋ยวรักษาให้ละกัน”\n\n“ฆ่า… ผมเถอะ…!”\n\n“อย่าพูดอะไรที่น่าเศร้าแบบนั้นสิ”\n\nอีวานกระซิบอย่างอ่อนโยนพลางหยิบโพชั่นรักษาบาดแผลออกมาสมานปิดหัวใจที่ถูกผ่าอ้าออกจนกว้าง\n\nการเอาแต่ทรมานซ้ำซากเพียงอย่างเดียวเป็นหมากที่เลวร้ายซึ่งทำให้คุณภาพของข้อมูลตกต่ำลง ข้อมูลบิดเบี้ยวได้ง่าย และขึ้นอยู่กับสถานการณ์ ผู้คนมักหลงเชื่อแล้วพ่นความทรงจำที่ผิดเพี้ยนไปคนละเรื่องออกมาเป็นความจริง\n\nดังนั้น เพื่อพังทลายกำแพงทางจิตใจลงให้ราบคาบ อีวานจึงจำเป็นต้องละทิ้งความสามารถทางปัญญาแบบคนยุคใหม่ชั่วคราว และหยิบยืมความป่าเถื่อนที่เหมาะสมกับยุคสมัยนี้มาใช้\n\nหลังจากผ่านช่วงให้คำปรึกษาทางจิตวิทยาสั้นๆ อันเปี่ยมไปด้วยความเอื้ออาทรอันอบอุ่น (หลีกเลี่ยงอวัยวะสำคัญยามลงคมขวาน) และการดูแลรักษาอย่างประณีตบรรจง (ไม่หวงโพชั่นรักษาบาดแผลแม้แต่น้อย) ในที่สุดสายลับรายที่ห้าที่เขาพบตัวก็ยอมเอ่ยความจริงออกมาด้วยแววตาเหม่อลอยไร้จุดโฟกัส\n\n“ท่านดิโอนาร์… อึก… เดินทางมาถึง… พริตเชนคายาแล้ว… สัญญาณลงมือ… ไม่ใช่พวกเรา… ท่านดิโอนาร์จะเป็นคน…”\n\n“ไอ้หมอนั่นเริ่มเคลื่อนไหวแล้วงั้นเหรอ?”\n\n“คะ… ครับ…. จุดนัดพบเป็นแค่… ฉากบังหน้า… พวกเราก็รอคำสั่งเคลื่อนไหวจากท่านดิโอนาร์อยู่เหมือนกัน…”\n\n“ดิโอนาร์ต้องการอะไร? แค่ลักพาตัวเอซิดิสก็จบแค่นั้นเหรอ?”\n\n“ไม่…”\n\nสายลับซึ่งทำหน้าที่เป็นตัวแทนติดต่อประสานงานกับดิโอนาร์เหม่อมองขึ้นไปบนท้องฟ้าด้วยดวงตาว่างเปล่า ก่อนจะพลันเอื้อมมือเคาะลงบนพื้นดิน\n\nราวกับว่านั่นคือคำตอบที่เพียงพอแล้ว\n\nเมื่ออีวานกระตุกคิ้วขึ้น ชายคนนั้นก็กระอักเลือดออกมาแล้วเค้นเสียงพูดต่ออย่างยากลำบาก\n\n“ที่นี่”\n\n“…ที่นี่งั้นเหรอ?”\n\n“พริตเชนคายา… การปะ… ปฏิวัติจงเจริญ… ดาบแห่งปวงชน… มอบแด่ปวง… ชน… เหนือมนุษย์… มีเพียงพระผู้เป็นเจ้า… ใต้แผ่นดินแห่งสวรรค์… แค่ก! อะ… อ๊าก…”\n\nสติแตกไปแล้วสินะ\n\nอีวานเดาะลิ้นเบาๆ แล้วลุกขึ้นยืน\n\nหากดิโอนาร์ซึ่งเดิมทีมีกำหนดจะมาถึงพรุ่งนี้หรือมะรืนนี้ ได้แทรกซึมเข้ามาในเมืองเรียบร้อยแล้ว มีหรือที่มันจะยอมเลื่อนวันลงมือออกไปทั้งที่ส่งคนติดตามล่วงหน้ามาขนาดนี้แล้ว?\n\nไม่มีทาง เมื่อความแตกแล้ว มันย่อมไม่มีที่ให้หวนกลับไปอีก ขืนซมซานกลับไปโดรอัน ก็มีแต่คมขวานอันเดือดดาลของไอนาร์รอต้อนรับอยู่เท่านั้น\n\nพริตเชนคายาเป็นมหานครอันกว้างใหญ่ไพศาล ดังนั้น การตามหาสายลับต่างชาติที่ลักลอบเข้าเมืองโดยไม่เคยเห็นหน้าค่าตามาก่อน ย่อมยากเย็นยิ่งกว่าการตามหาคุณคิมในกรุงโซลเสียอีก\n\nทว่าอยากจะหางู ก็ต้องตีหญ้าให้ตื่นเสียก่อน\n\nหากดิโอนาร์รู้ระแคะระคายว่าแหล่งกบดานของตนถูกเปิดโปง และลูกสมุนกับสายปฏิบัติการหลายคนถูกทิ้งให้รอดชีวิตอยู่พร้อมร่องรอยการทรมานอย่างชัดเจน มันย่อมต้องร้อนรนกระวนกระวายใจถึงขีดสุด\n\n“ป่านนี้เอซิดิสคงอยู่ที่บ้านแล้ว”\n\nอีวานครุ่นคิดถึงความหมายของการหมายหัวตัวเมืองพริตเชนคายาทั้งเมืองพลางออกเดินทางต่อ\n\nเขาวางแผนจะไปรับประกันความปลอดภัยของเอซิดิสเสียก่อน และหากเป็นไปได้ ก็จะชิงสกัดกั้นการลอบจู่โจมของดิโอนาร์ไว้ให้ทันท่วงทีก่อนจับตัวมาเค้นถามข้อมูล\n\nเขาอยากรู้นักว่าพื้นฐานทางความคิดแบบใดกันหนอ ที่ทำให้ใครบางคนหลงคิดไปได้ว่าการเล่นงานคนของปาร์ตี้ผู้กล้าจะกลายเป็นวิธีการพิชิตกรุงพริตเชนคายาไปได้\n\n***\n\nเอซิดิสกับมอร์ดกำลังเดินเล่นไปตามท้องถนนยามค่ำคืนอย่างเงียบสงบ\n\n“ว้าว หนูยังไม่ชินเลยค่ะ คุณลุงก็เหมือนกันใช่ไหมคะ? ทำไมถนนถึงมีคนเดินน้อยขนาดนี้ล่ะคะ?”\n\n“ก็เป็นแบบนี้แหละเวลาประเทศชาติมันไร้ความสามารถ เอซี่ เจ้าเห็นแล้วใช่ไหมว่าพ่อของเจ้าน่ะเป็นกษัตริย์ที่ยิ่งใหญ่เพียงใด?”\n\n“อ๊ะ ค่ะ ก็… คงงั้นมั้งคะ…”\n\nคราซิลอฟผ่านพ้นสงครามครั้งที่ผ่านมาภายใต้ระบอบกษัตริย์รวมศูนย์เพียงหนึ่งเดียว ย่อมเป็นเรื่องธรรมดาที่ประเทศนี้จะต้องประกาศกฎอัยการศึกทั่วราชอาณาจักรและดำเนินระบบยามสงครามต่อเนื่องมานานกว่าทศวรรษ\n\nต่อให้สันติภาพจะหวนคืนมาแล้ว ประเทศที่ฝังรากลึกในวิถีทหารเช่นนี้ย่อมไม่อาจแปรเปลี่ยนไปได้ภายในเวลาเพียง 4 ปี ทว่าโดรอันนั้นแตกต่างออกไป\n\nระหว่างสงครามที่ผ่านมา โดรอันดำรงอยู่เป็นสมาพันธรัฐอย่างหลวมๆ ที่เหล่ายาร์ลหลายสิบตระกูลต่างปกครองดินแดนของตนเอง\n\nชาติชนเผ่าแห่งนี้ไม่มีศูนย์รวมอำนาจเบ็ดเสร็จเพียงหนึ่งเดียว ส่งผลให้สิทธิเสรีภาพของพลเมืองแต่ละคนพัฒนาไปไกลกว่าประเทศอื่นอย่างเห็นได้ชัด\n\nแม้แต่นักรบที่นอนเกลือกกลิ้งอยู่ข้างถนน พอลองไล่เรียงสายสัมพันธ์ออกไปเจ็ดทอด ก็คงเป็นพี่เขยของลูกพี่ลูกน้องของคนที่นับถือกันดุจพี่น้องร่วมสาบานของท่านยาร์ลสักคนนั่นแหละ นั่นคือความหมายของสังคมเครือญาติ\n\nจุดที่น่าสะพรึงกลัวของเรื่องนี้คงเป็นการที่มีเหล่านักรบนอนแผ่หราอยู่เกลื่อนถนน ทว่าเพราะเหตุนั้นเอง ความปลอดภัยในสังคมจึงสามารถพัฒนาไปสู่ระดับที่ใกล้เคียงโลกสมัยใหม่ได้มากกว่า\n\nต่างจากสังคมศิวิไลซ์ ในสังคมชนเผ่า ขวานจะถูกจามลงกลางกบาลของพวกที่ไร้มารยาททันที เมื่อทุกคนต่างรักษามารยาทกันอย่างเคร่งครัด แล้วจะมีอะไรให้ต้องหวาดกลัวถนนยามค่ำคืนเล่า?\n\nโอ้โห บ้านข้างๆ โดนปล้นงั้นเรอะ? น่าแปลกที่หัวขโมยมักจะเป็นเพื่อนบ้านถัดไปอีกหลังเสียเอง มันเป็นสังคมปิด แล้วไอ้หัวขโมยเพื่อนบ้านคนนั้นก็จะหัวหลุดหรือข้อมือขาดในวันรุ่งขึ้นทันที\n\nสำหรับคนที่เติบโตมาจากสังคมเช่นนั้น ถนนยามค่ำคืนของกรุงพริตเชนคายาจึงดูหดหู่และแข็งกระด้างยิ่งนัก\n\nสำหรับเอซิดิสซึ่งมาอาศัยอยู่ในเมืองนี้ได้เกือบสามเดือนแล้ว นี่ก็ยังคงเป็นสภาพแวดล้อมที่ปรับตัวให้เข้ากันได้ยากอยู่ดี\n\n“อ้อ คุณลุงคะ เคยไปร้านนั้นไหมคะ? วาฟเฟิลร้านนั้นอร่อยมากเลยล่ะค่ะ”\n\nโดยปกติแล้ว ร้านวาฟเฟิลแถวมหาวิทยาลัยไม่ใช่สถานที่สำหรับมานั่งกินคนเดียว แต่มันคืออาณาเขตของเหล่าคนดังสุดฮอตอันแสนไร้ปรานี\n\nด้วยเหตุนี้ เอซิดิสจึงไม่เคยได้ลิ้มลองวาฟเฟิลจากร้านนั้นเลยสักครั้ง เธอทำได้เพียงยืนเหม่อมองผู้คนที่นั่งกินอยู่ข้างในแล้วเดินคอตกกลับบ้านเท่านั้น\n\nเอซิดิสจึงสาธยายแนะนำร้านอาหารละแวกใกล้เคียง (หมายถึงร้านที่ดูท่าทางน่าอร่อย) ให้คุณลุงฟังไม่ขาดปากด้วยน้ำเสียงเจือความเสียดาย ขณะเดินผ่านร้านวาฟเฟิลที่ปิดทำการไปแล้ว\n\n“อ้อ ใช่ วาฟเฟิลที่โปะสตรอว์เบอร์รีไว้ข้างบนร้านนั้นอร่อยดีนะ”\n\n“…?!”\n\nสิ่งที่เอซิดิสมองข้ามไปก็คือข้อเท็จจริงที่ว่ามอร์ดเป็นคนเนื้อหอมอย่างเหลือเชื่อ\n\nคณะอัศวินโดยพื้นฐานแล้วคือฐานที่มั่นของผู้แข็งแกร่ง กล่าวคือ เป็นคณะของเหล่าลูกผู้ชายที่เคลื่อนไหวไปตามกฎของผู้แข็งแกร่ง\n\nเป็นไปไม่ได้เลยที่จะไม่ชอบชายชาวโดรอันผู้ภาคภูมิใจในความเป็นลูกผู้ชายตัวจริง ยิ่งไปกว่านั้น มอร์ดยังมีนิสัยใจกว้าง ร่ำรวย (ต้องขอบคุณเงินสนับสนุนกิจกรรมจากกษัตริย์ไอนาร์) และในสถานการณ์ส่วนใหญ่ก็เป็นคนใจดีอีกด้วย\n\nเอซิดิสผู้ถูกเพื่อนฝูงกีดกันด้วยเหตุผลตรงกันข้ามทุกประการ บัดนี้จ้องมองมอร์ดด้วยสีหน้าร้าวรานใจอย่างแสนสาหัส\n\nคนทรยศ\n\nโลกใบนี้เต็มไปด้วยคนทรยศ\n\nนักศึกษามหาวิทยาลัยวัยยี่สิบปีผู้เพิ่งตระหนักถึงสัจธรรมอันโหดร้ายก้มหน้าลงงุดแล้วพึมพำเสียงแผ่ว\n\n“กลับบ้านกันเถอะค่ะ ไม่สนุกแล้ว”\n\n“ขากลับแวะซื้ออะไรติดไม้ติดมือกลับไปกินไหม?”\n\n“ไม่เอาค่ะ!”\n\nในจังหวะที่ทั้งสองกำลังจะหันหลังกลับบ้านนั่นเอง…\n\nบุคคลที่คาดไม่ถึงทว่าคุ้นเคยเป็นอย่างดีก็ปรากฏตัวขึ้นตรงหน้า\n\n“ไม่เจอกันนานเลยนะ พี่ชาย”\n\n“…เจ้ามาอยู่ที่นี่ได้ยังไง?”\n\n“นอกจากรับราชโองการลับของฝ่าบาทแล้ว ข้าจะมีเหตุผลอื่นใดให้มาอยู่ที่นี่ได้อีกล่ะ?”\n\n“คุณลุงคะ!!”\n\n“โอ้ เอซี่ สบายดีหรือเปล่า? แค่เจ้าจากมาสามเดือนก็รู้สึกเหมือนผ่านไปตั้งสิบปีแล้ว มีหลานสาวอยู่ในวังกับไม่มีนี่บรรยากาศต่างกันลิบลับเลยนะ”\n\n“ฮิฮิ คุณลุงก็สบายดีเหมือนกันใช่ไหมคะ?”\n\nผู้ที่ปรากฏกายขึ้นใต้แสงโคมเวทมนตร์บนท้องถนนยามค่ำคืน คือชายร่างกำยำสูงใหญ่ผู้ไว้ผมชี้ฟูเสยไปด้านหลังอย่างดิบเถื่อน\n\nฮัสคาลแห่งไอนาร์ — ดิโอนาร์ เอริกสัน"
    },

      "title": "บทที่ 53: สายฝนฤดูร้อน",
      "content": "สายฝนฤดูร้อนเริ่มโปรยปรายลงมาทีละหยาดหยด เป็นเม็ดฝนที่ยิ่งขับเน้นความมืดมิดของรัตติกาลให้เข้มข้นและชโลมไล้ไออุ่นในอากาศให้เย็นฉ่ำลง\n\nอีวานยืนนิ่งอยู่ท่ามกลางสายฝน พลางจ้องมองบ้านพักอันมืดสนิทเบื้องหน้า แม้เสียงฝนที่ตกลงมาจะบดบังทัศนวิสัยลงไปบ้าง ทว่ามีสิ่งหนึ่งที่มั่นใจได้แน่นอน — ภายในบ้านหลังนั้นไม่มีสัญญาณของสิ่งมีชีวิตหลงเหลืออยู่เลย\n\n“ชิ”\n\nเขาจำดิโอนาร์ได้ อันที่จริง เขาจดจำรายชื่อคนสนิทใกล้ชิดของผู้นำแต่ละประเทศได้เกือบทั้งหมด กระทั่งเคยพบหน้าค่าตาเหล่าฮัสคาลอาวุโสของไอนาร์มาแล้วหลายคนด้วยซ้ำ\n\nฮัสคาลหลายนายรวมถึงมอร์ด ล้วนเคยตกเป็นเป้าหมายในการเฝ้าจับตาอย่างใกล้ชิดของสหราชอาณาจักร พวกเขาคือ “ตัวสำรอง” — ยอดฝีมือผู้เปี่ยมศักยภาพซึ่งถูกวางตัวไว้สำหรับทดแทนตำแหน่งที่ว่างลงในปาร์ตี้ผู้กล้า\n\nเมื่อนับรวมตัวอีวานเองด้วย เหล่าตัวสำรองต่างถูกจัดเตรียมไว้ครบทุกบทบาท และในหมู่คนเหล่านั้น ดิโอนาร์ก็นับเป็นหนึ่งในตัวเก็งที่แข็งแกร่งที่สุดซึ่งถูกคาดหมายว่าจะขึ้นมาสืบทอดตำแหน่งต่อจากไอนาร์\n\nหมอนั่นลงมือไปแล้วงั้นหรือ? อีวานครุ่นคิดอยู่ครู่หนึ่งก่อนจะส่ายศีรษะ\n\nเป็นไปไม่ได้\n\nกองบัญชาการต่อต้านข่าวกรองได้จัดวางสายลับระดับล่างคอยประกบ “แขกผู้มีเกียรติ” ในกรุงพริตเชนคายารวมถึงเอซิดิสเอาไว้แล้ว แม้มิใช่ระดับการคุ้มกันที่แน่นหนาเป็นพิเศษ แต่พวกเธอก็ยังถือเป็นบุคคลในความคุ้มครอง\n\nยิ่งไปกว่านั้น เวลานี้กองบัญชาการต่อต้านข่าวกรองยังหมายหัว “กลุ่มกบฏโดรอัน” ไว้เป็นผู้ต้องสงสัยอันดับต้นๆ ในคดีก่อการร้าย ต่อให้ดิโอนาร์ซึ่งเป็นชาวโดรอันโดยกำเนิดจะแทรกซึมเข้ามาได้แนบเนียนเพียงใด ทันทีที่โผล่หน้าเข้ามาใกล้ตัวเอซิดิส เขาก็จะต้องติดตาข่ายเฝ้าระวังทันที\n\nเช่นนั้น การที่บ้านว่างเปล่าเช่นนี้ ก็หมายความว่า… เธอเป็นฝ่ายออกไปข้างนอกกับมอร์ดด้วยความสมัครใจเอง\n\nแม้จะเดาไม่ออกว่าไปที่ไหน แต่ก็… บางทีคงแค่ออกไปเดินเล่นยามค่ำคืนกระมัง\n\n“ไม่ปลอดภัยเลยสักนิด”\n\nอีวานหมุนตัวกลับแล้วออกวิ่งทันที\n\nสายฝนทวีความหนักหน่วงขึ้นทุกขณะ\n\n***\n\nเอนริเก้ขมวดคิ้วมุ่นพลางเช็ดคมมีดเปื้อนเลือดลงบนแขนเสื้อของตน\n\n“อยู่ข้างหลังฉันไว้”\n\n“แต่ว่า อาจารย์คะ! หนูเองก็ควรจะช่วยทำอะไรบ้างไม่ใช่เหรอคะ?”\n\n“จับตาดูให้ดีแล้วเรียนรู้ซะ นั่นแหละงานของเธอ”\n\nดวงตาสีแดงฉานลุกโชนขึ้นท่ามกลางความมืดมิด ดวงเนตรอันคลุ้มคลั่งของผีดูดเลือดที่สูดได้กลิ่นคาวโลหิต\n\nคลองส่งน้ำใต้ดินแห่งกรุงพริตเชนคายา มหานครอันเก่าแก่ยิ่งกว่าประวัติศาสตร์ของอาณาจักรแห่งนี้มีทางน้ำใต้ดินที่สร้างสืบต่อกันมาตั้งแต่ยุคโบราณ ขยายตัวแตกแขนงออกไปราวกับเขาวงกตอันสลับซับซ้อน\n\nเงาร่างขนาดเล็กผุดโผล่ออกมาจากทุกซอกทุกมุม\n\n“ก๊าซซซ!!”\n\nใต้แสงสลัวรางในอุโมงค์ส่งน้ำ ผิวหนังสีเทาซีดเซียวปรากฏชัดแก่สายตา\n\nก็อบลินถ้ำ สายพันธุ์นักขุดเหมือง\n\nเอนริเก้ขมวดคิ้วแล้วพึมพำเสียงขรึม\n\n“ฉันน่าจะคาดการณ์เรื่องนี้ไว้ตั้งแต่ตอนที่พวกคนแคระโผล่มาแถบชานเมืองแล้วแท้ๆ”\n\nพวกคนแคระแทรกซึมด้วยการขุดอุโมงค์ใต้ดิน จุดประสงค์หลักของพวกมันคือการลอบเข้าตีแนวหลังและปั่นป่วนแนวรบ\n\nว่ากันว่าตราบใดที่ยังมีผืนดิน ย่อมไม่มีสถานที่ใดที่คนแคระแทรกซึมเข้าไปไม่ได้ นั่นคือคำร่ำลือทั่วไป แน่นอนว่าหากคำนึงถึงเส้นทางส่งกำลังบำรุงและค่าบำรุงรักษา ก็คงไม่ใช่ความจริงเสียทั้งหมด แต่ถึงอย่างนั้นก็เถอะ\n\nและพื้นที่ใดที่เคยถูกพวกคนแคระแทรกซึม ย่อมต้องสันนิษฐานไว้ก่อนว่าอุโมงค์ของพวกมันถูกขุดเชื่อมโยงไว้ทั่วถึงหมดแล้ว นั่นหมายความว่าเหตุก่อการร้ายของคนแคระหลงฝูงเพียงไม่กี่ตัว ไม่ควรถูกมองข้ามไปง่ายๆ เช่นนั้นเลย\n\nประเทศนี้ชะล่าใจเกินไปแล้วหลังจากได้ลิ้มรสสันติภาพมาเพียงแค่สี่ปี\n\nไม่สิ ไม่ใช่แค่นั้น ตัวเธอเองก็เป็นเหมือนกัน นั่นเพียงหมายความว่ามนุษย์กำลังเริ่มหลงลืมสงครามไปแล้วต่างหาก\n\nผู้คนทั้งมวลล้วนพยายามหลีกเลี่ยงความทรงจำด้านลบโดยสัญชาตญาณ นี่คือกลไกตามธรรมชาติ สงครามคือบาดแผลทางประวัติศาสตร์ และมนุษยชาติก็เร่งเขียนทับประวัติศาสตร์เหล่านั้นด้วยความทรงจำด้านบวกอย่างรวดเร็ว\n\nด้วยอานิสงส์นั้น อารยธรรมจึงฟื้นฟูขึ้นมาใหม่ได้อย่างน่าอัศจรรย์ จึงไม่อาจเรียกได้ว่าเป็นเรื่องเลวร้ายเสียทั้งหมด ทว่าเธอไม่อาจปล่อยตัวให้เป็นเช่นนั้นได้\n\nอย่างน้อยก็ไม่ใช่เธอ เธอผู้ครั้งหนึ่งเคยถูกขนานนามว่าเป็นผู้ปกครองแห่งทางน้ำใต้ดินกรุงพริตเชนคายา จอมโจรแห่งปาร์ตี้ผู้กล้า และก่อนหน้านั้น… เธอผู้สังหารผู้อาวุโสและก้าวขึ้นเป็นราชินีแวมไพร์แห่งพริตเชนคายา\n\n“ลูเซีย จับตาดูให้ดี”\n\nเอนริเก้กระซิบเสียงแผ่ว พลางกระชับมีดสั้นคู่ในท่าจับกลับด้าน\n\nเสียงคำรามขู่คำรนก้องสะท้อนไปทั่วทั้งคลองส่งน้ำใต้ดิน\n\nก็อบลินนักขุดเหมืองเป็นเผ่าพันธุ์ทาสของคนแคระ และการที่ฝูงก็อบลินปรากฏตัวขึ้นมาในแนวหน้า ย่อมหมายความว่าหน่วยรบพิเศษของพวกคนแคระจะต้องซุ่มซ่อนตัวอยู่ที่ไหนสักแห่งในความมืดเบื้องหน้านั้นแน่\n\nเธอจะจบเรื่องทั้งหมดลงตรงนี้ เพื่อมิให้ปีศาจหน้าไหนกล้าบุกรุกขึ้นไปบนตัวเมืองเบื้องบนแม้แต่ตนเดียว\n\nเอนริเก้สูดลมหายใจเข้าลึก แล้วพุ่งทะยานไปข้างหน้าดุจสายฟ้าแลบ ลัดเลาะผ่านความมืดมิด ท่ามกลางดวงตาสีแดงเรืองแสงนับไม่ถ้วน แหวกฝ่าฝูงปีศาจที่ยืนแน่นขนัดดุจพงไพรและยั้วเยี้ยราวฝูงแมลง\n\n“ก๊า…”\n\n“ฉับ”\n\nฝูงก็อบลินที่กรูกันเข้ามาพลันหยุดชะงักแข็งทื่อในฉับพลัน\n\nสิ่งที่ติดตามมาคือเสียงเฉือนตัดอันเย็นเยียบจับขั้วหัวใจ\n\n“โพล๊ะ!!”\n\nศีรษะของฝูงก็อบลินที่อัดแน่นอยู่แนวหน้าทั้งหมดระเบิดแหลกสลายพร้อมกันในเสี้ยววินาที\n\nสายฟ้าที่แลบแปลบปลาบอยู่เพียงลำพังในห้วงเวลาอันหยุดนิ่ง หวนคืนสู่กระแสธารแห่งกาลเวลาในที่สุด\n\nฝีแปรงอันประณีตเพียงหนึ่งตวัดของยอดช่างศิลป์ ความตายที่ถักทอขึ้นจากประกายแสงไหลลื่นกลับคืนเข้าสู่ฝักดาบอย่างนุ่มนวล\n\nท่ามกลางสายฝนโลหิตที่โปรยปรายลงมา เอนริเก้เดินฝ่าออกมาพลางขยับคลายหัวไหล่อย่างสบายอารมณ์\n\n“นี่แหละคือสนามรบของปาร์ตี้ผู้กล้า”\n\n“หนูอยากให้มันพอมองเห็นอะไรไปเรียนรู้ได้บ้างจังเลยค่ะ…”\n\n“ถ้ามองไม่เห็น ก็จงใช้ความรู้สึกสัมผัสเอา สักวันหนึ่งเธอก็จะมาถึงจุดนี้ได้เหมือนกัน”\n\nเอนริเก้ตบไหล่ลูกศิษย์เบาๆ แล้วออกเดินต่อไป\n\n***\n\n“ครืน…”\n\nท้องถนนสั่นสะเทือนเลื่อนลั่น ถนนหนทางที่ปูไว้สำหรับการสัญจรด้วยรถม้าในยุคสมัยนี้ ล้วนก่อสร้างขึ้นจากก้อนอิฐตัดแต่ง\n\nก้อนอิฐเหล่านั้นสั่นสะท้านเสียดสีกันเอง รอยแตกร้าวปริแยกปรากฏขึ้นทุกหนแห่ง ทั้งบนพื้นถนนและผนังอาคารบ้านเรือน\n\nแผ่นดินไหว? ไม่ใช่ ไม่ใช่เลยสักนิด\n\nนี่คือเสียงขุดเจาะ อีวานขมวดคิ้วมุ่นแล้วรีบกระทืบเท้าดีดตัวทะยานขึ้นจากพื้นดิน\n\nเขาถีบตัวส่งจากผนังด้านหนึ่ง พุ่งร่างไปยึดผนังฝั่งตรงข้าม ถีบส่งขึ้นไปอีก และทำซ้ำเช่นนั้นต่อเนื่องกัน\n\nเคลื่อนไหวรวดเร็วราวสายฟ้าแลบ เพียงพริบตาเดียวเขาก็ขึ้นไปเกาะอยู่บนราวระเบียงดาดฟ้าของอาคารที่สูงที่สุดเสียแล้ว\n\n“ครืน…”\n\nฝุ่นควันฟุ้งตลบขึ้นมาให้เห็นเด่นชัดแม้ท่ามกลางสายฝน ตัวอาคารสั่นคลอนและพื้นปฐพีบิดเบี้ยว ถนนหนทางคดเคี้ยวเลื้อยไปมาราวกับอสรพิษ\n\nเสียงขุดเจาะ การโจมตีเข้าสู่ใจกลางมหานคร\n\nพวกคนแคระ\n\n“ได้ยังไงกัน…?”\n\nในช่วงสงครามจอมมารครั้งที่ผ่านมา “หน่วยขุดเจาะ” ของพวกคนแคระถูกบดขยี้ทำลายล้างจนย่อยยับไปแล้ว พวกมันเคยเป็นหนึ่งในกองทัพปีศาจที่อันตรายที่สุด กองพันจู่โจมทางอากาศไวเวิร์นบนฟากฟ้า หน่วยลาดตระเวนคนแคระใต้ผืนพิภพ เหล่าขุมกำลังที่บีบบังคับให้รูปแบบยุทธวิธีต้องยกระดับขึ้นไปสู่อีกมิติหนึ่ง\n\nดังนั้น จึงไม่ควรมี “เครื่องขุดเจาะทลายปฐพี” ของพวกคนแคระหลงเหลืออยู่อีกเลยแม้แต่เครื่องเดียว อีวานยังคงจดจำภารกิจที่เครื่องขุดเจาะเครื่องสุดท้ายถูกทำลายลงได้อย่างแจ่มชัด\n\nทว่าการโจมตีระดับมหึมาเช่นนี้ที่ครอบคลุมพื้นที่ได้ทั้งเมือง ย่อมต้องอาศัยเครื่องขุดเจาะทลายปฐพีอย่างแน่นอน\n\nนั่นมันเป็นไปไม่ได้ ประการแรก เทคโนโลยีการผลิตเครื่องขุดเจาะของคนแคระสูญหายไปหมดแล้ว และประการที่สอง เป็นไปไม่ได้เลยที่จะไม่มีใครสังเกตเห็นกองทัพบุกรุกขนาดใหญ่ที่ขุดอุโมงค์ลัดเลาะใต้ดินเข้ามาถึงเพียงนี้\n\nกองบัญชาการต่อต้านข่าวกรองไม่ได้ไร้ความสามารถ ยิ่งไปกว่านั้น คราซิลอฟไม่ใช่แม้กระทั่งพื้นที่แนวหน้าด้วยซ้ำ\n\nพวกมันต้องขุดข้ามผ่านมากี่ประเทศและกี่เมืองกว่าจะมาถึงคราซิลอฟได้? ไม่มีเหตุผลใดเลยที่จะต้องมาโจมตีเมืองนี้\n\n“ไม่สิ มีอยู่”\n\nเว้นเสียแต่เพื่อเป้าหมายอย่างปาร์ตี้ผู้กล้า อีวานพยักหน้า มีเหตุผลอยู่จริงๆ\n\nทว่าปัญหาเรื่อง “วิธีการ” ก็ยังคงไร้คำตอบอยู่ดี\n\nประเทศอื่นที่เป็นสังคมยุคก่อนสมัยใหม่อาจตรวจไม่พบผู้แทรกซึม หากพวกมันระมัดระวังหลบเลี่ยงค่ายทหารและเขตเมืองใหญ่\n\nต่อให้หน่วยงานข่าวกรองจะเก่งกาจเพียงใด แล้วจะไปตามจับตัวตุ่นที่มุดขุดดินอยู่ใต้พิภพได้อย่างไรกัน?\n\nแต่มาตุภูมิแห่งนี้แตกต่างออกไป คราซิลอฟย่อมต้องรู้เรื่องดีกว่าใคร\n\nเพราะเพิ่งเกิดเหตุก่อการร้ายของพวกคนแคระใกล้เมืองหลวงเมื่อไม่กี่วันก่อนนี้เอง กองทัพ โดยเฉพาะกองพลรักษาการณ์นครหลวง ย่อมต้องดำเนินการสำรวจตรวจวัดชีพจรธรณีใต้ดินหลังเกิดเหตุเช่นนั้นอย่างแน่นอน\n\nกองทัพจะต้อง… ต้องล่วงรู้สถานการณ์นี้อย่างแน่นอนที่สุด\n\n“ธนาคารกลาง โรงละครทรงกลม มหาวิทยาลัยเซนต์ยานสก์ มหาวิหารเซนต์เชเรห์ตา สถานีตำรวจกลางพราเชนโกเหนือ…”\n\nอีวานกวาดสายตามองย่านใจกลางเมืองที่ได้รับผลกระทบจากแรงสั่นสะเทือนอย่างรวดเร็ว โดยตั้งสมมติฐานว่ามีอุโมงค์ใต้ดินและโบราณวัตถุขุดเจาะกำลังทำงานอยู่เบื้องล่าง\n\nด้วยการคำนวณย้อนกลับจากจุดศูนย์กลางแรงสั่นสะเทือนและร่องรอยความเสียหายที่ปรากฏบนพื้นผิว วิเคราะห์ความรุนแรงของแผ่นดินไหวที่แผ่ขยายออกเป็นใยแมงมุม เขาก็สามารถระบุตำแหน่งจุดศูนย์กลางได้ทันที\n\nเช่นนั้น สถานที่ทั้งห้าแห่งนี้ก็คือจุดศูนย์กลางของการก่อการร้ายในครั้งนี้\n\nและทั้งหมดนี้ก็น่าจะเป็นเพียงกลลวงเบี่ยงเบนความสนใจเท่านั้น\n\nเป้าหมายหลักที่แท้จริงก็คือเหล่าลูกหลานของปาร์ตี้ผู้กล้า\n\n“ลูเซียอยู่กับเอนริเก้ เพราะฉะนั้นไม่น่าเป็นห่วง”\n\n“อิซาเบลล์กับออสการ์อยู่ในเขตเดียวกัน พักเรื่องเอาไว้ก่อนได้”\n\n“เอลเฟียรา เมื่อพิจารณาว่าอยู่ในเขตที่พักอาศัยของพวกเอลฟ์ ก็ไม่น่าเป็นห่วงเช่นกัน”\n\n“ส่วนเอซิดิส”\n\nทายาทปาร์ตี้ผู้กล้าคนอื่นๆ ล้วนมีหนทางช่วยถ่วงเวลาได้ไม่ว่าฝ่ายคนแคระหรือพวกกบฏจะบุกจู่โจม ด้วยอาศัยทำเลที่ตั้งของที่พักและคุณลักษณะเฉพาะตัว\n\nช่วงเวลาสั้นๆ เพียงเท่านั้นก็มากพอให้กองบัญชาการต่อต้านข่าวกรองตอบสนองได้ทันท่วงที\n\nฉะนั้น เอซิดิส เด็กคนนี้กำลังตกอยู่ในอันตรายร้ายแรงที่สุดในเวลานี้\n\n“ตึก”\n\nอีวานถีบตัวออกจากผนังแล้วกระโจนลงสู่เบื้องล่าง\n\nเขาไม่รู้จักกลิ่นของเอซิดิส ทว่าหากสันนิษฐานว่ามอร์ดอยู่กับเธอ เขาย่อมจดจำกลิ่นของมอร์ดได้แม่นยำ\n\nเขาเคยร่วมรบเคียงบ่าเคียงไหล่กับชายผู้นั้น หลั่งเลือดและหยาดเหงื่อร่วมกันมามากกว่าสองครั้ง อีกอย่าง ผู้ชายชาวโดรอันไม่ค่อยอาบน้ำชำระร่างกายกันเป็นกิจจะลักษณะนัก เม็ดฝนที่ตกลงมาจึงเพียงแค่หน่วงเวลาได้เท่านั้น ไม่อาจชะล้างจนประสาทสัมผัสของเขาไขว้เขวไปได้หรอก\n\n***\n\n“ทำไม… ทำไมกัน น้องชาย… ทำไม…?”\n\n“เจ้าไม่เคยคิดบ้างเลยหรือว่ามันแปลก?”\n\nดิโอนาร์หัวเราะลั่น ขณะพาดร่างที่หมดสติของเอซิดิสไว้บนบ่า\n\nมอร์ดซึ่งทรุดฟุบอยู่บนพื้นโดยมีดาบปักตรึงทะลุท้องราวกับตอกตะปูหอบหายใจรวยรินพลางเอื้อมมือออกไป ขวานที่หล่นอยู่ห่างเกินกว่าจะเอื้อมถึง ทว่าเขาก็ยังไม่ยอมหยุด\n\nเพราะเขาต้องปกป้องหลานสาวให้จงได้\n\nเพราะนางคือลูกสาวของพี่ชาย\n\nและเพราะตัวเขาเองก็คือน้องชายของพี่ชายผู้นั้น\n\nนั่นคือเหตุผลเพียงข้อเดียว นั่นคือหน้าที่ของฮัสคาล ด้วยสองมือที่สั่นเทา เขาหอบสะอื้นพลางตะเกียกตะกายคลานเข้าไปหาขวานที่อยู่ห่างออกไป\n\n“หากสิทธิอันชอบธรรมของกษัตริย์และผู้ปกครองโลกในการบงการผู้อื่นคือเทวสิทธิ์ที่สวรรค์ประทานให้ เหตุใดการปกครองของผู้ถือครองเทวสิทธิ์เหล่านั้นจึงแตกต่างจากสรวงสวรรค์ที่จารึกไว้ในพระคัมภีร์นักเล่า?”\n\n“นั่นเจ้าพูด…?”\n\n“ก็แค่เรื่องตลกน่ะ”\n\nดิโอนาร์ก้มมองมอร์ดที่มีสีหน้าเหม่อลอยงุนงงแล้วแสยะยิ้มเยาะ\n\nพวกที่ไม่เข้าใจและไม่คิดแม้แต่จะทำความเข้าใจ ก็ไม่ต่างอะไรไปจากฝูงวัวฝูงแกะ พวกโง่เขลาที่ยอมเดินต้อยๆ เข้าโรงเชือดแต่โดยดี ตราบใดที่ยังได้กินหญ้าแม้อยู่ใต้คมแส้ของคนเลี้ยงแกะ\n\n“จะมีเหตุผลอื่นใดอีกล่ะ? พ่อของข้าเคยเป็นยาร์ล แล้วเหตุใดข้าจะเป็นบ้างไม่ได้กันเล่า?”\n\n“พี่ชายเจ้าคง…”\n\n“ไม่ให้อภัยข้าอย่างนั้นรึ? อา ดีสิ นั่นแหละคือความตั้งใจของข้าเช่นกัน”\n\nดิโอนาร์ยักไหล่แล้วก้าวเดินมุ่งหน้าไปยังปากตรอกพร้อมแบกเอซิดิสไว้บนบ่า\n\nครืน… แรงสั่นสะเทือนของแผ่นดินไหวยังคงดำเนินต่อไป มอร์ดรู้สึกถึงโลหิตในกายที่ค่อยๆ เย็นเฉียบลงท่ามกลางสายฝนพลางคร่ำครวญในใจ\n\nเขาไม่อาจปกป้องเอซิดิสเอาไว้ได้ เขากำลังจะตายไปโดยไม่ได้ต่อสู้อย่างสมศักดิ์ศรี เพราะพลาดท่าเสียทีให้แก่การลอบโจมตี\n\nเขาคงไม่มีคุณสมบัติคู่ควรจะเข้าร่วมการศึกชั่วนิรันดร์บนสรวงสวรรค์อีกต่อไป คงต้องร่วงหล่นลงสู่ก้นบึ้งของขุมนรก ซึ่ง… ใช่แล้ว นั่นย่อมเป็นทัณฑ์ทรมานอันสาสมแล้ว\n\n“ทำใจให้สบาย”\n\n“…?”\n\nเสียงทุ้มต่ำดังขึ้นเหนือศีรษะของเขา\n\nเมื่อเงยหน้าขึ้นมองด้วยสายตาอันพร่าเลือน เขาก็เห็นใบหน้าของบุรุษผู้เปียกโชกไปทั้งร่างใต้ผืนฟ้ายามราตรีอันมืดสลัว\n\n“คำสั่งเสีย… ของข้า…”\n\n“เอาไว้พูดตอนจะตายเถอะ”\n\nชายผู้นั้นเอื้อมมือลงมาจับด้ามดาบที่ปักคาท้องของเขาไว้แน่น ด้วยเสียงครูดกระแทกอันน่าสยดสยอง คมดาบก็ถูกกระชากถอนออกมา\n\nโลหิตพุ่งทะลักออกมาอย่างรุนแรง เลือดสีแดงฉานไหลปะปนไปกับแอ่งน้ำขังบนพื้นถนน\n\nชายคนนั้นก้มลงมองบาดแผลของมอร์ดแล้ววางฝ่ามือทาบทับลงไป\n\n“จะเจ็บหน่อยนะ”\n\n“อีวาน…”\n\n“เออ”\n\n“หลานสาวข้า… หลานสาวข้า…”\n\n“ฉันจะปกป้องเธอเอง”\n\nอีวานเปิดจุกขวดโพชั่นรักษาบาดแผลออก\n\nแม้ในยามที่ตัวยาถูกเทราดลงบนปากแผลฉกรรจ์กลางหน้าท้องโดยตรง มอร์ดก็ยังกัดฟันอดทนโดยไม่หลุดเสียงร้องออกมาสักแอะ นัยน์ตาแดงก่ำเบิกโพลง\n\nครั้นการปฐมพยาบาลฉุกเฉินเสร็จสิ้นลงในที่สุด มอร์ดที่หมดเรี่ยวแรงก็พึมพำออกมาด้วยน้ำเสียงแหบพร่า\n\n“ข้า… เชื่อใจเจ้า”\n\nอีวานลากร่างที่หมดสติของมอร์ดเข้าไปหลบใต้ชายคาที่สายฝนสาดไม่ถึง จับเขานั่งพิงกำแพงแล้วคลุมตัวให้ด้วยเสื้อโค้ตของตน\n\nตราบใดที่พลังเวทภายในร่างกายยังคงสมบูรณ์ดี ยอดมนุษย์ที่ปิดปากแผลเรียบร้อยและได้รับโพชั่นรักษาบาดแผลในปริมาณที่เพียงพอ ย่อมไม่มีวันหนาวตายจากภาวะอุณหภูมิร่างกายต่ำกว่าปกติ\n\nเขาดึงเศษผ้าแขนเสื้อที่ถูกกำแน่นอยู่ในมือของมอร์ดออกมา\n\nอีกฝ่ายคงคว้ากระชากไว้ได้โดยสัญชาตญาณระหว่างถูกดิโอนาร์โจมตี นับว่าโชคดีอย่างยิ่ง\n\n—สูด…\n\nกลิ่นนั้น ถูกจดจำไว้ขึ้นใจแล้ว\n\nอีวานหลับตาลง ผ่อนลมหายใจออกลึก ก่อนจะหันหลังแล้วพุ่งทะยานหายเข้าไปในความมืดมิดของมหานคร\n\n“ครืนนน…!!”\n\nแผ่นดินยังคงสั่นสะเทือนไม่หยุด\n\n***\n\n“วันนี้ ข้าจะทำให้ราชบัลลังก์แห่งคราซิลอฟว่างลง เจ้าจงเตรียมการเสีย”\n\n“พ่ะย่ะค่ะ ท่านอัครมหาเสนาบดี ไม่สิ…”\n\nดมิทรีก้มคำนับลงอย่างนอบน้อมไปทางระเบียงที่ชุ่มฉ่ำไปด้วยสายฝน\n\nเขาก้มกราบสามครั้งจรดหน้าผากลงกับพื้น ก่อนจะรีบเอ่ยแก้คำขานที่พลั้งปากออกไป\n\n“ฝ่าบาท ข้าน้อมรับพระบัญชาพ่ะย่ะค่ะ”\n\nเรือนผมสีเงินที่เปียกชุ่มด้วยสายฝนทอประกายเจิดจรัสอยู่ใต้แสงโคมไฟบนระเบียง"
    },

      "title": "บทที่ 54",
      "content": "มักจะได้ยินความเข้าใจผิดอยู่บ่อยๆ ว่าสายฝนจะช่วยชะล้างกลบกลิ่นให้จางลง นั่นเป็นความเข้าใจผิดเล็กๆ น้อยๆ ที่แก้ไขได้ง่ายดายเพียงแค่ลองเลี้ยงสุนัขดูสักตัว\n\nท่ามกลางสายฝน ประสาทรับกลิ่นของผู้ดมอาจทื่อลงบ้างก็จริง ทว่ากลิ่นกายของเป้าหมายหาได้จืดจางลงไม่ และประสาทสัมผัสของยอดมนุษย์ระดับผู้ก้าวข้ามขีดจำกัดย่อมไม่มีวันถูกรบกวนด้วยเรื่องกระจ้อยร่อยอย่างฝนฤดูร้อนเด็ดขาด\n\nยามต้องละอองฝน กลิ่นกายย่อมทวีความเข้มข้นขึ้นตามธรรมชาติ ต่อให้หยดน้ำกลั่นลงบนหนูทดลองในห้องปลอดเชื้อก็ยังเกิดผลเช่นนั้น นับประสาอะไรกับสภาพสุขอนามัยสาธารณะในยุคก่อนสมัยใหม่เช่นนี้\n\nยิ่งบวกกับข้อเท็จจริงที่ว่าเป้าหมายซึ่งถูกสะกดรอยคือชายชาวโดรอันที่เพิ่งเดินเท้าบุกป่าฝ่าดงมาหลายวันจนมาถึงเมืองหลวงเข้าด้วยแล้ว\n\nต่อให้ไม่นับค่านิยมอันเลื่องลือเรื่องการไม่แยแสสุขอนามัยของชาวโดรอัน กลิ่นของคนต่างถิ่นก็ย่อมแยกแยะได้ง่ายดายกว่าเสมอ\n\n“ทำเนียบกระทรวงการต่างประเทศงั้นเหรอ…?”\n\nอีวานพึมพำอย่างประหลาดใจขณะไล่ตามรอยกลิ่นไป\n\nแม้จะเทียบตามมาตรฐานของโลกเก่า ก็มีสถานที่อยู่สามแห่งที่ผู้ลักลอบเข้าเมืองผิดกฎหมายโดยไม่มีวีซ่าไม่ควรย่างกรายเข้าไปเด็ดขาด\n\nหนึ่งคือสำนักงานจัดหางานตามชนบทที่เสนอค่าแรงสูงผิดปกติ\n\nสองคือโรงงานต่างจังหวัด (หรือฟาร์ม หรือสถานประกอบการใดๆ ที่มีคำว่า “ไร่” อยู่ในชื่อ) ซึ่งมีคนจากบ้านเกิดเดียวกันทำงานกระจุกตัวอยู่มากผิดสังเกต\n\nและสุดท้ายคือกระทรวงการต่างประเทศ\n\nเช่นเดียวกับรายการลำดับอื่นๆ ข้อสุดท้ายย่อมสำคัญที่สุด สองกรณีแรกอย่างมากก็แค่ลงเอยด้วยการถูกขูดรีดแรงงานจนแทบขาดใจตาย ทว่ากรณีสุดท้ายนั้นลงมือประหารชีวิตจริงตามหน้าที่ราชการเลยทีเดียว\n\nในเกาหลีใต้ ผู้ลักลอบเข้าเมืองผิดกฎหมายจะถูกส่งตัวกลับประเทศอย่างเรียบร้อย ส่วนราชอาณาจักรคราซิลอฟอันเปี่ยมเมตตาจะยื่นข้อเสนอให้สองทางเลือกในกรณีเช่นนี้:\n\n1. กลับบ้านเกิดไปตายด้วยน้ำมือกษัตริย์ของเจ้าเสีย\n2. ตายด้วยน้ำมือของพวกข้าตามกฎหมายของเรา\n\nหากจะเอ่ยให้ฟังดู “สูงส่งแบบชนชั้นสูง” ขึ้นอีกสักหน่อย ก็คงเป็นการยื่นทางเลือกอันน่าทึ่งระหว่างการเนรเทศกับการมอบสัญชาติ (ในโลกนี้ แม้แต่พลเมืองที่ตายไปแล้วก็ยังนับเป็นพลเมือง เพราะยังคงต้องเสียภาษี)\n\nกระทรวงการต่างประเทศของคราซิลอฟคือหน่วยงานขนาดมหึมาที่ควบรวมเอากระทรวงการต่างประเทศของเกาหลีใต้ หน่วยงานทหาร (กองกำลังที่ไม่ขึ้นต่อสำนักพระราชวังหรือฝ่ายบริหารกองทัพ) และกองกำลังตำรวจสำหรับจัดการขุนนางต่างชาติเข้าไว้ด้วยกัน (โลกใบนี้ไม่มีหลักกฎหมายเขตอำนาจรัฐเหนือบุคคลตามสัญชาติ)\n\nยิ่งไปกว่านั้น เจ้ากระทรวงผู้กุมบังเหียนกระทรวงการต่างประเทศ หรือรัฐมนตรีว่าการกระทรวงการต่างประเทศ ก็หาใช่ใครอื่นไม่ หากแต่เป็นมกุฎราชกุมารอเล็กซานเดอร์ พระโอรสองค์โตของกษัตริย์คิริลล์ที่ 2 องค์ปัจจุบันนั่นเอง\n\n“นี่มัน… หละหลวมเกินไปแล้ว”\n\nอีวานขมวดคิ้วมุ่น\n\nหากวิเคราะห์สถานการณ์ตามหลักเหตุผล ต้นตอของความโกลาหลในเมืองหลวงเวลานี้ก็คือมกุฎราชกุมารอเล็กซานเดอร์\n\nเชื้อพระวงศ์ลึกลับผู้หายสาบสูญและไร้ร่องรอยผู้นี้ ย่อมต้องสมคบคิดกับกองพลทหารรักษาการณ์นครหลวงเพื่อลักลอบนำตัวพวกคนแคระเข้ามาในประเทศเป็นแน่\n\nเป้าหมายก็น่าจะเป็นบรรดาลูกหลานของปาร์ตี้ผู้กล้า และจุดประสงค์ก็คงเป็นการสร้างความแตกแยกภายในหรือก่อความโกลาหลไปทั่วทั้งสหราชอาณาจักร\n\nการเดินหมากเพียงตาเดียวทว่าส่งผลสะเทือนหลายกระดานเช่นนั้น ย่อมพิสูจน์ว่าอีกฝ่ายเป็นนักหมากรุกชั้นยอด ทว่านั่นยิ่งทำให้สถานการณ์ตรงหน้าดูประหลาดพิกลขึ้นไปอีก\n\nต่อให้เป็นในเกาหลีใต้ ชีวิตของรัฐมนตรีว่าการกระทรวงการต่างประเทศก็ไม่อาจรับประกันความปลอดภัยได้หรอกหากบังอาจให้ที่พักพิงแก่ผู้ก่อการร้ายต่างด้าวที่ลักลอบเข้าเมืองภายในกระทรวงเสียเอง (ส่วนในคราซิลอฟนั้นรับประกันได้แน่นอน เขาต้องตายสถานเดียว)\n\nอีวานหมุนหัวไหล่คลายเส้นหนึ่งครั้งแล้วผูกเชือกเข้ากับด้ามขวาน\n\n‘ไม่ได้แทรกซึมเข้าไปในหน่วยงานส่วนกลางของรัฐมานานแค่ไหนแล้วนะ’\n\nเขาไม่เคยพูดสักหน่อยว่าไม่เคยทำมาก่อน\n\nสมัยยังประจำการอยู่ เขาเคยผ่านปฏิบัติการพิเศษแทบทุกชนิดที่มีคำว่า “แทรกซึม” อยู่ในชื่อภารกิจมาแล้วทั้งสิ้น (ยกเว้นปราสาทจอมมาร)\n\n***\n\nเวลานี้ในกรุงพริตเชนคายากำลังเกิดวิกฤตการณ์สามประการปะทุขึ้นพร้อมกัน ทั้งนักเคลื่อนไหวภาคประชาชนผู้ทรงธรรมที่วางแผนก่อเหตุวินาศกรรม กลุ่มแบ่งแยกดินแดนที่ลักพาตัวบุคคลสำคัญ และกองโจรคอมมิวนิสต์ติดอาวุธ (เป็นคอมมิวนิสต์ติดอาวุธอย่างแท้จริง เพราะพวกมันเป็นคนแคระ) ที่กำลังเปิดฉากสงครามกองโจร\n\nท่ามกลางสถานการณ์อันสับสนอลหม่านเช่นนี้ หน่วยที่ควรออกปฏิบัติการระงับเหตุเป็นลำดับแรกย่อมหนีไม่พ้นกองพลรักษาการณ์นครหลวงและกองบัญชาการต่อต้านข่าวกรอง\n\nทว่าในสองหน่วยนี้ กองพลรักษาการณ์นครหลวงกลับดูเหมือนจะตกอยู่ใต้อิทธิพลของอเล็กซานเดอร์ เมื่อดูจากการปล่อยปละละเลยให้กองโจรกบฏติดอาวุธบุกโจมตีได้ถึงเพียงนี้\n\nมาถึงตรงนี้ อีวานก็อดสงสัยไม่ได้ว่า:\n\n‘แล้วกองบัญชาการต่อต้านข่าวกรองมัวไปทำอะไรอยู่กันแน่?’\n\nเหตุผลที่คำถามอันชอบธรรมข้อนี้ไม่อาจหาคำตอบได้ในทันที ก็เพราะเวลานี้เจ้าหน้าที่เกือบทั้งหมดของกองบัญชาการต่อต้านข่าวกรองถูกแบ่งกำลังออกเป็นสองซีก เพื่อปฏิบัติภารกิจระดับชาติในสถานที่ต่างกันอยู่นั่นเอง\n\n“นี่มัน… นี่มันคือการกบฏ!!”\n\n“มันคือกบฏจริงๆ นั่นแหละ”\n\nดมิทรีและเหล่าเจ้าหน้าที่กองบัญชาการต่อต้านข่าวกรองกำลังเข้ายึดครองห้องทำงานผู้บัญชาการกองพลรักษาการณ์นครหลวงอยู่ในขณะนี้\n\nเขานั่งไขว่ห้างอย่างสบายอารมณ์บนเก้าอี้นวมตัวหรูของผู้บัญชาการ พร้อมหยิบซิการ์ชั้นเลิศราคาแพงที่เก็บซ่อนไว้ในลิ้นชักออกมา\n\n—แกร๊ก\n\nนายทหารคนสนิทที่ยืนอยู่ข้างกายรีบตัดปลายซิการ์อย่างคล่องแคล่วแล้วจุดไฟด้วยเวทมนตร์จากปลายนิ้ว ควันยาสูบอันอบอวลไปด้วยกลิ่นอัลมอนด์และวานิลลาลอยอ้อยอิ่งขึ้นมาพร้อมเสียงไฟปะทุแผ่วเบา\n\n“แกพูดคำว่ากบฏโดยรู้ความหมายของมันดีหรือเปล่า?”\n\n“พวกแก… พวกแก… สิ่งที่พวกแกกำลังทำอยู่นี่มัน…!”\n\n“ไม่เลย กบฏคือข้อหาที่ถูกยัดเยียดให้แก่ผู้แพ้ที่ล้มเหลวต่างหาก ลงมือคือการปฏิวัติ ล้มเหลวคือการกบฏ และหากสำเร็จก็คือ…”\n\nเขาสูดควันซิการ์เข้าปอดลึกแล้วค่อยๆ พ่นออกมาอย่างเนิบช้า\n\nท่ามกลางม่านควันหนาทึบ ดวงตาสีฟ้าของท่านพันโทวาบประกายวาวโรจน์\n\n“พระราชโองการ”\n\n“บังอาจนัก…! ไอ้พวกกบฏ บังอาจเกินไปแล้ว!!”\n\n“กล้าเอ่ยคำว่ากบฏต่อหน้าพวกเรา ใจกล้าไม่เบาเลยนี่ ท่านพลจัตวา”\n\nดมิทรีหัวเราะหึในลำคอแล้วดีดนิ้ว นายทหารคนสนิทส่งปืนพกกระบอกหนักอึ้งมาวางลงในฝ่ามือของเขา\n\nเขาใช้กระบอกปืนเคาะลงบนโต๊ะเบาๆ บนนั้นมีรายงานสองฉบับกับสำเนาลายมือเขียนอีกหนึ่งฉบับวางเรียงอยู่\n\n“นี่คือรายงานผลการตรวจวัดชีพจรธรณีที่ท่านเขียนขึ้นหลังเหตุก่อการร้ายคนแคระบริเวณชานกรุงพริตเชนคายา ส่วนนี่คือบันทึกการลาดตระเวนแนวรอบนอกตลอดหนึ่งเดือนที่ผ่านมาของท่าน และนี่… คือสิ่งที่พวกเรา ‘บังเอิญ’ ได้มาโดยไม่ตั้งใจ — ‘สำเนาคัดลอกโทรเลขลับ’”\n\n“พวกแกไปเอา… ของแบบนั้นมาจากไหน…?”\n\n“อะไรก็ตามที่แปะป้ายว่าความลับ ย่อมเป็นหน้าที่ของพวกเราที่จะต้องสืบเสาะให้รู้ว่าข้างในเขียนอะไรไว้”\n\nดมิทรียิ้มหยันพลางพลิกเปิดอ่านสำเนาคัดลอกลายมือนั้น\n\n“ผู้รับคือมกุฎราชกุมารอเล็กซานเดอร์ ส่วนเนื้อหารายงานหลัก โอ้ ท่านถึงขั้นวางแผนงานก่อสร้างและแผนฝึกภาคสนามบังหน้า เพื่อกลบเสียงขุดเจาะของกองพันทหารช่างคนแคระที่มุ่งหน้าสู่ชั้นใต้ดินของเมืองหลวงเชียวหรือ? รอบคอบเสียจริง”\n\n“ใส่ร้าย! นั่นมันเรื่องใส่ร้ายทั้งเพ!”\n\n“บางทีท่านอาจจะพูดผิดเป็น ‘เรื่องท้าทาย’ กระมัง? การผจญภัยครั้งยิ่งใหญ่ในการลักลอบพาพวกปีศาจเข้ามาในพริตเชนคายา… ท่านช่างมีจิตวิญญาณนักผจญภัยที่เกินคาดจริงๆ ไม่น่าหลวมตัวมารับราชการทหารเลยนะ”\n\nดมิทรีก้มมองนายพลจัตวาที่คุกเข่าตัวสั่นเทา อาบเลือดสะอึกสะอื้นอยู่บนพื้นอย่างสงบนิ่ง\n\nคาบซิการ์ไว้ที่มุมปาก พลางเอ่ยถามด้วยน้ำเสียงราบเรียบเป็นกันเอง:\n\n“ตอนนี้มกุฎราชกุมารอเล็กซานเดอร์ตัวจริงอยู่ที่ไหน?”\n\n“ตัวจริง? พูดเรื่องอะไรกัน…? ฝ่าบาทก็ย่อมประทับอยู่ที่พระราชวังตะวันตกน่ะสิ…”\n\n“เฮ้อ เห็นทีพวกเราคงต้องเรียนรู้วิชาลบร่องรอยตัดตอนจากท่านเสียบ้างแล้ว ทำยังไงถึงได้ดำเนินแผนการซับซ้อนขนาดนั้นโดยไม่เผยพิกัดที่อยู่จริงออกมาเลยแม้แต่จุดเดียว?”\n\nดมิทรีลุกขึ้นยืนพร้อมรอยยิ้มขมขื่น เขายกปืนพกขึ้นอย่างเชื่องช้าแล้วเดินมายืนประจันหน้ากับนายพลจัตวา\n\n“ก่อนจะดำเนินการประหาร ขอถามอะไรสักหนึ่งข้อก็แล้วกัน”\n\n“ไว้ชีวิตข้าด้วย ข้า… ข้าไม่รู้อะไรเลย เรื่องใส่ร้าย มันคือการใส่ร้าย! องค์หญิง… ไม่สิ! ไม่นะ! ให้ข้าเข้าเฝ้าฝ่าบาทเถิด!”\n\n“ความจงรักภักดีของท่านสถิตอยู่ ณ ที่ใด?”\n\n“พะ พูดบ้าอะไรน่ะ! ย่อมต้อง… ย่อมต้องเพื่อประเทศนี้… เพื่อราชวงศ์คราซิลอฟอันยิ่งใหญ่สิ…!”\n\n—กริ๊ก\n\n—ปัง!\n\nกลุ่มควันทึบซึ่งแตกต่างจากควันซิการ์อย่างสิ้นเชิงลอยฟุ้งออกจากปากกระบอกปืน ในวินาทีเดียวกับที่ริมฝีปากของนายพลจัตวาปิดสนิทลงตลอดกาล\n\nดมิทรีส่งปืนคืนให้นายทหารคนสนิท สวมถุงมือให้เรียบร้อยแล้วหมุนตัวเดินจากมา\n\n“จดบันทึกไว้ การลงทัณฑ์ฝ่ายกบฏที่สมคบคิดก่อกบฏต่อแผ่นดิน ได้รับการสำเร็จโทษตามพระราชโองการเรียบร้อยแล้ว”\n\n“รับทราบครับ ท่านพันโท”\n\n“มกุฎราชกุมารตัวปลอมล่ะ?”\n\n“หน่วยที่ 2 และหน่วยที่ 5 เข้าควบคุมสถานการณ์ที่พระราชวังตะวันตกได้เรียบร้อยแล้วครับ”\n\n“หน่วยที่ 3?”\n\n“เมื่อสิบห้านาทีก่อน ได้ ‘คุ้มครอง’ ‘อดีตกษัตริย์’ ให้ปลอดภัยจากการลอบทำร้ายของ ‘พวกกบฏ’ สำเร็จลุล่วงแล้วครับ”\n\n“ดี แล้ววัตถุระเบิดในเมืองล่ะ?”\n\n“หน่วยที่ 4 ระบุตำแหน่งที่ซุกซ่อนและจำนวนทั้งหมดเสร็จสิ้นแล้วครับ ท่านพันโท จะให้สั่งการเข้าเก็บกู้เลยไหมครับ…?”\n\n“ไม่ ไม่ใช่แบบนั้น”\n\nดมิทรีผลักบานประตูห้องทำงานผู้บัญชาการเปิดออกแล้วเอ่ยด้วยน้ำเสียงเย็นเยียบ\n\n“พิธีบรมราชาภิเษกจะขาดเสียงปืนใหญ่สลุตไปได้อย่างไร? ถ้าพวกมันอยากจะระเบิดพริตเชนคายานัก ก็ปล่อยให้พวกมันระเบิดไปสิ”\n\n“…แล้วผู้คนตรงจุดศูนย์กลางระเบิดล่ะครับ…”\n\n“อพยพพลเรือนออกไปซะ ไม่จำเป็นต้องให้เกิดการนองเลือดอย่างไร้ประโยชน์ สิ่งสำคัญคือเสียงระเบิด ไม่ใช่ยอดผู้เสียชีวิต”\n\nระเบิดถูกวางโดยอาชญากรต่างชาติ\n\nอาชญากรเหล่านั้นถูกว่าจ้างโดยมกุฎราชกุมารอเล็กซานเดอร์เพื่อระเบิดกรุงพริตเชนคายา\n\nมกุฎราชกุมารหมายจะช่วงชิงราชบัลลังก์ท่ามกลางความโกลาหลในเมืองหลวง ทว่าแผนการถูกสกัดกั้นไว้ได้ทันท่วงที และต่อมามกุฎราชกุมารก็หายสาบสูญไป กษัตริย์ทรงโทมนัสต่อการก่อกบฏของพระโอรสจนตัดสินพระทัยสละราชสมบัติ\n\nในเมื่อทุกอย่างตั้งอยู่บนข้อเท็จจริงทั้งสิ้น สิ่งเดียวที่กองบัญชาการต่อต้านข่าวกรองต้องทำ ก็คือประกาศเรื่องราวนี้ให้ประชาชนและประชาคมระหว่างประเทศได้รับทราบโดยทั่วกัน\n\n“แล้วพวกเด็กๆ ทายาทปาร์ตี้ผู้กล้าล่ะครับ…”\n\n“นั่นเป็นงานของรุ่นพี่มาตั้งแต่แรกอยู่แล้ว อย่าไปยุ่ง พันโทเปโตรวิชไม่ชอบให้ใครสอดมือเข้าไปก้าวก่ายในเขตรับผิดชอบของตัวเอง”\n\nผู้เดียวที่หลงเหลืออยู่เพื่อปิดจ๊อบเก็บกวาดสถานการณ์นี้ให้สมบูรณ์ มีเพียงคนตัดไม้คนเดียวเท่านั้น\n\nเจ้าหน้าที่ภาคสนามมือพระกาฬที่สุดที่หน่วยเก็บกวาดเคยปลุกปั้นขึ้นมาในยุคสงคราม — อีวาน เปโตรวิช\n\nเพียงเท่านี้ ทุกสิ่งทุกอย่างก็ปิดฉากลงอย่างสมบูรณ์ ดมิทรีแย้มยิ้มบางๆ ด้วยหัวใจอันปลอดโปร่งโล่งอก\n\n***\n\nเอซิดิสตัวสั่นเทาด้วยอาการปวดศีรษะที่แล่นริ้วขึ้นมา ก่อนจะฝืนลืมตาขึ้นอย่างยากลำบาก\n\nภายในห้องอันมืดมิดช่างอึมครึมวังเวงยิ่งนัก… ราวกับห้องขัง… ไม่สิ มันคือคุกจริงๆ เสียด้วย\n\nนี่มันเรื่องอะไรกัน? ทำไมฉันถึงโดนจับมาขังได้ล่ะ? คุกเนี่ยนะ…? นี่ฉันไปก่ออาชญากรรมอะไรไว้ตั้งแต่เมื่อไร…?\n\nเอซิดิสผู้สามารถเงยหน้ามองฟ้าได้โดยปราศจากมลทินใดๆ ให้ละอายใจ รู้สึกไม่ได้รับความเป็นธรรมอย่างยิ่ง\n\n“ตื่นแล้วเหรอ เอซี่?”\n\n“เบลล่า! แถมยังมีคุณออสการ์ด้วยเหรอคะ?!”\n\nเธอหันไปพบคนทั้งสองนั่งอยู่มุมหนึ่งของห้องขังเข้าพอดีจึงยิ้มกว้างออกมา แน่นอนอยู่แล้ว!\n\n“พวกเธอมาช่วยฉันใช่ไหมคะ!”\n\n“เปล่า พวกเราก็โดนจับมาเหมือนกัน”\n\nอิซาเบลล์กับออสการ์ตอบกลับพร้อมรอยยิ้มอันแสนสิ้นหวัง\n\n***\n\n‘พวกจากทิลเลสก็โดนจับมาด้วยเหมือนกันสินะ’\n\nอีวานเดาะลิ้นเบาๆ ขณะก้มมองร่างที่หมดสติและเต็มไปด้วยบาดแผลของดิอัน\n\nอีกฝ่ายถูกพบอยู่ในห้องสอบสวนบนชั้นสองของทำเนียบกระทรวงการต่างประเทศ\n\nต่างจากมอร์ด รายนี้ไม่มีบาดแผลฉกรรจ์ถึงชีวิต นับว่าโชคดี นั่นหมายความว่าไม่มีคนทรยศมาจากฝั่งทิลเลส\n\nหากทิลเลสมีส่วนพัวพันในเหตุการณ์ครั้งนี้ด้วย ดิอันคงไม่มีโอกาสถูกจับเป็นมาถึงที่นี่ พวกมันย่อมต้องฆ่าปิดปากทิ้งทันทีเพื่อตัดตอน\n\nอีวานเดาะลิ้นอีกครั้งก่อนผลักเปิดประตูห้องสอบสวนออกไป\n\n‘กองบัญชาการต่อต้านข่าวกรอง… ต้องจับมาฝึกใหม่เสียหน่อยแล้ว’\n\nเหตุใดหน่วยข่าวกรองภายในประเทศถึงได้ปล่อยให้มีช่องโหว่ในการคุ้มครองบุคคลสำคัญระดับชาติมากขนาดนี้ได้?\n\nอีวานรู้สึกเอือมระอาเป็นอย่างยิ่ง สมัยเขายังประจำการอยู่ ไม่มีทางเกิดเรื่องพรรค์นี้ขึ้นได้เด็ดขาด\n\nเขาครุ่นคิดถึงสารพัดหลักสูตรการฝึกโหดที่จะนำมาปรับใช้กับกองบัญชาการต่อต้านข่าวกรองพลางก้าวเดินต่อไปข้างหน้า\n\n—แฉะ แฉะ\n\nตามโถงทางเดินของทำเนียบกระทรวงการต่างประเทศ โคมไฟเวทมนตร์ที่แตกหักกะพริบแสงติดๆ ดับๆ\n\nโลหิตและน้ำฝนเจิ่งนองไปทั่วพื้น ก่อเกิดเสียงเฉอะแฉะตามทุกย่างก้าวที่เดินผ่าน\n\nตลอดเส้นทางที่สั้นที่สุดซึ่งมุ่งตรงขึ้นสู่ชั้นบนสุด เศษซากของกองกำลังติดอาวุธทั้งหมดที่บังอาจเข้ามาขวางทางอีวาน ต่างสะท้อนแสงไฟวาบวับเป็นสีแดงฉาน\n\nโดยที่ลมหายใจไม่ติดขัดหอบเหนื่อยเลยแม้แต่น้อย อีวานก้าวเดินไปตามโถงทางเดินอย่างเงียบงัน\n\n***\n\n**💬 ความคิดเห็นนักอ่าน:**\n- **@KrasilovWatcher** (5 วันที่แล้ว • 👍 142): ดมิทรีคุมเกมโคตรเฉียบ เปลี่ยนระเบิดกบฏให้กลายเป็นพลุฉลองราชาภิเษกเอลิซาเวตาได้หน้าตาเฉย ช็อตนี้ราชวงศ์ซื้อใจคนทั้งเมืองไปเต็มๆ\n- ↳ **@สายการเมืองโซฟา** (5 วันที่แล้ว • 👍 46): จังหวะบีบคิริลล์ที่ 2 สละราชสมบัติแบบนิ่มๆ ไม่มีเสียเลือดเนื้อในวังก็คือสุดยอดจริง คะแนนความประทับใจองค์หญิงพุ่งกระฉูด\n- **@ขวานลุงไม่เคยปรานี** (4 วันที่แล้ว • 👍 198): ส่วนตัดภาพมาที่ลุงอีวานบุกเดี่ยวทำเนียบกระทรวงการต่างประเทศ... เหลือแค่เสียงแฉะๆ ของเลือดกับน้ำฝนตามทางเดิน สงสารกองกำลังติดอาวุธเลยที่ดันมายืนขวางทาง \"เจ้าหน้าที่ภาคสนามมือพระกาฬที่สุดของหน่วยเก็บกวาด\"\n- **@นายช่างฝึกหัด** (4 วันที่แล้ว • 👍 87): ไว้อาลัยให้กองบัญชาการต่อต้านข่าวกรองล่วงหน้าได้เลย เห็นลุงบ่นเรื่องช่องโหว่การคุ้มครองขนาดนี้ จบศึกปุ๊บโดนลุงจับซ่อมหลักสูตรฝึกโหดแน่นอน 555\n- **@NokHook_TH** (3 วันที่แล้ว • 👍 54): จังหวะช่วยเหลือดิอันนี่อย่างเท่ แต่ประโยคสุดท้ายที่เดินขึ้นบันไดไปแบบลมหายใจไม่สะดุดคือขนลุกสุด อยากอ่านตอนหน้าแล้ว!"

      "title": "บทที่ 55",
      "content": "ทำเนียบกระทรวงการต่างประเทศไม่ได้เป็นปราสาทจอมมารหรือพระราชวังที่พำนักของเหล่าเจ็ดขุนพลมังกร จึงมีโครงสร้างอาคารแบบเรียบง่ายไม่ต่างจากสถานที่ราชการทั่วไป\n\nกล่าวอีกนัยหนึ่ง ก็เป็นอย่างที่คาดคิดไว้ไม่ผิดเพี้ยน โถงทางเดินสีขาวสะอาดตาหลายชั้นที่เรียงรายไปด้วยห้องทำงานตลอดแนว\n\nแน่นอนว่าเรื่องนี้ออกจะแปลกอยู่สักหน่อย โดยปกติแล้ว ทำเนียบควรจะเป็นสถานที่สำหรับพักอาศัย มิใช่สถานที่ปฏิบัติราชการ\n\nทว่าสิ่งสำคัญที่ต้องคำนึงถึงก็คือ รัฐมนตรีว่าการกระทรวงการต่างประเทศของคราซิลอฟคือมกุฎราชกุมาร มกุฎราชกุมารของประเทศหนึ่งย่อมไม่มาประทับอยู่จริงในทำเนียบกระทรวงการต่างประเทศหรอก\n\nดังนั้น กระทรวงการต่างประเทศจึงนำทำเนียบกระทรวงการต่างประเทศแห่งนี้มาใช้เป็นอาคารสำนักงานอเนกประสงค์ พูดให้ชัดก็คือมันเป็นเสมือนอาคารที่ทำการของมกุฎราชกุมารนั่นเอง (หากพระองค์ทรงง่วงบรรทม ก็ทรงสามารถเอนพระวรกาย ‘พักผ่อนอย่างแสนสบาย’ ในห้องทำงานได้ นับเป็นอภิสิทธิ์ของเชื้อพระวงศ์โดยแท้)\n\n“นี่มัน…”\n\nอีวานขมวดคิ้วมุ่นขณะเดินสำรวจผ่านชั้นสามของทำเนียบ หลังจากบุกทะลวงเข้ามาถึงช่วงกลางของอาคารห้าชั้นแห่งนี้ เขากลับไม่พบเจ้าหน้าที่ฝ่ายธุรการเลยแม้แต่คนเดียว มีเพียงเหล่าทหารติดอาวุธปรากฏตัวออกมาเท่านั้น\n\nแถมยังเป็นพวกเกรดต่ำที่ฝีมือแทบไม่ต่างจากทหารรับจ้างเลยด้วยซ้ำ\n\n“ให้ความรู้สึกเหมือนด่าน 1 เลยแฮะ…”\n\nเมื่อมาถึงจุดนี้ อีวานก็ตระหนักถึงความผิดพลาดของตนเอง\n\nหากสมมติว่าเหล่าทายาทของปาร์ตี้ผู้กล้าคือตัวละครเอก ย่อมเป็นเรื่องธรรมดาที่จะต้องมีศัตรู อุปสรรค เควสต์ และขุมกำลังปรปักษ์อื่นๆ ปรากฏตัวขึ้นมาตามการดำเนินเรื่อง\n\nเมื่อตั้งสมมติฐานเช่นนั้น ความ ‘งุ่มง่าม’ และ ‘ไร้ความสามารถ’ อันชวนตะขิดตะขวงใจที่อีวานสัมผัสได้มาตลอด ก็พลันสมเหตุสมผลขึ้นมาในทันใด\n\nQ: เหตุใดจึงลักพาตัวเหล่าทายาทของปาร์ตี้ผู้กล้าแทนที่จะสังหารทิ้งคาที่เสียเลย?\n\nA: เพราะต้องเลือกตัวละครก่อนถึงจะเริ่มเคลียร์ด่านได้ยังไงล่ะ\n\nQ: เหตุใดภายในทำเนียบกระทรวงการต่างประเทศจึงมีเพียงทหารรับจ้างเลเวลต่ำเดินเพ่นพ่านอยู่เต็มไปหมด?\n\nA: เพราะมอนสเตอร์ทั่วไปในด่าน 1 ไม่ควรจะแข็งแกร่งจนเกินไป\n\nQ: แล้วกองบัญชาการต่อต้านข่าวกรองมัวไปทำอะไรอยู่ ระหว่างที่ทายาทของปาร์ตี้ผู้กล้าถูกลักพาตัวไปทีละคนเช่นนี้?\n\nA: เพราะนั่นคือ ‘สามัญสำนึก’ ของเกมอาเขตยังไงล่ะ\n\nอ่า\n\nแย่ล่ะสิ\n\nอีวานอุทานนึกขึ้นได้พร้อมกับถอนหายใจสั้นๆ ออกมาพร้อมกัน แบบนี้หมายความว่าไม่ควรฆ่าพวกมันทิ้งทั้งหมดงั้นเหรอ?\n\nเขาหันหลังกลับไปมองอย่างเหม่อลอย โถงทางเดินสีขาวสะอาดตาในยามนี้ดูราวกับมีใครนำถังสีแดงมาสาดกระจายไว้ทั่วทุกหนแห่ง\n\nทำเนียบกระทรวงการต่างประเทศที่เคยสะอาดสะอ้านได้แปรสภาพเป็นโรงงานแปรรูปเนื้อสัตว์อันแสนคึกคักไปอย่างสมบูรณ์แบบ (ทว่าไร้ซึ่งความใส่ใจด้านกฎระเบียบสุขอนามัยโดยสิ้นเชิง) เมื่อได้เห็นภาพตรงหน้า อีวานจึงถอนหายใจเฮือกใหญ่\n\nหากอนุมานอย่างกล้าหาญสักหน่อย เอพพิโซดนี้คงถูกวางบทไว้ให้เป็นอีเวนต์ ‘เติบโต’ สำหรับเหล่าทายาทของปาร์ตี้ผู้กล้าผู้เป็นตัวละครเอก\n\nในบรรดานั้น เส้นเรื่องที่นับว่าเป็น ‘เนื้อเรื่องหลัก’ ก็น่าจะเป็นการเติบโตของเอซิดิส\n\nกระบวนการทั้งหมดในการก้าวข้ามการทรยศหักหลังของลุงผู้เป็นฮัสคาลที่เธอไว้เนื้อเชื่อใจ และคลี่คลายสถานการณ์ด้วยตนเอง คงจะเป็นเนื้อเรื่องดั้งเดิมที่ถูกกำหนดไว้ตั้งแต่แรก\n\nอีวานลูบคางครุ่นคิดอยู่ครู่หนึ่งก่อนจะส่ายศีรษะ\n\nมาถึงขั้นนี้แล้วก็ไม่มีทางรู้แน่ชัดได้อีกต่อไป เมื่อทุกอย่างเริ่มหมุนเดินหน้าไปแล้ว ก็จำต้องดำเนินไปให้ถึงบทสรุป การมาหยุดกลางคันแล้วบอกว่า ‘เรื่องนี้ดูไม่ค่อยเข้าท่าแฮะ’ ย่อมไม่ช่วยให้อะไรดีขึ้นมาเลย\n\nเขาสลัดความคิดทิ้งไปแล้วก้าวขึ้นบันไดต่อ พร้อมกับขวานในมือ\n\n***\n\nชั้นสี่ของทำเนียบกระทรวงการต่างประเทศ โถงทางเดินอันมืดสลัวเงียบสงัด ไร้วี่แววของสิ่งมีชีวิต\n\nนอกจากเสียงหยาดฝนที่ตกกระทบกระจกหน้าต่างแล้ว ก็ไม่มีเสียงอื่นใดอีกเลย ขณะที่อีวานเดินทอดน่องอย่างมั่นคงไปตามโถงทางเดินและค่อยๆ กระชับด้ามขวานในมือให้แน่นขึ้น\n\nประสาทการได้ยินของเขาค่อยๆ เฉียบคมขึ้น พร้อมกับเสียงหึ่งกังวานอันคุ้นเคยในโสตประสาท\n\n“พวกเราเองก็โดนจับมาเหมือนกัน”\n\n“งั้นเหรอ…”\n\nเสียงกระซิบกระซาบเหล่านั้นเป็นของเหล่าทายาทปาร์ตี้ผู้กล้า เสียงดังลอดมาจากห้องทำงานด้านบนตรงหน้าขึ้นไปหนึ่งชั้น\n\nทันทีที่ระบุตำแหน่งได้ชัดเจน อีวานก็เริ่มออกตัวเคลื่อนไหว\n\nหากมองในเชิงปฏิบัติ เขาตัดสินใจว่าจะเข้าไปช่วยพวกเด็กๆ ออกมาก่อน แล้วค่อยคิดเรื่องรายละเอียดทีหลัง ไม่ว่านี่จะเป็นสเตจ เอพพิโซด หรือบทที่เท่าไร หรือเรื่องราวนี้ถูกสร้างขึ้นมาเพื่อวัตถุประสงค์ใดก็ตาม\n\nเมื่อพิจารณาจากระดับความยากที่พุ่งสูงขึ้นอย่างก้าวกระโดดจากด่านฝึกสอนของเอซิดิสมายังด่านฝึกสอนของอิซาเบลล์ อีเวนต์ครั้งนี้ย่อมมีอิทธิพลต่อเหตุการณ์ถัดไปอย่างแน่นอน\n\nเหตุการณ์ที่ดำเนินไปตามตรรกะของเกม ทว่ากลับแปรเปลี่ยนไปอย่างเป็นธรรมชาติตามบริบทการเมืองและดุลอำนาจระหว่างประเทศ ความแตกต่างอันละเอียดอ่อนระหว่างเกมกับความเป็นจริงนี้ทำเอาความคิดของอีวานพันกันยุ่งเหยิง\n\n– ผึง…\n\nทันใดนั้นเอง เขาก็ได้ยินเสียงเส้นด้ายขาดผึงดังมาจากระยะไกล วินาทีที่รับรู้ถึงเสียงนั้น อีวานก็ก้มตัวหมอบลงทันที\n\nในพริบตาถัดมา สัมผัสตรวจจับแนววิถีกระสุนอันรุนแรงพลันแลบปลาบขึ้นมา\n\n– ฟุ่บ…\n\n– โครม!!\n\nดาบใหญ่เล่มหนึ่งแหวกอากาศพุ่งเข้ามาปักตรึงลง ณ จุดที่อีวานเคยยืนอยู่เมื่อครู่ อีวานดีดตัวถอยห่างเพื่อเว้นระยะแล้วเงื้อขวานขึ้นตั้งรับ\n\nการโจมตีที่พุ่งเข้ามาแทบจะพร้อมกับจังหวะตรวจจับแนววิถีกระสุน หากเป็นเพียงยอดมนุษย์ธรรมดาที่ไม่ได้เตรียมตัวไว้ล่วงหน้า คงสิ้นใจตายไปแล้ว\n\nนั่นหมายความว่านี่คือการโจมตีจากยอดมนุษย์อีกคนหนึ่ง การต่อสู้ระหว่างยอดมนุษย์ย่อมดำเนินไปในลักษณะนี้เสมอ\n\nสมรภูมิของเหล่ายอดมนุษย์ซึ่งก้าวเข้าไปผ่านการปลุกเร้าประสาทสัมผัสนั้น มิใช่การทำให้เวลาเดินช้าลง ทว่าเป็นการเร่งกระบวนการทำงานของระบบประสาทให้รับรู้กาลเวลาในระดับเสี้ยววินาที\n\nฉะนั้น หากถูก ‘ยอดมนุษย์ลอบโจมตี’ ก่อนที่การเร่งประสาทสัมผัสจะทันทำงาน ย่อมไม่อาจตอบสนองได้ทัน ในโลกของเหล่ายอดมนุษย์ แนวคิดเรื่องการโต้กลับจึงไร้ความหมาย ฝ่ายที่ชิงลงมือก่อนย่อมได้เปรียบเสมอ\n\nเพื่อแก้ไขปัญหานี้ ‘สัญชาตญาณ’ จึงถูกพัฒนาขึ้นมา มันคือการยกระดับจากการตรวจจับแนววิถีกระสุน เป็นสัญชาตญาณหยั่งรู้สำหรับการรับมือการลอบโจมตีโดยเฉพาะ\n\nหากการตรวจจับแนววิถีกระสุนคือเส้นแบ่งระหว่างคนธรรมดากับยอดมนุษย์ ‘สัญชาตญาณ’ ก็คือมาตรวัดที่ใช้จำแนกความแตกต่างในหมู่ยอดมนุษย์ด้วยกันเอง\n\n“หลบพ้นด้วยเรอะ?”\n\nฉะนั้น การตอบสนองต่อการโจมตีของยอดมนุษย์ได้ด้วยสัญชาตญาณ ย่อมเผยให้เห็นระดับฝีมือของอีกฝ่ายในทันที\n\n“เหอะ พวกพ้องของข้าอุตส่าห์ทุ่มแรงกายกันแทบตายเพื่อล่อคนฝีมือระดับนี้ให้กระจัดกระจายออกไปแท้ๆ”\n\n“ดิโอนาร์ เอริกสัน”\n\n“ดูเหมือนเจ้าจะเคยพบข้ามาก่อนสินะ ข้าความจำดีเรื่องใบหน้าคน แต่กลับนึกไม่ออกเลยว่าเจ้าเป็นใคร”\n\n“ไม่จำเป็นต้องรู้หรอก”\n\nอีวานยกขวานขึ้น แปะ... แปะ... จังหวะหยาดฝนที่ตกกระทบกระจกหน้าต่างเริ่มเชื่องช้าลงไปมากแล้ว\n\nนั่นไม่ได้หมายความว่าสายฝนฤดูร้อนกำลังซาลง ทว่ากาลเวลากำลังยืดขยายออกต่างหาก\n\nการที่บทสนทนาของทั้งคู่ยังคงดำเนินต่อไปได้ตามปกติ ย่อมบ่งชี้ว่าบุคคลทั้งสองที่เผชิญหน้ากันอยู่นี้กำลังแบ่งปันกรอบห้วงเวลาเดียวกันอยู่\n\n“นี่คงไม่ใช่แผนของแม็กซิมิเลียน… หรือว่าใช่? ไอ้สารเลวนั่นวางแผนเรื่องนี้เอาไว้ด้วยหรือไง?”\n\n“…”\n\n“พูดน้อยจังนะ เอาเถอะ ยังไงตอนนี้ก็ไม่ใช่เวลามานั่งคุยกันอยู่แล้ว”\n\nดิโอนาร์แสยะยิ้มมุมปากแล้วสะบัดมือ เสียงดังผึง ดาบใหญ่ที่ปักคาอยู่บนผนังพลันหมุนคว้างและพุ่งกลับเข้าสู่อุ้งมือของมัน\n\nดิโอนาร์กำด้ามดาบใหญ่ไว้แน่นด้วยมือข้างเดียว ปล่อยมืออีกข้างห้อยข้างลำตัว ก่อนจะชูคมดาบตั้งตรงขึ้นสู่ด้านบน\n\n“เข้ามาสิ ข้าจะแสดงให้เจ้าเห็นเองว่าการเป็นหนึ่งใน ‘ตัวสำรอง’ มันหมายความว่ายังไง”\n\n“น่าสนใจดีนี่”\n\nอีวานยิ้มเยาะ\n\nการจัดประเภทของ ‘ตัวสำรอง’ — หรือเจาะจงลงไปก็คือ ‘ตัวสำรองผู้กล้า’ — หากพูดกันตามตรงแล้ว มันคือแนวคิดที่ถือกำเนิดขึ้นเป็นครั้งแรกจากการมีอยู่ของตัวเขาเอง พันโทอีวาน เปโตรวิช\n\nอีวานแย้มยิ้มด้วยความรู้สึกอันซับซ้อนลึกซึ้ง\n\nในอดีตนั้น ภายในปาร์ตี้ผู้กล้าไม่มีลำดับชั้นใดๆ ไม่ว่าจะอายุ เผ่าพันธุ์ หรือตำแหน่งหน้าที่ ทุกคนล้วนเป็นสหายผู้เอาชีวิตเข้าเสี่ยงเพื่อท้าทายจอมมารด้วยกันทั้งสิ้น\n\nทว่าเหล่าบุคคลที่ถูกจัดประเภทให้อยู่ในกลุ่ม ‘ตัวสำรอง’ นั้นแตกต่างออกไป หากพวกเขาสามารถนำไปเปรียบเทียบกับสมาชิกปาร์ตี้ผู้กล้าได้จริง ป่านนี้ก็คงได้บุกขึ้นสู่ปราสาทจอมมารในฐานะกำลังรบตัวจริงไปแล้ว มิใช่เป็นเพียงตัวสำรอง\n\nด้วยเหตุนี้ ในบรรดายอดฝีมือผู้แข็งแกร่งซึ่งถูกจัดอยู่ในกลุ่มตัวสำรอง — ผู้ที่ ‘แข็งแกร่ง’ อย่างเห็นได้ชัดและมีสถานะอันโดดเด่นในหมู่ ‘ยอดมนุษย์’ — ย่อมมีลำดับชั้นดำรงอยู่จริงอย่างไม่ต้องสงสัย\n\nและอีวานก็ยินดีเป็นอย่างยิ่งที่จะสั่งสอนให้รู้ว่าลำดับชั้นที่ว่านั้นมีรูปร่างหน้าตาเป็นเช่นไร\n\nในฐานะสุภาพชนผู้เปี่ยมมารยาท เขาจึงตัดสินใจสั่งสอนความโอหังของรุ่นน้องด้วยตนเอง\n\nในฐานะรุ่นพี่เพียงคนเดียวในหมู่ผู้ที่แบกรับนาม ‘ตัวสำรอง’ ซึ่งได้ร่วมเดินทางเคียงข้างปาร์ตี้ผู้กล้า\n\nอย่างอ่อนโยนเสียด้วย\n\n***\n\n– ผึง!\n\nพร้อมกับเสียงเส้นด้ายขาดผึง ฟุ่บ! ดาบใหญ่ฟันดิ่งตรงลงมาที่ศีรษะของเขา\n\nมันคือการฟาดฟันอันทรงพลัง เปี่ยมด้วยอานุภาพที่รุนแรงพอจะบดขยี้ศิลาและทลายประตูเมืองได้ในดาบเดียว\n\nเขาเบี่ยงคมดาบที่อาบย้อมด้วยพลังเวทอันถักทอไว้อย่างหนาแน่นออกไป แล้วบิดตัวหลบ\n\n– โครม!!\n\nคมดาบที่ฟันพลาดเป้ากระแทกลงบนพื้นโถงทางเดิน เสียงร้าวสนั่นดังขึ้นพร้อมกับพื้นที่พังยุบถล่มลงมา อีวานถีบตัวออกจากจุดยืนที่กำลังพังทลายแล้วทะยานขึ้นกลางอากาศ\n\n“ติดกับแล้ว!”\n\nดิโอนาร์ยิ้มเหี้ยมเกรียมแล้วสะบัดมือเปล่าที่ว่างอยู่ ผึง! พร้อมกับเสียงอันแหลมคม เส้นด้ายสายหนึ่งพลันสะท้อนแสงวาววับขึ้นกลางอากาศท่ามกลางความมืดมิด\n\n‘ไอ้หมอนี่เป็นสายเทคนิคแฮะ’\n\nแตกต่างจากไอนาร์ที่บดขยี้ศัตรูด้วยพละกำลังอันท่วมท้น หมอนี่เป็นประเภทที่อาศัยกลเม็ดเชิงเทคนิคเพื่อยื้อการต่อสู้ระยะยาว\n\nแม้ว่ารูปร่างอันกำยำใหญ่โตและท่าทางดุดันเถื่อนดิบจะชวนให้เข้าใจผิดได้ง่าย ทว่ารูปแบบการต่อสู้ของเขากลับละม้ายคล้ายคลึงกับของเบโอลกรินมากกว่า\n\n‘ใช้เส้นด้ายเวทมนตร์ยึดครองพื้นที่ราวกับใยแมงมุม แล้วสลับจังหวะแปรเปลี่ยนด้วยการฟาดฟันดาบใหญ่เป็นครั้งคราว’\n\nปีศาจบางตนก็ต่อสู้ด้วยวิธีการแบบนี้ ในพื้นที่ปิดภายในอาคารที่มืดสลัวและคับแคบ กับดักซ่อนเร้นพวกนี้เองที่ถือเป็นภัยคุกคามอย่างใหญ่หลวง\n\nทั้งการตรวจจับแนววิถีกระสุนและสัญชาตญาณล้วนตอบสนองต่อการโจมตีที่มี ‘เจตนา’ สำหรับกับดักที่ขึงตรึงอยู่นิ่งๆ เช่นนั้น ทางเดียวที่จะรับมือได้ก็คือการอาศัยความรู้ความเข้าใจล่วงหน้าและการพลิกแพลงแก้ปัญหาเฉพาะหน้า\n\nนั่นจึงเป็นเหตุผลว่าทำไมปาร์ตี้ผู้กล้าถึงจำเป็นต้องมีจอมโจร — คนที่เชี่ยวชาญองค์ความรู้ประเภทนั้นเป็นอย่างดี\n\nกับดักอันชั่วร้ายที่ซุ่มซ่อนอยู่ในความมืด\n\nและการโจมตีอันหนักหน่วงที่ฉวยโอกาสเจาะทะลวงผ่านช่องว่างระหว่างกับดักเหล่านั้น\n\nแน่นอนว่านี่คือรูปแบบการต่อสู้ที่ ‘โดยทั่วไป’ แล้วรับมือทำลายได้ยาก มันมีระดับความยากสูงอย่างไม่ต้องสงสัย อีวานยิ้มจางๆ ขณะบิดตัวหลบเบี่ยงการโจมตีและครุ่นคิดอยู่ในใจ\n\nแบบนี้คงเป็นโจทย์หินสำหรับพวกเด็กๆ น่าดูเลยแฮะ\n\nหากนี่คือด่านทดสอบสำหรับเหล่าทายาทของปาร์ตี้ผู้กล้า และไอ้หมอนี่คือบอสประจำด่าน…\n\nจุดประสงค์ของด่านนี้ก็คงเป็นการบีบบังคับให้พวกเด็กๆ ต้องฝึกฝนจนเชี่ยวชาญ ‘ขอบเขตของผู้เหนือมนุษย์’ ให้จงได้\n\nมันคือการต่อสู้ประเภทที่หากไม่รู้วิธีรับมือก็เป็นอันต้องพลาดท่าโดนเล่นงาน นับเป็นการออกแบบที่ร้ายกาจเอาเรื่องทีเดียว\n\nทว่า นั่นเป็นเพียงมุมมองจากฝั่งพวกเด็กๆ เท่านั้น\n\nเหตุผลที่จอมโจรเป็นตำแหน่งที่ขาดไม่ได้ในปาร์ตี้ผู้กล้า ก็ย้ำอีกครั้งว่าเพื่อรับมือกับกับดักและศัตรูประเภทนี้แหละ\n\nและนั่นย่อมหมายความว่า สมัยที่ปาร์ตี้ผู้กล้ายังออกปฏิบัติการอยู่ พวกเขาเคยเผชิญหน้ากับศัตรูลักษณะนี้มาแล้วนับครั้งไม่ถ้วน\n\nและอีวาน ในฐานะ ‘หน่วยลาดตระเวน’ ประจำปาร์ตี้ผู้กล้า ย่อมมีประสบการณ์ในการบุกทะลวงเข้าไปในแดนศัตรูเคียงข้างเอนริเก้มาแล้วอย่างโชกโชน\n\n– วิ้งงงง…\n\nคมขวานเปล่งประกายแสงสีฟ้าเรืองรองท่ามกลางความมืดมิด\n\n– ฉับ!\n\nเส้นด้ายที่พาดเกี่ยวอยู่บนคมขวานขาดสะบั้นและร่วงหล่นลงสู่พื้น\n\n– วูบ!!\n\nเมื่อได้ยินเสียงแหวกอากาศอันน่าสะพรึงกลัวของดาบใหญ่ที่พุ่งเข้ามาในชั่วพริบตาเปิดช่องโหว่นั้น เขาคำนวณระยะทางและอัตราเร็วทันทีที่ได้ยินเสียง และทันทีที่การคำนวณเสร็จสิ้น ก็หมุนตัวพุ่งไปข้างหน้าสวนทางกลับไปแทน\n\nก้าวไปข้างหน้าอีกหนึ่งก้าว พุ่งทะยานเข้าสู่ระยะประชิดวงในนั้นเสีย\n\n“ฮ่าๆๆๆ!! ข้าได้วาง—”\n\n“ฉันรู้”\n\nเส้นด้ายที่อาบด้วยพลังเวททำหน้าที่เสมือนอวัยวะรับสัมผัสในตัวมันเอง พูดตามตรงก็คือมันก่อรูปเป็นโครงสร้างราวกับใยแมงมุม\n\nรูปแบบการต่อสู้ที่จำกัดการเคลื่อนไหว บิดเบือนทิศทางการโจมตี สร้างช่องโหว่ แล้วเสือกดาบใหญ่แทงทะลวงผ่านช่องว่างเหล่านั้น\n\nอีวานล่วงรู้วิธีการนี้ดีอยู่แล้ว\n\nและในฐานะคนรักประสิทธิภาพ เขาย่อมไม่ยอมเสียท่าเป็นครั้งที่สองให้กับสิ่งที่เคยเผชิญหน้ามาแล้ว\n\n– เคร้ง!!\n\n“มะ… ไม่มีทาง…!”\n\n“ก็เพราะฉันเป็นตัวสำรองยังไงล่ะ”\n\nแบกชื่อ ‘ตัวสำรอง’ เอาไว้แท้ๆ แต่แค่นี้ก็ตกใจจนลนลานเสียแล้ว แบบนี้จะมีประโยชน์อะไรกันเล่า\n\nขวานของอีวานฟาดกระแทกดาบใหญ่จนกระเด็นปลิวออกไป ขณะเดียวกันเส้นด้ายที่ถูกตัดขาดก็พลิ้วไหวเผยให้เห็นโครงร่างของตาข่าย\n\nดิโอนาร์โซซัดโซเซถอยหลังไปพลางรีบเอื้อมมือออกไปอย่างลนลาน เสียงด้ายแหวกอากาศเบาๆ ขณะเส้นใยเวทมนตร์พันเกี่ยวเข้าหากันเพื่อดึงดาบใหญ่ที่กระเด็นออกไปให้กลับมาสู่มือของมัน—\n\n– หมับ\n\nทว่ามันส่งไปไม่ถึง ดาบใหญ่ที่ลอยคว้างกลางอากาศกลับตกเข้ามาอยู่ในกำมือของอีวานแทนเสียแล้ว\n\n“แก… ไอ้สารเลว!!”\n\nโดยไม่เอ่ยคำตอบใดๆ อีวานบิดหมุนลำตัว แทงดาบใหญ่เล่มนั้นเสียบทะลุเข้าไปกลางหน้าท้องของอีกฝ่ายโดยตรง ก่อนจะบิดตัวผละหลบออกมาเพื่อเลี่ยงเส้นด้ายที่พยายามรัดพันรอบกายเขา\n\n– ฉัวะ!!\n\nในจังหวะเดียวกัน เขาก็บิดข้อมือตวัดเหวี่ยงขวาน คมขวานที่ทอประกายวาววับกรีดผ่านอากาศ วาดเป็นวงโค้งอันงดงามดิ่งลงสู่พื้น และในชั่วพริบตานั้น มันก็สะบั้นทุกสิ่งทุกอย่างที่ขวางทางจนขาดวิ่น\n\nทั้งเส้นด้าย เนื้อหนัง และเศษกระดูก ล้วนถูกตัดสะบั้นลงในคมเดียว โลหิตสาดกระเซ็นเปื้อนทั่วผนังสีขาว\n\n“อึก… อ๊ากกกกก!!”\n\n“จะกรีดร้องไปทำไม? เก็บแรงหายใจไว้เถอะ”\n\nอีวานเดินเข้าไปหาดิโอนาร์ซึ่งทรุดเข่าลงกับพื้นพลางกุมท่อนแขนที่ขาดรุ่งริ่งเอาไว้ แล้วเหยียบเท้าลงบนอกของมัน\n\nดังตุ้บ! เขากดร่างอีกฝ่ายลงกับพื้น ยืนตระหง่านอยู่เหนือร่างนั้น แล้วเงื้อขวานขึ้น\n\n“นายยังมีเรื่องต้องตอบอีกเยอะ อย่ามัวมาเสียลมหายใจไปกับการกรีดร้องให้เสียเปล่าเลย”\n\nเพราะลมหายใจของนายเหลืออยู่อีกไม่กี่เฮือกแล้วล่ะ\n\nไม่ต้องรีบร้อนหรอก ค่อยๆ เก็บแรงหายใจไว้ใช้ตอบคำถามเสียเถอะ\n\nภายใต้เงามืดของโถงทางเดินอันสลัว ดวงตาของอีวานลุกโชนเป็นสีฟ้าสว่างจ้า\n\n***\n\n**💬 ความคิดเห็นนักอ่าน:**\n- **@ตัวสำรองเบอร์ศูนย์** (4 วันที่แล้ว • 👍 214): เฉลยแล้ว!! ที่แท้ฉายา 'ตัวสำรองผู้กล้า' ที่ใครๆ ก็พูดถึง ลุงอีวานนี่แหละคือต้นตำรับคนแรกเลย เคยออกลาดตระเวนคู่เอนริเก้มาแล้วด้วย มิน่าอ่านทางพวกสายเทคนิคขาดกระจุย!\n- ↳ **@สายเทคนิคฝึกหัด** (4 วันที่แล้ว • 👍 63): ดิโอนาร์คิดว่าตัวเองเก่งด้ายเวทกับดาบใหญ่แล้ว เจอของจริงสอนมวยเข้าไป ด้ายขาด แขนขาด จบในพริบตา สะใจมากกก\n- **@สายแทงค์โพชั่น** (4 วันที่แล้ว • 👍 176): พอเห็นลุงไม่ฟันให้ตายแต่เหยียบอกแล้วพูดว่า \"ค่อยๆ เก็บแรงหายใจไว้ใช้ตอบคำถามเสียเถอะ\" ปุ๊บ... ทุกคนรู้ชะตากรรมดิโอนาร์เลยใช่ไหม เดี๋ยวโพชั่นเข้าเส้นอีกแน่ 5555\n- ↳ **@พยาบาลสนามคราซิลอฟ** (3 วันที่แล้ว • 👍 51): โพชั่นรักษ์โลกของลุง ไม่ฆ่าให้ตายง่ายๆ หรอก เน้นรักษาแล้วรีดให้หมดไส้หมดพุงก่อน 555\n- **@อ่านวันละสิบตอน** (3 วันที่แล้ว • 👍 44): ชอบ Q&A ท้ายบทของผู้เขียนเรื่องกองบัญชาการต่อต้านข่าวกรองมาก ทำให้เห็นภาพเลยว่ายุคนี้มันเสื่อมถอยลงแค่ไหนเทียบกับยุคหน่วยเก็บกวาด"

      "content": "“ก่อนอื่น มาห้ามเลือดกันก่อนดีกว่า”\n\nเมื่อคนเราสูญเสียแขนขาไป มักจะตกอยู่ในสภาพไร้ความสามารถในการต่อสู้ อันที่จริง แทนที่จะเรียกว่าหมดสมรรถภาพ เรียกว่าเป็นบาดแผลฉกรรจ์ถึงชีวิตน่าจะถูกต้องกว่า\n\nเมื่อพิจารณาจากวิธีปลิดชีพตนเองอันแสนสง่างามของยุคสมัยนี้ ซึ่งทำโดยการจุดเทียนในอ่างอาบน้ำแล้วกรีดข้อมือ ก็พอนึกภาพออกได้ไม่ยากเลยว่า การถูกขวานจามท่อนแขนจนขาดสะบั้นนั้นเป็นอาการบาดเจ็บที่ร้ายแรงเกินกว่าการใช้มีดทำครัวกรีดข้อมือไปมากเพียงใด\n\nแม้แต่สี่จักรพรรดิผู้เคยครองน่านน้ำบนดาวเคราะห์โลกอันแสนไกล พอสูญเสียแขนไปข้างหนึ่งก็ยังไร้เรี่ยวแรงจะออกแรงใดๆ ทำได้เพียงร่ำไห้โฮราวกับเด็กน้อยพลางจ้องตาเจ้าปลามอเรย์ยักษ์เขม็งเท่านั้น ก็ด้วยเหตุนี้แหละ\n\nดังนั้น ต้องรีบห้ามเลือดเสียก่อนที่มันจะตาย\n\n– กริ๊ก\n\nอีวานเปิดจุกขวดโพชั่นรักษาบาดแผลออกด้วยมือข้างเดียวอย่างคล่องแคล่ว ของเหลวสีแดงข้นหนืดหมุนวนอยู่ภายในอย่างชวนพรั่นพรึง\n\nด้วยปลายนิ้วอันประณีต เขาแหวกเปิดปากแผลออกแล้วค่อยๆ เทโพชั่นรักษาบาดแผลลงบนพื้นผิวรอยตัดที่โลหิตกำลังพุ่งทะลัก\n\nเป็นเรื่องธรรมชาติและหลีกเลี่ยงไม่ได้ที่เสียงกรีดร้องจะดังก้องไปทั่วโถงทางเดิน\n\n“อ๊ากกกกกก!!!”\n\n“ใจเย็นๆ เก็บแรงหายใจไว้หน่อยสิ”\n\nในฐานะอารยชนคนเจริญ อีวานจึงตักเตือนอีกฝ่ายอย่างสุภาพ แม้จะไม่ได้อายุน้อยแล้วแท้ๆ แต่รุ่นน้องคนนี้กลับดูเป็นจอมดราม่าเอาเรื่องเสียจริง\n\n“บอกมาซะว่านายได้ยินอะไรมาจากอเล็กซานเดอร์ หมอนั่นต้องการอะไร?”\n\n“ลูกผู้ชายแห่งโดรอัน… ไม่มีวัน… ยอมจำนนต่อการทรมาน…!”\n\n“ทรมานอะไรกัน? นี่มันยารักษาต่างหาก”\n\nอีวานส่ายศีรษะให้กับข้อกล่าวหาอันไร้เหตุผลนี้แล้วปิดจุกขวดโพชั่นรักษาบาดแผล เขาจรดคมขวานในมืออีกข้างลงบนพื้นผิวรอยแผลที่ถูกตัด\n\n“อึ้ก…?!”\n\n“เลือดหยุดไหลเกือบหมดแล้ว เยี่ยมเลย”\n\nเขาพยักหน้าอย่างเย็นชาแล้วค่อยๆ ออกแรงกดคมขวานลงไป ใบขวานจมลึกลงไปครึ่งนิ้วในเนื้อแผลที่ถูกสมานปิด (ถูกจี้ปิดสนิทอย่างแท้จริงด้วยสรรพคุณอันน่าอัศจรรย์ของโพชั่นรักษาบาดแผล) จนมีหยดเลือดซึมออกมา\n\n“เมื่อกี้นี้คือการรักษา ส่วนอันนี้สิคือการทรมาน”\n\n“แก… ไอ้สารเลวววว…!!”\n\n“ไหนดูซิ”\n\nอีวานตรวจดูปริมาณโพชั่นที่เหลืออยู่แล้วเขย่าขวดเบาๆ ของเหลวที่ยังเต็มขวดกระฉอกเสียงหนักแน่น\n\n“ฉันทำแบบนี้ได้อีกประมาณห้ารอบ เพราะฉะนั้น จะถามสั้นๆ ห้าคำถามก็แล้วกัน”\n\n“ฆ่า… ข้า… ซะ…!”\n\n“ก็ตั้งใจไว้อย่างนั้นอยู่แล้ว ดิโอนาร์ เอริกสัน ชะตากรรมของนายย่อมเป็นไปตามคำสั่งเบื้องบน แต่ขั้นตอนระหว่างทางขึ้นอยู่กับดุลยพินิจของฉัน ตอบมาซะ”\n\nอเล็กซานเดอร์ต้องการกอบโกยอะไรจากความโกลาหลครั้งนี้?\n\nตอนนี้อเล็กซานเดอร์อยู่ที่ไหน?\n\nพวกนายมีกันกี่คน และเริ่มแทรกซึมเข้ามาในประเทศนี้จากทางไหน?\n\nทีละข้อ ไม่ต้องรีบร้อน\n\nอีวานซึ่งเป็นคนที่มีจิตสำนึกทางศีลธรรมแบบยุคสมัยใหม่ไม่ได้นิยมชมชอบการทรมาน อันที่จริง ออกจะรังเกียจเสียด้วยซ้ำ\n\nทว่าในขณะเดียวกัน เขาก็คือชายผู้มีชีวิตอยู่ในยุคสมัยนี้มานานถึง 30 ปี และเป็นทหารที่ใช้ชีวิตส่วนใหญ่คลุกคลีอยู่กลางสมรภูมิรบ\n\nน่าเสียดายที่เขามีความจำเป็นต้องเสียสละหลักศีลธรรมบางส่วนไปเพื่อประสิทธิภาพในการปฏิบัติตามคำสั่ง\n\nในเมื่อกระทั่งคิมซอนอูเองก็ยังเห็นพ้องต้องกันในเรื่องนี้ อีวานจึงเงื้อคมขวานขึ้นโดยไม่ลังเลเลยแม้แต่น้อย\n\nตัดสะบั้น\n\nแล้วก็สมานกลับเข้าไป\n\nเสียงกรีดร้องดังก้องสะท้อนไปทั่วโถงทางเดิน ค่ำคืนฤดูร้อนท่ามกลางสายฝนโปรยปรายภายในทางเดินอันมืดมิด\n\nเนื่องจากยอดมนุษย์มีสายตาที่เฉียบคม ความมืดระดับนี้จึงแทบไม่นับว่ามืดเลยด้วยซ้ำ ดังนั้น ต่อให้ตกอยู่ในความเจ็บปวดแสนสาหัส ดิโอนาร์ก็ยังคงมองเห็นใบหน้าของอีวานได้อย่างชัดเจน\n\nหากเพียงแค่อีวานยิ้มเยาะ หรือแสดงความโกรธแค้นออกมาสักนิด หากเผยอารมณ์ความรู้สึกใดๆ ออกมาบ้าง อย่างน้อยก็คงดูเป็นมนุษย์ขึ้นมาหน่อย\n\nทว่าอีวานในสายตาของดิโอนาร์กลับไร้ซึ่งอารมณ์ความรู้สึกไม่ต่างอะไรจากคนตัดไม้ที่กำลังโค่นต้นไม้ เหมือนชาวประมงที่กำลังสาวอวน เหมือนชาวนาที่กำลังตวัดเคียวเกี่ยวข้าว\n\nมีงานที่ต้องทำให้เสร็จ และมีเครื่องมือสำหรับทำงานนั้น จึงลงมือทำ\n\nความรู้สึกในระดับนั้นเองคือสิ่งเดียวที่สัมผัสได้จากการกระทำอันซ้ำซากราวกับเครื่องจักรนี้\n\nกระทั่งเลือดและเหงื่อของดิโอนาร์ระเหยกลายเป็นไอ ปลดปล่อยกลิ่นอายแห่งความหวาดกลัวออกมา\n\nกล่าวคือ นับตั้งแต่วินาทีที่อีวานเสร็จสิ้น ‘การรักษา’ รอบที่สอง\n\nอีกฝ่ายก็กลายมาเป็นผู้พูดในสังคมอารยะที่ฉะฉานและเรียบเรียงถ้อยคำได้อย่างน่าทึ่ง (ทั้งสุภาพเรียบร้อยและจริงใจ) พร่ำอธิบายทุกสิ่งทุกอย่างที่ตนรู้ให้อีวานฟังอย่างละเอียดถี่ถ้วน\n\nแม้โพชั่นรักษาบาดแผลจะใช้รักษาได้เพียงบาดแผลภายนอกเท่านั้น (ทุกคนที่เคยทดลองใช้รักษาอาการบาดเจ็บภายในล้วนเสียชีวิตหมด) ทว่าการดูแลรักษาอย่างเปี่ยมเมตตากลับสามารถมอบผลข้างเคียงเป็นการให้คำปรึกษาทางจิตวิทยาและการบำบัดทางจิตเวชได้ด้วย\n\nอีวานซึ่งพึงพอใจกับสัจธรรมอันเป็นนิรันดร์ที่ได้รับการพิสูจน์ซ้ำอีกครั้ง ตั้งอกตั้งใจรับฟังคำให้การอันเป็นเหตุเป็นผลของดิโอนาร์อย่างเงียบๆ\n\n***\n\nทิ้งรุ่นน้องผู้ซึ่งอาจกลายเป็นคู่ต่อสู้ที่น่าครั่นคร้ามหากฝีมือทัดเทียมกับแรงฮึดและความกล้าลงมือเอาไว้เบื้องหลัง อีวานก้าวเดินขึ้นบันไดต่อไป\n\nเขาใช้โพชั่นรักษาบาดแผลจนหมดเกลี้ยงแล้ว แม้คืนนี้จะไม่มีความจำเป็นต้องใช้มันอีก แต่การสูญเสียอุปกรณ์จำเป็นที่พกติดตัวไว้เสมอไปก็นับว่าน่าเสียดายอยู่ไม่น้อย\n\nด้วยความเป็นคนรอบคอบ อีวานจึงต้องทวนถามคำถามเดิมซ้ำๆ อยู่หลายครั้งเพื่อตรวจสอบว่าคำให้การเบื้องต้นของดิโอนาร์เป็นความจริง เป็นการเพิ่มความละเอียดและความแม่นยำให้กับข้อมูลคำให้การ\n\nโชคร้ายที่ดิโอนาร์สิ้นลมหายใจลงไปเสียก่อนในระหว่างกระบวนการดังกล่าว ยังดีที่คำให้การของเขาล้วนเป็นความจริงมาตั้งแต่ต้น อีวานจึงสามารถอธิษฐานขอให้ดวงวิญญาณของอีกฝ่ายไปสู่สุคติได้\n\n– ตึก ตึก\n\nเสียงฝีเท้าหนักแน่นดังก้องไปทั่วโถงทางเดินอันว่างเปล่า ในเมื่อไม่มีจิตสังหารหรือสัญญาณของศัตรูหลงเหลืออยู่อีกแล้ว อีวานจึงจงใจก้าวเดินให้เสียงดังขึ้นกว่าเดิม\n\nภารกิจจะเสร็จสมบูรณ์ทันทีที่เขาช่วยเหลือพวกเด็กหนุ่มสาวที่ถูกลักพาตัวไปออกมาได้ นับเป็นเรื่องที่น่ายินดียิ่ง\n\nทว่าในเมื่อเขาชิงเคลียร์ด่านที่พวกเด็กๆ เหล่านั้นควรจะได้ฝ่าฟันด้วยตนเองไปเสียแล้ว อีวานจึงรู้สึกราวกับเป็นหน้าที่ที่จะต้องลงมือฝึกฝนให้เอซิดิส อิซาเบลล์ และออสการ์ด้วยตนเอง\n\nเช่นเคย เวลามีน้อยนัก\n\nอีวานแย้มยิ้มจางๆ ขณะเดินไปยังห้องทำงานห้องแรกสุดของโถงทางเดินแล้วจับลูกบิดประตู ทว่า…\n\n“…?”\n\nเขาปล่อยมือออกแล้วถอยหลังกลับมาหนึ่งก้าว\n\nไม่มีวี่แววของสิ่งมีชีวิตใดๆ ทว่าเขากลับสัมผัสได้ถึงพลังเวท จากห้องทำงานที่อยู่สุดปลายทางเดินแห่งนั้น\n\nมิใช่พลังเวทของอาร์ติแฟกต์หรืออุปกรณ์เวทมนตร์ มันคือพลังเวทชนิดที่แผ่ออกมาจากสิ่งมีชีวิต เป็นพลังเวทแบบที่จอมเวทผู้กำลังตระเตรียมบทเวทจะแผ่ออกมา ทว่ากลับไร้ซึ่งร่องรอยการมีอยู่ทางชีวภาพโดยสิ้นเชิง\n\nเขาสูดลมหายใจเข้าลึกแล้วโคจรพลังเวทไปทั่วร่างกาย เส้นประสาทเร่งการทำงานขึ้น ทำให้เสียงหยาดฝนที่ตกกระทบดังเชื่องช้าลง\n\nกระทั่งเพ่งสมาธิไปที่โสตประสาท สัญญาณของสิ่งมีชีวิตเพียงหนึ่งเดียวในโถงทางเดินนี้ก็มีเพียงเสียงลมหายใจอันตึงเครียดของเหล่านักศึกษาที่อยู่ภายในห้องทำงานตรงหน้าเขาเท่านั้น\n\nจอมเวทที่กำลังตระเตรียมเวทมนตร์ไปพร้อมกับซ่อนเร้นร่องรอยตัวตนของตนเองได้อย่างสมบูรณ์แบบเช่นนี้เลยงั้นหรือ?\n\nนั่นไม่ใช่แค่เรื่องแปลกประหลาด แต่มันเป็นไปไม่ได้เลยด้วยซ้ำ แม้แต่เบโอลกรินก็ไม่อาจทำเรื่องแบบนั้นได้ เวทมนตร์ไม่ใช่ศาสตร์ธรรมดาที่จะร่ายไปพร้อมกับควบคุมลมหายใจและจังหวะการเต้นของหัวใจได้หรอก\n\nจอมเวทระดับนั้นย่อมมีฝีมือเทียบเท่ากับจอมมารเลยทีเดียว ทว่ามันไม่มีเหตุผลเอาเสียเลยที่จอมมารซึ่งตายไปแล้วเมื่อสี่ปีก่อนจะจู่ๆ ฟื้นคืนชีพขึ้นมา แล้วดันมาซ่อนตัวอยู่ในทำเนียบกระทรวงการต่างประเทศแห่งพริตเชนคายาแบบนี้\n\n“อ่า”\n\nอีวานพยักหน้าพร้อมรอยยิ้ม\n\nฮิดเดนพีซ ใช่แล้ว มันควรจะมีอะไรแบบนั้นอยู่สิ\n\nไม่ว่าจะเป็นไอเทมพิเศษหรือเบาะแสสำคัญของเนื้อเรื่อง สิ่งที่ถูกซุกซ่อนไว้ให้พ้นจากเส้นทางเดินเรื่องปกติย่อมควรมีปรากฏอยู่ใน ‘สเตจหลัก’ เป็นธรรมดา\n\nพอคิดในแง่นั้น ทุกอย่างก็สมเหตุสมผลขึ้นมาทันที\n\nมีเพียงผู้ที่สามารถตรวจจับร่องรอยพลังเวทได้เท่านั้น จึงจะอ่านออกและแกะรอยตามเบาะแสอันโจ่งแจ้งนี้ไปได้\n\nมิฉะนั้น เหล่าทายาทของปาร์ตี้ผู้กล้าที่หลบหนีออกมาได้ย่อมต้องใส่เกียร์หมาวิ่งเต็มฝีเท้ามุ่งหน้าลงไปยังชั้นหนึ่งอย่างไม่ต้องสงสัย\n\nลองจินตนาการถึงด่านแบบนั้นดูสิ\n\nระหว่างหลบหนีการไล่ล่าของดิโอนาร์และโค่นเหล่าทหารรับจ้างที่ขวางทางลงไปได้ พวกเขาก็มาถึงชั้นหนึ่งได้ในที่สุด\n\nหากรูปแบบของบทนี้ถูกออกแบบมาให้พวกเขาเปิดฉากศึกตัดสินกับดิโอนาร์แล้วล่าถอยกลับสู่เขตเมืองอันปลอดภัยได้สำเร็จ\n\nย่อมไม่มีเหตุผลใดเลยที่จะต้องเดินเข้าไปค้นห้องทำงานที่อยู่ลึกสุดของชั้นห้าอันเป็นสถานที่คุมขังของพวกเขา ดังนั้น นี่จึงเป็นฮิดเดนพีซ เป็นอีสเตอร์เอ้กอย่างหนึ่งนั่นเอง\n\nเมื่อคิดเช่นนี้ ทุกอย่างก็กระจ่างชัด อีวานเดินตรงไปยังลูกบิดประตูของห้องทำงานห้องสุดท้ายที่ปลายสุดทางเดินโดยไม่ลังเล\n\n– ห้องทำงานรัฐมนตรีว่าการกระทรวงการต่างประเทศ\n\nเมื่ออนุมานว่ามกุฎราชกุมารอเล็กซานเดอร์ผู้ดำรงตำแหน่งรัฐมนตรีว่าการกระทรวงการต่างประเทศคงไม่ได้มาทรงงานอยู่ที่นี่จริงๆ อีวานจึงคาดหวังว่าจะได้พบข้อมูลเกี่ยวกับอเล็กซานเดอร์ หรืออย่างน้อยก็สิ่งที่เทียบเท่ากันอยู่ภายในนี้\n\n– กริ๊ก\n\nเขาบิดลูกบิดแล้วผลักประตูเปิดออก\n\n“…!!!”\n\nอีวานขว้างขวานพุ่งตรงเข้าใส่ใบหน้าที่ปรากฏขึ้นผ่านบานประตูที่เปิดออกในทันที\n\n– ฟิ้ววว!!\n\nขวานพุ่งทะลุใบหน้านั้นเลยผ่านไปกระแทกเสียงดังสนั่น! มันฟาดทำลายเก้าอี้จนแตกละเอียดแล้วพุ่งไปปักจมลงบนชั้นหนังสือริมผนังฝั่งตรงข้ามจนฉีกกระชากพังยับเยิน\n\nบุรุษผู้ที่คมขวานพุ่งทะลุใบหน้าผ่านไปคลี่ยิ้มจางๆ แล้วเอ่ยปากขึ้น\n\n“ดูเหมือนข้าจะไม่เคยเห็นสีหน้าแบบนั้นของเจ้ามาก่อนเลยนะ”\n\n“อเล็กซานเดอร์…!!”\n\n“พวกเราไม่ได้คุยกันมาเกือบ 10 ปีแล้วสินะ เข้ามาสิ อีวาน เปโตรวิช”\n\nชายหนุ่มร่างสูงผู้มีเรือนผมสีเงินตัดสั้นผายมือเชิญเข้าห้องพร้อมรอยยิ้มอันเจิดจ้า\n\nการฉายภาพจิต แถมยังเป็นระยะทางไกลเสียจนไม่อาจตามรอยได้เลย\n\nอีวานขบฟันแน่นขณะยืนประจันหน้าอยู่ฝั่งตรงข้าม เหลือบสายตาจ้องเขม็งมองอีกฝ่ายอย่างเคียดแค้น\n\nเมื่อสี่ปีก่อน เอกสารคำสั่งภารกิจสุดท้ายของหน่วยเก็บกวาดประทับตราประจำตำแหน่งอย่างเป็นทางการไว้สองดวง\n\nตราพระราชลัญจกรแห่งราชวงศ์คราซิลอฟ และ\n\nตราประจำตำแหน่งของผู้บัญชาการสูงสุดแห่งแนวรบตะวันตกเฉียงเหนือ ผู้บังคับบัญชากองทัพแทนองค์พระมหากษัตริย์ในเวลานั้น\n\nตราประจำตำแหน่งของอเล็กซานเดอร์ คิริลโลวิช คราซิลอฟ\n\n“เจ้าคงมีคำถามอยู่มากมาย แต่ช่วยตอบข้าสักข้อหนึ่งก่อนเถอะ”\n\n“…อะไร?”\n\n“หากพระผู้เป็นเจ้าทรงรักพวกเรา แล้วเหตุใดบนโลกใบนี้จึงยังคงมีความชั่วร้ายหลงเหลืออยู่มากมายนัก แม้ว่าจอมมารจะตายไปแล้วก็ตาม?”\n\nชายหนุ่มผู้นี้ ซึ่งเขาได้พบหน้ากันตัวเป็นๆ เป็นครั้งแรกในรอบ 10 ปี และได้เห็นผ่านตัวอักษรเป็นครั้งแรกในรอบ 4 ปี ยังคงมีใบหน้าเหมือนเมื่อ 10 ปีก่อนไม่ผิดเพี้ยน และกำลังเอ่ยวาจาราวกับจะชี้แนะสั่งสอนมวลชน\n\nอีวานกำคมขวานแน่นจนแทบแหลกสลาย พลางขบฟันกรอด\n\n***\n\n**หมายเหตุผู้เขียน:**\n\nคำว่า “คิริลลอฟนา (Kirilovna)” หรือ “คิริลโลวิช (Kirillovich)” ในชื่อรองตามบิดา หมายถึง ‘บุตรสาวของคิริลล์’ หรือ ‘บุตรชายของคิริลล์’\n\nเอลิซาเวตา คิริลลอฟนา คราซิโลวา, อเล็กซานเดอร์ คิริลโลวิช คราซิลอฟ\n\nดังนั้น เราจึงสามารถรู้ได้ว่ากษัตริย์องค์ปัจจุบันของคราซิลอฟซึ่งเป็นพระราชโอรสของอดีตกษัตริย์อีวานมีพระนามว่าคิริลล์\n\nฉะนั้น ตอนที่ท่านนักบุญหญิงเรียกอีวานว่า “บราเดอร์คิริลล์ (ซีริล)” เหตุผลที่เขาถึงได้รู้สึกเขินอายกับชื่อศีลล้างบาปนั้นก็คือ…\n\nที่จริงแล้ว อีวานตั้งชื่อตามอดีตกษัตริย์อีวานเพราะอยากจะเกิดมาเป็นพระโอรสของพระองค์นั่นเอง!!\n\n***\n\n**💬 ความคิดเห็นนักอ่าน:**\n- **@ปราณโพชั่นระดับเก้า** (4 วันที่แล้ว • 👍 165): ไม่ผิดคาดจริงๆ โพชั่นราดสดๆ บนแผลแขนขาด จบด้วยการคายความจริงครบแล้วปาดทิ้งอย่างใจเย็น สมฉายานักทรมานสายเยียวยา 555\n- **@สายแกะลอร์_99** (4 วันที่แล้ว • 👍 203): เฮ้ย!! เพิ่งเก็ตจากหมายเหตุผู้เขียนก็ตอนนี้แหละ ชื่อศีลล้างบาป \"บราเดอร์คิริลล์\" ที่ลุงเขินทุกทีเวลาแพทริเซียเรียก ที่แท้ชื่อเดียวกับพระราชโอรสของอดีตกษัตริย์อีวาน (พ่อของเอลิซาเวตา)!!\n- ↳ **@CatMint_TH** (4 วันที่แล้ว • 👍 72): จริง! ชื่อรอง คิริลลอฟนา / คิริลโลวิช หมายถึงลูกของคิริลล์ แถมอีวานดันตั้งชื่อเพราะอยากเป็นลูกพระราชา... โอ๊ยยย สงสารลุงตอนโดนเรียกว่าบราเดอร์คิริลล์เลย 5555\n- ↳ **@คนจดศัพท์ประจำซอย** (3 วันที่แล้ว • 👍 39): พอเข้าใจรากชื่อรัสเซีย/สลาฟแล้วอินขึ้นเป็นกองเลยครับ ขอบคุณหมายเหตุผู้เขียนมากๆ\n- **@DarkLore_Reader** (3 วันที่แล้ว • 👍 91): การปรากฏตัวของร่างฉายภาพจิตมกุฎราชกุมารอเล็กซานเดอร์นี่โคตรขนลุก แถมเป็นคนเซ็นคำสั่งภารกิจสุดท้ายเมื่อ 4 ปีก่อนของหน่วยเก็บกวาดด้วย ปมใหญ่กำลังจะเปิดแล้ว!"

      "title": "บทที่ 57",
      "content": "ไม่ต้องบอกก็รู้ อีวานเป็นคนมีเหตุมีผล\n\nนั่นหมายความว่าเขาไม่ใช่คนหุนหันพลันแล่นไร้สติ ที่จะเขวี้ยงขวานออกไปเพียงเพราะเวทฉายภาพระยะไกลพ่นคำพูดไร้สาระออกมา\n\nน่าเสียดายนัก อีวานมั่นใจว่าเขาสามารถเหวี่ยงขวานสับลงบนศีรษะของอเล็กซานเดอร์ได้อีกอย่างน้อยห้าครั้ง ก่อนที่จะสิ้นสุดลมหายใจเดียวด้วยซ้ำ\n\n“…นั่นเป็นคำถามที่จำเป็นต้องรอคำตอบจากฉันงั้นเหรอ?”\n\nด้วยเหตุนี้ อีวานจึงตัดสินใจสวมบทสนทนาต่อไป\n\nบางทีหากเขาแสร้งคล้อยตามเจ้าคนวิกลจริตนี่ไปเรื่อยๆ อีกฝ่ายอาจจะเผลอหลุดปากเปิดเผยออกมาว่าตอนนี้ซ่อนตัวอยู่ที่ไหนและกำลังทำอะไรอยู่ก็ได้\n\nไม่สิ ความเป็นไปได้นั้นช่างริบหรี่นัก\n\nอย่างน้อยที่สุด อีวานก็ยังมี… หน้าที่ในฐานะสายลับของเอลิซาเวตาที่จะต้องจดจำบทสนทนานี้ ดำเนินเรื่องราวต่อไป และนำกลับไปรายงาน\n\nหน้าที่\n\nใช่แล้ว มีเพียงเท่านั้น จดจ่ออยู่แค่เรื่องนั้นก็พอ\n\nความโกรธแค้นเอาไว้ทีหลัง และการไว้อาลัยแด่ผู้ล่วงลับก็เอาไว้ทีหลังเช่นกัน\n\nรอหลังจากนำศีรษะของมกุฎราชกุมารไปวางเซ่นไหว้หน้าป้ายหลุมศพภายในสุสานของกองบัญชาการต่อต้านข่าวกรองเสียก่อน\n\nฉะนั้น สำหรับตอนนี้ จงนึกถึงเพียงแค่หน้าที่เท่านั้น\n\nอีวานคลายแรงบีบที่ด้ามขวานลงแล้วรอฟังมกุฎราชกุมารเอ่ยต่อ\n\n“คำถามของข้ามันประหลาดนักหรือ? เจ้าเองก็เคยพบหน้าผู้กล้าด้วยตนเองมาแล้วไม่ใช่หรือไง?”\n\n“เขาทำไมงั้นเหรอ…?”\n\n“ผู้กล้าน่ะ… เขาเป็นมนุษย์หรือเปล่า?”\n\n“ยิ่งกว่าใครทั้งนั้นแหละ”\n\nอีวานตอบกลับอย่างเย็นชาด้วยใบหน้าเรียบเฉยไร้อารมณ์\n\nเมื่อได้ยินถ้อยคำของเขา อเล็กซานเดอร์ก็แย้มยิ้มเจิดจ้า\n\n“ใช่ ถูกต้องแล้ว ยิ่งกว่ามนุษย์คนใด เป็นผู้ที่เปี่ยมความเป็นมนุษย์อย่างถึงที่สุด ปรากฏตัวขึ้นก่อนที่โลกอันมืดมิด สงครามอันน่าสะพรึงกลัว และการสูญสิ้นเผ่าพันธุ์จะมาเยือน ช่วยกอบกู้มนุษยชาติเอาไว้ แล้วจึงจากไป”\n\nดุจดังตะเกียงที่ส่องสว่างไสวท่ามกลางราตรีอันมืดมิดที่สุด\n\nในฐานะที่เคยเฝ้ามองผู้กล้าอย่างใกล้ชิด อีวานรู้ดี ผู้กล้าไม่ได้มีความศรัทธาทางศาสนาใดๆ เลย\n\nกระนั้น ผู้กล้ากลับสามารถใช้วิชาเวทมนตร์ศักดิ์สิทธิ์ได้อย่างคล่องแคล่ว ทั้งเวทมนตร์ และวิชาดาบ ทุกแขนงล้วนอยู่ในระดับปรมาจารย์ทั้งสิ้น\n\nเขาราวกับเป็นศูนย์รวมของความเป็นไปได้ทั้งหมดที่มนุษย์พึงมี กระทั่งอุปนิสัยใจคอก็เช่นกัน\n\n“การมีอยู่ของเขาราวกับเป็นสัจธรรมแห่งองค์พระผู้เป็นเจ้า ใครเล่าจะกล้าปฏิเสธ? พระผู้เป็นเจ้าทรงรักพวกเรา จึงได้ส่งพระบุตรของพระองค์ลงมาสู่ค่ำคืนอันโหดร้ายและโลกอันมืดมิดใบนี้”\n\nอีวานมาจากโลกที่ไม่มีพระเจ้า หรืออย่างน้อยก็เป็นโลกที่พระเจ้าทรงนิ่งเงียบ ฉะนั้น เขาจึงเป็นคนที่ไม่เชื่อและตั้งข้อกังขาต่อการมีอยู่ของพระเจ้าอย่างยิ่ง\n\nทว่าในโลกใบนี้หาใช่เช่นนั้น พระเจ้ามีตัวตนอยู่จริงที่นี่ และทรงสำแดงพระองค์ให้ประจักษ์ผ่านปาฏิหาริย์แก่เหล่าผู้ศรัทธา\n\nหากมองจากแง่มุมนั้น การมีอยู่ของผู้กล้าเองก็เปรียบเสมือนปาฏิหาริย์อย่างหนึ่ง เป็นผลงานสร้างสรรค์ที่ถูกประดิษฐ์ขึ้นมาโดยเฉพาะเพื่อกอบกู้โลกที่กำลังมุ่งหน้าสู่จุดจบ\n\nจิตวิญญาณของเขามาจากดาวเคราะห์โลกดวงเดียวกับอีวานก็จริง กระนั้น เรือนร่างอันแข็งแกร่งและพรสวรรค์ทั้งมวลของเขาก็สามารถนับได้ว่าเป็นพรประทานจากพระผู้เป็นเจ้าโดยแท้\n\nด้วยเหตุนี้ มนุษย์ทุกคนบนโลกใบนี้จึงพากันสรรเสริญผู้กล้าด้วยความเต็มใจ พระผู้เป็นเจ้าทรงรักพวกเรา จึงได้ทรงส่งตัวแทนของพระองค์ลงมา\n\nแม้ไม่อาจปฏิเสธได้ ทว่าอีวานกลับรู้สึกขมขื่นอยู่ในใจลึกๆ\n\nผู้กล้าเคยเรียกตนเองว่า ‘เป็นเพียงตัวแทนที่ก้าวออกมาข้างหน้าในนามของทุกคน เป็นคนที่ใครๆ ก็สามารถเป็นได้’\n\nตรงกันข้ามกับคำเยินยอของฝูงชน เขาปรารถนาจะดำรงอยู่ต่อไปในฐานะ ‘ปัจเจกบุคคล’ อย่างบริสุทธิ์ใจเท่านั้น\n\n“หากเป็นดังที่เหล่าคนชราในศาสนจักรกล่าวไว้ ว่าพวกเราถูกสร้างขึ้นตามพระฉายาของพระผู้เป็นเจ้า และพระผู้เป็นเจ้าทรงรักพวกเรา เช่นนั้นจงตอบข้ามาสิ เหตุใดโลกของเราจึงเสื่อมทรามลงถึงเพียงนี้? เหตุใดพวกเราจึงต้องใช้ชีวิตด้วยความหิวโหย ริษยา แก่งแย่ง และปล้นชิงกัน?”\n\nเมื่อถอดฉลากชื่อเผ่าพันธุ์มนุษย์ออกไปเสีย ท่าทีและวงจรชีวิตของพวกเขาก็ไม่ได้แตกต่างอะไรไปจากสัตว์เดรัจฉานเลยสักนิด\n\nนี่เป็นคำถามที่ได้ข้อสรุปไปนานแล้วบนโลกเดิม แม้ว่าอีวานจะไม่ได้จบการศึกษาด้านเทววิทยาหรือนับถือศาสนาใดเป็นพิเศษเมื่อครั้งอยู่บนโลก แต่ก็ไม่ใช่เรื่องยากเย็นอะไรที่จะตอบคำถามนี้\n\nทว่าโลกใบนี้ เมื่อหวนกลับมาพิจารณาดูอีกครั้ง กลับมีพระเจ้าผู้ทรงมีตัวตนซึ่งสำแดงพระองค์ให้ประจักษ์ได้โดยตรง\n\nอีวานไม่ได้ตอบคำถามของอเล็กซานเดอร์ อันที่จริง อเล็กซานเดอร์เองก็ไม่ได้เอ่ยถามโดยคาดหวังคำตอบอยู่แล้ว\n\n“ในโลกที่ปราศจากพระเจ้า มีศาสนาอยู่หรือเปล่า?”\n\n“…!”\n\n“ย่อมต้องมีอยู่แล้ว แก่นแท้สำคัญของศาสนามิใช่พระเจ้า หากแต่เป็นมนุษย์ วัตถุแห่งความศรัทธามิใช่เรื่องสำคัญ การมีอยู่ของมนุษย์ผู้เต็มใจจะยอมจำนนเชื่อฟังต่างหากที่เป็นรากฐานของศาสนา”\n\nที่แท้ไอ้หมอนี่ก็รู้เรื่องนี้เหมือนกันสินะ\n\nมันรู้กระทั่งว่าอีวานเป็นผู้ข้ามมิติมาจากต่างโลกด้วยซ้ำ\n\nทว่า เรื่องนั้น… เรื่องนั้นน่ะ\n\nเรื่องที่แม้แต่สมาชิกปาร์ตี้ผู้กล้า หรือแม้แต่เอลิซาเวตาเองก็ยังไม่เคยล่วงรู้เลย\n\nเมื่อคิ้วของอีวานกระตุกเล็กน้อย อเล็กซานเดอร์ก็แสยะยิ้มมุมปาก\n\n“ดังนั้นข้าจึงครุ่นคิดเช่นนี้ ในเมื่อเป็นความจริงที่พระผู้เป็นเจ้าทรงรักมนุษย์ เหตุผลที่มนุษย์ไม่ได้ดีงามย่อมเป็นเพราะ ‘พระผู้เป็นเจ้า’ ของพวกเรานั้นหาได้ดีงามไม่ ระหว่างค้นคว้าเอกสารโบราณและพลิกอ่านบันทึกเก่าแก่ที่ถูกเรียกว่า ‘ความชั่วร้าย’ ซึ่งศาสนจักรตราหน้าให้เป็นหนังสือต้องห้าม ข้าก็ได้ตระหนักแจ้ง อีวาน เปโตรวิช”\n\n“สรุปก็คือ พอรู้ว่าพระเจ้าของตัวเองไม่ได้ดีงามจริง ก็เลยงอนขึ้นมาว่างั้นสิ?”\n\n“ฮ่าๆ หามิได้ ข้าอิจฉาพวกเจ้าต่างหาก พวกเจ้า ‘ผู้คนเหล่านั้น’! ศาสนาในโลกที่ปราศจากพระเจ้าจะงดงามสักเพียงใดกันนะ ศรัทธาที่ถูกสร้างขึ้นโดยผู้ที่ไม่เคยเผชิญหน้ากับการมีอยู่ของพระเจ้าโดยตรงจะบริสุทธิ์ผุดผ่องเพียงใดกัน! ในโลกที่ศรัทธาเช่นนั้นกลายเป็นกิจวัตรประจำวัน ความจริงที่ว่ามนุษย์ทำความดีย่อมงดงามยิ่งนัก นั่นมิใช่หลักฐานหรอกหรือว่าธาตุแท้ของมนุษย์นั้นดีงาม!”\n\n“…ชักอยากจะพาไปดูโลกของพวกฉันเสียแล้วสิ”\n\nหากเป็นไปได้ เขาก็อยากจับมันโยนลงไปกลางตะวันออกกลางเสียให้รู้แล้วรู้รอด\n\nอีวานนึกภาพเหตุการณ์พวกมุสลิมหัวรุนแรงจับเด็กเผาทั้งเป็น กับพวกคริสต์สุดโต่งขว้างระเบิดใส่บ้านเรือนของชนกลุ่มน้อยขึ้นมาได้อย่างง่ายดายเกินไปเสียด้วยซ้ำ\n\nมันเป็นเพียงการครุ่นคิดเชิงปรัชญาอันไร้ค่าที่ไม่มีเหตุผลใดให้ต้องมาถกเถียงกันตั้งแต่แรก เป็นความกังวลในระดับที่จะทำให้ตกใจได้ก็แต่พวกเด็กน้อยที่ใช้ชีวิตอย่างสุขสบายปลอดภัยอยู่ในพระราชวังเท่านั้น\n\nอีวานส่ายศีรษะ เพียงเพื่อ… เพียงเพื่อเรื่องไร้สาระพรรค์นี้ ลูกน้องของฉันถึงกับต้อง…\n\n“เหล่าสุนัขเฒ่าในศาสนจักรกล่าวว่า ‘พระผู้เป็นเจ้า’ เป็นสัญลักษณ์ของ ‘แสงสว่าง’ พวกมันกล่าวว่าพระผู้เป็นเจ้านำพาแสงสว่างมามอบแก่มวลมนุษย์ เพื่อขับไล่ความมืดมิดให้มลายไป เช่นนั้น ความมืดคือสิ่งใดเล่า? สิ่งใดกันที่บีบให้กระทั่งพระผู้เป็นเจ้าผู้ยิ่งใหญ่ยังต้องจมอยู่ท่ามกลางความมืดมิดนานถึงครึ่งค่อนวันในแต่ละวัน?”\n\nนั่นมันปรากฏการณ์ธรรมชาติจากการหมุนรอบตัวเองของดาวเคราะห์ต่างหาก เจ้าเด็กน้อย\n\nอีวานไม่เสียเวลาเอ่ยบอกให้เสียเปล่า เขายังคงรอคอยต่อไป\n\nคาดหวังว่าตัวร้ายผู้หลงตัวเองตามสูตรสำเร็จรายนี้จะเผลอหลุดปากเปิดเผยพิรุธเรื่องตัวตนและตำแหน่งที่อยู่ของตนออกมา\n\n“หากในแสงสว่างมีความศักดิ์สิทธิ์สถิตอยู่ ย่อมชัดเจนมิใช่หรือว่าในรัตติกาลเองก็ย่อมมีความศักดิ์สิทธิ์สถิตอยู่เช่นเดียวกัน? จะเป็นเช่นไรหากเหล่าปีศาจในพระคัมภีร์เป็นเพียงเศษเสี้ยวของตัวตนในอดีตกาล? และ… จะเป็นเช่นไรหากพวกมันมีความเกี่ยวข้องกับพวกเจ้า ‘ผู้ที่ถูกดึงตัวมาที่นี่’?”\n\n“ว่าไงนะ…?”\n\n“พวกเราไม่ล่วงรู้พระนามของพระผู้เป็นเจ้า สิ่งมีชีวิตหนึ่งเดียวไม่จำเป็นต้องมีนามเรียกขานเฉพาะตัว ทว่าหากครั้งหนึ่งเคยมียุคสมัยที่แม้แต่พระเจ้าก็ยังมีนามเรียกขาน หากเคยมียุคสมัยที่เหล่ายักษ์ผู้เปี่ยมด้วยเทวภาพเคยย่างกรายบนผืนพิภพ หากหลังการห้ำหั่นในยุคสมัยนั้น พวกเราเรียกขานผู้ชนะว่า ‘พระผู้เป็นเจ้า’ และหลงลืมความเชื่อดึกดำบรรพ์ ศาสนา และตำนานปรัมปราเหล่านั้นไปจนหมดสิ้นเล่า”\n\n– คุณสมบัติในการพลิกหน้ากระดาษสุดท้ายแห่งความจริง คุณสมบัติในการมองเห็นฝ่ามือที่อยู่บนกระดานเกมนี้\n\nอีวานหวนนึกถึงถ้อยคำที่เบโอลกรินเคยเอ่ยกับตน ทวยเทพบนกระดานเกม… เหล่ายักษ์แห่งศาสนาโบราณ…? นี่มัน\n\n‘ที่แท้ก็เป็นแนวกลุ่มดาวหรอกเรอะ…!’\n\nอีวานถอนหายใจเฮือก\n\nหากเศษเสี้ยวของตัวตนในอดีตกาลเหล่านั้นเกี่ยวข้องกับผู้ที่ถูกดึงตัวมาที่นี่ หรือก็คือ เหล่าผู้ข้ามมิติ\n\nอา มันก็เห็นๆ กันอยู่แล้วไม่ใช่หรือไง? ให้ตายสิ\n\nสาเหตุของการมาสิงร่างก็คงหนีไม่พ้นพวกเทพมารโบราณหรืออะไรทำนองนั้นนั่นแหละ ท้ายที่สุดแล้ว จะมีใครนอกจากทวยเทพที่สามารถข้ามผ่านระหว่างโลกได้กันเล่า?\n\nท่านนักบุญหญิงเองก็เคยพูดทำนองนี้ไว้เหมือนกัน ว่าสามารถพบเรื่องราวของผู้ที่ถูกดึงตัวมาได้ทั่วไปในบันทึกเก่าแก่ของศาสนจักร\n\nอีวานสะบัดศีรษะที่เต็มไปด้วยความคิดซับซ้อนยุ่งเหยิง\n\nในที่สุดเขาก็รู้สาเหตุเสียที สาเหตุของช่วงเวลา 30 ปีอันน่าบัดซบนี้… บ้างก็กลับไป บ้างก็หายสาบสูญ และบ้างก็ล้มตาย เอนริเก้เคยบอกเอาไว้แบบนั้น\n\nเช่นนั้น ย่อมหมายความว่าผู้ที่พลิกหน้ากระดาษสุดท้ายของเรื่องราวได้สำเร็จย่อมสามารถกลับบ้านได้\n\nแม้ว่าอีวานจะไม่รู้เรื่องราวของตนเองก็ตาม แต่เขาก็ยังโล่งใจอยู่ดี เขายังสามารถกลับไปได้ แค่นั้นก็เพียงพอแล้ว\n\n“พอได้แล้ว”\n\n“…อะไรนะ?”\n\n“ฉันเข้าใจแล้ว”\n\nอีวานยกขวานขึ้นพลางจ้องมองอเล็กซานเดอร์\n\nเวทฉายภาพจิตระยะไกลไม่อาจโจมตีใส่ร่างจำแลงได้โดยตรง กระนั้น ก็ยังสามารถทำลายกลไกที่สร้างกระแสเวทขึ้นมาได้\n\nเมื่อพิจารณาว่าสามารถสนทนาโต้ตอบหรือมีปฏิสัมพันธ์กับร่างจิตได้ เวทมนตร์บทนี้จึงนับว่าอันตราย จำเป็นต้องทำลายอาคมให้สิ้นซากเสียก่อนจึงค่อยทำการวิเคราะห์\n\nเพราะหากปล่อยให้สิ่งนี้หลุดเข้าไปในกองบัญชาการต่อต้านข่าวกรอง ย่อมเสี่ยงต่อการเกิดข้อมูลลับรั่วไหลได้\n\n“ซ้ำซากสิ้นดี ไปแสวงหาปัญญาจากเทพมารโบราณ พล่ามเพ้อเจ้อราวกับตนเองตรัสรู้สัจธรรมของโลก จัดตั้งองค์กรชั่วร้ายแล้วชักใยอยู่เบื้องหลัง… ฉันเข้าใจหมดแล้วล่ะ”\n\n“นี่ ข้า…”\n\n“ฉันบอกให้หยุดพูดไง”\n\nในฐานะคนมีเหตุมีผล อีวานไม่มีทั้งอารมณ์และความอดทนจะมานั่งฟังเรื่องตลกไร้สาระอีกต่อไป\n\nเขาอดทนฟังคำพล่ามยืดยาวจนได้ข้อมูลที่ต้องการครบถ้วนแล้ว และยังสรุปได้อีกว่า ณ จุดนี้ของการดำเนินเรื่อง เขาคงไม่อาจระบุตำแหน่งที่ตั้งของไอ้หมอนี่ได้\n\nบางที ‘อีสเตอร์เอ้กห้องลับ’ นี้คงเป็นเอพพิโซดเปลี่ยนสายตัวละครประเภทที่ตัวเอกบังเอิญมาพบเข้าแล้วเข้าสู่ด้านมืด…\n\nไม่รู้เหมือนกันว่าไอ้โง่คนไหนมันจะหลงเข้าด้านมืดเพราะมาได้ยินนิทานพรรค์นี้ แต่ก็เอาเถอะ ในโลกยุคก่อนสมัยใหม่ที่ป่าเถื่อนและเต็มไปด้วยพวกบ้าคลั่งความมืดมิดเช่นนี้ มกุฎราชกุมารองค์นี้ก็คงก่อตั้ง ‘องค์กร’ อะไรสักอย่างขึ้นมาจริงๆ นั่นแหละ\n\nการเสริมความแข็งแกร่งให้ตัวละครเอกผ่านธีมการเข้าสู่ด้านมืดเป็นเอพพิโซดที่พบเห็นได้ดาษดื่น มีเหตุผลอยู่นะว่าทำไมเวนอมถึงได้โด่งดังนักหนา มันเป็นสัจธรรมสากลที่ว่าพอทาสีดำลงไปอะไรๆ มันก็ดูเท่ขึ้นมาทั้งนั้น\n\nทว่าอีวานไม่ใช่เด็กมัธยมต้นที่กำลังพลุ่งพล่านตามประสาวัยรุ่น เขาไม่ได้มองว่าอะไรที่มืดมนและบิดเบี้ยวประหลาดล้ำมันน่าหลงใหลเลยสักนิด สิ่งที่เขามองว่ามีเสน่ห์น่าดึงดูดก็คือห้องทำงานผู้อำนวยการอันเงียบสงบ โซฟานุ่มสบาย และแกงกิมจิ\n\n“ฉันมีเรื่องจะบอกแกเพียงอย่างเดียวเท่านั้น”\n\n“…เรื่องอะไร?”\n\n“จงมีชีวิตอยู่ต่อไป”\n\nอีวานจ้องเขม็งตรงไปยังอเล็กซานเดอร์พลางคำรามเสียงต่ำ\n\n“รักษาชีวิตเอาไว้ให้ดีจนกว่าฉันจะตามหาแกเจอ”\n\n“อีวาน เปโตรวิช เจ้ามันก็เป็นเพียงหุ่นเชิดเท่านั้นแหละ ฝ่ามือที่คอยชักใยอยู่เหนือเส้นด้ายเหล่านั้น…!”\n\n– แครก!!\n\nอีวานฟาดทำลายอุปกรณ์เวทมนตร์ขนาดเล็กที่ปลดปล่อยเวทฉายภาพจนแหลกละเอียด แล้วปัดฝุ่นออกจากมือ\n\nจนวาระสุดท้าย ก็ยังคงเป็นเรื่องราวที่คาดเดาได้ง่ายเสียจริง\n\nอีวานเหน็บขวานกลับเข้าที่เอวแล้วหมุนตัวเดินจากไป\n\n***\n\n– อ๊ากกกกกกก!!\n\n– ฆ่าข้าที!! อ๊ากกกกก!!\n\n– กรอด… อึก….\n\n“ว้าว… อะ อะไร… เอ่อ เกิดเรื่องบ้าอะไร… ขึ้นกันแน่เนี่ย…?”\n\nเอซิดิสกลืนน้ำลายลงคออย่างยากลำบากพลางหันไปมองอิซาเบลล์และออสการ์\n\nทั้งสองคนต่างหน้าซีดเผือดและเกร็งเครียดไปทั้งตัว\n\nเสียงกรีดร้อง เสียงกรีดร้อง และมีแต่เสียงกรีดร้องไม่หยุดหย่อน\n\nเสียงกรีดร้องโหยหวนดังก้องสะท้อนไปทั่วทั้งอาคาร ตามมาด้วยเสียงดังสนั่นกัมปนาทราวกับข้าวของเครื่องเรือนกำลังถูกทุบทำลายจนพังยับเยิน\n\nและในไม่ช้า\n\n– ตึก ตึก\n\nเสียงฝีเท้าหนักแน่น\n\n“อึก…”\n\nนอกจากเสียงกลืนน้ำลายอันแห้งผากแล้ว ทั้งสามคนก็ไม่อาจเปล่งเสียงใดๆ ออกมาได้อีกเลย\n\nพวกเขาจ้องมองไปยังประตูด้วยแววตาที่เปี่ยมด้วยความตึงเครียด\n\nครู่ต่อมา เสียงฝีเท้าก็ดังขึ้นอีกครั้ง เดินตรงมาหยุดที่หน้าประตูและเอื้อมจับลูกบิด\n\n– กริ๊ก\n\nเสียงลูกบิดประตูที่ล็อกอยู่ถูกบิดหมุนไปมาหลายครั้ง และจากนั้น\n\n– โครม!!\n\nคมขวานผ่าทะลวงบานประตูแยกออกเป็นเสี่ยงๆ\n\nภายในห้องมืดสลัว เงาร่างสูงใหญ่ทอดยาวพาดผ่านระหว่างแสงไฟอันริบหรี่\n\nกลิ่นคาวเลือดอันน่าสยดสยองโชยคลุ้งเข้ามา\n\n“ดะ… ได้โปรดไว้ชีวิต…”\n\n“อยู่เฉยๆ”\n\nเงาร่างนั้นก้าวเดินอย่างมั่นคงตรงเข้ามาหาเอซิดิส อึ๋ย! เอซิดิสขดตัวงอ ยกแขนขึ้นกอดตัวเองแน่น\n\nทว่า กริ๊ก พร้อมกับเสียงสั้นๆ มือของเธอก็พลันเป็นอิสระในทันใด เขาใช้ขวานผ่าโซ่เหล็กที่พันธนาการข้อมือของเธอให้ขาดสะบั้นตรงกลาง\n\n“ยืนไหวไหม?”\n\n“ขะ ค่ะ… มะ ไม่ไหว ขาหนูมัน… อ่อนแรงไปหมดเลยค่ะ”\n\n“รอเดี๋ยว”\n\nชายผู้นั้นหันหลังเดินผละออกไป ไม่นานนัก กริ๊ก กริ๊ก พร้อมเสียงโลหะขาดสะบั้น อีกสองคนที่เหลือก็ได้รับการปลดปล่อยจากโซ่ตรวนเช่นเดียวกัน\n\nท่ามกลางความเงียบงันในโสตประสาทอันตึงเครียดของเอซิดิส เสียงอันตื่นเต้นดีใจของอิซาเบลล์ก็พลันดังแทรกเข้ามา\n\n“อ๊ะ คุณลุงจริงๆ ด้วย! คุณพระช่วย! คุณลุงคะ! คุณลุงมาช่วยพวกเราแล้ว!”\n\n“อืม”\n\n“คุณลุงรู้ได้ยังไงคะว่าหนูอยู่ที่นี่… อ๊ะ ห-หรือว่าคุณลุงแอบมองหนูอยู่เหรอคะ?”\n\n‘คุณลุง’ ของอิซาเบลล์ หรือก็คือ สตอล์กเกอร์ของยัยนั่นเอง!\n\nเอซิดิสหันขวับไปมองอิซาเบลล์ด้วยดวงตาเบิกโพลงอย่างตกตะลึง มันใช่เรื่องที่จะไปถามสตอล์กเกอร์ตรงๆ เหรอว่า ‘คุณแอบตามดูหนูอยู่ใช่ไหมคะ?’\n\nแถมยังไปถามเอากับสตอล์กเกอร์ที่ถือขวานโชกเลือดทั้งตัวด้วยเนี่ยนะ…?\n\n“เปล่า ฉันตามรอยมอร์ดมาน่ะ”\n\nเอซิดิสถึงกับทรุดฮวบลงทันทีที่ได้ยินคำพูดนั้น\n\nอ่า ที่แท้ก็เป็นฉันเอง ใช่แล้ว ฉันเองก็เป็นพวกสตอล์กเกอร์เหมือนกันนี่นา\n\nความปรารถนาอันไม่อาจหยั่งถึงที่ปลายทางของรอยแผลอันสามานย์นี้ทำให้เธอหวาดกลัวจับใจ…\n\n“ขึ้นมาขี่หลังฉันสิ”\n\n“มะ ไม่เป็นไรค่ะ อ๊ะ อึก หนูสบายดี…”\n\n“เวลาเป็นของมีค่า”\n\nอีวานช้อนร่างเอซิดิสที่กำลังสั่นเทาขึ้นมาแล้ววางพาดขึ้นบนหลังของตน\n\nเขาเดินย้อนกลับไปตามเส้นทางเดิมที่เข้ามา ก้าวเดินอย่างมั่นคงโดยไม่เอ่ยปากพูดสักคำ\n\n***\n\nโลหิต เศษเนื้อ ชิ้นส่วนซากศพ\n\nกำแพงด้านนอกที่พังทลายไปครึ่งแถบ หน้าต่างที่แตกละเอียด บานประตูที่ถูกทุบพังและผ่าแยก\n\nโถงทางเดินเช่นนั้นทอดยาวต่อเนื่องไปไม่สิ้นสุด ทางเดินที่เคยขาวสะอาดสะอ้านจนกระทั่งตอนที่พวกเธอถูกลากตัวมาที่นี่ เวลานี้กลับย้อมไปด้วยสีแดงฉานจนแทบหาพื้นที่ซึ่งไม่เปื้อนเลือดไม่เจอ\n\nน่ากลัวเหลือเกิน\n\nเอซิดิสตัวสั่นเทา เพราะผู้ชายคนนี้ และสิ่งที่ผู้ชายคนนี้สามารถทำได้ มันน่าสะพรึงกลัวเกินไปจริงๆ\n\n“ไม่เป็นไร”\n\n“อึ๋ย…!”\n\n“ไม่เป็นไรนะ เอซิดิส ทุกอย่างจบลงแล้วล่ะ”\n\nเอ๊ะ\n\nเอซิดิสที่หลับตาปี๋ตัวสั่นเทาอยู่ ค่อยๆ ลืมตาขึ้นอย่างระมัดระวังเมื่อสัมผัสได้ถึงฝ่ามือที่ตบลงบนแผ่นหลังของเธอเบาๆ\n\nเส้นผมตัดสั้น ลำคอแกร่งที่เผยให้เห็น แผ่นหลังกว้างอันกำยำที่ทอดลงไปเบื้องล่าง\n\nน้ำเสียงอันสงบนิ่งยังคงเอ่ยปลอบประโลมอย่างต่อเนื่องมั่นคง\n\nเอ๊ะ…?\n\n– ไม่เป็นไรนะ เอซิดิส ทุกอย่างจบลงแล้วล่ะ\n\nถ้อยคำนี้ เธอเคยได้ยินมาก่อน\n\nเสียงนี้เองก็เหมือนกัน พอลองนึกดูดีๆ แล้ว… เธอก็เคยได้ยินมาก่อนไม่ใช่หรือ?\n\nเอซิดิสเหม่อมองด้านหลังศีรษะของอีวานนิ่งงันอยู่นาน\n\nหลับตาลงแน่น พยายามนึกย้อนภาพเหตุการณ์ตอนที่เขาเข้ามาช่วยเธอเมื่อครู่นี้\n\nพยายามนึกทบทวนใบหน้าของเขาในตอนที่บังเอิญพบกันในวิทยาเขตเมื่อไม่นานมานี้\n\nนึกถึงภาพตอนที่ลองยกมือปิดบังหนวดเคราของเขาออก แล้วค่อยๆ ทบทวนถึงใครคนหนึ่งในอดีตอันแสนไกลทีละคน…\n\n“เอ๊ะ… เอ๋…? คุ-คุ-คุณลุง…?!!”\n\n“หืม?”\n\n“คุณลุง… อีวาน…???”\n\n“อืม”\n\n“เอ่อ… อ่า… เอ๋… อะไรกัน? ทำไมถึง…”\n\nหลังจากอ้ำอึ้งพูดตะกุกตะกักเพราะสมองประมวลผลไม่ทันอยู่พักหนึ่ง เอซิดิสก็ถึงกับฟุบหน้าลงและสลบเหมือดไปในทันที\n\nอีวานประคองร่างที่อ่อนปวกเปียกของเอซิดิสไว้พลางพยักหน้าเงียบๆ\n\nก็แหงล่ะ โดนฮัสคาลที่ไว้เนื้อเชื่อใจหักหลังแล้วยังถูกกักขังหน่วงเหนี่ยวมาตลอดทั้งวัน ก็ย่อมต้องเหนื่อยล้าเป็นธรรมดา\n\nพอความตึงเครียดคลายตัวลง คนเราก็อาจหมดสติไปได้ เมื่อเคยเห็นทหารที่เป็นแบบนี้มามากมาย อีวานจึงไม่รู้สึกแปลกใจแต่อย่างใด\n\n“อืม”\n\nเขาขยับจัดท่าทางของเอซิดิสบนหลังอย่างเงียบเชียบแล้วก้าวเดินต่อไป\n\nในฐานะคนดูแลสถานเลี้ยงเด็กกำพร้า เขาย่อมมีประสบการณ์โชกโชนในการอุ้มเด็กๆ ที่เหนื่อยล้ากลับมาส่งบ้านอยู่แล้ว\n\n***\n\n“…ทำไมกัน”\n\n“เป็นอะไรไปครับ คุณอิซาเบลล์?”\n\n“ทำไม… ฉันล่ะ…? ฉันโดนลักพาตัวมาก่อนแท้ๆ ฉันรู้ตัวก่อนแท้ๆ…”\n\nอิซาเบลล์กัดเล็บตัวเองพลางจ้องเขม็งมองไปยังเอซิดิสที่กำลังขี่อยู่บนหลังของอีวาน\n\nผู้หญิงที่เธอคิดว่าเป็นเพื่อนรักกลับกำลังขี่อยู่บนหลังของอีวาน คุยจู๋จี๋กับเขาอย่างสนิทสนม\n\nแล้วยังจู่ๆ โผกอดต้นคอของเขาไว้แน่น แนบเรือนร่างทิ้งน้ำหนักตัวลงไปหาเขาเสียอีก\n\nถูไถส่วนเว้าส่วนโค้งที่ออกจะ ‘โดดเด่น’ เกินหน้าเกินตาพวกนั้นเข้ากับแผ่นหลังของอีวานอย่างแนบชิด แน่นหนึบ น่าหงุดหงิดเป็นบ้าเลย!\n\nแกล้งทำเป็นขาอ่อนแรงเพื่อจะได้ขี่หลัง กระซิบกระซาบข้างหูพลางคุยกันอย่างสนิทสนม…!!\n\n“ฉันมาก่อนแท้ๆ ยัยนั่นก็แค่เลียนแบบฉันเท่านั้นแหละ”\n\n“เอ่อ คุณอิซาเบลล์ครับ แบบนั้น เอ่อ ดูน่ากลัวไปหน่อยนะครับ”\n\n“ยัยคนทรยศ…”\n\nกึก โลหิตเริ่มซึมออกมาจากปลายนิ้วหัวแม่มือของอิซาเบลล์\n\n**เอพพิโซด 10: สตอล์กเกอร์ ปะทะ สตอล์กเกอร์**\n\n***\n\n**💬 ความคิดเห็นนักอ่าน:**\n- **@ทีมคุณลุงตลอดไป** (4 วันที่แล้ว • 👍 248): ตอนพีคระดับขึ้นหิ้งเลยตอนนี้!! น้ำตาจะซึมตอนเอซิดิสขี่หลังลุงเดินฝ่าโถงเปื้อนเลือด แล้วในที่สุดเธอก็จำได้ว่าเป็น “คุณลุงอีวาน” เมื่อ 10 ปีก่อน...\n- ↳ **@เพื่อนซี้สายอ่อย** (4 วันที่แล้ว • 👍 118): ตัดภาพมาที่อิซาเบลล์ยืนกัดนิ้วหัวแม่มือเลือดซิบ: \"แกล้งทำเป็นขาอ่อนแรงเพื่อจะได้ขี่หลัง...\" ปรับอารมณ์ไม่ทันโว้ยยย 55555\n- ↳ **@คนอ่านที่นั่งขำตีสาม** (3 วันที่แล้ว • 👍 64): ช็อตอิซาเบลล์หลอนคิดไปไกลนี่คือขโมยซีนความซึ้งไปครึ่งห้องเลย เอ็นดูคนถือมีดข้างๆ ที่รีบบอกว่าดูน่ากลัวไปหน่อยนะคะ 555\n- **@นักสืบกลุ่มดาว** (4 วันที่แล้ว • 👍 134): คำพูดของอเล็กซานเดอร์เรื่องบันทึกต้องห้ามกับ 'แนวกลุ่มดาว' และ 'พลิกหน้าสุดท้ายเพื่อกลับบ้าน' นี่น่ากลัวมาก นี่คือความลับเบื้องหลังเกม/โลกนี้ทั้งหมดเลยสินะ\n- **@ฟาดด้วยขวานไม่คุย** (3 วันที่แล้ว • 👍 79): ชอบตอนลุงฟาดเครื่องฉายภาพพังไม่ฟังต่อแล้วไปช่วยเด็กๆ ก่อน ไม่ตกหลุมสงครามประสาทตัวร้ายเลยสักนิด สมกับเป็นอีวาน!"
