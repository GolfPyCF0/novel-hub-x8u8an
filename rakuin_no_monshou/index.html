      "title": "บทที่ 3.3: หน้ากากชิ้นใหม่ (3)",
      "content": "หากหมุนเข็มนาฬิกาย้อนเวลากลับไปสักเล็กน้อย ทางฟากฝั่งของเจ้าหญิงวิลีนา โอเวลล์ พระธิดาองค์ที่สามแห่งการ์เบรา\n\nขณะที่นางก้าวเดินไปตามทางเดินที่ทอดยาวผ่านช่องผาหิน เช่นเดียวกับทางฝั่งของออร์บา มีผู้คนมากมายหลายหน้าต่างพากันส่งสายตาจับจ้องมายังนาง ในหมู่คนเหล่านั้นมีบางคนที่ทอดถอนหายใจออกมาด้วยความโศกเศร้าอาลัยอาวรณ์อย่างลึกซึ้ง ด้านวิลีนาซึ่งวางเฉยต่อสายตาเหล่านั้นด้วยท่าทีราวกับเด็กสาวไร้เดียงสา กำลังเอียงหูสดับฟังบทเพลงที่เหล่านักดนตรีกำลังบรรเลงขับขาน ขณะที่นางก้าวเดินไปตามเส้นทางที่มุ่งตรงสู่ห้องโถงใหญ่\n\n\"เอาเถิด อย่างน้อยข้าก็คิดว่าพวกเขายังพอจะแสดงให้เห็นถึงร่องรอยของอารยธรรมอยู่บ้างล่ะนะเจ้าคะ\" เทเรเซียซึ่งก้าวเดินเคียงข้างเอ่ยขึ้นพลางค้อมศีรษะยอมรับ\n\nด้วยความรู้สึกไม่ต่างกัน วิลีนาดึงคางเข้าเล็กน้อยและผงกศีรษะรับเบาๆ ก่อนที่เทเรเซียจะเอ่ยสำทับตามหลังขึ้นมาว่า\n\n\"ทว่า องค์หญิง ได้โปรดระมัดระวังถ้อยคำที่เอื้อนเอ่ยด้วยนะเจ้าคะ อย่างมากที่สุดก็เรียกพวกเขาว่า 'พวกวานรในถ้ำที่มีสติปัญญา' หรือไม่ก็ 'ซากเดนยักษ์กินคนที่หลงใหลการเข่นฆ่ากันเอง' ก็พอแล้วเจ้าค่ะ\"\n\n\"ตราบใดที่ยังมีเทเรเซียอยู่เคียงข้างข้า\" วิลีนาหัวเราะร่า \"ไม่ว่าจะเป็นเมฟิอุส ทุ่งหิมะอันห่างไกล หรือที่แห่งหนใด ข้าก็คงไม่มีวันเบื่อหน่ายเป็นแน่\"\n\nเทเรเซียผู้อยู่เคียงข้างนางมาตั้งแต่ลืมตาดูโลกทำหน้าที่เป็นผู้ปกครองของนางเสมอมา แม้ว่าเส้นผมของนางจะเริ่มมีสีขาวแซมประปราย ทว่าหากอยู่ในช่วงอารมณ์ดี นางก็สามารถปล่อยมุกตลกร้ายอันตรายพรรค์นี้ออกมาได้หน้าตาเฉย\n\nเมื่อพวกนางก้าวเข้ามาภายในห้องโถง วิลีนาคลี่รอยยิ้มอย่างชาญฉลาดมีชั้นเชิงขณะที่เหล่าขุนนางแห่งจักรวรรดิเมฟิอุสหลายคนก้าวเข้ามาหาเพื่อกล่าวคำทักทายนาง ส่วนเทเรเซียก็ถอยหลังฉากไปหนึ่งก้าวตามหน้าที่ คอยยืนประกบอยู่ด้านหลังนายหญิงของตน\n\nแม้แน่นอนว่านี่จะไม่ใช่ครั้งแรกที่นางได้สนทนากับเหล่าขุนนางเมฟิอุส ทว่าที่ผ่านมามักจะอยู่ในบรรยากาศของการสู้รบปรบมือเสมอ ดังนั้น ท่วงท่าอันตื้นเขินที่คนพวกนี้พยายามเสแสร้งแกล้งทำเป็นผู้มีวัฒนธรรมสูงส่งจึงทำให้นางรู้สึกสะอิดสะเอียนอยู่ลึกๆ เมื่อเหล่าขุนนางล่าถอยจากไป วิลีนาก็ผ่อนลมหายใจทอดไหล่ลงด้วยความเมื่อยล้า\n\n\"ถึงอย่างนั้น ดูเหมือนพวกเขาจะปรารถนาสตรีในอุดมคติที่เป็นแบบแผนโบราณอย่างประหลาดนะ ตอนที่คณะทูตชุดแรกที่มาสู่ขอพูดถึงความเพลิดเพลินในการขับเรือเหาะของข้า ดวงตาของพวกเขานี่เบิกกว้างกลมโตเป็นไข่ห่านกันหมดเลยเชียวล่ะ ในเมฟิอุส สตรีไม่ได้รับอนุญาตให้ขี่ม้าหรือขี่มังกร และดูเหมือนว่าพวกผู้หญิงจะไม่สามารถสวมเสื้อผ้าที่ไม่ปิดคลุมขากางเกงมิดชิดได้ด้วยซ้ำ\"\n\n\"ถ้าเช่นนั้น ข้าก็มั่นใจว่าองค์หญิงคงจะดูห้าวหาญเยี่ยงบุรุษในสายตาของพวกเขาเป็นแน่เจ้าค่ะ ข้ารู้สึกสงสารคู่หมายของพระองค์อย่างองค์ชายกิลแห่งเมฟิอุสเหลือเกิน พวกเขายึดมั่นใน 'เกียรติภูมิและประวัติศาสตร์' ท่ามกลางราชวงศ์จักรพรรดิ แต่กลับต้องยอมรับให้เจ้าหญิงจอมแก่นแห่งการ์เบรา — ผู้ที่จะต้องยืนเคียงข้างองค์รัชทายาทผู้สืบทอดราชบัลลังก์ — ก้าวขึ้นเป็นจักรพรรดินีของแผ่นดินเสียได้\"\n\n\"มันก็พอกันทั้งคู่นั่นแหละ พวกเรามันไก่เห็นตีนงูงูเห็นนมไก่\" วิลีนาเอ่ยพลางแค่นหัวเราะอย่างไร้ซึ่งความยินดี ขณะที่ยกมือขึ้นจัดแต่งเครื่องประดับผมของตน \"ข้าอาจจะเป็นทอมบอยจอมแก่นเยี่ยงบุรุษก็จริง ทว่าคู่หมายที่ข้าต้องคอยดูแลเอาใจใส่กลับเป็นถึงองค์ชายองค์โต กิล เมฟิอุส แห่งจักรวรรดิเมฟิอุสเชียวนะ ข้าไม่เคยได้ยินเรื่องดีๆ เกี่ยวกับตัวเขาเลยแม้แต่เรื่องเดียว ต่อให้คณะทูตของพวกเขาจะพยายามสรรเสริญเยินยอองค์ชายของตนด้วยคำยกยอปอปั้นอันเอาเป็นเอาตายสักเพียงใด มันก็เป็นได้แค่ภาพอันน่าเวทนาเท่านั้น เพราะไม่ว่าพวกเขาจะเอ่ยคำใดออกมา มันก็ฟังดูเสแสร้งหน้าซื่อใจคดไปเสียหมด และดูเหมือนว่าแม้แต่ตัวคนพูดเองก็ยังไม่เชื่อในสิ่งที่ตัวเองพูดเลยสักนิด\"\n\nกิล เมฟิอุส แม้ในเวลานี้จะเป็นเพียงเด็กหนุ่มวัยสิบเจ็ดปี ทว่าเขากลับเป็นองค์รัชทายาทลำดับที่หนึ่งผู้มีสิทธิ์ขาดในการสืบทอดราชบัลลังก์เพื่อปกครองจักรวรรดิเมฟิอุส ชายผู้นี้ที่นางเคยเห็นเพียงภาพวาดเหมือนเท่านั้น กำลังจะต้องกลายมาเป็นสามีของวิลีนา\n\nพวกเขากำลังจะได้พบหน้าค่าตากันเป็นครั้งแรกในตอนนี้ และในวันรุ่งขึ้น ตามธรรมเนียมประเพณีของเมฟิอุส พิธีกรรมอภิเษกสมรสจะถูกจัดขึ้นบนแท่นบูชาศักดิ์สิทธิ์เหนือหุบเขา จากนั้นในวันที่สาม พวกเขาก็จะมุ่งหน้าสู่ราชธานีโซลอนของเมฟิอุส ที่ซึ่งงานเลี้ยงฉลองอันยิ่งใหญ่ตระการตาจะถูกจัดขึ้นอย่างสมพระเกียรติ\n\nไม่ใช่เพียงแค่พิธีแต่งงานที่จะลุล่วงสมบูรณ์เท่านั้น ทว่าที่สำคัญยิ่งไปกว่านั้น ด้วยเหตุนี้ สันติภาพและการเป็นพันธมิตรระหว่างเมฟิอุสกับการ์เบราจะถูกสถาปนาขึ้นอย่างเป็นทางการ การศึกสงครามที่ดำเนินยืดเยื้อมาเนิ่นนานกว่าสิบปีจะได้ฤกษ์ปิดฉากลงเสียที\n\nแน่นอนว่า แม้แต่วิลีนาเองก็ปรารถนาให้เป็นเช่นนั้น ทว่ากลับไม่มีข่าวลือในแง่ดีเกี่ยวกับองค์ชายผู้ที่จะมาเป็นคู่ครองของนางเลยแม้แต่น้อย เล่าลือกันว่าเขาเป็นคนขี้ขลาดตาขาว เทียบไม่ได้แม้แต่เศษเสี้ยวของพระบิดา — จักรพรรดิกูล เมฟิอุส พระองค์ปัจจุบัน — เอาแต่คบค้าสมาคมกับก๊วนเพื่อนรุ่นราวคราวเดียวกัน เที่ยวเตร่สังสรรค์คืนแล้วคืนเล่า และยังมีพฤติกรรมพิลึกพิลั่นแปลกประหลาดอีกสารพัด\n\n\"พวกเขาบอกว่าเขาเป็นคนโง่เง่าไร้ประโยชน์เพคะ\" วิลีนาเคยประกาศกร้าวต่อหน้าพระบิดาของตนยามที่พระองค์ทรงแจ้งเรื่องการหมั้นหมายนี้แก่นาง\n\nแต่เดิมทีแล้ว ชายผู้มีนามว่า **ริวคอวน์** ต่างหากที่ควรจะเป็นคู่หมั้นของนาง เขาเป็นแม่ทัพผู้บัญชาการเรือบรรทุกอากาศยานในสังกัด เปี่ยมล้นด้วยความกล้าหาญชาญชัยและสร้างผลงานอันโดดเด่นเป็นเลิศที่สุดในการทำสงครามกับเมฟิอุส และด้วยเหตุนี้ การหมั้นหมายระหว่างเขากับเจ้าหญิงองค์ที่สามวิลีนาจึงได้ถูกกำหนดขึ้นท่ามกลางไฟสงคราม\n\nวิลีนาเองก็เคยได้พบกับบุคคลผู้นั้นมาแล้วเช่นกัน แม้ตามตรงแล้ว การพบกันครั้งแรกของพวกเขาจะเป็นเรื่องราวอันน่าตื่นเต้นตระการตาจนถึงขนาดที่ผู้คนทั่วทั้งประเทศยังคงเล่าขานมาจนถึงทุกวันนี้ ทว่าในตอนนั้นนางเพิ่งจะมีอายุได้เพียงเก้าขวบเท่านั้น และเมื่อได้พบกันอีกครั้งในอีกสี่ปีถัดมา ตอนที่มีการจัดเตรียมเรื่องการหมั้นหมาย วิลีนากลับไม่มีความประทับใจที่ชัดเจนเลยว่าเขาควรจะเป็นบุรุษแบบใดกันแน่\n\nและดังนั้น เมื่อได้พบกันอีกครั้ง ริวคอวน์กลับเป็นคนที่ขี้อายอย่างไม่น่าเชื่อ เมื่อเทียบเคียงกับเรื่องเล่าความสำเร็จอันดุเดือดในสนามรบ เขาแทบคิดเรื่องที่จะเล่าให้เจ้าหญิงแห่งอาณาจักรฟังไม่ออกแม้แต่เรื่องเดียว และรอยยิ้มของเขาที่คล้ายกับกำลังหัวเราะเยาะสมเพชตัวเองก็ช่างดูเก้งก้างงุ่มง่าม นางไม่รู้ว่าจะชอบหรือจะเกลียดเขาดี รู้เพียงแค่ว่ามันเป็นเหตุผลอันสมควรยิ่งที่การแต่งงานของพวกเขาจะเป็นไปเพื่อประโยชน์ของคนทั้งแผ่นดิน\n\nทว่า ตลอดหลายเดือนที่ผ่านมา แนวหน้าของสมรภูมิรบกลับตกอยู่ในสภาวะคุมเชิงชะงักงัน เมฟิอุสและการ์เบราแอบเปิดการเจรจาสงบศึกอย่างลับๆ และเมื่อเพียงสองเดือนก่อนหน้านี้ พวกเขาก็ตกลงปลงใจที่จะหมั้นหมายองค์รัชทายาทกิลกับเจ้าหญิงวิลีนา\n\nวิลีนาเก็บงำความรู้สึกอันสับสนปนเปไว้ในใจ ตลอดเวลากว่าสิบปีที่พวกเขาทำสงครามกับเมฟิอุส นางย่อมรู้ซึ้งจากประสบการณ์ของตนเองดีว่ามันได้บั่นทอนกำลังกายใจของเหล่าทหารหาญและราษฎรไปมากเพียงใด ประชาชนและขุนนางท้องถิ่นบางส่วนเคยเรียกร้องให้ยืนหยัดต่อสู้จนถึงที่สุด แม้ในหมู่คนเหล่านั้นจะมีอัศวินรวมอยู่ด้วยบ้าง ทว่าพวกเขาก็เป็นเพียงคนกลุ่มน้อยเท่านั้น\n\nพระบิดาของวิลีนา **กษัตริย์ไอนน์ โอเวลล์ที่ 2** ไม่ได้มีอุปนิสัยเด็ดเดี่ยวห้าวหาญเยี่ยงกูล เมฟิอุส เบื้องหน้าพระธิดา พระองค์เอื้อนเอ่ยเพียงคำเดียวสั้นๆ ว่า \"พ่อขอร้องเถอะนะ\" ส่วนวิลีนาทำได้เพียงตอบกลับไปว่า \"ลูกยอมรับเพคะ\" ทว่านางย่อมรู้ดีว่าพระมารดาและเทเรเซียต่างแอบซับน้ำตาอยู่เงียบๆ เบื้องหลังของนาง\n\nและแล้ว เมื่อไม่กี่วันก่อนหน้านี้ ด้วยความรู้สึกราวกับร่างกายและจิตวิญญาณกำลังถูกฉีกกระชากออกจากกัน นางได้เดินทางไปกล่าวคำร่ำลากับเสด็จปู่สุดที่รัก **จอร์จ โอเวลล์** เจ้าหญิงผู้ทะนงองอาจและเปี่ยมด้วยอำนาจบัญชาการ ผู้หลงใหลการควบม้าและขับเรือเหาะ ผู้ที่ได้รับอนุญาตให้จับปืนผาหน้าไม้ และไม่เคยยอมก้มหัวอ่อนข้อให้แก่สิ่งใด ได้กลายสภาพเป็นดั่งเด็กน้อยตัวเล็กๆ ยามอยู่เบื้องหน้าเสด็จปู่ของตน นางปรารถนาที่จะได้รับการโอบอุ้มขึ้นไปนั่งบนตักและเอนกายพิงแผ่นอกอันอบอุ่นนั้นตลอดไป เพื่อที่จะได้สดับฟังเรื่องเล่าวีรบุรุษที่ท่านมักจะเล่าขานให้นางฟังอยู่เสมอ\n\nทว่า เรื่องราวเหล่านั้นได้ถูกปัดเป่าทิ้งไปจนหมดสิ้น และนางจำต้องเดินทางมายังสถานที่แห่งนี้\n\nไม่สิ อาจกล่าวได้ว่าเป็นเรื่องดีที่นางสามารถปกป้องความทรงจำเกี่ยวกับเสด็จปู่เอาไว้ได้เช่นนี้ ทั้งหมดนี้ก็เพื่อประเทศชาติ เพื่อพระบิดา และเพื่อเสด็จปู่ เพื่อพวกเขาเหล่านั้น นางจึงได้กรีธาทัพก้าวเข้าสู่ดินแดนของศัตรูด้วยจิตวิญญาณแห่งการต่อสู้ของอัศวิน\n\n*ดินแดนของศัตรู...*\n\nใช่แล้ว นี่คือศัตรูอย่างแท้จริง จวบจนกระทั่งเมื่อไม่นานมานี้ นี่คือประเทศที่พวกเขาเคยแลกดาบประหัตประหารกัน วิลีนากำลังยืนอยู่ภายในดินแดนของศัตรูคู่อาฆาตแห่งนั้น\n\nพวกมันได้เข่นฆ่าผู้คนไปมากมาย ซึ่งบางคนในนั้นนางถึงกับคุ้นเคยหน้าค่าตาเป็นอย่างดี และแน่นอนว่าฝ่ายตรงข้ามเองก็คงคิดไม่ต่างกันเท่าใดนัก ทว่าวิลีนายังไม่แก่กล้าเป็นผู้ใหญ่มากพอที่จะปล่อยให้เรื่องในอดีตผ่านพ้นไปราวกับสายลมได้\n\n\"พวกเรามาถึงแล้วเจ้าค่ะ\"\n\nยามที่เทเรเซียกระซิบแผ่วเบาข้างหู วิลีนาก็สงบสติอารมณ์ลง มีเหล่าขุนนางชั้นสูงแห่งเมฟิอุสจำนวนมากกำลังจ้องเขม็งมาทางทิศที่พวกนางยืนอยู่ ณ จุดกึ่งกลาง มีชายหนุ่มคนหนึ่งยืนตระหง่านอยู่ในชุดประกอบพิธีการสีขาวบริสุทธิ์\n\n\"นั่นคือองค์ชายองค์โตแห่งเมฟิอุส กิล เมฟิอุส เจ้าค่ะ\"\n\n\"อืม\" วิลีนาขานรับ\n\nพวงแก้มของนางเปล่งปลั่งผุดผ่องตามธรรมชาติแห่งสตรี ทว่าเรือนร่างยังคงเกร็งแน่นด้วยความตึงเครียด\n\nดูเหมือนฝ่ายตรงข้ามจะสังเกตเห็นเช่นกัน ขุนนางร่างอ้วนที่ยืนอยู่ข้างกายองค์ชายกระซิบกระซาบบางอย่างข้างหูของเขา หลังจากนั้น องค์ชายก็สาวเท้าก้าวเข้ามาหาพวกนางด้วยสีหน้าท่าทางที่ดูประหม่าอย่างเห็นได้ชัด\n\nหากมองเพียงผิวเผิน องค์ชายกิลไม่ได้ดูเหมือนชายหนุ่มปัญญาทึบอ่อนแออย่างที่ข่าวลือว่าไว้เลยแม้แต่น้อย เขามีใบหน้าเรียวคม ทว่าโครงสร้างร่างกายกลับดูแข็งแกร่งกำยำเกินคาด หากเพียงแค่เขายืดอกขึ้นอย่างสง่าผ่าเผย เขาก็คงจะดูเหมือนบุรุษรูปงามผู้ไร้ซึ่งความหวั่นเกรง ทว่า...\n\n*ขุนนางผู้ติดตามคนนั้นถึงกับต้องยืนติดแนบชิดขนาดนั้น แทบจะไม่ต่างอะไรกับการต้องจูงมือพาเดินเลยนี่นา หมอนี่มันยังเป็นแค่เด็กน้อยอยู่หรือยังไงกัน?*\n\nแน่นอนว่า นางไม่มีทางล่วงรู้ได้เลยแม้แต่น้อยว่าอีกฝ่ายก็เพิ่งจะมีความประทับใจแรกต่อนางในแบบเดียวกันเป๊ะ ทว่าที่แย่ไปกว่านั้น องค์ชายดูเหมือนจะไม่สามารถสงบจิตใจลงได้เลย ดวงตาของเขาเหลือบมองไปทางโน้นที สอดส่ายไปทางนี้ที ราวกับเด็กหลงทางที่กำลังมองหาพ่อแม่ของตนอย่างไรอย่างนั้น\n\nในขณะที่วิลีนาเผลอจ้องมองอีกฝ่ายด้วยสายตาราวกับกำลังประเมินราคาสินค้า นางก็ถูกศอกของเทเรเซียกระทุ้งสะกิดเข้าที่สีข้างอย่างเงียบเชียบ จนต้องรีบปรับเปลี่ยนสีหน้าของตนให้เรียบร้อยอย่างรวดเร็ว\n\nองค์ชายหยุดฝีเท้าลงเบื้องหน้าวิลีนา วิลีนาก้มศีรษะลงตามมารยาทอันพึงมี และรอคอยคำทักทายจากเขา ทว่านางกลับได้ยินเสียงกระแอมไอเคลียร์ลำคอดังขึ้นหนึ่งครั้งอย่างชัดเจน และมันไม่ได้ฟังดูเหมือนเสียงขององค์ชายเลยแม้แต่นิดเดียว ขุนนางร่างอ้วนคนเดิมกระซิบกระซาบด้วยน้ำเสียงแผ่วต่ำอีกครั้ง ฟังดูราวกับว่าเขากำลังสั่งสอนองค์ชายว่าควรจะเอ่ยปากทักทายนางอย่างไร\n\nในสถานการณ์เช่นนี้ ย่อมเป็นมารยาทอันพึงปฏิบัติของสุภาพสตรีที่จะแสร้งทำเป็นมองไม่เห็น และอย่างน้อยที่สุดก็ไม่ควรทำให้อีกฝ่ายต้องอับอายขายหน้า ยามที่ต้องพบหน้าคู่ครองเป็นครั้งแรกท่ามกลางสายตาผู้คนมากมายเช่นนี้\n\n\"ยินดีที่ได้พบกันเป็นครั้งแรกเพคะ องค์ชาย\" นางเอ่ยขึ้น\n\nเทเรเซียถึงกับอ้าปากค้างด้วยความประหลาดใจ โดยไม่ใส่ใจสิ่งใด วิลีนาใช้มือทั้งสองข้างยกชายกระโปรงขึ้นเบาๆ แล้วย่อตัวคำนับลงตรงหน้าเขา\n\n\"หม่อมฉันคือพระธิดาของกษัตริย์ไอนน์ โอเวลล์ที่ 2 แห่งการ์เบรา เจ้าหญิงองค์ที่สาม วิลีนา นับจากนี้เป็นต้นไป หวังเป็นอย่างยิ่งว่าพวกเราจะได้ทำความรู้จักคุ้นเคยกันให้ดียิ่งขึ้นเพคะ\"\n\n\"อ่า... ครับ\"\n\nนั่นคือคำแรกที่หลุดออกมาจากปากขององค์ชาย จากนั้นเขาก็เริ่มต้นแนะนำตัวเองด้วยความลังเลและน้ำเสียงอันแผ่วเบา ถ้อยคำของเขาตะกุกตะกักยิ่งกว่าคำทักทายใดๆ ที่วิลีนาเคยได้ยินมาในชีวิต\n\n*ผู้ชายคนนี้น่ะหรือ กำลังจะต้องมาเป็นสามีของข้า?*\n\nนางอุตส่าห์ฝึกฝนรอยยิ้มอย่างหนักหน่วง พยายามเอียงศีรษะเล็กน้อยอย่างประณีตบรรจงเพื่อวันนี้โดยเฉพาะ เพียงเพื่อให้ดูเป็นสตรีที่ 'สงบเสงี่ยมเรียบร้อย' เปลวเพลิงแห่งโทสะพลันปะทุขึ้นภายในหัวใจของวิลีนา\n\nทว่าในอีกด้านหนึ่ง...\n\nประกายแสงแห่งอารมณ์อันเข้มข้นลึกซึ้งก็เริ่มไหวระริกขึ้นในดวงตาที่หลุบต่ำลงเล็กน้อยของนาง\n\n*หากเขาเป็นผู้ชายแบบนี้ล่ะก็... บางที ข้าอาจจะสามารถบงการเขาให้ทำตามใจข้าได้*\n\nหากนางสามารถชักใยบงการองค์รัชทายาทได้ ในที่สุดแล้ว นางก็อาจจะกลายเป็นผู้ชักใยอยู่เบื้องหลังประเทศชาตินี้แต่เพียงผู้เดียว\n\n*มันเป็นอย่างที่เสด็จปู่บอกไว้ไม่มีผิด นี่เองก็คือการสู้รบเช่นกัน การศึกที่ปราศจากการหลั่งเลือด และปราศจากการพรากชีวิตของผู้ใด*\n\nหากสามารถทำให้เขายอมทำตามความปรารถนาของนางได้ มันอาจจะสร้างผลประโยชน์มหาศาลให้แก่มาตุภูมิการ์เบราของนางยิ่งกว่าการที่พวกเขาชนะสงครามเสียด้วยซ้ำ แม้ว่านี่จะห่างไกลจากการสู้รบด้วยเรือเหาะหรือปืนผาหน้าไม้ซึ่งเป็นความเชี่ยวชาญของนาง และนางจำต้องลงสู่สนามรบในดินแดนที่ตนเองถือว่าเป็นจุดอ่อน ทว่าวิลีนาเชื่อมั่นว่า ตราบใดที่นางมีความมุ่งมั่นอันแรงกล้าที่จะคว้าชัยชนะมาให้ได้ นางย่อมต้องค้นพบหนทางอย่างแน่นอน\n\nแม้สิ่งนี้จะเป็นข้อพิสูจน์ว่าวิลีนาไม่ได้ตระหนักรู้ในตัวเองเลยว่า แท้จริงแล้วสิ่งที่นางกำลังจะต้องเข้าต่อสู้คือ 'สมรภูมิรบของสตรี' ไม่ต่างอะไรกับการที่นางแยกแยะความแตกต่างระหว่างสิ่งนี้กับการดวลปืนไม่ออก ทว่าในวินาทีนั้น มีเพียงเปลวเพลิงแห่งความมุ่งมั่นเพียงสิ่งเดียวที่ลุกโชนอย่างดุดันอยู่ภายในกายของนาง\n\nในเวลานั้น เทเรเซียซึ่งอยู่เคียงข้างนางมาตั้งแต่วัยเยาว์ คงเป็นเพียงผู้เดียวที่ตระหนักได้ว่าความหมายที่ซุกซ่อนอยู่เบื้องหลังรอยยิ้มบนใบหน้าของวิลีนาได้แปรเปลี่ยนไปเสียแล้ว โดยไม่ล่วงรู้เลยแม้แต่น้อยว่าสตรีที่จะมาเป็นเจ้าสาวของตนกำลังเก็บซ่อนความคิดอันน่าสะพรึงกลัวเช่นนั้นไว้ภายใน องค์ชายกิลแห่งเมฟิอุสผู้ยังคงเต็มไปด้วยท่าทีตึงเครียด ก็ยังคงพร่ำพูดเรื่องไร้สาระที่ไม่เกี่ยวข้องต่อไป"
    },

      "title": "บทที่ 4.1: ณ หุบเขาเซริน (1)",
      "content": "ในสายตาของไซมอน ร็อดลูม เฟดอมผู้เป็นเจ้าผู้ครองนครรัฐบิรัคไม่ได้แสดงทีท่าว่ามีความคิดแปรพักตร์หรือเปลี่ยนใจแต่ประการใด\n\nแม้ว่าสภาขุนนางจะกลายสภาพเป็นเพียงองค์กรที่มีอยู่แค่ในนาม เนื่องจากการแผ่ขยายอำนาจอันเบ็ดเสร็จของราชวงศ์จักรพรรดิ ทว่าไซมอนก็ยังคงเป็นหนึ่งในขุนนางชั้นสูงระดับแนวหน้า เขาย่อมล่วงรู้ถึงความเคลื่อนไหวของขุนนางคนอื่นๆ อยู่พอสมควร ทราบถึงหลักการและข้อเรียกร้องของพวกเขา ตลอดจนพยายามทำความเข้าใจสถานการณ์รอบด้านของแต่ละคนอยู่เสมอ\n\nและจากการประเมินเชิงลึกของไซมอน เฟดอมจัดเป็นหนึ่งในกลุ่มขั้วตรงข้ามราชวงศ์อย่างชัดเจน\n\nเขาเป็นผู้เกลี้ยกล่อมองค์จักรพรรดิผู้ทรงปรารถนาที่จะทำสงครามกับการ์เบราต่อไป และในฐานะผู้นำของกลุ่มผลักดันการเจรจาสงบศึก เขาก็ได้สั่งสมฐานเสียงและแรงสนับสนุนขึ้นมาภายในราชสำนักจักรพรรดิ แม้ว่าความสามารถในฐานะผู้นำตลอดจนสติปัญญาของเขาจะยังขาดตกบกพร่องอยู่บ้าง ทว่าเขาก็ยังนับว่าดีกว่ากลุ่มขุนนางฉ้อฉลกลุ่มอื่นๆ อยู่มากโข\n\nทว่า เฟดอมผู้นั้นกลับมีพฤติกรรมแปลกประหลาดอย่างยิ่ง ตั้งแต่งานเลี้ยงเมื่อคืนนี้ — ไม่สิ นับตั้งแต่พวกเขาก้าวเท้าออกเดินทางมุ่งหน้าสู่หุบเขาเซรินแล้ว ชายผู้นั้นเอาแต่ตามประกบติดแนบชิดองค์ชายกิลด้วยเหตุผลกลใดไม่ทราบ ไม่ต่างอะไรกับแม่นมที่คอยยื่นจมูกเข้ามายุ่งวุ่นวายเรื่องของคนอื่นไปทั่วทุกหนทุกแห่ง\n\n*หรือว่าเขาตั้งใจจะอบรมสั่งสอนองค์ชาย เพื่อชุบเลี้ยงให้กลายเป็นหุ่นเชิดคอยทำตามใจตนเองกันแน่?*\n\nความคิดนั้นแวบผ่านเข้ามาในสมองของเขา ทว่าการจะมาเริ่มลงมือทำอะไรเช่นนี้ในยามนี้ มันไม่สายเกินไปหน่อยหรือ?\n\nยิ่งไปกว่านั้น เรื่องนี้ยังเกี่ยวข้องกับตัวองค์ชายเองอีกด้วย เท่าที่ไซมอนรู้มา องค์ชายกิลกับเฟดอมแทบจะไม่เคยสนทนากันเลยสักคำเดียว ยามที่องค์ชายออกไปสังสรรค์กับกลุ่มเพื่อนฝูงรุ่นราวคราวเดียวกัน ไซมอนมักจะได้ยินองค์ชายเรียกขานชายผู้นั้นลับหลังอยู่เสมอว่า 'ไอ้หมูตอนจอมบงการ'\n\nแล้วเหตุใดคราวนี้ องค์ชายจึงยอมรับความสนิทสนมอันกะทันหันของเฟดอมอย่างเปิดกว้าง หรือซ้ำร้ายไปกว่านั้น ดูราวกับกำลังพึ่งพาอีกฝ่ายอยู่เสียด้วยซ้ำ?\n\nนอกเหนือจากการหาโอกาสเข้าพบองค์ชายเป็นการส่วนตัวเพื่อตรวจสอบความจริงแล้ว ไซมอนยังมีภาระหน้าที่อีกมากมายที่ต้องสะสาง คณะทูตจากดัชชีเอนเดก็รีบเร่งเดินทางมาร่วมแสดงความยินดีด้วยเช่นกัน แม้จะผิดปกติอยู่บ้างที่พวกเขาเพิ่งตัดสินใจส่งคนมาเมื่อเพียงหนึ่งสัปดาห์ก่อนหน้านี้เท่านั้น แต่เดิมทีเคยมีการเจรจาเรื่องการผูกสัมพันธ์ระหว่างเอนเดกับการ์เบราผ่านการสมรสของราชวงศ์เช่นกัน ทว่านั่นก็คงเป็นเพียงหนึ่งในหลายแผนการที่เอนเดและการ์เบราเคยวาดหวังไว้ ไซมอนจึงถูกบีบให้ต้องออกไปต้อนรับพวกเขา\n\nทว่า ณ อีกฟากหนึ่ง\n\n\"ไอ้สารเลวเนรคุณเอ๊ย ออร์บา!\"\n\nนั่นคือเสียงของทาร์คัสที่กำลังพ่นลมหายใจฟึดฟัดและเดินพล่านไปมาทั่วทั้งห้องอย่างหยาบคาย\n\nเมื่อหวนนึกถึงการมาเยือนอันกะทันหันของขุนนางเมฟิอุสอย่างเฟดอม แม้ว่ามันจะเกิดขึ้นอย่างปุบปับเพียงใด เขาก็อดสงสัยไม่ได้ว่าเหตุใดชายผู้นั้นจึงซื้อตัวออร์บาไปโดยไม่คิดจะขอความยินยอมจากเขาก่อนเลยสักคำ\n\n\"คนที่ชุบเลี้ยงมันมาคือข้าต่างหากโว้ย! บัดซบเอ๊ย มันกำลังจะเริ่มทำเงินสร้างรายได้ในฐานะนักดาบมืออาชีพแท้ๆ แต่กลับถูกขุนนางหน้าไหนก็ไม่รู้มาชุบมือเปิบแย่งชิงตัวไปเสียได้...!\"\n\n\"พวกเราเองก็ไม่เข้าใจเหมือนกันขอรับ\"\n\nทาร์คัสได้เรียกตัวชีค โกเวน และกิลเลียม ซึ่งเป็นยอดนักดาบหลักประจำคณะ มารวมตัวกันที่ห้องส่วนตัวภายในหน้าผาหินที่จัดไว้สำหรับทาร์คัสโดยเฉพาะ พวกเขามาอยู่ที่นี่ก็เพราะจำเป็นต้องปรับเปลี่ยนการประกบคู่ประลองอย่างเร่งด่วน เนื่องจากการจากไปอย่างกะทันหันของออร์บา\n\n\"แล้วทำไมจู่ๆ ถึงตัดสินใจดึงตัวออร์บาออกไปกะทันหันแบบนั้นล่ะขอรับ? แม้ว่าเจ้าเด็กนั่นจะเป็นนักดาบฝีมือดี ทว่าเขาก็เป็นถึงหัวหอกคนสำคัญในการประลองเฉลิมฉลองงานมงคลสมรสครั้งนี้นะขอรับ หากท่านขุนนางเพียงแค่ต้องการซื้อตัวออร์บาเพราะเห็นแววความสามารถ ข้าคิดว่าพวกเขาก็ควรจะปล่อยให้มันลงแข่งในศึกนี้ก่อนแท้ๆ\"\n\n\"ข้าเองก็อยากจะรู้เหมือนกันแหละโว้ย ไอ้สวะเอ๊ย!\" ทาร์คัสสบถลั่น \"ต่อให้ถูกขุนนางซื้อตัวไป อย่างน้อยมันก็น่าจะขอสู้ศึกสุดท้ายเป็นของขวัญตอบแทนบุญคุณให้ข้าสักหน่อยแท้ๆ ไอ้ลูกหมาเอ๊ย!\"\n\n\"บางทีอาจเป็นเพราะพวกเราต้องมาเข่นฆ่ากันเองก็ได้นะขอรับ ข้าย่อมยินดีกับชีวิตใหม่ของเขาอยู่แล้ว ทว่าข้ายังไม่คุ้นชินกับความรู้สึกนี้เลย และข้าก็ข้องใจที่เขาจากไปโดยไม่เอ่ยคำลาแม้แต่คำเดียว\"\n\n\"โอ้ กิลเลียม ชายอกสามศอกอย่างเจ้าก็รู้จักเหงาหงอยเป็นเหมือนกันเรอะเวลาที่คนรู้จักจากไปน่ะ?\"\n\n\"หุบปากไปเลยนะ ชีค! ข้าแค่รู้สึกเสียดายที่ยังไม่ได้สะสางบัญชีกับเจ้านั่นต่างหากเล่า!\"\n\n\"เอาเถอะ ในเมื่อเขาไม่อยู่แล้วมันก็ช่วยไม่ได้ พวกเรามาช่วยกันคิดหาการจับคู่ที่ดุเดือดเร้าใจกันดีกว่า\" โกเวนเอ่ยปากขึ้นเพื่อสงบสติอารมณ์ของทุกคน\n\nแน่นอนว่า ตัวเขาเองก็สัมผัสได้ถึงความผิดปกติบางอย่างในช่วงนี้เช่นกัน\n\nเขาไม่มีเวลามากพอที่จะมานั่งสืบหาว่าเกิดอะไรขึ้นกันแน่ เขาจำต้องไปตรวจสอบสภาพความพร้อมของพวกทาสหน้าใหม่ที่ทาร์คัสเพิ่งซื้อเข้ามา และเนื่องจากนี่แตกต่างจากขั้นตอนตามปกติ เขาจึงต้องทบทวนตรวจสอบนักดาบทุกคนทีละคนอย่างละเอียด\n\nทว่า สิ่งที่แอบถ่วงน้ำหนักอยู่ในใจของโกเวนอย่างเงียบเชียบก็คือ ออร์บาผู้เฝ้ารอคอยอนาคตเสมอมาแม้ในยามที่ร่างกายและจิตใจจะถูกทุบตีจนแหลกสลาย บัดนี้กำลังได้ใช้ชีวิตอยู่ในอนาคตที่ตนวาดหวังไว้จริงๆ หรือไม่\n\n***\n\nในขณะที่ผู้คนรอบกายต่างขวักไขว่เคลื่อนไหวอย่างเร่งรีบ อดีตแกลดิเอเตอร์อย่างออร์บากลับดูเหมือนจะมีเวลาว่างเหลือเฟือ ด้วยการถูกปล่อยทิ้งไว้ตามลำพัง การได้รับมอบหมายให้ทำหน้าที่เป็นตัวตายตัวแทนนั้นก็ดีอยู่หรอก ทว่าเขาไม่อาจเอ่ยปากพูดสิ่งใดได้เลย เว้นเสียแต่ว่าเฟดอมจะคอยกระซิบบอกบทข้างหูประหนึ่งการเชิดหุ่นกระบอกพูดได้\n\n*มันช่างประหลาดแท้ๆ...*\n\nพวกขุนนางเหล่านี้คือผู้ที่พรากพี่ชายของเขาไปเป็นทหาร ไม่เพียงแต่ทอดทิ้งหมู่บ้านของพวกเขาให้เผชิญชะตากรรม ทว่าเหนือสิ่งอื่นใด ชนชั้นสูงเหล่านี้กลับหันคมดาบเข้าเข่นฆ่าประชาชนของตนเองและพรากตัวอลิซไป ทำให้เขาต้องตกต่ำลงสู่ชีวิตความเป็นทาสและถูกบังคับให้สวมหน้ากากชิ้นนั้น\n\nอาจเป็นเพราะความพลิกผันของโชคชะตา ทว่ากลับเป็นหนึ่งในบรรดาขุนนางเมฟิอุสเหล่านั้นเองที่จู่ๆ ก็ฉุดดึงออร์บาขึ้นมาจากนรกแห่งทาสดาบ และออกคำสั่งให้เขาสวมบทบาทเป็นตัวแทนของหนึ่งในบุคคลระดับผู้นำแห่งราชวงศ์จักรพรรดิ\n\nการลักขโมย การกรรโชกทรัพย์ และการค้าปืนเถื่อน — การเติบโตขึ้นมาด้วยการประทังชีวิตจากน้ำครำก้นคูเมือง ทำให้เขาอดคิดไม่ได้ว่าตนเองช่างเป็นตัวตลกที่น่าขันสำหรับองค์รัชทายาทเสียจริง แม้ว่าความจริงที่ว่าเขายังคงไม่รู้อยู่ดีว่าวันพรุ่งนี้จะนำพาอะไรมาให้ จะไม่ต่างอะไรกับการเป็นทาสเลยก็ตาม\n\nทว่า — เมื่อได้ก้าวข้ามมาอยู่อีกฟากหนึ่งของท้องถนนที่ฉาบด้วยยางมะตอยสีดำ บางทีในเวลานี้ เขาอาจคาดหวังที่จะได้พบกับจุดแสงสว่าง ใช่แล้ว แสงสว่างเพียงจุดเดียว ในฐานะตัวแทนขององค์ชาย เขาจะมีโอกาสได้เข้าถึงและมีปฏิสัมพันธ์กับบุคคลระดับแนวหน้า แน่นอนว่านอกเหนือจากตัวเฟดอมแล้ว และมันคงไม่แปลกเลยหากเขาจะได้พบกับผู้ที่เผาทำลายหมู่บ้านของเขาจนวอดวาย — แม่ทัพอุบารี — ในหมู่คนเหล่านั้น\n\nแม้ว่าในตอนนั้นออร์บาจะถูกทุบตีเข้าที่ศีรษะและได้เห็นหน้าอีกฝ่ายเพียงชั่วครู่ด้วยสายตาที่พร่าเลือน ทว่าตลอดสองปีเต็มในฐานะทาสดาบ เขาไม่เคยลืมเลือนใบหน้านั้นเลยแม้แต่วันเดียว แม้กระทั่งในยามนี้ ภาพนั้นก็ยังคงแจ่มชัดอยู่ในห้วงคำนึง\n\n\"ท่านกิล\"\n\n*หากพวกเราได้พบกันอีกครั้ง...*\n\n*ข้าควรจะทำอย่างไรกับมันดีนะ?*\n\nเด็กหนุ่มนักดาบผู้ได้รับการปลดเปลื้องหน้ากากออกจมดิ่งลงสู่ห้วงความคิดอันไร้ที่สิ้นสุด เขาจะคิดค้นหาวิธีการมอบความตายอันน่าเวทนาและทุกข์ทรมานที่สุดเท่าที่จะสามารถจินตนาการได้ในโลกใบนี้ให้แก่มัน ยิ่งไปกว่านั้น หากเขาสามารถเข้าถึงตัวอุบารีได้ เขาก็จะสามารถสืบย้อนรอยกลับไปยังช่วงเวลาที่เขาต้องพลัดพรากจากอลิซและท่านแม่ได้ และแม้ว่าตัวเขาเองจะไม่ได้ตั้งความหวังไว้สูงส่งนัก — เพราะเขาไม่อาจเฝ้าขอพรถึงสิ่งที่เป็นไปไม่ได้ซ้ำแล้วซ้ำเล่าและหวังพึ่งปาฏิหาริย์ได้ — ทว่าหากเขาได้พบกับผู้คนที่ถูกอุบารีเกณฑ์ไปเป็นทหาร พวกเขาอาจจะล่วงรู้ร่องรอยเกี่ยวกับที่อยู่ของพี่ชายโรอันบ้างก็เป็นได้\n\n\"ท่านกิล องค์ชายพ่ะย่ะค่ะ องค์ชายกิล!\"\n\n\"เอ๊ะ?\"\n\nเมื่อถูกเรียกขานด้วยน้ำเสียงอันหนักแน่นจริงจัง ออร์บาจึงเหลียวมองไปด้านข้าง\n\nเจ้าหญิงวิลีนากำลังประทับนั่งอยู่ในระยะห่างที่ไม่ไกลจากเขานัก นางประทับอยู่เบื้องหน้าแท่นบูชา ณ จุดที่ลึกที่สุดของหุบเขา ทอดสายตามองออกไปทั่วบริเวณ มีเพียงวิลีนากับออร์บาเท่านั้นที่นั่งอยู่บนเก้าอี้ โดยมีกองทหารองครักษ์ผู้กำยำล้อมรอบอารักขาอย่างแน่นหนา ขณะที่เบื้องหน้าแท่นบูชา เหล่านักบวชกำลังขับขานบทสวดสรรเสริญและอวยพร\n\n\"พระองค์กำลังทรงครุ่นคิดสิ่งใดอยู่หรือเพคะ?\"\n\n\"เปล่านี่\" ออร์บาตอบห้วนสั้น\n\nเนื่องจากเฟดอมไม่สามารถมายืนอยู่เคียงข้างเขาได้ในระหว่างพิธีกรรม ชายผู้นั้นจึงสั่งกำชับไว้ว่า 'ห้ามพูดอะไรทั้งนั้น' ในระหว่างนี้ เขาจึงหันหน้ากลับไปข้างหน้า แสร้งทำเป็นจดจ่ออยู่กับพิธีกรรม\n\n\"โกหกเพคะ\" วิลีนาฟันธงกลับมาด้วยน้ำเสียงห้วนสั้นไม่แพ้กัน\n\n*อะไรนะ...? โกหกงั้นเรอะ?*\n\nจังหวะเวลาช่างพอดิบพอดีเสียจนออร์บาไม่อาจมองข้ามไปได้ เขาจึงเหลือบสายตาไปมองเจ้าหญิงแห่งอาณาจักรการ์เบราอีกครั้ง\n\nวันนี้นางสวมชุดกระโปรงอีกชุดหนึ่งซึ่งแตกต่างจากชุดในงานเลี้ยงเมื่อคืนนี้ บนศีรษะประดับด้วยรัดเกล้าเทียร่าขนาดเล็กแบบไม่เป็นทางการ เมื่อได้มองดูใกล้ๆ เช่นนี้ มันกลับสร้างความประหลาดใจให้แก่เขา แม้ว่าในตอนแรกที่ได้พบกันต่อหน้านางจะดูเหมือนเด็กหญิงตัวเล็กๆ ทว่ายามที่นางหันหน้าไปด้านข้างด้วยสีหน้าเคร่งขรึมจริงจังในบางครั้ง นางกลับดูเป็นผู้ใหญ่อย่างน่าทึ่ง\n\nเขาอดสงสัยไม่ได้ว่าเป็นเพราะเค้าโครงหน้าอันคมชัดหมดจดของนางหรือไม่ แม้ออร์บาจะคิดว่าใบหน้าของนางดูละม้ายคล้ายตุ๊กตาก็ตามที ในเวลานี้ ยกเว้นเรื่องชาติกำเนิดที่แตกต่างกันแล้ว นางกลับดูเหมือนกับออร์บาแทบจะทุกกระเบียดนิ้ว เคลื่อนไหวเมื่อมีคนสั่งให้เคลื่อนไหว และเอื้อนเอ่ยเมื่อมีคนสั่งให้เอ่ยปากเท่านั้น\n\nแท้จริงแล้ว เมื่อลองตรองดู นี่คือสิ่งที่งานวิวาห์ครั้งนี้เป็นมิใช่หรือ แม้ว่านางจะเพิ่งมีอายุได้เพียงสิบสี่ปี ทว่าตรงกันข้ามกับความปรารถนาที่แท้จริง นางจำต้องมาเป็นภรรยาของชายที่เพิ่งจะพบหน้ากันเป็นครั้งแรกเมื่อวานนี้ ซ้ำร้ายยังเป็นคนจากประเทศคู่อาฆาตในอดีตอีกด้วย แม้ว่าเขาจะไม่อาจทำใจให้รู้สึกเห็นอกเห็นใจคนที่เกิดมาในราชวงศ์สูงส่งเช่นนางได้ ทว่าดูเหมือนนางเองก็คงต้องแบกรับความทุกข์ยากนานาประการไว้เช่นกัน\n\n*ถ้าอย่างนั้น ทุกคนก็คงไม่ต่างกันเท่าไหร่สินะ*\n\nจู่ๆ เขาก็หวนนึกถึงสุ้มเสียงนั้นขึ้นมาได้\n\n— *ไม่มีใครรู้หรอกว่าตัวเองจะเติบโตขึ้นมาเป็นคนแบบไหน ทุกคนต่างโหยหาโลกที่ตนไม่เคยรู้จัก และเฝ้าตามหาความหมายของการมีชีวิตอยู่สำหรับสิ่งที่ตนได้ถือกำเนิดขึ้นมา — ต่อให้คนคนนั้นจะเป็นนักบวช หรือเชื้อพระวงศ์ก็ตามที*\n\nมันเป็นอย่างที่พี่โรอันเคยพูดไว้ไม่มีผิด ออร์บาครางในใจอย่างแผ่วเบา\n\n\"พระองค์กำลังใจลอยจริงๆ ด้วยสินะเพคะ\"\n\nเมื่อนางเอ่ยทักขึ้นมาอีกครั้งโดยไม่มีปี่มีขลุ่ย ออร์บาจึงตอบกลับไปอย่างไม่เกรงใจว่า\n\n\"แล้วมันทำไมล่ะ?\"\n\nวิลีนาหัวเราะคิกคัก\n\n\"เมื่อครู่นี้ หม่อมฉันยังคิดอยู่เลยว่าในบางครั้งพระองค์มีแววตาน่ากลัวเหลือเกิน ทว่าบัดนี้พระองค์กลับแย้มยิ้มราวกับกำลังนึกถึงเรื่องที่น่ายินดีบางอย่าง โปรดบอกหม่อมฉันเถิดเพคะ พระองค์ผู้กำลังจะมาเป็นสามีของหม่อมฉัน — มีสิ่งใดที่รบกวนจิตใจพระองค์ในวันที่อากาศแจ่มใสเช่นนี้ และเรื่องอันใดกันที่ทำให้พระองค์อดที่จะหวนรำลึกถึงไม่ได้?\"\n\nพิธีกรรมยังคงดำเนินต่อไป พวกเขาได้นำมังกรที่เพิ่งถูกสังหารไปเมื่อช่วงเช้ามาย่างไฟ และในขณะที่โปรยกระดูกมังกรไปทั่วผืนดินเบื้องล่างของหุบเขา เหล่านักบวชก็ขับขานบทสวดอ้อนวอน พวกเขาส่งเสียงเพรียกหาร่างวิญญาณของมังกรโบราณที่เคยปกครองดาวเคราะห์ดวงนี้ในอดีต เพื่อขอให้ช่วยปกปักรักษาความเจริญรุ่งเรืองของบ้านเมือง\n\n\"เป็นไปได้ไหมเพคะว่า หากเหล่าริวจินหวนกลับมา พวกเขาอาจจะไม่เต็มใจมอบพรแก่สถานที่แห่งนี้ก็เป็นได้?\"\n\nย้อนกลับไปในยุคสมัยที่มนุษยชาติเพิ่งก้าวเท้าลงสู่ดาวเคราะห์ดวงนี้ เหล่ามังกรเอาแต่วิ่งเพ่นพ่านไปตามท้องทุ่งและไม่คิดสิ่งใดนอกจากการหาอาหารประทังกระเพาะ หรือพูดง่ายๆ ก็คือพวกมันได้เสื่อมถอยลงไปอยู่ในระดับเดียวกับสัตว์เดรัจฉาน\n\nทว่า มนุษย์ได้ขุดค้นพบซากอารยธรรมนครขนาดมหึมาและโบราณวัตถุที่ไม่ทราบวัตถุประสงค์การใช้งานกระจายอยู่ทั่วทุกมุมโลก และดูเหมือนจะมีร่องรอยของอารยธรรมเวทมนตร์โบราณที่อาจเคยใช้อีเธอร์ในรูปแบบใดรูปแบบหนึ่ง มนุษยชาติสามารถควบคุม 'เวทมนตร์' แรกของพวกเขา นั่นคือโซเดียส ได้ในเวลาต่อมา และพรแห่งปัญญานี้เล่าขานกันว่าล้วนได้รับมาจากซากโบราณสถานของมังกรเหล่านี้ทั้งสิ้น เชื่อกันว่ามังกรโบราณคือกลุ่มสิ่งมีชีวิตทรงภูมิปัญญาที่เคยปกครองดาวเคราะห์ดวงนี้เมื่อหลายพันปีก่อนหน้าที่มนุษย์จะเดินทางมาถึงในท้ายที่สุด\n\nธรรมเนียมในการเรียกขานมังกรโบราณเหล่านั้นว่า 'เทพมังกร' หรือ 'ริวจิน' เป็นเอกลักษณ์เฉพาะของชาวเมฟิอุส และเคยมีช่วงเวลาที่สิ่งนี้กลายเป็นความเชื่อทางศาสนาของคนทั้งประเทศ แม้ว่าในยามนี้มันจะหลงเหลือเป็นเพียงเงาของอดีต ทว่าสำหรับพิธีกรรมสำคัญเช่นนี้ นักบวชผู้ทำหน้าที่ประกอบพิธีจะได้รับการคัดเลือกและอัญเชิญมาจากชนเผ่าเร่ร่อนที่อาศัยอยู่แถบชายแดนเมฟิอุส ซึ่งเป็นรากเหง้าดั้งเดิมของลัทธิความเชื่อแห่งริวจิน\n\n\"ข้าบอกแล้วไงว่าไม่มีอะไร\"\n\nออร์บาตัดบทสนทนาลงสั้นๆ อีกครั้ง\n\nเขาเคยได้รับคำอธิบายคร่าวๆ จากดินน์เกี่ยวกับประวัติศาสตร์ของลัทธิริวจินมาบ้าง ทว่าแน่นอนว่าเขาไม่ได้มีความรู้สึกผูกพันลึกซึ้งกับมันเลย ดังนั้น เขาจึงไม่อาจบอกได้ว่าวิลีนากำลังพูดล้อเล่นหรือจริงจังกันแน่\n\n*หากความสัมพันธ์ระหว่างองค์ชายตัวจริงกับยัยเด็กนี่เกิดบาดหมางกระอักกระอ่วนขึ้นมาทีหลังล่ะก็ ข้าไม่ขอรับผิดชอบด้วยหรอกนะ ท่านเฟดอม*\n\nในอีกด้านหนึ่ง วิลีนาลอบถอนหายใจยาว พลางจมดิ่งลงสู่ความคิดของตนเอง สำหรับการ์เบรา การที่มังกรเคยมีอารยธรรมทัดเทียมหรือเหนือกว่ามนุษย์ในอดีตนั้นถูกมองว่าเป็นเพียงตำนาน 'เทพมังกร' เพ้อฝันเท่านั้น ดังนั้นนางจึงไม่อาจสัมผัสได้ถึงความศักดิ์สิทธิ์ของพิธีกรรมนี้ได้เลย และแม้ว่านางจะเริ่มรู้สึกเบื่อหน่ายอย่างยิ่งยวด ทว่าเมื่อชำเลืองมองไปยังบุรุษที่นั่งเคียงข้าง องค์ชายกิล — ผู้ที่จะต้องกลายมาเป็นสามีของนางเมื่อพิธีนี้สิ้นสุดลง — นางก็อดไม่ได้ที่จะเสียสมาธิ ดังนั้น เพื่อขับไล่ความเบื่อหน่าย นางจึงพยายามแหย่เย้าเขาเล่นสักเล็กน้อย ทว่าดูเหมือนเขาจะเผย 'ธาตุแท้' ออกมา เพราะแม้ว่านางจะพยายามทำตัวเป็นสุภาพสตรีอย่างสุดความสามารถ แต่องค์ชายกลับตอบกลับมาอย่างทื่อมะลื่อไร้ความนุ่มนวลอย่างแท้จริง ไม่เพียงแค่นั้น วาจาตัดบทห้วนสั้นของเขายังกวนประสาทนางอย่างยิ่ง\n\nนางสงสัยว่าอาจเป็นเพราะเขารู้สึกขัดเขินประหม่าหรือไม่ ในงานเลี้ยงเมื่อคืนนี้ นางก็ไม่เห็นว่าเขาจะมีพฤติกรรมแสดงความรังเกียจผู้หญิงแต่อย่างใด ทว่าเมื่อคิดว่าเขาอาจมีส่วนคล้ายกับริวคอวน์อยู่บ้าง วิลีนาก็รู้สึกขุ่นเคืองตัวเองขึ้นมาทันที ไม่มีทางที่แม่ทัพผู้ห้าวหาญที่สุดแห่งการ์เบราจะไปเหมือนกับคนที่ถูกเล่าลือกันในเมฟิอุสว่าเป็นพวก 'ปัญญาทึบ' อย่างแน่นอน\n\n*อย่างไรเสีย นี่ก็เหมือนกับการทำสงคราม เพื่อหลอกล่อศัตรู ข้าต้องรักษาจังหวะก้าวในสถานที่แห่งนี้ต่อไป*\n\nวิลียังคงรักษารอยยิ้มไว้ แสร้งทำเป็นไม่ถือสาหาความ มันคงจะดีที่สุดหากองค์ชายตกหลุมรักนางอย่างหัวปักหัวปำ ทว่านางก็ไม่รู้ว่ามันจะได้ผลหรือไม่หากเขามีความสัมพันธ์ลึกซึ้งกับหญิงอื่นอยู่แล้ว ถึงกระนั้น ตราบใดที่นางยังคงรอยยิ้มไว้ มันก็คงไม่มีปัญหาอะไร\n\n*เสด็จปู่เองก็เคยบอกว่าท่านรักรอยยิ้มของข้าเหนือสิ่งอื่นใด ถ้าอย่างนั้น ข้าก็คงไม่ได้ทำอะไรผิดพลาดหรอก*\n\nในไม่ช้า คำสวดอันน่าเบื่อหน่ายของเหล่านักบวชก็จบสิ้นลง และแล้ว ศึกประลองของเหล่าทาสดาบก็เริ่มต้นขึ้นเสียที\n\nเล่าขานกันว่ามันเป็นส่วนหนึ่งของพิธีกรรม ที่เมื่อเถ้ากระดูกมังกรถูกโปรยลงสู่ผืนดิน เลือดเนื้อของมนุษย์จะต้องถูกสังเวยตามลงไป กระนั้น สิ่งที่เกิดขึ้นก็แทบไม่แตกต่างอะไรกับการต่อสู้ของแกลดิเอเตอร์ตามปกติเลย ความแตกต่างเพียงอย่างเดียวคือคำกล่าวเปิดพิธีที่เป็นทางการมากกว่าปกติเล็กน้อย สังเวียนประลองเป็นเพียงลานดินราบเรียบที่ก้นหุบเขา มีเพียงเสาไม้ไม่กี่ต้นปักลงบนผืนดิน ซึ่งเรียบง่ายยิ่งกว่าสังเวียนทั่วไปเสียอีก\n\nณ ที่แห่งนั้น เหล่านักสู้แกลดิเอเตอร์ยืนเรียงแถวกันอยู่ทางฝั่งทิศตะวันออกและทิศตะวันตก ออร์บาสายตามองเห็นทาร์คัส โกเวน และใบหน้าของคนคุ้นเคยอีกมากมาย และรอยยิ้มแบบเด็กหนุ่มที่หาได้ยากยิ่งก็พลันผุดพรายขึ้นบนใบหน้าของเขา\n\n*พวกนั้นคงไม่มีทางจินตนาการออกแน่ๆ ว่าข้ากำลังนั่งอยู่ที่นี่*\n\nแม้ว่าทาร์คัสคงจะเดือดดาลเป็นฟืนเป็นไฟที่จู่ๆ เขาก็หายตัวไปกะทันหัน ทว่าก็เพราะมันเกิดขึ้นเร็วขนาดนั้น อีกฝ่ายจึงไม่มีทางนึกฝันเลยว่าเขาจะกำลังนั่งมองลงมาจากที่นั่งอันสูงส่งเช่นนี้\n\nในทางกลับกัน วิลีนาแม้จะได้รับการบอกเล่าเรื่องนี้ล่วงหน้ามาแล้ว ทว่านางกลับเฝ้ามองดูด้วยความคิดอันหดหู่ใจที่เหล่าทาสจะต้องมาเข่นฆ่ากันเองหลังจากนี้ ในการ์เบราไม่มีระบบทาส ซึ่งนั่นคือเหตุผลหลักที่พวกเขามักจะก่นด่าเมฟิอุสว่าเป็นดินแดนของพวกคนเถื่อนไร้อารยะ\n\n*ไม่พอใจกับสงครามหรืออย่างไร ถึงได้จงใจจัดฉากแสดงการกดขี่ทาสและบังคับให้พวกเขาฆ่ากันเองเช่นนี้?*\n\nเมื่อการทำนายเสร็จสิ้นลง นักสู้กลุ่มแรกก็ก้าวออกมาข้างหน้า ท่วงท่าการเคลื่อนไหวของแกลดิเอเตอร์ดูจะเก้งก้างอยู่บ้าง ทว่าบางทีอาจเป็นเพราะสภาพแวดล้อมที่ไม่คุ้นเคย จนกระทั่งยกแรกจบสิ้นลง นั่นคือเมื่อผู้แพ้กลายสภาพเป็นศพนอนแผ่หลาอยู่บนพื้นดิน\n\nในการ์เบราและเอนเด ซึ่งมีกฎหมายควบคุมกิจการค้าทาสในอุตสาหกรรมบันเทิงอย่างเข้มงวด ผู้คนจึงไม่มีโอกาสได้ชมการต่อสู้ของแกลดิเอเตอร์ ดังนั้น แม้ว่าในตอนแรกเหล่าคณะทูตจะมีอคติ และแม้จะดูเหมือนว่าพวกเขาอาจจะตื่นตกใจยามที่เสียงดาบปะทะกันดังกึกก้อง ทว่าไม่นานนัก พวกเขากลับเริ่มโน้มตัวข้ามขอบอัฒจันทร์ กำหมัดแน่น และร่วมส่งเสียงโห่ร้องเชียร์ไปพร้อมกับผู้คนของเมฟิอุส พร้อมกับเริ่มปรบมือให้อย่างกึกก้อง\n\nวิลีนาเริ่มรู้สึกเอียนและสะอิดสะเอียนในไม่ช้า จากนั้น เมื่อนึกถึงคู่หมายของตน นางจึงชำเลืองมองไปด้านข้างอีกครั้ง และเมื่อได้เห็นรอยยิ้มกว้างที่ผุดขึ้นบนใบหน้าของเขา วิลีนาก็รู้สึกถึงความผิดหวังอย่างรุนแรงที่ปะทุขึ้นมาใหม่ ไม่ว่าจะมองอย่างไร เขาก็กำลังเพลิดเพลินกับการได้เห็นคนเข่นฆ่ากันเองจากก้นบึ้งของหัวใจอย่างชัดเจน นางเคยคาดเดาไว้ว่าเขาอาจจะชอบเรื่องพรรค์นี้ ทว่าไม่นึกเลยว่าจะถึงขนาดนี้\n\nในทันใดนั้น นางไม่อาจสะกดกลั้นความรู้สึกของตนเองได้อีกต่อไป ความรู้สึกดูแคลนที่มีต่อคู่หมายได้แปรเปลี่ยนเป็นความรังเกียจเดียดฉันท์ทางอารมณ์อย่างรุนแรง มันเกิดขึ้นอย่างกะทันหันเสียจนแม้แต่ตัวนางเองยังรู้สึกสับสน นางได้รับการตอกย้ำอีกครั้งว่าตนเองต้องพยายามสะกดกลั้นอารมณ์มาโดยตลอดจนถึงบัดนี้ แม้ว่านางจะเป็นเจ้าหญิงแห่งอาณาจักรผู้เคยลั่นวาจาว่าจะให้ความสำคัญแก่ประเทศชาติก่อนตนเอง ทว่านางก็มีอายุเพียงสิบสี่ปีเท่านั้น\n\n*ไม่ได้นะ ไม่ได้เด็ดขาด!*\n\nวิลีนากำหมัดแน่นอยู่บนตักของตน\n\n*นี่เองก็คือการสู้รบเช่นกัน นี่คือบททดสอบนะ วิลีนา แผ่นหลังของข้าถูกผลักดันให้ก้าวไปข้างหน้าแล้ว ข้าจะปล่อยให้จิตวิญญาณของตนเองอ่อนแอเช่นนี้ไม่ได้เด็ดขาด*\n\nชีคก้าวออกมาข้างหน้าสังเวียน เสียงเชียร์กึกก้องพุ่งเป้าไปยังแกลดิเอเตอร์ผู้มีเอกลักษณ์โดดเด่นผู้นี้ ด้วยใบหน้าที่ทาแป้งขาวซีดอันเสื่อมทราม ทว่าเมื่อมองดูคู่ต่อสู้ของเขา... ออร์บากลับเลิกคิ้วขึ้น\n\n*หมอนั่นมัน...*\n\nด้วยเหตุผลกลใดไม่ทราบ คู่ต่อสู้กลับเป็นหนึ่งในทาสหน้าใหม่ที่ทาร์คัสเพิ่งซื้อเข้ามาในช่วงที่กำลังอารมณ์ดี หากคำนึงถึงฝีมือดาบของชีคแล้ว มันเห็นได้ชัดเจนเลยว่าคู่ต่อสู้คนนี้ไม่คู่ควรกันเลยสักนิด แม้ว่ามันอาจจะช่วยสร้างสีสันให้การต่อสู้ได้ ทว่าทาร์คัสจับคู่ได้แย่สิ้นดี ศึกนี้คงจบลงในพริบตาเดียวแน่\n\nชีคตั้งท่าด้วยดาบคู่ประจำตัว ดาบทั้งสองเล่มเป็นดาบคมเดียวความยาวปานกลาง ส่วนทาสหน้าใหม่ยืนประจันหน้าอยู่อีกฟากหนึ่งด้วยท่าทางประหม่า ศึกนี้คงจะจบลงภายในชั่วพริบตา — หรืออย่างน้อย นั่นคือสิ่งที่ออร์บาคิดในตอนนั้น\n\nทว่าในจังหวะที่เขากำลังคิดเช่นนั้น เขากลับได้ยินเสียงดังกัมปนาทสะเทือนเลื่อนลั่นแผ่ผ่านผืนดิน ซึ่งทำให้พื้นดินใต้ฝ่าเท้าของเขาสั่นสะท้านอย่างรุนแรง ในช่วงเวลาสั้นๆ นั้น กลุ่มควันฝุ่นหนาทึบก็พวยพุ่งตลบอบอวลขึ้นมาจากอีกฟากหนึ่งของลานประลอง\n\nเหล่าทหารที่แหงนหน้ามองไปยังกลุ่มควันฝุ่น ไม่ว่าสิ่งนั้นจะเป็นอะไรก็ตาม ต่างกลายเป็นเหยื่อกลุ่มแรกที่ต้องสังเวยชีวิต แม้ว่าพวกเขาจะมารวมตัวกันรอบสังเวียนพร้อมถือหอกและปืน ทว่าพวกเขาก็ไม่ได้คาดคิดถึงเหตุการณ์อันกะทันหันเช่นนี้มาก่อน และถูกขาหน้าของมังกรเหยียบย่ำจนร่างแหลกเหลวสิ้นชีพในทันที ทันทีที่ลิ่มเลือดสาดกระเซ็นย้อมผืนดินจนแดงฉาน มังกรเกล็ดหนาที่เปรอะเปื้อนไปด้วยเมือกเปียกลื่นตามลำตัวก็โผล่พรวดออกมาจากม่านฝุ่น ร่างมหึมาอันหนักหน่วงก้าวตะบึงไปข้างหน้า\n\nมันคือมังกรขนาดใหญ่ โซซอส! โซ่ตรวนควรจะต้องล่ามไว้ที่เท้าของมัน และตามปกติมันควรจะถูกขังอยู่ในกรง ทว่าในยามนี้ มังกรตัวนั้นกลับกลายเป็นสิ่งมีชีวิตที่หลุดพ้นจากพันธนาการ และยิ่งไปกว่านั้น พวกมันยังโผล่ตามกันออกมาอีกหลายตัวพร้อมกัน\n\n\"ว-หวาาา!!\"\n\nทหารนายหนึ่งที่ตกตะลึงกับความตายของเพื่อนร่วมรบเหนี่ยวไกปืนที่เตรียมพร้อมไว้ ทันทีที่เขาลดปืนลง กรงเล็บอันแหลมคมที่มีขนาดใหญ่กว่าความสูงของเขาราวสามเท่าก็ตวัดฟาดลงบนร่างของเขา และเขาก็แหลกเหลวกลายเป็นเศษเนื้อกระจายเกลื่อนบนพื้นดินในทันใด จากนั้นทหารนายอื่นๆ ที่อยู่ใกล้เคียงก็กรีดร้องเสียงหลงราวกับสตรี ทิ้งปืนในมือแล้วเริ่มวิ่งหนีเตลิด เสียงหวีดร้องและเสียงตะโกนเริ่มดังกึกก้องไม่ต่างจากเสียงแผ่นดินไหว\n\n\"ก-เกิดอะไรขึ้น เกิดอะไรขึ้นกันแน่!?\"\n\n\"ทำไมพวกมังกรถึงได้คลุ้มคลั่งอาละวาดแบบนี้!?\"\n\nผู้คนจำนวนมหาศาลเริ่มตะโกนโหวกเหวกใส่กันอยู่ใต้เต็นท์ปะรำพิธี ฝูงมังกรที่ควรจะถูกนำมาใช้โดยเหล่าแกลดิเอเตอร์ได้พังกรงขังออกมาและกำลังคลุ้มคลั่งอาละวาดไปทั่ว มีบางคนที่คว้าดาบและปืนวิ่งมุ่งหน้าไปหากองกำลังรักษาการณ์ บางคนวิ่งหนีสุดชีวิตเท่าที่ฝ่าเท้าจะพาไปได้ และบางคนก็คอยตะโกนสั่งการผู้ใต้บังคับบัญชา — สับสนปนเปไปกับผู้คนอีกมากมาย\n\nออร์บาลุกพรวดขึ้นจากเก้าอี้ ชั่วขณะหนึ่งเขาไม่อาจมองเห็นร่างของชีคภายใต้ม่านหมอกฝุ่นหนาทึบได้ จากนั้นแกลดิเอเตอร์คนหนึ่งซึ่งควรจะเป็นคิวต่อไปที่จะลงแข่ง ก็ถูกมังกรไบอันเตะเข้าอย่างจังจนร่างกระเด็น และอีกคนหนึ่งซึ่งเป็นคนจากคณะทาร์คัสที่พยายามจะพุ่งเข้าไปแทงใต้ท้องของมันอย่างบ้าบิ่น ก็ถูกมังกรโซซอสเหยียบย่ำจนจมดิน\n\nและแล้ว สายตาของเขาก็เหลือบไปเห็นเงาร่างเล็กๆ ร่างหนึ่งท่ามกลางฝูงมังกรเหล่านั้น นั่นคือโฮวหลาน นางคงกำลังวิ่งวุ่นทั้งน้ำตาเพื่อพยายามหยุดยั้งฝูงมังกร มีหลายครั้งที่นางเกือบจะถูกขาของมังกรเตะเหวี่ยงจนแทบเอาชีวิตไม่รอด\n\n*ส่งปืนมาให้ข้าสิ!*\n\nออร์บาแทบจะตะโกนถ้อยคำเหล่านั้นออกมาและเกือบจะพุ่งเข้าไปแย่งปืนไรเฟิลมาจากมือของทหารองครักษ์คนหนึ่ง ทว่าการกระทำของเขาต้องชะงักลงครึ่งๆ กลางๆ เมื่อจู่ๆ เขาก็รู้สึกถึงความเจ็บปวดแปลบอันแหลมคมตรงจุดหนึ่งบนหน้าผากของตนเอง\n\n\"อ๊ะ!\"\n\nด้วยสัญชาตญาณชี้นำหาใช่ด้วยเหตุผล ออร์บารีบมุดร่างหลบซ่อนตัวอยู่ใต้โต๊ะอย่างรวดเร็ว มีบางสิ่งกำลังพุ่งแหวกอากาศอยู่เหนือศีรษะ บนท้องฟ้าอันสูงลิบลิ่ว ด้วยความเร็วสูงยิ่งยวด ใครบางคนที่มีเจตนาฆ่าอันแรงกล้า และเมื่อมันก่อตัวเป็นรูปธรรม เขาก็สัมผัสได้ว่ามันกำลังเล็งเป้าลงมายังพื้นดิน\n\n*มือปืนซุ่มยิง!*\n\nผสมปนเปไปกับเสียงฝีเท้าของมังกร เสียงกรีดร้องหวาดผวาของผู้คน และเสียงตวาดเกรี้ยวกราด มีเสียงลั่นไกของปืนไรเฟิลนัดหนึ่งดังสนั่นกึกก้องจนแก้วหูของเขาสั่นสะท้านอย่างมิต้องสงสัย!"
    }
  ],

  "glossary": "# คัมภีร์ตัวละคร คำศัพท์ และสรรพนาม (Glossary)\n\n## ตัวละคร (Characters)\n| ต้นฉบับ | ชื่อไทยที่ล็อกไว้ | หมายเหตุ / ลักษณะนิสัยและสรรพนาม |\n| :--- | :--- | :--- |\n| Vileena | เจ้าหญิงวิลีนา / องค์หญิงวิลีนา / วิลีนา | พระธิดาองค์ที่สามแห่งอาณาจักรการ์เบรา พระชันษา 14 ปี มีพระเกศาสีแพลทินัมยาว รูปร่างกำลังเติบโตเป็นสาว นิสัยแก่นแก้ว ห้าวหาญ รักประเทศและประชาชน เชี่ยวชาญการขับเรือเหาะ กำลังจะต้องอภิเษกสมรสทางการเมืองไปยังจักรวรรดิเมฟิอุสในสัปดาห์หน้า (พูดกับจอร์จ: เรียกตัวเองว่า `หลาน` หรือ `วิลีนา`, เรียกจอร์จว่า `เสด็จปู่`) |\n| Theresia | เทเรเซีย | หัวหน้านางกำนัลประจำตัวเจ้าหญิงวิลีนา เป็นคนคอยดูแลใกล้ชิดและจะติดตามเจ้าหญิงไปยังเมฟิอุสด้วย |\n| Jeorg Owell | จอร์จ โอเวลล์ | อดีตกษัตริย์แห่งอาณาจักรการ์เบรา เสด็จปู่ของวิลีนา ในวัยหนุ่มเก่งกาจกล้าหาญ ปราบปรามตระกูลท้องถิ่นจนรวมชาติได้สำเร็จ ปัจจุบันชราภาพและล้มป่วยติดเตียงนับตั้งแต่ฤดูหนาว (พูดกับวิลีนา: เรียกตัวเองว่า `ปู่`, เรียกวิลีนาว่า `เจ้า` หรือ `วิลีนา`) |\n| Ainn Owell II | กษัตริย์ไอนน์ โอเวลล์ที่ 2 | กษัตริย์แห่งการ์เบรา พระบิดาของเจ้าหญิงวิลีนา นิสัยไม่เด็ดเดี่ยวหรือห้าวหาญเท่ากูล เมฟิอุส ยอมก้มหัวขอร้องให้วิลีนาแต่งงานเพื่อความสงบสุขของชาติ |\n| Ryucown | ริวคอวน์ | แม่ทัพหนุ่มผู้บังคับการเรือบรรทุกอากาศยานแห่งการ์เบรา วีรบุรุษสงครามผู้สร้างผลงานโดดเด่น อดีตคู่หมั้นของวิลีนาที่เคยหมั้นหมายกันสมัยสงคราม แท้จริงเป็นคนขี้อายและเงียบขรึมต่อหน้าสตรี |\n| Head of the western palace guard | หัวหน้าองครักษ์ตำหนักตะวันตก / ผู้บังคับกอง | ผู้บังคับบัญชากององครักษ์ตำหนักตะวันตก |\n| Commander of the air defence force | ผู้บัญชาการกองกำลังป้องกันน่านฟ้า | นายทหารวัยสี่สิบกลางๆ มีบุตรสาวอายุ 14 ปีเท่ากับเจ้าหญิงวิลีนา |\n| Wallace | เสนาบดีคลัง วอลเลซ | รัฐมนตรี/เสนาบดีฝ่ายการคลัง ชอบม้าตัวโปรดของจอร์จ โอเวลล์ มีชื่อเสียงเรื่องคลังสุราและรสนิยมเรื่องสตรี |\n| Chamberlain's daughter | บุตรสาวของท่านเจ้ากรมวัง | หญิงงามวัย 30 ปีที่กลับมาอยู่กับบิดา และทำงานอยู่ที่คฤหาสน์ของวอลเลซ |\n| Orba (Iron Tiger Orba) | ออร์บา (พยัคฆ์เหล็ก ออร์บา) | นักสู้แกลดิเอเตอร์ร่างผอมเพรียว สวมหน้ากากเหล็กสีน้ำเงินเลียนแบบเสือที่มีเขี้ยวและปลายหูแหลมคล้ายเขา ใช้ดาบยาวธรรมดา เคยฟันหัวบารอนไมเออร์ขาดในสองดาบที่ทีดาน |\n| Ineli | อิเนลี | เด็กสาวผู้เยาว์ที่มีใบหน้างดงามและเย้ายวนเกินวัย นั่งชมการประลองในที่นั่งพิเศษกับพี่ชายที่เป็นผู้สืบทอดดินแดนแห่งเมฟิอุส (เรียกตัวเองว่า `อิเนลี`, เรียกพี่ชายว่า `ท่านพี่`) |\n| Successor of Mephius (\"brother\") | เจ้าชายกิล เมฟิอุส / องค์ชายกิล | ชื่อจริงเปิดเผยในบทที่ 2.2: องค์รัชทายาท/เจ้าชายองค์โตแห่งจักรวรรดิเมฟิอุส พี่ชายต่างมารดาของอิเนลี อายุราว 17 ปี (มากกว่าวิลีนา 3 ปี) ไม่มีดินแดนหรือทหารในปกครองและถูกเสด็จพ่อดูแคลนอยู่เสมอ ใช้ผ้าพันศีรษะแบบศาสนิกชนแห่งบาดีนเพื่อปิดบังใบหน้าตอนไปลานประลอง (พูดกับอิเนลี: `ข้า`/`เจ้า`, พูดกับไซมอน: `ข้า`/`ท่าน`) |\n| Ballchain Verne | เวิร์นลูกตุ้มเหล็ก | นักสู้แกลดิเอเตอร์ชื่อดังแห่งบา รูซ์ วัยสามสิบกลางๆ ผิวคล้ำ ร่างกำยำ ใช้อาวุธลูกตุ้มเหล็กติดโซ่ |\n| Shique | ชีค | นักสู้แกลดิเอเตอร์รูปงาม ขวัญใจสตรี ชอบโค้งคำนับวางมาดเหมือนขุนนาง |\n| Meier the Baron | บารอนไมเออร์ | ผู้ที่ถูกออร์บาสังหารด้วยสองดาบที่ลานประลองแห่งทีดาน |\n| Mysterious man behind the successor | เฟดอม ออลิน (ขุนนางคางหย่อนยาน) | ชื่อจริงเปิดเผยในบทที่ 2.2: ขุนนางร่างอ้วนใหญ่ อายุน้อยกว่าไซมอน คางหย่อนยานชัดเจน เป็นผู้ปกครองป้อมปราการบิรัคและแกนนำเจรจาสงบศึก แอบหยั่งเชิงไซมอนเรื่องต่อต้านเจ้าชายกิลและตกตะลึงที่เห็นออร์บายังมีชีวิตอยู่ |\n| Guhl Mephius (\"Dragonheart Emperor\") | จักรพรรดิกูล เมฟิอุส (\"จักรพรรดิดวงใจมังกร\") | จักรพรรดิแห่งจักรวรรดิเมฟิอุส พระบิดาของกิลและอิเนลี ช่วงปีที่ 6 ของสงครามทรงรวบอำนาจสภาขุนนางมาไว้ที่ราชวงศ์ เป็นผู้ชิงไหวชิงพริบเสนอสงบศึกกับการ์เบราเพื่อตัดหน้าเอนเด แต่มักด่าทอและเยาะเย้ยกิลต่อหน้าขุนนาง |\n| Melissa | พระมเหสีเมลิสซา | พระมเหสีองค์รองของจักรพรรดิกูล และเป็นพระมารดาของเจ้าหญิงอิเนลี |\n| Simon Rodloom | ไซมอน ร็อดลูม | อดีตประธานสภาขุนนางและขุนนางตระกูลร็อดลูม (โอนเมืองป้อมทางตะวันตกให้ขุนนางอื่นแลกกับตำแหน่งประธานสภาเมื่อ 12 ปีก่อน ปัจจุบันไร้ดินแดนและทหาร) คอยทำหน้าที่เป็นเสมือนพี่เลี้ยงและผู้คอยชี้แนะเจ้าชายกิล |\n| Rone Jayce | โรน เจย์ซ | นายทหารกององครักษ์จักรพรรดิ วัยสี่สิบกลางๆ บิดาของเลย์ลา ปกป้องลูกสาวจากสิทธิ์คืนแรกของเจ้าชายกิลจนเกิดการแย่งปืนและปืนลั่น |\n| Layla | เลย์ลา | บุตรสาวคนเดียวของโรน เจย์ซ เจ้าสาวป้ายแดงที่ถูกกิลจะใช้สิทธิ์คืนแรก |\n| Tarkas | ทาร์คัส | เจ้าของคณะนักสู้ทาร์คัส แก้มหย่อนคล้อย ละโมบเงินทอง มักคุมสัญญาแกลดิเอเตอร์อย่างคลุมเครือ |\n| Gowen | โกเวน | ผู้ฝึกสอนและผู้คุมใหญ่ของเหล่าทาสดาบในคณะทาร์คัส วัย 50 กลางๆ ผมสีดอกเลา ร่างกำยำผิวคล้ำแดด เข้มงวดแต่ช่างสังเกตและเอ็นดูออร์บาอยู่ลึกๆ (ออร์บาเรียกว่า `ตาแก่`, โกเวนเรียกออร์บาว่า `แก`/`เจ้า`) |\n| Hou Ran (Ran) | โฮวหลาน (หลาน) | ทาสหญิงผู้ดูแลฝูงมังกร ผิวดำขลับเงางามดุจไม้มะเกลือ ผมสีซีด มาจากชนเผ่าเร่ร่อนผู้บูชาเทพมังกรบนเทือกเขาตะวันตกของเมฟิอุส สามารถได้ยิน \"เสียง\" ของมังกรได้ เคยถูกออร์บาช่วยไว้จึงยอมพูดคุยด้วย |\n| Gilliam | กิลเลียม | ยักษ์ใหญ่อันดับหนึ่งของคณะนักสู้ทาร์คัส ผมยาวสีน้ำตาลแดงยุ่งเหยิง ใช้ขวานศึก เป็นหนึ่งในสามนักสู้ที่แกร่งที่สุดร่วมกับออร์บาและชีค |\n| Kain | ไคน์ | ทาสดาบวัยเดียวกับออร์บา เข้ามาในค่ายกักกันเมื่อ 1 ปีก่อน ชอบตามติดออร์บา ถนัดการใช้ปืนสั้นและปืนไรเฟิลอย่างคล่องแคล่ว |\n| Roan | โรอัน | พี่ชายแท้ๆ ของออร์บา ฉลาดหลักแหลม เรียนรู้การอ่านเขียนและเลขได้ด้วยตนเอง เป็นผู้ช่วยพ่อค้าตั้งแต่อายุ 10 ปี เพื่อหาเลี้ยงครอบครัว ต่อมาถูกเกณฑ์ไปประจำการที่ป้อมอัปตาและส่งดาบสั้นสลักชื่อ ORBA มาให้น้องชาย |\n| Alice | อลิซ | เพื่อนสมัยเด็กในหมู่บ้าน อายุมากกว่าออร์บา 3 ปี อ่อนกว่าโรอัน 2 ปี ผมสีน้ำตาลเข้ม มีลักยิ้ม คอยดูแลออร์บาเหมือนพี่สาว ถูกทหารเมฟิอุสจับตัวไปในเหตุการณ์เผาหมู่บ้าน |\n| Doug | ดั๊ก | เด็กชายจากหมู่บ้านใกล้เคียง เคยหลอกพวกออร์บาเรื่องมังกรป่าและมีเรื่องชกต่อยกับออร์บาเป็นประจำเพราะเรื่องของอลิซ |\n| Douga | ดูกา | หนึ่งในสามทหารการ์เบราที่บุกปล้นบ้านออร์บา ถูกออร์บาใช้ดาบสั้นแทงเสียชีวิต |\n| Knight Apprentice (Garberan youth) | อัศวินฝึกหัดแห่งการ์เบรา | นายทหารหนุ่มรูปงามในชุดเกราะสีเงินเงางาม ไม่ใช่เชื้อพระวงศ์จึงถูกดูแคลนว่าเป็นอัศวินฝึกหัดตลอดชีวิต สังหารทหารการ์เบราที่ปล้นฆ่าชาวบ้านและปล่อยออร์บากับมารดาหนีไป (ดวงตาคล้ายโรอัน) |\n| General Oubary | แม่ทัพอุบารี | แม่ทัพอาวุโสแห่งเมฟิอุสผู้ดูแลป้อมอัปตา ร่างใหญ่ ศีรษะล้าน ทาลิปสติกสีม่วงคล้ำ เป็นผู้สั่งปล้นฆ่าและเผาหมู่บ้านที่พวกออร์บาหนีไปหลบภัย แล้วป้ายความผิดให้การ์เบรา |\n| Magic King Zodias | จอมราชาเวทมนตร์ โซเดียส | ตัวละครในหนังสือเรื่องเล่าจากโลกยุคเก่าที่โรอันนำมาให้ออร์บาอ่าน |\n| Two mysterious men in prison | ชายลึกลับสองคนในเรือนจำ | คนหนึ่งสงสัยว่าออร์บาหน้าตาและเสียงคล้ายกับ \"ท่านผู้นั้น/เจ้านาย\" จึงสั่งสวมหน้ากากเหล็กลงคำสาปปิดบังใบหน้าออร์บาไว้และส่งไปเป็นทาสดาบ |\n| Hermann | เฮอร์มานน์ | ชายคนสนิทของเฟดอม รูปลักษณ์ภายนอกดูเหมือนเด็กหนุ่มหน้าซีดคล้ายนักศึกษา ทว่าแท้จริงมีอายุมาก ผมมีสีขาวแซม น้ำเสียงแหบพร่า เชี่ยวชาญมนตราและอาคม เป็นผู้ลงอาคมและถอดหน้ากากเหล็กให้ออร์บา |\n| Dinn | ดินน์ | เด็กรับใช้หน้าตาน่ารักของเฟดอม ทำหน้าที่เป็นผู้ฝึกสอนมารยาท การเดิน การยืน และการยิ้มเยี่ยงเชื้อพระวงศ์ให้ออร์บาตลอด 3 วันก่อนงานอภิเษก |\n\n## สถานที่และองค์กร (Locations & Organizations)\n| ต้นฉบับ | ชื่อไทยที่ล็อกไว้ | หมายเหตุ |\n| :--- | :--- | :--- |\n| Garbera Kingdom / Garbera | อาณาจักรการ์เบรา / การ์เบรา | อาณาจักรที่ภาคภูมิใจในวิถีแห่งอัศวิน เชี่ยวชาญการสกัดศิลามังกรและสร้างเรือเหาะขนาดเล็ก |\n| Phozon Capital / Phozon | เมืองหลวงโฟซอน / ราชธานีโฟซอน | เมืองหลวงของอาณาจักรการ์เบรา |\n| Shikou Palace | ตำหนักชิโค | ตำหนักที่มีจุดปล่อยเรือเหาะอยู่บนหลังคา |\n| Mephius Empire / Mephius | จักรวรรดิเมฟิอุส / เมฟิอุส | จักรวรรดิเก่าแก่ที่มีพรมแดนติดทางตะวันตกเฉียงเหนือของการ์เบรา คู่สงครามในสงครามสิบปี |\n| Ende | ดัชชีเอนเด / เอนเด | ชาติขนาดไม่ใหญ่แต่ประวัติศาสตร์ยาวนานสืบถึงจุดเริ่มต้นของราชวงศ์เวทมนตร์ ตั้งอยู่ระหว่างเมฟิอุสและการ์เบรา สนิทสนมกับกลุ่มประเทศริมอ่าวฟากทะเลและอาริออน |\n| Arion | อาริออน | ชาติมหาอำนาจทางตะวันออกที่มีสายสัมพันธ์ยาวนานกับดัชชีเอนเด |\n| Dragon Gods temple | วิหารเทพมังกร | สถานที่ศักดิ์สิทธิ์ที่จักรพรรดิกูลเคยสาบานไว้ว่าจะไม่เก็บดาบจนกว่าจะได้ศีรษะกษัตริย์การ์เบรา |\n| Domick Flats | ที่ราบดอมิก | ที่ราบผืนใหญ่ตัดเฉียงผ่านเทือกเขา ทอดยาวรอบราชธานีโซลอน |\n| Black Tower | หอคอยทมิฬ | หอคอยศูนย์กลางราชธานีโซลอน หรือ 'ดาบที่หลอมจากซากหัวเรือผู้อพยพอวกาศ' |\n| Solon | ราชธานีโซลอน / เมืองหลวงโซลอน | เมืองหลวงของจักรวรรดิเมฟิอุส |\n| Air defence force / Third air defence fleet | กองกำลังป้องกันน่านฟ้า / กองเรือป้องกันน่านฟ้าที่สาม | หน่วยป้องกันภัยทางอากาศของการ์เบรา (มีกองเรือที่ 1-4) |\n| Ba Roux (Amphitheatre of Ba Roux) | บา รูซ์ (อัฒจันทร์แห่งบา รูซ์ / ลานประลองบา รูซ์) | เมือง/ลานประลองนักสู้แกลดิเอเตอร์ขนาดใหญ่จุคนนับพัน |\n| Arena of Tidan | ลานประลองแห่งทีดาน | ลานประลองที่ออร์บาเคยสังหารบารอนไมเออร์ |\n| Tarkas Gladiatorial Group | คณะนักสู้ทาร์คัส / บริษัทค้าทาสดาบทาร์คัส | คณะแกลดิเอเตอร์ของทาร์คัสที่ออร์บาสังกัดอยู่ |\n| Tsaga Mines (Mines of Tsaga) | เหมืองซากา | เหมืองอันตรายตามแนวชายแดนตะวันตกของเมฟิอุส มีทั้งแก๊สพิษ สัตว์กินคน และชนเผ่าเกบลิน |\n| Geblin tribes | ชนเผ่าเกบลิน | ชนเผ่าล่ามนุษย์แถบเหมืองซากา |\n| Ryuujin Tribe | เผ่าริวจิน | เผ่าพันธุ์ตามตำนาน/ที่ถูกกล่าวถึงคู่กับเกบลิน |\n| Dragon God worshipping nomads | ชนเผ่าเร่ร่อนผู้บูชาเทพมังกร | ชนเผ่าพื้นเมืองของโฮวหลานบนเทือกเขาตะวันตกของเมฟิอุส |\n| Drought Valley | หุบเขาแห้งแล้ง | พื้นที่กันดารทางชายแดนตอนใต้ของเมฟิอุส บ้านเกิดของออร์บา (หมู่บ้านยากจนที่ไม่มีชื่อบนแผนที่) |\n| Apta Fortress / City of Apta | ป้อมอัปตา / เมืองอัปตา | ป้อมปราการชายแดนใต้ของเมฟิอุส พ่อของออร์บาเสียชีวิตจากดินถล่มขณะสร้างป้อม ต่อมาถูกการ์เบราตีแตก |\n| Birac | นครรัฐบิรัค / ดินแดนบิรัค / ปราการธรรมชาติแห่งบิรัค | ดินแดน/นครรัฐของเมฟิอุสทางตอนเหนือของป้อมอัปตา ที่ออร์บามาใช้ชีวิตขโมยและตั้งกลุ่มเด็กเร่ร่อนจนถูกจับ |\n| Seirin Valley | หุบเขาเซริน | สถานที่ศักดิ์สิทธิ์/สำคัญสำหรับประกอบพิธีกล่าวคำปฏิญาณอภิเษกสมรสของราชวงศ์เมฟิอุส |\n| Gascon | กัสคอน | หมู่บ้านที่ถูกทหารการ์เบราบุกปล้นก่อนหน้าหมู่บ้านของออร์บา |\n\n## ศัพท์เฉพาะและเหตุการณ์ (Terms & Events)\n| ต้นฉบับ | คำแปลไทย | หมายเหตุ |\n| :--- | :--- | :--- |\n| Ten Year War | สงครามสิบปี | สงครามระหว่างอาณาจักรการ์เบรากับจักรวรรดิเมฟิอุส |\n| dragonstone | ศิลามังกร | โลหะไร้น้ำหนักที่สกัดบริสุทธิ์จากฟอสซิลมังกร ใช้เป็นวัสดุหลักสร้างเรือเหาะ |\n| airship | เรือเหาะ | ยานพาหนะทางอากาศของการ์เบรา |\n| ornithopter-type single-seated airship | เรือเหาะแบบกระพือปีกที่นั่งเดี่ยว | จำลองแบบจากนกอินทรีทะเลขนาดใหญ่ ยาวราว 3 เมตร ปีกกางกว้างราว 7 เมตร ที่นั่งอยู่ตรงตำแหน่งกรงเล็บ |\n| gliding wings | ปีกร่อน | ปีกเสริมที่กางออกมาจากข้างที่นั่งเพื่อร่อนลงจอด |\n| chivalry | วิถีแห่งอัศวิน | ค่านิยมและเกียรติภูมิหลักของอาณาจักรการ์เบรา |\n| Mother Earth | ผืนปฐพี | โลก/แผ่นดินเบื้องล่าง |\n| sword-slaves / gladiators | ทาสดาบ / นักสู้แกลดิเอเตอร์ | ทาสหรือผู้ถูกเกณฑ์ให้มาต่อสู้เดิมพันชีวิตในลานประลอง |\n| believer of Badyne | ศาสนิกชนแห่งบาดีน | ผู้นับถือศาสนา/ลัทธิบาดีน ซึ่งมีเอกลักษณ์คือการใช้ผ้าพันศีรษะปล่อยชายห้อยสองข้าง |\n| Sozos | โซซอส | มังกรสายพันธุ์เพาะพันธุ์โดยมนุษย์ ยาว 7-8 เมตร เกล็ดเขียวเปียกลื่น มีหกขา จักรวรรดิเมฟิอุสนำไปใช้ในสงคราม |\n| era of space voyage | ยุคสมัยแห่งการท่องอวกาศ | ยุคสมัยบรรพกาลที่ถูกกล่าวถึงในคำปราศรัยของโฆษกลานประลอง |\n| Baian dragon | มังกรไบอัน | มังกรขนาดกลางที่โฮวหลานดูแลอยู่ |\n| Old World | โลกยุคเก่า | ยุคสมัยก่อนที่มนุษยชาติเคยออกเดินทางจากรัง |\n| priest of Badyne | นักบวชแห่งบาดีน | ผู้นำคำสอนและเผยแผ่ศาสนาแห่งบาดีน |\n| Houban dragon | มังกรฮูบัน | มังกรขนาดกลาง ลำตัวแบนราบ มีขายาว 8 ข้าง ใช้เทียมลากเกวียน |\n| Tengo dragon / Tengo | มังกรเทนโก / เทนโก | มังกรขนาดเล็กกว่าไบอัน ศีรษะคล้ายนก วิ่งสองขา คล่องแคล่วในการหักเลี้ยว มักใช้ในสนามรบแทนม้า |\n| slave brand | ตราประทับทาส | เครื่องหมายกากบาทที่มีเส้นตรงแนวตั้งลากผ่านตรงกลาง ประทับด้วยเหล็กร้อนบนแผ่นหลัง |\n| black water lily | ผงบัวทมิฬ | สารเสพติดชนิดผงผสมสุราที่ออกฤทธิ์มึนเมาและกระตุ้นความคลุ้มคลั่ง (กิลแอบใช้) |\n| Right to First Night | สิทธิ์คืนแรก / สิทธิแห่งค่ำคืนแรก | กฎหมาย/ธรรมเนียมโบราณของขุนนางเมฟิอุสที่อ้างสิทธิ์หลับนอนกับเจ้าสาวในคืนแต่งงาน |\n| Imperial Guards | กององครักษ์จักรพรรดิ | กองกำลังอารักขาส่วนพระองค์และรักษาความสงบในราชธานีโซลอน |\n| Space Immigrant Ship | เรือผู้อพยพอวกาศ | ยานอพยพยุคบรรพกาลที่ซากหัวเรือถูกหลอมเป็นหอคอยทมิฬใจกลางโซลอน |\n| Ryuujin Faith | ลัทธิความเชื่อแห่งริวจิน | ความเชื่อดั้งเดิมของเมฟิอุสที่นับถือมังกรโบราณเป็นเทพเจ้าผู้ทรงภูมิปัญญาในอดีต |\n| ether | อีเธอร์ | แหล่งพลังงานโบราณที่ใช้อารยธรรมเวทมนตร์ของมังกร |\n",
  "story_memory": "# บันทึกความจำเนื้อเรื่องสะสม (Story Memory)\n\n## เล่ม 1 (Volume 1)\n\n### บทนำ (Prologue)\n- **ความวุ่นวายในพระราชวัง:** เจ้าหญิงวิลีนา พระธิดาองค์ที่สามแห่งอาณาจักรการ์เบรา วัย 14 ปี หายตัวไปจากสวนกลางพระราชวังหลังจากบอกว่าจะไปชมแสงอาทิตย์อัสดงบนหลังคาตำหนักชิโค ซึ่งเป็นจุดขึ้นบินของเรือเหาะ ทำให้หัวหน้านางกำนัลเทเรเซียและหัวหน้าองครักษ์ตำหนักตะวันตกต้องรีบออกตามหา\n- **บรรยากาศก่อนงานอภิเษก:** วิลีนาเป็นหนึ่งในนักบินเรือเหาะที่เก่งที่สุดในประเทศ และกำลังจะต้องเดินทางไปอภิเษกสมรสกับจักรวรรดิเมฟิอุสทางตะวันตกเฉียงเหนือในอีกหนึ่งสัปดาห์ข้างหน้า (เพื่อรักษาสัญญาหลังสงครามสิบปี) เหล่าทหารองครักษ์ต่างรู้สึกขุ่นเคือง โศกเศร้า และเจ็บใจที่พ่ายแพ้/ไม่อาจชนะสงครามได้ แต่ก็รู้ดีว่าวิลีนารักชาติและประชาชนมากกว่าใคร จึงไม่ทำลายสัญญาทางการเมืองครั้งนี้แน่ มีเพียงเทเรเซียที่จะเดินทางติดตามไปรับใช้ด้วย\n- **ฝ่าแนวน่านฟ้า:** วิลีนาลักลอบขับเรือเหาะสีดำสนิททรงเพรียวแบบใบพัดท้ายที่เน้นความเร็ว (นอนคว่ำบนลำเรือ) มุ่งหน้าสู่คฤหาสน์/ตำหนักพักผ่อนริมทะเลสาบซึ่งอยู่ห่างจากเมืองหลวงโฟซอนไปทางตะวันออกเฉียงใต้ราว 20 กิโลเมตร กองเรือป้องกันน่านฟ้าที่สามเข้าสกัด แต่เมื่อรู้ว่าเป็นเจ้าหญิง ผู้บัญชาการกองกำลังป้องกันน่านฟ้า (ซึ่งมีลูกสาววัย 14 ปีเช่นกัน) ก็ปล่อยตัวไปและสั่งบันทึกเหตุการณ์ว่า \"ท้องฟ้าวันนี้สงบสุขดี\"\n- **พบเสด็จปู่จอร์จ โอเวลล์:** วิลีนาในชุดนักบินเรือเหาะลอบเข้าพบ **จอร์จ โอเวลล์** อดีตกษัตริย์แห่งการ์เบราผู้เป็นเสด็จปู่ซึ่งล้มป่วยติดเตียงมาตั้งแต่ฤดูหนาว และเมื่อ 5 ปีก่อนเคยเกิดกบฏบุกยึดคฤหาสน์แห่งนี้จนท่านได้รับบาดเจ็บ (ซึ่งวิลีนาในวัย 9 ขวบในตอนนั้นกล้าหาญยืนหยัดปกป้องเสด็จปู่โดยไม่ถอยแม้แต่ก้าวเดียว)\n- **คำสอนและคำปฏิญาณ:** ทั้งสองพูดคุยหยอกล้อกันอย่างสนิทสนม (เรื่องการแข่งเรือเหาะที่วิลีนาได้ที่สองเพราะเรื่องชุดกระโปรงทำให้จอร์จแพ้พนันเสียม้าตัวโปรดให้เสนาบดีคลังวอลเลซ) ก่อนที่วิลีนาจะกลั้นน้ำตาไม่อยู่เพราะรู้ดีว่านี่คือการร่ำลาครั้งสุดท้าย เธอระบายความแค้นเคืองต่อเมฟิอุส (ซึ่งเชื่อว่าเป็นผู้อยู่เบื้องหลังกบฏเมื่อ 5 ปีก่อน) จนถึงขั้นพูดว่าจะปาดคอว่าที่สามีในคืนเข้าหอ แต่จอร์จเตือนสติว่าชัยชนะไม่ได้เกิดจากการนองเลือดเพียงอย่างเดียว การนำความสงบสุขมาสู่ปวงชนก็เป็นชัยชนะเช่นกัน และขอให้เชื่อมั่นในตัวเองในฐานะ \"วิลีนาของปู่\"\n- **เปลี่ยนผ่านสู่นักรบ:** วิลีนาเช็ดน้ำตาและสลัดความอ่อนแอทิ้ง ลุกขึ้นยืนประกาศกร้าวราวกับอัศวินในสมรภูมิว่า เธอจะไม่ทำให้เลือดตกยางออกและไม่ทำให้ชาวการ์เบราลำบาก แต่จะขอรับคำท้าในสมรภูมิครั้งใหม่นี้ สืบหาความจริงและจุดอ่อนของเมฟิอุสด้วยทุกวิถีทางเพื่อนำข่าวชัยชนะกลับมาให้จงได้\n\n### บทที่ 1.1: เหล็กกล้าและโลหิต (1)\n- **ลานประลองแห่งบา รูซ์:** เปิดฉากที่สนามประลองแกลดิเอเตอร์ในบา รูซ์ มีผู้ชมกว่าพันคน ทั้งศึกบนหลังม้าและมือเปล่า (นักสู้ยอดนิยมอย่าง **ชีค** เพิ่งชนะ) ในอัฒจันทร์ที่นั่งพิเศษมีเด็กสาวชื่อ **อิเนลี** นั่งชมอยู่กับพี่ชายซึ่งเป็นผู้สืบทอดดินแดนแห่งเมฟิอุส (สวมผ้าคลุมศีรษะปิดบังใบหน้าแบบศาสนิกชนแห่งบาดีน และไม่ชอบความรุนแรง)\n- **ศึกกับเวิร์นลูกตุ้มเหล็ก:** คู่เอกคือการชิงตัวหญิงงามที่ถูกมัดบนเสาหลักต่อหน้ากรงของมังกร **โซซอส** (มังกร 6 ขายาว 7–8 เมตร) ระหว่างนักสู้ชื่อดัง **เวิร์นลูกตุ้มเหล็ก** กับนักดาบหน้าใหม่ของสนามนี้คือ **พยัคฆ์เหล็ก ออร์บา** (ร่างผอมเพรียว สวมหน้ากากเสือสีน้ำเงินเหล็กกล้า อิเนลีท้าพี่ชายพนันโดยเธอเลือกถือหางออร์บา) ช่วงแรกออร์บาหลบหลีกและวนรักษาระยะจนคนดูโห่ แต่สุดท้ายฉวยจังหวะที่เวิร์นใจร้อน ฟันโซ่ขาดในดาบเดียวและผ่าศีรษะเวิร์นสิ้นชีพ ก่อนจะตัดเชือกปล่อยหญิงสาวแล้วเดินหนีอย่างไม่ไยดี\n- **มังกรโซซอสอาละวาด:** ทันใดนั้นมังกรโซซอสเกิดคลุ้มคลั่งพังกรงออกมา กินทาสเข้าไปคนหนึ่งจนฝูงชนแตกตื่น อิเนลีพลัดตกลงมาจากระเบียงไปอยู่ตรงหน้ามังกรและกำลังจะถูกขย้ำ แต่ **ออร์บา** พุ่งทะยานถีบกำแพงกระโดดขึ้นไปบนหัวมังกร ใช้ดาบกระหน่ำแทงจนดาบหัก และรับดาบจากเพื่อนนักสู้ผิวสีน้ำตาลมาแทงปิดฉากสังหารมังกรโซซอสได้สำเร็จ\n- **ปริศนาสายตาและอดีต:** ออร์บาเดินจากไปอย่างเงียบงัน ทว่าอิเนลีรู้สึกคุ้นเคยว่า **ดวงตาใต้หน้ากากของออร์บาคล้ายกับพี่ชายของเธออย่างน่าประหลาด** ขณะเดียวกัน ชายอีกคนที่ยืนอยู่เบื้องหลังผู้สืบทอดเมฟิอุสกลับตกตะลึงเมื่อเห็นออร์บาและพึมพำว่า *\"ไม่มีทาง หมอนั่นยังมีชีวิตอยู่... สองปีเต็มๆ แล้วสินะ\"*\n\n### บทที่ 1.2: เหล็กกล้าและโลหิต (2)\n- **ชีวิตในค่ายกักกันทาสคณะทาร์คัส:** ออร์บาเป็นทาสดาบมาครบ 2 ปีเต็ม (เข้าสังเวียนครั้งแรกตอนอายุ 14 ปี) และไม่เคยถอดหน้ากากเหล็กออกให้ใครเห็นเลยแม้แต่คนเดียว เช้าวันใหม่เริ่มจาก **โกเวน** ผู้ฝึกสอนปลุกทุกคนมาทำความสะอาดและดูแลสัตว์ประลอง\n- **พบโฮวหลานที่คอกมังกร:** ออร์บาได้พบ **โฮวหลาน** ทาสสาวจากชนเผ่าเร่ร่อนผู้บูชาเทพมังกรบนเทือกเขาตะวันตกของเมฟิอุส ซึ่งเป็นคนเดียวที่สื่อสารกับ \"เสียง\" ของมังกรและสัมผัสเกล็ดพวกมันได้ (ออร์บาเคยช่วยเธอจากทาสหน้าใหม่มาก่อน เธอบอกว่าพวกมังกรชอบออร์บาและตำหนิว่าไม่ควรใช้ยาบังคับมังกรโซซอส)\n- **ทวงถามสัญญาจากทาร์คัส:** หลังฝึกซ้อมช่วงเที่ยง ออร์บาเข้าไปทวงสัญญาปลดปล่อยจาก **ทาร์คัส** เพราะชนะมาตลอด 2 ปีแล้ว แต่ทาร์คัสขู่กลับว่าต่อให้พ้นทาสเขาก็ยังเป็นอาชญากรที่ไม่มีเงินไถ่โทษ และอาจถูกส่งไปตายที่ **เหมืองซากา** ชายแดนตะวันตก (มีแก๊สพิษ สัตว์กินคน และเผ่าเกบลิน) พร้อมกันนั้นออร์บาเห็นทาร์คัสนำทาสหน้าใหม่กลุ่มหนึ่งเดินตามเข้ามา\n- **โรงอาหารและเพื่อนร่วมชะตา:** ในมื้อเย็น ออร์บาอ่านหนังสือตามนิสัย และถูก **ชีค** มาทักทาย ตามด้วย **โกเวน** ที่วิจารณ์ว่าออร์บายังใจร้อนชอบเสี่ยงเมื่อถูกต้อนจนมุม และ **กิลเลียม** ยักษ์ใหญ่ผู้ถือขวานศึกที่ตำหนิว่าออร์บาสู้ไม่เร้าใจคนดู (ซึ่งเป็นสิ่งสำคัญในการเอาตัวรอดของแกลดิเอเตอร์) ส่วน **ไคน์** ทาสหนุ่มมือปืนเล่าข่าวซุบซิบว่าทาสหน้าใหม่กลุ่มนั้นฝีมือดาบไม่ได้เรื่องเลย แต่ทาร์คัสกลับอารมณ์ดีผิดปกติ (คาดว่าอาจเกี่ยวพันกับขุนนางหรือนักโทษการเมืองเมฟิอุส)\n- **ปณิธานที่แท้จริงของออร์บา:** โกเวนพูดคุยอย่างจริงจังว่าออร์บาแตกต่างจากทาสทั่วไปเพราะอ่านหนังสือประวัติศาสตร์และผู้คน ราวกับมีอนาคตหรือเป้าหมายที่รออยู่ แต่เมื่อออร์บากลับมานอนในคอกทาส เขากลับขบกรามแน่นด้วยความเคียดแค้น—เขาไม่ได้หวังอนาคตอันสดใส แต่ต้องการรอดออกไป **ทวงคืนสิ่งที่ถูกช่วงชิงไป และทำให้คนที่พรากมันไปจากเขาได้ลิ้มรสความเจ็บปวดจากชีวิตผู้คนที่เขาต้องสังหารมาตลอดสองปี**\n\n### บทที่ 1.3: เหล็กกล้าและโลหิต (3)\n- **อดีตในวัยเยาว์ที่หุบเขาแห้งแล้ง:** ย้อนอดีตสมัยออร์บายังไม่ถึง 10 ขวบ อาศัยอยู่กับมารดาและ **โรอัน** พี่ชายผู้เก่งกาจ (บิดาตายจากดินถล่มขณะเจาะผาสร้าง **ป้อมอัปตา** ตอนออร์บาอายุ 2–3 ขวบ) ออร์บาเลือดร้อนชอบใช้ดาบไม้ซ้อมและมีเรื่องชกต่อยกับเด็กอื่น (เช่น **ดั๊ก** เพราะเรื่องของ **อลิซ** เพื่อนสาวคนสนิทที่แก่กว่า 3 ปี) และชอบอ่านหนังสือเรื่องโลกยุคเก่าและตำนานวีรบุรุษที่โรอันเอามาฝาก (เช่น จอมราชาเวทมนตร์ โซเดียส)\n- **สงครามและป้อมอัปตาแตก:** เมื่อเมฟิอุสทำสงครามกับการ์เบรา โรอันถูกเกณฑ์ไปประจำการที่ป้อมอัปตา หลังผ่านไป 3 สัปดาห์ ป้อมอัปตาก็แตกเพราะเมืองหลวงส่งกำลังหนุนไปแค่ปราการบิรัคทางเหนือ ออร์บาอพยพตามชาวบ้านแต่ย้อนกลับไปตามหามารดาที่บ้าน\n- **สังหารคนแรกและพบอัศวินการ์เบรา:** ทหารการ์เบรา 3 นายบุกปล้นบ้านและทำร้ายมารดา ออร์บาพบดาบสั้นสลักชื่อ `ORBA` ที่โรอันส่งมาซ่อนไว้บนชั้นวางของ จึงคว้ามาฟันไหล่ทหารนายหนึ่งและแทง **ดูกา** จนตาย ก่อนจะเกือบถูกทหารที่เหลือฆ่า แต่ **อัศวินฝึกหัดแห่งการ์เบรา** ในชุดเกราะสีเงินเข้ามาสังหารทหารชั่วทั้งสองและปล่อยให้ออร์บากับมารดาหนีไป (ดวงตาของเขามีความคล้ายโรอัน)\n- **การทรยศของแม่ทัพอุบารี:** ออร์บากับมารดาสมทบกับชาวบ้านหนีไปหมู่บ้านทางเหนือ 15 กม. ทว่ากองกำลังชุดดำของ **แม่ทัพอุบารี** (แม่ทัพเมฟิอุสที่ถอยหนีจากป้อมอัปตา) บุกเข้าปล้นชิง ฆ่าชาวบ้าน จับตัว **อลิซ** และเผาหมู่บ้านทั้งหมดทิ้งเพื่อไม่ให้เหลือเสบียงแก่การ์เบรา พร้อมสั่งให้ป้ายความผิดว่าเป็นการกระทำของการ์เบรา ออร์บาถูกตีสลบ พอฟื้นขึ้นท่ามกลางทะเลเพลิงและศพชาวบ้าน จึงสาบานจะแก้แค้นและก้าวเดินต่อไปข้างหน้า\n\n### บทที่ 2.1: เด็กหนุ่มทั้งสอง (1)\n- **4 ปีในนครรัฐบิรัค:** ออร์บาหลบหนีเข้ามายังบิรัค เริ่มต้นจากการขโมยและตั้งกลุ่มเด็กเร่ร่อน เมื่ออายุ 14 ปีขึ้นเป็นหัวหน้ากลุ่มที่มีสมาชิกกว่าร้อยคน เพราะให้ความสำคัญกับข้อมูลข่าวสารและการวางแผนซุ่มโจมตี ตกกลางคืนเขายังคงปลีกตัวอ่านหนังสือและคิดถึงโรอัน อลิซ และมารดา\n- **ถูกหักหลังและประทับตราทาส:** ช่วงอายุราว 15–16 ปี (4 ปีในบิรัค) ออร์บาวางแผนใช้เรือเหาะ 3 ลำปล้นเรือรบศิลามังกรขนทองคำและสินค้า แต่ถูกสายลับจากอดีตกลุ่มคู่อริหักหลังแจ้งกองกำลังรักษาเมือง ทำให้ถูกบุกจับที่ร้านเหล้าลับและถูกประทับตราประทับทาสบนแผ่นหลัง\n- **คำสาปหน้ากากเหล็ก:** คืนวันถูกขังในคุกใต้ดิน มีชายลึกลับสองคนมาตรวจดูหน้าและเสียงของออร์บา พร้อมพูดทำนองว่า **\"หน้าตาและเสียงเหมือนท่านผู้นั้น\"** จึงลงความเห็นว่าปล่อยให้เป็นทาสดาบด้วยหน้าตาจริงไม่ได้ และสวมหน้ากากเหล็กที่แผดเผาแนบติดผิวหนังให้เขา จากนั้นออร์บาถูกเกวียนมังกรฮูบันลากส่งไปยังคณะนักสู้ทาร์คัส\n- **การฝึกนรกกับโกเวนและศึกแรกๆ:** ช่วงแรกออร์บาพยายามฉีกหน้ากากจนทุบกระจกแตกและต้องทนทรมานจาก \"คำสาปหน้ากาก\" ที่แผดเผากลางดึก (นานกว่า 1 ปีจึงค่อยๆ จางลง แต่ยังถอดไม่ออก) โกเวนสั่งสอนให้ออร์บาละทิ้งนิสัยเดิมและ \"ฆ่าตัวตน/อารมณ์\" เพื่อเอาชีวิตรอด ออร์บาเก็บความแค้นไว้เป็นเชื้อไฟและลงสังเวียนสังหารคู่ต่อสู้ซ้ำแล้วซ้ำเล่าจนผ่านไปเกือบ 2 ปี\n- **งานอภิเษกสมรสที่หุบเขาเซริน:** 5 วันหลังเหตุการณ์โซซอสที่บา รูซ์ โกเวนเปิดเผยเหตุที่ทาร์คัสอารมณ์ดี—เมฟิอุสและการ์เบราตกลงสงบศึกยุติสงครามสิบปีด้วยงานอภิเษกสมรสระหว่างองค์รัชทายาทเมฟิอุสกับเจ้าหญิงการ์เบราที่ **หุบเขาเซริน** และคณะนักสู้ทาร์คัสเป็นคณะเดียวที่ถูกคัดเลือกให้ไปประลองถวายหน้าพระที่นั่ง ซึ่งออร์บามองว่าเป็นแค่เรื่องจอมปลอมที่ไม่เปลี่ยนแปลงอะไรได้เลย\n\n### บทที่ 2.2: เด็กหนุ่มทั้งสอง (2)\n- **เปิดเผยตัวตนขององค์รัชทายาทเมฟิอุส:** ชายหนุ่มจากบทที่ 1 คือ **กิล เมฟิอุส** เจ้าชายองค์โตแห่งจักรวรรดิเมฟิอุส วัยราว 17 ปี (แก่กว่าวิลีนา 3 ปี) ชอบออกไปเที่ยวเตร่เสเพลยามค่ำคืนกับกลุ่มลูกชายคนรอง/คนสามของขุนนาง เพื่อหลีกหนีความอึดอัดก่อนงานอภิเษกสมรส โดยมี **ไซมอน ร็อดลูม** (อดีตประธานสภาขุนนางซึ่งปัจจุบันไร้ดินแดนและทหาร) คอยตามดูแลดุจพี่เลี้ยง\n- **เบื้องหลังการเมืองและการสงบศึก:** **จักรพรรดิกูล เมฟิอุส (\"จักรพรรดิดวงใจมังกร\")** ยอมกลืนคำสาบานที่วิหารเทพมังกรและรีบเจรจาสงบศึกกับการ์เบรา (โดยยอมเสียเปรียบเรื่องแบ่งดินแดนอัปตา) เพื่อตัดหน้า **ดัชชีเอนเด** (ที่ใกล้ชิดกับกลุ่มประเทศริมอ่าวและมหาอำนาจ **อาริออน** ทางตะวันออก) ไม่ให้จับมือเป็นพันธมิตรทางทหารกับการ์เบรา\n- **กิลถูกบิดาดูแคลน:** กิลไม่อยากแต่งงานกับเจ้าหญิงวิลีนาเพราะได้ยินกิตติศัพท์ว่าเธอเคยสู้กบฏตอน 9 ขวบและขับเรือเหาะเก่งจนได้รองชนะเลิศ เกรงจะถูกหัวเราะเยาะ เมื่อเข้าเฝ้า **จักรพรรดิกูล** ก็ถูกพระบิดาด่าทอและล้อเลียนเรื่องฝีมือกับวิลีนาต่อหน้าเหล่าขุนนางและ **อิเนลี** (ธิดาคนโตของพระมเหสีรอง **เมลิสซา**) จนกิลไม่กล้าโต้เถียง\n- **แรงกระเพื่อมของเฟดอม ออลิน:** หลังจักรพรรดิเสด็จกลับ **เฟดอม ออลิน** (ขุนนางร่างอ้วนผู้ดูแลป้อมบิรัคและแกนนำเจรจาสงบศึก — คนเดียวกับชายคางหย่อนยานในบทที่ 1.1) แอบกระซิบหยั่งเชิงไซมอนเพื่อชวนตั้งกลุ่มต่อต้านเจ้าชายกิล แต่ไซมอนตอบปฏิเสธอย่างนุ่มนวลโดยเลือกอยู่ข้างกิลเพื่อรอดูความเปลี่ยนแปลงอันเป็นโชคชะตาขององค์ชายน้อยต่อไป\n\n### บทที่ 2.3: เด็กหนุ่มทั้งสอง (3)\n- **ความกดดันและปมด้อยของกิล:** กิลถูกหลอกหลอนด้วยภาพสายตาเหยียดหยามของจักรพรรดิกูลและคำพูดยั่วยวนถากถางของอิเนลี (ที่เหน็บแนมว่ากิลยังกลัวพ่อและทำอะไรไม่เป็น) ความทรงจำดีเพียงหนึ่งเดียวที่พ่อชมคือตอน 10 ขวบที่เหยียบคอมังกรป่าที่ถูกยิงตาย นอกนั้นมีแต่เสียงถอนหายใจและดูแคลน ยิ่งแม่แท้ๆ เสียชีวิตไปเมื่อ 5 ปีก่อน และพ่อรับมเหสีรองเมลิสซาเข้ามา กิลยิ่งรู้สึกโดดเดี่ยวและไร้ค่า\n- **เสพผงบัวทมิฬคลุ้มคลั่งกลางเมืองหลวง:** กิลผสม \"ผงบัวทมิฬ\" ลงในเหล้าเพิ่มเป็นสองเท่าจนประสาทหลอนและขาดสติ ควบม้าตะบึงฝ่าเมืองหลวงโซลอนไปคนเดียว และบุกเข้าไปในโรงเตี๊ยมเพื่อประกาศใช้กฎหมายโบราณ **\"สิทธิ์คืนแรก\"** กับ **เลย์ลา** เจ้าสาวป้ายแดงซึ่งเป็นบุตรสาวคนเดียวของ **โรน เจย์ซ** นายทหารกององครักษ์จักรพรรดิ\n- **ปืนลั่นล้มฟุบ:** โรน เจย์ซ ตัดสินใจเอาชีวิตเข้าแลกเพื่อปกป้องความสุขของลูกสาว พุ่งกระโจนเข้าใส่กิลที่กำลังคลุ้มคลั่งดิ้นรนหมายจะก้าวข้ามเงาบิดา เกิดการกอดรัดฟัดเหวี่ยงแย่งปืนสั้นข้างเอวโรนจนปืนตกลงพื้นและเกิด **ปืนลั่น (ปัง!)** ร่างของกิลล้มคว่ำหน้าจมกองเลือดแน่นิ่งไป\n- **แผนการเปลี่ยนชะตาจักรวรรดิของเฟดอม:** เฟดอม ออลิน ตามมาถึงหน้าโรงเตี๊ยมและได้ยินเสียงปืน เมื่อวิ่งขึ้นไปพบคราบเลือดและร่างของกิลที่นอนแน่นิ่งไม่ไหวติง เฟดอมมองเห็นโอกาสทองที่จะพลิกประวัติศาสตร์จักรวรรดิและก้าวขึ้นสู่อำนาจ เขาข่มขู่โรน เจย์ซ ให้ปิดปากเงียบสนิท (โดยอ้างว่าองค์ชายยังหายใจอยู่และไม่มีอะไรเกิดขึ้น) เพื่อวางแผนนำ \"ตัวแทน\" ที่ตนเคยพบ—ซึ่งก็คือออร์บา ทาสดาบที่มีใบหน้าและน้ำเสียงเหมือนกิลราวกับแกะ—มาสวมรอยเป็นองค์รัชทายาทกิลแห่งเมฟิอุส\n\n### บทที่ 3.1: หน้ากากชิ้นใหม่ (1)\n- **เตรียมตัวสู่หุบเขาเซริน:** ทาร์คัสตื่นเต้นและกระตือรือร้นเกินเหตุเรื่องงานแสดงหน้าพระพักตร์ที่หุบเขาเซริน ถึงขนาดปฏิเสธการร่วมมือจากคณะอื่น โกเวนยังคงระแวงเรื่องเส้นสายของทาร์คัสกับขุนนางระดับสูงอย่างเฟดอม ออร์บาช่วยโฮวหลานต้อนมังกรไบอันวัย 6 เดือนขึ้นกรง โดยออร์บายอมกระโดดขึ้นขี่หลังมังกรตามคำแนะนำของหลานซึ่งมังกรก็ยอมเชื่อฟังอย่างประหลาด\n- **เฟดอมบุกค่ายกักกัน:** 1 ชั่วโมงก่อนออกเดินทาง เฟดอม ออลิน ควบมังกรเทนโกมาถึงค่ายพร้อมผู้ติดตาม ทหารคนสนิทเงื้อแส้ฟาดหลานเพราะรังเกียจชนเผ่าบูชาเทพมังกร แต่ออร์บาเข้าขวาง บิดแขนและแย่งแส้สั่งสอนทหารนายนั้น ทาร์คัสรีบเข้ามาห้าม ทว่าเฟดอมกลับเจาะจงมาหา \"ออร์บา\" โดยเฉพาะ และพาเข้าไปคุยในห้องทำงานของทาร์คัส\n- **การถอดหน้ากากเหล็กด้วยมนตรา:** เฟดอมประกาศว่าจะปลดปล่อยออร์บาจากการเป็นทาสและถอดหน้ากากออกให้ ออร์บาไม่ไว้ใจและเค้นถามเหตุผลที่แท้จริง ชายหนุ่มหน้าซีดข้างกายเฟดอมชื่อ **เฮอร์มานน์** (ซึ่งแท้จริงมีอายุมากและใช้มนตรา) ใช้ปลายนิ้วร่ายมนตร์ปลดคำสาปหน้ากากเหล็กที่สวมติดใบหน้าออร์บามา 2 ปีจนร่วงหล่นลงพื้น\n- **ใบหน้าที่สะท้อนในกระจก:** เมื่อหน้ากากหลุดออก ทหารหนุ่มของเฟดอมถึงกับตกใจทรุดตัวคุกเข่าคำนับคิดว่าเป็นองค์รัชทายาทกิล แม้แต่ออร์บาส่องกระจกก็พบว่าโครงหน้าตนเองเปลี่ยนไปเล็กน้อยตามอาคมมนตราจนกลายเป็นเงาสะท้อนดุจฝาแฝดของกิล เมฟิอุส\n- **ประกาศิตสวมรอยองค์รัชทายาท:** เฟดอมประกาศอย่างเป็นทางการว่านับจากนี้ ออร์บาไม่ได้เป็นทั้งออร์บาและไม่ได้เป็นทาสดาบอีกต่อไป แต่ได้ถือกำเนิดใหม่ในฐานะ **\"องค์รัชทายาทกิล เมฟิอุส\"** แห่งจักรวรรดิเมฟิอุส!\n\n### บทที่ 3.2: หน้ากากชิ้นใหม่ (2)\n- **ข้อตกลงและเรื่องแต่งของเฟดอม:** เฟดอมรีบนำตัวออร์บาออกจากค่ายทาร์คัสโดยคลุมหน้าไปคฤหาสน์ส่วนตัว (เฮอร์มานน์หายตัวไป) เฟดอมอ้างว่าเหตุที่ให้ออร์บาสวมหน้ากากเมื่อ 2 ปีก่อนเป็นเพราะออร์บาหน้าเหมือนองค์ชายจึงกลัวทำให้ราชวงศ์เสื่อมเสีย ส่วนที่เรียกมาเป็น \"ตัวตายตัวแทน\" ในงานอภิเษกสมรสครั้งนี้ อ้างว่าเพื่อป้องกันความเสี่ยงจากการลอบปลงพระชนม์ของกลุ่มต่อต้านการสงบศึก (โดยปิดบังความจริงเรื่องกิลถูกยิง) ออร์บายอมรับข้อตกลงแลกอิสรภาพและความปลอดภัยในฐานะคนในความอุปถัมภ์ของเฟดอม\n- **การฝึก 3 วันกับดินน์:** เฟดอมมอบหมายให้ **ดินน์** เด็กรับใช้ประจำตัว ฝึกฝนท่วงท่าการยืน เดิน และวิธีการยิ้มหัวเราะแบบเชื้อพระวงศ์ให้ออร์บาตลอด 3 วันก่อนวันงาน พร้อมจับออร์บาอาบน้ำ ตัดผม โกนหนวด และสวมอาภรณ์หรูหรา ออร์บานอนบนเตียงนุ่มและฝันถึงวัยเด็กที่เรียกหาพี่ชายโรอัน\n- **งานเลี้ยง ณ หุบเขาเซริน:** สถานที่จัดพิธีเป็นพระราชวังไม้และหินอ่อนที่ขุดเจาะเข้าไปในหน้าผาของหุบเขาเซริน เฟดอมกำชับให้ออร์บาห้ามคิด ห้ามมอง ห้ามทำอะไรนอกเหนือคำสั่ง ท่ามกลางแขกเหรื่อขุนนางที่มารุมล้อมแสดงความยินดีกับ \"องค์ชายกิล\" และโต๊ะอาหารหรูหราเหลือเฟือ ออร์บาเก็บซ่อนความเคียดแค้นต่อเหล่าขุนนางเมฟิอุสที่เคยปล้นเสบียงและเผาหมู่บ้านของตนไว้ใต้รอยยิ้มอย่างเยือกเย็นเพื่อรอวันเอาคืน\n- **เจ้าหญิงวิลีนาปรากฏโฉม:** บรรยากาศในโถงเปลี่ยนไปเมื่อ **เจ้าหญิงวิลีนา โอเวลล์** พระธิดาองค์ที่สามแห่งการ์เบรา เสด็จเข้ามาในชุดกระโปรงผ้าไหมสีขาวบริสุทธิ์พร้อมสตรีสูงวัย (เทเรเซีย) แม้รูปร่างจะดูบอบบางเยาว์วัยแต่อบอวลด้วยสง่าราศีและเสน่ห์อันน่าทึ่ง เฟดอมกระซิบสั่งให้ออร์บาเดินเข้าไปทักทายว่าที่คู่หมั้นอย่างสมพระเกียรติองค์ชายแห่งเมฟิอุส\n\n### บทที่ 3.3: หน้ากากชิ้นใหม่ (3)\n- **มุมมองของเจ้าหญิงวิลีนา:** วิลีนาเดินเข้าสู่โถงเลี้ยงพร้อมเทเรเซีย มีการแซวตลกร้ายเรื่องความป่าเถื่อนของขุนนางเมฟิอุส (ที่ตกใจเรื่องวิลีนาขับเรือเหาะเพราะวัฒนธรรมเมฟิอุสกดขี่สตรี ห้ามขี่ม้า/มังกร และต้องนุ่งยาวคลุมขา) และพูดถึงองค์ชายกิลว่ามีแต่ข่าวลือแย่ๆ เรื่องขี้ขลาดและเสเพล\n- **อดีตคู่หมั้นและการเสียสละเพื่อชาติ:** เดิมทีวิลีนาเคยหมั้นหมายกับ **ริวคอวน์** แม่ทัพเรือบรรทุกอากาศยานผู้เป็นวีรบุรุษสงคราม (ที่เคยพบกันตอน 9 ขวบและหมั้นตอน 13 ขวบ ซึ่งเขาเป็นคนขี้อายต่อหน้าเธอ) แต่เพราะสงครามสิบปียืดเยื้อจนบั่นทอนชาติ **กษัตริย์ไอนน์ โอเวลล์ที่ 2** พระบิดาจึงทรงขอร้องให้เธอแต่งงานกับกิลเพื่อความสงบสุข วิลีนาจึงยอมก้าวเข้าสู่ดินแดนศัตรูดุจอัศวินที่ออกศึกเพื่อปกป้องความทรงจำของเสด็จปู่จอร์จ\n- **การพบกันครั้งแรกของว่าที่บ่าวสาว:** วิลีนาสังเกตเห็นกิล (ออร์บา) ที่มีรูปร่างกำยำและดูดีเกินคาด แต่กลับมีขุนนางร่างอ้วน (เฟดอม) ประกบติดแจคอยกระซิบบอกบท และมีสายตาล่อกแล่กเหมือนเด็กหลงทาง วิลีนาจึงเป็นฝ่ายก้าวออกไปย่อตัวทำความเคารพทักทายก่อนเพื่อไม่ให้เขาเสียหน้า ส่วนออร์บาที่ประหม่าก็ตอบรับตะกุกตะกัก\n- **ประกายความคิดอันตรายของวิลีนา:** วิลีนาหงุดหงิดที่ว่าที่สามีดูไม่ได้เรื่อง แต่แล้วก็ฉุกคิดขึ้นมาได้ว่า—*หากองค์ชายเป็นคนหัวอ่อนแบบนี้ เธอก็สามารถชักใยบงการเขาได้ และกลายเป็นผู้กุมอำนาจเบื้องหลังเมฟิอุสเพื่อประโยชน์ของการ์เบรา!* นี่คือ \"การศึกที่ไร้การหลั่งเลือด\" ตามที่เสด็จปู่เคยสอนไว้ รอยยิ้มของวิลีนาจึงแปรเปลี่ยนเป็นความมุ่งมั่นดุดัน (มีเพียงเทเรเซียที่จับสังเกตได้) ขณะที่ออร์บาผู้ยังคงตึงเครียดยังคงพูดคุยเรื่อยเปื่อยโดยไม่รู้เลยว่าเจ้าสาวของตนกำลังคิดแผนการร้ายกาจอยู่ภายในใจ\n\n### บทที่ 4.1: ณ หุบเขาเซริน (1)\n- **ข้อสงสัยของไซมอนและโทสะของทาร์คัส:** ไซมอน ร็อดลูม แปลกใจที่เฟดอมซึ่งเป็นกลุ่มต่อต้านราชวงศ์กลับมาตามประกบติดกิลเหมือนแม่นม ทั้งที่กิลเคยเกลียดเฟดอมและเรียกลับหลังว่า \"ไอ้หมูตอนจอมบงการ\" ส่วนทาร์คัสเดือดดาลที่เฟดอมชุบมือเปิบซื้อตัวออร์บาไปดื้อๆ ทำให้ต้องเปลี่ยนคู่ประลองกะทันหัน โดยกิลเลียมเสียดายที่ยังไม่ได้ประลองกับออร์บา ส่วนโกเวนแอบสงสัยว่าออร์บาได้ไปใช้ชีวิตในอนาคตที่ตนวาดหวังไว้จริงหรือไม่\n- **ออร์บาและความแค้นในพิธีกรรม:** ออร์บาต้องนั่งนิ่งข้างวิลีนาหน้าแท่นบูชาหุบเขาเซรินท่ามกลางทหารองครักษ์และนักบวชที่เผากระดูกมังกรบูชาเทพมังกรริวจิน เขามองเห็นโอกาสในฐานะตัวแทนองค์ชายว่าจะได้พบหน้า **แม่ทัพอุบารี** เพื่อล้างแค้นให้หมู่บ้านและตามหาเบาะแสของแม่ อลิซ และพี่โรอัน\n- **การปะทะคารมและความเข้าใจผิดของวิลีนา:** วิลีนาพยายามชวนออร์บาคุยเพื่อหยั่งเชิง แต่ออร์บาตอบห้วนสั้นไร้น้ำใจจนวิลีนาแอบหงุดหงิด เมื่อศึกแกลดิเอเตอร์เริ่มต้นขึ้น ออร์บาเห็นพวกทาร์คัส โกเวน ชีค ก็เผลอยิ้มออกมาอย่างเป็นกันเอง แต่วิลีนาเข้าใจผิดคิดว่าเขายิ้มอย่างซาดิสม์ที่ได้เห็นทาสเข่นฆ่ากัน จึงยิ่งรังเกียจเขาเข้ากระดูกดำ\n- **มังกรคลุ้มคลั่งและมือปืนซุ่มยิง:** ในคู่ของชีคกับทาสหน้าใหม่ จู่ๆ มังกรโซซอสและไบอันหลายตัวเกิดพังกรงคลุ้มคลั่งออกมาไล่เหยียบทหารและแกลดิเอเตอร์แหลกเละ ลานประลองโกลาหล โฮวหลานวิ่งพยายามหยุดมังกรจนเกือบถูกเหยียบ ออร์บากำลังจะกระโจนไปชิงปืนมาช่วยหลาน แต่สัญชาตญาณเตือนภัยที่หน้าผากทำให้เขารีบมุดหลบใต้โต๊ะทันที—มี **มือปืนซุ่มยิง (Sniper)** เล็งสังหารลงมาจากฟากฟ้า และเสียงกระสุนปืนไรเฟิลก็ดังสนั่นก้องกังวาน!\n"
};

  <script>
    const STORAGE_PREFIX = "rakuin_no_monshou";
    const data = window.NOVEL_DATA || { novel_title: "ตราประทับเกียรติยศ (Rakuin no Monshou)", chapters: [], illustrations: [] };
    let currentIdx = parseInt(localStorage.getItem(STORAGE_PREFIX + "_ch_idx") || "0", 10);
    let fontSize = parseInt(localStorage.getItem("novel_reader_font_size") || "20", 10);
    let theme = localStorage.getItem("novel_hub_theme") || "dark";
    let currentVolIdx = 0;
    let illustViewMode = localStorage.getItem("novel_reader_illust_view") || "vertical";
    let currentLightboxIdx = 0;

    function goBookshelf() {
      if (location.protocol === "file:") {
        location.href = "../คลังนิยายทั้งหมด.html";
      } else {
        location.href = "../index.html";
      }
    }

    function formatBody(text) {
      const paras = text.split(/\n\s*\n/);
      return paras.map(p => {
        const trimmed = p.trim();
        if (!trimmed) return "";
        if (trimmed === "***" || trimmed === "...") return "<hr/>";
        const html = trimmed
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/\n/g, "<br/>");
        return `<p>${html}</p>`;
      }).join("");
    }

    function updateIllustButtonLabel() {
      const vols = data.illustrations || [];
      const total = vols.reduce((acc, v) => acc + ((v.images || []).length), 0);
      const btn = document.getElementById("btnIllust");
      if (btn) {
        btn.textContent = total > 0 ? `🖼️ ภาพประกอบ (${total})` : `🖼️ ภาพประกอบ`;
      }
    }

    function render() {
      document.getElementById("novelTitle").textContent = data.novel_title || "คลังนิยาย";
      updateIllustButtonLabel();
      const chapters = data.chapters || [];
      if (currentIdx >= chapters.length) currentIdx = Math.max(0, chapters.length - 1);

      const volSel = document.getElementById("volumeSelect");
      const sel = document.getElementById("chapterSelect");
      volSel.innerHTML = "";
      sel.innerHTML = "";

      const ch = chapters[currentIdx];
      if (!ch) {
        document.getElementById("volumeBadge").textContent = "";
        document.getElementById("chapterTitle").textContent = "ยังไม่มีตอนที่แปล";
        document.getElementById("chapterBody").innerHTML = "";
        return;
      }

      const volumes = [];
      chapters.forEach(item => {
        const v = item.volume || "เล่ม 1";
        if (!volumes.includes(v)) volumes.push(v);
      });
      volumes.forEach(v => {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = `📘 ${v}`;
        volSel.appendChild(opt);
      });

      const currentVol = ch.volume || "เล่ม 1";
      volSel.value = currentVol;
      volSel.style.display = volumes.length > 1 ? "" : "none";

      chapters.forEach((item, idx) => {
        if ((item.volume || "เล่ม 1") !== currentVol) return;
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = `${item.title}`;
        sel.appendChild(opt);
      });
      sel.value = currentIdx;

      document.getElementById("volumeBadge").textContent = `📘 ${currentVol}`;
      document.getElementById("chapterTitle").textContent = ch.title;
      document.getElementById("chapterBody").innerHTML = formatBody(ch.content);
      document.getElementById("pageIndicator").textContent = `${currentVol} • ตอนที่ ${currentIdx + 1} จากทั้งหมด ${chapters.length} ตอนที่แปลแล้ว`;

      const hasPrev = currentIdx > 0;
      const hasNext = currentIdx < chapters.length - 1;
      document.getElementById("btnPrevTop").disabled = !hasPrev;
      document.getElementById("btnPrevBottom").disabled = !hasPrev;
      document.getElementById("btnNextTop").disabled = !hasNext;
      document.getElementById("btnNextBottom").disabled = !hasNext;

      localStorage.setItem(STORAGE_PREFIX + "_ch_idx", String(currentIdx));
    }

    function selectVolume(volName) {
      const chapters = data.chapters || [];
      const firstIdx = chapters.findIndex(item => (item.volume || "เล่ม 1") === volName);
      if (firstIdx !== -1) {
        selectChapter(firstIdx);
      }
    }

    function selectChapter(idx) {
      currentIdx = parseInt(idx, 10);
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function prevChapter() { if (currentIdx > 0) selectChapter(currentIdx - 1); }
    function nextChapter() { if (currentIdx < (data.chapters || []).length - 1) selectChapter(currentIdx + 1); }

    function changeFont(delta) {
      fontSize = Math.max(14, Math.min(32, fontSize + delta));
      document.documentElement.style.setProperty("--font-size", fontSize + "px");
      localStorage.setItem("novel_reader_font_size", String(fontSize));
    }

    function setTheme(t) {
      theme = t;
      document.body.classList.remove("theme-sepia", "theme-light");
      if (t !== "dark") {
        document.body.classList.add("theme-" + t);
      }
      document.getElementById("tDark").classList.toggle("active", t === "dark");
      document.getElementById("tSepia").classList.toggle("active", t === "sepia");
      document.getElementById("tLight").classList.toggle("active", t === "light");
      localStorage.setItem("novel_hub_theme", t);
    }

    function toggleMenu(hide) {
      const shouldHide = typeof hide === "boolean"
        ? hide
        : !document.body.classList.contains("menu-hidden");
      document.body.classList.toggle("menu-hidden", shouldHide);
      localStorage.setItem("novel_reader_menu_hidden", shouldHide ? "1" : "0");
    }

    function openModal(type) {
      const m = document.getElementById("infoModal");
      const title = document.getElementById("modalTitle");
      const content = document.getElementById("modalContent");
      if (type === "glossary") {
        title.textContent = "📚 คัมภีร์ตัวละคร คำศัพท์ และสรรพนาม";
        content.textContent = data.glossary || "";
      } else {
        title.textContent = "🧠 เรื่องย่อสะสมแต่ละตอน";
        content.textContent = data.story_memory || "";
      }
      m.classList.add("open");
    }
    function closeModal() {
      document.getElementById("infoModal").classList.remove("open");
    }

    function openIllustModal() {
      const vols = data.illustrations || [];
      const firstWithImgs = vols.findIndex(v => (v.images || []).length > 0);
      if (firstWithImgs !== -1 && ((vols[currentVolIdx] || {}).images || []).length === 0) {
        currentVolIdx = firstWithImgs;
      }
      renderIllustModal();
      document.getElementById("illustModal").classList.add("open");
    }
    function closeIllustModal() {
      document.getElementById("illustModal").classList.remove("open");
    }
    function setIllustView(mode) {
      illustViewMode = mode;
      localStorage.setItem("novel_reader_illust_view", mode);
      renderIllustModal();
    }
    function selectIllustVol(idx) {
      currentVolIdx = idx;
      renderIllustModal();
    }
    function renderIllustModal() {
      const vols = data.illustrations || [];
      const tabList = document.getElementById("volTabList");
      const container = document.getElementById("illustContainer");
      document.getElementById("btnViewVertical").classList.toggle("active", illustViewMode === "vertical");
      document.getElementById("btnViewGrid").classList.toggle("active", illustViewMode === "grid");

      tabList.innerHTML = "";
      vols.forEach((v, idx) => {
        const count = (v.images || []).length;
        const btn = document.createElement("button");
        btn.className = idx === currentVolIdx ? "active" : "";
        btn.textContent = `📁 ${v.volume} (${count})`;
        btn.onclick = () => selectIllustVol(idx);
        tabList.appendChild(btn);
      });

      const activeVol = vols[currentVolIdx];
      const imgs = activeVol ? (activeVol.images || []) : [];

      if (!activeVol || imgs.length === 0) {
        const folderName = activeVol ? activeVol.volume : "เล่ม 1";
        container.innerHTML = `
          <div class="empty-illust-guide">
            <strong style="color: var(--accent); font-size: 16px;">💡 ยังไม่มีรูปภาพในโฟลเดอร์ "${folderName}"</strong>
            <p style="margin: 10px 0 6px;">วิธีเพิ่มภาพประกอบไลท์โนเวลแบบแยกตามเล่มง่ายๆ:</p>
            <ol style="margin: 0; padding-left: 22px;">
              <li>นำไฟล์รูปภาพ (<code>.jpg</code>, <code>.png</code>, <code>.webp</code>) ไปวางใส่โฟลเดอร์ <code>illustrations/${folderName}/</code> (หรือสร้างโฟลเดอร์ <code>เล่ม 1</code>, <code>เล่ม 2</code>, <code>เล่ม 3</code> เพิ่มได้ตามต้องการ)</li>
              <li>ตั้งชื่อไฟล์เรียงตามลำดับ เช่น <code>00_cover.jpg</code>, <code>01.jpg</code>, <code>02.jpg</code> ระบบจะเรียงรูปให้ตามตัวเลขและนำรูป cover ขึ้นเป็นหน้าปกให้เอง</li>
              <li>ดับเบิลคลิกไฟล์ <code>เปิดคลังนิยายทั้งหมด.bat</code> หรือ <code>เปิดอ่านนิยาย.bat</code> รูปทั้งหมดจะแสดงในหน้านี้ทันทีครับ!</li>
            </ol>
          </div>
        `;
        return;
      }

      const listClass = illustViewMode === "grid" ? "illust-list-grid" : "illust-list-vertical";
      container.innerHTML = `<div class="${listClass}">` + imgs.map((img, i) => `
        <div class="illust-card" onclick="openLightbox(${i})">
          <img src="${encodeURI(img.src)}" alt="${img.name}" loading="lazy" />
          <div class="illust-caption">${i + 1}. ${img.name}</div>
        </div>
      `).join("") + `</div>`;
    }

    function openLightbox(imgIdx) {
      const vols = data.illustrations || [];
      const imgs = (vols[currentVolIdx] || {}).images || [];
      if (!imgs.length) return;
      currentLightboxIdx = (imgIdx + imgs.length) % imgs.length;
      const item = imgs[currentLightboxIdx];
      document.getElementById("lightboxImg").src = encodeURI(item.src);
      document.getElementById("lightboxCaption").textContent = `[${vols[currentVolIdx].volume}] รูปที่ ${currentLightboxIdx + 1}/${imgs.length} — ${item.name}`;
      document.getElementById("lightbox").classList.add("open");
    }
    function stepLightbox(delta) {
      openLightbox(currentLightboxIdx + delta);
    }
    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("open");
    }

    document.addEventListener("keydown", (e) => {
      const lbOpen = document.getElementById("lightbox").classList.contains("open");
      if (lbOpen) {
        if (e.key === "ArrowLeft") stepLightbox(-1);
        if (e.key === "ArrowRight") stepLightbox(1);
        if (e.key === "Escape") closeLightbox();
        return;
      }
      if (e.key === "ArrowLeft") prevChapter();
      if (e.key === "ArrowRight") nextChapter();
      if (e.key === "m" || e.key === "M") toggleMenu();
      if (e.key === "Escape") {
        closeModal();
        closeIllustModal();
      }
    });

    document.documentElement.style.setProperty("--font-size", fontSize + "px");
    setTheme(theme);
    if (localStorage.getItem("novel_reader_menu_hidden") === "1") {
      toggleMenu(true);
    }
    render();
  </script>

  <div id="pinGateOverlay" style="display:none; position:fixed; inset:0; z-index:99999; background:#0f172a; color:#e2e8f0; flex-direction:column; align-items:center; justify-content:center; padding:20px; font-family:'Sarabun','Segoe UI',sans-serif;">
    <div style="background:#1e293b; border:1px solid #334155; border-radius:14px; padding:28px 26px; max-width:340px; width:100%; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.4);">
      <div style="font-size:38px; margin-bottom:8px;">🔒</div>
      <div style="font-size:18px; font-weight:bold; color:#38bdf8; margin-bottom:6px;">คลังนิยายส่วนตัว</div>
      <div style="font-size:13px; color:#94a3b8; margin-bottom:16px;">กรอกรหัส PIN เพื่อเข้าอ่าน (จำรหัสอัตโนมัติในเครื่องนี้)</div>
      <input id="pinGateInput" type="password" inputmode="numeric" placeholder="รหัส PIN..." style="width:100%; padding:10px 12px; font-size:18px; text-align:center; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#f8fafc; margin-bottom:12px;" onkeydown="if(event.key==='Enter') checkPinGate()" />
      <button onclick="checkPinGate()" style="width:100%; padding:10px; font-size:15px; font-weight:bold; border-radius:8px; border:none; background:#38bdf8; color:#020617; cursor:pointer;">เข้าสู่คลังนิยาย</button>
      <div id="pinGateErr" style="color:#f87171; font-size:13px; margin-top:10px; display:none;">❌ รหัส PIN ไม่ถูกต้อง</div>
    </div>
  </div>
  <script>
    (function() {
      const EXPECTED_PIN = "0909";
      if (localStorage.getItem("novel_hub_pin_ok") !== EXPECTED_PIN) {
        const gate = document.getElementById("pinGateOverlay");
        if (gate) gate.style.display = "flex";
      }
      window.checkPinGate = function() {
        const val = (document.getElementById("pinGateInput").value || "").trim();
        if (val === EXPECTED_PIN) {
          localStorage.setItem("novel_hub_pin_ok", EXPECTED_PIN);
          document.getElementById("pinGateOverlay").style.display = "none";
        } else {
          document.getElementById("pinGateErr").style.display = "block";
        }
      };
    })();
  </script>
</body>
</html>
