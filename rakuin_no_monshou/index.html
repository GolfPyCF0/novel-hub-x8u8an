      "id": "เล่ม 1/ch001_p3_th",
      "title": "บทที่ 1.3: เหล็กกล้าและโลหิต (3)",
      "content": "\"มาอยู่ที่นี่เองหรือ ออร์บา\"\n\nโรอันโผล่หน้าเข้ามาหาอย่างกะทันหัน\n\nออร์บาที่กำลังแหงนหน้ามองท้องฟ้ายามราตรีเบือนสายตาหนีไปอย่างเสียมารยาท เพื่อเป็นการลงโทษที่ละเลยหน้าที่ดูแลสัตว์เลี้ยงและหนีไปเที่ยวเล่น มารดาจึงสั่งงดอาหารมื้อเย็นของเขา และเวลานี้เขาก็กำลังนั่งกอดเข่างอนตุ๊บป่องอยู่ลำพังด้านนอกโรงนา ทั้งใบหน้าและหัวเข่าทั้งสองข้างที่เขาซุกหน้าลงไปล้วนเต็มไปด้วยรอยถลอกขีดข่วน\n\n\"ไปมีเรื่องชกต่อยมาอีกรึ?\"\n\n\"ก็ไม่เชิงหรอก\"\n\nออร์บาผู้มีนิสัยฉุนเฉียวง่ายมักทะเลาะวิวาทกับเด็กคนอื่นๆ ในละแวกบ้านอยู่เสมอ ถึงขั้นควงดาบไม้บุกตะลุยไปหาเรื่องถึงหมู่บ้านข้างเคียงก็เคยมาแล้ว ชาวบ้านที่บังเอิญเห็นร่างของเขาวิ่งห้อผ่านทุ่งนาจนเกือบจะคะมำไปข้างหน้า ต่างพากันพูดกลั้วหัวเราะอย่างเอ็นดูว่า\n\n\"โอ้ เจ้าออร์บาเอาจริงอีกแล้วเรอะ\" พลางโบกมือไล่หลังและคอยจับตาดูเขาอยู่ห่างๆ แน่นอนว่าหลังจากไปก่อเรื่องชกต่อยมาแล้ว มารดาของเขาก็ดุด่าว่ากล่าวไม่รู้จักจบสิ้น\n\n\"ทำไมถึงไม่เอาอย่างพี่ชายของเจ้าบ้างนะ\" นั่นคือประโยคที่นางมักจะพร่ำบ่นอยู่เป็นประจำ\n\nพี่ชายของเขาสามารถทำได้ทุกอย่าง ในสมัยก่อน พี่ชายเพียงแค่เปิดดูหนังสือเล่มเดียวที่บิดานำติดมือกลับมาตอนเดินทางกลับจากในเมืองไม่กี่ครั้ง ก็สามารถจดจำวิธีอ่านและเขียนตัวอักษรได้ด้วยตนเองทั้งหมด เขายังเรียนรู้วิธีคำนวณเลขขั้นพื้นฐานตั้งแต่อายุยังน้อยมาก และในช่วงวัยราวสิบขวบ หลังจากไปอ้อนวอนขอให้พ่อค้าจากในเมืองรับเข้าทำงานเป็นผู้ช่วย เขาก็ช่วยหาเงินมาจุนเจือค่าครองชีพของครอบครัวอันยากจนข้นแค้นได้อีกด้วย\n\nในทางกลับกัน ออร์บาแม้จะร่ำเรียนการอ่านเขียนตัวอักษรมาจากพี่ชาย ทว่ากลับห่วยแตกเรื่องการคิดเลขอย่างที่สุด และเหนือสิ่งอื่นใด เขาไม่รู้ว่าจะจัดการอย่างไรกับเลือดที่เดือดพล่านร้อนระอุอยู่ในกาย\n\nเกือบทุกค่ำคืน เขามักนอนตาค้างจ้องมองเพดานอยู่นานนับชั่วโมง เลือดในกายของเขามักกรีดร้องกึกก้องอยู่ในความมืดเสมอ หลังจากการชกต่อยและทะเลาะวิวาท ความเจ็บแปลบของบาดแผลดูราวกับจะเอ่อล้นทะลักออกมาพร้อมกับเลือดสีดำที่ทั้งร้อนระอุและเจ็บปวดยิ่งกว่าจากส่วนลึกภายใน ประหนึ่งมันพร้อมจะพุ่งกระโจนออกมาสู่โลกภายนอกเสียให้ได้\n\nในยามนั้น เขามักจะดีดตัวลุกขึ้นยืนแล้วก้าวเท้าออกไปด้านนอก จากนั้นก็หยิบดาบไม้ที่วางพิงโรงนาเอาไว้ขึ้นมา ไม่ว่ามันจะถูกมารดาริบเอาไปทิ้งสักกี่ครั้ง เขาก็จะลงมือเหลาดาบไม้เล่มใหม่ขึ้นมาเองตั้งแต่ต้นเสมอ และไม่ใช่เรื่องแปลกเลยที่เขาจะกวัดแกว่งดาบไม้อยู่อย่างนั้นจนกระทั่งรุ่งสางมาเยือน\n\n\"จะมีเรื่องชกต่อยบ้างก็ไม่เป็นไรหรอก\" โรอันเอ่ยพลางทรุดตัวลงนั่งเคียงข้างออร์บา \"แต่เจ้าต้องช่วยงานท่านแม่ให้เรียบร้อยด้วย การต้องทำงานหนักเพียงลำพังสำหรับผู้หญิงคนเดียวมันเหนื่อยยากมากนะ เจ้าเองก็รู้ใช่ไหม?\"\n\nตามแนวชายแดนทางตอนใต้ของจักรวรรดิเมฟิอุส มีสถานที่แห่งหนึ่งซึ่งผู้คนเรียกขานกันติดปากว่า หุบเขาแห้งแล้ง แม้หุบเขาที่แม่น้ำเหือดแห้งไปจะนับเป็นภูมิประเทศที่พบเห็นได้ทั่วไปในเมฟิอุส ทว่าหมู่บ้านยากจนกลางดินแดนอันแห้งแล้งกันดารแห่งนี้—ซึ่งแม้แต่ชื่อก็ยังไม่ปรากฏจารึกอยู่บนแผนที่ฉบับใดเลย—คือสถานที่ที่ออร์บาเติบโตขึ้นมา\n\nออร์บาแทบไม่มีความทรงจำเกี่ยวกับบิดาหลงเหลืออยู่นัก บิดาเสียชีวิตไปตั้งแต่เขายังอายุเพียงสองหรือสามขวบ ระหว่างที่กำลังทำงานก่อสร้างต่อเติมให้แก่ป้อมอัปตาซึ่งทำหน้าที่ปกป้องแนวชายแดนทางทิศใต้ของหมู่บ้าน บิดาของเขาโชคร้ายตกเป็นเหยื่อของเหตุการณ์ดินถล่มขณะกำลังขุดเจาะทะลุหน้าผา การเจาะสกัดเข้าไปในหน้าผาชันของหุบเขาแทนการปลูกสร้างบ้านเรือนหรืออาคารนับเป็นเรื่องปกติที่พบเห็นได้บ่อยในเมฟิอุส และบิดาของเขาก็เป็นคนงานก่อสร้างประเภทนั้นนั่นเอง\n\n\"พ่อของเจ้าเป็นชายที่เกิดมาเพียงเพื่อขุดหลุมมืดๆ ลงไปในผืนดินเท่านั้น\"\n\nเขาจำได้ว่าวันหนึ่ง มารดาเคยเอ่ยถ้อยคำนั้นออกมาด้วยน้ำเสียงที่มิได้เจือแววตัดพ้อหรือโศกเศร้าเสียใจแต่อย่างใด เมื่อกล่าวถึงเรื่องนั้นแล้ว มารดาของเขาเองก็เป็นผู้หญิงที่ไร้ซึ่งความรื่นรมย์ในชีวิตเช่นกัน นางเอาแต่ตรากตรำทำงานหนักตั้งแต่เช้ายันค่ำทุกวี่ทุกวัน นางไถพรวนผืนนาอันแห้งแล้ง นำเสื้อผ้าพื้นเมืองและผ้าขนหนูที่ทอขึ้นเองไปขายที่เมืองอัปตาเดือนละครั้ง และเคี่ยวสตูอันจืดชืดไร้รสชาติให้ลูกชายตัวน้อยทั้งสองกินอยู่ทุกวันโดยไม่เคยปริปากบ่นหรือเหน็ดเหนื่อย\n\nออร์บาเองก็ปล่อยให้ชีวิตดำเนินผ่านไปอย่างไร้ซึ่งความเปลี่ยนแปลงหรือสีสันใดๆ เช่นเดียวกัน โดยมีสิ่งเดียวที่พอจะนับเป็นความสุขได้ก็คือยามพี่ชายเดินทางกลับมาพักผ่อนที่บ้านเดือนละสองหรือสามครั้ง พร้อมกับหอบหิ้วหนังสือหลากหลายชนิดติดมือมาฝากด้วย\n\nหนังสือที่เขียนถึงโลกยุคเก่าครั้งที่มนุษยชาติเคยโผบินออกจากรัง หนังสือว่าด้วยเรื่องราวของจอมราชาเวทมนตร์ โซเดียส และเหนือสิ่งอื่นใด นิยายอิงประวัติศาสตร์ที่มีภาพประกอบสีสันงดงามหรือตำนานวีรบุรุษ ล้วนดึงดูดให้ออร์บาจมดิ่งลงไปในโลกเหล่านั้นจนหมดสิ้น เหล่าวีรบุรุษผู้กล้าที่กวัดแกว่งคมดาบเพื่อกอบกู้อาณาจักรซึ่งเต็มไปด้วยภยันตราย หญิงสาวแรกรุ่นโฉมงามในอาภรณ์บางเบาที่ถูกจองจำอยู่บนหอคอยสูงเสียดฟ้า มังกรร้ายที่ฟื้นคืนชีพขึ้นมาจากซากโบราณสถาน—เรื่องราวที่ทั้งชีวิตนี้เขาไม่มีวันได้พานพบ และการผจญภัยอันตระการตามากมายในโลกเหล่านั้นทำให้ออร์บาหลงใหลจนถอนตัวไม่ขึ้น ทว่าทุกคราวที่ปิดหน้าหนังสือลง การต้องกลับมายืนอยู่ในความเป็นจริงอันคับแคบและน่าสมเพชรอบกายกลับมีแต่จะยิ่งตอกย้ำให้เขาสิ้นหวัง\n\nเขาถวิลหาวันวานในอดีตกาล เฉกเช่นยุคสมัยที่เหล่าคนเถื่อนผู้กวัดแกว่งดาบยาวเคยก้าวขึ้นเป็นราชา ทว่าความจริงอันโหดร้ายก็คือ นับตั้งแต่ลืมตาดูโลก ชะตากรรมก็ลิขิตไว้อยู่แล้วว่าออร์บาจะต้องใช้ชีวิตซดน้ำครำขุ่นคลั่กไปจนตาย และหากเขาปรารถนาจะทำสิ่งที่ยิ่งใหญ่กว่านี้ในอนาคต มันก็คงยากเย็นแสนเข็ญยิ่งกว่าการชุบชีวิตคนตายให้ฟื้นคืนชีพเสียอีก\n\n\"นี่พี่...\" ออร์บาเอ่ยขึ้นพลางซุกลงระหว่างหัวเข่าที่มีสองแขนกอดรัดไว้ \"ข้ารู้สึกอยากทำอะไรที่มันมากกว่านี้\"\n\n\"เจ้ายังอายุไม่ถึงสิบขวบเลยด้วยซ้ำไม่ใช่รึ? มานั่งกังวลเรื่องพรรค์นั้นมันไม่สมกับวัยเจ้าเอาเสียเลยนะ\"\n\n\"ข้าพูดจริงจังนะ ดูพวกผู้ใหญ่ที่นี่ทุกคนสิ อีกไม่กี่ปีข้างหน้าตัวข้าเองก็ต้องกลายเป็นแบบนั้นเหมือนกัน วันแล้ววันเล่า เอาแต่ทำงานและทำงาน แต่ชีวิตก็ไม่เคยสบายขึ้นเลยสักนิด อีกหน่อยข้าก็คงแต่งงานกับใครสักคน มีลูกเกิดมา และถ้าลูกของข้าเกิดเป็น 'เด็กดื้อ' เหมือนข้า วันหนึ่งมันก็คงต้องพูดออกมาแน่ว่าอยากเข้าไปในเมือง อยากเป็นทหารให้เมฟิอุส หรืออยากขับเรือเหาะของการ์เบรา แล้วข้าก็คงพูดอะไรทำนองว่า 'โอ้ สมัยก่อนพ่อของเจ้าเองก็เคยมีความฝันแบบนั้นเหมือนกันนั่นแหละ' จากนั้นข้าก็คงนั่งหัวเราะร่วมไปกับผู้ใหญ่คนอื่นๆ พลางจิบน้ำชาไปวันๆ\"\n\n\"ใครๆ ก็เป็นแบบนั้นกันทั้งนั้นแหละ\" โรอันหัวเราะเบาๆ ท่ามกลางแสงจันทร์นวลผ่องที่อาบไล้ลงมา\n\nในช่วงเวลานี้ของทุกคืน มักจะได้ยินเสียงขับร้องเพลงลอยแว่วมาจากบ้านฝั่งตรงข้ามถนนเสมอ ขณะฟังเสียงรื่นเริงของบรรดาชายฉกรรจ์ที่กำลังเมามาย แม้ไม่ได้ตั้งใจฟังมากนัก แต่เขาก็เอ่ยขึ้นว่า\n\n\"ไม่มีใครรู้ล่วงหน้าหรอกว่าตนเองจะเติบโตไปเป็นคนแบบไหน มีทั้งคนที่อยู่ไม่ได้หากไม่ได้ตรากตรำทำงานหนักทุกวัน คนที่ล่องเรือฝ่าฟันเกลียวคลื่นบ้าคลั่ง นักปราชญ์ชราที่ฝังตัวเองจมอยู่ในตำราอายุพันปี เหล่านักบวชแห่งบาดีนผู้เผยแผ่สัจธรรมแก่ศาสนิกชนนับไม่ถ้วน แม่ทัพเลื่องชื่อมากมายที่ทะยานเหินไปบนฟากฟ้าด้วยเรือรบศิลามังกร และกระทั่งผู้นำประเทศผู้สยบดินแดนมากมายไว้แทบเท้า สิ่งที่พวกเขาทำในหนึ่งวันอาจแตกต่างกันอย่างน่าประหลาดใจ ไม่ว่าพวกเขาจะย้อมคมดาบให้ชุ่มโชกด้วยโลหิต จมดิ่งอยู่ในตัวอักษร หรือแม้แต่พร่ำสวดขานพระนามของพระเจ้า แต่พี่คิดว่าแม้แต่คนเหล่านั้นก็ไม่อาจมอบคำตอบให้เจ้าได้หรอก\"\n\n\"คนพวกนั้นไม่เคยคิดถึงความเป็นอยู่ของพวกเราหรอก แม้แต่พระราชาที่รายล้อมไปด้วยความหรูหราฟุ่มเฟือยชนิดที่ทั้งชีวิตข้าก็ไม่มีปัญญาหาเงินมาซื้อได้ และยัดอาหารเลิศรสลงกระเพาะอยู่ทุกค่ำคืน บางครั้งพระองค์ก็ยกทัพใหญ่ไปออกศึก หรืออาจตกใจกับเรื่องการทรยศหักหลัง แต่ในทุกๆ วันพระองค์ก็ยังมีชีวิตอยู่หรูหรา ข้าคิดภาพการใช้ชีวิตแบบนั้นไม่ออกเลยสักนิด ข้าไม่มีวันทำแบบนั้นได้แน่ ทั้งพระราชาและพวกขุนนางไม่มีทางจินตนาการออกด้วยซ้ำว่าในความฝันของพวกเรามีอะไรอยู่บ้าง คนพวกนั้นน่ะ... ใช่ อย่างคืนนี้เป็นต้น พวกเขายังไม่คิดเลยด้วยซ้ำว่ากำลังแหงนหน้ามองดวงจันทร์ดวงเดียวกันกับที่ข้ามองอยู่\"\n\n\"ก็น่าคิดนะ แต่อาจเป็นเพราะพระราชาต้องใช้ชีวิตทุกวันแบบนั้นนั่นแหละ บางครั้งพระองค์จึงอาจรู้สึกโหยหาการใช้ชีวิตธรรมดาอยู่ข้างนอกเมืองก็ได้ บางที เพื่อหลีกหนีจากชีวิตอันแสนอึดอัดคับแคบภายในราชสำนัก พระองค์อาจอยากแอบออกไปร้านเหล้ากลิ่นเหม็นเปรี้ยวสักแห่ง แล้วเมามายจมอยู่กับเหล้าราคาถูก นั่งฟังเรื่องเล่าไร้สาระ คงจะเบื่อหน่ายเต็มทนที่ในทุกๆ วันไม่อาจลดการระแวดระวังตัวลงได้เลยแม้แต่กับสายเลือดเดียวกัน และพระองค์ก็คงจะคิดขึ้นมาว่า 'อา มันจะง่ายดายสบายใจแค่ไหนกันหนอ หากได้ใช้ชีวิตเรียบง่ายแค่ทำงานจนเหงื่อโทรมกาย โดยไม่ต้องมานั่งหวาดระแวงว่าจะถูกลอบปลงพระชนม์อีกต่อไป?'\"\n\n\"นั่นมันก็แค่เรื่องเพ้อเจ้อเท่านั้นแหละ พี่หมายความว่าพระองค์ทรงโหยหาชีวิตแบบพวกเราอย่างนั้นรึ? ก็แค่เพราะไม่เคยรู้ซึ้งถึงความยากลำบากและความไม่มั่นคงของชีวิตแบบนี้น่ะสิ เลยคิดเพ้อฝันขึ้นมาตามอารมณ์ชั่ววูบ\"\n\n\"ถูกต้อง นั่นไม่ใช่สิ่งที่พี่เพิ่งพูดไปหรอกหรือ? ไม่มีมนุษย์คนใดบนโลกนี้ที่เข้าใจทุกสิ่งทุกอย่าง รู้ว่าตนเองต้องการสิ่งใดอย่างแท้จริง หรือรู้จักตัวตนที่แท้จริงของตนเองหรอก พี่คิดว่าทุกคนต่างก็โหยหาสิ่งที่ตนเองไม่รู้จัก สิ่งที่ตนเองไม่เคยได้สัมผัส และต่างก็กำลังเสาะแสวงหาว่าหนทางที่แท้จริงของตนทอดยาวไปทางไหนกันแน่ ในแง่นี้ พวกเขาก็ไม่ได้แตกต่างไปจากพวกเราเลยสักนิด\"\n\n\"ไม่รู้สิ ถ้าอย่างนั้น พี่กำลังจะบอกว่าแม้แต่พระราชา แม้แต่พระสังฆราชผู้ยิ่งใหญ่ ก็ยังเป็นคนที่ไม่รู้จักคำว่าพึงพอใจอย่างสมบูรณ์งั้นหรือ?\"\n\nทว่าในจังหวะที่พี่ชายกำลังจะอ้าปากตอบคำถามนั้นเอง...\n\n\"ทำไมถึงมานั่งคุยเรื่องเข้าใจยากพรรค์นี้กันอยู่อีกล่ะ?\"\n\nจู่ๆ อลิซก็ปรากฏตัวขึ้น เส้นผมสีน้ำตาลเข้มของนางปลิวไสวเบาๆ ตามจังหวะก้าว ในตอนนั้นเองที่ทั้งสองเพิ่งสังเกตว่าเสียงร้องเพลงจากบ้านฝั่งตรงข้ามเงียบเสียงลงไปจนหมดสิ้นแล้ว ดูเหมือนเด็กสาวจะเพิ่งออกมาตามตัวทั้งคู่ให้กลับเข้าไปนอนเสียที\n\nแม้ดูเหมือนนางจะแอบได้ยินบทสนทนาเพียงแค่เสี้ยวเดียว แต่อลิซก็แย้มยิ้มจนเกิดรอยบุ๋มลักยิ้มตรงพวงแก้ม\n\n\"ท้ายที่สุดแล้ว มันก็เป็นแค่เรื่องไร้สาระไม่มีแก่นสารเท่านั้นแหละ บนโลกใบนี้ ไม่ว่าเจ้าจะมาจากที่ไหน อย่างแรกเลยนะออร์บา เจ้าต้องเริ่มต้นจากการดูแลท่านแม่ให้ดีและขยันขันแข็งทำงาน เพื่อที่วันพรุ่งนี้เจ้าจะได้มีข้าวตกถึงท้องเสียก่อน\"\n\n\"ได้ยินไหมพี่? เวลาที่ไม่ได้สนใจเรื่องที่คุยกัน พวกผู้หญิงก็จะรีบหาว่าเรื่องนั้นมันเข้าใจยาก ไร้สาระ หรือไม่ก็อ้างว่ามีเรื่องอื่นที่สำคัญกว่าให้ทำทันทีเลย\"\n\n\"อันนั้นเองก็เป็นความจริงเหมือนกันแฮะ\" โรอันหัวเราะร่าอย่างอารมณ์ดี\n\nอลิซอายุน้อยกว่าพี่ชายของเขาสองปี และแก่กว่าออร์บาสามปี และสมัยที่ออร์บายังเด็กกว่านี้ พวกเขาทั้งสามก็วิ่งเล่นด้วยกันราวกับอลิซเป็นพี่สาวแท้ๆ ในกลุ่มพี่น้อง\n\nหลังจากนั้นไม่นาน ทั้งสามก็พากันรำลึกถึงความทรงจำในวันวานอย่างสนุกสนาน ไม่ว่าจะเป็นคราวที่อลิซชวนกันไปตกปลาที่แม่น้ำ แล้วเจ้าตัวดันลื่นไถลบนโขดหินจนเกือบจมน้ำตาย หรือคราวที่พากันไปแอบดูม้าของกองคาราวานซึ่งเดินทางมาถึงหมู่บ้าน แล้วออร์บาดันก่อเรื่องแอบปีนขึ้นไปขี่มันจนม้าตื่นตกใจอาละวาดไปทั่ว หรือตอนที่เด็กชายจากหมู่บ้านใกล้เคียงโม้ว่าตนเอง 'เห็นมังกรป่า' ทั้งสามคนจึงดั้นด้นเดินไปยังสถานที่ตามคำร่ำลือจนหลงทางหัวหมุนอยู่ในเส้นทางสลับซับซ้อนของหุบเขาลึก แม้สุดท้ายจะประคองตัวกลับถึงบ้านได้ในยามดึกดื่น แต่ทั้งสามคนก็ต้องก้มหน้ารับชะตากรรมถูกดุด่าจนหูชาไปตามๆ กัน...\n\n\"จะว่าไป ทั้งหมดนั่นไม่ใช่เพราะเจ้าดั๊กจากหมู่บ้านนั้นมันหลอกพวกเราหรอกเหรอ? นับตั้งแต่นั้นมา เจ้าก็เลยไม่ถูกชะตากับมันมาตลอดเลยใช่ไหมล่ะ? แม้แต่คู่ชกของเจ้าในวันนี้ก็ด้วย...\"\n\n\"หุบปากน่า\"\n\nเมื่อถูกจี้ใจดำเข้าเต็มเปา ออร์บาก็สะบัดหน้าหนีไปอีกทาง แม้สาเหตุที่เขาไปหาเรื่องชกต่อยกับเจ้าดั๊กทั้งหมดนั้นจะเป็นเพราะอลิซก็ตาม แต่เขาก็ไม่เคยหลุดปากพูดเรื่องนี้ออกมาเลยสักครั้ง\n\nทว่าในขณะที่พวกเขาหัวเราะร่าและรำลึกความหลังร่วมกันตลอดทั้งค่ำคืนเช่นนั้น มันกลับกลายเป็นครั้งสุดท้ายที่เขาได้พูดคุยกับพี่ชายอย่างสงบสุข\n\nในยุคนั้น จักรวรรดิเมฟิอุสและอาณาจักรการ์เบรากำลังทำสงครามห้ำหั่นกันอยู่ก่อนแล้ว มีข่าวลือว่ากองทหารม้าของการ์เบราเพิ่งยกทัพข้ามแนวชายแดนเข้ามา แม้ทั้งสองประเทศจะมีประวัติศาสตร์การปะทะกันซ้ำแล้วซ้ำเล่ามาช้านานเกี่ยวกับการปักปันเขตแดนที่ชัดเจนก็ตาม ป้อมอัปตาทางตอนใต้ซึ่งตั้งอยู่ไม่ไกลจากหมู่บ้านของออร์บานัก ก็เคยตกเป็นเป้าการโจมตีจากกองทหารม้าของฝ่ายการ์เบรามาแล้วหลายต่อหลายครั้ง\n\nในท้ายที่สุด การ์เบราก็ยอมถอดใจจากการบุกยึดป้อมอัปตาซึ่งๆ หน้าเป็นการชั่วคราว และหันไปหมายตาโจมตีอีกฝ่ายผ่านเส้นทางอื่นแทน นั่นก็คือการวางกับดักลวง พวกมันเล็งจังหวะในยามที่กำลังพลส่วนใหญ่ซึ่งประจำการอยู่ในป้อมอัปตาถูกเรียกถอนทัพกลับไปยังเมืองหลวงจักรวรรดิ แล้วจึงยกกำลังเข้าปิดล้อมป้อมเอาไว้ทันที\n\nแน่นอนว่าป้อมอัปตาจำต้องถูกบีบให้เข้าสู่ศึกป้องกันอันแสนสิ้นหวัง และเมื่อสถานการณ์แปรเปลี่ยนเป็นการยื้อเวลาเพื่อรอคอยกองหนุนจากเมืองหลวงจักรวรรดิ กองทัพเมฟิอุสจึงลงมือเกณฑ์ไพร่พลจากหมู่บ้านโดยรอบอย่างบังคับขืนใจ และโรอัน พี่ชายของออร์บาก็เป็นหนึ่งในผู้ถูกเกณฑ์ตัวไปด้วย\n\nแน่นอนว่ามารดาของเขากรีดร้องไห้แทบขาดใจ หากจะมีเพียงความหวังเดียวที่มารดายอมตรากตรำทำงานหนักอยู่ท่ามกลางชีวิตอันไร้สีสันนี้ ก็คงจะเป็นตัวพี่ชายของเขานั่นเอง แม้นางจะโผเข้ากอดรั้งร่างของนายทหารที่พยายามจะพรากตัวลูกชายคนโตไป ทว่าโรอันกลับวางมือลงบนไหล่ของนางอย่างอ่อนโยนพลางเอ่ยปลอบว่า\n\n\"ไม่เป็นไรหรอกครับ อีกไม่นานกำลังเสริมจากเมืองหลวงจักรวรรดิก็จะยกมาช่วยแล้ว ระหว่างนั้นก็อดทนรอหน่อยนะครับ\"\n\nอีกอย่าง ค่าตอบแทนก็ดีกว่าการเป็นผู้ช่วยพ่อค้าตั้งเยอะ เขากล่าวเสริมพลางหัวเราะเบาๆ\n\nออร์บาที่ยืนอยู่เคียงข้างอลิซเฝ้ามองส่งพี่ชาย จ้องมองแผ่นหลังของชายหนุ่มชาวบ้านหลายคนซึ่งกำลังเดินข้ามแนวชั้นหินที่ซ้อนทับกันออกไป\n\nถ้าเพียงแต่ข้าตัวโตกว่านี้อีกสักหน่อย ออร์บาคิด ข้าก็คงได้เดินทางไปประจำการที่ป้อมปราการแทนพี่ชายแล้ว ถ้าเป็นแบบนั้น ท่านแม่ก็คงไม่ต้องเศร้าโศกเสียใจขนาดนี้ แถมข้าอาจถึงขั้นได้สร้างผลงานอันโดดเด่นท่ามกลางเหล่าทหารเลยก็ได้\n\nหลังจากพี่ชายจากไป มารดาผู้เคยทุ่มเทให้กับการทำงานหนักมาตลอด กลับใช้เวลาเกือบตลอดทั้งวันหมดไปกับการสวดภาวนา ราวกับมีบางสิ่งบางอย่างภายในจิตใจของนางได้แตกสลายลงไปอย่างสิ้นเชิง แม้ในบางคราวนางจะนึกขึ้นได้และลุกไปยืนในครัวเพื่อจัดเตรียมมื้ออาหาร ทว่าเมื่อนึกถึงรายการอาหาร นางกลับทำราวกับพี่ชายโรอันกำลังจะเดินทางกลับมาจากในเมือง จึงลงมือปรุงแต่อาหารจานโปรดของเขาเท่านั้น ทว่าเมื่อตระหนักได้ในภายหลังว่าเขาไม่มีวันมานั่งร่วมโต๊ะอาหารได้อีกแล้ว มารดาของเขาก็กวาดอาหารทั้งหมดทิ้งลงหลังบ้านไปเสียสิ้น\n\nในระหว่างนั้น ออร์บาก็ลงมือไถพรวนผืนนาที่ถูกปล่อยปละละเลย และดูแลสัตว์เลี้ยงจำนวนน้อยนิดของครอบครัวเพียงลำพัง ยามเย็น ออร์บามักจะปีนขึ้นไปบนทางเดินแคบๆ ที่สกัดเจาะไว้ตามหน้าผาและจ้องมองตรงไปยังทิศทางของเมืองหลวงจักรวรรดิอยู่เสมอ คอยมองหาแถวขบวนของชุดเกราะอันวิจิตรงดงาม เมฆฝุ่นขนาดมหึมาจากฝูงมังกรศึกยามเคลื่อนพล และรูปทรงอันน่าเกรงขามของเรือรบศิลามังกร—ทว่าเขาไม่เคยได้เห็นภาพที่เฝ้ารอคอยเลยสักครั้ง\n\nและแล้ว เมื่อเวลาผ่านไปราวสามสัปดาห์นับจากวันที่พี่ชายจากไป ชาวบ้านจากอีกหมู่บ้านหนึ่งที่อยู่ถัดจากหุบเขา—ซึ่งตั้งอยู่ใกล้กับป้อมปราการมากกว่าหมู่บ้านของพวกเขา—ต่างพากันวิ่งกระหืดกระหอบเข้ามาด้วยอาการหอบหายใจไม่ทัน\n\n\"ป้อมปราการแตกแล้ว!\"\n\nพวกเขานำข่าวร้ายที่สุดมาแจ้ง\n\nป้อมอัปตาพ่ายแพ้แตกพ่ายลงต่อกองทัพการ์เบราที่รุกคืบเข้ามาแล้ว พวกเขาเล่าว่าบรรดาผู้บัญชาการและเสนาธิการหลักที่ทำหน้าที่พิทักษ์ป้อมต่างชิงหลบหนีเอาตัวรอดกันไปก่อน โดยทอดทิ้งเหล่าทหารชั้นผู้น้อยเอาไว้เบื้องหลัง ไม่มีกำลังหนุนจากเมืองหลวงจักรวรรดิส่งมาถึงอัปตาเลยแม้แต่นายเดียว เพราะกองหนุนทั้งหมดถูกส่งไปประจำการยังปราการธรรมชาติแห่งบิรัคซึ่งตั้งอยู่ติดกับหุบเหวลึกขึ้นไปทางทิศเหนือแทน ดูเหมือนเมืองหลวงจักรวรรดิจะตัดสินใจไว้ล่วงหน้าแล้วว่าที่นั่นต่างหากคือหัวใจหลักของแนวป้องกันชายแดนทางใต้ ป้อมอัปตาถูกใช้เพียงเพื่อถ่วงเวลาเท่านั้น\n\nและสำหรับดินแดนที่คั่นกลางอยู่ระหว่างนั้น กองกำลังของการ์เบราที่ตั้งค่ายยึดป้อมปราการไว้ได้เริ่มออกอาละวาดปล้นสะดมหมู่บ้านโดยรอบแล้ว เกิดการปล้นชิงและทำร้ายร่างกายเข่นฆ่า—พูดง่ายๆ ก็คือการออกปล้นเสบียงและทำลายล้างนั่นเอง\n\nชาวบ้านในหมู่บ้านต่างเร่งรีบเก็บกวาดข้าวของมีค่าอันน้อยนิดของตน แม้จะแทบไม่มีอาหารเหลือเฟือเพราะใกล้ฤดูเก็บเกี่ยวและทำได้เพียงหอบหิ้วพืชผลเท่าที่มีติดตัว แล้วพากันอพยพทิ้งหมู่บ้านไปอย่างโกลาหล ผู้ที่มีคนรู้จักอยู่ในละแวกใกล้เคียงต่างรีบมุ่งหน้าไปขออาศัย ส่วนผู้ที่ไร้ที่พึ่งพิงก็พากันเข้าไปหลบซ่อนตัวชั่วคราวตามซอกหลืบของหุบเขา จนกว่าพวกทหารการ์เบราจะถอนตัวออกไปจากหมู่บ้าน\n\nแน่นอนว่าออร์บาก็เดินตามฝูงชนเหล่านั้นไป ทว่าในระหว่างที่กำลังหลบหนีอยู่นั้นเอง เขากลับสังเกตเห็นว่ามารดาของตนไม่ได้อยู่ในกลุ่มด้วย\n\nออร์บาตกใจจนแทบสิ้นสติ รีบหันหลังวิ่งย้อนกลับไปยังหมู่บ้านทันที เบื้องหน้าแนวโขดหินที่ตั้งตระหง่านเหนือพื้นที่ราวกับเนินเขา เขาสามารถมองเห็นทิวทัศน์ทั้งหมดของหมู่บ้านตนเองที่กำลังจมหายลงไปในม่านหมอกยามเย็น แน่นอนว่านางยังคงอยู่ที่นั่น นางกำลังรอคอยให้พี่ชายของเขากลับมา รอคอยพี่ชายที่อาจจะไม่มีวันหวนคืนกลับมาอีกตลอดกาล\n\n\"ออร์บา จะไปไหนน่ะ? ออร์บา!\"\n\nท่ามกลางเสียงตะโกนร้องเรียกของอลิซที่ดังไล่หลังมา เขาแหวกฝูงชนออกไปและวิ่งย้อนกลับไปอย่างไม่คิดชีวิต\n\nและเมื่อเขาดั้นด้นมาถึงจุดหมายได้สำเร็จ ภายในหมู่บ้านกลับไม่มีผู้คนหลงเหลืออยู่เลยแม้แต่เงาเดียว หมู่บ้านทั้งแห่งเงียบสงัดราวกับความตาย และเพราะคุ้นเคยกับทิวทัศน์เบื้องหน้าเป็นอย่างดี ความเงียบงันนั้นจึงแฝงความน่าขนลุกประหนึ่งเขาได้พลัดหลงเข้ามาในอีกมิติหนึ่งแทน\n\nจากอีกฟากหนึ่งของหุบเขา เขาสามารถมองเห็นขบวนคนและม้ากลุ่มหนึ่งกำลังเคลื่อนใกล้เข้ามา ออร์บาจึงรีบวิ่งตรงไปยังบ้านของตนอย่างร้อนรน ครั้นผลักเปิดประตูหลังบ้านออก มารดาของเขาก็อยู่ที่นั่นจริงๆ นางกำลังง่วนอยู่กับการเตรียมมื้ออาหารตามปกติ\n\n\"โรอันหรือจ๊ะ?\" มารดาเอ่ยถามพลางหันกลับมา ทว่าเมื่อสายตาของนางจับจ้องลงบนร่างที่ชุ่มโชกไปด้วยเหงื่อของออร์บา นางกลับยักไหล่ลงอย่างน่าอัศจรรย์ใจ \"ยังมัวไปเที่ยวเล่นอยู่อีกหรือจ๊ะ ออร์บา? มาช่วยแม่เตรียมของหน่อยสิ เดี๋ยวพี่ชายของลูกก็จะกลับมาถึงบ้านแล้วนะ\"\n\nภายนอกบ้าน เสียงตะโกนเอะอะของพวกทหารที่กำลังไล่ต้อนสัตว์เลี้ยงซึ่งถูกทิ้งไว้ดังแว่วเข้ามาแผ่วๆ ด้วยความหวาดกลัวว่าควันไฟจากเตาจะลอยขึ้นไปเป็นจุดสังเกต เขาจึงรีบเข้าไปพยายามรั้งตัวมารดาให้หยุดมือ ทว่าในวินาทีนั้นเอง...\n\n\"อะไรกันวะ ไม่มีห่าอะไรเลยเรอะ!\"\n\n\"หมู่บ้านกระจอกชะมัด ทั้งที่พวกไอ้หมอนั่นที่กัสคอนยังโชคดีกว่าตั้งเยอะ เห็นว่าพวกมันได้นอนกกผู้หญิงกันครบทุกคนเลยนี่หว่า\"\n\n\"ไม่มีเหล้าสักไหเลยหรือไงวะ? เข้าไปค้นดูสิ!\"\n\nทันทีที่เขานึกว่าได้ยินเสียงพูดคุยเหล่านั้นขยับเข้ามาใกล้ ประตูหน้าบ้านก็ถูกถีบพังโครมลงมาอย่างป่าเถื่อน\n\nทหารสามนายเดินกร่างส่งเสียงดังเอะอะเข้ามาด้านใน แต่ละคนล้วนสวมเสื้อเกราะโซ่ถักแบบเรียบง่าย พร้อมอาวุธครบมือทั้งหอกและดาบ บนใบหน้าที่ดำเมี่ยมไปด้วยเขม่าฝุ่นคลุ้ง มีเพียงดวงตาเท่านั้นที่ทอแสงสีขาวขุ่นอันเป็นเอกลักษณ์ออกมา\n\n\"โอ้ มีผู้หญิงอยู่ที่นี่ด้วยเว้ย!\"\n\n\"อะไรกัน นี่มันแก่เกินไปแล้วไม่ใช่รึ? ช่างเถอะ ไม่มีเหล้าเลยหรือไง? หรือของกินอะไรก็ได้?\"\n\nหลังจากจ้องมองมารดาที่กำลังกางแขนโอบกอดออร์บาซึ่งหมอบตัวลงต่ำไว้อย่างปกป้อง พวกมันก็เริ่มลงมือทุบทำลายข้าวของภายในบ้านตามอำเภอใจ ออร์บาหมอบตัวราบลงกับพื้นจนมิด กลั้นลมหายใจนิ่งเงียบไม่ต่างอะไรจากสัตว์กินพืชที่พยายามไม่ดึงดูดความสนใจของเหล่าสัตว์ร้ายกระหายเลือด\n\nตอนที่พวกทหารการ์เบราถีบพังประตูเข้ามา สายตาของเขาเหลือบไปเห็นดาบไม้—ซึ่งเคยวางพิงไว้ข้างประตู—กลิ้งหลุนๆ ไปตามพื้น แต่ในท้ายที่สุด มันก็เป็นได้เพียงแค่ของเล่นเด็กชิ้นหนึ่งเท่านั้น เมื่อก่อนเขาเกลียดการถูกใครพูดจาดูถูกแบบนั้นยิ่งกว่าสิ่งใด และพร้อมจะถลึงตาจ้องกลับใส่คนพวกนั้นเสมอ ทว่าในยามนี้ เขากลับตระหนักถึงความจริงข้อนั้นได้อย่างเจ็บปวดแสนสาหัส\n\nจากนั้น ขณะที่พวกทหารกำลังรื้อค้นไปจนถึงชั้นวางของ พวกมันก็คว้าถ้วยชามดินเผาหยาบๆ จากด้านในแล้วเหวี่ยงทิ้งไปด้านข้างอย่างไม่ไยดี เสียงแตกหักดังลั่นสนั่นหวั่นไหว เศษกระเบื้องแตกละเอียดกระจายเกลื่อนเต็มพื้น เหตุการณ์นั้นทำให้ออร์บาถึงกับสะดุ้งตกใจ เพราะข้าวของเหล่านั้นคือของใช้ส่วนตัวของพี่ชายโรอัน และมารดาที่เอาแต่ยอมจำนนเงียบงันมาตลอดจนถึงเมื่อครู่ ก็พลันลุกพรวดขึ้นด้วยแรงฮึดมหาศาลจนผลักออร์บาเซถอยออกไป จากตรงนั้น นางโผเข้าเกาะกระชากแผ่นหลังของทหารนายหนึ่งเอาไว้แน่น\n\n\"เฮ้ย อะไรวะ? อะไร?\"\n\n\"ดูท่าทางอีป้านี่อยากจะเล่นสนุกกับข้าเสียแล้วสิ!\"\n\nทหารหน้าแดงก่ำนายนั้นแกะมือนางออก จับร่างนางพลิกหันกลับมา แล้วผลักกดให้นางล้มลงกับพื้นตรงจุดนั้นทันที มันใช้มืออุดปากนางไว้ยามนางพยายามจะส่งเสียงกรีดร้องแหลมสูง ก่อนจะชักมีดปลายแหลมที่ซ่อนไว้ใต้เสื้อเกราะโซ่ถักออกมา และจ่อปลายมีดเข้าไปตรงหน้าใบหน้าอันซีดเผือดของมารดา\n\n\"หยุดน่า แกนี่มันเอาไม่เลือกหน้าเลยหรือไงวะ?\"\n\n\"รสชาติของสาวน้อยแรกรุ่นมันก็ดีอยู่หรอก แต่ดอกไม้แก่ๆ อย่างอีป้านี่ก็ไม่ได้เลวร้ายอะไรนักนี่หว่า\"\n\nขณะเอ่ยถ้อยคำนั้น ใบหน้าแดงก่ำของมันก็เผยรอยยิ้มลามกน่ารังเกียจออกมา และเส้นด้ายที่คอยรั้งความรู้สึกอันตึงเครียดของออร์บามาตลอดก็พลันขาดผึงลง ออร์บาเปล่งเสียงคำรามเก้งก้างไม่เป็นภาษาก่อนจะพุ่งทะยานเข้าใส่ทันที ทว่ามันเป็นการพุ่งเข้าชาร์จที่ไร้ซึ่งชั้นเชิง และเขาก็ถูกท่อนแขนข้างเดียวของอีกฝ่ายฟาดปัดจนกระเด็นปลิวถอยหลังกลับมาอย่างง่ายดาย\n\nท้ายทอยของเขากระแทกเข้ากับชั้นวางของอย่างจัง แม้จะมึนงงไปชั่วขณะ ทว่าออร์บากัดฟันกรอดและรีบเงยหน้ามองตรงไปข้างหน้าอีกครั้งในทันที และในจังหวะนั้นเอง จากด้านบนสุดของชั้นวาง ก็มีบางสิ่งบางอย่างร่วงหล่นลงมากระแทกพื้นเสียงดังโครม มันเป็นห่อผ้าทรงเรียวยาวที่ถูกมัดห่อเอาไว้อย่างดี และด้วยส่วนปลายด้านหน้าของห่อผ้าที่ฉีกขาดออก เผยให้เห็นประกายโลหะสีเงินวาววับสะท้อนเข้าสู่ดวงตาของออร์บา\n\nนี่มัน...\n\nออร์บารีบคว้าซ่อนมันไว้ตามสัญชาตญาณก่อนจะกระชากฉีกห่อผ้าออกอย่างเร่งรีบ และเป็นไปตามที่เขาคาดคิดไว้ มันคือดาบสั้นความยาวราวหกสิบเซนติเมตร ด้ามจับหัวกลมมีเอกลักษณ์เฉพาะตัวแบบงานช่างของเมฟิอุส รับกับใบดาบอันเรียวบาง ตัวด้ามจับเองก็มีขนาดค่อนข้างเล็กเรียว เหมาะมือกับฝ่ามือของเด็กพอดีเป๊ะ\n\nยามที่เขากำด้ามดาบไว้แน่น ตัวอักษรหลายตัวที่ถูกสลักเสลาไว้บนใบดาบก็พลันกระโดดเข้าสู่สายตาของเขา\n\nO, R, B, A...\n\nมันเกิดขึ้นเพียงชั่วพริบตาเดียว—ท่ามกลางเสียงกรีดร้องของมารดา เสียงทหารหน้าแดงที่ถอดชุดเกราะโซ่ถักเหวี่ยงทิ้งอย่างลนลาน และเสียงอึกทึกของพวกทหารที่กำลังทำลายข้าวของภายในบ้าน แม้กระแสเลือดสีดำอันน่าสะพรึงกลัวจะเดือดพล่านคลุ้มคลั่งไปทั่วร่าง ทว่าเขากลับข่มขับมันออกไปจนหมดสิ้น และในเสี้ยววินาทีนั้นเอง ความคิดที่ถูกบีบเค้นเข้าด้วยกันก็ชี้นำเขาไปสู่คำอธิบายทั้งหมด\n\nบนใบดาบสลักไว้เพียงคำว่า 'ออร์บา' แน่นอนว่าเขาไม่เคยรู้มาก่อนเลยว่ามีสิ่งนี้อยู่ในบ้าน เขาไม่คิดว่ามารดาหรือคนรู้จักคนอื่นจะจงใจจัดเตรียมของสิ่งนี้ไว้ให้เขาเป็นพิเศษ เท่าที่พอจะคาดเดาได้ นี่คงเป็นของขวัญจากพี่ชายโรอันใช่หรือไม่?\n\nทว่าโรอันควรจะส่งมอบเงินค่าตอบแทนที่ได้จากการรับราชการทหารทั้งหมดให้มารดาไปหมดแล้วไม่ใช่หรือ อีกอย่าง ดาบลักษณะนี้ไม่อาจหาซื้อได้ตามเมืองทั่วไป เป็นไปได้มากที่สุดว่าหลังจากเดินทางไปถึงป้อมอัปตา พี่ชายคงได้รับแจกจ่ายอาวุธในฐานะทหาร และได้ขอร้องให้ช่างตีเหล็กประจำป้อมสลักชื่อของเขาลงไป\n\nจากนั้น พี่ชายคงฝากฝังมันมากับกองคาราวานที่วิ่งวนเวียนระหว่างป้อมปราการกับตัวเมือง ทว่าเมื่อมันส่งมาถึงบ้าน มารดาคงเป็นผู้เซ็นรับไว้ และหลังจากไตร่ตรองดูแล้วว่าไม่ควรปล่อยให้มันตกมาถึงมือออร์บา นางจึงตั้งใจเก็บซ่อนมันไว้ให้พ้นสายตาของลูกชาย นางคงคิดว่ามันอันตรายเกินไปสำหรับออร์บา หรือบางทีนางอาจจะหวาดกลัวว่าออร์บาจะหนีตามโรอันไปอีกคนหากได้ถือดาบไว้ในมือ\n\nแต่ไม่ว่าจะด้วยเหตุผลใดก็ตาม...\n\n\"เฮ้ย แกถืออะไรอยู่น่ะ?\" ทหารนายหนึ่งเอ่ยทักขึ้นมาจากด้านหลังของออร์บาที่กำลังหมอบตัวอยู่ \"ดูท่าทางแกจะซุกของมีค่าเอาไว้ไม่ใช่เล่นนี่หว่า เอ้า ไม่เอามาให้ข้าดูหน่อยเรอะ?\"\n\n\"นี่มันของข้า!\"\n\n\"นั่นไม่ใช่เรื่องที่แกจะมาตัดสินใจ แต่เป็นข้าต่างหาก เอ้า ส่งมานี่เดี๋ยวนี้\"\n\nทหารที่พูดจาเยาะเย้ยออร์บาวางมือลงบนบ่าของเขาและพยายามกระชากตัวเขาให้พ้นทางด้วยพละกำลัง เพียงเท่านั้นก็เกินพอแล้ว\n\nใช่แล้ว ออร์บา เขาเอ่ยตอบรับเสียงกระซิบภายในจิตใจของตนเอง\n\n\"ข้าบอกให้เอามาให้ดูยังไงเล่า—อ๊ากก!\"\n\nออร์บาหมุนตัวควับกลับไปพร้อมตวัดฟันดาบลงเบื้องล่าง เมื่อโลหิตพุ่งกระฉูดออกจากหัวไหล่ของชายคนนั้น ออร์บาก็ลอดผ่านใต้ท่อนแขนของทหารที่กำลังเซถลา และพุ่งทะยานตรงเข้าหาชายที่กำลังคร่อมทับอยู่เหนือร่างมารดาของตน\n\nชายหน้าแดงก่ำละสายตาออกจากมารดาของเขาแล้วกระโดดถอยหลังผละออกมา มันรีบคว้าขวานมือขึ้นมาอย่างรวดเร็วแล้วยกขึ้นต้านรับคมดาบของออร์บาที่ฟาดฟันเข้ามา ออร์บายันเท้าทั้งสองข้างลงบนพื้นอย่างมั่นคงและพยายามกดคมดาบทะลวงเข้าไปให้ได้ ทว่าถึงกระนั้น ใบดาบก็ยังสั้นเกินไป และพละกำลังของเด็กคนหนึ่งก็ไม่อาจต้านทานแรงผลักจากขวานมือเช่นนั้นได้ไหว แต่แทนที่จะยอมจำนนต่อแรงที่เหนือกว่าไปง่ายๆ ออร์บากลับจงใจทิ้งตัวล้มเอียงลงไปด้านข้าง\n\n\"ไอ้เด็กเวรนี่...\"\n\nมันเงื้อขวานฟันลงมาอีกครั้งด้วยจิตสังหารอันแรงกล้า ออร์บากลิ้งตัวหลบออกไปด้านข้าง พอหมุนตัวครบหนึ่งรอบ คมขวานก็สับปักลงตรงจุดนั้นพอดี เฉียดหน้าของเขาไปเพียงคืบเดียว ในเสี้ยววินาทีนั้นเอง เลือดในกายของเขาพลันเย็นเยียบลงจนแทบจับแข็ง\n\n\"หยุดนะ!\"\n\nมารดาของเขากำลังโผเข้ากอดรั้งข้อเท้าของชายหน้าแดงเอาไว้แน่น ชายคนนั้นบันดาลโทสะสุดขีด มันเตะสะบัดเข้าใส่มือของนาง หมุนตัวกลับมา และเงื้อขวานขึ้นสูงยิ่งกว่าเดิม เมื่อออร์บามองเห็นภาพนั้น แรงกดดันของเลือดสีดำ—ทั้งความวิตกกังวล ความหงุดหงิดรำคาญใจ โทสะ และอารมณ์ความรู้สึกนานัปการที่คุกรุ่นสะสมอยู่ภายในร่างของเด็กชายมาแสนนาน—ก็กำลังจะถูกปลดปล่อยออกมาจากจุดเพียงจุดเดียว ราวกับมันเพิ่งก่อรูปเป็นรูปร่างที่สมบูรณ์ขึ้นในวินาทีนี้เอง\n\nเขาลุกขึ้นยืน กำด้ามดาบแน่นด้วยมือทั้งสองข้าง กดแนบด้ามไว้ใต้รักแร้แล้วพุ่งโถมแทงออกไปพร้อมกับน้ำหนักตัวทั้งหมด เข้าใส่แผ่นหลังอันไร้การป้องกันของทหารนายนั้น\n\nแผ่นหลังของชายคนนั้นซึ่งเพิ่งถอดชุดเกราะออกรับคมดาบเข้าไปได้อย่างง่ายดายอย่างน่าเหลือเชื่อในตอนแรก จากนั้นมีแรงต้านแข็งๆ อยู่เล็กน้อย ทว่ามันก็ทะลุผ่านเข้าไปได้อย่างราบรื่นยามออร์บาออกแรงดันส่งด้วยสองมือ จนกระทั่งในชั่วพริบตา ปลายคมดาบก็ทะลวงทะลุหน้าอกของอีกฝ่ายออกมาในที่สุด\n\nเพราะตัวออร์บาเองก็ถูกฉุดลากตามไปด้วยในขณะที่ชายหน้าแดงเซถลาถอยหลัง เขาจึงรีบปล่อยมือออกจากด้ามดาบอย่างรวดเร็ว แผ่นหลังของชายคนนั้นกระแทกเข้ากับผนังบ้านอย่างแรง หลังจากหันกลับมาเผชิญหน้ากับออร์บาผู้คว้าชัย มันก็พะงาบปากเปิดปิดไปมา คาดว่าคงพยายามจะเอ่ยคำอาฆาตแค้นบางอย่าง ก่อนจะกระอักเลือดกองมหึมาออกมาขณะร่างทรุดฮวบลงกับพื้น จนกระทั่งลิ้นสีแดงสดห้อยตกลงมาและแน่นิ่งไม่ไหวติงอีกต่อไป\n\n\"ไอ้ระยำเอ๊ย!\" ทหารนายที่ถูกฟันไหล่ตะโกนลั่นด้วยสีหน้าบิดเบี้ยวจากความเจ็บปวด\n\n\"แกฆ่าดูกาแล้วนะ ไอ้เด็กชั้นต่ำ!\"\n\nทหารอีกนายหนึ่งก็แผดเสียงตะโกนลั่นเช่นกัน ก่อนจะวิ่งกรูเข้ามาหาออร์บา ออร์บาที่ไม่มีดาบอยู่ในมืออีกแล้วถูกกระแทกเข้าใส่เต็มแรงจนกระเด็นกลิ้งไปตามพื้นอีกครั้ง เขาถูกเตะเข้าที่หน้าท้องอย่างจัง และถูกฝ่าเท้าเหยียบกดลงบนแผ่นหลัง\n\n\"ทั้งแม่ทั้งลูกเลย ข้าจะตัดหัวพวกแกไปแขวนประจานไว้ใต้ชายคาบ้าน!\"\n\nขณะที่กำลังคลานสี่ขาอยู่กับพื้น ปลายคมดาบก็ถูกจ่อเข้ามาจี้ตรงท้ายทอยของออร์บา มารดาของเขาเองก็ถูกกระชากตัวขึ้นมา บิดแขนไพล่หลัง และถูกจับกดให้อยู่ในท่าเดียวกันเคียงข้างออร์บา ไม่ว่าเขาจะพยายามดิ้นรนสะบัดตัวสุดแรงเกิดเพียงใด เขาก็ไม่อาจสลัดน้ำหนักตัวของชายที่ยืนเหยียบอยู่บนหลังให้หลุดออกไปได้\n\n\"ปล่อยข้านะ!\"\n\n\"เออ เดี๋ยวก็ปล่อยให้แล้ว หลังจากที่แกกลายเป็นศพไปแล้วน่ะนะ!\"\n\nออร์บาที่แผดเสียงร้องราวกับสัตว์ป่า พลันตกอยู่ในห้วงเวลาที่แขวนอยู่บนเส้นด้ายระหว่างความเป็นและความตาย เสียงหวีดหวิวของสายลมที่ถูกคมดาบแหวกตัดขณะเงื้อฟาดลงมาตรงๆ ดังขึ้น และในวินาทีสุดท้ายนั้นเอง เขาก็ตะโกนก้องเรียกชื่อพี่ชายโรอันออกมาสุดเสียง ทว่าในชั่วพริบตานั้น...\n\n\"เกิดเรื่องอะไรขึ้น?\"\n\nจู่ๆ เสียงแหวกอากาศของคมดาบก็พลันหยุดชะงักลงกลางคัน ออร์บาที่ความคิดในหัวกำลังปั่นป่วนสับสนตระหนักได้ในทันทีว่า ผู้ที่ปรากฏตัวขึ้นนั้นมิใช่พี่ชายของเขาแต่อย่างใด\n\nผู้ที่เพิ่งก้าวเท้าเข้ามาภายในบ้านหลังนี้ยังคงเป็นทหารการ์เบราอยู่ดี ทว่าแตกต่างจากพวกทหารที่บุกรุกเข้ามาเมื่อครู่ เขาผู้นี้สวมชุดเกราะคุ้มกันครบทั้งตัวโดยไม่มีส่วนใดเว้นว่าง และชุดเกราะของเขาก็ส่องประกายเงางามสีเงินเจิดจ้า ใบหน้าของเขายังดูเยาว์วัยอยู่มาก\n\nชั่วขณะหนึ่ง เห็นได้ชัดว่าทหารทั้งสองนายสะดุ้งผงะต่อผู้มาใหม่ ทว่าหลังจากนั้น...\n\n\"ก็อย่างที่เห็นนั่นแหละขอรับ ท่านอัศวินฝึกหัด\"\n\n\"พวกกระผมก็แค่แวะมารับรางวัลอันสมควรหลังจากคว้าชัยในการศึกเท่านั้นเอง คงไม่ใช่ว่าเพียงเพราะท่านเพิ่งได้สร้างผลงานดีเด่นมาหน่อยเดียวแล้วได้สวมเกราะอัศวินเข้าหน่อย ก็เลยคิดจะมาขัดขวางเรื่องเล็กๆ น้อยๆ ที่ไม่สลักสำคัญพรรค์นี้หรอกนะขอรับ ใช่ไหมล่ะ?\" ทหารทั้งสองเอ่ยอธิบายด้วยน้ำเสียงขึงขัง\n\nแม้จะแสร้งทำกิริยานอบน้อมสุภาพ ทว่าเห็นได้ชัดเจนจากบรรยากาศรอบตัวว่าพวกมันกำลังดูแคลนชายผู้นั้นอยู่\n\n\"อีกอย่าง ดูนี่สิ สหายร่วมรบของพวกเราถูกฆ่าตายนะขอรับ ไม่มีทางที่ทหารผู้มีเกียรติภูมิแห่งการ์เบราจะปล่อยเรื่องนี้ผ่านไปโดยไม่ล้างแค้นให้สาสมหรอก ถูกไหมขอรับ?\"\n\nทหารคนที่พูดใช้เท้าเขี่ยพลิกร่างของออร์บาให้หงายขึ้น และเล็งปลายดาบในมืออีกข้างตรงเข้ามา สิ่งที่สายตาของออร์บามองเห็นยามแหงนมองขึ้นไปยังเพดาน ก็คือปลายคมดาบมรณะ ทว่าในเสี้ยววินาทีนั้นเอง เส้นแสงสีเงินสายหนึ่งก็พุ่งวาบตัดผ่านเข้ามาจากด้านข้าง\n\n\"พวกแกทำบ้าอะไรกันอยู่!\"\n\n\"ช่างน่าสมเพชสิ้นดี ล้างแค้นงั้นรึ? พวกแกกำลังจะบอกว่ามีความภาคภูมิใจหลงเหลืออยู่ในการทำเรื่องพรรค์นี้กับเด็กตัวเล็กๆ คนหนึ่งอย่างนั้นรึ?\"\n\nชายหนุ่มสวมเกราะชักดาบออกมาจากฝักแล้ว ดูเหมือนเขาจะฟันทหารนายนั้นล้มลงไปแล้ว เพราะออร์บาตระหนักได้ว่าคมดาบที่สมควรจะแทงทะลุหัวใจของตนเองกลับถูกปัดกระเด็นออกไปด้านข้างอย่างน่าอัศจรรย์ ส่วนทหารอีกนายหนึ่งคำรามลั่นบางอย่างด้วยน้ำเสียงแหบแห้งอยู่ใกล้ๆ ฟังคล้ายมันกำลังตะโกนเรียกชื่อของบุรุษในชุดเกราะ ทว่าในเวลานั้นออร์บาฟังไม่ทันถนัดนัก\n\n\"สะ-สหายของแกงั้นเรอะ... บังอาจนักนะ ไอ้สารเลว!\"\n\n\"ข้าไม่ปรารถนาจะถูกพวกสวะชั้นต่ำอย่างพวกแกมาเรียกขานว่าสหายร่วมรบหรอก\"\n\nขณะที่เขายื่นปลายดาบที่อาบย้อมไปด้วยโลหิตออกไปข้างหน้า ทหารนายนั้นก็ก้าวถอยหลังกรูด\n\n\"ชั้นต่ำงั้นรึ? ทั้งที่แกเองก็มีชาติกำเนิดไม่ได้ต่างไปจากพวกเราเลยสักนิด แค่บังเอิญโชคดีได้รับโอกาสสร้างความชอบเข้าหน่อยก็เหลิงลอยฟ้าแล้วเรอะ วันๆ เอาแต่พร่ำพูดคำว่า อัศวิน อัศวิน ราวกับเป็นคำโปรดติดปาก แต่แกได้เป็นอัศวินตัวจริงแล้วหรือไง? แกไม่มีสายเลือดเดียวกับราชวงศ์การ์เบราเสียหน่อย แกก็เป็นได้แค่ 'อัศวินฝึกหัด' ไปจนวันตายนั่นแหละ หัดเจียมกะลาหัวตัวเองเสียบ้าง!\"\n\nในชั่วพริบตา ทหารที่ทำท่าเหมือนกำลังถอยหนีก็ชักบางสิ่งออกมาจากด้านหลังอย่างรวดเร็วแล้วยกขึ้นประทับด้านหน้า มันคือหน้าไม้ที่ติดตั้งบนรางฐานเรียวยาว และมันก็ลั่นไกยิงออกไปทันที\n\nในเสี้ยววินาทีนั้นเอง ชายหนุ่มสวมเกราะก็เบี่ยงตัวหลบออกด้านข้างอย่างคล่องแคล่วปราดเปรียว ด้วยการหมุนตัวเพียงหนึ่งรอบราวกับกำลังร่ายรำ เขาหลบลูกดอกหน้าไม้นั้นได้อย่างหวุดหวิดและฟันบั่นศีรษะของทหารนายนั้นขาดกระเด็นไปพร้อมกัน ไม่มีความลังเลหลงเหลืออยู่เลยแม้แต่เสี้ยวเดียว ศีรษะที่ขาดสะบั้นหมุนคว้างกลางอากาศ กระแทกเข้ากับผนังบ้านก่อนจะร่วงกลิ้งหลุนๆ ลงบนพื้น\n\n\"การ์เบราคือดินแดนแห่งอัศวิน แทนที่จะปล่อยให้พวกแกทำให้ชื่อเสียงของบ้านเมืองต้องแปดเปื้อนไปมากกว่านี้ จงรับเกียรติยศแห่งการสิ้นชีพในสนามรบไปเสียเถิด\"\n\nรูปลักษณ์อันหล่อเหลา ท่วงท่าการต่อสู้ของเขา และถ้อยคำที่เขารำพึงออกมา—ทั้งหมดนั้นราวกับว่าวีรบุรุษจากหน้าหนังสือที่ออร์บามักอ่านอยู่เป็นประจำได้ก้าวเดินออกมาสู่โลกความจริงก็ไม่ปาน\n\n\"ท่านผู้บัญชาการ ข้างในเกิดเรื่องวุ่นวายอะไรขึ้นหรือขอรับ!?\"\n\nเสียงตะโกนถามดังขึ้นมาจากภายนอกบ้าน ทว่าเขากลับเอ่ยตอบออกไปเพียงว่า \"ไม่มีอะไร\" พลางสะบัดเช็ดคราบเลือดออกจากใบดาบ\n\n\"เจ้าเป็นเด็กของเมฟิอุสสินะ?\"\n\nออร์บาไม่รู้ในทันทีว่าควรจะตอบคำถามที่ถูกถามขึ้นมานั้นอย่างไรดี ที่จริงแล้วเขาเองก็ไม่ได้ตระหนักใส่ใจถึงชื่อของประเทศที่เรียกว่าเมฟิอุสมากนักหรอก ชาวบ้านในหมู่บ้านของออร์บาซึ่งโดยทั่วไปใช้ชีวิตอยู่ในโลกแคบๆ เพียงรัศมีราวสิบกิโลเมตรรอบหมู่บ้าน ไม่ได้มีความสนใจในเรื่องของประเทศชาติหรือข้อพิพาททางดินแดนเลยแม้แต่น้อย\n\nชายคนนั้นส่งยิ้มบางๆ ให้ออร์บาเมื่อเห็นเด็กชายนิ่งเงียบไม่ตอบคำ จากนั้นจึงปรายตามองไปยังร่างของทหารที่จมกองเลือดอยู่ ออร์บาร่างกายพลันแข็งทื่อขึ้นมาทันที รีบกอดรัดไหล่ของมารดาเอาไว้แน่น พลางกวาดสายตามองหาว่ามีอาวุธชิ้นใดพอจะคว้าถึงในระยะเอื้อมมือหรือไม่ ทว่าในตอนนั้นเอง...\n\n\"รีบหนีออกไปจากที่นี่เสีย\" ชายหนุ่มเอ่ยขึ้น \"ทั้งหมดนั่นทำไปเพื่อปกป้องแม่ของเจ้า—ใช่ไหมล่ะ? ภายในตัวเจ้าน่ะ มีจิตวิญญาณของอัศวินสถิตอยู่อย่างแท้จริงเลยนะ มากเสียยิ่งกว่าพวกคนของการ์เบราที่ดูเหมือนจะหลงลืมวิถีแห่งอัศวินไปจนหมดสิ้นเสียอีก ไปได้แล้ว รีบหนีออกไปจากที่นี่เสีย ข้าจะพยายามหยุดยั้งการปล้นสะดมและการทำร้ายประชาชนให้ได้มากที่สุด แต่ข้าคงไม่อาจไล่จับพวกมันทุกคนได้ทั่วถึงหรอกนะ\"\n\nดวงตาคู่นั้น ช่างละม้ายคล้ายคลึงกับดวงตาของพี่ชายโรอันอย่างน่าประหลาด ออร์บาประคองไหล่ของมารดาที่กำลังสะอึกสะอื้นไห้ ค่อยๆ หันหน้าไปยังประตูหลัง จากนั้น จึงออกแรงจูงมือมารดาวิ่งหนีออกไปอย่างสุดฝีเท้า สายลมหนาวเหน็บแห่งฤดูหนาวที่พัดโชยผ่านถนนหนทางหลังตะวันตกดินปะทะเข้าใส่แก้มทั้งสองข้างของเขา ออร์บาต้องคอยรบเร้าเร่งฝีเท้ามารดาที่เอาแต่พึมพำเพ้อเรียก 'โรอัน โรอัน' ไม่หยุด จนบางครั้งถึงขั้นต้องตะโกนเร่งนางเสียงดัง ในที่สุดหลังจากเวลาผ่านไปหนึ่งชั่วโมง พวกเขาก็สามารถกลับมารวมกลุ่มกับอลิซและชาวบ้านคนอื่นๆ ได้สำเร็จ\n\nหลังจากนั้น พวกเขาก็เดินตามหลังบิดาของอลิซและมุ่งหน้าไปยังหมู่บ้านอีกแห่งหนึ่งซึ่งอยู่ทวนกระแสน้ำขึ้นไปทางทิศเหนือราวสิบห้ากิโลเมตร\n\nออร์บาไม่อาจรู้ได้ว่าชายหนุ่มสวมเกราะคนนั้นได้รักษาคำพูดของตนเองหรือไม่ แต่อย่างน้อยนับจากนั้นเป็นต้นมา การปล้นสะดมอย่างสะเปะสะปะก็ไม่เกิดขึ้นอีกในบริเวณโดยรอบอัปตา ซึ่งในเวลาต่อมาได้ตกเป็นดินแดนของอาณาจักรการ์เบราไปแล้ว\n\nทว่า เปลวเพลิงแห่งหายนะก็ยังคงไล่ล่าคืบคลานมาถึงหมู่บ้านแห่งใหม่ที่ออร์บาและชาวบ้านเพิ่งหลบหนีมาอาศัยอยู่เมื่อครู่นี้จนได้\n\nแทบไม่มีสัญญาณเตือนล่วงหน้าเลยแม้แต่น้อย จู่ๆ 'พวกมัน' ก็บุกจู่โจมเข้ามาอย่างเต็มกำลังและลงมือปล้นสะดมในทันที พวกมันคือกลุ่มชายฉกรรจ์ที่สวมใส่เครื่องทรงสีดำทมิฬตั้งแต่หัวจรดเท้า ทั้งเสบียงอาหาร เสื้อผ้า และแน่นอนว่าเงินทองข้าวของเครื่องใช้ สรรพสิ่งทั้งมวลที่พอจะมีมูลค่าล้วนถูกช่วงชิงไปด้วยกำลังทั้งหมด ไม่เว้นแม้แต่ชีวิตผู้คนก็หาใช่ข้อยกเว้นไม่ ทันทีที่บุกเข้ามาถึงหมู่บ้าน พวกมันก็กวาดต้อนจับกุมเหล่าสตรี ส่วนบุรุษคนใดที่พยายามขัดขืนก็จะถูกแทงเสียบด้วยหอกจากบนหลังม้า ถูกฟันบั่นศีรษะด้วยคมดาบ และถูกระดมยิงด้วยปืนจนพรุน\n\nท่ามกลางความโกลาหลอลหม่านทั้งหมดนั้น ออร์บาพลัดหลงกับมารดาจนคลาดสายตาไป ในจังหวะที่เขากำลังเดินโซซัดโซเซไปข้างหน้าด้วยความกระวนกระวายใจและความหวาดกลัว...\n\n\"อลิซ!\"\n\nเขาเหลือบไปเห็นอลิซกำลังถูกทหารนายหนึ่งจับมัดแขนทั้งสองข้างไพล่หลังเอาไว้ แม้ตัวนางกำลังจะถูกลากตัวออกไป แต่อลิซก็ยังคงตะโกนสุดเสียงไล่ให้เขารีบวิ่งหนีไป ออร์บาสติขาดผึงลืมสิ้นทุกสิ่งทุกอย่างก่อนจะกระโจนพรวดออกไปข้างหน้า ความรู้สึกตอนสังหารคนผู้หนึ่งเมื่อครู่ยังคงติดค้างแน่นอยู่ในฝ่ามือทั้งสองข้างของเขา และในบัดนี้ เขาก็ตัดสินใจแน่วแน่ว่าจะลงมือทำแบบเดียวกันอีกครั้ง เขาเอื้อมมือออกไปหมายจะคว้าชิงดาบที่เหน็บอยู่ข้างเอวของทหารนายนั้น\n\nทว่า ในวินาทีที่ปลายนิ้วของเขาเพิ่งจะสัมผัสเข้ากับด้ามดาบ ศีรษะด้านหลังของเขาก็ถูกกระแทกฟาดอย่างรุนแรง ภาพทิวทัศน์เบื้องหน้าพลันพร่าเลือนสั่นไหว และสติสัมปชัญญะของเขาก็ใกล้จะดับวูบลงในไม่ช้า ชั่วอึดใจก่อนที่สติจะขาดผึงไป เขารู้สึกราวกับแว่วได้ยินเสียงของอลิซตะโกนเรียกชื่อเขาอยู่ไกลๆ\n\nเมื่อรู้สึกตัวตื่นขึ้นมาอีกครั้ง ออร์บาก็กำลังนอนหงายแผ่หลาอยู่บนพื้นดิน ศีรษะของเขาปวดตุบๆ แทบระเบิด สติของเขายังคงพร่ามัวอยู่บ้าง จนไม่แน่ใจด้วยซ้ำว่าตนเองกำลังฝันอยู่หรือไม่\n\n\"ท่านแม่ทัพอุบารี จะให้จัดการอย่างไรดีขอรับ?\"\n\nเขาไม่รู้ว่าเวลาผ่านไปเนิ่นนานเพียงใดแล้วตอนที่ได้ยินเสียงพูดนั้นดังขึ้น ท่ามกลางเสียงกรีดร้องโหยหวนของชายหญิงในระยะใกล้ และเสียงปืนที่ดังแว่วมาแต่ไกล ออร์บาแอบหรี่ตาที่ปรือเปิดเพียงครึ่งเดียวลอบมองไปยังผู้ที่ถูกเรียกขานชื่อเมื่อครู่นี้\n\nเป็นบุรุษร่างใหญ่ผู้หนึ่งบนหลังม้า ในมือของเขากำลังถือขวดสุราซึ่งคาดว่าคงปล้นชิงมาได้ เขาแต่งกายด้วยชุดเกราะเบาอันปราดเปรียวหรูหรา ศีรษะล้านเลี่ยน และแผ่กลิ่นอายอันน่าเกรงขามของยักษ์ใหญ่ แม้จะมีรูปลักษณ์อันเคร่งขรึมจริงจังถึงเพียงนั้น ทว่าบนริมฝีปากบางเฉียบของเขากลับทาทับไว้ด้วยสีชาดม่วงคล้ำ ทำให้ภาพลักษณ์ของร่างที่นั่งเชิดหน้าเหยียดยิ้มอยู่บนหลังม้าดูแปลกประหลาดพิกล\n\n\"ถ้าขนของมีค่าออกไปหมดแล้ว ก็จุดไฟเผามันทิ้งให้วอดเสีย อย่าให้เหลือข้าวสาลีไว้ให้พวกการ์เบราได้ใช้แม้แต่เมล็ดเดียว\"\n\nกล่าวจบถ้อยคำนั้น ชายที่ถูกเรียกว่าแม่ทัพก็เขวี้ยงขวดไวน์ในมือทิ้งไป น้ำเหล้าที่เหลือกระเด็นสาดกระเซ็นมาโดนแก้มของออร์บา\n\n\"ดีมาก หมู่บ้านแห่งนี้ถูกพวกการ์เบราเผาทำลาย สั่งให้ทหารลงมือให้เด็ดขาด พวกมันจะเอาตัวผู้หญิงไปเชยชมก็ได้ แต่พอเสร็จกิจแล้วก็จงฆ่าทิ้งเสียให้หมด อย่าได้เอาไปขายต่อเด็ดขาด เจ้าจงคุมงานนี้ด้วยตัวเอง\"\n\nหลังจากนั้นไม่นาน เสียงกรีดร้องและเสียงเอะอะโวยวายก็ค่อยๆ มอดดับเงียบหายไป แทนที่ด้วยสายลมร้อนระอุที่แผดเผาผิวหนังและกลิ่นเหม็นไหม้ฉุนกึกที่เริ่มลอยตลบอบอวลไปทั่วอากาศ กว่าเขาจะฝืนพยุงร่างลุกขึ้นยืนได้สำเร็จ สภาพรอบกายทั้งหมดก็แปรสภาพกลายเป็นทะเลเพลิงไปแล้ว\n\nไม่มีผู้ใดเหลือรอดชีวิตอยู่เลยแม้แต่คนเดียว ออร์บาเดินโซซัดโซเซระหกระเหินไปทั่วหมู่บ้าน ปากตะโกนเรียกชื่อมารดาและอลิซจนสุดเสียง พลางใช้มือปัดป้องสะเก็ดไฟที่ปลิวว่อนเข้ามา ทว่าสิ่งเดียวที่ปรากฏแก่สายตาของเขากลับมีเพียงซากศพของชาวบ้านที่ถูกสังหารหมู่เกลื่อนกลาดไปทั่วทั้งบริเวณ ทั้งศพของคนชรา สตรี และเด็กน้อย\n\nเจ้าอุบารีนั่น...\n\nท่ามกลางหมู่บ้านที่ถูกเพลิงเผาผลาญจนเกรียมดำไปทั่วทุกตารางนิ้ว ร่างกายทั้งหมดของออร์บาก็กลายเป็นสีแดงคล้ำจากคราบเลือดและเขม่าควันที่ร่วงหล่นลงมาจากเบื้องบน\n\nนั่นมันอุบารี... แห่งป้อมอัปตาไม่ใช่หรือ...\n\nเขาจำได้ว่าเคยได้ยินชื่อนี้มาก่อน ตอนที่ทางป้อมกำลังเกณฑ์ทหารอย่างเร่งด่วน เขาแน่ใจว่าพวกนายทหารที่ปรากฏตัวในหมู่บ้านเคยเอ่ยถึงชื่อนี้ออกมา มันคือแม่ทัพอาวุโสผู้ได้รับมอบหมายให้ดูแลปกป้องป้อมปราการแห่งนั้น\n\nนั่นก็หมายความว่า กองกำลังกลุ่มนี้คือกองทัพเมฟิอุสเองอย่างนั้นหรือ หลังจากป้อมอัปตาแตกพ่าย กองทหารรวมถึงเจ้าอุบารีจึงถอยร่นขึ้นเหนือล่วงหน้ามาก่อนกองทัพการ์เบราที่ไล่ตามมา แล้วลงมือเผาทำลายหมู่บ้านที่ออร์บาและชาวบ้านเพิ่งหนีมาพักพิงเมื่อครู่จนราบเป็นหน้ากลอง อีกทั้งยังกวาดต้อนปล้นชิงทรัพย์สินเชลยศึกทั้งหมดกลับไปยังเมืองหลวง เพื่อไม่ให้ฝ่ายการ์เบราได้นำไปใช้ประโยชน์ใดๆ\n\nข้าจะฆ่าพวกมัน ออร์บาให้คำสัตย์สาบาน\n\nเขารีดเค้นเรี่ยวแรงจากส่วนลึกบางแห่งภายในร่างกาย ทั้งที่เมื่อครู่ไม่ควรจะเหลือหลออยู่แม้แต่หยดเดียว ทว่าพละกำลังที่คอยผลักดันให้เขาสามารถก้าวเท้าเดินต่อไปข้างหน้าได้นั้น ล้วนถือกำเนิดมาจากคำปฏิญาณอันไม่สั่นคลอนซึ่งเปี่ยมไปด้วยจิตสังหาร\n\nแม้ในเวลานี้ เขายังไม่มีคำตอบที่แน่ชัดว่าจะต้องสังหารเจ้าอุบารี พวกทหารการ์เบรา หรือองค์จักรพรรดิ และไม่รู้ว่าต้องทำอย่างไรจึงจะบรรลุเป้าหมายเหล่านั้นได้ก็ตาม แต่สำหรับตอนนี้ เขาก็ทำได้เพียงแค่ก้าวเท้าเดินตรงต่อไปข้างหน้าเท่านั้น"
    },

      "title": "บทที่ 2.1: เด็กหนุ่มทั้งสอง (1)",
      "content": "หลังจากนั้น เมื่อลักลอบหลบหนีเข้ามาในดินแดนบิรัคของจักรวรรดิเมฟิอุสได้สำเร็จ ออร์บาก็ลงมือลักขโมยซ้ำแล้วซ้ำเล่า เขาไม่มีความลังเลหรือความลำบากใจใดๆ กับการทำเช่นนั้นเลยแม้แต่น้อย เขาวิ่งตระเวนเท้าเปล่าไปตามพื้นดินวันแล้ววันเล่า ก่อนจะย้ายข้ามไปยังเขตอื่นก่อนที่ชาวบ้านแถวนั้นและเหล่าทหารยามจะทันจดจำใบหน้าของเขาได้ ทำเรื่องเดิมซ้ำแล้วซ้ำอีกจนกระทั่งออกเดินทางมุ่งหน้าสู่แหล่งทำมาหากินแห่งถัดไป\n\nเขาเริ่มคลุกคลีตีโมงกับเด็กหนุ่มวัยเดียวกันที่มีชะตากรรมแบบเดียวกัน พวกเขาพากันนำข้าวของที่เก็บคุ้ยมาจากกองขยะหรือของที่ขโมยมาได้ไปเร่ขายตามข้างถนน บางครั้งก็ฉกชิงถุงเงินด้วยการตวัดมีดเพียงฉับเดียว หรือไม่ก็ดักข่มขู่พ่อค้าที่ดูมีฐานะซึ่งเพิ่งเดินโซเซออกมาจากร้านเหล้า เพื่อรีดไถเอาเงินทองมาแบ่งกัน\n\nระหว่างที่ใช้ชีวิตไปวันๆ เช่นนั้น อยู่มาวันหนึ่ง ก็เกิดเหตุการณ์ที่ทำให้หลายคนในกลุ่มเพื่อนวัยเดียวกันที่ออร์บาคลุกคลีอยู่ได้รับบาดเจ็บสาหัส ดูเหมือนว่าพวกเขาจะถูกเด็กหนุ่มจากอีกกลุ่มหนึ่งบุกเข้ามาหาเรื่องท้าทาย พวกเด็กๆ กำลังเปิดศึกแย่งชิงอาณาเขตในแบบฉบับของเด็กๆ กันอยู่ และเช่นเคย มันย่อมมาพร้อมกับการใช้กำลังรุนแรง\n\nทุกสิ่งทุกอย่างถูกช่วงชิงไปจากพวกเขา คำว่าทุกสิ่งทุกอย่างในที่นี้หมายความว่า แม้เดิมทีพวกเขาจะมีเส้นสายชีวิตอันแสนริบหรี่ที่แทบจะประคองลมหายใจรอดไปวันๆ อยู่แล้วก็ตาม แต่หากถูกตัดขาดลงเช่นนี้ สมาชิกแทบทุกคนในกลุ่มก็คงต้องถูกปล่อยให้รอวันตายสถานเดียว\n\n\"พวกเราไม่รอวันตาย ก็ต้องสู้แล้วตาย แต่ใครก็ตามที่อยากจะทำอะไรมากกว่านั้นและอยากเป็นผู้ชนะ จงตามข้ามา!\"\n\nออร์บาเอ่ยปลุกขวัญกำลังใจให้แก่เด็กๆ ที่กำลังเริ่มท้อแท้หมดหวัง เขาไม่ต้องการถูกช่วงชิงทุกสิ่งทุกอย่างไปซ้ำสองอีกแล้ว ออร์บารวบรวมสมาชิกที่ยังหลงเหลืออยู่ของกลุ่มเล็กๆ ก่อนจะบุกเข้าโต้กลับกลุ่มคู่อริที่มีจำนวนคนเหนือกว่ามาก\n\nทว่า เขาไม่ได้ยกพวกบุกเข้าไปปะทะซึ่งๆ หน้า ออร์บาส่งคนออกไปสืบเสาะข่าวกรองของกลุ่มคู่อริล่วงหน้าอย่างละเอียดถี่ถ้วน ดังนั้น เมื่อจังหวะเวลาเหมาะสมมาถึงและฝ่ายตรงข้ามมีจำนวนคนเฝ้าอยู่เบาบางที่สุด พวกเขาจึงลงมือจู่โจมสายฟ้าแลบ\n\nสิ่งที่ออร์บาให้ความสำคัญเหนือสิ่งอื่นใดก็คือข้อมูลข่าวสาร เขาต้องถือครองข้อมูลที่สดใหม่อยู่เสมอ เพื่อทำความเข้าใจทั้งฝ่ายมิตรและศัตรู แยกแยะจำนวนคน ขุมกำลัง ความเคลื่อนไหว และรายละเอียดทำนองนั้นของศัตรูให้ทะลุปรุโปร่ง\n\nนี่แหละคือสิ่งที่แบ่งแยกผู้ใหญ่กับเด็กออกจากกัน\n\nนั่นคือสิ่งเดียวที่ออร์บาครุ่นคิด เด็กน้อยที่ไม่รู้อะไรเลยมีแต่จะถูกปล้นชิงไปโดยไม่ทันรู้ตัวด้วยซ้ำว่าศัตรูคือใคร แต่หากเจ้ารู้จักแยกแยะมิตรและศัตรูด้วยตนเอง และหากเจ้ารู้จักศัตรูของเจ้าอย่างถ่องแท้ เจ้าก็สามารถก้าวขึ้นมาเป็นผู้ใหญ่ซึ่งอยู่ฝ่ายผู้ปล้นชิงได้\n\nครั้นออร์บาอายุได้สิบสี่ปี เขาก็ก้าวขึ้นมาเป็นผู้นำในหมู่เด็กหนุ่มรุ่นราวคราวเดียวกัน ในช่วงแรก กลุ่มคนที่เขารู้จักมักจี่มีสมาชิกอยู่เพียงราวสิบคนเท่านั้น ทว่าเมื่อจำนวนเพิ่มขึ้นทุกวันเวลาที่ผันผ่าน ในที่สุดมันก็ขยายตัวจนมีสมาชิกมากกว่าหนึ่งร้อยคน\n\nทว่ากระแสเลือดสีดำที่เดือดพล่านอยู่ภายในกายของออร์บากลับไม่เคยจางหายไปไหนเลย ยังคงมีเหตุทะเลาะวิวาทปากเสียงนับร้อยครั้ง ซึ่งแน่นอนว่าเขาเป็นคนประเภทที่ใช้กำลังเข้าตัดสินและมักปิดฉากปัญหาได้อย่างรวดเร็วด้วยกำปั้นเสียเป็นส่วนใหญ่ แต่ในขณะเดียวกัน แทนที่จะใช้เวลายามค่ำคืนร่วมกับพรรคพวกในการดื่มสุรา ส่งเสียงเอะอะมะเทิง เฮฮาปาร์ตี้ และคุยโวโอ้อวด เขากลับเป็นคนประเภทที่ชอบปลีกตัวอยู่ตามลำพัง นั่งชันเข่าอยู่ในมุมมืดสลัวของห้อง และจมดิ่งอยู่ในห้วงความคิดของตนเอง\n\nด้วยเหตุนี้ ออร์บาผู้โปรดปรานการอยู่คนเดียวในยามวิกาลจึงมักเจียดเวลาว่างมาอ่านหนังสือเสมอ ยามที่ได้จมดิ่งลงไปในโลกแห่งตัวอักษร บางครั้งเขาก็หวนรำลึกถึงพี่ชายโรอัน คิดถึงอลิซ หรือเป็นห่วงกังวลว่าป่านนี้มารดาของตนจะไปอยู่ที่แห่งหนใด\n\nเขาจะต้องเก็บงำสั่งสมขุมกำลังนี้ไปอีกนานเท่าใดกัน? ก่อนอื่นเลย เขาจะสามารถเรียกใช้พละกำลังนั้นได้จริงหรือยามต้องเผชิญหน้ากับ 'ศัตรู' ของตน? และค่ำคืนเช่นนี้จะต้องหมุนเวียนวนซ้ำอยู่ในหัวของเขาไปอีกกี่ร้อยกี่พันคืน? ความไม่มั่นใจและการตั้งคำถามกับตนเองดูเหมือนจะไม่มีวันสิ้นสุด แต่ถึงกระนั้น ออร์บาก็ยังคงถนอมช่วงเวลาแห่งความกลัดกลุ้มใจนั้นไว้เป็นอย่างดี เพราะมันเป็นสิ่งเดียวที่ผลักดันให้เขายังคงก้าวเดินต่อไปข้างหน้าได้\n\nเวลาล่วงเลยไปราวสี่ปีนับตั้งแต่เดินทางมาถึงบิรัค\n\nวันนั้นควรจะเป็นเพียงวันธรรมดาอีกวันหนึ่ง คำว่าธรรมดาซึ่งหมายถึงความยุ่งวุ่นวายอย่างถึงที่สุด ตั้งแต่การตรวจนับผลกำไรในตู้เซฟจากบ่อนการพนันเถื่อนที่เขาดำเนินกิจการอยู่ ก่อนจะเตรียมตัวไปพบปะกับพ่อค้าลักลอบค้าปืนผู้ทรงอิทธิพลตามตรอกซอกซอยในบิรัค ฝึกซ้อมดาบและปืนเป็นเวลาราวหนึ่งชั่วโมง และทบทวนแผนการบุกปล้นเรือพาณิชย์ร่วมกับลูกน้องฝีมือดีหลายคนที่กำหนดจะลงมือภายในสัปดาห์นี้\n\nแผนการในช่วงสุดสัปดาห์นี้เป็นปฏิบัติการขนาดใหญ่ พวกเขาตั้งใจจะลอบโจมตีเรือขนส่งทางอากาศลำหนึ่ง—ซึ่งเรียกกันอย่างเป็นทางการว่าเรือรบศิลามังกร—ที่บรรทุกทองคำแท่งและสินค้าเต็มลำเพื่อเตรียมนำไปส่งยังเขตทางตะวันตกของนครรัฐ โดยวางแผนดักซุ่มโจมตีในหุบเหวลึกซึ่งตั้งอยู่ห่างจากบิรัคไปทางตะวันตกเฉียงใต้สิบสองกิโลเมตร ฝ่ายของพวกเขาจัดเตรียมเรือเหาะแบบที่นั่งเดี่ยวไว้ถึงสามลำ เหล่าหัวหน้าหมวดหลายคนรวมถึงตัวออร์บาเองต่างได้รับมอบหมายให้ฝึกซ้อมการบินเตรียมพร้อมไว้เรียบร้อยแล้ว\n\nทว่าเพราะมันเป็นปฏิบัติการขนาดใหญ่เช่นนั้น ต่อให้พวกเด็กหนุ่มจะเห็นพ้องต้องกันในวิธีการมากเพียงใด มันก็ยังคงมีช่องโหว่ขนาดใหญ่ซุกซ่อนอยู่เช่นเดียวกัน\n\nเด็กหนุ่มหลายคนจากอดีตกลุ่มคู่อริซึ่งริษยาในความสำเร็จของออร์บา ได้แอบแทรกซึมเข้ามาในกลุ่มของพวกเขาในฐานะสายลับ และนำรายละเอียดหลายส่วนของแผนการไปรั่วไหลให้แก่กองกำลังรักษาการณ์แห่งบิรัค\n\nชั้นสองของร้านเหล้าที่พวกเขาใช้เป็นฐานลับในช่วงนั้นถูกจู่โจมสายฟ้าแลบ และออร์บาก็พบว่าตนเองตกอยู่ในวงล้อมของเหล่าทหารยามรักษาเมือง เขาไม่มีอาวุธติดมือไว้ต่อสู้โต้กลับเลยแม้แต่ชิ้นเดียว ซ้ำเส้นทางหลบหนีทั้งหมดยังถูกปิดตายสนิท ในวินาทีที่ถูกเชือกฟาดรัดตรึงร่างจนต้องกลายสภาพเป็นบุคคลไร้ซึ่งสถานะอีกครั้ง ออร์บาก็ขบกัดริมฝีปากแน่นจนโลหิตไหลซึมออกมา\n\nไอ้พวกสารเลว\n\nแม้จะยังคงพยายามดิ้นรนขัดขืนขณะที่ใบหน้าและร่างกายต้องรองรับกำปั้นของเหล่าทหารยาม ออร์บาก็สัมผัสได้ถึงกระแสเลือดสีดำที่พวยพุ่งเอ่อล้นขึ้นมาภายในกายอีกครั้ง\n\nบัดซบ บัดซบ บัดซบเอ๊ย! มันยังไม่จบสักหน่อย ข้ายังมีชีวิตอยู่ ไม่ว่าจะเป็นเมฟิอุสหรือการ์เบรา ข้าไม่มีวันยอมถูกฆ่าตายง่ายๆ แน่ ต่อให้เป็นคนพวกนี้ก็เถอะ ข้าจะมีชีวิตอยู่ มีชีวิตอยู่ต่อไปให้จงได้!\n\nเขาถูกจับขังคุกในข้อหาครอบครองอาวุธสงครามเถื่อนจำนวนมหาศาล และแน่นอนว่าในข้อหาวางแผนบุกโจมตีเรือพาณิชย์ จากนั้นความผิดกระทงแล้วกระทงเล่าอย่างเช่นการปล้นสะดมเป็นขบวนการและการลักลอบเปิดบ่อนพนันเถื่อนก็ถูกขุดคุ้ยเปิดโปงออกมาเพิ่มเติมอีกเป็นพรวน\n\nเวลาที่ใช้ในการไต่สวนพิจารณาคดีใช้เวลาไม่ถึงหนึ่งวันด้วยซ้ำ และออร์บาซึ่งถูกโยนกลับเข้าไปในห้องขังใต้ดินอันคับแคบอีกครั้ง ก็ถูกทาบด้วยเหล็กร้อนแดงฉานลงบนแผ่นหลัง เขาถูกประทับตราบาป เส้นตรงแนวตั้งยาวที่ลากผ่านตรงกึ่งกลางของเครื่องหมายกากบาท คือหลักฐานแสดงความเป็นทาส\n\nเขาเป็นไข้ขึ้นสูงจากความเจ็บปวดแสนสาหัส และในค่ำคืนนั้นภายในเรือนจำ ขณะที่ออร์บากำลังนอนบิดตัวทุรนทุรายอยู่เพียงลำพังด้วยความทรมาน เขาก็ได้เผชิญกับชะตากรรมที่แปลกประหลาดพิสดารยิ่งกว่าเดิม\n\n\"...เหมือนจริงๆ ด้วย\"\n\nคางของเขาถูกคว้าจับและรู้สึกราวกับร่างถูกยกขึ้น ไม่ต้องพูดถึงการสะบัดให้หลุดเลย แม้แต่เรี่ยวแรงที่จะปรือเปลือกตาขึ้นมามองใบหน้าของคนผู้นั้นเขาก็ยังไม่มี โดยไม่ทันได้ใส่ใจต่ออารมณ์ความรู้สึกใดๆ ของตนเอง ภายในหัวของเขาราวกับกำลังลุกไหม้เป็นไฟ เคี่ยวกรำเดือดปุดๆ อย่างเชื่องช้า\n\n\"จากเท่าที่ข้าได้ยินมาระหว่างการสอบปากคำ น้ำเสียงของมันเองก็เหมือนกันเปี๊ยบเลยขอรับ\"\n\n\"ถึงจะบอกว่าเหมือน แต่มันก็มีขีดจำกัดอยู่ดี จริงๆ แล้วเจ้านี่ก็ดูเหมือนคนละคนกันอยู่บ้างขึ้นอยู่กับมุมมอง ถ้ามันคล้ายกว่านี้อีกสักหน่อยล่ะก็ คงพอจะเอาไปใช้ประโยชน์อะไรได้บ้างหรอก เอาเถอะ แล้วหลังจากนี้จะเกิดอะไรขึ้นต่อไปล่ะ?\"\n\n\"ตามสถานที่ที่กระผมคัดสรรไว้ให้ ชายผู้นี้มีนิมิตบางอย่างที่น่าสนใจทีเดียวขอรับ หากโชคเข้าข้างท่าน ย่อมเป็นประโยชน์ต่อนายท่านได้ในสักวันข้างหน้าอย่างแน่นอน มิใช่หรือขอรับ?\"\n\n\"แต่เป็นทาสดาบเนี่ยนะ? หากชีวิตของไอ้เด็กนี่อาจจะไม่มีเหลืออยู่ถึงวันพรุ่งนี้ แล้วมันจะมาเป็นประโยชน์อะไรให้ข้าได้กัน? ถ้ารู้คำตัดสินล่วงหน้าเร็วกว่านี้ ข้าคงพิจารณาจัดการเรื่องนี้ด้วยวิธีอื่นไปแล้ว\"\n\n\"หามิได้ขอรับ แน่นอนว่าท่านย่อมไม่อาจล่วงรู้ชะตากรรมในวันพรุ่งนี้ได้หากลงทุนกับมัน แต่ชายผู้นี้สมควรถูกคาดหวังว่าจะเติบโตเป็นยอดฝีมือคนสำคัญได้ขอรับ หากจะกล่าวอีกนัยหนึ่ง ในตอนนี้ไม่อาจปั้นแต่งอะไรจากตัวมันได้หรอก แต่หลังจากผ่านวันคืนในฐานะทาสดาบไปแล้ว—แน่นอนว่าหากมันไม่ถูกตัดหัวทิ้งตั้งแต่วันแรก หรือบังเอิญมาตายด้วยตลกร้ายอันโหดเหี้ยมของโชคชะตาเสียก่อน—กระผมเชื่อว่ามันจะรอดชีวิตอยู่ได้เกินสามปี... ไม่สิ สองปีก็น่าจะพอไหวขอรับ\"\n\n\"ถ้าอย่างนั้น ข้าก็คงต้องรอคอยโดยไม่คาดหวังอะไรก็แล้วกัน แต่ไม่ว่าอย่างไร คงไม่มีทางปล่อยให้ไอ้เด็กหนุ่มนี่ไปเป็นทาสทั้งที่ยังใช้หน้าตาจริงของตัวเองได้หรอก\"\n\nในวินาทีนั้นเอง ออร์บาที่ถูกคนกลุ่มเดียวกับที่ประทับตราเขาก่อนหน้านี้จับกดร่างตรึงไว้กับพื้น พลันรู้สึกถึงแรงกดทับหนักอึ้งบนใบหน้า และพร้อมกับสัมผัสแห่งความร้อนรุ่มราวกับเปลวเพลิงที่ลามเลียขึ้นมา ผิวหนังของออร์บาก็เริ่มแผดเผาไหม้เกรียม เขาบิดตัวดิ้นพล่านกรีดร้องโหยหวน สงสัยอยู่ครามครันว่าทั้งหมดนี้เป็นเพียงความฝันหรือไม่ โดยไม่อาจแน่ใจได้ด้วยซ้ำว่าตนเองยังคงมีชีวิตอยู่จริงหรือเปล่า\n\nเช้าวันรุ่งขึ้น ร่างกายของเขายังคงถูกความเจ็บปวดและความอ่อนล้าทรมานแสนสาหัส ออร์บาถูกกระชากลากตัวออกมาจากคุกใต้ดิน ก่อนจะถูกโยนขึ้นไปบนเกวียนที่อัดแน่นไปด้วยชายฉกรรจ์เปลือยกายล่อนจ้อน มังกรฮูบันขนาดกลาง—มังกรที่มีลำตัวแบนราบและมีขายาวถึงแปดข้าง—ถูกนำมาเทียมลากเกวียน ออร์บาถูกมังกรลากตัวออกห่างจากบิรัคไปเรื่อยๆ ทั้งที่สติสัมปชัญญะยังคงล่องลอยเลื่อนลอย\n\nคาดว่าเวลาคงผ่านไปราวสองวันเมื่อการเดินทางมาถึงจุดสิ้นสุด พวกเขาได้รับอาหารเพียงวันละหนึ่งมื้อ ทว่าเพราะมันมีเพียงน้ำดื่มหนึ่งถ้วยกับเนื้อตากแห้งอีกเล็กน้อย ชายทุกคนรวมถึงออร์บาจึงอ่อนระโหยโรยแรง ตัวงอค้อม ไม่มีแม้แต่เรี่ยวแรงจะเอ่ยปากสนทนากัน\n\n\"นี่ก็เป็นทาสแปลกประหลาดอีกคนสินะ?\" ชายผู้มีเรือนร่างกำยำผิวคล้ำแดดเอ่ยขึ้น ผมสีขาวและหนวดเคราปกคลุมใบหน้ายามเขาชะโงกเข้ามาเพ่งมองหน้าออร์บา \"พวกแกลดิเอเตอร์ที่มีชื่อเสียงโด่งดังแล้วมักจะสวมหน้ากากหรือหมวกเกราะแบบนี้เพื่อสร้างจุดขายให้ตัวเองก็จริงอยู่ แต่เจ้านี่มันเป็นหน้าใหม่จริงๆ เรอะ?\"\n\nชายคนนั้นเอื้อมมือมาคว้าจับใบหน้าของออร์บา และพยายามจะดึงกระชากมันออก เมื่อถูกกระตุ้นความทรงจำแห่งความเจ็บปวดราวกับผิวหนังกำลังถูกฉีกทึ้งขึ้นมา ออร์บาก็สะบัดปัดแขนข้างนั้นออกไปทันที\n\n\"ไอ้สารเลว!\" นักดาบติดอาวุธคนหนึ่งตะโกนลั่น ทำท่าจะพุ่งเข้ามาซ้อมออร์บา ทว่าชายคนนั้นใช้เพียงคำสั่งคำเดียวว่า \"หยุด!\" ก็สยบทุกอย่างลงได้ พร้อมกับแสยะยิ้มด้วยริมฝีปากที่ซ่อนอยู่ใต้เคราครึ้ม\n\n\"ดูท่าว่านี่จะไม่ใช่หน้ากากธรรมดาๆ เสียแล้ว ตามประวัติของแก แกมีจิตใจที่ดื้อดึงไม่ยอมก้มหัวให้ใครสินะ แต่ส่วนใหญ่แล้วมันก็เป็นได้แค่ความโอหังของเด็กหนุ่มหัวดื้อที่จะกลายสภาพเป็นแค่หมาเชื่องๆ หลังผ่านไปสามวันเท่านั้นแหละ ข้าได้รับแต่งตั้งให้เป็นผู้ฝึกสัตว์ที่จะคอยสั่งสอนให้แกรู้จักคำว่า 'นั่งลง' กับ 'คอย' เดี๋ยวข้าจะสั่งสอนให้แกได้เห็นกับตาตัวเองเลยว่าจะเกิดอะไรขึ้นถ้าแกคิดจะขัดขืนข้า\"\n\nสิ้นคำพูดนั้น ชายคนนั้นก็เงื้อกำปั้นขนาดมหึมาราวกับค้อนปอนด์กระแทกซัดลงบนแผ่นหลังเปลือยเปล่าของเขา ออร์บาหลุดเสียงครางเจ็บปวดออกมาจากลำคอ ก่อนจะตัวงอคุดคู้ลงไปโดยไม่อาจเอื้อนเอ่ยคำใดได้อีก\n\n\"ข้าชื่อโกเวน ข้ายินดีที่จะสร้างความสัมพันธ์อันยืนยาวกับพวกแก พวกแกจะถูกบังคับให้ฆ่าฟันกันเองภายในสิบวันเป็นอย่างเร็วที่สุด ก็ได้แต่หวังว่าเรื่องมันจะไม่ลงเอยแบบนั้นนะ\"\n\nหลังจากนั้น การฝึกซ้อมของทาสดาบก็เริ่มต้นขึ้น และออร์บาก็เพิ่งมารู้ตัวในคืนนั้นเองว่าตนเองกำลังสวมหน้ากากอยู่ เมื่อมองดูเงาสะท้อนในกระจกด้วยความตกตะลึง ออร์บาที่เคียดแค้นชิงชังการล้อเล่นบัดซบนี้พยายามอย่างบ้าคลั่งที่จะฉีกทึ้งมันออกจากใบหน้า ทว่ามันกลับแนบสนิทติดแน่นกับผิวหนังจนไม่อาจถอดออกได้ ราวกับได้หลอมรวมกลายเป็นส่วนหนึ่งของผิวหนังไปเสียแล้ว\n\nหลังจากปลุกปล้ำดึงทึ้งอยู่นานหนึ่งชั่วโมงเต็ม จนหอบหายใจไม่ทันและเหงื่อไคลไหลโทรมไปทั่วทั้งร่าง เขาก็ซัดกำปั้นเข้าใส่เงาสะท้อนอันแปลกประหลาดของตนเองในกระจก\n\nกระจกแตกร้าวออกพร้อมเสียงดังเพล้ง และหน้ากากเหล็กก็กลายเป็นเงาสะท้อนที่บิดเบี้ยวไปตามรอยแตก\n\nพวกมันต้องเหยียดหยามคนอื่นไปถึงไหนกัน? ยัดเยียดของเลียนแบบอันแสนโง่เง่าพรรค์นี้มาให้ข้า ยังคิดจะฉุดกระชากข้าให้ตกต่ำลงไปถึงไหนอีก?\n\nข้าจะมีชีวิตอยู่และออกไปจากที่นี่ให้จงได้ ไม่ว่าจะต้องแลกด้วยอะไรก็ตาม! ข้าจะตามล่าตัวไอ้พวกที่หยามเกียรติข้าถึงเพียงนี้ และทำให้พวกมันต้องทุกข์ทรมานแบบเดียวกันให้สาสม!\n\nขณะแสร้งทำเป็นไม่ได้ยินเสียงสะอื้นไห้ของตนเอง เขาก็ทรุดตัวลงกองกับพื้นตรงจุดนั้นเอง\n\nวันรุ่งขึ้น โกเวนเรียกตัวออร์บาให้มายืนตรงหน้าในลานฝึกซ้อม แล้วจู่ๆ ก็โยนดาบที่ถืออยู่ในมือลงแทบเท้าของเขา\n\n\"ลองเข้ามาฟันข้าดูสิ จะใช้วิธีไหนก็ตามใจแกเลย\"\n\nออร์บามองหน้าคู่ต่อสู้ด้วยสายตาที่เคลือบแคลงในสติสัมปชัญญะของอีกฝ่าย แม้ในตอนนี้ออร์บาจะยังไม่ได้คิดเรื่องหลบหนีก็ตาม ทว่าในเวลานี้โกเวนกำลังมือเปล่า และยิ่งไปกว่านั้น เมื่อนึกถึงโซ่ตรวนที่ตามปกติมักจะถูกล่ามไว้รอบข้อเท้าของเขา ก็มีเพียง 'ระหว่างการฝึกซ้อมเท่านั้น' ที่โซ่เหล่านี้ถูกถอดออก\n\nออร์บาหยิบดาบขึ้นมา ย่อตัวก้มหลังลงราวกับกำลังสะสมแรงส่งให้ 'กักเก็บ' พลังไว้ ก่อนจะพุ่งทะยานไปข้างหน้าภายในลมหายใจเดียว\n\nมันไม่ต่างอะไรกับการจู่โจมสายฟ้าแลบ เขาลงมืออย่างไร้ความปรานี เขาเล็งเป้าไปที่ลำคอ เขาตั้งใจจะฆ่าให้ตายคาที่\n\nทว่า แขนของเขากลับเอื้อมไปไม่ถึงครึ่งหนึ่งของระยะที่วาดภาพไว้ในหัวด้วยซ้ำ และหนำซ้ำ เขายังถูกถีบเข้าอย่างจังจนทรุดเข่ากระแทกพื้น เมื่อลุกขึ้นยืนได้ เขาก็ลงมือจู่โจมด้วยกระบวนท่าเดิมอีกครั้ง ทว่าผลลัพธ์กลับไม่ต่างจากเดิม ในเสี้ยววินาทีที่เขาฟันออกไป โกเวนเบี่ยงตัวหลบออกด้านข้างอย่างปราดเปรียวและกดล็อกข้อศอกของเขาสยบลงกับพื้นทันที\n\n\"ดูเหมือนแกจะพอมีประสบการณ์มาบ้างอยู่เหมือนกันนี่ แต่ว่าประสบการณ์พรรค์นั้นมันมีแต่จะเกะกะขวางทางในตอนนี้เท่านั้นแหละ ลืมมันไปเสีย\" โกเวนเอ่ยขึ้น หลังจากหลบหลีกการโจมตีของออร์บาที่พยายามพุ่งเข้าใส่เป็นครั้งที่สามได้อย่างง่ายดาย\n\nออร์บาไม่คุ้นชินกับการถูกใครพูดจาหักหน้าอย่างไร้เยื่อใยเช่นนี้มาก่อน ในหัวของเขาเดือดพล่านไปด้วยโทสะยามหมุนตัวตวัดฟันกลับไป ทว่าออร์บาก็ไร้ซึ่งโชคช่วย ไม่ว่าเขาจะพยายามท้าทายโกเวนสักกี่ครั้งก็ตาม สิ่งที่ทำให้ออร์บาหงุดหงิดงุ่นง่านที่สุดก็คือการที่คู่ต่อสู้ดูไม่จริงจังกับเขาเลยแม้แต่น้อย ดังนั้นเขาจึงก่นด่าโกเวน ยั่วยุอีกฝ่าย และพุ่งเข้าชาร์จอย่างไม่คิดชีวิตพลางคำรามว่าจะฆ่าอีกฝ่ายให้ตาย ทั้งที่ในความเป็นจริง ต่อให้พยายามจับตาจ้องมองอย่างระแวดระวังเพียงใด เขากลับไม่อาจมองหาช่องโหว่ของอีกฝ่ายพบเลยสักจุดเดียว\n\n\"แกคิดจะฆ่าข้าจริงหรือ ออร์บา?\"\n\nเพลงดาบที่ออร์บาฝึกปรือด้วยตนเองจนคิดว่าขัดเกลาดีแล้วนั้น ไม่อาจเรียกได้ว่ายอดเยี่ยมเลยสักนิด\n\n\"แต่น่าเสียดายนะ แกไม่เหลืออะไรอีกแล้ว ไม่มีทั้งชื่อ ไม่มีสถานะ ไม่มีเสื้อผ้า ไม่มีอะไรจะกิน และแกก็ทำอะไรกับมันไม่ได้เลย ใช่ แม้กระทั่งชีวิตของแกเอง เหล่าทาสไม่มีแม้แต่อิสรภาพเหนือความเป็นหรือความตายของตัวเองด้วยซ้ำ ต่อให้แกอยากได้มันคืนมา แกก็ไม่อาจไถ่ถอนมันกลับคืนได้เพียงแค่เสนอเงินให้มากกว่าค่าตัวตอนที่แกถูกขายมาหรอกนะ\"\n\nการฝึกฝนอันแสนจะฝ่ายเดียวที่เขามีหน้าที่เพียงแค่ถูกซัดล้มลงไปกองกับพื้นนั้นไม่ต่างอะไรกับการลงทัณฑ์ตัวเองในขุมนรก ทว่าเมื่อวันเวลาล่วงเลยเข้าสู่ยามค่ำคืน ความเจ็บปวดที่แสนสาหัสทรมานยิ่งกว่านั้นก็กำลังซุ่มรอคอยออร์บาอยู่\n\nมันคือ 'คำสาป' ของหน้ากาก ในยามเที่ยงคืน ขณะที่เขากำลังนอนแผ่หมดเรี่ยวแรงอยู่นั้นเอง จู่ๆ มันก็แผ่ความร้อนระอุราวกับเปลวเพลิงที่แผดเผาราวกับกำลังหลอมละลายใบหน้าของออร์บา ไม่ผิดเพี้ยนไปจากความรู้สึกในตอนที่หน้ากากถูกสวมทาบลงบนหน้าเขาเป็นครั้งแรกเลยแม้แต่น้อย\n\nส่วนใหญ่มักเกิดขึ้นในช่วงค่ำคืน โดยเว้นระยะเวลาที่ไม่แน่นอน บางครั้งก็ไม่เกิดอะไรขึ้นติดต่อกันถึงสามวันเต็ม ขณะที่ในบางคราวความร้อนนรกนั่นกลับแผ่เผาออกมาอย่างสม่ำเสมอติดต่อกันนานถึงสามวันสามคืน\n\nในยามนั้น ไม่มีสิ่งใดที่ออร์บาจะทำได้เลย เขาทำได้เพียงกลิ้งเกลือกทุรนทุรายไปบนพื้นดิน ปล่อยให้ข้อเท้าครูดขูดกับสายโซ่จนเลือดไหลอาบ และได้แต่เฝ้าภาวนาให้ความเจ็บปวดนี้มลายหายไปโดยเร็วที่สุด แม้จะเร็วขึ้นเพียงแค่เสี้ยววินาทีเดียวก็ตาม\n\nข้ากำลังจะเป็นบ้า ข้ากำลังจะเป็นบ้า ข้ากำลังจะเป็นบ้า ข้ากำลังจะเป็นบ้าแล้ว!\n\nขณะที่กลิ้งเกลือกไปมาบนพื้น ออร์บาก็หวาดผวาต่อความกลัวนั้นซ้ำแล้วซ้ำเล่า และถึงขั้นคิดขึ้นมาว่าหากปล่อยตัวให้กลายเป็นบ้าไปเสียเลยอาจจะดีเสียกว่าก็ได้ ทว่าพละกำลังที่คอยยึดเหนี่ยวสติเอาไว้จนถึงวินาทีสุดท้าย ชั่วพริบตาก่อนที่ความรู้สึกนึกคิดของเขาจะถูกคลื่นสีขาวสาดซัดกลืนหายไป ก็ยังคงทำงานได้ดีจนได้ในที่สุด ออร์บากัดฟันกรอด แอ่นหลังงอโค้งราวกับกระดูกสันหลังจวนเจียนจะหักสะบั้น เขาอดทนเพียงเพื่อที่จะอดทนเท่านั้น เล็บมือหลายนิ้วของเขาฉีกหักคามือ ขณะที่เขาจิกทึ้งผืนดิน และตะกุยข่วนหน้ากากของตนเอง\n\nทาสคนอื่นๆ รวมถึงเหล่าทหารที่มีหน้าที่รับผิดชอบคอยควบคุมดูแลทาสของคณะนักสู้ทาร์คัส ต่างพากันรู้สึกขยะแขยงสะอิดสะเอียนต่อภาพที่เขาน้ำลายฟูมปากบิดตัวด้วยความเจ็บปวด ข่าวลือแพร่สะพัดออกไปอย่างรวดเร็วว่ามันอาจเป็นคำสาปจากเวทมนตร์ที่แท้จริง จนทำให้ทาร์คัสซึ่งซื้อตัวออร์บามาจากพ่อค้าทาสต้องทำหน้าบูดบึ้งด้วยความหงุดหงิด\n\n\"สินค้าก็คือสินค้า ข้าจะไปสนทำไมวะว่ามันเป็นเวทมนตร์หรือคำสาป!? แค่อย่าปล่อยให้มันตายก่อนที่จะทำเงินชดใช้ค่าตัวให้คุ้มก็พอแล้ว!\"\n\nผู้ที่เอ่ยสั่งการเช่นนั้นอย่างทาร์คัสนับเป็นชายที่ใจแข็งไร้ความหวั่นเกรงอย่างแท้จริง โดยทั่วไปแล้วออร์บาจึงถูกปล่อยปละละเลยไม่ใส่ใจ ตราบใดที่เขายังไม่ตายอย่างหมาข้างถนน\n\nข้าไม่มีวันยอมตาย\n\nมันเป็นค่ำคืนที่แสนยาวนาน... ยาวนานเหลือเกิน เนื้อหนังและกระดูกของเขาถูกความเจ็บปวดและแรงยั่วยุของความบ้าคลั่งขูดข่วนกัดเซาะ จนชวนให้อยากตายเสียให้พ้นๆ ไปในทุกวินาที รู้สึกราวกับว่าราตรีนี้จะไม่มีวันสว่างขึ้นมาอีกตลอดกาล ทว่าในท้ายที่สุด มันก็จบสิ้นลงจนได้ ตราบใดที่ตัวออร์บาเองยังไม่ยอมจำนนมอบชีวิตของตนให้แก่ความมืดมิด รุ่งอรุณย่อมมาเยือนเสมอ ด้วยความเหนื่อยล้าแสนสาหัส เขานอนแผ่หมดสภาพโดยไม่เหลือเรี่ยวแรงในกายแม้แต่หยดเดียว และสัมผัสได้ถึงแสงอาทิตย์ยามเช้าที่สาดส่องลงมากระทบผิวหน้ากาก เขายกมือทั้งสองข้างขึ้นอย่างสั่นเทาแล้วจับกุมหน้ากากไว้ ออกแรงบีบนิ้วมือจนแน่นพร้อมเอ่ยคำสัตย์สาบาน\n\nตราบใดที่ยังไม่มีใครแทงทะลุหัวใจข้าได้ ข้าไม่มีวันยอมปล่อยให้ตัวเองตายเด็ดขาด\n\nมันเป็นจริงอย่างที่โกเวนกล่าวไว้ ชีวิตของข้าไม่ใช่ของข้า แต่ถึงอย่างนั้นมันก็ไม่ได้ตกเป็นของทาร์คัสโดยอัตโนมัติเช่นกัน\n\nชีวิตของข้า พร้อมกับทุกสิ่งทุกอย่างที่ถูกพรากไปจากข้า นั่นแหละคือทั้งหมดที่ข้ามี\n\nหัวใจของเขาเต้นระรัวอยู่เพื่อที่จะมีชีวิตรอดไปจนกว่าจะได้พบหน้ามารดา อลิซ และบางทีอาจจะได้พบพี่ชายโรอันอีกครั้ง กล้ามเนื้อของเขากวัดแกว่งดาบเพียงเพื่อบุกฝ่าไปให้ถึงตัวพวกที่เข้าปล้นฆ่าพวกเขา โดยมีเป้าหมายคือการถมซากศพขึ้นเป็นภูเขาเลากา\n\nนับจากนั้นเป็นต้นมา ออร์บาก็ทุ่มเทจิตวิญญาณทั้งหมดลงสู่การฝึกซ้อม ดาบและร่างกายของออร์บาหลอมรวมเป็นหนึ่งเดียวกันในเวลาอันรวดเร็ว เขากำลังแบกรับความเกลียดชังอันไร้รูปร่างโดยไม่รู้วิธีชำระล้างมันออกไป และแตกต่างจากช่วงเวลาที่เคยเต็มไปด้วยความกระวนกระวายใจ คมดาบได้มอบรูปร่างให้แก่ความเกลียดชังของเขา ดาบของเขาได้แปรเปลี่ยนเป็นหอกแห่งความเกลียดชังที่ฟาดฟันและฉีกกระชากความเคลือบแคลงสงสัยทั้งหมดให้ขาดสะบั้น หรือหากจะกล่าวในอีกแง่หนึ่ง มันได้กลายเป็นความปรารถนาที่จะมีชีวิตอยู่ของเขานั่นเอง\n\n\"หากแกต้องการจะมีชีวิตรอด จงเรียนรู้วิชาที่ใช้สังหารคู่ต่อสู้ และในขณะเดียวกัน ก็จงเรียนรู้ที่จะสังหารตัวแกเองด้วย คนที่ไม่รู้จักฆ่าตัวตนของตนเอง สุดท้ายแล้วก็จะต้องถูกผู้อื่นสังหารลงจนได้ ไม่มีข้อยกเว้น\"\n\nโกเวนกล่าวเช่นนั้นอย่างชัดเจน และออร์บาก็ปฏิบัติตามคำสอนนั้นอย่างเคร่งครัด\n\nเขาสังหารอารมณ์ความรู้สึกของตนเอง เขาแผดเผาพวกมันอย่างบ้าคลั่ง ให้โหมกระพือราวกับเปลวเพลิงทั้งวันและคืน เพื่อจะได้เผาผลาญตัวตนของตนเองให้มอดไหม้ตามไปด้วย ทว่าในขณะเดียวกัน เปลวไฟนั้นก็ไม่อาจดับมอดลงได้เช่นกัน\n\nดังนั้น ในยามเที่ยงคืน แม้จะนอนนิ่งเงียบสงบอยู่ทั้งที่ใบหน้าใต้หน้ากากอาจกำลังถูกแผดเผาไหม้เกรียม ออร์บาก็ยังคงสุมเชื้อฟืนลับของตนเองต่อไป—ความโกรธแค้นและความชิงชังภายในอก—ปล่อยให้พวกมันคุกรุ่นหลอมรวมกลายเป็นถ่านไฟอันร้อนระอุ\n\nไม่นานนัก เขาก็ได้รับโอกาสขึ้นประลองนัดเปิดตัวเป็นครั้งแรก เมื่อออร์บาย่างเท้าเข้าสู่ลานประลอง เขาก็ได้รับการต้อนรับจากฝูงชนจำนวนมหาศาลที่รายล้อมอยู่รอบสังเวียน\n\nท่ามกลางผืนฟ้าและแผ่นดินที่ถูกห่อหุ้มไว้ด้วยเสียงโห่ร้องกึกก้อง ออร์บาเข้าห้ำหั่นกับชายผู้หนึ่งที่จับดาบขึ้นสู้เฉกเช่นเดียวกับเขา และสังหารอีกฝ่ายลงได้ เขาจำไม่ได้ด้วยซ้ำว่าคู่ต่อสู้ของตนนั้นยังหนุ่มแน่นหรือแก่ชรากว่าเขา มีเพียงเสี้ยววินาทีที่เขาสังหารอีกฝ่ายลง และวินาทีที่เสียงโห่ร้องเชียร์อันบ้าคลั่งยิ่งกว่าเดิมถาโถมลงมาบนแผ่นหลังอันชุ่มโชกไปด้วยเหงื่อเท่านั้น ที่เขายังคงจดจำได้ทุกรายละเอียดอย่างแม่นยำ\n\n\"ตายซะ!\" ออร์บาตะโกนก้องพลางแหงนหน้ามองขึ้นไปยังเหล่าผู้ชม \"ตายห่ากันไปให้หมด!!\"\n\nแม้เสียงตะโกนนั้นจะถูกกลืนหายไปท่ามกลางเสียงโห่ร้องยินดี แต่ออร์บาก็ยังคงชูดาบที่อาบย้อมไปด้วยโลหิตขึ้นสูงและพ่นคำผรุสวาทสาปแช่งใส่คนเหล่านั้นทุกคนไม่หยุดหย่อน\n\nและภายในเวลาเพียงหนึ่งสัปดาห์ เขาก็ต้องลงประลองเป็นนัดที่สอง คราวนี้คู่ต่อสู้เป็นชายไว้หนวดเคราที่ถือดาบสั้นใบหยัก มันเป็นการต่อสู้ที่ค่อนข้างน่าอัปยศอดสู อาจมีเสียงโห่เยาะเย้ยดังขึ้น หรืออาจลามปามไปถึงขั้นด่าทอสาปแช่งนามของทวยเทพ สองครั้ง สามครั้ง ที่เขาต้องรับการฟาดฟันอันดุเดือดรุนแรง ทุกครั้งที่ถูกจู่โจม ออร์บาจะปรับเปลี่ยนวิธีจับด้ามดาบ และปรับเปลี่ยนตำแหน่งการวางเท้าของตนเอง เขากำลังเรียนรู้วิธีต่อสู้ท่ามกลางสมรภูมิเดือดจริง\n\nเขาปัดป้องคมดาบที่กำลังจะตวัดฟันเข้ามาจากทางด้านข้าง และร่างของคู่ต่อสู้ก็เปิดช่องว่างโล่งขึ้นตรงหน้าสายตาของเขาพอดี\n\nออร์บากระหน่ำฟันดาบลงไปตรงหน้าอย่างเต็มแรง คมดาบจามผ่าลงตรงกึ่งกลางใบหน้าของอีกฝ่าย โลหิต เศษกระดูก และมันสมองสาดกระจายทะลักออกมาจากทุกทิศทุกทาง มือของเขาเริ่มด้านชาจนแทบไม่หลงเหลือความรู้สึกสัมผัสใดๆ นั่นเป็นครั้งที่สามที่เขาลงมือสังหารคน\n\nออร์บากลายมาเป็นนักสู้แกลดิเอเตอร์และวันเวลาก็ผันผ่านไปเป็นเวลาเกือบสองปีเต็ม ในช่วงเวลานั้นมีการประลองนับครั้งไม่ถ้วน รวมถึงค่ำคืนอันแสนยาวนานไม่รู้จบอีกมากมายที่ใช้เวลาหมดไปกับการนับดวงดาวที่ส่องสว่างเต็มฟากฟ้ายามราตรี\n\nทว่าหลังจากเวลาผ่านพ้นไปหนึ่งปี คำสาปของหน้ากากเหล็กที่คอยแผ่ความร้อนระอุก็ค่อยๆ จางหายไป และเมื่อเวลาผ่านไปอีกครึ่งปี อาการเจ็บปวดอันน่าคลุ้มคลั่งที่แวะเวียนมาเป็นระยะก็สงบเงียบลงอย่างไม่น่าเชื่อ แม้กระนั้น มันก็ยังคงไม่ใช่หน้ากากธรรมดาสามัญอยู่ดี เพราะเขายังคงไม่อาจกระชากมันออกได้ ไม่ว่าจะใช้ด้ามท้ายดาบกระแทกหรือใช้ค้อนทุบลงไปก็ไม่เกิดแม้แต่รอยบุบ ตรงกันข้าม มันกลับมีแต่จะทำให้ชีวิตของเขาเองตกอยู่ในอันตรายเสียเปล่า เขาจึงจำต้องเลื่อนความปรารถนาที่จะถอดหน้ากากนี้ออกไปก่อนอย่างช่วยไม่ได้\n\nและแล้ว—เมื่อเวลาผ่านไปได้ห้าวันนับตั้งแต่ออร์บาหยุดยั้งความคลุ้มคลั่งกระหายเลือดของมังกรโซซอสขนาดยักษ์ที่ลานประลองบา รูซ์ลงได้\n\n\"ข้ารู้แล้วล่ะว่าทำไมเจ้าทาร์คัสถึงได้อารมณ์ดีนักหนา\" จู่ๆ โกเวนก็เอ่ยขึ้นที่โต๊ะอาหารเช้า \"พวกแกคงรู้กันใช่ไหมว่าเมฟิอุสกับการ์เบรากำลังเจรจาสงบศึกกันอยู่? ดูท่าทางในที่สุดพวกเบื้องบนก็วางแผนจะปิดฉากสงครามสิบปีลงเสียทีแล้วล่ะ\"\n\n\"หืม\" ชีคพยักหน้าพลางเอ่ยขึ้น \"ก็หมายความว่าองค์รัชทายาทแห่งเมฟิอุสกับเจ้าหญิงแห่งการ์เบรากำลังจะเข้าพิธีอภิเษกสมรสทางการเมืองกันสินะ?\"\n\n\"เมฟิอุสมีธรรมเนียมปฏิบัติหลายอย่างเกี่ยวกับการอภิเษกสมรสของราชวงศ์ อย่างเช่นคำปฏิญาณแต่งงานจะต้องไปทำพิธีกันที่หุบเขาเซริน แล้วในกำหนดการงานเฉลิมฉลองก็ยังมีการจัดการประลองแกลดิเอเตอร์รวมอยู่ด้วย ดูเหมือนว่าคณะนักสู้ทาร์คัสของพวกเราจะเป็นเพียงคณะเดียวที่ได้รับคัดเลือกให้เข้าร่วมงานนี้\"\n\nไคน์ผิวปากหวือ ช่วงพักหลังมานี้เขามักนั่งซ่อมนาฬิกาด้วยมืออันคล่องแคล่วอยู่บนโต๊ะอาหารตามคำไหว้วานของทาร์คัสเสมอ\n\n\"งั้นก็แปลว่าพวกเบื้องบนจะจับพวกเรามาฆ่าฟันกันเองต่อหน้าพระพักตร์ราชวงศ์เลยสินะ\"\n\n\"พวกเราจะได้เข้าเฝ้าถวายบังคมองค์รัชทายาทด้วยตนเองเชียวนะ น่าตื่นเต้นดีออกใช่ไหมล่ะ ออร์บา?\" ชีคหันมาพูด ขณะที่ออร์บายังคงก้มหน้าโน้มตัวไปข้างหน้าโดยจับจ้องสายตาอยู่บนหน้าหนังสือตามปกติ\n\n\"ไม่เห็นจะมีอะไรเปลี่ยนแปลงเลยสักนิด ไม่มีเลยแม้แต่น้อย ก็แค่เอาดอกไม้มาประดับตกแต่งลงบนชุดเกราะและคมดาบเท่านั้นแหละ\" เขาเอ่ยตอบอย่างห้วนสั้นไร้เยื่อใย"
    },

      "title": "บทที่ 2.2: เด็กหนุ่มทั้งสอง (2)",
      "content": "ยามรุ่งสางเพิ่งจะผ่านพ้นไปได้ไม่นาน เมื่อกิล เมฟิอุสเดินทางกลับมาถึง หลังจากฝากม้าไว้ที่คอกม้าและมุ่งหน้าเดินตรงไปยังประตูหลัง กิลก็จำร่างของไซมอน ร็อดลูมได้ในทันทีและทำสีหน้าบึ้งตึงขึ้นมาทันตา และจากนั้น ก็เป็นไปตามคาด เขาจำต้องจำใจรับฟังคำบ่นของอีกฝ่ายจนหูชา\n\n\"องค์ชายน้อย กระหม่อมไม่ประทับใจเลยพ่ะย่ะค่ะ พระองค์ทรงมัวแต่เที่ยวเตร่เสเพลเช่นนี้ทั้งกลางวันและกลางคืนไม่เว้นแต่ละวัน\"\n\n\"งานอดิเรกชอบดักซุ่มรอคนอื่นของท่านเองก็น่ารังเกียจเหมือนกันนั่นแหละ\"\n\nเขายักไหล่ขึ้นพลางหันกลับไปมองเบื้องหลัง ยังกลุ่มสหายที่ตนเพิ่งไปสังสรรค์มาด้วยกัน พวกเขาทั้งหมดล้วนเป็นบุตรหลานของชนชั้นขุนนาง—สิบเจ็ดถึงสิบแปดคนได้—อายุอานามรุ่นราวคราวเดียวกับกิล และล้วนเป็นเพียงกลุ่มลูกชายคนรองหรือคนสามที่ไม่มีสิทธิ์สืบทอดตำแหน่งผู้นำตระกูลทั้งสิ้น\n\n\"กระหม่อมเองก็ไม่ได้อยากทำตัวเลียนแบบบิดาที่เฝ้ารอการกลับมาของบุตรสาวอย่างกระวนกระวายใจนักหรอกพ่ะย่ะค่ะ ทว่าองค์รัชทายาทเองก็ใกล้จะถึงกำหนดอภิเษกสมรสกับเจ้าหญิงแห่งการ์เบราอยู่รอมร่อแล้ว เรื่องทำนองนี้ย่อมไม่อาจปล่อยผ่านไปได้ ได้โปรดทรงเห็นใจและเข้าใจกระหม่อมด้วยเถิดพ่ะย่ะค่ะ\"\n\n\"ข้ารู้น่า อย่ามาถลึงตาจ้องแบบนั้นสิ ก็เพราะใกล้งานอภิเษกเต็มทีแล้วนี่แหละ ข้าถึงอยากตักตวงอิสรภาพของชีวิตโสดเอาไว้ก่อนที่มันจะสายเกินไป\"\n\n\"แต่กระหม่อมไม่อาจช่วยปกปิดความผิดให้พระองค์ได้ทุกครั้งหรอกนะพ่ะย่ะค่ะ\"\n\n\"ข้าถึงได้บอกท่านยังไงเล่าว่า ข้ารู้แล้ว!\"\n\nกิลทำท่ากำลังจะบันดาลโทสะตามเคย ทว่า...\n\n\"หากทรงทราบดีอยู่แล้วจริงๆ ก็ได้โปรดรีบเสด็จไปผลัดเปลี่ยนฉลองพระองค์โดยด่วนเถิดพ่ะย่ะค่ะ ฝ่าบาทกำลังทรงรอคอยอยู่ที่ประตูพระราชวังแล้ว\"\n\n\"เสด็จพ่อหรือ?\"\n\nสีเลือดพลันจางหายไปจากใบหน้า สีหน้าเกรี้ยวกราดถูกแทนที่ด้วยร่องรอยของความตื่นตระหนกในฉับพลัน นอกจากนี้ ไซมอนยังไม่พลาดที่จะสังเกตเห็นด้วยว่าเหล่าสหายขององค์ชายต่างพากันลอบหัวเราะเยาะอยู่เงียบๆ\n\n\"งั้นไว้เจอกันใหม่นะเพื่อน\"\n\n\"องค์ชาย พอถึงรุ่งเช้าวันวิวาห์ พวกเรามาจัดงานรื่นเริงตลอดคืนกันอีกรอบเถอะพ่ะย่ะค่ะ\"\n\nเป็นไปตามคาด แม้ท่าทีภายนอกของคนเหล่านั้นจะดูสนิทสนมเป็นกันเองอย่างยิ่ง ทว่าแท้จริงแล้วกลับแฝงความเหินห่างเอาไว้ ทั้งที่บิดาของทุกคนล้วนเป็นขุนนางผู้มีชื่อเสียงโด่งดัง พวกเขากลับคอยตามติดอยู่รอบกายองค์ชายเกือบทั้งวันทั้งคืน ภายในดินแดนแห่งเมฟิอุสซึ่งอุดมไปด้วยหุบเหวลึก พวกเขาพากันแข่งม้าพันธุ์หายากตามท้องถนน เชื้อเชิญหญิงสาวจากตระกูลผู้ดีมีสกุลมาคอยปรนนิบัติให้ความบันเทิงริมแม่น้ำ เล่นการพนัน เลียนแบบการออกล่าสัตว์ ดื่มสุรา และจัดงานเลี้ยงสำมะเลเทเมาอันไร้แก่นสาร\n\nแต่ก็นั่นแหละ นั่นเป็นเพียงภาระหน้าที่ของพวกมันเท่านั้น ไซมอนครุ่นคิดในใจ\n\nทั้งประเทศชาติและเหล่าทหารต่างเหนื่อยล้าเต็มทนจากสงครามที่ยืดเยื้อมานานปี ทว่าแม้การสู้รบกับการ์เบราจะดำเนินมาถึงจุดสิ้นสุดในที่สุดโดยมีงานอภิเษกสมรสทางการเมืองเป็นผู้รูดม่านปิดฉาก แต่มันกลับมิใช่ผลลัพธ์อย่างที่ทุกผู้คนเคยคาดหวังไว้ ซ้ำร้ายไปกว่านั้น ระหว่างการเจรจาสงบศึก ดินแดนอัปตาทางตอนใต้ซึ่งมีบทบาทเป็นจุดยุทธศาสตร์สำคัญกลับถูกแบ่งแยกออกโดยที่เมฟิอุสเป็นฝ่ายเสียเปรียบอย่างหนัก\n\nท่ามกลางสองอาณาจักรอย่างเมฟิอุสและการ์เบรา มีดินแดนหนึ่งคั่นกลางอยู่ นั่นคือ ดัชชีเอนเด แม้จะไม่ได้มีอาณาเขตกว้างใหญ่ไพศาลนัก ทว่าประเทศนี้กลับมีประวัติศาสตร์อันยาวนานซึ่งสามารถสืบสาวรากเหง้ากลับไปได้ถึงจุดเริ่มต้นของยุคราชวงศ์เวทมนตร์ ทั้งยังมีความสัมพันธ์อันแน่นแฟ้นกับกลุ่มประเทศริมอ่าวฟากทะเลอีกด้วย ยิ่งไปกว่านั้น เนื่องจากชาติมหาอำนาจทางตะวันออกอย่าง อาริออน มีความสัมพันธ์อันยาวนานสืบเนื่องมาจากสายโลหิตที่คล้ายคลึงกัน พวกเขาจึงมิใช่คู่ต่อสู้ที่จะมองข้ามได้ง่ายๆ หากตัดสินใจเข้าร่วมชิงความเป็นใหญ่เหนือใจกลางทวีป\n\nเอนเดมิได้เข้าแทรกแซงในสงครามสิบปี แต่แม้จะยังคงรักษาความสัมพันธ์ทางการค้าขนาดย่อมกับทั้งสองประเทศแยกจากกันเรื่อยมา ทว่าพักหลังมานี้กลับเริ่มแสดงสัญญาณว่าจะก่อตั้งพันธมิตรทางทหารร่วมกับการ์เบราขึ้นมา\n\nทันทีที่องค์จักรพรรดิแห่งเมฟิอุสทรงได้รับรายงานข่าวกรองดังกล่าว พระองค์ก็ทรงกลืนคำสัตย์สาบานที่เคยเปล่งไว้เมื่อสามปีก่อนต่อหน้าสิ่งศักดิ์สิทธิ์ ณ วิหารเทพมังกรได้อย่างง่ายดาย—คำสาบานที่ว่า 'ตราบใดที่ยังไม่ได้เห็นศีรษะของกษัตริย์การ์เบราถูกนำมาวางถวายตรงหน้า ข้าจะไม่มีวันเก็บดาบเข้าฝักเป็นอันขาด'—และทรงยื่นข้อเสนอขอเจรจาสงบศึกกับการ์เบราในทันที\n\nแน่นอนว่าการ์เบราเองก็ไม่ได้มั่นใจในความเปลี่ยนใจอันกะทันหันของพระองค์นัก ทว่าฝ่ายนั้นเองก็มีความขัดแย้งภายในอยู่เช่นเดียวกัน หากจับมือเป็นพันธมิตรกับเอนเดอย่างเต็มกำลัง ก็อาจเพียงพอที่จะบุกโจมตีเมฟิอุสได้อยู่ดี ทว่าสงครามที่ผ่านมาได้สร้างความเสียหายและความพินาศย่อยยับให้แก่การ์เบราไว้มากเหลือเกิน ยิ่งไปกว่านั้น หากเพิ่มพูนปฏิบัติการทางทหารร่วมกับเอนเดมากขึ้น ก็ย่อมก่อให้เกิดความวิตกกังวลว่าเอนเดอาจจะเข้ามาแทรกแซงจัดการดินแดนของตนตามอำเภอใจได้\n\nสำหรับการ์เบราที่กำลังเผชิญหน้ากับภาวะกลืนไม่เข้าคายไม่ออกเช่นเดียวกัน โดยมีเมฟิอุสยืนตระหง่านอยู่ข้างกาย ดินแดนอัปตาจึงถูกหยิบยกขึ้นมาเป็นข้อต่อรอง ในท้ายที่สุด จากผลของการชั่งน้ำหนักทางเลือกต่างๆ การ์เบราจึงยอมตกลงรับคำร้องขอเป็นพันธมิตรของเมฟิอุส\n\nสำหรับองค์จักรพรรดิเอง พระองค์ก็คงทรงมองว่านี่เป็นการตัดสินใจอันแสนขมขื่นเช่นเดียวกัน\n\nทั้งภายในและภายนอกประเทศ กูล เมฟิอุส มักถูกผู้คนกระซิบเรียกขานลับหลังว่า 'จักรพรรดิดวงใจมังกร' ส่วนหนึ่งก็เป็นสัญลักษณ์แห่งความหวาดกลัวตามตัวอักษร ทว่าอีกส่วนหนึ่งกลับเป็นเพียงคำประชดประชันเสียดสีเท่านั้น\n\nในช่วงเวลาราวปีที่หกของการทำสงครามกับการ์เบรา—ซึ่งเป็นช่วงเวลาเดียวกับที่ทรงกระทำพิธีพยากรณ์ต่อหน้าเทพเจ้าดังกล่าว—กูลได้ทรงใช้อำนาจตามอำเภอใจเสริมสร้างอิทธิพลของราชวงศ์ให้แข็งแกร่งขึ้นเพื่อป้องกันความสับสนในสายการบังคับบัญชา ส่งผลให้สภาขุนนางซึ่งประกอบด้วยเหล่าขุนนางชั้นผู้ใหญ่สูญเสียอำนาจไปครึ่งหนึ่ง และในปัจจุบันก็แทบจะดำรงอยู่เพียงแค่ในนามเท่านั้น\n\nไซมอน ร็อดลูม เองก็เป็นหนึ่งในสมาชิกสภาดังกล่าว ทว่าตระกูลร็อดลูมในเวลานี้กลับไร้ซึ่งผู้สืบทอด ทั้งนี้เพราะเมื่อสิบสองปีก่อน เพื่อแลกกับการได้ก้าวขึ้นดำรงตำแหน่งประธานสภา นครป้อมปราการทางตะวันตกอันเป็นหัวใจหลักของดินแดนตระกูลจึงถูกโอนมอบให้แก่ขุนนางตระกูลอื่นไป ดังนั้น ในเมื่อปัจจุบันเขาไม่มีดินแดนให้ปกครองและไม่มีกองทหารให้บัญชาการ เขาจึงเป็นขุนนางจากตระกูลอันทรงเกียรติเพียงแค่ในนามเท่านั้น\n\nสถานการณ์ของเขาแทบไม่ต่างอะไรจากขุนนางคนอื่นๆ นอกเหนือจากพวกที่รักษาอิทธิพลไว้ได้ด้วยการยอมก้มหัวรับใช้สอพลอองค์จักรพรรดิมานานหลายชั่วอายุคนแล้ว สำหรับผู้ที่ปรารถนาจะได้เห็นความก้าวหน้าในประเทศแม้เพียงเล็กน้อย เมฟิอุสในยามนี้ก็เป็นได้เพียงสถานที่อันแสนอึดอัดหายใจไม่ออกเท่านั้น\n\nไซมอนคิดว่าตนเองมีสภาพคล้ายคลึงกับพวกที่เดินตามติดองค์ชายเมื่อครู่ไม่น้อย จึงพอมีความเห็นอกเห็นใจต่อบรรดาลูกชายคนรองของเหล่าขุนนางเหล่านั้น ในเมื่อคนเหล่านั้นไม่มีทั้งตำแหน่งที่แน่นอนหรืออนาคตให้ตั้งตารอคอย หากสงครามยุติลง และผู้ที่สร้างชื่อเสียงให้ตนเองในสนามรบได้รับพระราชทานบรรดาศักดิ์ ก็คงไม่อาจจัดสรรดินแดนส่วนขยายใดๆ ให้พวกเขาครอบครองได้อีก\n\nแน่นอนว่านี่คือโลกของบรรดาประเทศที่กระหายสงคราม แม้ตัวสงครามเองอาจจะไม่ได้สูญสลายหายไปตลอดกาลหลังจากนี้ก็ตาม ทว่าด้วยสภาพที่เมฟิอุสในเวลานี้ถูกห่อหุ้มไว้ด้วยความรู้สึกเบื่อหน่ายสงคราม โอกาสครั้งใหม่ก็คงจะเวียนมาบรรจบอีกทีในอีกห้าปี สิบปี หรือกระทั่งยี่สิบปีข้างหน้าโน่น\n\nความประชดประชันของสมญานาม 'จักรพรรดิดวงใจมังกร' แฝงอยู่ในข้อเท็จจริงที่ว่า แม้พระองค์จะทรงถูกมองว่าเป็นจอมเผด็จการผู้ทรงอำนาจสิทธิ์ขาดภายในแผ่นดินเกิด ทว่าในระยะหลังมานี้ พระองค์กลับไม่อาจสำแดงอิทธิพลเหนือดินแดนต่างชาติได้เลยแม้แต่น้อย\n\nแม้บางทีมันอาจจะเหมาะสมดีแล้วกับการเป็นสัญลักษณ์สะท้อนสภาพปัจจุบันของเมฟิอุสก็ตาม\n\nไซมอนครุ่นคิดเช่นนั้นโดยไม่ลังเลที่จะมีความเห็นทำนองนี้ พร้อมกับเผยรอยยิ้มเยาะหยันตนเองจางๆ ระหว่างยืนรอให้องค์รัชทายาทเตรียมพระองค์ให้เสร็จสิ้น ไซมอนซึ่งเกษียณออกจากตำแหน่งประธานสภามาแล้ว บัดนี้มีสภาพไม่ต่างอะไรกับพระพี่เลี้ยงคอยดูแลองค์ชายเลยสักนิด\n\nครั้นกิลรีบร้อนพุ่งพรวดออกมาจากห้องพักในชุดฉลองพระองค์และทรงผมที่จัดแต่งใหม่เรียบร้อย ไซมอนจึงเอ่ยเชิญให้กิลก้าวเดินเคียงข้างไปพร้อมกัน\n\n\"ท่านนี่มันเจ้ากี้เจ้าการอยู่ตลอดเวลาเลยนะ ไซมอน เหมือนนางคณิกาขี้บ่นไม่มีผิด\"\n\n\"ไม่จำเป็นต้องกริ้วหรอกพ่ะย่ะค่ะ ไม่อย่างนั้นพระองค์จะต้องทรงได้ยินน้ำเสียงแบบนี้ทุกวี่ทุกวันเมื่อทรงอภิเษกสมรสแล้วนะพ่ะย่ะค่ะ\"\n\n\"ทำไมข้าจะโกรธไม่ได้เล่า? ข้าไม่มีทางยอมทำตามคำสั่งของเมียที่อายุน้อยกว่าข้าตั้งสามปีหรอกนะ\"\n\n\"แม้เจ้าหญิงวิลีนาแห่งการ์เบราจะทรงพระเยาว์ แต่พระนางก็ทรงเป็นผู้ที่ผ่านร้อนผ่านหนาวมามากพ่ะย่ะค่ะ ทั้งยังทรงเตรียมพระทัยไว้พร้อมแล้วที่จะเผชิญหน้าห้ำหั่นกับองค์ชายด้วย\"\n\n\"อะไรกัน พูดจาอย่างกับมันเป็นสนามรบอย่างนั้นแหละ?\"\n\n\"ชีวิตสมรสก็คือสมรภูมิรบพ่ะย่ะค่ะ เส้นแบ่งอันคลุมเครือระหว่างผู้ชนะกับผู้แพ้มีแต่จะยิ่งบางลงเรื่อยๆ การล่วงรู้ข้อมูลของฝ่ายตรงข้ามไว้ล่วงหน้าก็นับเป็นสิ่งสำคัญเช่นกัน เช่นนั้นแล้ว พระองค์ทรงพร้อมจะรับฟังกระหม่อมกราบทูลหรือยังพ่ะย่ะค่ะ?\"\n\nแม้กิลจะตั้งใจเพียงแค่พูดหยอกล้อเล่น ทว่ามันกลับไปแหย่รังแตนเข้าอย่างจัง และไซมอนที่ไม่ยี่หระต่อสายตาขวางขุ่นของกิลเลยแม้แต่น้อยก็เริ่มเอ่ยเล่าเรื่องราวเกี่ยวกับเจ้าหญิงวิลีนาขึ้นมาทันที\n\nเรื่องราวเกิดขึ้นเมื่อราวห้าปีก่อน ในช่วงที่การ์เบรากำลังตกอยู่ท่ามกลางไฟกบฏ นั่นเป็นฝีมือของเหล่าขุนนางท้องถิ่นที่ลอบติดต่อสมคบคิดกับเมฟิอุสอย่างลับๆ พวกมันเปิดฉากบุกโจมตีคฤหาสน์ที่อดีตกษัตริย์องค์ก่อนประทับอยู่เป็นแห่งแรก จากนั้นจึงเข้ายึดพื้นที่ไว้ได้ เจ้าหญิงวิลีนาที่เสด็จมาเที่ยวเล่นอยู่ที่นั่นพอดีจึงพลอยถูกจับเป็นตัวประกันร่วมกับเสด็จปู่ผู้เป็นอดีตกษัตริย์ของพระนางด้วย ทว่าเจ้าหญิงซึ่งในเวลานั้นมีพระชันษาเพียงเก้าขวบกลับไม่ทรงแสดงอาการหวาดหวั่นต่อเหล่ากบฏเลยแม้แต่น้อย และดูเหมือนจะทรงยืนหยัดต่อกรกับพวกมันได้อย่างน่าชื่นชม โดยทรงเรียกร้องให้ปล่อยตัวประกันทั้งหมดทุกคนยกเว้นพระองค์เอง\n\nนอกจากนี้ เมื่อเทียบกับต่างชาติอื่นๆ การ์เบรายังคงขุดเจาะเหมืองฟอสซิลกระดูกมังกรอย่างขะมักเขม้น เพื่อสกัดบริสุทธิ์วัตถุดิบดิบให้กลายเป็นโลหะไร้น้ำหนักที่รู้จักกันในชื่อศิลามังกร ซึ่งกลายเป็นแหล่งรายได้มหาศาลของอาณาจักร และเจ้าหญิงวิลีนาก็ทรงเลื่องลือในฐานะผู้เชี่ยวชาญในการขับเรือเหาะที่นั่งเดี่ยวแบบการ์เบราซึ่งเพิ่งโด่งดังขึ้นมาและสร้างขึ้นจากโลหะชนิดเดียวกันนี้อีกด้วย\n\n\"แน่นอนว่า พระนางทรงประดับเกียรติยศให้แก่การแข่งขันเรือเหาะซึ่งจัดขึ้นในการ์เบราทุกๆ สองสามปี ด้วยการคว้าตำแหน่งรองชนะเลิศมาครองได้อย่างงดงามพ่ะย่ะค่ะ\"\n\n\"ผู้หญิงก็ขี่เรือเหาะด้วยรึ?\" กิลเอ่ยพลางทำหน้าเบื่อหน่าย \"ให้ตายสิ อายุผ่านสิบสี่มาแล้วแท้ๆ แต่ก็ยังทำตัวเป็นเด็กอยู่เลย ในเมฟิอุสไม่เคยมีใครคิดภาพผู้หญิงเหาะเหินเดินอากาศด้วยยานพาหนะพรรค์นั้นมาก่อนเลยนะ ข้าจินตนาการไม่ออกด้วยซ้ำว่าเมียของข้ามาขับเรือเหาะโลดโผนโจนทะยานอยู่เหนืออุทยานพระราชวัง ผู้คนคงพากันชี้ไม้ชี้มือหัวเราะเยาะข้าเป็นตัวตลกกันทั้งเมือง เหตุใดองค์ชายองค์แรกผู้ประสูติในเมฟิอุสอันเก่าแก่จึงต้องมอบอิสรภาพพรรค์นั้นให้เจ้าสาวของตนด้วยเล่า? ข้ายอมไปมองหาสาวงามตามธรรมชาติที่ไหนสักแห่งในเมืองยังจะดีเสียกว่า! ไซมอน พอจะมีทางยกเลิกงานแต่งงานนี้ได้บ้างไหม ต่อให้เป็นตอนนี้ก็เถอะ?\"\n\nเขาทอดถอนใจอย่างไม่ยี่หระ ทว่าไซมอนต่างหากที่อยากจะถอนหายใจให้ดังกว่านั้นหลายเท่า หากองค์รัชทายาทเสด็จขึ้นสืบราชบัลลังก์จักรวรรดิโดยเอาแต่ให้ความสำคัญกับรสนิยมส่วนพระองค์เหนือกว่าประเทศชาติและราษฎรเช่นนี้ล่ะก็...\n\nองค์ชายก็ไม่ได้ทรงเป็นคนเลวร้ายอะไรหรอก แต่สิ่งที่พระองค์ตรัสออกมาเมื่อครู่มีแต่จะก่อให้เกิดแผนร้ายและความปั่นป่วนรุนแรงเท่านั้น ไซมอนคิดในใจ ส่วนพระราชบิดาของพระองค์นั้นทรงเป็นวีรบุรุษ แม้จะทรงสูญเสียดินแดนทางตอนใต้ไปบางส่วน แต่พระองค์ก็ทรงมีความสามารถถึงขั้นบรรลุข้อตกลงสันติภาพกับการ์เบราได้ภายในชั่วพริบตาเดียว ชิงไหวชิงพริบตัดหน้าเอนเดได้อย่างเหนือชั้น\n\nทว่าในทางกลับกัน พระองค์กลับทรงไม่ใช่บิดาที่ดีเลยสักนิด\n\n\"เสด็จพ่อ ทรงเรียกหาลูกหรือพ่ะย่ะค่ะ?\"\n\nทั้งสองเดินมาถึงห้องประทับส่วนพระองค์ขององค์จักรพรรดิ เวลานี้ยังคงเช้าตรู่มากและท้องพระโรงใหญ่ของราชสำนักยังไม่เปิดทำการ ทว่าองค์จักรพรรดิกูลผู้ใจร้อนซึ่งประทับเสวยพระกระยาหารเช้าอยู่ ทรงตัดสินพระทัยอนุญาตให้ขุนนางหลายคนทยอยเข้าเฝ้าทีละคนเพื่อรับฟังคำกราบทูลเรียบร้อยแล้ว\n\nจากนั้น ต่อหน้าเหล่าขุนนางมากมาย—บรรดาผู้ที่จะก้าวขึ้นมาเป็นข้าราชบริพารของกิลในภายภาคหน้า—ผู้เป็นบิดาก็เปิดฉากบริภาษด่าทอบุตรชายของตนอย่างเปิดเผย\n\n\"นี่มันผ่านมานานเท่าไรแล้วนับตั้งแต่ข้ามีรับสั่งเรียกตัวเจ้า!? เจ้ายังไม่มีทั้งดินแดนในปกครอง ไม่มีทหารแม้แต่คนเดียวที่ฝากชีวิตไว้กับเจ้า ไม่มีแม้แต่งานสักชิ้นที่ได้รับมอบหมาย แต่เจ้ากลับกล้าแอบหนีออกไปเถลไถลลับสายตาข้าแบบนั้นงั้นรึ? ยังไงเจ้าก็คงมัวแต่หมกมุ่นอยู่กับชีวิตเสเพลยามราตรีอันไร้ค่าของเจ้านั่นแหละ\"\n\n\"หามิได้พ่ะย่ะค่ะ เสด็จพ่อ ลูก...\"\n\n\"สรุปว่าลูกชายคนเดียวที่ข้าให้กำเนิดขึ้นมา ก็เป็นได้แค่ไอ้คนเกียจคร้านไร้ประโยชน์อย่างเจ้านี่เอง ช่างเป็นความจริงอันแสนน่าสมเพชเสียนี่กระไร ที่ประวัติศาสตร์อันยาวนานของราชวงศ์พวกเราจะต้องมาเผชิญกับหายนะเช่นนี้\"\n\nไซมอนจับจ้องมองแผ่นหลังที่สั่นเทาขององค์ชาย ข้ามไหล่ของกิลไป เขายังมองเห็นร่างขององค์จักรพรรดิที่กำลังกริ้วเกรี้ยวกราด ริ้วรอยเหี่ยวย่นลึกปรากฏชัดขึ้นบนพระพักตร์ยามโทสะของพระองค์ทวีความรุนแรงดุร้ายยิ่งขึ้น\n\n\"ดูเหมือนเจ้าหญิงวิลีนาจะทรงเป็นเจ้าหญิงผู้กล้าหาญชาญชัยเอาการเลยทีเดียว ข้าได้ยินมาว่านางสามารถบังคับปืนและเรือเหาะได้เก่งกาจยิ่งกว่าผู้ชายธรรมดาทั่วไปเสียอีก เจ้ามันเทียบไม่ติดฝุ่นด้วยซ้ำ บางทีความสำเร็จอันสมชายชาตรีเพียงอย่างเดียวที่เจ้ามีอยู่ ก็คงเป็นการที่เจ้ากำลังจะได้แต่งงานกับนางนั่นแหละ เจ้าเคยมีเกียรติยศในการสังหารมังกร จับกุมผู้รอดชีวิตจากเผ่าริวจิน หรือบางทีอาจเคยค้นพบยานอวกาศโบราณที่ฝังจมอยู่ในซากโบราณสถานบ้างหรือเปล่าล่ะ? โอ้ นั่นแหละคือวีรกรรมอันคู่ควรแก่ตัวเอกในตำนานมหาวีรบุรุษเชียวนะ!\"\n\nองค์จักรพรรดิตบพระหัตถ์ลงบนโต๊ะอย่างสำราญพระทัย ซื้อเสียงหัวเราะครืนจากเหล่าข้าราชบริพารที่ยืนเรียงรายอยู่โดยรอบ ครั้นมีหลายคนพากันหัวเราะคล้อยตาม พระองค์ก็ตรัสเสริมต่อด้วยความพึงพอใจว่า\n\n\"เจ้าก็ระวังตัวไว้ให้ดีก็แล้วกัน ไม่อย่างนั้นไม่ทันรู้ตัว เจ้าอาจจะเป็นฝ่ายที่ต้องสวมชุดกระโปรงแล้วถูกอุ้มขึ้นเตียงเสียเองก็ได้นะ\"\n\nช่างเป็นภาพที่น่าสมเพชเวทนาเสียนี่กระไร\n\nแน่นอนว่าไซมอนไม่ได้พึมพำถ้อยคำเหล่านั้นออกมาให้ใครได้ยิน\n\nท่ามกลางผู้ร่วมโต๊ะเสวยในมื้อนั้นมี อิเนลี บุตรสาวคนโตของเมลิสซา พระมเหสีองค์รองของจักรพรรดิรวมอยู่ด้วย เบื้องหน้าเด็กสาวผู้มีผิวขาวผ่องและเกล้าผมทรงสูงสง่างามผู้นั้น ไซมอนเคยเห็นมาแล้วว่ากิลมักจะกลายเป็นคนหูเบาหวั่นไหวง่ายขึ้นมากเพียงใด แม้เมื่อวานนี้นางจะเป็นฝ่ายชวนองค์ชายกิลไปชมการประลองแกลดิเอเตอร์เองแท้ๆ แต่นางก็ยังก้มหน้าลงซ่อนรอยยิ้มกลั้นขำเอาไว้เช่นกัน\n\nในท้ายที่สุด กิลก็แทบไม่ได้เอื้อนเอ่ยถ้อยคำใดตอบโต้เลยแม้แต่คำเดียว\n\n\"ข้าเองก็คิดว่ามันออกจะน่าทุเรศตาอยู่สักหน่อยเหมือนกันนะ\"\n\nทันทีที่องค์จักรพรรดิเสด็จออกจากห้องไป เฟดอม ออลิน ก็เอ่ยทักไซมอนขึ้นมาทันที\n\nแม้เขาจะมีอายุน้อยกว่าไซมอนอยู่มาก ทว่าด้วยเรือนร่างที่อวบอ้วนพอกพูนไปด้วยไขมัน จึงทำให้ดูตัวใหญ่โตกว่ามาก เขาเป็นขุนนางผู้มีหน้าที่ดูแลรับผิดชอบป้อมปราการบิรัคและพื้นที่โดยรอบ ทั้งยังเป็นหนึ่งในแกนนำหลักผู้ดำเนินงานเจรจาสงบศึก และดูมีอนาคตไกลกว่าบรรดาขุนนางอื่นๆ ที่มีแววตาซังกะตายเป็นไหนๆ ไซมอนจึงคอยจับตาดูเขาอยู่ไม่คลาดสายตา\n\nแม้ในความเป็นจริง นั่นจะแทบไม่ได้หมายความว่าเขาเป็นยอดคนแต่อย่างใดเลยก็ตาม\n\n\"ท่านคงคาดหวังไม่ได้หรอกนะว่าองค์ชายจะสามารถแบกรับประเทศนี้ไว้บนบ่าอันแสนไม่น่าเชื่อถือคู่นั้นได้ แน่ล่ะ หากเทียบกับคนที่เกิดมามีชะตากรรมต้องนอนข้างถนน ก็คงเรียกได้ว่าพระองค์ทรงโชคดีอยู่หรอก\"\n\nเขาส่ายศีรษะอย่างเคร่งขรึม ก่อนจะลดเสียงลงเป็นกระซิบแผ่วเบา\n\n\"กระแสต่อต้านราชวงศ์กำลังทวีความรุนแรงมากขึ้นเรื่อยๆ องค์จักรพรรดิกูลยังคงรวบรวมความเคารพยำเกรงและความหวาดกลัวไว้ได้มากเพราะผลงานในอดีต แต่พอเป็นเรื่องขององค์ชายกิล... ตามสถานการณ์ที่เป็นอยู่นี้ พวกที่มองว่าพระองค์ไม่ได้ความก็อาจไม่จำเป็นต้องปรากฏตัวออกมาอย่างเปิดเผยด้วยซ้ำ ไม่สิ ไม่ แต่เมื่อคำนึงถึงอนาคตของประเทศชาติแล้ว พวกเราจะสามารถตราหน้าคนเหล่านั้นว่าเป็นกบฏได้จริงๆ หรือ?\"\n\nเห็นได้ชัดอย่างยิ่งว่าคำว่า 'คนเหล่านั้น' ย่อมหมายถึงตัวเขาเองนั่นแหละ เขากำลังจงใจปั่นหัวปลุกปั่นไซมอนอย่างโจ่งแจ้ง เพื่อหยั่งเชิงดูว่าไซมอนจะสามารถกลายมาเป็นพันธมิตรในอนาคตได้หรือไม่ เพราะอาจมีผู้คนล้มตายลงเป็นจำนวนมากยิ่งกว่ายอดผู้เสียชีวิตจากสงครามเสียอีก หากเมฟิอุสเป็นฝ่ายพ่ายแพ้ในสงครามสิบปีต่อการ์เบรา\n\n\"องค์ชายยังทรงพระเยาว์นัก\" ไซมอนเอ่ยตอบโดยไม่แสดงความเปลี่ยนแปลงทางสีหน้าเลยแม้แต่น้อย \"สิ่งใดก็ยังสามารถเกิดขึ้นได้หลังจากนี้ แม้แต่ในสมัยที่ฝ่าบาทยังทรงพระเยาว์ ก็ยังไม่มีวี่แววเลยว่าพระองค์จะทรงก้าวขึ้นมาเป็น 'ดวงใจมังกร' ได้ พวกเราต้องร่วมมือกันสนับสนุนองค์ชายน้อย และสร้างอนาคตของชาติบ้านเมืองไปด้วยกัน\"\n\n\"ฮ่าๆ! สมกับเป็นท่านจริงๆ นะ ท่านไซมอน สายตาของท่านมองตรงไปยังอนาคตเสมอ\"\n\nเฟดอมยกมือขึ้นลูบปลายคางที่หย่อนยานอย่างชัดเจนของตนไปมา ไซมอนเผลอหลุดยิ้มออกมาโดยไม่ตั้งใจ\n\nเอาเถอะ ชักสงสัยเสียแล้วสิว่าชายผู้นี้จะสามารถเข้าใจคำพูดแสนซื่อตรงราวกับนักเรียนดีเด่นของข้าเมื่อครู่ได้หรือไม่\n\nแน่นอนว่าไซมอนย่อมรู้สึกวิตกกังวลต่อสภาพปัจจุบันของเมฟิอุส ในเมื่อเวลานี้องค์ชายยังไม่สามารถทำคุณประโยชน์อันใดได้เลย\n\nทว่า ถึงแม้จะมีความหวาดหวั่นเช่นนั้นอยู่เต็มอก ทุกสิ่งทุกอย่างอาจจะเริ่มพลิกคว่ำคะมำหงายไปในทิศทางที่ไม่มีใครคาดคิดในอีกไม่ช้านี้ก็เป็นได้ และตัวไซมอนเองก็จะไม่ยอมแยกห่างออกไปจากผู้ที่เกี่ยวข้องโดยเด็ดขาด การได้สัมผัสกับความเปลี่ยนแปลงอันเป็นโชคชะตาขององค์ชายกิล เมฟิอุสอย่างใกล้ชิดเช่นนี้ ยังไงก็ยังดีกว่าวิธีการของเฟดอม ออลินอยู่ดี"
    },
