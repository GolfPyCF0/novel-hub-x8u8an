      "title": "บทที่ 2.3: เด็กหนุ่มทั้งสอง (3)",
      "content": "สิ่งที่เรียกขานกันว่าจักรวรรดิเมฟิอุส ซึ่งภาคภูมิใจในอำนาจอันเกรียงไกรในฐานะ 'ราชวงศ์จักรพรรดิ' นั้น สามารถสืบสาวประวัติศาสตร์ย้อนกลับไปได้ถึงเจ็ดชั่วรุ่นก่อนหน้าองค์จักรพรรดิกูล เมฟิอุส พระองค์ปัจจุบัน\n\nที่ราบดอมิกซึ่งทอดตัวตัดเฉียงผ่านแนวเทือกเขาคืออาณาเขตทั้งหมดในครอบครองเวลานี้ หอคอยทมิฬอันเลื่องชื่อ ซึ่งรู้จักกันในนาม 'ดาบที่หลอมขึ้นจากซากหัวเรือผู้อพยพอวกาศ' ตั้งตระหง่านอยู่ ณ จุดศูนย์กลาง โดยมีราชธานีโซลอนโอบล้อมเป็นวงกลมอยู่โดยรอบ ท่ามกลางปราการธรรมชาติอันสลับซับซ้อนของหุบเหวลึก มีป้อมปราการขนาดย่อมที่ไม่แม้แต่จะคู่ควรเรียกว่าปราสาทถูกสร้างขึ้นมากมาย ซึ่งทำหน้าที่ปกป้องเมืองหลักหลายแห่งตลอดจนหมู่บ้านน้อยใหญ่ที่กระจายตัวอยู่ประปราย ป้อมปราการรวมถึงเมืองและหมู่บ้านรอบข้างแต่ละแห่งต่างมีเจ้าหน้าที่ประจำเขตคอยปกครองดูแล ขณะที่เหล่าขุนนางก็เข้าช่วงชิงและบัญชาการเหนือดินแดนหลายส่วนเหล่านั้นตามลำดับ\n\nยามเย็นย่ำมาเยือน\n\nกิล เมฟิอุส กำลังควบอาชาตัวโปรดให้วิ่งห้อไปด้วยความเร็วสูงอย่างบ้าคลั่ง\n\nทางทิศตะวันตก ผืนที่ราบดอมิกกำลังทอประกายส่องแสงสีแดงฉานเจิดจ้า ขณะที่ทางทิศตะวันออก แนวเทือกเขาและผาสูงชันตั้งตระหง่านดุจกำแพงดำทะมึน โอบล้อมผืนแผ่นดินไว้ในความมืดมิด หากเขาแหงนหน้ามองขึ้นไปยังแนวลาดชันทางทิศตะวันตก เขาก็จะมองเห็นภูเขาหินผาซึ่งตระกูลเมฟิอุสได้สร้างปราสาทขึ้นเมื่อสามชั่วอายุคนก่อน ต้องอาศัยทั้งพละกำลังของมังกรและมนุษย์ ทั้งยังเล่าลือกันว่าถึงขั้นต้องยืมมือจอมเวทหลายคนซึ่งหาได้ยากยิ่งในเมฟิอุส เพื่อสลักเสลาคฤหาสน์หินปูนแห่งนี้ขึ้นมาอย่างประณีต แม้ในตอนแรกมันจะถูกใช้เป็นหอประชุมสภาขุนนางหลังสร้างปราสาทหลังใหม่เสร็จสิ้น ทว่าในยามนี้ มันกลับดำรงอยู่เพียงแค่ในนามเท่านั้น\n\nทว่ากิลหาได้ปรายตามองสิ่งปลูกสร้างทางประวัติศาสตร์เหล่านั้นเลยแม้แต่น้อย ขณะที่เขาควบม้าลงสู่ถนนในตัวเมือง ผ่านรูปปั้นของปฐมกษัตริย์ผู้ก่อตั้งเมฟิอุสและเหล่ามหาวีรบุรุษมากมายที่เรียงรายอยู่ตามแนวระเบียงธรรมชาติ\n\nบัดซบเอ๊ย!\n\nไม่ว่าจะพยายามทำหัวสมองให้ว่างเปล่าเพียงใด ใบหน้าของพระบิดา เสียงหัวเราะเยาะเย้ยถากถาง ตลอดจนภาพไหล่ที่ลู่ลงและร่างที่สั่นระริกของอิเนลีก็ยังคงหวนกลับมาหลอกหลอนซ้ำแล้วซ้ำเล่า\n\n\"เรื่องแผนการของวันพรุ่งนี้ล่ะคะ?\"\n\nแม้เมื่อตอนเที่ยงเขาจะเอ่ยปากชวนอิเนลีออกไปเที่ยวอีกครั้ง แต่นางกลับกลอกสายตาอันทรงเสน่ห์ด้วยท่วงท่ายั่วยวน\n\n\"เมื่อเช้านี้ท่านพี่เพิ่งจะถูกเสด็จพ่อดุมาหยกๆ ไม่ใช่หรือคะ? แม้ความกล้าหาญของท่านพี่จะมีคุณสมบัติสมเป็นจักรพรรดิอยู่หรอก แต่ท่านพี่ไม่คิดว่าควรจะสุขุมรอบคอบกว่านี้อีกสักนิดหรือคะ?\"\n\nพลางจับชายกระโปรง นางย่อตัวคำนับตรงหน้าเขา ทว่าดวงตาคู่นั้นที่ช้อนขึ้นมองกลับแฝงแววหยั่งเชิงทดสอบ และในจังหวะที่กิลกำลังอับจนถ้อยคำไม่ต่างจากตอนเผชิญหน้ากับพระบิดา นางก็หมุนตัวหันหลังเดินจากไปหลังจากเอ่ยคำว่า \"ขอให้เป็นวันที่ดีนะคะ\"\n\nขณะที่กิลเร่งควบม้า เขาก็กัดฟันกรอดแน่น\n\nนางจงใจยั่วยุข้าชัดๆ\n\nแววตาหวานเชื่อมยามช้อนสายตาขึ้นมองคู่นั้น อิเนลีกำลังเยาะเย้ยเหยียดหยามกิลอย่างแนบเนียน\n— สรุปว่า ท่านพี่ยังคงหวาดกลัวเสด็จพ่ออยู่อีกงั้นสินะ?\n— เด็กที่ทำอะไรไม่เป็นนอกจากคอยเชื่อฟังคำสั่งของพ่อตัวเองน่ะ อยู่เป็นเพื่อนข้าไม่ได้หรอก\n— เอาล่ะ ทำไมท่านพี่ไม่รีบกลับไปที่ห้องแล้วเล่นคนเดียวไปพลางๆ เสียล่ะคะ?\n\nวันนี้เขาไม่ได้เมามายเลยสักนิด เมื่อตะวันตกดิน ผงบัวทมิฬที่เขามักจะผสมลงในสุราเสมอ ซึ่งตามปกติควรจะช่วยให้เขาลืมเลือนเรื่องน่ารำคาญใจทั้งหมดได้ในทันที ทว่าเฉพาะวันนี้ มันกลับส่งผลเสียต่อเขาอย่างร้ายแรง เขาจึงเพิ่มปริมาณจากที่เคยดื่มเข้าไปเกือบเท่าตัว จากนั้นจู่ๆ หลังจากเมามายอย่างหนัก กิลก็เกิดอยากจะควบม้าตะบึงไปข้างหน้าอย่างรวดเร็ว เขาไม่ได้เรียกหาสหายคนใด วันนี้เขาอยู่เพียงลำพังตัวคนเดียว\n\nกิลไม่เคยได้รับคำพูดอันอ่อนโยนจากพระบิดาเลยแม้แต่คำเดียว และแทบไม่เคยเห็นพระองค์แย้มพระสรวลเลยสักครั้ง\n\nตอนที่ยังอายุไม่ถึงสิบขวบ กิลเคยติดตามไปร่วมการออกล่ามังกรป่า ในตอนนั้น เพื่อเป็นการ 'ทดสอบความกล้าหาญ' เขาได้วางเท้าลงบนลำคอของมังกรตัวหนึ่งที่เพิ่งถูกยิงตายด้วยปืน เมื่อได้เห็นภาพวาดของบุตรชายตนเองที่เชิดคางขึ้นพร้อมกอดอกดุจวีรบุรุษ กูลจึงเอ่ยขึ้นว่า\n\n\"ดูนั่นสิ วีรบุรุษผู้พิชิตมังกร! ลูกชายของข้าจะทะยานขึ้นสู่ฟากฟ้าด้วยการกลืนกินเหล่ามังกร\"\n\nและพระองค์ก็ทรงพระสรวลร่าจนเผยให้เห็นฟันขาวสะอาด\n\nกิลไม่อาจปล่อยให้ตัวเองหงุดหงิดต่อไปได้ยามหวนนึกถึงความทรงจำในวัยเยาว์ที่ตนหวงแหนถึงเพียงนั้น ทว่าในอีกด้านหนึ่ง เขาก็ช่วยไม่ได้ที่มันดันเป็นความทรงจำอันน่ารื่นรมย์เพียงหนึ่งเดียวที่เขามีต่อพระบิดา\n\nเสด็จพ่อต้องเกลียดข้าเข้าไส้แน่ๆ เขาครุ่นคิด\n\nเห็นได้ชัดเจนอยู่แล้วว่าเขาไม่มีคุณสมบัติของวีรบุรุษเลยสักนิด กี่ครั้งกี่หนแล้วที่พระบิดาต้องทอดถอนใจระหว่างการฝึกซ้อมดาบของเขา? ซ้ำยังทำต่อหน้าธารกำนัลเฉกเช่นเมื่อช่วงเช้าของวันนี้อีกด้วย ข้าราชบริพารทุกคนล้วนเข้าข้างพระบิดา มีเพียงคนเดียวที่คอยปกป้องเขาเสมอมาคือพระมารดา ซึ่งได้สิ้นพระชนม์ไปตั้งแต่เมื่อห้าปีก่อนแล้ว\n\nและก่อนหน้าปีที่ผ่านมา พระบิดาได้รับเอาเมลิสซา หญิงม่ายจากตระกูลขุนนางชั้นสูงเข้ามาเป็นพระมเหสีองค์รอง เขาจึงได้น้องสาวสองคนติดสอยห้อยตามมาจากชีวิตสมรสครั้งก่อนของนาง และเพราะนางยังไว้ทุกข์ให้สามีผู้ล่วงลับไม่ทันครบกำหนด จึงเกิดเสียงซุบซิบนินทาว่าร้ายเกี่ยวกับตัวนางขึ้นมากมายภายในพระราชวัง และด้วยเหตุผลอื่นๆ อีกหลายประการ กิลจึงไม่ชอบเมลิสซาเอาเสียเลย แน่นอนว่านางไม่ใช่แม่ของเขา ทว่าในสายตาของพระบิดา นางหาใช่บุคคลที่จะมองข้ามหรือดูแคลนได้เลย ไม่ต่างอะไรจากเหล่าขุนนางเก่าแก่ที่ยืนเคียงข้างพระบิดา\n\nและในเวลานั้นเอง อิเนลี บุตรสาวคนโตของนางก็เช่นกัน... เมื่อจินตนาการเห็นภาพเรือนร่างของนางในเวลานี้ ซึ่งนับวันจะยิ่งทวีความเย้ายวนอันแปลกประหลาดขึ้นทุกที กิลก็กระทุ้งส้นเท้าเข้าใส่สีข้างม้าอย่างแรงด้วยความเดือดดาล\n\n\"โอ้?\"\n\nในบรรดาผู้คนที่เกือบจะถูกม้าของเขาพุ่งชนจนกระเด็น หนึ่งในนั้นคือเฟดอม เขากำลังเดินทางกลับมาจากบ้านของภรรยาน้อยพอดี เขาหันไปเอ่ยถามผู้ติดตามข้างกายว่า\n\n\"เมื่อกี้ใช่องค์รัชทายาทหรือเปล่า?\"\n\n\"จริงหรือขอรับ?\"\n\n\"ในเวลาแบบนี้นี่นะ แถมยังไม่มีสหายตามมาด้วยสักคน?\"\n\n\"เป็นไปได้มากทีเดียวว่าอาจเป็นองค์ชายของพวกเรา\" เขาเอ่ยด้วยน้ำเสียงเย้ยหยันแกมประชดประชันอย่างไม่สบอารมณ์นัก \"เอาเถอะ มันก็ไม่ได้แปลกประหลาดอะไรขนาดนั้นหรอก ใครก็ได้รีบตามพระองค์ไปที หากเกิดเรื่องวุ่นวายขึ้น ก็จงอ้างชื่อข้าแล้วพาพระองค์กลับมาอย่างสุภาพเสีย\" เขาออกคำสั่ง\n\nมีผู้คนหนาแน่นยิ่งกว่าปกติอยู่กลางถนนหนทาง กิลชะลอความเร็วของม้าลงด้วยความหงุดหงิดใจอย่างยิ่ง เขาแทรกตัวผ่านช่องว่างระหว่างผู้คนที่กำลังหัวเราะร่าเริงอย่างเย็นชาไร้อารมณ์ แน่นอนว่าเขาไม่ได้แต่งกายในลักษณะที่บ่งบอกว่าเป็นเชื้อพระวงศ์ และเพราะชาวเมืองรู้จักใบหน้าขององค์ชายเพียงแค่จากภาพวาดที่วางจำหน่ายเป็นที่ระลึกตามเทศกาลเท่านั้น เขาจึงน่าจะสามารถเดินปะปนออกมาได้โดยไม่มีใครจำหน้าได้เลย\n\nแน่ล่ะ แม้จะไม่มีใครเอ่ยทักทายเขา แต่กิลก็ไม่อาจปล่อยผ่านสายตาไปได้ยามควบม้าเดินผ่านไป ไม่รู้ด้วยเหตุใด ภาพของผู้คนที่กำลังรื่นเริงและสนุกสนานกันอย่างเต็มคราบกลับทำให้เขารู้สึกขัดหูขัดตายิ่งนัก และทั้งๆ ที่เสียงกังวานใสของพิณคิทาราและเสียงขลุ่ยจะไพเราะเพียงใด ทว่าดูเหมือนพวกมันกำลังล้อเลียนหัวเราะเยาะเขาอยู่กลายๆ เสียงหัวเราะที่ดังระงมขึ้นทุกหนทุกแห่งนั้น แท้จริงแล้วคือพวกมันกำลังชี้ไม้ชี้มือมาที่เขาใช่หรือไม่?\n\nหัวใจของเขาเต้นรัวเร็วขึ้น ฤทธิ์ยาในที่สุดก็เริ่มสำแดงผลและทำให้ความคิดของกิลแตกซ่านกระเจิง ราวกับว่าทิวทัศน์เบื้องหน้าที่เขารู้สึกว่ากำลังค่อยๆ ละลายกลายเป็นสีสันเหนียวหนืดผิดรูปร่างที่คอยดึงดูดเขาเข้าไปนั้น เริ่มดูคล้ายกับฝูงปีศาจตัวน้อยที่กำลังแสยะยิ้มเย้ยหยันเขาเป็นแถวเป็นแนว\n\nหยุดนะ...\n\nพวกมันทุกคนต่างพากันหัวเราะร่า ชี้เล็บอันบิดเบี้ยวตรงมาที่เขา\nดูนั่นสิ นั่นน่ะหรือองค์รัชทายาทแห่งเมฟิอุส หมอนั่นมันก็แค่เด็กน้อยที่เอาแต่วาดกลัวพ่อตัวเองไปวันๆ แม้แต่ผู้หญิงคนเดียวยังไม่มีปัญญาจีบให้ติดเลย ช่างเป็นผู้ชายน่าสมเพชเสียจริง\nมันควรจะรีบไปตายซะให้พ้นๆ ชายที่การปกครองของมันไม่มีประโยชน์ต่อใครในประเทศนี้เลยสักคน ควรจะตายไปเสียเดี๋ยวนี้\n\nหยุดเดี๋ยวนี้นะ!\n\nเฉดสีอันน่าสะอิดสะเอียนขยับบิดเบี้ยวเลื้อยไปมารอบกายเขา ความหวาดกลัวที่เคยกดข่มเอาไว้กลับยิ่งกระตุ้นความรังเกียจและความหวาดผวาของกิลให้ทวีความรุนแรงยิ่งขึ้น เขารู้สึกเสียใจจากใจจริงที่ไม่ได้หยิบปืนติดมือออกมาจากพระราชวังด้วย หากเขาสาดกระสุนตะกั่วเข้าใส่คนพวกนี้ให้หมดล่ะก็ มันคงจะช่วยล้างสมองของเขาให้โล่งโปร่งขึ้นมาได้แน่...\n\n\"องค์ชายกิลหรือพ่ะย่ะค่ะ?\"\n\nจู่ๆ ก็มีใครคนหนึ่งเอื้อมมือมาคว้าบังเหียนม้าของเขาเอาไว้ ในเสี้ยววินาทีนั้น ในตอนแรกมันดูราวกับหนึ่งในเงาร่างของปีศาจร้าย ทว่าเมื่อกิลที่นั่งตัวสั่นอยู่บนหลังม้าพยายามเพ่งสายตามองอย่างหนัก เขาก็ตระหนักได้ว่านั่นคือบุรุษที่เขาเคยเห็นหน้าค่าตามาแล้วหลายครั้ง\n\nเมื่อพิจารณาจากการที่อีกฝ่ายเหน็บดาบไว้ข้างเอวและพกปืนสั้นติดกาย เขาย่อมต้องเป็นหนึ่งในทหารกององครักษ์จักรพรรดิซึ่งได้รับอนุญาตให้พกพาอาวุธได้ในยามสงบ ทว่าเพราะกิลเคยเห็นเขาเพียงแค่ในชุดเครื่องแบบทหาร ยามสวมใส่ชุดพิธีการเช่นนี้จึงดูราวกับเป็นคนละคนกันไปเลยทีเดียว\n\n\"พระองค์ทรงมีธุระอันใดในสถานที่เช่นนี้หรือพ่ะย่ะค่ะ?\"\n\n\"เปล่า...\"\n\nองค์ชายส่ายพระพักตร์ไปมา แสร้งทำเป็นว่าจิตใจยังคงเป็นปกติดี กององครักษ์จักรพรรดินั้นขึ้นตรงต่อองค์จักรพรรดิโดยตรง นั่นหมายความว่าพวกมันอยู่ข้างเดียวกับพระบิดา และไม่ใช่สหายที่กิลอยากจะสนิทสนมด้วยไม่ว่าจะในแง่ใดก็ตาม\n\nแม้คนเราจะสามารถก้าวขึ้นมาเป็นนายทหารชั้นสัญญาบัตรได้ก็ต่อเมื่อมาจากตระกูลที่ดีเท่านั้น ทว่าองค์ผู้ปกครองได้รับอนุญาตให้แต่งตั้งใครก็ตามได้อย่างอิสระในส่วนของทหารที่จัดตั้งขึ้นเป็นกองพลส่วนพระองค์ ตัวกิลเองเมื่ออายุครบสิบห้าปีบริบูรณ์เมื่อสองปีก่อน ก็เคยได้รับอำนาจในการคัดเลือกทหารที่ขึ้นตรงต่อตนเองเช่นกัน ทว่านั่นเป็นเพียงแค่พิธีการตามธรรมเนียมเท่านั้น—ในทางปฏิบัติแล้ว วันหนึ่งเขาก็จะต้องรับช่วงสืบทอดกองทัพของพระบิดาโดยตรงอยู่ดี\n\n\"การที่พระองค์ประทับอยู่เพียงลำพังเช่นนี้มันอันตรายนัก ให้กระหม่อมส่งคนไปส่งข่าวที่พระราชวังดีกว่าพ่ะย่ะค่ะ\"\n\n\"ช่างมันเถอะ อย่าทำอะไรไม่เข้าเรื่องน่า ว่าแต่ เสียงเอะอะโวยวายนี่มันเรื่องอะไรกัน?\"\n\n\"อ้อ\"\n\nนายทหารกององครักษ์จักรพรรดิวัยสี่สิบกลางๆ หรี่ตาลงด้วยความเก้อเขินเล็กน้อย เขาชี้มือไปยังใจกลางถนน บนหลังเกวียนเทียมม้าที่ถูกถอดหลังคาผ้าใบออก มีร่างของชายหนุ่มและหญิงสาวคู่หนึ่งกำลังยืนเคียงคู่กันในชุดแต่งกายเต็มยศอันงดงาม\n\n\"คืนนี้เป็นพิธีแต่งงานของลูกสาวกระหม่อมเองพ่ะย่ะค่ะ\" เขาเอ่ยกลั้วหัวเราะ\n\nเด็กสาวกำลังแย้มยิ้มอย่างมีความสุขด้วยใบหน้าที่ละม้ายคล้ายคลึงกับบิดาของนาง ชุดกระโปรงสีขาวบริสุทธิ์ของนาง แม้จะดูเรียบง่ายธรรมดาไม่อาจเทียบเคียงกับชุดที่เคยเห็นในราชสำนักได้ ทว่ามันกลับเจิดจ้าตระการตาอย่างน่าประหลาด\n\nการออกแบบชุดอันแสนกล้าหาญสำหรับโอกาสครั้งหนึ่งในชีวิตเผยให้เห็นร่องอกลึก ขับเน้นทรวดทรงองค์เอวอันเย้ายวนให้โดดเด่นสะดุดตา\n\n\"องค์ชายเองก็ควรจะทรงรักษาสุขภาพด้วยนะพ่ะย่ะค่ะ ในเมื่อใกล้จะถึงกำหนดงานอภิเษกสมรสแล้ว ให้กระหม่อมเรียกผู้ใต้บังคับบัญชามาช่วยนำเสด็จกลับพระราชวัง—\"\n\nคำพูดครึ่งหลังของนายทหารองครักษ์ไม่แม้แต่จะผ่านเข้าสู่โสตประสาทของกิลเลยแม้แต่น้อย\n\nเสียงหัวเราะ เสียงดนตรี และผู้คนที่กำลังร่ายรำเป็นวงกลม พลันกะพริบไหวเป็นเงามืดสลัวอยู่เบื้องหน้าเขา ไม่ต่างอะไรจากการแสดงหุ่นเชิดเงา รอยยิ้มอันไร้ค่าตามท้องถนน เสียงขับขานบทเพลง และการเริงระบำ ยิ่งทวีความไม่สบายใจภายในอกของกิลให้รุนแรงขึ้น\n\nเหตุใดคนพวกนี้ถึงได้ทำตัวร่าเริงมีความสุขกันนักหนา? แม้แต่ตัวเขา ผู้เป็นถึงองค์รัชทายาทผู้สืบทอดราชบัลลังก์จักรวรรดิเมฟิอุส ยังไม่เคยได้พานพบสิ่งเหล่านี้แทบเท้าในแต่ละวันของชีวิตเลยสักครั้ง ไม่สิ บางทีอาจเป็นเพราะพวกมันเป็นเพียงแค่สามัญชนคนธรรมดา พวกมันถึงสามารถใช้ชีวิตไปวันๆ ได้โดยไร้ซึ่งความหวาดกลัวอย่างนั้นหรือ? พวกมันไม่ได้เลือกทางเดินชีวิตของตนเอง พวกมันยอมรับในสิ่งที่ได้รับมา และโศกเศร้ากับสิ่งที่ถูกช่วงชิงไป หากเขาสามารถใช้ชีวิตไปวันๆ แบบนั้นได้บ้าง มันจะมอบความสุขสบายใจให้เขาได้มากสักเพียงใดกันหนอ?\n\nมันยิ่งทวีความหงุดหงิดงุ่นง่านจนแทบทนไม่ไหว จังหวะการเต้นอันบ้าคลั่งรุนแรงยิ่งขึ้นกดทับลงบนสมองของเขาอย่างหนักหน่วง เสียงตุบ ตุบ ตุบ ตุบ ทำให้ร่างกายของกิลสั่นสะท้านอย่างควบคุมไม่อยู่ เหล่าหุ่นเชิดเงากำลังสั่นไหวโยกตัวขึ้นลงในแนวดิ่ง\n\nในตอนนั้นเอง ริมฝีปากของกิลก็พลันฉีกออกเป็นรูปครึ่งวงกลม เขากำลังหัวเราะ\n\nช่างเป็นความคิดที่โง่เง่าสิ้นดี ตัวเขาผู้เป็นถึงองค์ชาย จะต้องไปริษยาความสุขของพวกมนุษย์ชั้นต่ำพรรค์นี้ทำไมกัน ดินแดนทั้งหมดนี้วันหนึ่งย่อมต้องตกเป็นของเขาอยู่ดี เขาแค่ต้องเตือนความจำให้คนพวกนี้รู้สำนึกเท่านั้น เขาต้องสั่งสอนให้พวกมันได้รู้ซึ้งว่า หากความสุขเช่นนี้ได้มาอย่างง่ายดาย มันก็สามารถถูกช่วงชิงไปได้ในพริบตาเดียวเช่นเดียวกัน\n\n\"สิทธิ์คืนแรก\"\n\n\"เอ๊ะ?\"\n\nนายทหารกององครักษ์ที่กำลังจับบังเหียนม้าอยู่เงยหน้าขึ้นมาอีกครั้ง แม้กิลจะใช้มือปาดน้ำลายที่ไหลเยิ้มออกจากมุมปาก ทว่าน้ำเสียงที่เอ่ยออกมากลับชัดถ้อยชัดคำ\n\n\"ข้าจะใช้สิทธิ์คืนแรกของราชวงศ์\"\n\n\"องค์ชาย!\"\n\nเสียงตะโกนร้องของนายทหารทำเอาทุกใบหน้าที่อยู่โดยรอบหันขวับมามองทางนี้ทันที\n\nในที่สุดพวกแกก็ยอมมองมาแล้วสินะ?\n\nเมื่อเข้าสู่จุดสูงสุดของความเมามาย กิลก็ยิ่งหัวเราะร่าหนักขึ้นกว่าเดิม หากเขามีกระจกอยู่ในมือตอนนี้ กิลคงจะได้เห็นว่าใบหน้าของตนเองกำลังละม้ายคล้ายคลึงกับฝูงปีศาจร้ายที่เขาเพิ่งเพ้อฝันเห็นเมื่อครู่นี้ไม่มีผิดเพี้ยน\n\nในที่สุดพวกแกก็สังเกตเห็นแล้วใช่ไหมล่ะว่าข้าไม่ได้เป็นส่วนหนึ่งของพวกแก ข้าไม่ได้เป็นเพียงแค่อีกหนึ่งชีวิต และไม่ได้เป็นเพียงแค่มนุษย์ธรรมดาอีกคนหนึ่ง?\n\nบุรุษแห่งราชวงศ์เมฟิอุสมีสิ่งที่เรียกขานกันว่า สิทธิแห่งค่ำคืนแรก นั่นหมายความว่า หากมีการแต่งงานระหว่างชายหญิงเกิดขึ้น ณ ที่แห่งใดก็ตามในแว่นแคว้น โดยแทบไม่มีข้อยกเว้น เขาจะสามารถช่วงชิงสิทธิ์ในการนอนหลับนอนกับเจ้าสาวในคืนแรกมาจากตัวเจ้าบ่าวได้\n\nเคยมีช่วงเวลาหนึ่งที่ผู้คนเชื่อกันว่างวดเลือดของหญิงพรหมจารีคือสิ่งแปดเปื้อนไม่บริสุทธิ์ และการได้ร่วมหลับนอนกับเชื้อพระวงศ์หรือนักบวชผู้ทรงอำนาจจะช่วยชำระล้างเลือดนั้นให้บริสุทธิ์ผุดผ่องได้—ทว่าเมื่อกล่าวตามตรงแล้ว มันก็เป็นเพียงแค่กลอุบายในการรีดไถภาษีมูลค่ามหาศาล เพื่อแลกกับการหลีกเลี่ยงไม่ให้ถูกใช้สิทธิ์คืนแรกเท่านั้น กฎหมายนี้ถูกตราขึ้นเมื่อเกือบสองร้อยปีก่อน ท่ามกลางสงครามอันต่อเนื่องยาวนานกับเผ่าริวจินที่ทำให้อารยธรรมของมนุษยชาติต้องตกต่ำยากแค้น\n\nในปัจจุบัน สิทธิแห่งค่ำคืนแรกได้กลายเป็นเพียงตัวอักษรที่ตายแล้ว ไม่ต่างอะไรจากระบบการคัดเลือกทหารกององครักษ์จักรพรรดิ\n\n\"ไปจัดเตรียมสถานที่มา นายทหารองครักษ์ แกได้ยินที่ข้าพูดไหม? หากแกคิดจะขัดขืนราชวงศ์ ไม่ใช่แค่แกคนเดียว แต่ตัวเจ้าสาวเองก็จะต้องถูกส่งขึ้นแท่นประหารกิโยตินไปด้วย!\"\n\nความตื่นตระหนกตกใจและความสับสนอลหม่านแผ่ขยายออกไปทั่ววงล้อม ก่อเกิดเป็นระลอกคลื่นซัดสาดไปรอบตัวกิล เสียงหัวเราะเหือดหายไป เสียงเพลงเงียบสงัดลง และการร่ายรำก็แตกกระเจิง สีหน้าของคู่บ่าวสาวหนุ่มสาวบนหลังเกวียนแข็งทื่อแน่นิ่งไปในทันที\n\nตรงกันข้าม กิลกลับไม่ยอมหยุดหัวเราะ เท่าที่เขารู้มา ไม่เคยมีใครอ้างสิทธิ์แห่งค่ำคืนแรกนี้มาก่อนเลย แน่นอนว่าแม้แต่เสด็จพ่อของเขา กูล เมฟิอุส เองก็ไม่เคยทำเช่นกัน\n\nเสด็จพ่อไม่ได้ตรัสหรอกหรือว่าเขาไม่มีวันเติบโตเป็นยอดคนได้? คนที่จะจารึกชื่อไว้ในประวัติศาสตร์น่ะหรือ? แม้แต่อิเนลีเองก็ยังกล้ามาสบประมาทเขามิใช่หรือ? เขาจะแสดงให้เห็นเองว่าเขาสามารถก้าวข้ามพระบิดาไปได้ จากนี้ไป คนพวกนั้นจะไม่มีสิทธิ์มาพูดจาดูถูกเขาได้อีกต่อไป\n\nท่ามกลางโลกที่ตกอยู่ในความเงียบงันรอบกาย มีเพียงกิลเท่านั้นที่รู้สึกอิ่มเอมใจอย่างแท้จริงจากก้นบึ้งของหัวใจ\n\nครึ่งชั่วโมงต่อมา กิลให้เจ้าสาวนั่งรออยู่บนชั้นสองของโรงเตี๊ยมราคาถูกแห่งหนึ่งในละแวกใกล้เคียง การคุ้มกันความปลอดภัยของร้านเหล้าตกเป็นหน้าที่ของนายทหารองครักษ์คนเมื่อครู่นี้อย่างไม่ต้องสงสัย ขณะที่ฉีกยิ้มกว้างอยู่คนเดียว เขาก็ก้าวเดินขึ้นบันไดไปพร้อมกับขวดสุราในมือ เสียงไม้ลั่นเอี๊ยดอ๊าดฟังดูรื่นหูอย่างน่าประหลาด\n\nเขาผลักเปิดประตูเข้าไป และร่างบนเตียงก็สะดุ้งตัวสั่นเทา ภายในห้องมืดสลัว แสงสว่างเพียงหนึ่งเดียวมาจากตะเกียงเขม่าดำที่วางอยู่ตรงหัวเตียง\n\n\"องค์ชายเพคะ\" หญิงสาวกุมมือทั้งสองข้างเข้าหากันแน่น พยายามเอ่ยวิงวอนขอร้องเขา \"ได้โปรด... ได้โปรดละเว้นเถิดเพคะ หากเป็นเรื่องภาษี—กระหม่อมยินดีจ่าย! ได้โปรดเมตตายกโทษให้กระหม่อมด้วย! กระหม่อมยัง... ยังไม่เคยมอบกายให้ชายใดมาก่อนเลย แม้แต่สามีของกระหม่อม...\"\n\n\"เพราะแบบนั้นถึงได้เรียกว่าสิทธิ์คืนแรกไม่ใช่หรือไงเล่า?\" กิลเอ่ยพลางเหยียดยิ้มเยาะ \"ข้าจะช่วยชำระล้างเลือดที่แปดเปื้อนทั้งหมดนั่นให้เอง หลังจากนั้น เจ้าจะไปเสพสุขกับสามีของเจ้าอย่างสบายใจแค่ไหนก็ตามแต่ใจเจ้าต้องการเลย\"\n\nกิลถอดเสื้อท่อนบนเหวี่ยงทิ้งแล้วขยับร่างเข้าไปหานางบนเตียง เจ้าสาวหวีดร้องลั่นพลางถอยร่นหนีไปบนฟูก เขาสามารถมองเห็นเนื้อหนังช่วงบั้นท้ายของนางที่นูนเด่นผ่านเนื้อผ้าบางเบา ลำคอของกิลส่งเสียงคำรามกระหาย\n\nในตอนนั้นเอง ก็มีเสียงเคาะประตูดังโครมครามอย่างรุนแรง กิลเดาะลิ้นขัดใจพลางหันขวับไปมอง เขามองเห็นนายทหารองครักษ์เดินพรวดพราดเข้ามาในห้อง จึงส่งสายตาดุดันกราดเกรี้ยวเข้าใส่ทันที\n\n\"มันช่างไร้มารยาทสิ้นดีที่คนเป็นพ่อจะบุกเข้ามาในคืนส่งตัวของเจ้าสาว แม้ข้าจะได้ยินมาว่ามีธรรมเนียมเชิญพยานมาร่วมรับรู้คืนแรกของงานวิวาห์ราชวงศ์ก็เถอะ แต่นั่นไม่ใช่สำหรับแก ถอยออกไปซะ\"\n\n\"คือ องค์ชาย ได้โปรดทรงไตร่ตรองใหม่อีกครั้งเถิดพ่ะย่ะค่ะ! นี่มันเป็นเรื่องน่าอัปยศอดสูต่อราชวงศ์เมฟิอุสนะพ่ะย่ะค่ะ!\"\n\n\"แกพูดบ้าอะไรของแก? คนอย่างแกไม่มีฐานะพอจะมาสั่งสอนราชวงศ์หรอก การลบหลู่เกียรติซึ่งหน้าแบบที่แกเพิ่งทำไปเมื่อกี้ มีโทษถึงประหารชีวิตเชียวนะ!\"\n\nนายทหารองครักษ์นามว่า โรน เจย์ซ จ้องมองตรงเข้าไปในดวงตาขององค์ชาย แววตาคู่นั้นไร้ซึ่งจุดโฟกัส และมีฟองน้ำลายเอ่อล้นออกมาจากมุมปาก เพียงปรายตามองปราดเดียว เขาก็รู้ได้ทันทีว่ามันคือผลข้างเคียงจากฤทธิ์ของผงบัวทมิฬ ขณะที่องค์ชายจับจ้องสายตาอันแหลมคมมายังเขา พระองค์ก็ยังคงพ่นถ้อยคำจับต้นชนปลายไม่ถูกออกมาไม่หยุด\n\n\"ข้า... ข้าคือเชื้อพระวงศ์แห่งเมฟิอุส... ไม่สิ... ข้าคือลูกชายของกูล เมฟิอุสผู้นั้นเชียวนะ หากแกบอกว่าทั้งประเทศนี้กำลังต่อต้านข้าล่ะก็ ได้เลย ข้าจะจับแกกับครอบครัวของแกยัดเข้าสนามประลองที่ไม่มีทางหนีรอด! จงทนทรมานใต้เขี้ยวเล็บของมังกรจนกว่าจะลงไปนอนแอ้งแม้งอยู่ในท้องของมันเพียงลำพังไปซะ! ไสหัวออกไปได้แล้วถ้าแกไม่อยากเจอแบบนั้น อะไรนะ!? แค่นั้นยังไม่สะใจงั้นรึ? หลังจากนี้พวกเราค่อยกลับมาจัดงานแต่งงานต่อก็ได้ ข้าจะยอมสวมชุดฉลองพระองค์สำหรับงานเทศกาลให้ด้วยเลยเอ้า\"\n\nกิลหันแผ่นหลังสีขาวผ่องมาทางเขา\n\nอา...\n\nในสภาพอันไร้ซึ่งการป้องกันตัวเช่นนั้น โรนรู้สึกหน้ามืดวิงเวียน ถูกจู่โจมด้วยความลังเลใจอย่างรุนแรง\n\nเลย์ลาคือบุตรสาวเพียงคนเดียวของเขา จากการตรากตรำทำงานหนักในฐานะนายทหารกององครักษ์จักรพรรดิ เขาไม่เคยมีความมั่นใจเลยว่าตนเองเป็นพ่อที่ดีหรือไม่\n\nมันเกิดขึ้นเมื่อกว่าสิบปีก่อน ในวันคล้ายวันเกิดของโรน เขาเดินทางกลับถึงบ้านในเวลาใกล้เที่ยงคืน แม้ในท้ายที่สุดแล้ว ตัวเขาเองจะลืมเลือนไปเสียสนิทว่าวันนี้เป็นวันเกิดของตน ทว่าเลย์ลากลับฟุบหน้าหลับคาโต๊ะอาหารไปแล้ว ขณะที่ภรรยาของเขานำผ้าห่มมาคลุมไหล่ให้ลูกสาว นางก็เอ่ยขึ้นว่า\n\n\"ลูกพยายามอย่างสุดความสามารถที่จะฝืนไม่ให้หลับน่ะค่ะ\"\n\nในมือเล็กๆ ของลูกสาว กำพวงมาลัยดอกไม้สีขาวที่นางคงจะลงมือร้อยขึ้นมาด้วยตนเองเอาไว้แน่น\n\nยามที่เขากุมมือเล็กๆ คู่นั้นไว้ในอุ้งมือของตนอย่างแผ่วเบา เขาได้สาบานกับตัวเองว่าจะยอมทำทุกสิ่งทุกอย่างเพื่อแลกกับความสุขของลูกสาว แม้จะต้องแลกด้วยชีวิตของตนเองก็ตาม\n\nเมื่อรู้สึกตัวขึ้นมาอีกครั้ง โรนก็กำลังโถมตัวกระโจนเข้าใส่กิลเสียแล้ว เขาล้มคะมำลงกับพื้นแทบจะในจังหวะเดียวกับที่พาร่างขององค์ชายล้มคว่ำไปด้วยกัน เสียงกรีดร้องในหัวสมองที่พร่ำถามว่า 'แกกำลังทำบ้าอะไรลงไป!?' กำลังหมุนวนปั่นป่วนไปพร้อมกับเสียงข้าวของที่พังทลายลงมา\n\nทว่า โรนไม่ได้คิดถึงเรื่องเหล่านั้นเลยแม้แต่น้อย องค์ชายกำลังตกอยู่ใต้ฤทธิ์ของยาเสพติดอย่างชัดเจนจึงแสดงพฤติกรรมเช่นนี้ออกมา หากหมดสติไปตรงนี้ เมื่อตื่นขึ้นมาอีกครั้ง พระองค์ก็อาจจะจำอะไรไม่ได้เลยแม้แต่อย่างเดียว หรือต่อให้จำได้ ก็คงคิดว่าเป็นเพียงแค่เรื่องที่เกิดขึ้นในความฝันเท่านั้น แม้จะต้องอาศัยความร่วมมือจากฝูงชนจำนวนมากก็ตาม โรนก็พร้อมจะทำทุกวิถีทางเพื่อให้แน่ใจว่าทุกคนจะให้ความร่วมมือ\n\nในอีกด้านหนึ่ง กิลกำลังตกอยู่ในภาวะคลุ้มคลั่งบ้าคลั่ง ด้วยความเชื่อมั่นว่าตนเองจะต้องก้าวข้ามพระบิดาไปให้ได้ มิฉะนั้นชื่อเสียงของตนจะต้องแปดเปื้อนย่อยยับ เขาจึงพยายามยันกายลุกขึ้นด้วยสัญชาตญาณอันดุร้ายของสัตว์ป่า ราวกับว่าเขากำลังปลดปล่อยพละกำลังทั้งหมดเข้าห้ำหั่นกับพระบิดาของตนเอง\n\n\"ไอ้สวะ!\"\n\nขณะที่กำลังกอดรัดฟัดเหวี่ยงกับ 'บิดา' ผู้นี้ เขาก็เหลือบไปเห็นปืนสั้นที่เหน็บอยู่ข้างเอวของคู่ต่อสู้ เขาพยายามแย่งชิงมันมาอย่างบ้าคลั่ง โรนเองก็สังเกตเห็นเช่นกัน ในช่วงท้ายของการยื้อแย่งอันเงียบงัน ปืนสั้นกระบอกนั้นก็หลุดออกจากมือของคนทั้งคู่ มันร่วงกระแทกลงบนพื้นไม้เสียงดังทึบ ทั้งสองคนรีบยื่นมือออกไปหมายจะคว้ามันไว้พร้อมกัน\n\nปัง! — เมื่อเสียงปืนดังสนั่นกึกก้องไปทั่วบริเวณ\n\nจากรายงานข่าวที่ได้รับจากผู้ติดตาม เฟดอมรีบเร่งรุดมายังด้านหน้าโรงเตี๊ยมพร้อมกับดาบที่ถูกเก็บซ่อนไว้อย่างมิดชิด\n\nสิทธิ์คืนแรกเนี่ยนะ คิดไปได้!\n\nเมื่อมองไปด้านข้าง มีเงาร่างหลายสายรวมตัวกันอยู่ กลมกลืนไปกับความมืดมิดในจุดที่ไม่สะดุดตาบนท้องถนน สายตาทุกคู่ที่จ้องมองมายังเขาทำเอาเฟดอมรู้สึกเย็นวาบแล่นปราดไปตามสันหลัง มันชวนให้เขานึกถึงสายชนวนที่เปียกชุ่มไปด้วยน้ำ เจ้าคงจะปล่อยมันทิ้งไว้เฉยๆ เพราะคิดว่ามันคงไม่มีทางระเบิดขึ้นมาได้ แต่หากมีประกายไฟอันรุนแรงบังเอิญถูกโยนเข้าไปเพียงสะเก็ดเดียว มันก็พร้อมจะระเบิดตูมตามขึ้นมาได้ทุกเมื่ออยู่ดี\n\nเฟดอมกระแอมไอเคลียร์ลำคอ ก่อนจะสาวเท้าเข้าไปใกล้ด้านหน้าของร้านเหล้า ทหารกององครักษ์จักรพรรดิหลายนายกำลังยืนเฝ้ายามอยู่ที่หน้าประตู แต่ละคนล้วนมีสีหน้างุนงงสงสัย เมื่อถูกเรียกตัวมาโดยนายทหารชั้นผู้ใหญ่ พวกเขาจึงไม่ได้รับคำอธิบายเลยว่าเหตุใดจึงต้องมาคอยคุ้มกันร้านเหล้าแห่งนี้ เฟดอมยกฐานะสมาชิกสภาขุนนางขึ้นมาอ้างและได้รับอนุญาตให้ผ่านเข้าไปได้\n\nและแล้ว — ปัง! — เสียงปืนนัดหนึ่งก็ดังสนั่นกึกก้องจนแก้วหูของเขาสั่นสะท้าน\n\nหลังจากชะงักนิ่งไปชั่วอึดใจ เฟดอมก็รีบวิ่งพรวดพราดขึ้นบันไดไปทันที ผู้ติดตามของเขาซึ่งเป็นยอดนักสู้เดินนำหน้าผลักเปิดประตูเข้าไป ทั้งสองคนต่างพากันกลั้นหายใจพร้อมกัน กลิ่นดินปืนลอยเตะจมูก มีแอ่งเลือดขนาดใหญ่กำลังแผ่ขยายออกไปบนพื้นอาคารราคาถูกแห่งนี้\n\n......\n\nภายใต้สถานการณ์เช่นนั้น ความเงียบงันอันน่าประหลาดก็พลันโอบคลุมไปทั่วทั้งห้อง\n\nชั่วขณะหนึ่ง เฟดอมไม่สามารถคิดอะไรออกได้เลยแม้แต่น้อย เขาพูดไม่ออก จิตใจดูเหมือนจะปฏิเสธที่จะยอมรับสิ่งที่เห็นตรงหน้าว่าเป็นความจริง และทำได้เพียงยืนจ้องมองภาพนั้นอย่างเหม่อลอย ทว่าทีละเล็กละน้อย ความเป็นจริงก็เริ่มกัดกร่อนเซลล์สมองของเขา และความคิดบางอย่างก็พลันผุดพรายขึ้นมาในจิตใจของเฟดอม ออลิน แม้แต่ตัวเขาเองยังคิดเลยว่ามันเป็นความคิดที่น่าหัวเราะเยาะสิ้นดี มันช่างอุกอาจเกินไปแล้ว\n\nไม่สิ...\n\nเฟดอมกลืนน้ำลายอึกใหญ่ลงคอ นี่มิใช่การดลบันดาลจากสรวงสวรรค์หรอกหรือ? ในบัดนี้ เพื่อที่จะกะเทาะเปลือกของจักรวรรดิอันเก่าแก่และเติมแต่งโลหิตสดใหม่ลงไป? เขาสามารถมอบความหมายที่แท้จริงให้แก่ประเทศชาตินี้ ซึ่งเหมาะสมกับยุคสมัยอันแปรปรวนในปัจจุบันได้ นี่มิใช่สิ่งใดอื่นนอกเหนือไปจากสัญญาณจากสรวงสวรรค์ ที่บ่งบอกว่าไม่มีใครอื่นอีกแล้วนอกจากเขาที่จะสามารถทำเรื่องนี้ได้มิใช่หรือ?\n\nแม้กลิ่นคาวเลือดจะคลุ้งตลบไปทั่วโรงเตี๊ยมซอมซ่อ ทว่าในเวลานี้ ดวงตาของเฟดอมกลับดูราวกับถูกห่อหุ้มไว้ด้วยประกายแสงสีทอง ขณะที่เนื้อตัวสั่นสะท้านไปด้วยความตื่นเต้นระคนหวาดกลัว เขาก็ตระหนักได้ว่า หากเขาปรารถนาสิ่งนี้ เขาก็ต้องรีบลงมือ และเร่งเร้าด้วยความร้อนรน\n\nในขั้นแรก หลังจากสั่งการให้ผู้ใต้บังคับบัญชาห้ามไม่ให้ใครย่างกรายเข้ามาในห้องนี้เด็ดขาด เขาก็ก้าวเท้าตรงเข้าไปหาสองพ่อลูกที่กำลังกอดกันกลมตัวสั่นเทาอยู่บนเตียง\n\n\"...กระผมเตรียมใจไว้พร้อมแล้วขอรับ\" นายทหารองครักษ์เอ่ยขึ้น \"แต่ลูกสาวของกระผม และครอบครัวของกระผม ไม่ได้มีความผิดอันใดด้วย ได้โปรดเถิด ขอให้กระผมเป็นผู้รับผิดชอบทั้งหมดนี้แต่เพียงผู้เดียว ได้โปรดเมตตาละเว้นทุกคนนอกจากตัวกระผมด้วยเถิดขอรับ กระผมยินดีทำทุกอย่างตามที่ท่านปรารถนาในทันที ไม่ว่าจะเป็นสนามประลอง ท่านจะสั่งให้กระผมไปสู้กับมังกรด้วยมือเปล่า มอบคอให้กิโยติน หรือจะสั่งให้ล่ามแขนขากับมังกรแล้วฉีกร่างกระผมออกเป็นชิ้นๆ ก็ได้ทั้งนั้น\"\n\n\"โอ้?\"\n\nแก้มของเฟดอมกระตุกสั่น เขาหลุบสายตาลงมองชายที่นอนคว่ำหน้าเปลือยแผ่นหลังอยู่บนพื้นแวบหนึ่ง ร่างนั้นไม่ขยับเขยื้อนเลยแม้แต่นิ้วเดียว ดูราวกับว่าเขาไม่ได้หายใจอีกต่อไปแล้ว\n\n\"อย่าได้กลัวไปเลย\" เฟดอมเอ่ย แม้น้ำเสียงจะยังคงสั่นเครืออยู่บ้าง \"เขายังหายใจอยู่\"\n\n\"หา?\"\n\n\"แกไม่ได้ยินที่ข้าพูดหรือไง? เขายังหายใจอยู่ อย่าได้กลัวไปเลย องค์รัชทายาทจะทรงมีพระพลานามัยแข็งแรงดีอย่างแน่นอน\"\n\nโรน เจย์ซ ยังคงนิ่งเงียบงันด้วยความตกตะลึง เฟดอมจึงรีบเอ่ยปากต่ออย่างรวดเร็ว\n\n\"เอาล่ะ หากแกยังอยากจะปกป้องครอบครัวของแกอยู่ล่ะก็ ข้าขอสั่งให้แกอย่าได้แพร่งพรายสิ่งที่ข้าพูดออกไปแม้แต่คำเดียว เข้าใจไหม? หากมีเรื่องราวเพียงนิดเดียวเกี่ยวกับสิ่งที่เกิดขึ้นที่นี่หลุดรอดไปเข้าหูข้าผ่านปากคนอื่นล่ะก็ ตัวแก ครอบครัวของแก และญาติสนิทมิตรสหายทุกคน จะเป็นกลุ่มแรกที่ต้องลงไปนอนในท้องของมังกร เข้าใจหรือยัง? สรุปง่ายๆ ก็คือ ข้ากำลังบอกว่าตอนนี้เรื่องนั้นมันยังไม่เกิดขึ้น เข้าใจใช่ไหม?\"\n\nนายทหารองครักษ์ โรน เจย์ซ ช้อนสายตาขึ้นมองอย่างกะทันหัน มีรอยเลือดกระเซ็นเปรอะอยู่บนหน้าอก ขณะที่ลูกสาวของเขายังคงกอดรัดเขาไว้แน่น เหนือศีรษะของพวกเขา ร่างของเฟดอมยืนตระหง่านค้ำอยู่ แววตาคู่นั้นที่ไร้ซึ่งจุดโฟกัสอันแน่นอน ช่างละม้ายคล้ายคลึงกับแววตาขององค์ชายกิลเมื่อครู่ก่อนไม่มีผิดเพี้ยน"
    },

      "id": "เล่ม 1/ch003_p1_th",
      "title": "บทที่ 3.1: หน้ากากชิ้นใหม่ (1)",
      "content": "ตลอดหลายวันที่ผ่านมา ทาร์คัสดูจะยุ่งเหยิงกว่าปกติจริงๆ เอาแต่วิ่งวุ่นไปทั่วทุกสารทิศ และยิ่งชายผู้มากภารกิจผู้นั้นงานรัดตัวมากเท่าไร เจ้าตัวก็ยิ่งดูกระปรี้กระเปร่าคึกคักมากขึ้นเท่านั้น ฝีเท้าเบาหวิวราวกับมีปีกงอกออกมา แสดงให้ทุกคนได้เห็นถึงจุดสูงสุดแห่งความภาคภูมิใจของเจ้าตัว\n\nไม่ว่าจะเป็นการสร้างสนามประลองส่วนตัวสำหรับใช้งานในนามคณะนักสู้ทาร์คัสโดยเฉพาะ หรือแผนการกว้านซื้อมังกรสายพันธุ์ใหม่มาเพิ่มอีกนับสิบตัว ทาร์คัสต่างวาดฝันวางแผนการใหญ่โตมโหฬารสำหรับอนาคตของเหล่าทาสดาบในสังกัด ทว่าออร์บาก็ยังคงไม่คล้อยตามเหมือนเช่นเคย\n\n\"ถ้าแกสามารถสร้างความประทับใจต่อหน้าพระพักตร์เหล่าเชื้อพระวงศ์ได้ล่ะก็ ข้าอาจจะลองพิจารณาตบรางวัลให้แกสักหน่อยนะ ออร์บา ทางฝั่งคู่ประลองเองก็คงเตรียมตัวมาอย่างดีเยี่ยมเป็นพิเศษเช่นกัน เพราะฉะนั้นจงสู้ให้สมศักดิ์ศรีเสียล่ะ เอ้า ถ้าเค้นอารมณ์ให้ฮึกเหิมไม่ออก ก็แค่ทำเหมือนที่แกเคยทำมาตลอดนั่นแหละ\"\n\nแม้ทาร์คัสจะตบบ่าเขาพร้อมฉีกยิ้มกว้างจนแทบถึงใบหู ทว่าตามตรงแล้ว รอยยิ้มนั้นกลับให้ความรู้สึกกระอักกระอ่วนพิกล ด้านโกเวนซึ่งได้ยินบทสนทนาทั้งหมดก็ยิ้มเจื่อนออกมาเช่นกัน ก่อนที่สีหน้าของเขาจะแปรเปลี่ยนเป็นเคร่งขรึมจริงจังในทันที\n\n\"ข้าไม่สงสัยเลยว่าคณะนักสู้ทาร์คัสเป็นกิจการรายใหญ่ระดับแนวหน้าของวงการนี้ ทว่าต่อให้เป็นเช่นนั้น ข้าก็ไม่เคยได้ยินมาก่อนว่าทาร์คัสจะมีเส้นสายเชื่อมโยงไปถึงเชื้อพระวงศ์หรือบุคคลระดับสูงในราชสำนัก ปกติเขาก็แค่ทำงานรับใช้พวกขุนนางอย่างท่านเฟดอม เจ้าผู้ครองป้อมบิรัคและผู้อำนวยการสมาคมแกลดิเอเตอร์เท่านั้น ถึงแม้ดูเหมือนว่าทาร์คัสจะเคยได้พบหน้าท่านผู้นั้นแค่ตอนเข้าประชุมก็ตาม ยิ่งไปกว่านั้น จนถึงป่านนี้ เขายังไม่เคยได้รับมอบหมายงานโดยตรงจากเฟดอมเลยสักครั้งด้วยซ้ำ แต่ข้าว่างานครั้งนี้มันใหญ่โตมโหฬารผิดปกติ ข้าคอยบอกเขาอยู่ตลอดว่าควรจะไปขอความร่วมมือจากคณะอื่นมาช่วยเสริมทัพด้วย ทว่าทาร์คัสกลับปฏิเสธข้อเสนอทั้งหมดทิ้งเสียดื้อๆ\"\n\n\"ตาแก่ ขี้กังวลเกินเหตุอีกแล้วนะ\" ชีคกล่าวพลางยักไหล่ \"ไม่เห็นจะเป็นไรเลยนี่นา? ต่อให้พวกเราแสดงฝีมือไม่เข้าตาบรรดาผู้ใหญ่ ก็ไม่ใช่หัวของพวกเราสักหน่อยที่จะหลุดจากบ่า อย่างมากก็แค่ต้องไปหาสังเวียนใหม่เพื่อสู้ในฐานะแกลดิเอเตอร์ต่อเท่านั้นเอง\"\n\nออร์บาเองก็มีความคิดเห็นเช่นเดียวกัน ไม่ว่าเขาจะอยู่ที่แห่งหนใดก็ไม่ต่างกันมากนัก หนทางเดียวที่แกลดิเอเตอร์จะรักษาชีวิตของตนไว้ได้คือการหาเงินทอง และหากนั่นหมายถึงเส้นทางสู่อิสรภาพของเขาจะขยับเข้าใกล้ขึ้นอีกเพียงหนึ่งก้าว เขาก็พร้อมจะสู้ต่อไปไม่ว่าจะที่ไหนก็ตาม เรื่องทั้งหมดก็มีเพียงเท่านั้น\n\nหลังจากนั้นเวลาล่วงเลยไปอีกหลายวัน ในที่สุดการเตรียมการออกเดินทางมุ่งหน้าสู่หุบเขาเซรินก็เริ่มต้นขึ้น พวกเขาช่วยกันขนอาวุธและชุดเกราะขึ้นเกวียน รวมถึงปฏิบัติภารกิจอันแสนหนักหน่วงอย่างการนำเหล่ามังกรออกจากกรงขัง\n\nภายในโรงเลี้ยงมังกรอันกว้างขวาง ออร์บากำลังยืนเฝ้ามองโฮวหลานต้อนฝูงมังกรอย่างเงียบเชียบ แม้เขาจะเคยเห็นผู้ฝึกสัตว์มาแล้วหลายคนในสถานที่แห่งนี้ ทว่าเขากลับไม่เคยรู้จักมนุษย์คนใดที่สามารถควบคุมมังกรได้เฉกเช่นนางมาก่อนเลย\n\nในอดีตเคยมีผู้ฝึกสัตว์ระดับปรมาจารย์ผู้หนึ่งที่สามารถ 'สั่งให้มังกรโซซอสสามตัวเต้นรำตามจังหวะดนตรี' ได้ด้วยเสียงขลุ่ย เขาคอยให้อาหารพวกมันทุกวันตรงเวลา คอยแปรงสันจมูกให้อย่างอ่อนโยน และทำกิจวัตรเช่นนั้นซ้ำแล้วซ้ำเล่าเป็นประจำทุกวัน ทว่าสุดท้ายเขากลับถูกสังหารอย่างง่ายดาย ถูกโซซอสเขมือบลงท้องไปเพียงเพราะความนึกสนุกชั่ววูบของมัน\n\nนั่นแหละคือสัญชาตญาณดั้งเดิมของมังกรโดยแท้\n\nการที่มนุษย์แสดงความรักและฝึกฝนพวกมันอาจช่วยสร้างผลลัพธ์ได้ในระดับหนึ่ง ทว่าไม่เคยมีสิ่งที่เรียกว่าความแน่นอนร้อยเปอร์เซ็นต์ แม้แต่มังกรที่ควรจะเชื่องและคุ้นเคยกับมนุษย์มาเป็นเวลานานก็ยังคงซุกซ่อนความรู้สึกนึกคิดบางอย่างไว้ภายใน ความจริงแล้ว มนุษย์เองก็ไม่อาจหยั่งรู้ระดับสติปัญญาที่แท้จริงของพวกมันได้ หลังจากที่พวกมันเคยตกหลุมพรางอันซับซ้อนที่มนุษย์วางไว้ อย่างเช่นหลุมพรางหรือกำแพงถล่มก็ตามที\n\nทว่าเท่าที่ออร์บารู้มา ในบรรดามังกรเหล่านี้ เขาไม่เคยเห็นเลยสักครั้งที่คำสั่งของหลานจะใช้ไม่ได้ผล อีกทั้งนางยังไม่เคยใช้แส้เฆี่ยนตีหรือใช้เหยื่อล่อเลยด้วยซ้ำ หลานเพียงแค่ผิวปากเป็นท่วงทำนองเสียงต่ำ พวกมันก็จะมายืนเรียงแถวราวกับทหารที่ได้รับการฝึกฝนมาอย่างเป็นระเบียบ พร้อมพาร่างอันใหญ่โตก้าวเดินทีละตัวมุ่งหน้าไปยังทิศทางที่มือน้อยๆ ของหลานกวักเรียก\n\nทว่า ดูเหมือนจะมีตัวที่ดื้อด้านผิดแผกแตกต่างจากตัวอื่นอยู่บ้าง\n\n\"ออร์บา มัวแต่ยืนมองเฉยๆ อยู่ได้ มาช่วยข้าทีสิ\"\n\nด้วยน้ำเสียงติดจะหงุดหงิดเล็กน้อย หลานยืนกอดอกอยู่ใกล้กับมังกรไบอันขนาดกลางตัวหนึ่ง เจ้าตัวนั้นทิ้งสะโพกลงหมอบอยู่ตรงมุมกรงและไม่มีทีท่าว่าจะยอมขยับเขยื้อนเลยแม้แต่นิดเดียว แม้ว่าออร์บาจะไม่ได้คิดว่าตนมีสิทธิ์ไปตำหนิมันเรื่องที่เมินเฉยต่อคำสั่งของหลานก็ตาม แต่พอเขาหันไปมองทางมุมกรง ดูท่าทางเจ้ามังกรตัวนี้คงจะไม่ยอมเดินไปทางอื่นแน่ไม่ว่าจะเกิดอะไรขึ้นก็ตาม\n\n\"จะให้ข้าทำยังไงล่ะ? เอาโซ่ไปคล้องคอมันดีไหม?\"\n\nปืนยิงยาสลบแทบไม่มีผลอะไรกับมังกรไบอันเลย ทว่าหากจะใช้โซ่ลากมันออกมาก็ต้องใช้แรงคนจำนวนมหาศาล มังกรไบอันขนาดกลางแม้จะเตี้ยกว่าโซซอสอยู่พอสมควร ทว่าความสูงช่วงไหล่ของมันก็ยังอยู่ในระดับเดียวกับศีรษะของผู้ใหญ่เต็มวัย ลำตัวยาวราวสามเมตร และผิวหนังอันหยาบกระด้างทั่วร่างก็ให้ความรู้สึกแข็งแกร่งดุจชุดเกราะยามสัมผัส แนวเกล็ดขนาดเล็กทรงเหลี่ยมคล้ายหงอนไก่ผุดเรียงต่อกันเป็นแนวยาว ขับเน้นรูปลักษณ์ของมันให้ดูราวกับกิ้งก่ายักษ์อันแสนดุร้าย\n\n\"เจ้าควรขึ้นไปขี่มันนะ ออร์บา\"\n\n\"เจ้าหมายความว่ายังไง?\"\n\nออร์บาถึงกับผงะไปด้วยความประหลาดใจ ไม่ใช่ว่าไม่เคยมีการประลองแกลดิเอเตอร์ที่นักสู้ต้องขึ้นไปขี่บนหลังมังกรไบอันมาก่อน ทว่าการจับคนที่ยังไม่คุ้นเคยขึ้นไปนั่งบนหลังไบอันนั้นต้องแลกมาด้วยความยากลำบากแสนสาหัส พูดง่ายๆ ก็คือ เจ้าไม่มีทางรู้เลยว่ามังกรมันจะสลัดเจ้าร่วงลงมาแล้วเหยียบย่ำซ้ำไว้ใต้ฝ่าเท้าเมื่อไร แถมในระหว่างนั้นเจ้ายังต้องคอยหาจังหวะฆ่าคู่ต่อสู้อีกด้วย การประลองรูปแบบนั้นมีจุดประสงค์เพื่อสร้างความเร้าใจให้ผู้ชมในสถานการณ์สุดระทึก ทว่าหากปราศจากเวทมนตร์หรือฤทธิ์ยาแล้ว ก็เป็นไปไม่ได้เลยที่จะควบคุมมังกรไบอันซึ่งมีสภาพไม่ต่างจากรถถังหุ้มเกราะหนักได้\n\n\"มังกรแตกต่างจากสัตว์เดรัจฉานทั่วไป ต่อให้พวกมันจะเสื่อมถอยลงไปตามกาลเวลา ทว่ามังกรก็ยังคงมีสติปัญญาเยี่ยงมังกร เพียงแต่มนุษย์ไม่อาจทำความเข้าใจได้เท่านั้นเอง แต่ถ้าเป็นเจ้าล่ะก็ไม่เป็นไรหรอก ออร์บา พวกมันเปิดใจให้เจ้าแล้วอย่างแน่นอน\"\n\nยามที่ริมฝีปากของเด็กสาวเผยอเปิดออก ถ้อยคำที่เอื้อนเอ่ยราวกับกำลังขับขานบทเพลง ทว่าด้วยเนื้อหาที่แทบไม่ต่างจากการสั่งให้ออร์บาเดินไป 'ตาย' เช่นนั้น มันจึงเป็นเรื่องที่ยากจะเข้าใจได้แม้แต่สำหรับแกลดิเอเตอร์ก็ตาม กระนั้น ดังที่กล่าวไปข้างต้น ความจริงก็คือเขาไม่เคยพบเห็นผู้ใดที่มีฝีมือในการควบคุมมังกรเหนือกว่านางอีกแล้ว ยิ่งไปกว่านั้น ยามได้เห็นรอยยิ้มอันไร้เดียงสาไร้การป้องกันอันเป็นเอกลักษณ์ของนาง ด้วยเหตุผลอันลี้ลับบางประการ เขากลับยินดีที่จะเชื่อถือคำพูดสุดแสนบ้าบิ่นทุกคำที่หลุดออกมาจากปากของนาง\n\nออร์บาค่อยๆ ก้าวเท้าเข้าไปใกล้มังกรไบอันอย่างเชื่องช้า เจ้ามังกรเริ่มตะกุยขาหลังลงบนพื้น ส่งเสียงคำรามต่ำๆ ออกมาคำหนึ่งพลางแลบลิ้นสองแฉกผลุบเข้าออกอย่างกระสับกระส่าย ขณะที่จ้องมองลงมายังออร์บาด้วยดวงตาที่ละม้ายคล้ายลูกแก้วใส\n\nออร์บาตัดสินใจรวบรวมความกล้าในชั่วพริบตา ขณะที่ก้าวหลบออกด้านข้าง เขาก็ส่งแรงไปยังขาทั้งสองข้างแล้วกระโจนพุ่งเข้าหาแผ่นหลังของมัน เพียงชั่วอึดใจ ร่างของเขาก็ร่อนลงบนบั้นท้ายของมังกรได้อย่างแม่นยำ เพื่อป้องกันไม่ให้ถูกสลัดร่วงลงมา ออร์บาตวัดแขนทั้งสองข้างโอบกอดรอบลำคออันหนาเตอะของมันเอาไว้แน่น ทว่าน่าประหลาดนัก ยามสัมผัสถูกตัวมัน ดูราวกับว่าสายเลือดอันร้อนระอุของมังกรกำลังถ่ายเทไหลเวียนเข้ามาถึงตัวเขา และแน่นอนว่าออร์บาไม่อาจล่วงรู้ได้ว่าความคิดจิตใจของเจ้ามังกรเกิดการเปลี่ยนแปลงขึ้นหรือไม่ กระนั้น มังกรไบอันตัวนั้นก็ค่อยๆ ยันกายลุกขึ้นยืนอย่างเชื่องช้า แล้วเริ่มออกเดินมุ่งหน้าไปยังจุดที่หญิงสาวคอยชี้นำทาง\n\n\"เด็กคนนี้เพิ่งจะเกิดมาได้แค่ครึ่งปีเท่านั้นเอง\" โฮวหลานเอ่ยขึ้นขณะเดินนำทางสัตว์ร้าย \"ถึงแม้จะผ่านไปเพียงครึ่งปี ขนาดตัวของมันก็ใหญ่โตไม่แพ้ตัวโตเต็มวัยแล้ว ทว่าในใจของพวกมันก็ยังคงเป็นเพียงแค่เด็กน้อยอยู่ดี ถึงอย่างนั้น ในหมู่ผู้ฝึกสัตว์ ก็ยังมีพวกที่แยกแยะความแตกต่างนี้ไม่ออกอยู่เยอะแยะไป\"\n\nมังกรไบอันทั้งสี่ตัวถูกนำเข้าไปขังในกรงแบบใหม่ที่ติดตั้งรอกชัก กรงนั้นสามารถใช้มังกรโซซอสสองตัวหรือมังกรฮูบันเพียงตัวเดียวในการลากจูงได้ ทว่าเนื่องจากโซซอสขึ้นชื่อเรื่องอารมณ์ที่คาดเดาไม่ได้ — แม้ว่าโฮวหลานจะบอกว่าความจริงแล้วมังกรไบอันคือสายพันธุ์ที่เอาแน่เอานอนไม่ได้ที่สุดเพราะไม่อาจสยบพวกมันได้โดยสมบูรณ์ก็ตาม — ดังนั้นพวกมันจึงต้องใช้เวลาตลอดการเดินทางอยู่ภายในกรงขัง\n\nและแล้ว ในขณะที่ทุกคนต่างเร่งรีบตระเตรียมข้าวของจนมือเป็นระวิง ช่วงเวลาเพียงหนึ่งชั่วโมงก่อนออกเดินทาง จู่ๆ มังกรขนาดเล็กฝูงหนึ่งก็พุ่งพรวดเข้ามาในลานฝึกกว้าง\n\nพวกมันคือมังกรเทนโกสามตัวที่วิ่งเรียงแถวกันเข้ามา พวกมันมีขนาดเล็กกว่ามังกรไบอันลงไปอีกหนึ่งขั้น และด้วยความคล่องแคล่วปราดเปรียวในการหักเลี้ยววงแคบ ทำให้มักถูกนำมาใช้ในสนามรบแทนม้าศึก ศีรษะขนาดใหญ่ของพวกมันละม้ายคล้ายนก ลำคอยาวระหงโน้มต่ำลงเกือบติดพื้นดิน และวิ่งกระเด้งกระดอนไปมาบนขาเรียวเล็กทั้งสองข้าง\n\nเมื่อฝูงมังกรหยุดชะงักลงอย่างกะทันหัน ผู้ขี่มังกรตัวหน้าสุดซึ่งเกือบจะถูกแรงเหวี่ยงซัดกระเด็นก็เสียหลักกลิ้งตกลงมาบนพื้น\n\n\"บ-บัดซบ เพราะแบบนี้ไง มังกรถึงได้—\"\n\nชายผู้นั้นถ่มเศษทรายที่ดูเหมือนจะหลุดเข้าไปในปากทิ้ง ร่างกายอันอวบอ้วนตุ้ยนุ้ยของเขาห่อหุ้มไว้ด้วยเสื้อคลุมยาวสีม่วง หากประเมินจากรูปลักษณ์ภายนอก เขาก็ดูเหมือนพ่อค้าผู้มั่งคั่งที่กอบโกยเงินทองมาได้อย่างง่ายดาย ร่างสองร่างที่ติดตามมาด้านหลังซึ่งนั่งอยู่บนหลังมังกรของตนเช่นเดียวกันรีบกระโดดลงมาช่วยพยุงชายที่ดูเหมือนจะเป็นนายจ้างของพวกเขา ในจังหวะเดียวกับที่โฮวหลานรีบวิ่งตรงเข้าไปยังจุดนั้น\n\nมังกรเทนโกตัวหน้าสุดพับขาลงและหมอบราบท่าทางหมดเรี่ยวแรง มันคงจะถูกใช้งานหนักจนเกินกำลัง เพราะมีฟองสีขาวสำรอกออกมาจากปาก หลานกำลังจะเอื้อมมือเข้าไปลูบด้านหลังคอของมัน ทว่า\n\n\"อย่าได้บังอาจเข้าใกล้ท่านผู้มีเกียรติเด็ดขาด นังทาส!\"\n\nเสียงแส้ฟาดดังฉาดลงมาหนึ่งครั้ง แม้ว่าหลานจะพยายามกระโดดถอยหลังหลบในทันที ทว่านางกลับเสียหลักล้มลงจนข้อเท้าถลอกปอกเปิก กระนั้นหลานก็ไม่ได้วิ่งหนี แต่นางกลับจ้องเขม็งไปยังทหารติดอาวุธที่ยืนตระหง่านอยู่ตรงหน้า เขายังเป็นเพียงทหารหนุ่มวัยฉกรรจ์ และเมื่อสายตาของเขาสังเกตเห็นเส้นผมและสีผิวของหลาน สีหน้าของเขาก็ยิ่งบิดเบี้ยวไปด้วยความเกรี้ยวกราด\n\n\"พวกชนเผ่าป่าเถื่อนที่บูชาเทพมังกรเรอะ? อวดดีนักนะ ไอ้พวกคนเถื่อนชั้นต่ำ...\"\n\nกระแสความนิยมในการดูถูกเหยียดหยามชนเผ่าเร่ร่อนผู้ไร้ดินแดนเป็นหลักแหล่งว่าเป็นพวกคนเถื่อนไร้อารยะนั้นฝังรากลึกอยู่ในทุกดินแดน ในแง่นั้น ก็เหมือนกับกรณีของออร์บา ทาร์คัสเป็นพวกยึดถือผลประโยชน์นิยมอย่างถึงที่สุด\n\nทหารนายนั้นเงื้อแส้ขึ้นฟาดซ้ำอีกครั้ง\n\nทว่าเพียงชั่วพริบตาถัดมา เขากลับเปล่งเสียงครางต่ำในลำคอและร่างแข็งทื่อไปทันที มือของออร์บาพุ่งเข้ามาจากด้านข้าง คว้าหมับเข้าที่ข้อมือของอีกฝ่ายแล้วบิดงัดขึ้นด้านบน ขณะที่ทหารหนุ่มดิ้นพล่านด้วยความเจ็บปวดจนแผ่นหลังแอ่นงอ ออร์บาก็ถีบส่งร่างนั้นกระเด็นถลาไปข้างหน้า\n\n\"ข้าไม่รู้หรอกนะว่า 'ท่านผู้มีเกียรติ' ของเจ้ามาจากไหน แต่ที่นี่พวกเราก็มีกฎเกณฑ์ของพวกเราเอง หากเจ้ารังเกียจที่จะต้องมาเกลือกกลั้วกับคนชั้นทาส ก็ไม่ควรจะดั้นด้นย่างกรายเข้ามาในรังทาสตั้งแต่แรก เชิญไสหัวกลับไปได้แล้ว\"\n\nเขากระชากแส้ออกจากมือของทหารนายนั้น แล้วฟาดมันลงกับพื้นอย่างแรง\n\n\"ก-แกกล้าดี... รู้ตัวบ้างไหมว่ากำลังพูดอยู่กับใคร!?\"\n\nทหารหนุ่มทำท่าจะลุกขึ้นยืนและชักดาบที่ข้างเอวออกมา ทว่าในจังหวะนั้นเอง\n\n\"เดี๋ยว! หยุดก่อน ออร์บา!\"\n\nทาร์คัสวิ่งกระหืดกระหอบตรงเข้ามาหาพวกเขาจากด้านหลัง เขาต้องเค้นเรี่ยวแรงทั้งหมดที่มีเพื่อขับเคลื่อนร่างอันอ้วนท้วนสมบูรณ์ของตน ซึ่งดูสูสีคู่คี่ไม่แพ้ชายในชุดคลุมยาวสีม่วงคนนั้นเลยทีเดียว\n\n\"จ-เจ้าโง่เง่าเอ๊ย! ปกติแล้วแกไม่มีสิทธิ์แม้แต่จะปริปากพูดด้วยซ้ำ รีบไสหัวกลับไปเตรียมงานต่อเดี๋ยวนี้!! ...โอ้ ท่านเฟดอมขอรับ หากมีเรื่องเสียมารยาทอันใดเกิดขึ้น กระผมขอกราบขออภัยอย่างสูงยิ่ง โดยเฉพาะอย่างยิ่งการที่ท่านอุตส่าห์เสด็จมาเยือนสถานที่อันซอมซ่อเช่นนี้ด้วยตนเอง กระผมซาบซึ้ง—\"\n\n\"อา ตามสบาย ไม่ต้องค้อมหัวมากขนาดนั้นก็ได้ ทาร์คัส\" ชายในชุดคลุมยาวกล่าวพลางถูมือเข้าหากันแล้วก้าวเข้าไปจับมือทักทายกับพ่อค้าทาส \"ข้ามีธุระกับผู้ชายคนนี้ต่างหาก ออร์บาใช่ไหม? ใช่ ออร์บานั่นแหละ ตัวแกนั่นแหละ\"\n\nเขาชี้นิ้วตรงมายังหน้ากากที่ออร์บาสวมใส่อยู่ ซึ่งในตอนนั้นออร์บากำลังประคองไหล่ของหลานเตรียมจะเดินผละออกไปพอดี\n\nแน่นอนว่าทาร์คัสถึงกับตกตะลึงจนตาค้าง ทว่าตัวออร์บาเองก็ประหลาดใจไม่แพ้กัน ประการแรกเลย มันหาได้ยากยิ่งที่คนจากโลกภายนอกจะเรียกชื่อของทาสดาบออกมาตรงๆ\n\nออร์บาหยุดฝีเท้าลงชะงักงัน ขณะที่เขาพยายามเค้นความทรงจำว่าเคยได้ยินชื่อ 'เฟดอม' มาจากที่ใด ใบหน้าของอีกฝ่ายก็บิดเบี้ยวอย่างประหลาดจนไม่เหมือนใบหน้าของผู้คนที่ออร์บาเคยพบเห็นมาก่อนเลยสักคน กว่าที่เขาจะตระหนักได้ว่านั่นคือรอยยิ้มที่พยายามสะกดกลั้นความดูแคลนที่มีต่อทาสเอาไว้ราวกับกำลังหยั่งเชิงอารมณ์ของเขา ก็ผ่านพ้นไปเนิ่นนานหลังจากนั้นแล้ว\n\nในเวลานั้น เขาลืมเลือนสีหน้าอันน่าพิศวงนั้นไปเสียสนิท เพราะอีกฝ่ายเริ่มต้นเอ่ยถ้อยคำอันเหนือความคาดหมายตรงมาที่ออร์บา\n\n\"แกจำข้าได้ไหม? ไม่สิ บางทีแกอาจจะจำไม่ได้หรอก ในตอนนั้น แกแทบจะไม่มีสติสัมปชัญญะหลงเหลืออยู่ด้วยซ้ำ ข้าคือสมาชิกสภาขุนนางแห่งราชวงศ์จักรพรรดิเมฟิอุส เจ้าผู้ครองนครรัฐบิรัค อีกทั้งยังดำรงตำแหน่งผู้อำนวยการสมาคมแกลดิเอเตอร์ และข้าก็คือคนที่มีคำสั่งให้สวมหน้ากากนั่นลงบนหน้าของแกเอง\"\n\nนี่นับเป็นครั้งแรกที่ออร์บาได้ก้าวเท้าเข้ามาภายในห้องทำงานของทาร์คัสโดยที่ไม่มีตัวเจ้าของห้องอยู่ด้วย ทว่าแน่นอนว่าเขาไม่ใส่ใจเรื่องหยุมหยิมพรรค์นั้นแม้แต่น้อย เหนือสิ่งอื่นใด ดวงตาอันดุดันราวกับจะกลืนกินเลือดเนื้อของออร์บากำลังจ้องเขม็งไปยังชายตรงหน้า — ผู้ที่เรียกขานตนเองว่าเฟดอม ขุนนางชั้นสูงระดับแนวหน้าแห่งจักรวรรดิเมฟิอุส\n\n\"สายตาแบบนั้นมันหมายความว่ายังไง? ดูท่าทางราวกับว่าหากในมือแกมีดาบอยู่สักเล่ม แกคงจะชักมันออกมาบั่นคอข้าทิ้งเสียเดี๋ยวนี้เลยสินะ\"\n\nต่อให้ใช้มือเปล่าข้าก็บีบคอแกให้ตายคามือได้เหมือนกัน ออร์บาคิดในใจ ทว่าแน่นอนว่าเขาไม่ได้เอื้อนเอ่ยคำพูดเหล่านั้นออกไป ข้างกายของเฟดอมมีเด็กหนุ่มคนหนึ่งซึ่งน่าจะเป็นเด็กรับใช้ ยืนคู่กับชายหนุ่มผู้มีใบหน้าซีดเซียวคล้ายคนรับใช้ประจำคฤหาสน์ และทหารอีกหนึ่งนายซึ่งเป็นเพียงคนเดียวที่มีอาวุธติดตัว หากบุ่มบ่ามลงมือในตอนนี้คงเป็นความประมาทอย่างร้ายแรง\n\n\"ต่อให้แกจะผูกใจเจ็บแค้นเคืองข้าไป ก็เหมือนกับหมาที่เห่าผิดต้นไม้เท่านั้นแหละ ไม่ใช่เพราะความต้องการของข้าสักหน่อยที่ทำให้แกต้องติดคุก แต่เป็นเพราะความผิดที่แกก่อไว้เองต่างหากล่ะ\"\n\n\"ถ้าอย่างนั้น...\"\n\nนี่เป็นครั้งแรกที่ออร์บาเปิดปากพูดนับตั้งแต่ชายผู้นี้เรียกชื่อของเขา\n\n\"แล้วทำไมแกถึงสั่งให้ข้าใส่หน้ากากนี่? นี่คือสิ่งที่พวกขุนนางอย่างพวกแกเรียกว่าความสนุกงั้นเรอะ? ข้าจะทุกข์ทรมานสักแค่ไหนก็ไม่สำคัญ เพราะข้าเป็นแค่ทาสชั้นต่ำสินะ!?\"\n\n\"ระวังปากหน่อยนะเว้ย ไอ้สวะ!\" ทหารคนสนิทตะโกนตวาดลั่นด้วยความโกรธ\n\nทว่าเฟดอมกลับโบกมือกล่าวว่า \"ข้าไม่ถือสาหรอก\"\n\n\"ข้าไม่ได้มีเวลาว่างมากพอจะมาเล่นสนุกกับชีวิตทาสที่ไม่รู้ด้วยซ้ำว่าวันพรุ่งนี้จะยังมีลมหายใจอยู่หรือไม่หรอกนะ\" เขากล่าวต่อ \"ทว่า... ก็เพราะวันคืนของแกมันช่างไร้ซึ่งความแน่นอนนั่นแหละ ใช่แล้ว ช่างน่าชื่นชมเหลือเกินที่แกสามารถเอาชีวิตรอดมาได้จนถึงวันนี้ ในตอนนั้น แกเป็นเพียงแค่เด็กน้อยคนหนึ่งเท่านั้น การที่เอาชีวิตรอดในฐานะแกลดิเอเตอร์มาได้ตลอดสองปีเต็ม... จะเรียกว่าเป็นโชคช่วยได้งั้นหรือ? ไม่หรอก แทนที่จะเรียกว่าโชคลาภ สิ่งนี้มันคือสิ่งที่เจ้าเคยอธิบายไว้ได้อย่างยอดเยี่ยมไม่ใช่หรือ — ดุลยภาพอันเที่ยงตรงแห่งโชคชะตา ที่เล่าขานกันว่าได้ลิขิตชะตาชีวิตของมนุษย์ทุกคนเอาไว้แล้วนับตั้งแต่วินาทีที่เอกภพถือกำเนิดขึ้น ถูกไหมล่ะ?\"\n\nเขาหันศีรษะกลับไปหาชายหนุ่มที่ยืนอยู่ด้านหลัง ชายหนุ่มผู้นั้นเผยรอยยิ้มบางๆ ออกมาพลางลูบปลายคางของตนเบาๆ แม้ในแง่หนึ่ง ท่าทีนั้นจะดูไร้สัมมาคารวะยิ่งกว่าท่าทางของออร์บาในหมู่ขุนนางเมฟิอุสด้วยซ้ำ ทว่าเฟดอมกลับไม่มีทีท่าขุ่นเคืองใจเลยแม้แต่น้อย\n\n\"อีกอย่าง ตอนนั้นแกก็แทบจะยังเป็นแค่เด็กน้อย ทว่าร่างกายของแกก็เติบโตเป็นผู้ใหญ่ขึ้นมากตลอดสองปีมานี้ หากไม่มีหน้ากากนั่นคอยปิดบังไว้ แกก็คงไม่เหมือนคนเดิมแล้วล่ะ... อืม ถึงจังหวะเวลาจะคลาดเคลื่อนไปนิดหน่อยก็เถอะนะ หากปล่อยให้เวลาผ่านไปอีกสักปี ร่างกายของแกคงจะพัฒนาเติบโตเต็มที่มากกว่านี้ แต่ขืนรอต่อไปมันก็อาจจะลงเอยด้วยความเสียหายได้เช่นกัน\"\n\nแน่นอนว่าออร์บาไม่เข้าใจเลยแม้แต่น้อยว่าชายผู้นี้กำลังพล่ามเรื่องอะไรอยู่ เฟดอมกำลังพูดจาด้วยน้ำเสียงราวกับได้กลับมาพบเจอสหายเก่าที่ไม่ได้เจอกันมานาน ทั้งที่สำหรับออร์บาแล้ว ตลอดสองปีที่ผ่านมามันคือคำสาปอันแสนทรมาน ด้วยหน้ากากเหล็กที่คอยขวางกั้นระหว่างใบหน้าของเขากับโลกภายนอกตลอดเวลา ซ้ำยังเคยแผดเผาใบหน้าของเขาอย่างรุนแรงอยู่ช่วงเวลาหนึ่งด้วยซ้ำ\n\nเขาเคยดิ้นรนทุรนทุราย อาบโชกไปด้วยเลือดเพราะพยายามใช้เล็บจิกงัดแงะหน้ากากออกมา และถึงขั้นกระดูกข้อเท้าหักตรงจุดที่โซ่ตรวนล่ามขาทั้งสองข้างไว้เพราะการดิ้นรนขัดขืน และในทุกๆ ครั้ง ออร์บาได้แต่ก่นด่าสาปแช่งทุกสรรพสิ่ง ทั้งโชคชะตาที่เขาสูญเสียไป และโชคชะตาอันโหดร้ายที่เขาได้รับกลับมาแทนที่\n\nแท้จริงแล้ว ตลอดระยะเวลาสองปี หน้ากากชิ้นนี้อยู่เคียงข้างออร์บาผู้ไม่อาจทำใจยอมรับความทุกข์ยากและความตายเหล่านั้นได้ และมันได้กลายเป็นสัญลักษณ์แห่งความมุ่งมั่นอันแรงกล้าของเขา ที่จะทวงคืนสิ่งที่ถูกพรากไปจากน้ำมือเดียวกันกับที่คร่าชีวิตแม่ พี่ชาย และอลิซไปจากเขา\n\nและแล้ว จู่ๆ ขุนนางหน้าไหนก็ไม่รู้ก็โผล่มาตรงหน้าเขา พร้อมประกาศตัวว่าตนคือผู้ที่สั่งให้เขาสวมใส่มัน เป็นอย่างที่เฟดอมพูดไว้ไม่มีผิด หากในมือของเขามีดาบอยู่สักเล่ม... ไม่สิ ไม่ว่าจะเป็นดาบสั้น กริช หรือแม้แต่แจกันใบหนักๆ อะไรก็ได้ที่อยู่ใกล้ตัวและใช้สังหารคนได้ ทันทีที่เฟดอมเปิดช่องโหว่เพียงเสี้ยววินาที เขาคงกระโจนพรวดเข้าไปฟาดมันแสกหน้าชายคนนี้จนเละไปแล้ว แน่นอนว่าแม้กระทั่งในตอนนี้ ก็ยังไม่สายเกินไปที่จะทำเช่นนั้น\n\nทว่า ไม่ว่าเฟดอมจะล่วงรู้ถึงเจตนาฆ่าตัวตายแลกชีวิตของออร์บาหรือไม่ ชายผู้นั้นก็ยังคงพูดถ่วงเวลาต่อไปอย่างใจเย็น\n\n\"เอาเถอะ ออร์บา ข้าจะถอดหน้ากากนั่นออกให้แกเดี๋ยวนี้ ณ สถานที่แห่งนี้เลย\"\n\n\"ว่าไงนะ?\"\n\n\"และไม่ใช่แค่นั้น นับจากนี้เป็นต้นไป แกจะได้รับการปลดปล่อยจากสถานะทาสอีกด้วย ไม่มีความจำเป็นที่แกจะต้องจับดาบขึ้นมาเข่นฆ่าผู้คนอีกต่อไปแล้ว ทว่านั่นไม่ได้หมายความว่าแกจะกลายเป็นไทมีอิสระเสรีอย่างสมบูรณ์หรอกนะ มันเข้าใจง่ายนิดเดียว นี่คือเงื่อนไข อีกเพียงไม่นานต่อจากนี้ ทาร์คัสจะมอบตัวแกให้อยู่ภายใต้การดูแลของข้า แต่มันก็ไม่มีอะไรมากไปกว่านั้น\"\n\n\"เดี๋ยวก่อน\"\n\n\"และในระหว่างนั้น แกห้ามขัดขืนคำสั่งของข้า และจงทำตามทุกอย่างที่ข้าพูด ไม่จำเป็นต้องหวาดกลัวไปหรอก มันง่ายดายยิ่งกว่าการต้องไปใช้ชีวิตอยู่ท่ามกลางหมู่ทาสและฆ่าฟันกันเองตั้งเยอะ แกก็แค่เชื่อฟังข้าประดุจหุ่นเชิดตัวหนึ่งเท่านั้นเอง ทว่า—\"\n\n\"บอกให้หยุดก่อนไง!\"\n\nออร์บาเผลอตะโกนตวาดลั่นออกมาอย่างไม่ตั้งใจ เขาเขย่าศีรษะด้วยความหงุดหงิดฉุนเฉียวต่อหน้าเฟดอมที่ถึงกับพูดไม่ออกไปชั่วขณะ\n\n\"ถ้าแกเป็นคนสั่งให้ข้าใส่หน้ากากนี่ แล้วทำไมจู่ๆ วันนี้แกถึงโผล่มาถอดมันออกให้ข้าล่ะ? แล้วทำไมแกถึงต้องปลดปล่อยข้าจากการเป็นทาส ถ้าหากข้ายังต้องคอยก้มหัวทำตามคำสั่งของแกอยู่ดี? นี่มันเรื่องตลกบ้าบอคอแตกอะไรกัน!? เหตุผลอะไรที่ทำให้จู่ๆ แกนึกอยากจะมาถอดหน้ากากของข้าที่นี่เดี๋ยวนี้? แล้วทำไมแกถึงสั่งให้ข้าใส่มันตั้งแต่แรก? พวกแกนี่มันปั่นหัวเล่นกับโชคชะตาของคนอื่นได้อย่างง่ายดายเพียงเพื่อสนองตัณหาชั่ววูบของตัวเองจริงๆ ยังจะหาความสำราญบ้าบออะไรอีกถึงจะพอใจกันฮะ!?\"\n\nแม้ว่าเฟดอมจะไม่ได้ใส่ใจในถ้อยคำเหล่านั้นนัก — คงเป็นเพราะเขาไม่อาจจินตนาการได้ถึงความทุกข์ทรมานแสนสาหัสที่อัดแน่นอยู่ในช่วงเวลาสองปีนั้น — ทว่าเฟดอมก็ผงะถอยหลังไปด้วยความตกใจ เขาขยับสับเปลี่ยนตำแหน่งกับทหารคนสนิทที่ก้าวขึ้นมาข้างหน้าเพื่อปกป้องเจ้านายของตน ออร์บาจ้องเขม็งไปยังร่างของเฟดอมผ่านข้ามไหล่ของทหารนายนั้น ขณะที่ประกายแสงอันคมกริบวาวโรจน์ขึ้นในดวงตาหลังหน้ากาก\n\n\"แกวางแผนจะทำอะไรกันแน่ถึงได้มาถอดหน้ากาก ปลดปล่อยข้าจากการเป็นทาส แล้วซื้อตัวข้าไปแบบนี้? แกกำลังเลี้ยงดูเด็กเอาไว้ฝึกเป็นมือสังหารหรือยังไง!?\"\n\n\"ด-เดี๋ยวก่อน ใจเย็นก่อนสิข้าบอก!\"\n\nคราวนี้เป็นฝ่ายเฟดอมบ้างที่ต้องเป็นฝ่ายคุมสติสถานการณ์ เขาหลบอยู่ด้านหลังแผ่นหลังของทหารพลางยกผ้าเช็ดหน้าขึ้นซับเหงื่อที่ผุดพรายบนหน้าผาก\n\n\"ข้าเข้าใจแล้ว ทว่าพวกเรามีเวลาเหลือไม่มากนัก และที่นี่ก็ไม่ใช่สถานที่ที่เหมาะสมที่จะคุยเรื่องนี้ จะให้ข้าพูดตรงๆ เลยไหมว่าหากแกไม่ยอมทำตามคำสั่งของข้า แกจะต้องถูกฆ่าทิ้งเสียตรงนี้?\"\n\n\"ถ้างั้นแกก็รีบอ้าปากพูดมาให้ไวเลย ว่าแกตั้งใจจะทำอะไรกับข้ากันแน่\"\n\nลูกกระเดือกของทหารหนุ่มขยับขึ้นลงอย่างยากลำบาก แม้ว่าเบื้องหน้าของเขาจะเป็นเพียงบุรุษมือเปล่าไร้ซึ่งอาวุธ ทว่าความรู้สึกยามนี้กลับไม่ต่างอะไรกับการกำลังเผชิญหน้ากับสัตว์กินเนื้อที่กำลังจ้องเขม็งมาด้วยดวงตาสีทองอันวาวโรจน์\n\nขุนนางกับทาส โดยพื้นฐานแล้วคนทั้งสองระดับไม่ควรแม้แต่จะสบตากันด้วยซ้ำ ทว่าบรรยากาศอันกดดันน่าเกรงขามที่พลิกกลับสถานะระหว่างคนทั้งคู่กลับค่อยๆ แผ่ซ่านเข้าครอบคลุมทั่วทั้งห้องทำงาน และในจังหวะนั้นเอง\n\n\"พอเถอะ รอสักประเดี๋ยว\"\n\nชายหนุ่มที่ดูท่าทางคล้ายนักศึกษาเอ่ยแทรกเข้ามาในบทสนทนา เขาก้าวเท้าขึ้นมาข้างหน้าหนึ่งก้าว ยืนขวางกั้นระหว่างออร์บากับเฟดอม\n\n\"เรื่องนี้ไม่ได้ซับซ้อนมากมายอะไรนักหรอก ทว่าการจะให้มานั่งเล่าปูพื้นตั้งแต่ต้นจนจบย่อมต้องสูญเสียเวลาอันมีค่าไปอย่างแน่นอน ข้าควรทำอย่างไรเพื่อโน้มน้าวใจเขาให้ได้เสียก่อนดี? ขอข้าเริ่มต้นด้วยการถอดหน้ากากออกเลยได้ไหมขอรับ?\"\n\n\"หากถอดออกไปแล้ว มันจะเอากลับมาใช้ซ้ำไม่ได้อีกนะ\" เฟดอมเอ่ยด้วยน้ำเสียงไม่สบอารมณ์ \"ถ้าหากเจ้านั่นเกิดเปลี่ยนใจไม่ยอมเชื่อฟังขึ้นมาทีหลัง เครื่องต่อรองทุกอย่างของพวกเราก็จะมลายหายไป เหลือเพียงทางเดียวคือต้องฆ่าทิ้งเท่านั้น\"\n\n\"ยังมีวิธีการอีกตั้งมากมายในการจัดการเรื่องนี้ขอรับ กระผมอยากให้ท่านเชื่อมั่นในตัวกระผม\"\n\nขณะที่ฟังบทสนทนาอันน่าพิศวงของคนทั้งสอง ออร์บาก็พลันสังเกตเห็นว่าชายผู้มีรูปลักษณ์ภายนอกดูเหมือนเด็กหนุ่มผู้นี้ แท้จริงแล้วกลับมีอายุอานามไม่น้อยเลย น้ำเสียงของเขาแหบพร่าอยู่บ้าง ทั้งบนศีรษะยังมีเส้นผมสีขาวแซมปะปนอยู่\n\n\"ข้าเข้าใจแล้ว เฮอร์มานน์ จัดการเลย\"\n\nเมื่อได้รับคำอนุญาตจากเฟดอม ชายผู้มีนามว่าเฮอร์มานน์ก็เดินตรงเข้ามาชิดด้านข้างของออร์บา ออร์บาผงะถอยหลังไปตามสัญชาตญาณ และต้องตกใจสุดขีดเมื่อรู้สึกได้ถึงปลายนิ้วของอีกฝ่ายที่ขยับเข้ามาทาบแนบสนิทอยู่บนหน้ากากของตนเสียแล้ว\n\nออร์บามีความสามารถในการกะระยะของดาบและหอกของตนเองได้อย่างแม่นยำ ทั้งยังสามารถประเมินระยะโจมตีของคู่ต่อสู้ได้ในชั่วพริบตา นั่นคือพรสวรรค์ที่ออร์บามีติดตัวมาตั้งแต่เมื่อสองปีก่อน และเป็นสิ่งที่หล่อเลี้ยงให้เขามีชีวิตรอดมาได้ยาวนานถึงเพียงนี้\n\nกระนั้น เฮอร์มานน์กลับสามารถคืบคลานประชิดเข้ามาถึงหน้าอกของเขาได้อย่างเงียบเชียบและง่ายดายเหลือเกิน\n\n\"อย่าได้กลัวไปเลย\" เฮอร์มานน์เอ่ยพร้อมรอยยิ้มแสยะ ขณะที่จรดปลายนิ้วลงบนหน้ากาก เขาขยับใบหน้าเข้ามาใกล้ยิ่งกว่าเดิม\n\n\"หน้ากากชิ้นนี้ต่อให้ใช้พละกำลังเหนือมนุษย์ก็ไม่อาจง้างออกได้ และแน่นอนว่าไม่มีสิ่งที่เรียกว่ากุญแจสำหรับไขถอดมันออกด้วย ทว่าเรื่องนั้นเจ้าคงจะรู้ซึ้งดีที่สุดด้วยตัวเองแล้วตลอดสองปีที่ผ่านมา ใช่ไหมล่ะ?\"\n\nออร์บาถึงกับนึกสงสัยขึ้นมาวูบหนึ่งว่าคนที่เป็นฝ่ายสวมหน้ากากอยู่กันแน่คือตัวเฮอร์มานน์เองหรือเปล่า เหตุใดจึงดูราวกับว่าอีกฝ่ายนำผิวหนังมนุษย์มาแปะทับไว้บนใบหน้าเพื่อซุกซ่อนโฉมหน้าที่แท้จริงเอาไว้เบื้องหลัง? ผิวหนังนั้นแข็งทื่อผิดธรรมชาติ และหากมองตามมุมตกกระทบของแสง เขาอาจไม่ได้ดูเหมือนชายหนุ่มเลยแม้แต่น้อย\n\nทว่าเหนือสิ่งอื่นใด ก็คือดวงตาทั้งสองข้างที่กำลังจ้องมองมายังเขาคู่นั้น แตกต่างจากสีหน้าอันเรียบเฉยอย่างสิ้นเชิง มีเพียงดวงตาคู่นั้นที่ทอประกายแสงอันคมกริบดุจคมดาบ ชายผู้นี้ไม่เหมือนคู่ต่อสู้อันแข็งแกร่งมากมายที่ออร์บาเคยเผชิญหน้ามาเลยสักคน ทว่าเขากลับถูกจู่โจมด้วยความหวาดหวั่นอันรุนแรงยิ่งกว่าศัตรูหน้าไหนทั้งหมด\n\n\"อย่ามาแตะต้องตัวข้า\" ออร์บาเอ่ยเสียงสั่นสะท้าน เขาไม่อยากยอมรับกับตัวเองเลยว่าบัดนี้เขี้ยวเล็บของตนได้หักสะบั้นลงไปแล้ว \"อีกอย่าง ถ้าไม่มีกุญแจ แล้วแกจะถอดหน้ากากออกได้ยังไง?\"\n\n\"เรื่องกุญแจเป็นแค่สิ่งที่ข้ากุเรื่องขึ้นมาเท่านั้น ข้าบอกแล้วไงว่าอย่าได้กลัวไปเลย บัดนี้ หลังจากผ่านพ้นมาสองปีเต็ม ข้าจะปลดปล่อยเจ้าเป็นอิสระเสียที\"\n\nก่อนที่ออร์บาจะได้ทันเอ่ยปากโต้แย้ง ความรู้สึกของปลายนิ้วที่ขยับบิดไชแทรกซอนก็แผ่ซ่านเข้ามา ดูราวกับเสียงนั้นดังก้องขึ้นมาจากภายในร่างกายของตัวออร์บาเอง\n\nเสียงกึกก้องอันรุนแรงพลันดังสนั่นหวั่นไหว มันฟังดูราวกับว่าโลกทั้งใบกำลังเริ่มต้นปริแตกออกจากกัน ในจังหวะที่หน้ากากของออร์บาเริ่มขยับเขยื้อน ทันทีที่เขาตระหนักได้ว่าตนไม่ได้มีความอาลัยอาวรณ์ใดๆ ต่อการต้องอยู่ร่วมกับมันมาตลอดสองปีเลยแม้แต่น้อย หน้ากากเหล็กก็ค่อยๆ เคลื่อนแยกออกจากด้านข้าง ก่อนจะร่วงหล่นลงมาอย่างกะทันหัน มันตกกระทบพื้นไม้เกิดเสียงดังกังวานใสแปลกหูราวกับเสียงกระดิ่ง ออร์บายืนนิ่งงันไม่อาจขยับเขยื้อนกายได้ชั่วขณะ ก่อนจะค่อยๆ ยกมือขึ้นลูบไล้แก้มของตนเองอย่างแผ่วเบา\n\nความรู้สึกเจิดจ้าพร่าเลือนถาโถมเข้ามาโดยไร้ซุ่มเสียง จนเขาต้องรีบยกมือขึ้นป้องปิดดวงตาเอาไว้ในทันที แม้จะรู้สึกราวกับว่าเฮอร์มานน์ได้ใช้มนตราโจมตีบางอย่างใส่ตน ทว่าตามความจริงแล้ว เขากลับล่วงรู้คำตอบอยู่แก่ใจดี ในแง่หนึ่ง สิ่งนี้สร้างความตื่นตระหนกให้เขายิ่งกว่าการถูกใครสักคนเล็งเอาชีวิตในระยะประชิดเสียอีก ส่งผลให้ร่างกายของเขาถึงกับสั่นเทิ้มขึ้นมา\n\nออร์บา — ยอดนักดาบผู้เป็นที่ยอมรับอย่างกว้างขวางว่าเมื่อใดก็ตามที่คว้าดาบขึ้นมาไว้ในมือ ย่อมไม่หวั่นเกรงต่อสิ่งใดทั้งสิ้น — รู้สึกหงุดหงิดตัวเองที่เวลานี้กลับตื่นกลัวราวกับเด็กน้อย เขาจึงค่อยๆ ลืมตาขึ้นมาอย่างเชื่องช้า\n\nเบื้องหน้าปรากฏร่างของเฟดอมที่ยืนตัวแข็งทื่อราวกับรูปปั้น ไม่สิ ไม่ใช่แค่เขาเพียงคนเดียว แม้แต่ทหารหนุ่มและเด็กรับใช้ที่อยู่ในห้องก็ต่างพากันอ้าปากค้างจ้องมองมาตาไม่กะพริบ พวกเขาไม่ขยับกล้ามเนื้อแม้แต่เพียงมัดเดียว\n\nทันใดนั้น ทหารหนุ่มก็ขยับตัวกะทันหัน ดูราวกับว่าเขาเพิ่งจะได้สติกลับคืนมา เมื่อจู่ๆ เขาก็ทรุดตัวลงคุกเข่าโขกศีรษะลงกับพื้น\n\n\"อ-องค์รัชทายาทงั้นหรือพ่ะย่ะค่ะ!?\" ชายหนุ่มเอ่ยด้วยน้ำเสียงสั่นเครือ \"ข-ขอประทานอภัยในความเสียมารยาทของกระหม่อมด้วยพ่ะย่ะค่ะ ตอนแรกกระหม่อมไม่ทราบจริงๆ ว่าเป็นพระองค์ ได้โปรดทรงอภัยให้กระหม่อมด้วยเถิดพ่ะย่ะค่ะ!\"\n\n\"เป็นไปไม่ได้\" เฟดอมพึมพำ ร่างอันอ้วนฉุของเขาสั่นเทิ้มไปทั้งตัว \"มันเป็นไปไม่ได้! แต่... แต่เฮอร์มานน์ ก่อนหน้านี้หมอนี่ไม่เคยหน้าตาเหมือนกันมากขนาดนี้เลยนี่นา ต่อให้คำนึงถึงระยะเวลาสองปีที่ผ่านไปก็เถอะ ข้าไม่เคยคาดคิดมาก่อนเลยว่าจะเหมือนกันราวกับส่องกระจกขนาดนี้...\"\n\n\"เพราะเหตุนี้แหละขอรับ จึงเรียกขานกันว่ามนตรา\" เฮอร์มานน์หัวเราะหึๆ ด้วยน้ำเสียงอู้อี้อยู่ในลำคอ \"กระผมบอกท่านแล้วไม่ใช่หรือขอรับ? หากมีโชควาสนาอยู่เคียงข้าง ชายผู้นี้ย่อมต้องกลายเป็นประโยชน์อันใหญ่หลวงแก่นายท่านอย่างแน่นอน\"\n\nชั่วอึดใจหนึ่ง ไม่มีสุ้มเสียงใดๆ เล็ดลอดออกมาจากริมฝีปากของผู้ใดอีกเลย\n\nออร์บาสูญเสียการรับรู้ทั้งเสียงและร่างกายของตนเองไปโดยสมบูรณ์ เขาค่อยๆ ยกมือขึ้นสัมผัสแก้มอันเป็นเนื้อหนังมังสาของตนเองอย่างขลาดเขลา ไม่มีสัมผัสของเหล็กกล้าหลงเหลืออยู่อีกต่อไป หน้ากากอันแข็งกระด้างและเย็นเฉียบนั้นได้อันตรธานหายไปจนหมดสิ้น แทนที่ด้วยผิวหนังอันอบอุ่นและอ่อนนุ่ม ออร์บายืนเหม่อลอยกึ่งเคลิ้มฝันพลางครุ่นคิดในใจว่าทั้งหมดนี้อาจจะเป็นเพียงแค่ความฝันตื่นหนึ่งเท่านั้นกระมัง\n\n\"เจ้าอยากจะส่องกระจกดูหน่อยไหม?\"\n\nเฮอร์มานน์ซึ่งเป็นเพียงผู้เดียวที่ยังคงความเยือกเย็นอยู่ได้ ถือวิสาสะเดินไปรื้อค้นบนโต๊ะทำงานของทาร์คัส หยิบกระจกถือบานหนึ่งออกมาแล้วโยนส่งมาให้ออร์บา ขณะที่เขารับมันไว้ในมือ ออร์บาก็กลั้นหายใจก้มลงมองภาพสะท้อนในกระจก\n\nชายหนุ่มผู้มีใบหน้าขาวซีดและดวงตาเรียวคมกำลังจ้องมองสะท้อนกลับมาหาเขา ตลอดสองปีมานี้ ทุกครั้งที่เขามองเข้าไปในกระจก ย่อมมีเพียงหน้ากากเหล็กที่เลียนแบบใบหน้าเสือชิ้นนั้นปรากฏอยู่เบื้องหน้าเสมอ แรกเริ่มเดิมทีเขารู้สึกว่านี่คือความจริงอย่างมิต้องสงสัย ทว่าในไม่ช้า ออร์บากลับบังเกิดความรู้สึกอึดอัดประหลาดบางอย่างเข้ามาบดบังความปีติยินดีนั้นเสียสนิท\n\nนั่นคือใบหน้าของตัวเขาเองอย่างแน่นอน ทว่ากลับมีบางสิ่งบางอย่างที่แตกต่างออกไป แม้ดวงตา จมูก และริมฝีปากยังคงเค้าเดิมอยู่อย่างมั่นคง แต่เขากลับอดสงสัยไม่ได้ว่าองศาอันละเอียดอ่อนบางจุดได้แปรเปลี่ยนไป\n\nเวลาผ่านพ้นไปสองปีแล้ว หรือเป็นไปได้ว่าเขาจะหลงลืมใบหน้าของตัวเองไปแล้วกันแน่?\n\nไม่... ทว่าเขากลับไม่ล่วงรู้ถึงเหตุผลของความผิดปกตินี้เลย ถึงอย่างไร เขาก็มีความรู้สึกว่าดวงตาของตนดูคมกริบผิดแปลกไปเมื่อเทียบกับเมื่อก่อน ริมฝีปากดูบางเฉียบลงเล็กน้อย และสันจมูกก็ดูเหมือนจะโด่งใหญ่ขึ้นอีกนิดหน่อยด้วยซ้ำ\n\n\"เอาล่ะ ถ้าเช่นนั้น\"\n\nเฟดอมเอ่ยทำลายความเงียบงันที่ปกคลุมอยู่จนถึงเมื่อครู่ออกมาอย่างเก้ๆ กังๆ และกะทันหัน\n\n\"หากเป็นถึงเพียงนี้ ความตั้งใจของเจ้าก็คงไม่เป็นปัญหาอีกต่อไป ดูท่าว่าตัวตนของเจ้าจะถูกกำหนดไว้ล่วงหน้ามาตั้งแต่เมื่อสองปีก่อนแล้ว ด้วยพลังอำนาจบางอย่างของทวยเทพ ปีศาจ เทพมังกรในกาลก่อน หรือบางทีอาจจะเป็นตัวตนอันยิ่งใหญ่ที่พวกเราไม่อาจล่วงรู้ชื่อเสียงเรียงนามก็เป็นได้ หากปราศจากพลังนั้นแล้ว เจ้าไม่มีทางละม้ายคล้ายคลึงถึงเพียงนี้ได้อย่างเด็ดขาด\"\n\nในวินาทีที่ออร์บารู้สึกอยากจะเอ่ยปากถามว่าอีกฝ่ายกำลังพล่ามเรื่องบ้าอะไรอยู่ เฟดอมก็ประกาศก้องออกมาในทันที\n\n\"นับจากนี้ เจ้าไม่ใช่ไอ้ออร์บาคนนั้นอีกต่อไปแล้ว และแน่นอนว่าเจ้าก็ไม่ใช่ทาสดาบชั้นต่ำอีกต่อไปเช่นกัน นับตั้งแต่วินาทีที่หน้ากากถูกถอดออก เจ้าได้ถือกำเนิดใหม่เป็นบุคคลอื่นโดยสมบูรณ์ ยิ่งไปกว่านั้น เจ้าไม่ได้เป็นแค่สามัญชนคนธรรมดาที่หาได้ทั่วไปตามท้องถนนเสียด้วยซ้ำ เข้าใจหรือไม่? นับตั้งแต่วันนี้เป็นต้นไป เจ้าได้รับพระกรุณาธิคุณให้สวมบทบาทเป็นผู้ที่ได้รับการขนานนามว่าองค์รัชทายาทผู้สืบทอดราชบัลลังก์แห่งราชวงศ์จักรพรรดิเมฟิอุส... กิล เมฟิอุส!\""
    },

      "title": "บทที่ 3.2: หน้ากากชิ้นใหม่ (2)",
      "content": "เฟดอมพาตัวออร์บาออกจากค่ายฝึกทาสดาบของทาร์คัสในทันที ด้วยความที่ทุกสิ่งทุกอย่างดำเนินไปอย่างรวดเร็วปานสายฟ้าแลบ ชั่วขณะหนึ่งจึงแทบดูไม่ออกเลยด้วยซ้ำว่าเขาได้รับการปลดปล่อยจากการเป็นทาสดาบแล้ว ดูราวกับว่าพวกเขาบรรลุข้อตกลงกันลับหลังโดยไม่ได้บอกกล่าวเรื่องนี้แก่ทาร์คัสเลยแม้แต่น้อย\n\nและเนื่องจากออร์บาไม่เคยคิดฝันมาก่อนเลยว่าขุมนรกแห่งทาสดาบของตนจะปิดฉากลงกะทันหันเช่นนี้ ในความเป็นจริงเขาจึงยังไม่รู้สึกว่ามันเป็นเช่นนั้น เหนือสิ่งอื่นใด เขาไม่รู้เลยจริงๆ ว่าชีวิตของตนต้องตกไปอยู่ในกำมือของใคร และแผนการในอนาคตของผู้ใดที่เขากำลังจะต้องกลิ้งไถลถลำลึกเข้าไป — ดั่งเช่นที่เป็นมาตลอดนับตั้งแต่วัยเยาว์จนกระทั่งถึงบัดนี้\n\nเฟดอมมีคฤหาสน์อยู่ในครอบครองหลายแห่งกระจายอยู่ทั่วดินแดนเมฟิอุส แม้เขาจะนำตัวออร์บามายังคฤหาสน์หลังหนึ่งในจำนวนนั้น ทว่าด้วยเหตุผลกลใดไม่ทราบ ในระหว่างทางออร์บาได้รับคำสั่งให้ใช้ผ้าคลุมผืนหนาคลุมปิดบังใบหน้าไว้ตลอดเวลา\n\nเฟดอมนำทางออร์บาเข้ามาในห้องที่ปูพรมไว้ทั่วทั้งห้อง ก่อนจะลงกลอนประตูอย่างแน่นหนา แล้วบอกว่าเขาได้รับอนุญาตให้ถอดผ้าคลุมออกได้เสียที ภายในห้องมีเพียงทหารคนสนิทและเด็กรับใช้ที่ติดตามไปยังค่ายฝึกด้วยกันเท่านั้น ส่วนนักเวทนามว่าเฮอร์มานน์กลับอันตรธานหายไปอย่างไร้ร่องรอย\n\nหลังจากที่เขาปลดผ้าคลุมลง ทุกคนที่อยู่ในห้องก็พากันจ้องเขม็งมาที่ใบหน้าของเขาอย่างพินิจพิเคราะห์อีกครั้ง\n\n\"ไม่ว่าจะมองดู... สักกี่ครั้ง ข้าก็รู้สึกราวกับว่ามีใครบางคนกำลังเล่นกลหลอกหลอนจิตใจของข้าอยู่ตลอดเวลา ราวกับว่าแท้จริงแล้วเจ้าคือองค์ชายกิลแห่งจักรวรรดิเมฟิอุสที่กำลังแกล้งลองใจข้าอยู่ยังไงยังงั้น\"\n\n\"ข้าต่างหากเล่าที่ไม่เข้าใจเรื่องบ้าๆ นี่เลยสักนิด! องค์ชายแห่งเมฟิอุสงั้นเรอะ!? พวกแกกำลังพล่ามเรื่องบ้าอะไรกันอยู่แน่? พูดจาให้แกลดิเอเตอร์อย่างข้าฟังรู้เรื่องหน่อยสิ!\"\n\nออร์บาเริ่มจะหมดความอดทนและหงุดหงิดขึ้นมาอย่างเห็นได้ชัด ทว่าเฟดอมกลับไม่ได้ถือสาหาความกับวาจาสามหาวไร้สัมมาคารวะนั้นเลย เขาผงกศีรษะรับช้าๆ\n\n\"ก็เข้าใจได้\" เขากล่าว ก่อนจะเริ่มต้นเล่าเรื่องราวทั้งหมดตั้งแต่จุดเริ่มต้น\n\nเรื่องราวต้องย้อนกลับไปเมื่อสองปีก่อน นับตั้งแต่วันที่ออร์บาถูกจับกุมคุมขัง\n\nแต่เดิมทีแล้ว เฟดอมผู้เป็นเจ้าผู้ครองนครรัฐบิรัคย่อมไม่มีทางได้รับรายงานเกี่ยวกับการจับกุมออร์บาเลยแม้แต่น้อย เพราะเขาเป็นเพียงแค่อาชญากรคดีลักเล็กขโมยน้อยตามข้างถนนเท่านั้น ทว่าด้วยเหตุผลบางประการ เขากลับได้รับสารด่วนจากกองกำลังรักษาเมือง\n\nและเมื่อเขาได้ปรายสายตามองดูร่างของออร์บาที่นอนหมดสภาพอยู่ภายในห้องขังเพียงแวบเดียว เขาก็ถึงกับไม่อาจสะกดกลั้นเสียงร้องด้วยความตกตะลึงเอาไว้ได้\n\n\"เจ้ามีใบหน้าละม้ายคล้ายคลึงกับองค์รัชทายาทแห่งเมฟิอุสมากจนน่าตกใจ\"\n\nเฟดอมครุ่นคิดเรื่องนี้อยู่นาน แม้ในช่วงเวลาปกติ องค์รัชทายาทก็มีชื่อเสียงเลื่องลือในเรื่องพฤติกรรมอันแปลกประหลาดพิลึกพิลั่นอยู่แล้ว แม้จะไม่มีใครเชื่อจริงๆ ว่าองค์ชายจะมาปรากฏกายในลานประลองในฐานะแกลดิเอเตอร์ก็ตาม ทว่าข้อกังขาเกี่ยวกับสายเลือดอาจสร้างความแปดเปื้อนต่อเกียรติภูมิของราชวงศ์ และอย่างมากที่สุดมันอาจลุกลามกลายเป็นปัญหาใหญ่ในอนาคตอันยาวไกล ซึ่งจะย้อนกลับมาตั้งคำถามถึงความจงรักภักดีของตัวเฟดอมเองได้\n\nดังนั้น เขาจึงตัดสินใจที่จะปกปิดใบหน้าของออร์บาเอาไว้ และนั่นคือเหตุผลที่เขาสั่งให้สวมหน้ากากชิ้นนั้นลงบนหน้าของออร์บา\n\nแน่นอนว่าออร์บาไม่เชื่อหรอกว่าเรื่องราวจะมีเพียงแค่นั้น แม้เขาจะประหลาดใจที่ได้ยินว่าตนเองหน้าตาคล้ายคลึงกับองค์รัชทายาท ทว่าการถึงขั้นต้องไปขอความช่วยเหลือจากนักเวทนั้นดูจะเกินเลยความเป็นจริงไปมาก\n\nความเจ็บปวดแสนสาหัสที่ดูราวกับเปลวเพลิงแผดเผาใบหน้าของเขาจนมอดไหม้ ความรู้สึกแปลกแยกผิดธรรมชาติยามที่เขาสัมผัสใบหน้าของตนเองหลังจากถอดหน้ากากออก... สิ่งเหล่านี้ พวกมันไม่ได้คำนวณและวางแผนล่วงหน้าไว้ตั้งแต่แรกเริ่มเลยหรอกหรือ?\n\nทั่วทั้งร่างของเขากลับมาเดือดพล่านไปด้วยเพลิงโทสะอีกครั้ง ทว่าออร์บายังคงแสร้งทำเป็นเยือกเย็น\n\n\"ข้าเข้าใจเหตุผลที่ต้องใส่หน้ากากแล้ว ถ้างั้น อะไรคือเหตุผลที่แกถอดมันออกล่ะ?\"\n\n\"ก็อย่างที่ข้าบอกไปเมื่อครู่นี้\"\n\n\"ให้ข้าเป็นองค์ชายงั้นเรอะ? แกตั้งใจจะให้ข้าเป็นตัวตายตัวแทนใช่ไหม?\"\n\n\"โอ้? ดูเหมือนเจ้าจะเข้าใจได้ถูกต้องตรงเผงเลยทีเดียว มันเป็นเช่นนั้นแหละ หากเจ้ามีใบหน้าเหมือนองค์ชายถึงเพียงนี้ เจ้าก็ควรจะสามารถรับใช้ชาติบ้านเมืองได้เพียงเพราะเหตุผลข้อนี้เพียงข้อเดียว ข้าคิดว่าเจ้าควรจะรู้สึกเป็นเกียรติเสียด้วยซ้ำ ยิ่งไปกว่านั้น ทั้งหมดนี้ก็เพื่อแลกกับการที่เจ้าได้รับการปลดปล่อยจากการเป็นทาส — และเพื่ออิสรภาพของเจ้า แน่นอนว่าไม่มีสิ่งใดที่ข้าจะต้องบอกเจ้าไปมากกว่านี้อีกแล้ว\"\n\n\"เมฟิอุสกำลังจะลงนามสงบศึกกับการ์เบราไม่ใช่หรือไง? กำลังจะเกิดสงครามขึ้นอีกครั้งงั้นเรอะ?\"\n\n\"ตัวตายตัวแทนไม่ได้มีประโยชน์เฉพาะในสนามรบหรอกนะ แต่ถ้าเจ้ารู้เรื่องการสงบศึก เจ้าก็คงรู้เรื่องงานอภิเษกสมรสขององค์ชายด้วยใช่ไหมล่ะ?\"\n\n\"เพราะข้าเคยเป็นหนึ่งในทาสดาบยังไงล่ะ\"\n\n\"ถ้าอย่างนั้น ตอนนี้เจ้าก็ต้องมุ่งหน้าไปยังหุบเขาเซรินด้วยธุระที่แตกต่างออกไป\"\n\nเฟดอมอธิบายว่า ดูเหมือนจะมีผู้คนจำนวนมากทั้งภายในและภายนอกประเทศที่ไม่พอใจและกระสับกระส่ายกับงานอภิเษกสมรสในครั้งนี้ ไม่แน่ว่าอาจมีใครบางคนพยายามเข้ามาขัดขวางพิธีแต่งงานด้วยการจงใจก่อความไม่สงบขึ้น และบางกลุ่มอาจมุ่งเป้าลอบสังหารองค์รัชทายาทหรือเจ้าหญิงแห่งการ์เบราก็เป็นได้\n\n\"ความเป็นไปได้ที่ภยันตรายจะมาถึงพระองค์จริงนั้นสูงยิ่ง แน่นอนว่าพวกเราตั้งใจจะจัดกำลังคุ้มกันอย่างรัดกุมไร้ที่ติ ทว่าเพราะพวกเราต้องการสร้างสัมพันธ์พันธมิตรร่วมกันให้เร็วที่สุด จึงได้ตกลงปลงใจจัดงานแต่งงานนี้ขึ้นอย่างเร่งรีบ พวกเราจึงตัดสินใจใช้เจ้าเป็นหลักประกันในกรณีที่เลวร้ายที่สุด\"\n\nออร์บานิ่งคิดไปชั่วครู่ ดูเหมือนว่าบัดนี้เขาจะถูกผลักให้เข้ามารับตำแหน่งนี้อย่างกะทันหันโดยแทบไม่มีเวลาเตรียมตัว พิธีอภิเษกสมรสจะมีขึ้นในอีกสามวันข้างหน้า คนที่เพิ่งเป็นแกลดิเอเตอร์มาจนถึงเมื่อครู่ กลับต้องมาแสดงละครตบตาเป็นองค์ชายภายในเวลาเพียงสามวันเนี่ยนะ\n\nเรื่องไร้สาระพรรค์นี้มันอะไรกัน!\n\nแม้ว่าเขาจะอยากปฏิเสธเพียงใด เพราะเรื่องเล่านี้ดูไม่มีมูลความจริงที่น่าเชื่อถือเลยสักนิด ทว่าหากเป็นความจริงที่ว่าสถานการณ์ส่วนใหญ่ที่กล่าวมาคือความลับสุดยอดของแผ่นดิน นั่นก็ย่อมเป็นเรื่องคอขาดบาดตายสำหรับตัวออร์บาแล้ว หากเขาปฏิเสธ นั่นก็หมายถึงความตายสถานเดียว\n\nก่อนหน้านี้ ออร์บาเคยลองหยั่งเชิงข่มขู่ด้วยวาจามาแล้ว ทว่าคู่สนทนาของเขากลับไม่มีทีท่าหวาดหวั่นเลยแม้แต่น้อย หยาดเหงื่อบางๆ เริ่มผุดซึมขึ้นบนผิวหน้าของเขาที่ได้สัมผัสกับอากาศบริสุทธิ์เป็นครั้งแรกในรอบสองปี สถานการณ์ตรงหน้านี้แตกต่างจากการประลองของแกลดิเอเตอร์ นี่ไม่ใช่ศัตรูที่เขาสามารถเอาชนะได้ด้วยการจับดาบเข้าห้ำหั่น นั่นคือความเป็นจริงในเวลานี้\n\nองค์ชายแห่งเมฟิอุสงั้นเรอะ...?\n\nความคิดแวบหนึ่งพลันผุดพรายขึ้นมาในสมอง หัวใจของเขาเต้นรัวระทึกอยู่เบื้องหลังแผงอกอันหนาแน่น ออร์พาสูดลมหายใจเข้าลึกๆ แผ่วเบา แล้วยังคงรักษาท่าทีภายนอกอันสงบนิ่งไว้ พลางเอ่ยถามขึ้นว่า\n\n\"หากข้าต้องรับหน้าที่เป็นตัวแทน — ข้าจะต้องแสดงละครเป็นองค์ชายนานแค่ไหน? แล้วเรื่องส่วนสุดท้ายของพิธีแต่งงานล่ะ?\"\n\n\"ทำไมล่ะ? เจ้าปรารถนาอยากจะข้ามขั้นไปถึงตรงนั้นเร็วๆ ขนาดนั้นเชียวหรือ?\" เฟดอมหัวเราะร่าอย่างพึงพอใจ \"ไม่ต้องบอกก็รู้ เจ้าไม่มีปัญญาได้แอบมุดเข้าไปในเตียงของเจ้าหญิงในคืนส่งตัวเข้าหอหรอก เจ้าจะต้องแสดงละครต่อไปจนกว่าพวกเราจะเห็นพ้องต้องกันว่าปลอดภัยเพียงพอแล้ว มันคงไม่นานเกินไปนักหรอก\"\n\n\"ขอข้าถามอีกข้อหนึ่ง\"\n\n\"อะไรอีกล่ะ? ว่ามาสิ\"\n\n\"อะไรคือหลักประกันว่าแกจะไม่ฆ่าข้าปิดปากเมื่อเรื่องนี้จบลง?\"\n\n\"ว่าไงนะ?\"\n\n\"หากความจริงปรากฏว่าพวกแกใช้ตัวตายตัวแทนในงานอภิเษกสมรสระหว่างราชวงศ์ ย่อมคาดเดาได้เลยว่ามันจะเหยียบย่ำศักดิ์ศรีของการ์เบราจนแหลกสลาย และไฟสงครามอาจปะทุขึ้นมาอีกครั้ง แม้แต่คนที่ต่ำต้อยไร้ความสำคัญที่สุดที่ล่วงรู้เรื่องตัวแทนนี้ ก็สามารถทำลายเรื่องราวทั้งหมดให้พังพินาศได้ แต่คนโบราณเขาว่ากันว่าคนตายย่อมพูดไม่ได้ไม่ใช่หรือไง?\"\n\nออร์บาเหลือบสายตาไปมองทหารคนสนิทและเด็กรับใช้ที่อยู่ภายในห้อง เด็กหนุ่มท่าทางคล้ายคนรับใช้มีใบหน้าซีดเผือดอยู่แล้ว ทว่าแม้แต่ทหารนายนั้นก็เริ่มแสดงอาการตัวสั่นเทาออกมาให้เห็น เฟดอมเดาะลิ้นเบาๆ อารมณ์รื่นเริงหม่นหมองลงในทันใด\n\n\"เจ้าเป็นเพียงแค่ทาส แต่ริอ่านจะมาตั้งเงื่อนไขต่อรองกับข้างั้นหรือ? ไม่มีความจำเป็นต้องไปกังวลกับเรื่องไร้สาระพวกนั้นหรอก ทว่าเจ้าก็พูดถูก การกระทำของคนเราอาจเป็นไปตามที่เจ้าว่าจริงๆ แน่นอนว่าการจะปล่อยเจ้าให้เป็นอิสระไปทั้งที่มีใบหน้าเหมือนองค์ชายเช่นนี้ย่อมเป็นเรื่องที่เป็นไปไม่ได้เด็ดขาด ทว่า ที่ข้าพูดเช่นนี้ก็เพราะมันไม่ได้ขัดแย้งกับสิ่งที่ข้าบอกไปก่อนหน้านี้ ตัวตายตัวแทนไม่ได้มีประโยชน์แค่เฉพาะในพิธีแต่งงานเท่านั้นไม่ใช่หรือ? ถึงแม้ตามปกติอาจมีความไม่สะดวกบางประการที่ทำให้เจ้าต้องคอยคลุมหน้าไว้บ้าง แต่ข้าก็ตั้งใจจะให้เจ้าได้ใช้ชีวิตอย่างสุขสบายในฐานะคนในความอุปถัมภ์ของข้าต่อไป\"\n\nออร์บาจมดิ่งลงสู่ความเงียบงันอีกครั้ง ใบหน้าของเขาละม้ายคล้ายคลึงกับองค์รัชทายาทมากเสียจนสร้างความตกตะลึงให้แก่เฟดอมเองด้วยซ้ำ ดังนั้น เรื่องนี้จึงไม่ใช่ส่วนหนึ่งในแผนการดั้งเดิมของอีกฝ่ายอย่างแน่นอน ทว่าแน่นอนว่า นั่นย่อมไม่ใช่หลักประกันอันสมบูรณ์แบบสำหรับทุกสิ่งทุกอย่าง\n\n\"ข้าเข้าใจแล้ว\" ออร์บาเอ่ยปากยินยอม \"ตกลงตามนี้ เงื่อนไขพวกนี้ไม่ได้แย่อะไรนัก ทว่า ข้าไม่มีความมั่นใจเลยสักนิดว่าจะมีใครสามารถสั่งสอนให้ข้าจดจำกิริยาท่าทางที่เหมาะสมขององค์รัชทายาทได้\"\n\n\"ถ้าเช่นนั้นก็ถือว่าตกลง เท่าที่ข้าดู การเจรจาเป็นอันลุล่วงแล้ว\"\n\nเฟดอมเผยรอยยิ้มออกมาแล้วลุกขึ้นจากที่นั่ง ราวกับว่าเขาไม่ได้คิดจะยืนอยู่ตรงนี้เพื่อชื่นชมผลงานของตนเองต่อเลยแม้แต่น้อย\n\n\"ตามข้ามา นี่คือเหตุผลที่ข้าพาตัวดินน์ เด็กรับใช้ของข้ามาด้วย เขาจะทำหน้าที่สอนมารยาทที่จำเป็นให้แก่เจ้าไปพลางๆ ก่อนสำหรับการเริ่มต้น\"\n\n***\n\nช่วงเวลาสามวันหลังจากนั้นผ่านพ้นไปสำหรับออร์บาอย่างเร่งรีบและโกลาหล เขาไม่ต้องกวาดถูทำความสะอาดที่พัก ไม่ต้องคอยดูแลฝูงมังกร ไม่ต้องฝึกดาบ หรือวุ่นวายกับงานตรากตรำที่คอยบั่นทอนร่างกายและจิตใจ ในตอนแรก เขาคิดว่าสิ่งที่ต้องแก้ไขมีเพียงแค่การปรับท่วงท่าการยืนให้สง่างามเท่านั้น ยืดอก เชิดแผ่นหลังให้ตรง และดึงคางเข้า ทว่าเขายังต้องปรับตัวให้คุ้นเคยกับท่วงทางการเดินแบบใหม่อีกด้วย\n\nดินน์ เด็กรับใช้ประจำตัว ไม่เพียงแต่จะมีใบหน้าน่ารักน่าเอ็นดูเท่านั้น ทว่ายังแสดงฝีมือในฐานะผู้ฝึกสอนอันยอดเยี่ยม ด้วยการป้อนคำสั่งอันเข้มงวดเป็นขั้นเป็นตอนแก่ออร์บาอย่างต่อเนื่องไม่หยุดหย่อน\n\nการต้องเค้นสมองในส่วนที่ปกติเขาไม่เคยใช้งานมาก่อน ทำให้เขาเหน็ดเหนื่อยจนแทบหายใจไม่ทันอย่างแท้จริง ทว่าการฝึกฝนอีกรูปแบบหนึ่งก็รอคอยเขาอยู่ทันทีหลังจากนั้น\n\nดินน์หยิบกระจกบานเล็กออกมา เมื่อออร์บาเอ่ยถามว่าต่อไปคืออะไร เด็กหนุ่มก็ยื่นกระจกส่งให้เขาพลางกล่าวว่า\n\n\"วิธีการหัวเราะขอรับ\" พร้อมกับแย้มยิ้มให้เขาดูเป็นตัวอย่าง\n\nตารางเวลาอันอัดแน่นเอี๊ยดภายในเวลาสามวัน ดูเหมือนจะไม่เปิดโอกาสให้เขาได้หยุดพักผ่อนหย่อนใจเลยแม้แต่น้อย แม้ว่าออร์บาจะไม่เคยคาดคิดมาก่อนว่าจะต้องกลายมาเป็นองค์รัชทายาทอย่างกะทันหัน — มันให้ความรู้สึกเหมือนความคิดเพ้อเจ้อไร้สาระทุกครั้งที่เขานึกขึ้นมาได้ว่าตนเองถูกโยนเข้ามาอยู่ในวังวนนี้ได้อย่างไร — ทว่ามันกลับทำให้ออร์บาหวนนึกถึงช่วงเวลาที่ตนเองเป็นทาสดาบ\n\n*ข้าดิ้นรนมีชีวิตรอดผ่านพ้นสองปีนั้นมาเพื่ออะไรกัน? ข้าต้องยอมทำตามคำสั่งราวกับหมาโง่ๆ ตัวหนึ่ง ยอมเสี่ยงชีวิต ยอมเข่นฆ่าผู้คนไปเพื่ออะไร?*\n\nเขาคอยโยนฟืนเติมเชื้อไฟลงไปอย่างต่อเนื่อง เพื่อให้เปลวเพลิงสีฟ้าวิบวับดุจวิญญาณพเนจรยังคงลุกโชนอยู่เบื้องลึกในหัวใจของตน\n\n*หากข้าวิ่งหนีเตลิดไปจากที่นี่ ข้าคงถูกฆ่าทิ้งในทันที หรืออย่างดีที่สุดก็ถูกลากคอกลับไปเป็นทาสดาบซ้ำสอง*\n\nมันยากที่จะสังเกตเห็นได้ เพราะทุกสิ่งทุกอย่างเกิดขึ้นอย่างกะทันหันเหลือเกิน ทว่าอย่างน้อยที่สุดก็ยังมีแง่มุมที่สดใสอยู่บ้างประการหนึ่ง และหากมีแสงสว่างส่องเข้ามาในชีวิตของเขาแม้เพียงรำไร สำหรับออร์บาผู้ก้าวเดินและคลำทางฝ่าความมืดมิดมาโดยตลอด นี่คือสัญญาณแห่งความก้าวหน้าอย่างมิต้องสงสัยท่ามกลางความเปลี่ยนแปลงอันพลิกผันของสภาพแวดล้อมในปัจจุบัน\n\nตลอดสองปีที่ผ่านมา เขาแทบจะสูญเสียตัวตนไปท่ามกลางคาวเลือด เศษอ้วก น้ำไขสันหลัง และเศษเครื่องใน ทั้งที่รู้ดีว่าตนไม่อาจเอื้อมไปถึงสถานที่อันสงบสุขได้ ทว่าไม่มีทางที่เขาจะหยุดยั้งการเอื้อมมือออกไป แม้ว่าสิ่งที่เขาพยายามจะไขว่คว้านั้นจะสูงส่งไม่ต่างอะไรกับการพยายามเอื้อมให้ถึงสรวงสวรรค์ก็ตามที\n\nอย่างน้อย นั่นคือสิ่งที่ตัวออร์บาเองเชื่อมั่น และดังนั้น เขาจึงยอมรับการอบรมสั่งสอนของเด็กหนุ่มแต่โดยดี\n\nยามที่ดวงตะวันคล้อยต่ำลาลับขอบฟ้า แม้ดินน์จะคอยให้คำแนะนำอยู่ข้างๆ ออร์บาก็ก้าวลงไปแช่กายในอ่างน้ำร้อนเพื่อชำระล้างร่างกายของตน เขาสามารถเหยียดแขนขาได้กว้างขวางเท่าที่ใจปรารถนา และพวกเขายังช่วยกันตัดผมสีดำกระเซอะกระเซิงผืนหนาที่ถูกมัดรวบไว้ข้างหลังออกไปเป็นจำนวนมาก อีกทั้งยังใช้มีดโกนเกลาหนวดเคราบนใบหน้าของเขาจนเกลี้ยงเกลา และเมื่อเขาก้าวขึ้นมาจากอ่างน้ำหลังจากนั้น กางเกงชั้นในผ้าลินินเนื้อละเอียด เสื้อทูนิกผ้าไหม และกางเกงผ้ากำมะหยี่ก็ถูกตระเตรียมไว้ให้เขาพร้อมสรรพ\n\nสำหรับที่หลับนอน เขาได้รับเตียงที่มีพื้นที่กว้างขวางเสียจนเหลือเฟือ แม้ว่าเขาจะกางแขนและขาออกจนสุดแขนสุดขาก็ตาม สัมผัสของเตียงหลังนี้นำพาให้เขาหวนนึกถึงสัมผัสแห่งผิวกายของเหล่าหญิงสาวผิวขาวผ่องที่เขาเคยใช้ค่ำคืนร่วมด้วยหลายครั้งในยามที่ยังเป็นหัวหน้าแก๊งเด็กเร่ร่อน\n\n*ที่นี่คือที่ไหนกันแน่?*\n\nขณะที่สลึมสลือล่องลอยอยู่ระหว่างความหลับกับความตื่น จู่ๆ ออร์บาก็ได้ยินเสียงของตนเองดังก้องขึ้นมาจากภายในจิตใจ\n\n*พี่ครับ... ผมนอนไม่หลับ*\n\n*ช่วยจับมือผมไว้ทีสิครับ...*\n\n*พี่ครับ...*\n\n***\n\nหุบเขาเซริน — ดินแดนที่เล่าขานกันว่ามนุษยชาติได้ย่างเหยียบลงสู่ดาวเคราะห์ดวงนี้เป็นครั้งแรกจากเรือผู้อพยพอวกาศ มันคือเรื่องเล่าขานจากยุคเทพปกรณัมเมื่อกว่าห้าร้อยปีก่อน เมื่อได้สดับฟังเรื่องราวดังกล่าว ที่ดินผืนนี้ก็ดูศักดิ์สิทธิ์และแฝงความยิ่งใหญ่เกินจริงอยู่ไม่น้อย ทว่าในความเป็นจริงแล้ว กลับมีสถานที่ที่มีตำนานคล้ายคลึงกันเช่นนี้กระจายตัวอยู่ทั่วทุกมุมโลกนับสิบแห่ง\n\nหุบเขาแห่งนี้ทอดตัวเงียบสงบอยู่ในส่วนลึกทางทิศใต้ บนหน้าผาหินสูงชันถูกขุดเจาะเป็นพระราชวังขนาดย่อมที่สร้างขึ้นจากไม้และหินอ่อน ตามผนังทางเดินมีภาพแกะสลักนูนต่ำบอกเล่าเหตุการณ์ตามตำนานมากมายที่เกิดขึ้นนับตั้งแต่ยุค 'การเสด็จลงมาอันศักดิ์สิทธิ์' ของยานอวกาศ จวบจนกระทั่งถึงการสถาปนาจักรวรรดิเมฟิอุส และเนื่องจากพวกมันถูกประดับประดาไว้ด้วยอัญมณีล้ำค่านานาชนิด เงาเงื้อมจึงไหวระริกไปมาทุกครั้งที่แสงไฟจากกระถางคบเพลิงเหล็กสาดส่องกระทบ ทำให้ภาพเหล่านั้นดูราวกับมีชีวิตและกำลังหายใจอยู่จริงๆ\n\nและห้องโถงเปิดโล่งอันกว้างขวางที่ทอดตัวลึกเข้าไปด้านใน ก็เนืองแน่นไปด้วยฝูงชนสุภาพสตรีและสุภาพบุรุษชั้นสูงจำนวนมหาศาล แม้จะอยู่ลึกเข้าไปภายในโพรงผา ทว่าแสงสว่างกลับเจิดจ้าเหลือเฟือ และประกายแสงระยิบระยับของแก้วสุราที่ยกชูขึ้นก็สะท้อนแสงวิบวับไปทั่วทุกหนแห่ง\n\nกลุ่มนักดนตรีระดับปรมาจารย์จับจองพื้นที่ตรงมุมห้องและบรรเลงบทเพลงหลากหลายท่วงทำนอง ตั้งแต่บทเพลงโบราณไปจนถึงดนตรีจังหวะเร็วที่กำลังเป็นที่นิยมในปัจจุบันตามแต่จะได้รับคำขอ แขกเหรื่อหลายคนเริ่มขยับกายเต้นรำไปตามอารมณ์ และเสียงหัวเราะครึกครื้นตามจุดต่างๆ ก็ไม่เคยเหือดแห้งหายไป\n\n\"องค์ชายพ่ะย่ะค่ะ\" ใครบางคนส่งเสียงเรียกเขา\n\n\"ขอแสดงความยินดีด้วยพ่ะย่ะค่ะ ฝ่าบาท\"\n\n\"องค์ชายกิล!\"\n\n\"ขอแสดงความยินดีกับงานอภิเษกสมรสด้วยพ่ะย่ะค่ะ\"\n\nผู้คนมากมายเบียดเสียดปะปนกัน แม้พวกเขาจะขนานนามเขาว่า 'ฝ่าบาท' หรือ 'องค์ชายกิล' และกล่าวทักทายเขาด้วยรอยยิ้ม ออร์บาก็ทำตามสิ่งที่ได้รับการอบรมสั่งสอนมาอย่างเคร่งครัดยามเผชิญหน้ากับคนเหล่านั้น ด้วยการคลี่ยิ้มอย่างสง่างามเอื้อเฟื้อและยกมือขึ้นตอบรับเพียงเล็กน้อย\n\nเฟดอมกำลังก้าวเดินเคียงข้างติดแนบชิดกับออร์บา\n\n\"ฟังนะ ออร์บา\" เฟดอมเคยเอ่ยไว้เมื่อช่วงเช้า ตอนที่เขานำรถม้าไปรับตัวออร์บา กลิ่นอายอันตึงเครียดของนักรบที่เตรียมพร้อมจะเข้าสู่สมรภูมิรบชี้ชะตาแผ่ซ่านอยู่รอบกายเขา\n\n\"แน่นอนว่า บรรดาผู้เข้าร่วมงานเลี้ยงจากฝั่งการ์เบรา หรือแม้กระทั่งฝ่ายเมฟิอุสเองก็ตาม ต่างไม่มีใครล่วงรู้ถึงตัวตนที่แท้จริงของเจ้าเลยแม้แต่คนเดียว ถึงอย่างไร ข้าก็ไม่อาจรู้ได้เลยว่าข้อมูลดังกล่าวอาจรั่วไหลออกไปจากทางไหนได้บ้าง ทว่ากิริยามารยาทและท่วงท่าของเชื้อพระวงศ์ไม่ใช่สิ่งที่จะฝึกฝนให้เชี่ยวชาญได้ภายในเวลาเพียงสามวันหรอก เจ้าไม่ต้องทำอะไรทั้งนั้น ไม่ต้องคิดอะไรทั้งสิ้น ไม่ต้องมองอะไรทั้งปวง เจ้าจงเคลื่อนไหวเมื่อข้าสั่งให้เคลื่อนไหว และจงพูดเมื่อข้าสั่งให้พูด เท่านั้นพอ เข้าใจไหม?\"\n\nทว่าแม้จะพยายามเพียงใด เขาก็ยังรู้สึกว่าร่างกายของตนไม่ได้คุ้นเคยกับท่วงทางการเดินเช่นนี้เลยแม้แต่น้อย เขารู้สึกว่าการเดินแบบนี้มันช่างยากลำบากยิ่งกว่าตอนที่ขาทั้งสองข้างถูกล่ามด้วยโซ่ตรวนเสียอีก\n\nเหนือสิ่งอื่นใด ก็คือผู้คน — ฝูงชนจำนวนมากมายมหาศาล พวกเขาแต่งกายด้วยเสื้อผ้าอาภรณ์อันวิจิตรเลิศหรูจนสายตาของเขาลายพร่าไปหมด และไม่มีใครเลยสักคนเดียวที่จะมองข้ามหรือเมินเฉยต่อออร์บา คนที่อยู่ใกล้ต่างพากันค้อมหัวคำนับ แสดงความขอบคุณ หรือก้าวเข้ามาหาพร้อมยกมือทักทาย และทุกคนต่างแย้มยิ้มพร้อมขยับปากเปล่งคำว่า 'ยินดีด้วย' ออกมา\n\nส่วนผู้คนที่ยืนอยู่ห่างไกลออกไปต่างชี้นิ้วมาทางออร์บา พวกเขายืนจับกลุ่มกระซิบกระซาบพูดคุยกันพลางจ้องเขม็งมาที่เขา\n\nไม่สิ — มันไม่ได้เกี่ยวกับตัวออร์บาเลยแม้แต่น้อย บุคคลที่สะท้อนอยู่ในดวงตาของพวกเขา และบุคคลที่พวกเขาเปล่งเสียงทักทายหา หาใช่ออร์บาไม่ เขาย่อมเข้าใจเรื่องนั้นดี แม้เขาจะเพิ่งล่วงรู้เรื่องนี้มาได้ไม่เกินสามวัน ทว่าเขาก็ยังพบว่ามันเป็นไปไม่ได้เลยที่จะจินตนาการภาพตนเองเป็นองค์รัชทายาท\n\nจู่ๆ ออร์บาก็ลืมเลือนแม้กระทั่งวิธีการก้าวเดิน และแทบจะไม่อาจกล่าวคำทักทายตอบกลับข้าราชบริพารคนหนึ่งได้ ทว่าคนเหล่านั้นกลับมองว่านั่นเป็นเพียงภาพลักษณ์อันมีเสน่ห์น่าเอ็นดู โดยพากันคิดไปเองว่าความตึงเครียดนั้นเกิดขึ้นเพราะเขากำลังจะได้พบหน้าว่าที่เจ้าสาวเป็นครั้งแรก\n\n\"ยืดอกขึ้นอีกหน่อยสิ\" เฟดอมกระซิบข้างหูเขาอย่างดื้อดึง \"เจ้าเป็นถึงแกลดิเอเตอร์ไม่ใช่หรือไง? เจ้าจะมาตื่นกลัวกับสถานที่พรรค์นี้ได้ยังไงกัน?\"\n\nเขาอยากจะตวาดด่าอีกฝ่ายว่าไอ้สวะเหลือเกิน ทว่าย่อมไม่อาจทำได้ และยิ่งเขารู้สึกตัวถึงท่วงทางการเดินอันเก้งก้างงุ่มง่ามของตนมากเท่าไร สีหน้าของเขาก็ยิ่งกระตุกเกร็งมากขึ้นเท่านั้น ห่างไกลจากคำว่าท่วงท่าขององค์ชายลิบลับ ออร์บายังไม่คุ้นชินกับใบหน้าที่แท้จริงของตนเองหลังจากถอดหน้ากากเหล็กออกเสียด้วยซ้ำ\n\nเขารีบเบือนสายตาไปยังโต๊ะอาหารที่มีอาหารการกินเรียงรายอยู่อย่างละลานตา มากมายเสียจนต่อให้มีผู้คนเนืองแน่นอยู่ในห้องโถงนี้สักกี่คน ก็ไม่มีทางที่จะกินได้หมดอย่างแน่นอน ซ้ำร้ายไปกว่านั้น ไม่มีจานใบใดถูกปล่อยให้ว่างเปล่าเลยแม้แต่ใบเดียว หากมีจานว่างเพียงใบเดียวปรากฏขึ้น มันจะถูกสับเปลี่ยนแทนที่ด้วยจานที่พูนไปด้วยอาหารเลิศรสในทันที\n\nหากเขายื่นมือออกไปกอบโกยมาเต็มอ้อมแขน มันคงมีมูลค่ามากกว่าอาหารที่ทาสดาบคนหนึ่งได้รับตลอดทั้งปีเสียด้วยซ้ำ ในวัยเยาว์ เขาไม่มีโอกาสได้เห็นผลไม้สีสันสดใสที่ห้อยระย้าอยู่ใต้ชายคา หรือได้กลิ่นหอมกรุ่นของเนื้อย่างที่คอยกระตุ้นความอยากอาหารเช่นนี้เลย เว้นเสียแต่ว่าพวกเขาจะทำงานใหญ่โตสำเร็จลงได้ ทว่าต่อให้เป็นอาหารเพียงน้อยนิดนั้น มันก็เทียบไม่ได้เลยแม้แต่น้อยกับภูเขาอาหารราคาแพงลิบลิ่วที่กองสุมอยู่ตรงหน้าเขาเวลานี้\n\n*พวกคนที่กินอาหารหรูหราพวกนี้อยู่ทุกเมื่อเชื่อวัน คือพวกเดียวกับที่เผาทำลายหมู่บ้านของข้าจนวอดวายใช่หรือไม่?*\n\nแม้จะคิดถึงเรื่องนี้ในเวลานี้ เขาก็อดไม่ได้ที่จะหวนรำลึกถึง เพราะตระกูลขุนนางแห่งเมฟิอุสได้ถูกสลักลึกไว้ในหัวใจของเขาในฐานะเป้าหมายแห่งความเคียดแค้นชิงชังมาเนิ่นนานแล้ว\n\n*ผู้คนของพวกเราอุตส่าห์ประคับประคองเก็บเกี่ยวผลผลิตประจำปีมาได้ ทว่าพวกมันกลับแย่งชิงเสบียงเพียงหยิบมือที่พวกเราเหลือเก็บไว้ไปจนหมดสิ้น เผาทำลายทุกสิ่งทิ้ง และยังลงมือเข่นฆ่าผู้คนไปมากมาย...*\n\nออร์บากำหมัดแน่นอยู่ใต้แขนเสื้อยาวของชุดประกอบพิธีการอันหรูหรา\n\n*พวกมันกลับชูคออวดโอ้ว่าการกินทิ้งกินขว้าง การดื่มสุรา การเต้นรำ และการหัวเราะเยาะอย่างฟุ่มเฟือยเช่นนี้คืออารยธรรมและวิถีชีวิตอันสูงส่งของชนชั้นสูง พวกมันกำลังเหยียดหยามพวกพ้องของข้า กำลังหัวเราะเยาะพวกเรา*\n\n*ไปตายให้หมดซะเถอะ ไอ้พวกสารเลว!*\n\n*พวกแกมันก็แค่พวกคนเถื่อนกินคน ข้าจะจุดไฟเผาสถานที่แห่งนี้ให้วอดวาย พวกแกจะถูกย่างสดในกองเพลิงข้าก็ไม่สนหรอก! ข้าจะยอมสรรเสริญความภาคภูมิใจอันสูงส่งของพวกแกให้ หากพวกแกยังสามารถหัวเราะร่าได้ในขณะที่แขนขาของพวกแกกำลังถูกไฟแผดเผากลืนกิน!*\n\nคลื่นโทสะอันรุนแรงถาโถมซัดสาดอยู่ชั่วครู่ ทว่าทันทีหลังจากที่เปลวเพลิงแห่งความเดือดดาลพุ่งขึ้นสู่จุดสูงสุด มีเพียงความเยือกเย็นอันเหน็บหนาวเท่านั้นที่ยังคงหลงเหลืออยู่\n\n*ยังก่อน...*\n\nออร์บาพยายามเค้นรอยยิ้มขึ้นมาประดับบนใบหน้า ขณะที่ขบฟันกรามแน่นด้วยความยากลำบาก ในท้ายที่สุดแล้วเขาจะต้องเผาผลาญและสังหารพวกมันให้หมดสิ้น ทว่า ณ ที่แห่งนี้ ในเวลานี้ ย่อมไม่ใช่เวลาหรือสถานที่ที่จะลงมือเคลื่อนไหว\n\nในตอนนี้ ออร์บายังไม่อาจทำสิ่งใดได้ สถานการณ์ที่เฟดอมนำตัวเขามาใช้เป็นตัวตายตัวแทนขององค์ชายเกิดขึ้นอย่างรวดเร็วเกินไป ทว่าสักวันหนึ่ง เขาจะต้องหาโอกาสลงมือได้อย่างแน่นอน จนกว่าจะถึงเวลานั้น เพื่อเป็นการสะสมกำลังและเป็นหนทางในการเสาะหาข้อมูลข่าวสาร เขาจำต้องทำตามสิ่งที่เฟดอมสั่งการไปก่อน...\n\nในเวลานั้นเอง บรรยากาศรอบข้างก็เริ่มส่งเสียงอื้ออึงขึ้นมา และออร์บาผู้รับรู้ได้จากประสบการณ์ว่าบรรยากาศภายในห้องโถงได้เปลี่ยนไปแล้ว ก็เงยหน้าขึ้นมองเช่นกัน จนถึงเมื่อครู่นี้ สายลมแห่งสายตาทุกคู่พัดกระหน่ำเข้าหาเพียงแค่ออร์บาเท่านั้น ทว่าในบัดนี้ ดูเหมือนจะมีรอยปริแยกเปิดออกเสียแล้ว\n\nเด็กสาวคนหนึ่งปรากฏกายขึ้นที่ปลายอีกด้านหนึ่งของห้องโถง และแน่นอนว่านางได้ดึงดูดสายตาของออร์บาให้จับจ้องไปด้วยเช่นกัน นางเดินเยื้องย่างเข้ามาอย่างสง่างามโดยมีสตรีสูงวัยเดินเคียงข้าง ใบหน้าอันขาวผ่องของนางก้มต่ำลงเล็กน้อย\n\n\"พระธิดาองค์ที่สามแห่งการ์เบรา\" เฟดอมกระซิบแผ่วเบา\n\nแม้ว่าออร์บาจะคาดเดาไว้ล่วงหน้าแล้ว ทว่าเขาก็ยังไม่อาจซ่อนความประหลาดใจไว้ได้อยู่ดี\n\n*นางยังเป็นแค่เด็กคนหนึ่งไม่ใช่หรอกเรอะ?*\n\nนั่นคือความคิดอันซื่อตรงที่ผุดขึ้นมาในใจของออร์บา แม้แต่ท่อนแขนที่โผล่พ้นแขนเสื้อออกมาก็ยังดูบอบบางเหลือเกิน ราวกับว่าหากเขาออกแรงบีบเพียงนิดเดียวก็คงจะหักสะบั้นลงได้ ทว่าด้วยเหตุผลกลใดไม่ทราบ นางกลับไม่ได้ให้ความรู้สึกอ่อนแอเปราะบางเลยแม้แต่น้อย เขากลับสัมผัสได้ถึงความสง่างามอันน่าทึ่ง แผ่นหลังที่เหยียดตรงอย่างสง่าผ่าเผย และเส้นผมยาวสลวยที่ไหวระริกแผ่วเบาไปตามท่วงท่าการก้าวเดินของนาง\n\nชุดกระโปรงที่นางยกชายขึ้นเล็กน้อยแทบจะไม่มีงานปักอันประณีตหรือเครื่องประดับตกแต่งวิจิตรบรรจงเลย ทว่าการไร้ซึ่งเครื่องประดับเหล่านั้นหาได้บดบังหรือทำให้นางดูจืดชืดลงเลยแม้แต่น้อย ผ้าไหมสีขาวบริสุทธิ์กลับยิ่งขับเน้นความบริสุทธิ์ผุดผ่องแห่งความงามอันไร้เดียงสาในวัยเยาว์ ตลอดจนเสน่ห์อันเย้ายวนแห่งอิสตรีของนางให้เจิดจรัสยิ่งขึ้น\n\n\"เจ้าหญิงวิลีนา โอเวลล์ ใช่แล้ว ในเวลานี้นางคือว่าที่คู่หมั้นของเจ้า รีบเข้าไปทักทายนางเสียสิ อย่าทำตัวหยาบคาย แต่ก็อย่าได้ถ่อมตัวจนเกินงามล่ะ อย่างไรเสียเจ้าก็คือองค์ชายแห่งเมฟิอุส\""
    },
